topic: "Microservices, Spring Cloud & Resilience"
domain: spring-boot
topic_slug: microservices-spring-cloud-resilience
version: 1
questions:
  - id: microservices-spring-cloud-resilience-001
    difficulty: beginner
    tags: [monolith, microservices, trade-offs]
    question: |
      Which statement best captures the core trade-off between a monolithic and a
      microservices architecture?
    options:
      - "Microservices trade development-time simplicity for higher run-time/operational complexity while gaining independent deployability"
      - "Microservices reduce run-time and operational complexity in exchange for noticeably slower feature development"
      - "Monoliths cannot use a relational database whereas microservices always can"
      - "Microservices always perform faster because calls are made over HTTP"
    answer: 0
    explanation: |
      Microservices give you independent deployability and fault isolation but introduce
      network calls, eventual consistency, and heavy observability/CI-CD needs. Monoliths are
      simpler at run time but couple deployment and scaling. In-process monolith calls are
      generally faster than network hops, so the "always faster" claim is wrong.
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-002
    difficulty: intermediate
    tags: [distributed-monolith, anti-pattern]
    question: |
      A team has split their system into 8 services, but every feature change requires
      coordinated releases of several services, and all services read/write the same shared
      database. What anti-pattern is this?
    options:
      - "Bounded context"
      - "Backend-for-Frontend"
      - "Distributed monolith"
      - "Strangler fig"
    answer: 2
    explanation: |
      Services that must be deployed together and share a database form a distributed monolith
      — the operational cost of microservices with none of the independent-deployability
      benefits. Database-per-service and independent release cadence are the defining traits of
      real microservices.
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-003
    difficulty: intermediate
    tags: [ddd, bounded-context, sizing]
    question: |
      What is the recommended unit of decomposition when deciding service boundaries?
    options:
      - "One service per database table in the persistence schema"
      - "One service per class in the domain model, one per type"
      - "One service per developer currently assigned to the team"
      - "One service per bounded context (business capability)"
    answer: 3
    explanation: |
      A service should map to a Domain-Driven Design bounded context / business capability, not
      to a single table or class. Over-decomposition creates chatty, tightly-coupled services
      (a distributed monolith).
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-004
    difficulty: beginner
    tags: [api-gateway, spring-cloud-gateway]
    question: |
      What is the primary role of an API Gateway such as Spring Cloud Gateway?
    options:
      - "It stores the primary copy of each service's database and brokers all writes on their behalf"
      - "It is a single entry point that routes requests and handles cross-cutting concerns like auth, rate limiting and TLS termination"
      - "It replaces the need for service discovery entirely by hard-coding every backend host:port at build time"
      - "It runs the business logic that used to live in each microservice, centralizing all domain rules at the edge"
    answer: 1
    explanation: |
      A gateway is the edge single-entry-point: routing plus cross-cutting concerns (auth,
      rate limiting, CORS, TLS termination, transformation). It should not hold business logic
      or become a shared bottleneck, and it complements (not replaces) discovery.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-005
    difficulty: intermediate
    tags: [spring-cloud-gateway, reactive, netty]
    question: |
      Classic Spring Cloud Gateway is built on which stack, and what is the key implication?
    options:
      - "Spring WebFlux/Project Reactor/Netty (non-blocking) — blocking code in a custom filter can stall the event loop"
      - "Servlet/Tomcat (blocking) — you may freely call JDBC and blocking REST inside every filter"
      - "Spring Batch (chunk-oriented) — it buffers requests and processes them in scheduled chunks"
      - "Plain servlets with one dedicated thread per request, so any blocking call inside a filter is fine"
    answer: 0
    explanation: |
      Classic SCG is reactive (WebFlux/Reactor/Netty). Blocking calls (JDBC, blocking REST)
      inside filters stall the small event-loop thread pool. Note: newer Spring Cloud Gateway
      Server WebMVC offers a servlet-based alternative, but the classic gateway is reactive.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-006
    difficulty: intermediate
    tags: [spring-cloud-gateway, route, predicate, filter]
    question: |
      In Spring Cloud Gateway, a Route is composed of which three elements?
    options:
      - "Controller, Service, Repository"
      - "Producer, Consumer, and Topic"
      - "Predicate(s), Filter(s), and a destination URI"
      - "Command, Query, and Event"
    answer: 2
    explanation: |
      A Route = Predicates (match the request) + Filters (modify request/response, pre/post) +
      URI (destination, which can be lb://service-id for discovery-backed load balancing).
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-007
    difficulty: advanced
    tags: [spring-cloud-gateway, rate-limiter, key-resolver]
    question: |
      You configure the `RequestRateLimiter` filter in Spring Cloud Gateway but requests are
      never limited. What is the most likely required piece you are missing?
    options:
      - "A @Transactional annotation on the route definition so limits commit atomically"
      - "An @EnableRateLimiter annotation on the main application class to activate the filter"
      - "A second gateway instance behind the load balancer to share and enforce the limit"
      - "A KeyResolver bean (and Redis) to derive the bucket key per user/IP/API-key"
    answer: 3
    explanation: |
      SCG's RequestRateLimiter uses a Redis token-bucket and needs a KeyResolver bean to know
      what to key the bucket on (user, IP, API key). Without a KeyResolver (and Redis) the
      limiter effectively does nothing / denies all depending on config.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-008
    difficulty: intermediate
    tags: [bff, gateway]
    question: |
      How does a Backend-for-Frontend (BFF) differ from a generic API Gateway?
    options:
      - "A BFF is a database proxy that owns persistence; a gateway is a message broker for events"
      - "A BFF is a gateway tailored to one client type (e.g. mobile vs web), often aggregating downstream calls for that client"
      - "A BFF must always be written in JavaScript on Node, whereas a gateway must be written in Java"
      - "There is no meaningful difference; the two terms are fully interchangeable in every context"
    answer: 1
    explanation: |
      A BFF is specialized per client experience (web, mobile), often composing/aggregating
      several downstream responses for that specific UI. A generic gateway is client-agnostic.
      You can run multiple BFFs behind one edge.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-009
    difficulty: beginner
    tags: [eureka, service-discovery]
    question: |
      What problem does service discovery (e.g. Netflix Eureka) primarily solve?
    options:
      - "Letting a service locate healthy instances of another service by logical name instead of hard-coded host:port"
      - "Encrypting data at rest in each service's database and rotating the keys on every deploy"
      - "Compiling all the microservices into a single fat deployable jar to simplify releases"
      - "Automatically generating and running unit tests for each REST endpoint at startup"
    answer: 0
    explanation: |
      In dynamic environments instances have ephemeral addresses. Discovery lets callers find
      instances by logical service name; Eureka is a registry where clients register and fetch
      the instance list.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-010
    difficulty: intermediate
    tags: [eureka, heartbeat, eviction]
    question: |
      By default, how does a Eureka server detect that an instance is gone?
    options:
      - "It actively pings each registered instance's TCP port once every second and evicts on the first miss"
      - "It queries a dedicated health table in the instance's own database on a fixed polling schedule"
      - "Instances send heartbeats (default ~30s); if renewals are missed past the lease (default ~90s) the instance is evicted"
      - "The load balancer notifies the Eureka server synchronously on every single failed downstream request"
    answer: 2
    explanation: |
      Eureka is heartbeat-driven: clients renew leases roughly every 30s; the server evicts
      instances whose lease expires (~90s default). This makes registration eventually
      consistent — new instances take tens of seconds to become discoverable.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-011
    difficulty: advanced
    tags: [eureka, self-preservation, cap]
    question: |
      Eureka's "self-preservation mode" does what, and what CAP trade-off does it reflect?
    options:
      - "It deletes all registry entries at once to force every instance into a clean re-registration — a strict CP choice"
      - "It encrypts the entire registry at rest and in transit — a security concern that has nothing to do with CAP"
      - "It shards the registry across peer nodes with quorum writes to guarantee strong consistency (a CP choice)"
      - "When too many heartbeats are lost at once, it STOPS evicting instances (assuming a network partition), favoring availability (AP) even if entries are stale"
    answer: 3
    explanation: |
      Self-preservation assumes a mass heartbeat loss is a network partition rather than every
      instance dying, so it keeps serving the (possibly stale) registry rather than evicting
      healthy instances. That is a deliberate availability-over-consistency (AP) choice.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-012
    difficulty: intermediate
    tags: [discovery, kubernetes]
    question: |
      Why do teams often skip Eureka when running on Kubernetes?
    options:
      - "Kubernetes forbids the use of Java-based workloads inside its pods by default policy"
      - "Kubernetes provides DNS-based Service discovery and load balancing, so running Eureka duplicates the platform's job"
      - "Eureka cannot run inside containers because it requires direct access to the host network stack"
      - "Kubernetes requires every service in a namespace to share a single JVM process and heap"
    answer: 1
    explanation: |
      Kubernetes Services provide built-in DNS-based discovery and load balancing. Running
      Eureka inside k8s duplicates functionality the platform already gives you.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-013
    difficulty: beginner
    tags: [config-server, centralized-config]
    question: |
      What does Spring Cloud Config Server provide?
    options:
      - "A centralized, externalized configuration store (typically backed by Git) served to client services over HTTP"
      - "A distributed in-memory cache for HTTP session data shared across all service instances"
      - "A drop-in replacement for a service registry that also handles instance heartbeats"
      - "A container orchestration platform that schedules and scales service pods across nodes"
    answer: 0
    explanation: |
      Config Server externalizes configuration (commonly in a Git repo) and serves it by
      {application}/{profile}/{label}, so services don't bake config into their jars.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-014
    difficulty: intermediate
    tags: [config, refresh-scope]
    question: |
      Which mechanism lets a single Spring Boot instance pick up changed config values without
      a full restart?
    options:
      - "Marking the affected beans @Lazy so they re-read properties on first access after a change"
      - "Setting spring.main.lazy-initialization=true so the whole context rebinds config on demand"
      - "Beans annotated @RefreshScope re-created on POST /actuator/refresh"
      - "Adding @Transactional to the config beans so property writes are committed and reloaded"
    answer: 2
    explanation: |
      @RefreshScope beans are destroyed and re-created (with fresh config) when you hit
      /actuator/refresh. Non-refresh-scoped singletons bound once at startup generally do not
      change live.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-015
    difficulty: intermediate
    tags: [spring-cloud-bus, broadcast-refresh]
    question: |
      What does Spring Cloud Bus add on top of the plain /actuator/refresh endpoint?
    options:
      - "It compiles the resolved config into native code and bakes it into the client image at build time"
      - "It encrypts all config properties automatically using a per-instance key managed by the broker"
      - "It replaces Git as the config backend, storing properties directly inside the message broker"
      - "It links instances over a message broker (RabbitMQ/Kafka) so a single /actuator/busrefresh broadcasts a refresh to ALL instances"
    answer: 3
    explanation: |
      Spring Cloud Bus connects instances via a broker so one busrefresh broadcasts a
      RefreshRemoteApplicationEvent to every instance — the push-to-all pattern, often fired by
      a Git webhook.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-016
    difficulty: advanced
    tags: [config, bootstrap, spring-config-import]
    question: |
      In Spring Boot 2.4+, what is the modern way for a client to point at the Config Server,
      replacing the legacy bootstrap.yml approach?
    options:
      - "Add @EnableConfigServer to the client's main class to auto-discover the remote server"
      - "Set spring.config.import=configserver: in application.yml"
      - "Register the remote config location in META-INF/spring.factories on the client classpath"
      - "Use the @ConfigurationSource annotation pointing at the Config Server's HTTP endpoint"
    answer: 1
    explanation: |
      Boot 2.4 introduced spring.config.import (e.g. configserver:) as the standard way to load
      remote config, removing the need for the old bootstrap context (which required
      spring-cloud-starter-bootstrap).
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-017
    difficulty: advanced
    tags: [config, fail-fast, startup-dependency]
    question: |
      Why can the Config Server become a dangerous single point of failure at startup, and how
      is it mitigated?
    options:
      - "If it is down while a client restarts, the client may fail to boot; mitigate with fail-fast + retry or a local fallback config"
      - "It caches every client's secrets in plaintext on disk; mitigate by disabling property encryption entirely"
      - "It slows down JVM garbage collection on every client; mitigate by substantially increasing the heap size"
      - "It forces all connected clients to share a single request thread; mitigate by switching to virtual threads"
    answer: 0
    explanation: |
      Clients fetch config at startup, so a down Config Server can prevent them from booting.
      spring.cloud.config.fail-fast with retry, or a bundled fallback, reduces the blast radius.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-018
    difficulty: beginner
    tags: [load-balancer, spring-cloud-loadbalancer]
    question: |
      What replaced Netflix Ribbon for client-side load balancing in modern Spring Cloud?
    options:
      - "Spring Cloud Gateway"
      - "Hystrix"
      - "Spring Cloud LoadBalancer"
      - "Zuul"
    answer: 2
    explanation: |
      Netflix Ribbon is removed; Spring Cloud LoadBalancer (a reactive, Reactor-based client
      LB) is the modern replacement.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-019
    difficulty: intermediate
    tags: [load-balancer, round-robin]
    question: |
      What is the default load-balancing algorithm in Spring Cloud LoadBalancer?
    options:
      - "Least connections"
      - "Weighted response time"
      - "Consistent hashing"
      - "Round-robin"
    answer: 3
    explanation: |
      SCL defaults to RoundRobinLoadBalancer; RandomLoadBalancer is also provided, and you can
      customize the ServiceInstanceListSupplier for health checks, zone affinity, and hints.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-020
    difficulty: intermediate
    tags: [load-balancer, client-side-vs-server-side]
    question: |
      What is a key advantage of client-side load balancing over server-side load balancing?
    options:
      - "It removes the need for any service discovery because each client hard-codes every instance address at build time"
      - "It avoids an extra network hop through a dedicated load balancer and enables smart per-request policies"
      - "It centralizes all balancing logic in one shared component so individual clients need no routing code at all"
      - "It guarantees a strongly consistent, always-current view of the instance list shared across every caller"
    answer: 1
    explanation: |
      Client-side balancing picks the instance in the caller, avoiding the extra LB hop and
      enabling per-request routing decisions. The cost is that every client must embed the
      logic and stay in sync with discovery.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-021
    difficulty: advanced
    tags: [load-balancer, restemplate, annotation]
    question: |
      To make a RestTemplate resolve a logical service id like http://order-service/... and
      balance across instances, what must you do?
    options:
      - "Annotate the RestTemplate @Bean with @LoadBalanced"
      - "Annotate the RestTemplate @Bean with @Transactional"
      - "Wrap every RestTemplate call in a try/catch block"
      - "Nothing — RestTemplate resolves service ids automatically"
    answer: 0
    explanation: |
      The @LoadBalanced qualifier adds a ClientHttpRequestInterceptor that resolves the logical
      service id via the DiscoveryClient and applies the load balancer. A plain RestTemplate
      treats the host literally.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-022
    difficulty: beginner
    tags: [openfeign, declarative-client]
    question: |
      What is Spring Cloud OpenFeign?
    options:
      - "A message broker for event streaming between services over durable topics"
      - "A distributed tracing backend that collects and visualizes spans across services"
      - "A declarative REST client where you define a Java interface and Feign generates the HTTP client at runtime"
      - "A schema-based database migration and versioning tool for relational stores"
    answer: 2
    explanation: |
      OpenFeign turns an annotated Java interface into an HTTP client at runtime, removing
      boilerplate RestTemplate code and integrating with discovery + load balancing.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-023
    difficulty: advanced
    tags: [openfeign, retry, default]
    question: |
      What is OpenFeign's default retry behavior?
    options:
      - "It retries every failed call exactly 3 times with exponential backoff enabled by default"
      - "It retries only 5xx server responses indefinitely until one of them finally succeeds"
      - "It retries only HTTP methods it detects as idempotent, skipping POST and PATCH automatically"
      - "Its default Retryer is Retryer.NEVER_RETRY — no retries unless you configure one"
    answer: 3
    explanation: |
      Feign's default Retryer is NEVER_RETRY. This surprises people who assume automatic
      retries; you must wire a Retryer or Resilience4j retry, and only for idempotent calls.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-024
    difficulty: advanced
    tags: [openfeign, request-interceptor, header-propagation]
    question: |
      You notice the auth token and trace/correlation id are not reaching downstream services
      through your Feign client. What is the idiomatic fix?
    options:
      - "Feign forwards all headers automatically; the downstream service is misconfigured"
      - "Register a RequestInterceptor that adds the required headers to every Feign request"
      - "Switch from Feign to RestTemplate, which forwards headers automatically"
      - "Add @RequestHeader to the controller of the downstream service"
    answer: 1
    explanation: |
      Feign does not automatically propagate incoming request headers. A RequestInterceptor is
      the idiomatic place to attach auth tokens, correlation ids, etc. to outbound requests.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-025
    difficulty: intermediate
    tags: [openfeign, error-decoder]
    question: |
      By default, how does a Feign client react to a non-2xx HTTP response, and how do you
      customize the mapping to domain exceptions?
    options:
      - "It throws a FeignException by default; provide a custom ErrorDecoder to map status codes to domain exceptions"
      - "It returns null on any non-2xx response and this behavior cannot be customized in any way"
      - "It silently retries the failed request forever until the downstream eventually returns a 2xx"
      - "It logs the error at WARN level and returns an empty object of the declared return type"
    answer: 0
    explanation: |
      Non-2xx responses throw FeignException by default. A custom ErrorDecoder lets you map
      specific statuses (404, 409, ...) to meaningful domain exceptions.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-026
    difficulty: beginner
    tags: [resilience4j, circuit-breaker, states]
    question: |
      What are the three primary states of a Resilience4j circuit breaker?
    options:
      - "START, RUNNING, and STOPPED, mirroring a thread lifecycle"
      - "GREEN, YELLOW, and RED, mirroring a traffic-light health signal"
      - "CLOSED, OPEN, HALF_OPEN"
      - "READY, BUSY, and FAILED, mirroring a worker-pool status"
    answer: 2
    explanation: |
      The three main states are CLOSED (calls pass, failures counted), OPEN (fail fast), and
      HALF_OPEN (limited trial calls). DISABLED and FORCED_OPEN are extra manual states.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-027
    difficulty: intermediate
    tags: [resilience4j, circuit-breaker, half-open]
    question: |
      When a Resilience4j circuit breaker is OPEN, what triggers the transition to HALF_OPEN?
    options:
      - "A successful automatic health-check ping the breaker sends to the dependency every second"
      - "A manual POST to /actuator/refresh that resets the breaker and re-reads its configuration"
      - "The measured failure rate dropping back below the configured threshold on its own while OPEN"
      - "The elapse of waitDurationInOpenState, after which a limited number of trial calls are permitted"
    answer: 3
    explanation: |
      After waitDurationInOpenState elapses, the breaker moves to HALF_OPEN and permits
      permittedNumberOfCallsInHalfOpenState trial calls; success closes it, failure re-opens it.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-028
    difficulty: advanced
    tags: [resilience4j, minimum-number-of-calls, sliding-window]
    question: |
      A breaker has failure-rate-threshold=50 and sliding-window-size=10 but
      minimum-number-of-calls=5. After 2 calls, both of which fail, why does the breaker stay
      CLOSED?
    options:
      - "Because a 100% failure rate is still counted as below the configured 50% threshold"
      - "Because the failure rate is only computed once at least minimum-number-of-calls (5) have been recorded"
      - "Because the count-based sliding window fully resets its recorded outcomes on every call"
      - "Because count-based windows always ignore the first 10 calls after the breaker starts"
    answer: 1
    explanation: |
      minimumNumberOfCalls prevents the breaker from tripping on a tiny sample. With only 2
      recorded calls (< 5), the failure rate isn't evaluated, so the breaker stays closed even
      at 100% failure.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-029
    difficulty: intermediate
    tags: [resilience4j, slow-calls]
    question: |
      Besides exceptions, what else can cause a Resilience4j circuit breaker to open?
    options:
      - "A high proportion of slow calls exceeding slowCallDurationThreshold (slowCallRateThreshold)"
      - "Too many consecutive successful calls exceeding a configured success-count ceiling"
      - "The JVM garbage collector running a long stop-the-world pause during the call window"
      - "A configuration refresh event fired by POST /actuator/refresh on the instance"
    answer: 0
    explanation: |
      Resilience4j tracks slow calls too: if the rate of calls slower than
      slowCallDurationThreshold exceeds slowCallRateThreshold, the breaker opens — catching
      degraded (not just failing) dependencies.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-030
    difficulty: advanced
    tags: [resilience4j, fallback-method, signature]
    question: |
      For a method annotated `@CircuitBreaker(name="x", fallbackMethod="fb")`, what must the
      fallback method `fb` look like?
    options:
      - "It must be declared static and return void regardless of the original method's signature"
      - "It must take no parameters at all and rely on instance fields for any context it needs"
      - "It must have the same return type and the same parameters plus a trailing Throwable/exception parameter"
      - "It must be annotated @Recover and be defined in a separate class from the guarded method"
    answer: 2
    explanation: |
      The fallback must match the return type and accept the same arguments plus a trailing
      Throwable (or a more specific exception). Resilience4j matches fallbacks by signature and
      exception type.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-031
    difficulty: advanced
    tags: [resilience4j, aspect-order, retry, circuit-breaker]
    question: |
      When multiple Resilience4j annotations are combined, what is the default aspect order from
      outermost to innermost?
    options:
      - "Bulkhead -> TimeLimiter -> RateLimiter -> CircuitBreaker -> Retry"
      - "CircuitBreaker -> Retry -> Bulkhead -> RateLimiter -> TimeLimiter"
      - "They execute in a random order determined at startup"
      - "Retry -> CircuitBreaker -> RateLimiter -> TimeLimiter -> Bulkhead"
    answer: 3
    explanation: |
      Default order (outer to inner) is Retry -> CircuitBreaker -> RateLimiter -> TimeLimiter ->
      Bulkhead. So Retry wraps the CircuitBreaker: failed retries feed the breaker's failure
      count, and a retried call may see CallNotPermittedException when the breaker is open.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-032
    difficulty: intermediate
    tags: [resilience4j, hystrix, comparison]
    question: |
      How does Resilience4j's default isolation model differ from Netflix Hystrix?
    options:
      - "Resilience4j always creates a dedicated thread pool per protected command, exactly like Hystrix does"
      - "Resilience4j is lightweight and uses functional decorators with semaphore-style bulkhead by default; thread-pool isolation is a separate opt-in module"
      - "Resilience4j has no bulkhead capability at all and relies solely on the circuit breaker for isolation"
      - "Resilience4j only works with reactive code and cannot decorate plain blocking method calls"
    answer: 1
    explanation: |
      Resilience4j is built on functional decorators and uses a semaphore bulkhead by default
      (no thread pool per call), unlike Hystrix's thread-pool-per-command. A separate
      ThreadPoolBulkhead module provides thread isolation when you need it.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-033
    difficulty: beginner
    tags: [resilience4j, retry, idempotency]
    question: |
      Which operations are safe to wrap with an automatic Retry?
    options:
      - "Only idempotent operations, because a retried non-idempotent call (e.g. POST payment) can duplicate the effect"
      - "Any operation regardless of side effects, since the retry layer deduplicates repeated writes for you"
      - "Only operations that are guaranteed never to fail, so a retry is purely a formality"
      - "Only GET requests that return HTML content rather than JSON or binary payloads"
    answer: 0
    explanation: |
      Retries can duplicate side effects. Only idempotent operations are safe to auto-retry; a
      retried non-idempotent POST could double-charge. Pair retries with idempotency keys where
      possible.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-034
    difficulty: intermediate
    tags: [resilience4j, retry, backoff, thundering-herd]
    question: |
      Why add exponential backoff with jitter (randomized wait) to a retry policy?
    options:
      - "To make retry logs easier to read by spacing their timestamps apart evenly"
      - "Because the Resilience4j Retry module throws an exception at startup if no jitter is set"
      - "To avoid a synchronized retry storm / thundering herd where many clients retry in lockstep and re-overwhelm a recovering service"
      - "To guarantee exactly-once delivery of each request even when the network duplicates it"
    answer: 2
    explanation: |
      Fixed-interval retries from many clients synchronize and hammer a recovering dependency.
      Exponential backoff spreads attempts out; jitter de-synchronizes them, preventing a
      thundering herd.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-035
    difficulty: advanced
    tags: [resilience4j, bulkhead, rate-limiter, distinction]
    question: |
      What is the fundamental difference between a Resilience4j RateLimiter and a Bulkhead?
    options:
      - "They are functionally identical; RateLimiter is simply the newer name for the Bulkhead component"
      - "RateLimiter bounds the number of simultaneous in-flight calls, while Bulkhead bounds calls per unit of time"
      - "RateLimiter can only be applied to GET requests, while Bulkhead can only be applied to POST requests"
      - "RateLimiter bounds calls per unit of time (throughput); Bulkhead bounds simultaneous in-flight calls (concurrency)"
    answer: 3
    explanation: |
      RateLimiter throttles throughput (permits per refresh period). Bulkhead caps concurrency
      (simultaneous calls). A slow dependency can saturate a bulkhead even at a low request
      rate — different levers.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-036
    difficulty: advanced
    tags: [resilience4j, time-limiter, async]
    question: |
      Why does merely annotating a plain blocking method with `@TimeLimiter` fail to interrupt
      a hung call?
    options:
      - "TimeLimiter is deprecated and has been replaced by the Bulkhead module in recent releases"
      - "TimeLimiter operates on async types (CompletableFuture/reactive); a blocking call must run on another thread (e.g. via ThreadPoolBulkhead) to be interruptible"
      - "TimeLimiter only works with GET requests and silently ignores methods invoked by other verbs"
      - "You must also add @Transactional so the timeout can roll back the in-flight call cleanly"
    answer: 1
    explanation: |
      TimeLimiter cancels a Future/reactive publisher. A synchronous blocking method on the
      calling thread can't be interrupted by it — you need async execution (CompletableFuture,
      commonly with ThreadPoolBulkhead) for the timeout to take effect.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-037
    difficulty: intermediate
    tags: [resilience4j, thread-pool-bulkhead, semaphore-bulkhead]
    question: |
      What distinguishes a ThreadPoolBulkhead from the default SemaphoreBulkhead in
      Resilience4j?
    options:
      - "ThreadPoolBulkhead isolates calls in a bounded thread pool + queue (enabling true timeouts and returning a CompletableFuture); SemaphoreBulkhead just counts permits on the caller thread"
      - "SemaphoreBulkhead consumes far more memory because it allocates a dedicated queue and a full thread stack per permit it hands out"
      - "ThreadPoolBulkhead does not cap concurrency at all; it merely tags calls for metrics while letting unbounded work run at once"
      - "There is no functional difference; both simply delegate to the shared ForkJoinPool.commonPool() and differ only in log category"
    answer: 0
    explanation: |
      SemaphoreBulkhead counts concurrent permits without extra threads. ThreadPoolBulkhead
      runs calls in a separate bounded pool with a queue (like Hystrix thread isolation),
      enabling real timeouts on blocking calls and returning CompletableFuture.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-038
    difficulty: beginner
    tags: [tracing, trace-span]
    question: |
      In distributed tracing, what is the relationship between a trace and a span?
    options:
      - "A span is the outermost container that holds many independent traces, one for each downstream service the request touches"
      - "They are exact synonyms; both terms simply denote a single line written to the application log during one request"
      - "A trace is the end-to-end request; it is composed of spans, each representing one unit of work, forming a parent/child tree"
      - "A trace is just a single log line, whereas a span is a numeric latency metric exported to the monitoring backend"
    answer: 2
    explanation: |
      A trace has one trace id for the whole request; spans are individual operations within it
      that form a parent/child tree. Context (trace/span ids) propagates across services.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-039
    difficulty: intermediate
    tags: [tracing, sleuth, micrometer, spring-boot-3]
    question: |
      What is the correct statement about distributed tracing in Spring Boot 3?
    options:
      - "Spring Cloud Sleuth remains the officially recommended tracing library and was carried forward unchanged into the Boot 3 baseline"
      - "Spring Boot 3 dropped built-in tracing entirely, so teams must hand-roll trace-id propagation using a servlet filter of their own"
      - "You must switch to Hystrix dashboards, which Boot 3 repurposed as the mandated backend for collecting and viewing trace spans"
      - "Sleuth was removed; tracing moved to Micrometer Tracing (a facade over Brave/OpenTelemetry) driven by the Micrometer Observation API"
    answer: 3
    explanation: |
      Spring Boot 3 removed Sleuth. Tracing is now Micrometer Tracing (bridging Brave or
      OpenTelemetry) with the Observation API auto-instrumenting web/WebClient/scheduled work.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-040
    difficulty: intermediate
    tags: [tracing, sampling]
    question: |
      What does `management.tracing.sampling.probability=0.1` accomplish?
    options:
      - "It rejects and drops 10% of incoming HTTP requests outright to shed load once tracing is enabled"
      - "It samples ~10% of traces to limit overhead, and the decision propagates so a trace is sampled consistently end-to-end"
      - "It automatically retries any traced request up to 10 times before recording the span as failed"
      - "It fixes the generated trace id to a length of exactly 10 bytes to save space in the exporter"
    answer: 1
    explanation: |
      Sampling controls tracing overhead. A probability of 0.1 records ~10% of traces; the
      sampling decision is made once and propagated so all services in a trace agree.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-041
    difficulty: advanced
    tags: [tracing, context-propagation, headers]
    question: |
      Which headers are commonly used to propagate trace context between services?
    options:
      - "W3C traceparent (or legacy B3 headers)"
      - "The standard Content-Type and Accept negotiation headers, which carry the trace id inside their media-type parameters"
      - "Only the Authorization and Cookie headers, since trace context must travel inside the authenticated session envelope"
      - "Only the X-Forwarded-For header, which the proxy repurposes to append each hop's span id in order"
    answer: 0
    explanation: |
      Trace context travels via the W3C traceparent header (modern default) or legacy B3
      headers (Zipkin/Brave). Async boundaries need explicit context propagation to keep the
      same trace.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-042
    difficulty: beginner
    tags: [saga, distributed-transactions]
    question: |
      Why can't you use a single ACID transaction across microservices, and what pattern
      addresses this?
    options:
      - "You actually can; simply annotate the entry method @Transactional and Spring propagates one JDBC transaction across every remote service call"
      - "Because microservices are stateless by definition and never talk to a persistent database, so there is no transaction to coordinate"
      - "Because each service owns its own database; the Saga pattern coordinates a sequence of local transactions with compensating actions on failure"
      - "Because the HTTP protocol has no transaction semantics, so you must move the calls onto FTP, which does support distributed commit"
    answer: 2
    explanation: |
      Database-per-service rules out a distributed ACID transaction across services. A saga is
      a sequence of local transactions; if a step fails, compensating transactions semantically
      undo the prior steps.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-043
    difficulty: intermediate
    tags: [saga, choreography, orchestration]
    question: |
      Which statement correctly contrasts saga choreography vs orchestration?
    options:
      - "Choreography relies on a central coordinator issuing commands, while orchestration is the fully event-driven style with no coordinator at all"
      - "They are two names for the identical mechanism and differ only in which vendor's documentation you happen to be reading"
      - "Orchestration is structurally incapable of running compensating transactions, so only choreography can roll a failed saga back"
      - "Choreography is event-driven with no central coordinator (loose coupling, harder to trace); orchestration uses a central coordinator that commands each step (explicit, easier to reason about)"
    answer: 3
    explanation: |
      Choreography: services react to and emit events, no coordinator — loosely coupled but
      harder to follow. Orchestration: a central orchestrator directs each step and drives
      compensations — explicit and testable but centralizes flow logic.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-044
    difficulty: advanced
    tags: [saga, isolation, acd]
    question: |
      What consistency guarantee do sagas lack that classic ACID transactions provide, and what
      is a mitigation?
    options:
      - "They lack Durability, so committed saga steps can silently vanish; mitigate by running more database replicas behind the coordinator"
      - "They lack Isolation (giving ACD without I), so anomalies like dirty reads can occur; mitigate with semantic locks (e.g. a PENDING status), commutative updates, or versioning"
      - "They lack Atomicity, so partial saga completion is impossible to undo; mitigate by wrapping every step in a two-phase commit across services"
      - "They lack Consistency entirely, leaving data permanently corrupted; mitigate by disabling the compensating transactions so nothing is rolled back"
    answer: 1
    explanation: |
      Sagas provide ACD but not Isolation — intermediate states are visible, allowing
      anomalies. Countermeasures include semantic locks (status fields), commutative updates,
      pessimistic view ordering, and version files.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-045
    difficulty: advanced
    tags: [saga, outbox, dual-write]
    question: |
      A service must both update its database and publish an event. Writing to the DB and then
      sending to the broker separately risks one succeeding while the other fails. What pattern
      solves this?
    options:
      - "The transactional outbox pattern: write state and event to the same DB in one local transaction, then a relay/CDC (e.g. Debezium) publishes the event"
      - "Run a two-phase commit (XA) across the database and the broker for every single message so both resources prepare and commit atomically"
      - "Disable the broker entirely and have every consumer poll the producer's database directly on a fixed schedule to pick up changes"
      - "Wrap the JDBC write and the Kafka send in one @Transactional method so Spring rolls the published event back if the DB write fails"
    answer: 0
    explanation: |
      The dual-write problem is solved by the transactional outbox: persist the event in the
      same local transaction as the state change, then a relay or CDC tool reliably publishes
      it. This avoids inconsistent DB-vs-broker outcomes.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-046
    difficulty: intermediate
    tags: [cqrs, read-model, write-model]
    question: |
      What does CQRS separate, and what is a common consequence?
    options:
      - "It separates the network transport layer from the storage layer, purely an infrastructure split that has no effect on data consistency"
      - "It separates automated test code from production code so the two can be deployed and scaled on independent release cadences"
      - "It separates the write model (commands) from the read model (queries), often making the read side eventually consistent with the write side"
      - "It separates the authentication concern from the authorization concern so credentials and permissions live in different services"
    answer: 2
    explanation: |
      CQRS splits commands (writes) from queries (reads), letting each be optimized/scaled
      independently. The read model is frequently updated asynchronously, so it is eventually
      consistent with the write model.
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-047
    difficulty: advanced
    tags: [event-sourcing, snapshots, versioning]
    question: |
      Which statement about Event Sourcing is correct?
    options:
      - "It stores only the latest current state of each entity and permanently discards the history of changes that produced it"
      - "It strictly forbids pairing with CQRS, so the read and write models must always share one single unified schema"
      - "It makes GDPR erasure trivial because you can simply UPDATE or overwrite any stored event in place whenever a subject requests deletion"
      - "It stores the full sequence of events as the source of truth; current state is derived by replaying them, requiring event versioning/upcasting and snapshots to bound replay cost"
    answer: 3
    explanation: |
      Event sourcing persists events (not current state); state is rebuilt by replay. This
      demands schema versioning/upcasting and snapshots for performance, and complicates
      deletion (append-only, so GDPR often needs crypto-shredding).
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-048
    difficulty: intermediate
    tags: [cqrs, event-sourcing, relationship]
    question: |
      Which statement about the relationship between CQRS and Event Sourcing is accurate?
    options:
      - "CQRS strictly requires Event Sourcing as its storage layer and cannot be implemented over plain relational read and write models"
      - "CQRS does not require Event Sourcing (you can CQRS two relational models), though Event Sourcing is almost always paired with CQRS"
      - "Event Sourcing explicitly forbids CQRS, so the two patterns can never appear together in the same system"
      - "They are simply two different names for one identical pattern and are fully interchangeable in every design discussion"
    answer: 1
    explanation: |
      CQRS is independent of event sourcing — you can split read/write models over plain
      relational stores. Event sourcing, however, is nearly always combined with CQRS (events
      feed read projections).
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-049
    difficulty: beginner
    tags: [idempotency, definition]
    question: |
      What does it mean for an operation to be idempotent?
    options:
      - "Performing it multiple times has the same effect as performing it once"
      - "It always returns one identical hard-coded value no matter what arguments or input the caller passes in"
      - "It is physically permitted to execute only a single time ever, and the runtime blocks any subsequent invocation"
      - "It executes measurably faster on the second and later calls because its result is transparently cached by the framework"
    answer: 0
    explanation: |
      Idempotency means repeated executions produce the same result/state as a single
      execution — essential when networks cause retries and duplicate deliveries.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-050
    difficulty: intermediate
    tags: [idempotency, http-methods, put-patch-post]
    question: |
      Per HTTP semantics, which set of methods is defined as idempotent?
    options:
      - "POST and PATCH, since both simply overwrite the target resource with the supplied body"
      - "POST, PUT, and PATCH together, on the grounds that all three carry a request body"
      - "GET, PUT, DELETE, HEAD"
      - "Only GET, because every method that changes server state is inherently non-idempotent"
    answer: 2
    explanation: |
      GET, PUT, DELETE, and HEAD are defined as idempotent. POST and PATCH are not, which is why
      a retried POST can create duplicate resources — a common source of double-processing bugs.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-051
    difficulty: advanced
    tags: [idempotency, idempotency-key, at-least-once]
    question: |
      A payment API must tolerate client retries without double-charging. Which approach best
      achieves this?
    options:
      - "Redefine the charge endpoint as an HTTP GET so it inherits idempotent semantics and can safely be repeated by clients"
      - "Rely on the underlying TCP network stack to guarantee that a duplicate request is never actually delivered to the server"
      - "Attach a Retry-After header to every successful response so clients space out any retries and avoid overlapping charges"
      - "Require an Idempotency-Key header; store the key + result atomically and return the stored result on a repeat, so re-execution is skipped"
    answer: 3
    explanation: |
      The idempotency-key pattern (Stripe-style): the client sends a unique key, the server
      records it with the result (atomically with the business write), and a repeat returns the
      stored result. This makes retries safe under at-least-once delivery.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-052
    difficulty: advanced
    tags: [idempotency, delivery-semantics, exactly-once]
    question: |
      Why is "at-least-once delivery + idempotent consumer" the pragmatic messaging pattern?
    options:
      - "Because at-least-once delivery is inherently slower on the wire, and the added latency is itself what makes the pipeline safer"
      - "Because true end-to-end exactly-once is very hard; at-least-once can duplicate, so making consumers idempotent yields effectively-once processing"
      - "Because an idempotent consumer signals the broker to physically suppress the second copy, so a message is never delivered twice"
      - "Because at-most-once delivery never drops a message, so pairing it with idempotency is redundant but harmless"
    answer: 1
    explanation: |
      Brokers like Kafka/SQS default to at-least-once (duplicates possible). Exactly-once
      end-to-end is impractical, so idempotent consumers absorb duplicates to achieve
      effectively-once processing.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-053
    difficulty: intermediate
    tags: [rate-limiting, token-bucket, algorithms]
    question: |
      Which rate-limiting algorithm allows short bursts up to a capacity while enforcing an
      average rate, and is used by Spring Cloud Gateway's RedisRateLimiter?
    options:
      - "Token bucket"
      - "Fixed window counter"
      - "Leaky bucket"
      - "Sliding window log"
    answer: 0
    explanation: |
      Token bucket refills tokens at a fixed rate up to a max (burst capacity); each request
      consumes one. SCG's RedisRateLimiter uses replenishRate + burstCapacity — a token bucket.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: microservices-spring-cloud-resilience-054
    difficulty: advanced
    tags: [rate-limiting, distributed, redis]
    question: |
      Your service runs 5 instances, each with a Resilience4j RateLimiter of 100 req/s, but the
      downstream is still overwhelmed at ~500 req/s. Why, and what fixes it?
    options:
      - "The Resilience4j limiter is simply malfunctioning under this load; rolling-restart all five instances and the aggregate cap will re-synchronize itself"
      - "Raise each instance's local limiter from 100 up to 500 req/s so that together they converge on the intended shared downstream ceiling"
      - "Resilience4j RateLimiter is per-JVM, so 5 instances allow 5x the limit; use a shared/distributed limiter (Redis-backed SCG or Bucket4j) for a global cap"
      - "Drop the rate limiter and add a circuit breaker instead, since a breaker inherently coordinates one global request rate across every instance"
    answer: 2
    explanation: |
      A per-instance limiter multiplies by the number of instances (100 x 5 = 500). A global
      limit requires shared state — Redis-backed rate limiting (SCG or Bucket4j) enforces one
      cap across all instances.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: microservices-spring-cloud-resilience-055
    difficulty: intermediate
    tags: [rate-limiting, http-429]
    question: |
      What HTTP status and header conventionally signal that a client has been rate-limited and
      when to retry?
    options:
      - "500 Internal Server Error with a Location header"
      - "403 Forbidden with a WWW-Authenticate header"
      - "204 No Content with an ETag header"
      - "429 Too Many Requests with a Retry-After header"
    answer: 3
    explanation: |
      Rate limiting returns 429 Too Many Requests, typically with Retry-After telling the
      client when to try again — distinct from 503 (service unavailable / overload).
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: microservices-spring-cloud-resilience-056
    difficulty: beginner
    tags: [graceful-degradation, fallback]
    question: |
      What is graceful degradation in a microservices system?
    options:
      - "Shutting the entire system down and returning a maintenance page the moment any single downstream dependency reports an error"
      - "Continuing to deliver reduced-but-useful functionality (e.g. cached/default data) when a dependency is unavailable, instead of failing entirely"
      - "Automatically scaling every backing database down to zero replicas to conserve cost whenever traffic momentarily dips"
      - "Logging the full stack trace and returning an HTTP 500 for every request until an operator manually restarts the cluster"
    answer: 1
    explanation: |
      Graceful degradation keeps core functionality working with a reduced experience (stale
      cache, defaults, hidden non-critical widgets) when a dependency is down, rather than a
      total outage.
    ref: "concepts.md#graceful-degradation-and-fallbacks"

  - id: microservices-spring-cloud-resilience-057
    difficulty: intermediate
    tags: [graceful-degradation, critical-vs-noncritical]
    question: |
      A product page depends on a payment service (critical) and a recommendations service
      (non-critical). What is the best degradation strategy?
    options:
      - "Degrade the non-critical dependency (hide recommendations) while protecting the critical flow (payment) with fail-fast/queueing"
      - "Return an error page for the whole product view whenever either the payment or the recommendations service is unavailable"
      - "Retry both the payment and recommendation calls indefinitely with no timeout until each one eventually succeeds"
      - "Remove the circuit breakers from both dependencies so every call is always allowed straight through to the backend"
    answer: 0
    explanation: |
      Distinguish critical from non-critical dependencies: degrade the non-critical (render the
      page without recommendations) and protect the critical path (payment) with timeouts,
      circuit breakers, and fallbacks. Never block on a best-effort dependency.
    ref: "concepts.md#graceful-degradation-and-fallbacks"

  - id: microservices-spring-cloud-resilience-058
    difficulty: advanced
    tags: [graceful-degradation, fail-fast, cascading-failure]
    question: |
      Why is "fail fast" (via an open circuit or timeout) important for preventing cascading
      failure?
    options:
      - "Because returning an error instantly makes the user interface feel snappier even while the outage is still ongoing"
      - "Because failing fast automatically raises the configured retry count so the call eventually gets through anyway"
      - "Because a slow dependency without a breaker/timeout can exhaust the caller's threads/connections, propagating the outage upstream"
      - "Because it turns off request and error logging under heavy load, freeing up disk I/O for real traffic"
    answer: 2
    explanation: |
      A hung dependency ties up caller threads and connections; without fail-fast (open circuit
      or timeout) that exhaustion cascades upstream and takes down healthy services. Failing
      fast contains the blast radius.
    ref: "concepts.md#graceful-degradation-and-fallbacks"

  - id: microservices-spring-cloud-resilience-059
    difficulty: intermediate
    tags: [graceful-shutdown, spring-boot]
    question: |
      What does setting `server.shutdown=graceful` in Spring Boot do?
    options:
      - "It prevents the embedded web server from binding its port during application startup"
      - "It automatically restarts the whole application context whenever any unhandled error is thrown"
      - "It rolls back every open database transaction and truncates the connection pool as the app stops"
      - "It drains in-flight requests on SIGTERM, letting active requests finish before the app stops"
    answer: 3
    explanation: |
      Graceful shutdown lets in-flight requests complete (within a timeout) after a SIGTERM
      before the context closes — reducing dropped requests during rolling deploys. It is
      related to, but distinct from, runtime graceful degradation.
    ref: "concepts.md#graceful-degradation-and-fallbacks"

  - id: microservices-spring-cloud-resilience-060
    difficulty: intermediate
    tags: [netflix-oss, migration]
    question: |
      Which mapping of legacy Netflix OSS components to their modern Spring Cloud replacements
      is entirely correct?
    options:
      - "Ribbon->Resilience4j, Hystrix->Spring Cloud Gateway, Zuul->Eureka"
      - "Ribbon->Spring Cloud LoadBalancer, Hystrix->Resilience4j, Zuul 1->Spring Cloud Gateway"
      - "Ribbon->Eureka, Hystrix->Config Server, Zuul->Sleuth"
      - "Ribbon->Feign, Hystrix->LoadBalancer, Zuul->Micrometer"
    answer: 1
    explanation: |
      Ribbon (client LB) -> Spring Cloud LoadBalancer; Hystrix (circuit breaker) -> Resilience4j;
      Zuul 1 (gateway) -> Spring Cloud Gateway. These Netflix components are in maintenance/EOL.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-061
    difficulty: advanced
    tags: [microservices, availability, latency, call-chain]
    question: |
      A request fans out synchronously through a chain A -> B -> C -> D, where each service has
      99.9% availability and a p99 latency of 150ms for its own hop. Ignoring parallelism, what
      is the most accurate staff-level observation?
    options:
      - "Composite availability is roughly the product (~99.6%), and p99 latencies compound down the chain, so a deep synchronous chain multiplies both failure probability and tail latency"
      - "Overall availability actually improves to ~99.99% because spreading the work across four services lets them share the load and mask each other's failures"
      - "Availability is determined solely by the least-available service (99.9%), and end-to-end latency is simply the maximum of the four individual hop latencies"
      - "Because every hop is a plain HTTP call, availability is effectively guaranteed at 100% as long as the underlying network links between the services stay up"
    answer: 0
    explanation: |
      Serial dependencies multiply: 0.999^4 ~ 0.996, and each hop's latency adds up (tail
      latencies compound and can be worse than a simple sum due to variance). This is why deep
      synchronous chains are discouraged in favor of async/event choreography or aggregation.
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-062
    difficulty: advanced
    tags: [microservices, shared-library, coupling, distributed-monolith]
    question: |
      A platform team ships a "common-domain" JAR containing shared entity classes and business
      rules that every service depends on. Why is this a staff-level smell?
    options:
      - "Shared entity JARs are explicitly forbidden by the Java Language Specification and will fail to compile against multiple modules"
      - "It actually improves independent deployability, because every service is guaranteed to run byte-for-byte identical domain code"
      - "It creates compile-time lockstep coupling: a change to shared domain logic forces coordinated rebuilds/redeploys of all services — a distributed monolith at the build level"
      - "It only becomes a problem once the shared JAR grows larger than 10MB and starts slowing down each service's startup"
    answer: 2
    explanation: |
      Sharing domain logic couples services at build time, so they must upgrade in lockstep,
      destroying independent deployability. Shared code should be limited to stable, generic
      utilities; domain models should be owned per service (often duplicated deliberately).
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-063
    difficulty: intermediate
    tags: [strangler-fig, migration]
    question: |
      What best describes the Strangler Fig pattern for monolith-to-microservices migration?
    options:
      - "Rewrite the entire monolith from scratch in one project and cut every user over to the new services on a single big-bang release date"
      - "Duplicate the monolith into N identical running copies, one owned per team, and let each team evolve its own fork independently"
      - "Freeze the monolith's codebase permanently and forbid any further changes so it can never regress during the migration"
      - "Incrementally route specific capabilities/paths through a facade to new services while the monolith keeps serving the rest, shrinking the monolith over time"
    answer: 3
    explanation: |
      Strangler Fig extracts bounded contexts incrementally behind a facade/gateway, migrating
      traffic path-by-path so the monolith is gradually "strangled" — avoiding a risky big-bang
      rewrite.
    ref: "concepts.md#monolith-vs-microservices-trade-offs"

  - id: microservices-spring-cloud-resilience-064
    difficulty: expert
    tags: [spring-cloud-gateway, global-filter, ordering, reactive]
    question: |
      In Spring Cloud Gateway you register two GlobalFilters, F1 with getOrder()=-100 and F2
      with getOrder()=100. Each logs "PRE" before chain.filter(exchange) and "POST" in
      .then(...) after it. In what order do the four log lines appear for one request?
    options:
      - "F1 PRE, F2 PRE, F2 POST, F1 POST"
      - "F2 PRE, F1 PRE, F1 POST, F2 POST"
      - "F1 PRE, F2 PRE, F1 POST, F2 POST"
      - "F1 PRE, F1 POST, F2 PRE, F2 POST"
    answer: 0
    explanation: |
      The chain is sorted ascending by order for the PRE phase, so F1 (-100) runs before F2
      (100). The reactive chain then unwinds LIFO, so POST phases run in reverse: F2 POST before
      F1 POST. Lower order = earlier pre, later post.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-065
    difficulty: expert
    tags: [spring-cloud-gateway, response-body, backpressure, streaming]
    question: |
      A developer writes a custom post-filter that reads the entire downstream response into a
      String to redact a field, then rewrites it. Under high load with large payloads the
      gateway OOMs and back-pressure breaks. What is the correct staff-level explanation/fix?
    options:
      - "The Netty event loop is single-threaded per connection, so simply raising the worker-thread count in server config makes the OOM and back-pressure problem disappear"
      - "Spring Cloud Gateway post-filters are structurally unable to modify a response body at all, so the redaction code path never actually executed under load"
      - "The response body is a streaming Flux<DataBuffer>; fully buffering it defeats back-pressure and can exhaust heap. Use ModifyResponseBody filter with a streaming-aware transform and release DataBuffers"
      - "Rewriting a response body is only possible on the blocking servlet stack, so you must migrate the gateway off WebFlux since there is no reactive option for this"
    answer: 2
    explanation: |
      In reactive SCG the body is a stream of DataBuffers. Naively collecting it into memory
      removes back-pressure and risks OOM, plus leaks DataBuffers if not released. The
      ModifyResponseBody GatewayFilter is the supported, streaming-aware way to transform bodies.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-066
    difficulty: expert
    tags: [spring-cloud-gateway, exchange-mutation, headers]
    question: |
      A custom filter does `exchange.getRequest().mutate().header("X-Tenant", tenant).build();`
      then calls `return chain.filter(exchange);`. Downstream never sees X-Tenant. Why?
    options:
      - "Netty automatically strips any request header whose name starts with the X- prefix before forwarding it to the downstream service"
      - "Request headers in Spring Cloud Gateway are fully immutable and cannot be added, removed, or changed by a filter under any circumstances"
      - "The filter must be annotated with @Order (or implement Ordered) before any header mutation it performs will actually take effect on the request"
      - "mutate()...build() returns a NEW ServerHttpRequest; you must build a mutated exchange (exchange.mutate().request(newRequest).build()) and pass THAT down the chain"
    answer: 3
    explanation: |
      mutate() is copy-on-write and returns a new request object; the original exchange still
      carries the old request. You must wrap the new request in a mutated exchange and pass the
      mutated exchange to chain.filter, otherwise the change is discarded.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-067
    difficulty: advanced
    tags: [spring-cloud-gateway, x-forwarded-for, security]
    question: |
      Your topology is: internet -> external ALB -> Spring Cloud Gateway -> service. The service
      trusts X-Forwarded-For to identify the client IP for rate limiting. What is the risk and
      the mitigation?
    options:
      - "There is no risk, because browsers cryptographically sign the X-Forwarded-For header so any tampering by a client is automatically detected and rejected"
      - "The only real risk is that a long forwarded chain makes the header exceed size limits, so truncating X-Forwarded-For to the first entry fully resolves it"
      - "A client can spoof X-Forwarded-For; the trusted edge (ALB/gateway) must overwrite/normalize it and downstreams must trust only the value set by the last trusted proxy, not arbitrary client-supplied values"
      - "Spring Cloud Gateway disables and drops X-Forwarded-For entirely by default, so the downstream service never actually receives it and there is nothing to secure"
    answer: 2
    explanation: |
      Clients can send arbitrary X-Forwarded-For. Only the trusted edge should append/rewrite it;
      downstreams must use the value written by the last trusted hop (or ALB's own header), not
      blindly trust the whole chain, or attackers bypass IP-based rate limits.
    ref: "concepts.md#api-gateway-spring-cloud-gateway"

  - id: microservices-spring-cloud-resilience-068
    difficulty: expert
    tags: [eureka, propagation-delay, caches]
    question: |
      With all Eureka/LoadBalancer defaults, why can a freshly registered instance take up to
      ~2 minutes to receive traffic from other services?
    options:
      - "Multiple caches stack: the server response cache (~30s), the client registry-fetch interval (~30s), and the load balancer's supplier cache, plus initial registration/heartbeat delay — they sum, not overlap"
      - "Eureka deliberately holds every freshly registered instance in a 2-minute warm-up state before it ever advertises it to any calling service"
      - "The JVM's just-in-time compiler blocks the new instance from accepting inbound traffic for roughly 2 minutes while it compiles the request-handling hot paths"
      - "Eureka hard-codes a DNS record with a fixed TTL of exactly 120 seconds, so callers cannot resolve the new instance until that TTL expires"
    answer: 0
    explanation: |
      Registration is eventually consistent through several caches: the server's response cache,
      each client's periodic delta fetch, and the LB's instance-list cache. In the worst case
      these delays add up to a couple of minutes with defaults.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-069
    difficulty: expert
    tags: [eureka, deregistration-gap, graceful-shutdown]
    question: |
      During a rolling deploy, callers keep hitting instances that were just terminated,
      producing connection-refused errors for tens of seconds. What is the root cause and the
      best mitigation?
    options:
      - "Eureka is fundamentally broken for rolling deploys; the only fix is to abandon the registry and switch every caller to round-robin DNS resolution instead"
      - "The terminated instances failed to flush their pending log buffers on exit, which stalls callers; increasing the logging buffer size on each instance clears the errors"
      - "The deregistration gap: other clients keep the stale registry entry until their caches expire. Mitigate with explicit deregistration on shutdown, shorter cache/lease intervals, and load-balancer retry-on-next-instance"
      - "Self-preservation mode is switched off, which is why entries linger; turning self-preservation back on makes Eureka purge the terminated instances from every client cache instantly"
    answer: 2
    explanation: |
      When an instance dies, peers keep the cached entry until it expires and route to the dead
      host. Explicit cancel-on-shutdown, shorter intervals, and retrying the next instance close
      the gap. Self-preservation actually worsens it by suppressing eviction.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-070
    difficulty: advanced
    tags: [eureka, containers, prefer-ip-address]
    question: |
      A Dockerized service registers with Eureka but callers get "UnknownHostException" trying
      to reach it by the registered address. What is the typical fix?
    options:
      - "Run each service container in --privileged mode so it gains host-level network access and its hostname becomes resolvable to callers"
      - "Disable Eureka registration entirely and instead hard-code the Docker container name as the target host in every calling service"
      - "Increase the Eureka heartbeat/lease-renewal interval to 5 minutes so the registry has more time to resolve the container's hostname"
      - "Set eureka.instance.prefer-ip-address=true so it registers its resolvable IP instead of a non-resolvable container hostname"
    answer: 3
    explanation: |
      By default Eureka registers the hostname, which inside containers is often the container id
      and not resolvable by other hosts. prefer-ip-address=true registers the routable IP,
      avoiding the resolution failure.
    ref: "concepts.md#service-discovery-eureka"

  - id: microservices-spring-cloud-resilience-071
    difficulty: expert
    tags: [config, refresh-scope, stale-reference]
    question: |
      Bean A (a plain @Component singleton) does `this.url = props.getUrl();` in its constructor,
      where `props` is a @RefreshScope/@ConfigurationProperties bean. After a Git change and
      POST /actuator/refresh, A still uses the old URL. Why?
    options:
      - "A snapshotted the value into its own field at construction; only calls made THROUGH the refresh-scoped proxy see new values. A must read props.getUrl() at call time, not cache it"
      - "The /actuator/refresh mechanism only rebinds prototype-scoped beans, so a plain singleton like A is skipped entirely during the refresh cycle"
      - "@ConfigurationProperties beans are frozen at bind time and never pick up new values on refresh under any circumstance, so props itself still holds the old URL"
      - "The /actuator/refresh endpoint merely schedules the change; a full JVM restart is required before any updated property value actually takes effect"
    answer: 0
    explanation: |
      @RefreshScope rebinds the target bean, but a singleton that copied a value into a field at
      construction keeps the stale copy. Only invocations through the proxy pick up rebound
      values, so read the property at use time rather than snapshotting it.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-072
    difficulty: advanced
    tags: [config, refresh-scope, non-refreshable]
    question: |
      Which of the following will a POST /actuator/refresh (or busrefresh) most reliably NOT
      change on a running instance without extra work?
    options:
      - "A @Value-injected field living inside a @RefreshScope-annotated bean, re-read when the bean is re-created"
      - "A field on a @ConfigurationProperties bean, which Spring rebinds from the new property sources on refresh"
      - "A string pulled from a @RefreshScope bean that is read fresh at call time rather than cached at startup"
      - "The embedded server's HTTP port (server.port) and an already-created connection pool's size"
    answer: 3
    explanation: |
      Things bound once at startup — the server port, an existing DataSource/connection pool —
      do not change live on refresh. @RefreshScope and @ConfigurationProperties beans are
      re-bound; the server port requires a restart.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-073
    difficulty: advanced
    tags: [config, spring-config-import, precedence]
    question: |
      Using spring.config.import=configserver:, a property `feature.flag` is set to `true` in the
      Config Server, `false` in the packaged application.yml, and passed as `--feature.flag=off`
      on the command line. Which wins?
    options:
      - "The packaged application.yml (false), because a jar's bundled configuration always overrides externally imported property sources"
      - "It is undefined behavior and Spring Boot aborts startup with a BindException over the conflicting flag definitions"
      - "The Config Server (true), because remotely imported configserver properties are applied last and outrank command-line arguments"
      - "The command-line argument, because command-line args sit at the top of Spring Boot's property-source precedence, above imported remote config"
    answer: 3
    explanation: |
      Command-line args are near the top of Boot's ordered property sources, above imported
      configserver properties, which are above the packaged application.yml. So --feature.flag
      wins. Remote config overrides the packaged file but not command-line/env of higher priority.
    ref: "concepts.md#distributed-and-centralized-configuration-spring-cloud-config-and-bus"

  - id: microservices-spring-cloud-resilience-074
    difficulty: expert
    tags: [load-balancer, retry-stacking, feign, resilience4j]
    question: |
      A single logical call unexpectedly hits the backend ~27 times. The stack is: Feign client
      with a custom Retryer (3 attempts), Spring Cloud LoadBalancer retry (retry next instance,
      3 instances), and a Resilience4j @Retry (3 attempts) around the Feign call. What is the
      staff-level diagnosis?
    options:
      - "Retries multiply across independent layers: Resilience4j (3) x Feign Retryer (3) x LB next-instance (3) ~ 27 attempts. Consolidate retry to ONE layer and disable it in the others"
      - "One of the retry layers has a counter bug and is double-counting every attempt it records internally"
      - "This is expected and correct; issuing 27 attempts per logical call materially improves end-to-end reliability"
      - "Eureka is silently duplicating the request during discovery lookup and fanning it out to each registered instance"
    answer: 0
    explanation: |
      Retry logic at multiple layers composes multiplicatively (3x3x3=27). The fix is to own
      retry in exactly one layer (e.g. Resilience4j) and set the others to no-retry, otherwise a
      transient blip becomes a self-inflicted load spike.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-075
    difficulty: expert
    tags: [load-balancer, configuration-isolation, component-scan]
    question: |
      A developer defines a custom load-balancer configuration as a top-level
      @Configuration in the same package as the main application, intending it only for the
      "order-service" client via @LoadBalancerClient. What actually happens?
    options:
      - "It applies only to order-service, because @LoadBalancerClient scopes the class strictly to the named client it references"
      - "Spring aborts startup with a bean-definition error, because load-balancer configs are forbidden from being @Configuration classes"
      - "It is picked up by the main @ComponentScan and becomes the GLOBAL default LB config for ALL clients, not just order-service"
      - "It is ignored entirely, because an explicit @LoadBalancerClient reference always overrides any component-scanned configuration"
    answer: 2
    explanation: |
      A @LoadBalancerClient (or Feign) configuration class inside the main component scan is
      registered globally, becoming the default for every client. It must live outside the scan
      (or be excluded) and be referenced explicitly per client to stay isolated.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-076
    difficulty: advanced
    tags: [load-balancer, supplier-chain, caching]
    question: |
      In Spring Cloud LoadBalancer, why should CachingServiceInstanceListSupplier wrap the
      DiscoveryClientServiceInstanceListSupplier rather than the other way around?
    options:
      - "Order does not matter; the supplier decorators are commutative and produce identical instance lists either way"
      - "Because a caching supplier is structurally incapable of delegating to a discovery supplier as its underlying source"
      - "Because the discovery lookup must execute freshly on every single request or the returned instance list would be incorrect"
      - "So the cache sits in front of the (relatively expensive) discovery lookup, serving a cached instance list and only periodically refreshing from discovery — wrapping the cache by discovery would bypass caching"
    answer: 3
    explanation: |
      The supplier chain is a decorator stack; caching should decorate the discovery source so
      each request reads the cached list and the discovery lookup runs only on refresh. Inverting
      it would defeat the cache's purpose.
    ref: "concepts.md#client-side-load-balancing-spring-cloud-loadbalancer"

  - id: microservices-spring-cloud-resilience-077
    difficulty: expert
    tags: [openfeign, thread-context, request-interceptor, async]
    question: |
      A Feign RequestInterceptor copies the incoming JWT from RequestContextHolder onto outbound
      requests. It works for normal calls but the header is missing whenever the Feign call is
      made from a @Async method or a ThreadPoolBulkhead worker. Why?
    options:
      - "Feign automatically disables all registered RequestInterceptors whenever a call originates from an asynchronous execution context"
      - "Methods annotated @Async are prohibited from invoking Feign clients, so the interceptor never runs on that path at all"
      - "RequestContextHolder / trace context are stored in ThreadLocals bound to the request thread; a different worker thread has no such context unless it is explicitly propagated"
      - "The JWT happens to reach its expiry precisely when the asynchronous path executes, so the interceptor attaches an already-invalid token"
    answer: 2
    explanation: |
      Interceptors that read ThreadLocal-based context only work on the thread that holds it.
      Dispatching to another thread (async/bulkhead/reactor) loses it unless you propagate the
      context (e.g. task decorators, ContextSnapshot). This is a classic "missing header only
      under async/load" bug.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-078
    difficulty: advanced
    tags: [openfeign, fallback, fallbackfactory]
    question: |
      Why might a team prefer @FeignClient(fallbackFactory=...) over fallback=...?
    options:
      - "fallbackFactory receives the causing Throwable, so the fallback can branch on the failure type (404 vs timeout vs CallNotPermittedException) and log/handle accordingly, whereas a plain fallback hides the cause"
      - "fallbackFactory is materially faster at runtime because it lazily instantiates the degraded implementation only on the first failure"
      - "The plain fallback= attribute is incompatible with circuit breakers and silently disables breaker-driven short-circuiting on that client"
      - "fallbackFactory is the only fallback mechanism that functions when the Feign client resolves instances through service discovery"
    answer: 0
    explanation: |
      fallbackFactory<T> is given the Throwable that triggered the fallback, enabling
      cause-specific behavior and observability. A plain fallback returns a fixed degraded value
      with no visibility into why it fired.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-079
    difficulty: expert
    tags: [openfeign, connection-pool, time-wait, http-client]
    question: |
      Under sustained high throughput, a Feign client using the default configuration starts
      failing with ephemeral-port exhaustion / TIME_WAIT buildup. What is the best explanation
      and fix?
    options:
      - "Feign leaks proxy objects on every invocation; enlarge the JVM heap so the accumulated garbage no longer exhausts ephemeral ports"
      - "The Eureka service registry is the component opening the client sockets, so a rolling restart of the registry nodes clears the TIME_WAIT buildup"
      - "The default JDK HttpURLConnection client does not pool connections, so each call opens/closes a socket; switch to Apache HttpClient 5 or OkHttp (feign-hc5 / feign-okhttp) for a bounded, keep-alive connection pool"
      - "TIME_WAIT accumulation is unrelated to Feign; it stems from DNS re-resolution churn and disappears once you pin a static host entry"
    answer: 2
    explanation: |
      The default JDK client opens a fresh connection per request with no pooling, so at high
      RPS closed sockets pile up in TIME_WAIT and exhaust ephemeral ports. A pooling client
      (HttpClient 5 / OkHttp) reuses keep-alive connections and bounds the pool.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-080
    difficulty: advanced
    tags: [openfeign, config-precedence]
    question: |
      Given both `feign.client.config.default.connectTimeout=1000` and
      `feign.client.config.orderClient.connectTimeout=5000`, what connect timeout does the
      "orderClient" Feign client use, and why?
    options:
      - "1000ms, because the feign.client.config.default block always takes precedence over any per-client override"
      - "Startup fails with a conflicting-configuration error because two connectTimeout values are declared for the same property tree"
      - "3000ms, because Spring resolves the clash by averaging the default and the client-specific timeout values"
      - "5000ms, because the client-specific config (feign.client.config.<name>) overrides feign.client.config.default"
    answer: 3
    explanation: |
      Named client configuration overrides the "default" configuration. orderClient's specific
      5000ms wins over the default 1000ms. Property-based config also generally overrides
      programmatic @Configuration.
    ref: "concepts.md#declarative-rest-clients-openfeign"

  - id: microservices-spring-cloud-resilience-081
    difficulty: expert
    tags: [resilience4j, circuit-breaker, self-invocation, aop]
    question: |
      In one @Service, method a() calls this.b(), and b() is annotated
      @CircuitBreaker(name="dep"). The breaker never engages for calls that arrive via a(). Why?
    options:
      - "@CircuitBreaker is AOP-proxy based; a self-invocation (this.b()) bypasses the proxy, so the aspect never wraps the call. Split into separate beans or self-inject"
      - "The breaker name \"dep\" is syntactically invalid, so Resilience4j silently skips registering the annotated method"
      - "Resilience4j circuit breakers only take effect on @RestController handler methods, never on plain @Service beans"
      - "The guarded method b() must be declared static before the @CircuitBreaker aspect will wrap and instrument it"
    answer: 0
    explanation: |
      Like @Transactional, Resilience4j annotations work through a proxy. Calling this.b()
      invokes the raw method directly, skipping the proxy and the aspect. Externalize b() to
      another bean or use self-injection so the call goes through the proxy.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-082
    difficulty: expert
    tags: [resilience4j, circuit-breaker, half-open, auto-transition]
    question: |
      A breaker is OPEN with waitDurationInOpenState=10s and
      automaticTransitionFromOpenToHalfOpenEnabled left at its default (false). No calls arrive
      for 5 minutes. What state is it in, and what triggers HALF_OPEN?
    options:
      - "It auto-transitions to HALF_OPEN once 10s elapse, because a dedicated background scheduler thread drives the change by default"
      - "It transitions straight back to CLOSED automatically after the 10s wait duration passes, resetting its failure window"
      - "It stays OPEN indefinitely; the OPEN -> HALF_OPEN transition happens lazily on the NEXT call made after the wait duration has elapsed, since no background thread drives it by default"
      - "It throws an IllegalStateException because the wait duration expired while no calls were recorded against the breaker"
    answer: 2
    explanation: |
      With automatic transition disabled (default), there is no timer; the breaker evaluates the
      elapsed wait on the next invocation and only then moves to HALF_OPEN. An idle breaker stays
      OPEN until someone calls it.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-083
    difficulty: expert
    tags: [resilience4j, sliding-window, count-vs-time]
    question: |
      Two breakers both set sliding-window-size=10. Breaker X uses COUNT_BASED, breaker Y uses
      TIME_BASED. Under a burst of 500 calls in 2 seconds, how do their failure-rate denominators
      differ?
    options:
      - "They are identical; the window-type setting is cosmetic and both denominators end up covering the same set of calls"
      - "Both evaluate their failure rate over exactly 500 calls, since the burst count overrides the configured window size"
      - "X evaluates over the last 10 seconds while Y evaluates over the last 10 calls (the count-based and time-based roles are reversed)"
      - "X evaluates over the last 10 CALLS, so its rate reflects only the 10 most recent outcomes; Y evaluates over the last 10 SECONDS, aggregating potentially hundreds of calls into per-second buckets"
    answer: 3
    explanation: |
      COUNT_BASED keeps a ring of the last N call outcomes (denominator = N calls). TIME_BASED
      keeps N one-second aggregate buckets (denominator = all calls in the last N seconds). Under
      bursts these give very different failure rates.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-084
    difficulty: advanced
    tags: [resilience4j, shared-instance, naming]
    question: |
      Two unrelated methods are both annotated @CircuitBreaker(name="shared"). A burst of
      failures in the first method causes the SECOND method's calls to fail fast with
      CallNotPermittedException even though its dependency is healthy. Why?
    options:
      - "A CircuitBreaker is a shared singleton keyed by name; both methods share ONE breaker and ONE sliding window, so failures recorded by either open the breaker for both"
      - "It is a defect in Resilience4j's registry that leaks one breaker's window into unrelated named breakers"
      - "The second method reflectively inherited the first method's @CircuitBreaker annotation at proxy-creation time"
      - "CallNotPermittedException is thrown at random intervals whenever two methods reference any breaker simultaneously"
    answer: 0
    explanation: |
      Resilience4j resolves the breaker by name from a registry — the same name means the same
      instance and shared state. Reusing a name across unrelated dependencies conflates their
      health. Use distinct names per dependency.
    ref: "concepts.md#resilience4j-circuit-breaker"

  - id: microservices-spring-cloud-resilience-085
    difficulty: expert
    tags: [resilience4j, time-limiter, interruption, thread-pool-bulkhead]
    question: |
      A blocking JDBC call is wrapped with @TimeLimiter(timeoutDuration=2s) and executed via
      @Bulkhead(type=THREADPOOL) with cancelRunningFuture=true. The timeout fires but the query
      keeps running on the worker thread for 30s. Why might cancellation fail to stop it?
    options:
      - "TimeLimiter and ThreadPoolBulkhead are mutually exclusive, so combining them silently disables the timeout enforcement entirely"
      - "The timeoutDuration must be expressed in milliseconds, so a value of 2s is parsed as 2000 units and never elapses in practice"
      - "cancelRunningFuture interrupts the worker thread, but interruption only stops work that responds to Thread.interrupt(); many JDBC drivers/socket reads ignore interruption, so the query runs to completion"
      - "The CompletableFuture backing the call was never actually created, so there is no task handle for cancellation to act upon"
    answer: 2
    explanation: |
      Cancellation sends an interrupt to the worker thread, but blocking I/O that doesn't honor
      interruption (typical JDBC/socket reads) won't abort. Real cancellation of such calls needs
      driver-level query timeouts / statement cancellation, not just thread interruption.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-086
    difficulty: expert
    tags: [resilience4j, ratelimiter, atomic, fixed-window]
    question: |
      Resilience4j's default AtomicRateLimiter grants limitForPeriod permits per
      limitRefreshPeriod cycle. Why can it exhibit fixed-window-like bursts rather than smooth
      token-bucket pacing?
    options:
      - "Because it relies on a background scheduler thread that sleeps a fixed interval between issuing each individual permit"
      - "Because it is internally a leaky bucket that queues excess requests and drains them at a constant configured rate"
      - "Because under contention it randomly discards a fraction of permits to keep the average throughput near the configured limit"
      - "Because permits are granted per discrete cycle (all limitForPeriod become available at the cycle start), so a caller can consume the full allotment at the start of a cycle and again at the next cycle boundary"
    answer: 3
    explanation: |
      AtomicRateLimiter refills the whole allotment at each cycle boundary rather than trickling
      tokens continuously, so it behaves like a fixed window and can allow back-to-back bursts
      across a boundary — not the smoothing of a leaky bucket.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-087
    difficulty: advanced
    tags: [resilience4j, semaphore-bulkhead, slow-dependency]
    question: |
      A SemaphoreBulkhead has maxConcurrentCalls=20 and maxWaitDuration=0. The downstream becomes
      very slow (each call takes 30s but does not fail). What happens to the 21st concurrent
      caller and why?
    options:
      - "It blocks and waits indefinitely until one of the 20 in-flight calls returns and releases its permit"
      - "It runs anyway on a fresh thread that the semaphore bulkhead spawns on demand once its permits are exhausted"
      - "It is rejected immediately with BulkheadFullException, because the 20 permits are held by the slow in-flight calls (which run on the caller threads and don't release until they return), and maxWaitDuration=0 means no waiting"
      - "It succeeds because a slow-but-not-failed call is not counted against the bulkhead's concurrent-permit total"
    answer: 2
    explanation: |
      A semaphore bulkhead counts in-flight permits; a slow (not failing) call still holds its
      permit until it returns. With all 20 held and zero wait, the next caller is rejected
      immediately with BulkheadFullException — showing why slow dependencies drain bulkheads.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-088
    difficulty: advanced
    tags: [resilience4j, thread-pool-bulkhead, rejection]
    question: |
      When a Resilience4j ThreadPoolBulkhead has all threads busy AND its queue is full, what
      happens to a new submission by default?
    options:
      - "It is rejected with BulkheadFullException — the task does NOT run on the caller thread, preserving isolation"
      - "It runs on the caller's own thread under a CallerRunsPolicy-style fallback, absorbing the overflow inline"
      - "It is silently discarded and the invocation returns a null CompletableFuture without any error"
      - "It blocks the calling thread indefinitely until a worker thread or a queue slot eventually frees up"
    answer: 0
    explanation: |
      Unlike a raw ThreadPoolExecutor with CallerRunsPolicy, the ThreadPoolBulkhead rejects with
      BulkheadFullException when threads and queue are saturated. Running on the caller thread
      would break the isolation guarantee the bulkhead exists to provide.
    ref: "concepts.md#resilience4j-retry-rate-limiter-bulkhead-time-limiter"

  - id: microservices-spring-cloud-resilience-089
    difficulty: expert
    tags: [tracing, reactor, context-propagation]
    question: |
      In a Spring Boot 3 WebFlux app, trace ids appear in controller logs but vanish inside a
      Reactor operator chain (flatMap/subscribeOn). What is the correct staff-level fix?
    options:
      - "Raise management.tracing.sampling.probability to 1.0 so that every trace is recorded and the id survives the operator chain"
      - "Migrate the entire application off WebFlux onto the blocking servlet stack, where trace context is bound per request thread"
      - "Enable automatic context propagation (Reactor 3.5+ Hooks.enableAutomaticContextPropagation()) or use ContextPropagation so ThreadLocal-based trace context is captured/restored across operator threads"
      - "Annotate every Reactor operator lambda with @NewSpan so each flatMap and subscribeOn stage re-attaches the trace id itself"
    answer: 2
    explanation: |
      Reactor executes operators on scheduler threads without ThreadLocals. Micrometer's context
      propagation (enabled via the Reactor hook / ContextPropagation) captures the trace context
      and restores it around operator execution so the trace id flows through the chain.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-090
    difficulty: expert
    tags: [tracing, sampling, propagation]
    question: |
      Service A (edge) is configured with sampling probability 0.1; service B downstream is
      configured with probability 1.0. For a request that A decides NOT to sample, what does B do
      with its spans?
    options:
      - "B samples the request at its own 100% probability and exports its spans anyway, producing a partial trace that starts at B"
      - "B ignores the incoming decision and re-samples every span independently using its locally configured probability of 1.0"
      - "B rejects the request with a tracing error because A's sampled=false flag conflicts with B's configured probability of 1.0"
      - "B honors the propagated sampled=false flag from the traceparent and does NOT export spans; the sampling decision is made once at the root and propagated, so B's local probability is irrelevant for this trace"
    answer: 3
    explanation: |
      The sampled bit is set at the trace root and carried in traceparent flags. Downstreams
      honor it rather than re-deciding, so B exports nothing for an unsampled trace regardless of
      its own probability. This keeps traces consistent end-to-end (avoids partial traces).
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-091
    difficulty: advanced
    tags: [tracing, observation-api, handlers]
    question: |
      A team adds micrometer-core and creates Observations but sees timers in /actuator/metrics
      yet NO spans in Zipkin. What is missing?
    options:
      - "The tracing ObservationHandler (from micrometer-tracing bridge, e.g. bridge-brave) plus a reporter; a MeterRegistry handler alone produces metrics but no spans"
      - "They need to raise management.tracing.sampling.probability above 1.0 so that every observation is force-sampled into the span exporter"
      - "Observations are a metrics-only abstraction and are architecturally incapable of ever producing spans, so Zipkin will always stay empty"
      - "They must annotate every traced method with both @Timed and @Observed so the registry emits timers and the matching Zipkin spans"
    answer: 0
    explanation: |
      One Observation drives multiple handlers. With only a meter handler you get timers; spans
      require the tracing handler contributed by micrometer-tracing (Brave/OTel bridge) and an
      exporter/reporter to Zipkin.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-092
    difficulty: expert
    tags: [tracing, cardinality, metrics]
    question: |
      A developer attaches the order id as a low-cardinality Observation key-value on a heavily
      used endpoint. Days later the Micrometer meter registry consumes gigabytes of heap. What
      went wrong?
    options:
      - "The order-id strings are simply too long as tag values; truncating them to a short fixed prefix would keep the same number of time series but shrink the heap footprint"
      - "The meter registry was under-provisioned on heap; nothing is fundamentally wrong with tagging by order id, and doubling the JVM max heap resolves the growth for good"
      - "High-cardinality values (order id) as metric tags create a distinct time series per value, exploding the registry's memory. Such values belong on the span (high-cardinality), not on the metric (which must stay low-cardinality)"
      - "Tracing was silently disabled at startup, so every span was downgraded into a Micrometer timer and stored in the meter registry instead of Zipkin"
    answer: 2
    explanation: |
      Every unique tag value is a separate metric time series. Unbounded values like order ids
      cause cardinality explosion and OOM. Put high-cardinality data on spans (where it's
      expected) and keep metric tags to a small bounded set.
    ref: "concepts.md#distributed-tracing-sleuth-and-micrometer-tracing"

  - id: microservices-spring-cloud-resilience-093
    difficulty: expert
    tags: [saga, pivot-transaction, compensation]
    question: |
      In saga design, a step is classified as compensatable, pivot, or retriable. What is the
      defining rule about the pivot transaction?
    options:
      - "The pivot is always the very first step of the saga, and by definition it can be cleanly compensated at any later point if a downstream step ends up failing"
      - "A saga may contain many pivot transactions, and on any failure every one of them is compensated in reverse order alongside the ordinary compensatable steps"
      - "The pivot is simply whichever step happens to call an external third-party API, since only remote calls need the special pivot classification in the saga"
      - "The pivot is the go/no-go commit point: steps before it are compensatable (can be undone), but once the pivot succeeds the saga MUST complete forward via retriable steps that are never compensated"
    answer: 3
    explanation: |
      The pivot is the point of no return. Everything before it is compensatable; everything
      after must be retriable (idempotent, eventually succeeds) and is driven forward, never
      compensated. Mis-classifying a post-pivot step as compensatable causes inconsistencies.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-094
    difficulty: expert
    tags: [saga, compensation, aba-problem, ordering]
    question: |
      A saga sends a compensation for step 3, but due to redelivery a delayed SUCCESS of the
      original step 3 arrives AFTER the compensation has run, re-creating the reserved resource.
      What is this hazard and a mitigation?
    options:
      - "It's an ordering/ABA hazard from at-least-once delivery; mitigate with semantic locks (status fields like RESERVED/RELEASED) and version checks so a late success is rejected when the aggregate is already in a compensated state"
      - "This scenario is impossible in a correctly designed saga, because the orchestrator strictly serializes every step so a compensation can never overlap with the original action's success"
      - "Mitigate by disabling compensations entirely and instead relying on a nightly reconciliation batch job to detect and repair any resources left in an inconsistent state"
      - "Mitigate by switching the broker to at-most-once delivery, which drops duplicates and therefore guarantees the strict global ordering the saga needs"
    answer: 0
    explanation: |
      Redelivery/late messages can make an original action land after its compensation (an ABA
      problem). A semantic lock / status state machine plus version checks lets the aggregate
      reject a stale success once it has moved to a compensated state.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-095
    difficulty: advanced
    tags: [saga, outbox, cdc, polling]
    question: |
      Contrast the two common transactional-outbox relay implementations.
    options:
      - "The polling publisher reads the database's write-ahead log directly for each unsent event, whereas the log-tailing CDC relay instead runs a scheduled SELECT against the outbox table"
      - "Both the polling publisher and the log-tailing CDC relay provide true exactly-once delivery end to end, so downstream consumers never have to deduplicate the events they receive"
      - "Polling publisher runs a scheduled query (e.g. SELECT ... FOR UPDATE SKIP LOCKED) to find and publish unsent rows; log-tailing CDC (e.g. Debezium) reads the DB transaction log/WAL for lower latency and no read load, but both deliver at-least-once so consumers must dedupe"
      - "The log-tailing CDC relay requires a two-phase commit (XA) between the database and the broker on every event, which is why it is considered heavier than the polling approach"
    answer: 2
    explanation: |
      Polling scans an outbox table on a schedule; CDC tails the transaction log for lower
      latency and no query overhead. Both are at-least-once, so idempotent/deduping consumers are
      required regardless.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-096
    difficulty: advanced
    tags: [saga, outbox, ordering, partitioning]
    question: |
      Your outbox publishes to Kafka. Which statement about event ordering is correct?
    options:
      - "Kafka maintains a single global total order across every partition of the topic, so any consumer reads all events in exactly the sequence the outbox wrote them"
      - "The transactional outbox pattern removes all ordering concerns because it publishes events strictly in primary-key order, making Kafka's own partition ordering irrelevant"
      - "Event ordering is fully guaranteed for the whole topic as long as every consumer instance joins the same single consumer group when reading"
      - "Per-aggregate ordering is preserved only if events for a given aggregate use the same partition key; cross-aggregate ordering is NOT guaranteed and should not be relied upon"
    answer: 3
    explanation: |
      Kafka orders within a partition. Keying by aggregate id keeps that aggregate's events
      ordered; different aggregates land on different partitions with no cross-partition ordering
      guarantee. Design consumers to not assume global order.
    ref: "concepts.md#saga-pattern-distributed-transactions"

  - id: microservices-spring-cloud-resilience-097
    difficulty: expert
    tags: [event-sourcing, optimistic-concurrency, expected-version]
    question: |
      Two command handlers concurrently load aggregate "acct-1" at version 7 and each try to
      append a new event. How does an event store typically prevent a lost update?
    options:
      - "It takes a global exclusive lock over the entire event store for the full duration of each command, serializing every aggregate's appends system-wide until the handler completes"
      - "It automatically merges the two competing events into a single combined event using a built-in last-write-wins field reconciliation so neither handler ever observes a conflict"
      - "It appends with an expectedVersion; the first append at expectedVersion=7 succeeds (bumping to 8), the second's expectedVersion=7 no longer matches, so it fails with a concurrency exception and must reload and retry"
      - "It silently keeps whichever writer's event arrives last, quietly discarding the earlier append and returning success to both command handlers with no error"
    answer: 2
    explanation: |
      Event stores use optimistic concurrency keyed on the aggregate's expected version. Only one
      append at a given version can win; the loser gets a concurrency conflict and must re-read
      the new events and retry its command — the ES analog of an optimistic lock.
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-098
    difficulty: expert
    tags: [cqrs, read-your-writes, consistency]
    question: |
      In a CQRS system the read model is updated asynchronously from the write model. A user
      submits a command and immediately queries, but doesn't see their change. Which is NOT a
      valid mitigation for read-your-own-writes?
    options:
      - "Make the read model strongly consistent by wrapping the command and all projections in one distributed ACID transaction across services"
      - "Have the client pass a version/sequence token and poll/wait until the projection reaches it"
      - "Briefly read that user's own data from the write model, falling back to the projection once it has caught up"
      - "Return the freshly projected result directly from the command handler's own response so the caller sees its write without a follow-up query"
    answer: 0
    explanation: |
      Returning the projection from the command, version-token waiting, and reading the write
      model temporarily are all valid. Forcing a cross-service distributed ACID transaction
      defeats the entire point of CQRS/microservices and is impractical — that's the invalid
      "mitigation".
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-099
    difficulty: advanced
    tags: [event-sourcing, projection, idempotency, replay]
    question: |
      A projection consumes events at-least-once and maintains a "total orders" counter. After a
      broker redelivery the counter is too high. What is the correct fix?
    options:
      - "Switch the broker to at-most-once delivery so duplicates are dropped, accepting that the counter may instead under-count whenever a delivery is silently lost"
      - "Abandon event sourcing for this aggregate and rebuild the counter from a nightly full-table scan of the write model instead of consuming the event stream"
      - "Make the projection idempotent by tracking the last processed event sequence (or a processed-event id table) so redelivered/replayed events are skipped rather than re-applied"
      - "Add a circuit breaker around the projection so it stops consuming events for a while after each redelivery spike and lets the counter settle"
    answer: 2
    explanation: |
      At-least-once delivery means duplicates. A projection must dedupe by tracking processed
      event sequences/ids so a redelivery doesn't double-increment. This also makes full replays
      (reset checkpoint, replay from 0) safe.
    ref: "concepts.md#cqrs-and-event-sourcing"

  - id: microservices-spring-cloud-resilience-100
    difficulty: expert
    tags: [idempotency, concurrency, race, unique-constraint]
    question: |
      A payment handler does: `if (SELECT by idempotencyKey is null) { INSERT key; charge(); }`.
      Two retries arrive simultaneously and BOTH charge the customer. What is the flaw and the
      fix?
    options:
      - "The SELECT on the idempotency key is too slow under load; adding a covering index so the lookup returns before the second retry arrives eliminates the double charge"
      - "The idempotency key is expiring between the two retries; setting a much longer TTL on the stored key keeps it visible so the second SELECT finds it and skips the charge"
      - "Automatic retries should simply be disabled for payment endpoints, since any retry of a charge is inherently unsafe and there is no way to make the handler tolerate one"
      - "It's a check-then-act race: both transactions see 'null' before either inserts. Fix by INSERTing the key FIRST under a UNIQUE constraint (or INSERT ... ON CONFLICT DO NOTHING) so exactly one wins, and treat the conflict as 'already processing/processed'"
    answer: 3
    explanation: |
      Reading-then-inserting is not atomic under concurrency; both callers observe absence and
      proceed. Inserting the key first behind a UNIQUE constraint (or ON CONFLICT DO NOTHING)
      makes exactly one caller win; the other detects the conflict and returns the stored/in-flight
      result instead of charging again.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-101
    difficulty: expert
    tags: [idempotency, key-scoping, payload-hash]
    question: |
      A client reuses the same Idempotency-Key header but sends a DIFFERENT request body (a bug).
      A naive implementation returns the previously stored response for the FIRST body. What is
      the robust staff-level behavior?
    options:
      - "Store a hash of the original request alongside the key; if a later request presents the same key with a different payload, reject it (e.g. HTTP 422/409) rather than silently returning the wrong stored result"
      - "Always return the previously stored response regardless of the new body, since idempotency by definition means the very first result for a key is final and authoritative"
      - "Overwrite the stored result with the new body's freshly computed result, so the latest request under that key always becomes the canonical cached response"
      - "Ignore the idempotency key entirely whenever the bodies differ and simply process both requests as two independent, fully separate operations"
    answer: 0
    explanation: |
      An idempotency key is scoped to a specific request. Persisting a request fingerprint (hash)
      lets the server detect key reuse with a mismatched payload and reject it, preventing a
      client bug from returning a response that doesn't correspond to the submitted request.
    ref: "concepts.md#idempotency"

  - id: microservices-spring-cloud-resilience-102
    difficulty: expert
    tags: [rate-limiting, redis, atomicity, lua]
    question: |
      A team implements a distributed limiter with Redis using separate GET, then INCR, then
      conditional SET round-trips. Under load it overcounts and lets too many requests through.
      What is the fix?
    options:
      - "Add more Redis read replicas and route the GET step to them, spreading the counter reads so the separate GET/INCR/SET round-trips no longer contend and overcount"
      - "Cache the current count locally in each service instance and only sync to Redis periodically, cutting the number of round-trips that can interleave and overcount"
      - "Perform the check-and-decrement atomically — a single Lua script (as SCG's RedisRateLimiter uses) or an INCR+EXPIRE that executes atomically on Redis's single-threaded command loop — so concurrent callers cannot interleave the read and the update"
      - "Switch the algorithm from token bucket to a fixed-window counter, because a fixed window uses only one key and therefore removes the interleaving race between the round-trips"
    answer: 2
    explanation: |
      Splitting the limiter across multiple non-atomic round-trips lets concurrent requests
      interleave and overcount. A single atomic operation (Lua script or atomic INCR/EXPIRE)
      makes the check-and-consume indivisible on Redis's single command thread, enforcing the
      global limit correctly.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: microservices-spring-cloud-resilience-103
    difficulty: advanced
    tags: [rate-limiting, fixed-window, sliding-window-counter]
    question: |
      Why can a fixed-window limiter of 100 requests/minute effectively allow ~200 requests in a
      one-second span, and how does a sliding-window-counter mitigate it cheaply?
    options:
      - "It can't happen; a fixed-window limiter enforces a perfectly smooth, evenly-paced rate at all times, so no more than 100 requests can ever pass within any one-second span"
      - "This overshoot only occurs when the clocks between the client and the limiter are unsynchronized, and enabling NTP time sync on both sides removes the effect entirely"
      - "The only mitigation is to replace it with a leaky bucket that queues every incoming request indefinitely and drains them one at a time so bursts can never form"
      - "Bursts at the window boundary (100 at 00:00:59 + 100 at 00:01:00) fall in different windows. A sliding-window-counter weights the previous window's count by the overlap fraction into the current window, approximating a sliding log without storing every timestamp"
    answer: 3
    explanation: |
      Fixed windows reset abruptly, so back-to-back bursts across the boundary double the
      allowance in a short span. The sliding-window-counter blends the prior window's count
      proportionally with the current one, smoothing the boundary at O(1) memory versus a full
      timestamp log.
    ref: "concepts.md#rate-limiting-and-throttling"

  - id: microservices-spring-cloud-resilience-104
    difficulty: expert
    tags: [graceful-degradation, fallback, deadlock, resource-sharing]
    question: |
      A circuit-breaker fallback for the recommendations call itself invokes the same
      recommendations service (a "retry with defaults" path) using the SAME connection pool and
      thread pool as the primary call. Under a downstream outage this makes things worse. Why?
    options:
      - "The fallback hits the same sick dependency and shares its exhausted pools, so it defeats the breaker, adds load to the failing service, and can deadlock waiting on the very resources that are saturated — fallbacks must use a DIFFERENT resource (cache/local default/cheaper service)"
      - "Resilience4j fallback methods are strictly forbidden from making any network calls, so the framework throws an exception at startup the moment it detects a remote call inside one"
      - "The fallback always executes on the exact same thread as the primary call, and running there is completely safe regardless of which connection pool the fallback happens to use"
      - "This is only a problem when the fallback method is annotated @Async; a plain synchronous fallback that reuses the same pools behaves perfectly well under a downstream outage"
    answer: 0
    explanation: |
      A fallback that calls the failing dependency (and shares its saturated thread/connection
      pools) nullifies the breaker's protection, increases load on the sick service, and risks
      deadlock/exhaustion. Fallbacks should degrade to an independent resource — cache, static
      default, or a cheaper service.
    ref: "concepts.md#graceful-degradation-and-fallbacks"

  - id: microservices-spring-cloud-resilience-105
    difficulty: expert
    tags: [graceful-degradation, timeout-budget, deadline-propagation]
    question: |
      An edge request has a 2s SLA and calls A, which calls B, which calls C. Each service sets a
      fixed 2s client timeout on its downstream. Why is this wrong, and what is the correct
      pattern?
    options:
      - "It's fine as designed; because each hop independently enforces its own 2s client timeout, the edge request is mathematically guaranteed to complete within the overall 2s SLA"
      - "The correct fix is to raise every downstream client timeout uniformly to 10s, giving each service enough slack that transient slowness never trips a timeout on the chain"
      - "Nested fixed timeouts can each wait the full 2s, so total time far exceeds 2s. Instead propagate a shrinking DEADLINE (remaining budget) so each hop's timeout is less than its parent's remaining time"
      - "Client timeouts should be removed from every hop entirely, so that a slow call simply waits as long as it needs and no request in the chain is ever failed by a timeout"
    answer: 2
    explanation: |
      Fixed per-hop timeouts sum: A waits up to 2s on B, which waits up to 2s on C, blowing the
      2s SLA. Deadline propagation passes the remaining budget so each downstream timeout shrinks
      (e.g. A gives B 1.8s, B gives C 1.5s), keeping the end-to-end within the SLA.
    ref: "concepts.md#graceful-degradation-and-fallbacks"
