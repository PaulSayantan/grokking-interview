topic: "Configuration, Profiles & Externalized Properties"
domain: spring-boot
topic_slug: configuration-profiles-properties
version: 1

questions:
  - id: configuration-profiles-properties-001
    difficulty: beginner
    tags: [externalized-config, twelve-factor]
    question: |
      What is the primary goal of Spring Boot's externalized configuration?
    options:
      - "To let the same artifact run in different environments by supplying values from outside the code"
      - "To compile a separate jar for every deployment environment"
      - "To encrypt all application properties automatically at build time"
      - "To replace the Spring IoC container with a lighter one"
    answer: 0
    explanation: |
      Externalized configuration keeps values outside the compiled artifact so
      one jar can behave differently per environment (the Twelve-Factor
      "config in the environment" idea). No rebuild is needed to change, say, a
      database URL.
    ref: "concepts.md#externalized-configuration-overview"

  - id: configuration-profiles-properties-002
    difficulty: beginner
    tags: [properties, yaml, formats]
    question: |
      Which statement about application.properties versus application.yml is correct?
    options:
      - "YAML supports duplicate keys while .properties does not"
      - "Both express the same configuration; YAML is hierarchical and better for nested structures/lists"
      - "application.yml is loaded only in production by default"
      - "application.properties requires SnakeYAML on the classpath"
    answer: 1
    explanation: |
      Both formats produce the same flat key namespace. YAML is hierarchical and
      more compact for nested config and lists; .properties is flat. YAML (not
      properties) forbids duplicate keys, and YAML is what needs SnakeYAML.
    ref: "concepts.md#applicationproperties-vs-applicationyml"

  - id: configuration-profiles-properties-003
    difficulty: intermediate
    tags: [yaml, propertysource, gotcha]
    question: |
      A developer writes @PropertySource("classpath:custom.yml") on a
      @Configuration class and finds the values are not bound. Why?
    options:
      - "YAML files must be placed in src/test/resources to be seen by @PropertySource"
      - "@PropertySource only works when a profile is active"
      - "@PropertySource does not load YAML by default; it needs a custom PropertySourceFactory"
      - "The file must be named application.yml to be recognized"
    answer: 2
    explanation: |
      @PropertySource loads .properties files only. To load YAML you must supply
      a custom factory (e.g. factory = YamlPropertySourceFactory.class). For Boot
      apps the idiomatic approach is application.yml or spring.config.import.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-004
    difficulty: beginner
    tags: [value, placeholder, default]
    question: |
      What does @Value("${app.mail.port:25}") do when the property app.mail.port
      is not defined anywhere?
    options:
      - "Throws IllegalArgumentException at startup"
      - "Injects null"
      - "Injects 0 because the field is an int"
      - "Injects the default value 25"
    answer: 3
    explanation: |
      The :25 after the key is the default value used when the placeholder cannot
      be resolved. Without a default, an unresolved placeholder throws
      IllegalArgumentException at startup.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-005
    difficulty: intermediate
    tags: [value, spel, placeholder]
    question: |
      In @Value, what is the difference between ${...} and #{...}?
    options:
      - "They are identical aliases for property placeholders"
      - "${...} is SpEL; #{...} is a property placeholder"
      - "${...} is a property placeholder resolved by the Environment; #{...} is a SpEL expression"
      - "#{...} works only inside application.yml, not in Java code"
    answer: 2
    explanation: |
      ${...} is a property placeholder resolved against the Environment, while
      #{...} is a Spring Expression Language (SpEL) expression evaluated by the
      expression engine. They can be nested, e.g. #{'${app.list}'.split(',')}.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-006
    difficulty: intermediate
    tags: [configuration-properties, registration]
    question: |
      Which of these is NOT a valid way to register a @ConfigurationProperties class?
    options:
      - "Annotate the class with @Value"
      - "Annotate the class with @Component"
      - "Use @EnableConfigurationProperties(MyProps.class)"
      - "Use @ConfigurationPropertiesScan on a configuration class"
    answer: 0
    explanation: |
      @ConfigurationProperties beans are registered via @Component, via
      @EnableConfigurationProperties, or by scanning with
      @ConfigurationPropertiesScan. @Value is for single-property injection and
      does not register a properties bean.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-007
    difficulty: advanced
    tags: [configuration-properties, constructor-binding, spring-boot-3]
    question: |
      In Spring Boot 3.x, when is @ConstructorBinding needed on a
      @ConfigurationProperties class?
    options:
      - "Always — every properties class must be annotated with it"
      - "Only to select which constructor to bind when the class has more than one constructor"
      - "Never — constructor binding was removed in Boot 3"
      - "Only when the class is a Java record"
    answer: 1
    explanation: |
      In Boot 3.x constructor binding is inferred for a class with a single
      parameterized constructor, so you don't annotate it. @ConstructorBinding is
      only needed to pick one constructor when several exist. (In Boot 2.x it was
      required on the class.)
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-008
    difficulty: intermediate
    tags: [value, configuration-properties, comparison]
    question: |
      You must bind a list app.servers and validate that app.timeout is a positive
      Duration. Which mechanism is the right fit and why?
    options:
      - "@Value, because it supports @Validated and List binding natively"
      - "@PropertySource, because only it can read lists"
      - "Environment.getProperty, because it validates automatically"
      - "@ConfigurationProperties, because it binds collections cleanly and supports @Validated"
    answer: 3
    explanation: |
      @ConfigurationProperties binds collections/maps/nested types first-class and
      supports JSR-303 validation via @Validated. @Value handles single scalars
      and SpEL but lacks clean collection binding and easy validation.
    ref: "concepts.md#value-vs-configurationproperties"

  - id: configuration-profiles-properties-009
    difficulty: advanced
    tags: [relaxed-binding, value, gotcha]
    question: |
      Why might @Value("${my-app.page-size}") fail to pick up an environment
      variable MYAPP_PAGESIZE even though a @ConfigurationProperties field would?
    options:
      - "@Value does not perform relaxed binding; it matches the key name exactly"
      - "Environment variables are never visible to Spring"
      - "@Value only reads from application.yml, never from env vars"
      - "MYAPP_PAGESIZE is an invalid environment variable name"
    answer: 0
    explanation: |
      Relaxed binding (matching kebab/camel/UPPER_UNDERSCORE forms) applies to
      @ConfigurationProperties, not @Value. @Value resolves the placeholder by
      exact key, so the env-var form does not reliably map to my-app.page-size.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-010
    difficulty: intermediate
    tags: [relaxed-binding, env-vars]
    question: |
      Which environment variable name maps to the property spring.datasource.url
      via relaxed binding?
    options:
      - "spring.datasource.url"
      - "SPRING-DATASOURCE-URL"
      - "SPRING_DATASOURCE_URL"
      - "springDatasourceUrl"
    answer: 2
    explanation: |
      For environment variables, dots and dashes become underscores and letters
      are upper-cased: spring.datasource.url -> SPRING_DATASOURCE_URL.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-011
    difficulty: beginner
    tags: [relaxed-binding, canonical-form]
    question: |
      What is the recommended canonical form to write property names in your
      configuration files?
    options:
      - "camelCase (pageSize)"
      - "kebab-case (page-size)"
      - "UPPER_UNDERSCORE (PAGE_SIZE)"
      - "PascalCase (PageSize)"
    answer: 1
    explanation: |
      Kebab-case is the recommended canonical form because it is the lowest common
      denominator that maps cleanly to all other source styles under relaxed
      binding.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-012
    difficulty: advanced
    tags: [validation, jakarta, spring-boot-3]
    question: |
      When validating @ConfigurationProperties in Spring Boot 3.x, which package
      should the constraint annotations (e.g. @NotNull, @Min) come from?
    options:
      - "javax.validation.constraints"
      - "org.springframework.validation.constraints"
      - "org.hibernate.validator.constraints only"
      - "jakarta.validation.constraints"
    answer: 3
    explanation: |
      Spring Boot 3.x is built on Jakarta EE, so Bean Validation constraints are
      imported from jakarta.validation.constraints.*. Using the old
      javax.validation.* no longer works — a very common migration break.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-013
    difficulty: intermediate
    tags: [validation, validated, gotcha]
    question: |
      You added @Min and @NotNull to a @ConfigurationProperties class but invalid
      values start the app without error. What is the most likely cause?
    options:
      - "The class is missing the @Validated annotation"
      - "Bean Validation cannot be used with configuration properties at all"
      - "You must call validate() manually in a @PostConstruct"
      - "Constraints only work on @Value fields"
    answer: 0
    explanation: |
      Constraint annotations are only enforced on a @ConfigurationProperties bean
      when the class is annotated with @Validated (and a Bean Validation provider
      like Hibernate Validator is on the classpath). Without @Validated the
      constraints are silently ignored.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-014
    difficulty: advanced
    tags: [precedence, command-line, system-properties]
    question: |
      Given: java -Dserver.port=8081 -jar app.jar --server.port=9090
      On which port does the application start?
    options:
      - "8081, because -D system properties have highest precedence"
      - "9090, because command-line (--) arguments outrank system properties"
      - "8080, the default, because the two conflict and cancel out"
      - "It fails to start due to a duplicate property"
    answer: 1
    explanation: |
      Command-line arguments (--key=value) sit near the top of the precedence
      order and outrank Java system properties (-Dkey=value). So 9090 wins.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-015
    difficulty: intermediate
    tags: [precedence, env-vars, config-files]
    question: |
      application.yml sets server.port: 8080 and an environment variable
      SERVER_PORT=8082 is exported. Which value is used?
    options:
      - "8080, because files always win over the environment"
      - "Neither; the conflict throws an exception"
      - "8082, because OS environment variables outrank config data files"
      - "A random one, since order is non-deterministic"
    answer: 2
    explanation: |
      OS environment variables have higher precedence than config data files
      (application.properties/.yml). So SERVER_PORT=8082 overrides the file value.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-016
    difficulty: advanced
    tags: [precedence, ordering]
    question: |
      Which ordering correctly ranks these sources from LOWEST to HIGHEST
      precedence in Spring Boot?
    options:
      - "Command-line args < OS env vars < application.yml < default properties"
      - "OS env vars < command-line args < application.yml < default properties"
      - "application.yml < command-line args < OS env vars < default properties"
      - "Default properties < application.yml (config data) < OS env vars < command-line args"
    answer: 3
    explanation: |
      From lowest to highest: SpringApplication default properties, then config
      data files (application.*), then OS environment variables, then system
      properties, then command-line arguments (with a few test sources even
      higher).
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-017
    difficulty: intermediate
    tags: [precedence, system-properties, env-vars]
    question: |
      Between an OS environment variable and a Java system property (-D) that set
      the same key, which one wins?
    options:
      - "The OS environment variable"
      - "Whichever was set first chronologically"
      - "The Java system property"
      - "They must be identical or startup fails"
    answer: 2
    explanation: |
      Java system properties have higher precedence than OS environment variables
      in Spring Boot's documented ordering, so the -D value wins over the env var.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-018
    difficulty: intermediate
    tags: [config-location, external-override]
    question: |
      You place a config/ directory containing application.yml next to the
      deployable jar, and the jar also bundles application.yml. Which wins?
    options:
      - "The external ./config/application.yml overrides the bundled one"
      - "The bundled (in-jar) file always wins"
      - "They are merged and both values are kept as a list"
      - "Startup fails because two application.yml files exist"
    answer: 0
    explanation: |
      External locations (including ./config/) are searched after and override the
      classpath/in-jar copy. This is precisely how ops can drop an override file
      beside the jar without rebuilding.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-019
    difficulty: advanced
    tags: [config-location, spring-config-location]
    question: |
      What is the difference between spring.config.location and
      spring.config.additional-location?
    options:
      - "They are identical aliases"
      - "spring.config.location replaces the default search locations; additional-location adds to them"
      - "additional-location replaces the defaults; location adds to them"
      - "Both only work in test scope"
    answer: 1
    explanation: |
      spring.config.location REPLACES the default set of locations entirely, while
      spring.config.additional-location ADDS locations while keeping the defaults.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-020
    difficulty: advanced
    tags: [config-import, config-tree, kubernetes]
    question: |
      Which property, introduced in Spring Boot 2.4, is used to import external
      config files or Kubernetes-style config trees into the Environment?
    options:
      - "spring.config.include"
      - "spring.profiles.import"
      - "spring.datasource.import"
      - "spring.config.import"
    answer: 3
    explanation: |
      spring.config.import (Boot 2.4+) pulls in extra files, config trees
      (configtree:/etc/config/ for mounted K8s secrets), and external config
      systems, replacing much of the older ad-hoc loading logic.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-021
    difficulty: beginner
    tags: [env-vars, profiles]
    question: |
      Which environment variable activates the profiles "prod" and "metrics"?
    options:
      - "SPRING_PROFILES_ACTIVE=prod,metrics"
      - "SPRING_ACTIVE_PROFILES=prod,metrics"
      - "ACTIVE_PROFILES=prod metrics"
      - "SPRING_PROFILE=prod;metrics"
    answer: 0
    explanation: |
      spring.profiles.active maps to the env var SPRING_PROFILES_ACTIVE, and
      multiple profiles are comma-separated: SPRING_PROFILES_ACTIVE=prod,metrics.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-022
    difficulty: intermediate
    tags: [command-line, system-properties, distinction]
    question: |
      Which statement about -Dkey=value versus --key=value when launching a Boot
      jar is correct?
    options:
      - "-D args and -- args are the same thing"
      - "-- sets a system property; -D sets a command-line argument"
      - "-D sets a system property; -- sets a command-line argument with HIGHER precedence than -D"
      - "Only -D is read by Spring Boot; -- is ignored"
    answer: 2
    explanation: |
      -D defines a JVM system property, while -- defines a Spring Boot command-line
      argument. Command-line (--) arguments have higher precedence than system
      properties.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-023
    difficulty: intermediate
    tags: [spring-application-json]
    question: |
      What does the SPRING_APPLICATION_JSON environment variable let you do?
    options:
      - "Serialize all beans to JSON at startup"
      - "Provide inline JSON that is parsed and merged into the Environment as properties"
      - "Force the app to only accept JSON HTTP requests"
      - "Disable YAML parsing"
    answer: 1
    explanation: |
      SPRING_APPLICATION_JSON (or the system property) supplies an inline JSON blob
      that Boot flattens into properties and adds to the Environment, e.g.
      {"server":{"port":9000}}.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-024
    difficulty: advanced
    tags: [propertysource, precedence, gotcha]
    question: |
      Why can a @PropertySource file NOT reliably override properties like
      logging.* or spring.main.*?
    options:
      - "Those properties are read-only"
      - "@PropertySource cannot read .properties files"
      - "logging.* is only configurable via YAML"
      - "@PropertySource is registered late (during context refresh), too low/late in precedence to affect early-read settings"
    answer: 3
    explanation: |
      @PropertySource is added while the context is refreshing, which is after some
      settings (logging, spring.main) have already been consumed and low in the
      precedence order — so it cannot influence those early-read properties.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-025
    difficulty: intermediate
    tags: [propertysource, not-found]
    question: |
      Which attribute makes @PropertySource tolerate a missing file instead of
      failing startup?
    options:
      - "ignoreResourceNotFound = true"
      - "optional = true"
      - "required = false"
      - "failFast = false"
    answer: 0
    explanation: |
      @PropertySource(value = "classpath:missing.properties",
      ignoreResourceNotFound = true) lets the application start even if the
      resource is absent.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-026
    difficulty: beginner
    tags: [environment, api]
    question: |
      Which method on the Environment throws an exception if the requested property
      is missing?
    options:
      - "getProperty(String)"
      - "getRequiredProperty(String)"
      - "containsProperty(String)"
      - "getPropertyOrNull(String)"
    answer: 1
    explanation: |
      getRequiredProperty throws IllegalStateException when the key is absent,
      whereas getProperty returns null (or a supplied default). containsProperty
      just returns a boolean.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-027
    difficulty: advanced
    tags: [environment, profiles-expression]
    question: |
      What is the modern, non-deprecated way to test a profile expression like
      "prod & !legacy" via the Environment?
    options:
      - "env.acceptsProfiles(\"prod & !legacy\")"
      - "env.matchProfiles(\"prod\", \"!legacy\")"
      - "env.acceptsProfiles(Profiles.of(\"prod & !legacy\"))"
      - "env.getActiveProfiles().contains(\"prod & !legacy\")"
    answer: 2
    explanation: |
      acceptsProfiles(String...) is deprecated. Use
      acceptsProfiles(Profiles.of("prod & !legacy")), which supports the &, |, and
      ! operators with parentheses.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-028
    difficulty: advanced
    tags: [environment, post-processor, early-hook]
    question: |
      You need to add a property source EARLY, before beans are created, so it can
      influence most other configuration. Which hook is appropriate?
    options:
      - "A @Bean method returning a PropertySource"
      - "A @PostConstruct method on any component"
      - "@PropertySource on the main application class"
      - "An EnvironmentPostProcessor registered via spring.factories / imports"
    answer: 3
    explanation: |
      EnvironmentPostProcessor runs very early (before the context is created), so
      it is the correct extension point for injecting custom property sources that
      must beat most others. @PropertySource and @Bean run too late.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-029
    difficulty: beginner
    tags: [profile, conditional-beans]
    question: |
      What does @Profile("dev") on a @Bean method do?
    options:
      - "Runs the bean's methods only when a dev HTTP request arrives"
      - "Deletes the bean after the dev profile ends"
      - "Registers that bean definition only when the 'dev' profile is active"
      - "Marks the bean as lazy in dev"
    answer: 2
    explanation: |
      @Profile conditionally registers a bean definition based on active profiles.
      It is evaluated at context startup, not per request, and is a specialization
      of @Conditional.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-030
    difficulty: intermediate
    tags: [profile, expressions]
    question: |
      Which @Profile value registers a bean whenever the 'prod' profile is NOT
      active?
    options:
      - "@Profile(\"!prod\")"
      - "@Profile(\"prod\")"
      - "@Profile(\"not:prod\")"
      - "@Profile(\"prod=false\")"
    answer: 0
    explanation: |
      Profile expressions support the ! (NOT), & (AND), and | (OR) operators, so
      @Profile("!prod") activates the bean any time prod is not active.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-031
    difficulty: intermediate
    tags: [profile, conditional-on-property, distinction]
    question: |
      What is the key difference between @Profile and @ConditionalOnProperty?
    options:
      - "They are aliases with identical behavior"
      - "@Profile keys off active profiles; @ConditionalOnProperty keys off a property's value"
      - "@Profile works only in tests; @ConditionalOnProperty only in production"
      - "@ConditionalOnProperty keys off active profiles; @Profile off a property value"
    answer: 1
    explanation: |
      @Profile decides bean registration based on which profiles are active, while
      @ConditionalOnProperty decides based on whether/what a specific property is
      set to.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-032
    difficulty: beginner
    tags: [default-profile]
    question: |
      When are beans annotated @Profile("default") active?
    options:
      - "Always, regardless of active profiles"
      - "Only when the 'default' profile is explicitly listed in spring.profiles.active"
      - "Never; 'default' is a reserved illegal profile name"
      - "Only when no other profile is active"
    answer: 3
    explanation: |
      The literal profile named 'default' applies only when no profile is active.
      Once any profile is activated, the default profile (and @Profile("default")
      beans) no longer apply.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-033
    difficulty: intermediate
    tags: [active-profiles, collision, last-wins]
    question: |
      With spring.profiles.active=dev,prod and both application-dev.yml and
      application-prod.yml defining app.url, which value wins?
    options:
      - "application-prod.yml, because the last-listed profile wins on collisions"
      - "application-dev.yml, because dev is listed first"
      - "Neither; the collision throws an error"
      - "The base application.yml value always overrides both"
    answer: 0
    explanation: |
      Multiple active profiles are additive, and on a property collision the
      last-listed profile wins. With dev,prod the prod value overrides the dev one.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-034
    difficulty: advanced
    tags: [active-profiles, gotcha, profile-groups]
    question: |
      Which statement about setting spring.profiles.active is correct?
    options:
      - "It can be set from inside a profile-specific file like application-prod.yml"
      - "It can only be set programmatically, never via properties"
      - "It cannot be set from within a profile-specific file/document; use profile groups instead"
      - "It is ignored unless placed in @PropertySource"
    answer: 2
    explanation: |
      You cannot set spring.profiles.active from within a profile-specific file or a
      profile-gated document — Boot rejects/ignores it. To activate several
      profiles together, use profile groups (spring.profiles.group).
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-035
    difficulty: intermediate
    tags: [profile-specific, override]
    question: |
      With spring.profiles.active=prod, how do application.yml and
      application-prod.yml interact?
    options:
      - "Only application-prod.yml loads; application.yml is ignored"
      - "Both load; application-prod.yml overrides application.yml for the prod profile"
      - "Only application.yml loads unless the profile file is renamed"
      - "They are concatenated with prod values placed first but overridden by the base"
    answer: 1
    explanation: |
      The base application.yml always loads, and the profile-specific
      application-prod.yml loads in addition and overrides the base for the active
      profile.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-036
    difficulty: advanced
    tags: [multi-document, on-profile, spring-boot-2.4]
    question: |
      In a Boot 2.4+ multi-document YAML file, which key gates a document to a
      specific profile?
    options:
      - "spring.profiles"
      - "spring.profile.name"
      - "spring.active.profile"
      - "spring.config.activate.on-profile"
    answer: 3
    explanation: |
      Since Boot 2.4, documents are gated with spring.config.activate.on-profile.
      The older spring.profiles key inside a document is deprecated/removed.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-037
    difficulty: advanced
    tags: [profile-groups]
    question: |
      Given the config below, what happens when you start with
      --spring.profiles.active=prod?
        spring:
          profiles:
            group:
              prod: prod-db, prod-mq, monitoring
    options:
      - "prod plus prod-db, prod-mq, and monitoring are all activated"
      - "Only the prod profile is activated"
      - "Startup fails because a group cannot reference other profiles"
      - "prod is ignored and only the group members activate"
    answer: 0
    explanation: |
      A profile group expands one profile into several. Activating prod also
      activates prod-db, prod-mq, and monitoring. Groups are the sanctioned way to
      turn on multiple profiles together.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-038
    difficulty: intermediate
    tags: [multi-document, properties-separator]
    question: |
      What separator introduces a new document within a single
      application.properties file (Boot 2.4+)?
    options:
      - "---"
      - "#---"
      - "==="
      - "%%%"
    answer: 1
    explanation: |
      Multi-document .properties files use #--- as the separator (Boot 2.4+),
      whereas native YAML uses the standard --- separator.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-039
    difficulty: advanced
    tags: [configuration-properties, duration, conversion]
    question: |
      A @ConfigurationProperties field of type Duration is bound from the value
      "30s". What happens?
    options:
      - "Binding fails; Duration cannot be parsed from a string"
      - "It binds to 30 milliseconds"
      - "It binds to 30 seconds via Boot's built-in Duration converter"
      - "It binds to a String because Duration is unsupported"
    answer: 2
    explanation: |
      Spring Boot has built-in converters for Duration ("30s", "PT10M"), DataSize
      ("10MB"), enums, and collections. "30s" binds to Duration.ofSeconds(30). Use
      @DurationUnit to set the unit for bare numbers.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-040
    difficulty: advanced
    tags: [configuration-properties, constructor-binding, gotcha]
    question: |
      Why should you avoid annotating a constructor-bound @ConfigurationProperties
      class with @Component?
    options:
      - "@Component classes cannot have constructors"
      - "@Component disables relaxed binding"
      - "It forces the bean to be prototype-scoped"
      - "The two registration styles conflict; use @EnableConfigurationProperties or @ConfigurationPropertiesScan instead"
    answer: 3
    explanation: |
      Constructor binding relies on registration via @EnableConfigurationProperties
      or @ConfigurationPropertiesScan. Adding @Component (which creates the bean
      through normal component scanning) conflicts with constructor-binding
      registration, so the two should not be combined.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-041
    difficulty: intermediate
    tags: [precedence, test-property-source]
    question: |
      In a test, both @SpringBootTest(properties = "x=1") and
      @TestPropertySource(properties = "x=2") set x. Which wins?
    options:
      - "@SpringBootTest, value 1"
      - "Neither; annotations conflict and the test errors"
      - "@TestPropertySource, value 2"
      - "Whichever annotation is declared first on the class"
    answer: 2
    explanation: |
      @TestPropertySource has higher precedence than the properties attribute of
      @SpringBootTest in the documented ordering, so x=2 wins.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-042
    difficulty: beginner
    tags: [value, list-binding]
    question: |
      A property app.recipients=a,b,c is injected via @Value("${app.recipients}")
      into a List<String>. What is the resulting list?
    options:
      - "The list [\"a\", \"b\", \"c\"]"
      - "A single-element list [\"a,b,c\"]"
      - "An empty list because @Value cannot bind lists"
      - "A compilation error"
    answer: 0
    explanation: |
      Spring can split a comma-separated string into a List/array when injected via
      @Value, producing ["a", "b", "c"]. For richer collection binding, prefer
      @ConfigurationProperties.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-043
    difficulty: intermediate
    tags: [configuration-properties, unknown-fields, gotcha]
    question: |
      By default, what happens to a property under a @ConfigurationProperties
      prefix that does not map to any field (e.g. a typo)?
    options:
      - "Startup fails immediately with an unknown-property error"
      - "It is silently ignored (ignoreUnknownFields defaults to true)"
      - "It is bound to a Map<String,Object> automatically"
      - "It overwrites the nearest matching field"
    answer: 1
    explanation: |
      Binding is tolerant by default: unknown/extra fields are ignored
      (ignoreUnknownFields = true), so a mistyped key silently does nothing.
      Metadata tooling / IDE hints help catch such typos.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-044
    difficulty: intermediate
    tags: [value, static, gotcha]
    question: |
      What happens if you place @Value("${app.key}") on a static field?
    options:
      - "It works normally; static fields are supported"
      - "It injects into every instance and the class simultaneously"
      - "It throws a compilation error"
      - "The value is not injected; @Value injection is instance-based"
    answer: 3
    explanation: |
      @Value injection is performed on instances, so annotating a static field does
      not inject the value. For values needed early/immutably, use constructor
      injection.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-045
    difficulty: advanced
    tags: [profile-expressions, and-or]
    question: |
      Which beans get registered by @Profile("prod & (us | eu)")?
    options:
      - "Only when prod is active AND at least one of us or eu is active"
      - "Any time prod OR us OR eu is active"
      - "Only when all three prod, us, and eu are active"
      - "Never; parentheses are not allowed in profile expressions"
    answer: 0
    explanation: |
      Profile expressions support &, |, ! and parentheses. "prod & (us | eu)"
      requires prod to be active together with either us or eu.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-046
    difficulty: beginner
    tags: [environment, typed-lookup]
    question: |
      What does env.getProperty("server.port", Integer.class, 8080) return when
      server.port is not set?
    options:
      - "null"
      - "The String \"8080\""
      - "The Integer 8080 (the supplied default)"
      - "It throws because a default is illegal with a type argument"
    answer: 2
    explanation: |
      This overload converts the property to the target type and returns the
      supplied default (8080) when the key is absent. It is a convenient typed,
      defaulted lookup.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-047
    difficulty: intermediate
    tags: [yaml, gotcha, norway-problem]
    question: |
      In YAML, why can an unquoted value like country: no cause a subtle bug?
    options:
      - "YAML rejects two-letter values"
      - "YAML may interpret no as the boolean false (the 'Norway problem'); quote it to keep a string"
      - "no is a reserved profile name"
      - "YAML converts it to null"
    answer: 1
    explanation: |
      YAML interprets some unquoted tokens (no/yes/on/off) as booleans, so
      country: no can become false — the well-known Norway problem. Quote string
      values ("no") to avoid it.
    ref: "concepts.md#applicationproperties-vs-applicationyml"

  - id: configuration-profiles-properties-048
    difficulty: advanced
    tags: [config-data, location-precedence]
    question: |
      Within the config-data tier, which of these has the HIGHEST precedence?
    options:
      - "Bundled (in-jar) application.yml"
      - "Bundled profile-specific application-{profile}.yml"
      - "External application.yml"
      - "External profile-specific application-{profile}.yml"
    answer: 3
    explanation: |
      Within config data, order is: bundled base, bundled profile-specific,
      external base, external profile-specific — with external profile-specific
      files winning (profile-specific > base, external > bundled).
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-049
    difficulty: intermediate
    tags: [command-line, disable]
    question: |
      How do you prevent Spring Boot from treating --key=value command-line
      arguments as a property source?
    options:
      - "Call SpringApplication.setAddCommandLineProperties(false)"
      - "Set spring.main.command-line-enabled=false in application.yml"
      - "Remove the main method arguments"
      - "It cannot be disabled"
    answer: 0
    explanation: |
      SpringApplication.setAddCommandLineProperties(false) disables the
      command-line argument property source so --key=value pairs are no longer
      bound.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-050
    difficulty: advanced
    tags: [validation, nested, cascade]
    question: |
      A @Validated @ConfigurationProperties class has a nested object field with
      its own constraints. What is required for those nested constraints to be
      checked?
    options:
      - "Nothing extra; nested validation is automatic"
      - "The nested field must be annotated with @Valid to cascade validation"
      - "The nested class must also be a @Component"
      - "You must call the validator manually"
    answer: 1
    explanation: |
      Bean Validation only cascades into a nested object when the field is
      annotated with @Valid. Without it, the nested object's constraints are not
      evaluated.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-051
    difficulty: beginner
    tags: [profiles, active-vs-default]
    question: |
      What is the difference between an active profile and the default profile?
    options:
      - "They are the same thing"
      - "The default profile is always active in addition to active profiles"
      - "Active profiles are currently enabled; the default profile applies only when no profile is active"
      - "Active profiles apply only in tests; default only in production"
    answer: 2
    explanation: |
      Active profiles are the ones currently switched on (additive). The default
      profile applies only when no profile is active; once any profile is active,
      the default profile no longer applies.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-052
    difficulty: intermediate
    tags: [tests, active-profiles]
    question: |
      In a Spring test, which annotation is the idiomatic way to set the active
      profile?
    options:
      - "@Profile on the test class"
      - "@EnableProfiles(\"test\")"
      - "@TestProfile(\"test\")"
      - "@ActiveProfiles(\"test\")"
    answer: 3
    explanation: |
      @ActiveProfiles is the test-specific annotation to declare which profiles are
      active for the test's ApplicationContext, overriding file-based settings.
      @Profile only gates bean registration, it does not activate a profile.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-053
    difficulty: advanced
    tags: [env-vars, list-index, relaxed-binding]
    question: |
      Using environment variables, how would you bind the list element
      app.person.roles[0]?
    options:
      - "APP_PERSON_ROLES[0]"
      - "APP.PERSON.ROLES.0"
      - "APP_PERSON_ROLES_0_"
      - "app_person_roles_0"
    answer: 2
    explanation: |
      Environment variables cannot use brackets, so list indexes use the form
      APP_PERSON_ROLES_0_ (uppercase, underscores replacing dots and wrapping the
      index).
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-054
    difficulty: intermediate
    tags: [configuration-properties, metadata, tooling]
    question: |
      What benefit does @ConfigurationProperties have over @Value regarding IDE
      support?
    options:
      - "@ConfigurationProperties can generate metadata (via the annotation processor) enabling IDE autocomplete and docs"
      - "None; they are equivalent for tooling"
      - "@Value generates metadata but @ConfigurationProperties does not"
      - "Both require manual metadata files"
    answer: 0
    explanation: |
      The spring-boot-configuration-processor generates metadata for
      @ConfigurationProperties, giving IDE autocompletion and documentation for the
      keys. @Value does not participate in this metadata generation.
    ref: "concepts.md#value-vs-configurationproperties"

  - id: configuration-profiles-properties-055
    difficulty: advanced
    tags: [precedence, random-values]
    question: |
      What does the RandomValuePropertySource enable, and where does it sit in
      precedence?
    options:
      - "It encrypts properties and sits at the top of precedence"
      - "It generates random.* values and sits below OS environment variables"
      - "It randomizes the active profile on each start"
      - "It disables all other property sources"
    answer: 1
    explanation: |
      RandomValuePropertySource provides values like ${random.int} and
      ${random.uuid}. In the precedence list it sits below OS environment variables
      (after config data, before env vars).
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-056
    difficulty: intermediate
    tags: [profile, configuration-class]
    question: |
      What is the effect of putting @Profile("prod") on a @Configuration class
      (rather than a single @Bean)?
    options:
      - "Only the first @Bean in the class respects the profile"
      - "It is ignored; @Profile only works on @Bean methods"
      - "The class is loaded but its beans become lazy"
      - "All bean definitions in that configuration class are gated to the prod profile"
    answer: 3
    explanation: |
      When @Profile is on a @Configuration class, it gates every bean defined in
      that class — none are registered unless the profile is active.
    ref: "concepts.md#profile-and-conditional-beans"
