topic: "Configuration, Profiles & Externalized Properties"
domain: spring-boot
topic_slug: configuration-profiles-properties
version: 1

questions:
  - id: configuration-profiles-properties-001
    difficulty: beginner
    tags: [externalized-config, twelve-factor]
    question: |
      What is the primary goal of Spring Boot's externalized configuration?
    options:
      - "To let the same artifact run in different environments by supplying values from outside the code"
      - "To compile a separate jar for every deployment environment, baking its values in at build time"
      - "To encrypt all application properties automatically at build time so secrets never sit in plain text"
      - "To replace the Spring IoC container with a lighter one that loads settings at runtime instead"
    answer: 0
    explanation: |
      Externalized configuration keeps values outside the compiled artifact so
      one jar can behave differently per environment (the Twelve-Factor
      "config in the environment" idea). No rebuild is needed to change, say, a
      database URL.
    ref: "concepts.md#externalized-configuration-overview"

  - id: configuration-profiles-properties-002
    difficulty: beginner
    tags: [properties, yaml, formats]
    question: |
      Which statement about application.properties versus application.yml is correct?
    options:
      - "YAML supports duplicate keys within a document while .properties rejects them at load time"
      - "Both express the same configuration; YAML is hierarchical and better for nested structures/lists"
      - "application.yml is loaded only in production by default, while .properties loads everywhere else"
      - "application.properties requires SnakeYAML on the classpath to be parsed into the key namespace"
    answer: 1
    explanation: |
      Both formats produce the same flat key namespace. YAML is hierarchical and
      more compact for nested config and lists; .properties is flat. YAML (not
      properties) forbids duplicate keys, and YAML is what needs SnakeYAML.
    ref: "concepts.md#applicationproperties-vs-applicationyml"

  - id: configuration-profiles-properties-003
    difficulty: intermediate
    tags: [yaml, propertysource, gotcha]
    question: |
      A developer writes @PropertySource("classpath:custom.yml") on a
      @Configuration class and finds the values are not bound. Why?
    options:
      - "YAML files must be placed in src/test/resources before @PropertySource can resolve them at runtime"
      - "@PropertySource only works when a profile is active and is skipped when none has been declared"
      - "@PropertySource does not load YAML by default; it needs a custom PropertySourceFactory"
      - "The file must be named application.yml to be recognized by the @PropertySource resource loader"
    answer: 2
    explanation: |
      @PropertySource loads .properties files only. To load YAML you must supply
      a custom factory (e.g. factory = YamlPropertySourceFactory.class). For Boot
      apps the idiomatic approach is application.yml or spring.config.import.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-004
    difficulty: beginner
    tags: [value, placeholder, default]
    question: |
      What does @Value("${app.mail.port:25}") do when the property app.mail.port
      is not defined anywhere?
    options:
      - "Throws IllegalArgumentException at startup"
      - "Injects null"
      - "Injects 0 because the field is an int"
      - "Injects the default value 25"
    answer: 3
    explanation: |
      The :25 after the key is the default value used when the placeholder cannot
      be resolved. Without a default, an unresolved placeholder throws
      IllegalArgumentException at startup.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-005
    difficulty: intermediate
    tags: [value, spel, placeholder]
    question: |
      In @Value, what is the difference between ${...} and #{...}?
    options:
      - "They are identical aliases for property placeholders and are interchangeable in every context"
      - "${...} is a SpEL expression while #{...} is the placeholder resolved against the Environment"
      - "${...} is a property placeholder resolved by the Environment; #{...} is a SpEL expression"
      - "#{...} works only inside application.yml files and is silently ignored when written in Java code"
    answer: 2
    explanation: |
      ${...} is a property placeholder resolved against the Environment, while
      #{...} is a Spring Expression Language (SpEL) expression evaluated by the
      expression engine. They can be nested, e.g. #{'${app.list}'.split(',')}.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-006
    difficulty: intermediate
    tags: [configuration-properties, registration]
    question: |
      Which of these is NOT a valid way to register a @ConfigurationProperties class?
    options:
      - "Annotate the class with @Value"
      - "Annotate the class with @Component"
      - "Use @EnableConfigurationProperties(MyProps.class)"
      - "Use @ConfigurationPropertiesScan on a configuration class"
    answer: 0
    explanation: |
      @ConfigurationProperties beans are registered via @Component, via
      @EnableConfigurationProperties, or by scanning with
      @ConfigurationPropertiesScan. @Value is for single-property injection and
      does not register a properties bean.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-007
    difficulty: advanced
    tags: [configuration-properties, constructor-binding, spring-boot-3]
    question: |
      In Spring Boot 3.x, when is @ConstructorBinding needed on a
      @ConfigurationProperties class?
    options:
      - "Always — every properties class must be annotated with it for binding to occur at startup"
      - "Only to select which constructor to bind when the class has more than one constructor"
      - "Never — constructor binding was removed in Boot 3 in favour of setter-based binding only"
      - "Only when the class is a Java record, since records expose no default no-arg constructor"
    answer: 1
    explanation: |
      In Boot 3.x constructor binding is inferred for a class with a single
      parameterized constructor, so you don't annotate it. @ConstructorBinding is
      only needed to pick one constructor when several exist. (In Boot 2.x it was
      required on the class.)
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-008
    difficulty: intermediate
    tags: [value, configuration-properties, comparison]
    question: |
      You must bind a list app.servers and validate that app.timeout is a positive
      Duration. Which mechanism is the right fit and why?
    options:
      - "@Value, because it supports @Validated and binds a positive-Duration List<String> natively"
      - "@PropertySource, because only it can read comma-separated lists and coerce them to Duration"
      - "Environment.getProperty, because it validates the Duration bound and rejects negatives automatically"
      - "@ConfigurationProperties, because it binds collections cleanly and supports @Validated"
    answer: 3
    explanation: |
      @ConfigurationProperties binds collections/maps/nested types first-class and
      supports JSR-303 validation via @Validated. @Value handles single scalars
      and SpEL but lacks clean collection binding and easy validation.
    ref: "concepts.md#value-vs-configurationproperties"

  - id: configuration-profiles-properties-009
    difficulty: advanced
    tags: [relaxed-binding, value, gotcha]
    question: |
      Why might @Value("${my-app.page-size}") fail to pick up an environment
      variable MYAPP_PAGESIZE even though a @ConfigurationProperties field would?
    options:
      - "@Value does not perform relaxed binding; it matches the key name exactly"
      - "Environment variables are never visible to Spring's placeholder resolver at all"
      - "@Value only reads from application.yml and never consults exported environment variables"
      - "MYAPP_PAGESIZE is an invalid environment variable name that the OS refuses to export"
    answer: 0
    explanation: |
      Relaxed binding (matching kebab/camel/UPPER_UNDERSCORE forms) applies to
      @ConfigurationProperties, not @Value. @Value resolves the placeholder by
      exact key, so the env-var form does not reliably map to my-app.page-size.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-010
    difficulty: intermediate
    tags: [relaxed-binding, env-vars]
    question: |
      Which environment variable name maps to the property spring.datasource.url
      via relaxed binding?
    options:
      - "spring.datasource.url"
      - "SPRING-DATASOURCE-URL"
      - "SPRING_DATASOURCE_URL"
      - "springDatasourceUrl"
    answer: 2
    explanation: |
      For environment variables, dots and dashes become underscores and letters
      are upper-cased: spring.datasource.url -> SPRING_DATASOURCE_URL.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-011
    difficulty: beginner
    tags: [relaxed-binding, canonical-form]
    question: |
      What is the recommended canonical form to write property names in your
      configuration files?
    options:
      - "camelCase (pageSize)"
      - "kebab-case (page-size)"
      - "UPPER_UNDERSCORE (PAGE_SIZE)"
      - "PascalCase (PageSize)"
    answer: 1
    explanation: |
      Kebab-case is the recommended canonical form because it is the lowest common
      denominator that maps cleanly to all other source styles under relaxed
      binding.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-012
    difficulty: advanced
    tags: [validation, jakarta, spring-boot-3]
    question: |
      When validating @ConfigurationProperties in Spring Boot 3.x, which package
      should the constraint annotations (e.g. @NotNull, @Min) come from?
    options:
      - "javax.validation.constraints"
      - "org.springframework.validation.constraints"
      - "org.hibernate.validator.constraints only"
      - "jakarta.validation.constraints"
    answer: 3
    explanation: |
      Spring Boot 3.x is built on Jakarta EE, so Bean Validation constraints are
      imported from jakarta.validation.constraints.*. Using the old
      javax.validation.* no longer works — a very common migration break.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-013
    difficulty: intermediate
    tags: [validation, validated, gotcha]
    question: |
      You added @Min and @NotNull to a @ConfigurationProperties class but invalid
      values start the app without error. What is the most likely cause?
    options:
      - "The class is missing the @Validated annotation"
      - "Bean Validation cannot be used with configuration properties at all"
      - "You must call validate() manually in a @PostConstruct"
      - "Constraints only work on @Value fields"
    answer: 0
    explanation: |
      Constraint annotations are only enforced on a @ConfigurationProperties bean
      when the class is annotated with @Validated (and a Bean Validation provider
      like Hibernate Validator is on the classpath). Without @Validated the
      constraints are silently ignored.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-014
    difficulty: advanced
    tags: [precedence, command-line, system-properties]
    question: |
      Given: java -Dserver.port=8081 -jar app.jar --server.port=9090
      On which port does the application start?
    options:
      - "8081, because -D system properties have highest precedence"
      - "9090, because command-line (--) arguments outrank system properties"
      - "8080, the default, because the two conflicting values cancel out and are both discarded"
      - "It fails to start, because Spring Boot rejects the duplicate server.port definition"
    answer: 1
    explanation: |
      Command-line arguments (--key=value) sit near the top of the precedence
      order and outrank Java system properties (-Dkey=value). So 9090 wins.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-015
    difficulty: intermediate
    tags: [precedence, env-vars, config-files]
    question: |
      application.yml sets server.port: 8080 and an environment variable
      SERVER_PORT=8082 is exported. Which value is used?
    options:
      - "8080, because config data files always win over the surrounding OS environment"
      - "Neither; the conflicting sources throw an exception and halt startup"
      - "8082, because OS environment variables outrank config data files"
      - "A random one, since the resolution order between the two sources is non-deterministic"
    answer: 2
    explanation: |
      OS environment variables have higher precedence than config data files
      (application.properties/.yml). So SERVER_PORT=8082 overrides the file value.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-016
    difficulty: advanced
    tags: [precedence, ordering]
    question: |
      Which ordering correctly ranks these sources from LOWEST to HIGHEST
      precedence in Spring Boot?
    options:
      - "Command-line args < OS env vars < application.yml < default properties"
      - "OS env vars < command-line args < application.yml < default properties"
      - "application.yml < command-line args < OS env vars < default properties"
      - "Default properties < application.yml (config data) < OS env vars < command-line args"
    answer: 3
    explanation: |
      From lowest to highest: SpringApplication default properties, then config
      data files (application.*), then OS environment variables, then system
      properties, then command-line arguments (with a few test sources even
      higher).
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-017
    difficulty: intermediate
    tags: [precedence, system-properties, env-vars]
    question: |
      Between an OS environment variable and a Java system property (-D) that set
      the same key, which one wins?
    options:
      - "The OS environment variable"
      - "Whichever was set first chronologically"
      - "The Java system property"
      - "They must be identical or startup fails"
    answer: 2
    explanation: |
      Java system properties have higher precedence than OS environment variables
      in Spring Boot's documented ordering, so the -D value wins over the env var.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-018
    difficulty: intermediate
    tags: [config-location, external-override]
    question: |
      You place a config/ directory containing application.yml next to the
      deployable jar, and the jar also bundles application.yml. Which wins?
    options:
      - "The external ./config/application.yml overrides the bundled one"
      - "The bundled (in-jar) file always wins, since classpath resources are searched last"
      - "They are merged and every conflicting value is kept together as a list entry"
      - "Startup fails because two application.yml files with the same name are on the path"
    answer: 0
    explanation: |
      External locations (including ./config/) are searched after and override the
      classpath/in-jar copy. This is precisely how ops can drop an override file
      beside the jar without rebuilding.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-019
    difficulty: advanced
    tags: [config-location, spring-config-location]
    question: |
      What is the difference between spring.config.location and
      spring.config.additional-location?
    options:
      - "They are identical aliases that both replace the default search locations wholesale"
      - "spring.config.location replaces the default search locations; additional-location adds to them"
      - "additional-location replaces the defaults; location adds to them"
      - "Both are honoured only in test scope and are ignored entirely in production runs"
    answer: 1
    explanation: |
      spring.config.location REPLACES the default set of locations entirely, while
      spring.config.additional-location ADDS locations while keeping the defaults.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-020
    difficulty: advanced
    tags: [config-import, config-tree, kubernetes]
    question: |
      Which property, introduced in Spring Boot 2.4, is used to import external
      config files or Kubernetes-style config trees into the Environment?
    options:
      - "spring.config.include"
      - "spring.profiles.import"
      - "spring.datasource.import"
      - "spring.config.import"
    answer: 3
    explanation: |
      spring.config.import (Boot 2.4+) pulls in extra files, config trees
      (configtree:/etc/config/ for mounted K8s secrets), and external config
      systems, replacing much of the older ad-hoc loading logic.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-021
    difficulty: beginner
    tags: [env-vars, profiles]
    question: |
      Which environment variable activates the profiles "prod" and "metrics"?
    options:
      - "SPRING_PROFILES_ACTIVE=prod,metrics"
      - "SPRING_ACTIVE_PROFILES=prod,metrics"
      - "ACTIVE_PROFILES=prod metrics"
      - "SPRING_PROFILE=prod;metrics"
    answer: 0
    explanation: |
      spring.profiles.active maps to the env var SPRING_PROFILES_ACTIVE, and
      multiple profiles are comma-separated: SPRING_PROFILES_ACTIVE=prod,metrics.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-022
    difficulty: intermediate
    tags: [command-line, system-properties, distinction]
    question: |
      Which statement about -Dkey=value versus --key=value when launching a Boot
      jar is correct?
    options:
      - "-D args and -- args are interchangeable forms that Boot merges into one property source"
      - "-- sets a JVM system property while -D sets a Spring Boot command-line argument of lower precedence"
      - "-D sets a system property; -- sets a command-line argument with HIGHER precedence than -D"
      - "Only -D is read by Spring Boot; -- pairs are stripped by the launcher and never bound"
    answer: 2
    explanation: |
      -D defines a JVM system property, while -- defines a Spring Boot command-line
      argument. Command-line (--) arguments have higher precedence than system
      properties.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-023
    difficulty: intermediate
    tags: [spring-application-json]
    question: |
      What does the SPRING_APPLICATION_JSON environment variable let you do?
    options:
      - "Serialize every registered bean to a JSON document that is written to disk at startup"
      - "Provide inline JSON that is parsed and merged into the Environment as properties"
      - "Force the embedded web server to accept only application/json request bodies"
      - "Disable SnakeYAML parsing so only .properties files contribute to the Environment"
    answer: 1
    explanation: |
      SPRING_APPLICATION_JSON (or the system property) supplies an inline JSON blob
      that Boot flattens into properties and adds to the Environment, e.g.
      {"server":{"port":9000}}.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-024
    difficulty: advanced
    tags: [propertysource, precedence, gotcha]
    question: |
      Why can a @PropertySource file NOT reliably override properties like
      logging.* or spring.main.*?
    options:
      - "Those properties are marked read-only by the framework and reject any external override at runtime"
      - "@PropertySource can only parse YAML documents, so plain .properties keys like logging.* never load"
      - "logging.* and spring.main.* are configurable exclusively through OS environment variables, not files"
      - "@PropertySource is registered late (during context refresh), too low/late in precedence to affect early-read settings"
    answer: 3
    explanation: |
      @PropertySource is added while the context is refreshing, which is after some
      settings (logging, spring.main) have already been consumed and low in the
      precedence order — so it cannot influence those early-read properties.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-025
    difficulty: intermediate
    tags: [propertysource, not-found]
    question: |
      Which attribute makes @PropertySource tolerate a missing file instead of
      failing startup?
    options:
      - "ignoreResourceNotFound = true"
      - "optional = true"
      - "required = false"
      - "failFast = false"
    answer: 0
    explanation: |
      @PropertySource(value = "classpath:missing.properties",
      ignoreResourceNotFound = true) lets the application start even if the
      resource is absent.
    ref: "concepts.md#propertysource"

  - id: configuration-profiles-properties-026
    difficulty: beginner
    tags: [environment, api]
    question: |
      Which method on the Environment throws an exception if the requested property
      is missing?
    options:
      - "getProperty(String)"
      - "getRequiredProperty(String)"
      - "containsProperty(String)"
      - "getPropertyOrNull(String)"
    answer: 1
    explanation: |
      getRequiredProperty throws IllegalStateException when the key is absent,
      whereas getProperty returns null (or a supplied default). containsProperty
      just returns a boolean.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-027
    difficulty: advanced
    tags: [environment, profiles-expression]
    question: |
      What is the modern, non-deprecated way to test a profile expression like
      "prod & !legacy" via the Environment?
    options:
      - "env.acceptsProfiles(\"prod & !legacy\")"
      - "env.matchProfiles(\"prod\", \"!legacy\")"
      - "env.acceptsProfiles(Profiles.of(\"prod & !legacy\"))"
      - "env.getActiveProfiles().contains(\"prod & !legacy\")"
    answer: 2
    explanation: |
      acceptsProfiles(String...) is deprecated. Use
      acceptsProfiles(Profiles.of("prod & !legacy")), which supports the &, |, and
      ! operators with parentheses.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-028
    difficulty: advanced
    tags: [environment, post-processor, early-hook]
    question: |
      You need to add a property source EARLY, before beans are created, so it can
      influence most other configuration. Which hook is appropriate?
    options:
      - "A @Bean method returning a PropertySource, which Boot wires into the Environment first"
      - "A @PostConstruct method on any component that calls getPropertySources().addFirst(...)"
      - "@PropertySource on the main application class, which is read before any beans exist"
      - "An EnvironmentPostProcessor registered via spring.factories / imports"
    answer: 3
    explanation: |
      EnvironmentPostProcessor runs very early (before the context is created), so
      it is the correct extension point for injecting custom property sources that
      must beat most others. @PropertySource and @Bean run too late.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-029
    difficulty: beginner
    tags: [profile, conditional-beans]
    question: |
      What does @Profile("dev") on a @Bean method do?
    options:
      - "Intercepts each invocation and runs the bean's methods only when a dev-tagged HTTP request arrives"
      - "Registers the bean eagerly but destroys and unregisters it the moment the dev profile is deactivated"
      - "Registers that bean definition only when the 'dev' profile is active"
      - "Marks the bean as lazily-initialized whenever the dev profile happens to be active at startup"
    answer: 2
    explanation: |
      @Profile conditionally registers a bean definition based on active profiles.
      It is evaluated at context startup, not per request, and is a specialization
      of @Conditional.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-030
    difficulty: intermediate
    tags: [profile, expressions]
    question: |
      Which @Profile value registers a bean whenever the 'prod' profile is NOT
      active?
    options:
      - "@Profile(\"!prod\")"
      - "@Profile(\"prod\")"
      - "@Profile(\"not:prod\")"
      - "@Profile(\"prod=false\")"
    answer: 0
    explanation: |
      Profile expressions support the ! (NOT), & (AND), and | (OR) operators, so
      @Profile("!prod") activates the bean any time prod is not active.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-031
    difficulty: intermediate
    tags: [profile, conditional-on-property, distinction]
    question: |
      What is the key difference between @Profile and @ConditionalOnProperty?
    options:
      - "They are interchangeable aliases that both gate registration on the same active-profile list"
      - "@Profile keys off active profiles; @ConditionalOnProperty keys off a property's value"
      - "@Profile is honoured only in test contexts, while @ConditionalOnProperty applies only in production"
      - "@ConditionalOnProperty keys off active profiles; @Profile off a property value"
    answer: 1
    explanation: |
      @Profile decides bean registration based on which profiles are active, while
      @ConditionalOnProperty decides based on whether/what a specific property is
      set to.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-032
    difficulty: beginner
    tags: [default-profile]
    question: |
      When are beans annotated @Profile("default") active?
    options:
      - "Always, regardless of active profiles"
      - "Only when the 'default' profile is explicitly listed in spring.profiles.active"
      - "Never; 'default' is a reserved illegal profile name"
      - "Only when no other profile is active"
    answer: 3
    explanation: |
      The literal profile named 'default' applies only when no profile is active.
      Once any profile is activated, the default profile (and @Profile("default")
      beans) no longer apply.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-033
    difficulty: intermediate
    tags: [active-profiles, collision, last-wins]
    question: |
      With spring.profiles.active=dev,prod and both application-dev.yml and
      application-prod.yml defining app.url, which value wins?
    options:
      - "application-prod.yml, because the last-listed profile wins on collisions"
      - "application-dev.yml, because the first-listed profile in the active list always takes priority"
      - "Neither; a key defined in two active-profile files triggers a duplicate-binding startup error"
      - "The base application.yml value always overrides both profile-specific files on any collision"
    answer: 0
    explanation: |
      Multiple active profiles are additive, and on a property collision the
      last-listed profile wins. With dev,prod the prod value overrides the dev one.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-034
    difficulty: advanced
    tags: [active-profiles, gotcha, profile-groups]
    question: |
      Which statement about setting spring.profiles.active is correct?
    options:
      - "It can be freely set from inside a profile-specific file such as application-prod.yml"
      - "It can only be set programmatically via SpringApplication, never through any property source"
      - "It cannot be set from within a profile-specific file/document; use profile groups instead"
      - "It is silently ignored unless it is declared through a @PropertySource-annotated file"
    answer: 2
    explanation: |
      You cannot set spring.profiles.active from within a profile-specific file or a
      profile-gated document — Boot rejects/ignores it. To activate several
      profiles together, use profile groups (spring.profiles.group).
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-035
    difficulty: intermediate
    tags: [profile-specific, override]
    question: |
      With spring.profiles.active=prod, how do application.yml and
      application-prod.yml interact?
    options:
      - "Only application-prod.yml loads; application.yml is ignored"
      - "Both load; application-prod.yml overrides application.yml for the prod profile"
      - "Only application.yml loads unless the profile file is renamed"
      - "They are concatenated with prod values placed first but overridden by the base"
    answer: 1
    explanation: |
      The base application.yml always loads, and the profile-specific
      application-prod.yml loads in addition and overrides the base for the active
      profile.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-036
    difficulty: advanced
    tags: [multi-document, on-profile, spring-boot-2.4]
    question: |
      In a Boot 2.4+ multi-document YAML file, which key gates a document to a
      specific profile?
    options:
      - "spring.profiles"
      - "spring.profile.name"
      - "spring.active.profile"
      - "spring.config.activate.on-profile"
    answer: 3
    explanation: |
      Since Boot 2.4, documents are gated with spring.config.activate.on-profile.
      The older spring.profiles key inside a document is deprecated/removed.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-037
    difficulty: advanced
    tags: [profile-groups]
    question: |
      Given the config below, what happens when you start with
      --spring.profiles.active=prod?
        spring:
          profiles:
            group:
              prod: prod-db, prod-mq, monitoring
    options:
      - "prod plus prod-db, prod-mq, and monitoring are all activated"
      - "Only the prod profile is activated; the group stays inert"
      - "Startup fails because a group cannot reference other profiles"
      - "prod is ignored and only the group members activate"
    answer: 0
    explanation: |
      A profile group expands one profile into several. Activating prod also
      activates prod-db, prod-mq, and monitoring. Groups are the sanctioned way to
      turn on multiple profiles together.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-038
    difficulty: intermediate
    tags: [multi-document, properties-separator]
    question: |
      What separator introduces a new document within a single
      application.properties file (Boot 2.4+)?
    options:
      - "---"
      - "#---"
      - "==="
      - "%%%"
    answer: 1
    explanation: |
      Multi-document .properties files use #--- as the separator (Boot 2.4+),
      whereas native YAML uses the standard --- separator.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-039
    difficulty: advanced
    tags: [configuration-properties, duration, conversion]
    question: |
      A @ConfigurationProperties field of type Duration is bound from the value
      "30s". What happens?
    options:
      - "Binding fails; Duration cannot be parsed from a string"
      - "It binds to 30 milliseconds, since bare numeric-prefixed values default to the millisecond unit"
      - "It binds to 30 seconds via Boot's built-in Duration converter"
      - "It binds to a String because Duration is unsupported"
    answer: 2
    explanation: |
      Spring Boot has built-in converters for Duration ("30s", "PT10M"), DataSize
      ("10MB"), enums, and collections. "30s" binds to Duration.ofSeconds(30). Use
      @DurationUnit to set the unit for bare numbers.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-040
    difficulty: advanced
    tags: [configuration-properties, constructor-binding, gotcha]
    question: |
      Why should you avoid annotating a constructor-bound @ConfigurationProperties
      class with @Component?
    options:
      - "A class marked @Component is forbidden from declaring any explicit constructor by the container"
      - "@Component silently switches off relaxed binding, so only exact-case property keys will ever match"
      - "It forces the resulting bean into prototype scope, giving each injection point its own fresh copy"
      - "The two registration styles conflict; use @EnableConfigurationProperties or @ConfigurationPropertiesScan instead"
    answer: 3
    explanation: |
      Constructor binding relies on registration via @EnableConfigurationProperties
      or @ConfigurationPropertiesScan. Adding @Component (which creates the bean
      through normal component scanning) conflicts with constructor-binding
      registration, so the two should not be combined.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-041
    difficulty: intermediate
    tags: [precedence, test-property-source]
    question: |
      In a test, both @SpringBootTest(properties = "x=1") and
      @TestPropertySource(properties = "x=2") set x. Which wins?
    options:
      - "@SpringBootTest, value 1, because its properties attribute is applied last of the two"
      - "Neither; the two annotations register conflicting sources and the test context fails to load"
      - "@TestPropertySource, value 2"
      - "Whichever annotation is physically declared first in source order on the test class wins"
    answer: 2
    explanation: |
      @TestPropertySource has higher precedence than the properties attribute of
      @SpringBootTest in the documented ordering, so x=2 wins.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-042
    difficulty: beginner
    tags: [value, list-binding]
    question: |
      A property app.recipients=a,b,c is injected via @Value("${app.recipients}")
      into a List<String>. What is the resulting list?
    options:
      - "The list [\"a\", \"b\", \"c\"]"
      - "A single-element list [\"a,b,c\"]"
      - "An empty list because @Value cannot bind lists"
      - "A compilation error"
    answer: 0
    explanation: |
      Spring can split a comma-separated string into a List/array when injected via
      @Value, producing ["a", "b", "c"]. For richer collection binding, prefer
      @ConfigurationProperties.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-043
    difficulty: intermediate
    tags: [configuration-properties, unknown-fields, gotcha]
    question: |
      By default, what happens to a property under a @ConfigurationProperties
      prefix that does not map to any field (e.g. a typo)?
    options:
      - "Startup fails immediately with an UnknownConfigurationPropertyException naming the typo"
      - "It is silently ignored (ignoreUnknownFields defaults to true)"
      - "It is automatically collected into an implicit Map<String,Object> catch-all field"
      - "It overwrites whichever declared field has the closest matching name"
    answer: 1
    explanation: |
      Binding is tolerant by default: unknown/extra fields are ignored
      (ignoreUnknownFields = true), so a mistyped key silently does nothing.
      Metadata tooling / IDE hints help catch such typos.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-044
    difficulty: intermediate
    tags: [value, static, gotcha]
    question: |
      What happens if you place @Value("${app.key}") on a static field?
    options:
      - "It works normally; Spring supports @Value injection into static fields out of the box"
      - "It injects the value into the static field and every instance field of that name at once"
      - "It throws a compilation error because @Value is illegal on a static member"
      - "The value is not injected; @Value injection is instance-based"
    answer: 3
    explanation: |
      @Value injection is performed on instances, so annotating a static field does
      not inject the value. For values needed early/immutably, use constructor
      injection.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-045
    difficulty: advanced
    tags: [profile-expressions, and-or]
    question: |
      Which beans get registered by @Profile("prod & (us | eu)")?
    options:
      - "Only when prod is active AND at least one of us or eu is active"
      - "Any time at least one of prod, us, or eu happens to be active, treating & as OR"
      - "Only when all three profiles prod, us, and eu are simultaneously active together"
      - "Never; parentheses are rejected as invalid syntax inside profile expressions"
    answer: 0
    explanation: |
      Profile expressions support &, |, ! and parentheses. "prod & (us | eu)"
      requires prod to be active together with either us or eu.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-046
    difficulty: beginner
    tags: [environment, typed-lookup]
    question: |
      What does env.getProperty("server.port", Integer.class, 8080) return when
      server.port is not set?
    options:
      - "null, because a typed lookup ignores the trailing default argument"
      - "The String \"8080\", since the default is returned before any type conversion runs"
      - "The Integer 8080 (the supplied default)"
      - "It throws because a default is illegal with a type argument"
    answer: 2
    explanation: |
      This overload converts the property to the target type and returns the
      supplied default (8080) when the key is absent. It is a convenient typed,
      defaulted lookup.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-047
    difficulty: intermediate
    tags: [yaml, gotcha, norway-problem]
    question: |
      In YAML, why can an unquoted value like country: no cause a subtle bug?
    options:
      - "YAML rejects any bare two-letter token and demands they be written in quotes"
      - "YAML may interpret no as the boolean false (the 'Norway problem'); quote it to keep a string"
      - "no is a reserved Spring profile name and cannot appear as a property value"
      - "YAML silently converts the value no into a null, dropping the key entirely"
    answer: 1
    explanation: |
      YAML interprets some unquoted tokens (no/yes/on/off) as booleans, so
      country: no can become false — the well-known Norway problem. Quote string
      values ("no") to avoid it.
    ref: "concepts.md#applicationproperties-vs-applicationyml"

  - id: configuration-profiles-properties-048
    difficulty: advanced
    tags: [config-data, location-precedence]
    question: |
      Within the config-data tier, which of these has the HIGHEST precedence?
    options:
      - "Bundled (in-jar) application.yml"
      - "Bundled profile-specific application-{profile}.yml"
      - "External application.yml"
      - "External profile-specific application-{profile}.yml"
    answer: 3
    explanation: |
      Within config data, order is: bundled base, bundled profile-specific,
      external base, external profile-specific — with external profile-specific
      files winning (profile-specific > base, external > bundled).
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-049
    difficulty: intermediate
    tags: [command-line, disable]
    question: |
      How do you prevent Spring Boot from treating --key=value command-line
      arguments as a property source?
    options:
      - "Call SpringApplication.setAddCommandLineProperties(false)"
      - "Set spring.main.command-line-enabled=false in application.yml"
      - "Remove the main method arguments"
      - "It cannot be disabled"
    answer: 0
    explanation: |
      SpringApplication.setAddCommandLineProperties(false) disables the
      command-line argument property source so --key=value pairs are no longer
      bound.
    ref: "concepts.md#environment-variables-and-command-line-arguments"

  - id: configuration-profiles-properties-050
    difficulty: advanced
    tags: [validation, nested, cascade]
    question: |
      A @Validated @ConfigurationProperties class has a nested object field with
      its own constraints. What is required for those nested constraints to be
      checked?
    options:
      - "Nothing extra is needed; the validator recurses into nested objects automatically"
      - "The nested field must be annotated with @Valid to cascade validation"
      - "The nested class must itself be registered as a @Component for its constraints to run"
      - "You must invoke the Validator by hand in a @PostConstruct to reach the nested object"
    answer: 1
    explanation: |
      Bean Validation only cascades into a nested object when the field is
      annotated with @Valid. Without it, the nested object's constraints are not
      evaluated.
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-051
    difficulty: beginner
    tags: [profiles, active-vs-default]
    question: |
      What is the difference between an active profile and the default profile?
    options:
      - "They are two names for the same concept and behave identically at runtime"
      - "The default profile is always active in addition to whatever active profiles are set"
      - "Active profiles are currently enabled; the default profile applies only when no profile is active"
      - "Active profiles take effect only in tests, while the default profile takes effect only in production"
    answer: 2
    explanation: |
      Active profiles are the ones currently switched on (additive). The default
      profile applies only when no profile is active; once any profile is active,
      the default profile no longer applies.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-052
    difficulty: intermediate
    tags: [tests, active-profiles]
    question: |
      In a Spring test, which annotation is the idiomatic way to set the active
      profile?
    options:
      - "@Profile on the test class"
      - "@EnableProfiles(\"test\")"
      - "@TestProfile(\"test\")"
      - "@ActiveProfiles(\"test\")"
    answer: 3
    explanation: |
      @ActiveProfiles is the test-specific annotation to declare which profiles are
      active for the test's ApplicationContext, overriding file-based settings.
      @Profile only gates bean registration, it does not activate a profile.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-053
    difficulty: advanced
    tags: [env-vars, list-index, relaxed-binding]
    question: |
      Using environment variables, how would you bind the list element
      app.person.roles[0]?
    options:
      - "APP_PERSON_ROLES[0]"
      - "APP.PERSON.ROLES.0"
      - "APP_PERSON_ROLES_0_"
      - "app_person_roles_0"
    answer: 2
    explanation: |
      Environment variables cannot use brackets, so list indexes use the form
      APP_PERSON_ROLES_0_ (uppercase, underscores replacing dots and wrapping the
      index).
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-054
    difficulty: intermediate
    tags: [configuration-properties, metadata, tooling]
    question: |
      What benefit does @ConfigurationProperties have over @Value regarding IDE
      support?
    options:
      - "@ConfigurationProperties can generate metadata (via the annotation processor) enabling IDE autocomplete and docs"
      - "None; they are equivalent for tooling"
      - "@Value generates metadata but @ConfigurationProperties does not"
      - "Both require manual metadata files"
    answer: 0
    explanation: |
      The spring-boot-configuration-processor generates metadata for
      @ConfigurationProperties, giving IDE autocompletion and documentation for the
      keys. @Value does not participate in this metadata generation.
    ref: "concepts.md#value-vs-configurationproperties"

  - id: configuration-profiles-properties-055
    difficulty: advanced
    tags: [precedence, random-values]
    question: |
      What does the RandomValuePropertySource enable, and where does it sit in
      precedence?
    options:
      - "It encrypts properties and sits at the top of precedence"
      - "It generates random.* values and sits below OS environment variables"
      - "It randomizes the active profile on each restart and sits at the top of precedence"
      - "It disables all other property sources once a random seed is supplied at boot time"
    answer: 1
    explanation: |
      RandomValuePropertySource provides values like ${random.int} and
      ${random.uuid}. In the precedence list it sits below OS environment variables
      (after config data, before env vars).
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-056
    difficulty: intermediate
    tags: [profile, configuration-class]
    question: |
      What is the effect of putting @Profile("prod") on a @Configuration class
      (rather than a single @Bean)?
    options:
      - "Only the first @Bean method declared in the class respects the profile; the rest register unconditionally"
      - "It is ignored, because @Profile is only honoured on individual @Bean methods and never on a class"
      - "The class always loads, but every bean it defines is switched to lazy initialization under prod"
      - "All bean definitions in that configuration class are gated to the prod profile"
    answer: 3
    explanation: |
      When @Profile is on a @Configuration class, it gates every bean defined in
      that class — none are registered unless the profile is active.
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-057
    difficulty: expert
    tags: [configuration-properties, collections, merge-vs-replace, gotcha]
    question: |
      application.yml (bundled) defines app.servers[0]=a, app.servers[1]=b,
      app.servers[2]=c. In production an environment variable APP_SERVERS_0_=z is
      set. A @ConfigurationProperties(prefix="app") binds List<String> servers.
      What does the bound list contain at runtime?
    options:
      - "[\"z\", \"b\", \"c\"] — only index 0 is overridden, the rest merge from the file"
      - "[\"a\", \"b\", \"c\", \"z\"] — the env value is appended after the file entries"
      - "[\"z\"] — the highest-precedence source that supplies any index defines the entire list, so the file entries are dropped"
      - "[\"a\", \"b\", \"c\"] — environment variables cannot bind indexed list elements"
    answer: 2
    explanation: |
      For lists/arrays, the Binder does NOT merge indexes across sources. The single
      highest-precedence source that contributes any index wins and defines the
      whole collection. The env var (higher precedence than the file) supplies only
      index 0, so the list becomes ["z"] and the file's three entries vanish — a
      classic "list truncated in prod" bug. Maps, unlike lists, merge per key.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-058
    difficulty: expert
    tags: [configuration-properties, collections, mutable, gotcha]
    question: |
      A setter-less @ConfigurationProperties field is declared as
      private List<String> tags = List.of(); and properties set app.tags[0]=x.
      After binding, what is the value of tags?
    options:
      - "[] — binding adds into the existing instance, but List.of() is immutable so nothing is added (or it fails silently)"
      - "[\"x\"] — Boot detects the immutable List.of() and transparently swaps in a fresh ArrayList before appending"
      - "[\"x\"] — the field initializer is always discarded and a brand-new collection is created for every bind"
      - "A ConversionFailedException is thrown at startup because List.of() cannot be coerced into a bindable target"
    answer: 0
    explanation: |
      A setter-less collection binds only when pre-initialized with a MUTABLE
      implementation, because the Binder appends into the existing instance. List.of()
      is immutable, so the elements cannot be added and the field stays empty. Use
      new ArrayList<>() (or add a setter, or use constructor binding).
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-059
    difficulty: expert
    tags: [relaxed-binding, maps, case-sensitivity, gotcha]
    question: |
      A property maps to Map<String,String> labels under prefix app. The file
      contains app.labels.myKey=1 and app.labels.my-key=2. How many entries does the
      map contain and why?
    options:
      - "One entry, because relaxed binding canonicalizes both keys to 'mykey' and the last wins"
      - "One entry 'my-key', because map keys are always kebab-normalized before insertion and the camelCase form is dropped"
      - "Two entries ('myKey' and 'my-key'), because relaxed binding is NOT applied to map keys — they are taken verbatim and are case-sensitive"
      - "Startup fails with a duplicate-key error, since the Binder treats both forms as the same canonical entry and refuses it"
    answer: 2
    explanation: |
      Map keys are the big exception to relaxed binding: the key is used verbatim and
      is case-sensitive, so 'myKey' and 'my-key' are two distinct entries. Keys with
      dots or special characters must be bracketed, e.g. app.labels[my.key]. This is
      also why map keys bind poorly from environment variables.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-060
    difficulty: advanced
    tags: [precedence, per-key, environment, internals]
    question: |
      An env var sets server.port=8082 while application.yml sets app.name=shop
      (and does not set server.port). How does the Environment resolve each key?
    options:
      - "Precedence is resolved independently per key by walking the ordered sources and returning the first that contains that key: env wins server.port, the file wins app.name"
      - "The env var source, being higher precedence, hides ALL keys from lower sources, so app.name resolves to null"
      - "Both keys are flattened into one merged source at startup, so precedence order becomes irrelevant per key"
      - "The file wins both keys, because config-data files are loaded last and therefore always take priority"
    answer: 0
    explanation: |
      The Environment holds an ordered list of PropertySources and, per getProperty
      call, returns the value from the FIRST source containing that specific key. A
      high-precedence source only overrides the keys it actually defines; unrelated
      keys still resolve from lower sources. So env wins server.port and the file
      still supplies app.name.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-061
    difficulty: expert
    tags: [config-import, precedence, spring-boot-2.4]
    question: |
      application.properties contains:
        spring.application.name=base
        spring.config.import=optional:file:./override.properties
      and override.properties contains spring.application.name=imported.
      What is the resolved spring.application.name, and why?
    options:
      - "'imported', because an imported document is inserted immediately below the importing one, giving it higher precedence"
      - "'base', because the importing file is processed first and its earlier values win"
      - "It is undefined, because importing a document that redefines a logical key already set is treated as illegal"
      - "'imported', but only if override.properties is also listed on the default config-data search path"
    answer: 0
    explanation: |
      An imported document is inserted immediately BELOW (higher priority than) the
      document that declared the import, so values in override.properties take
      precedence over application.properties. The whole config-data tier still sits
      below env vars and command-line args, however.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-062
    difficulty: expert
    tags: [profiles, config-data, two-phase, internals]
    question: |
      Why can spring.profiles.active only be set in a non-profile-specific document,
      even though it is just another property?
    options:
      - "Because config data is processed in two passes: profile SELECTION is frozen after the initial no-profiles pass, before profile-specific documents are read"
      - "Because profile-specific files are stored encrypted at rest and so cannot legally contain any profile-selection keys"
      - "Because spring.profiles.active is a reserved SpEL keyword that the placeholder resolver refuses to bind twice"
      - "Because the property is only legal inside YAML documents and is rejected in profile-specific .properties files"
    answer: 0
    explanation: |
      ConfigDataEnvironmentPostProcessor first reads base documents to discover which
      profiles to activate, then does a second pass loading application-{profile}
      documents. Since selection is already frozen by the time profile-specific
      documents load, setting active/include/group/default there is disallowed and
      raises InvalidConfigDataPropertyException.
    ref: "concepts.md#config-data-loading-internals-and-failure-modes"

  - id: configuration-profiles-properties-063
    difficulty: advanced
    tags: [profiles, include, group, restrictions]
    question: |
      Which of the following may legally appear inside a document gated by
      spring.config.activate.on-profile=prod?
    options:
      - "spring.profiles.include=metrics, since include is re-evaluated per document and is allowed anywhere"
      - "spring.profiles.active=metrics, because activation keys are re-read inside every profile-gated document"
      - "spring.profiles.group.prod=prod-db, as group definitions may be declared inside the profile they name"
      - "An ordinary property such as app.datasource.url=jdbc:..."
    answer: 3
    explanation: |
      spring.profiles.active, .default, .include, and .group can ONLY be used in
      non-profile-specific documents; none may appear in a profile-gated document.
      Ordinary configuration properties, however, are exactly what such a document is
      for.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-064
    difficulty: expert
    tags: [environment-post-processor, ordering, custom-source, internals]
    question: |
      In an EnvironmentPostProcessor you want a custom property source to override
      even command-line arguments. Which call achieves that?
    options:
      - "environment.getPropertySources().addFirst(source)"
      - "environment.getPropertySources().addLast(source)"
      - "environment.getPropertySources().addAfter(\"systemEnvironment\", source)"
      - "It is impossible; command-line args always win"
    answer: 0
    explanation: |
      Precedence is determined by position in the ordered MutablePropertySources
      list; addFirst() places the source at the very top, above command-line args.
      addLast() makes it the lowest-priority default, and addAfter positions it
      relative to a named source. Command-line args are not immovable.
    ref: "concepts.md#environmentpostprocessor-vs-later-hooks-ordering-and-custom-sources"

  - id: configuration-profiles-properties-065
    difficulty: advanced
    tags: [environment-post-processor, registration, spring-boot-3]
    question: |
      Where do you register a custom EnvironmentPostProcessor so Boot 3.x discovers
      it before the ApplicationContext is created?
    options:
      - "In META-INF/spring/org.springframework.boot.env.EnvironmentPostProcessor.imports"
      - "As a @Bean method in the main @SpringBootApplication class, wired into the Environment during context refresh"
      - "By annotating the class with @Component and @Order(HIGHEST_PRECEDENCE) so it runs before other post-processors"
      - "In application.yml under a spring.factories.post-processors list that Boot scans at the very start of launch"
    answer: 0
    explanation: |
      EnvironmentPostProcessors run before the context exists, so they cannot be
      beans. Boot 2.7+/3.x discovers them via
      META-INF/spring/org.springframework.boot.env.EnvironmentPostProcessor.imports
      (the legacy META-INF/spring.factories key still works but is deprecated).
    ref: "concepts.md#environmentpostprocessor-vs-later-hooks-ordering-and-custom-sources"

  - id: configuration-profiles-properties-066
    difficulty: expert
    tags: [value, spel, placeholder, evaluation-order]
    question: |
      Given app.list=a,b,c, what does @Value("#{'${app.list}'.split(',')}") inject,
      and why does the ordering of resolution matter?
    options:
      - "[\"a\", \"b\", \"c\"], because ${...} placeholders are resolved FIRST, then the resulting string 'a,b,c' is evaluated by SpEL and split"
      - "It fails at startup, because a #{...} SpEL block and a ${...} placeholder can never be combined in one @Value"
      - "[\"${app.list}\"], because SpEL runs BEFORE placeholder resolution and so splits the literal placeholder text"
      - "\"a,b,c\" returned as a single string, because split is not exposed as a callable method by the SpEL engine"
    answer: 0
    explanation: |
      Spring expands ${...} property placeholders first, producing '#{'a,b,c'.split(',')}',
      then the SpEL engine evaluates it, calling String.split to yield ["a","b","c"].
      The fixed order (placeholder then SpEL) is why nesting a placeholder inside SpEL
      works but not the reverse.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-067
    difficulty: advanced
    tags: [value, conversion, duration, gotcha]
    question: |
      A field is declared @Value("${app.timeout:}") private Duration timeout; and
      app.timeout is not set anywhere. What happens at startup?
    options:
      - "timeout is injected as null and quietly treated as an unbounded no-timeout by the framework"
      - "timeout becomes Duration.ZERO, because an empty default is coerced to a zero-length duration"
      - "It fails with a conversion error, because the empty-string default cannot be converted to a Duration"
      - "It falls back to a hidden framework default of 30 seconds baked into the Duration converter"
    answer: 2
    explanation: |
      The empty default (:) yields an empty string, which is a valid String but not a
      valid Duration, so conversion fails. Supply a real default like ${app.timeout:30s}
      or use a wrapper/Optional. This is a subtle @Value default pitfall for typed
      targets.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-068
    difficulty: expert
    tags: [configuration-properties, refresh, snapshot, concurrency]
    question: |
      A plain (non-@RefreshScope) singleton @ConfigurationProperties bean is bound at
      startup. Later, an operator changes the backing file and triggers
      /actuator/refresh (without Spring Cloud @RefreshScope on this bean). What does
      the bean now return?
    options:
      - "The original values, because binding happens once at bean creation and the bean holds an immutable snapshot"
      - "The new values, because @ConfigurationProperties beans live-track the Environment and re-bind on every read"
      - "A mix of old and new, because the bean lazily re-reads only the keys that changed since the last refresh"
      - "It throws IllegalStateException on the next getter call, since the stale snapshot is invalidated by refresh"
    answer: 0
    explanation: |
      Ordinary @ConfigurationProperties beans are singletons bound once at creation;
      they capture a snapshot and do NOT re-read at runtime. Live updates require
      Spring Cloud's @RefreshScope (which recreates the bean and re-binds) plus an
      actuator refresh — otherwise the original values persist.
    ref: "concepts.md#concurrency-thread-safety-and-refresh"

  - id: configuration-profiles-properties-069
    difficulty: expert
    tags: [records, constructor-binding, default-value, gotcha]
    question: |
      Given a properties record component int port with NO @DefaultValue and the key
      app.port absent from all sources, what happens?
    options:
      - "port binds to 0, because the Binder falls back to the JVM primitive default when no value is present"
      - "port binds to null and is then autoboxed lazily into an Integer the first time the component is read"
      - "Binding fails, because there is no value and a primitive int cannot be null"
      - "The record is silently skipped and the properties bean is never created or registered at all"
    answer: 2
    explanation: |
      With constructor binding, an absent property binds null for the parameter unless
      @DefaultValue is present. A primitive int cannot accept null, so binding fails.
      Use @DefaultValue("0"), a wrapper Integer, or ensure the key is always present.
    ref: "concepts.md#records-immutability-and-nested-constructor-binding"

  - id: configuration-profiles-properties-070
    difficulty: advanced
    tags: [records, nested, metadata, annotation-processor]
    question: |
      What is the purpose of @NestedConfigurationProperty on a field of a
      @ConfigurationProperties class?
    options:
      - "It is required at runtime, and without it the nested object is left null because the Binder skips the field"
      - "It switches on relaxed binding for the nested object's map keys, which are otherwise matched verbatim"
      - "It hints the configuration metadata processor to treat the field as a nested properties group so IDE autocompletion works; it does not affect runtime binding"
      - "It promotes the nested object into a separate, independently-injectable Spring bean in the context"
    answer: 2
    explanation: |
      @NestedConfigurationProperty is a compile-time hint for the
      spring-boot-configuration-processor so it generates metadata for a nested type
      that it would not otherwise recognize as nested (e.g. a type from another
      package). Runtime binding of nested objects happens regardless.
    ref: "concepts.md#records-immutability-and-nested-constructor-binding"

  - id: configuration-profiles-properties-071
    difficulty: expert
    tags: [precedence, spring-application-json, system-property]
    question: |
      SPRING_APPLICATION_JSON='{"server":{"port":9000}}' is set as an env var, an OS
      env var SERVER_PORT=8082 is also set, and application.yml sets server.port=8080.
      Which port is used?
    options:
      - "8080, from the config file, because application.yml is loaded last and overrides both env-based sources"
      - "8082, the plain OS env var, because a raw SERVER_PORT variable outranks any JSON-supplied inline value"
      - "9000, because SPRING_APPLICATION_JSON sits ABOVE OS env vars and system properties in precedence"
      - "It fails at startup, because three different sources defining server.port is rejected as a conflict"
    answer: 2
    explanation: |
      SPRING_APPLICATION_JSON is ranked higher than OS environment variables and
      system properties (only command-line args and test sources are higher). So its
      server.port=9000 beats both the plain env var (8082) and the file (8080).
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-072
    difficulty: advanced
    tags: [actuator, env, origin, debugging]
    question: |
      A teammate cannot explain why app.token resolves to an unexpected value across
      several sources. What does the /actuator/env endpoint give you that helps most?
    options:
      - "It rewrites the property to the value you expected and persists the correction back to the source file"
      - "It disables every source except the highest-precedence one so the resolved value is unambiguous at runtime"
      - "It lists every PropertySource in precedence order, showing the winning value plus shadowed values per key, with sensitive keys sanitized"
      - "It shows only the final flattened key/value map, with no per-source breakdown of where each value came from"
    answer: 2
    explanation: |
      /actuator/env enumerates all PropertySources in precedence order and shows, per
      key, the winning value and the shadowed candidates — the fastest way to answer
      "why is this value what it is?". It sanitizes keys matching password/secret/key/
      token patterns.
    ref: "concepts.md#property-origin-debugging-and-the-env-actuator"

  - id: configuration-profiles-properties-073
    difficulty: expert
    tags: [config-data, optional, failure-modes]
    question: |
      spring.config.import=configserver:http://cfg:8888 is declared (no optional:
      prefix) and the config server is unreachable at startup. What happens, and how
      do you make it non-fatal?
    options:
      - "The app starts normally, because spring.config.import locations are always treated as best-effort"
      - "The app blocks and silently retries the config server on a fixed interval, never failing startup"
      - "Startup fails; prefix the location with optional: (optional:configserver:...) to degrade gracefully"
      - "Startup fails and the only fix is removing the import"
    answer: 2
    explanation: |
      A non-optional spring.config.import that cannot be resolved fails fast
      (ConfigDataResourceNotFoundException / connection failure). Prefixing with
      optional: makes the import best-effort so the app still boots if the target is
      absent or unreachable.
    ref: "concepts.md#config-data-loading-internals-and-failure-modes"

  - id: configuration-profiles-properties-074
    difficulty: advanced
    tags: [config-data, on-cloud-platform, on-profile]
    question: |
      A YAML document declares BOTH
      spring.config.activate.on-cloud-platform=kubernetes and
      spring.config.activate.on-profile=prod. When is the document active?
    options:
      - "Whenever either Kubernetes is detected OR the prod profile is active"
      - "Only when running on Kubernetes; the profile clause is ignored"
      - "Only when Kubernetes is detected AND the prod profile is active (both conditions must hold)"
      - "Never; declaring on-cloud-platform and on-profile together is a mutually-exclusive combination Boot rejects at load"
    answer: 2
    explanation: |
      Multiple activation conditions on one document are ANDed: the document activates
      only when the detected CloudPlatform is kubernetes AND at least one of the
      on-profile expressions matches (here, prod).
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-075
    difficulty: expert
    tags: [profiles, include, per-source, internals]
    question: |
      Why does the documentation warn that "the usual complex-type list-merging rules
      do not apply" to spring.profiles.include?
    options:
      - "Because spring.profiles.include is a scalar string, not a list, so merge rules never apply to it"
      - "Because spring.profiles.include was deprecated in Boot 2.4 and is now silently ignored at load time"
      - "Because spring.profiles.include can only ever hold a single profile name and rejects comma-separated values"
      - "Because spring.profiles.include is processed per property source, so each source's includes are all honored rather than the highest source replacing the list"
    answer: 3
    explanation: |
      Unlike a normal list property (where the highest-precedence source replaces the
      whole list), spring.profiles.include is evaluated for every property source, so
      includes declared in different sources all accumulate. Included profiles are also
      added before spring.profiles.active profiles.
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-076
    difficulty: expert
    tags: [value, configuration-properties, ordering, bean-lifecycle]
    question: |
      A bean has a constructor parameter @Value("${app.mode}") and, in its no-arg
      init, reads a @ConfigurationProperties bean's field. Both depend on the same
      property source. Which statement is accurate about how each obtains its value?
    options:
      - "@Value is resolved by a PropertySourcesPlaceholderConfigurer (BeanFactoryPostProcessor) during bean creation, while @ConfigurationProperties is bound by a BeanPostProcessor; both read the same fully-merged Environment"
      - "@Value re-reads each source file from disk on demand while @ConfigurationProperties reads the Environment, so the two can disagree on a value"
      - "@ConfigurationProperties is bound before the Environment is fully assembled, so it may capture stale values that @Value never sees"
      - "@Value bypasses the Environment entirely and consults only JVM system properties, ignoring config files and env vars"
    answer: 0
    explanation: |
      @Value placeholders are resolved by the auto-registered
      PropertySourcesPlaceholderConfigurer; @ConfigurationProperties is bound by
      ConfigurationPropertiesBindingPostProcessor via the Binder. Both consult the
      SAME ordered Environment, so they never disagree on a value — only on
      name-matching (exact vs relaxed).
    ref: "concepts.md#value-vs-configurationproperties"

  - id: configuration-profiles-properties-077
    difficulty: advanced
    tags: [profiles, negation, none-active, edge-case]
    question: |
      No profile is explicitly activated. A bean is annotated @Profile("!prod"). Is it
      registered?
    options:
      - "No, because with an empty active-profile set no expression — negated or not — is ever evaluated to true"
      - "Only if application-default.yml explicitly activates a profile that the negation can then be tested against"
      - "It throws an IllegalStateException, because a negation expression requires at least one profile to be active first"
      - "Yes, because 'prod' is not among the active profiles, so the negation !prod is satisfied"
    answer: 3
    explanation: |
      A negation profile expression matches when the negated profile is NOT active.
      With no profiles active, prod is not active, so !prod evaluates true and the bean
      is registered. (The literal 'default' profile being applied does not make prod
      active.)
    ref: "concepts.md#profile-and-conditional-beans"

  - id: configuration-profiles-properties-078
    difficulty: expert
    tags: [profiles, groups, default, interaction]
    question: |
      spring.profiles.group.default=audit is configured, and the app is started with
      NO explicit active profile. What profiles end up active?
    options:
      - "None, because profile groups expand only for profiles that are explicitly activated, never for the implicit default"
      - "Only audit, because expanding the default group replaces the 'default' profile with its declared members"
      - "Startup fails, because 'default' is a reserved profile name that cannot legally be used as a group key"
      - "default and audit, because the 'default' profile is active when nothing else is, and its group expands to include audit"
    answer: 3
    explanation: |
      When no profile is active, the 'default' profile applies. A profile group keyed
      on 'default' therefore expands, activating its members (audit) alongside default.
      Groups can thus layer extra profiles onto the default state.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-079
    difficulty: advanced
    tags: [config-data, location-not-found, optional]
    question: |
      spring.config.additional-location=file:/etc/myapp/ is set but that directory
      does not exist. Startup fails with ConfigDataLocationNotFoundException. Which fix
      keeps the app booting when the directory is absent?
    options:
      - "Switch to spring.config.location, which tolerates missing directories where additional-location does not"
      - "Rename the target directory to config/, since Boot only fails fast on non-standard external location names"
      - "Move the property into a profile-specific file, because location checks are skipped for profile-gated documents"
      - "Prefix with optional: e.g. optional:file:/etc/myapp/ (or set spring.config.on-not-found=ignore)"
    answer: 3
    explanation: |
      A non-optional config location that is missing fails fast by design in Boot 2.4+.
      Prefixing the location with optional: (or globally setting
      spring.config.on-not-found=ignore) tolerates the absent directory.
    ref: "concepts.md#config-data-loading-internals-and-failure-modes"

  - id: configuration-profiles-properties-080
    difficulty: expert
    tags: [precedence, propertysource, config-data]
    question: |
      A @PropertySource("classpath:extra.properties") sets app.color=blue, and the
      bundled application.properties sets app.color=red. Both files are present. Which
      value does app.color resolve to, and why?
    options:
      - "blue, because @PropertySource is loaded explicitly and therefore takes priority over application.properties"
      - "red, because config data files (application.properties) rank HIGHER in precedence than @PropertySource sources"
      - "blue, because the more specifically-named resource always wins over the generic application.properties"
      - "It is undefined; two sources defining the same key triggers a DuplicatePropertyException at startup"
    answer: 1
    explanation: |
      In Spring Boot's documented precedence, @PropertySource annotations sit BELOW the
      config-data tier (application.properties/.yml). So application.properties (higher
      priority) overrides a key defined in a @PropertySource file — a common surprise,
      since developers expect an explicitly-imported file to win. Values in
      @PropertySource only win over defaults set via setDefaultProperties.
    ref: "concepts.md#property-source-precedence-order"

  - id: configuration-profiles-properties-081
    difficulty: intermediate
    tags: [configuration-properties, bean-method, third-party]
    question: |
      You need to externalize configuration onto a third-party class you cannot
      annotate (e.g. a DataSource). What is the idiomatic approach?
    options:
      - "Subclass the third-party type and place @ConfigurationProperties on your subclass so binding applies"
      - "Inject each field individually with @Value and copy them onto the object inside a @PostConstruct method"
      - "It is impossible to externalize config for a type unless you own and can annotate its source code"
      - "Put @ConfigurationProperties(prefix=\"...\") on the @Bean factory method that creates it"
    answer: 3
    explanation: |
      @ConfigurationProperties can annotate a @Bean method, binding the matching
      properties onto the object the method returns. This is the standard way to
      externalize config for classes you do not own.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-082
    difficulty: expert
    tags: [refresh-scope, concurrency, value, spring-cloud]
    question: |
      A bean is annotated @RefreshScope and injects @Value("${feature.flag}"). After
      /actuator/refresh with a changed value, how does the bean reflect the update, and
      what consistency concern exists?
    options:
      - "The existing bean instance mutates its @Value field in place on refresh, so there is no consistency concern at all"
      - "@Value fields never refresh even under @RefreshScope; only @ConfigurationProperties beans pick up reloaded values"
      - "Refresh takes a global lock and blocks every request thread until all affected beans are rebuilt atomically"
      - "The bean is recreated lazily on next access and re-binds the @Value; an in-flight request may still hold the old instance while the new one is built"
    answer: 3
    explanation: |
      @RefreshScope disposes the bean and recreates it lazily on the next access,
      re-resolving @Value and re-binding properties from the reloaded Environment.
      Because recreation is lazy and per-proxy, a request already holding the old
      instance keeps old values — a visibility/consistency nuance to design around.
    ref: "concepts.md#concurrency-thread-safety-and-refresh"

  - id: configuration-profiles-properties-083
    difficulty: advanced
    tags: [precedence, test, active-profiles, override]
    question: |
      A test class has @SpringBootTest, application.yml sets spring.profiles.active=dev,
      and the test adds @ActiveProfiles("test"). Which profile(s) are active in the
      test context?
    options:
      - "dev and test, merged additively, because @ActiveProfiles layers on top of file-based activation"
      - "dev only, because file-based spring.profiles.active always outranks test annotations in a test context"
      - "Neither; the clash between the file profile and the annotation profile fails the context load"
      - "test — @ActiveProfiles overrides the file-based spring.profiles.active for the test context"
    answer: 3
    explanation: |
      @ActiveProfiles is the test-specific mechanism and replaces (does not merge with)
      the file-configured spring.profiles.active for that test's ApplicationContext, so
      only 'test' is active.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-084
    difficulty: expert
    tags: [multi-document, ordering, last-wins, delimiter]
    question: |
      A single application.yml has three documents in order: base (no gate),
      on-profile: dev, and on-profile: prod — each setting app.url. The app runs with
      spring.profiles.active=prod,dev. Which document's app.url wins?
    options:
      - "The prod document, because the document physically last in the file always overrides the earlier ones"
      - "The dev document, because dev is listed last in the active profiles (last-wins by profile order), overriding both base and prod"
      - "The base document, because an ungated document always overrides profile-gated ones on a collision"
      - "The prod document, because prod is treated as a more specific profile than dev and therefore wins"
    answer: 1
    explanation: |
      With multiple active profiles a last-wins-by-profile-order strategy applies:
      dev is listed last in prod,dev, so property values from the dev-activated
      document override the prod one (and both override base). Document order in the
      file is not what decides it here — active-profile order is.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-085
    difficulty: advanced
    tags: [environment, property-sources, inspection]
    question: |
      At runtime you want to programmatically inspect the exact precedence order of
      all property sources. Which API do you use?
    options:
      - "Environment.getActiveProfiles(), which returns the sources already sorted by precedence order"
      - "((ConfigurableEnvironment) env).getPropertySources() returns the ordered MutablePropertySources"
      - "Environment.getSystemProperties(), which exposes every property source keyed by its precedence rank"
      - "ApplicationContext.getBeanDefinitionNames(), which lists property-source beans in resolution order"
    answer: 1
    explanation: |
      ConfigurableEnvironment.getPropertySources() exposes the ordered
      MutablePropertySources list, letting you iterate sources in precedence order
      (and even reorder them). The plain Environment interface does not expose this.
    ref: "concepts.md#the-environment-abstraction"

  - id: configuration-profiles-properties-086
    difficulty: expert
    tags: [configuration-properties, binding-error, origin, fail-fast]
    question: |
      A @ConfigurationProperties Duration field receives the value "30 apples" from
      application-prod.yml line 12. Compared to the same value injected via @Value,
      what is the key diagnostic advantage of @ConfigurationProperties here?
    options:
      - "@ConfigurationProperties silently ignores the malformed value and leaves the field null, whereas @Value fails startup"
      - "The binding failure reports the Origin (file and line), pinpointing application-prod.yml:12, whereas @Value gives a less precise placeholder error"
      - "There is no difference; both mechanisms throw the identical stack trace with the same origin detail"
      - "@Value performs type conversion and validation, while @ConfigurationProperties binds only raw strings"
    answer: 1
    explanation: |
      Every property tracked by the config-data machinery carries an Origin, so a
      @ConfigurationProperties bind failure names the exact source file and line — a
      major debugging advantage over @Value, whose conversion error only references the
      placeholder/bean.
    ref: "concepts.md#property-origin-debugging-and-the-env-actuator"

  - id: configuration-profiles-properties-087
    difficulty: intermediate
    tags: [hooks, timing, ordering]
    question: |
      Order these extension points from EARLIEST to LATEST in the startup lifecycle:
      BeanPostProcessor, EnvironmentPostProcessor, BeanFactoryPostProcessor,
      ApplicationContextInitializer.
    options:
      - "EnvironmentPostProcessor, ApplicationContextInitializer, BeanFactoryPostProcessor, BeanPostProcessor"
      - "ApplicationContextInitializer, EnvironmentPostProcessor, BeanPostProcessor, BeanFactoryPostProcessor"
      - "BeanFactoryPostProcessor, BeanPostProcessor, EnvironmentPostProcessor, ApplicationContextInitializer"
      - "BeanPostProcessor, BeanFactoryPostProcessor, ApplicationContextInitializer, EnvironmentPostProcessor"
    answer: 0
    explanation: |
      Timeline: EnvironmentPostProcessor (pre-context) -> ApplicationContextInitializer
      (context created, not refreshed) -> BeanFactoryPostProcessor (bean defs loaded)
      -> BeanPostProcessor (beans instantiating). This ordering explains why only the
      earliest hooks can influence logging/profile activation.
    ref: "concepts.md#environmentpostprocessor-vs-later-hooks-ordering-and-custom-sources"

  - id: configuration-profiles-properties-088
    difficulty: expert
    tags: [relaxed-binding, env-var, canonical, gotcha]
    question: |
      A field pageSize under prefix myApp exists. An env var MYAPP_PAGE_SIZE is set and
      binds successfully, but MYAPP_PAGESIZE also binds. Meanwhile a property file key
      myApp.pageSize binds too. What underlying mechanism reconciles all these?
    options:
      - "Spring stores each name alias as a separate map entry and picks one non-deterministically at bind time"
      - "Relaxed binding reduces each candidate name to a canonical, lowercased, non-alphanumeric-stripped token, and matches when the canonical forms collapse to the same value"
      - "Only the exact camelCase form pageSize ever binds; the underscore and env-var variants are ignored"
      - "Environment variable names are transformed into camelCase tokens before the Binder attempts any match"
    answer: 1
    explanation: |
      The Binder compares canonical forms: names are lowercased and non-alphanumerics
      are removed for matching. myApp.pageSize, MYAPP_PAGE_SIZE, and MYAPP_PAGESIZE all
      canonicalize toward the same token as the field pageSize under myApp, so they all
      bind. Writing kebab-case in files keeps every form reconciling cleanly.
    ref: "concepts.md#relaxed-binding"

  - id: configuration-profiles-properties-089
    difficulty: advanced
    tags: [yaml, multi-document, duplicate-keys, gotcha]
    question: |
      Within a SINGLE YAML document (no --- separators), the same key server.port
      appears twice with different values. What happens when Boot loads it?
    options:
      - "The last occurrence silently wins, exactly as .properties resolves a repeated key"
      - "The YAML parser rejects the document with a duplicate-key error"
      - "Both values are merged and collected into a list under that key"
      - "The first occurrence wins and later duplicates are quietly discarded"
    answer: 1
    explanation: |
      YAML forbids duplicate keys within a document, so the SnakeYAML parser errors out
      at load time. This differs from .properties, which silently keeps the last value.
      (Across separate --- documents the keys are allowed and later documents override.)
    ref: "concepts.md#applicationproperties-vs-applicationyml"

  - id: configuration-profiles-properties-090
    difficulty: expert
    tags: [configuration-properties, ignore-unknown, fail-on-error]
    question: |
      You want a mistyped property under your prefix to FAIL the build instead of being
      silently ignored. Which approach accomplishes strict binding?
    options:
      - "Set @ConfigurationProperties(ignoreUnknownFields = true)"
      - "There is no way; unknown fields are always ignored"
      - "Use @ConfigurationProperties(ignoreInvalidFields = false) to reject unknown keys"
      - "Enable failure on unknown/invalid fields (e.g. ignoreUnknownFields=false / ignoreInvalidFields=false) so binding surfaces mismatches"
    answer: 3
    explanation: |
      Binding is tolerant by default (ignoreUnknownFields=true). Setting
      ignoreUnknownFields=false makes an unmapped key under the prefix a bind error, and
      ignoreInvalidFields controls behavior on type-mismatch. Combined with metadata
      tooling, this catches typos early. Note option A leaves the default lenient
      behavior unchanged.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-091
    difficulty: advanced
    tags: [config-location, replace-vs-add, gotcha]
    question: |
      An ops team sets spring.config.location=file:/etc/app/prod.yml expecting it to
      ADD their file. The app suddenly can't find keys that were in the bundled
      application.yml. Why?
    options:
      - "spring.config.location REPLACES the default search locations entirely, so the bundled application.yml is no longer searched"
      - "The bundled application.yml was stripped out by the Maven jar plugin during packaging, so it never shipped in the jar"
      - "prod.yml contains a YAML syntax error, so the parser aborts before any of its keys can be registered in the Environment"
      - "spring.config.location only accepts .properties files and silently ignores any .yml file you point it at"
    answer: 0
    explanation: |
      spring.config.location REPLACES the default locations wholesale — the classpath
      application.yml is no longer on the search path. To keep defaults and add a file,
      use spring.config.additional-location instead.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-092
    difficulty: expert
    tags: [profiles, group, ordering, last-wins]
    question: |
      spring.profiles.group.prod=prod-db,prod-cache and the app starts with
      spring.profiles.active=prod. Both application-prod.yml and
      application-prod-cache.yml define cache.ttl. Which consideration determines the
      winner, and what is a safe design stance?
    options:
      - "Group-member expansion order is a documented, stable contract, so prod-cache is guaranteed to override prod for any shared key on every boot"
      - "The docs do NOT guarantee intra-group ordering, so relying on prod-cache overriding prod for the same key is fragile; keep group members' keys disjoint or set the value explicitly"
      - "Alphabetical order of the profile names always decides, so prod-cache wins over prod-db and prod purely by lexical sort"
      - "The base application.yml always wins over any grouped profile, so cache.ttl must be declared there for it to take effect at all"
    answer: 1
    explanation: |
      Spring's documentation does not promise a specific ordering among group members,
      so depending on one grouped profile overriding another for the same key is
      brittle. The robust design is to keep grouped profiles' keys non-overlapping (or
      set the decisive value in an explicit, higher-precedence source).
    ref: "concepts.md#profile-specific-configuration-files-and-profile-groups"

  - id: configuration-profiles-properties-093
    difficulty: intermediate
    tags: [value, environment, visibility, gotcha]
    question: |
      True or false, with justification: @Value("${server.port}") cannot read from OS
      environment variables because @Value does not do relaxed binding.
    options:
      - "True — @Value ignores environment variables entirely and only ever consults application.yml and application.properties files"
      - "False — @Value reads the fully-merged Environment (env vars included); the relaxed-binding limitation is only about the NAME SHAPE, not which sources are visible"
      - "True — env vars are exposed only to @ConfigurationProperties beans, because only the Binder is wired into the systemEnvironment source"
      - "False — @Value reads only JVM system properties passed with -D, and never sees exported OS environment variables at all"
    answer: 1
    explanation: |
      @Value resolves placeholders against the same merged Environment as everything
      else, so env vars ARE visible. The limitation is purely about name matching: it
      matches the exact key shape and won't map alternative name forms the way relaxed
      binding does.
    ref: "concepts.md#value-annotation"

  - id: configuration-profiles-properties-094
    difficulty: expert
    tags: [configuration-properties, maps, merge, sources]
    question: |
      application.yml sets app.limits.cpu=2 and app.limits.mem=4Gi; an env var sets
      APP_LIMITS_CPU=8 (higher precedence). For a Map<String,String> limits, what is
      the resulting map?
    options:
      - "{cpu=8} — the higher-precedence source replaces the entire map wholesale, discarding the file's mem entry just like it would a list"
      - "{cpu=8, mem=4Gi} — maps merge per key across sources, so cpu is overridden while mem survives"
      - "{cpu=2, mem=4Gi} — environment variables cannot bind map keys, so the env override is dropped and the file values stand unchanged"
      - "{} — the conflicting cpu definitions across two sources cancel each other out and the map is left empty at startup"
    answer: 1
    explanation: |
      Unlike lists (replaced wholesale), maps MERGE per key across sources: the env var
      overrides the cpu entry while the mem entry from the file is preserved. Note the
      env-var key APP_LIMITS_CPU canonicalizes to the 'cpu' map key here.
    ref: "concepts.md#configurationproperties-and-type-safe-binding"

  - id: configuration-profiles-properties-095
    difficulty: advanced
    tags: [validation, constructor-binding, jakarta, cascade]
    question: |
      A record-based @Validated @ConfigurationProperties has a nested record component
      with its own @Min constraint. What is needed for the nested constraint to be
      enforced, and when does validation run?
    options:
      - "Nothing extra; nested validation always cascades automatically for records, because the validator recurses into every record component by default"
      - "@Valid on the nested component to cascade, with validation running against the constructed immutable object after binding"
      - "@Validated must be repeated on the nested record type, and validation then runs before binding against the raw property strings"
      - "Nested validation is impossible with constructor binding, because the immutable object is fully built before any constraint can fire"
    answer: 1
    explanation: |
      JSR-303 cascading requires @Valid on the nested field/component regardless of
      whether binding is setter- or constructor-based. With constructor binding the
      object is built first, then validated; a failure aborts startup (fail-fast).
    ref: "concepts.md#validation-of-configuration-properties"

  - id: configuration-profiles-properties-096
    difficulty: expert
    tags: [profiles, programmatic, additive, ordering]
    question: |
      SpringApplication.setAdditionalProfiles("audit") is called and the launch also
      passes --spring.profiles.active=prod. What is the resulting active-profile set?
    options:
      - "Only prod; programmatic profiles set in code are always overridden by the higher-precedence command-line activation and silently dropped"
      - "Only audit; setAdditionalProfiles fully replaces the command-line activation, so --spring.profiles.active=prod is ignored at launch"
      - "prod AND audit; setAdditionalProfiles ADDS to (does not replace) the profiles activated by other means"
      - "Startup fails because the two activation mechanisms conflict and Boot refuses to reconcile a code-set profile with a CLI-set one"
    answer: 2
    explanation: |
      setAdditionalProfiles is additive by design (note the name): it layers audit on
      top of whatever else activates profiles, so both prod (from the CLI) and audit are
      active. To replace rather than add, you'd manipulate ConfigurableEnvironment
      directly.
    ref: "concepts.md#active-and-default-profiles"

  - id: configuration-profiles-properties-097
    difficulty: advanced
    tags: [config-data, import, once, dedup]
    question: |
      spring.config.import=optional:classpath:shared.properties is declared in both
      application.properties and application-dev.properties (dev active). How many times
      is shared.properties actually imported into the Environment?
    options:
      - "Twice, once per declaring document, producing two stacked PropertySources with the later declaration winning on collisions"
      - "Once — an import is only processed a single time no matter how many times it is declared"
      - "Zero times, because Boot treats two identical import locations as a duplicate conflict and cancels both out"
      - "Three times, counting one extra default re-scan of the classpath that Boot performs for shared imports"
    answer: 1
    explanation: |
      Boot deduplicates imports: a given import location is processed only once
      regardless of how many documents declare it, so shared.properties contributes a
      single PropertySource.
    ref: "concepts.md#config-data-files-and-location-precedence"

  - id: configuration-profiles-properties-098
    difficulty: expert
    tags: [concurrency, environment, thread-safety, mutation]
    question: |
      Which statement about thread-safety of configuration access in a running Boot app
      is most accurate?
    options:
      - "Environment.getProperty is not thread-safe and every caller must wrap it in a synchronized block or risk reading a corrupted value"
      - "Concurrent Environment.getProperty reads are safe, but mutating getPropertySources() from multiple threads at runtime is not safe and is discouraged"
      - "@ConfigurationProperties setters should be invoked at runtime from application code to push refreshed values across all reading threads"
      - "The Environment transparently rebuilds itself from disk on every getProperty call, so a stale or torn read is impossible by construction"
    answer: 1
    explanation: |
      After startup the Environment and its PropertySources are effectively read-only;
      concurrent getProperty reads are safe. Mutating the MutablePropertySources list at
      runtime from multiple threads is not thread-safe and should be avoided outside
      controlled hooks. Setter-bound properties should be treated as write-once at
      binding time.
    ref: "concepts.md#concurrency-thread-safety-and-refresh"
