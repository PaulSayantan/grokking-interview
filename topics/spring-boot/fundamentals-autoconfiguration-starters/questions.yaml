    options:
      - "It re-signs the jar with a fresh certificate, and the embedded signature lets the JVM skip parts of bytecode verification so classes load measurably faster at startup."
      - "It converts the executable jar into a deployable WAR, rewriting the manifest and BOOT-INF layout so the artifact can be dropped into an external Tomcat webapps directory."
      - "It produces an exploded layout (an application jar plus a lib/ folder of dependency jars) that starts faster than nested-jar loading and is CDS/AOT-cache-friendly because those caches want real files on disk."
      - "It strips every third-party dependency out of the jar, leaving only your compiled application classes, and expects the container base image to supply the libraries so the layer stays smaller."
    answer: 2
    explanation: |
      The `tools` jarmode (which supersedes the deprecated `layertools`) can extract an exploded structure: an app jar plus a `lib/` directory. Running the exploded form avoids the small nested-jar read cost and, crucially, plays well with Class Data Sharing and AOT caches that require on-disk files, so it is preferred for optimized production images.
    ref: "concepts.md#fatexecutable-jar-and-layered-jar"
  - id: fundamentals-autoconfiguration-starters-083
    difficulty: expert
    tags: [fat-jar, class-loading, launcher, boot32, package]
    question: |
      Which statement about the Spring Boot fat-jar launcher is accurate for Boot 3.2+?
    options:
      - "The launcher classes moved to the org.springframework.boot.loader.launch package (e.g. JarLauncher), and the manifest's Main-Class points to the launcher while Start-Class names your application's main."
      - "In Boot 3.2 the JVM gained native support for loading classes from nested jar entries, so the custom JarLauncher and its class loader were removed and Main-Class now names your application directly."
      - "Main-Class in the manifest points straight at your @SpringBootApplication class in Boot 3.2, and Start-Class was dropped because a separate bootstrap launcher is no longer part of the fat-jar layout."
      - "The launcher unpacks the entire jar into a temp directory on every start because the JVM cannot read nested BOOT-INF/lib entries in place, and then adds those extracted files to the classpath."
    answer: 0
    explanation: |
      Boot 3.2 relocated loader classes to `org.springframework.boot.loader.launch` (e.g. `JarLauncher`). The manifest's `Main-Class` is the launcher; `Start-Class` records your real main. A custom class loader reads `BOOT-INF/lib/*.jar` in place — the JVM still cannot load nested jars natively, so the launcher remains necessary (though the exploded/`tools` layout can avoid the nested-read cost).
    ref: "concepts.md#fatexecutable-jar-and-layered-jar"
  - id: fundamentals-autoconfiguration-starters-084
    difficulty: advanced
    tags: [profiles, conditional, ordering, auto-config]
    question: |
      Why does a `@Profile("prod")`-guarded user bean still reliably cause an auto-config's `@ConditionalOnMissingBean` to back off (when prod is active), despite `@Profile` being evaluated as a condition during refresh?
    options:
      - "Because @Profile forces the guarded bean to register before the Environment is even prepared, so it always exists ahead of any auto-config condition being evaluated during refresh."
      - "Because auto-configuration is processed last; by the time its @ConditionalOnMissingBean is evaluated, the profile decision for the user bean has already been resolved and (under prod) the bean is registered."
      - "Because a @Profile-guarded bean is implicitly marked @Primary once its profile is active, so it outranks and preempts any auto-configured bean of the same type."
      - "Because @ConditionalOnMissingBean ignores the profile system entirely and only inspects the classpath for the type, so the prod bean's presence is irrelevant to its back-off decision."
    answer: 1
    explanation: |
      Auto-config runs after user configuration (deferred import). The profile condition on the user bean is settled during the earlier user-config processing, so when the auto-config's `@ConditionalOnMissingBean` runs, the (prod-active) user bean already exists and the auto-config backs off deterministically.
    ref: "concepts.md#profiles-and-environment"
  - id: fundamentals-autoconfiguration-starters-085
    difficulty: intermediate
    tags: [profiles, activation, groups]
    question: |
      What does `spring.profiles.group.prod=prod,monitoring,metrics` accomplish?
    options:
      - "It renames the prod profile itself to the compound name 'prod,monitoring,metrics', so any property document gated on plain 'prod' no longer matches after the rename."
      - "It defines a mutual-exclusion rule that disables the monitoring and metrics profiles whenever prod is active, ensuring only one of the three can contribute beans at a time."
      - "It defines a profile group so that activating 'prod' also activates 'monitoring' and 'metrics'."
      - "It only defines the load order in which the prod, monitoring, and metrics property files are read, without actually activating any of the three profiles by itself."
    answer: 2
    explanation: |
      `spring.profiles.group.<name>` expands one activated profile into a set. Activating `prod` then also activates `monitoring` and `metrics`, letting you compose related profiles with a single activation.
    ref: "concepts.md#profiles-and-environment"
  - id: fundamentals-autoconfiguration-starters-086
    difficulty: advanced
    tags: [spring-factories-loader, caching, class-loader, internals]
    question: |
      Which statement about how `SpringFactoriesLoader` operates is accurate?
    options:
      - "It reflectively scans every class visible on the classpath, checking each one for the target factory interface, and instantiates every implementation it discovers that way."
      - "It reads one META-INF/services/<interface> descriptor file per interface and instantiates the listed classes, operating byte-for-byte the same way java.util.ServiceLoader does."
      - "It reads all META-INF/spring.factories files reachable from a given ClassLoader, caches the parsed results per class loader, and can order results via @Order/Ordered."
      - "It defers instantiating any listed factory until the first HTTP request arrives, at which point it lazily reads spring.factories and constructs the implementations on demand."
    answer: 2
    explanation: |
      `SpringFactoriesLoader` aggregates entries from all `META-INF/spring.factories` files visible to the class loader, caches parsed names per class loader, and integrates with Spring ordering. It does NOT use `META-INF/services` (that's `ServiceLoader`) and does not reflectively scan the whole classpath.
    ref: "concepts.md#springfactoriesloader"
  - id: fundamentals-autoconfiguration-starters-087
    difficulty: expert
    tags: [custom-auto-config, conditional-on-class, inner-class, technique]
    question: |
      A library's `@AutoConfiguration` class must define beans that depend on an optional type `com.foo.OptionalClient` which may be absent at the consumer. Which design keeps the auto-config parseable even when the type is missing?
    options:
      - "Reference OptionalClient.class directly in a class-level @ConditionalOnClass; the JVM tolerates unresolved .class literals inside annotation attributes, so a missing type causes no error during metadata reading."
      - "List OptionalClient's fully-qualified name in the AutoConfiguration.imports file so Boot loads and links it first, guaranteeing the type is present before your auto-config's bean methods are parsed."
      - "Isolate the OptionalClient-dependent @Bean methods inside a nested @Configuration static class guarded by @ConditionalOnClass(OptionalClient.class) (or use the name attribute), so the outer class parses without linking the missing type."
      - "Add OptionalClient's library as a compile-scope dependency of the starter so the type is always present on the consumer's classpath and never actually missing, removing the need for any condition."
    answer: 2
    explanation: |
      The idiomatic technique is to place methods that reference an optional type inside a nested static `@Configuration` guarded by `@ConditionalOnClass`, or to use the String `name` attribute — so the outer auto-config's metadata can be read without linking the absent type. A direct `.class` reference in a method signature would risk a linkage error when the type is missing.
    ref: "concepts.md#writing-custom-auto-configuration"
  - id: fundamentals-autoconfiguration-starters-088
    difficulty: advanced
    tags: [custom-auto-config, proxy-bean-methods, performance, internals]
    question: |
      `@AutoConfiguration` is meta-annotated with `@Configuration(proxyBeanMethods = false)`. What is the practical implication of `proxyBeanMethods = false`?
    options:
      - "Inter-bean @Bean methods can no longer be invoked at all and must be declared static, because without CGLIB enhancement Spring cannot intercept a non-static factory-method call."
      - "Every @Bean declared in the class silently becomes prototype-scoped, since the missing CGLIB proxy is what would otherwise enforce singleton caching across method calls."
      - "The @Configuration class is not CGLIB-enhanced, so calling one @Bean method from another does NOT return the shared singleton but creates a new instance; inject dependencies as method parameters instead."
      - "It disables all @Conditional annotations on the class, because condition evaluation is implemented by the same CGLIB proxy that proxyBeanMethods=false turns off."
    answer: 2
    explanation: |
      With `proxyBeanMethods=false` (the 'lite' mode), Spring skips CGLIB subclassing for speed/startup. Inter-bean method calls are plain Java calls, so calling `beanA()` from `beanB()` yields a new object, not the container-managed singleton. Auto-config uses this mode because bean methods take dependencies as parameters rather than calling each other, so it's safe and faster.
    ref: "concepts.md#writing-custom-auto-configuration"
  - id: fundamentals-autoconfiguration-starters-089
    difficulty: expert
    tags: [custom-auto-config, ordering, before-after, failure-mode]
    question: |
      Your custom `@AutoConfiguration` defines a `DataSource` and you annotate it `@AutoConfigureBefore(DataSourceAutoConfiguration.class)` so yours wins. Yet Boot's `DataSourceAutoConfiguration` still sometimes creates the datasource. What is the most likely subtle cause?
    options:
      - "@AutoConfigureBefore only affects the order among auto-configs; if Boot's DataSourceAutoConfiguration guards its bean with @ConditionalOnMissingBean, your earlier-ordered bean should suppress it — but if your bean is itself conditional and doesn't match, Boot's runs and creates the default."
      - "@AutoConfigureBefore is silently ignored unless you also annotate the class with @Order(0), which is what actually feeds the ordering value into the DeferredImportSelector."
      - "You must register your class under the EnableAutoConfiguration key in spring.factories rather than AutoConfiguration.imports, because the imports file discards @AutoConfigureBefore ordering hints."
      - "Boot's DataSourceAutoConfiguration is declared final and sealed, so no @AutoConfigureBefore/After annotation can reposition it relative to your custom auto-config."
    answer: 0
    explanation: |
      Ordering only guarantees your auto-config is evaluated first. If your own `DataSource` bean is gated by a condition that fails to match (wrong property, missing class), your bean isn't registered, so Boot's `@ConditionalOnMissingBean`-guarded default no longer sees an existing bean and creates its own. Ordering is necessary but not sufficient — the earlier bean must actually be registered.
    ref: "concepts.md#writing-custom-auto-configuration"
  - id: fundamentals-autoconfiguration-starters-090
    difficulty: advanced
    tags: [starters, validation, boot23, trap]
    question: |
      A team upgrades from an older Boot version and their `@Valid`/`@NotNull` request-body validation silently stops firing, even though `spring-boot-starter-web` is present. What is the cause?
    options:
      - "Newer Boot requires you to opt into Bean Validation explicitly by adding @EnableValidation to the main class, and without that annotation @Valid on controller arguments is quietly skipped."
      - "Request-body validation now works only on the reactive stack, so you must migrate from spring-boot-starter-web to spring-boot-starter-webflux for @Valid/@NotNull to fire again."
      - "Since Boot 2.3, spring-boot-starter-web no longer transitively includes Bean Validation (Hibernate Validator); you must add spring-boot-starter-validation explicitly."
      - "The @Valid and @NotNull annotations were relocated into a commercial Spring add-on module, so they are no longer available in the open-source Boot distribution without a license."
    answer: 2
    explanation: |
      Boot 2.3 removed the transitive Bean Validation dependency from `spring-boot-starter-web`. Without a validator implementation on the classpath, method/argument validation quietly no-ops. Adding `spring-boot-starter-validation` (Hibernate Validator) restores it.
    ref: "concepts.md#starter-dependencies"
  - id: fundamentals-autoconfiguration-starters-091
    difficulty: advanced
    tags: [custom-starter, optional-dependency, conditional-on-class, degrade]
    question: |
      When building a custom starter that can optionally integrate with a third-party library the consumer may or may not use, what is the recommended dependency + condition strategy?
    options:
      - "Declare the third-party library as a required compile-scope dependency so it is always present on every consumer's classpath, and wire the integration beans unconditionally without any @ConditionalOnClass guards."
      - "Put the third-party library's fully-qualified name in the AutoConfiguration.imports file so Boot loads and links that library on demand only when a consumer bean actually references it at runtime."
      - "Ship two entirely separate starters, a with-integration one and a without-integration one, and require consumers to choose the right artifact, since @Conditional annotations cannot express optional dependencies."
      - "Mark the third-party library optional (so it is not forced onto consumers) and guard the beans that use it with @ConditionalOnClass, so the starter degrades gracefully when the library is absent."
    answer: 3
    explanation: |
      Best practice: make optional third-party libs `optional` (don't force them transitively) and guard the beans that need them with `@ConditionalOnClass`. If the consumer doesn't add the library, those beans simply don't activate — graceful degradation without breaking startup.
    ref: "concepts.md#creating-a-custom-starter"
  - id: fundamentals-autoconfiguration-starters-092
    difficulty: intermediate
    tags: [custom-starter, configuration-processor, additional-metadata]
    question: |
      You added `spring-boot-configuration-processor` to your autoconfigure module. Where does the generated property metadata live, and what is it for?
    options:
      - "It generates META-INF/spring-configuration-metadata.json, which IDEs use for autocompletion and documentation of your @ConfigurationProperties keys."
      - "It generates the META-INF/spring.factories file that registers your auto-configuration classes under the EnableAutoConfiguration key at build time."
      - "It generates the META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports file listing each of your auto-config classes for discovery."
      - "It generates an executable fat jar that bundles your autoconfigure module together with all of its transitive dependencies for direct java -jar execution."
    answer: 0
    explanation: |
      The annotation processor emits `META-INF/spring-configuration-metadata.json` describing your `@ConfigurationProperties` (names, types, defaults, descriptions), which IDEs consume for autocompletion and inline docs. It does not register auto-config (that's the imports file) or build jars.
    ref: "concepts.md#creating-a-custom-starter"
  - id: fundamentals-autoconfiguration-starters-093
    difficulty: advanced
    tags: [bom, dependency-management, gradle, difference]
    question: |
      In Gradle, what is the difference between applying the `io.spring.dependency-management` plugin versus using `implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.0')`?
    options:
      - "Both mechanisms automatically add every Boot-managed dependency to the build's compile and runtime classpath as transitive dependencies, so you never declare individual starters yourself once either one is applied."
      - "The dependency-management plugin emulates Maven-style dependencyManagement (including BOM import and version-property overrides via ext[...]), whereas platform() uses Gradle's native BOM support to constrain versions; both manage versions only and add nothing themselves."
      - "The platform() dependency makes your Gradle build inherit spring-boot-starter-parent and all of its plugin configuration, whereas the io.spring.dependency-management plugin only imports the raw version constraints."
      - "Only the io.spring.dependency-management plugin is capable of managing versions, while platform() merely declares the BOM coordinate and still requires you to specify an explicit version on every dependency."
    answer: 1
    explanation: |
      Both approaches only constrain/manage versions and add no dependencies on their own. The Spring plugin reproduces Maven's `dependencyManagement` semantics (and Boot's version properties); Gradle's `platform()` is the native BOM/constraint mechanism. You still declare the starters you want.
    ref: "concepts.md#dependency-and-version-management-bom"
  - id: fundamentals-autoconfiguration-starters-094
    difficulty: expert
    tags: [bom, override, transitive, downgrade, trap]
    question: |
      Under spring-boot-starter-parent, you set `<jackson.version>2.13.0</jackson.version>` to pin an older Jackson, but a build that also pulls a newer library keeps resolving a higher Jackson version. Which explanation is most accurate?
    options:
      - "Maven ignores <jackson.version> properties entirely for BOM-managed artifacts, so the only way to pin an older Jackson is to remove the spring-boot-dependencies BOM import and re-declare every Jackson module with a hard-coded version."
      - "The property override changes what the BOM MANAGES, but a transitive dependency that declares its own explicit Jackson version (not managed by the BOM) or a directly-declared version can still win by Maven's resolution rules; dependencyManagement only governs unversioned/managed declarations."
      - "Version properties such as <jackson.version> are honored only by Gradle's io.spring.dependency-management plugin and are completely inert in Maven builds, so under the Maven parent the override never takes effect at all."
      - "A matchIfMissing=true attribute must be added alongside the <jackson.version> property before Maven will apply the override, and without it the parent silently keeps resolving its own default Jackson version."
    answer: 1
    explanation: |
      Overriding the managed version property changes the version the BOM imposes on managed dependencies. But Maven's `dependencyManagement` only controls versions where they aren't otherwise pinned; an explicit version on a direct dependency, or a transitive that isn't governed by the BOM, can resolve differently (nearest-wins/explicit-wins). You may need explicit `<dependencyManagement>` entries or exclusions to truly force the version.
    ref: "concepts.md#dependency-and-version-management-bom"
  - id: fundamentals-autoconfiguration-starters-095
    difficulty: advanced
    tags: [embedded-server, war, servlet-initializer, why]
    question: |
      When packaging a Boot app as a deployable WAR for an external container, why must you extend `SpringBootServletInitializer` and override `configure(...)`?
    options:
      - "Because Spring Boot's auto-configuration is fundamentally incompatible with WAR deployment, extending SpringBootServletInitializer and overriding configure() is what switches auto-config off so the external container can wire the app itself."
      - "Because in an external container there is no main() bootstrap; SpringBootServletInitializer hooks into the servlet container's WebApplicationInitializer mechanism (via onStartup) to build the SpringApplication and register the DispatcherServlet."
      - "Because the initializer transparently converts the app's jakarta.servlet API calls back into javax.servlet at load time, letting a modern Boot 3 WAR run inside an older container that only implements the legacy servlet namespace."
      - "Because a WAR archive can never contain an embedded Tomcat, SpringBootServletInitializer.configure() swaps the embedded container out for an embedded Jetty instance that is compatible with external deployment."
    answer: 1
    explanation: |
      In external containers your `main()` isn't invoked. `SpringBootServletInitializer` implements Servlet 3.0+'s `WebApplicationInitializer`, so the container calls `onStartup`, and your overridden `configure(SpringApplicationBuilder)` supplies the primary sources to bootstrap the Spring context and register the `DispatcherServlet`. The embedded starter is set to `provided` so it doesn't clash with the container.
    ref: "concepts.md#embedded-server"
  - id: fundamentals-autoconfiguration-starters-096
    difficulty: expert
    tags: [embedded-server, servlet-factory, customization, ordering]
    question: |
      You want to programmatically tweak the embedded Tomcat (e.g. add a connector) without abandoning Boot's auto-configuration of the server. Which approach is idiomatic?
    options:
      - "Define your own TomcatServletWebServerFactory @Bean, replacing Boot's — this is the only way and it disables all server auto-config properties."
      - "Register a WebServerFactoryCustomizer<TomcatServletWebServerFactory> (or ConfigurableTomcatWebServerFactory) bean; Boot applies customizers to the auto-configured factory, so server.* properties still work and you only override what you need."
      - "Set the property server.tomcat.custom=true and then hand-edit a tomcat.xml server descriptor on disk, which Boot re-reads at refresh to apply your extra connectors."
      - "Override the DispatcherServlet bean itself and open the additional connector from inside its constructor, since the dispatcher owns the servlet container's listening sockets."
    answer: 1
    explanation: |
      `WebServerFactoryCustomizer<T>` beans are applied to the auto-configured `ServletWebServerFactory`, letting you customize incrementally while keeping `server.*` property binding intact. Defining your own factory bean is possible but replaces Boot's and forfeits its property-driven configuration — the customizer is the surgical, idiomatic hook.
    ref: "concepts.md#embedded-server"
  - id: fundamentals-autoconfiguration-starters-097
    difficulty: expert
    tags: [convention-over-configuration, jackson, auto-config, override]
    question: |
      In a `spring-boot-starter-web` app, you register your own `@Bean ObjectMapper customMapper()`. What is the effect on Boot's Jackson auto-configuration and the message converters?
    options:
      - "Boot ignores your bean entirely; the auto-configured ObjectMapper is marked @Primary and always wins for HTTP message conversion, so your customMapper is reachable only through an explicit @Qualifier injection."
      - "JacksonAutoConfiguration's ObjectMapper is guarded by @ConditionalOnMissingBean, so it backs off and your ObjectMapper is used; the MappingJackson2HttpMessageConverter then wires to your instance."
      - "You get two competing ObjectMapper beans in the context and the application fails at startup with a NoUniqueBeanDefinitionException because the message converter cannot resolve which one to use."
      - "Your bean only affects direct injection, never the HTTP layer; you must also register a MappingJackson2HttpMessageConverter manually."
    answer: 1
    explanation: |
      `JacksonAutoConfiguration` defines the `ObjectMapper` with `@ConditionalOnMissingBean`, so a user-provided `ObjectMapper` causes it to back off, and the web auto-config's Jackson message converter is wired with your instance. This is the classic 'define your own bean and Boot steps aside' pattern.
    ref: "concepts.md#convention-over-configuration"
  - id: fundamentals-autoconfiguration-starters-098
    difficulty: advanced
    tags: [spring-vs-boot, application-context, misconception]
    question: |
      Which statement best corrects the misconception that "Spring Boot makes Spring faster at runtime"?
    options:
      - "Boot rewrites the core IoC container and bean factory in ahead-of-time-compiled native code, so per-request bean lookup and dispatch are genuinely faster than plain Spring at runtime."
      - "Boot uses the same ApplicationContext and bean lifecycle as plain Spring; it accelerates SETUP (auto-config, starters, embedded server), not steady-state request handling. Runtime performance is essentially the same for equivalent bean graphs."
      - "Boot is actually slower at steady-state runtime because its auto-configuration condition evaluation is re-run on every incoming request to decide which beans to apply."
      - "Boot transparently caches every HTTP response in an in-memory store keyed by request URI, and this automatic response caching is what accounts for its runtime speedup over plain Spring."
    answer: 1
    explanation: |
      Boot is a configuration/convenience layer over the same core container. Auto-configuration runs once at startup, not per request. It reduces setup effort and boilerplate; it does not change the fundamental runtime cost of an equivalent bean graph and request pipeline.
    ref: "concepts.md#spring-vs-spring-boot"
  - id: fundamentals-autoconfiguration-starters-099
    difficulty: expert
    tags: [springbootapplication, auto-configuration-package, entity-scan, trap]
    question: |
      An app moves its `@SpringBootApplication` main class into `com.acme.app.config`, while JPA `@Entity` classes remain in `com.acme.app.domain`. Component scanning is fixed via `scanBasePackages="com.acme.app"`, but Hibernate now reports the entities as unmanaged. Why, and what fixes it?
    options:
      - "scanBasePackages also governs JPA entity scanning as well as component scanning, so the @Entity classes must be relocated into a sub-package directly beneath com.acme.app.config to be discovered."
      - "@AutoConfigurationPackage (imported by @EnableAutoConfiguration) defaults JPA entity scanning to the MAIN CLASS's package (com.acme.app.config), not scanBasePackages; add @EntityScan(\"com.acme.app.domain\") or move the main class to a root package."
      - "Hibernate discovers managed entities only from classes whose fully-qualified names are enumerated in the AutoConfiguration.imports file, so each @Entity must be added there by hand."
      - "You must annotate each @Entity class with @Component (or @Repository) so that Boot's component scan registers it as a bean and hands it to the persistence unit."
    answer: 1
    explanation: |
      Entity scanning defaults to the package registered by `@AutoConfigurationPackage`, which is the main class's package — independent of `@ComponentScan`/`scanBasePackages`. With the main class in `.config`, `.domain` isn't scanned for entities. Fix with `@EntityScan("com.acme.app.domain")` or relocate the main class to the root package.
    ref: "concepts.md#springbootapplication"
  - id: fundamentals-autoconfiguration-starters-100
    difficulty: advanced
    tags: [imports-file, autoconfiguration-annotation, boot3, requirement, trap]
    question: |
      A library author lists a plain `@Configuration` class (not `@AutoConfiguration`) in `META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports` for Boot 3.x. What is the consequence?
    options:
      - "It works identically to an @AutoConfiguration class in every respect; the @AutoConfiguration annotation is purely cosmetic and entirely optional for classes listed in the imports file."
      - "The application fails to compile because the imports mechanism enforces at build time that every listed class carries the @AutoConfiguration stereotype annotation."
      - "Classes registered via the imports file are expected to be @AutoConfiguration; a plain @Configuration will be imported but loses auto-config ordering semantics (@AutoConfigureBefore/After) and lite-mode/back-off guarantees the framework relies on — Boot's contract expects @AutoConfiguration there."
      - "Boot silently rewrites the plain @Configuration class into a @Component at load time, so it is picked up by component scanning rather than the auto-configuration import path."
    answer: 2
    explanation: |
      The imports mechanism is designed for `@AutoConfiguration` classes, which carry the ordering support and `proxyBeanMethods=false` lite semantics auto-config depends on. Registering a plain `@Configuration` there does not follow the documented contract and forfeits the auto-config ordering/behavior; use `@AutoConfiguration`.
    ref: "concepts.md#springfactories-vs-autoconfigurationimports"
  - id: fundamentals-autoconfiguration-starters-101
    difficulty: intermediate
    tags: [disabling, spring-autoconfigure-exclude, property, behavior]
    question: |
      What is a key behavioral difference between excluding an auto-config via `spring.autoconfigure.exclude` (property) versus the `exclude` attribute referencing a `.class` literal?
    options:
      - "The spring.autoconfigure.exclude property physically removes the offending auto-config JAR from the runtime classpath, whereas the exclude attribute merely marks the class as skipped while leaving the JAR loaded."
      - "The property (and excludeName) take a String FQCN and thus work even when the class is not on the classpath, whereas exclude=SomeAutoConfig.class requires a compile-time class reference and errors if the referenced class is not an auto-config candidate."
      - "There is no behavioral difference between the two; both the property and the exclude attribute require the referenced auto-config class to be present on the compile-time classpath to take effect."
      - "The spring.autoconfigure.exclude property is honored only when the test profile is active, so in production the exclusion is ignored and you must fall back to the exclude attribute."
    answer: 1
    explanation: |
      The property and `excludeName` accept string FQCNs, so they work without the class being present at compile time. The `exclude` attribute needs a `.class` literal (class on the classpath) and will error if you point it at something that isn't an auto-configuration candidate. Neither removes the JAR — they only suppress the auto-config's contribution.
    ref: "concepts.md#disabling-auto-configuration"
  - id: fundamentals-autoconfiguration-starters-102
    difficulty: expert
    tags: [run-flow, web-application-type, classpath, deduction, trap]
    question: |
      A project has BOTH spring-boot-starter-web (MVC/servlet) and spring-boot-starter-webflux on the classpath and does not set spring.main.web-application-type. Which WebApplicationType does Boot deduce, and what is the practical takeaway?
    options:
      - "REACTIVE — when both stacks are present WebFlux always takes priority, because Boot's deduction logic scans for the reactive Netty classes before it ever checks for the servlet DispatcherServlet."
      - "SERVLET — when servlet MVC classes (DispatcherServlet) are present, Boot deduces SERVLET even if WebFlux is also on the classpath; to run reactive you must explicitly set spring.main.web-application-type=reactive."
      - "NONE — detecting both the servlet and reactive stacks together is treated as an ambiguous configuration, so Boot defensively falls back to a non-web application with no embedded server."
      - "The application refuses to start and throws a WebApplicationType conflict error, because Boot forbids the servlet and reactive web stacks from coexisting on a single classpath."
    answer: 1
    explanation: |
      Boot's deduction favors SERVLET: if the servlet MVC `DispatcherServlet` class is present, it picks SERVLET regardless of WebFlux also being present. WebFlux 'wins' only when MVC is absent. Mixing both is a common accident; force the intended stack with `spring.main.web-application-type`.
    ref: "concepts.md#springapplicationrun-flow"
