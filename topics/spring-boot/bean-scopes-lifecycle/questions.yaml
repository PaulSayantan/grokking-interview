      - "The ability to register brand-new bean definitions into the registry before any singleton is instantiated"
      - "Automatic invocation of @PreDestroy and destroy-method callbacks on prototype-scoped beans at context close"
      - "getPhase() for ordering, isAutoStartup() for automatic start, and stop(Runnable) for async graceful shutdown"
    answer: 3
    explanation: |
      SmartLifecycle adds phased ordering (getPhase), automatic startup (isAutoStartup) and
