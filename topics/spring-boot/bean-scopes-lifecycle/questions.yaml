    options:
      - "Self-invocation (this.method()) bypasses the proxy, so scope/transaction semantics do not apply to internal calls"
      - "Proxies can only wrap interfaces, never concrete classes, so class-based beans cannot be proxied at all"
      - "Proxies silently double every method invocation, so each intercepted call executes the target body twice"
      - "Proxies disable dependency injection on the wrapped bean, forcing all collaborators to be set manually"
    answer: 0
    explanation: |
      Internal calls via `this` don't go through the proxy, so proxy-applied behavior
      (transactions, scope resolution) is skipped — the classic self-invocation trap.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-047
    difficulty: intermediate
