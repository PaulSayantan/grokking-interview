  - id: bean-scopes-lifecycle-048
    difficulty: beginner
    tags: [prototype, memory]
    question: |
      Regarding memory, how do prototype beans behave compared to singletons?
    options:
      - "Prototypes have a fixed, bounded memory cost just like singletons because the container pools and recycles a small set of them"
      - "Prototypes are stored permanently in the container's singleton registry and only freed when the ApplicationContext closes"
      - "Prototypes never consume heap memory because each one is stack-allocated and discarded when the creating method returns"
      - "Prototypes accumulate as more instances are created and are reclaimed by GC once unreferenced"
    answer: 3
    explanation: |
      Singletons have a fixed footprint (cached in the container). Prototypes are not
      retained by the container; each is subject to normal garbage collection once the
      client releases it.
    ref: "concepts.md#singleton-vs-prototype"

  - id: bean-scopes-lifecycle-049
    difficulty: intermediate
