      - "start() runs before the constructor completes; @PostConstruct always fires afterward, once the instance is fully constructed"
      - "They run at exactly the same moment during initializeBean, because Spring treats start() as an alias for the @PostConstruct callback"
      - "SmartLifecycle.start() runs only for prototype-scoped beans; singleton beans rely on @PostConstruct instead of the Lifecycle contract"
    answer: 0
    explanation: |
      @PostConstruct is a per-bean init callback fired during that bean's initialization.
      SmartLifecycle.start() fires later, at the end of context refresh, once all singletons
