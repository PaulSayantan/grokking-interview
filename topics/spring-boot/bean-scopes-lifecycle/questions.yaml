topic: "Bean Scopes & Lifecycle"
domain: spring-boot
topic_slug: bean-scopes-lifecycle
version: 1
questions:
  - id: bean-scopes-lifecycle-001
    difficulty: beginner
    tags: [scopes, defaults]
    question: |
      What is the default scope of a Spring bean when no @Scope annotation is specified?
    options:
      - "singleton"
      - "prototype"
      - "request"
      - "application"
    answer: 0
    explanation: |
      Beans are singleton-scoped by default: the container creates exactly one shared
      instance per bean definition and returns the same reference everywhere.
    ref: "concepts.md#bean-scopes-overview"

  - id: bean-scopes-lifecycle-002
    difficulty: beginner
    tags: [scopes, count]
    question: |
      How many built-in scopes does Spring Framework provide out of the box?
    options:
      - "Three: singleton, prototype, request"
      - "Six: singleton, prototype, request, session, application, websocket"
      - "Four: singleton, prototype, request, session"
      - "Two: singleton and prototype only"
    answer: 1
    explanation: |
      Spring ships six scopes: singleton, prototype, request, session, application and
      websocket. The last four (request/session/application/websocket) require a
      web-aware context.
    ref: "concepts.md#bean-scopes-overview"

  - id: bean-scopes-lifecycle-003
    difficulty: intermediate
    tags: [singleton, gof, semantics]
    question: |
      A candidate claims a Spring "singleton" bean is guaranteed to be the only instance
      of that class in the entire JVM. Why is this statement inaccurate?
    options:
      - "Because Spring singletons are actually created per HTTP request"
      - "Because Spring never caches singleton instances"
      - "Because a Spring singleton is one-per-container/bean-name, so multiple ApplicationContexts each get their own instance"
      - "Because singleton beans are recreated on every getBean call"
    answer: 2
    explanation: |
      Spring's singleton means one instance per container per bean name — not the GoF
      one-per-classloader/JVM. Two ApplicationContexts each hold their own instance of a
      'singleton' bean.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-lifecycle-004
    difficulty: beginner
    tags: [prototype, definition]
    question: |
      With prototype scope, when does the container create a new bean instance?
    options:
      - "Once, eagerly, at context startup"
      - "Only when the HTTP session is created"
      - "Only when context.close() is called"
      - "Every time the bean is requested via getBean or injected"
    answer: 3
    explanation: |
      A prototype yields a brand-new instance on every request (getBean or injection point
      resolution). It is not cached in the singleton registry.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-005
    difficulty: intermediate
    tags: [prototype, destruction, lifecycle]
    question: |
      Which lifecycle step does the Spring container NOT perform automatically for a
      prototype-scoped bean?
    options:
      - "Constructor instantiation"
      - "Dependency injection / property population"
      - "@PreDestroy / destroy callbacks"
      - "@PostConstruct initialization"
    answer: 2
    explanation: |
      For prototypes Spring instantiates, populates, and runs init callbacks, then hands
      the bean off and forgets it. Destruction callbacks (@PreDestroy, DisposableBean,
      destroy-method) are never invoked automatically — the client must clean up.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-006
    difficulty: intermediate
    tags: [prototype, singleton, injection]
    question: |
      A singleton bean OrderProcessor has a field `@Autowired ShoppingCart cart` where
      ShoppingCart is prototype-scoped. Each time OrderProcessor.handle() runs it uses
      `this.cart`. What actually happens?
    options:
      - "A fresh ShoppingCart is created on every handle() call"
      - "The same single ShoppingCart instance (created once at OrderProcessor creation) is reused on every call"
      - "handle() throws BeanCreationException because prototype cannot be injected"
      - "A new ShoppingCart is created only on the first call, then cached in the session"
    answer: 1
    explanation: |
      Injection resolves once, when the singleton is created, so the singleton holds a
      single prototype instance forever. To get a fresh instance per call use @Lookup,
      ObjectProvider/ObjectFactory, JSR-330 Provider, or a scoped proxy.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-007
    difficulty: intermediate
    tags: [prototype, lookup, providers]
    question: |
      Which of the following is NOT a valid way to obtain a fresh prototype instance from
      within a singleton on each use?
    options:
      - "Mark the singleton's prototype field with @Lazy alone to force per-call creation"
      - "Inject and call ObjectProvider<T>.getObject()"
      - "Use an @Lookup method"
      - "Inject javax/jakarta Provider<T> and call get()"
    answer: 0
    explanation: |
      @Lazy just delays first resolution; it still resolves once. Fresh-per-call requires
      @Lookup, ObjectProvider/ObjectFactory, JSR-330 Provider, or a scoped proxy.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-008
    difficulty: beginner
    tags: [singleton, eager, startup]
    question: |
      By default, when are singleton beans instantiated in a Spring ApplicationContext?
    options:
      - "Lazily, on first getBean call"
      - "Only when a web request arrives"
      - "Never until explicitly requested"
      - "Eagerly, during context startup (refresh)"
    answer: 3
    explanation: |
      Singletons are eagerly pre-instantiated during refresh() (preInstantiateSingletons),
      which surfaces wiring errors at startup. Use @Lazy to defer creation.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-lifecycle-009
    difficulty: intermediate
    tags: [singleton, lazy]
    question: |
      What is the primary practical benefit of eager singleton instantiation at startup?
    options:
      - "It reduces total memory usage compared to lazy beans"
      - "It fails fast — misconfiguration and wiring errors surface at startup rather than at first use"
      - "It guarantees thread safety of the beans"
      - "It automatically enables destruction callbacks for prototypes"
    answer: 1
    explanation: |
      Eager creation means dependency/wiring problems throw at context startup ('fail
      fast') instead of surfacing later during request handling.
    ref: "concepts.md#singleton-scope"

  - id: bean-scopes-lifecycle-010
    difficulty: beginner
    tags: [singleton-vs-prototype]
    question: |
      Which statement correctly contrasts singleton and prototype scopes?
    options:
      - "Prototype beans are eagerly created at startup; singletons are lazy"
      - "Both scopes have their full destruction lifecycle managed by the container"
      - "Singletons have one instance per container; prototypes create a new instance on each request"
      - "Singletons cannot hold references to other beans; prototypes can"
    answer: 2
    explanation: |
      Singleton = one shared instance per container. Prototype = new instance every
      request. Only singletons get full destruction management.
    ref: "concepts.md#singleton-vs-prototype"

  - id: bean-scopes-lifecycle-011
    difficulty: beginner
    tags: [request-scope, web]
    question: |
      A request-scoped bean lives for how long?
    options:
      - "A single HTTP request"
      - "The entire application lifetime"
      - "A single HTTP session"
      - "A single method invocation"
    answer: 0
    explanation: |
      request scope ties the bean's lifetime to one HTTP request; it is discarded when the
      request completes. It requires a web-aware context.
    ref: "concepts.md#request-session-application-scopes"

  - id: bean-scopes-lifecycle-012
    difficulty: intermediate
    tags: [request-scope, scoped-proxy, injection]
    question: |
      You inject a plain request-scoped bean directly into a singleton controller without a
      scoped proxy, and there is no active request at context startup. What is the likely
      outcome?
    options:
      - "It works fine because Spring caches a default request bean at startup"
      - "The singleton silently gets null for that dependency"
      - "The request bean is automatically promoted to singleton scope"
      - "Bean creation fails (e.g. ScopeNotActiveException/BeanCreationException) because no request scope is active when the singleton is created"
    answer: 3
    explanation: |
      Without a scoped proxy, Spring tries to resolve the actual request-scoped instance at
      singleton creation time, when no request is active, causing a scope-not-active error.
      A scoped proxy defers resolution to the active request per call.
    ref: "concepts.md#request-session-application-scopes"

  - id: bean-scopes-lifecycle-013
    difficulty: intermediate
    tags: [session-scope, application-scope]
    question: |
      What is the key difference between `application` scope and `singleton` scope?
    options:
      - "application beans are created per HTTP request; singletons are not"
      - "There is no difference; they are aliases"
      - "application scope ties the instance to the ServletContext, while singleton ties it to the Spring container"
      - "application beans are never destroyed, singletons always are"
    answer: 2
    explanation: |
      application scope is one instance per ServletContext; singleton is one per Spring
      container. They usually coincide but diverge when multiple contexts share one
      ServletContext.
    ref: "concepts.md#request-session-application-scopes"

  - id: bean-scopes-lifecycle-014
    difficulty: beginner
    tags: [scopes, web-aware]
    question: |
      Which of these scopes is available only in a web-aware application context?
    options:
      - "session"
      - "prototype"
      - "singleton"
      - "custom thread scope"
    answer: 0
    explanation: |
      request, session, application and websocket require a web-aware context. singleton
      and prototype are available in any context.
    ref: "concepts.md#request-session-application-scopes"

  - id: bean-scopes-lifecycle-015
    difficulty: intermediate
    tags: [websocket-scope]
    question: |
      The `websocket` scope binds a bean's lifetime to what?
    options:
      - "A single HTTP request"
      - "A single WebSocket session"
      - "The ServletContext"
      - "A single STOMP frame"
    answer: 1
    explanation: |
      websocket scope makes a bean live for the duration of a single WebSocket session,
      available when using Spring's WebSocket support.
    ref: "concepts.md#websocket-and-custom-scopes"

  - id: bean-scopes-lifecycle-016
    difficulty: advanced
    tags: [custom-scope, api]
    question: |
      To implement a custom scope, which interface must you implement, and how is it
      registered?
    options:
      - "Implement BeanPostProcessor and register it as a @Bean"
      - "Extend AbstractApplicationContext and override getScope"
      - "Annotate a class with @CustomScope and it auto-registers"
      - "Implement org.springframework.beans.factory.config.Scope and register it via ConfigurableBeanFactory.registerScope (e.g. CustomScopeConfigurer)"
    answer: 3
    explanation: |
      Custom scopes implement the Scope interface (get, remove, registerDestructionCallback,
      etc.) and are registered with registerScope, typically via CustomScopeConfigurer
      (a BeanFactoryPostProcessor).
    ref: "concepts.md#websocket-and-custom-scopes"

  - id: bean-scopes-lifecycle-017
    difficulty: advanced
    tags: [custom-scope, simplethreadscope]
    question: |
      Which statement about Spring's SimpleThreadScope is correct?
    options:
      - "It binds beans to the current thread but does NOT invoke destruction callbacks"
      - "It is registered by default under the name 'thread'"
      - "It is a web-only scope"
      - "It guarantees a new instance on every method call"
    answer: 0
    explanation: |
      SimpleThreadScope is thread-bound and is provided but NOT registered by default; a
      documented caveat is that it does not run destruction callbacks.
    ref: "concepts.md#websocket-and-custom-scopes"

  - id: bean-scopes-lifecycle-018
    difficulty: beginner
    tags: [thread-safety, singleton]
    question: |
      Why must developers be careful with mutable instance fields in singleton beans?
    options:
      - "Because Spring recreates the field on every request"
      - "Because the single instance is shared across all threads, so mutable state is shared and can cause race conditions"
      - "Because singletons cannot have fields at all"
      - "Because prototype beans override singleton fields"
    answer: 1
    explanation: |
      One shared instance means all threads share its mutable fields; unsynchronized
      read-modify-write across requests causes concurrency bugs. Keep singletons stateless
      or thread-safe.
    ref: "concepts.md#thread-safety-of-singletons"

  - id: bean-scopes-lifecycle-019
    difficulty: intermediate
    tags: [thread-safety, patterns]
    question: |
      Which design makes a singleton service safe for concurrent use?
    options:
      - "Store per-request data in a shared non-final instance field"
      - "Synchronize the constructor"
      - "Keep the bean stateless (only immutable injected collaborators) and confine mutable state to method-local variables"
      - "Change the scope to application"
    answer: 2
    explanation: |
      Statelessness is the idiomatic approach: hold only immutable collaborators and keep
      mutable data local to methods (stack-confined). Thread-safe types or request scope
      handle genuine per-request state.
    ref: "concepts.md#thread-safety-of-singletons"

  - id: bean-scopes-lifecycle-020
    difficulty: intermediate
    tags: [thread-safety, injected-fields]
    question: |
      Why are @Autowired-injected collaborator fields in a singleton generally safe to read
      concurrently?
    options:
      - "Spring wraps every field access in a lock"
      - "Injected fields are copied per-thread automatically"
      - "Because injected fields are always immutable objects"
      - "They are set once at startup and thereafter only read, so they behave like effectively-final references"
    answer: 3
    explanation: |
      Dependency fields are assigned once during initialization and then only read, so
      reading them concurrently is safe. The danger is mutable *state* fields, not the
      injected collaborator references.
    ref: "concepts.md#thread-safety-of-singletons"

  - id: bean-scopes-lifecycle-021
    difficulty: intermediate
    tags: [lifecycle, order]
    question: |
      During singleton initialization, in what order do these steps occur?
    options:
      - "Populate properties → Constructor → Aware interfaces → @PostConstruct"
      - "@PostConstruct → Constructor → Aware interfaces → Populate properties"
      - "Constructor → Populate properties → Aware interfaces → BeanPostProcessor before-init → @PostConstruct → BeanPostProcessor after-init"
      - "Constructor → @PostConstruct → Populate properties → Aware interfaces"
    answer: 2
    explanation: |
      The order is: instantiate (constructor) → populate/inject → Aware callbacks →
      BPP.postProcessBeforeInitialization → init callbacks (@PostConstruct etc.) →
      BPP.postProcessAfterInitialization.
    ref: "concepts.md#full-bean-lifecycle"

  - id: bean-scopes-lifecycle-022
    difficulty: intermediate
    tags: [lifecycle, init-order]
    question: |
      When a bean uses all three, what is the invocation order of the initialization
      mechanisms?
    options:
      - "init-method → afterPropertiesSet() → @PostConstruct"
      - "@PostConstruct → InitializingBean.afterPropertiesSet() → custom init-method"
      - "afterPropertiesSet() → @PostConstruct → init-method"
      - "They run in parallel with no defined order"
    answer: 1
    explanation: |
      Order: @PostConstruct first, then InitializingBean.afterPropertiesSet(), then the
      custom init-method (@Bean initMethod / XML init-method).
    ref: "concepts.md#initialization-callback-order-and-mechanisms"

  - id: bean-scopes-lifecycle-023
    difficulty: intermediate
    tags: [lifecycle, destroy-order]
    question: |
      What is the invocation order of destruction callbacks for a singleton?
    options:
      - "@PreDestroy → DisposableBean.destroy() → custom destroy-method"
      - "destroy-method → DisposableBean.destroy() → @PreDestroy"
      - "DisposableBean.destroy() → @PreDestroy → destroy-method"
      - "@PreDestroy → destroy-method → DisposableBean.destroy()"
    answer: 0
    explanation: |
      Destruction mirrors initialization: @PreDestroy → DisposableBean.destroy() → custom
      destroy-method.
    ref: "concepts.md#initialization-callback-order-and-mechanisms"

  - id: bean-scopes-lifecycle-024
    difficulty: advanced
    tags: [lifecycle, aware]
    question: |
      Which callback is invoked earliest during a bean's lifecycle among these?
    options:
      - "@PostConstruct"
      - "InitializingBean.afterPropertiesSet()"
      - "BeanPostProcessor.postProcessAfterInitialization()"
      - "BeanNameAware.setBeanName()"
    answer: 3
    explanation: |
      Aware interfaces (BeanNameAware, then BeanFactoryAware, then ApplicationContextAware,
      etc.) run after property population but before BPP before-init and @PostConstruct.
    ref: "concepts.md#full-bean-lifecycle"

  - id: bean-scopes-lifecycle-025
    difficulty: advanced
    tags: [lifecycle, aop, proxy]
    question: |
      At which lifecycle point are AOP proxies (e.g. for @Transactional) typically created
      and substituted for the raw bean?
    options:
      - "In the constructor"
      - "In BeanPostProcessor.postProcessAfterInitialization"
      - "During property population"
      - "During BeanFactoryPostProcessor.postProcessBeanFactory"
    answer: 1
    explanation: |
      Auto-proxying happens in postProcessAfterInitialization: the BPP can return a proxy
      that wraps the initialized bean, which is why it runs after init callbacks.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-scopes-lifecycle-026
    difficulty: intermediate
    tags: [lifecycle, jakarta, boot3]
    question: |
      In Spring Boot 3.x, which package provides the @PostConstruct and @PreDestroy
      annotations?
    options:
      - "javax.annotation"
      - "org.springframework.annotation"
      - "jakarta.annotation"
      - "org.springframework.beans.factory.annotation"
    answer: 2
    explanation: |
      Spring Boot 3 / Spring 6 moved to Jakarta EE 9+, so these annotations are
      jakarta.annotation.PostConstruct / PreDestroy, not javax.annotation.*.
    ref: "concepts.md#full-bean-lifecycle"

  - id: bean-scopes-lifecycle-027
    difficulty: advanced
    tags: [destroy-method, inferred]
    question: |
      For a @Bean that exposes a public close() method and no explicit destroyMethod is set,
      what does Spring do by default?
    options:
      - "It auto-detects and invokes close() (or shutdown()) as the destroy method"
      - "Nothing; you must set destroyMethod explicitly"
      - "It throws an error about ambiguous destroy methods"
      - "It calls close() only for prototype beans"
    answer: 0
    explanation: |
      @Bean uses destroyMethod = "(inferred)" by default, auto-detecting a public close() or
      shutdown() method. Set destroyMethod = "" to disable this behavior.
    ref: "concepts.md#initialization-callback-order-and-mechanisms"

  - id: bean-scopes-lifecycle-028
    difficulty: intermediate
    tags: [init, coupling, best-practice]
    question: |
      Why is @PostConstruct generally preferred over implementing InitializingBean for
      initialization logic?
    options:
      - "@PostConstruct runs faster at runtime"
      - "InitializingBean is deprecated in Spring 6"
      - "@PostConstruct can run before the constructor"
      - "InitializingBean couples your domain class to the Spring API, whereas @PostConstruct does not"
    answer: 3
    explanation: |
      afterPropertiesSet() ties the class to the Spring interface. @PostConstruct (or
      @Bean initMethod) keeps the class framework-agnostic.
    ref: "concepts.md#initialization-callback-order-and-mechanisms"

  - id: bean-scopes-lifecycle-029
    difficulty: intermediate
    tags: [beanpostprocessor, definition]
    question: |
      What does a BeanPostProcessor operate on?
    options:
      - "Bean definitions (metadata) before any instantiation"
      - "Only prototype-scoped beans"
      - "Each bean instance, around its initialization callbacks"
      - "The ServletContext lifecycle"
    answer: 2
    explanation: |
      A BeanPostProcessor intercepts every bean instance after property population, via
      postProcessBeforeInitialization and postProcessAfterInitialization.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-scopes-lifecycle-030
    difficulty: advanced
    tags: [beanpostprocessor, annotations]
    question: |
      Which Spring feature is itself implemented via BeanPostProcessors?
    options:
      - "@Autowired injection and @PostConstruct/@PreDestroy processing"
      - "@ComponentScan discovery"
      - "Property placeholder ${...} resolution"
      - "Registration of new bean definitions"
    answer: 0
    explanation: |
      AutowiredAnnotationBeanPostProcessor handles @Autowired; CommonAnnotationBeanPostProcessor
      handles @PostConstruct/@PreDestroy (and @Resource). These are BPPs.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-scopes-lifecycle-031
    difficulty: advanced
    tags: [beanpostprocessor, ordering, caveat]
    question: |
      A logging BeanPostProcessor depends on a @Transactional service bean. What is a
      well-known risk?
    options:
      - "The service will be created twice"
      - "The service is forced into early instantiation to satisfy the BPP and may skip auto-proxying (not eligible for auto-proxying warning)"
      - "The BPP will never run"
      - "Transactions will be applied to the BPP itself"
    answer: 1
    explanation: |
      BPPs are created before regular beans. A bean that a BPP depends on gets instantiated
      early, before the auto-proxy BPP is ready, so it may miss proxying — Spring logs a
      'not eligible for auto-proxying' warning.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-scopes-lifecycle-032
    difficulty: intermediate
    tags: [beanfactorypostprocessor, definition]
    question: |
      When does a BeanFactoryPostProcessor run relative to bean instantiation?
    options:
      - "After all beans are fully initialized"
      - "Once per bean instance, around initialization"
      - "Only during context shutdown"
      - "Before any bean is instantiated, operating on bean definitions"
    answer: 3
    explanation: |
      A BeanFactoryPostProcessor runs once over the whole factory before any bean is
      instantiated, so it can modify bean definitions (metadata).
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-scopes-lifecycle-033
    difficulty: intermediate
    tags: [beanfactorypostprocessor, example]
    question: |
      Which is a canonical example of a BeanFactoryPostProcessor?
    options:
      - "PropertySourcesPlaceholderConfigurer resolving ${...} placeholders"
      - "AutowiredAnnotationBeanPostProcessor"
      - "TransactionInterceptor"
      - "DispatcherServlet"
    answer: 0
    explanation: |
      PropertySourcesPlaceholderConfigurer is a BFPP that resolves ${...} placeholders in
      bean definitions before instantiation.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-scopes-lifecycle-034
    difficulty: intermediate
    tags: [bfpp, bpp, comparison]
    question: |
      Which row correctly distinguishes BeanFactoryPostProcessor (BFPP) from
      BeanPostProcessor (BPP)?
    options:
      - "BFPP operates on instances; BPP operates on definitions"
      - "BFPP operates on bean definitions before instantiation; BPP operates on bean instances around initialization"
      - "Both operate on bean instances but at different times"
      - "BFPP runs after BPP in the lifecycle"
    answer: 1
    explanation: |
      BFPP works on definitions (metadata) before any instantiation and runs once per
      factory; BPP works on each instance around its init and runs twice per bean.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-scopes-lifecycle-035
    difficulty: advanced
    tags: [bfpp, pitfall]
    question: |
      Why should a BeanFactoryPostProcessor avoid calling getBean() on business beans?
    options:
      - "getBean() is not available inside a BFPP"
      - "It would create a prototype instead of a singleton"
      - "It would instantiate those beans too early, bypassing other BFPPs and BPPs"
      - "It would deadlock the container permanently"
    answer: 2
    explanation: |
      A BFPP runs before instantiation; triggering getBean forces premature instantiation,
      so those beans may miss processing by other BFPPs/BPPs.
    ref: "concepts.md#beanfactorypostprocessor"

  - id: bean-scopes-lifecycle-036
    difficulty: advanced
    tags: [bdrpp, definition]
    question: |
      What capability does BeanDefinitionRegistryPostProcessor add beyond a plain
      BeanFactoryPostProcessor?
    options:
      - "It can create bean instances during shutdown"
      - "It can only read definitions, not modify them"
      - "It runs after all beans are instantiated"
      - "It can register brand-new bean definitions via postProcessBeanDefinitionRegistry"
    answer: 3
    explanation: |
      BeanDefinitionRegistryPostProcessor extends BFPP and adds
      postProcessBeanDefinitionRegistry, which can register new bean definitions (not just
      modify existing ones).
    ref: "concepts.md#beandefinitionregistrypostprocessor"

  - id: bean-scopes-lifecycle-037
    difficulty: advanced
    tags: [bdrpp, ordering]
    question: |
      Within the BeanDefinitionRegistryPostProcessor contract, which callback runs first?
    options:
      - "postProcessBeanFactory"
      - "postProcessBeforeInitialization"
      - "postProcessBeanDefinitionRegistry"
      - "afterPropertiesSet"
    answer: 2
    explanation: |
      postProcessBeanDefinitionRegistry (register new definitions) runs before
      postProcessBeanFactory (modify existing definitions).
    ref: "concepts.md#beandefinitionregistrypostprocessor"

  - id: bean-scopes-lifecycle-038
    difficulty: advanced
    tags: [bdrpp, configuration]
    question: |
      Which core Spring component is a BeanDefinitionRegistryPostProcessor responsible for
      processing @Configuration, @ComponentScan and @Bean methods?
    options:
      - "CommonAnnotationBeanPostProcessor"
      - "ConfigurationClassPostProcessor"
      - "PropertySourcesPlaceholderConfigurer"
      - "DefaultListableBeanFactory"
    answer: 1
    explanation: |
      ConfigurationClassPostProcessor is a BeanDefinitionRegistryPostProcessor that parses
      @Configuration classes and registers the @Bean/@ComponentScan-derived definitions.
    ref: "concepts.md#beandefinitionregistrypostprocessor"

  - id: bean-scopes-lifecycle-039
    difficulty: advanced
    tags: [processors, ordering]
    question: |
      What is the correct overall order of these container phases during refresh()?
    options:
      - "BDRPP.postProcessBeanDefinitionRegistry → BFPP.postProcessBeanFactory → bean instantiation → BPP before/after-init callbacks"
      - "BPP callbacks → bean instantiation → BFPP → BDRPP"
      - "Bean instantiation → BDRPP → BFPP → BPP"
      - "BFPP → BDRPP → BPP → bean instantiation"
    answer: 0
    explanation: |
      First register definitions (BDRPP), then modify definitions (BFPP), then instantiate
      beans, then run per-bean BPP callbacks around each bean's initialization.
    ref: "concepts.md#beandefinitionregistrypostprocessor"

  - id: bean-scopes-lifecycle-040
    difficulty: intermediate
    tags: [smartlifecycle, definition]
    question: |
      What does SmartLifecycle add over the plain Lifecycle interface?
    options:
      - "Nothing; it is a marker interface"
      - "The ability to register new bean definitions"
      - "Automatic destruction of prototype beans"
      - "getPhase() for ordering, isAutoStartup() for automatic start, and stop(Runnable) for async graceful shutdown"
    answer: 3
    explanation: |
      SmartLifecycle adds phased ordering (getPhase), automatic startup (isAutoStartup) and
      graceful async stop via stop(Runnable callback).
    ref: "concepts.md#smartlifecycle"

  - id: bean-scopes-lifecycle-041
    difficulty: advanced
    tags: [smartlifecycle, phase]
    question: |
      For SmartLifecycle components with different phases, what is the startup/shutdown
      ordering?
    options:
      - "Higher phases start first; lower phases stop first"
      - "Lower phases start first; higher phases stop first (reverse order)"
      - "Phases only affect startup, not shutdown"
      - "Ordering is random unless @Order is added"
    answer: 1
    explanation: |
      On startup, lower phase values start first; on shutdown the order reverses so higher
      phases stop first. Default SmartLifecycle phase is Integer.MAX_VALUE.
    ref: "concepts.md#smartlifecycle"

  - id: bean-scopes-lifecycle-042
    difficulty: advanced
    tags: [smartlifecycle, autostartup]
    question: |
      If a SmartLifecycle bean's isAutoStartup() returns true, when is start() called?
    options:
      - "Only when you explicitly call context.start()"
      - "During the bean's constructor"
      - "Automatically at the end of context refresh, without an explicit context.start()"
      - "It is never called automatically"
    answer: 2
    explanation: |
      With isAutoStartup() = true the LifecycleProcessor starts the component automatically
      at the end of refresh; you don't need to call context.start() manually.
    ref: "concepts.md#smartlifecycle"

  - id: bean-scopes-lifecycle-043
    difficulty: advanced
    tags: [smartlifecycle, vs-postconstruct]
    question: |
      How does SmartLifecycle.start() differ in timing from @PostConstruct?
    options:
      - "@PostConstruct runs during individual bean initialization; SmartLifecycle.start() runs after the whole context is initialized"
      - "start() runs before the constructor; @PostConstruct runs after"
      - "They run at exactly the same time"
      - "SmartLifecycle.start() runs only for prototype beans"
    answer: 0
    explanation: |
      @PostConstruct is a per-bean init callback fired during that bean's initialization.
      SmartLifecycle.start() fires later, at the end of context refresh, once all singletons
      are ready — ideal for starting listeners/servers.
    ref: "concepts.md#smartlifecycle"

  - id: bean-scopes-lifecycle-044
    difficulty: intermediate
    tags: [scoped-proxy, cglib, jdk]
    question: |
      With @Scope(value="request", proxyMode=ScopedProxyMode.TARGET_CLASS), what kind of
      proxy is created?
    options:
      - "A JDK dynamic proxy based on interfaces"
      - "No proxy; the bean is injected directly"
      - "A serialization-based proxy"
      - "A CGLIB subclass proxy of the target class"
    answer: 3
    explanation: |
      TARGET_CLASS uses CGLIB to create a subclass proxy (target class/methods must not be
      final). INTERFACES would use a JDK dynamic proxy instead.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-045
    difficulty: advanced
    tags: [scoped-proxy, mechanics]
    question: |
      How does a scoped proxy deliver the correct short-lived instance to a singleton on
      each call?
    options:
      - "It caches one instance at startup and reuses it"
      - "It creates a new singleton per thread"
      - "The proxy holds no target state and, on each invocation, looks up the active instance from the Scope (e.g. current RequestAttributes)"
      - "It copies the bean's fields into the singleton"
    answer: 2
    explanation: |
      The scoped proxy is stateless; every method call resolves the currently-active
      instance from the relevant Scope, so a singleton always talks to the right
      request/session bean.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-046
    difficulty: advanced
    tags: [scoped-proxy, self-invocation, trap]
    question: |
      A scoped/transactional proxy shares a well-known limitation with @Transactional. What
      is it?
    options:
      - "Self-invocation (this.method()) bypasses the proxy, so scope/transaction semantics do not apply to internal calls"
      - "Proxies cannot wrap classes, only interfaces"
      - "Proxies double every method invocation"
      - "Proxies disable dependency injection"
    answer: 0
    explanation: |
      Internal calls via `this` don't go through the proxy, so proxy-applied behavior
      (transactions, scope resolution) is skipped — the classic self-invocation trap.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-047
    difficulty: intermediate
    tags: [annotations, requestscope]
    question: |
      What is the composed annotation @RequestScope equivalent to?
    options:
      - "@Scope(\"request\") with no proxy"
      - "@Scope(value=\"request\", proxyMode=ScopedProxyMode.TARGET_CLASS)"
      - "@Scope(\"singleton\")"
      - "@Scope(value=\"session\", proxyMode=INTERFACES)"
    answer: 1
    explanation: |
      @RequestScope (and @SessionScope, @ApplicationScope) are convenience meta-annotations
      that default proxyMode to TARGET_CLASS.
    ref: "concepts.md#request-session-application-scopes"

  - id: bean-scopes-lifecycle-048
    difficulty: beginner
    tags: [prototype, memory]
    question: |
      Regarding memory, how do prototype beans behave compared to singletons?
    options:
      - "Prototypes have a fixed memory cost like singletons"
      - "Prototypes are stored permanently in the container registry"
      - "Prototypes never consume heap memory"
      - "Prototypes accumulate as more instances are created and are reclaimed by GC once unreferenced"
    answer: 3
    explanation: |
      Singletons have a fixed footprint (cached in the container). Prototypes are not
      retained by the container; each is subject to normal garbage collection once the
      client releases it.
    ref: "concepts.md#singleton-vs-prototype"

  - id: bean-scopes-lifecycle-049
    difficulty: intermediate
    tags: [prototype, cleanup]
    question: |
      A prototype bean holds a resource that needs closing. Since Spring won't call its
      @PreDestroy, what is a reasonable approach?
    options:
      - "Have the client close it explicitly, or use a custom BeanPostProcessor / configurable destruction hook to manage cleanup"
      - "Change it to singleton scope so destroy runs"
      - "Do nothing; Spring always closes resources"
      - "Rely on request scope to close it"
    answer: 0
    explanation: |
      Because the container doesn't manage prototype destruction, the client must clean up,
      or you introduce a custom BPP/destruction callback to handle it.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-050
    difficulty: advanced
    tags: [lifecycle, aware, order]
    question: |
      Among the Aware callbacks, which runs before the others listed here?
    options:
      - "ApplicationContextAware.setApplicationContext"
      - "BeanNameAware.setBeanName"
      - "MessageSourceAware.setMessageSource"
      - "ApplicationEventPublisherAware"
    answer: 1
    explanation: |
      BeanNameAware runs first, followed by BeanClassLoaderAware and BeanFactoryAware, then
      the ApplicationContext-level Aware callbacks (Environment, ResourceLoader,
      ApplicationEventPublisher, MessageSource, ApplicationContext).
    ref: "concepts.md#full-bean-lifecycle"

  - id: bean-scopes-lifecycle-051
    difficulty: beginner
    tags: [scope, annotation-syntax]
    question: |
      Which annotation correctly declares a prototype-scoped component?
    options:
      - "@Component @Prototype"
      - "@Bean(scope=\"prototype\")"
      - "@Component @Scope(\"prototype\")"
      - "@Component @Lazy(\"prototype\")"
    answer: 2
    explanation: |
      Use @Scope("prototype") (or @Scope(ConfigurableBeanFactory.SCOPE_PROTOTYPE)) on the
      component. There is no @Prototype annotation.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-052
    difficulty: intermediate
    tags: [lifecycle, disposablebean]
    question: |
      Which interface would you implement to run cleanup logic when a singleton bean is
      destroyed (coupling to Spring aside)?
    options:
      - "InitializingBean"
      - "SmartLifecycle"
      - "BeanNameAware"
      - "DisposableBean"
    answer: 3
    explanation: |
      DisposableBean.destroy() is the interface-based destruction callback (runs after
      @PreDestroy). InitializingBean is for init, not destroy.
    ref: "concepts.md#initialization-callback-order-and-mechanisms"

  - id: bean-scopes-lifecycle-053
    difficulty: advanced
    tags: [scenario, prototype-in-singleton, lookup]
    question: |
      Given this code, what is the effect?
      ```java
      @Component
      public abstract class ReportRunner {
          @Lookup
          protected abstract ReportJob createJob(); // ReportJob is @Scope("prototype")
          public void run() { createJob().execute(); }
      }
      ```
    options:
      - "Compilation fails because the class is abstract"
      - "createJob() always returns the same cached instance"
      - "Spring overrides createJob() at runtime so each call returns a fresh prototype ReportJob"
      - "run() throws because @Lookup only works on singletons"
    answer: 2
    explanation: |
      @Lookup (method injection) makes Spring generate a CGLIB override of createJob() that
      returns a new prototype instance on each call — the idiomatic fix for
      prototype-in-singleton.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-054
    difficulty: intermediate
    tags: [scenario, thread-safety]
    question: |
      A team reports intermittent wrong totals from this singleton bean under load:
      ```java
      @Service
      class CartTotals {
          private BigDecimal total = BigDecimal.ZERO;
          public BigDecimal add(BigDecimal x){ total = total.add(x); return total; }
      }
      ```
      What is the root cause and best fix?
    options:
      - "The bean should be prototype; change the scope only"
      - "The shared mutable field `total` is mutated concurrently across threads; make the bean stateless (pass/return values, no shared field) or use per-request/thread state"
      - "BigDecimal is not supported in singletons; switch to double"
      - "Add @PostConstruct to reset total on each call"
    answer: 1
    explanation: |
      One shared singleton instance means `total` is shared across all threads; concurrent
      read-modify-write corrupts it. The fix is statelessness (compute from parameters and
      return) or request/thread-scoped state, not scope changes to prototype alone.
    ref: "concepts.md#thread-safety-of-singletons"

  - id: bean-scopes-lifecycle-055
    difficulty: advanced
    tags: [scenario, lifecycle-order]
    question: |
      A bean implements BeanNameAware, InitializingBean and has a @PostConstruct method plus
      a @Bean(initMethod="setup"). Which sequence is correct?
    options:
      - "setBeanName → @PostConstruct → afterPropertiesSet → setup"
      - "@PostConstruct → setBeanName → setup → afterPropertiesSet"
      - "setBeanName → afterPropertiesSet → @PostConstruct → setup"
      - "setup → setBeanName → @PostConstruct → afterPropertiesSet"
    answer: 0
    explanation: |
      Aware callbacks (setBeanName) run first, then init callbacks in order: @PostConstruct
      → InitializingBean.afterPropertiesSet() → custom init-method (setup).
    ref: "concepts.md#full-bean-lifecycle"

  - id: bean-scopes-lifecycle-056
    difficulty: intermediate
    tags: [scoped-proxy, interfaces]
    question: |
      When would you choose ScopedProxyMode.INTERFACES over TARGET_CLASS?
    options:
      - "Never; INTERFACES is deprecated"
      - "Only for singleton beans"
      - "When you want to avoid dependency injection entirely"
      - "When the bean class is final and cannot be subclassed, but implements interfaces you inject by"
    answer: 3
    explanation: |
      INTERFACES uses a JDK dynamic proxy, appropriate when injecting by interface and/or
      when CGLIB subclassing isn't possible (final class). TARGET_CLASS (CGLIB) is used for
      class-based proxying.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-057
    difficulty: intermediate
    tags: [processors, ordering]
    question: |
      When multiple BeanPostProcessors or BeanFactoryPostProcessors are registered, how is
      their relative order controlled?
    options:
      - "Alphabetically by bean name"
      - "Via PriorityOrdered / Ordered interfaces or @Order (PriorityOrdered first, then Ordered, then the rest)"
      - "By declaration order in application.properties"
      - "Order cannot be controlled"
    answer: 1
    explanation: |
      Processors implementing PriorityOrdered run first, then those implementing Ordered,
      then unordered ones. @Order/getOrder() sets the value within a group.
    ref: "concepts.md#beanpostprocessor"

  - id: bean-scopes-lifecycle-058
    difficulty: beginner
    tags: [singleton, gof, follow-up]
    question: |
      Two separate ApplicationContexts are created in the same JVM, each defining a
      singleton bean of type Foo. How many Foo instances exist?
    options:
      - "One, shared across both contexts"
      - "Zero until getBean is called"
      - "Two, one per container"
      - "Unlimited"
    answer: 2
    explanation: |
      Spring singletons are per-container. Two contexts each create their own Foo instance,
      confirming Spring's singleton is not the JVM-wide GoF singleton.
    ref: "concepts.md#singleton-scope"
