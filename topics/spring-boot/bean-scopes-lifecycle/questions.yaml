          protected abstract ReportJob createJob(); // ReportJob is @Scope("prototype")
          public void run() { createJob().execute(); }
      }
      ```
    options:
      - "Compilation fails because an abstract class annotated @Component cannot be registered as a Spring bean definition"
      - "createJob() always returns the same cached ReportJob because @Lookup resolves the prototype only once, at first invocation"
      - "Spring overrides createJob() at runtime so each call returns a fresh prototype ReportJob"
      - "run() throws at runtime because @Lookup method injection is only honored on singleton-scoped return types, not prototypes"
    answer: 2
    explanation: |
