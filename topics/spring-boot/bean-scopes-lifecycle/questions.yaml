    options:
      - "A JDK dynamic proxy generated from all interfaces the target class implements"
      - "No proxy at all; the request-scoped bean is injected directly and re-resolved per call"
      - "A serialization-based proxy that snapshots the target's state to disk between requests"
      - "A CGLIB subclass proxy of the target class"
    answer: 3
    explanation: |
      TARGET_CLASS uses CGLIB to create a subclass proxy (target class/methods must not be
      final). INTERFACES would use a JDK dynamic proxy instead.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-045
    difficulty: advanced
    tags: [scoped-proxy, mechanics]
    question: |
      How does a scoped proxy deliver the correct short-lived instance to a singleton on
      each call?
    options:
      - "It eagerly caches one target instance at context startup and reuses that same object on every subsequent call"
      - "It creates and pins a separate short-lived instance per worker thread using an internal ThreadLocal registry"
      - "The proxy holds no target state and, on each invocation, looks up the active instance from the Scope (e.g. current RequestAttributes)"
      - "It copies the short-lived bean's fields into the singleton at wiring time and keeps them refreshed on a timer"
    answer: 2
    explanation: |
      The scoped proxy is stateless; every method call resolves the currently-active
      instance from the relevant Scope, so a singleton always talks to the right
      request/session bean.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-046
    difficulty: advanced
