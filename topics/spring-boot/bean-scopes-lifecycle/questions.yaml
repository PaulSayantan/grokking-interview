      - "Change it to singleton scope so the container's normal destroy phase runs @PreDestroy and closes the resource for you"
      - "Do nothing; Spring always tracks prototype instances and reliably closes any resource they hold at context shutdown"
      - "Rely on request scope, which will close the resource automatically at the end of every HTTP request that touched it"
    answer: 0
    explanation: |
      Because the container doesn't manage prototype destruction, the client must clean up,
      or you introduce a custom BPP/destruction callback to handle it.
    ref: "concepts.md#prototype-scope"

  - id: bean-scopes-lifecycle-050
    difficulty: advanced
