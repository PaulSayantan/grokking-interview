      - "setup → setBeanName → @PostConstruct → afterPropertiesSet"
    answer: 0
    explanation: |
      Aware callbacks (setBeanName) run first, then init callbacks in order: @PostConstruct
      → InitializingBean.afterPropertiesSet() → custom init-method (setup).
