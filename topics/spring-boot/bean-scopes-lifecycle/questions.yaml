    options:
      - "@Scope(\"request\") with proxyMode left at its default of ScopedProxyMode.NO, so no proxy is created"
      - "@Scope(value=\"request\", proxyMode=ScopedProxyMode.TARGET_CLASS)"
      - "@Scope(value=\"singleton\", proxyMode=ScopedProxyMode.TARGET_CLASS) to force one shared instance"
      - "@Scope(value=\"session\", proxyMode=ScopedProxyMode.INTERFACES) using a JDK dynamic proxy"
    answer: 1
    explanation: |
      @RequestScope (and @SessionScope, @ApplicationScope) are convenience meta-annotations
      that default proxyMode to TARGET_CLASS.
