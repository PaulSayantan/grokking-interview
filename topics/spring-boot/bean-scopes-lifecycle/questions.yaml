  - id: bean-scopes-lifecycle-056
    difficulty: intermediate
    tags: [scoped-proxy, interfaces]
    question: |
      When would you choose ScopedProxyMode.INTERFACES over TARGET_CLASS?
    options:
      - "Never; ScopedProxyMode.INTERFACES was deprecated in Spring 5 and removed in Spring 6"
      - "Only for singleton-scoped beans, since JDK proxies are the only proxy type they support"
      - "When you want to avoid dependency injection on the proxied bean altogether"
      - "When the bean class is final and cannot be subclassed, but implements interfaces you inject by"
    answer: 3
    explanation: |
      INTERFACES uses a JDK dynamic proxy, appropriate when injecting by interface and/or
      when CGLIB subclassing isn't possible (final class). TARGET_CLASS (CGLIB) is used for
      class-based proxying.
    ref: "concepts.md#scoped-proxies-and-the-injection-mismatch-problem"

  - id: bean-scopes-lifecycle-057
    difficulty: intermediate
    tags: [processors, ordering]
    question: |
