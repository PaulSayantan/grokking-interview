topic: IoC Container & Dependency Injection
domain: spring-boot
topic_slug: ioc-dependency-injection
version: 1
questions:
- id: ioc-dependency-injection-001
  difficulty: beginner
  tags:
  - ioc
  - di
  - concepts
  question: |
    Which statement best describes the relationship between Inversion of Control (IoC)
    and Dependency Injection (DI)?
  options:
  - IoC is a design principle, and DI is one common technique that implements it
  - IoC and DI are synonyms; the terms are fully interchangeable in all contexts
  - DI is a design principle, and IoC is a specific framework that implements it
  - IoC applies only to XML configuration while DI applies only to annotations
  answer: 0
  explanation: |
    IoC is the general principle: control over object creation and wiring is inverted
    from the object to an external container. DI is a concrete implementation technique
    for achieving IoC (others include the Service Locator pattern). So DI is a subset
    of IoC, not a synonym.
  ref: concepts.md#ioc-vs-di
- id: ioc-dependency-injection-002
  difficulty: beginner
  tags:
  - ioc
  - hollywood-principle
  question: |
    The phrase "Don't call us, we'll call you" (the Hollywood Principle) is most
    directly used to describe which idea?
  options:
  - Lazy initialization of singleton beans
  - The prototype bean scope
  - Inversion of Control
  - Aspect-oriented programming
  answer: 2
  explanation: |
    The Hollywood Principle captures Inversion of Control: your code does not call the
    framework to obtain dependencies; the framework calls your code and supplies them.
  ref: concepts.md#ioc-vs-di
- id: ioc-dependency-injection-003
  difficulty: beginner
  tags:
  - loose-coupling
  - testability
  question: |
    Why does dependency injection improve unit testability?
  options:
  - It automatically generates mock objects for every dependency
  - It replaces all interfaces with concrete classes at test time
  - It disables the Spring context so tests run faster
  - It lets you supply mock or stub collaborators from outside, without a running container
  answer: 3
  explanation: |
    Because collaborators are injected rather than constructed internally, a test can
    pass in mocks/stubs (e.g., via a constructor) and exercise the class as a plain POJO
    without bootstrapping the container.
  ref: concepts.md#loose-coupling
- id: ioc-dependency-injection-004
  difficulty: intermediate
  tags:
  - loose-coupling
  - solid
  question: |
    Depending on an interface rather than a concrete implementation, and having that
    implementation injected, most directly supports which SOLID principle?
  options:
  - Single Responsibility Principle
  - Dependency Inversion Principle
  - Open/Closed Principle
  - Interface Segregation Principle
  answer: 1
  explanation: |
    Depending on abstractions rather than concretions is the Dependency Inversion
    Principle (the 'D' in SOLID). DI is one technique used to realize it.
  ref: concepts.md#loose-coupling
- id: ioc-dependency-injection-005
  difficulty: beginner
  tags:
  - beanfactory
  - applicationcontext
  question: |
    Which is TRUE about ApplicationContext compared with BeanFactory?
  options:
  - ApplicationContext is a superset of BeanFactory that adds events, i18n, and AOP support
  - ApplicationContext is a lightweight subset of BeanFactory with fewer features
  - BeanFactory supports annotation configuration but ApplicationContext does not
  - They are unrelated interfaces with no inheritance relationship
  answer: 0
  explanation: |
    ApplicationContext extends BeanFactory and adds enterprise features: event
    publishing, MessageSource/i18n, automatic BeanPostProcessor registration,
    annotation config, and AOP auto-proxying.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-006
  difficulty: intermediate
  tags:
  - applicationcontext
  - eager
  - singleton
  question: |
    By default, when does an ApplicationContext instantiate its singleton beans?
  options:
  - Lazily, only on the first getBean call for each bean
  - Only when the JVM garbage collector runs
  - Eagerly, during context refresh at startup
  - Never automatically; you must call refresh() per bean
  answer: 2
  explanation: |
    An ApplicationContext pre-instantiates singletons eagerly at startup ('fail fast'),
    surfacing wiring errors early. A raw BeanFactory instead creates them lazily on
    first request.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-007
  difficulty: intermediate
  tags:
  - beanfactory
  - beanpostprocessor
  question: |
    A developer registers a custom BeanPostProcessor. With a plain BeanFactory versus an
    ApplicationContext, what is the difference?
  options:
  - Both auto-detect and register the BeanPostProcessor identically
  - ApplicationContext auto-detects and registers it; with a plain BeanFactory you must register it manually
  - BeanFactory auto-detects it; ApplicationContext ignores BeanPostProcessors
  - Neither container supports BeanPostProcessors
  answer: 1
  explanation: |
    ApplicationContext automatically detects and applies BeanPostProcessor and
    BeanFactoryPostProcessor beans. A raw BeanFactory requires explicit programmatic
    registration.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-008
  difficulty: intermediate
  tags:
  - context-hierarchy
  - mvc
  question: |
    In a classic Spring MVC parent-child context setup, which visibility rule holds?
  options:
  - Parent (root) beans can inject child (web) beans, but not vice versa
  - Neither context can see the other's beans
  - Both contexts share a single flat bean namespace with no hierarchy
  - Child (web) beans can inject parent (root) beans, but not vice versa
  answer: 3
  explanation: |
    A child context can see and inject beans from its parent (lookups delegate upward),
    but the parent cannot see beans defined in the child. Web-layer controllers can
    inject root-context services; the reverse is impossible.
  ref: concepts.md#context-hierarchy
- id: ioc-dependency-injection-009
  difficulty: intermediate
  tags:
  - context-hierarchy
  - resolution
  question: |
    When a child ApplicationContext resolves a bean by type, in what order does it look?
  options:
  - Child first, then delegate to the parent if not found
  - Parent first, then child
  - It searches both simultaneously and throws if the bean exists in either
  - It only searches the child and never consults the parent
  answer: 0
  explanation: |
    Resolution is child-first: if the bean is not found locally, the request is
    delegated up to the parent. A bean defined in both is effectively overridden for
    the child's consumers.
  ref: concepts.md#context-hierarchy
- id: ioc-dependency-injection-010
  difficulty: advanced
  tags:
  - context-hierarchy
  - spring-cloud
  question: |
    In Spring Cloud applications, the bootstrap context relates to the main application
    context how?
  options:
  - The bootstrap context is a child of the main application context
  - The bootstrap context is a parent of the main application context
  - They are the same context instance
  - The bootstrap context replaces the main context after startup
  answer: 1
  explanation: |
    Spring Cloud's bootstrap context is created first and acts as the parent of the
    main application context (so bootstrap property sources are visible downstream).
    Note it is disabled by default in newer versions unless explicitly enabled.
  ref: concepts.md#context-hierarchy
- id: ioc-dependency-injection-011
  difficulty: beginner
  tags:
  - constructor-injection
  - recommended
  question: |
    Which injection style does the Spring team recommend for mandatory dependencies?
  options:
  - Field injection
  - Setter injection
  - Constructor injection
  - Static factory injection
  answer: 2
  explanation: |
    Constructor injection is recommended for mandatory dependencies: it allows final
    fields (immutability), guarantees a fully initialized non-null object, and makes
    the class easy to test as a POJO. Setter injection suits optional dependencies.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-012
  difficulty: intermediate
  tags:
  - field-injection
  - drawbacks
  question: |
    Which of the following is NOT a reason field injection is discouraged?
  options:
  - The injected field cannot be declared final, so the object is mutable
  - You cannot easily instantiate the class with mocks using plain 'new' in a unit test
  - It hides how many dependencies a class has, masking Single Responsibility violations
  - It causes a compile-time error whenever more than three dependencies are present
  answer: 3
  explanation: |
    Field injection has no such compile-time limit. Its real drawbacks are lost
    immutability (no final), poor testability without reflection/container, hidden
    dependencies, and tight coupling to the DI container.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-013
  difficulty: intermediate
  tags:
  - constructor-injection
  - spring-4.3
  question: |
    Since Spring 4.3, when is the @Autowired annotation optional on a constructor?
  options:
  - When the class has exactly one constructor
  - Never; @Autowired is always required on constructors
  - Only when the constructor has no arguments
  - Only when the class is annotated with @Configuration
  answer: 0
  explanation: |
    Since Spring 4.3, if a bean class has a single constructor, Spring uses it for
    injection automatically and @Autowired may be omitted. With multiple constructors
    you must annotate the one to use.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-014
  difficulty: intermediate
  tags:
  - immutability
  - constructor-injection
  question: |
    Which injection style is required if you want your dependency fields to be declared
    final (immutable references)?
  options:
  - Field injection
  - Setter injection
  - Constructor injection
  - Any of them; final works with all injection styles
  answer: 2
  explanation: |
    Only constructor injection can assign final fields, because final fields must be set
    during construction. Setter and field injection assign after construction, so the
    fields cannot be final.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-015
  difficulty: advanced
  tags:
  - constructor-injection
  - lombok
  question: |
    A team uses Lombok to get clean constructor injection with no boilerplate. Which
    annotation generates a constructor for all final fields?
  options:
  - '@AllArgsConstructor'
  - '@NoArgsConstructor'
  - '@Builder'
  - '@RequiredArgsConstructor'
  answer: 3
  explanation: |
    @RequiredArgsConstructor generates a constructor with parameters for all final (and
    @NonNull) fields, which is the idiomatic way to do constructor injection with Lombok.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-016
  difficulty: beginner
  tags:
  - autowired
  - by-type
  question: |
    What is @Autowired's primary matching strategy?
  options:
  - By bean name first, then by type
  - By type first, with bean name only as a fallback tie-breaker
  - By the order beans were declared
  - By XML id attribute only
  answer: 1
  explanation: |
    @Autowired resolves by type first. The field/parameter name is used only as a
    fallback to disambiguate when multiple beans of the same type exist.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-017
  difficulty: intermediate
  tags:
  - autowired
  - resolution
  - exceptions
  question: |
    Two beans of the same type exist, neither is @Primary, there is no @Qualifier, and
    the injection point's name does not match either bean name. What happens?
  options:
  - The context fails with NoUniqueBeanDefinitionException
  - A random candidate is chosen
  - Both beans are injected as a List
  - The dependency is silently left null
  answer: 0
  explanation: |
    With multiple candidates and no @Primary, no @Qualifier, and no name-based match,
    the container cannot disambiguate and throws NoUniqueBeanDefinitionException.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-018
  difficulty: advanced
  tags:
  - autowired
  - resolution
  - code-scenario
  question: |
    Given this code, which bean is injected?
    ```java
    @Component("card")   class CardPayment   implements PaymentGateway {}
    @Component("wallet") class WalletPayment implements PaymentGateway {}

    @Service
    class OrderService {
        OrderService(PaymentGateway card) { /* ... */ }
    }
    ```
  options:
  - WalletPayment, because it was declared second
  - Neither; startup fails with NoUniqueBeanDefinitionException
  - CardPayment, because the parameter name 'card' matches its bean name via name-based fallback
  - A new proxy that delegates to both beans
  answer: 2
  explanation: |
    Two candidates of type PaymentGateway exist. With no @Primary or @Qualifier, Spring
    falls back to matching the parameter name 'card' against bean names, and injects the
    bean named 'card' (CardPayment).
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-019
  difficulty: advanced
  tags:
  - autowired
  - generics
  question: |
    How does @Autowired treat generic type parameters when resolving candidates, e.g.
    injecting a Repository<Order>?
  options:
  - Generics are erased and ignored; any Repository bean matches
  - Generic type arguments are considered part of the type, so only a Repository<Order> bean matches
  - Generics cause an immediate NoUniqueBeanDefinitionException
  - Only raw types can be autowired; parameterized types are unsupported
  answer: 1
  explanation: |
    Spring treats generic type information as part of the qualifier. @Autowired
    Repository<Order> will match only a bean whose resolvable generic type is
    Repository<Order>, ignoring Repository<Customer>, etc.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-020
  difficulty: advanced
  tags:
  - autowired
  - exceptions
  - startup
  question: |
    At startup a required @Autowired dependency cannot be satisfied. The underlying
    NoSuchBeanDefinitionException or NoUniqueBeanDefinitionException typically reaches
    the developer wrapped inside which exception?
  options:
  - UnsatisfiedDependencyException (itself a BeanCreationException)
  - ClassNotFoundException
  - NullPointerException thrown at first method call
  - IllegalArgumentException with no wrapping
  answer: 0
  explanation: |
    NoSuchBeanDefinitionException (zero candidates) and NoUniqueBeanDefinitionException
    (multiple indistinguishable candidates) are the root causes, but during context startup
    they surface wrapped in an UnsatisfiedDependencyException / BeanCreationException that
    names the failing bean and its injection point.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-021
  difficulty: beginner
  tags:
  - primary
  - qualifier
  question: |
    Where is @Primary declared, and what does it do?
  options:
  - On a bean definition, to mark it the default candidate when multiple exist
  - On the injection point, to force a specific bean by name
  - On the application class, to enable component scanning
  - On a method parameter, to make the dependency optional
  answer: 0
  explanation: |
    @Primary is placed on a bean definition and marks it as the preferred candidate when
    several beans of the same type could be injected and no more specific qualifier is
    present.
  ref: concepts.md#qualifier-vs-primary
- id: ioc-dependency-injection-022
  difficulty: intermediate
  tags:
  - primary
  - qualifier
  - precedence
  question: |
    A DataSource is marked @Primary. An injection point uses @Qualifier("audit") naming
    a different DataSource bean. Which bean is injected there?
  options:
  - The @Primary DataSource, because @Primary always wins
  - The 'audit' DataSource, because a @Qualifier at the injection point overrides @Primary
  - Neither; the conflict causes NoUniqueBeanDefinitionException
  - Both, injected as a Map keyed by bean name
  answer: 1
  explanation: |
    A @Qualifier at the injection point is more specific than a global @Primary default,
    so the 'audit' bean is injected. @Primary only applies when no qualifier narrows the
    choice.
  ref: concepts.md#qualifier-vs-primary
- id: ioc-dependency-injection-023
  difficulty: intermediate
  tags:
  - primary
  - qualifier
  - design
  question: |
    When should you prefer @Primary over @Qualifier?
  options:
  - When each consumer must explicitly choose a specific implementation
  - When you want to inject all implementations as a collection
  - When most consumers want one sensible default implementation of a type
  - When the bean should never be injected anywhere
  answer: 2
  explanation: |
    @Primary is for a global default that most consumers want. @Qualifier is for when
    consumers must explicitly select among alternatives at each injection point.
  ref: concepts.md#qualifier-vs-primary
- id: ioc-dependency-injection-024
  difficulty: advanced
  tags:
  - qualifier
  - custom-annotation
  question: |
    To create a type-safe alternative to string-based @Qualifier("...") selection, you
    can define a custom annotation that is:
    ```java
    @Qualifier
    @Retention(RUNTIME)
    @interface Audit {}
    ```
    What is the mechanism that makes this work?
  options:
  - Spring scans for annotations whose name ends in 'Qualifier'
  - The @Retention(RUNTIME) alone registers it as a qualifier
  - Custom qualifiers require an XML <qualifier-type> declaration
  - The custom annotation is meta-annotated with @Qualifier, so Spring treats it as a qualifier
  answer: 3
  explanation: |
    A custom qualifier works because it is meta-annotated with @Qualifier. Spring then
    matches beans and injection points bearing that annotation, giving type-safe
    selection without string names.
  ref: concepts.md#qualifier-vs-primary
- id: ioc-dependency-injection-025
  difficulty: intermediate
  tags:
  - resource
  - autowired
  - matching
  question: |
    How does @Resource differ from @Autowired in its default matching behavior?
  options:
  - '@Resource matches by name first (then type); @Autowired matches by type first (then name)'
  - '@Resource matches by type first; @Autowired matches by name first'
  - Both match by name only
  - Both match by type only, with no name fallback
  answer: 0
  explanation: |
    @Resource (JSR-250) resolves by name first — using its 'name' attribute or the
    field/setter name — then falls back to type. @Autowired resolves by type first,
    with name only as a fallback.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-026
  difficulty: intermediate
  tags:
  - inject
  - jsr-330
  question: |
    Which statement about @Inject (JSR-330) is correct?
  options:
  - It is a Spring-specific annotation with no external standard
  - It matches strictly by bean name, like @Resource
  - It behaves like @Autowired (matches by type) and is a vendor-neutral standard requiring the jakarta.inject/javax.inject
    dependency
  - It cannot be used with @Qualifier or @Named
  answer: 2
  explanation: |
    @Inject is the JSR-330 standard annotation; it behaves like @Autowired (by type) and
    is vendor-neutral. It requires the jakarta.inject (or older javax.inject) dependency
    and can be combined with @Named/@Qualifier.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-027
  difficulty: advanced
  tags:
  - resource
  - inject
  - required
  question: |
    Which annotation supports the required=false attribute to make a dependency optional?
  options:
  - '@Resource'
  - '@Inject'
  - All three support required=false
  - '@Autowired'
  answer: 3
  explanation: |
    Only @Autowired has a required attribute. @Resource and @Inject do not; an optional
    JSR-330 dependency is expressed via Provider<T> (or Spring's ObjectProvider<T>) or
    Optional<T>.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-028
  difficulty: advanced
  tags:
  - jakarta
  - spring-boot-3
  - migration
  question: |
    In Spring Boot 3.x / Spring Framework 6, which package provides the @Resource
    annotation?
  options:
  - javax.annotation.Resource
  - jakarta.annotation.Resource
  - org.springframework.annotation.Resource
  - java.inject.Resource
  answer: 1
  explanation: |
    Spring Framework 6 / Spring Boot 3 migrated from the javax.* namespace to jakarta.*,
    so it is jakarta.annotation.Resource (and jakarta.inject.Inject). On Boot 2.x /
    Spring 5 they were the javax.* equivalents.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-029
  difficulty: intermediate
  tags:
  - inject
  - provider
  - optional
  question: |
    Since @Inject has no 'required' attribute, how do you express an optional JSR-330
    dependency (present-or-absent) idiomatically?
  options:
  - Inject a Provider<T> (or Spring's ObjectProvider<T>) / Optional<T>
  - '@Inject(required = false)'
  - Annotate the field with @Nullable and mark it transient
  - It is impossible; @Inject dependencies must always be present
  answer: 0
  explanation: |
    @Inject has no required attribute. Optionality is expressed via Provider<T>
    (JSR-330), Spring's ObjectProvider<T>, or Optional<T>, which defer resolution and do
    not fail if the bean is absent.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-030
  difficulty: beginner
  tags:
  - required-false
  - optional
  question: |
    What happens by default if @Autowired cannot find a matching bean for a mandatory
    dependency?
  options:
  - The field is left null and the app starts normally
  - Spring creates a default no-op implementation automatically
  - The context fails to start, throwing NoSuchBeanDefinitionException
  - The bean is queued and injected later when a match appears
  answer: 2
  explanation: |
    @Autowired dependencies are mandatory by default; a missing bean causes context
    startup to fail with NoSuchBeanDefinitionException. Use required=false, Optional, or
    ObjectProvider to make it optional.
  ref: concepts.md#requiredfalse-and-optional-injection
- id: ioc-dependency-injection-031
  difficulty: intermediate
  tags:
  - optional
  - objectprovider
  question: |
    Which type is the most flexible way to inject an optional or zero-to-many dependency,
    offering getIfAvailable() and getIfUnique() and deferring resolution?
  options:
  - java.util.Optional<T>
  - org.springframework.beans.factory.ObjectProvider<T>
  - java.util.concurrent.Future<T>
  - javax.inject.Provider<T> only
  answer: 1
  explanation: |
    ObjectProvider<T> is a Spring-specific, lazy handle that supports getIfAvailable(),
    getIfUnique(), and stream access, making it ideal for optional or 0..n dependencies
    without failing the context.
  ref: concepts.md#requiredfalse-and-optional-injection
- id: ioc-dependency-injection-032
  difficulty: intermediate
  tags:
  - optional
  - injection
  - code-scenario
  question: |
    Given `@Autowired private Optional<AuditService> audit;` and no AuditService bean
    exists, what is the state of the field after context startup?
  options:
  - It is null
  - Startup fails with NoSuchBeanDefinitionException
  - It contains a proxy that throws on first use
  - It is Optional.empty()
  answer: 3
  explanation: |
    Wrapping the dependency in Optional<T> makes it optional. With no matching bean, the
    field is injected as Optional.empty(), and the context starts successfully.
  ref: concepts.md#requiredfalse-and-optional-injection
- id: ioc-dependency-injection-033
  difficulty: beginner
  tags:
  - collections-injection
  question: |
    What is injected into `@Autowired private List<Validator> validators;` when three
    beans implement Validator?
  options:
  - All three Validator beans, collected into the list
  - Only the @Primary Validator bean
  - An empty list, because Spring cannot inject collections
  - A NoUniqueBeanDefinitionException is thrown
  answer: 0
  explanation: |
    Injecting List<T> (or Set<T> / T[]) collects all beans assignable to T. All three
    Validator beans are placed into the list.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-034
  difficulty: intermediate
  tags:
  - map-injection
  question: |
    When you inject `Map<String, Validator>`, what are the keys and values?
  options:
  - Keys are the class names; values are class objects
  - Keys are the bean names; values are the corresponding bean instances
  - Keys are integer indices; values are bean instances
  - Keys are qualifier values only; beans without qualifiers are excluded
  answer: 1
  explanation: |
    For a Map<String, T> injection point, Spring uses the bean names as keys and the
    matching bean instances as values. A Map with a non-String key type is not treated
    as a collection injection.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-035
  difficulty: intermediate
  tags:
  - collections-injection
  - ordering
  question: |
    How do you control the ordering of beans injected into a List<T>?
  options:
  - Ordering is guaranteed alphabetical by class name; you cannot change it
  - Use @Primary on the bean that should appear first
  - Annotate beans with @Order (or implement Ordered); lower value comes first
  - Ordering is impossible; lists are always unordered
  answer: 2
  explanation: |
    Collection injection order is not guaranteed by default. Use @Order(n) or implement
    the Ordered interface (and @Priority participates too); lower values sort earlier.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-036
  difficulty: advanced
  tags:
  - collections-injection
  - empty
  question: |
    No beans of type Validator exist. What happens with `@Autowired private List<Validator> validators;`?
  options:
  - The field is injected as an empty, unmodifiable list
  - Spring injects null
  - Spring creates a default Validator bean automatically
  - By default the injection is required and startup fails; add required=false (or use ObjectProvider)
    to get an empty list
  answer: 3
  explanation: |
    A collection injection is treated as required by default, so with no candidates the
    context fails. Marking it required=false (or using ObjectProvider) yields an empty
    collection instead.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-037
  difficulty: beginner
  tags:
  - circular-dependency
  - constructor
  question: |
    Bean A and Bean B both use constructor injection and depend on each other. What
    happens at startup?
  options:
  - Spring throws BeanCurrentlyInCreationException (a BeanCreationException)
  - Spring resolves it silently using the three-level cache
  - Both beans are created as prototypes to avoid the cycle
  - Spring injects null into one of the constructors
  answer: 0
  explanation: |
    A pure constructor-injection cycle is unresolvable: neither object can be fully
    constructed before the other exists. Spring throws BeanCurrentlyInCreationException.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-038
  difficulty: intermediate
  tags:
  - circular-dependency
  - setter-field
  question: |
    Which injection styles allow Spring to resolve a circular dependency between two
    singletons?
  options:
  - Constructor injection on both sides
  - No injection style can resolve a cycle
  - Field or setter injection (Spring exposes an early reference)
  - Only prototype-scoped beans can resolve a cycle
  answer: 2
  explanation: |
    With field or setter injection, Spring can instantiate the raw object first, expose
    an early reference, and inject collaborators afterward, closing the cycle. Pure
    constructor injection on both sides cannot be resolved.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-039
  difficulty: advanced
  tags:
  - three-level-cache
  - internals
  question: |
    In Spring's DefaultSingletonBeanRegistry three-level cache, what does the third-level
    cache (singletonFactories) store?
  options:
  - Fully initialized, ready-to-use singleton instances
  - Early-exposed raw instances promoted from level 3
  - Bean definitions parsed from configuration
  - ObjectFactory lambdas that can produce an early reference (possibly an AOP proxy)
  answer: 3
  explanation: |
    Level 3 (singletonFactories) holds ObjectFactory instances. When an early reference
    is needed, the factory runs — creating the correct AOP proxy if required — and the
    produced object is promoted to level 2 (earlySingletonObjects).
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-040
  difficulty: advanced
  tags:
  - three-level-cache
  - why-three
  - proxy
  question: |
    Why does Spring use a three-level cache instead of just two levels for singleton
    circular dependency resolution?
  options:
  - To store beans of three different scopes separately
  - The third level holds factories, letting Spring lazily produce a single consistent early reference
    (notably the correct AOP proxy)
  - To keep prototype beans separate from singletons
  - To cache bean definitions, metadata, and instances in separate maps
  answer: 1
  explanation: |
    The third level stores factories rather than objects. This lets Spring defer creation
    of the early reference and, when a bean needs an AOP proxy, produce that proxy exactly
    once and consistently so the collaborator receives the same proxy instance the bean
    becomes.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-041
  difficulty: intermediate
  tags:
  - circular-dependency
  - spring-boot-2.6
  question: |
    What changed regarding circular references in Spring Boot 2.6 and later?
  options:
  - Circular references are prohibited by default; startup fails unless spring.main.allow-circular-references=true
  - Circular references are now always allowed with no configuration
  - Circular references now require XML configuration
  - Circular references are silently resolved for constructor injection too
  answer: 0
  explanation: |
    Since Spring Boot 2.6, circular references are prohibited by default and cause a
    startup failure with a descriptive message. You can re-enable them via
    spring.main.allow-circular-references=true, but redesign is the recommended fix.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-042
  difficulty: advanced
  tags:
  - circular-dependency
  - lazy
  - fix
  question: |
    Which approach can break a constructor-injection circular dependency without
    redesigning both classes?
  options:
  - Mark both beans as @Primary
  - Change both beans to request scope
  - Annotate one of the constructor parameters with @Lazy so a proxy is injected and real resolution is
    deferred
  - Add @Order to both beans
  answer: 2
  explanation: |
    @Lazy on one injection point injects a lazy proxy; the real bean is resolved only on
    first method call, breaking the construction-time cycle even with constructor
    injection. Other options do not address the cycle.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-043
  difficulty: intermediate
  tags:
  - bean-creation
  - request-scope
  - session-scope
  question: |
    When is a request-scoped or session-scoped bean instance actually created?
  options:
  - Eagerly at context startup, like a singleton
  - Once, then cached for the lifetime of the application
  - When its scope begins (e.g., a new HTTP request or session), a fresh instance per scope
  - Never automatically; you must call getBean manually each time
  answer: 2
  explanation: |
    Beans in scopes such as request and session are created when their scope begins — a new
    instance per HTTP request or per session — not eagerly at startup. Singletons, by
    contrast, are eagerly instantiated during context refresh.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-044
  difficulty: intermediate
  tags:
  - prototype
  - bean-creation
  question: |
    How and when are prototype-scoped beans created and managed?
  options:
  - One instance eagerly at startup, fully lifecycle-managed including destruction
  - Lazily once, then cached like a singleton
  - Only inside the web request scope
  - A new instance on each request, with the container NOT managing full destruction lifecycle
  answer: 3
  explanation: |
    Prototype beans are created fresh on each request/injection. Spring does not manage
    their complete lifecycle — in particular, destruction callbacks are not invoked
    automatically for prototypes.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-045
  difficulty: intermediate
  tags:
  - lazy
  - injection-point
  - proxy
  question: |
    What does @Lazy do when placed on an injection point (e.g. @Autowired @Lazy)?
  options:
  - It injects a lazy proxy and resolves the real target bean only when a method is first invoked
  - It caches the bean in the third-level singleton cache permanently
  - It marks the bean as prototype-scoped
  - It disables autowiring for that field
  answer: 0
  explanation: |
    @Lazy at an injection point causes Spring to inject a lazy-resolution proxy; the real
    bean is looked up only when a method is first called on the proxy. This defers
    creation and can break constructor cycles.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-046
  difficulty: intermediate
  tags:
  - lazy
  - trade-offs
  question: |
    What is a downside of making beans lazily initialized?
  options:
  - It increases application startup time
  - Configuration/wiring errors surface later (at first use) instead of at startup, losing fail-fast behavior
  - It prevents beans from ever being garbage collected
  - It forces all beans to become prototypes
  answer: 1
  explanation: |
    Lazy init speeds startup and saves memory for unused beans, but errors that would
    normally fail startup instead surface at first use (possibly in production), and the
    first request pays the initialization cost.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-047
  difficulty: advanced
  tags:
  - lazy
  - boot-property
  question: |
    What does setting spring.main.lazy-initialization=true do?
  options:
  - Makes only @Configuration classes lazy
  - Disables the ApplicationContext entirely
  - Makes all beans in the application lazily initialized
  - Forces all beans to be eagerly initialized
  answer: 2
  explanation: |
    This property makes every bean lazy by default. It speeds startup (useful in
    dev/test) but disables fail-fast and adds latency to first requests, so it is
    generally discouraged for production.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-048
  difficulty: advanced
  tags:
  - lazy
  - configuration-class
  question: |
    What is the effect of placing @Lazy on a @Configuration class?
  options:
  - It disables all @Bean methods in that class
  - It converts every @Bean to prototype scope
  - It has no effect; @Lazy is ignored on configuration classes
  - It makes all @Bean methods in that class produce lazily-initialized beans
  answer: 3
  explanation: |
    @Lazy on a @Configuration class applies laziness to all @Bean methods it declares, so
    those beans are created on first access rather than eagerly at startup.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-049
  difficulty: advanced
  tags:
  - autowired
  - priority
  - resolution
  question: |
    Beyond @Primary and @Qualifier, which annotation can break a tie among multiple
    autowiring candidates, with a lower number meaning higher priority?
  options:
  - '@Priority (jakarta/javax)'
  - '@Order'
  - '@DependsOn'
  - '@Lookup'
  answer: 0
  explanation: |
    @Priority (jakarta.annotation.Priority / javax) can disambiguate candidates during
    autowiring, with lower values meaning higher priority. Note @Order governs collection
    ordering and list retrieval, not single-injection selection.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-050
  difficulty: intermediate
  tags:
  - setter-injection
  - optional
  question: |
    Which scenario is setter injection best suited for?
  options:
  - Mandatory dependencies that must never change and should be final
  - Breaking a pure constructor circular dependency at compile time
  - Optional or reconfigurable dependencies that may change after construction
  - Injecting a Map of all beans of a type
  answer: 2
  explanation: |
    Setter injection fits optional or changeable dependencies, since the setter can be
    called (or re-called) after construction and the field cannot be final. Mandatory
    dependencies are better served by constructor injection.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-051
  difficulty: advanced
  tags:
  - three-level-cache
  - flow
  - scenario
  question: |
    Singleton A (field injection) needs B, and B (field injection) needs A. During A's
    creation, B is being created and requests A. Where does Spring find the reference to
    hand to B?
  options:
  - In singletonObjects (level 1), because A is already complete
  - It cannot find A and throws NoSuchBeanDefinitionException
  - It creates a brand-new second instance of A for B
  - In singletonFactories (level 3), whose ObjectFactory produces A's early reference (then promoted to
    level 2)
  answer: 3
  explanation: |
    A is still being created, so it is not in level 1. getSingleton misses level 1 and 2,
    then finds A's ObjectFactory in level 3, invokes it to obtain A's early reference
    (creating a proxy if needed), and promotes it to level 2. B receives that reference.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-052
  difficulty: beginner
  tags:
  - di
  - tight-coupling
  - code-scenario
  question: |
    Which snippet exhibits tight coupling that DI is meant to eliminate?
  options:
  - A constructor parameter `OrderService(PaymentGateway gateway)`
  - A field `private final PaymentGateway gateway = new StripePaymentGateway();`
  - A setter `void setGateway(PaymentGateway gateway)` annotated @Autowired
  - An injected `ObjectProvider<PaymentGateway>` parameter
  answer: 1
  explanation: |
    Hard-coding `new StripePaymentGateway()` inside the class binds it to a concrete
    implementation it constructs itself — tight coupling. The other options receive the
    dependency from outside (loose coupling via DI).
  ref: concepts.md#loose-coupling
- id: ioc-dependency-injection-053
  difficulty: intermediate
  tags:
  - applicationcontext
  - implementations
  question: |
    Which ApplicationContext implementation does a typical Spring Boot embedded-web
    application use?
  options:
  - AnnotationConfigServletWebServerApplicationContext
  - ClassPathXmlApplicationContext
  - FileSystemXmlApplicationContext
  - StaticApplicationContext
  answer: 0
  explanation: |
    Spring Boot servlet web apps use AnnotationConfigServletWebServerApplicationContext,
    which supports annotation-based configuration and manages the embedded servlet
    container. XML-based contexts are legacy for this scenario.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-054
  difficulty: advanced
  tags:
  - resource
  - name-matching
  - scenario
  question: |
    Given two DataSource beans named "primaryDs" and "auditDs", and the field
    `@Resource private DataSource auditDs;` (no name attribute), which bean is injected
    and why?
  options:
  - primaryDs, because @Resource always picks the first bean by type
  - Neither; @Resource throws NoUniqueBeanDefinitionException for two candidates
  - auditDs, because @Resource matches by the field name 'auditDs' first
  - A merged proxy over both DataSources
  answer: 2
  explanation: |
    @Resource matches by name first, using the field name 'auditDs' when no explicit
    name attribute is given, so it injects the auditDs bean. This name-first behavior is
    the key difference from @Autowired.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-055
  difficulty: advanced
  tags:
  - lazy
  - circular-dependency
  - scenario
  question: |
    A team has a legitimate constructor-injection cycle between AccountService and
    NotificationService and cannot easily redesign it right now. Which is the cleanest
    way to make the application start while keeping constructor injection?
  options:
  - Set spring.main.allow-circular-references=true, which works even for pure constructor cycles
  - Annotate one constructor parameter with @Lazy so a proxy is injected, deferring real resolution
  - Convert both services to prototype scope
  - Add @Primary to both services
  answer: 1
  explanation: |
    allow-circular-references does NOT resolve pure constructor cycles (those need early
    references, which constructors can't use). @Lazy on one parameter injects a proxy and
    defers the real lookup, breaking the construction-time cycle while keeping constructor
    injection.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-056
  difficulty: expert
  tags:
  - autowired
  - resolution
  - qualifier
  - primary
  question: |
    A type has three candidate beans. One is @Primary. An injection point uses
    @Qualifier("beta"), and two of the three beans (not the @Primary one) carry the
    qualifier "beta". What is the outcome?
  options:
  - NoUniqueBeanDefinitionException, because @Qualifier first narrows to the two "beta" beans and @Primary cannot break that tie (it is not among them)
  - The @Primary bean is injected, because @Primary outranks any @Qualifier
  - The first "beta" bean by registration order is injected silently
  - NoSuchBeanDefinitionException, because @Qualifier and @Primary conflict
  answer: 0
  explanation: |
    Resolution applies the @Qualifier as a filter first, reducing candidates to the two
    "beta" beans. @Primary only breaks ties among the surviving candidates, and the
    @Primary bean is not one of them, so it cannot help. With two equally-qualified beans
    and no further disambiguation, the container throws NoUniqueBeanDefinitionException.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-057
  difficulty: expert
  tags:
  - autowired
  - primary
  - failure-mode
  question: |
    Two beans of the same type are BOTH annotated @Primary and are both eligible at an
    injection point that has no @Qualifier. What happens?
  options:
  - The container picks the one declared first and logs a warning
  - Startup fails with NoUniqueBeanDefinitionException reporting more than one 'primary' bean
  - Both are injected as a List because ambiguity implies a collection
  - The @Primary annotations cancel out and name-based fallback is used
  answer: 1
  explanation: |
    @Primary designates a single default. If two candidates of the same type are both
    @Primary, Spring cannot choose a default and throws NoUniqueBeanDefinitionException
    indicating that more than one 'primary' bean was found among the candidates.
  ref: concepts.md#qualifier-vs-primary
- id: ioc-dependency-injection-058
  difficulty: advanced
  tags:
  - autowired
  - parameter-names
  - name-fallback
  question: |
    Name-based fallback resolution for a constructor parameter (matching the parameter
    name to a bean name) can silently stop working in which situation?
  options:
  - When the constructor has more than two parameters
  - When the bean is a singleton rather than a prototype
  - When the class is compiled without parameter name metadata (no -parameters flag) so the real parameter names are not available at runtime
  - When the injection uses @Inject instead of @Autowired
  answer: 2
  explanation: |
    Parameter-name fallback relies on the actual parameter names being present in the
    bytecode. If the code is compiled without -parameters (and no debug info), the names
    are lost, the fallback cannot match, and resolution fails or picks unexpectedly.
    Spring Boot enables -parameters by default, but hand-built or misconfigured builds
    can lose it.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-059
  difficulty: expert
  tags:
  - fallback
  - spring-6.2
  - resolution
  question: |
    Spring Framework 6.2 introduced @Fallback. How does a @Fallback bean behave during
    autowiring when a user-defined non-fallback bean of the same type also exists?
  options:
  - The @Fallback bean always wins, like an inverse @Primary
  - Both beans are injected and merged
  - Startup fails because @Fallback conflicts with the user-defined bean
  - The @Fallback bean is ignored during selection whenever any non-fallback candidate exists, so the user-defined bean is chosen
  answer: 3
  explanation: |
    @Fallback is the inverse of @Primary: a fallback bean is only selected when no
    non-fallback candidate of the type exists. It lets a framework or library supply a
    default that any user-defined bean automatically supersedes, without needing
    @ConditionalOnMissingBean.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-060
  difficulty: advanced
  tags:
  - autowired
  - beanpostprocessor
  - bootstrapping
  question: |
    Why can you NOT use @Autowired or @Value inside your own custom BeanPostProcessor
    implementation and expect them to be injected?
  options:
  - The annotations are themselves processed by BeanPostProcessors, and BPP beans are instantiated too early (before those processors run) to have them applied
  - '@Autowired only works on classes annotated @Service or @Component'
  - BeanPostProcessors are prototype-scoped and prototypes never get autowired
  - Custom BeanPostProcessors run in a separate class loader that cannot see annotations
  answer: 0
  explanation: |
    @Autowired/@Value/@Resource/@Inject are handled by BeanPostProcessor implementations
    (AutowiredAnnotationBeanPostProcessor, CommonAnnotationBeanPostProcessor). Your own
    BPP must be instantiated very early in the bootstrap, before those processors are
    active, so annotation-driven injection into it does not run. You must wire such beans
    explicitly (constructor args in an @Bean method).
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-061
  difficulty: expert
  tags:
  - scope-mismatch
  - prototype
  - singleton
  question: |
    A prototype-scoped bean is injected via a plain @Autowired field into a singleton
    service. At runtime the singleton's method uses that field many times. What actually
    happens?
  options:
  - A new prototype instance is created on every method call
  - The same single prototype instance (resolved once at singleton creation) is reused for every call
  - The field is null because prototypes cannot be injected into singletons
  - Spring throws BeanCurrentlyInCreationException on first use
  answer: 1
  explanation: |
    A singleton is wired exactly once, so the prototype dependency is resolved a single
    time and then behaves like a singleton for that consumer. To get a fresh instance per
    use you need ObjectProvider/Provider, @Lookup method injection, or a scoped proxy.
  ref: concepts.md#scope-mismatch-and-injecting-shorter-lived-beans
- id: ioc-dependency-injection-062
  difficulty: expert
  tags:
  - lookup
  - method-injection
  - internals
  question: |
    @Lookup method injection lets a singleton obtain a fresh prototype on each call. Which
    constraint does its implementation impose, and why?
  options:
  - The lookup method must be static, because Spring calls it before the bean exists
  - The lookup method must return void and set a field via reflection
  - The lookup method must not be private, final, or static, because Spring creates a CGLIB subclass that overrides it to return a fresh getBean result
  - The lookup method must be annotated @Transactional to trigger proxying
  answer: 2
  explanation: |
    @Lookup is implemented by generating a CGLIB subclass whose overridden method returns
    a fresh bean from the container. Overriding requires the method to be non-final,
    non-static, and at least package/protected/public (not private), and the class itself
    must be subclassable.
  ref: concepts.md#scope-mismatch-and-injecting-shorter-lived-beans
- id: ioc-dependency-injection-063
  difficulty: advanced
  tags:
  - request-scope
  - scoped-proxy
  - singleton
  question: |
    A request-scoped bean must be injected into a singleton controller. What is required
    for this to work correctly across many concurrent requests?
  options:
  - Nothing special; request beans inject directly into singletons like any other bean
  - The bean must be marked @Lazy so it is created on first request
  - The controller must also be request-scoped
  - A scoped proxy (proxyMode=TARGET_CLASS or INTERFACES) so each method call resolves the bean from the currently active request scope
  answer: 3
  explanation: |
    Injecting a request-scoped bean directly into a singleton would capture one request's
    instance forever (or fail with no active request). A scoped proxy is injected instead;
    on each method call it looks up the real bean bound to the current thread's active
    request scope, giving correct per-request instances.
  ref: concepts.md#scope-mismatch-and-injecting-shorter-lived-beans
- id: ioc-dependency-injection-064
  difficulty: expert
  tags:
  - three-level-cache
  - aop
  - failure-mode
  question: |
    A singleton A is advised by @Async and participates in a field-injection cycle with B.
    The context fails with a message that A "has been injected ... in its raw version as
    part of a circular reference, but has eventually been wrapped." What is the root cause?
  options:
  - The @Async proxy is created by a different post-processor than the one that produced A's early reference, so B captured A's raw target while the container's A became a proxy
  - Spring ran out of cache levels and evicted A prematurely
  - '@Async beans cannot be singletons and must be prototypes'
  - B was created before A was registered in the bean definition map
  answer: 0
  explanation: |
    The early reference exposed for cycle resolution is normally the proxied form when a
    SmartInstantiationAwareBeanPostProcessor handles it. @Async proxying happens in a
    later, separate post-processor, so the early reference handed to B was the raw target
    while A itself ended up wrapped. Spring detects the mismatch and fails. Break the cycle
    or use @Lazy.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-065
  difficulty: expert
  tags:
  - circular-dependency
  - prototype
  question: |
    Two prototype-scoped beans depend on each other (via any injection style). What does
    Spring do?
  options:
  - Resolves the cycle using the three-level cache, as with singletons
  - Throws BeanCurrentlyInCreationException, because prototypes are never placed in the singleton caches and cannot expose an early reference
  - Creates one shared instance to satisfy both
  - Silently injects null into one side
  answer: 1
  explanation: |
    The early-reference mechanism lives in the singleton registry. Prototypes are never
    cached there, so there is no way to expose an early reference or even track them as
    "currently in creation" across independent instances. A prototype-to-prototype cycle
    therefore always throws BeanCurrentlyInCreationException.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-066
  difficulty: expert
  tags:
  - circular-dependency
  - allow-circular-references
  question: |
    An application has a pure constructor-injection cycle. A developer sets
    spring.main.allow-circular-references=true to fix it. What is the result?
  options:
  - The cycle is resolved and the app starts normally
  - The two beans are automatically converted to setter injection
  - The app still fails, because that flag only re-enables the setter/field early-reference mechanism and cannot resolve a constructor cycle
  - The app starts but one dependency is null
  answer: 2
  explanation: |
    allow-circular-references only re-enables the early-reference (level-2/3) mechanism
    that Boot 2.6 disabled by default. That mechanism requires an already-instantiated
    object to expose early, which a constructor cycle can never provide. The startup still
    fails with BeanCurrentlyInCreationException; the real fixes are redesign or @Lazy.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-067
  difficulty: advanced
  tags:
  - three-level-cache
  - invariants
  question: |
    Which statement about the three singleton cache maps in DefaultSingletonBeanRegistry
    is correct at any single instant during a bean's creation?
  options:
  - A bean can appear in all three maps simultaneously for redundancy
  - Prototype beans are stored in level 3 until fully initialized
  - Level 1 holds factories and level 3 holds finished beans
  - 'The maps are mutually exclusive per bean: promotion to a higher level removes the entry from the lower level(s)'
  answer: 3
  explanation: |
    The maps partition a bean's lifecycle: its factory sits in level 3 (singletonFactories);
    when an early reference is produced it moves to level 2 (earlySingletonObjects) and the
    factory is removed; when fully initialized it moves to level 1 (singletonObjects) and
    is removed from level 2. A given bean is in exactly one at a time. Prototypes are never
    stored in these maps.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-068
  difficulty: expert
  tags:
  - concurrency
  - final-fields
  - jmm
  question: |
    From a Java Memory Model standpoint, why does constructor injection into final fields
    give a concurrency advantage over setter/field injection of non-final fields?
  options:
  - The JMM guarantees safe publication of properly-constructed final fields, so their values are visible to other threads without extra synchronization
  - Final fields are stored in a separate thread-local heap
  - Setter injection uses volatile writes automatically
  - Final fields disable the CPU cache for that object
  answer: 0
  explanation: |
    The JMM's final-field semantics guarantee that if an object is not leaked during
    construction, other threads see correctly-initialized final field values without
    synchronization. Non-final fields set after construction (setter/field injection) carry
    no such guarantee, so a bean seen through a data race could observe a stale/null
    collaborator.
  ref: concepts.md#thread-safety-and-concurrency-of-injection
- id: ioc-dependency-injection-069
  difficulty: advanced
  tags:
  - concurrency
  - singleton
  - visibility
  question: |
    Why do application request threads never observe a partially-wired singleton bean under
    normal usage?
  options:
  - Because every singleton method is synchronized by the container
  - Because the container finishes all injection and @PostConstruct before publishing the bean into singletonObjects, from where application code retrieves it
  - Because singletons are recreated per thread
  - Because Spring injects a defensive copy per thread
  answer: 1
  explanation: |
    Singleton creation (instantiation, injection, init callbacks) completes before the bean
    is placed in singletonObjects, the map application code reads from. Threads therefore
    see a fully-initialized bean, provided the bean does not leak 'this' early (e.g., during
    construction) and you do not re-inject via setters at runtime.
  ref: concepts.md#thread-safety-and-concurrency-of-injection
- id: ioc-dependency-injection-070
  difficulty: intermediate
  tags:
  - concurrency
  - state
  - singleton
  question: |
    Which of the following does dependency injection guarantee about thread-safety?
  options:
  - It makes any singleton bean fully thread-safe, including its mutable fields
  - It converts singletons to thread-local instances automatically
  - It only ensures the wiring is thread-safe; mutable state in a singleton is still your responsibility to protect
  - It serializes all method calls on singleton beans
  answer: 2
  explanation: |
    DI guarantees the container wires and publishes the bean safely. It does nothing about
    the thread-safety of the bean's own mutable state; a singleton holding mutable request
    data shared across threads is a classic concurrency bug regardless of injection style.
  ref: concepts.md#thread-safety-and-concurrency-of-injection
- id: ioc-dependency-injection-071
  difficulty: advanced
  tags:
  - bean-overriding
  - spring-boot-2.1
  question: |
    Two @Bean methods in different configuration classes both declare a bean named
    "dataSource". On Spring Boot 2.1+, what happens by default at startup?
  options:
  - The second definition silently overrides the first
  - The first definition wins and a warning is logged
  - Both beans are kept and injected as a List
  - Startup fails with BeanDefinitionOverrideException unless spring.main.allow-bean-definition-overriding=true
  answer: 3
  explanation: |
    Bean definition overriding is disabled by default since Spring Boot 2.1. Two definitions
    sharing a name throw BeanDefinitionOverrideException at startup unless you explicitly set
    spring.main.allow-bean-definition-overriding=true. This is different from two beans of
    the same type under different names, which is a resolution (not overriding) concern.
  ref: concepts.md#bean-overriding-definition-order-and-startup-ordering
- id: ioc-dependency-injection-072
  difficulty: advanced
  tags:
  - order
  - startup-order
  - dependson
  question: |
    A developer adds @Order(1) to bean X and @Order(2) to bean Y hoping X is created before
    Y at startup. Does @Order achieve this?
  options:
  - No, @Order does not affect singleton startup order; use @DependsOn (or a real dependency) to force creation order
  - Yes, @Order directly controls singleton instantiation order
  - Yes, but only if both beans are lazy
  - No, ordering of bean creation is impossible in Spring
  answer: 0
  explanation: |
    @Order governs the order of elements at collection injection points and ordered streams
    (and things like filter chains), not singleton startup order. Instantiation order is
    determined by the dependency graph; to force one bean to be created before another
    without an injection edge, use @DependsOn.
  ref: concepts.md#bean-overriding-definition-order-and-startup-ordering
- id: ioc-dependency-injection-073
  difficulty: expert
  tags:
  - priority
  - order
  - bean-method
  question: |
    You want a specific @Bean method's bean to win autowiring tie-breaks using
    jakarta.annotation.Priority. What is the catch?
  options:
  - '@Priority works on @Bean methods exactly like @Order'
  - '@Priority (jakarta.annotation.Priority) cannot be declared on a method, so you cannot put it on a @Bean method; model the intent with @Order plus @Primary/@Fallback instead'
  - '@Priority only works if the bean is a prototype'
  - '@Priority must be combined with @Qualifier to compile'
  answer: 1
  explanation: |
    jakarta.annotation.Priority has a target that does not include methods, so it cannot be
    placed on a @Bean factory method (only on types). To express equivalent precedence for a
    method-defined bean, use @Order together with @Primary or @Fallback.
  ref: concepts.md#bean-overriding-definition-order-and-startup-ordering
- id: ioc-dependency-injection-074
  difficulty: advanced
  tags:
  - collections-injection
  - constructor
  - empty
  question: |
    A collection dependency has no matching beans. Contrast an @Autowired FIELD of type
    List<Foo> with a CONSTRUCTOR parameter of type List<Foo>.
  options:
  - Both fail startup with NoSuchBeanDefinitionException
  - Both are injected as empty lists
  - The field injection is required by default and fails when empty; the constructor parameter resolves to an empty list
  - The field gets an empty list; the constructor parameter fails
  answer: 2
  explanation: |
    An @Autowired collection field is required by default and fails when no candidates
    exist (unless required=false). A multi-element constructor/factory parameter, however,
    resolves to an empty collection rather than failing. This asymmetry surprises many
    developers.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-075
  difficulty: expert
  tags:
  - self-injection
  - proxy
  - transactional
  question: |
    A service method annotated @Transactional calls another @Transactional method on the
    same class via 'this.other()'. The second transaction's propagation seems ignored. Why,
    and what is the container-oriented fix?
  options:
  - Because @Transactional is broken; there is no fix
  - Because transactions require prototype scope
  - Because the second method must be static
  - Because 'this' bypasses the AOP proxy; a fix is to self-inject the bean (e.g., @Autowired the same type, or @Resource by name) and call through the injected proxy reference
  answer: 3
  explanation: |
    Proxy-based AOP only intercepts calls that go through the proxy. An internal 'this' call
    invokes the raw target and skips the transactional advice. One remedy is to obtain the
    proxy of the same bean (self-injection via @Autowired/@Resource, or AopContext) and
    invoke the method through that reference so the advice applies. Note self-injection is a
    fallback candidate and never primary.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-076
  difficulty: advanced
  tags:
  - applicationcontextaware
  - service-locator
  - lifecycle
  question: |
    When is the setApplicationContext callback of an ApplicationContextAware bean invoked
    relative to other lifecycle steps?
  options:
  - After property population/injection but before @PostConstruct
  - Before the constructor runs
  - After @PostConstruct and after the bean is fully in singletonObjects
  - Only when getBean is first called on the bean
  answer: 0
  explanation: |
    Aware callbacks are invoked by dedicated BeanPostProcessors after the bean is
    instantiated and its properties are injected, but before initialization callbacks like
    @PostConstruct and InitializingBean.afterPropertiesSet. So the context is available in
    @PostConstruct but not in the constructor.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-077
  difficulty: intermediate
  tags:
  - service-locator
  - anti-pattern
  - objectprovider
  question: |
    Why is injecting ApplicationContext and calling getBean() generally discouraged compared
    with injecting an ObjectProvider<T>?
  options:
  - getBean is slower by several orders of magnitude
  - It couples the bean to the Spring container (Service Locator anti-pattern), hides real dependencies, and hurts POJO testability, whereas ObjectProvider is type-safe and lazy
  - ApplicationContext cannot be injected at all
  - getBean only works for prototype beans
  answer: 1
  explanation: |
    Reaching into the container via getBean reintroduces the coupling DI removes and hides a
    class's true dependencies, making it harder to test as a plain object. ObjectProvider<T>
    gives lazy, type-safe access to the same capability while keeping the dependency explicit
    in the constructor.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-078
  difficulty: expert
  tags:
  - beanfactory
  - applicationcontext
  - refresh
  question: |
    Which statement about BeanFactoryPostProcessor vs BeanPostProcessor timing during
    context refresh is correct?
  options:
  - BeanPostProcessors run first to modify bean definitions, then BeanFactoryPostProcessors modify instances
  - Both operate on instances and are interchangeable
  - BeanFactoryPostProcessors run first and can modify bean DEFINITIONS (before beans are instantiated); BeanPostProcessors run later and operate on bean INSTANCES
  - Neither is invoked by an ApplicationContext automatically
  answer: 2
  explanation: |
    BeanFactoryPostProcessors (e.g., PropertySourcesPlaceholderConfigurer,
    ConfigurationClassPostProcessor) run during refresh before bean instantiation and can
    alter bean definitions/metadata. BeanPostProcessors run during each bean's creation and
    operate on the instantiated objects (e.g., proxying, @Autowired). An ApplicationContext
    registers both automatically.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-079
  difficulty: advanced
  tags:
  - context-hierarchy
  - resolution
  - primary
  question: |
    A bean of type Clock exists in BOTH the parent (root) and child context, and the parent's
    is @Primary. A component in the CHILD context autowires a Clock with no qualifier. Which
    is injected?
  options:
  - The parent's @Primary Clock, because @Primary crosses context boundaries first
  - Neither; cross-context autowiring is forbidden
  - NoUniqueBeanDefinitionException, because both contexts have a Clock
  - The child's Clock, because resolution is child-first and a local unique match is used before delegating to the parent
  answer: 3
  explanation: |
    Resolution is child-first. The child context finds its own unique Clock and injects it
    without delegating upward, so the parent's @Primary is irrelevant here. @Primary only
    disambiguates among candidates within the same resolution scope, not across the
    hierarchy boundary.
  ref: concepts.md#context-hierarchy
- id: ioc-dependency-injection-080
  difficulty: expert
  tags:
  - objectprovider
  - ordering
  - stream
  question: |
    You inject ObjectProvider<Handler> and call orderedStream(). How are the resulting
    Handler beans ordered, and how does this differ from stream()?
  options:
  - orderedStream() honors @Order/Ordered/@Priority; stream() returns them in the context's default (registration) order without applying @Order
  - Both stream() and orderedStream() sort by bean name alphabetically
  - orderedStream() reverses registration order; stream() uses forward order
  - There is no difference; the method names are aliases
  answer: 0
  explanation: |
    orderedStream() applies the ordering semantics (Ordered/@Order/@Priority) to the
    returned beans, whereas stream() yields them in the container's default order without
    that sorting. This mirrors how @Order affects List injection but not startup order.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-081
  difficulty: advanced
  tags:
  - value
  - autowired
  - beanpostprocessor
  question: |
    Which single BeanPostProcessor is responsible for processing @Autowired, @Value, and
    @Inject on beans?
  options:
  - CommonAnnotationBeanPostProcessor
  - AutowiredAnnotationBeanPostProcessor
  - PersistenceAnnotationBeanPostProcessor
  - ConfigurationClassPostProcessor
  answer: 1
  explanation: |
    AutowiredAnnotationBeanPostProcessor handles @Autowired, @Value, and JSR-330 @Inject.
    CommonAnnotationBeanPostProcessor handles the JSR-250 set (@Resource, @PostConstruct,
    @PreDestroy). ConfigurationClassPostProcessor is a BeanFactoryPostProcessor that parses
    @Configuration classes.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-082
  difficulty: expert
  tags:
  - configuration
  - self-reference
  - static-bean
  question: |
    Inside a @Configuration class, one @Bean method calls another @Bean method to obtain a
    dependency. This is effectively a self-reference. Which technique decouples such a bean
    (e.g., a BeanFactoryPostProcessor) from the configuration instance's lifecycle?
  options:
  - Making the configuration class implement ApplicationContextAware
  - Annotating the configuration class with @Lazy
  - Marking the @Bean method static, so it does not depend on the configuration instance
  - Adding @Primary to the referenced @Bean method
  answer: 2
  explanation: |
    Declaring the @Bean method static decouples it from the @Configuration instance,
    avoiding a self-reference and premature instantiation ordering issues. This is the
    recommended pattern for BeanFactoryPostProcessor/BeanPostProcessor @Bean methods, which
    must be created very early.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-083
  difficulty: expert
  tags:
  - constructor-injection
  - multiple-constructors
  - resolution
  question: |
    A bean class has two constructors, both annotated @Autowired(required=false), taking
    different dependency sets. Only some dependencies are available in the context. How does
    Spring choose?
  options:
  - It always uses the constructor with the fewest parameters
  - It merges the two constructors' parameters into one call
  - It throws because two constructors are annotated
  - It picks the constructor with the greatest number of satisfiable dependencies, falling back to a default constructor if none can be fully satisfied
  answer: 3
  explanation: |
    When multiple constructors are annotated @Autowired(required=false), Spring treats them
    as candidates and selects the "greediest" one whose dependencies can all be satisfied,
    falling back to a default/primary constructor otherwise. Only one constructor may use
    required=true.
  ref: concepts.md#constructor-vs-setter-vs-field-injection
- id: ioc-dependency-injection-084
  difficulty: advanced
  tags:
  - self-injection
  - candidate-selection
  question: |
    Regarding self-injection (a bean autowiring a dependency of its own type), which
    statement is accurate?
  options:
  - 'A self reference is a fallback only: it never participates in normal candidate selection and is never treated as primary, ending up at lowest precedence'
  - A self reference has the same precedence as any other candidate
  - Self injection is forbidden and always throws
  - A self reference is always preferred over external beans
  answer: 0
  explanation: |
    @Autowired supports self references but only as a last-resort fallback. Regular
    dependencies on other beans always take precedence; a self reference is never primary
    and is chosen only when nothing else matches. This is why an external bean of the same
    type wins over the self reference.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-085
  difficulty: expert
  tags:
  - generics
  - qualifier
  - resolution
  question: |
    Given beans of type Converter<String,Integer> and Converter<Integer,String>, an
    injection point declares Converter<String,Integer>. What resolves, and what happens if
    only the RAW type Converter is declared at the injection point with both beans present?
  options:
  - Both cases inject the first bean by registration order
  - The parameterized point matches only the String,Integer bean; the raw point is ambiguous and throws NoUniqueBeanDefinitionException (unless disambiguated)
  - The parameterized point throws because generics are erased; the raw point works
  - Both cases throw because Converter is a functional interface
  answer: 1
  explanation: |
    Spring uses resolvable generics as an implicit qualifier, so Converter<String,Integer>
    matches only the matching parameterization. A raw Converter injection point cannot use
    generics to disambiguate, so with two candidates it throws NoUniqueBeanDefinitionException
    unless a @Qualifier/@Primary/name match narrows it.
  ref: concepts.md#autowired-resolution-algorithm
- id: ioc-dependency-injection-086
  difficulty: advanced
  tags:
  - lazy
  - bean-definition
  - eager-consumer
  question: |
    Bean B is annotated @Lazy (on its @Component/@Bean definition). Eager singleton A
    injects B via a plain @Autowired field (no @Lazy at the injection point). When is B
    created?
  options:
  - Eagerly at startup, when A is created and its dependency on B is resolved
  - Never, because @Lazy on the definition always wins
  - On the first HTTP request regardless of A
  - Only if spring.main.lazy-initialization=true is also set
  answer: 0
  explanation: |
    @Lazy on a bean definition only delays creation until the bean is first needed. A
    non-lazy consumer that injects it directly (no @Lazy proxy at the injection point) needs
    the real instance at wiring time, which forces B's creation during A's eager startup.
    To truly defer, the injection point itself must be @Lazy (injecting a proxy).
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-087
  difficulty: expert
  tags:
  - postconstruct
  - jakarta
  - spring-boot-3
  question: |
    An app migrated to Spring Boot 3 still imports javax.annotation.PostConstruct, and the
    method silently stops being invoked. What is the underlying reason?
  options:
  - '@PostConstruct was removed entirely from Spring Boot 3'
  - The method must now be static
  - '@PostConstruct only works on prototype beans in Boot 3'
  - Spring Boot 3 / Spring 6 processes jakarta.annotation.PostConstruct; the old javax.* annotation is no longer on the classpath/recognized, so the lifecycle callback is not run
  answer: 3
  explanation: |
    Spring Framework 6 / Boot 3 moved to the jakarta.* namespace. CommonAnnotationBeanPostProcessor
    recognizes jakarta.annotation.PostConstruct; a leftover javax.annotation.PostConstruct is
    not the annotation Spring scans for (and the javax artifact may be absent), so the init
    method is quietly skipped. This is a common migration bug.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-088
  difficulty: advanced
  tags:
  - objectprovider
  - getifunique
  - getifavailable
  question: |
    You inject ObjectProvider<Cache> and call getIfUnique(). There are TWO Cache beans and
    neither is @Primary. What does getIfUnique() return?
  options:
  - null, because the candidate is not unique (getIfUnique returns the bean only if exactly one candidate, or one is primary)
  - The first Cache by registration order
  - It throws NoUniqueBeanDefinitionException
  - A List of both caches
  answer: 0
  explanation: |
    getIfUnique() returns the bean only when there is exactly one candidate or one is marked
    primary; otherwise it returns null instead of throwing. getIfAvailable(), by contrast,
    would throw NoUniqueBeanDefinitionException when multiple non-primary candidates exist.
  ref: concepts.md#requiredfalse-and-optional-injection
- id: ioc-dependency-injection-089
  difficulty: expert
  tags:
  - postconstruct
  - constructor
  - proxy
  question: |
    A bean is advised (e.g., @Transactional/@Async). Its @PostConstruct method calls another
    of its own advised methods. Is the advice applied during @PostConstruct, and why?
  options:
  - Yes, because the proxy is fully active before construction
  - No, because @PostConstruct runs on the raw target instance before the AOP proxy is created by the post-processor, so a self-call is not intercepted
  - Yes, because @PostConstruct methods are always run through the proxy
  - No, because @PostConstruct is never invoked on advised beans
  answer: 1
  explanation: |
    Initialization callbacks like @PostConstruct run on the target instance during bean
    creation; the AOP proxy is typically created by a BeanPostProcessor's postProcessAfter-
    Initialization step, i.e., after @PostConstruct. So calls made during @PostConstruct
    (especially self-calls) hit the raw target and are not advised.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-090
  difficulty: advanced
  tags:
  - dependson
  - ordering
  - destruction
  question: |
    What does @DependsOn("audit") on bean 'reporter' guarantee?
  options:
  - The 'audit' bean is injected into 'reporter' automatically
  - The 'reporter' bean becomes a child context of 'audit'
  - The 'audit' bean is initialized before 'reporter' and destroyed after 'reporter', without creating an injection relationship
  - The 'audit' bean is marked @Primary for 'reporter'
  answer: 2
  explanation: |
    @DependsOn forces initialization order (and reverse destruction order) between beans
    that have no direct injection edge — useful when a bean relies on another's side effect.
    It does not inject 'audit' into 'reporter'; it only orders their lifecycles.
  ref: concepts.md#bean-overriding-definition-order-and-startup-ordering
- id: ioc-dependency-injection-091
  difficulty: expert
  tags:
  - qualifier
  - collections-injection
  - grouping
  question: |
    Five beans implement Notifier; three are annotated @Qualifier("urgent"). An injection
    point declares `@Autowired @Qualifier("urgent") List<Notifier> urgent;`. What is injected?
  options:
  - All five Notifier beans
  - Only the first "urgent" bean by order
  - A NoUniqueBeanDefinitionException, because @Qualifier cannot apply to a List
  - Only the three beans carrying the "urgent" qualifier
  answer: 3
  explanation: |
    A @Qualifier on a collection injection point restricts the collected beans to those
    carrying that qualifier. This is the idiomatic way to inject a labeled subset of all
    beans of a type, here the three "urgent" Notifiers.
  ref: concepts.md#collections-and-map-injection
- id: ioc-dependency-injection-092
  difficulty: intermediate
  tags:
  - beanfactory
  - lazy
  - fail-fast
  question: |
    A developer bootstraps with a raw BeanFactory (e.g., DefaultListableBeanFactory) instead
    of an ApplicationContext and is surprised that a misconfigured singleton does not fail at
    startup. Why?
  options:
  - A raw BeanFactory instantiates singletons lazily on first getBean, so the error surfaces only when that bean is first requested, not at bootstrap
  - BeanFactory validates all beans eagerly, so this cannot happen
  - BeanFactory never reports configuration errors
  - The bean was silently replaced with a default implementation
  answer: 0
  explanation: |
    Unlike ApplicationContext, a raw BeanFactory does not pre-instantiate singletons; they
    are created lazily on first getBean. So a wiring error appears only when the bean is
    first requested, losing the fail-fast behavior an ApplicationContext provides.
  ref: concepts.md#beanfactory-vs-applicationcontext
- id: ioc-dependency-injection-093
  difficulty: expert
  tags:
  - scoped-proxy
  - proxymode
  - internals
  question: |
    A request-scoped bean is a concrete class with no interface, injected into a singleton.
    Which proxyMode must the scoped proxy use, and what technology backs it?
  options:
  - INTERFACES, backed by a JDK dynamic proxy
  - TARGET_CLASS, backed by a CGLIB subclass proxy, because there is no interface to proxy
  - NO, because concrete classes cannot be proxied
  - DEFAULT, which always uses reflection without a proxy
  answer: 1
  explanation: |
    With no interface available, an interface-based JDK proxy cannot be created, so the
    scoped proxy must use proxyMode=TARGET_CLASS, which generates a CGLIB subclass proxy of
    the concrete type. INTERFACES mode requires the bean to implement an interface.
  ref: concepts.md#scope-mismatch-and-injecting-shorter-lived-beans
- id: ioc-dependency-injection-094
  difficulty: advanced
  tags:
  - optional
  - nullable
  - constructor
  question: |
    Which technique makes a CONSTRUCTOR-injected dependency optional (injecting null when no
    bean is present) most cleanly, given required=false is awkward on a single constructor?
  options:
  - Marking the field transient
  - Adding @Lazy to the parameter
  - Using @Nullable on the parameter, or wrapping it in Optional<T>/ObjectProvider<T>
  - Declaring the parameter final
  answer: 2
  explanation: |
    For constructor injection, the clean ways to express optionality are @Nullable on the
    parameter (inject null if absent), Optional<T> (Optional.empty()), or ObjectProvider<T>
    (deferred, getIfAvailable). required=false is only meaningful with multiple constructors,
    so it is awkward for a single constructor.
  ref: concepts.md#requiredfalse-and-optional-injection
- id: ioc-dependency-injection-095
  difficulty: expert
  tags:
  - three-level-cache
  - proxy
  - two-level
  question: |
    Suppose Spring used only a two-level cache (finished singletons + early raw instances)
    with no factory level. For a cyclic bean that needs an AOP proxy, what specific problem
    arises?
  options:
  - Nothing; two levels are sufficient in all cases
  - The context would start twice
  - Prototype beans would be cached incorrectly
  - The early raw instance would be handed to the collaborator, but the bean itself later becomes a proxy, so the collaborator ends up referencing a different (unproxied) object
  answer: 3
  explanation: |
    Without the factory level, Spring would expose the raw instance early. If the bean later
    needs a proxy, the collaborator holds the raw target while the container's bean is the
    proxy — two different objects. The factory level lets Spring produce the correct proxy
    exactly once, lazily, so every reference is consistent.
  ref: concepts.md#circular-dependencies-and-the-three-level-singleton-cache
- id: ioc-dependency-injection-096
  difficulty: advanced
  tags:
  - resource
  - qualifier
  - resolution
  question: |
    @Resource is used WITHOUT a name attribute on a field named 'primaryCache', but no bean
    named 'primaryCache' exists; there are two beans of the field's type, one @Primary. What
    happens?
  options:
  - It falls back to a by-type match and, finding two candidates, selects the @Primary one
  - It fails, because @Resource ignores @Primary and cannot find a name match
  - It injects null silently
  - It always injects the first bean by registration order
  answer: 0
  explanation: |
    @Resource matches by name first; with no bean named 'primaryCache' it falls back to a
    by-type match. Among multiple type candidates it honors @Primary (and any @Qualifier),
    so the @Primary bean is injected. If no primary/qualifier existed, it would be ambiguous.
  ref: concepts.md#resource-vs-inject-vs-autowired
- id: ioc-dependency-injection-097
  difficulty: expert
  tags:
  - lazy
  - fail-fast
  - trade-offs
  question: |
    A team enables spring.main.lazy-initialization=true to speed up local startup, then a
    typo'd bean reference reaches production undetected. What is the causal chain that best
    explains this outcome?
  options:
  - Lazy init corrupts the bean definition map
  - Global lazy init defers each bean's creation to first use, so the wiring error no longer fails startup and only surfaces when the affected code path first executes in production
  - Lazy init disables @Autowired entirely
  - Lazy init converts all beans to prototypes, hiding the error
  answer: 1
  explanation: |
    Global lazy initialization trades fail-fast for faster startup: beans (and thus their
    wiring validation) are created on first use. A misconfiguration that would have failed an
    eager startup instead lies dormant until the code path runs — potentially in production.
    This is why global lazy init is discouraged for prod.
  ref: concepts.md#lazy-injection-and-when-beans-are-created
- id: ioc-dependency-injection-098
  difficulty: advanced
  tags:
  - aware
  - lifecycle-order
  - internals
  question: |
    In what relative order are BeanNameAware, BeanFactoryAware, and ApplicationContextAware
    callbacks invoked on a bean that implements all three?
  options:
  - ApplicationContextAware, then BeanFactoryAware, then BeanNameAware
  - All three are invoked simultaneously on separate threads
  - BeanNameAware, then BeanFactoryAware, then ApplicationContextAware
  - BeanFactoryAware, then BeanNameAware, then ApplicationContextAware
  answer: 2
  explanation: |
    The invocation order is BeanNameAware (and BeanClassLoaderAware) first, then
    BeanFactoryAware — these are handled inside the factory's initializeBean — followed by the
    context-level aware interfaces (EnvironmentAware, ApplicationContextAware, etc.) applied by
    ApplicationContextAwareProcessor. All run after injection and before @PostConstruct.
  ref: concepts.md#programmatic-access-applicationcontextaware-and-service-locator
- id: ioc-dependency-injection-099
  difficulty: expert
  tags:
  - collections-injection
  - map
  - key-type
  question: |
    A developer writes `@Autowired Map<Class<?>, Handler> handlers;` expecting Spring to
    collect all Handler beans keyed somehow. What actually happens?
  options:
  - Spring keys the map by each bean's class object
  - Spring injects an empty map
  - Spring keys the map by bean name cast to Class
  - Spring does NOT treat it as a collect-all-beans injection because the key is not String; it tries to find a single bean assignable to Map<Class<?>,Handler>, likely failing
  answer: 3
  explanation: |
    The "collect all beans of type T into a Map" feature only triggers when the key type is
    String (keys become bean names). With a non-String key, Spring treats the point as an
    ordinary dependency on a Map bean and looks for a matching bean, typically failing with
    NoSuchBeanDefinitionException unless one is defined.
  ref: concepts.md#collections-and-map-injection
