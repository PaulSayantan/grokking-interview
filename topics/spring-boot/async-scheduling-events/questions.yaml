topic: "Asynchronous Processing, Scheduling & Application Events"
domain: spring-boot
topic_slug: async-scheduling-events
version: 1
questions:
  - id: async-scheduling-events-001
    difficulty: beginner
    tags: [enable-scheduling, annotations]
    question: |
      What is the role of the @EnableScheduling annotation in a Spring application?
    options:
      - "It registers infrastructure (a ScheduledAnnotationBeanPostProcessor) that detects @Scheduled methods and wires them to a TaskScheduler."
      - "It makes every @Async method run on a scheduled thread pool."
      - "It converts all @EventListener methods into recurring jobs."
      - "It is required only when using Quartz, not Spring's own scheduler."
    answer: 0
    explanation: |
      @EnableScheduling turns on Spring's scheduling support by registering a ScheduledAnnotationBeanPostProcessor that scans beans for @Scheduled methods and schedules them on a TaskScheduler. It is unrelated to @Async or events.
    ref: "concepts.md#enablescheduling-and-scheduled"

  - id: async-scheduling-events-002
    difficulty: beginner
    tags: [scheduled, method-rules]
    question: |
      Which signature constraints apply to a method annotated with @Scheduled?
    options:
      - "It must return a Future and take one argument."
      - "It must have a void return type and take no arguments."
      - "It must be static and public."
      - "It must return a boolean indicating success."
    answer: 1
    explanation: |
      A @Scheduled method must return void (non-void returns are ignored) and accept no arguments, since there is no natural source for arguments on a scheduled invocation. The enclosing type must be a Spring bean.
    ref: "concepts.md#enablescheduling-and-scheduled"

  - id: async-scheduling-events-003
    difficulty: intermediate
    tags: [fixed-rate, fixed-delay]
    question: |
      A @Scheduled method annotated with fixedDelay = 5000 takes 8 seconds to run each time, on the default single-threaded scheduler. Approximately how often does it start?
    options:
      - "Every 5 seconds regardless of runtime."
      - "Every 8 seconds (runtime only)."
      - "Every 13 seconds (8s runtime + 5s delay after completion)."
      - "Every 3 seconds."
    answer: 2
    explanation: |
      fixedDelay measures the gap from the END of one execution to the START of the next. So each cycle is 8s of work + 5s delay = 13s between starts.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-004
    difficulty: intermediate
    tags: [fixed-rate, fixed-delay]
    question: |
      What is the fundamental difference between fixedRate and fixedDelay?
    options:
      - "fixedRate measures start-to-start; fixedDelay measures end-to-next-start."
      - "fixedRate measures end-to-start; fixedDelay measures start-to-start."
      - "They are identical; fixedDelay is just deprecated."
      - "fixedRate only works with cron expressions."
    answer: 0
    explanation: |
      fixedRate is the interval between the START of successive executions; fixedDelay is the interval between the COMPLETION of one execution and the START of the next. fixedDelay always leaves a gap after each run and naturally avoids overlap.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-005
    difficulty: intermediate
    tags: [cron, fields]
    question: |
      How many fields does a Spring @Scheduled cron expression have, and what does the first field represent?
    options:
      - "Five fields; the first is minutes (standard Unix cron)."
      - "Six fields; the first is day-of-week."
      - "Seven fields; the first is milliseconds."
      - "Six fields; the first is seconds."
    answer: 3
    explanation: |
      Spring cron uses six fields — second, minute, hour, day-of-month, month, day-of-week — with seconds first. This differs from the classic five-field Unix cron that has no seconds field.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-006
    difficulty: beginner
    tags: [initial-delay]
    question: |
      What does the initialDelay attribute of @Scheduled control?
    options:
      - "The delay before the first execution after the context starts."
      - "The maximum time a task may run before being cancelled."
      - "The delay between the publisher and the listener for events."
      - "The delay before Spring registers the scheduler bean."
    answer: 0
    explanation: |
      initialDelay delays only the FIRST execution after startup. Subsequent executions follow the fixedRate/fixedDelay interval. It is commonly used to stagger jobs at boot or wait for warm-up.
    ref: "concepts.md#initialdelay"

  - id: async-scheduling-events-007
    difficulty: intermediate
    tags: [initial-delay, cron]
    question: |
      What happens if you combine initialDelay with a cron expression on @Scheduled?
    options:
      - "The initialDelay is added to every cron fire time."
      - "It is allowed and delays the first cron match only."
      - "It is not allowed and results in an exception at startup."
      - "The cron expression is ignored in favor of the delay."
    answer: 2
    explanation: |
      initialDelay is only valid with fixedRate or fixedDelay. With cron the next fire time is derived from the expression, so specifying initialDelay throws an IllegalArgumentException during startup.
    ref: "concepts.md#initialdelay"

  - id: async-scheduling-events-008
    difficulty: intermediate
    tags: [thread-pool-task-scheduler, pool-size]
    question: |
      What is the default pool size of Spring's scheduling infrastructure if you do not define your own TaskScheduler, and why does it matter?
    options:
      - "10 threads; jobs run fully in parallel by default."
      - "Equal to the number of CPU cores; contention is impossible."
      - "1 thread; a single long-running or blocking job delays all other scheduled jobs."
      - "Unbounded; a new thread is created per job."
    answer: 2
    explanation: |
      The default scheduler is single-threaded (pool size 1). One blocking job starves all other @Scheduled tasks. Fix by defining a ThreadPoolTaskScheduler or setting spring.task.scheduling.pool.size.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-009
    difficulty: intermediate
    tags: [task-scheduler, task-executor]
    question: |
      What is the difference between TaskScheduler and TaskExecutor in Spring?
    options:
      - "TaskScheduler handles time-based/recurring execution; TaskExecutor handles fire-and-forget parallel execution (used by @Async)."
      - "They are interchangeable interfaces with identical methods."
      - "TaskExecutor is for cron jobs; TaskScheduler is for @Async."
      - "TaskScheduler is reactive; TaskExecutor is blocking only."
    answer: 0
    explanation: |
      TaskScheduler provides schedule/scheduleAtFixedRate/scheduleWithFixedDelay for timed and recurring work. TaskExecutor (backing @Async) is for parallel fire-and-forget execution with no timing semantics.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-010
    difficulty: beginner
    tags: [enable-async, async]
    question: |
      Which two annotations together enable asynchronous method execution in Spring?
    options:
      - "@EnableAsync on a configuration class and @Async on the method."
      - "@EnableScheduling on the class and @Scheduled on the method."
      - "@Async on the config class and @EnableAsync on the method."
      - "@EventListener on the class and @Async on the method."
    answer: 0
    explanation: |
      @EnableAsync activates the async infrastructure (an AsyncAnnotationBeanPostProcessor), and @Async marks the individual methods to run on a TaskExecutor.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-011
    difficulty: advanced
    tags: [async, internals, proxy]
    question: |
      How is @Async implemented under the hood?
    options:
      - "By spawning an OS thread inside the JVM class loader."
      - "Through bytecode weaving at compile time only."
      - "Via an AOP proxy (AsyncAnnotationAdvisor) whose advice submits the invocation to a TaskExecutor and returns immediately."
      - "By moving the method to a Quartz job store."
    answer: 2
    explanation: |
      @Async is pure Spring AOP. @EnableAsync registers an AsyncAnnotationBeanPostProcessor that wraps beans in a proxy; the advice submits the real call to a TaskExecutor. This is the same proxy machinery as @Transactional, hence the same self-invocation caveats.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-012
    difficulty: intermediate
    tags: [async, return-types]
    question: |
      Which return types are valid for an @Async method?
    options:
      - "Only void."
      - "Only CompletableFuture."
      - "void, Future, CompletableFuture (and legacy ListenableFuture)."
      - "Any object type, returned directly without wrapping."
    answer: 2
    explanation: |
      @Async supports void (fire-and-forget), Future, CompletableFuture, and the deprecated ListenableFuture. Non-void async methods must return the result wrapped in a completed Future/CompletableFuture synchronously.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-013
    difficulty: intermediate
    tags: [async, completable-future]
    question: |
      Inside a non-void @Async method that computes an Order, how should you return the result?
    options:
      - "return order;  // return the raw value"
      - "return CompletableFuture.completedFuture(order);"
      - "return new Thread(() -> order);"
      - "throw the result as a checked exception"
    answer: 1
    explanation: |
      A non-void @Async method must synchronously return a Future/CompletableFuture wrapping the result, e.g. CompletableFuture.completedFuture(order). Spring reads that future and delivers it to the caller.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-014
    difficulty: advanced
    tags: [async, self-invocation, proxy]
    question: |
      Given this code, what actually happens when process() is called on an injected OrderService bean?

      @Service
      public class OrderService {
          public void process() { doAsync(); }
          @Async public void doAsync() { /* work */ }
      }
    options:
      - "doAsync() runs synchronously on the caller's thread because the internal this.doAsync() call bypasses the proxy."
      - "doAsync() runs on a separate thread because @Async is method-level."
      - "Spring throws an exception because @Async cannot be void."
      - "process() itself becomes asynchronous."
    answer: 0
    explanation: |
      Self-invocation (this.doAsync()) bypasses the AOP proxy that implements @Async, so the async advice never runs and the method executes synchronously. Move doAsync to another bean or self-inject the proxy.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-015
    difficulty: intermediate
    tags: [async, self-invocation, fixes]
    question: |
      Which of the following is a correct fix for the @Async self-invocation problem?
    options:
      - "Make the async method private."
      - "Move the @Async method into a separate bean and inject that bean."
      - "Remove @EnableAsync."
      - "Add synchronized to the async method."
    answer: 1
    explanation: |
      Because @Async needs the proxy, the standard fix is to move the async method to a separate bean and inject it, so the call goes through the proxy. Alternatives: self-inject the proxy or use AopContext.currentProxy() with exposeProxy=true.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-016
    difficulty: advanced
    tags: [async, exception-handling, uncaught-handler]
    question: |
      For a void-returning @Async method that throws an exception, where does the exception go?
    options:
      - "It propagates to the caller's try/catch at the call site."
      - "It is routed to the configured AsyncUncaughtExceptionHandler (default logs it)."
      - "It is swallowed and completely invisible in all cases."
      - "It rolls back the caller's transaction automatically."
    answer: 1
    explanation: |
      A void @Async method has no Future to carry the exception, so Spring hands it to the AsyncUncaughtExceptionHandler (default SimpleAsyncUncaughtExceptionHandler logs it). A caller-side try/catch cannot catch it because the caller already returned.
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-017
    difficulty: advanced
    tags: [async, exception-handling, future]
    question: |
      For an @Async method returning CompletableFuture that throws, how does the caller observe the exception?
    options:
      - "Via the AsyncUncaughtExceptionHandler only."
      - "It is captured in the future and surfaces via get() (wrapped in ExecutionException) or exceptionally/whenComplete."
      - "It cannot be observed at all."
      - "It is thrown immediately at publishEvent time."
    answer: 1
    explanation: |
      When the async method returns a Future/CompletableFuture, the exception is stored in the future and surfaces when the caller calls get() (as ExecutionException) or via composition methods like exceptionally/whenComplete. The AsyncUncaughtExceptionHandler is NOT used in this case.
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-018
    difficulty: intermediate
    tags: [async, executor, async-configurer]
    question: |
      How do you set the DEFAULT executor used by all @Async methods?
    options:
      - "Set spring.async.enabled=true."
      - "Annotate each method with @Async(\"default\")."
      - "Implement AsyncConfigurer and override getAsyncExecutor()."
      - "There is no way to change the default executor."
    answer: 2
    explanation: |
      Implementing AsyncConfigurer and overriding getAsyncExecutor() supplies the default Executor for all @Async methods. You can also select a specific executor per method with @Async("beanName").
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-019
    difficulty: advanced
    tags: [thread-pool-task-executor, sizing]
    question: |
      A ThreadPoolTaskExecutor is configured with corePoolSize=4, maxPoolSize=16, and queueCapacity=Integer.MAX_VALUE. Under heavy sustained load, how many threads will it typically use?
    options:
      - "Up to 16, because maxPoolSize governs peak concurrency."
      - "Exactly 20 (core + max)."
      - "Only 4, because tasks queue in the effectively unbounded queue and the pool never grows past core."
      - "0; the executor rejects everything."
    answer: 2
    explanation: |
      The pool grows toward maxPoolSize only when the queue is full. With an effectively unbounded queue, tasks always fit in the queue, so the pool never exceeds corePoolSize (4). This is a classic sizing trap.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-020
    difficulty: intermediate
    tags: [simple-async-task-executor, threads]
    question: |
      What is the notable risk of SimpleAsyncTaskExecutor under load?
    options:
      - "It reuses a single thread and serializes everything."
      - "It only runs on virtual threads."
      - "It blocks the caller until the task completes."
      - "It does not pool/reuse threads — it creates a new thread per task (unless a concurrency limit is set)."
    answer: 3
    explanation: |
      SimpleAsyncTaskExecutor does not reuse threads; by default it spawns a fresh thread for each task, which can exhaust resources under load. Prefer a ThreadPoolTaskExecutor (Spring Boot auto-configures one named applicationTaskExecutor).
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-021
    difficulty: beginner
    tags: [events, publisher]
    question: |
      Which interface is used to publish an application event in Spring?
    options:
      - "ApplicationEventPublisher"
      - "EventBus"
      - "MessageChannel"
      - "TaskExecutor"
    answer: 0
    explanation: |
      You inject ApplicationEventPublisher and call publishEvent(event). ApplicationContext itself implements this interface.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-022
    difficulty: intermediate
    tags: [events, pojo, spring-4.2]
    question: |
      Since Spring 4.2, what type must an application event be?
    options:
      - "It must extend ApplicationEvent."
      - "It must implement Serializable."
      - "It can be any POJO — extending ApplicationEvent is optional."
      - "It must be a record annotated with @Event."
    answer: 2
    explanation: |
      Since Spring 4.2, events need not extend ApplicationEvent; any POJO may be published and listened to. Extending ApplicationEvent is still allowed and provides a timestamp and source.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-023
    difficulty: advanced
    tags: [events, sync-default, transaction]
    question: |
      By default, when a @Transactional method publishes an event and a synchronous @EventListener throws an exception, what happens?
    options:
      - "The exception is logged and the publisher continues normally."
      - "The event is retried on a background thread."
      - "The exception propagates back to the publisher and can roll back the publisher's transaction."
      - "Nothing; listeners are always isolated in their own transactions."
    answer: 2
    explanation: |
      Default event publication is synchronous, on the publisher's thread, within the same transaction. A throwing listener propagates the exception to the publisher and can roll back its transaction. Listeners are NOT isolated by default.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-024
    difficulty: intermediate
    tags: [events, sync-default]
    question: |
      Which statement about default Spring event publication is TRUE?
    options:
      - "publishEvent() returns immediately and listeners run on a thread pool."
      - "publishEvent() blocks until all matching listeners finish, running them on the publisher's thread."
      - "Events are queued to a JMS broker before delivery."
      - "Each listener automatically runs in its own new transaction."
    answer: 1
    explanation: |
      Spring events are synchronous and single-threaded by default. publishEvent() blocks until every matching listener completes, on the caller's thread. Total publish latency is the sum of listener latencies.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-025
    difficulty: intermediate
    tags: [transactional-event-listener, phases]
    question: |
      What is the DEFAULT transaction phase for @TransactionalEventListener?
    options:
      - "AFTER_COMMIT"
      - "BEFORE_COMMIT"
      - "AFTER_ROLLBACK"
      - "AFTER_COMPLETION"
    answer: 0
    explanation: |
      The default phase is AFTER_COMMIT, so the listener runs only after the publishing transaction commits successfully — the canonical "notify only if the data actually persisted" pattern.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-026
    difficulty: advanced
    tags: [transactional-event-listener, no-transaction]
    question: |
      What happens by default when an event is published for a @TransactionalEventListener but there is NO active transaction?
    options:
      - "The listener fires immediately."
      - "Spring throws an IllegalStateException."
      - "The listener does not fire at all (the event is silently dropped)."
      - "A new transaction is created automatically."
    answer: 2
    explanation: |
      Without an active transaction, a @TransactionalEventListener does not fire by default. To make it run in that case, set fallbackExecution = true.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-027
    difficulty: advanced
    tags: [transactional-event-listener, after-commit, requires-new]
    question: |
      An AFTER_COMMIT @TransactionalEventListener writes a new row to the database, but the row never appears. What is the most likely cause?
    options:
      - "AFTER_COMMIT listeners cannot access the DataSource."
      - "The write runs after the original transaction committed, outside any transaction, so it isn't committed unless a new transaction (e.g. REQUIRES_NEW) is started."
      - "AFTER_COMMIT listeners always run on a read-only connection."
      - "The event was published before the row was created."
    answer: 1
    explanation: |
      AFTER_COMMIT code runs once the original transaction has already committed, so new DB writes there are outside a transaction and typically not committed. Wrap the write in a new transaction, e.g. @Transactional(propagation = REQUIRES_NEW).
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-028
    difficulty: intermediate
    tags: [async-events, listener]
    question: |
      How do you make a single @EventListener run asynchronously?
    options:
      - "Set the event class to implement AsyncEvent."
      - "Add @Async to the listener method and ensure @EnableAsync is present."
      - "Call publishEventAsync() instead of publishEvent()."
      - "Annotate the publisher with @Async."
    answer: 1
    explanation: |
      Annotate the listener with both @EventListener (or @TransactionalEventListener) and @Async, with @EnableAsync enabled. The listener then runs on a TaskExecutor thread and publishEvent returns immediately.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-029
    difficulty: advanced
    tags: [async-events, exceptions, transaction]
    question: |
      When you add @Async to an event listener, how does exception and transaction behavior change?
    options:
      - "Exceptions still propagate to the publisher and can roll back its transaction."
      - "Exceptions no longer propagate to the publisher (they go to the AsyncUncaughtExceptionHandler), and the listener no longer shares the caller's transaction/thread context."
      - "The listener automatically starts a nested transaction."
      - "Nothing changes; @Async only affects timing."
    answer: 1
    explanation: |
      Once a listener is @Async it runs on a separate thread, so it loses the caller's transaction and thread-bound context, and its exceptions go to the AsyncUncaughtExceptionHandler rather than propagating to the publisher. It can no longer roll back the caller's transaction.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-030
    difficulty: advanced
    tags: [events, all-async, multicaster]
    question: |
      How can you make ALL application events dispatch asynchronously (not just one listener)?
    options:
      - "Annotate the ApplicationContext with @Async."
      - "Add spring.events.async=true to application.properties."
      - "Set a taskExecutor on the SimpleApplicationEventMulticaster (applicationEventMulticaster bean)."
      - "It is impossible without a message broker."
    answer: 2
    explanation: |
      The multicaster (SimpleApplicationEventMulticaster) delivers events. Setting a taskExecutor on the applicationEventMulticaster bean makes all events async. Per-listener @Async is usually preferred because it's targeted.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-031
    difficulty: beginner
    tags: [cron, expression]
    question: |
      What does the Spring cron expression "0 0 * * * *" mean?
    options:
      - "Every minute."
      - "At the top of every hour (second 0, minute 0)."
      - "Every second."
      - "Once per day at midnight."
    answer: 1
    explanation: |
      Fields are second minute hour day-of-month month day-of-week. "0 0 * * * *" fires when seconds=0 and minutes=0 for every hour — i.e. the top of every hour.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-032
    difficulty: intermediate
    tags: [cron, macros]
    question: |
      Which of these is a valid Spring cron macro that can replace a full expression?
    options:
      - "@everyMinute"
      - "@60seconds"
      - "@daily"
      - "@startup"
    answer: 2
    explanation: |
      Spring supports macros @hourly, @daily (aka @midnight), @weekly, @monthly, @yearly/@annually. @everyMinute, @60seconds, and @startup are not valid macros.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-033
    difficulty: intermediate
    tags: [scheduled, externalized-config]
    question: |
      Which attribute lets you externalize a fixedRate value to a property placeholder?
    options:
      - "fixedRate with a String literal"
      - "rateProperty"
      - "cron only supports placeholders"
      - "fixedRateString (e.g. fixedRateString = \"${job.rate:5000}\")"
    answer: 3
    explanation: |
      fixedRateString (and fixedDelayString / initialDelayString) accept property placeholders and, since Spring 6, ISO-8601 duration strings like "PT5S". The numeric fixedRate cannot reference properties directly.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-034
    difficulty: advanced
    tags: [scheduler, resolution-order]
    question: |
      With no explicit configuration, in what order does the ScheduledTaskRegistrar resolve which scheduler to use?
    options:
      - "It always creates an unbounded cached thread pool."
      - "It uses the @Async executor by default."
      - "TaskScheduler bean, then uniquely-named TaskScheduler, then a ScheduledExecutorService bean, else a locally-created single-threaded ScheduledExecutorService."
      - "It requires a bean and fails startup if none is provided."
    answer: 2
    explanation: |
      Resolution order: a TaskScheduler bean → a uniquely named TaskScheduler → a ScheduledExecutorService bean → otherwise a locally created single-threaded ScheduledExecutorService. Boot can also configure it via spring.task.scheduling.* properties.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-035
    difficulty: intermediate
    tags: [async, proxy-target-class, boot]
    question: |
      In Spring Boot, what is the default proxy strategy relevant to @Async and why does it matter?
    options:
      - "JDK dynamic proxies only, so beans must implement an interface."
      - "No proxies; @Async uses reflection directly on private methods."
      - "AspectJ compile-time weaving is always used."
      - "CGLIB (class-based) proxies by default, so classes without interfaces can be proxied — but the class/method must not be final."
    answer: 3
    explanation: |
      Spring Boot defaults proxyTargetClass to true (CGLIB), so class-based proxies work even without interfaces. But CGLIB subclasses the target, so final classes/methods and private/static methods cannot be advised.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-036
    difficulty: intermediate
    tags: [events, conditional, spel]
    question: |
      How can you conditionally invoke an @EventListener only for certain events?
    options:
      - "Use the condition attribute with a SpEL expression, e.g. @EventListener(condition = \"#e.amount > 100\")."
      - "Throw an exception to skip the listener."
      - "Use @ConditionalOnEvent."
      - "Conditions are not supported; you must filter inside the method."
    answer: 0
    explanation: |
      @EventListener supports a SpEL condition attribute; the listener runs only when the expression evaluates to true. The event is referenced by its parameter name or #root.event.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-037
    difficulty: advanced
    tags: [events, chained-publishing]
    question: |
      What happens if a non-void @EventListener method returns a value?
    options:
      - "The return value is ignored entirely."
      - "Spring publishes the returned value (or each element of a returned Collection/array) as a new event."
      - "It throws an error because listeners must be void."
      - "The value is stored as the event's result attribute."
    answer: 1
    explanation: |
      If an @EventListener returns a non-null value, Spring publishes it as a new event (each element if it's a Collection/array). Returning void or null publishes nothing. This enables event chaining.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-038
    difficulty: intermediate
    tags: [events, ordering]
    question: |
      How do you control the order in which multiple listeners for the same event are invoked?
    options:
      - "Alphabetically by bean name; it cannot be changed."
      - "By declaration order in the class file."
      - "Annotate the listeners with @Order (lower value = earlier)."
      - "Order is random and non-deterministic."
    answer: 2
    explanation: |
      @Order controls the invocation order of listeners for the same event; lower values run first. This is meaningful for synchronous events; with async listeners running on different threads there is no completion-order guarantee.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-039
    difficulty: beginner
    tags: [scheduled, boot-config]
    question: |
      Which Spring Boot property tunes the number of threads for the auto-configured task scheduler?
    options:
      - "spring.async.pool.size"
      - "server.scheduler.threads"
      - "spring.scheduler.count"
      - "spring.task.scheduling.pool.size"
    answer: 3
    explanation: |
      spring.task.scheduling.pool.size (default 1) sizes the auto-configured scheduler; spring.task.scheduling.thread-name-prefix names the threads. For @Async, the analogous properties are under spring.task.execution.*.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-040
    difficulty: advanced
    tags: [fixed-rate, single-thread, overlap]
    question: |
      A task with @Scheduled(fixedRate = 1000) takes 3 seconds to complete on the DEFAULT single-threaded scheduler. What is the observed behavior?
    options:
      - "Three copies run concurrently every second."
      - "Executions serialize back-to-back (~every 3s) because the single thread cannot start a new run until the current one finishes."
      - "Spring throws a concurrency exception."
      - "The task is skipped entirely after the first run."
    answer: 1
    explanation: |
      fixedRate is aspirational, but a single-threaded scheduler cannot overlap executions. The scheduler wants to start every 1s but the busy thread forces serialization, so runs occur roughly back-to-back every ~3s. A larger pool would still not run the SAME task concurrently unless you make it @Async.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-041
    difficulty: intermediate
    tags: [async, void, fire-and-forget]
    question: |
      Which statement about a void-returning @Async method is correct?
    options:
      - "The caller can block on it to wait for completion."
      - "It automatically retries on failure."
      - "It is fire-and-forget; the caller cannot observe completion or catch its exceptions directly."
      - "It must be annotated @Transactional."
    answer: 2
    explanation: |
      A void @Async method is fire-and-forget: the caller returns immediately with no handle to wait on and cannot catch exceptions at the call site — those go to the AsyncUncaughtExceptionHandler.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-042
    difficulty: advanced
    tags: [transactional-event-listener, phases, before-commit]
    question: |
      Which TransactionPhase fires the listener before the transaction's changes are flushed/committed?
    options:
      - "BEFORE_COMMIT"
      - "AFTER_COMMIT"
      - "AFTER_ROLLBACK"
      - "AFTER_COMPLETION"
    answer: 0
    explanation: |
      BEFORE_COMMIT runs the listener before the commit is flushed. The other phases run after commit, after rollback, or after completion (either outcome).
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-043
    difficulty: intermediate
    tags: [transactional-event-listener, use-case]
    question: |
      What is the canonical use case for @TransactionalEventListener(phase = AFTER_COMMIT)?
    options:
      - "Rolling back the transaction when a listener fails."
      - "Reducing the number of listener beans."
      - "Performing side effects (email, Kafka publish) only after the DB change is durably committed."
      - "Making events synchronous."
    answer: 2
    explanation: |
      AFTER_COMMIT ensures external side effects happen only if the transaction actually committed, avoiding the bug of notifying/publishing and then having the transaction roll back.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-044
    difficulty: beginner
    tags: [async, executor-qualifier]
    question: |
      What does @Async("mailExecutor") do?
    options:
      - "Runs this method on the Executor bean named/qualified mailExecutor, overriding the default executor."
      - "Creates a new executor bean named mailExecutor."
      - "Renames the current thread to mailExecutor."
      - "Schedules the method every mailExecutor milliseconds."
    answer: 0
    explanation: |
      The value on @Async is a qualifier naming a specific Executor bean; that method runs on that executor instead of the default one. Useful for isolating workloads on separate pools.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-045
    difficulty: advanced
    tags: [thread-pool-task-executor, rejection]
    question: |
      With a ThreadPoolTaskExecutor, what happens when both the queue is full AND the pool has reached maxPoolSize, using default settings?
    options:
      - "New tasks are silently discarded with no signal."
      - "The executor grows the pool without bound."
      - "The RejectedExecutionHandler runs; the default AbortPolicy throws a TaskRejectedException."
      - "The caller thread blocks forever."
    answer: 2
    explanation: |
      When the queue is full and maxPoolSize is reached, the RejectedExecutionHandler is invoked. The default is AbortPolicy, which throws (Spring wraps it as TaskRejectedException). You can choose CallerRunsPolicy etc.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-046
    difficulty: intermediate
    tags: [scheduled, mutual-exclusivity]
    question: |
      Which combination on a single @Scheduled annotation is INVALID?
    options:
      - "fixedRate together with fixedDelay"
      - "fixedRate with initialDelay"
      - "cron alone"
      - "fixedDelay with initialDelayString"
    answer: 0
    explanation: |
      Exactly one of cron, fixedRate, or fixedDelay may be specified. Combining fixedRate and fixedDelay is invalid. initialDelay may accompany fixedRate/fixedDelay (but not cron).
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-047
    difficulty: advanced
    tags: [async, listenable-future, spring6]
    question: |
      In Spring 6 / Spring Boot 3, which async return type is deprecated in favor of CompletableFuture?
    options:
      - "ListenableFuture"
      - "Future"
      - "void"
      - "CompletionStage"
    answer: 0
    explanation: |
      Spring's ListenableFuture is deprecated in Spring 6 in favor of the JDK's CompletableFuture, which offers standard non-blocking composition.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-048
    difficulty: intermediate
    tags: [scheduling-configurer, programmatic]
    question: |
      How can you register scheduled tasks programmatically or supply a custom scheduler for @Scheduled?
    options:
      - "Implement SchedulingConfigurer and override configureTasks(ScheduledTaskRegistrar)."
      - "Override the main() method."
      - "Annotate a method with @ScheduleProgrammatic."
      - "It is impossible; only annotations are supported."
    answer: 0
    explanation: |
      Implementing SchedulingConfigurer lets you set the scheduler (registrar.setScheduler(...)) and register tasks with dynamic triggers/cron programmatically via the ScheduledTaskRegistrar.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-049
    difficulty: advanced
    tags: [events, sync-default, latency]
    question: |
      A service publishes an event synchronously to three listeners that take 100ms, 200ms, and 300ms respectively (all synchronous, single-threaded). How long does publishEvent() take to return?
    options:
      - "About 300ms (the slowest listener)."
      - "About 600ms (the sum, since they run sequentially on the caller's thread)."
      - "About 0ms (publishing is always non-blocking)."
      - "About 200ms (the average)."
    answer: 1
    explanation: |
      Default publication is synchronous and sequential on the publisher's thread, so total time is the sum: 100 + 200 + 300 = ~600ms. Making listeners @Async would decouple this.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-050
    difficulty: beginner
    tags: [transactional-event-listener, annotation]
    question: |
      Which annotation defers a listener until a specific phase of the surrounding transaction?
    options:
      - "@EventListener"
      - "@TransactionalEventListener"
      - "@Scheduled"
      - "@Async"
    answer: 1
    explanation: |
      @TransactionalEventListener binds listener invocation to a TransactionPhase (default AFTER_COMMIT) of the publishing transaction, unlike plain @EventListener which fires immediately at publishEvent().
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-051
    difficulty: intermediate
    tags: [async, public-method, proxy]
    question: |
      Why must an @Async method be public (in proxy-based mode)?
    options:
      - "Because Java requires all annotated methods to be public."
      - "Because private methods cannot throw exceptions."
      - "Because the AOP proxy can only intercept externally-visible (public) methods; non-public methods are not advised."
      - "It doesn't; @Async works on private methods too."
    answer: 2
    explanation: |
      Proxy-based AOP (JDK or CGLIB) intercepts public methods only. Private/protected/package-private and static methods are not advised, so @Async on them is silently ignored.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-052
    difficulty: advanced
    tags: [transactional-event-listener, async-combo]
    question: |
      You want after-commit work to run on a background thread. Which combination achieves this?
    options:
      - "@TransactionalEventListener alone (it is async by default)."
      - "@Scheduled(fixedDelay = 0)."
      - "@TransactionalEventListener(phase = AFTER_COMMIT) plus @Async, with @EnableAsync."
      - "publishEventAsync(event)."
    answer: 2
    explanation: |
      @TransactionalEventListener is synchronous by default (runs on the committing thread during the after-commit callback). Add @Async (and @EnableAsync) to offload the after-commit work to a TaskExecutor thread.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-053
    difficulty: intermediate
    tags: [scheduled, duration, spring6]
    question: |
      Since Spring 5.3, how can you express a @Scheduled interval using a unit other than milliseconds?
    options:
      - "Only milliseconds are supported."
      - "Append a suffix like fixedRate = \"5s\"."
      - "Use @Scheduled(rate = Duration.ofSeconds(5))."
      - "Use the timeUnit attribute, e.g. @Scheduled(fixedRate = 5, timeUnit = TimeUnit.SECONDS)."
    answer: 3
    explanation: |
      Spring 5.3 (specifically 5.3.10) added a timeUnit attribute so fixedRate/fixedDelay/initialDelay can be expressed in seconds, minutes, etc. The *String variants also accept ISO-8601 duration strings like "PT5S".
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-054
    difficulty: advanced
    tags: [events, listener-interface, generics]
    question: |
      Which statement about listening for events is correct?
    options:
      - "@EventListener resolves the target event type from the method's parameter type, and can list multiple types via @EventListener({A.class, B.class})."
      - "You can only listen by implementing ApplicationListener; annotations are not supported."
      - "A single @EventListener method can never handle more than one event type."
      - "@EventListener requires the event to extend ApplicationEvent."
    answer: 0
    explanation: |
      @EventListener infers the event type from the method parameter and supports multiple types via the classes() attribute (e.g. @EventListener({A.class, B.class})). The legacy ApplicationListener interface style also works but is less flexible.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-055
    difficulty: advanced
    tags: [async, virtual-threads, boot-3.2]
    question: |
      In Spring Boot 3.2+, what does setting spring.threads.virtual.enabled=true do relevant to async processing?
    options:
      - "Disables @Async entirely."
      - "Makes @Async execution and web request handling use virtual threads (Project Loom) instead of platform threads."
      - "Converts all scheduled cron jobs into events."
      - "Forces JDK dynamic proxies for all beans."
    answer: 1
    explanation: |
      Spring Boot 3.2 (on Java 21+) can run @Async tasks and web request handling on virtual threads when spring.threads.virtual.enabled=true, improving scalability of blocking workloads. Scheduling still needs a platform-thread scheduler for timing.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-056
    difficulty: intermediate
    tags: [async, boot-executor]
    question: |
      What default executor does Spring Boot auto-configure for @Async when you don't provide one?
    options:
      - "A ForkJoinPool.commonPool()."
      - "A single-threaded scheduler shared with @Scheduled."
      - "A ThreadPoolTaskExecutor bean named applicationTaskExecutor (also exposed as taskExecutor)."
      - "No executor; @Async fails without an AsyncConfigurer."
    answer: 2
    explanation: |
      Spring Boot auto-configures a ThreadPoolTaskExecutor named applicationTaskExecutor (aliased taskExecutor), which @Async uses by default. Tune it via spring.task.execution.* properties.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-057
    difficulty: advanced
    tags: [transactional-event-listener, fallback]
    question: |
      A developer reports that a @TransactionalEventListener sometimes never runs during unit tests that don't open a transaction. What is the correct minimal fix if they want it to run regardless?
    options:
      - "Add @Async to the listener."
      - "Switch to @Scheduled."
      - "Wrap publishEvent in a try/catch."
      - "Set fallbackExecution = true on the @TransactionalEventListener."
    answer: 3
    explanation: |
      When no transaction is active, @TransactionalEventListener is skipped by default. Setting fallbackExecution = true makes it execute immediately even without a surrounding transaction.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-058
    difficulty: beginner
    tags: [async, disable-cron]
    question: |
      What is the effect of a @Scheduled(cron = "-") value?
    options:
      - "It runs every second."
      - "It throws an exception at startup."
      - "It disables the trigger (the task is not scheduled)."
      - "It runs once at startup only."
    answer: 2
    explanation: |
      A cron value of "-" is a special disabled trigger, letting you externalize the cron string and turn a job off (e.g. via a property) without removing the annotation.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"
