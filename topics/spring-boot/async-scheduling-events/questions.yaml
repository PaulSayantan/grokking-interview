topic: "Asynchronous Processing, Scheduling & Application Events"
domain: spring-boot
topic_slug: async-scheduling-events
version: 1
questions:
  - id: async-scheduling-events-001
    difficulty: beginner
    tags: [enable-scheduling, annotations]
    question: |
      What is the role of the @EnableScheduling annotation in a Spring application?
    options:
      - "It registers infrastructure (a ScheduledAnnotationBeanPostProcessor) that detects @Scheduled methods and wires them to a TaskScheduler."
      - "It makes every @Async method run on a scheduled thread pool."
      - "It converts all @EventListener methods into recurring jobs."
      - "It is required only when using Quartz, not Spring's own scheduler."
    answer: 0
    explanation: |
      @EnableScheduling turns on Spring's scheduling support by registering a ScheduledAnnotationBeanPostProcessor that scans beans for @Scheduled methods and schedules them on a TaskScheduler. It is unrelated to @Async or events.
    ref: "concepts.md#enablescheduling-and-scheduled"

  - id: async-scheduling-events-002
    difficulty: beginner
    tags: [scheduled, method-rules]
    question: |
      Which signature constraints apply to a method annotated with @Scheduled?
    options:
      - "It must return a Future and take one argument."
      - "It must have a void return type and take no arguments."
      - "It must be static and public."
      - "It must return a boolean indicating success."
    answer: 1
    explanation: |
      A @Scheduled method must return void (non-void returns are ignored) and accept no arguments, since there is no natural source for arguments on a scheduled invocation. The enclosing type must be a Spring bean.
    ref: "concepts.md#enablescheduling-and-scheduled"

  - id: async-scheduling-events-003
    difficulty: intermediate
    tags: [fixed-rate, fixed-delay]
    question: |
      A @Scheduled method annotated with fixedDelay = 5000 takes 8 seconds to run each time, on the default single-threaded scheduler. Approximately how often does it start?
    options:
      - "Every 5 seconds regardless of runtime."
      - "Every 8 seconds (runtime only)."
      - "Every 13 seconds (8s runtime + 5s delay after completion)."
      - "Every 3 seconds."
    answer: 2
    explanation: |
      fixedDelay measures the gap from the END of one execution to the START of the next. So each cycle is 8s of work + 5s delay = 13s between starts.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-004
    difficulty: intermediate
    tags: [fixed-rate, fixed-delay]
    question: |
      What is the fundamental difference between fixedRate and fixedDelay?
    options:
      - "fixedRate measures start-to-start; fixedDelay measures end-to-next-start."
      - "fixedRate measures end-to-start; fixedDelay measures start-to-start."
      - "They are identical; fixedDelay is just deprecated."
      - "fixedRate only works with cron expressions."
    answer: 0
    explanation: |
      fixedRate is the interval between the START of successive executions; fixedDelay is the interval between the COMPLETION of one execution and the START of the next. fixedDelay always leaves a gap after each run and naturally avoids overlap.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-005
    difficulty: intermediate
    tags: [cron, fields]
    question: |
      How many fields does a Spring @Scheduled cron expression have, and what does the first field represent?
    options:
      - "Five fields; the first is minutes (standard Unix cron)."
      - "Six fields; the first is day-of-week."
      - "Seven fields; the first is milliseconds."
      - "Six fields; the first is seconds."
    answer: 3
    explanation: |
      Spring cron uses six fields — second, minute, hour, day-of-month, month, day-of-week — with seconds first. This differs from the classic five-field Unix cron that has no seconds field.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-006
    difficulty: beginner
    tags: [initial-delay]
    question: |
      What does the initialDelay attribute of @Scheduled control?
    options:
      - "The delay before the first execution after the context starts."
      - "The maximum time a task may run before being cancelled."
      - "The delay between the publisher and the listener for events."
      - "The delay before Spring registers the scheduler bean."
    answer: 0
    explanation: |
      initialDelay delays only the FIRST execution after startup. Subsequent executions follow the fixedRate/fixedDelay interval. It is commonly used to stagger jobs at boot or wait for warm-up.
    ref: "concepts.md#initialdelay"

  - id: async-scheduling-events-007
    difficulty: intermediate
    tags: [initial-delay, cron]
    question: |
      What happens if you combine initialDelay with a cron expression on @Scheduled?
    options:
      - "The initialDelay is added to every cron fire time."
      - "It is allowed and delays the first cron match only."
      - "It is not allowed and results in an exception at startup."
      - "The cron expression is ignored in favor of the delay."
    answer: 2
    explanation: |
      initialDelay is only valid with fixedRate or fixedDelay. With cron the next fire time is derived from the expression, so specifying initialDelay throws an IllegalArgumentException during startup.
    ref: "concepts.md#initialdelay"

  - id: async-scheduling-events-008
    difficulty: intermediate
    tags: [thread-pool-task-scheduler, pool-size]
    question: |
      What is the default pool size of Spring's scheduling infrastructure if you do not define your own TaskScheduler, and why does it matter?
    options:
      - "10 threads; jobs run fully in parallel by default."
      - "Equal to the number of CPU cores; contention is impossible."
      - "1 thread; a single long-running or blocking job delays all other scheduled jobs."
      - "Unbounded; a new thread is created per job."
    answer: 2
    explanation: |
      The default scheduler is single-threaded (pool size 1). One blocking job starves all other @Scheduled tasks. Fix by defining a ThreadPoolTaskScheduler or setting spring.task.scheduling.pool.size.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-009
    difficulty: intermediate
    tags: [task-scheduler, task-executor]
    question: |
      What is the difference between TaskScheduler and TaskExecutor in Spring?
    options:
      - "TaskScheduler handles time-based/recurring execution; TaskExecutor handles fire-and-forget parallel execution (used by @Async)."
      - "They are interchangeable interfaces with identical methods."
      - "TaskExecutor is for cron jobs; TaskScheduler is for @Async."
      - "TaskScheduler is reactive; TaskExecutor is blocking only."
    answer: 0
    explanation: |
      TaskScheduler provides schedule/scheduleAtFixedRate/scheduleWithFixedDelay for timed and recurring work. TaskExecutor (backing @Async) is for parallel fire-and-forget execution with no timing semantics.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-010
    difficulty: beginner
    tags: [enable-async, async]
    question: |
      Which two annotations together enable asynchronous method execution in Spring?
    options:
      - "@EnableAsync on a configuration class and @Async on the method."
      - "@EnableScheduling on the class and @Scheduled on the method."
      - "@Async on the config class and @EnableAsync on the method."
      - "@EventListener on the class and @Async on the method."
    answer: 0
    explanation: |
      @EnableAsync activates the async infrastructure (an AsyncAnnotationBeanPostProcessor), and @Async marks the individual methods to run on a TaskExecutor.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-011
    difficulty: advanced
    tags: [async, internals, proxy]
    question: |
      How is @Async implemented under the hood?
    options:
      - "By spawning an OS thread inside the JVM class loader."
      - "Through bytecode weaving at compile time only."
      - "Via an AOP proxy (AsyncAnnotationAdvisor) whose advice submits the invocation to a TaskExecutor and returns immediately."
      - "By moving the method to a Quartz job store."
    answer: 2
    explanation: |
      @Async is pure Spring AOP. @EnableAsync registers an AsyncAnnotationBeanPostProcessor that wraps beans in a proxy; the advice submits the real call to a TaskExecutor. This is the same proxy machinery as @Transactional, hence the same self-invocation caveats.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-012
    difficulty: intermediate
    tags: [async, return-types]
    question: |
      Which return types are valid for an @Async method?
    options:
      - "Only void."
      - "Only CompletableFuture."
      - "void, Future, CompletableFuture (and legacy ListenableFuture)."
      - "Any object type, returned directly without wrapping."
    answer: 2
    explanation: |
      @Async supports void (fire-and-forget), Future, CompletableFuture, and the deprecated ListenableFuture. Non-void async methods must return the result wrapped in a completed Future/CompletableFuture synchronously.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-013
    difficulty: intermediate
    tags: [async, completable-future]
    question: |
      Inside a non-void @Async method that computes an Order, how should you return the result?
    options:
      - "return order;  // return the raw value"
      - "return CompletableFuture.completedFuture(order);"
      - "return new Thread(() -> order);"
      - "throw the result as a checked exception"
    answer: 1
    explanation: |
      A non-void @Async method must synchronously return a Future/CompletableFuture wrapping the result, e.g. CompletableFuture.completedFuture(order). Spring reads that future and delivers it to the caller.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-014
    difficulty: advanced
    tags: [async, self-invocation, proxy]
    question: |
      Given this code, what actually happens when process() is called on an injected OrderService bean?

      @Service
      public class OrderService {
          public void process() { doAsync(); }
          @Async public void doAsync() { /* work */ }
      }
    options:
      - "doAsync() runs synchronously on the caller's thread because the internal this.doAsync() call bypasses the proxy."
      - "doAsync() runs on a separate thread because @Async is method-level."
      - "Spring throws an exception because @Async cannot be void."
      - "process() itself becomes asynchronous."
    answer: 0
    explanation: |
      Self-invocation (this.doAsync()) bypasses the AOP proxy that implements @Async, so the async advice never runs and the method executes synchronously. Move doAsync to another bean or self-inject the proxy.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-015
    difficulty: intermediate
    tags: [async, self-invocation, fixes]
    question: |
      Which of the following is a correct fix for the @Async self-invocation problem?
    options:
      - "Make the async method private."
      - "Move the @Async method into a separate bean and inject that bean."
      - "Remove @EnableAsync."
      - "Add synchronized to the async method."
    answer: 1
    explanation: |
      Because @Async needs the proxy, the standard fix is to move the async method to a separate bean and inject it, so the call goes through the proxy. Alternatives: self-inject the proxy or use AopContext.currentProxy() with exposeProxy=true.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-016
    difficulty: advanced
    tags: [async, exception-handling, uncaught-handler]
    question: |
      For a void-returning @Async method that throws an exception, where does the exception go?
    options:
      - "It propagates to the caller's try/catch at the call site."
      - "It is routed to the configured AsyncUncaughtExceptionHandler (default logs it)."
      - "It is swallowed and completely invisible in all cases."
      - "It rolls back the caller's transaction automatically."
    answer: 1
    explanation: |
      A void @Async method has no Future to carry the exception, so Spring hands it to the AsyncUncaughtExceptionHandler (default SimpleAsyncUncaughtExceptionHandler logs it). A caller-side try/catch cannot catch it because the caller already returned.
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-017
    difficulty: advanced
    tags: [async, exception-handling, future]
    question: |
      For an @Async method returning CompletableFuture that throws, how does the caller observe the exception?
    options:
      - "Via the AsyncUncaughtExceptionHandler only."
      - "It is captured in the future and surfaces via get() (wrapped in ExecutionException) or exceptionally/whenComplete."
      - "It cannot be observed at all."
      - "It is thrown immediately at publishEvent time."
    answer: 1
    explanation: |
      When the async method returns a Future/CompletableFuture, the exception is stored in the future and surfaces when the caller calls get() (as ExecutionException) or via composition methods like exceptionally/whenComplete. The AsyncUncaughtExceptionHandler is NOT used in this case.
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-018
    difficulty: intermediate
    tags: [async, executor, async-configurer]
    question: |
      How do you set the DEFAULT executor used by all @Async methods?
    options:
      - "Set spring.async.enabled=true."
      - "Annotate each method with @Async(\"default\")."
      - "Implement AsyncConfigurer and override getAsyncExecutor()."
      - "There is no way to change the default executor."
    answer: 2
    explanation: |
      Implementing AsyncConfigurer and overriding getAsyncExecutor() supplies the default Executor for all @Async methods. You can also select a specific executor per method with @Async("beanName").
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-019
    difficulty: advanced
    tags: [thread-pool-task-executor, sizing]
    question: |
      A ThreadPoolTaskExecutor is configured with corePoolSize=4, maxPoolSize=16, and queueCapacity=Integer.MAX_VALUE. Under heavy sustained load, how many threads will it typically use?
    options:
      - "Up to 16, because maxPoolSize governs peak concurrency."
      - "Exactly 20 (core + max)."
      - "Only 4, because tasks queue in the effectively unbounded queue and the pool never grows past core."
      - "0; the executor rejects everything."
    answer: 2
    explanation: |
      The pool grows toward maxPoolSize only when the queue is full. With an effectively unbounded queue, tasks always fit in the queue, so the pool never exceeds corePoolSize (4). This is a classic sizing trap.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-020
    difficulty: intermediate
    tags: [simple-async-task-executor, threads]
    question: |
      What is the notable risk of SimpleAsyncTaskExecutor under load?
    options:
      - "It reuses a single thread and serializes everything."
      - "It only runs on virtual threads."
      - "It blocks the caller until the task completes."
      - "It does not pool/reuse threads — it creates a new thread per task (unless a concurrency limit is set)."
    answer: 3
    explanation: |
      SimpleAsyncTaskExecutor does not reuse threads; by default it spawns a fresh thread for each task, which can exhaust resources under load. Prefer a ThreadPoolTaskExecutor (Spring Boot auto-configures one named applicationTaskExecutor).
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-021
    difficulty: beginner
    tags: [events, publisher]
    question: |
      Which interface is used to publish an application event in Spring?
    options:
      - "ApplicationEventPublisher"
      - "EventBus"
      - "MessageChannel"
      - "TaskExecutor"
    answer: 0
    explanation: |
      You inject ApplicationEventPublisher and call publishEvent(event). ApplicationContext itself implements this interface.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-022
    difficulty: intermediate
    tags: [events, pojo, spring-4.2]
    question: |
      Since Spring 4.2, what type must an application event be?
    options:
      - "It must extend ApplicationEvent."
      - "It must implement Serializable."
      - "It can be any POJO — extending ApplicationEvent is optional."
      - "It must be a record annotated with @Event."
    answer: 2
    explanation: |
      Since Spring 4.2, events need not extend ApplicationEvent; any POJO may be published and listened to. Extending ApplicationEvent is still allowed and provides a timestamp and source.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-023
    difficulty: advanced
    tags: [events, sync-default, transaction]
    question: |
      By default, when a @Transactional method publishes an event and a synchronous @EventListener throws an exception, what happens?
    options:
      - "The exception is logged and the publisher continues normally."
      - "The event is retried on a background thread."
      - "The exception propagates back to the publisher and can roll back the publisher's transaction."
      - "Nothing; listeners are always isolated in their own transactions."
    answer: 2
    explanation: |
      Default event publication is synchronous, on the publisher's thread, within the same transaction. A throwing listener propagates the exception to the publisher and can roll back its transaction. Listeners are NOT isolated by default.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-024
    difficulty: intermediate
    tags: [events, sync-default]
    question: |
      Which statement about default Spring event publication is TRUE?
    options:
      - "publishEvent() returns immediately and listeners run on a thread pool."
      - "publishEvent() blocks until all matching listeners finish, running them on the publisher's thread."
      - "Events are queued to a JMS broker before delivery."
      - "Each listener automatically runs in its own new transaction."
    answer: 1
    explanation: |
      Spring events are synchronous and single-threaded by default. publishEvent() blocks until every matching listener completes, on the caller's thread. Total publish latency is the sum of listener latencies.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-025
    difficulty: intermediate
    tags: [transactional-event-listener, phases]
    question: |
      What is the DEFAULT transaction phase for @TransactionalEventListener?
    options:
      - "AFTER_COMMIT"
      - "BEFORE_COMMIT"
      - "AFTER_ROLLBACK"
      - "AFTER_COMPLETION"
    answer: 0
    explanation: |
      The default phase is AFTER_COMMIT, so the listener runs only after the publishing transaction commits successfully — the canonical "notify only if the data actually persisted" pattern.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-026
    difficulty: advanced
    tags: [transactional-event-listener, no-transaction]
    question: |
      What happens by default when an event is published for a @TransactionalEventListener but there is NO active transaction?
    options:
      - "The listener fires immediately."
      - "Spring throws an IllegalStateException."
      - "The listener does not fire at all (the event is silently dropped)."
      - "A new transaction is created automatically."
    answer: 2
    explanation: |
      Without an active transaction, a @TransactionalEventListener does not fire by default. To make it run in that case, set fallbackExecution = true.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-027
    difficulty: advanced
    tags: [transactional-event-listener, after-commit, requires-new]
    question: |
      An AFTER_COMMIT @TransactionalEventListener writes a new row to the database, but the row never appears. What is the most likely cause?
    options:
      - "AFTER_COMMIT listeners cannot access the DataSource."
      - "The write runs after the original transaction committed, outside any transaction, so it isn't committed unless a new transaction (e.g. REQUIRES_NEW) is started."
      - "AFTER_COMMIT listeners always run on a read-only connection."
      - "The event was published before the row was created."
    answer: 1
    explanation: |
      AFTER_COMMIT code runs once the original transaction has already committed, so new DB writes there are outside a transaction and typically not committed. Wrap the write in a new transaction, e.g. @Transactional(propagation = REQUIRES_NEW).
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-028
    difficulty: intermediate
    tags: [async-events, listener]
    question: |
      How do you make a single @EventListener run asynchronously?
    options:
      - "Set the event class to implement AsyncEvent."
      - "Add @Async to the listener method and ensure @EnableAsync is present."
      - "Call publishEventAsync() instead of publishEvent()."
      - "Annotate the publisher with @Async."
    answer: 1
    explanation: |
      Annotate the listener with both @EventListener (or @TransactionalEventListener) and @Async, with @EnableAsync enabled. The listener then runs on a TaskExecutor thread and publishEvent returns immediately.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-029
    difficulty: advanced
    tags: [async-events, exceptions, transaction]
    question: |
      When you add @Async to an event listener, how does exception and transaction behavior change?
    options:
      - "Exceptions still propagate to the publisher and can roll back its transaction."
      - "Exceptions no longer propagate to the publisher (they go to the AsyncUncaughtExceptionHandler), and the listener no longer shares the caller's transaction/thread context."
      - "The listener automatically starts a nested transaction."
      - "Nothing changes; @Async only affects timing."
    answer: 1
    explanation: |
      Once a listener is @Async it runs on a separate thread, so it loses the caller's transaction and thread-bound context, and its exceptions go to the AsyncUncaughtExceptionHandler rather than propagating to the publisher. It can no longer roll back the caller's transaction.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-030
    difficulty: advanced
    tags: [events, all-async, multicaster]
    question: |
      How can you make ALL application events dispatch asynchronously (not just one listener)?
    options:
      - "Annotate the ApplicationContext with @Async."
      - "Add spring.events.async=true to application.properties."
      - "Set a taskExecutor on the SimpleApplicationEventMulticaster (applicationEventMulticaster bean)."
      - "It is impossible without a message broker."
    answer: 2
    explanation: |
      The multicaster (SimpleApplicationEventMulticaster) delivers events. Setting a taskExecutor on the applicationEventMulticaster bean makes all events async. Per-listener @Async is usually preferred because it's targeted.
    ref: "concepts.md#async-events-async-on-listener"

  - id: async-scheduling-events-031
    difficulty: beginner
    tags: [cron, expression]
    question: |
      What does the Spring cron expression "0 0 * * * *" mean?
    options:
      - "Every minute."
      - "At the top of every hour (second 0, minute 0)."
      - "Every second."
      - "Once per day at midnight."
    answer: 1
    explanation: |
      Fields are second minute hour day-of-month month day-of-week. "0 0 * * * *" fires when seconds=0 and minutes=0 for every hour — i.e. the top of every hour.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-032
    difficulty: intermediate
    tags: [cron, macros]
    question: |
      Which of these is a valid Spring cron macro that can replace a full expression?
    options:
      - "@everyMinute"
      - "@60seconds"
      - "@daily"
      - "@startup"
    answer: 2
    explanation: |
      Spring supports macros @hourly, @daily (aka @midnight), @weekly, @monthly, @yearly/@annually. @everyMinute, @60seconds, and @startup are not valid macros.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-033
    difficulty: intermediate
    tags: [scheduled, externalized-config]
    question: |
      Which attribute lets you externalize a fixedRate value to a property placeholder?
    options:
      - "fixedRate with a String literal"
      - "rateProperty"
      - "cron only supports placeholders"
      - "fixedRateString (e.g. fixedRateString = \"${job.rate:5000}\")"
    answer: 3
    explanation: |
      fixedRateString (and fixedDelayString / initialDelayString) accept property placeholders and, since Spring 5.3, ISO-8601 duration strings like "PT5S". The numeric fixedRate cannot reference properties directly.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-034
    difficulty: advanced
    tags: [scheduler, resolution-order]
    question: |
      With no explicit configuration, in what order does the ScheduledTaskRegistrar resolve which scheduler to use?
    options:
      - "It always creates an unbounded cached thread pool."
      - "It uses the @Async executor by default."
      - "TaskScheduler bean, then uniquely-named TaskScheduler, then a ScheduledExecutorService bean, else a locally-created single-threaded ScheduledExecutorService."
      - "It requires a bean and fails startup if none is provided."
    answer: 2
    explanation: |
      Resolution order: a TaskScheduler bean → a uniquely named TaskScheduler → a ScheduledExecutorService bean → otherwise a locally created single-threaded ScheduledExecutorService. Boot can also configure it via spring.task.scheduling.* properties.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-035
    difficulty: intermediate
    tags: [async, proxy-target-class, boot]
    question: |
      In Spring Boot, what is the default proxy strategy relevant to @Async and why does it matter?
    options:
      - "JDK dynamic proxies only, so beans must implement an interface."
      - "No proxies; @Async uses reflection directly on private methods."
      - "AspectJ compile-time weaving is always used."
      - "CGLIB (class-based) proxies by default, so classes without interfaces can be proxied — but the class/method must not be final."
    answer: 3
    explanation: |
      Spring Boot defaults proxyTargetClass to true (CGLIB), so class-based proxies work even without interfaces. But CGLIB subclasses the target, so final classes/methods and private/static methods cannot be advised.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-036
    difficulty: intermediate
    tags: [events, conditional, spel]
    question: |
      How can you conditionally invoke an @EventListener only for certain events?
    options:
      - "Use the condition attribute with a SpEL expression, e.g. @EventListener(condition = \"#e.amount > 100\")."
      - "Throw an exception to skip the listener."
      - "Use @ConditionalOnEvent."
      - "Conditions are not supported; you must filter inside the method."
    answer: 0
    explanation: |
      @EventListener supports a SpEL condition attribute; the listener runs only when the expression evaluates to true. The event is referenced by its parameter name or #root.event.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-037
    difficulty: advanced
    tags: [events, chained-publishing]
    question: |
      What happens if a non-void @EventListener method returns a value?
    options:
      - "The return value is ignored entirely."
      - "Spring publishes the returned value (or each element of a returned Collection/array) as a new event."
      - "It throws an error because listeners must be void."
      - "The value is stored as the event's result attribute."
    answer: 1
    explanation: |
      If an @EventListener returns a non-null value, Spring publishes it as a new event (each element if it's a Collection/array). Returning void or null publishes nothing. This enables event chaining.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-038
    difficulty: intermediate
    tags: [events, ordering]
    question: |
      How do you control the order in which multiple listeners for the same event are invoked?
    options:
      - "Alphabetically by bean name; it cannot be changed."
      - "By declaration order in the class file."
      - "Annotate the listeners with @Order (lower value = earlier)."
      - "Order is random and non-deterministic."
    answer: 2
    explanation: |
      @Order controls the invocation order of listeners for the same event; lower values run first. This is meaningful for synchronous events; with async listeners running on different threads there is no completion-order guarantee.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-039
    difficulty: beginner
    tags: [scheduled, boot-config]
    question: |
      Which Spring Boot property tunes the number of threads for the auto-configured task scheduler?
    options:
      - "spring.async.pool.size"
      - "server.scheduler.threads"
      - "spring.scheduler.count"
      - "spring.task.scheduling.pool.size"
    answer: 3
    explanation: |
      spring.task.scheduling.pool.size (default 1) sizes the auto-configured scheduler; spring.task.scheduling.thread-name-prefix names the threads. For @Async, the analogous properties are under spring.task.execution.*.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-040
    difficulty: advanced
    tags: [fixed-rate, single-thread, overlap]
    question: |
      A task with @Scheduled(fixedRate = 1000) takes 3 seconds to complete on the DEFAULT single-threaded scheduler. What is the observed behavior?
    options:
      - "Three copies run concurrently every second."
      - "Executions serialize back-to-back (~every 3s) because the single thread cannot start a new run until the current one finishes."
      - "Spring throws a concurrency exception."
      - "The task is skipped entirely after the first run."
    answer: 1
    explanation: |
      fixedRate is aspirational, but a single-threaded scheduler cannot overlap executions. The scheduler wants to start every 1s but the busy thread forces serialization, so runs occur roughly back-to-back every ~3s. A larger pool would still not run the SAME task concurrently unless you make it @Async.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-041
    difficulty: intermediate
    tags: [async, void, fire-and-forget]
    question: |
      Which statement about a void-returning @Async method is correct?
    options:
      - "The caller can block on it to wait for completion."
      - "It automatically retries on failure."
      - "It is fire-and-forget; the caller cannot observe completion or catch its exceptions directly."
      - "It must be annotated @Transactional."
    answer: 2
    explanation: |
      A void @Async method is fire-and-forget: the caller returns immediately with no handle to wait on and cannot catch exceptions at the call site — those go to the AsyncUncaughtExceptionHandler.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-042
    difficulty: advanced
    tags: [transactional-event-listener, phases, before-commit]
    question: |
      Which TransactionPhase fires the listener before the transaction's changes are flushed/committed?
    options:
      - "BEFORE_COMMIT"
      - "AFTER_COMMIT"
      - "AFTER_ROLLBACK"
      - "AFTER_COMPLETION"
    answer: 0
    explanation: |
      BEFORE_COMMIT runs the listener before the commit is flushed. The other phases run after commit, after rollback, or after completion (either outcome).
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-043
    difficulty: intermediate
    tags: [transactional-event-listener, use-case]
    question: |
      What is the canonical use case for @TransactionalEventListener(phase = AFTER_COMMIT)?
    options:
      - "Rolling back the transaction when a listener fails."
      - "Reducing the number of listener beans."
      - "Performing side effects (email, Kafka publish) only after the DB change is durably committed."
      - "Making events synchronous."
    answer: 2
    explanation: |
      AFTER_COMMIT ensures external side effects happen only if the transaction actually committed, avoiding the bug of notifying/publishing and then having the transaction roll back.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-044
    difficulty: beginner
    tags: [async, executor-qualifier]
    question: |
      What does @Async("mailExecutor") do?
    options:
      - "Runs this method on the Executor bean named/qualified mailExecutor, overriding the default executor."
      - "Creates a new executor bean named mailExecutor."
      - "Renames the current thread to mailExecutor."
      - "Schedules the method every mailExecutor milliseconds."
    answer: 0
    explanation: |
      The value on @Async is a qualifier naming a specific Executor bean; that method runs on that executor instead of the default one. Useful for isolating workloads on separate pools.
    ref: "concepts.md#enableasync-and-async"

  - id: async-scheduling-events-045
    difficulty: advanced
    tags: [thread-pool-task-executor, rejection]
    question: |
      With a ThreadPoolTaskExecutor, what happens when both the queue is full AND the pool has reached maxPoolSize, using default settings?
    options:
      - "New tasks are silently discarded with no signal."
      - "The executor grows the pool without bound."
      - "The RejectedExecutionHandler runs; the default AbortPolicy throws a TaskRejectedException."
      - "The caller thread blocks forever."
    answer: 2
    explanation: |
      When the queue is full and maxPoolSize is reached, the RejectedExecutionHandler is invoked. The default is AbortPolicy, which throws (Spring wraps it as TaskRejectedException). You can choose CallerRunsPolicy etc.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-046
    difficulty: intermediate
    tags: [scheduled, mutual-exclusivity]
    question: |
      Which combination on a single @Scheduled annotation is INVALID?
    options:
      - "fixedRate together with fixedDelay"
      - "fixedRate with initialDelay"
      - "cron alone"
      - "fixedDelay with initialDelayString"
    answer: 0
    explanation: |
      Exactly one of cron, fixedRate, or fixedDelay may be specified. Combining fixedRate and fixedDelay is invalid. initialDelay may accompany fixedRate/fixedDelay (but not cron).
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-047
    difficulty: advanced
    tags: [async, listenable-future, spring6]
    question: |
      In Spring 6 / Spring Boot 3, which async return type is deprecated in favor of CompletableFuture?
    options:
      - "ListenableFuture"
      - "Future"
      - "void"
      - "CompletionStage"
    answer: 0
    explanation: |
      Spring's ListenableFuture is deprecated in Spring 6 in favor of the JDK's CompletableFuture, which offers standard non-blocking composition.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-048
    difficulty: intermediate
    tags: [scheduling-configurer, programmatic]
    question: |
      How can you register scheduled tasks programmatically or supply a custom scheduler for @Scheduled?
    options:
      - "Implement SchedulingConfigurer and override configureTasks(ScheduledTaskRegistrar)."
      - "Override the main() method."
      - "Annotate a method with @ScheduleProgrammatic."
      - "It is impossible; only annotations are supported."
    answer: 0
    explanation: |
      Implementing SchedulingConfigurer lets you set the scheduler (registrar.setScheduler(...)) and register tasks with dynamic triggers/cron programmatically via the ScheduledTaskRegistrar.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-049
    difficulty: advanced
    tags: [events, sync-default, latency]
    question: |
      A service publishes an event synchronously to three listeners that take 100ms, 200ms, and 300ms respectively (all synchronous, single-threaded). How long does publishEvent() take to return?
    options:
      - "About 300ms (the slowest listener)."
      - "About 600ms (the sum, since they run sequentially on the caller's thread)."
      - "About 0ms (publishing is always non-blocking)."
      - "About 200ms (the average)."
    answer: 1
    explanation: |
      Default publication is synchronous and sequential on the publisher's thread, so total time is the sum: 100 + 200 + 300 = ~600ms. Making listeners @Async would decouple this.
    ref: "concepts.md#synchronous-by-default-event-semantics"

  - id: async-scheduling-events-050
    difficulty: beginner
    tags: [transactional-event-listener, annotation]
    question: |
      Which annotation defers a listener until a specific phase of the surrounding transaction?
    options:
      - "@EventListener"
      - "@TransactionalEventListener"
      - "@Scheduled"
      - "@Async"
    answer: 1
    explanation: |
      @TransactionalEventListener binds listener invocation to a TransactionPhase (default AFTER_COMMIT) of the publishing transaction, unlike plain @EventListener which fires immediately at publishEvent().
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-051
    difficulty: intermediate
    tags: [async, public-method, proxy]
    question: |
      Why must an @Async method be public (in proxy-based mode)?
    options:
      - "Because Java requires all annotated methods to be public."
      - "Because private methods cannot throw exceptions."
      - "Because the AOP proxy can only intercept externally-visible (public) methods; non-public methods are not advised."
      - "It doesn't; @Async works on private methods too."
    answer: 2
    explanation: |
      Proxy-based AOP (JDK or CGLIB) intercepts public methods only. Private/protected/package-private and static methods are not advised, so @Async on them is silently ignored.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-052
    difficulty: advanced
    tags: [transactional-event-listener, async-combo]
    question: |
      You want after-commit work to run on a background thread. Which combination achieves this?
    options:
      - "@TransactionalEventListener alone (it is async by default)."
      - "@Scheduled(fixedDelay = 0)."
      - "@TransactionalEventListener(phase = AFTER_COMMIT) plus @Async, with @EnableAsync."
      - "publishEventAsync(event)."
    answer: 2
    explanation: |
      @TransactionalEventListener is synchronous by default (runs on the committing thread during the after-commit callback). Add @Async (and @EnableAsync) to offload the after-commit work to a TaskExecutor thread.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-053
    difficulty: intermediate
    tags: [scheduled, duration, spring6]
    question: |
      Since Spring 5.3, how can you express a @Scheduled interval using a unit other than milliseconds?
    options:
      - "Only milliseconds are supported."
      - "Append a suffix like fixedRate = \"5s\"."
      - "Use @Scheduled(rate = Duration.ofSeconds(5))."
      - "Use the timeUnit attribute, e.g. @Scheduled(fixedRate = 5, timeUnit = TimeUnit.SECONDS)."
    answer: 3
    explanation: |
      Spring 5.3 (specifically 5.3.10) added a timeUnit attribute so fixedRate/fixedDelay/initialDelay can be expressed in seconds, minutes, etc. The *String variants also accept ISO-8601 duration strings like "PT5S".
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-054
    difficulty: advanced
    tags: [events, listener-interface, generics]
    question: |
      Which statement about listening for events is correct?
    options:
      - "@EventListener resolves the target event type from the method's parameter type, and can list multiple types via @EventListener({A.class, B.class})."
      - "You can only listen by implementing ApplicationListener; annotations are not supported."
      - "A single @EventListener method can never handle more than one event type."
      - "@EventListener requires the event to extend ApplicationEvent."
    answer: 0
    explanation: |
      @EventListener infers the event type from the method parameter and supports multiple types via the classes() attribute (e.g. @EventListener({A.class, B.class})). The legacy ApplicationListener interface style also works but is less flexible.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-055
    difficulty: advanced
    tags: [async, virtual-threads, boot-3.2]
    question: |
      In Spring Boot 3.2+, what does setting spring.threads.virtual.enabled=true do relevant to async processing?
    options:
      - "Disables @Async entirely."
      - "Makes @Async execution and web request handling use virtual threads (Project Loom) instead of platform threads."
      - "Converts all scheduled cron jobs into events."
      - "Forces JDK dynamic proxies for all beans."
    answer: 1
    explanation: |
      Spring Boot 3.2 (on Java 21+) can run @Async tasks and web request handling on virtual threads when spring.threads.virtual.enabled=true, improving scalability of blocking workloads. Scheduling still needs a platform-thread scheduler for timing.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-056
    difficulty: intermediate
    tags: [async, boot-executor]
    question: |
      What default executor does Spring Boot auto-configure for @Async when you don't provide one?
    options:
      - "A ForkJoinPool.commonPool()."
      - "A single-threaded scheduler shared with @Scheduled."
      - "A ThreadPoolTaskExecutor bean named applicationTaskExecutor (also exposed as taskExecutor)."
      - "No executor; @Async fails without an AsyncConfigurer."
    answer: 2
    explanation: |
      Spring Boot auto-configures a ThreadPoolTaskExecutor named applicationTaskExecutor (aliased taskExecutor), which @Async uses by default. Tune it via spring.task.execution.* properties.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-057
    difficulty: advanced
    tags: [transactional-event-listener, fallback]
    question: |
      A developer reports that a @TransactionalEventListener sometimes never runs during unit tests that don't open a transaction. What is the correct minimal fix if they want it to run regardless?
    options:
      - "Add @Async to the listener."
      - "Switch to @Scheduled."
      - "Wrap publishEvent in a try/catch."
      - "Set fallbackExecution = true on the @TransactionalEventListener."
    answer: 3
    explanation: |
      When no transaction is active, @TransactionalEventListener is skipped by default. Setting fallbackExecution = true makes it execute immediately even without a surrounding transaction.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-058
    difficulty: beginner
    tags: [async, disable-cron]
    question: |
      What is the effect of a @Scheduled(cron = "-") value?
    options:
      - "It runs every second."
      - "It throws an exception at startup."
      - "It disables the trigger (the task is not scheduled)."
      - "It runs once at startup only."
    answer: 2
    explanation: |
      A cron value of "-" is a special disabled trigger, letting you externalize the cron string and turn a job off (e.g. via a property) without removing the annotation.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-059
    difficulty: expert
    tags: [scheduled, exception-handling, error-handler]
    question: |
      A @Scheduled(fixedRate = 60000) job throws an unchecked exception on every run. Using Spring's default configuration, what happens to subsequent executions?
    options:
      - "The task is permanently cancelled after the first exception, exactly like raw ScheduledExecutorService.scheduleAtFixedRate."
      - "The exception propagates to the application's main thread and terminates the context."
      - "Spring retries the failed run immediately with exponential backoff until it succeeds."
      - "Spring's default error handler logs and suppresses the exception, and the next execution is still scheduled — the job keeps firing every 60s."
    answer: 3
    explanation: |
      Spring wraps scheduled invocations in a DelegatingErrorHandlingRunnable. For repeating tasks the default TaskUtils.LOG_AND_SUPPRESS_ERROR_HANDLER logs and swallows the exception, and Spring re-schedules the next run — so the job keeps firing. This differs from raw scheduleAtFixedRate, where an uncaught exception silently kills all future executions.
    ref: "concepts.md#scheduled-task-exception-handling"

  - id: async-scheduling-events-060
    difficulty: expert
    tags: [scheduled, error-handler, custom]
    question: |
      A team wants a throwing @Scheduled fixedRate task to emit a metric on failure but also keep running on schedule. They register a custom ErrorHandler that increments a counter and then re-throws the exception. What is the likely outcome?
    options:
      - "It works perfectly; re-throwing from an ErrorHandler never affects scheduling."
      - "The metric is emitted, but re-throwing can cause the underlying ScheduledExecutorService to cancel future executions of that task, so the schedule dies."
      - "Spring ignores custom ErrorHandlers for fixedRate tasks."
      - "The task switches to fixedDelay semantics automatically."
    answer: 1
    explanation: |
      The reason the default handler swallows exceptions is precisely to keep the schedule alive: an exception that propagates out of the runnable into a ScheduledThreadPoolExecutor's periodic task cancels future runs. A custom ErrorHandler for repeating tasks should record-and-return (not re-throw), otherwise it re-introduces the JDK footgun of a dead schedule.
    ref: "concepts.md#scheduled-task-exception-handling"

  - id: async-scheduling-events-061
    difficulty: advanced
    tags: [scheduled, error-handler, one-shot]
    question: |
      How does Spring's DEFAULT error handling differ between a one-shot scheduled task and a repeating (fixedRate/fixedDelay/cron) task?
    options:
      - "Both use LOG_AND_SUPPRESS_ERROR_HANDLER identically."
      - "Repeating tasks propagate; one-shot tasks suppress."
      - "One-shot tasks use LOG_AND_PROPAGATE_ERROR_HANDLER while repeating tasks use LOG_AND_SUPPRESS_ERROR_HANDLER (so the schedule survives)."
      - "One-shot tasks are never wrapped in an error handler at all."
    answer: 2
    explanation: |
      TaskUtils selects LOG_AND_PROPAGATE_ERROR_HANDLER for one-shot tasks (propagating is harmless since there is no future run to protect) and LOG_AND_SUPPRESS_ERROR_HANDLER for repeating tasks, so a thrown exception is swallowed and the recurring schedule is preserved.
    ref: "concepts.md#scheduled-task-exception-handling"

  - id: async-scheduling-events-062
    difficulty: expert
    tags: [simple-async-task-scheduler, virtual-threads, fixed-delay]
    question: |
      With a SimpleAsyncTaskScheduler configured for virtual threads, which trigger types are recommended, and why is fixedDelay discouraged?
    options:
      - "fixedDelay is recommended; fixedRate can overwhelm virtual threads."
      - "All three are equivalent because virtual threads make scheduling free."
      - "fixedRate and cron are recommended; fixedDelay tasks run on the single scheduling thread (next start depends on prior completion), so a long fixedDelay body blocks the scheduler."
      - "Only cron is supported; fixedRate and fixedDelay throw at startup."
    answer: 2
    explanation: |
      SimpleAsyncTaskScheduler uses one scheduling thread and fires each execution on a new (virtual) thread — except fixedDelay, whose next start depends on the previous completion, so it must run on the single scheduling thread. A long fixedDelay body therefore blocks the scheduler, so Spring recommends fixedRate or cron with this scheduler.
    ref: "concepts.md#simpleasynctaskscheduler-and-virtual-thread-scheduling"

  - id: async-scheduling-events-063
    difficulty: expert
    tags: [thread-pool-task-scheduler, simple-async-task-scheduler, concurrency]
    question: |
      What is the fundamental concurrency difference between ThreadPoolTaskScheduler and SimpleAsyncTaskScheduler?
    options:
      - "ThreadPoolTaskScheduler caps concurrent task bodies at its pool size (timing and execution share the pool); SimpleAsyncTaskScheduler times on one thread but spawns a new thread per execution, allowing unbounded concurrent bodies."
      - "SimpleAsyncTaskScheduler is single-threaded for everything; ThreadPoolTaskScheduler is unbounded."
      - "They are identical except for the thread name prefix."
      - "ThreadPoolTaskScheduler cannot run cron; SimpleAsyncTaskScheduler cannot run fixedRate."
    answer: 0
    explanation: |
      ThreadPoolTaskScheduler is backed by a fixed ScheduledThreadPoolExecutor whose threads both time and run tasks, so pool size caps concurrency and a slow task can delay others' timing. SimpleAsyncTaskScheduler dedicates one thread to timing and launches each execution on a fresh (virtual) thread, giving unbounded body concurrency — appropriate for virtual threads, dangerous for platform threads.
    ref: "concepts.md#simpleasynctaskscheduler-and-virtual-thread-scheduling"

  - id: async-scheduling-events-064
    difficulty: advanced
    tags: [virtual-threads, boot-3.2, task-execution]
    question: |
      After setting spring.threads.virtual.enabled=true in Boot 3.2 on Java 21, why do the spring.task.execution.pool.core-size / max-size properties stop having an effect on @Async?
    options:
      - "Because @Async is disabled when virtual threads are on."
      - "Because the properties are renamed to spring.threads.virtual.pool.*."
      - "Because virtual threads force a fixed pool of exactly the CPU count."
      - "Because the @Async executor becomes a virtual-thread SimpleAsyncTaskExecutor which does not pool threads (a new virtual thread per task), so pool-size properties are irrelevant."
    answer: 3
    explanation: |
      With virtual threads enabled, Boot supplies a SimpleAsyncTaskExecutor backed by virtual threads for @Async/task execution. It creates a new virtual thread per task rather than pooling, so core/max pool size and queue-capacity settings no longer apply.
    ref: "concepts.md#simpleasynctaskscheduler-and-virtual-thread-scheduling"

  - id: async-scheduling-events-065
    difficulty: expert
    tags: [scheduler, graceful-shutdown, lifecycle]
    question: |
      A ThreadPoolTaskScheduler runs a long batch job. The application shuts down mid-job with the scheduler's DEFAULT shutdown settings. What most likely happens?
    options:
      - "Spring always waits indefinitely for scheduled jobs to finish before shutting down."
      - "The job is guaranteed to complete because SmartLifecycle blocks the JVM."
      - "Spring persists the job state and resumes it on next startup."
      - "With defaults (waitForTasksToCompleteOnShutdown=false, awaitTerminationSeconds=0) shutdown does not wait; the in-flight job can be abruptly interrupted, leaving work half-done."
    answer: 3
    explanation: |
      By default the scheduler does not wait for running tasks at shutdown. To drain gracefully you must set setWaitForTasksToCompleteOnShutdown(true) and setAwaitTerminationSeconds(n) (or the Boot spring.task.scheduling.shutdown.* properties); otherwise a running scheduled job may be interrupted mid-execution.
    ref: "concepts.md#scheduler-lifecycle-and-graceful-shutdown"

  - id: async-scheduling-events-066
    difficulty: advanced
    tags: [scheduler, lifecycle, spring-6.1]
    question: |
      Which capability did Spring Framework 6.1 add to ThreadPoolTaskScheduler via SmartLifecycle integration?
    options:
      - "Automatic clustering of scheduled jobs across nodes."
      - "Persistence of missed executions to a database."
      - "Guaranteed exactly-once execution semantics."
      - "Pause/resume of scheduling plus graceful shutdown, with scheduled tasks cancelled on context close."
    answer: 3
    explanation: |
      As of 6.1 ThreadPoolTaskScheduler participates in Spring's lifecycle, providing pause/resume and graceful shutdown; on context close Spring cancels scheduled tasks (including the next trigger and any active reactive subscription). Clustering and durable persistence are not provided (that is Quartz/ShedLock territory).
    ref: "concepts.md#scheduler-lifecycle-and-graceful-shutdown"

  - id: async-scheduling-events-067
    difficulty: expert
    tags: [cron, dst, time-zone]
    question: |
      A job is defined @Scheduled(cron = "0 30 2 * * *", zone = "Europe/Paris") to run at 02:30 daily. What happens on the "spring-forward" DST day (when clocks jump from 02:00 to 03:00) and on the "fall-back" day?
    options:
      - "It runs exactly once on both days; cron is immune to DST."
      - "The job silently switches to UTC to avoid DST entirely."
      - "Spring throws an exception during DST transitions."
      - "On spring-forward the 02:30 wall-clock time does not exist so the run is skipped; on fall-back 02:30 occurs twice so it may run twice."
    answer: 3
    explanation: |
      Cron matches wall-clock time in the given zone, so on the spring-forward day the non-existent 02:30 causes the run to be skipped, and on the fall-back day 02:30 occurs twice and the job can fire twice. fixedRate/fixedDelay count elapsed real time and are unaffected by DST.
    ref: "concepts.md#advanced-cron-expressions-and-time-zones"

  - id: async-scheduling-events-068
    difficulty: advanced
    tags: [cron, last, expressions]
    question: |
      What does the Spring cron expression "0 0 0 L * *" fire on?
    options:
      - "The first day of every month at midnight."
      - "Every day at midnight (L is treated as a wildcard)."
      - "Midnight on the last day of every month."
      - "The last Sunday of every month at midnight."
    answer: 2
    explanation: |
      In the day-of-month field, L means the last day of the month. So "0 0 0 L * *" fires at 00:00:00 on the final calendar day of each month. (L-3 would be the third-to-last day; 5L in day-of-week would be the last Friday.)
    ref: "concepts.md#advanced-cron-expressions-and-time-zones"

  - id: async-scheduling-events-069
    difficulty: expert
    tags: [cron, nth-weekday, hash]
    question: |
      Which Spring cron expression fires at midnight on the second Tuesday of every month?
    options:
      - "0 0 0 ? * 2#2 (day-of-week 2 = Tuesday, #2 = second occurrence)"
      - "0 0 0 2#2 * *"
      - "0 0 0 * * TUE-2"
      - "0 0 0 L2 * TUE"
    answer: 0
    explanation: |
      The d#n syntax in the day-of-week field selects the nth occurrence. Spring strictly follows cron numbering (0/7=SUN, 1=MON, 2=TUE, 3=WED), so 2#2 means the second Tuesday; the equivalent unambiguous form is TUE#2. (Note this differs from Quartz, which uses 1-7 for SUN-SAT.) The '?' in day-of-month avoids conflict with the day-of-week field.
    ref: "concepts.md#advanced-cron-expressions-and-time-zones"

  - id: async-scheduling-events-070
    difficulty: intermediate
    tags: [cron, question-mark]
    question: |
      What is the purpose of the '?' character in a Spring cron expression?
    options:
      - "It matches any value, identical to '*' in all fields."
      - "It means 'no specific value', used in the day-of-month or day-of-week field when the other of the two is set, to avoid ambiguity."
      - "It disables the trigger entirely."
      - "It represents the current second at parse time."
    answer: 1
    explanation: |
      '?' means "no specific value" and is used in exactly one of day-of-month / day-of-week when the other is specified, since specifying both concrete day fields is contradictory. To disable a trigger entirely you use cron = "-".
    ref: "concepts.md#advanced-cron-expressions-and-time-zones"

  - id: async-scheduling-events-071
    difficulty: advanced
    tags: [scheduled, one-time, initial-delay]
    question: |
      What is the effect of @Scheduled(initialDelay = 5000) with NO fixedRate, fixedDelay, or cron attribute?
    options:
      - "Startup fails because a trigger type is required."
      - "It runs every 5 seconds indefinitely."
      - "It runs exactly once, 5 seconds after the context starts (a one-time task)."
      - "It runs immediately and ignores initialDelay."
    answer: 2
    explanation: |
      Since Spring 6, @Scheduled with only initialDelay and no repeating trigger schedules a single one-shot execution after the delay — a lightweight alternative to a deferred CommandLineRunner.
    ref: "concepts.md#reactive-and-one-time-scheduled-tasks"

  - id: async-scheduling-events-072
    difficulty: expert
    tags: [scheduled, reactive, spring-6.1]
    question: |
      In Spring 6.1, a @Scheduled(fixedDelay = 1000) method returns a Mono<Void>. How does Spring treat it, and what is the risk if the method body calls .subscribe() itself and returns void instead?
    options:
      - "Spring blocks on the Mono synchronously either way; there is no difference."
      - "Spring converts the Mono to a CompletableFuture and always waits on the calling thread."
      - "Reactive return types are rejected by @Scheduled; only void is allowed."
      - "Spring subscribes to the returned publisher and uses its completion to time the next fixedDelay run; if you subscribe yourself and return void, Spring loses that integration and fixedDelay timing is based on the (instant) method return, not the async completion."
    answer: 3
    explanation: |
      Spring 6.1 supports reactive @Scheduled by subscribing to the returned Publisher and treating that subscription as the execution, so fixedDelay measures from the publisher's completion. If the method self-subscribes and returns void, the method returns instantly and fixedDelay starts counting from that instant rather than from real completion, breaking the intended spacing and losing shutdown cancellation.
    ref: "concepts.md#reactive-and-one-time-scheduled-tasks"

  - id: async-scheduling-events-073
    difficulty: expert
    tags: [task-decorator, security-context, thread-local]
    question: |
      An @Async method reads SecurityContextHolder.getContext().getAuthentication() and gets null, even though the caller was authenticated. What is the correct root cause and fix?
    options:
      - "The user was logged out; re-authenticate inside the async method."
      - "SecurityContext must be passed as a method parameter; there is no other way."
      - "@Async methods run before Spring Security initializes; move the annotation."
      - "SecurityContext is stored in a ThreadLocal that is not propagated across the executor thread boundary; supply a TaskDecorator (or DelegatingSecurityContextAsyncTaskExecutor) to capture and reinstate it."
    answer: 3
    explanation: |
      SecurityContextHolder uses a ThreadLocal by default, which does not cross to the worker thread. A TaskDecorator captures the context on the submitting thread and reinstates it on the worker thread (Spring Security's DelegatingSecurityContextAsyncTaskExecutor does exactly this). MDC and observation context have the same issue and the same fix.
    ref: "concepts.md#context-propagation-with-taskdecorator"

  - id: async-scheduling-events-074
    difficulty: expert
    tags: [task-decorator, closure, capture]
    question: |
      A developer writes a TaskDecorator whose returned Runnable reads MDC.getCopyOfContextMap() INSIDE the wrapper (on the worker thread) rather than capturing it when decorate() is called. Why is this wrong?
    options:
      - "It is fine; MDC is global and thread-independent."
      - "It works but doubles memory usage."
      - "It causes a compilation error because TaskDecorator forbids ThreadLocal access."
      - "decorate() runs on the submitting thread but the wrapper runs on the worker thread; reading MDC inside the wrapper reads the worker thread's (empty) context, not the caller's — you must capture eagerly in decorate()."
    answer: 3
    explanation: |
      decorate() executes on the caller (submitting) thread, while the returned Runnable executes later on the worker thread. Context must be captured eagerly inside decorate() and reinstated inside the wrapper; reading the ThreadLocal lazily in the wrapper reads the worker's own empty context, defeating the purpose.
    ref: "concepts.md#context-propagation-with-taskdecorator"

  - id: async-scheduling-events-075
    difficulty: advanced
    tags: [task-decorator, composite]
    question: |
      You need both MDC propagation and Micrometer observation propagation on the same @Async executor. What is the cleanest built-in way to combine multiple TaskDecorators?
    options:
      - "Only one TaskDecorator can be set; you must merge the logic manually into one class."
      - "Register them as separate beans; Spring auto-chains all TaskDecorator beans."
      - "Use CompositeTaskDecorator, which runs the supplied decorators sequentially around the task."
      - "Set them via spring.task.execution.decorators as a comma-separated list."
    answer: 2
    explanation: |
      setTaskDecorator accepts a single decorator, but org.springframework.core.task.support.CompositeTaskDecorator wraps several decorators and applies them in order, letting you compose MDC, security, and observation propagation cleanly.
    ref: "concepts.md#context-propagation-with-taskdecorator"

  - id: async-scheduling-events-076
    difficulty: expert
    tags: [events, error-handler, multicaster, transaction]
    question: |
      A synchronous @EventListener is throwing, and it used to roll back the publisher's @Transactional method. After someone sets an ErrorHandler on the SimpleApplicationEventMulticaster, the rollback stops happening. Why?
    options:
      - "The ErrorHandler moved the listener onto a background thread."
      - "The ErrorHandler forces every listener into REQUIRES_NEW."
      - "ErrorHandlers only apply to async listeners, so this is a coincidence."
      - "Setting an ErrorHandler makes the multicaster catch listener exceptions and route them to the handler instead of propagating them to publishEvent(), so the publisher's transaction no longer sees the failure."
    answer: 3
    explanation: |
      An ErrorHandler on the multicaster intercepts listener exceptions for ALL listeners (even synchronous ones) and no longer lets them bubble up to publishEvent(). Since the exception never reaches the publisher, it cannot trigger the caller's transaction rollback — a subtle change to failure semantics.
    ref: "concepts.md#event-error-handling-and-the-multicaster"

  - id: async-scheduling-events-077
    difficulty: expert
    tags: [events, async-multicaster, exceptions]
    question: |
      Once a taskExecutor is set on the SimpleApplicationEventMulticaster (global async events), what is the ONLY way to observe listener exceptions, and why?
    options:
      - "A try/catch around publishEvent(), because the exception still bubbles up."
      - "There is no way; async listener exceptions are permanently invisible."
      - "An ErrorHandler on the multicaster (or AsyncUncaughtExceptionHandler for @Async listeners), because the caller has already returned so exceptions cannot propagate to publishEvent()."
      - "Checking the return value of publishEvent(), which becomes a Future."
    answer: 2
    explanation: |
      With an async multicaster, publishEvent() returns before listeners finish, so exceptions cannot propagate to the caller. The multicaster's ErrorHandler (or, for @Async listeners, the AsyncUncaughtExceptionHandler) is the only place to catch them. publishEvent() returns void, not a Future.
    ref: "concepts.md#event-error-handling-and-the-multicaster"

  - id: async-scheduling-events-078
    difficulty: expert
    tags: [events, generics, type-erasure]
    question: |
      You have @EventListener void on(EntityCreatedEvent<Person> e). You publish new EntityCreatedEvent<>(aPerson) using the raw generic class directly (no subclass). Why might the listener NOT fire, and what interface fixes it?
    options:
      - "It always fires; generics are fully retained at runtime."
      - "The listener only fires if Person implements Serializable."
      - "You must annotate the event with @EventType(Person.class)."
      - "Type erasure means the runtime event cannot resolve <Person>, so the typed listener isn't matched; having the event implement ResolvableTypeProvider lets Spring resolve the type parameter at runtime."
    answer: 3
    explanation: |
      Because of type erasure, a raw EntityCreatedEvent<Person> instance does not carry its type argument, so Spring can't match it to the EntityCreatedEvent<Person> listener. Either publish a concrete subclass that fixes the type, or implement ResolvableTypeProvider so the event reports its ResolvableType (e.g. via forInstance(getSource())).
    ref: "concepts.md#generic-events-and-resolvabletypeprovider"

  - id: async-scheduling-events-079
    difficulty: advanced
    tags: [events, lazy, listener-registration]
    question: |
      A bean carrying @EventListener methods is annotated @Lazy, and its events silently never get handled. Why?
    options:
      - "@Lazy beans handle events on a delay, so they eventually catch up."
      - "The events are handled, but only after the first HTTP request."
      - "@EventListener overrides @Lazy, so this cannot happen."
      - "Spring honors the laziness and does not instantiate the bean to register its listeners, so the listener methods are never wired up."
    answer: 3
    explanation: |
      Registering @EventListener methods requires instantiating the bean. If it is @Lazy, Spring respects that and won't create it eagerly, so the listeners are never registered and matching events go unhandled. Listener-bearing beans must be eagerly initialized.
    ref: "concepts.md#generic-events-and-resolvabletypeprovider"

  - id: async-scheduling-events-080
    difficulty: expert
    tags: [events, async, chaining, return-value]
    question: |
      A synchronous @EventListener returns an OrderShippedEvent to chain a follow-up event, and it works. A teammate adds @Async to the same listener and the follow-up event stops being published. Why?
    options:
      - "Return-value event chaining is unsupported for asynchronous listeners; an @Async listener's return value is ignored, so it must inject ApplicationEventPublisher and publish manually."
      - "Async listeners execute too fast for the chained event to register."
      - "@Async changed the method's return type to void at compile time."
      - "The chained event is published, but on a thread that has no multicaster."
    answer: 0
    explanation: |
      Spring re-publishes the return value of a synchronous listener as a new event, but this feature is explicitly unsupported for async listeners — their return value is discarded. To chain from an async listener, inject ApplicationEventPublisher and call publishEvent() directly.
    ref: "concepts.md#async-event-limitations"

  - id: async-scheduling-events-081
    difficulty: expert
    tags: [transactional-event-listener, async, after-commit, db-write]
    question: |
      A listener is annotated @Async and @TransactionalEventListener(phase = AFTER_COMMIT). It performs a JPA save() with no other annotations. The row is never persisted. What is the most complete explanation?
    options:
      - "The listener runs on a pool thread after the original transaction committed, with no active transaction and no bound EntityManager, so the save has no transaction to commit into; it needs its own @Transactional (e.g. REQUIRES_NEW)."
      - "AFTER_COMMIT listeners cannot use JPA at all."
      - "The @Async annotation rolls back the save automatically."
      - "The event fired before the entity existed."
    answer: 0
    explanation: |
      Combining @Async with AFTER_COMMIT means the work runs on a separate thread once the original transaction has already committed — there is no active transaction or thread-bound persistence context. Any DB write must open its own transaction (typically @Transactional(REQUIRES_NEW)) to be committed.
    ref: "concepts.md#async-event-limitations"

  - id: async-scheduling-events-082
    difficulty: advanced
    tags: [transactional-event-listener, before-commit, ordering]
    question: |
      What distinguishes a BEFORE_COMMIT @TransactionalEventListener from an AFTER_COMMIT one with respect to the ability to affect the transaction outcome?
    options:
      - "BEFORE_COMMIT runs while the transaction is still open, so throwing there can still roll back the commit; AFTER_COMMIT runs after commit, so it cannot undo it."
      - "Both run after commit; only the log message differs."
      - "AFTER_COMMIT can veto the commit; BEFORE_COMMIT cannot."
      - "BEFORE_COMMIT runs on a separate thread, AFTER_COMMIT on the same thread."
    answer: 0
    explanation: |
      BEFORE_COMMIT fires before the commit is flushed while the transaction is still active, so an exception can prevent/roll back the commit. AFTER_COMMIT fires once the commit has already succeeded and cannot reverse it (the data is already durable).
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-083
    difficulty: expert
    tags: [transactional-event-listener, nested-publish, after-commit]
    question: |
      Inside an AFTER_COMMIT @TransactionalEventListener (synchronous), you publish another event intended for a second AFTER_COMMIT listener. By default, does that second listener fire?
    options:
      - "Not by default: you are already past commit with no active transaction, so a new @TransactionalEventListener(AFTER_COMMIT) finds no transaction and is dropped unless fallbackExecution=true or a new transaction is started."
      - "Yes, it fires reliably because a new transaction is auto-created."
      - "Yes; AFTER_COMMIT listeners share the committed transaction."
      - "It throws IllegalStateException immediately."
    answer: 0
    explanation: |
      AFTER_COMMIT code runs outside any transaction. A freshly published event targeting another AFTER_COMMIT listener has no active transaction to bind to, so by default it is silently skipped. You would need fallbackExecution=true or to wrap the publish in a new (REQUIRES_NEW) transaction.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-084
    difficulty: advanced
    tags: [async, exception, void, future]
    question: |
      Consider two @Async methods: (A) void doWork() and (B) CompletableFuture<Void> doWork(). Both throw a RuntimeException. A caller wraps each invocation in try/catch. Which statement is correct?
    options:
      - "Both try/catch blocks catch the exception at the call site."
      - "Neither exception is ever observable anywhere."
      - "For (A) the call-site try/catch catches nothing (exception goes to AsyncUncaughtExceptionHandler); for (B) the try/catch also catches nothing at the call site, but the exception is stored in the future and surfaces via get()/exceptionally/whenComplete."
      - "For (A) the exception surfaces at get(); for (B) it goes to the handler."
    answer: 2
    explanation: |
      A call-site try/catch never catches an async exception because submission returns immediately. For a void method the exception is routed to the AsyncUncaughtExceptionHandler; for a CompletableFuture-returning method it is captured in the future and observed later via get() (ExecutionException) or composition callbacks.
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-085
    difficulty: expert
    tags: [thread-pool-task-executor, rejection, caller-runs]
    question: |
      A ThreadPoolTaskExecutor uses corePoolSize=8, maxPoolSize=8, queueCapacity=100, and CallerRunsPolicy. Under a burst where the queue is full and all 8 threads are busy, what happens to the next submitted task, and what is a side effect on throughput?
    options:
      - "It is run synchronously on the submitting thread (CallerRunsPolicy); this throttles the producer but can block the calling thread (e.g. a web request or scheduler thread), causing back-pressure."
      - "It is silently discarded, reducing latency."
      - "A TaskRejectedException is thrown, identical to AbortPolicy."
      - "The pool grows beyond maxPoolSize to absorb the burst."
    answer: 0
    explanation: |
      CallerRunsPolicy executes the rejected task in the calling thread, providing natural back-pressure by slowing the producer. The side effect is that the caller (which may be a request thread or the scheduler thread) is blocked running the task, which can stall other work if not anticipated.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-086
    difficulty: expert
    tags: [thread-pool-task-executor, sizing, queue]
    question: |
      You want a ThreadPoolTaskExecutor to actually scale from 4 to 20 threads under load. It currently stays at 4. Which single change most directly achieves scaling to maxPoolSize?
    options:
      - "Set a bounded, small queueCapacity (or 0 with a SynchronousQueue) so the queue fills quickly, prompting the pool to grow toward maxPoolSize=20."
      - "Increase queueCapacity to Integer.MAX_VALUE."
      - "Set allowCoreThreadTimeOut=true."
      - "Increase corePoolSize to 20 and remove maxPoolSize."
    answer: 0
    explanation: |
      A ThreadPoolExecutor only grows past corePoolSize when the queue is FULL. With a large/unbounded queue it never grows. Using a small bounded queue (or queueCapacity=0 -> SynchronousQueue) makes the queue fill fast, triggering thread creation up to maxPoolSize. Increasing the queue does the opposite of what's wanted.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-087
    difficulty: advanced
    tags: [async, self-invocation, proxy, order]
    question: |
      A class has a public @Async method asyncWork() and a public non-async method entry() that calls this.asyncWork(). It is injected elsewhere and entry() is called through the proxy. Does asyncWork() run asynchronously?
    options:
      - "No, because once execution is inside the target object, this.asyncWork() is a direct call on the target that bypasses the proxy — only entry()'s entry point went through the proxy."
      - "Yes, because entry() was invoked through the proxy, so the nested call is also proxied."
      - "Yes, because @Async is transitive across method calls in the same bean."
      - "It throws because you cannot mix async and non-async methods in one class."
    answer: 0
    explanation: |
      The proxy only intercepts the initial external call to entry(). Inside the target instance, this.asyncWork() is a plain Java call on the target object, never touching the proxy, so the async advice does not run and asyncWork() executes synchronously. The self-invocation trap is unaffected by how the outer method was entered.
    ref: "concepts.md#async-proxy-self-invocation-caveat"

  - id: async-scheduling-events-088
    difficulty: expert
    tags: [async, completable-future, composition]
    question: |
      Two @Async methods return CompletableFuture<A> and CompletableFuture<B> from the SAME single-threaded executor (corePoolSize=1, unbounded queue). A caller does fa.thenCombine(fb, ...).join(). Assuming the caller is NOT one of the pool threads, what is the risk?
    options:
      - "Guaranteed deadlock, because thenCombine always runs on the pool."
      - "No parallelism: with a single pool thread the two tasks run sequentially, so total time is the sum, not the max — and if the caller thread itself were the pool thread it could deadlock."
      - "The two futures run truly in parallel because CompletableFuture uses ForkJoinPool."
      - "thenCombine throws because the futures come from different threads."
    answer: 1
    explanation: |
      Both @Async calls are submitted to the same single-thread executor, so they execute one after another (no parallelism; time ≈ sum). Deadlock is a separate hazard that arises specifically when the blocking/join caller is itself the sole pool thread waiting on work queued behind it. A larger pool is needed for real parallelism.
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-089
    difficulty: advanced
    tags: [events, ordering, order-annotation]
    question: |
      Three synchronous listeners for the same event are annotated @Order(10), @Order(-5), and no @Order. In what order does Spring invoke them?
    options:
      - "@Order(-5) first, then @Order(10), then the unannotated one (which defaults to LOWEST_PRECEDENCE)."
      - "Declaration order in the source file, ignoring @Order."
      - "The unannotated one first, then @Order(-5), then @Order(10)."
      - "Random order, because @Order is advisory only."
    answer: 0
    explanation: |
      Lower @Order value = higher precedence = earlier. -5 runs before 10. A listener without @Order defaults to Ordered.LOWEST_PRECEDENCE (Integer.MAX_VALUE), so it runs last. Ordering is deterministic for synchronous listeners.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-090
    difficulty: expert
    tags: [events, ordering, async, threads]
    question: |
      Three listeners for one event have @Order(1), @Order(2), @Order(3) and all are @Async on a multi-threaded executor. What ordering guarantee holds?
    options:
      - "Their completion is guaranteed in the order 1, 2, 3."
      - "@Order controls the order in which they are DISPATCHED/submitted, but once running on different threads there is no completion-ordering guarantee."
      - "@Order is ignored entirely for async listeners."
      - "They are guaranteed to run on the same thread in order."
    answer: 1
    explanation: |
      @Order still determines the sequence in which Spring dispatches (submits) the listeners, but since they execute concurrently on different pool threads, the order in which they actually finish is unspecified.
    ref: "concepts.md#async-event-limitations"

  - id: async-scheduling-events-091
    difficulty: advanced
    tags: [scheduled, fixed-rate, pool-size, concurrency]
    question: |
      Two DIFFERENT @Scheduled methods, jobA (fixedRate=1000, takes 5s) and jobB (fixedRate=1000, takes 50ms), run on a ThreadPoolTaskScheduler with poolSize=1. What is the observed behavior of jobB?
    options:
      - "jobB runs every 1s unaffected, because each job gets its own thread."
      - "jobB is starved: while jobA occupies the single pool thread for 5s, jobB cannot run and its ticks pile up/skip until the thread is free."
      - "jobB runs concurrently with jobA on the same thread via time-slicing."
      - "jobB throws a TaskRejectedException."
    answer: 1
    explanation: |
      A single scheduler thread is shared across ALL scheduled tasks. While jobA monopolizes it for 5s, jobB cannot be dispatched, so its 1s ticks are delayed/coalesced. Sizing poolSize >= number of independent jobs (or isolating jobs) prevents cross-job starvation.
    ref: "concepts.md#threadpooltaskscheduler"

  - id: async-scheduling-events-092
    difficulty: expert
    tags: [scheduled, fixed-rate, catch-up, misfire]
    question: |
      A @Scheduled(fixedRate=1000) task on a pool with 4 threads occasionally takes 4s. Spring's default fixedRate does NOT run the same task concurrently. When the 4s run finishes, how does Spring handle the ~3 missed ticks?
    options:
      - "It fires 3 catch-up executions back-to-back immediately to 'make up' for the missed ticks."
      - "It fires exactly one execution immediately (the scheduled time is in the past) and then resumes the 1s cadence; it does NOT queue one run per missed tick."
      - "It skips ahead and waits a full 1s before the next run."
      - "It throws because the task overran its rate."
    answer: 1
    explanation: |
      Spring's ReschedulingRunnable for a single fixedRate task does not overlap executions of that task; after a long run it schedules the next execution for a time already in the past, so it runs once immediately and then continues at the fixed rate. It does not enqueue one make-up run per missed interval.
    ref: "concepts.md#fixedrate-vs-fixeddelay-vs-cron"

  - id: async-scheduling-events-093
    difficulty: intermediate
    tags: [async, reactive, anti-pattern]
    question: |
      Why is it generally an anti-pattern to put @Async on a method that returns Mono or Flux?
    options:
      - "Because reactive types cannot be serialized across threads."
      - "Because reactive types are lazy and already control their own execution/scheduling; @Async only offloads the (trivial) assembly of the pipeline to another thread, not the actual work, adding confusion without benefit."
      - "Because @Async deletes the reactive operators."
      - "Because Spring throws an exception at startup for reactive @Async methods."
    answer: 1
    explanation: |
      A method returning Mono/Flux typically just assembles a lazy pipeline that executes on subscription via its own schedulers (subscribeOn/publishOn). @Async would merely move the cheap assembly to another thread while the real work still runs on the reactive scheduler — so it adds a pointless thread hop and muddles the execution model.
    ref: "concepts.md#async-return-types"

  - id: async-scheduling-events-094
    difficulty: expert
    tags: [events, transaction, propagation, requires-new]
    question: |
      A @Transactional(REQUIRES_NEW) method M is called; inside it, an event is published to a synchronous @TransactionalEventListener(AFTER_COMMIT). Which transaction's commit triggers the listener?
    options:
      - "The outer transaction's commit."
      - "The inner REQUIRES_NEW transaction's commit (that is the transaction active at publish time)."
      - "Neither; AFTER_COMMIT never fires with REQUIRES_NEW."
      - "Both, once per transaction."
    answer: 1
    explanation: |
      @TransactionalEventListener binds to whatever transaction is active when publishEvent() is called. Inside a REQUIRES_NEW method, the active transaction is the new inner one, so the listener fires after THAT inner transaction commits — independently of the outer transaction's eventual outcome.
    ref: "concepts.md#transactionaleventlistener"

  - id: async-scheduling-events-095
    difficulty: expert
    tags: [async, exception, future, silent-loss]
    question: |
      An @Async method returns CompletableFuture<T> and throws an exception, but the calling code fires it off and NEVER calls get()/join() nor attaches exceptionally/whenComplete. Where does the exception end up?
    options:
      - "It is automatically routed to the AsyncUncaughtExceptionHandler because the future was ignored."
      - "It is captured inside the (never-observed) completed-exceptionally future and is effectively lost — no handler runs and nothing is logged, so the failure is silent."
      - "Spring re-throws it on the caller's thread at submission time."
      - "It crashes the executor thread and kills the pool."
    answer: 1
    explanation: |
      The AsyncUncaughtExceptionHandler fires only for void-returning @Async methods. For a Future/CompletableFuture return, Spring stores the exception in the future; if the caller never inspects it (get/join/exceptionally/whenComplete) the exception is silently swallowed — a common source of invisible async failures. Either always consume the future or use a void method (which does route to the handler).
    ref: "concepts.md#asyncuncaughtexceptionhandler-and-exception-handling"

  - id: async-scheduling-events-096
    difficulty: expert
    tags: [events, payload-application-event, wrapping]
    question: |
      When you call publishEvent(someArbitraryPojo) where the POJO does NOT extend ApplicationEvent, what does Spring actually deliver to ApplicationListener implementations, and how can such a listener be typed?
    options:
      - "It delivers the raw POJO to ApplicationListener<Object> only."
      - "It refuses to publish non-ApplicationEvent objects."
      - "It wraps the POJO in a PayloadApplicationEvent<T>; an interface-style listener can target it as ApplicationListener<PayloadApplicationEvent<TheType>> (while @EventListener can bind the payload type directly)."
      - "It converts the POJO to JSON and delivers a String event."
    answer: 2
    explanation: |
      Arbitrary payloads are wrapped in a PayloadApplicationEvent<T> whose getPayload() returns the object. Interface listeners use ApplicationListener<PayloadApplicationEvent<T>>, whereas @EventListener methods can declare the payload type directly as the parameter and Spring unwraps it.
    ref: "concepts.md#generic-events-and-resolvabletypeprovider"

  - id: async-scheduling-events-097
    difficulty: advanced
    tags: [scheduled, shutdown, boot-properties]
    question: |
      Which Spring Boot properties let you make the auto-configured scheduler drain in-flight scheduled tasks on shutdown instead of interrupting them?
    options:
      - "spring.task.scheduling.graceful=true only."
      - "spring.task.scheduling.shutdown.await-termination=true and spring.task.scheduling.shutdown.await-termination-period=<duration>."
      - "server.shutdown=graceful only (it covers scheduler tasks too)."
      - "There are no such properties; you must define a bean."
    answer: 1
    explanation: |
      Boot exposes spring.task.scheduling.shutdown.await-termination and .await-termination-period (mirroring setWaitForTasksToCompleteOnShutdown / setAwaitTerminationSeconds). server.shutdown=graceful drains web requests, not scheduler tasks, and the properties do exist so a custom bean isn't required.
    ref: "concepts.md#scheduler-lifecycle-and-graceful-shutdown"

  - id: async-scheduling-events-098
    difficulty: expert
    tags: [async, boot, default-executor, ambiguity]
    question: |
      In a Spring Boot 3 app, you define your own ThreadPoolTaskExecutor @Bean named "reportExecutor" but do NOT implement AsyncConfigurer and do NOT put @Async("reportExecutor"). You still have Boot's applicationTaskExecutor. Which executor do bare @Async methods use?
    options:
      - "reportExecutor, because a user-defined executor always wins."
      - "It fails to start due to two Executor beans."
      - "The Boot-provided applicationTaskExecutor, because it remains the designated default; your bean is only used when explicitly qualified via @Async(\"reportExecutor\")."
      - "It alternates between the two round-robin."
    answer: 2
    explanation: |
      Bare @Async resolves the default executor. Boot's applicationTaskExecutor is the recognized default; an additional, differently named Executor bean does not become the default merely by existing — you must select it via @Async("reportExecutor") or make it the default through AsyncConfigurer/primary designation. (If exactly one unique Executor existed, that would be used, but here the applicationTaskExecutor default remains in play.)
    ref: "concepts.md#custom-taskexecutor-for-async"

  - id: async-scheduling-events-099
    difficulty: advanced
    tags: [events, condition, spel, timing]
    question: |
      At what point is the SpEL condition on @EventListener(condition = "...") evaluated, and what is a consequence?
    options:
      - "At bean creation time, once — so it cannot depend on event data."
      - "After the listener body runs, to decide whether to keep the result."
      - "Before the listener body is invoked, against the event (and args); if it evaluates false the listener body is skipped entirely — useful to avoid unnecessary work, but the expression itself runs on the dispatching thread every publish."
      - "Only for asynchronous listeners; synchronous ones ignore it."
    answer: 2
    explanation: |
      The condition is evaluated per event, before invoking the listener body, with #root.event/#args/named-arg access. A false result skips the body. Because it runs on every matching publish on the dispatch thread, an expensive SpEL condition adds per-event overhead.
    ref: "concepts.md#application-events-applicationevent-applicationeventpublisher-and-eventlistener"

  - id: async-scheduling-events-100
    difficulty: expert
    tags: [scheduled, distributed, clustering, gotcha]
    question: |
      A @Scheduled(cron="0 0 3 * * *") "nightly cleanup" job is deployed to 4 identical instances behind a load balancer. Operators are surprised it runs 4 times each night. What is the correct explanation and the standard remedy?
    options:
      - "Spring should elect a leader automatically; this is a bug — file an issue."
      - "@Scheduled is per-JVM with no cross-node coordination, so every instance fires it; use a distributed lock (e.g. ShedLock) or a clustered scheduler (Quartz with a JDBC job store) to ensure single execution."
      - "The load balancer duplicated the trigger; enable sticky sessions."
      - "Set spring.task.scheduling.cluster=single to make it run once."
    answer: 1
    explanation: |
      Spring's @Scheduled has no notion of a cluster — each JVM independently evaluates the trigger, so N instances run the job N times. To guarantee single execution across nodes you add distributed locking (ShedLock) or use a cluster-aware scheduler like Quartz with a shared JDBC job store. No such spring.task.scheduling.cluster property exists.
    ref: "concepts.md#threadpooltaskscheduler"
