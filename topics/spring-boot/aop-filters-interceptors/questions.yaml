topic: "AOP, Filters & Interceptors"
domain: spring-boot
topic_slug: aop-filters-interceptors
version: 1
questions:
- id: aop-filters-interceptors-001
  difficulty: beginner
  tags: [terminology, join-point]
  question: |
    In Spring AOP, what does a "join point" always represent?
  options:
  - "A method execution"
  - "A field read or write"
  - "A constructor invocation"
  - "A static initializer block"
  answer: 0
  explanation: |
    Spring AOP is proxy-based and its only supported join point is a method
    execution. AspectJ (full weaving) additionally supports field access,
    constructor calls, static initializers, and more.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-002
  difficulty: beginner
  tags: [terminology, pointcut]
  question: |
    Which AOP term refers to the predicate/expression that selects WHICH join
    points an advice should apply to?
  options:
  - "Advice"
  - "Aspect"
  - "Weaving"
  - "Pointcut"
  answer: 3
  explanation: |
    A pointcut is the predicate (e.g. an execution expression) that matches
    join points. Advice is the action; the aspect bundles advice + pointcut;
    weaving links aspects to targets.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-003
  difficulty: beginner
  tags: [terminology, advice]
  question: |
    "The actual code that runs at a matched join point" describes which term?
  options:
  - "Pointcut"
  - "Introduction"
  - "Target"
  - "Advice"
  answer: 3
  explanation: |
    Advice is the action taken by an aspect at a join point — the code itself
    (@Before, @Around, etc.). The pointcut only selects where; advice is what
    runs.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-004
  difficulty: beginner
  tags: [terminology, weaving]
  question: |
    When is weaving performed in Spring AOP (as opposed to AspectJ)?
  options:
  - "At compile time by a special compiler"
  - "At class-load time via a Java agent"
  - "Never — Spring does not weave at all"
  - "At runtime, when the proxy is created"
  answer: 3
  explanation: |
    Spring AOP weaves at runtime by creating proxies during bean creation.
    AspectJ can weave at compile time (ajc) or at load time (LTW agent).
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-005
  difficulty: beginner
  tags: [terminology, target-proxy]
  question: |
    In proxy-based AOP, when client code calls a method on an advised bean,
    which object does it actually hold a reference to?
  options:
  - "The proxy that wraps the target"
  - "The raw target object"
  - "The BeanFactory"
  - "A new instance created per call"
  answer: 0
  explanation: |
    Callers hold the proxy. The proxy applies advice and then delegates to the
    real target object. This indirection is exactly why self-invocation (this.x())
    bypasses advice.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-006
  difficulty: intermediate
  tags: [terminology, introduction]
  question: |
    What does an AOP "introduction" allow you to do?
  options:
  - "Declare additional methods or make a bean implement a new interface"
  - "Run code only the first time a bean is created"
  - "Select join points using regular expressions"
  - "Reorder aspects at runtime"
  answer: 0
  explanation: |
    An introduction (inter-type declaration) adds new methods/fields or makes an
    advised object implement an additional interface — expanding the type, not
    just wrapping a method call.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-007
  difficulty: beginner
  tags: [advice-types]
  question: |
    Which advice type can PREVENT the target method from executing and can
    replace its return value?
  options:
  - "@Around"
  - "@AfterReturning"
  - "@Before"
  - "@After"
  answer: 0
  explanation: |
    Only @Around wraps the join point and controls whether/when proceed() is
    called, so it alone can skip the target and substitute a return value. The
    others cannot stop the call (except by throwing).
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-008
  difficulty: beginner
  tags: [advice-types]
  question: |
    Which advice runs after the join point completes regardless of whether it
    returned normally or threw an exception (a "finally"-style advice)?
  options:
  - "@AfterReturning"
  - "@AfterThrowing"
  - "@Before"
  - "@After"
  answer: 3
  explanation: |
    @After is the finally-style advice: it always runs after the method, on both
    success and exception. @AfterReturning runs only on normal return;
    @AfterThrowing only on exception.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-009
  difficulty: intermediate
  tags: [advice-types, around]
  question: |
    A developer writes an @Around advice but forgets to return the value of
    pjp.proceed(). What happens?
  options:
  - "A compilation error occurs"
  - "The target runs, but callers receive null"
  - "The target method is never invoked"
  - "Spring automatically returns the target's value anyway"
  answer: 1
  explanation: |
    @Around must explicitly return the result of proceed(). If it runs proceed()
    but returns nothing (or returns null), the target still executes but the
    caller receives null, silently corrupting behavior.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-010
  difficulty: intermediate
  tags: [advice-types, binding]
  question: |
    To capture the value returned by the target method inside an advice, which
    combination is correct?
  options:
  - "@Around with the 'returning' attribute"
  - "@AfterThrowing with the 'throwing' attribute"
  - "@Before with a JoinPoint.getReturnValue() call"
  - "@AfterReturning with the 'returning' attribute binding a parameter"
  answer: 3
  explanation: |
    @AfterReturning(pointcut=..., returning="result") binds the return value to a
    parameter. @Before runs before there is a return value; @AfterThrowing binds
    the thrown exception via 'throwing'.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-011
  difficulty: advanced
  tags: [advice-types, ordering]
  question: |
    For a single aspect advising one method that returns normally, which order do
    the advices execute in (modern Spring / AspectJ precedence)?
  options:
  - "@Around(before proceed) -> @Before -> target -> @Around(after proceed) -> @After -> @AfterReturning"
  - "@Before -> @Around(before proceed) -> target -> @After -> @AfterReturning -> @Around(after)"
  - "@Around(before proceed) -> @Before -> target -> @AfterReturning -> @After -> @Around(after proceed)"
  - "target -> @Before -> @Around -> @After -> @AfterReturning"
  answer: 2
  explanation: |
    @Around is the highest-precedence (outermost) advice, so everything else runs
    inside its proceed() and its after-proceed code runs LAST:
    @Around(before proceed) -> @Before -> target -> @AfterReturning -> @After ->
    @Around(after proceed). Per AspectJ "after finally" semantics in modern Spring
    (5.2.7+), @After runs after @AfterReturning. (Pre-5.2.7 Spring ran @Around's
    after-code before @After, which was a bug.)
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-012
  difficulty: intermediate
  tags: [advice-types, proceeding-join-point]
  question: |
    Which parameter type is available ONLY to @Around advice (and lets it invoke
    the target)?
  options:
  - "JoinPoint"
  - "ProceedingJoinPoint"
  - "MethodInvocation"
  - "HandlerMethod"
  answer: 1
  explanation: |
    Only @Around receives a ProceedingJoinPoint, whose proceed() method invokes
    the underlying target. Other advice types may declare a plain JoinPoint but
    cannot proceed().
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-013
  difficulty: beginner
  tags: [aspect, enabling]
  question: |
    Besides annotating a class with @Aspect, what else is required for its advice
    to actually take effect in a plain (non-Boot) Spring application?
  options:
  - "Nothing — @Aspect alone is enough"
  - "The aspectjweaver Java agent must be attached"
  - "The class must extend AbstractAspect"
  - "The class must be a Spring bean AND AspectJ auto-proxying must be enabled"
  answer: 3
  explanation: |
    @Aspect only marks the class. It must also be a managed bean (e.g. @Component)
    and auto-proxying must be on (@EnableAspectJAutoProxy). No Java agent is needed
    for proxy-based Spring AOP.
  ref: "concepts.md#aspect-and-enabling-aop"

- id: aop-filters-interceptors-014
  difficulty: intermediate
  tags: [aspect, spring-boot, enabling]
  question: |
    How does Spring Boot typically enable AspectJ auto-proxying?
  options:
  - "You must always add @EnableAspectJAutoProxy manually"
  - "It requires the aspectjrt jar and a -javaagent flag"
  - "It uses load-time weaving by default"
  - "AopAutoConfiguration enables it automatically when spring-boot-starter-aop is on the classpath"
  answer: 3
  explanation: |
    With spring-boot-starter-aop on the classpath, AopAutoConfiguration turns on
    AspectJ auto-proxying automatically, so you just add @Aspect @Component. No
    Java agent is used (Spring AOP is proxy-based).
  ref: "concepts.md#aspect-and-enabling-aop"

- id: aop-filters-interceptors-015
  difficulty: advanced
  tags: [aspect, internals, bean-post-processor]
  question: |
    What infrastructure component does @EnableAspectJAutoProxy register to actually
    create the proxies?
  options:
  - "A BeanFactoryPostProcessor named AspectRegistrar"
  - "A servlet Filter that wraps each bean"
  - "An AnnotationAwareAspectJAutoProxyCreator, which is a BeanPostProcessor"
  - "A FactoryBean for every aspect"
  answer: 2
  explanation: |
    @EnableAspectJAutoProxy registers AnnotationAwareAspectJAutoProxyCreator, a
    BeanPostProcessor that inspects beans during creation and wraps those matching
    aspect pointcuts in a proxy.
  ref: "concepts.md#aspect-and-enabling-aop"

- id: aop-filters-interceptors-016
  difficulty: intermediate
  tags: [aspect, aspectj-annotations, trap]
  question: |
    A candidate says: "Because Spring AOP uses AspectJ annotations like @Aspect and
    execution() pointcuts, it must be using the AspectJ weaver at runtime." Why is
    this WRONG?
  options:
  - "Spring AOP uses only its own annotations, not AspectJ's"
  - "Spring AOP borrows AspectJ's annotation style and pointcut language but still implements interception with runtime proxies, not the AspectJ weaver"
  - "Spring AOP always weaves at compile time"
  - "AspectJ annotations only work if you attach a Java agent, which Boot does by default"
  answer: 1
  explanation: |
    This is a classic trap. Spring AOP reuses AspectJ's annotations and pointcut
    expression language for convenience, but interception is done via runtime
    proxies. The AspectJ weaver is only involved if you configure load-time weaving
    explicitly.
  ref: "concepts.md#aspect-and-enabling-aop"

- id: aop-filters-interceptors-017
  difficulty: beginner
  tags: [pointcut-expressions, execution]
  question: |
    What does the pointcut execution(* com.app.service.*.*(..)) match?
  options:
  - "Only public methods that take no arguments"
  - "Only void methods in com.app.service"
  - "Methods in com.app.service AND all its sub-packages"
  - "Any method in classes directly in com.app.service, with any return type and any args"
  answer: 3
  explanation: |
    The first * = any return type; service.* = any class directly in that package
    (single dot, no sub-packages); .*  = any method name; (..) = any arguments.
    Sub-packages would require the '..' package wildcard (service..*).
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-018
  difficulty: intermediate
  tags: [pointcut-expressions, packages]
  question: |
    Which pointcut matches methods in com.app.service AND every sub-package under it?
  options:
  - "execution(* com.app.service.*.*(..))"
  - "execution(* com.app.service..*.*(..))"
  - "execution(* com.app.service.**(..))"
  - "within(com.app.service.*)"
  answer: 1
  explanation: |
    The '..' wildcard in a package position means "this package and any
    sub-package". A single dot (service.*) restricts to classes directly in that
    package only.
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-019
  difficulty: intermediate
  tags: [pointcut-expressions, annotation]
  question: |
    You want advice to fire only on methods annotated with a custom @Audited
    annotation. Which pointcut designator do you use?
  options:
  - "@annotation(com.app.Audited)"
  - "within(@com.app.Audited *)"
  - "execution(@Audited)"
  - "bean(*Audited)"
  answer: 0
  explanation: |
    @annotation(com.app.Audited) matches join points where the executing method
    carries that annotation. @within/@target match on the annotated *type*, and
    bean() matches by bean name.
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-020
  difficulty: advanced
  tags: [pointcut-expressions, this-target]
  question: |
    What is the difference between the this(Type) and target(Type) pointcut
    designators?
  options:
  - "this(Type) matches when the proxy is an instance of Type; target(Type) matches when the target object is an instance of Type"
  - "They are identical aliases"
  - "this(Type) matches the target; target(Type) matches the proxy"
  - "Both only work with CGLIB proxies"
  answer: 0
  explanation: |
    this() tests the proxy's type; target() tests the underlying target object's
    type. With JDK proxies these can differ (proxy implements interface, target is
    concrete class), which is why the distinction matters.
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-021
  difficulty: intermediate
  tags: [pointcut-expressions, named-pointcut]
  question: |
    What is the purpose of a @Pointcut-annotated (named) method in an aspect?
  options:
  - "It is advice that runs before the method"
  - "It defines a reusable, composable pointcut expression referenced by advice"
  - "It registers the aspect as a bean"
  - "It forces CGLIB proxying"
  answer: 1
  explanation: |
    @Pointcut declares a named, reusable pointcut (the method body is empty and its
    name becomes the reference). Advice annotations can reference it and combine
    several with &&, ||, !.
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-022
  difficulty: advanced
  tags: [pointcut-expressions, limitations, trap]
  question: |
    You write a valid pointcut that matches a PRIVATE method, and it compiles fine.
    Why does the advice never fire for that private method via Spring AOP?
  options:
  - "Pointcuts cannot reference private methods syntactically"
  - "Private methods require @EnableAspectJAutoProxy(exposeProxy=true)"
  - "Spring AOP only intercepts proxied external calls to public (CGLIB: also protected) methods, so private methods are never advised"
  - "Spring throws an exception at startup for such pointcuts"
  answer: 2
  explanation: |
    Because interception happens through the proxy, only externally-invoked public
    (and, for CGLIB, protected) methods are advised. A private method is called
    directly on the target, so the advice is bypassed even if the pointcut matches.
  ref: "concepts.md#pointcut-expressions"

- id: aop-filters-interceptors-023
  difficulty: beginner
  tags: [jdk-cglib, selection]
  question: |
    By the classic Spring rule (ignoring proxyTargetClass), when does Spring choose
    a JDK dynamic proxy over CGLIB?
  options:
  - "When the target class is final"
  - "Always, unless the bean is a controller"
  - "When the target implements at least one interface"
  - "Only for prototype-scoped beans"
  answer: 2
  explanation: |
    Classic rule: if the target implements one or more interfaces, Spring uses a
    JDK dynamic proxy; otherwise it falls back to CGLIB subclassing. proxyTargetClass=true
    overrides this to always use CGLIB.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-024
  difficulty: intermediate
  tags: [jdk-cglib, spring-boot-default]
  question: |
    What is the default proxying strategy in Spring Boot (2.0+), and why?
  options:
  - "JDK dynamic proxies, to reduce memory"
  - "Load-time weaving via AspectJ"
  - "CGLIB (proxyTargetClass=true), to avoid ClassCastExceptions when injecting concrete types"
  - "No proxying — Boot rewrites bytecode at build time"
  answer: 2
  explanation: |
    Spring Boot sets proxyTargetClass=true, defaulting to CGLIB. This avoids the
    common problem where injecting a bean by its concrete class fails because a JDK
    proxy only implements the interface, not the concrete type.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-025
  difficulty: intermediate
  tags: [jdk-cglib, final]
  question: |
    Why can a CGLIB proxy NOT advise a final method?
  options:
  - "final methods are private by definition"
  - "final methods are removed by the compiler"
  - "CGLIB only proxies interfaces"
  - "CGLIB proxies by subclassing and overriding methods, and a final method cannot be overridden"
  answer: 3
  explanation: |
    CGLIB generates a runtime subclass and overrides methods to insert advice. A
    final method (or final class) cannot be overridden/subclassed, so it runs
    un-advised. private and static methods share this limitation.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-026
  difficulty: advanced
  tags: [jdk-cglib, classcastexception, scenario]
  question: |
    An interface OrderService is implemented by OrderServiceImpl, and an aspect
    advises it. With default JDK proxying, a colleague autowires the field as
    "OrderServiceImpl orderService" and startup fails. What is the best explanation?
  options:
  - "The JDK proxy implements OrderService but is NOT an instance of OrderServiceImpl, so it can't be injected into a concrete-type field"
  - "CGLIB cannot proxy implementations of interfaces"
  - "Field injection is forbidden for proxied beans"
  - "The aspect must be marked @Primary"
  answer: 0
  explanation: |
    A JDK dynamic proxy implements only the interface(s), not the concrete class, so
    it is not assignable to OrderServiceImpl. Injecting by the interface type (or
    forcing CGLIB via proxyTargetClass=true) resolves it.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-027
  difficulty: beginner
  tags: [self-invocation, trap]
  question: |
    A public method annotated @Transactional calls another @Transactional method in
    the SAME class via this.other(). Why does the second method's transaction
    settings not apply?
  options:
  - "The internal call goes directly to the target and bypasses the proxy that applies the advice"
  - "Nested transactions are illegal in Spring"
  - "@Transactional only works on private methods"
  - "The database rejects nested transactions"
  answer: 0
  explanation: |
    This is the self-invocation limitation. The internal this.other() call does not
    pass through the proxy, so proxy-based advice (transactions, caching, async) is
    not applied to the inner method.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-028
  difficulty: intermediate
  tags: [self-invocation, features]
  question: |
    Which of the following is NOT affected by the self-invocation limitation?
  options:
  - "@Cacheable called internally via this"
  - "@Async called internally via this"
  - "An AspectJ load-time-woven aspect on an internally called method"
  - "@Transactional called internally via this"
  answer: 2
  explanation: |
    AspectJ weaves the bytecode directly (no proxy), so it intercepts internal
    self-invocations too. @Cacheable, @Async, and @Transactional are all
    proxy-based and therefore bypassed on self-invocation.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-029
  difficulty: intermediate
  tags: [self-invocation, fixes]
  question: |
    Which is the CLEANEST recommended fix for the self-invocation problem?
  options:
  - "Make all methods static"
  - "Move the self-called method into a separate bean so the call crosses a proxy boundary"
  - "Mark the inner method private"
  - "Disable auto-proxying"
  answer: 1
  explanation: |
    Extracting the inner method into a separate bean means the call goes through
    that bean's proxy, so advice applies. Self-injection or AopContext.currentProxy()
    also work but are considered less clean.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-030
  difficulty: advanced
  tags: [self-invocation, fixes, aspectj]
  question: |
    Of the documented fixes for the self-invocation limitation, which one removes the
    proxy from the equation entirely — so internal this.method() calls are advised
    WITHOUT any Spring-AOP-specific code (no self-injection, no AopContext)?
  options:
  - "Setting proxyTargetClass = true to force CGLIB proxies"
  - "Switching to AspectJ compile-time or load-time weaving"
  - "Marking the inner method @Transactional(propagation = REQUIRES_NEW)"
  - "Injecting the bean into itself and calling through the self reference"
  answer: 1
  explanation: |
    AspectJ CTW/LTW weaves the advice directly into the bytecode, so there is no proxy
    to bypass and self-invocations are intercepted with no framework-coupling in the
    business code. Self-injection and AopContext.currentProxy() also work but couple the
    code to Spring AOP; proxyTargetClass only changes proxy type, not the bypass problem.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-031
  difficulty: beginner
  tags: [spring-aop-vs-aspectj]
  question: |
    Which statement about Spring AOP vs AspectJ is correct?
  options:
  - "Spring AOP weaves bytecode at compile time; AspectJ uses proxies"
  - "Both require a Java agent to function"
  - "Spring AOP is runtime proxy-based and limited to Spring bean method executions; AspectJ does true bytecode weaving with far more join points"
  - "AspectJ can only advise Spring beans"
  answer: 2
  explanation: |
    Spring AOP is proxy-based, runtime, method-execution-only, and only for Spring
    beans. AspectJ weaves bytecode (compile/post-compile/load-time), works on any
    object, and supports many join point kinds.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-032
  difficulty: intermediate
  tags: [spring-aop-vs-aspectj, join-points]
  question: |
    Which capability is available with AspectJ but NOT with Spring AOP?
  options:
  - "Advising field access, constructors, and final/private methods, plus intercepting self-invocations"
  - "Using @Around advice"
  - "Advising method executions of Spring beans"
  - "Using execution() pointcuts"
  answer: 0
  explanation: |
    AspectJ weaves bytecode directly, so it can advise field get/set, constructors,
    static initializers, final/private methods, and it intercepts internal
    self-invocations. Spring AOP (proxy) cannot do any of those.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-033
  difficulty: advanced
  tags: [spring-aop-vs-aspectj, ltw]
  question: |
    You need to intercept a method on a plain object created with 'new' (not a
    Spring bean) and also intercept self-invocations. Which approach fits?
  options:
  - "Spring AOP with proxyTargetClass=true"
  - "A HandlerInterceptor"
  - "AspectJ compile-time or load-time weaving"
  - "A servlet Filter"
  answer: 2
  explanation: |
    Only AspectJ weaving (CTW/LTW) can advise non-Spring, new-ed objects and
    intercept self-invocations, because it weaves the aspect into the bytecode
    itself rather than relying on a Spring-managed proxy.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-034
  difficulty: intermediate
  tags: [spring-aop-vs-aspectj, performance]
  question: |
    Regarding performance, which is generally true?
  options:
  - "Spring AOP is faster because it avoids method calls"
  - "Both add identical overhead"
  - "AspectJ woven code runs essentially at native speed, while Spring AOP adds per-call proxy overhead"
  - "AspectJ is always slower because of reflection"
  answer: 2
  explanation: |
    AspectJ weaves advice directly into bytecode, so there is little per-call
    overhead. Spring AOP interposes a proxy invocation on every advised call, a
    small but real overhead.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-035
  difficulty: intermediate
  tags: [ordering]
  question: |
    Two aspects advise the same method: SecurityAspect (@Order(1)) and LoggingAspect
    (@Order(2)). Which runs first on the way IN?
  options:
  - "SecurityAspect, because a lower @Order value means higher precedence"
  - "LoggingAspect, because higher numbers run first"
  - "They run in random order"
  - "Whichever bean was created first"
  answer: 0
  explanation: |
    Lower @Order value = higher precedence = runs first inbound (and last outbound).
    So SecurityAspect (1) wraps LoggingAspect (2). On the way out the order reverses.
  ref: "concepts.md#aspect-ordering"

- id: aop-filters-interceptors-036
  difficulty: beginner
  tags: [ordering]
  question: |
    How do you control the relative order of two different aspects on the same join
    point?
  options:
  - "By implementing Ordered or using @Order on the aspects"
  - "By alphabetical class name"
  - "By the order of imports"
  - "You cannot control aspect ordering"
  answer: 0
  explanation: |
    Aspect precedence is set with the @Order annotation or by implementing the
    Ordered interface. Lower values have higher precedence.
  ref: "concepts.md#aspect-ordering"

- id: aop-filters-interceptors-037
  difficulty: advanced
  tags: [ordering, same-aspect]
  question: |
    You have two advices of different types in the SAME aspect on the same join
    point and need a strict order between them. What is the reliable approach?
  options:
  - "Split them into separate aspects, each with its own @Order"
  - "Add @Order to each advice method"
  - "Rename the methods alphabetically"
  - "It is impossible to control any ordering"
  answer: 0
  explanation: |
    @Order applies at the aspect level, not per advice method. Ordering of multiple
    advices within one aspect is not controllable that way, so split them into
    separate aspects with distinct @Order values for a guaranteed order.
  ref: "concepts.md#aspect-ordering"

- id: aop-filters-interceptors-038
  difficulty: beginner
  tags: [use-cases]
  question: |
    Which of these Spring features is NOT typically implemented via proxy-based AOP?
  options:
  - "@Transactional"
  - "@Cacheable"
  - "@Autowired field injection"
  - "@Async"
  answer: 2
  explanation: |
    @Transactional, @Cacheable, and @Async are all realized through proxy-based AOP
    advice. @Autowired dependency injection is performed by the container/BeanPostProcessors,
    not by AOP proxying.
  ref: "concepts.md#aop-use-cases"

- id: aop-filters-interceptors-039
  difficulty: intermediate
  tags: [use-cases]
  question: |
    Which is a strong indicator that a concern is a good candidate for AOP?
  options:
  - "It is unique to a single method"
  - "It applies orthogonally across many Spring bean methods and is unrelated to core business logic"
  - "It requires reading the raw HTTP body of static resource requests"
  - "It must run before the DispatcherServlet"
  answer: 1
  explanation: |
    AOP shines for cross-cutting concerns that repeat across many bean methods and
    are orthogonal to business logic (logging, metrics, tx, caching). Raw request
    handling / pre-DispatcherServlet work belongs to filters.
  ref: "concepts.md#aop-use-cases"

- id: aop-filters-interceptors-040
  difficulty: beginner
  tags: [servlet-filter]
  question: |
    At what layer does a servlet Filter operate?
  options:
  - "At the servlet container level, before/around the DispatcherServlet, on the raw request/response"
  - "Inside the DispatcherServlet, around controller methods"
  - "At the database/JDBC layer"
  - "Only within @Aspect-advised beans"
  answer: 0
  explanation: |
    A Filter is part of the Servlet spec and runs at the container level, wrapping
    the entire request including the DispatcherServlet. It sees the raw
    ServletRequest/ServletResponse and does not know the matched handler.
  ref: "concepts.md#servlet-filter"

- id: aop-filters-interceptors-041
  difficulty: intermediate
  tags: [servlet-filter, jakarta]
  question: |
    In Spring Boot 3 / Spring 6, which package is a Filter interface imported from?
  options:
  - "javax.servlet"
  - "org.springframework.web.filter"
  - "jakarta.servlet"
  - "java.servlet"
  answer: 2
  explanation: |
    Spring Boot 3 / Spring 6 moved to the Jakarta EE 9+ namespace, so it is
    jakarta.servlet.Filter. Spring Boot 2 / Spring 5 used javax.servlet.Filter.
  ref: "concepts.md#servlet-filter"

- id: aop-filters-interceptors-042
  difficulty: intermediate
  tags: [servlet-filter, short-circuit]
  question: |
    Inside a Filter's doFilter, what happens if you do NOT call chain.doFilter(req, res)?
  options:
  - "The request proceeds normally to the next filter and the servlet"
  - "Spring throws a ServletException automatically"
  - "The request is short-circuited; downstream filters and the servlet/controller are not invoked"
  - "The response is committed but the controller still runs"
  answer: 2
  explanation: |
    chain.doFilter passes control down the chain. Omitting it short-circuits the
    request so no further filters, servlets, or controllers execute — useful for
    auth rejection, caching hits, etc.
  ref: "concepts.md#servlet-filter"

- id: aop-filters-interceptors-043
  difficulty: advanced
  tags: [servlet-filter, ordering, registration]
  question: |
    You have two Filter beans and need to guarantee one runs before the other, plus
    restrict one to /api/*. What is the best way?
  options:
  - "Annotate methods with @Order inside the controller"
  - "Filters cannot be ordered or path-restricted"
  - "Use InterceptorRegistry.addInterceptor"
  - "Register each with a FilterRegistrationBean, setting order() and URL patterns"
  answer: 3
  explanation: |
    FilterRegistrationBean lets you set the filter's order and URL patterns
    explicitly. InterceptorRegistry is for HandlerInterceptors, not filters.
  ref: "concepts.md#servlet-filter"

- id: aop-filters-interceptors-044
  difficulty: intermediate
  tags: [servlet-filter, once-per-request]
  question: |
    Why might you extend OncePerRequestFilter instead of implementing Filter directly?
  options:
  - "It automatically makes the filter transactional"
  - "It guarantees a single execution per request, avoiding double invocation on forwards/async dispatches"
  - "It converts the filter into a HandlerInterceptor"
  - "It disables the rest of the filter chain"
  answer: 1
  explanation: |
    OncePerRequestFilter (a Spring helper) ensures the filter logic runs exactly
    once per request, even when the request is forwarded or dispatched
    asynchronously, which a plain Filter might otherwise re-trigger.
  ref: "concepts.md#servlet-filter"

- id: aop-filters-interceptors-045
  difficulty: beginner
  tags: [handler-interceptor, hooks]
  question: |
    Which HandlerInterceptor method can prevent the controller from being invoked by
    returning false?
  options:
  - "postHandle"
  - "preHandle"
  - "afterCompletion"
  - "handleRequest"
  answer: 1
  explanation: |
    preHandle runs before the handler; returning false stops the chain so the
    controller is not called. postHandle runs after the handler (before view
    render); afterCompletion runs after the full request.
  ref: "concepts.md#handlerinterceptor"

- id: aop-filters-interceptors-046
  difficulty: intermediate
  tags: [handler-interceptor, exception]
  question: |
    If a controller (handler) throws an exception, which HandlerInterceptor callbacks
    run?
  options:
  - "Only postHandle"
  - "None of them run"
  - "postHandle is skipped, but afterCompletion still runs (with the exception)"
  - "Only preHandle runs"
  answer: 2
  explanation: |
    When the handler throws, postHandle is skipped, but afterCompletion is still
    invoked and receives the Exception — making it the right place for cleanup that
    must always run.
  ref: "concepts.md#handlerinterceptor"

- id: aop-filters-interceptors-047
  difficulty: intermediate
  tags: [handler-interceptor, registration]
  question: |
    How do you register a HandlerInterceptor with URL include/exclude patterns?
  options:
  - "Add it to web.xml as a <filter>"
  - "Annotate it with @Component only"
  - "Register a FilterRegistrationBean"
  - "Implement WebMvcConfigurer and override addInterceptors, using addPathPatterns/excludePathPatterns"
  answer: 3
  explanation: |
    HandlerInterceptors are registered via WebMvcConfigurer.addInterceptors on the
    InterceptorRegistry, which supports addPathPatterns and excludePathPatterns.
    FilterRegistrationBean and web.xml <filter> are for servlet filters.
  ref: "concepts.md#handlerinterceptor"

- id: aop-filters-interceptors-048
  difficulty: advanced
  tags: [handler-interceptor, handler-method]
  question: |
    A key advantage of a HandlerInterceptor over a servlet Filter is that it can:
  options:
  - "Modify the raw byte stream of any servlet request"
  - "Run before the DispatcherServlet"
  - "Access the resolved handler (e.g. HandlerMethod) and inspect controller-method annotations, plus the ModelAndView"
  - "Advise non-web service beans"
  answer: 2
  explanation: |
    Because interceptors run inside the DispatcherServlet, they receive the resolved
    handler and can read its annotations and touch the ModelAndView. Filters run
    earlier and only see the raw request/response.
  ref: "concepts.md#handlerinterceptor"

- id: aop-filters-interceptors-049
  difficulty: beginner
  tags: [filter-vs-interceptor-vs-aspect, ordering]
  question: |
    For a single HTTP request, which component runs FIRST?
  options:
  - "The @Aspect around the controller"
  - "The servlet Filter"
  - "The HandlerInterceptor preHandle"
  - "The controller method"
  answer: 1
  explanation: |
    The servlet Filter runs at the container level, outermost — before the
    DispatcherServlet and therefore before the interceptor's preHandle, any aspect,
    and the controller.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-050
  difficulty: intermediate
  tags: [filter-vs-interceptor-vs-aspect, selection]
  question: |
    You need to add a CORS header and correlation ID (MDC) to EVERY request,
    including static resources, before any Spring MVC handling. Which mechanism fits
    best?
  options:
  - "A servlet Filter"
  - "A HandlerInterceptor"
  - "An @Aspect on the controller"
  - "An @Aspect on the service layer"
  answer: 0
  explanation: |
    A Filter operates at the container level across all requests (including static
    resources) before the DispatcherServlet, making it ideal for CORS, encoding,
    compression, and MDC/correlation-id setup.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-051
  difficulty: intermediate
  tags: [filter-vs-interceptor-vs-aspect, selection]
  question: |
    You want to measure execution time of specific SERVICE-layer methods, some of
    which are also invoked from a batch job (no HTTP). Which mechanism is most
    appropriate?
  options:
  - "A servlet Filter"
  - "A HandlerInterceptor"
  - "An @Aspect (Spring AOP) around the service methods"
  - "A @ControllerAdvice"
  answer: 2
  explanation: |
    Filters and interceptors are web-only. An @Aspect advises arbitrary Spring bean
    methods regardless of whether the call came from HTTP or a batch job, so it can
    time the service methods in both contexts.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-052
  difficulty: advanced
  tags: [filter-vs-interceptor-vs-aspect, scenario]
  question: |
    Which statement correctly distinguishes the three mechanisms?
  options:
  - "Filters, interceptors, and aspects all require a web request to function"
  - "Only aspects can short-circuit a request; filters and interceptors cannot"
  - "Interceptors run before filters because they are closer to the controller"
  - "Filters see the raw request/response, interceptors see the resolved handler/ModelAndView, and aspects operate on bean method calls (including non-web beans)"
  answer: 3
  explanation: |
    Each sits at a different layer: Filter (container, raw request), Interceptor
    (MVC, resolved handler + ModelAndView), Aspect (any bean method). Filters and
    interceptors can also short-circuit; and filters run before interceptors.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-053
  difficulty: intermediate
  tags: [filter-vs-interceptor-vs-aspect, spring-security]
  question: |
    Spring Security's request-level enforcement is primarily implemented as which of
    the following?
  options:
  - "A chain of HandlerInterceptors"
  - "A servlet Filter chain (FilterChainProxy)"
  - "A set of @Around aspects on controllers"
  - "A BeanPostProcessor"
  answer: 1
  explanation: |
    Spring Security plugs into the servlet container as a filter chain
    (FilterChainProxy / DelegatingFilterProxy), so it can intercept every request
    before it reaches the DispatcherServlet. (Method security like @PreAuthorize is
    AOP-based, but request-level security is filter-based.)
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-054
  difficulty: advanced
  tags: [advice-types, around, exception]
  question: |
    An @Around advice calls proceed() but the target throws a RuntimeException. The
    advice catches it and returns a default value without rethrowing. What is the
    observable effect on the caller and on @AfterThrowing advice for the same method?
  options:
  - "The caller sees the exception; @AfterThrowing fires"
  - "The caller receives null and @AfterThrowing fires"
  - "A compilation error results"
  - "The caller receives the default value; @AfterThrowing does NOT fire because the exception was swallowed"
  answer: 3
  explanation: |
    Because the @Around swallowed the exception and returned normally, the caller
    sees the default value and, from the framework's view, the join point completed
    normally — so @AfterThrowing does not fire (and @AfterReturning would). This is
    why swallowing exceptions in @Around is risky.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-055
  difficulty: advanced
  tags: [jdk-cglib, proxy-target-class]
  question: |
    What does @EnableAspectJAutoProxy(proxyTargetClass = true) do?
  options:
  - "Disables AOP entirely"
  - "Forces CGLIB (class-based) proxies even when the target implements interfaces"
  - "Forces JDK dynamic proxies for all beans"
  - "Enables AspectJ load-time weaving"
  answer: 1
  explanation: |
    proxyTargetClass=true forces CGLIB subclass proxies regardless of whether the
    target implements interfaces. This is the Spring Boot default and avoids
    concrete-type injection issues.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-056
  difficulty: beginner
  tags: [terminology, aspect]
  question: |
    In Spring, an aspect is most concretely represented by:
  options:
  - "Any class annotated with @Component"
  - "An interface extending Advisor"
  - "A method annotated with @Bean"
  - "A class annotated with @Aspect (and registered as a bean)"
  answer: 3
  explanation: |
    An aspect is the module bundling pointcut(s) and advice. In Spring it is a class
    annotated with @Aspect that is also a managed bean. @Component alone does not
    make a class an aspect.
  ref: "concepts.md#aop-core-concepts-and-terminology"

- id: aop-filters-interceptors-057
  difficulty: intermediate
  tags: [handler-interceptor, async]
  question: |
    Regarding postHandle in a HandlerInterceptor, which statement is TRUE?
  options:
  - "It runs after the handler returns (before view rendering) and is skipped when the handler throws"
  - "It always runs even if the handler throws an exception"
  - "It runs before preHandle"
  - "It runs at the servlet container level before the DispatcherServlet"
  answer: 0
  explanation: |
    postHandle runs after a successful handler execution but before view rendering,
    giving access to the ModelAndView. If the handler throws, postHandle is skipped
    (afterCompletion still runs).
  ref: "concepts.md#handlerinterceptor"

- id: aop-filters-interceptors-058
  difficulty: expert
  tags: [advice-types, around, proceed]
  question: |
    An @Around advice wants to sanitize a String argument before the target runs. Which
    call correctly re-invokes the target with modified arguments, and what happens if
    the array's types don't match the method signature?
  options:
  - "pjp.proceed(Object[]) replaces the arguments; a length/type mismatch triggers an IllegalArgumentException from the reflective invocation"
  - "pjp.proceed() re-reads mutated fields automatically; a type mismatch is silently ignored"
  - "pjp.proceedWith(args) is the only supported API; a mismatch is a compile error"
  - "You must call joinPoint.setArgs(); ProceedingJoinPoint has no way to change arguments"
  answer: 0
  explanation: |
    ProceedingJoinPoint.proceed(Object[]) invokes the target with a substituted argument
    array — the mechanism for argument-massaging aspects. The no-arg proceed() reuses the
    original arguments (it does NOT pick up mutated locals). If the array length or element
    types don't line up with the target signature, the underlying reflective call throws
    IllegalArgumentException at runtime.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-059
  difficulty: expert
  tags: [advice-types, around, retry, side-effects]
  question: |
    A retry aspect calls pjp.proceed() up to 3 times in a loop until it succeeds. Two other
    aspects (an auditing @Before and a metrics @Around) also advise the same method, all in
    the same interceptor chain, with the retry aspect outermost. On a call that fails twice
    then succeeds, how many times does the auditing @Before fire?
  options:
  - "Three times — each proceed() re-drives the remainder of the interceptor chain, including the inner @Before, on every attempt"
  - "Once — @Before is bound to the outermost invocation only"
  - "Zero times — retrying disables lower-precedence advice"
  - "Twice — only the failed attempts trigger it"
  answer: 0
  explanation: |
    Each proceed() call re-executes the REST of the interceptor chain and the target. Since
    the retry aspect is outermost, every one of its 3 proceed() calls drives the inner
    metrics @Around and the auditing @Before again. So the @Before fires 3 times. This is
    exactly why calling proceed() multiple times is a correctness hazard when inner advice
    has side effects (duplicate audit rows, inflated metrics).
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-060
  difficulty: advanced
  tags: [advice-types, join-point, proceeding-join-point]
  question: |
    A developer declares a ProceedingJoinPoint parameter on an @AfterReturning advice method.
    What happens?
  options:
  - "It works; proceed() simply returns the already-computed value"
  - "It compiles and runs but proceed() returns null"
  - "The application fails because ProceedingJoinPoint is only valid for @Around advice"
  - "Spring downgrades the advice to @Around automatically"
  answer: 2
  explanation: |
    ProceedingJoinPoint (a subtype of JoinPoint that adds proceed()) is only meaningful for
    @Around, which controls target invocation. Declaring it on any other advice type is an
    illegal configuration; Spring rejects it (IllegalArgumentException) because there is no
    target to 'proceed' into from a non-around advice.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-061
  difficulty: expert
  tags: [advice-types, ordering, around, after]
  question: |
    For a single aspect where the target THROWS an exception, in what order do @Around
    (post-proceed catch), @AfterThrowing, and @After execute, per modern (5.2.7+) AspectJ
    precedence?
  options:
  - "@AfterThrowing runs, then @After (finally), then control returns to @Around's catch/rethrow path"
  - "@After runs first, then @AfterThrowing, then @Around"
  - "@Around swallows everything so neither @AfterThrowing nor @After runs"
  - "@AfterThrowing and @After never run when an exception propagates"
  answer: 0
  explanation: |
    @Around is outermost. Inside its proceed(), the target throws; the inner advices unwind
    as: @AfterThrowing (exception-path advice) then @After (finally-style, always runs),
    then the exception propagates back out to @Around's proceed() call site, where its
    try/finally or rethrow handling runs. @After follows AspectJ 'after finally' semantics,
    running after @AfterThrowing.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-062
  difficulty: advanced
  tags: [advice-types, around, exception, return-type]
  question: |
    An @Around advice on a method returning a primitive int does: `Object r = pjp.proceed();
    return null;`. What does the caller observe?
  options:
  - "A NullPointerException when Spring unboxes null into the int return type"
  - "The caller receives 0 (the int default)"
  - "The original int value, because Spring ignores the returned null"
  - "A ClassCastException at proxy creation time"
  answer: 0
  explanation: |
    The advice returns null for a method whose declared return type is the primitive int.
    When the proxy hands that null back, unboxing null to int throws NullPointerException.
    This is a sharper variant of the 'forgot to return proceed()' bug: for reference types
    you'd silently get null, but for primitives it blows up at the unboxing boundary.
  ref: "concepts.md#advice-types"

- id: aop-filters-interceptors-063
  difficulty: expert
  tags: [aspect-and-enabling-aop, proxy-creation, post-construct]
  question: |
    A @Service has an @Around aspect matching all its methods. In its own @PostConstruct
    method the bean calls one of those advised public methods. Does the advice fire, and why?
  options:
  - "No — auto-proxying wraps the bean in postProcessAfterInitialization, which runs AFTER @PostConstruct, and the @PostConstruct call uses 'this' (the raw target) anyway"
  - "Yes — @PostConstruct runs after proxying, so the call goes through the proxy"
  - "Yes — @PostConstruct is special-cased to always route through the proxy"
  - "No — @PostConstruct methods can never be advised even from another bean"
  answer: 0
  explanation: |
    The auto-proxy creator wraps the bean in postProcessAfterInitialization, which runs
    after initialization callbacks like @PostConstruct. During @PostConstruct the proxy does
    not yet exist for the container to hand out, and the internal call is on 'this' (the raw
    target) regardless — so no advice fires. This is both a lifecycle-timing and a
    self-invocation issue.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-064
  difficulty: expert
  tags: [aspect-and-enabling-aop, bean-post-processor, not-eligible]
  question: |
    In the logs you see: "Bean 'auditService' of type [..] is not eligible for getting
    processed by all BeanPostProcessors (for example: not eligible for auto-proxying)." Your
    @Transactional on auditService silently does nothing. What is the most likely root cause?
  options:
  - "auditService (or something it is injected into) is required during the creation of a BeanPostProcessor, so it is instantiated before the auto-proxy creator can process it, and ends up un-proxied"
  - "auditService is a prototype-scoped bean, which cannot be proxied"
  - "@Transactional was placed on an interface instead of a class"
  - "The transaction manager bean is missing"
  answer: 0
  explanation: |
    That message means the bean was created early — typically because it is a dependency of a
    BeanPostProcessor (or of its dependencies) and thus instantiated before the auto-proxy
    creator (itself a BPP) is ready to wrap it. The bean is used un-proxied, so proxy-based
    advice like @Transactional silently no-ops. Common fix: break the early dependency, or
    mark it @Lazy.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-065
  difficulty: advanced
  tags: [aspect-and-enabling-aop, circular-references, spring-boot]
  question: |
    Two singleton beans reference each other; one is advised by an aspect. On Spring Boot
    2.6+ with default settings, what is the likely startup behavior?
  options:
  - "Startup fails fast, because Boot 2.6+ defaults spring.main.allow-circular-references to false"
  - "It always works because Spring resolves circular references transparently for proxies"
  - "The advised bean is silently replaced by its raw target"
  - "Spring switches both beans to prototype scope automatically"
  answer: 0
  explanation: |
    Circular singleton references combined with proxying are fragile (early-reference vs
    final proxy mismatch can raise BeanCurrentlyInCreationException). Spring Boot 2.6+
    disabled circular references by default (allow-circular-references=false), so such graphs
    fail fast at startup rather than risking an incorrectly- or un-proxied bean. The proper
    fix is to redesign the cycle.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-066
  difficulty: expert
  tags: [jdk-cglib, constructor, objenesis]
  question: |
    With CGLIB proxying, a service class runs important initialization logic in its
    constructor. A teammate insists "the constructor runs twice because CGLIB subclasses the
    target." What is the accurate statement per the Spring reference?
  options:
  - "The constructor always runs exactly twice with CGLIB; that is by design"
  - "CGLIB never runs the constructor at all, so any constructor logic is skipped permanently"
  - "The proxy instance is created via Objenesis, which bypasses the constructor, so it is NOT called twice — unless the JVM disallows constructor bypassing, in which case you may see double invocations plus debug log entries"
  - "The constructor runs twice only for JDK proxies, never CGLIB"
  answer: 2
  explanation: |
    Spring instantiates the CGLIB proxy subclass via Objenesis, bypassing the constructor, so
    it is not invoked a second time on the proxy. Only if the JVM cannot bypass constructors
    does the fallback path run the constructor again (with debug logs). Regardless,
    constructor side effects in proxied beans are a code smell.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-067
  difficulty: advanced
  tags: [jdk-cglib, final-method, silent]
  question: |
    A CGLIB-proxied bean has one public method marked `final` that a pointcut matches. At
    runtime, what happens when that method is called through the proxy?
  options:
  - "Spring throws a BeanCreationException at startup because the method is final"
  - "The advice fires normally; final has no effect on CGLIB"
  - "The method runs UN-advised and silently — CGLIB cannot override a final method, and there is no startup error"
  - "The whole bean falls back to a JDK proxy"
  answer: 2
  explanation: |
    CGLIB advises by subclassing and overriding; a final method cannot be overridden, so the
    proxy inherits and calls the target's implementation directly — no advice. Crucially there
    is NO startup error or warning, making it a quiet correctness trap. private and static
    methods behave the same way.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-068
  difficulty: advanced
  tags: [jdk-cglib, spring-core, packaging]
  question: |
    Which statement about how Spring ships CGLIB is correct?
  options:
  - "You must add a separate net.sf.cglib dependency to your build"
  - "CGLIB is only available if you add spring-boot-starter-aop"
  - "CGLIB is repackaged into spring-core under org.springframework.cglib, so no separate dependency is needed"
  - "Spring uses ByteBuddy, not CGLIB, since Spring 5"
  answer: 2
  explanation: |
    Since Spring 3.2, CGLIB (and Objenesis) are repackaged into spring-core under the
    org.springframework.cglib.* namespace, so applications don't declare a separate CGLIB
    dependency. spring-boot-starter-aop pulls in AspectJ annotation support, not CGLIB itself.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-069
  difficulty: expert
  tags: [jdk-cglib, field-init, constructor-bypass]
  question: |
    With CGLIB + Objenesis constructor bypassing, why can a field initializer or constructor-
    set field appear "null" or default when accessed via the proxy in certain designs?
  options:
  - "Because the proxy subclass instance is created without running the constructor, so subclass-level field initialization tied to construction does not execute on the proxy instance"
  - "Because CGLIB copies only static fields to the proxy"
  - "Because proxies always deep-clone the target and lose references"
  - "Because Objenesis nulls all fields intentionally for security"
  answer: 0
  explanation: |
    Objenesis creates the proxy instance without invoking the constructor. The proxy normally
    delegates method calls to the real target (which WAS constructed), but designs that rely on
    state initialized directly on the proxy subclass instance (e.g. via construction) can
    observe uninitialized values. The practical lesson: don't depend on constructor/field-init
    side effects in proxied beans.
  ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

- id: aop-filters-interceptors-070
  difficulty: advanced
  tags: [pointcut-expressions, args, binding]
  question: |
    Given `@Before("execution(* com.app..*(..)) && args(id,..)") void log(Long id)`, which
    calls will the advice match?
  options:
  - "All methods in com.app.., regardless of their first argument"
  - "Only methods that take exactly one argument named id"
  - "Only methods whose FIRST argument is assignable to Long (a runtime instanceof-style check), binding that argument to 'id'"
  - "No methods, because args cannot bind primitives-wrapper types"
  answer: 2
  explanation: |
    args(id,..) binds the first argument to the advice parameter 'id' and, because id is
    declared Long, imposes a runtime type filter: the join point matches only when the first
    actual argument is a Long. The '..' allows any number of additional arguments. This is a
    runtime-evaluated pointcut, unlike purely static execution matching.
  ref: "concepts.md#argument-return-and-annotation-binding-in-pointcuts"

- id: aop-filters-interceptors-071
  difficulty: expert
  tags: [pointcut-expressions, arg-names, parameter-names]
  question: |
    An aspect that binds arguments by name (e.g. args(userId)) works in one build but fails
    with "IllegalArgumentException: ... requires argNames" in another. What is the most
    likely cause and fix?
  options:
  - "The pointcut is invalid; rewrite it with execution only"
  - "The bean must be marked @Primary"
  - "Parameter name information was not retained in the bytecode (no -parameters / debug info), so Spring cannot map the bound name; supply the argNames attribute or compile with -parameters"
  - "You must switch from CGLIB to JDK proxies"
  answer: 2
  explanation: |
    Name-based binding relies on parameter names being present in bytecode. Some
    compilers/optimizers strip them, so Spring can't correlate the pointcut binding to the
    advice parameter. Either compile with -parameters (or keep debug info) or explicitly set
    the argNames attribute on the advice annotation. Classic 'works on my machine' trap.
  ref: "concepts.md#argument-return-and-annotation-binding-in-pointcuts"

- id: aop-filters-interceptors-072
  difficulty: advanced
  tags: [pointcut-expressions, annotation-binding]
  question: |
    You want a custom aspect to read attributes of the annotation that triggered it, e.g. a
    @RateLimited(permits=5). Which advice signature gives you the annotation instance?
  options:
  - "@Around(\"@annotation(rl)\") Object advise(ProceedingJoinPoint pjp, RateLimited rl)"
  - "@Around(\"execution(* *(..))\") Object advise(ProceedingJoinPoint pjp) then reflectively re-find the annotation only"
  - "@Before(\"@within(RateLimited)\") void advise(RateLimited rl)"
  - "Annotation attributes cannot be bound; you must hardcode them"
  answer: 0
  explanation: |
    Binding the annotation by name in @annotation(rl) and declaring a matching parameter of
    that annotation type hands you the actual annotation instance, so you can read
    rl.permits(). @within binds on the annotated type, not the method's own annotation, and
    wouldn't give per-method attributes here.
  ref: "concepts.md#argument-return-and-annotation-binding-in-pointcuts"

- id: aop-filters-interceptors-073
  difficulty: expert
  tags: [pointcut-expressions, runtime-vs-static]
  question: |
    Which set of pointcut designators may require PER-INVOCATION (runtime) evaluation rather
    than being fully resolved at proxy-creation time?
  options:
  - "execution, within, @within, @annotation"
  - "bean, within, execution"
  - "args, this, target (when they test or bind a subtype)"
  - "None — all pointcuts are evaluated once at startup"
  answer: 2
  explanation: |
    execution/within/@within/@annotation are matched statically when the proxy is built.
    args, this, and target can depend on the runtime types of the arguments/objects, so the
    same join point may match on one call and not another, incurring a small per-call check.
    Knowing which designators are dynamic is a senior-level distinction.
  ref: "concepts.md#argument-return-and-annotation-binding-in-pointcuts"

- id: aop-filters-interceptors-074
  difficulty: advanced
  tags: [self-invocation, self-injection, transactional]
  question: |
    A bean self-injects itself (`@Autowired private FooService self;`) and calls
    `self.inner()` from `outer()` to make @Transactional(REQUIRES_NEW) on inner() take effect.
    Why does this work where `this.inner()` did not?
  options:
  - "Because self is a second instance of the bean with its own transaction"
  - "Because @Autowired disables the self-invocation limitation globally"
  - "Because 'self' holds the PROXY reference, so the call to inner() crosses the proxy boundary and the transaction advice is applied"
  - "It does not actually work; self-injection is prohibited by Spring"
  answer: 2
  explanation: |
    Spring injects the PROXY (not the raw target) into the self field. Calling self.inner()
    therefore routes through the proxy, applying the transactional advice, including
    REQUIRES_NEW. this.inner() bypasses the proxy. Self-injection of a singleton gives the
    same single proxy instance, not a new bean.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-075
  difficulty: expert
  tags: [self-invocation, aop-context, expose-proxy]
  question: |
    A team uses `((FooService) AopContext.currentProxy()).inner()` but gets
    IllegalStateException: "Cannot find current proxy: Set 'exposeProxy' property on
    Advised to 'true'". They are on Spring Boot. What is the correct remedy?
  options:
  - "Add @EnableAspectJAutoProxy(exposeProxy = true) (or set the equivalent property) so the proxy is bound to the thread-local for currentProxy() to return"
  - "Switch every method to static so AopContext can resolve them"
  - "Downgrade to JDK dynamic proxies"
  - "Call AopContext.currentProxy() only from a @PostConstruct method"
  answer: 0
  explanation: |
    AopContext.currentProxy() reads a ThreadLocal that is only populated when the proxy is
    exposed. You must enable exposeProxy=true (via @EnableAspectJAutoProxy(exposeProxy=true)
    or the transaction/AOP config equivalent). Without it, currentProxy() throws
    IllegalStateException. It works but couples code to Spring AOP internals.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-076
  difficulty: advanced
  tags: [self-invocation, async, threading]
  question: |
    An @Async method inner() is called via this.inner() from outer() in the same bean. What
    is the observable effect?
  options:
  - "inner() runs on a separate thread as intended"
  - "inner() runs twice — once sync, once async"
  - "The application throws AsyncUncaughtException"
  - "inner() runs SYNCHRONOUSLY on the caller's thread, because the self-call bypasses the proxy that would have dispatched it to the task executor"
  answer: 3
  explanation: |
    @Async is proxy-based advice. A this.inner() self-invocation bypasses the proxy, so the
    async dispatch to the TaskExecutor never happens and inner() executes synchronously on the
    calling thread — a very common 'my @Async isn't asynchronous' bug. Same root cause as the
    @Transactional self-invocation trap.
  ref: "concepts.md#self-invocation-limitation"

- id: aop-filters-interceptors-077
  difficulty: intermediate
  tags: [servlet-filter, registration, double-registration]
  question: |
    You annotate a Filter with @Component AND also expose it through a FilterRegistrationBean
    to set its URL pattern. What is the likely result in Spring Boot?
  options:
  - "The filter is registered once with the URL pattern applied"
  - "Only the @Component registration wins and the URL pattern is ignored"
  - "Spring throws a duplicate-bean exception at startup"
  - "The filter is registered TWICE (auto-detected as a bean plus the explicit registration), so it runs twice unless you disable one"
  answer: 3
  explanation: |
    Boot auto-registers Filter beans, and the FilterRegistrationBean registers it again — so
    it can execute twice. Fixes: drop @Component and let only the FilterRegistrationBean
    manage it, or set the auto-detected registration's enabled=false. A frequent
    double-logging / double-auth bug.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-078
  difficulty: expert
  tags: [servlet-filter, ordering, spring-security]
  question: |
    You need a custom filter to run BEFORE the Spring Security filter chain. What must you know
    about ordering?
  options:
  - "Security always runs last, so any positive order works"
  - "You must annotate the filter @Order(0), which is guaranteed to precede security"
  - "Filter order cannot be set relative to Spring Security"
  - "The security chain is registered around order -100 (SecurityProperties.DEFAULT_FILTER_ORDER), so your filter must use an order LOWER than -100 to run before it"
  answer: 3
  explanation: |
    Spring Security registers its FilterChainProxy at SecurityProperties.DEFAULT_FILTER_ORDER
    (-100). Ordering is global across all filters, so to run before security your filter needs
    an order value below -100; to run after, above -100. Ordering only relative to your own
    filters ignores where security sits.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-079
  difficulty: expert
  tags: [servlet-filter, threadlocal, concurrency, leak]
  question: |
    A filter sets a correlation ID into a ThreadLocal (or MDC) in its pre-phase but only clears
    it AFTER chain.doFilter returns normally (not in a finally). What production bug can result?
  options:
  - "Nothing; the container creates a fresh thread per request so no leak is possible"
  - "The ThreadLocal is automatically garbage-collected at request end"
  - "The filter will refuse to run concurrently"
  - "If a downstream exception propagates, the clear is skipped, so the ThreadLocal survives on the pooled request thread and bleeds into the NEXT request served by that thread"
  answer: 3
  explanation: |
    Servlet containers reuse threads from a pool. A ThreadLocal/MDC value not cleared in a
    finally block survives an exception and remains bound to the pooled thread, contaminating
    the next request assigned to it (leaking correlation IDs, security context, tenant data).
    Always clear ThreadLocals in finally.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-080
  difficulty: advanced
  tags: [servlet-filter, response-committed]
  question: |
    A filter calls chain.doFilter, and after it returns it tries to add a response header. The
    header never reaches the client. Why?
  options:
  - "Filters are not allowed to set headers"
  - "The header was set on the request, not the response"
  - "Headers can only be set in a HandlerInterceptor"
  - "The response was already COMMITTED (flushed) during downstream processing, so post-chain header/status changes are ignored"
  answer: 3
  explanation: |
    Once the response is committed (status line and headers flushed), you cannot change status
    or headers. For controllers writing bodies (@ResponseBody/streaming) the response often
    commits during handling. To modify the body/headers after the fact, wrap with a buffering
    wrapper like ContentCachingResponseWrapper and copy the body back before commit.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-081
  difficulty: expert
  tags: [servlet-filter, content-caching, wrapper]
  question: |
    You wrap the response in ContentCachingResponseWrapper to log the response body. Logging
    works but the CLIENT receives an empty body. What did you forget?
  options:
  - "To call response.flushBuffer() before wrapping"
  - "To disable OncePerRequestFilter"
  - "To register the wrapper as a @Bean"
  - "To call wrapper.copyBodyToResponse() so the cached bytes are actually written to the underlying response"
  answer: 3
  explanation: |
    ContentCachingResponseWrapper buffers the body so you can read it, but it does NOT
    automatically flush the buffered bytes to the real response. You must call
    copyBodyToResponse() (typically in a finally after chain.doFilter) or the client gets an
    empty body. A very common request/response-logging filter bug.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-082
  difficulty: advanced
  tags: [servlet-filter, dispatcher-types, async]
  question: |
    By default, for which dispatcher type(s) is a servlet filter invoked, and how do you make
    it also run on ASYNC or ERROR dispatches?
  options:
  - "It runs for all dispatcher types automatically; nothing to configure"
  - "Dispatcher types are a HandlerInterceptor concept, not a filter one"
  - "It runs for ASYNC only; you must opt into REQUEST"
  - "It runs for REQUEST only by default; call setDispatcherTypes(...) (e.g. on the FilterRegistrationBean) to include ASYNC/ERROR/FORWARD/INCLUDE"
  answer: 3
  explanation: |
    Filters default to the REQUEST dispatcher type. To participate in async re-dispatch, error
    dispatch, forwards, or includes, you configure the dispatcher types explicitly (e.g.
    FilterRegistrationBean.setDispatcherTypes). OncePerRequestFilter additionally prevents
    re-execution within a single dispatch cycle.
  ref: "concepts.md#filters-registration-ordering-and-concurrency"

- id: aop-filters-interceptors-083
  difficulty: expert
  tags: [handler-interceptor, response-body, post-handle]
  question: |
    A HandlerInterceptor tries to add a custom header in postHandle for a @RestController
    method returning a ResponseEntity. The header never appears. What is the correct
    explanation and remedy?
  options:
  - "postHandle doesn't run for controllers; use preHandle and set the header there speculatively"
  - "You must return ModelAndView from the controller for postHandle to work"
  - "Headers can only be added by servlet filters, never controllers or advice"
  - "For @ResponseBody/ResponseEntity, the response is written and COMMITTED inside the HandlerAdapter before postHandle runs, so it's too late; use a ResponseBodyAdvice (@ControllerAdvice) or a servlet Filter"
  answer: 3
  explanation: |
    Per the Spring reference, for @ResponseBody and ResponseEntity handlers the response body
    is written and committed within the HandlerAdapter before postHandle is called, so
    header/body changes there are too late. The documented alternative is ResponseBodyAdvice
    declared as a controller-advice bean (or a Filter that wraps the response).
  ref: "concepts.md#interceptors-async-ordering-and-the-posthandle-trap"

- id: aop-filters-interceptors-084
  difficulty: expert
  tags: [handler-interceptor, async, afterConcurrentHandlingStarted]
  question: |
    A controller returns a DeferredResult. Which interceptor callback sequence is correct for
    the initial request thread and the later async re-dispatch?
  options:
  - "preHandle -> postHandle -> afterCompletion once, synchronously"
  - "Interceptors are skipped entirely for async handlers"
  - "afterCompletion runs first, then preHandle on the second thread"
  - "On the initial dispatch: preHandle then afterConcurrentHandlingStarted (instead of postHandle/afterCompletion); when the result is ready the request is re-dispatched and preHandle -> postHandle -> afterCompletion run again"
  answer: 3
  explanation: |
    For async handlers (Callable/DeferredResult), Spring uses AsyncHandlerInterceptor: after
    preHandle it calls afterConcurrentHandlingStarted and releases the request thread (skipping
    postHandle/afterCompletion on that first pass). When the async result completes, the request
    is dispatched again and the normal preHandle/postHandle/afterCompletion cycle runs. Timing
    logic must handle both phases.
  ref: "concepts.md#interceptors-async-ordering-and-the-posthandle-trap"

- id: aop-filters-interceptors-085
  difficulty: expert
  tags: [handler-interceptor, ordering, afterCompletion]
  question: |
    Three interceptors A, B, C are registered in that order. B.preHandle returns false. Which
    afterCompletion callbacks run, and in what order?
  options:
  - "A, B, C afterCompletion, in registration order"
  - "Only C.afterCompletion runs"
  - "None run because the chain was short-circuited"
  - "Only A.afterCompletion runs (interceptors whose preHandle already returned true unwind in REVERSE order); B and C do not, since B stopped the chain and C.preHandle never ran"
  answer: 3
  explanation: |
    afterCompletion is invoked only for interceptors whose preHandle already returned true, and
    it runs in reverse registration order. A.preHandle returned true; B.preHandle returned false
    (stopping the chain) so C.preHandle never ran. Thus only A.afterCompletion executes. Note B's
    own afterCompletion does not run because its preHandle returned false.
  ref: "concepts.md#interceptors-async-ordering-and-the-posthandle-trap"

- id: aop-filters-interceptors-086
  difficulty: advanced
  tags: [handler-interceptor, post-handle, model-and-view]
  question: |
    For a @RestController method (returning a serialized object, not a view name), what is the
    ModelAndView argument passed to a HandlerInterceptor's postHandle?
  options:
  - "A populated ModelAndView containing the serialized object"
  - "An empty but non-null ModelAndView you can add attributes to and have them rendered"
  - "A ModelAndView whose view name equals the controller method name"
  - "null — there is no view or model for @ResponseBody/REST responses"
  answer: 3
  explanation: |
    REST/@ResponseBody handlers write the body directly and do not produce a view or model, so
    the ModelAndView passed to postHandle is null. Attempting to add model attributes there has
    no effect. This is distinct from view-based (template) handlers, where a ModelAndView is
    available (though even then the body may be committed for streaming cases).
  ref: "concepts.md#interceptors-async-ordering-and-the-posthandle-trap"

- id: aop-filters-interceptors-087
  difficulty: advanced
  tags: [handler-interceptor, security, path-matching]
  question: |
    The Spring reference cautions against using HandlerInterceptors as a security layer.
    What is the underlying reason?
  options:
  - "Interceptors run too late, after the response is committed"
  - "Interceptor path matching can MISMATCH the annotated-controller path matching, potentially leaving routes unprotected; Spring Security (filter-based) is recommended for authz"
  - "Interceptors cannot read request headers"
  - "Interceptors run on a different thread than the controller"
  answer: 1
  explanation: |
    The path patterns used to register an interceptor may not exactly correspond to how the
    DispatcherServlet maps annotated controllers, creating gaps where an interceptor-based check
    is bypassed. The reference therefore steers security to Spring Security's filter chain,
    which enforces before the DispatcherServlet with consistent matching.
  ref: "concepts.md#interceptors-async-ordering-and-the-posthandle-trap"

- id: aop-filters-interceptors-088
  difficulty: expert
  tags: [transactionaop-interaction-edge-cases, ordering, caching]
  question: |
    A caching aspect and the @Transactional advice both apply to a repository method. You want
    cache HITS to avoid opening a database transaction entirely. How should the two be ordered?
  options:
  - "The caching aspect must run OUTSIDE (higher precedence / lower order value than) the transaction advice, so a cache hit returns before the tx advice's proceed() opens a transaction"
  - "The transaction advice must be outermost so it can cache the connection"
  - "Ordering is irrelevant; caching always skips transactions"
  - "You must merge them into a single aspect"
  answer: 0
  explanation: |
    Advice nest like layers. If caching is outermost, a cache hit short-circuits and returns
    without ever calling proceed() into the transaction advice, so no transaction opens. If
    caching is inside the tx advice, the transaction begins first even for hits. @Transactional
    defaults to LOWEST_PRECEDENCE, so a custom caching aspect with a lower order sits outside it.
  ref: "concepts.md#transaction-aop-interaction-edge-cases"

- id: aop-filters-interceptors-089
  difficulty: advanced
  tags: [transactionaop-interaction-edge-cases, rollback, checked-exception]
  question: |
    A @Transactional service method throws a checked IOException (not annotated with
    rollbackFor). What happens to the transaction by default?
  options:
  - "It rolls back, because any exception rolls back a transaction"
  - "It COMMITS, because Spring's default rollback rule only triggers on RuntimeException and Error, not checked exceptions"
  - "It stays open until timeout"
  - "It throws a TransactionSystemException instead of IOException"
  answer: 1
  explanation: |
    Spring's proxy transaction advice rolls back on unchecked exceptions (RuntimeException,
    Error) by default; checked exceptions COMMIT unless you declare rollbackFor. This is a
    property of the advice's exception handling, not of the database, and surprises many
    developers who assume 'any exception rolls back'.
  ref: "concepts.md#transaction-aop-interaction-edge-cases"

- id: aop-filters-interceptors-090
  difficulty: advanced
  tags: [transactionaop-interaction-edge-cases, visibility, cglib]
  question: |
    @Transactional is placed on a protected method of a CGLIB-proxied service. What is the
    effect?
  options:
  - "A startup error because @Transactional requires public methods"
  - "It works fully; CGLIB advises protected methods like public ones with no caveats"
  - "By default @Transactional on non-public (protected/package-private/private) methods is IGNORED — the method runs non-transactionally with no error"
  - "It forces the bean to use a JDK proxy"
  answer: 2
  explanation: |
    The default Spring transaction proxy only applies to public methods; @Transactional on
    protected/package-private/private methods is silently ignored (the call may not even go
    through the proxy). No exception is thrown, so the method quietly runs without a
    transaction — a subtle bug when a helper method's visibility is reduced.
  ref: "concepts.md#transaction-aop-interaction-edge-cases"

- id: aop-filters-interceptors-091
  difficulty: intermediate
  tags: [transactionaop-interaction-edge-cases, self-invocation, cacheable]
  question: |
    A @Cacheable method getById() is called from another method findAll() in the SAME bean via
    this.getById(). What is the caching behavior?
  options:
  - "Each internal getById() call goes through the cache normally"
  - "The internal this.getById() bypasses the proxy, so NO cache lookup/population occurs for those internal calls"
  - "Only the first internal call is cached, the rest are not"
  - "Spring throws a CacheException"
  answer: 1
  explanation: |
    @Cacheable is proxy-based, exactly like @Transactional. A this.getById() self-invocation
    skips the proxy, so the caching interceptor never runs for internal calls — no lookup, no
    population. This is the same self-invocation limitation and a common cause of 'my cache
    isn't being hit' confusion.
  ref: "concepts.md#transaction-aop-interaction-edge-cases"

- id: aop-filters-interceptors-092
  difficulty: expert
  tags: [aspect-ordering, transactional, order]
  question: |
    You add a custom @Around auditing aspect with no @Order and it appears to run INSIDE the
    transaction (audit rows roll back with the tx). You actually want it OUTSIDE the
    transaction. What explains the current behavior and how do you fix it?
  options:
  - "Aspects always run inside transactions; you cannot change it"
  - "@Transactional's advice defaults to LOWEST_PRECEDENCE, and an un-ordered aspect may not reliably sit outside it; assign your aspect an explicit lower order value so it becomes outermost (its work then happens outside the tx boundary)"
  - "You must annotate the aspect @Transactional(propagation=NOT_SUPPORTED)"
  - "Rename the aspect so it sorts before 'transaction' alphabetically"
  answer: 1
  explanation: |
    Transaction advice registers at Ordered.LOWEST_PRECEDENCE. Without an explicit @Order,
    relative ordering with your aspect is not guaranteed to place you outside the tx. Give your
    aspect a concrete lower order value so it becomes the outermost advice; its logic then runs
    before the transaction starts and after it commits — outside the rollback scope.
  ref: "concepts.md#aspect-ordering"

- id: aop-filters-interceptors-093
  difficulty: advanced
  tags: [aspect-ordering, ordered, precedence]
  question: |
    Which value represents the HIGHEST precedence (runs first inbound) for aspects/filters
    using Spring's Ordered convention?
  options:
  - "Integer.MAX_VALUE"
  - "0"
  - "Integer.MIN_VALUE (Ordered.HIGHEST_PRECEDENCE)"
  - "-1 always, by convention"
  answer: 2
  explanation: |
    Ordered.HIGHEST_PRECEDENCE is Integer.MIN_VALUE, and LOWEST_PRECEDENCE is Integer.MAX_VALUE.
    Lower numeric value = higher precedence = runs first on the way in (and last on the way out).
    This counterintuitive 'lower wins' rule applies to aspects, filters, and interceptors alike.
  ref: "concepts.md#aspect-ordering"

- id: aop-filters-interceptors-094
  difficulty: expert
  tags: [spring-aop-vs-aspectj, ltw, self-invocation]
  question: |
    A team switches from Spring AOP to AspectJ LOAD-TIME weaving specifically so that
    self-invocations get intercepted. Which statement about this migration is accurate?
  options:
  - "LTW cannot intercept self-invocations either; only compile-time weaving can"
  - "LTW weaves the aspect into the target's bytecode (via a Java agent at class load), so internal this.method() calls ARE advised because there is no proxy to bypass"
  - "After enabling LTW you must still keep proxyTargetClass=true for it to work"
  - "LTW only works for interfaces, like JDK proxies"
  answer: 1
  explanation: |
    With weaving (compile- or load-time), the advice is woven directly into the class bytecode,
    so every call to the method — including internal self-invocations — hits the woven advice.
    There is no proxy indirection to bypass. That is precisely why LTW/CTW solves the
    self-invocation limitation that proxy-based Spring AOP cannot.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-095
  difficulty: advanced
  tags: [spring-aop-vs-aspectj, join-points, field]
  question: |
    You must run advice whenever a specific FIELD is written on a non-Spring, new-ed domain
    object. Which technology can do this?
  options:
  - "Spring AOP with a set() pointcut"
  - "A HandlerInterceptor"
  - "AspectJ (compile-time or load-time weaving) with a field-set join point — Spring AOP supports neither field join points nor non-Spring objects"
  - "A servlet Filter"
  answer: 2
  explanation: |
    Spring AOP only supports method-execution join points on Spring-managed beans. Field
    get/set join points and advising plain new-ed objects require full AspectJ weaving. Filters
    and interceptors are web-request concepts, entirely unrelated to field access.
  ref: "concepts.md#spring-aop-vs-aspectj"

- id: aop-filters-interceptors-096
  difficulty: expert
  tags: [proxy-creation-internals-and-failure-modes, async, return-type]
  question: |
    An @Async method is declared to return a plain (non-Future) String. What is the problem?
  options:
  - "Nothing; @Async supports any return type and blocks the caller until done"
  - "The caller cannot meaningfully receive a value computed on another thread synchronously, so @Async only supports void, Future/CompletableFuture, or reactive return types; a plain String return is unsupported/meaningless"
  - "Spring converts the String to a CompletableFuture automatically and it works fine"
  - "It works but the method runs synchronously"
  answer: 1
  explanation: |
    Because the method runs on a separate thread, the proxy has no synchronous value to hand
    back at call time. @Async therefore supports void (fire-and-forget), Future/
    CompletableFuture (deferred value), or reactive types. Returning a plain value is not
    supported semantics — you can't get an async result back synchronously.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-097
  difficulty: advanced
  tags: [proxy-creation-internals-and-failure-modes, async, exception]
  question: |
    A void-returning @Async method throws an exception. Where does it go by default?
  options:
  - "It propagates to the caller synchronously"
  - "It is swallowed unless you register an AsyncUncaughtExceptionHandler, because the caller already returned and there is no Future to carry the exception"
  - "It rolls back the surrounding transaction"
  - "It is rethrown on the next @Async call"
  answer: 1
  explanation: |
    For a void @Async method the caller has already moved on and there is no Future to hold the
    outcome, so an uncaught exception is effectively lost unless you provide an
    AsyncUncaughtExceptionHandler (via AsyncConfigurer). For Future/CompletableFuture returns the
    exception surfaces when the caller resolves the future.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-098
  difficulty: expert
  tags: [proxy-creation-internals-and-failure-modes, ultimate-target-class]
  question: |
    Inside advice you call joinPoint.getTarget().getClass() on a CGLIB-proxied bean and get a
    class name containing "$$SpringCGLIB$$" or "$$EnhancerBySpringCGLIB$$". You wanted the real
    user class. Which helper reliably returns it?
  options:
  - "target.getClass().getSuperclass() is always guaranteed correct"
  - "AopProxyUtils.ultimateTargetClass(bean) / AopUtils.getTargetClass(bean), which unwrap proxy layers to the real user class"
  - "There is no way to get the original class once proxied"
  - "Class.forName on the mangled name"
  answer: 1
  explanation: |
    CGLIB proxy classes have synthetic names, and there can even be nested proxies (scoped/lazy).
    AopProxyUtils.ultimateTargetClass and AopUtils.getTargetClass are the sanctioned helpers to
    resolve the actual target user class, correctly peeling proxy layers. getSuperclass works for
    a single CGLIB layer but is brittle with stacked proxies or JDK proxies.
  ref: "concepts.md#proxy-creation-internals-and-failure-modes"

- id: aop-filters-interceptors-099
  difficulty: intermediate
  tags: [filter-vs-handlerinterceptor-vs-aspect, order]
  question: |
    Order these for one successful HTTP request from OUTERMOST-first: (a) HandlerInterceptor
    preHandle, (b) servlet Filter pre, (c) @Around advice on the controller method.
  options:
  - "a, b, c"
  - "b (Filter) -> a (Interceptor preHandle) -> c (@Around around controller)"
  - "c, a, b"
  - "a, c, b"
  answer: 1
  explanation: |
    The servlet filter is outermost (container level, before DispatcherServlet). Inside the
    DispatcherServlet the interceptor's preHandle runs next, then the controller invocation is
    wrapped by any @Around AOP advice. On the way out the order reverses.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-100
  difficulty: expert
  tags: [filter-vs-handlerinterceptor-vs-aspect, exception-handling]
  question: |
    A controller throws an exception that is translated to a 500 by @ControllerAdvice
    (@ExceptionHandler). For that request, which components still get a chance to observe/act on
    the outcome?
  options:
  - "The interceptor's postHandle (it always runs) and the filter post-chain code"
  - "The interceptor's afterCompletion (receiving the Exception) and the filter's post-chain code around chain.doFilter; postHandle is SKIPPED because the handler threw"
  - "Only the @ControllerAdvice; filters and interceptors are bypassed on exceptions"
  - "Nothing runs after the exception; the thread is killed"
  answer: 1
  explanation: |
    When the handler throws, postHandle is skipped, but afterCompletion still runs and receives
    the exception, and the filter's code after chain.doFilter still executes as the call stack
    unwinds. The @ControllerAdvice resolves the exception to a response within the DispatcherServlet.
    afterCompletion and the filter's finally-style code are the reliable cleanup points.
  ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

- id: aop-filters-interceptors-101
  difficulty: expert
  tags: [advice-types, around, order, same-aspect]
  question: |
    Two @Around advices are declared in the SAME aspect class, both matching one method. In
    Spring 5.2.7+, what determines their relative execution order?
  options:
  - "@Order on each method sets it precisely"
  - "Their DECLARATION order in the source file is used as a tie-breaker (since 5.2.7 Spring uses declaration order within an aspect); @Order on individual advice methods is not honored"
  - "Reverse alphabetical method name"
  - "It is always undefined and random"
  answer: 1
  explanation: |
    @Order applies at the aspect (class) level, not to individual advice methods. Within a
    single aspect, Spring 5.2.7+ uses source declaration order to break ties between same-type
    advices on the same join point (earlier pre-5.2.7 it was undefined). For guaranteed ordering
    across concerns, split into separate aspects each with its own @Order.
  ref: "concepts.md#aspect-ordering"

