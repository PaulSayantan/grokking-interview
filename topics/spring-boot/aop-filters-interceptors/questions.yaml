topic: "AOP, Filters & Interceptors"
domain: spring-boot
topic_slug: aop-filters-interceptors
version: 1
questions:
  - id: aop-filters-interceptors-001
    difficulty: beginner
    tags: [terminology, join-point]
    question: |
      In Spring AOP, what does a "join point" always represent?
    options:
      - "A method execution"
      - "A field read or write"
      - "A constructor invocation"
      - "A static initializer block"
    answer: 0
    explanation: |
      Spring AOP is proxy-based and its only supported join point is a method
      execution. AspectJ (full weaving) additionally supports field access,
      constructor calls, static initializers, and more.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-002
    difficulty: beginner
    tags: [terminology, pointcut]
    question: |
      Which AOP term refers to the predicate/expression that selects WHICH join
      points an advice should apply to?
    options:
      - "Advice"
      - "Aspect"
      - "Weaving"
      - "Pointcut"
    answer: 3
    explanation: |
      A pointcut is the predicate (e.g. an execution expression) that matches
      join points. Advice is the action; the aspect bundles advice + pointcut;
      weaving links aspects to targets.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-003
    difficulty: beginner
    tags: [terminology, advice]
    question: |
      "The actual code that runs at a matched join point" describes which term?
    options:
      - "Pointcut"
      - "Introduction"
      - "Target"
      - "Advice"
    answer: 3
    explanation: |
      Advice is the action taken by an aspect at a join point — the code itself
      (@Before, @Around, etc.). The pointcut only selects where; advice is what
      runs.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-004
    difficulty: beginner
    tags: [terminology, weaving]
    question: |
      When is weaving performed in Spring AOP (as opposed to AspectJ)?
    options:
      - "At compile time by a special compiler"
      - "At class-load time via a Java agent"
      - "Never — Spring does not weave at all"
      - "At runtime, when the proxy is created"
    answer: 3
    explanation: |
      Spring AOP weaves at runtime by creating proxies during bean creation.
      AspectJ can weave at compile time (ajc) or at load time (LTW agent).
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-005
    difficulty: beginner
    tags: [terminology, target-proxy]
    question: |
      In proxy-based AOP, when client code calls a method on an advised bean,
      which object does it actually hold a reference to?
    options:
      - "The proxy that wraps the target"
      - "The raw target object"
      - "The BeanFactory"
      - "A new instance created per call"
    answer: 0
    explanation: |
      Callers hold the proxy. The proxy applies advice and then delegates to the
      real target object. This indirection is exactly why self-invocation (this.x())
      bypasses advice.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-006
    difficulty: intermediate
    tags: [terminology, introduction]
    question: |
      What does an AOP "introduction" allow you to do?
    options:
      - "Declare additional methods or make a bean implement a new interface"
      - "Run code only the first time a bean is created"
      - "Select join points using regular expressions"
      - "Reorder aspects at runtime"
    answer: 0
    explanation: |
      An introduction (inter-type declaration) adds new methods/fields or makes an
      advised object implement an additional interface — expanding the type, not
      just wrapping a method call.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-007
    difficulty: beginner
    tags: [advice-types]
    question: |
      Which advice type can PREVENT the target method from executing and can
      replace its return value?
    options:
      - "@Around"
      - "@AfterReturning"
      - "@Before"
      - "@After"
    answer: 0
    explanation: |
      Only @Around wraps the join point and controls whether/when proceed() is
      called, so it alone can skip the target and substitute a return value. The
      others cannot stop the call (except by throwing).
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-008
    difficulty: beginner
    tags: [advice-types]
    question: |
      Which advice runs after the join point completes regardless of whether it
      returned normally or threw an exception (a "finally"-style advice)?
    options:
      - "@AfterReturning"
      - "@AfterThrowing"
      - "@Before"
      - "@After"
    answer: 3
    explanation: |
      @After is the finally-style advice: it always runs after the method, on both
      success and exception. @AfterReturning runs only on normal return;
      @AfterThrowing only on exception.
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-009
    difficulty: intermediate
    tags: [advice-types, around]
    question: |
      A developer writes an @Around advice but forgets to return the value of
      pjp.proceed(). What happens?
    options:
      - "A compilation error occurs"
      - "The target runs, but callers receive null"
      - "The target method is never invoked"
      - "Spring automatically returns the target's value anyway"
    answer: 1
    explanation: |
      @Around must explicitly return the result of proceed(). If it runs proceed()
      but returns nothing (or returns null), the target still executes but the
      caller receives null, silently corrupting behavior.
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-010
    difficulty: intermediate
    tags: [advice-types, binding]
    question: |
      To capture the value returned by the target method inside an advice, which
      combination is correct?
    options:
      - "@Around with the 'returning' attribute"
      - "@AfterThrowing with the 'throwing' attribute"
      - "@Before with a JoinPoint.getReturnValue() call"
      - "@AfterReturning with the 'returning' attribute binding a parameter"
    answer: 3
    explanation: |
      @AfterReturning(pointcut=..., returning="result") binds the return value to a
      parameter. @Before runs before there is a return value; @AfterThrowing binds
      the thrown exception via 'throwing'.
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-011
    difficulty: advanced
    tags: [advice-types, ordering]
    question: |
      For a single aspect advising one method that returns normally, which order do
      the advices execute in (modern Spring / AspectJ precedence)?
    options:
      - "@Around(before proceed) -> @Before -> target -> @Around(after proceed) -> @After -> @AfterReturning"
      - "@Before -> @Around(before proceed) -> target -> @After -> @AfterReturning -> @Around(after)"
      - "@Around(before proceed) -> @Before -> target -> @AfterReturning -> @After -> @Around(after proceed)"
      - "target -> @Before -> @Around -> @After -> @AfterReturning"
    answer: 2
    explanation: |
      @Around is the highest-precedence (outermost) advice, so everything else runs
      inside its proceed() and its after-proceed code runs LAST:
      @Around(before proceed) -> @Before -> target -> @AfterReturning -> @After ->
      @Around(after proceed). Per AspectJ "after finally" semantics in modern Spring
      (5.2.7+), @After runs after @AfterReturning. (Pre-5.2.7 Spring ran @Around's
      after-code before @After, which was a bug.)
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-012
    difficulty: intermediate
    tags: [advice-types, proceeding-join-point]
    question: |
      Which parameter type is available ONLY to @Around advice (and lets it invoke
      the target)?
    options:
      - "JoinPoint"
      - "ProceedingJoinPoint"
      - "MethodInvocation"
      - "HandlerMethod"
    answer: 1
    explanation: |
      Only @Around receives a ProceedingJoinPoint, whose proceed() method invokes
      the underlying target. Other advice types may declare a plain JoinPoint but
      cannot proceed().
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-013
    difficulty: beginner
    tags: [aspect, enabling]
    question: |
      Besides annotating a class with @Aspect, what else is required for its advice
      to actually take effect in a plain (non-Boot) Spring application?
    options:
      - "Nothing — @Aspect alone is enough"
      - "The aspectjweaver Java agent must be attached"
      - "The class must extend AbstractAspect"
      - "The class must be a Spring bean AND AspectJ auto-proxying must be enabled"
    answer: 3
    explanation: |
      @Aspect only marks the class. It must also be a managed bean (e.g. @Component)
      and auto-proxying must be on (@EnableAspectJAutoProxy). No Java agent is needed
      for proxy-based Spring AOP.
    ref: "concepts.md#aspect-and-enabling-aop"

  - id: aop-filters-interceptors-014
    difficulty: intermediate
    tags: [aspect, spring-boot, enabling]
    question: |
      How does Spring Boot typically enable AspectJ auto-proxying?
    options:
      - "You must always add @EnableAspectJAutoProxy manually"
      - "It requires the aspectjrt jar and a -javaagent flag"
      - "It uses load-time weaving by default"
      - "AopAutoConfiguration enables it automatically when spring-boot-starter-aop is on the classpath"
    answer: 3
    explanation: |
      With spring-boot-starter-aop on the classpath, AopAutoConfiguration turns on
      AspectJ auto-proxying automatically, so you just add @Aspect @Component. No
      Java agent is used (Spring AOP is proxy-based).
    ref: "concepts.md#aspect-and-enabling-aop"

  - id: aop-filters-interceptors-015
    difficulty: advanced
    tags: [aspect, internals, bean-post-processor]
    question: |
      What infrastructure component does @EnableAspectJAutoProxy register to actually
      create the proxies?
    options:
      - "A BeanFactoryPostProcessor named AspectRegistrar"
      - "A servlet Filter that wraps each bean"
      - "An AnnotationAwareAspectJAutoProxyCreator, which is a BeanPostProcessor"
      - "A FactoryBean for every aspect"
    answer: 2
    explanation: |
      @EnableAspectJAutoProxy registers AnnotationAwareAspectJAutoProxyCreator, a
      BeanPostProcessor that inspects beans during creation and wraps those matching
      aspect pointcuts in a proxy.
    ref: "concepts.md#aspect-and-enabling-aop"

  - id: aop-filters-interceptors-016
    difficulty: intermediate
    tags: [aspect, aspectj-annotations, trap]
    question: |
      A candidate says: "Because Spring AOP uses AspectJ annotations like @Aspect and
      execution() pointcuts, it must be using the AspectJ weaver at runtime." Why is
      this WRONG?
    options:
      - "Spring AOP uses only its own annotations, not AspectJ's"
      - "Spring AOP borrows AspectJ's annotation style and pointcut language but still implements interception with runtime proxies, not the AspectJ weaver"
      - "Spring AOP always weaves at compile time"
      - "AspectJ annotations only work if you attach a Java agent, which Boot does by default"
    answer: 1
    explanation: |
      This is a classic trap. Spring AOP reuses AspectJ's annotations and pointcut
      expression language for convenience, but interception is done via runtime
      proxies. The AspectJ weaver is only involved if you configure load-time weaving
      explicitly.
    ref: "concepts.md#aspect-and-enabling-aop"

  - id: aop-filters-interceptors-017
    difficulty: beginner
    tags: [pointcut-expressions, execution]
    question: |
      What does the pointcut execution(* com.app.service.*.*(..)) match?
    options:
      - "Only public methods that take no arguments"
      - "Only void methods in com.app.service"
      - "Methods in com.app.service AND all its sub-packages"
      - "Any method in classes directly in com.app.service, with any return type and any args"
    answer: 3
    explanation: |
      The first * = any return type; service.* = any class directly in that package
      (single dot, no sub-packages); .*  = any method name; (..) = any arguments.
      Sub-packages would require the '..' package wildcard (service..*).
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-018
    difficulty: intermediate
    tags: [pointcut-expressions, packages]
    question: |
      Which pointcut matches methods in com.app.service AND every sub-package under it?
    options:
      - "execution(* com.app.service.*.*(..))"
      - "execution(* com.app.service..*.*(..))"
      - "execution(* com.app.service.**(..))"
      - "within(com.app.service.*)"
    answer: 1
    explanation: |
      The '..' wildcard in a package position means "this package and any
      sub-package". A single dot (service.*) restricts to classes directly in that
      package only.
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-019
    difficulty: intermediate
    tags: [pointcut-expressions, annotation]
    question: |
      You want advice to fire only on methods annotated with a custom @Audited
      annotation. Which pointcut designator do you use?
    options:
      - "@annotation(com.app.Audited)"
      - "within(@com.app.Audited *)"
      - "execution(@Audited)"
      - "bean(*Audited)"
    answer: 0
    explanation: |
      @annotation(com.app.Audited) matches join points where the executing method
      carries that annotation. @within/@target match on the annotated *type*, and
      bean() matches by bean name.
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-020
    difficulty: advanced
    tags: [pointcut-expressions, this-target]
    question: |
      What is the difference between the this(Type) and target(Type) pointcut
      designators?
    options:
      - "this(Type) matches when the proxy is an instance of Type; target(Type) matches when the target object is an instance of Type"
      - "They are identical aliases"
      - "this(Type) matches the target; target(Type) matches the proxy"
      - "Both only work with CGLIB proxies"
    answer: 0
    explanation: |
      this() tests the proxy's type; target() tests the underlying target object's
      type. With JDK proxies these can differ (proxy implements interface, target is
      concrete class), which is why the distinction matters.
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-021
    difficulty: intermediate
    tags: [pointcut-expressions, named-pointcut]
    question: |
      What is the purpose of a @Pointcut-annotated (named) method in an aspect?
    options:
      - "It is advice that runs before the method"
      - "It defines a reusable, composable pointcut expression referenced by advice"
      - "It registers the aspect as a bean"
      - "It forces CGLIB proxying"
    answer: 1
    explanation: |
      @Pointcut declares a named, reusable pointcut (the method body is empty and its
      name becomes the reference). Advice annotations can reference it and combine
      several with &&, ||, !.
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-022
    difficulty: advanced
    tags: [pointcut-expressions, limitations, trap]
    question: |
      You write a valid pointcut that matches a PRIVATE method, and it compiles fine.
      Why does the advice never fire for that private method via Spring AOP?
    options:
      - "Pointcuts cannot reference private methods syntactically"
      - "Private methods require @EnableAspectJAutoProxy(exposeProxy=true)"
      - "Spring AOP only intercepts proxied external calls to public (CGLIB: also protected) methods, so private methods are never advised"
      - "Spring throws an exception at startup for such pointcuts"
    answer: 2
    explanation: |
      Because interception happens through the proxy, only externally-invoked public
      (and, for CGLIB, protected) methods are advised. A private method is called
      directly on the target, so the advice is bypassed even if the pointcut matches.
    ref: "concepts.md#pointcut-expressions"

  - id: aop-filters-interceptors-023
    difficulty: beginner
    tags: [jdk-cglib, selection]
    question: |
      By the classic Spring rule (ignoring proxyTargetClass), when does Spring choose
      a JDK dynamic proxy over CGLIB?
    options:
      - "When the target class is final"
      - "Always, unless the bean is a controller"
      - "When the target implements at least one interface"
      - "Only for prototype-scoped beans"
    answer: 2
    explanation: |
      Classic rule: if the target implements one or more interfaces, Spring uses a
      JDK dynamic proxy; otherwise it falls back to CGLIB subclassing. proxyTargetClass=true
      overrides this to always use CGLIB.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: aop-filters-interceptors-024
    difficulty: intermediate
    tags: [jdk-cglib, spring-boot-default]
    question: |
      What is the default proxying strategy in Spring Boot (2.0+), and why?
    options:
      - "JDK dynamic proxies, to reduce memory"
      - "Load-time weaving via AspectJ"
      - "CGLIB (proxyTargetClass=true), to avoid ClassCastExceptions when injecting concrete types"
      - "No proxying — Boot rewrites bytecode at build time"
    answer: 2
    explanation: |
      Spring Boot sets proxyTargetClass=true, defaulting to CGLIB. This avoids the
      common problem where injecting a bean by its concrete class fails because a JDK
      proxy only implements the interface, not the concrete type.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: aop-filters-interceptors-025
    difficulty: intermediate
    tags: [jdk-cglib, final]
    question: |
      Why can a CGLIB proxy NOT advise a final method?
    options:
      - "final methods are private by definition"
      - "final methods are removed by the compiler"
      - "CGLIB only proxies interfaces"
      - "CGLIB proxies by subclassing and overriding methods, and a final method cannot be overridden"
    answer: 3
    explanation: |
      CGLIB generates a runtime subclass and overrides methods to insert advice. A
      final method (or final class) cannot be overridden/subclassed, so it runs
      un-advised. private and static methods share this limitation.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: aop-filters-interceptors-026
    difficulty: advanced
    tags: [jdk-cglib, classcastexception, scenario]
    question: |
      An interface OrderService is implemented by OrderServiceImpl, and an aspect
      advises it. With default JDK proxying, a colleague autowires the field as
      "OrderServiceImpl orderService" and startup fails. What is the best explanation?
    options:
      - "The JDK proxy implements OrderService but is NOT an instance of OrderServiceImpl, so it can't be injected into a concrete-type field"
      - "CGLIB cannot proxy implementations of interfaces"
      - "Field injection is forbidden for proxied beans"
      - "The aspect must be marked @Primary"
    answer: 0
    explanation: |
      A JDK dynamic proxy implements only the interface(s), not the concrete class, so
      it is not assignable to OrderServiceImpl. Injecting by the interface type (or
      forcing CGLIB via proxyTargetClass=true) resolves it.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: aop-filters-interceptors-027
    difficulty: beginner
    tags: [self-invocation, trap]
    question: |
      A public method annotated @Transactional calls another @Transactional method in
      the SAME class via this.other(). Why does the second method's transaction
      settings not apply?
    options:
      - "The internal call goes directly to the target and bypasses the proxy that applies the advice"
      - "Nested transactions are illegal in Spring"
      - "@Transactional only works on private methods"
      - "The database rejects nested transactions"
    answer: 0
    explanation: |
      This is the self-invocation limitation. The internal this.other() call does not
      pass through the proxy, so proxy-based advice (transactions, caching, async) is
      not applied to the inner method.
    ref: "concepts.md#self-invocation-limitation"

  - id: aop-filters-interceptors-028
    difficulty: intermediate
    tags: [self-invocation, features]
    question: |
      Which of the following is NOT affected by the self-invocation limitation?
    options:
      - "@Cacheable called internally via this"
      - "@Async called internally via this"
      - "An AspectJ load-time-woven aspect on an internally called method"
      - "@Transactional called internally via this"
    answer: 2
    explanation: |
      AspectJ weaves the bytecode directly (no proxy), so it intercepts internal
      self-invocations too. @Cacheable, @Async, and @Transactional are all
      proxy-based and therefore bypassed on self-invocation.
    ref: "concepts.md#self-invocation-limitation"

  - id: aop-filters-interceptors-029
    difficulty: intermediate
    tags: [self-invocation, fixes]
    question: |
      Which is the CLEANEST recommended fix for the self-invocation problem?
    options:
      - "Make all methods static"
      - "Move the self-called method into a separate bean so the call crosses a proxy boundary"
      - "Mark the inner method private"
      - "Disable auto-proxying"
    answer: 1
    explanation: |
      Extracting the inner method into a separate bean means the call goes through
      that bean's proxy, so advice applies. Self-injection or AopContext.currentProxy()
      also work but are considered less clean.
    ref: "concepts.md#self-invocation-limitation"

  - id: aop-filters-interceptors-030
    difficulty: advanced
    tags: [self-invocation, aop-context]
    question: |
      To use AopContext.currentProxy() to call another method of the same bean through
      the proxy, what configuration is required?
    options:
      - "@EnableAsync"
      - "@EnableAspectJAutoProxy(exposeProxy = true)"
      - "proxyTargetClass = false"
      - "Nothing; currentProxy() always works"
    answer: 1
    explanation: |
      AopContext.currentProxy() only returns the proxy if the proxy has been exposed
      via exposeProxy = true. Otherwise it throws IllegalStateException. It works but
      couples code to Spring AOP.
    ref: "concepts.md#self-invocation-limitation"

  - id: aop-filters-interceptors-031
    difficulty: beginner
    tags: [spring-aop-vs-aspectj]
    question: |
      Which statement about Spring AOP vs AspectJ is correct?
    options:
      - "Spring AOP weaves bytecode at compile time; AspectJ uses proxies"
      - "Both require a Java agent to function"
      - "Spring AOP is runtime proxy-based and limited to Spring bean method executions; AspectJ does true bytecode weaving with far more join points"
      - "AspectJ can only advise Spring beans"
    answer: 2
    explanation: |
      Spring AOP is proxy-based, runtime, method-execution-only, and only for Spring
      beans. AspectJ weaves bytecode (compile/post-compile/load-time), works on any
      object, and supports many join point kinds.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: aop-filters-interceptors-032
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, join-points]
    question: |
      Which capability is available with AspectJ but NOT with Spring AOP?
    options:
      - "Advising field access, constructors, and final/private methods, plus intercepting self-invocations"
      - "Using @Around advice"
      - "Advising method executions of Spring beans"
      - "Using execution() pointcuts"
    answer: 0
    explanation: |
      AspectJ weaves bytecode directly, so it can advise field get/set, constructors,
      static initializers, final/private methods, and it intercepts internal
      self-invocations. Spring AOP (proxy) cannot do any of those.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: aop-filters-interceptors-033
    difficulty: advanced
    tags: [spring-aop-vs-aspectj, ltw]
    question: |
      You need to intercept a method on a plain object created with 'new' (not a
      Spring bean) and also intercept self-invocations. Which approach fits?
    options:
      - "Spring AOP with proxyTargetClass=true"
      - "A HandlerInterceptor"
      - "AspectJ compile-time or load-time weaving"
      - "A servlet Filter"
    answer: 2
    explanation: |
      Only AspectJ weaving (CTW/LTW) can advise non-Spring, new-ed objects and
      intercept self-invocations, because it weaves the aspect into the bytecode
      itself rather than relying on a Spring-managed proxy.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: aop-filters-interceptors-034
    difficulty: intermediate
    tags: [spring-aop-vs-aspectj, performance]
    question: |
      Regarding performance, which is generally true?
    options:
      - "Spring AOP is faster because it avoids method calls"
      - "Both add identical overhead"
      - "AspectJ woven code runs essentially at native speed, while Spring AOP adds per-call proxy overhead"
      - "AspectJ is always slower because of reflection"
    answer: 2
    explanation: |
      AspectJ weaves advice directly into bytecode, so there is little per-call
      overhead. Spring AOP interposes a proxy invocation on every advised call, a
      small but real overhead.
    ref: "concepts.md#spring-aop-vs-aspectj"

  - id: aop-filters-interceptors-035
    difficulty: intermediate
    tags: [ordering]
    question: |
      Two aspects advise the same method: SecurityAspect (@Order(1)) and LoggingAspect
      (@Order(2)). Which runs first on the way IN?
    options:
      - "SecurityAspect, because a lower @Order value means higher precedence"
      - "LoggingAspect, because higher numbers run first"
      - "They run in random order"
      - "Whichever bean was created first"
    answer: 0
    explanation: |
      Lower @Order value = higher precedence = runs first inbound (and last outbound).
      So SecurityAspect (1) wraps LoggingAspect (2). On the way out the order reverses.
    ref: "concepts.md#aspect-ordering"

  - id: aop-filters-interceptors-036
    difficulty: beginner
    tags: [ordering]
    question: |
      How do you control the relative order of two different aspects on the same join
      point?
    options:
      - "By implementing Ordered or using @Order on the aspects"
      - "By alphabetical class name"
      - "By the order of imports"
      - "You cannot control aspect ordering"
    answer: 0
    explanation: |
      Aspect precedence is set with the @Order annotation or by implementing the
      Ordered interface. Lower values have higher precedence.
    ref: "concepts.md#aspect-ordering"

  - id: aop-filters-interceptors-037
    difficulty: advanced
    tags: [ordering, same-aspect]
    question: |
      You have two advices of different types in the SAME aspect on the same join
      point and need a strict order between them. What is the reliable approach?
    options:
      - "Split them into separate aspects, each with its own @Order"
      - "Add @Order to each advice method"
      - "Rename the methods alphabetically"
      - "It is impossible to control any ordering"
    answer: 0
    explanation: |
      @Order applies at the aspect level, not per advice method. Ordering of multiple
      advices within one aspect is not controllable that way, so split them into
      separate aspects with distinct @Order values for a guaranteed order.
    ref: "concepts.md#aspect-ordering"

  - id: aop-filters-interceptors-038
    difficulty: beginner
    tags: [use-cases]
    question: |
      Which of these Spring features is NOT typically implemented via proxy-based AOP?
    options:
      - "@Transactional"
      - "@Cacheable"
      - "@Autowired field injection"
      - "@Async"
    answer: 2
    explanation: |
      @Transactional, @Cacheable, and @Async are all realized through proxy-based AOP
      advice. @Autowired dependency injection is performed by the container/BeanPostProcessors,
      not by AOP proxying.
    ref: "concepts.md#aop-use-cases"

  - id: aop-filters-interceptors-039
    difficulty: intermediate
    tags: [use-cases]
    question: |
      Which is a strong indicator that a concern is a good candidate for AOP?
    options:
      - "It is unique to a single method"
      - "It applies orthogonally across many Spring bean methods and is unrelated to core business logic"
      - "It requires reading the raw HTTP body of static resource requests"
      - "It must run before the DispatcherServlet"
    answer: 1
    explanation: |
      AOP shines for cross-cutting concerns that repeat across many bean methods and
      are orthogonal to business logic (logging, metrics, tx, caching). Raw request
      handling / pre-DispatcherServlet work belongs to filters.
    ref: "concepts.md#aop-use-cases"

  - id: aop-filters-interceptors-040
    difficulty: beginner
    tags: [servlet-filter]
    question: |
      At what layer does a servlet Filter operate?
    options:
      - "At the servlet container level, before/around the DispatcherServlet, on the raw request/response"
      - "Inside the DispatcherServlet, around controller methods"
      - "At the database/JDBC layer"
      - "Only within @Aspect-advised beans"
    answer: 0
    explanation: |
      A Filter is part of the Servlet spec and runs at the container level, wrapping
      the entire request including the DispatcherServlet. It sees the raw
      ServletRequest/ServletResponse and does not know the matched handler.
    ref: "concepts.md#servlet-filter"

  - id: aop-filters-interceptors-041
    difficulty: intermediate
    tags: [servlet-filter, jakarta]
    question: |
      In Spring Boot 3 / Spring 6, which package is a Filter interface imported from?
    options:
      - "javax.servlet"
      - "org.springframework.web.filter"
      - "jakarta.servlet"
      - "java.servlet"
    answer: 2
    explanation: |
      Spring Boot 3 / Spring 6 moved to the Jakarta EE 9+ namespace, so it is
      jakarta.servlet.Filter. Spring Boot 2 / Spring 5 used javax.servlet.Filter.
    ref: "concepts.md#servlet-filter"

  - id: aop-filters-interceptors-042
    difficulty: intermediate
    tags: [servlet-filter, short-circuit]
    question: |
      Inside a Filter's doFilter, what happens if you do NOT call chain.doFilter(req, res)?
    options:
      - "The request proceeds normally to the next filter and the servlet"
      - "Spring throws a ServletException automatically"
      - "The request is short-circuited; downstream filters and the servlet/controller are not invoked"
      - "The response is committed but the controller still runs"
    answer: 2
    explanation: |
      chain.doFilter passes control down the chain. Omitting it short-circuits the
      request so no further filters, servlets, or controllers execute — useful for
      auth rejection, caching hits, etc.
    ref: "concepts.md#servlet-filter"

  - id: aop-filters-interceptors-043
    difficulty: advanced
    tags: [servlet-filter, ordering, registration]
    question: |
      You have two Filter beans and need to guarantee one runs before the other, plus
      restrict one to /api/*. What is the best way?
    options:
      - "Annotate methods with @Order inside the controller"
      - "Filters cannot be ordered or path-restricted"
      - "Use InterceptorRegistry.addInterceptor"
      - "Register each with a FilterRegistrationBean, setting order() and URL patterns"
    answer: 3
    explanation: |
      FilterRegistrationBean lets you set the filter's order and URL patterns
      explicitly. InterceptorRegistry is for HandlerInterceptors, not filters.
    ref: "concepts.md#servlet-filter"

  - id: aop-filters-interceptors-044
    difficulty: intermediate
    tags: [servlet-filter, once-per-request]
    question: |
      Why might you extend OncePerRequestFilter instead of implementing Filter directly?
    options:
      - "It automatically makes the filter transactional"
      - "It guarantees a single execution per request, avoiding double invocation on forwards/async dispatches"
      - "It converts the filter into a HandlerInterceptor"
      - "It disables the rest of the filter chain"
    answer: 1
    explanation: |
      OncePerRequestFilter (a Spring helper) ensures the filter logic runs exactly
      once per request, even when the request is forwarded or dispatched
      asynchronously, which a plain Filter might otherwise re-trigger.
    ref: "concepts.md#servlet-filter"

  - id: aop-filters-interceptors-045
    difficulty: beginner
    tags: [handler-interceptor, hooks]
    question: |
      Which HandlerInterceptor method can prevent the controller from being invoked by
      returning false?
    options:
      - "postHandle"
      - "preHandle"
      - "afterCompletion"
      - "handleRequest"
    answer: 1
    explanation: |
      preHandle runs before the handler; returning false stops the chain so the
      controller is not called. postHandle runs after the handler (before view
      render); afterCompletion runs after the full request.
    ref: "concepts.md#handlerinterceptor"

  - id: aop-filters-interceptors-046
    difficulty: intermediate
    tags: [handler-interceptor, exception]
    question: |
      If a controller (handler) throws an exception, which HandlerInterceptor callbacks
      run?
    options:
      - "Only postHandle"
      - "None of them run"
      - "postHandle is skipped, but afterCompletion still runs (with the exception)"
      - "Only preHandle runs"
    answer: 2
    explanation: |
      When the handler throws, postHandle is skipped, but afterCompletion is still
      invoked and receives the Exception — making it the right place for cleanup that
      must always run.
    ref: "concepts.md#handlerinterceptor"

  - id: aop-filters-interceptors-047
    difficulty: intermediate
    tags: [handler-interceptor, registration]
    question: |
      How do you register a HandlerInterceptor with URL include/exclude patterns?
    options:
      - "Add it to web.xml as a <filter>"
      - "Annotate it with @Component only"
      - "Register a FilterRegistrationBean"
      - "Implement WebMvcConfigurer and override addInterceptors, using addPathPatterns/excludePathPatterns"
    answer: 3
    explanation: |
      HandlerInterceptors are registered via WebMvcConfigurer.addInterceptors on the
      InterceptorRegistry, which supports addPathPatterns and excludePathPatterns.
      FilterRegistrationBean and web.xml <filter> are for servlet filters.
    ref: "concepts.md#handlerinterceptor"

  - id: aop-filters-interceptors-048
    difficulty: advanced
    tags: [handler-interceptor, handler-method]
    question: |
      A key advantage of a HandlerInterceptor over a servlet Filter is that it can:
    options:
      - "Modify the raw byte stream of any servlet request"
      - "Run before the DispatcherServlet"
      - "Access the resolved handler (e.g. HandlerMethod) and inspect controller-method annotations, plus the ModelAndView"
      - "Advise non-web service beans"
    answer: 2
    explanation: |
      Because interceptors run inside the DispatcherServlet, they receive the resolved
      handler and can read its annotations and touch the ModelAndView. Filters run
      earlier and only see the raw request/response.
    ref: "concepts.md#handlerinterceptor"

  - id: aop-filters-interceptors-049
    difficulty: beginner
    tags: [filter-vs-interceptor-vs-aspect, ordering]
    question: |
      For a single HTTP request, which component runs FIRST?
    options:
      - "The @Aspect around the controller"
      - "The servlet Filter"
      - "The HandlerInterceptor preHandle"
      - "The controller method"
    answer: 1
    explanation: |
      The servlet Filter runs at the container level, outermost — before the
      DispatcherServlet and therefore before the interceptor's preHandle, any aspect,
      and the controller.
    ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

  - id: aop-filters-interceptors-050
    difficulty: intermediate
    tags: [filter-vs-interceptor-vs-aspect, selection]
    question: |
      You need to add a CORS header and correlation ID (MDC) to EVERY request,
      including static resources, before any Spring MVC handling. Which mechanism fits
      best?
    options:
      - "A servlet Filter"
      - "A HandlerInterceptor"
      - "An @Aspect on the controller"
      - "An @Aspect on the service layer"
    answer: 0
    explanation: |
      A Filter operates at the container level across all requests (including static
      resources) before the DispatcherServlet, making it ideal for CORS, encoding,
      compression, and MDC/correlation-id setup.
    ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

  - id: aop-filters-interceptors-051
    difficulty: intermediate
    tags: [filter-vs-interceptor-vs-aspect, selection]
    question: |
      You want to measure execution time of specific SERVICE-layer methods, some of
      which are also invoked from a batch job (no HTTP). Which mechanism is most
      appropriate?
    options:
      - "A servlet Filter"
      - "A HandlerInterceptor"
      - "An @Aspect (Spring AOP) around the service methods"
      - "A @ControllerAdvice"
    answer: 2
    explanation: |
      Filters and interceptors are web-only. An @Aspect advises arbitrary Spring bean
      methods regardless of whether the call came from HTTP or a batch job, so it can
      time the service methods in both contexts.
    ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

  - id: aop-filters-interceptors-052
    difficulty: advanced
    tags: [filter-vs-interceptor-vs-aspect, scenario]
    question: |
      Which statement correctly distinguishes the three mechanisms?
    options:
      - "Filters, interceptors, and aspects all require a web request to function"
      - "Only aspects can short-circuit a request; filters and interceptors cannot"
      - "Interceptors run before filters because they are closer to the controller"
      - "Filters see the raw request/response, interceptors see the resolved handler/ModelAndView, and aspects operate on bean method calls (including non-web beans)"
    answer: 3
    explanation: |
      Each sits at a different layer: Filter (container, raw request), Interceptor
      (MVC, resolved handler + ModelAndView), Aspect (any bean method). Filters and
      interceptors can also short-circuit; and filters run before interceptors.
    ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

  - id: aop-filters-interceptors-053
    difficulty: intermediate
    tags: [filter-vs-interceptor-vs-aspect, spring-security]
    question: |
      Spring Security's request-level enforcement is primarily implemented as which of
      the following?
    options:
      - "A chain of HandlerInterceptors"
      - "A servlet Filter chain (FilterChainProxy)"
      - "A set of @Around aspects on controllers"
      - "A BeanPostProcessor"
    answer: 1
    explanation: |
      Spring Security plugs into the servlet container as a filter chain
      (FilterChainProxy / DelegatingFilterProxy), so it can intercept every request
      before it reaches the DispatcherServlet. (Method security like @PreAuthorize is
      AOP-based, but request-level security is filter-based.)
    ref: "concepts.md#filter-vs-handlerinterceptor-vs-aspect"

  - id: aop-filters-interceptors-054
    difficulty: advanced
    tags: [advice-types, around, exception]
    question: |
      An @Around advice calls proceed() but the target throws a RuntimeException. The
      advice catches it and returns a default value without rethrowing. What is the
      observable effect on the caller and on @AfterThrowing advice for the same method?
    options:
      - "The caller sees the exception; @AfterThrowing fires"
      - "The caller receives null and @AfterThrowing fires"
      - "A compilation error results"
      - "The caller receives the default value; @AfterThrowing does NOT fire because the exception was swallowed"
    answer: 3
    explanation: |
      Because the @Around swallowed the exception and returned normally, the caller
      sees the default value and, from the framework's view, the join point completed
      normally — so @AfterThrowing does not fire (and @AfterReturning would). This is
      why swallowing exceptions in @Around is risky.
    ref: "concepts.md#advice-types"

  - id: aop-filters-interceptors-055
    difficulty: advanced
    tags: [jdk-cglib, proxy-target-class]
    question: |
      What does @EnableAspectJAutoProxy(proxyTargetClass = true) do?
    options:
      - "Disables AOP entirely"
      - "Forces CGLIB (class-based) proxies even when the target implements interfaces"
      - "Forces JDK dynamic proxies for all beans"
      - "Enables AspectJ load-time weaving"
    answer: 1
    explanation: |
      proxyTargetClass=true forces CGLIB subclass proxies regardless of whether the
      target implements interfaces. This is the Spring Boot default and avoids
      concrete-type injection issues.
    ref: "concepts.md#jdk-dynamic-proxy-vs-cglib"

  - id: aop-filters-interceptors-056
    difficulty: beginner
    tags: [terminology, aspect]
    question: |
      In Spring, an aspect is most concretely represented by:
    options:
      - "Any class annotated with @Component"
      - "An interface extending Advisor"
      - "A method annotated with @Bean"
      - "A class annotated with @Aspect (and registered as a bean)"
    answer: 3
    explanation: |
      An aspect is the module bundling pointcut(s) and advice. In Spring it is a class
      annotated with @Aspect that is also a managed bean. @Component alone does not
      make a class an aspect.
    ref: "concepts.md#aop-core-concepts-and-terminology"

  - id: aop-filters-interceptors-057
    difficulty: intermediate
    tags: [handler-interceptor, async]
    question: |
      Regarding postHandle in a HandlerInterceptor, which statement is TRUE?
    options:
      - "It runs after the handler returns (before view rendering) and is skipped when the handler throws"
      - "It always runs even if the handler throws an exception"
      - "It runs before preHandle"
      - "It runs at the servlet container level before the DispatcherServlet"
    answer: 0
    explanation: |
      postHandle runs after a successful handler execution but before view rendering,
      giving access to the ModelAndView. If the handler throws, postHandle is skipped
      (afterCompletion still runs).
    ref: "concepts.md#handlerinterceptor"

