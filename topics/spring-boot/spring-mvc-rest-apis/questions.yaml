topic: "Spring MVC & REST APIs"
domain: spring-boot
topic_slug: spring-mvc-rest-apis
version: 1
questions:
  - id: spring-mvc-rest-apis-001
    difficulty: beginner
    tags: [dispatcherservlet, front-controller]
    question: |
      In Spring MVC, which component acts as the front controller that receives
      every incoming HTTP request and delegates to other collaborators?
    options:
      - "DispatcherServlet"
      - "RequestMappingHandlerAdapter"
      - "ViewResolver"
      - "ContextLoaderListener"
    answer: 0
    explanation: |
      The DispatcherServlet is the single front controller. It is mapped (usually to
      "/") and funnels all requests through one entry point, delegating to
      HandlerMapping, HandlerAdapter, ViewResolver, etc. ContextLoaderListener only
      bootstraps the root context; the others are collaborators the DispatcherServlet uses.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-002
    difficulty: intermediate
    tags: [dispatcherservlet, handlermapping, handleradapter]
    question: |
      During DispatcherServlet processing, what is the respective responsibility of
      HandlerMapping versus HandlerAdapter?
    options:
      - "HandlerMapping renders the view to the response, while HandlerAdapter resolves the returned view name into a template"
      - "HandlerMapping invokes the controller method; HandlerAdapter selects which controller to call"
      - "HandlerMapping resolves a request to a handler (and its interceptors); HandlerAdapter knows how to invoke that handler"
      - "Both components select the handler, and only whichever one is registered first runs for a given request"
    answer: 2
    explanation: |
      HandlerMapping maps a request to a HandlerExecutionChain (handler + interceptors).
      The HandlerAdapter then knows HOW to invoke that particular handler type
      (RequestMappingHandlerAdapter invokes @RequestMapping methods, resolving arguments
      and handling return values).
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-003
    difficulty: advanced
    tags: [dispatcherservlet, rest, view]
    question: |
      A method in a @RestController returns a plain Java object. Which statement best
      describes what the DispatcherServlet does with the return value?
    options:
      - "It throws 406 Not Acceptable because no ViewResolver or default view template is configured for the object"
      - "It looks up a ViewResolver, resolves the object's toString() as a view name, and renders it"
      - "It stores the object as a model attribute and forwards to a default JSP view named after the controller method"
      - "A HandlerMethodReturnValueHandler serializes the object via an HttpMessageConverter and skips view resolution entirely"
    answer: 3
    explanation: |
      For @ResponseBody / @RestController methods, RequestResponseBodyMethodProcessor
      writes the return value to the response body using an HttpMessageConverter (e.g.
      Jackson for JSON). No ModelAndView is produced and the ViewResolver step is skipped.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-004
    difficulty: intermediate
    tags: [dispatcherservlet, multipart]
    question: |
      Which DispatcherServlet collaborator is responsible for detecting and parsing a
      multipart/form-data request before the handler is invoked?
    options:
      - "ContentNegotiationManager"
      - "MultipartResolver"
      - "HandlerExceptionResolver"
      - "LocaleResolver"
    answer: 1
    explanation: |
      At the start of doDispatch the MultipartResolver (StandardServletMultipartResolver
      in Boot 3) checks for and wraps a multipart request so parts are available to the
      handler. The others handle exceptions, locale, and representation selection.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-005
    difficulty: advanced
    tags: [dispatcherservlet, application-context]
    question: |
      Regarding the DispatcherServlet's WebApplicationContext in a traditional Spring MVC
      setup, which statement is correct?
    options:
      - "Each controller gets its own isolated ApplicationContext that is created fresh on every incoming request"
      - "The web context is the parent of the root context, so root beans can inject web controllers"
      - "The web (child) context can see beans in the root context, but root-context beans cannot see web-context beans"
      - "There is only ever one context and parent/child relationships do not exist in Spring MVC"
    answer: 2
    explanation: |
      The DispatcherServlet creates a child WebApplicationContext whose parent is the root
      context. Child beans can resolve parent beans, but not the reverse. Boot commonly uses
      a single context, yet the parent/child model still governs classic configurations.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-006
    difficulty: intermediate
    tags: [request-lifecycle, filters, interceptors]
    question: |
      In the overall request lifecycle of a Spring Boot MVC app, where do servlet filters
      run relative to HandlerInterceptors?
    options:
      - "Filters run in the servlet container before the DispatcherServlet; interceptors run inside it, only for requests routed to a handler"
      - "They run concurrently on separate worker threads that Spring joins together before the response is committed"
      - "Interceptors always run first in the servlet container, wrapping the filter chain before any filter executes"
      - "Filters run inside the DispatcherServlet after all HandlerInterceptors have finished their postHandle callbacks"
    answer: 0
    explanation: |
      Filters live in the servlet container and wrap the DispatcherServlet, so they see
      every request (even static resources). HandlerInterceptors run inside the
      DispatcherServlet and only see requests that were mapped to a handler.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-007
    difficulty: advanced
    tags: [request-lifecycle, interceptors]
    question: |
      A HandlerInterceptor's preHandle() returns false. What happens next?
    options:
      - "A 500 Internal Server Error is returned automatically and the remaining interceptor chain is aborted at once"
      - "postHandle still runs for every interceptor, but afterCompletion is skipped entirely for the whole chain"
      - "The handler still runs to completion but its generated response body is silently discarded before writing"
      - "The handler is not invoked; postHandle is skipped and afterCompletion runs only for interceptors whose preHandle already returned true"
    answer: 3
    explanation: |
      Returning false from preHandle short-circuits processing: the handler and remaining
      interceptors' preHandle are not called, postHandle is skipped, and afterCompletion is
      invoked only for interceptors that had already passed preHandle.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-008
    difficulty: intermediate
    tags: [request-lifecycle, interceptors, exceptions]
    question: |
      If the handler method throws an exception, which interceptor callbacks are invoked?
    options:
      - "Both postHandle and afterCompletion run normally, with the thrown exception passed to each callback"
      - "postHandle is NOT called; afterCompletion IS called (for interceptors that passed preHandle)"
      - "Neither postHandle nor afterCompletion is called once the handler method throws an exception"
      - "Only postHandle is called, receiving the thrown exception as an extra method argument"
    answer: 1
    explanation: |
      postHandle runs only after successful handler execution, so an exception skips it.
      afterCompletion is the cleanup hook and is always called (with the exception) for
      interceptors whose preHandle returned true — analogous to a finally block.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-009
    difficulty: beginner
    tags: [controller, restcontroller, annotations]
    question: |
      What is @RestController equivalent to?
    options:
      - "@Controller + @ResponseBody"
      - "@Component + @ResponseStatus"
      - "@Service + @ResponseBody"
      - "@Controller + @RequestMapping"
    answer: 0
    explanation: |
      @RestController is a meta-annotation composed of @Controller and @ResponseBody, so
      every handler method's return value is serialized to the response body instead of
      being treated as a view name.
    ref: "concepts.md#controller-vs-restcontroller"
  - id: spring-mvc-rest-apis-010
    difficulty: intermediate
    tags: [controller, view, gotcha]
    question: |
      A developer annotates a class with @RestController and writes a method that returns
      the String "home", intending to render a Thymeleaf template named home.html. What
      actually happens?
    options:
      - "A 302 redirect to the /home URL path is returned to the client automatically"
      - "Spring resolves and renders the home.html template as if @ResponseBody were absent"
      - "The literal text \"home\" is written to the response body instead of rendering a view"
      - "Spring throws a ViewResolutionException during application startup while scanning the controller"
    answer: 2
    explanation: |
      Because @RestController implies @ResponseBody, the returned String is written to the
      body via a message converter, not interpreted as a logical view name. To render a
      template use @Controller (without @ResponseBody on that method).
    ref: "concepts.md#controller-vs-restcontroller"
  - id: spring-mvc-rest-apis-011
    difficulty: beginner
    tags: [controller, view]
    question: |
      With a plain @Controller method that returns a String and has no @ResponseBody, how
      is the returned String interpreted?
    options:
      - "As raw response body content written directly by an HttpMessageConverter"
      - "As a logical view name to be resolved by a ViewResolver"
      - "As an HTTP redirect URL that always issues a 302 response to the client"
      - "As a JSON string serialized by the default Jackson message converter"
    answer: 1
    explanation: |
      Without @ResponseBody, a String return value from a @Controller is a logical view
      name passed to a ViewResolver (unless it starts with a prefix like "redirect:" or
      "forward:"). Add @ResponseBody to return the string as the body.
    ref: "concepts.md#controller-vs-restcontroller"
  - id: spring-mvc-rest-apis-012
    difficulty: beginner
    tags: [request-mapping, annotations]
    question: |
      Which annotation is @GetMapping a shortcut for?
    options:
      - "@RequestMapping(consumes = \"application/json\")"
      - "@ResponseBody combined with a GET-only request method restriction"
      - "@RequestMapping(method = RequestMethod.POST)"
      - "@RequestMapping(method = RequestMethod.GET)"
    answer: 3
    explanation: |
      @GetMapping is a composed annotation equivalent to
      @RequestMapping(method = RequestMethod.GET). Similar shortcuts exist for POST, PUT,
      DELETE, and PATCH.
    ref: "concepts.md#request-mapping-annotations"
  - id: spring-mvc-rest-apis-013
    difficulty: intermediate
    tags: [request-mapping, consumes, produces]
    question: |
      On @RequestMapping, what do the 'consumes' and 'produces' attributes constrain,
      respectively?
    options:
      - "consumes matches the request Content-Type header; produces matches the request Accept header"
      - "Both attributes are matched against the request's Content-Type header in the same way"
      - "consumes limits which query parameters are allowed; produces limits which path variables are bound"
      - "consumes matches the Accept header; produces matches the Content-Type header"
    answer: 0
    explanation: |
      'consumes' narrows the mapping by the request's Content-Type (what the endpoint can
      accept as a body), while 'produces' narrows by the request's Accept header (what the
      client wants back). Mismatches yield 415 and 406 respectively.
    ref: "concepts.md#request-mapping-annotations"
  - id: spring-mvc-rest-apis-014
    difficulty: advanced
    tags: [request-mapping, path-pattern]
    question: |
      In Spring 5.3+/Boot with the default PathPattern parser, which pattern captures the
      remaining path (including slashes) into a variable named 'path'?
    options:
      - "/files/{path}"
      - "/files/**{path}"
      - "/files/{*path}"
      - "/files/{path:.+}"
    answer: 2
    explanation: |
      PathPattern supports the {*name} syntax to capture the rest of the path, including
      slashes, e.g. /files/{*path}. The single {path} only captures one segment. The
      AntPathMatcher regex trick {path:.+} is the older approach.
    ref: "concepts.md#request-mapping-annotations"
  - id: spring-mvc-rest-apis-015
    difficulty: beginner
    tags: [path-variable, request-param]
    question: |
      To bind the value 42 from the URL /users/42 into a controller method parameter,
      which annotation do you use?
    options:
      - "@RequestBody"
      - "@RequestHeader"
      - "@RequestParam"
      - "@PathVariable"
    answer: 3
    explanation: |
      @PathVariable binds a URI template segment such as {id} in /users/{id}.
      @RequestParam binds query-string or form parameters like ?id=42.
    ref: "concepts.md#pathvariable-requestparam-requestbody-requestheader-cookievalue"
  - id: spring-mvc-rest-apis-016
    difficulty: intermediate
    tags: [request-param, required, default]
    question: |
      By default, is a method parameter annotated with @RequestParam("page") required, and
      how do you make it optional?
    options:
      - "It is optional by default; set required = true and omit defaultValue to force callers to supply it"
      - "It is required by default; set required = false and/or provide defaultValue to make it optional"
      - "It is always optional regardless of configuration; no attribute can make it mandatory"
      - "It becomes required only if the type is a primitive; objects are always optional"
    answer: 1
    explanation: |
      @RequestParam is required by default and a missing value yields 400. Setting
      required = false (or supplying defaultValue, which implicitly makes it optional)
      relaxes that. Note primitives can't be null, so a missing optional primitive needs a
      defaultValue or a boxed type.
    ref: "concepts.md#pathvariable-requestparam-requestbody-requestheader-cookievalue"
  - id: spring-mvc-rest-apis-017
    difficulty: intermediate
    tags: [request-body, message-converter]
    question: |
      Which statement about @RequestBody is correct?
    options:
      - "It only works with GET requests, reading the body from the query string rather than the payload"
      - "You may declare multiple @RequestBody parameters to bind different parts of the body"
      - "It reads and deserializes the full request body via an HttpMessageConverter; only one per method is allowed"
      - "It binds application/x-www-form-urlencoded form fields into a Map after URL-decoding each entry"
    answer: 2
    explanation: |
      @RequestBody deserializes the entire body using an HttpMessageConverter (Jackson for
      JSON) and there can be only one per handler method. Form-encoded bodies are bound via
      @RequestParam or a model attribute, not @RequestBody.
    ref: "concepts.md#pathvariable-requestparam-requestbody-requestheader-cookievalue"
  - id: spring-mvc-rest-apis-018
    difficulty: beginner
    tags: [cookie-value, request-header]
    question: |
      Which annotation binds the value of an HTTP cookie to a controller method parameter?
    options:
      - "@CookieValue"
      - "@SessionAttribute"
      - "@RequestParam"
      - "@RequestHeader"
    answer: 0
    explanation: |
      @CookieValue binds a cookie value (e.g. @CookieValue("JSESSIONID")). @RequestHeader
      binds an HTTP header. Both are required by default and support defaultValue/required.
    ref: "concepts.md#pathvariable-requestparam-requestbody-requestheader-cookievalue"
  - id: spring-mvc-rest-apis-019
    difficulty: advanced
    tags: [request-param, parameter-names]
    question: |
      A controller uses @RequestParam int page without specifying a name, and at runtime a
      request with ?page=2 fails to bind, complaining the parameter name is not available.
      What is the most likely root cause?
    options:
      - "The primitive int type is not a supported target for query parameters, so Spring skips binding it entirely"
      - "You must always annotate numeric values with @PathVariable, because @RequestParam cannot read integer parameters"
      - "@RequestParam cannot be used with a primitive int and requires a boxed Integer wrapper for the value to bind"
      - "The code was compiled without the -parameters flag, so the parameter name could not be inferred"
    answer: 3
    explanation: |
      When class files lack parameter-name metadata (no -parameters compiler flag), Spring
      cannot infer the parameter name and requires an explicit name like
      @RequestParam("page"). Spring Boot enables -parameters by default, but plain builds
      may not.
    ref: "concepts.md#pathvariable-requestparam-requestbody-requestheader-cookievalue"
  - id: spring-mvc-rest-apis-020
    difficulty: intermediate
    tags: [multipart, file-upload]
    question: |
      Which type is the standard Spring abstraction for an uploaded file bound with
      @RequestParam("file") in a multipart request?
    options:
      - "java.io.File, which Spring writes the uploaded bytes to a temp path before injecting"
      - "org.springframework.web.multipart.MultipartFile"
      - "jakarta.servlet.http.Part only, since Spring delegates every upload straight to the raw Servlet API"
      - "byte[] is the only supported type, because Spring eagerly reads the whole part into memory"
    answer: 1
    explanation: |
      MultipartFile is Spring's abstraction over an uploaded file, exposing
      getOriginalFilename(), getBytes(), getInputStream(), and transferTo(). You can also
      accept jakarta.servlet.http.Part or byte[]/InputStream, but MultipartFile is standard.
    ref: "concepts.md#multipart-file-upload"
  - id: spring-mvc-rest-apis-021
    difficulty: advanced
    tags: [multipart, request-part, request-param]
    question: |
      In a multipart request you have one part named "meta" that is JSON and one part named
      "file". Which parameter annotations correctly deserialize the JSON part into a DTO
      while receiving the file?
    options:
      - "@RequestPart(\"meta\") MetaDto meta, @RequestPart(\"file\") MultipartFile file"
      - "@RequestBody MetaDto meta, @RequestParam MultipartFile file"
      - "@PathVariable MetaDto meta, @RequestPart MultipartFile file"
      - "@RequestParam MetaDto meta, @RequestParam MultipartFile file"
    answer: 0
    explanation: |
      @RequestPart runs each part through content-type-aware HttpMessageConverters, so a
      JSON part is deserialized into MetaDto. @RequestParam treats a part as a simple
      string/MultipartFile and would not convert the JSON. Only one @RequestBody is allowed
      and it consumes the whole body, not a part.
    ref: "concepts.md#multipart-file-upload"
  - id: spring-mvc-rest-apis-022
    difficulty: intermediate
    tags: [multipart, config, boot3]
    question: |
      Which Spring Boot properties configure multipart upload size limits?
    options:
      - "spring.upload.max-size only, a single property that caps both per-file and total request size"
      - "server.multipart.file-size and server.multipart.request-size, read directly by the embedded servlet container"
      - "spring.servlet.multipart.max-file-size and spring.servlet.multipart.max-request-size"
      - "spring.mvc.multipart.limit and spring.mvc.multipart.max, applied by the DispatcherServlet on each part"
    answer: 2
    explanation: |
      Boot exposes spring.servlet.multipart.max-file-size (per file) and
      spring.servlet.multipart.max-request-size (total request). Exceeding them raises a
      MaxUploadSizeExceededException.
    ref: "concepts.md#multipart-file-upload"
  - id: spring-mvc-rest-apis-023
    difficulty: intermediate
    tags: [response-entity, location, status]
    question: |
      Which ResponseEntity usage correctly returns 201 Created with a Location header
      pointing to the newly created resource?
    options:
      - "ResponseEntity.ok().header(\"Location\", uri).body(dto)"
      - "ResponseEntity.created(uri).body(dto)"
      - "ResponseEntity.status(200).location(uri).build()"
      - "ResponseEntity.accepted().body(dto)"
    answer: 1
    explanation: |
      ResponseEntity.created(URI) sets status 201 and the Location header in one call, then
      .body(dto) adds the representation. ok() is 200 and accepted() is 202.
    ref: "concepts.md#responseentity"
  - id: spring-mvc-rest-apis-024
    difficulty: intermediate
    tags: [response-entity]
    question: |
      What does ResponseEntity give you that simply returning a DTO object from a handler
      does not?
    options:
      - "The ability to use @RequestMapping, which is unavailable on methods that return a plain DTO"
      - "Bean validation of the response body, which Spring performs automatically before it is serialized"
      - "Automatic JSON serialization, which a bare DTO return value cannot trigger without the wrapper"
      - "Full control over the status code and response headers in addition to the body"
    answer: 3
    explanation: |
      Returning a bare object serializes the body with a default 200 status. ResponseEntity
      represents the whole response, letting you set arbitrary status codes and headers
      (Location, Cache-Control, ETag, etc.).
    ref: "concepts.md#responseentity"
  - id: spring-mvc-rest-apis-025
    difficulty: beginner
    tags: [rest, statelessness]
    question: |
      Which is a core constraint of REST architecture?
    options:
      - "Statelessness: each request carries all context the server needs, keeping no client session state between requests"
      - "All communication must use SOAP envelopes wrapped in a WSDL-described contract negotiated per call"
      - "Clients and servers must be written in the same language so their object models serialize identically"
      - "The server must store per-client session state between requests to correlate them into a conversation"
    answer: 0
    explanation: |
      REST's statelessness constraint means each request is self-contained; the server does
      not retain per-client session state across requests, which enables horizontal scaling
      and simple load balancing. Other constraints include client-server, cacheable, and
      uniform interface.
    ref: "concepts.md#rest-principles--richardson-maturity-model"
  - id: spring-mvc-rest-apis-026
    difficulty: intermediate
    tags: [richardson-maturity, hateoas]
    question: |
      In the Richardson Maturity Model, which level is characterized by hypermedia controls
      (links driving state transitions)?
    options:
      - "Level 1 (Resources)"
      - "Level 2 (HTTP Verbs)"
      - "Level 3 (Hypermedia Controls / HATEOAS)"
      - "Level 0 (The Swamp of POX)"
    answer: 2
    explanation: |
      Level 3 introduces hypermedia (HATEOAS): responses include links telling clients what
      they can do next. Level 0 is RPC-over-HTTP, Level 1 adds many resource URIs, and Level
      2 uses proper HTTP verbs and status codes (where most REST APIs sit).
    ref: "concepts.md#rest-principles--richardson-maturity-model"
  - id: spring-mvc-rest-apis-027
    difficulty: intermediate
    tags: [richardson-maturity]
    question: |
      An API exposes a single endpoint /api that only accepts POST, with the actual action
      encoded inside the request body (RPC style). Which Richardson maturity level is this?
    options:
      - "Level 1 - Resources"
      - "Level 2 - HTTP Verbs"
      - "Level 3 - Hypermedia Controls"
      - "Level 0 - The Swamp of POX"
    answer: 3
    explanation: |
      A single URI and a single verb with the operation tunneled through the body is Level 0
      (RPC/SOAP-style over HTTP). Distinct resource URIs are Level 1; proper verbs and status
      codes are Level 2.
    ref: "concepts.md#rest-principles--richardson-maturity-model"
  - id: spring-mvc-rest-apis-028
    difficulty: beginner
    tags: [http-status, codes]
    question: |
      Which HTTP status code is most appropriate for a successful DELETE that returns no
      response body?
    options:
      - "200 OK with an empty body"
      - "204 No Content"
      - "202 Accepted"
      - "205 Reset Content"
    answer: 1
    explanation: |
      204 No Content signals success with intentionally no body, which fits a DELETE (or a
      PUT) that has nothing to return. 202 Accepted implies asynchronous processing not yet
      complete.
    ref: "concepts.md#http-methods--status-codes"
  - id: spring-mvc-rest-apis-029
    difficulty: intermediate
    tags: [http-status, auth]
    question: |
      A request reaches an endpoint with valid authentication, but the user lacks permission
      for the action. Which status code is correct?
    options:
      - "400 Bad Request"
      - "401 Unauthorized"
      - "403 Forbidden"
      - "409 Conflict"
    answer: 2
    explanation: |
      403 Forbidden means the server knows who you are but you may not perform the action.
      401 Unauthorized means authentication is missing or invalid ("who are you"). This
      401-vs-403 distinction is a classic trap.
    ref: "concepts.md#http-methods--status-codes"
  - id: spring-mvc-rest-apis-030
    difficulty: intermediate
    tags: [http-status, content-negotiation]
    question: |
      A client sends Accept: application/xml but the server can only produce JSON for that
      endpoint. Which status code should be returned?
    options:
      - "406 Not Acceptable"
      - "400 Bad Request"
      - "422 Unprocessable Entity"
      - "415 Unsupported Media Type"
    answer: 0
    explanation: |
      406 Not Acceptable indicates the server cannot produce a representation matching the
      client's Accept header. 415 is the mirror case: the server cannot consume the request
      body's Content-Type.
    ref: "concepts.md#http-methods--status-codes"
  - id: spring-mvc-rest-apis-031
    difficulty: advanced
    tags: [http-status, validation]
    question: |
      Which status code is commonly used for a syntactically valid request whose content
      fails business/semantic validation (e.g. bean validation errors)?
    options:
      - "404 Not Found, since the validated resource cannot be located"
      - "409 Conflict only, because the payload conflicts with existing state"
      - "500 Internal Server Error, as validation faults are server-side"
      - "400 Bad Request or 422 Unprocessable Entity"
    answer: 3
    explanation: |
      Validation failures are typically 400 Bad Request; 422 Unprocessable Entity is also
      widely used for well-formed requests that are semantically invalid. Spring's default
      for MethodArgumentNotValidException is 400.
    ref: "concepts.md#http-methods--status-codes"
  - id: spring-mvc-rest-apis-032
    difficulty: beginner
    tags: [idempotency, http-methods]
    question: |
      Which of these HTTP methods is NOT guaranteed to be idempotent by the HTTP spec?
    options:
      - "DELETE"
      - "POST"
      - "GET"
      - "PUT"
    answer: 1
    explanation: |
      POST is not idempotent — repeating it may create multiple resources or trigger the
      action repeatedly. GET, PUT, and DELETE are idempotent (repeating yields the same
      server state).
    ref: "concepts.md#idempotency"
  - id: spring-mvc-rest-apis-033
    difficulty: advanced
    tags: [idempotency, delete]
    question: |
      Is DELETE still considered idempotent even though calling it twice may return 200 the
      first time and 404 the second?
    options:
      - "Yes — idempotency concerns the resulting server state (resource absent), not identical responses"
      - "Only if the server returns 204 both times, since idempotency is formally defined by identical status codes"
      - "DELETE is never idempotent, because deleting an already-deleted resource is a distinct second effect"
      - "No — the differing 200-then-404 status codes prove the two calls produced different outcomes"
    answer: 0
    explanation: |
      Idempotency is about the effect on server state: after one or many DELETEs the resource
      is gone. The second call returning 404 is fine; the response need not be identical.
    ref: "concepts.md#idempotency"
  - id: spring-mvc-rest-apis-034
    difficulty: advanced
    tags: [idempotency, post, retries]
    question: |
      You must make POST /payments safe to retry after network failures without charging a
      customer twice. What is the standard approach?
    options:
      - "Return 204 No Content so clients treat the charge as final and never issue a retry"
      - "Change the endpoint to use GET, since GET is idempotent and safely repeatable on failure"
      - "Have clients send an Idempotency-Key header and dedupe repeated keys on the server"
      - "Wrap the POST in a single database transaction, which alone makes retried charges safe"
    answer: 2
    explanation: |
      Since POST is inherently non-idempotent, you add an idempotency key: the client sends a
      unique Idempotency-Key header and the server records processed keys, returning the
      original result for retries instead of reprocessing.
    ref: "concepts.md#idempotency"
  - id: spring-mvc-rest-apis-035
    difficulty: intermediate
    tags: [put, patch, semantics]
    question: |
      A client wants to update only the 'email' field of /users/42 and leave all other
      fields unchanged. Which method and semantics are most appropriate?
    options:
      - "PUT with only the email field, which is correct because PUT merges partial data into the existing resource"
      - "PATCH with just the email field, since PATCH performs a partial update leaving other fields unchanged"
      - "POST to /users/42 with only the email field, since POST on an existing URI updates just the supplied attribute"
      - "GET with the email supplied as a query parameter, which instructs the server to store that new value"
    answer: 1
    explanation: |
      PATCH is designed for partial updates. Sending a partial body with PUT is risky because
      PUT replaces the entire resource, so unspecified fields may be nulled out — PUT expects
      the complete representation.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-036
    difficulty: intermediate
    tags: [put, post, create]
    question: |
      Which statement about PUT vs POST for resource creation is correct?
    options:
      - "Only POST can ever create a resource, because the HTTP spec reserves PUT strictly for updates to existing resources"
      - "PUT must never be used to create resources, since a client is not permitted to choose the URI of a new resource"
      - "POST is idempotent and PUT is not, so POST is the safe choice for retrying a creation after a network failure"
      - "POST typically creates a resource where the server assigns the ID (201 + Location); PUT can create/replace at a client-known URI and is idempotent"
    answer: 3
    explanation: |
      POST to a collection lets the server assign the identifier and returns 201 with a
      Location header. PUT targets a specific known URI, sends the full representation, can
      create or fully replace, and is idempotent.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-037
    difficulty: advanced
    tags: [patch, media-types]
    question: |
      Which media type corresponds to the JSON Patch (RFC 6902) format — an array of
      operations like add/remove/replace?
    options:
      - "application/json-patch+json"
      - "application/x-www-form-urlencoded"
      - "application/vnd.api+json"
      - "application/merge-patch+json"
    answer: 0
    explanation: |
      JSON Patch (RFC 6902) uses application/json-patch+json and expresses a sequence of
      operations. JSON Merge Patch (RFC 7386) uses application/merge-patch+json, where you
      send a partial document and nulls delete fields.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-038
    difficulty: intermediate
    tags: [dto, entities, security]
    question: |
      Why is it generally recommended to expose DTOs rather than JPA entities directly from
      REST controllers?
    options:
      - "Spring's DispatcherServlet actively forbids returning JPA-managed entities and throws an IllegalStateException at startup if it detects one"
      - "DTOs are always faster to serialize than entities because Jackson caches their reflection metadata whereas entity proxies are re-introspected every request"
      - "DTOs decouple the API contract from persistence, prevent mass-assignment/over-exposure, and avoid lazy-loading (LazyInitializationException / N+1) during serialization"
      - "Entities cannot be serialized to JSON at all, since Hibernate proxies lack the no-arg getters Jackson's default introspector strictly requires"
    answer: 2
    explanation: |
      DTOs isolate the API from schema changes, prevent binding untrusted input onto entities
      (mass assignment), avoid exposing sensitive fields, and sidestep lazy-loading problems
      that can occur when Jackson serializes an entity after the transaction closed.
    ref: "concepts.md#dto-data-transfer-objects"
  - id: spring-mvc-rest-apis-039
    difficulty: advanced
    tags: [dto, mapping]
    question: |
      Which statement about DTO mapping approaches is accurate?
    options:
      - "MapStruct maps at runtime via reflection while ModelMapper generates its mapping code at compile time"
      - "Both MapStruct and ModelMapper require the entity and its DTO to be declared as the same class"
      - "Java records cannot be used as DTOs because their final fields cannot be populated by MapStruct's setter-based mappers"
      - "MapStruct generates mapping code at compile time, whereas ModelMapper maps at runtime via reflection"
    answer: 3
    explanation: |
      MapStruct is an annotation processor that generates mapping code at compile time (fast,
      type-safe). ModelMapper performs mapping at runtime using reflection/conventions. Java
      records are excellent concise immutable DTOs.
    ref: "concepts.md#dto-data-transfer-objects"
  - id: spring-mvc-rest-apis-040
    difficulty: intermediate
    tags: [content-negotiation, accept]
    question: |
      What is the default and preferred strategy Spring uses for content negotiation?
    options:
      - "URL path extension (.json / .xml)"
      - "The Accept request header"
      - "A required 'format' query parameter"
      - "The Content-Type of the response"
    answer: 1
    explanation: |
      Spring's default preferred strategy is the Accept header. Path-extension negotiation is
      disabled by default (security), and query-parameter negotiation (favor-parameter) must
      be explicitly enabled.
    ref: "concepts.md#content-negotiation-json-vs-xml"
  - id: spring-mvc-rest-apis-041
    difficulty: intermediate
    tags: [content-negotiation, xml, jackson]
    question: |
      A Spring Boot REST app returns JSON fine but returns 406 when a client sends
      Accept: application/xml. What is the most likely fix?
    options:
      - "Disable content negotiation entirely so Spring ignores the Accept header and always falls back to JSON"
      - "Add @ResponseBody to every controller method so Spring re-runs message-converter selection for XML"
      - "Add jackson-dataformat-xml (or JAXB) to the classpath so an XML HttpMessageConverter is registered"
      - "Set produces = \"application/json\" on every controller so Spring auto-transcodes the response to XML"
    answer: 2
    explanation: |
      Out of the box only JSON is supported. Adding jackson-dataformat-xml (or a JAXB provider)
      registers an XML converter, letting the same controller serve XML based on the Accept
      header. Without it, an XML Accept yields 406 Not Acceptable.
    ref: "concepts.md#content-negotiation-json-vs-xml"
  - id: spring-mvc-rest-apis-042
    difficulty: beginner
    tags: [pagination, spring-data]
    question: |
      Which query parameters does Spring Data's Pageable argument resolver bind by default?
    options:
      - "page, size, sort"
      - "start, count, direction"
      - "from, to, sortBy"
      - "offset, limit, order"
    answer: 0
    explanation: |
      PageableHandlerMethodArgumentResolver binds page, size, and sort (e.g.
      ?page=0&size=20&sort=name,asc). Defaults and one-indexed behavior are configurable via
      spring.data.web.pageable.* properties.
    ref: "concepts.md#pagination-sorting--filtering"
  - id: spring-mvc-rest-apis-043
    difficulty: advanced
    tags: [pagination, page, slice]
    question: |
      What is the key difference between returning a Page<T> and a Slice<T> from a paginated
      Spring Data query?
    options:
      - "Slice<T> always loads every matching row into memory up front and then discards those beyond the requested page size"
      - "There is no functional difference; Slice<T> is merely a deprecated type alias retained for backward compatibility"
      - "Page<T> returns an immutable snapshot while Slice<T> exposes a mutable list whose contents can be edited and re-saved"
      - "Page<T> executes an additional count query for total elements; Slice<T> only knows whether a next page exists (no count query)"
    answer: 3
    explanation: |
      Page<T> carries total element/page counts and therefore runs an extra COUNT query,
      while Slice<T> avoids the count and only determines if there is a next slice — cheaper
      for infinite-scroll style paging.
    ref: "concepts.md#pagination-sorting--filtering"
  - id: spring-mvc-rest-apis-044
    difficulty: advanced
    tags: [pagination, keyset, performance]
    question: |
      Why can deep OFFSET-based pagination (e.g. page 5000 of size 20) be problematic
      compared to keyset/cursor pagination?
    options:
      - "OFFSET pagination cannot be combined with an ORDER BY clause, because the database applies the offset before it sorts the result set"
      - "The database must scan and discard all preceding rows (slow), and rows can be skipped or duplicated if data changes between page requests"
      - "Keyset pagination requires loading the full table into memory so the driver can index directly to the requested cursor position"
      - "OFFSET pagination always returns duplicate rows on every page regardless of whether the underlying data changes between requests"
    answer: 1
    explanation: |
      Large OFFSETs force the DB to walk and throw away all rows before the window, growing
      slower with depth, and concurrent inserts/deletes can cause missed or duplicated rows.
      Keyset (WHERE id > lastId) pagination avoids both issues.
    ref: "concepts.md#pagination-sorting--filtering"
  - id: spring-mvc-rest-apis-045
    difficulty: intermediate
    tags: [api-versioning, strategies]
    question: |
      Which of the following is a recognized API versioning strategy along with a valid
      trade-off?
    options:
      - "URI path versioning (/api/v1/users): simple and cacheable, but arguably impure since a resource URI should be stable"
      - "Recompiling and redeploying every client application whenever a new API version ships so old versions disappear"
      - "Randomizing the endpoint URL on every request so that each API version is served from an unpredictable path"
      - "Storing the API version number only in a database column and looking it up per request to reshape the response"
    answer: 0
    explanation: |
      URI path versioning (/api/v1/...) is the most common approach: simple, visible, and
      cache-friendly, though purists argue a resource's URI should remain stable. Other
      strategies include query param, custom header, and media-type (Accept) versioning.
    ref: "concepts.md#api-versioning"
  - id: spring-mvc-rest-apis-046
    difficulty: advanced
    tags: [api-versioning, media-type]
    question: |
      Which Accept header value represents media-type (content negotiation) based API
      versioning?
    options:
      - "Accept: */*; v=1"
      - "Accept: application/json; charset=utf-8"
      - "Accept: application/vnd.myapp.v1+json"
      - "Accept: version/1"
    answer: 2
    explanation: |
      Media-type versioning uses a vendor-specific media type like
      application/vnd.myapp.v1+json, letting the same URI serve different versions via
      content negotiation. It is RESTful but verbose and awkward to test in a browser.
    ref: "concepts.md#api-versioning"
  - id: spring-mvc-rest-apis-047
    difficulty: beginner
    tags: [hateoas]
    question: |
      What does HATEOAS stand for and provide?
    options:
      - "A server-side caching layer that stores rendered HTTP responses so identical REST requests can be replayed without recomputation"
      - "Hypermedia As The Engine Of Application State — the server embeds links so clients discover available actions dynamically"
      - "A client-side load-balancing algorithm that spreads REST calls across service instances using response-time weighting"
      - "A JSON schema validation standard that enforces the structure of request and response bodies at the API gateway"
    answer: 1
    explanation: |
      HATEOAS (Hypermedia As The Engine Of Application State) is Richardson Level 3: responses
      include links (relations) that tell the client which transitions/actions are available,
      reducing hardcoded URI coupling.
    ref: "concepts.md#hateoas"
  - id: spring-mvc-rest-apis-048
    difficulty: intermediate
    tags: [hateoas, spring-hateoas, hal]
    question: |
      What is the default hypermedia media type produced by Spring HATEOAS?
    options:
      - "application/vnd.api+json (JSON:API)"
      - "text/uri-list"
      - "application/xml"
      - "application/hal+json (HAL)"
    answer: 3
    explanation: |
      Spring HATEOAS defaults to HAL (application/hal+json), using _links and _embedded
      structures. It provides EntityModel, CollectionModel, PagedModel, Link, and
      WebMvcLinkBuilder (linkTo/methodOn) to build links.
    ref: "concepts.md#hateoas"
  - id: spring-mvc-rest-apis-049
    difficulty: intermediate
    tags: [filters, interceptors, comparison]
    question: |
      Which statement correctly contrasts a servlet Filter with a Spring HandlerInterceptor?
    options:
      - "A Filter operates at the servlet-container level and can wrap the request/response for any resource; an interceptor runs inside the DispatcherServlet and has access to the chosen handler"
      - "Filters expose the preHandle, postHandle, and afterCompletion callbacks, while interceptors only offer a single doFilter method wrapping the chain"
      - "Filters can inspect the resolved target @RequestMapping handler method and its annotations, whereas interceptors run too early to know the handler"
      - "Interceptors run at the servlet-container level before the DispatcherServlet, so they can filter static-resource requests that never reach Spring MVC"
    answer: 0
    explanation: |
      Filters (jakarta.servlet.Filter) run in the container around the DispatcherServlet and
      can wrap/short-circuit any request. HandlerInterceptors run inside Spring MVC, know the
      target handler, and expose preHandle/postHandle/afterCompletion.
    ref: "concepts.md#filters-vs-interceptors"
  - id: spring-mvc-rest-apis-050
    difficulty: advanced
    tags: [filters, spring-security, ordering]
    question: |
      Spring Security's authentication runs in a filter chain (FilterChainProxy). What does
      this imply about a custom HandlerInterceptor attempting to authenticate requests?
    options:
      - "Spring Security is implemented as a HandlerInterceptor rather than a servlet filter, so it shares the interceptor execution stage"
      - "The custom interceptor runs before the Security filter chain, so it can fully authenticate the request before Security ever sees it"
      - "Security filters run before the DispatcherServlet and thus before any interceptor, so the interceptor cannot authenticate ahead of Security"
      - "Interceptors and filters run in a nondeterministic order that changes per request, so authentication timing cannot be relied upon"
    answer: 2
    explanation: |
      Because Spring Security is built on servlet filters that execute before the
      DispatcherServlet, they run before HandlerInterceptors. An interceptor therefore cannot
      perform authentication earlier than Security's filter chain.
    ref: "concepts.md#filters-vs-interceptors"
  - id: spring-mvc-rest-apis-051
    difficulty: beginner
    tags: [cors, same-origin]
    question: |
      What is CORS fundamentally about?
    options:
      - "A server-side rate-limiting technique that throttles how many cross-origin requests a single client may issue per minute"
      - "A negotiated way to compress HTTP response bodies exchanged between a browser and a server on a different origin"
      - "A protocol for encrypting traffic between microservices so cross-origin API calls travel over an authenticated channel"
      - "A browser mechanism that relaxes the same-origin policy so a page from one origin may call an API on another origin"
    answer: 3
    explanation: |
      CORS (Cross-Origin Resource Sharing) is enforced by the browser to relax the same-origin
      policy, using response headers the server sends (Access-Control-Allow-*) to declare which
      cross-origin requests are permitted.
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-052
    difficulty: advanced
    tags: [cors, credentials, gotcha]
    question: |
      A developer configures CORS with allowCredentials(true) and allowedOrigins("*") and the
      app fails at startup or requests are rejected. Why, and what is the fix?
    options:
      - "Credentialed CORS requests are only permitted over HTTPS, so switching the endpoint to TLS resolves the wildcard-origin rejection"
      - "The spec/Spring forbids combining credentials with the wildcard origin \"*\"; use allowedOriginPatterns instead"
      - "The allowCredentials setting must be supplied as the String \"true\" rather than a boolean, which is why startup fails"
      - "You must also set allowedMethods to the wildcard \"*\" alongside the origin wildcard for the combination to be accepted"
    answer: 1
    explanation: |
      When credentials are allowed, the wildcard "*" origin is not permitted by the CORS spec,
      and Spring rejects the combination. Use allowedOriginPatterns (which supports patterns)
      together with allowCredentials(true).
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-053
    difficulty: advanced
    tags: [cors, preflight]
    question: |
      Which HTTP request does a browser send as a CORS preflight, and what triggers it?
    options:
      - "A CONNECT request carrying Access-Control-Request-Credentials, sent whenever a cross-origin call includes cookies"
      - "A HEAD request with Access-Control-Request-Method, sent automatically before every single cross-origin call"
      - "An OPTIONS request with Access-Control-Request-Method/-Headers, sent for non-simple cross-origin requests"
      - "A TRACE request echoing the Access-Control-Request-Headers, sent only when the actual request uses POST"
    answer: 2
    explanation: |
      For non-simple requests (custom headers, methods like PUT/DELETE, or non-simple
      content types) the browser first sends an OPTIONS preflight carrying
      Access-Control-Request-Method and -Headers; the server must answer with matching
      Access-Control-Allow-* headers. Simple GET/POST requests skip preflight.
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-054
    difficulty: intermediate
    tags: [cors, spring-security]
    question: |
      With Spring Security enabled, a valid @CrossOrigin/global CORS config still results in
      blocked preflight requests. What is the typical cause?
    options:
      - "CORS was not enabled in the Security filter chain (http.cors(...)), so security filters block the preflight before MVC handles it"
      - "Spring Security is fundamentally incompatible with CORS, so cross-origin requests can never be permitted once its filter chain is active"
      - "The target controller method is missing @ResponseBody, so the preflight OPTIONS response has no body for the browser to validate"
      - "CORS enforcement must be disabled in the browser via a launch flag before Spring Security will allow the preflight through"
    answer: 0
    explanation: |
      Because Security filters run before the DispatcherServlet, you must enable CORS within
      the security chain (http.cors(...) plus a CorsConfigurationSource bean); otherwise the
      preflight is blocked before MVC's CORS handling runs.
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-055
    difficulty: intermediate
    tags: [request-lifecycle, once-per-request]
    question: |
      Why might you extend OncePerRequestFilter instead of implementing Filter directly?
    options:
      - "It always runs only after every HandlerInterceptor has finished its postHandle callback"
      - "It bypasses the DispatcherServlet entirely and writes the response before any dispatch occurs"
      - "It automatically converts every handler return value into a JSON response body for you"
      - "It guarantees the filter logic executes exactly once per request even across forwards/includes"
    answer: 3
    explanation: |
      OncePerRequestFilter ensures the doFilterInternal body runs a single time per request,
      avoiding duplicate execution when the request is dispatched again via forward/include —
      useful for logging, auth, and tracing filters.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-056
    difficulty: advanced
    tags: [http-status, redirects]
    question: |
      Which statement about redirect status codes is correct?
    options:
      - "301 and 302 both strictly guarantee the original HTTP method and body are preserved on the redirected request by every client"
      - "307 (Temporary) and 308 (Permanent) preserve the original method and body, whereas 301/302 historically may cause clients to switch POST to GET"
      - "304 Not Modified is a redirection status that instructs the client to fetch the resource from a new URI in the Location header"
      - "308 Permanent Redirect downgrades POST to GET, while 301 Moved Permanently always preserves the original request method"
    answer: 1
    explanation: |
      307 and 308 explicitly require the method and body to be preserved on redirect. With 301
      and 302, many clients historically changed POST to GET, which is why 307/308 were
      introduced. 304 is a conditional-GET response, not a URI redirect.
    ref: "concepts.md#http-methods--status-codes"
  - id: spring-mvc-rest-apis-057
    difficulty: beginner
    tags: [content-negotiation, produces]
    question: |
      What does adding produces = "application/json" to a @GetMapping do?
    options:
      - "Restricts the mapping so it only matches when the client's Accept header is compatible with application/json, and hints the response media type"
      - "Enables the endpoint to additionally emit XML output alongside JSON whenever the client negotiates it"
      - "Adds a Location response header pointing at the JSON representation of the created resource"
      - "Forces the incoming request body to be parsed as JSON regardless of its declared Content-Type header"
    answer: 0
    explanation: |
      produces narrows the mapping to requests whose Accept header is compatible with the
      given media type and indicates the produced representation. A non-matching Accept leads
      to 406 Not Acceptable.
    ref: "concepts.md#content-negotiation-json-vs-xml"
  - id: spring-mvc-rest-apis-058
    difficulty: intermediate
    tags: [pagination, page-serialization]
    question: |
      Why is directly serializing a Spring Data PageImpl to JSON discouraged for a stable API
      contract, and what is a recommended alternative?
    options:
      - "You must return a Slice instead, because only Slice guarantees a stable, versioned JSON serialization format"
      - "PageImpl cannot be serialized by Jackson at all, so you must unwrap it and return a plain List of content"
      - "The raw PageImpl JSON structure is not guaranteed to be stable across versions; use PagedModel (or a dedicated response DTO) to control the shape"
      - "PageImpl always omits the content array from its JSON, exposing only the paging metadata to the client"
    answer: 2
    explanation: |
      Spring explicitly warns that the serialized JSON of PageImpl is not a stable contract and
      may change. Wrapping results in PagedModel (Spring HATEOAS / Spring Data) or a custom
      response DTO gives you a stable, controlled representation.
    ref: "concepts.md#pagination-sorting--filtering"
  - id: spring-mvc-rest-apis-059
    difficulty: expert
    tags: [dispatcherservlet, internals, ordering]
    question: |
      A request matches both a controller handler and (separately) triggers an exception
      inside that handler. Within a single doDispatch invocation, in which relative order do
      these run: interceptor.afterCompletion, HandlerExceptionResolver, and the message
      converter that writes the error body?
    options:
      - "afterCompletion runs first, then the HandlerExceptionResolver, then the converter writes the body"
      - "The HandlerExceptionResolver runs (which uses a message converter to write the error body), and only then is afterCompletion called for the interceptors that passed preHandle"
      - "The converter writes the body first, then afterCompletion, then the resolver"
      - "HandlerExceptionResolver and afterCompletion run concurrently on separate threads"
    answer: 1
    explanation: |
      In processDispatchResult, if handling produced an exception, DispatcherServlet invokes the
      HandlerExceptionResolver chain (which, for an @ExceptionHandler returning a body, uses an
      HttpMessageConverter to serialize it). Only afterward does it call
      triggerAfterCompletion, so afterCompletion is the last hook — analogous to a finally block
      wrapping the whole dispatch.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
  - id: spring-mvc-rest-apis-060
    difficulty: expert
    tags: [exception-handling, controlleradvice, ordering]
    question: |
      A controller has a local @ExceptionHandler(RuntimeException.class), and a
      @ControllerAdvice defines @ExceptionHandler(IllegalStateException.class). The handler
      throws an IllegalStateException. Which handler is invoked?
    options:
      - "The controller-local handler, because controller-local @ExceptionHandler methods are always consulted before any @ControllerAdvice, regardless of type specificity"
      - "The @ControllerAdvice handler, because a matching handler for a more specific exception type always overrides a controller-local one"
      - "Neither handler is invoked; the two competing matches create an ambiguity that Spring resolves by returning a 500 error"
      - "Both handlers run in sequence, ordered by their registration order, and the last one's response is written to the client"
    answer: 0
    explanation: |
      Exception resolution first searches the controller's own @ExceptionHandler methods; only if
      none matches does it consult @ControllerAdvice beans. Since the local handler matches
      IllegalStateException (a RuntimeException), it wins even though the advice declares a more
      specific type — locality beats specificity across the controller/advice boundary.
    ref: "concepts.md#exception-handling--controlleradvice"
  - id: spring-mvc-rest-apis-061
    difficulty: expert
    tags: [exception-handling, spring-security, filters]
    question: |
      Spring Security's authentication filter throws an AuthenticationException for an
      unauthenticated request. A @RestControllerAdvice defines an @ExceptionHandler for it, yet
      it never fires. Why?
    options:
      - "@ControllerAdvice can only handle checked exceptions, and AuthenticationException is unchecked so it is ignored"
      - "AuthenticationException is declared final by Spring Security and therefore cannot be caught by any @ExceptionHandler"
      - "You must annotate the advice class with @Order(HIGHEST_PRECEDENCE) before its @ExceptionHandler methods will run"
      - "The exception is thrown in the servlet filter chain before the DispatcherServlet selects a handler, so MVC's ExceptionHandlerExceptionResolver never sees it; it must be handled by an AuthenticationEntryPoint"
    answer: 3
    explanation: |
      @ExceptionHandler / @ControllerAdvice only handle exceptions raised after a handler has been
      mapped inside the DispatcherServlet. Security runs as filters ahead of the DispatcherServlet,
      so its exceptions bypass MVC exception resolution entirely — they are handled by
      AuthenticationEntryPoint / AccessDeniedHandler in the security chain.
    ref: "concepts.md#exception-handling--controlleradvice"
  - id: spring-mvc-rest-apis-062
    difficulty: advanced
    tags: [exception-handling, response-status, error-controller]
    question: |
      A custom exception is annotated @ResponseStatus(HttpStatus.NOT_FOUND) and thrown from a
      handler in a Spring Boot app with no @ExceptionHandler for it. What mechanism produces the
      final response?
    options:
      - "An HttpMessageConverter serializes the raw exception object directly into the response body as JSON"
      - "The DispatcherServlet swallows the exception and returns a 200 OK response with an empty body"
      - "ResponseStatusExceptionResolver calls response.sendError(404), which triggers a forward to /error handled by BasicErrorController"
      - "A ViewResolver resolves the exception's fully qualified class name as a logical view and renders it"
    answer: 2
    explanation: |
      ResponseStatusExceptionResolver honors @ResponseStatus by invoking sendError with the status.
      In Boot that error dispatch is forwarded to /error, where BasicErrorController produces the
      default JSON/HTML error body. Throwing ResponseStatusException is the programmatic equivalent.
    ref: "concepts.md#exception-handling--controlleradvice"
  - id: spring-mvc-rest-apis-063
    difficulty: advanced
    tags: [exception-handling, problemdetail, rfc9457]
    question: |
      What is the correct media type and a distinguishing field set for a Spring 6 ProblemDetail
      (RFC 9457) error response?
    options:
      - "application/json with the fields error, message, timestamp, and path defined by the RFC"
      - "application/problem+json with fields type, title, status, detail, instance (plus custom properties)"
      - "text/plain containing the raw server-side stack trace of the exception that was thrown"
      - "application/hal+json carrying _links that point to the human-readable error documentation"
    answer: 1
    explanation: |
      RFC 9457 (which obsoletes RFC 7807) defines application/problem+json with the members type,
      title, status, detail, and instance, plus extensible custom properties. Spring's ProblemDetail
      models exactly this and ResponseEntityExceptionHandler renders it for built-in exceptions.
    ref: "concepts.md#exception-handling--controlleradvice"
  - id: spring-mvc-rest-apis-064
    difficulty: expert
    tags: [exception-handling, gotcha]
    question: |
      An @ExceptionHandler method itself throws a new exception while building the error response.
      What happens?
    options:
      - "The new exception is re-dispatched through the HandlerExceptionResolver chain and matched against other @ExceptionHandler methods"
      - "Spring silently swallows the new exception and returns a 200 OK response to the client"
      - "The new exception propagates out of the resolver to the servlet container, typically surfacing as a raw 500 (and in Boot, /error)"
      - "The original exception is caught again and its formatted error response is returned instead"
    answer: 2
    explanation: |
      Exceptions thrown from within an @ExceptionHandler are not recursively fed back through the
      exception resolvers. They propagate up to the container, so you generally lose your nice
      formatted error and get the container/Boot default error handling. Keep exception handlers
      defensive and side-effect-free.
    ref: "concepts.md#exception-handling--controlleradvice"
  - id: spring-mvc-rest-apis-065
    difficulty: expert
    tags: [validation, method-validation, spring61]
    question: |
      In Spring Framework 6.1+, a controller (NOT annotated @Validated at class level) has a
      method: getUser(@RequestParam @Min(1) int id). A request sends id=0. Which exception is
      raised and what status results by default?
    options:
      - "ConstraintViolationException, surfacing as 500 because no AOP validation proxy is configured for the bean"
      - "MethodArgumentNotValidException, which the DefaultHandlerExceptionResolver maps to a 400 Bad Request"
      - "No exception is raised at all; the out-of-range id is silently clamped up to the minimum value of 1"
      - "HandlerMethodValidationException, 400 (built-in MVC method validation, no class-level @Validated needed)"
    answer: 3
    explanation: |
      Spring 6.1 added built-in MVC method validation: constraint annotations directly on method
      parameters are detected without a class-level @Validated and raise
      HandlerMethodValidationException, which DefaultHandlerExceptionResolver maps to 400.
      MethodArgumentNotValidException is for @Valid on a whole @RequestBody/@ModelAttribute object.
    ref: "concepts.md#bean-validation--method-validation"
  - id: spring-mvc-rest-apis-066
    difficulty: expert
    tags: [validation, validated, legacy, status-code]
    question: |
      The same @Min(1) constraint on a @RequestParam surfaces as a 500 in one service and a 400
      in another. Which explanation is most plausible?
    options:
      - "The 500 service keeps a class-level @Validated, using the pre-6.1 AOP-proxy path that throws ConstraintViolationException (unhandled → 500); the 400 service relies on Spring 6.1 built-in method validation (HandlerMethodValidationException → 400)"
      - "One service maps the endpoint to GET and the other to POST, and only POST triggers full constraint validation"
      - "The 500 service binds parameters into Java records while the 400 service uses classes, and records skip validation"
      - "ConstraintViolationException always maps to 400 automatically, so the 500 must instead be an unrelated bug inside Jackson"
    answer: 0
    explanation: |
      Leaving class-level @Validated on the controller keeps the older AOP method-validation
      interceptor, which throws jakarta ConstraintViolationException; without an @ExceptionHandler
      for it, that is a 500. Removing @Validated lets Spring 6.1's built-in MVC method validation
      run, producing HandlerMethodValidationException → 400. This version/config nuance is a classic
      trap.
    ref: "concepts.md#bean-validation--method-validation"
  - id: spring-mvc-rest-apis-067
    difficulty: advanced
    tags: [validation, binding-result]
    question: |
      A handler is create(@Valid @RequestBody UserDto dto, BindingResult errors). The body fails
      validation. What happens?
    options:
      - "MethodArgumentNotValidException is thrown before the method body runs"
      - "A 422 is returned automatically without entering the method"
      - "The dto is set to null and the method runs"
      - "The method IS invoked and you must inspect errors.hasErrors() yourself, because a BindingResult/Errors parameter immediately follows the validated argument"
    answer: 3
    explanation: |
      When an Errors/BindingResult parameter immediately follows a validated argument, Spring does
      NOT throw; it hands you the errors so you can decide how to respond. Remove the BindingResult
      and the same failure becomes a thrown MethodArgumentNotValidException (→ 400).
    ref: "concepts.md#bean-validation--method-validation"
  - id: spring-mvc-rest-apis-068
    difficulty: advanced
    tags: [validation, valid, validated, groups]
    question: |
      Which statement about @Valid vs @Validated is correct?
    options:
      - "@Valid (Jakarta) supports selecting validation groups via a value attribute, whereas @Validated (Spring) does not"
      - "@Validated (Spring) supports validation groups and can be placed on parameters/classes; @Valid (Jakarta) triggers cascade but has no group attribute"
      - "They are identical aliases for the same annotation and can be swapped interchangeably in every context"
      - "@Valid can only be placed on a @RequestBody parameter, while @Validated may only be placed on a @RequestParam"
    answer: 1
    explanation: |
      @Validated is Spring's variant that adds a value() attribute for validation groups
      (e.g. @Validated(OnCreate.class)). @Valid is the standard Jakarta annotation that triggers
      cascaded/nested validation but cannot select groups. Both can validate a @RequestBody object.
    ref: "concepts.md#bean-validation--method-validation"
  - id: spring-mvc-rest-apis-069
    difficulty: expert
    tags: [async, threading, deferredresult]
    question: |
      A handler returns a DeferredResult<String> and stores it; a message-listener thread later
      calls setResult("ok"). Which statement about thread usage is accurate?
    options:
      - "The controller returns on the initial container thread (which is then released to the pool); setResult runs on the external listener thread and triggers an ASYNC dispatch onto a fresh container thread to write the response"
      - "The controller method and the later setResult call both execute on the very same servlet container thread from the pool"
      - "The controller blocks and holds its container thread the entire time, only returning once setResult has finally been called"
      - "setResult must be invoked from within Spring's configured AsyncTaskExecutor, otherwise the completion is silently ignored"
    answer: 0
    explanation: |
      With DeferredResult, after the controller returns Spring calls startAsync and the original
      container thread unwinds back to the pool. Any application thread may call setResult; that
      completes the DeferredResult and dispatches back (ASYNC) onto a container thread to serialize
      and write the body. Unlike Callable, Spring does not run any work on its executor here.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-070
    difficulty: expert
    tags: [async, interceptors, threadlocal]
    question: |
      A timing HandlerInterceptor stores System.nanoTime() in a ThreadLocal in preHandle and reads
      it in afterCompletion. Controllers returning Callable now report garbage timings or misses.
      Why?
    options:
      - "ThreadLocal storage is deprecated in Spring 6, so interceptor values stored in it are cleared before afterCompletion runs"
      - "Returning a Callable disables all HandlerInterceptors for that request, so preHandle never actually stores the timestamp"
      - "preHandle is skipped entirely for async handlers, so the ThreadLocal is never populated in the first place for Callable"
      - "Under async, the interceptor gets afterConcurrentHandlingStarted on the initial thread instead of afterCompletion; afterCompletion later runs on a different (ASYNC-dispatch) container thread, where the original thread's ThreadLocal is absent"
    answer: 3
    explanation: |
      For async handlers, AsyncHandlerInterceptor.afterConcurrentHandlingStarted fires on the
      initial request thread in place of postHandle/afterCompletion. The real postHandle/
      afterCompletion run later during the ASYNC dispatch on a potentially different container
      thread, so a ThreadLocal set in preHandle on the first thread is not visible — the timing
      breaks. Use request attributes or CallableProcessingInterceptor instead.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-071
    difficulty: advanced
    tags: [async, callable, deferredresult, comparison]
    question: |
      What is the key difference between returning Callable<T> and DeferredResult<T> from an MVC
      handler?
    options:
      - "Callable is fully reactive and non-blocking, whereas DeferredResult always blocks the container thread until completion"
      - "DeferredResult can only ever be parameterized as DeferredResult<Void> and therefore cannot carry a response body"
      - "Callable is submitted by Spring to its AsyncTaskExecutor (Spring owns the thread); DeferredResult is completed by arbitrary application code from any thread (you own completion)"
      - "Callable cannot be combined with @ResponseBody, so its resolved value is treated as a logical view name instead"
    answer: 2
    explanation: |
      With Callable, Spring runs the task on its configured AsyncTaskExecutor. With DeferredResult,
      Spring does not execute anything; you complete it from whatever thread produces the value
      (a message arrives, another service responds, etc.), which decouples completion from any
      particular executor.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-072
    difficulty: expert
    tags: [async, security, context-propagation]
    question: |
      A Callable-returning handler calls a downstream service that relies on
      SecurityContextHolder, but the SecurityContext is empty on the executor thread. What is the
      root cause and a correct remedy?
    options:
      - "SecurityContextHolder uses a ThreadLocal that is not automatically propagated to Spring's async executor thread; propagate it (e.g. DelegatingSecurityContextRunnable / MODE_INHERITABLETHREADLOCAL / context-propagation) "
      - "The SecurityContext is null because @Async is mandatory for async handlers; adding @Async to the controller method fixes it"
      - "You must migrate the endpoint to WebFlux, because Spring MVC can never access the SecurityContext during async processing"
      - "The SecurityContext is actually populated correctly on the executor thread; the downstream service itself is simply misconfigured"
    answer: 0
    explanation: |
      SecurityContextHolder, RequestContextHolder, and transaction state are ThreadLocal-based and
      do not cross to the async executor thread automatically. Propagate the context explicitly
      (DelegatingSecurityContextRunnable, an inheritable strategy, or Micrometer context
      propagation) so the downstream call sees the authenticated principal.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-073
    difficulty: advanced
    tags: [async, streaming, sse]
    question: |
      When streaming with SseEmitter and the client disconnects mid-stream, what is the correct
      handling contract?
    options:
      - "Register an AsyncListener yourself and call emitter.complete() the instant its onError callback fires, because Spring leaves closing the emitter entirely to application code after a client disconnect"
      - "The JVM raises a SIGPIPE signal on the writing thread, which you must trap with a native signal handler and then invoke emitter.completeWithError() to unwind the broken stream cleanly"
      - "A send() to the dead connection throws IOException; you should NOT call complete()/completeWithError() yourself — the container fires an AsyncListener error and Spring calls completeWithError for you"
      - "Spring transparently retries the failed send up to three times using an exponential backoff, and only then silently completes the emitter without ever surfacing an error to your code"
    answer: 2
    explanation: |
      The Servlet API gives no disconnect callback; you only learn of it when a write fails with
      IOException. Per Spring's guidance you must not then call complete/completeWithError yourself;
      the container's AsyncListener onError fires and Spring invokes completeWithError, dispatching
      back through exception handling.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-074
    difficulty: advanced
    tags: [async, executor, performance]
    question: |
      Why is Spring MVC's default async task executor considered unsuitable for production load,
      and what is the fix?
    options:
      - "It defaults to a fixed pool of exactly one worker thread, so async requests queue up serially; the fix is simply to raise that pool size to two threads via configureAsyncSupport"
      - "It actually executes every Callable back on the original Tomcat container thread rather than a separate worker, which quietly defeats the whole purpose of async dispatch under load"
      - "It silently supports only Callable return values and throws an UnsupportedOperationException whenever a handler returns a DeferredResult, forcing you to switch return types"
      - "The default SimpleAsyncTaskExecutor creates a new thread per task with no pooling/backpressure, risking thread exhaustion; configure a bounded ThreadPoolTaskExecutor via WebMvcConfigurer#configureAsyncSupport"
    answer: 3
    explanation: |
      By default MVC async uses SimpleAsyncTaskExecutor, which spawns an unbounded number of new
      threads. Under load this exhausts resources. Register a bounded executor (and a default
      timeout) through configureAsyncSupport so Callable/WebAsyncTask work runs on a managed pool.
    ref: "concepts.md#async-request-processing"
  - id: spring-mvc-rest-apis-075
    difficulty: expert
    tags: [message-converter, config, gotcha]
    question: |
      A developer overrides WebMvcConfigurer#configureMessageConverters to add a custom converter,
      and afterwards JSON responses break (String bodies work, objects fail). What is the likely
      cause?
    options:
      - "configureMessageConverters replaces the entire default converter list, so Jackson is no longer registered; they should have used extendMessageConverters to add without wiping defaults"
      - "Custom message converters were deprecated in Spring 6 and are silently dropped from the registry at startup, so any object body now falls back to the String converter only"
      - "The custom converter must additionally be annotated with @Bean and @Primary so the DispatcherServlet promotes it ahead of Jackson during converter selection for objects"
      - "String bodies and object bodies are handled by two independent ObjectMapper instances, and the override accidentally cleared only the one used for arbitrary objects"
    answer: 0
    explanation: |
      configureMessageConverters, when it adds to the passed list, takes over and Spring does NOT
      register the defaults (including MappingJackson2HttpMessageConverter). extendMessageConverters
      lets you append to / reorder the default list without losing Jackson. This is a frequent
      self-inflicted 406/broken-serialization bug.
    ref: "concepts.md#httpmessageconverter--jackson-internals"
  - id: spring-mvc-rest-apis-076
    difficulty: advanced
    tags: [jackson, boot-defaults, deserialization]
    question: |
      A JSON payload contains an extra field not present in the target DTO. With Spring Boot's
      default Jackson configuration, what happens on @RequestBody deserialization?
    options:
      - "A 400 Bad Request is returned, because Spring Boot leaves FAIL_ON_UNKNOWN_PROPERTIES enabled exactly as raw Jackson does out of the box"
      - "The entire DTO is discarded and bound as null, so the handler method receives a null argument in place of the body"
      - "Jackson aborts with a 500 InvalidDefinitionException the moment it encounters the surplus property during deserialization"
      - "The unknown field is silently ignored, because Boot disables FAIL_ON_UNKNOWN_PROPERTIES (unlike raw Jackson defaults)"
    answer: 3
    explanation: |
      Raw Jackson defaults FAIL_ON_UNKNOWN_PROPERTIES to true, but Spring Boot's auto-configuration
      disables it, so unknown JSON properties are ignored by default. This supports tolerant-reader
      evolution. You can re-enable it globally or per class with @JsonIgnoreProperties(ignoreUnknown=false).
    ref: "concepts.md#httpmessageconverter--jackson-internals"
  - id: spring-mvc-rest-apis-077
    difficulty: advanced
    tags: [jackson, dates, jsr310]
    question: |
      Why do Instant/LocalDateTime fields serialize as ISO-8601 strings rather than numeric epoch
      timestamps in a default Spring Boot 3 app?
    options:
      - "Boot registers jackson-datatype-jsr310 and disables WRITE_DATES_AS_TIMESTAMPS, so java.time types render as ISO-8601 by default"
      - "Java records automatically force every java.time field to serialize in ISO-8601 form regardless of the configured Jackson features"
      - "The DispatcherServlet post-processes the response and rewrites any numeric epoch timestamps into ISO-8601 strings before the body is flushed"
      - "The format is effectively undefined behavior and can vary from one request to the next depending on thread scheduling"
    answer: 0
    explanation: |
      Spring Boot auto-registers the JavaTimeModule (jackson-datatype-jsr310) and disables the
      SerializationFeature.WRITE_DATES_AS_TIMESTAMPS, so java.time types serialize as ISO-8601
      strings. Customize via Jackson2ObjectMapperBuilderCustomizer or spring.jackson.* properties.
    ref: "concepts.md#httpmessageconverter--jackson-internals"
  - id: spring-mvc-rest-apis-078
    difficulty: expert
    tags: [message-converter, content-negotiation, ordering]
    question: |
      For a handler with no produces attribute returning a POJO, and a request with
      Accept: application/xml, application/json;q=0.9 where both Jackson JSON and Jackson XML
      converters are present, which representation is written?
    options:
      - "JSON, because the Jackson JSON converter is always registered first in the list and therefore wins every content negotiation outright"
      - "XML, because the client's Accept ranks application/xml higher (q=1.0 implicit) and a converter supports it"
      - "406 Not Acceptable, because two competing converters can both write the POJO and Spring refuses to arbitrate between them"
      - "Whichever converter happened to be registered last in the list, since later entries always override earlier ones during selection"
    answer: 1
    explanation: |
      Content negotiation honors the client's Accept quality values: application/xml has implicit
      q=1.0 and outranks application/json;q=0.9. Spring picks the media type the client prefers that
      a converter can write, so the XML converter is chosen. Converter registration order only
      breaks ties among equally acceptable media types.
    ref: "concepts.md#content-negotiation-json-vs-xml"
  - id: spring-mvc-rest-apis-079
    difficulty: expert
    tags: [thread-safety, controller, concurrency]
    question: |
      A @RestController has a private int requestCount field incremented on each request and
      returned. Under concurrent load the totals are wrong. What is the correct diagnosis?
    options:
      - "Spring instantiates a fresh controller object for every incoming request, so the requestCount field is reset to zero each time and can never accumulate correctly"
      - "@RestController proxies the bean and disables direct instance-field access, routing every read/write through a synchronized accessor that occasionally drops updates"
      - "The field simply needs to be declared static so that all request threads share one storage slot, which by itself makes the increment thread-safe"
      - "The controller is a singleton shared across all request threads; a plain int field is a shared-mutable-state data race (lost updates / visibility). Use an AtomicInteger, a request-scoped bean, or externalize the state"
    answer: 3
    explanation: |
      Controllers are singletons by default and invoked concurrently on many container threads.
      A mutable instance field is shared, so ++ (read-modify-write) races and lacks visibility
      guarantees. Fix with AtomicInteger/AtomicLong, request scope, or an external counter — or keep
      controllers stateless.
    ref: "concepts.md#controller-thread-safety"
  - id: spring-mvc-rest-apis-080
    difficulty: advanced
    tags: [thread-safety, model-attribute, gotcha]
    question: |
      An unannotated complex-type parameter appears in a handler: process(SearchCriteria criteria).
      The developer expected the JSON body to bind, but instead individual query params populate
      the object and the body is ignored. Why?
    options:
      - "An unannotated complex-type parameter defaults to @RequestBody binding, so the JSON body is deserialized into it exactly as the developer expected"
      - "Spring detects the missing annotation and throws an ambiguous-argument exception at startup, refusing to register the handler method until it is annotated"
      - "An unannotated non-simple type is resolved as a @ModelAttribute, bound from request/query/form params — not from the JSON body; add @RequestBody to deserialize the body"
      - "The parameter is always injected as null unless it carries an explicit binding annotation, so neither the body nor the query params ever populate it"
    answer: 2
    explanation: |
      The default argument-resolver chain treats an unannotated complex (non-simple) parameter as an
      @ModelAttribute, binding from request parameters (query string / form fields), not the request
      body. To deserialize a JSON body you must annotate it @RequestBody.
    ref: "concepts.md#ambiguous-mappings--argument-resolution"
  - id: spring-mvc-rest-apis-081
    difficulty: expert
    tags: [request-mapping, ambiguous, specificity]
    question: |
      Two mappings exist: @GetMapping("/users/{id}") and @GetMapping("/users/me"). A request GET
      /users/me arrives. What happens?
    options:
      - "An IllegalStateException for ambiguous handler methods is thrown, because both /users/{id} and /users/me match the path and Spring cannot rank them"
      - "The {id} template handler wins because variable patterns are evaluated first, and the literal value me is bound into the id path variable as a string"
      - "A 300 Multiple Choices response is returned so the client can pick which of the two matching handler mappings it actually wants to invoke"
      - "The literal mapping /users/me wins because it is more specific than the {id} template; the {id} handler is not invoked"
    answer: 3
    explanation: |
      Spring ranks candidate patterns by specificity: a fully literal segment beats a variable
      segment. /users/me is more specific than /users/{id}, so it is selected without ambiguity.
      True ambiguity (equal specificity) is required for the IllegalStateException.
    ref: "concepts.md#ambiguous-mappings--argument-resolution"
  - id: spring-mvc-rest-apis-082
    difficulty: advanced
    tags: [request-mapping, trailing-slash, spring6]
    question: |
      After upgrading to Spring Boot 3 / Spring 6, requests to /users/ (trailing slash) that
      previously hit @GetMapping("/users") now return 404. Why?
    options:
      - "Trailing-slash matching is disabled by default in Spring 6 (setUseTrailingSlashMatch deprecated/removed); /users and /users/ are now distinct, so add an explicit mapping or a redirect"
      - "Trailing slashes became reserved exclusively for WebSocket upgrade endpoints in Spring 6, so a plain MVC GET mapping can no longer match a path ending in one"
      - "The default DispatcherServlet mapping silently changed from / to /app in Boot 3, so every route now requires an extra path prefix to be reachable"
      - "The new PathPattern parser cannot tokenize a trailing slash at all and raises a parse error, so any URL ending in one falls through to a 404"
    answer: 0
    explanation: |
      Spring 6 removed the default lenient trailing-slash matching that older versions provided.
      /users/ no longer implicitly matches /users. To support both you add an explicit route or a
      redirect (e.g. via a filter or configured path matching), rather than relying on the old
      behavior.
    ref: "concepts.md#ambiguous-mappings--argument-resolution"
  - id: spring-mvc-rest-apis-083
    difficulty: expert
    tags: [argument-resolver, ordering, customization]
    question: |
      You add a custom HandlerMethodArgumentResolver via WebMvcConfigurer#addArgumentResolvers to
      change how @RequestParam is resolved, but it never runs for @RequestParam parameters. Why?
    options:
      - "Custom argument resolvers must be declared as an @Bean rather than registered through the configurer, otherwise Spring never scans them into the adapter's resolver list"
      - "@RequestParam is a sealed, framework-internal annotation whose resolution cannot be customized under any circumstances, even by replacing the adapter's resolver list"
      - "Resolvers registered via addArgumentResolvers are appended AFTER the built-in resolvers; the built-in RequestParamMethodArgumentResolver already claims @RequestParam via supportsParameter, so yours is never consulted for it"
      - "The custom resolver must explicitly return null from resolveArgument so the built-ins run first, and only then will Spring loop back and re-consult your resolver"
    answer: 2
    explanation: |
      Custom argument resolvers are added after the default ones in the resolver list, and the first
      resolver whose supportsParameter returns true wins. The built-in @RequestParam resolver
      handles the parameter first, so a custom resolver targeting @RequestParam is never reached.
      Overriding it requires replacing the adapter's resolver list, not appending.
    ref: "concepts.md#ambiguous-mappings--argument-resolution"
  - id: spring-mvc-rest-apis-084
    difficulty: expert
    tags: [etag, conditional, performance]
    question: |
      A team enables ShallowEtagHeaderFilter hoping to reduce server CPU for an expensive endpoint.
      Bandwidth drops on repeat requests but CPU does not. Why, and what actually saves the compute?
    options:
      - "ShallowEtagHeaderFilter only functions over HTTP/2 connections, so upgrading the protocol from HTTP/1.1 is what lets it finally short-circuit the handler and save CPU"
      - "The filter caches the generated body in memory keyed by ETag, so on a repeat request it serves the cached copy and skips the handler entirely, saving compute"
      - "You must additionally enable GZIP response compression, because the ETag hash is only computed over compressed bytes and that is what unlocks the CPU savings"
      - "The shallow filter still executes the handler and generates the full body (then hashes it and may return 304), so it saves bandwidth but not computation; to skip the work, check request.checkNotModified(version/eTag) BEFORE building the body"
    answer: 3
    explanation: |
      ShallowEtagHeaderFilter buffers the fully generated response, computes an MD5 ETag, and
      returns 304 if If-None-Match matches — the handler still ran, so CPU is unchanged. To avoid
      the expensive work, perform an application-level conditional check (e.g.
      ServletWebRequest.checkNotModified) using a cheap version/timestamp and short-circuit before
      producing the body.
    ref: "concepts.md#etags--conditional-requests"
  - id: spring-mvc-rest-apis-085
    difficulty: advanced
    tags: [etag, optimistic-concurrency, status]
    question: |
      A client sends PUT /docs/7 with If-Match: "v3" but the current server ETag is "v5". For
      correct optimistic-concurrency semantics, what should the server return?
    options:
      - "200 OK, applying the write anyway since the server should trust the client's intent even when the supplied If-Match ETag no longer matches"
      - "409 Conflict, treating the mismatched If-Match ETag as a generic resource-state conflict rather than a failed precondition"
      - "412 Precondition Failed, so the stale write is rejected and lost updates are prevented"
      - "304 Not Modified, signalling the client that its cached If-Match version is still current so the update need not be applied"
    answer: 2
    explanation: |
      If-Match expresses a precondition on the current representation. When the supplied ETag no
      longer matches, the precondition fails and the server returns 412 Precondition Failed,
      rejecting the update based on stale state. 304 is for If-None-Match on reads; 409 is a more
      generic conflict not tied to the conditional header.
    ref: "concepts.md#etags--conditional-requests"
  - id: spring-mvc-rest-apis-086
    difficulty: advanced
    tags: [http-status, put, create, idempotency]
    question: |
      A REST API supports PUT /widgets/{clientGeneratedId} to create-or-replace. A client issues
      the identical PUT twice due to a retry. Which behavior is spec-correct?
    options:
      - "The second PUT must return 409 Conflict because the resource already exists"
      - "Because PUT is idempotent, both requests leave the resource in the same final state; the first may return 201 Created and the second 200 OK (or 204), with no duplicate resource"
      - "The second PUT must create a second widget under a freshly server-generated id, since each PUT is treated as an independent create just like a repeated POST would be"
      - "PUT is forbidden from creating resources by the HTTP spec, so both requests are rejected with 405 Method Not Allowed regardless of the client-generated id"
    answer: 1
    explanation: |
      PUT to a known URI is idempotent: repeating it yields the same final state. A common pattern
      is 201 on first creation and 200/204 on subsequent identical PUTs. It must not create a
      duplicate — that non-idempotent behavior is POST's domain.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-087
    difficulty: expert
    tags: [patch, json-patch, semantics]
    question: |
      Using JSON Patch (RFC 6902) with Content-Type application/json-patch+json, a client sends
      [{"op":"test","path":"/version","value":3},{"op":"replace","path":"/status","value":"DONE"}].
      What is the purpose of the first operation and the effect if it fails?
    options:
      - "test asserts the current value equals the given value (an optimistic-concurrency guard); if it fails the entire patch is rejected and no operations are applied"
      - "test merely logs the current value for auditing; if the assertion fails the log entry is written but the subsequent replace operation still applies normally"
      - "test creates the /version field with the given value if it is currently missing, behaving like an implicit add operation before the replace runs"
      - "test is a reserved no-op placeholder in RFC 6902 that clients may include for forward compatibility but which servers are required to ignore"
    answer: 0
    explanation: |
      In JSON Patch, the test op asserts a value at a path; if the assertion fails the whole patch
      document must fail atomically and no operations take effect. This gives conditional/optimistic
      updates within the patch itself, distinct from JSON Merge Patch which has no such operation.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-088
    difficulty: expert
    tags: [patch, merge-patch, null-semantics]
    question: |
      With JSON Merge Patch (RFC 7386, application/merge-patch+json), what does sending
      {"nickname": null} mean, and why can this be hard to implement in Java with a DTO?
    options:
      - "It sets nickname to the literal four-character string \"null\", which binds cleanly to a String DTO field and therefore presents no implementation difficulty at all"
      - "A null value is simply ignored and treated as identical to omitting the field entirely, so Merge Patch never needs to distinguish the two cases"
      - "null explicitly REMOVES/clears the nickname field; the challenge is distinguishing an explicit null (remove) from an absent field (leave unchanged) once JSON is bound to a plain DTO where both look like a null reference"
      - "JSON Merge Patch forbids null values outright and a server must reject the document with 400 Bad Request, so the distinguish-null problem never arises"
    answer: 2
    explanation: |
      In JSON Merge Patch, a null value means delete/clear that member, whereas an absent member
      means leave it unchanged. A naive DTO collapses both cases to a Java null, so you cannot tell
      remove from unchanged. Solutions include JsonNode/Map traversal, JsonNullable (openapi-jackson-
      nullable), or Optional-wrapped fields with a custom deserializer.
    ref: "concepts.md#put-vs-patch-vs-post"
  - id: spring-mvc-rest-apis-089
    difficulty: expert
    tags: [cors, exposed-headers, gotcha]
    question: |
      A cross-origin fetch succeeds and the server returns a custom X-Total-Count response header,
      but browser JavaScript reads null for it via response.headers.get("X-Total-Count") even though
      the header is visible in DevTools. What is the cause and the Spring fix?
    options:
      - "Custom response headers such as X-Total-Count cannot be transmitted on a cross-origin response at all, so the browser strips them before the fetch promise ever resolves"
      - "By default JS can only read the CORS-safelisted response headers (Cache-Control, Content-Language, Content-Length, Content-Type, Expires, Last-Modified, Pragma); the server must list X-Total-Count in Access-Control-Expose-Headers — in Spring via CorsConfiguration/CorsRegistry .exposedHeaders(...) or @CrossOrigin(exposedHeaders=...)"
      - "The header is stripped because the request never triggered a preflight; adding an explicit OPTIONS mapping for the endpoint forces the browser to expose it to JavaScript"
      - "You must add Access-Control-Allow-Headers: X-Total-Count to the response, because that header is what authorizes JavaScript to read custom headers off a cross-origin reply"
    answer: 1
    explanation: |
      For cross-origin responses, JavaScript may only read the CORS-safelisted response headers by
      default; any other header (like X-Total-Count) is hidden even though the browser received it.
      The server must opt it in with Access-Control-Expose-Headers. In Spring you configure this via
      exposedHeaders(...) on the CorsConfiguration/CorsRegistry mapping (or @CrossOrigin's
      exposedHeaders). Access-Control-Allow-Headers is the mirror concept for request headers on
      preflight, not response-header exposure.
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-090
    difficulty: advanced
    tags: [cors, preflight, methods]
    question: |
      Which combination will trigger a CORS preflight (OPTIONS) rather than being a "simple"
      request?
    options:
      - "GET carrying only a standard Accept header and no other custom or non-safelisted headers on the request"
      - "POST sending a Content-Type of text/plain with no custom or non-safelisted headers attached to the request"
      - "PUT with Content-Type: application/json and an Authorization header"
      - "POST submitting a form body with Content-Type application/x-www-form-urlencoded and no additional custom headers"
    answer: 2
    explanation: |
      Simple requests are limited to GET/HEAD/POST with only CORS-safelisted headers and content
      types (application/x-www-form-urlencoded, multipart/form-data, text/plain). A PUT, an
      application/json content type, and a custom/Authorization header each independently force a
      preflight OPTIONS.
    ref: "concepts.md#cors"
  - id: spring-mvc-rest-apis-091
    difficulty: advanced
    tags: [content-negotiation, produces, 406, 415]
    question: |
      A POST handler is @PostMapping(value="/x", consumes="application/json",
      produces="application/json"). A client sends Content-Type: text/xml with Accept:
      application/json. What status results and why?
    options:
      - "406 Not Acceptable, because the client's Accept header of application/json cannot be satisfied by the endpoint's produces declaration"
      - "415 Unsupported Media Type, because the request Content-Type text/xml does not match the consumes constraint"
      - "400 Bad Request, because the mismatched Content-Type makes the JSON body parser fail while reading the malformed payload"
      - "200 OK, because the Accept header of application/json matches the produces constraint and the body is quietly ignored"
    answer: 1
    explanation: |
      consumes narrows by the request Content-Type. text/xml does not match application/json, so
      the mapping's consume condition fails and Spring returns 415 Unsupported Media Type. 406 would
      apply if instead the Accept header could not be satisfied by produces.
    ref: "concepts.md#request-mapping-annotations"
  - id: spring-mvc-rest-apis-092
    difficulty: intermediate
    tags: [response-entity, void, headers]
    question: |
      You need to return 204 No Content but include a custom response header. Which is correct?
    options:
      - "return ResponseEntity.noContent().header(\"X-Trace-Id\", id).build();"
      - "return ResponseEntity.ok().header(\"X-Trace-Id\", id).body(null); a null body automatically downgrades the 200 status to a 204 No Content"
      - "return null with the X-Trace-Id header set on the incoming HttpServletRequest, which Spring copies onto the outgoing 204 response"
      - "You cannot attach any custom headers to a 204 response, because the No Content status forbids all header fields beyond Date"
    answer: 0
    explanation: |
      ResponseEntity.noContent() yields a 204 builder to which you can attach headers before
      build(). ResponseEntity<Void> plus build() sends no body. 204 responses can carry headers;
      only a body is disallowed.
    ref: "concepts.md#responseentity"
  - id: spring-mvc-rest-apis-093
    difficulty: advanced
    tags: [request-lifecycle, filter-order, ordering]
    question: |
      Two servlet filters A and B are registered via FilterRegistrationBean with A order 1 and B
      order 2. In what order do their pre-processing (before chain.doFilter) and post-processing
      (after chain.doFilter) run?
    options:
      - "Pre: A then B; Post: A then B, because each filter fully completes both phases before control passes to the next in registration order"
      - "Pre: A then B; Post: B then A (filters nest like an onion — lower order is outermost)"
      - "Pre: B then A; Post: A then B, because FilterRegistrationBean applies the order value in descending sequence for pre-processing only"
      - "Order is nondeterministic across requests, since the servlet container schedules each filter on a separate worker thread per call"
    answer: 1
    explanation: |
      Filters nest: the lowest order runs its pre-logic first and its post-logic last. So pre-order
      is A, B and post-order (after the inner chain returns) is B, A. Interceptors behave the same
      way with preHandle forward and postHandle/afterCompletion reversed.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-094
    difficulty: expert
    tags: [request-lifecycle, interceptors, order-reverse]
    question: |
      Three interceptors I1, I2, I3 are registered in that order and all return true from preHandle.
      For a successful request, what is the order of postHandle and afterCompletion calls?
    options:
      - "postHandle: I1,I2,I3; afterCompletion: I1,I2,I3 (every callback simply follows the same registration order that preHandle used)"
      - "postHandle: I3,I2,I1; afterCompletion: I3,I2,I1 (both post-execution callbacks run in reverse registration order)"
      - "postHandle: I1,I2,I3; afterCompletion: I3,I2,I1 (postHandle keeps registration order while only afterCompletion unwinds in reverse)"
      - "postHandle: I3,I2,I1; afterCompletion: I1,I2,I3 (postHandle reverses but afterCompletion returns to registration order for cleanup)"
    answer: 1
    explanation: |
      preHandle runs in registration order (I1,I2,I3). Both postHandle and afterCompletion run in
      the reverse order (I3,I2,I1), mirroring the nested/onion model where the first interceptor to
      enter is the last to finish. This symmetry is why cleanup in afterCompletion unwinds in the
      opposite order to setup in preHandle.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-095
    difficulty: advanced
    tags: [pagination, sort, injection]
    question: |
      When binding ?sort=name,asc directly to a Spring Data Sort/Pageable that is passed into a
      dynamically built query, what is a security concern and mitigation?
    options:
      - "None; Spring Data escapes and validates every bound Sort property internally, so client-supplied sort values are always safe to pass straight into a query"
      - "A client can sort by arbitrary property names, potentially exposing timing/ordering on unindexed or sensitive columns; validate/allowlist sortable properties before applying"
      - "The asc/desc direction token is concatenated into raw SQL and can carry an injection payload, so the only safe course is to disable sorting on the endpoint entirely"
      - "Applying a client-supplied Sort forces the database to take a full table lock for the duration of the ordered scan, blocking all concurrent writers"
    answer: 1
    explanation: |
      The sort property is client-controlled. Blindly binding it can let callers sort by columns you
      did not intend (information disclosure, or expensive scans on unindexed columns). Restrict to
      an allowlist of sortable fields and cap page size to bound cost.
    ref: "concepts.md#pagination-sorting--filtering"
  - id: spring-mvc-rest-apis-096
    difficulty: expert
    tags: [dispatcherservlet, forward, once-per-request]
    question: |
      A request is dispatched to /a, whose handler forwards to /b within the same DispatcherServlet.
      A filter extending OncePerRequestFilter wraps both. How many times does its doFilterInternal
      run, and how many times does the DispatcherServlet's doDispatch run?
    options:
      - "doFilterInternal: 1; doDispatch: 1, because an internal forward reuses the original dispatch rather than re-entering the DispatcherServlet a second time"
      - "doFilterInternal: 1 (guaranteed once per request); doDispatch: 2 (once per dispatch — original plus the forward)"
      - "doFilterInternal: 2; doDispatch: 2, because a forward re-runs the entire container filter chain including the once-per-request guard for /b"
      - "doFilterInternal: 2; doDispatch: 1, because the forward re-invokes the filter but the servlet collapses both dispatches into one doDispatch call"
    answer: 1
    explanation: |
      OncePerRequestFilter guards against re-execution on nested dispatches, so its body runs once.
      A forward is a new dispatch through the servlet, so DispatcherServlet.doDispatch executes again
      for /b — twice total. This is why interceptors can fire per-dispatch while a once-per-request
      filter does not.
    ref: "concepts.md#request-lifecycle"
  - id: spring-mvc-rest-apis-097
    difficulty: advanced
    tags: [controller, restcontroller, responsestatus]
    question: |
      A @RestController method is annotated @ResponseStatus(HttpStatus.CREATED) and returns a DTO
      (not a ResponseEntity). What status is sent, and what happens if the method instead returns a
      ResponseEntity with status 200?
    options:
      - "@ResponseStatus always wins over any programmatic status, so both the DTO case and the ResponseEntity case are forced to return 201 Created"
      - "Returning the DTO sends 201 (from @ResponseStatus); but a returned ResponseEntity's own status takes precedence, so that case sends 200 and @ResponseStatus is ignored"
      - "Both cases return 200, because @ResponseStatus only applies to void-returning handler methods and is silently ignored whenever a body is present"
      - "The combination of @ResponseStatus and a ResponseEntity return type throws an IllegalStateException while the handler is being registered at startup"
    answer: 1
    explanation: |
      @ResponseStatus sets the status when the handler does not itself specify one (e.g. returns a
      body object). But a ResponseEntity explicitly carries its own status, which takes precedence
      over @ResponseStatus. Mixing them and expecting @ResponseStatus to win is a common mistake.
    ref: "concepts.md#responseentity"
  - id: spring-mvc-rest-apis-098
    difficulty: expert
    tags: [jackson, serialization, lazy, dto]
    question: |
      Returning a JPA entity with a LAZY @OneToMany directly from a @RestController (open-session-in-
      view disabled) intermittently throws during response writing. What is the precise failure and
      why does a DTO fix it?
    options:
      - "StackOverflowError from a cyclic toString() on the bidirectional association; the DTO avoids it because DTOs are not permitted to declare a toString method"
      - "406 Not Acceptable, because managed JPA entity proxies are only serializable through an XML converter that is absent from the default Boot classpath"
      - "OptimisticLockException, because Jackson mutates the entity's version field while serializing it and Hibernate then detects the stale write on flush"
      - "LazyInitializationException: Jackson accesses the lazy collection during serialization after the persistence transaction/session has closed, so the proxy cannot initialize; a DTO is populated inside the transaction, decoupling serialization from the session"
    answer: 3
    explanation: |
      Serialization happens in the message converter after the controller returns and the
      transaction/Hibernate session has closed. Touching an uninitialized lazy association then
      throws LazyInitializationException. A DTO assembled within the transactional service layer
      captures exactly the needed data, so serialization never touches a detached proxy — one of the
      core reasons to expose DTOs.
    ref: "concepts.md#dto-data-transfer-objects"
  - id: spring-mvc-rest-apis-099
    difficulty: expert
    tags: [jackson, jsonview, dto]
    question: |
      You want one User DTO to expose different field subsets for a list endpoint vs a detail
      endpoint without creating two classes. Which Jackson/Spring feature fits best?
    options:
      - "@JsonView interfaces on fields plus @JsonView(...) on each handler method to select the active view"
      - "@JsonIgnore on the shared fields, which lets each endpoint toggle whether those annotated fields appear in its serialized response at runtime"
      - "Two @RequestMapping paths bound to the same handler method, with Spring emitting a narrower field subset for whichever path matched the request"
      - "Set produces to a different media type per endpoint, so Jackson selects a different field subset based on the negotiated content type"
    answer: 0
    explanation: |
      @JsonView lets you tag fields with view marker classes and annotate each handler method with
      @JsonView(SomeView.class); Spring configures the ObjectMapper writer for that view per
      response, emitting different field subsets from one DTO. @JsonIgnore is static (all endpoints).
    ref: "concepts.md#httpmessageconverter--jackson-internals"
  - id: spring-mvc-rest-apis-100
    difficulty: advanced
    tags: [hateoas, methodon, linkbuilder]
    question: |
      In Spring HATEOAS, what does linkTo(methodOn(UserController.class).getUser(id)) actually do at
      runtime with methodOn(...)?
    options:
      - "It actually invokes getUser(id), runs the real controller body, and builds the link from the returned object's self identifier"
      - "It performs a live HTTP round-trip to the running controller to discover the resolved URL before embedding it in the link"
      - "methodOn returns a proxy that records the method invocation (and captured args) without executing real controller logic, so linkTo can build the URI from the mapping metadata"
      - "It reads a static routes manifest generated by an annotation processor at build time and looks the URL up by method name"
    answer: 2
    explanation: |
      methodOn creates a proxy of the controller that captures which method was called and with what
      arguments, without running the real body. WebMvcLinkBuilder.linkTo then reconstructs the URI
      from the @RequestMapping metadata and captured path/query values. This keeps links in sync with
      mappings and avoids hardcoded URIs.
    ref: "concepts.md#hateoas"
  - id: spring-mvc-rest-apis-101
    difficulty: expert
    tags: [dispatcherservlet, root-context, child-context]
    question: |
      In a classic (non-Boot) setup with a root context (services, repositories) loaded by
      ContextLoaderListener and a DispatcherServlet child context (controllers), a controller in the
      child context autowires a service — fine. But a @Bean in the root context tries to autowire a
      controller and fails. Why?
    options:
      - "Controllers are never eligible for autowiring anywhere, because @Controller beans are registered as prototype-scoped proxies that the container refuses to inject"
      - "Cross-context autowiring is switched off by @EnableWebMvc, which seals the child context so none of its beans can be injected across the boundary"
      - "The root context is fully initialized only after the child web context, so a timing/ordering gap leaves the controller bean unavailable when the root @Bean wires up"
      - "The child (web) context sees parent (root) beans, but the parent cannot see child beans; the controller lives only in the child context and is invisible to the root context"
    answer: 3
    explanation: |
      Context hierarchy is one-directional: a child context resolves beans from its parent, but the
      parent has no knowledge of child-context beans. Controllers registered in the DispatcherServlet
      child context are therefore not injectable into root-context beans. Boot's single-context model
      sidesteps this, but the classic hierarchy still enforces it.
    ref: "concepts.md#dispatcherservlet-front-controller-flow"
