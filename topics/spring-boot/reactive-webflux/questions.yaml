topic: "Reactive Programming with Spring WebFlux"
domain: spring-boot
topic_slug: reactive-webflux
version: 1
questions:
  - id: reactive-webflux-001
    difficulty: beginner
    tags: [reactive-streams, fundamentals]
    question: |
      The Reactive Streams specification standardizes a contract for
      asynchronous stream processing. Which four interfaces make up its core?
    options:
      - "Publisher, Subscriber, Subscription, Processor"
      - "Observable, Observer, Disposable, Scheduler"
      - "Source, Sink, Flow, Channel"
      - "Emitter, Consumer, Demand, Signal"
    answer: 0
    explanation: |
      Reactive Streams defines Publisher, Subscriber, Subscription and Processor.
      Observable/Observer are RxJava's older types; the others are invented.
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-002
    difficulty: beginner
    tags: [reactive-streams, backpressure]
    question: |
      In Reactive Streams, how does a Subscriber express how many items it is
      ready to receive (backpressure)?
    options:
      - "By overriding onNext to return a boolean"
      - "By calling Subscription.request(n)"
      - "By blocking the Publisher's thread"
      - "By throwing an exception from onSubscribe"
    answer: 1
    explanation: |
      Demand is signaled by the subscriber calling request(n) on the
      Subscription it received in onSubscribe. Demand flows upstream; data flows
      downstream up to the requested amount.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-003
    difficulty: beginner
    tags: [mono-flux, cardinality]
    question: |
      What is the key difference between a Reactor Mono and a Flux?
    options:
      - "Mono is blocking; Flux is non-blocking"
      - "Mono is for errors only; Flux is for values"
      - "Mono emits 0 or 1 item; Flux emits 0 to N items"
      - "Mono runs on the event loop; Flux runs on boundedElastic"
    answer: 2
    explanation: |
      Cardinality is the distinction: Mono is a publisher of at most one element
      (like Optional/CompletableFuture), Flux of many (0..N). Both are
      non-blocking.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-004
    difficulty: beginner
    tags: [mvc-vs-webflux, threading]
    question: |
      Which threading model does classic Spring MVC use?
    options:
      - "Event loop with a few non-blocking threads"
      - "A single thread for all requests"
      - "One coroutine per request with no OS threads"
      - "Thread-per-request (a thread is held for the whole request)"
    answer: 3
    explanation: |
      Spring MVC on a servlet container uses thread-per-request: each request
      occupies a container thread for its full duration, blocking while it waits
      on I/O. WebFlux uses a non-blocking event loop instead.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-005
    difficulty: beginner
    tags: [webflux, netty]
    question: |
      What is the default embedded server for a Spring WebFlux application?
    options:
      - "Netty"
      - "Tomcat"
      - "Jetty"
      - "Undertow"
    answer: 0
    explanation: |
      WebFlux defaults to Reactor Netty. It can also run on Servlet 3.1+
      containers (Tomcat/Jetty) or Undertow using non-blocking async I/O.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-006
    difficulty: beginner
    tags: [operators, map-flatmap]
    question: |
      You have a Flux<String> of user IDs and a method
      Mono<User> findById(String id). Which operator produces a Flux<User>?
    options:
      - "map(id -> findById(id))"
      - "flatMap(id -> findById(id))"
      - "filter(id -> findById(id))"
      - "reduce(id -> findById(id))"
    answer: 1
    explanation: |
      Because findById returns a publisher, you need flatMap, which subscribes to
      each inner Mono and merges the results into a Flux<User>. map would give a
      nested Flux<Mono<User>>.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-007
    difficulty: beginner
    tags: [webclient, resttemplate]
    question: |
      Which HTTP client is the non-blocking, reactive one recommended for
      WebFlux applications?
    options:
      - "RestTemplate"
      - "HttpURLConnection"
      - "WebClient"
      - "Apache HttpClient (classic)"
    answer: 2
    explanation: |
      WebClient (from spring-webflux) is the reactive, non-blocking client that
      returns Mono/Flux. RestTemplate is the classic blocking client, now in
      maintenance mode.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-008
    difficulty: intermediate
    tags: [laziness, subscribe]
    question: |
      A developer writes `userRepo.save(user);` in a WebFlux service method but
      does not return or subscribe to the result, and the user is never saved.
      Why?
    options:
      - "save() only works inside a @Transactional method"
      - "The repository bean was not injected"
      - "Netty drops writes that are not flushed manually"
      - "Mono/Flux are lazy — nothing happens until something subscribes"
    answer: 3
    explanation: |
      Reactor publishers are lazy: declaring the pipeline does nothing until a
      subscriber subscribes. If you neither return the Mono (so the framework
      subscribes) nor subscribe yourself, the save never executes.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-009
    difficulty: intermediate
    tags: [pitfalls, blocking, event-loop]
    question: |
      Why is calling a blocking JDBC query directly inside a WebFlux handler that
      runs on a Netty event-loop thread dangerous?
    options:
      - "It blocks a scarce event-loop thread, and enough blocked loop threads can stall the whole application"
      - "It throws a compile-time error"
      - "JDBC is not on the classpath in WebFlux apps"
      - "It automatically switches to Tomcat"
    answer: 0
    explanation: |
      WebFlux uses only a few event-loop threads (~one per core). Blocking one
      prevents it from serving other connections; blocking several can freeze the
      app, giving worse throughput than MVC. Offload blocking work to
      boundedElastic.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-010
    difficulty: intermediate
    tags: [schedulers, blocking]
    question: |
      Which Reactor Scheduler is specifically designed for offloading blocking or
      legacy I/O calls so they don't tie up event-loop threads?
    options:
      - "Schedulers.parallel()"
      - "Schedulers.boundedElastic()"
      - "Schedulers.immediate()"
      - "Schedulers.single()"
    answer: 1
    explanation: |
      boundedElastic() provides an elastic, capped pool of worker threads meant
      for wrapping blocking calls (JDBC, file I/O). parallel() is for CPU-bound
      non-blocking work.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-011
    difficulty: intermediate
    tags: [schedulers, publishon-subscribeon]
    question: |
      What is the difference between subscribeOn and publishOn in Reactor?
    options:
      - "subscribeOn switches downstream operators' thread; publishOn sets the subscription thread"
      - "They are aliases with identical behavior"
      - "subscribeOn affects where the subscription/source runs (whole chain upstream); publishOn switches the thread for operators downstream of it"
      - "subscribeOn is for Mono, publishOn is for Flux"
    answer: 2
    explanation: |
      subscribeOn influences where subscription and source emission happen and is
      position-agnostic (first one wins). publishOn changes the execution thread
      for everything downstream of where it is placed.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-012
    difficulty: intermediate
    tags: [operators, zip]
    question: |
      You need to call two independent services (getUser and getOrders) in
      parallel and combine their results into one object. Which operator is the
      natural fit?
    options:
      - "concatMap"
      - "flatMapSequential"
      - "switchMap"
      - "Mono.zip"
    answer: 3
    explanation: |
      Mono.zip subscribes to multiple sources concurrently and combines their
      results into a tuple once all emit, ideal for parallel fan-out and join.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-013
    difficulty: intermediate
    tags: [operators, ordering]
    question: |
      A developer uses flatMap over a Flux of IDs to call a remote service and is
      surprised that responses come back out of original order. What best
      explains this and the fix?
    options:
      - "flatMap subscribes to inner publishers concurrently and merges as they complete, so order is not preserved; use concatMap (or flatMapSequential) to keep order"
      - "flatMap has a bug; downgrade Reactor"
      - "flatMap always preserves order; the service is broken"
      - "You must add .sort() which is the only way to order reactive streams"
    answer: 0
    explanation: |
      flatMap interleaves results from concurrently-running inner publishers, so
      ordering is not guaranteed. concatMap processes one inner at a time
      (ordered), and flatMapSequential runs eagerly but emits in order.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-014
    difficulty: intermediate
    tags: [mvc-vs-webflux, dispatcher]
    question: |
      Which front controller does WebFlux use, in contrast to Spring MVC's
      DispatcherServlet?
    options:
      - "ReactiveServlet"
      - "DispatcherHandler"
      - "FrontController"
      - "WebFluxServlet"
    answer: 1
    explanation: |
      WebFlux routes through the reactive DispatcherHandler, whereas MVC uses the
      servlet-based DispatcherServlet.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-015
    difficulty: intermediate
    tags: [when-webflux, tradeoffs]
    question: |
      Which scenario is the STRONGEST case for choosing WebFlux over MVC?
    options:
      - "A CPU-bound image-processing batch job"
      - "A low-traffic internal CRUD app backed by JPA"
      - "A gateway that fans out to many slow downstream services under high concurrency, using non-blocking clients end to end"
      - "A simple app where the team only knows blocking JDBC"
    answer: 2
    explanation: |
      WebFlux excels for I/O-bound, high-concurrency workloads (like a fan-out
      gateway) with an end-to-end non-blocking stack. CPU-bound work, JPA-backed
      CRUD, and blocking-only teams favor MVC.
    ref: "concepts.md#when-to-choose-webflux"

  - id: reactive-webflux-016
    difficulty: intermediate
    tags: [resttemplate, misconception]
    question: |
      Which statement about RestTemplate is accurate as of recent Spring versions?
    options:
      - "It has been removed from Spring 6"
      - "It is deprecated and throws warnings at runtime"
      - "It is the recommended client for new reactive code"
      - "It is in maintenance mode (no new features) but still supported; WebClient/RestClient are the modern choices"
    answer: 3
    explanation: |
      RestTemplate is NOT deprecated — it is in maintenance mode. It still works
      and is supported. WebClient (reactive) and RestClient (blocking, Spring
      6.1+) are recommended going forward.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-017
    difficulty: intermediate
    tags: [functional-endpoints, router]
    question: |
      In WebFlux functional endpoints, what is the signature of a HandlerFunction?
    options:
      - "ServerRequest -> Mono<ServerResponse>"
      - "ServerRequest -> ServerResponse"
      - "HttpServletRequest -> HttpServletResponse"
      - "Mono<ServerRequest> -> Flux<ServerResponse>"
    answer: 0
    explanation: |
      A HandlerFunction takes a ServerRequest and returns Mono<ServerResponse>.
      RouterFunctions map a RequestPredicate to such handlers.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-018
    difficulty: advanced
    tags: [operators, map-flatmap, subscribe]
    question: |
      Consider: `Flux.just("a","b").map(s -> webClient.get().uri(s).retrieve().bodyToMono(String.class))`.
      What is the resulting type and the problem?
    options:
      - "Flux<String>; no problem, it fetches both"
      - "Flux<Mono<String>>; the inner Monos are never subscribed, so no HTTP calls happen unless you use flatMap"
      - "Mono<String>; only the first is fetched"
      - "It fails to compile because map cannot return a Mono"
    answer: 1
    explanation: |
      map is a synchronous 1:1 transform, so returning a Mono yields a nested
      Flux<Mono<String>>. Nothing subscribes to the inner Monos, so no requests
      fire. flatMap subscribes to and merges the inner publishers.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-019
    difficulty: advanced
    tags: [backpressure, strategies]
    question: |
      A hot source emits faster than the subscriber can consume and you cannot
      slow the producer. Which strategy KEEPS ONLY THE MOST RECENT value and
      discards older overflow?
    options:
      - "onBackpressureBuffer"
      - "onBackpressureDrop"
      - "onBackpressureLatest"
      - "onBackpressureError"
    answer: 2
    explanation: |
      onBackpressureLatest retains the newest element and drops older ones when
      demand is insufficient. Buffer queues (risking OOM), Drop discards new
      overflow, Error signals IllegalStateException.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-020
    difficulty: advanced
    tags: [pitfalls, block]
    question: |
      What happens if you call .block() on a Mono from within a handler running
      on a Reactor Netty event-loop thread?
    options:
      - "It returns the value efficiently, same as WebClient"
      - "It silently switches to boundedElastic"
      - "Nothing — block() is a no-op in WebFlux"
      - "Reactor throws an error because blocking is not supported on non-blocking threads"
    answer: 3
    explanation: |
      Reactor detects block()/blockFirst()/blockLast() on non-blocking (parallel/
      Netty) threads and throws IllegalStateException ("block()/blockFirst()/
      blockLast() are blocking, which is not supported in thread ...").
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-021
    difficulty: intermediate
    tags: [reactive-streams, contract]
    question: |
      According to the Reactive Streams contract, how does a valid sequence
      terminate?
    options:
      - "With exactly one terminal signal: either onComplete or onError, and nothing after"
      - "With any number of onComplete and onError signals in any order"
      - "Only by the publisher calling cancel()"
      - "It never terminates; streams are infinite by definition"
    answer: 0
    explanation: |
      A sequence emits zero or more onNext, then terminates with exactly one
      onComplete OR one onError (never both, and no signals afterward).
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-022
    difficulty: intermediate
    tags: [mono-flux, void]
    question: |
      A reactive delete operation returns Mono<Void>. What does this signify?
    options:
      - "The operation failed and returned null"
      - "A publisher that emits no value but signals completion (or error) when the task finishes"
      - "A blocking call that returns void"
      - "An infinite stream of Void objects"
    answer: 1
    explanation: |
      Mono<Void> carries no value; it represents a task whose only meaningful
      signal is completion (or error) — used for fire-and-complete operations
      like delete.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-023
    difficulty: intermediate
    tags: [error-handling, operators]
    question: |
      Which operator lets you substitute a fallback PUBLISHER (e.g. a cached
      value or default flow) when an error occurs?
    options:
      - "onErrorReturn"
      - "doOnError"
      - "onErrorResume"
      - "onErrorMap"
    answer: 2
    explanation: |
      onErrorResume switches to an alternative Publisher on error. onErrorReturn
      supplies a single static value, onErrorMap translates the exception, and
      doOnError is a logging side-effect that does not handle the error.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-024
    difficulty: advanced
    tags: [error-handling, gotcha]
    question: |
      A developer adds `.doOnError(e -> log.error("failed", e))` and expects the
      error to be handled so the subscriber sees a success. What actually happens?
    options:
      - "The error is swallowed and the stream completes normally"
      - "doOnError converts the error into onComplete"
      - "It retries automatically three times"
      - "doOnError only performs a side effect (logging); the error still propagates downstream to the subscriber"
    answer: 3
    explanation: |
      doOnError is a peek/side-effect operator. It does not recover the sequence —
      the onError signal continues downstream. To handle it, use onErrorResume/
      onErrorReturn/onErrorMap.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-025
    difficulty: advanced
    tags: [context, threadlocal]
    question: |
      Why can ThreadLocal-based data (like MDC logging or security context) be
      lost in a reactive pipeline, and what does Reactor provide instead?
    options:
      - "Because operators may execute on different threads (scheduler hops), ThreadLocals don't follow the chain; Reactor's immutable Context (contextWrite/deferContextual) carries request data instead"
      - "It isn't lost; ThreadLocal works fine across reactive operators"
      - "Reactor deletes all ThreadLocals on subscribe; use static fields"
      - "Because Netty disables ThreadLocal entirely; use System properties"
    answer: 0
    explanation: |
      A reactive chain can hop threads, so ThreadLocal-bound state doesn't
      propagate. Reactor provides the immutable Context, and Micrometer context
      propagation bridges existing ThreadLocals.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-026
    difficulty: intermediate
    tags: [reactive-data, r2dbc, jpa]
    question: |
      Why is using JPA/Hibernate under WebFlux problematic for a fully
      non-blocking stack?
    options:
      - "JPA is not compatible with Java 17"
      - "JPA/Hibernate are blocking APIs with no reactive equivalent, so they reintroduce blocking; R2DBC is the non-blocking alternative for SQL"
      - "JPA only works with Netty"
      - "JPA automatically converts to R2DBC at runtime"
    answer: 1
    explanation: |
      JDBC/JPA are inherently blocking. Calling them on event-loop threads blocks
      them. For non-blocking relational access use R2DBC (or offload JPA to
      boundedElastic, or just use MVC).
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-027
    difficulty: advanced
    tags: [schedulers, offloading]
    question: |
      What is the correct idiom to safely execute a blocking legacy DAO call
      inside a reactive chain?
    options:
      - "Mono.just(legacyDao.load())"
      - "Flux.just(legacyDao.load()).publishOn(Schedulers.parallel())"
      - "Mono.fromCallable(() -> legacyDao.load()).subscribeOn(Schedulers.boundedElastic())"
      - "legacyDao.load().block()"
    answer: 2
    explanation: |
      Wrap the blocking call in fromCallable so it runs lazily, and subscribeOn
      boundedElastic to execute it on a pool meant for blocking work — never on
      the event loop. Mono.just(legacyDao.load()) would execute the blocking call
      eagerly on the calling thread.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-028
    difficulty: beginner
    tags: [operators, map]
    question: |
      What does the map operator do in Reactor?
    options:
      - "Subscribes to an inner publisher for each item and merges results"
      - "Combines multiple publishers into tuples"
      - "Delays each item by a fixed duration"
      - "Applies a synchronous 1-to-1 transformation to each emitted item"
    answer: 3
    explanation: |
      map is a synchronous, one-to-one transform (T -> R) applied to each item.
      It does not deal with publishers (that's flatMap) or combine sources (zip).
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-029
    difficulty: intermediate
    tags: [hot-cold, publishers]
    question: |
      What best distinguishes a COLD publisher from a HOT publisher?
    options:
      - "A cold publisher produces the sequence fresh for each subscriber; a hot publisher emits regardless of subscribers and shares emissions, so late subscribers may miss earlier items"
      - "Cold publishers are faster; hot publishers are slower"
      - "Cold publishers only work with Mono; hot only with Flux"
      - "Hot publishers cannot error; cold ones can"
    answer: 0
    explanation: |
      Cold publishers restart data generation per subscription (e.g. an HTTP call
      re-fired). Hot publishers emit independently of subscribers and multicast;
      late subscribers miss items emitted before they subscribed.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-030
    difficulty: advanced
    tags: [when-webflux, misconception]
    question: |
      An architect claims "migrating our JPA-backed CRUD service to WebFlux will
      make it faster for free." Which is the most accurate rebuttal?
    options:
      - "Correct, WebFlux is always faster than MVC"
      - "WebFlux is not automatically faster; for CPU-bound or low-concurrency work it can be equal or slower, and JPA remains blocking so you gain complexity without the non-blocking benefit unless the whole stack is reactive"
      - "WebFlux will fail to compile with JPA"
      - "You must first rewrite everything in Kotlin coroutines"
    answer: 1
    explanation: |
      WebFlux's advantage is for I/O-bound, high-concurrency, streaming workloads
      with an end-to-end non-blocking stack. Blocking JPA under WebFlux
      reintroduces blocking; per-request overhead can even make it slower.
    ref: "concepts.md#when-to-choose-webflux"

  - id: reactive-webflux-031
    difficulty: intermediate
    tags: [functional-endpoints, comparison]
    question: |
      Which statement correctly contrasts annotated controllers with functional
      endpoints in WebFlux?
    options:
      - "Functional endpoints run on a different engine (servlet), annotated ones on Netty"
      - "Annotated controllers cannot return Flux; functional endpoints can"
      - "Both run on the same reactive engine (DispatcherHandler); functional endpoints declare routing explicitly with RouterFunctions while annotated controllers use annotations and reflection"
      - "Functional endpoints are blocking; annotated controllers are reactive"
    answer: 2
    explanation: |
      Both models sit on the same reactive runtime. The difference is stylistic:
      functional endpoints route via explicit RouterFunction/HandlerFunction code;
      annotated controllers use @GetMapping-style annotations. Both handle
      Mono/Flux.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-032
    difficulty: intermediate
    tags: [webclient, error-handling]
    question: |
      With WebClient, calling retrieve() and then bodyToMono on a response with
      HTTP status 500 will, by default, do what?
    options:
      - "Return an empty Mono"
      - "Retry indefinitely"
      - "Return the raw error body as a successful value"
      - "Emit a WebClientResponseException (error signal) which you can handle with onStatus/onErrorResume"
    answer: 3
    explanation: |
      retrieve() raises a WebClientResponseException for 4xx/5xx by default. Use
      onStatus for custom handling or exchangeToMono for full control over the
      ClientResponse.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-033
    difficulty: advanced
    tags: [schedulers, subscribeon-position]
    question: |
      Given `flux.publishOn(A).map(f1).publishOn(B).map(f2).subscribeOn(C)`, on
      which scheduler does f1 run?
    options:
      - "Scheduler A, because publishOn(A) switches the thread for downstream operators including f1 (until publishOn(B) takes over for f2)"
      - "Scheduler C, because subscribeOn overrides everything"
      - "Scheduler B"
      - "The main thread, since map ignores schedulers"
    answer: 0
    explanation: |
      publishOn switches the execution context for operators downstream of it, so
      f1 runs on A and f2 on B. subscribeOn(C) affects where the subscription and
      source emission begin, upstream of the first publishOn.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-034
    difficulty: beginner
    tags: [reactive-manifesto, fundamentals]
    question: |
      Reactive programming is best described as which kind of paradigm?
    options:
      - "Synchronous, imperative, pull-based blocking"
      - "Asynchronous, declarative, built around data streams and propagation of change with non-blocking backpressure"
      - "A caching strategy for HTTP responses"
      - "A database indexing technique"
    answer: 1
    explanation: |
      Reactive programming is asynchronous and declarative, centered on streams
      of data and reacting to changes, with non-blocking backpressure as a core
      trait.
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-035
    difficulty: intermediate
    tags: [subscribe, demand]
    question: |
      When you call the simple `flux.subscribe(value -> handle(value))` overload
      (consumer only), how much demand does Reactor request from upstream?
    options:
      - "Exactly 1 item"
      - "Zero until you call request()"
      - "Long.MAX_VALUE (unbounded)"
      - "The number of CPU cores"
    answer: 2
    explanation: |
      The lambda-based subscribe overloads request Long.MAX_VALUE — effectively
      unbounded demand, applying no backpressure from the subscriber side. To
      apply backpressure you control request(n) yourself.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-036
    difficulty: advanced
    tags: [operators, switchmap, concatmap]
    question: |
      For a typeahead search where each new keystroke should CANCEL the in-flight
      request for the previous keystroke, which operator is ideal?
    options:
      - "concatMap"
      - "flatMap"
      - "flatMapSequential"
      - "switchMap"
    answer: 3
    explanation: |
      switchMap cancels the previous inner publisher when a new source item
      arrives, so only the latest query's results are delivered — exactly the
      typeahead pattern.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-037
    difficulty: intermediate
    tags: [mvc-vs-webflux, config]
    question: |
      If both spring-boot-starter-web and spring-boot-starter-webflux are on the
      classpath, what does Spring Boot do by default?
    options:
      - "Defaults to MVC (servlet stack) unless you set spring.main.web-application-type=reactive"
      - "Fails to start with an ambiguity error"
      - "Defaults to WebFlux always"
      - "Runs both stacks simultaneously on different ports"
    answer: 0
    explanation: |
      When both are present, Boot chooses the servlet (MVC) stack by default. You
      must explicitly set spring.main.web-application-type=reactive to force
      WebFlux.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-038
    difficulty: intermediate
    tags: [streaming, sse]
    question: |
      To stream server events continuously to a client as they occur, a WebFlux
      controller method would typically return which type with which media type?
    options:
      - "Mono<T> with application/json"
      - "Flux<T> with text/event-stream (Server-Sent Events)"
      - "List<T> with application/xml"
      - "ResponseEntity<byte[]> with application/octet-stream"
    answer: 1
    explanation: |
      A Flux<T> produced with MediaType.TEXT_EVENT_STREAM_VALUE streams items as
      Server-Sent Events, one of WebFlux's streaming strengths.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-039
    difficulty: advanced
    tags: [pitfalls, blockhound]
    question: |
      Which tool instruments the JVM to DETECT blocking calls executed on
      non-blocking threads (e.g. Netty event loop) at runtime, commonly used in
      tests?
    options:
      - "JMeter"
      - "Mockito"
      - "BlockHound"
      - "JaCoCo"
    answer: 2
    explanation: |
      BlockHound detects illegal blocking calls on threads marked non-blocking,
      surfacing pitfalls like JDBC or Thread.sleep on the event loop during tests.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-040
    difficulty: intermediate
    tags: [operators, then-concat]
    question: |
      You want to run save operation A, and only AFTER it completes run save B,
      ignoring A's emitted value. Which operator chains them by completion?
    options:
      - "zipWith"
      - "merge"
      - "combineLatest"
      - "then / thenMany"
    answer: 3
    explanation: |
      then (for Mono) and thenMany (to continue with a Flux) ignore the preceding
      publisher's values and subscribe to the next only after completion —
      sequential composition by completion.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-041
    difficulty: advanced
    tags: [reactive-streams, push-pull]
    question: |
      Reactive Streams is sometimes called a "push" model, but more precisely it
      is which of the following?
    options:
      - "Push with pull-based backpressure — the subscriber pulls demand via request(n) and the publisher pushes up to that demand"
      - "Pure pull, like an Iterator"
      - "Pure push with no flow control at all"
      - "Polling at fixed intervals"
    answer: 0
    explanation: |
      It's a hybrid: the consumer expresses demand (pull) through request(n), and
      the producer pushes items downstream limited by that demand. This is what
      makes non-blocking backpressure possible.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-042
    difficulty: intermediate
    tags: [error-handling, retry]
    question: |
      Which construct retries a failed reactive operation with increasing delays
      between attempts?
    options:
      - "retry(3)"
      - "retryWhen(Retry.backoff(3, Duration.ofMillis(100)))"
      - "repeat(3)"
      - "onErrorReturn(fallback)"
    answer: 1
    explanation: |
      retryWhen with Retry.backoff adds exponential backoff between retries.
      retry(3) resubscribes immediately without delay; repeat re-subscribes on
      completion (not error); onErrorReturn substitutes a value without retrying.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-043
    difficulty: beginner
    tags: [schedulers, parallel]
    question: |
      Which Scheduler is backed by a fixed pool sized to the number of CPU cores
      and intended for CPU-bound, non-blocking work?
    options:
      - "Schedulers.boundedElastic()"
      - "Schedulers.single()"
      - "Schedulers.parallel()"
      - "Schedulers.immediate()"
    answer: 2
    explanation: |
      Schedulers.parallel() has a fixed pool equal to available processors, meant
      for fast, CPU-bound non-blocking computation — not for blocking calls.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-044
    difficulty: advanced
    tags: [mvc-vs-webflux, reactive-return]
    question: |
      Can a traditional Spring MVC controller return a Mono or Flux, and if so,
      what is the caveat?
    options:
      - "No, reactive types are illegal in MVC"
      - "Yes, and it automatically becomes fully non-blocking on Netty"
      - "Only Mono is allowed, never Flux"
      - "Yes, MVC supports reactive return types via async servlet support, but it still uses a servlet thread per request, so the concurrency benefit is limited compared to WebFlux"
    answer: 3
    explanation: |
      MVC can adapt reactive return types using async servlet support, but the
      underlying servlet thread-per-request model remains, so you don't get the
      full event-loop scalability of WebFlux.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-045
    difficulty: intermediate
    tags: [webclient, best-practice]
    question: |
      What is a best practice regarding WebClient instances in an application?
    options:
      - "Reuse a single shared, immutable WebClient bean (thread-safe, backed by a connection pool) rather than creating one per call"
      - "Create a new WebClient per request for isolation"
      - "Always call .block() to reuse connections"
      - "Store WebClient in a ThreadLocal"
    answer: 0
    explanation: |
      A configured WebClient is immutable and thread-safe and is backed by a
      Reactor Netty connection pool; create one shared bean and reuse it rather
      than constructing per-request instances.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-046
    difficulty: advanced
    tags: [operators, concat-merge]
    question: |
      What is the difference between Flux.concat and Flux.merge?
    options:
      - "They are identical"
      - "concat subscribes to sources sequentially preserving order; merge subscribes eagerly and interleaves items as they arrive (no order guarantee)"
      - "concat is for Mono only; merge for Flux only"
      - "merge preserves order; concat interleaves"
    answer: 1
    explanation: |
      concat waits for each source to complete before subscribing to the next
      (ordered), while merge subscribes to all at once and interleaves emissions
      as they come (concurrent, unordered).
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-047
    difficulty: intermediate
    tags: [transactions, reactive]
    question: |
      Which transaction abstraction is appropriate for a fully reactive
      (e.g. R2DBC) WebFlux application?
    options:
      - "PlatformTransactionManager with JpaTransactionManager"
      - "Manual JDBC commit/rollback on the event loop"
      - "ReactiveTransactionManager (with TransactionalOperator or @Transactional on reactive types)"
      - "No transactions are possible in reactive apps"
    answer: 2
    explanation: |
      Reactive apps use ReactiveTransactionManager (e.g. R2DBC's) with
      TransactionalOperator or @Transactional on Mono/Flux-returning methods. The
      classic PlatformTransactionManager/JPA path is blocking.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-048
    difficulty: advanced
    tags: [testing, stepverifier]
    question: |
      Which tool is designed to unit-test reactive pipelines by asserting the
      exact sequence of emitted items, errors, and completion signals?
    options:
      - "WebTestClient"
      - "MockMvc"
      - "TestRestTemplate"
      - "StepVerifier"
    answer: 3
    explanation: |
      StepVerifier lets you subscribe to a publisher and assert expected onNext
      values, errors, and completion in order. WebTestClient tests endpoints at
      the HTTP level.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-049
    difficulty: beginner
    tags: [mono-flux, conversion]
    question: |
      Which conversion collects all items of a Flux<T> into a single
      Mono<List<T>>?
    options:
      - "flux.collectList()"
      - "flux.next()"
      - "flux.single()"
      - "flux.share()"
    answer: 0
    explanation: |
      collectList() buffers all emitted items and emits them once as a
      Mono<List<T>>. next() takes the first element as a Mono; single() expects
      exactly one item.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-050
    difficulty: advanced
    tags: [pitfalls, empty, switchifempty]
    question: |
      In a reactive handler you want to return 404 when a lookup produces no
      element. Which operator pattern expresses "if the source is empty, emit an
      error/alternative"?
    options:
      - "onErrorResume(...)"
      - "switchIfEmpty(Mono.error(new ResponseStatusException(NOT_FOUND)))"
      - "defaultIfEmpty(null)"
      - "filter(Objects::nonNull)"
    answer: 1
    explanation: |
      switchIfEmpty subscribes to an alternative publisher when the upstream
      completes empty — perfect for turning "not found" into a 404 error.
      onErrorResume handles errors, not emptiness; defaultIfEmpty(null) is unsafe.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-051
    difficulty: intermediate
    tags: [jakarta, spring-boot-3]
    question: |
      In Spring Boot 3.x, the servlet API used by Spring MVC moved to which
      package namespace, whereas WebFlux does not depend on the Servlet API at
      all by default?
    options:
      - "javax.servlet.*"
      - "org.springframework.servlet.*"
      - "jakarta.servlet.*"
      - "reactor.servlet.*"
    answer: 2
    explanation: |
      Spring Boot 3 / Spring 6 migrated to Jakarta EE 9+, so servlet packages are
      jakarta.servlet.* (not javax). WebFlux on Netty doesn't use the Servlet API
      at all.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-052
    difficulty: advanced
    tags: [backpressure, end-to-end]
    question: |
      A team bridges a blocking callback source into a Flux using Flux.create and
      later hits OutOfMemoryError under load. What is the most likely cause and
      remedy?
    options:
      - "Netty is misconfigured; switch to Tomcat"
      - "Flux.create is deprecated; use Mono.just"
      - "The JVM heap is simply too small; no code change helps"
      - "The bridged source ignores downstream demand (broken backpressure), so items buffer unbounded; specify an OverflowStrategy (e.g. DROP/LATEST/ERROR) or apply onBackpressure* operators"
    answer: 3
    explanation: |
      Flux.create bridges a source that doesn't naturally honor request(n); if it
      emits regardless of demand, items queue without bound. Choosing an
      OverflowStrategy or onBackpressure* operator restores bounded behavior.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-053
    difficulty: intermediate
    tags: [restclient, spring-6]
    question: |
      Spring 6.1 introduced RestClient. How does it relate to the existing
      clients?
    options:
      - "It is a synchronous (blocking) client offering WebClient's fluent API, positioned as the modern successor to RestTemplate"
      - "It is a reactive replacement for WebClient"
      - "It is only for GraphQL"
      - "It replaces Netty in WebFlux"
    answer: 0
    explanation: |
      RestClient is a synchronous client with a fluent, WebClient-like API,
      intended as the modern blocking alternative to RestTemplate. WebClient
      remains the reactive/non-blocking choice.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-054
    difficulty: advanced
    tags: [functional-endpoints, routing]
    question: |
      Which snippet correctly declares a functional route for GET /users/{id}
      handled by a handler method?
    options:
      - "@GetMapping(\"/users/{id}\") returning Mono<User>"
      - "route(GET(\"/users/{id}\"), handler::byId) returning a RouterFunction<ServerResponse> bean"
      - "new DispatcherServlet().map(\"/users\")"
      - "webClient.get().uri(\"/users/{id}\")"
    answer: 1
    explanation: |
      Functional endpoints use RouterFunctions.route(RequestPredicate,
      HandlerFunction), e.g. route(GET(\"/users/{id}\"), handler::byId), exposed as
      a RouterFunction<ServerResponse> bean. The @GetMapping form is the annotated
      model.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-055
    difficulty: intermediate
    tags: [threading, default-thread]
    question: |
      By default (no subscribeOn/publishOn), on which thread does a Reactor
      operator chain execute?
    options:
      - "Always Schedulers.parallel()"
      - "A new thread per operator"
      - "The thread that performed the subscription / emitted the signal — Reactor does not switch threads unless asked"
      - "boundedElastic by default"
    answer: 2
    explanation: |
      Reactor is concurrency-agnostic: without an explicit scheduler operator, the
      chain runs on the thread that triggers subscription and carries signals.
      subscribeOn/publishOn are needed to move execution.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-056
    difficulty: beginner
    tags: [pitfalls, subscribe]
    question: |
      In a WebFlux @RestController method that returns Mono<User>, who subscribes
      to the Mono to actually trigger execution?
    options:
      - "You must call .subscribe() yourself inside the method"
      - "Nobody; you must call .block()"
      - "The database driver subscribes automatically at startup"
      - "The WebFlux framework subscribes when it writes the HTTP response"
    answer: 3
    explanation: |
      You return the publisher and the framework subscribes as part of writing the
      response. Calling subscribe() or block() yourself in the controller is an
      anti-pattern.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

