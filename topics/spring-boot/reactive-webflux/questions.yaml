topic: "Reactive Programming with Spring WebFlux"
domain: spring-boot
topic_slug: reactive-webflux
version: 1
questions:
  - id: reactive-webflux-001
    difficulty: beginner
    tags: [reactive-streams, fundamentals]
    question: |
      The Reactive Streams specification standardizes a contract for
      asynchronous stream processing. Which four interfaces make up its core?
    options:
      - "Publisher, Subscriber, Subscription, Processor"
      - "Observable, Observer, Disposable, Scheduler"
      - "Source, Sink, Flow, Channel"
      - "Emitter, Consumer, Demand, Signal"
    answer: 0
    explanation: |
      Reactive Streams defines Publisher, Subscriber, Subscription and Processor.
      Observable/Observer are RxJava's older types; the others are invented.
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-002
    difficulty: beginner
    tags: [reactive-streams, backpressure]
    question: |
      In Reactive Streams, how does a Subscriber express how many items it is
      ready to receive (backpressure)?
    options:
      - "By overriding onNext to return a boolean"
      - "By calling Subscription.request(n)"
      - "By blocking the Publisher's thread"
      - "By throwing an exception from onSubscribe"
    answer: 1
    explanation: |
      Demand is signaled by the subscriber calling request(n) on the
      Subscription it received in onSubscribe. Demand flows upstream; data flows
      downstream up to the requested amount.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-003
    difficulty: beginner
    tags: [mono-flux, cardinality]
    question: |
      What is the key difference between a Reactor Mono and a Flux?
    options:
      - "Mono is blocking; Flux is non-blocking"
      - "Mono is for errors only; Flux is for values"
      - "Mono emits 0 or 1 item; Flux emits 0 to N items"
      - "Mono runs on the event loop; Flux runs on boundedElastic"
    answer: 2
    explanation: |
      Cardinality is the distinction: Mono is a publisher of at most one element
      (like Optional/CompletableFuture), Flux of many (0..N). Both are
      non-blocking.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-004
    difficulty: beginner
    tags: [mvc-vs-webflux, threading]
    question: |
      Which threading model does classic Spring MVC use?
    options:
      - "Event loop with a few non-blocking threads"
      - "A single thread for all requests"
      - "One coroutine per request with no OS threads"
      - "Thread-per-request (a thread is held for the whole request)"
    answer: 3
    explanation: |
      Spring MVC on a servlet container uses thread-per-request: each request
      occupies a container thread for its full duration, blocking while it waits
      on I/O. WebFlux uses a non-blocking event loop instead.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-005
    difficulty: beginner
    tags: [webflux, netty]
    question: |
      What is the default embedded server for a Spring WebFlux application?
    options:
      - "Netty"
      - "Tomcat"
      - "Jetty"
      - "Undertow"
    answer: 0
    explanation: |
      WebFlux defaults to Reactor Netty. It can also run on Servlet 3.1+
      containers (Tomcat/Jetty) or Undertow using non-blocking async I/O.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-006
    difficulty: beginner
    tags: [operators, map-flatmap]
    question: |
      You have a Flux<String> of user IDs and a method
      Mono<User> findById(String id). Which operator produces a Flux<User>?
    options:
      - "map(id -> findById(id))"
      - "flatMap(id -> findById(id))"
      - "filter(id -> findById(id))"
      - "reduce(id -> findById(id))"
    answer: 1
    explanation: |
      Because findById returns a publisher, you need flatMap, which subscribes to
      each inner Mono and merges the results into a Flux<User>. map would give a
      nested Flux<Mono<User>>.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-007
    difficulty: beginner
    tags: [webclient, resttemplate]
    question: |
      Which HTTP client is the non-blocking, reactive one recommended for
      WebFlux applications?
    options:
      - "RestTemplate"
      - "HttpURLConnection"
      - "WebClient"
      - "Apache HttpClient (classic)"
    answer: 2
    explanation: |
      WebClient (from spring-webflux) is the reactive, non-blocking client that
      returns Mono/Flux. RestTemplate is the classic blocking client, now in
      maintenance mode.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-008
    difficulty: intermediate
    tags: [laziness, subscribe]
    question: |
      A developer writes `userRepo.save(user);` in a WebFlux service method but
      does not return or subscribe to the result, and the user is never saved.
      Why?
    options:
      - "save() only works inside a @Transactional method"
      - "The repository bean was not injected"
      - "Netty drops writes that are not flushed manually"
      - "Mono/Flux are lazy — nothing happens until something subscribes"
    answer: 3
    explanation: |
      Reactor publishers are lazy: declaring the pipeline does nothing until a
      subscriber subscribes. If you neither return the Mono (so the framework
      subscribes) nor subscribe yourself, the save never executes.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-009
    difficulty: intermediate
    tags: [pitfalls, blocking, event-loop]
    question: |
      Why is calling a blocking JDBC query directly inside a WebFlux handler that
      runs on a Netty event-loop thread dangerous?
    options:
      - "It blocks a scarce event-loop thread, and enough blocked loop threads can stall the whole application"
      - "It throws a compile-time error"
      - "JDBC is not on the classpath in WebFlux apps"
      - "It automatically switches to Tomcat"
    answer: 0
    explanation: |
      WebFlux uses only a few event-loop threads (~one per core). Blocking one
      prevents it from serving other connections; blocking several can freeze the
      app, giving worse throughput than MVC. Offload blocking work to
      boundedElastic.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-010
    difficulty: intermediate
    tags: [schedulers, blocking]
    question: |
      Which Reactor Scheduler is specifically designed for offloading blocking or
      legacy I/O calls so they don't tie up event-loop threads?
    options:
      - "Schedulers.parallel()"
      - "Schedulers.boundedElastic()"
      - "Schedulers.immediate()"
      - "Schedulers.single()"
    answer: 1
    explanation: |
      boundedElastic() provides an elastic, capped pool of worker threads meant
      for wrapping blocking calls (JDBC, file I/O). parallel() is for CPU-bound
      non-blocking work.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-011
    difficulty: intermediate
    tags: [schedulers, publishon-subscribeon]
    question: |
      What is the difference between subscribeOn and publishOn in Reactor?
    options:
      - "subscribeOn switches downstream operators' thread; publishOn sets the subscription thread"
      - "They are aliases with identical behavior"
      - "subscribeOn affects where the subscription/source runs (whole chain upstream); publishOn switches the thread for operators downstream of it"
      - "subscribeOn is for Mono, publishOn is for Flux"
    answer: 2
    explanation: |
      subscribeOn influences where subscription and source emission happen and is
      position-agnostic (first one wins). publishOn changes the execution thread
      for everything downstream of where it is placed.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-012
    difficulty: intermediate
    tags: [operators, zip]
    question: |
      You need to call two independent services (getUser and getOrders) in
      parallel and combine their results into one object. Which operator is the
      natural fit?
    options:
      - "concatMap"
      - "flatMapSequential"
      - "switchMap"
      - "Mono.zip"
    answer: 3
    explanation: |
      Mono.zip subscribes to multiple sources concurrently and combines their
      results into a tuple once all emit, ideal for parallel fan-out and join.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-013
    difficulty: intermediate
    tags: [operators, ordering]
    question: |
      A developer uses flatMap over a Flux of IDs to call a remote service and is
      surprised that responses come back out of original order. What best
      explains this and the fix?
    options:
      - "flatMap subscribes to inner publishers concurrently and merges as they complete, so order is not preserved; use concatMap (or flatMapSequential) to keep order"
      - "flatMap has a bug; downgrade Reactor"
      - "flatMap always preserves order; the service is broken"
      - "You must add .sort() which is the only way to order reactive streams"
    answer: 0
    explanation: |
      flatMap interleaves results from concurrently-running inner publishers, so
      ordering is not guaranteed. concatMap processes one inner at a time
      (ordered), and flatMapSequential runs eagerly but emits in order.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-014
    difficulty: intermediate
    tags: [mvc-vs-webflux, dispatcher]
    question: |
      Which front controller does WebFlux use, in contrast to Spring MVC's
      DispatcherServlet?
    options:
      - "ReactiveServlet"
      - "DispatcherHandler"
      - "FrontController"
      - "WebFluxServlet"
    answer: 1
    explanation: |
      WebFlux routes through the reactive DispatcherHandler, whereas MVC uses the
      servlet-based DispatcherServlet.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-015
    difficulty: intermediate
    tags: [when-webflux, tradeoffs]
    question: |
      Which scenario is the STRONGEST case for choosing WebFlux over MVC?
    options:
      - "A CPU-bound image-processing batch job"
      - "A low-traffic internal CRUD app backed by JPA"
      - "A gateway that fans out to many slow downstream services under high concurrency, using non-blocking clients end to end"
      - "A simple app where the team only knows blocking JDBC"
    answer: 2
    explanation: |
      WebFlux excels for I/O-bound, high-concurrency workloads (like a fan-out
      gateway) with an end-to-end non-blocking stack. CPU-bound work, JPA-backed
      CRUD, and blocking-only teams favor MVC.
    ref: "concepts.md#when-to-choose-webflux"

  - id: reactive-webflux-016
    difficulty: intermediate
    tags: [resttemplate, misconception]
    question: |
      Which statement about RestTemplate is accurate as of recent Spring versions?
    options:
      - "It has been removed from Spring 6"
      - "It is deprecated and throws warnings at runtime"
      - "It is the recommended client for new reactive code"
      - "It is in maintenance mode (no new features) but still supported; WebClient/RestClient are the modern choices"
    answer: 3
    explanation: |
      RestTemplate is NOT deprecated — it is in maintenance mode. It still works
      and is supported. WebClient (reactive) and RestClient (blocking, Spring
      6.1+) are recommended going forward.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-017
    difficulty: intermediate
    tags: [functional-endpoints, router]
    question: |
      In WebFlux functional endpoints, what is the signature of a HandlerFunction?
    options:
      - "ServerRequest -> Mono<ServerResponse>"
      - "ServerRequest -> ServerResponse"
      - "HttpServletRequest -> HttpServletResponse"
      - "Mono<ServerRequest> -> Flux<ServerResponse>"
    answer: 0
    explanation: |
      A HandlerFunction takes a ServerRequest and returns Mono<ServerResponse>.
      RouterFunctions map a RequestPredicate to such handlers.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-018
    difficulty: advanced
    tags: [operators, map-flatmap, subscribe]
    question: |
      Consider: `Flux.just("a","b").map(s -> webClient.get().uri(s).retrieve().bodyToMono(String.class))`.
      What is the resulting type and the problem?
    options:
      - "Flux<String>; no problem, it fetches both"
      - "Flux<Mono<String>>; the inner Monos are never subscribed, so no HTTP calls happen unless you use flatMap"
      - "Mono<String>; only the first is fetched"
      - "It fails to compile because map cannot return a Mono"
    answer: 1
    explanation: |
      map is a synchronous 1:1 transform, so returning a Mono yields a nested
      Flux<Mono<String>>. Nothing subscribes to the inner Monos, so no requests
      fire. flatMap subscribes to and merges the inner publishers.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-019
    difficulty: advanced
    tags: [backpressure, strategies]
    question: |
      A hot source emits faster than the subscriber can consume and you cannot
      slow the producer. Which strategy KEEPS ONLY THE MOST RECENT value and
      discards older overflow?
    options:
      - "onBackpressureBuffer"
      - "onBackpressureDrop"
      - "onBackpressureLatest"
      - "onBackpressureError"
    answer: 2
    explanation: |
      onBackpressureLatest retains the newest element and drops older ones when
      demand is insufficient. Buffer queues (risking OOM), Drop discards new
      overflow, Error signals IllegalStateException.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-020
    difficulty: advanced
    tags: [pitfalls, block]
    question: |
      What happens if you call .block() on a Mono from within a handler running
      on a Reactor Netty event-loop thread?
    options:
      - "It returns the value efficiently, same as WebClient"
      - "It silently switches to boundedElastic"
      - "Nothing — block() is a no-op in WebFlux"
      - "Reactor throws an error because blocking is not supported on non-blocking threads"
    answer: 3
    explanation: |
      Reactor detects block()/blockFirst()/blockLast() on non-blocking (parallel/
      Netty) threads and throws IllegalStateException ("block()/blockFirst()/
      blockLast() are blocking, which is not supported in thread ...").
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-021
    difficulty: intermediate
    tags: [reactive-streams, contract]
    question: |
      According to the Reactive Streams contract, how does a valid sequence
      terminate?
    options:
      - "With exactly one terminal signal: either onComplete or onError, and nothing after"
      - "With any number of onComplete and onError signals in any order"
      - "Only by the publisher calling cancel()"
      - "It never terminates; streams are infinite by definition"
    answer: 0
    explanation: |
      A sequence emits zero or more onNext, then terminates with exactly one
      onComplete OR one onError (never both, and no signals afterward).
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-022
    difficulty: intermediate
    tags: [mono-flux, void]
    question: |
      A reactive delete operation returns Mono<Void>. What does this signify?
    options:
      - "The operation failed and returned null"
      - "A publisher that emits no value but signals completion (or error) when the task finishes"
      - "A blocking call that returns void"
      - "An infinite stream of Void objects"
    answer: 1
    explanation: |
      Mono<Void> carries no value; it represents a task whose only meaningful
      signal is completion (or error) — used for fire-and-complete operations
      like delete.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-023
    difficulty: intermediate
    tags: [error-handling, operators]
    question: |
      Which operator lets you substitute a fallback PUBLISHER (e.g. a cached
      value or default flow) when an error occurs?
    options:
      - "onErrorReturn"
      - "doOnError"
      - "onErrorResume"
      - "onErrorMap"
    answer: 2
    explanation: |
      onErrorResume switches to an alternative Publisher on error. onErrorReturn
      supplies a single static value, onErrorMap translates the exception, and
      doOnError is a logging side-effect that does not handle the error.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-024
    difficulty: advanced
    tags: [error-handling, gotcha]
    question: |
      A developer adds `.doOnError(e -> log.error("failed", e))` and expects the
      error to be handled so the subscriber sees a success. What actually happens?
    options:
      - "The error is swallowed and the stream completes normally"
      - "doOnError converts the error into onComplete"
      - "It retries automatically three times"
      - "doOnError only performs a side effect (logging); the error still propagates downstream to the subscriber"
    answer: 3
    explanation: |
      doOnError is a peek/side-effect operator. It does not recover the sequence —
      the onError signal continues downstream. To handle it, use onErrorResume/
      onErrorReturn/onErrorMap.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-025
    difficulty: advanced
    tags: [context, threadlocal]
    question: |
      Why can ThreadLocal-based data (like MDC logging or security context) be
      lost in a reactive pipeline, and what does Reactor provide instead?
    options:
      - "Because operators may execute on different threads (scheduler hops), ThreadLocals don't follow the chain; Reactor's immutable Context (contextWrite/deferContextual) carries request data instead"
      - "It isn't lost; ThreadLocal works fine across reactive operators"
      - "Reactor deletes all ThreadLocals on subscribe; use static fields"
      - "Because Netty disables ThreadLocal entirely; use System properties"
    answer: 0
    explanation: |
      A reactive chain can hop threads, so ThreadLocal-bound state doesn't
      propagate. Reactor provides the immutable Context, and Micrometer context
      propagation bridges existing ThreadLocals.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-026
    difficulty: intermediate
    tags: [reactive-data, r2dbc, jpa]
    question: |
      Why is using JPA/Hibernate under WebFlux problematic for a fully
      non-blocking stack?
    options:
      - "JPA is not compatible with Java 17"
      - "JPA/Hibernate are blocking APIs with no reactive equivalent, so they reintroduce blocking; R2DBC is the non-blocking alternative for SQL"
      - "JPA only works with Netty"
      - "JPA automatically converts to R2DBC at runtime"
    answer: 1
    explanation: |
      JDBC/JPA are inherently blocking. Calling them on event-loop threads blocks
      them. For non-blocking relational access use R2DBC (or offload JPA to
      boundedElastic, or just use MVC).
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-027
    difficulty: advanced
    tags: [schedulers, offloading]
    question: |
      What is the correct idiom to safely execute a blocking legacy DAO call
      inside a reactive chain?
    options:
      - "Mono.just(legacyDao.load())"
      - "Flux.just(legacyDao.load()).publishOn(Schedulers.parallel())"
      - "Mono.fromCallable(() -> legacyDao.load()).subscribeOn(Schedulers.boundedElastic())"
      - "legacyDao.load().block()"
    answer: 2
    explanation: |
      Wrap the blocking call in fromCallable so it runs lazily, and subscribeOn
      boundedElastic to execute it on a pool meant for blocking work — never on
      the event loop. Mono.just(legacyDao.load()) would execute the blocking call
      eagerly on the calling thread.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-028
    difficulty: beginner
    tags: [operators, map]
    question: |
      What does the map operator do in Reactor?
    options:
      - "Subscribes to an inner publisher for each item and merges results"
      - "Combines multiple publishers into tuples"
      - "Delays each item by a fixed duration"
      - "Applies a synchronous 1-to-1 transformation to each emitted item"
    answer: 3
    explanation: |
      map is a synchronous, one-to-one transform (T -> R) applied to each item.
      It does not deal with publishers (that's flatMap) or combine sources (zip).
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-029
    difficulty: intermediate
    tags: [hot-cold, publishers]
    question: |
      What best distinguishes a COLD publisher from a HOT publisher?
    options:
      - "A cold publisher produces the sequence fresh for each subscriber; a hot publisher emits regardless of subscribers and shares emissions, so late subscribers may miss earlier items"
      - "Cold publishers are faster; hot publishers are slower"
      - "Cold publishers only work with Mono; hot only with Flux"
      - "Hot publishers cannot error; cold ones can"
    answer: 0
    explanation: |
      Cold publishers restart data generation per subscription (e.g. an HTTP call
      re-fired). Hot publishers emit independently of subscribers and multicast;
      late subscribers miss items emitted before they subscribed.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-030
    difficulty: advanced
    tags: [when-webflux, misconception]
    question: |
      An architect claims "migrating our JPA-backed CRUD service to WebFlux will
      make it faster for free." Which is the most accurate rebuttal?
    options:
      - "Correct, WebFlux is always faster than MVC"
      - "WebFlux is not automatically faster; for CPU-bound or low-concurrency work it can be equal or slower, and JPA remains blocking so you gain complexity without the non-blocking benefit unless the whole stack is reactive"
      - "WebFlux will fail to compile with JPA"
      - "You must first rewrite everything in Kotlin coroutines"
    answer: 1
    explanation: |
      WebFlux's advantage is for I/O-bound, high-concurrency, streaming workloads
      with an end-to-end non-blocking stack. Blocking JPA under WebFlux
      reintroduces blocking; per-request overhead can even make it slower.
    ref: "concepts.md#when-to-choose-webflux"

  - id: reactive-webflux-031
    difficulty: intermediate
    tags: [functional-endpoints, comparison]
    question: |
      Which statement correctly contrasts annotated controllers with functional
      endpoints in WebFlux?
    options:
      - "Functional endpoints run on a different engine (servlet), annotated ones on Netty"
      - "Annotated controllers cannot return Flux; functional endpoints can"
      - "Both run on the same reactive engine (DispatcherHandler); functional endpoints declare routing explicitly with RouterFunctions while annotated controllers use annotations and reflection"
      - "Functional endpoints are blocking; annotated controllers are reactive"
    answer: 2
    explanation: |
      Both models sit on the same reactive runtime. The difference is stylistic:
      functional endpoints route via explicit RouterFunction/HandlerFunction code;
      annotated controllers use @GetMapping-style annotations. Both handle
      Mono/Flux.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-032
    difficulty: intermediate
    tags: [webclient, error-handling]
    question: |
      With WebClient, calling retrieve() and then bodyToMono on a response with
      HTTP status 500 will, by default, do what?
    options:
      - "Return an empty Mono"
      - "Retry indefinitely"
      - "Return the raw error body as a successful value"
      - "Emit a WebClientResponseException (error signal) which you can handle with onStatus/onErrorResume"
    answer: 3
    explanation: |
      retrieve() raises a WebClientResponseException for 4xx/5xx by default. Use
      onStatus for custom handling or exchangeToMono for full control over the
      ClientResponse.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-033
    difficulty: advanced
    tags: [schedulers, subscribeon-position]
    question: |
      Given `flux.publishOn(A).map(f1).publishOn(B).map(f2).subscribeOn(C)`, on
      which scheduler does f1 run?
    options:
      - "Scheduler A, because publishOn(A) switches the thread for downstream operators including f1 (until publishOn(B) takes over for f2)"
      - "Scheduler C, because subscribeOn overrides everything"
      - "Scheduler B"
      - "The main thread, since map ignores schedulers"
    answer: 0
    explanation: |
      publishOn switches the execution context for operators downstream of it, so
      f1 runs on A and f2 on B. subscribeOn(C) affects where the subscription and
      source emission begin, upstream of the first publishOn.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-034
    difficulty: beginner
    tags: [reactive-manifesto, fundamentals]
    question: |
      Reactive programming is best described as which kind of paradigm?
    options:
      - "Synchronous, imperative, pull-based blocking"
      - "Asynchronous, declarative, built around data streams and propagation of change with non-blocking backpressure"
      - "A caching strategy for HTTP responses"
      - "A database indexing technique"
    answer: 1
    explanation: |
      Reactive programming is asynchronous and declarative, centered on streams
      of data and reacting to changes, with non-blocking backpressure as a core
      trait.
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-035
    difficulty: intermediate
    tags: [subscribe, demand]
    question: |
      When you call the simple `flux.subscribe(value -> handle(value))` overload
      (consumer only), how much demand does Reactor request from upstream?
    options:
      - "Exactly 1 item"
      - "Zero until you call request()"
      - "Long.MAX_VALUE (unbounded)"
      - "The number of CPU cores"
    answer: 2
    explanation: |
      The lambda-based subscribe overloads request Long.MAX_VALUE — effectively
      unbounded demand, applying no backpressure from the subscriber side. To
      apply backpressure you control request(n) yourself.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-036
    difficulty: advanced
    tags: [operators, switchmap, concatmap]
    question: |
      For a typeahead search where each new keystroke should CANCEL the in-flight
      request for the previous keystroke, which operator is ideal?
    options:
      - "concatMap"
      - "flatMap"
      - "flatMapSequential"
      - "switchMap"
    answer: 3
    explanation: |
      switchMap cancels the previous inner publisher when a new source item
      arrives, so only the latest query's results are delivered — exactly the
      typeahead pattern.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-037
    difficulty: intermediate
    tags: [mvc-vs-webflux, config]
    question: |
      If both spring-boot-starter-web and spring-boot-starter-webflux are on the
      classpath, what does Spring Boot do by default?
    options:
      - "Defaults to MVC (servlet stack) unless you set spring.main.web-application-type=reactive"
      - "Fails to start with an ambiguity error"
      - "Defaults to WebFlux always"
      - "Runs both stacks simultaneously on different ports"
    answer: 0
    explanation: |
      When both are present, Boot chooses the servlet (MVC) stack by default. You
      must explicitly set spring.main.web-application-type=reactive to force
      WebFlux.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-038
    difficulty: intermediate
    tags: [streaming, sse]
    question: |
      To stream server events continuously to a client as they occur, a WebFlux
      controller method would typically return which type with which media type?
    options:
      - "Mono<T> with application/json"
      - "Flux<T> with text/event-stream (Server-Sent Events)"
      - "List<T> with application/xml"
      - "ResponseEntity<byte[]> with application/octet-stream"
    answer: 1
    explanation: |
      A Flux<T> produced with MediaType.TEXT_EVENT_STREAM_VALUE streams items as
      Server-Sent Events, one of WebFlux's streaming strengths.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-039
    difficulty: advanced
    tags: [pitfalls, blockhound]
    question: |
      Which tool instruments the JVM to DETECT blocking calls executed on
      non-blocking threads (e.g. Netty event loop) at runtime, commonly used in
      tests?
    options:
      - "JMeter"
      - "Mockito"
      - "BlockHound"
      - "JaCoCo"
    answer: 2
    explanation: |
      BlockHound detects illegal blocking calls on threads marked non-blocking,
      surfacing pitfalls like JDBC or Thread.sleep on the event loop during tests.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-040
    difficulty: intermediate
    tags: [operators, then-concat]
    question: |
      You want to run save operation A, and only AFTER it completes run save B,
      ignoring A's emitted value. Which operator chains them by completion?
    options:
      - "zipWith"
      - "merge"
      - "combineLatest"
      - "then / thenMany"
    answer: 3
    explanation: |
      then (for Mono) and thenMany (to continue with a Flux) ignore the preceding
      publisher's values and subscribe to the next only after completion —
      sequential composition by completion.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-041
    difficulty: advanced
    tags: [reactive-streams, push-pull]
    question: |
      Reactive Streams is sometimes called a "push" model, but more precisely it
      is which of the following?
    options:
      - "Push with pull-based backpressure — the subscriber pulls demand via request(n) and the publisher pushes up to that demand"
      - "Pure pull, like an Iterator"
      - "Pure push with no flow control at all"
      - "Polling at fixed intervals"
    answer: 0
    explanation: |
      It's a hybrid: the consumer expresses demand (pull) through request(n), and
      the producer pushes items downstream limited by that demand. This is what
      makes non-blocking backpressure possible.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-042
    difficulty: intermediate
    tags: [error-handling, retry]
    question: |
      Which construct retries a failed reactive operation with increasing delays
      between attempts?
    options:
      - "retry(3)"
      - "retryWhen(Retry.backoff(3, Duration.ofMillis(100)))"
      - "repeat(3)"
      - "onErrorReturn(fallback)"
    answer: 1
    explanation: |
      retryWhen with Retry.backoff adds exponential backoff between retries.
      retry(3) resubscribes immediately without delay; repeat re-subscribes on
      completion (not error); onErrorReturn substitutes a value without retrying.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-043
    difficulty: beginner
    tags: [schedulers, parallel]
    question: |
      Which Scheduler is backed by a fixed pool sized to the number of CPU cores
      and intended for CPU-bound, non-blocking work?
    options:
      - "Schedulers.boundedElastic()"
      - "Schedulers.single()"
      - "Schedulers.parallel()"
      - "Schedulers.immediate()"
    answer: 2
    explanation: |
      Schedulers.parallel() has a fixed pool equal to available processors, meant
      for fast, CPU-bound non-blocking computation — not for blocking calls.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-044
    difficulty: advanced
    tags: [mvc-vs-webflux, reactive-return]
    question: |
      Can a traditional Spring MVC controller return a Mono or Flux, and if so,
      what is the caveat?
    options:
      - "No, reactive types are illegal in MVC"
      - "Yes, and it automatically becomes fully non-blocking on Netty"
      - "Only Mono is allowed, never Flux"
      - "Yes, MVC supports reactive return types via async servlet support, but it still uses a servlet thread per request, so the concurrency benefit is limited compared to WebFlux"
    answer: 3
    explanation: |
      MVC can adapt reactive return types using async servlet support, but the
      underlying servlet thread-per-request model remains, so you don't get the
      full event-loop scalability of WebFlux.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-045
    difficulty: intermediate
    tags: [webclient, best-practice]
    question: |
      What is a best practice regarding WebClient instances in an application?
    options:
      - "Reuse a single shared, immutable WebClient bean (thread-safe, backed by a connection pool) rather than creating one per call"
      - "Create a new WebClient per request for isolation"
      - "Always call .block() to reuse connections"
      - "Store WebClient in a ThreadLocal"
    answer: 0
    explanation: |
      A configured WebClient is immutable and thread-safe and is backed by a
      Reactor Netty connection pool; create one shared bean and reuse it rather
      than constructing per-request instances.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-046
    difficulty: advanced
    tags: [operators, concat-merge]
    question: |
      What is the difference between Flux.concat and Flux.merge?
    options:
      - "They are identical"
      - "concat subscribes to sources sequentially preserving order; merge subscribes eagerly and interleaves items as they arrive (no order guarantee)"
      - "concat is for Mono only; merge for Flux only"
      - "merge preserves order; concat interleaves"
    answer: 1
    explanation: |
      concat waits for each source to complete before subscribing to the next
      (ordered), while merge subscribes to all at once and interleaves emissions
      as they come (concurrent, unordered).
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-047
    difficulty: intermediate
    tags: [transactions, reactive]
    question: |
      Which transaction abstraction is appropriate for a fully reactive
      (e.g. R2DBC) WebFlux application?
    options:
      - "PlatformTransactionManager with JpaTransactionManager"
      - "Manual JDBC commit/rollback on the event loop"
      - "ReactiveTransactionManager (with TransactionalOperator or @Transactional on reactive types)"
      - "No transactions are possible in reactive apps"
    answer: 2
    explanation: |
      Reactive apps use ReactiveTransactionManager (e.g. R2DBC's) with
      TransactionalOperator or @Transactional on Mono/Flux-returning methods. The
      classic PlatformTransactionManager/JPA path is blocking.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-048
    difficulty: advanced
    tags: [testing, stepverifier]
    question: |
      Which tool is designed to unit-test reactive pipelines by asserting the
      exact sequence of emitted items, errors, and completion signals?
    options:
      - "WebTestClient"
      - "MockMvc"
      - "TestRestTemplate"
      - "StepVerifier"
    answer: 3
    explanation: |
      StepVerifier lets you subscribe to a publisher and assert expected onNext
      values, errors, and completion in order. WebTestClient tests endpoints at
      the HTTP level.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-049
    difficulty: beginner
    tags: [mono-flux, conversion]
    question: |
      Which conversion collects all items of a Flux<T> into a single
      Mono<List<T>>?
    options:
      - "flux.collectList()"
      - "flux.next()"
      - "flux.single()"
      - "flux.share()"
    answer: 0
    explanation: |
      collectList() buffers all emitted items and emits them once as a
      Mono<List<T>>. next() takes the first element as a Mono; single() expects
      exactly one item.
    ref: "concepts.md#mono-vs-flux"

  - id: reactive-webflux-050
    difficulty: advanced
    tags: [pitfalls, empty, switchifempty]
    question: |
      In a reactive handler you want to return 404 when a lookup produces no
      element. Which operator pattern expresses "if the source is empty, emit an
      error/alternative"?
    options:
      - "onErrorResume(...)"
      - "switchIfEmpty(Mono.error(new ResponseStatusException(NOT_FOUND)))"
      - "defaultIfEmpty(null)"
      - "filter(Objects::nonNull)"
    answer: 1
    explanation: |
      switchIfEmpty subscribes to an alternative publisher when the upstream
      completes empty — perfect for turning "not found" into a 404 error.
      onErrorResume handles errors, not emptiness; defaultIfEmpty(null) is unsafe.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-051
    difficulty: intermediate
    tags: [jakarta, spring-boot-3]
    question: |
      In Spring Boot 3.x, the servlet API used by Spring MVC moved to which
      package namespace, whereas WebFlux does not depend on the Servlet API at
      all by default?
    options:
      - "javax.servlet.*"
      - "org.springframework.servlet.*"
      - "jakarta.servlet.*"
      - "reactor.servlet.*"
    answer: 2
    explanation: |
      Spring Boot 3 / Spring 6 migrated to Jakarta EE 9+, so servlet packages are
      jakarta.servlet.* (not javax). WebFlux on Netty doesn't use the Servlet API
      at all.
    ref: "concepts.md#spring-mvc-vs-spring-webflux-threading-models"

  - id: reactive-webflux-052
    difficulty: advanced
    tags: [backpressure, end-to-end]
    question: |
      A team bridges a blocking callback source into a Flux using Flux.create and
      later hits OutOfMemoryError under load. What is the most likely cause and
      remedy?
    options:
      - "Netty is misconfigured; switch to Tomcat"
      - "Flux.create is deprecated; use Mono.just"
      - "The JVM heap is simply too small; no code change helps"
      - "The bridged source ignores downstream demand (broken backpressure), so items buffer unbounded; specify an OverflowStrategy (e.g. DROP/LATEST/ERROR) or apply onBackpressure* operators"
    answer: 3
    explanation: |
      Flux.create bridges a source that doesn't naturally honor request(n); if it
      emits regardless of demand, items queue without bound. Choosing an
      OverflowStrategy or onBackpressure* operator restores bounded behavior.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-053
    difficulty: intermediate
    tags: [restclient, spring-6]
    question: |
      Spring 6.1 introduced RestClient. How does it relate to the existing
      clients?
    options:
      - "It is a synchronous (blocking) client offering WebClient's fluent API, positioned as the modern successor to RestTemplate"
      - "It is a reactive replacement for WebClient"
      - "It is only for GraphQL"
      - "It replaces Netty in WebFlux"
    answer: 0
    explanation: |
      RestClient is a synchronous client with a fluent, WebClient-like API,
      intended as the modern blocking alternative to RestTemplate. WebClient
      remains the reactive/non-blocking choice.
    ref: "concepts.md#webclient-vs-resttemplate"

  - id: reactive-webflux-054
    difficulty: advanced
    tags: [functional-endpoints, routing]
    question: |
      Which snippet correctly declares a functional route for GET /users/{id}
      handled by a handler method?
    options:
      - "@GetMapping(\"/users/{id}\") returning Mono<User>"
      - "route(GET(\"/users/{id}\"), handler::byId) returning a RouterFunction<ServerResponse> bean"
      - "new DispatcherServlet().map(\"/users\")"
      - "webClient.get().uri(\"/users/{id}\")"
    answer: 1
    explanation: |
      Functional endpoints use RouterFunctions.route(RequestPredicate,
      HandlerFunction), e.g. route(GET(\"/users/{id}\"), handler::byId), exposed as
      a RouterFunction<ServerResponse> bean. The @GetMapping form is the annotated
      model.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-055
    difficulty: intermediate
    tags: [threading, default-thread]
    question: |
      By default (no subscribeOn/publishOn), on which thread does a Reactor
      operator chain execute?
    options:
      - "Always Schedulers.parallel()"
      - "A new thread per operator"
      - "The thread that performed the subscription / emitted the signal — Reactor does not switch threads unless asked"
      - "boundedElastic by default"
    answer: 2
    explanation: |
      Reactor is concurrency-agnostic: without an explicit scheduler operator, the
      chain runs on the thread that triggers subscription and carries signals.
      subscribeOn/publishOn are needed to move execution.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-056
    difficulty: beginner
    tags: [pitfalls, subscribe]
    question: |
      In a WebFlux @RestController method that returns Mono<User>, who subscribes
      to the Mono to actually trigger execution?
    options:
      - "You must call .subscribe() yourself inside the method"
      - "Nobody; you must call .block()"
      - "The database driver subscribes automatically at startup"
      - "The WebFlux framework subscribes when it writes the HTTP response"
    answer: 3
    explanation: |
      You return the publisher and the framework subscribes as part of writing the
      response. Calling subscribe() or block() yourself in the controller is an
      anti-pattern.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-057
    difficulty: expert
    tags: [assembly-time, laziness, gotcha]
    question: |
      A service exposes: `Mono<Long> now() { return Mono.just(System.currentTimeMillis()); }`
      A test subscribes to the SAME returned Mono twice, 50 ms apart, and finds
      both subscribers see the IDENTICAL timestamp. Why, and how do you make each
      subscription observe a fresh value?
    options:
      - "Because System.currentTimeMillis() is evaluated eagerly at assembly time (when Mono.just's argument is computed), not per subscription; wrap it in Mono.fromCallable(...) or Mono.defer(...) so it runs at subscription time"
      - "Because Mono caches its first value forever; add .cache(Duration.ZERO) to disable caching"
      - "Because Mono.just is a hot publisher; switch to Flux.just which is cold"
      - "Because the two subscriptions share a Reactor Context; call contextWrite to isolate them"
    answer: 0
    explanation: |
      The argument to Mono.just is computed once, eagerly, at assembly time — the
      timestamp is baked in before any subscription. Mono.just is cold (it replays
      the same stored value), so both subscribers see it. Deferring with
      fromCallable/defer moves evaluation to subscription time, yielding a fresh
      value per subscribe.
    ref: "concepts.md#assembly-time-vs-subscription-time-vs-runtime"

  - id: reactive-webflux-058
    difficulty: expert
    tags: [error-handling, assembly-time, gotcha]
    question: |
      `Mono<String> pipeline = Mono.just(compute()).onErrorReturn("fallback");`
      where `compute()` throws a RuntimeException. What happens when this LINE
      executes (before anyone subscribes)?
    options:
      - "Nothing; the exception is captured and replaced by 'fallback' when subscribed"
      - "onErrorReturn converts it to an onComplete with no value"
      - "The RuntimeException is thrown immediately on this line, escaping the reactive pipeline entirely, because compute() runs eagerly at assembly time and onErrorReturn only catches onError SIGNALS during subscription"
      - "It is deferred and only thrown on the first request(n)"
    answer: 2
    explanation: |
      compute() is a plain method call whose result is the argument to Mono.just —
      it runs eagerly at assembly time, so the exception is thrown right there,
      before a Mono even exists to carry an onError. onErrorReturn only intercepts
      error signals emitted during subscription. Use Mono.fromCallable(this::compute)
      so the throw becomes an onError signal that onErrorReturn can catch.
    ref: "concepts.md#assembly-time-vs-subscription-time-vs-runtime"

  - id: reactive-webflux-059
    difficulty: advanced
    tags: [operators, flatmap, concurrency]
    question: |
      A Flux of 10,000 IDs is processed with `.flatMap(id -> callRemote(id))` where
      callRemote hits a downstream HTTP service. Operations wanted "as parallel as
      possible" but ops observes at most 256 concurrent in-flight calls. Why?
    options:
      - "flatMap's default concurrency parameter is Queues.SMALL_BUFFER_SIZE (256), so it subscribes to at most 256 inner publishers at once; pass an explicit concurrency argument to raise or lower it"
      - "Netty caps outbound connections at 256 regardless of code"
      - "The JVM default thread pool has exactly 256 threads"
      - "flatMap is actually concatMap under the hood and runs strictly sequentially"
    answer: 0
    explanation: |
      flatMap(fn) defaults its max concurrency to Queues.SMALL_BUFFER_SIZE = 256:
      it will subscribe to at most 256 inner publishers simultaneously and only
      pull more source items as inners complete. flatMap(fn, concurrency) tunes
      this — often you LOWER it to protect a downstream, not raise it.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-060
    difficulty: expert
    tags: [operators, flatmapsequential, concatmap, ordering]
    question: |
      Ordering must be preserved AND downstream calls should fire concurrently
      (not one-at-a-time). A dev picks flatMapSequential. What is the key
      performance/memory caveat versus concatMap?
    options:
      - "flatMapSequential preserves order by running inners sequentially, identical to concatMap"
      - "flatMapSequential subscribes to inners eagerly (concurrently) but must BUFFER completed-out-of-order results until earlier ones emit, so a slow early item holds back and accumulates later completed results in memory; concatMap avoids buffering by running strictly one at a time"
      - "flatMapSequential drops out-of-order items; concatMap keeps them"
      - "There is no difference; both are aliases"
    answer: 1
    explanation: |
      flatMapSequential gains concurrency (eager subscription up to its concurrency
      limit) but restores original order by buffering results that complete before
      their predecessors. A slow first inner therefore stalls emission and lets
      later results pile up in memory. concatMap trades concurrency for zero
      reordering buffer.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-061
    difficulty: expert
    tags: [operators, switchmap, cancellation]
    question: |
      Using switchMap over a burst of rapidly-arriving source items where each
      inner performs a non-idempotent DB write, what correctness hazard exists?
    options:
      - "switchMap cancels the previous inner when a new source item arrives; a DB write started in a cancelled inner may have already partially executed or committed but its completion signal is discarded, and cancellation does not roll back the side effect — leaving inconsistent state"
      - "switchMap guarantees every inner completes, so there is no hazard"
      - "switchMap buffers all inners and runs them at the end, so writes happen twice"
      - "switchMap only works with Mono, so it would fail to compile with a DB Flux"
    answer: 0
    explanation: |
      switchMap cancels the in-flight previous inner on each new source emission.
      Cancellation stops further signals but does NOT undo side effects already
      performed (a write may have hit the DB). For non-idempotent writes this
      causes inconsistency; use concatMap/flatMap or make operations idempotent.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-062
    difficulty: advanced
    tags: [error-handling, flatmap, isolation]
    question: |
      `idFlux.flatMap(id -> repo.findById(id))` — one findById errors. What happens
      to the OTHER concurrently-running inner lookups and the outer Flux?
    options:
      - "The error propagates to the outer Flux, which terminates with onError and cancels the other in-flight inners; to isolate failures, attach onErrorResume/onErrorReturn to the INNER publisher"
      - "Only the failing inner is dropped; all others complete normally and the outer Flux completes successfully"
      - "flatMap automatically retries the failing inner three times before failing"
      - "The outer Flux pauses until the failing inner is manually resumed"
    answer: 0
    explanation: |
      An unhandled inner error propagates out of flatMap: the outer sequence emits
      onError and Reactor cancels the remaining in-flight inners. To make per-item
      failures isolated, handle the error on the inner publisher
      (repo.findById(id).onErrorResume(...)) so the outer never sees it.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-063
    difficulty: expert
    tags: [error-handling, onerrorcontinue, context]
    question: |
      Which statement most accurately describes how onErrorContinue differs
      mechanically from onErrorResume?
    options:
      - "They are synonyms; onErrorContinue is just the newer name"
      - "onErrorContinue only works on Mono; onErrorResume only on Flux"
      - "onErrorResume terminates the failing sequence and swaps in a fallback publisher; onErrorContinue writes into the Reactor Context to instruct COMPATIBLE upstream operators (map/flatMap) to drop the offending element and keep the same sequence alive, which is why it only works with operators that opted in and can behave surprisingly across flatMap boundaries"
      - "onErrorContinue retries the element while onErrorResume skips it"
    answer: 2
    explanation: |
      onErrorContinue is not a normal downstream operator: it uses the Context to
      reach upstream operators that support it, telling them to discard the failing
      element and continue the same stream (no terminal signal). Its reliance on
      operator opt-in and context makes it leaky and often surprising; per-item
      recovery via inner onErrorResume is more predictable.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-064
    difficulty: advanced
    tags: [error-handling, retry, semantics]
    question: |
      A cold WebClient call is wrapped with `.retry(3)`. The downstream is
      permanently down. How many TOTAL HTTP attempts are made, and why does retry
      re-issue the request at all?
    options:
      - "3 attempts, because retry(n) means n total attempts; it works by replaying cached results"
      - "1 attempt; retry only re-delivers the already-received error"
      - "4 attempts (1 initial + 3 retries), because retry re-SUBSCRIBES to the upstream, and a cold WebClient publisher re-executes the request on each subscription"
      - "Infinite attempts; retry(3) sets the backoff exponent, not a limit"
    answer: 2
    explanation: |
      retry(n) counts retries, not total attempts, so retry(3) allows up to 4
      executions. It functions by re-subscribing to upstream; because a WebClient
      call is a cold publisher, each subscription fires a brand-new HTTP request.
    ref: "concepts.md#error-handling-in-reactive-chains"

  - id: reactive-webflux-065
    difficulty: expert
    tags: [schedulers, subscribeon, parallelism]
    question: |
      A dev writes `flux.subscribeOn(Schedulers.parallel()).map(cpuHeavy1).map(cpuHeavy2)`
      expecting the two CPU-heavy maps to run in parallel on multiple cores. What
      actually happens?
    options:
      - "Each map runs on a separate core automatically"
      - "The maps run on the boundedElastic pool instead of parallel"
      - "It throws because map cannot follow subscribeOn"
      - "subscribeOn moves the ENTIRE chain onto ONE worker thread of the parallel pool; the maps run sequentially on that single thread — subscribeOn does not parallelize. Real parallelism needs flatMap with per-item subscribeOn, or .parallel(n).runOn(scheduler)"
    answer: 3
    explanation: |
      subscribeOn changes WHERE the chain runs, not HOW MANY threads it uses — the
      whole linear chain executes on a single worker of the pool, so the maps are
      sequential. To parallelize across cores use ParallelFlux
      (.parallel(n).runOn(...)) or flatMap over inners each subscribed on a
      scheduler.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-066
    difficulty: expert
    tags: [schedulers, multiple-subscribeon, gotcha]
    question: |
      In `Flux.range(1,3).subscribeOn(schedA).map(f).subscribeOn(schedB)`, which
      scheduler does the SOURCE (Flux.range) emit on?
    options:
      - "schedB, because the last subscribeOn wins"
      - "Both alternate items between schedA and schedB"
      - "schedA, because when multiple subscribeOn are present, the one CLOSEST TO THE SOURCE determines where subscription/emission begins; the later subscribeOn has little additional effect on source placement"
      - "The calling thread, because subscribeOn is ignored when used twice"
    answer: 2
    explanation: |
      Unlike publishOn (where each occurrence re-routes everything downstream of
      it), only the subscribeOn nearest the source governs where the source is
      subscribed and emits. Additional downstream subscribeOn calls do not move the
      source again.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-067
    difficulty: advanced
    tags: [schedulers, publishon, blocking, placement]
    question: |
      You must call a blocking `legacyDao.load()` mid-chain. You write
      `source.map(x -> transform(x)).publishOn(Schedulers.boundedElastic()).map(x -> legacyDao.load(x))`.
      Is the blocking call safe, and what nuance matters?
    options:
      - "Safe — publishOn shifts everything DOWNSTREAM of it (including the blocking map) onto boundedElastic; the nuance is that operators UPSTREAM of the publishOn still run on the original thread (possibly the event loop), so placement of publishOn is load-bearing"
      - "Unsafe — publishOn cannot protect blocking calls; only subscribeOn can"
      - "Safe only if you also add .block() after it"
      - "Unsafe — boundedElastic threads are also non-blocking and BlockHound will flag it"
    answer: 0
    explanation: |
      publishOn re-routes downstream operators to the given scheduler, so a
      blocking call placed AFTER publishOn(boundedElastic()) runs on a
      blocking-safe pool. The catch: everything before the publishOn keeps running
      on the original (possibly event-loop) thread, so you must place publishOn
      before the blocking work. boundedElastic threads are explicitly allowed to
      block.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-068
    difficulty: intermediate
    tags: [schedulers, delay, blocking]
    question: |
      Inside a reactive chain running on a Netty event-loop thread you need a
      2-second delay before the next step. Which is correct and non-blocking?
    options:
      - "Thread.sleep(2000) inside a map"
      - "await Thread.currentThread().wait(2000)"
      - "TimeUnit.SECONDS.sleep(2) in a flatMap"
      - "Mono.delay(Duration.ofSeconds(2)) / .delayElement(Duration.ofSeconds(2)), which schedule on a timer (Schedulers.parallel) without blocking the thread"
    answer: 3
    explanation: |
      Thread.sleep blocks the event loop. Mono.delay / delayElement use a timed
      scheduler (parallel) to resume the chain after the delay without occupying a
      thread while waiting — the non-blocking equivalent of sleep.
    ref: "concepts.md#schedulers-and-threading-in-reactor"

  - id: reactive-webflux-069
    difficulty: expert
    tags: [context, contextwrite, gotcha]
    question: |
      Given:
      `Mono.deferContextual(ctx -> Mono.just(ctx.getOrDefault("k","none"))).contextWrite(c -> c.put("k","v"))`
      What does the Mono emit, and what principle does this demonstrate?
    options:
      - "'none', because contextWrite placed AFTER deferContextual runs too late"
      - "It throws because Context keys must be typed"
      - "'v', because the Reactor Context is immutable and propagates UPSTREAM during subscription — contextWrite affects operators ABOVE (earlier in the chain than) it, so deferContextual sees the written value even though it appears first"
      - "An empty Mono, because contextWrite consumes the value"
    answer: 2
    explanation: |
      The Reactor Context flows from the subscriber upward at subscription time, so
      contextWrite influences operators that are upstream of it (which, reading
      top-to-bottom, appear earlier). deferContextual therefore observes k='v'.
      This 'context reads backwards' behavior is a classic trap.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-070
    difficulty: expert
    tags: [transactions, context, subscribe]
    question: |
      A @Transactional reactive method does `repoA.save(a).flatMap(x -> repoB.save(b));`
      but also fires a "side" write via `repoC.save(c).subscribe();` (note the
      explicit subscribe). After a later failure the tx rolls back A and B but NOT
      C. Why?
    options:
      - "repoC is a different database, so it cannot participate"
      - "Because the reactive transaction context rides in the Reactor Context of the ONE subscription the method returns; calling .subscribe() on repoC starts an INDEPENDENT subscription with a fresh Context, so that write runs outside the transaction"
      - "subscribe() always commits immediately, bypassing all transactions"
      - "@Transactional only works on the first statement in a method"
    answer: 1
    explanation: |
      Reactive transactions bind connection/tx state to the subscriber's Reactor
      Context, not a ThreadLocal. Everything must be composed into the single
      returned chain (flatMap/then) to share that context. An inner .subscribe()
      spawns a separate subscription with its own context, escaping the transaction.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-071
    difficulty: advanced
    tags: [context, micrometer, propagation]
    question: |
      In Spring Boot 3.x with Micrometer Context Propagation, what problem does
      Hooks.enableAutomaticContextPropagation() (default-on for WebFlux) solve?
    options:
      - "It makes ThreadLocals faster than Reactor Context"
      - "It disables the Reactor Context entirely and reverts to ThreadLocals"
      - "It automatically bridges registered ThreadLocal accessors (MDC, tracing, security) to and from the Reactor Context across publishOn/subscribeOn thread hops, so tracing/log context survives scheduler changes without manual contextWrite everywhere"
      - "It forces all operators onto a single thread to preserve ThreadLocals"
    answer: 2
    explanation: |
      The context-propagation library registers ThreadLocalAccessors; enabling
      automatic propagation restores/captures those ThreadLocals around thread
      boundaries by syncing them with the Reactor Context — fixing lost MDC/trace
      IDs without hand-written contextWrite/deferContextual at every hop.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-072
    difficulty: expert
    tags: [sinks, concurrency, thread-safety]
    question: |
      Two threads concurrently call `sink.tryEmitNext(x)` on a
      Sinks.many().multicast() sink. What is the defined behavior?
    options:
      - "One (or both) may return EmitResult.FAIL_NON_SERIALIZED, because Reactive Streams forbids concurrent onNext; Sinks detect the race and refuse rather than corrupt the stream — the caller must serialize emissions (or use an EmitFailureHandler like busyLooping)"
      - "Both succeed; Sinks internally lock and serialize the emissions"
      - "It throws OutOfMemoryError"
      - "The second emission silently overwrites the first with no signal"
    answer: 0
    explanation: |
      The Reactive Streams spec requires serialized onNext signals. tryEmitNext
      detects concurrent emission and returns FAIL_NON_SERIALIZED instead of
      violating the contract. You must ensure single-threaded emission or handle the
      failure result (e.g., busy-loop retry) yourself.
    ref: "concepts.md#sinks-multicasting-and-hot-streams"

  - id: reactive-webflux-073
    difficulty: advanced
    tags: [sinks, multicast, hot-cold]
    question: |
      You expose events via `Sinks.many().multicast().onBackpressureBuffer()` and a
      subscriber attaches 5 seconds after several events were emitted. What does the
      late subscriber receive by default?
    options:
      - "All previously emitted events, replayed from the beginning"
      - "The single most recent event, then live events"
      - "An error, because multicast requires all subscribers to attach simultaneously"
      - "Only events emitted AFTER it subscribed; a plain multicast sink does not replay history to late subscribers (use Sinks.many().replay() for replay semantics)"
    answer: 3
    explanation: |
      A multicast sink is hot — it forwards live emissions to current subscribers
      only; late subscribers miss earlier items. To replay history (all or last N),
      use Sinks.many().replay(). (The buffer in onBackpressureBuffer is for
      backpressure toward slow subscribers, not historical replay.)
    ref: "concepts.md#sinks-multicasting-and-hot-streams"

  - id: reactive-webflux-074
    difficulty: advanced
    tags: [hot-cold, share, refcount]
    question: |
      A cold Flux runs an expensive query. Three subscribers subscribe to it, and
      the query executes three times. You add `.share()`. What changes, and what is
      the risk for a subscriber that attaches slightly later?
    options:
      - ".share() caches all results forever, so every subscriber (early or late) sees the full sequence"
      - ".share() switches the Flux to boundedElastic so the query runs faster"
      - ".share() = publish().refCount(1): the source is subscribed ONCE when the first subscriber arrives and multicast to all current subscribers; a subscriber attaching after emission started may MISS earlier items, and if all subscribers leave the source is cancelled"
      - ".share() forces sequential subscription, running the query three times but serially"
    answer: 2
    explanation: |
      share() makes the cold source hot via publish().refCount(1): one upstream
      subscription is shared among concurrent subscribers, so the query runs once —
      but because it is now hot, late subscribers miss items emitted before they
      joined. Use cache()/replay() if late subscribers must see history.
    ref: "concepts.md#sinks-multicasting-and-hot-streams"

  - id: reactive-webflux-075
    difficulty: expert
    tags: [webclient, connection-pool, exchange]
    question: |
      A team uses `webClient.get().uri(...).exchange()` and under load sees
      PoolAcquirePendingLimitException and connection leaks. What is the root cause
      and the recommended fix?
    options:
      - "exchange() opens too many event-loop threads; raise the Netty thread count"
      - "The connection pool default is 1; there is no way to increase it"
      - "PoolAcquirePendingLimitException means the DNS cache expired; disable DNS caching"
      - "exchange() (deprecated) returns a ClientResponse whose body MUST be consumed/released or the connection is never returned to the pool, eventually exhausting it; switch to retrieve() or exchangeToMono() which guarantee body release"
    answer: 3
    explanation: |
      exchange() is deprecated precisely because failing to consume/release the
      ClientResponse body leaks the pooled connection; enough leaks exhaust the pool
      and new acquisitions fail. retrieve()/exchangeToMono() manage body release
      automatically.
    ref: "concepts.md#webclient-internals-connection-pooling-and-timeouts"

  - id: reactive-webflux-076
    difficulty: advanced
    tags: [webclient, timeouts]
    question: |
      Relying solely on the Reactor `.timeout(Duration.ofSeconds(2))` operator on a
      WebClient call is insufficient for robust timeouts. Why?
    options:
      - "The .timeout operator does not exist for Mono"
      - ".timeout blocks the event loop while counting down"
      - ".timeout cancels the subscription after the duration but there are distinct lower-level timeouts (TCP connect, response timeout, read/write idle, pool-acquire) governed by the Netty HttpClient; a slow connection establishment or a stuck read may need those configured too, and .timeout alone can leave underlying handling to defaults"
      - ".timeout only works if you also call .block()"
    answer: 2
    explanation: |
      There are multiple independent timeout layers (connect, response, read/write
      idle, connection-acquire) at the Reactor Netty level, plus the Reactor
      .timeout operator. Robust configuration sets the transport-level timeouts on
      the HttpClient in addition to (or instead of) the operator, which merely
      cancels the subscription.
    ref: "concepts.md#webclient-internals-connection-pooling-and-timeouts"

  - id: reactive-webflux-077
    difficulty: expert
    tags: [streaming, json, media-type, backpressure]
    question: |
      A controller returns `Flux<Trade>` produced with the default
      `application/json` media type from an endpoint expected to "stream" thousands
      of trades. The client complains it receives nothing until the very end. Why,
      and what media type fixes true streaming?
    options:
      - "With application/json a Flux is rendered as a SINGLE JSON ARRAY, so the framework emits one document (the client sees it when the array is complete/flushed); to stream item-by-item use application/x-ndjson or text/event-stream, which flush each element as produced and enable per-item backpressure over the connection"
      - "JSON cannot serialize a Flux; return List<Trade> instead"
      - "Netty buffers all JSON by default; disabling the buffer streams it"
      - "You must call .subscribe() per element to flush"
    answer: 0
    explanation: |
      A JSON response of a Flux is one array document, so the consumer effectively
      gets it as a whole rather than incrementally. Newline-delimited JSON
      (x-ndjson) or SSE (text/event-stream) flush each item as it is produced,
      giving true streaming and end-to-end backpressure.
    ref: "concepts.md#streaming-sse-websocket-and-json-serialization"

  - id: reactive-webflux-078
    difficulty: advanced
    tags: [websocket, handler, lifecycle]
    question: |
      A WebFlux WebSocketHandler's `handle(WebSocketSession session)` returns
      Mono<Void>. What does completing that Mono do, and how do you keep the socket
      open while echoing messages?
    options:
      - "Completing it sends a heartbeat; return Mono.never() to close"
      - "Completing the returned Mono<Void> signals the end of the session (closes the socket); to keep it open you compose the receive/send pipelines (e.g., session.send(session.receive()...)) so the returned Mono only completes when that composed flow completes"
      - "The return value is ignored; the socket closes only on client disconnect"
      - "You must return a Flux<WebSocketMessage>, not Mono<Void>"
    answer: 1
    explanation: |
      The Mono<Void> represents the session lifetime — when it completes/errors the
      session ends. You wire inbound (session.receive()) and outbound
      (session.send(...)) into that returned Mono so the socket stays open for the
      duration of the composed pipeline.
    ref: "concepts.md#streaming-sse-websocket-and-json-serialization"

  - id: reactive-webflux-079
    difficulty: expert
    tags: [backpressure, http, tcp, streaming]
    question: |
      For a `text/event-stream` endpoint, how does end-to-end backpressure actually
      reach the server Flux when a browser consumer reads slowly?
    options:
      - "The browser sends explicit request(n) frames over HTTP that map to Reactor demand"
      - "HTTP/1.1 has no flow control, so backpressure is impossible; the server always drops events"
      - "Reactor Netty maps downstream demand onto TCP flow control: when the slow client stops reading, the OS TCP receive window fills, Netty stops reading/writing, and the server-side Flux observes reduced demand — so backpressure is realized via TCP, and only for streaming media types (not the single JSON array case)"
      - "The server polls the client every 100 ms to check readiness"
    answer: 2
    explanation: |
      There is no application-level request(n) over HTTP. Instead Reactor Netty
      ties demand to TCP flow control (the socket write buffer / window). A slow
      consumer causes the write buffer to fill, which throttles the server Flux.
      This holds for streaming responses, not a single aggregated JSON array.
    ref: "concepts.md#streaming-sse-websocket-and-json-serialization"

  - id: reactive-webflux-080
    difficulty: expert
    tags: [testing, stepverifier, gotcha]
    question: |
      A test reads:
      `StepVerifier.create(service.stream()).expectNext("a").expectNext("b").expectComplete();`
      It always passes even when service.stream() emits wrong values. What is wrong?
    options:
      - "expectNext is deprecated; use assertNext"
      - "You must call .block() before create"
      - "The chain is never triggered because the terminal .verify() (or verifyComplete/verifyError) call is missing — without it StepVerifier never subscribes or asserts, so the test is a silent no-op"
      - "expectComplete must come before expectNext"
    answer: 2
    explanation: |
      StepVerifier is lazy: the expectations are only evaluated when you invoke a
      terminal verify method (verify()/verifyComplete()/verifyError()). Omitting it
      means nothing subscribes and no assertion runs — a green but meaningless test.
    ref: "concepts.md#testing-reactive-code-stepverifier-and-virtual-time"

  - id: reactive-webflux-081
    difficulty: advanced
    tags: [testing, virtual-time, stepverifier]
    question: |
      To test `Flux.interval(Duration.ofHours(1)).take(3)` without waiting 3 real
      hours, which StepVerifier approach is correct?
    options:
      - "StepVerifier.create(flux).thenAwait(Duration.ofHours(3)) — create fast-forwards time automatically"
      - "Use Thread.sleep(3*3600*1000) in the test"
      - "Replace interval with delayElement; virtual time cannot test interval"
      - "StepVerifier.withVirtualTime(() -> Flux.interval(...).take(3)).thenAwait(Duration.ofHours(3)).expectNext(0L,1L,2L).verifyComplete() — the SUPPLIER lambda ensures the interval is assembled within the VirtualTimeScheduler's scope so thenAwait can advance the virtual clock"
    answer: 3
    explanation: |
      withVirtualTime takes a Supplier so the time-based publisher is created inside
      the virtual-time scheduler's context; thenAwait then advances the virtual
      clock instantly. Passing an already-assembled Flux to create() would use the
      real parallel scheduler and not be virtualized.
    ref: "concepts.md#testing-reactive-code-stepverifier-and-virtual-time"

  - id: reactive-webflux-082
    difficulty: expert
    tags: [cancellation, doFinally, side-effects]
    question: |
      A long-running Mono chain performs a partial DB write, then the HTTP client
      disconnects, triggering cancellation. The partial write is NOT rolled back.
      Which statement is correct?
    options:
      - "Cancellation is an upstream signal that stops further emissions/work but does NOT undo already-performed side effects; to react to it use doOnCancel/doFinally, and design writes to be idempotent or wrapped in a reactive transaction that the cancellation aborts"
      - "Cancellation automatically rolls back any in-progress writes"
      - "Cancellation is impossible in WebFlux; the request always completes"
      - "doOnComplete fires on cancellation and can undo the write"
    answer: 0
    explanation: |
      Cancellation flows upstream and halts further processing, but it does not
      reverse side effects already committed. Use doOnCancel/doFinally(SignalType)
      to observe it, and rely on idempotency or a reactive transaction (which will
      not commit if aborted) for correctness.
    ref: "concepts.md#cancellation-and-resource-cleanup"

  - id: reactive-webflux-083
    difficulty: advanced
    tags: [cancellation, doFinally, resources]
    question: |
      You need to release a resource whether the sequence completes, errors, OR is
      cancelled. Which operator fits, and how does it differ from doOnComplete +
      doOnError?
    options:
      - "doOnTerminate — it also covers cancellation"
      - "finally { } block around the pipeline works the same"
      - "doFinally(signalType -> ...) — it runs exactly once on ANY terminal condition including cancel; doOnComplete/doOnError/doOnTerminate do NOT fire on cancellation, so they would leak the resource when the subscriber cancels"
      - "doOnNext, because cleanup should happen per item"
    answer: 2
    explanation: |
      doFinally receives a SignalType (ON_COMPLETE, ON_ERROR, CANCEL) and runs once
      on any terminal signal, making it the correct hook for cleanup that must also
      cover cancellation. doOnTerminate covers complete/error but not cancel.
    ref: "concepts.md#cancellation-and-resource-cleanup"

  - id: reactive-webflux-084
    difficulty: expert
    tags: [backpressure, prefetch, internals]
    question: |
      A subscriber requests Long.MAX_VALUE downstream of a `publishOn`. Does
      publishOn request Long.MAX_VALUE from its upstream source?
    options:
      - "Yes, unbounded demand always propagates unchanged to the source"
      - "No — it requests exactly 1 at a time always"
      - "It requests the number of CPU cores"
      - "No — publishOn (like flatMap/concatMap) requests a bounded PREFETCH (default 256) from upstream and replenishes as items are drained (~75% threshold), regardless of unbounded downstream demand; this bounds its internal queue and prevents unbounded buffering"
    answer: 3
    explanation: |
      Queueing operators decouple downstream demand from upstream demand: publishOn
      requests a bounded prefetch (Queues.SMALL_BUFFER_SIZE = 256 by default) and
      tops up as its queue drains, so 'unbounded downstream' does not translate to
      'ask the source for everything at once'.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-085
    difficulty: expert
    tags: [operators, zip, empty, gotcha]
    question: |
      `Mono.zip(userService.getUser(id), orderService.getOrders(id)).map(...)` —
      getOrders returns Mono.empty() (user has no orders). What does the zipped
      Mono emit?
    options:
      - "A tuple with a null second element"
      - "An error, because zip cannot handle empty sources"
      - "Nothing — the zipped Mono COMPLETES EMPTY, because Mono.zip requires ALL sources to emit a value; if any source completes empty, the combined Mono completes empty (the .map never runs). Use defaultIfEmpty/switchIfEmpty on the empty source to supply a placeholder"
      - "A tuple with an Optional.empty() second element"
    answer: 2
    explanation: |
      Mono.zip only emits when every source emits; an empty source makes the whole
      zip complete empty (no tuple, map skipped). A very common surprise — guard
      each optionally-empty source with defaultIfEmpty to keep the combination
      producing a value.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-086
    difficulty: advanced
    tags: [operators, then, thenmany, semantics]
    question: |
      `repo.deleteAll().thenMany(repo.saveAll(items))` — what is the guarantee, and
      what value(s) does the resulting publisher emit?
    options:
      - "It runs deleteAll and saveAll concurrently and emits both results interleaved"
      - "It emits deleteAll's count followed by the saved items"
      - "It emits nothing because thenMany discards all values"
      - "thenMany ignores deleteAll's (Void) emissions and only subscribes to saveAll AFTER deleteAll completes, emitting the saved items; sequencing-by-completion is guaranteed"
    answer: 3
    explanation: |
      then/thenMany discard the upstream's values but wait for its completion before
      subscribing to the next publisher. So deleteAll runs to completion first, then
      saveAll runs and its items are emitted downstream.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-087
    difficulty: expert
    tags: [pitfalls, blocking, boundedElastic, saturation]
    question: |
      To "fix" blocking JDBC in WebFlux, a team wraps every DAO call in
      `Mono.fromCallable(...).subscribeOn(Schedulers.boundedElastic())`. Under heavy
      load latency still collapses. What is the subtle problem?
    options:
      - "boundedElastic is CAPPED (default ~10x CPU cores threads, with a bounded task queue); under high concurrency all its threads are stuck in blocking JDBC and tasks queue up — you have merely moved the thread-per-blocking-call bottleneck off the event loop, not eliminated it. True scalability needs a non-blocking driver (R2DBC) or right-sizing the pool to the DB connection pool"
      - "boundedElastic is not allowed to block; BlockHound blocks it"
      - "subscribeOn does not work with fromCallable"
      - "Mono.fromCallable executes eagerly, so it never offloads"
    answer: 0
    explanation: |
      Offloading to boundedElastic protects the event loop but reintroduces a
      thread-per-blocking-call model on a capped pool. If blocking calls outnumber
      available threads, tasks queue and latency spikes — the fundamental blocking
      bottleneck remains. R2DBC (non-blocking) is the real fix; otherwise MVC may be
      simpler.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-088
    difficulty: advanced
    tags: [pitfalls, side-effects, doOnNext]
    question: |
      A dev mutates shared state inside `.doOnNext(item -> counter++)` on a Flux
      that later has `.flatMap(...)` with concurrency, and the counter is wrong.
      What is the best explanation?
    options:
      - "doOnNext is not called for every item"
      - "doOnNext runs after onComplete, so the count is off by one"
      - "counter++ is fine; the bug is in flatMap ordering"
      - "Downstream concurrent operators can invoke callbacks on multiple threads, and a non-atomic counter++ is a data race; use an AtomicInteger/AtomicLong or accumulate reactively (e.g., count()/reduce). Reactor serializes signals PER SUBSCRIBER but concurrency introduced by flatMap inners means shared mutable state must be thread-safe"
    answer: 3
    explanation: |
      While signals to a single subscriber are serialized, operators like flatMap
      introduce concurrency across inner publishers/threads, so shared mutable state
      touched from callbacks must be thread-safe. Prefer atomics or reactive
      accumulation (reduce/count/scan) over mutating external variables.
    ref: "concepts.md#common-pitfalls-blocking-in-a-reactive-chain"

  - id: reactive-webflux-089
    difficulty: expert
    tags: [mvc-vs-webflux, virtual-threads, tradeoffs]
    question: |
      With Java 21 virtual threads (Project Loom) and Spring Boot 3.2+
      (spring.threads.virtual.enabled=true), how does the WebFlux value proposition
      shift?
    options:
      - "WebFlux becomes obsolete; virtual threads are strictly superior in every case"
      - "Virtual threads only work with WebFlux, not MVC"
      - "Virtual threads eliminate backpressure entirely, so streaming is no longer needed"
      - "Virtual threads let blocking MVC-style code scale to many concurrent requests cheaply, narrowing WebFlux's advantage for the 'many blocking I/O calls' case; however WebFlux still uniquely offers composable streaming, end-to-end backpressure, and declarative operators (retry/timeout/zip), which virtual threads alone do not provide"
    answer: 3
    explanation: |
      Virtual threads make blocking code cheap to scale, reducing the concurrency
      motivation for WebFlux in blocking-I/O scenarios. But they do not provide
      Reactor's streaming semantics, backpressure, or declarative operator
      composition — so WebFlux remains distinct for streaming/backpressure-heavy
      designs.
    ref: "concepts.md#when-to-choose-webflux"

  - id: reactive-webflux-090
    difficulty: advanced
    tags: [operators, buffer, window, throughput]
    question: |
      You want to batch items from a fast Flux into groups of 100 (or every 1
      second, whichever first) before a bulk DB insert. Which operator family fits?
    options:
      - "buffer(100, ...) / bufferTimeout(100, Duration.ofSeconds(1)) to collect items into List batches (window(...) is the analogous Flux-of-Flux version) which you then bulk-insert"
      - "flatMap with concurrency 100"
      - "reduce, which emits a single list at the very end only"
      - "collectList, which is identical to buffer"
    answer: 0
    explanation: |
      bufferTimeout(maxSize, maxTime) groups items into Lists by count or elapsed
      time, ideal for micro-batching writes. window is the same idea but emits inner
      Flux batches. reduce/collectList emit only once at completion, so they don't
      batch a continuous stream.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-091
    difficulty: expert
    tags: [operators, cache, hot-cold, memory]
    question: |
      An expensive cold Mono is shared as a bean and reused with `.cache()`. A month
      later the app OOMs slowly. Which explanation is most plausible?
    options:
      - "cache() re-runs the source on every subscribe, leaking each result"
      - "cache() only works on Flux, so on a Mono it silently buffers infinitely"
      - "cache() disables garbage collection for the JVM"
      - "cache() with no TTL memoizes the emitted value(s) for the LIFETIME of the publisher and never evicts; if the cached Flux holds a large/growing dataset (or many distinct cached publishers accumulate), memory is retained indefinitely — use cache(ttl) or cache(maxSize) to bound it"
    answer: 3
    explanation: |
      cache() memoizes results and replays them to all future subscribers,
      retaining them for the publisher's lifetime with no eviction by default. A
      large cached payload — or unbounded accumulation of cached publishers — is a
      classic slow memory leak; bound it with a TTL or size.
    ref: "concepts.md#sinks-multicasting-and-hot-streams"

  - id: reactive-webflux-092
    difficulty: advanced
    tags: [reactive-streams, contract, serialization]
    question: |
      A custom Publisher implementation calls onNext from two threads
      simultaneously for the same Subscriber. Which Reactive Streams rule does this
      violate, and what is a typical consequence?
    options:
      - "It violates nothing; concurrent onNext is allowed if backpressure is honored"
      - "It violates the rule that request(n) must be positive"
      - "It violates the rule that Publishers must be hot"
      - "It violates the rule that signals (onNext/onError/onComplete) to a given Subscriber MUST be serialized (no concurrent invocation); consequences include corrupted operator state, lost items, or ambiguous terminal signals — Reactor operators assume serialized signals and are not internally synchronized for concurrent onNext"
    answer: 3
    explanation: |
      Rule 1.3 of Reactive Streams requires serialized signal delivery per
      subscriber. Reactor operators are built on this assumption and are not
      thread-safe against concurrent onNext, so violating it corrupts state. Use a
      serializing construct (e.g., Sinks with proper handling, or Flux.create which
      serializes) to emit from multiple threads.
    ref: "concepts.md#reactive-programming-and-reactive-streams"

  - id: reactive-webflux-093
    difficulty: expert
    tags: [webclient, event-loop, deadlock]
    question: |
      Inside a WebClient response handler chain (running on a Netty event-loop
      thread) a dev calls `.block()` on ANOTHER WebClient call that must be served
      by the SAME event-loop group. Beyond the usual "blocking is bad," what acute
      failure can occur?
    options:
      - "Nothing different; it just wastes a thread"
      - "Netty spawns a new event loop to service the nested call, so it succeeds"
      - "The nested call is automatically moved to boundedElastic"
      - "A deadlock/stall: the blocked event-loop thread cannot process the I/O for the nested call it is waiting on (the loop it occupies is the very one that would complete that call), so it waits forever; Reactor typically pre-empts this by throwing 'block()... not supported in thread reactor-http-nio-*'"
    answer: 3
    explanation: |
      Blocking an event-loop thread while it waits on work that the same loop must
      execute is a self-deadlock. Reactor guards against this by detecting block()
      on non-blocking threads and throwing IllegalStateException, but the underlying
      hazard is a stalled loop.
    ref: "concepts.md#webclient-internals-connection-pooling-and-timeouts"

  - id: reactive-webflux-094
    difficulty: intermediate
    tags: [operators, generate, create, backpressure]
    question: |
      What is the key difference between Flux.generate and Flux.create for building
      a custom publisher?
    options:
      - "Flux.generate is SYNCHRONOUS and emits AT MOST ONE item per request (naturally honoring backpressure, one-at-a-time); Flux.create is for ASYNCHRONOUS, possibly multi-threaded emission of many items and requires an OverflowStrategy because the source may not honor demand"
      - "generate is deprecated in favor of create"
      - "generate is for Mono; create is for Flux"
      - "create is synchronous; generate is asynchronous"
    answer: 0
    explanation: |
      generate uses a synchronous, state-based SynchronousSink emitting one item per
      call, so it inherently respects backpressure. create bridges async/multi-valued
      sources (callbacks, listeners) that may emit regardless of demand, hence it
      needs an OverflowStrategy.
    ref: "concepts.md#publisher-subscriber-subscription-and-backpressure"

  - id: reactive-webflux-095
    difficulty: expert
    tags: [operators, flatmap, ordering, subtle]
    question: |
      With `Flux.just(1,2,3).flatMap(i -> Mono.just(i).delayElement(Duration.ofMillis(400 - i*100)))`,
      in what order are values most likely emitted, and why?
    options:
      - "1,2,3 — flatMap preserves source order"
      - "It errors because delayElement is not allowed inside flatMap"
      - "3,2,1 — because flatMap subscribes to all three inners concurrently and emits each as its delay elapses; item 3 has the shortest delay (100 ms), then 2 (200 ms), then 1 (300 ms), so they emit in reverse of the source order"
      - "Only 3 is emitted; the others are cancelled"
    answer: 2
    explanation: |
      flatMap runs inners concurrently and emits results as they arrive. Delays are
      400-100=300 ms for 1, 200 ms for 2, 100 ms for 3, so 3 completes first, then 2,
      then 1 — emission order is 3,2,1. concatMap would force 1,2,3.
    ref: "concepts.md#project-reactor-operators-map-flatmap-zip"

  - id: reactive-webflux-096
    difficulty: advanced
    tags: [functional-endpoints, filter, handlerfilter]
    question: |
      In the functional endpoint model, how do you apply cross-cutting concerns
      (like auth or logging) across routes, analogous to a servlet Filter/
      HandlerInterceptor?
    options:
      - "You cannot; functional endpoints don't support filters"
      - "Annotate the handler with @Around like Spring AOP"
      - "Only @ControllerAdvice works, which requires annotated controllers"
      - "Use RouterFunction.filter(HandlerFilterFunction) (or .filter on the builder) to wrap HandlerFunctions, and/or a WebFilter bean for global concerns; HandlerFilterFunction receives (request, next) and returns Mono<ServerResponse>"
    answer: 3
    explanation: |
      Functional routing supports HandlerFilterFunction via
      RouterFunction/builder.filter((request, next) -> ...), letting you wrap
      handlers. For truly global concerns a WebFilter bean applies across both
      programming models on the reactive stack.
    ref: "concepts.md#functional-endpoints-routerfunctionhandlerfunction-vs-annotated-controllers"

  - id: reactive-webflux-097
    difficulty: expert
    tags: [context, security, deferContextual]
    question: |
      Reactive Spring Security stores the authentication in the Reactor Context via
      ReactiveSecurityContextHolder. A dev captures the principal in a controller
      field at bean-construction time and reuses it. Why is this catastrophic?
    options:
      - "Fields are always null in WebFlux"
      - "Spring Security is not available in WebFlux"
      - "ReactiveSecurityContextHolder uses ThreadLocal, so it works in fields"
      - "The bean (controller) is a shared singleton; there is no per-request field state. The security context lives in the per-subscription Reactor Context, so you must read it reactively (ReactiveSecurityContextHolder.getContext() / deferContextual) WITHIN the request chain — a captured field would leak one user's identity across all concurrent requests"
    answer: 3
    explanation: |
      Controllers are singletons shared across all concurrent requests; per-request
      identity must be obtained from the request's Reactor Context (via
      ReactiveSecurityContextHolder, which is Context-backed) inside the reactive
      chain. Caching it in a field would serve the wrong (or a stale) principal to
      other users.
    ref: "concepts.md#reactive-data-access-and-context"

  - id: reactive-webflux-098
    difficulty: advanced
    tags: [testing, webtestclient, binding]
    question: |
      Which statement about WebTestClient is accurate?
    options:
      - "It can only test against a fully started server on a real port"
      - "It can bind directly to a controller, a RouterFunction, an application context, or connect to a running server, and it works for both WebFlux and (via mock request/response) MVC endpoints; it is the reactive analogue of MockMvc/TestRestTemplate"
      - "It blocks the event loop and therefore cannot be used in reactive tests"
      - "It only asserts status codes, never response bodies"
    answer: 1
    explanation: |
      WebTestClient offers multiple bind modes (bindToController, bindToRouterFunction,
      bindToApplicationContext, bindToServer) and can also test MVC apps. It provides
      a fluent API to assert status, headers, and body (including expectBody(Class)/
      json), making it the standard reactive endpoint test client.
    ref: "concepts.md#testing-reactive-code-stepverifier-and-virtual-time"

  - id: reactive-webflux-099
    difficulty: expert
    tags: [operators, publish, connectableflux, timing]
    question: |
      `ConnectableFlux<Integer> cf = Flux.range(1,3).publish();` Two subscribers
      attach, THEN `cf.connect()` is called. What do the subscribers receive, and
      what would happen if only one subscriber attached before connect()?
    options:
      - "Each subscriber independently re-runs the range; connect() is a no-op"
      - "connect() throws if more than one subscriber is present"
      - "The subscribers each receive only the last item, 3"
      - "publish() creates a hot ConnectableFlux that emits nothing until connect(); both subscribers attached before connect() therefore both receive 1,2,3. Any subscriber attaching AFTER connect() begins would miss already-emitted items (hot semantics)"
    answer: 3
    explanation: |
      publish() yields a ConnectableFlux that defers emission until connect(),
      letting you line up all subscribers first so none miss items. It is hot: once
      connected, late subscribers miss earlier emissions. This is the manual control
      underneath share()/refCount().
    ref: "concepts.md#sinks-multicasting-and-hot-streams"

  - id: reactive-webflux-100
    difficulty: advanced
    tags: [error-handling, timeout, fallback, resilience]
    question: |
      Consider:
      `service.call().timeout(Duration.ofSeconds(1)).retryWhen(Retry.backoff(2, Duration.ofMillis(50))).onErrorResume(ex -> Mono.just(CACHED));`
      The downstream is slow (every call takes 3s). Describe the observable behavior.
    options:
      - "It waits 3s once, then returns the real result"
      - "It returns CACHED immediately without calling the service"
      - "It throws TimeoutException to the client because onErrorResume only catches WebClientResponseException"
      - "Each attempt times out after 1s (TimeoutException); retryWhen retries up to 2 times with backoff; after retries are exhausted the error propagates to onErrorResume, which returns CACHED — so the caller gets the cached fallback after roughly 3+ seconds of attempts, never blocking a thread"
    answer: 3
    explanation: |
      timeout converts the slow call into a TimeoutException per attempt; retryWhen
      resubscribes up to the configured number with backoff; once exhausted the
      final error reaches onErrorResume, which supplies the cached fallback. All of
      this is non-blocking — the event loop is free while timers run.
    ref: "concepts.md#error-handling-in-reactive-chains"

