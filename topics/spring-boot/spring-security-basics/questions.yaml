topic: "Spring Security Basics"
domain: spring-boot
topic_slug: spring-security-basics
version: 1
questions:
  - id: spring-security-basics-001
    difficulty: beginner
    tags: [authentication, authorization, fundamentals]
    question: |
      In security terminology, which pair correctly matches the concept to the
      question it answers?
    options:
      - "Authentication = 'who are you?'; Authorization = 'what can you do?'"
      - "Authentication = 'what can you do?'; Authorization = 'who are you?'"
      - "Authentication and authorization both answer 'who are you?'"
      - "Authorization always happens before authentication"
    answer: 0
    explanation: |
      Authentication verifies identity ("who are you?"); authorization decides
      access ("what can you do?"). Authentication always runs first, and
      authorization uses the resulting authorities.
    ref: "concepts.md#authentication-vs-authorization"

  - id: spring-security-basics-002
    difficulty: beginner
    tags: [http-status, authentication, authorization]
    question: |
      A request arrives with no credentials to an endpoint that requires
      authentication. Which HTTP status is the correct response?
    options:
      - "403 Forbidden"
      - "400 Bad Request"
      - "500 Internal Server Error"
      - "401 Unauthorized"
    answer: 3
    explanation: |
      401 Unauthorized means "not (validly) authenticated — authenticate and
      retry." 403 Forbidden is for an authenticated principal who lacks
      permission.
    ref: "concepts.md#authentication-vs-authorization"

  - id: spring-security-basics-003
    difficulty: intermediate
    tags: [http-status, authorization]
    question: |
      A user is successfully logged in (valid session/token) but calls an
      endpoint restricted to ADMINs, and they only have ROLE_USER. What status
      should Spring Security return, and why?
    options:
      - "401, because the credentials are invalid"
      - "302 redirect to the login page, because they must re-authenticate"
      - "403, because the principal is authenticated but not authorized for that resource"
      - "200, because authenticated users may access any endpoint"
    answer: 2
    explanation: |
      Authentication succeeded, so it is an authorization failure: 403 Forbidden.
      401 is reserved for missing/invalid authentication. ExceptionTranslationFilter
      maps AccessDeniedException to 403.
    ref: "concepts.md#authentication-vs-authorization"

  - id: spring-security-basics-004
    difficulty: intermediate
    tags: [filter-chain, delegatingfilterproxy]
    question: |
      Spring Security integrates with the servlet container primarily through
      which mechanism?
    options:
      - "A custom DispatcherServlet subclass that replaces the default one"
      - "A single servlet Filter (DelegatingFilterProxy) that delegates to a FilterChainProxy of SecurityFilterChains"
      - "A servlet ContextListener that intercepts every request"
      - "AOP advice woven around every controller method"
    answer: 1
    explanation: |
      Boot registers a DelegatingFilterProxy named springSecurityFilterChain that
      forwards to a FilterChainProxy holding one or more SecurityFilterChain
      instances — it is a servlet filter, not a servlet or global AOP.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-005
    difficulty: advanced
    tags: [filter-chain, matching]
    question: |
      You define two SecurityFilterChain beans. A request matches the
      RequestMatcher of both chains. What happens?
    options:
      - "Both chains' filters are concatenated and all run"
      - "Spring throws an AmbiguousFilterChainException at startup"
      - "The chain with the most filters wins"
      - "Only the first chain (by order) whose matcher matches is used; the others are ignored"
    answer: 3
    explanation: |
      FilterChainProxy selects the first matching SecurityFilterChain (ordered)
      and uses only that one; chains are never combined. This is why @Order and
      securityMatcher matter when you split API vs UI chains.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-006
    difficulty: advanced
    tags: [filter-chain, authorizationfilter, ordering]
    question: |
      Which filter enforces the authorizeHttpRequests rules, and where does it
      sit in the chain in Spring Security 6?
    options:
      - "AuthorizationFilter, running last so authentication filters have already populated the SecurityContext"
      - "FilterSecurityInterceptor, running first before any authentication filter"
      - "CsrfFilter, running immediately after SecurityContextHolderFilter"
      - "ExceptionTranslationFilter, which both authenticates and authorizes"
    answer: 0
    explanation: |
      In Security 6, AuthorizationFilter (replacing FilterSecurityInterceptor)
      is the last security filter, so authentication has already run and the
      SecurityContext is populated when authorization is evaluated.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-007
    difficulty: intermediate
    tags: [exception-translation]
    question: |
      Which filter is responsible for catching AuthenticationException and
      AccessDeniedException thrown deeper in the chain and turning them into a
      401 (entry point) or 403 respectively?
    options:
      - "SecurityContextHolderFilter"
      - "BasicAuthenticationFilter"
      - "ExceptionTranslationFilter"
      - "CorsFilter"
    answer: 2
    explanation: |
      ExceptionTranslationFilter sits just before AuthorizationFilter; it
      launches the authentication entry point (401) on AuthenticationException
      and returns 403 (or entry point) on AccessDeniedException.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-008
    difficulty: beginner
    tags: [boot3, securityfilterchain, migration]
    question: |
      In Spring Boot 3 / Spring Security 6, what is the recommended way to
      configure HTTP security?
    options:
      - "Subclass WebSecurityConfigurerAdapter and override configure(HttpSecurity)"
      - "Edit web.xml to register security filters manually"
      - "Annotate the main class with @SecurityConfiguration"
      - "Expose a SecurityFilterChain bean built from HttpSecurity using the lambda DSL"
    answer: 3
    explanation: |
      WebSecurityConfigurerAdapter was deprecated in 5.7 and removed in 6.0. You
      now declare a SecurityFilterChain bean and configure it with the
      lambda-based DSL, returning http.build().
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-009
    difficulty: intermediate
    tags: [hasrole, role-prefix, gotcha]
    question: |
      You call .requestMatchers("/admin/**").hasRole("ROLE_ADMIN"). Users with
      authority ROLE_ADMIN still get 403. Why?
    options:
      - "hasRole only works inside @PreAuthorize, not in the DSL"
      - "hasRole automatically prepends ROLE_, so it now checks for ROLE_ROLE_ADMIN"
      - "requestMatchers cannot be combined with hasRole"
      - "hasRole is case-sensitive and needs lowercase 'admin'"
    answer: 1
    explanation: |
      hasRole("X") prepends ROLE_ and checks for ROLE_X. Passing "ROLE_ADMIN"
      makes it look for ROLE_ROLE_ADMIN. Use hasRole("ADMIN") or
      hasAuthority("ROLE_ADMIN").
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-010
    difficulty: intermediate
    tags: [authorizehttprequests, ordering]
    question: |
      Given this DSL, what happens to a GET /admin/reports for a ROLE_USER?
      ```
      auth.anyRequest().authenticated()
          .requestMatchers("/admin/**").hasRole("ADMIN")
      ```
    options:
      - "It is allowed only if the user has ROLE_ADMIN"
      - "This configuration throws IllegalStateException at startup because anyRequest() must be the last matcher"
      - "It is allowed for any authenticated user, because anyRequest().authenticated() matched first"
      - "It is always denied regardless of role"
    answer: 1
    explanation: |
      Rules are evaluated top-down, first match wins, so anyRequest() must be
      declared last. In Spring Security 6 configuring requestMatchers(...) after
      anyRequest() throws IllegalStateException ("Can't configure requestMatchers
      after anyRequest") while building the SecurityFilterChain, so the application
      fails to start — the /admin/** rule can never be reached. The fix is to put
      the specific /admin/** matcher before anyRequest().
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-011
    difficulty: advanced
    tags: [multiple-chains, order, securitymatcher]
    question: |
      You want a stateless bearer-token chain for /api/** and a session-based
      form-login chain for the rest. Which approach is correct?
    options:
      - "Two SecurityFilterChain beans, each with @Order and a securityMatcher scoping which requests it handles"
      - "Impossible; an application can only have one SecurityFilterChain"
      - "One chain with two authorizeHttpRequests blocks"
      - "Two DispatcherServlets, one per chain"
    answer: 0
    explanation: |
      Define multiple SecurityFilterChain beans, order them with @Order, and give
      each a securityMatcher so the /api chain (stateless) and UI chain
      (form login) each match their own requests.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-012
    difficulty: beginner
    tags: [securitycontextholder, principal]
    question: |
      How do you obtain the currently authenticated principal anywhere in code
      using Spring Security's static holder?
    options:
      - "ApplicationContext.getBean(Authentication.class)"
      - "SecurityConfig.getCurrentUser()"
      - "HttpServletRequest.getPrincipal() only"
      - "SecurityContextHolder.getContext().getAuthentication()"
    answer: 3
    explanation: |
      SecurityContextHolder.getContext().getAuthentication() returns the current
      Authentication, from which you read getName() and getAuthorities().
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-013
    difficulty: advanced
    tags: [securitycontextholder, threadlocal, async]
    question: |
      You spawn a new thread inside a controller and the SecurityContext is empty
      there. What is the underlying reason?
    options:
      - "The SecurityContext is stored in the HttpSession, which new threads cannot read"
      - "Spring Security disables security on non-request threads for safety"
      - "The default SecurityContextHolder strategy is MODE_THREADLOCAL, so the context is bound to the original request thread"
      - "The context was garbage-collected as soon as the controller returned"
    answer: 2
    explanation: |
      The default strategy is MODE_THREADLOCAL, so the context is per-thread. New
      threads don't inherit it; use MODE_INHERITABLETHREADLOCAL or a
      DelegatingSecurityContext executor to propagate it.
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-014
    difficulty: advanced
    tags: [securitycontext, immutability, migration]
    question: |
      In Spring Security 6, what is the recommended way to change the current
      principal at runtime (e.g. to switch to an elevated identity)?
    options:
      - "Mutate the existing SecurityContext returned by getContext() in place by calling setAuthentication(...) on it"
      - "Create a NEW SecurityContext (e.g. new SecurityContextImpl(auth)), install it via SecurityContextHolder.setContext(...), and persist it via the SecurityContextRepository for stateful flows"
      - "Call SecurityContextHolder.setStrategyName(MODE_GLOBAL) so the change applies to all threads"
      - "Reassign the field directly with reflection because there is no public setter"
    answer: 1
    explanation: |
      In 6.x the context obtained from getContext() should be treated as
      effectively read-only; the idiomatic pattern is to build a fresh
      SecurityContextImpl, set it via setContext(...), and (for stateful flows)
      persist it with the SecurityContextRepository. Mutating the shared instance
      in place interacts badly with the deferred/lazy loading introduced in 6.x.
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-015
    difficulty: beginner
    tags: [userdetailsservice]
    question: |
      What is the single method defined by UserDetailsService?
    options:
      - "authenticate(Authentication)"
      - "getAuthorities()"
      - "matches(CharSequence, String)"
      - "loadUserByUsername(String) returning UserDetails"
    answer: 3
    explanation: |
      UserDetailsService has one method: loadUserByUsername(String) which returns
      a UserDetails (or throws UsernameNotFoundException).
    ref: "concepts.md#userdetailsservice-and-userdetails"

  - id: spring-security-basics-016
    difficulty: intermediate
    tags: [userdetails, password]
    question: |
      What should UserDetails.getPassword() return?
    options:
      - "The encoded (hashed) password stored for that user"
      - "The raw plaintext password entered by the user"
      - "The password encoder's algorithm id only"
      - "Null, because Spring never accesses the stored password"
    answer: 0
    explanation: |
      getPassword() returns the stored, encoded hash. The
      DaoAuthenticationProvider hands it plus the raw input to
      PasswordEncoder.matches() to verify.
    ref: "concepts.md#userdetailsservice-and-userdetails"

  - id: spring-security-basics-017
    difficulty: intermediate
    tags: [userdetails, enumeration, security]
    question: |
      Why does Spring by default translate UsernameNotFoundException into a
      generic BadCredentialsException?
    options:
      - "To reduce log noise"
      - "Because UsernameNotFoundException is deprecated"
      - "To avoid user enumeration — not revealing whether a username exists"
      - "To force a 500 error instead of 401"
    answer: 2
    explanation: |
      Distinguishing "no such user" from "wrong password" lets attackers
      enumerate valid usernames. The default hideUserNotFoundExceptions setting
      returns a generic BadCredentials response.
    ref: "concepts.md#userdetailsservice-and-userdetails"

  - id: spring-security-basics-018
    difficulty: beginner
    tags: [userdetailsservice, userdetails, distinction]
    question: |
      Which statement correctly distinguishes UserDetailsService from UserDetails?
    options:
      - "UserDetailsService is the loaded user object; UserDetails loads users"
      - "UserDetails performs password comparison; UserDetailsService stores authorities"
      - "They are two names for the same interface"
      - "UserDetailsService loads user data by username; UserDetails is the data structure describing a user"
    answer: 3
    explanation: |
      UserDetailsService is the SPI that loads a user by username; UserDetails is
      the returned value object (username, encoded password, authorities, account
      flags).
    ref: "concepts.md#userdetailsservice-and-userdetails"

  - id: spring-security-basics-019
    difficulty: intermediate
    tags: [authenticationmanager, providermanager]
    question: |
      The standard AuthenticationManager implementation is ProviderManager. How
      does it authenticate?
    options:
      - "It hashes the password itself and compares to the database"
      - "It iterates a list of AuthenticationProviders, using the first that supports the token type and succeeds"
      - "It always delegates to the HttpSession"
      - "It calls every provider and requires all of them to succeed"
    answer: 1
    explanation: |
      ProviderManager holds an ordered list of AuthenticationProviders and tries
      each whose supports(Class) matches, returning on the first success
      (Chain of Responsibility).
    ref: "concepts.md#authenticationmanager-and-authenticationprovider"

  - id: spring-security-basics-020
    difficulty: intermediate
    tags: [daoauthenticationprovider, flow]
    question: |
      For a username/password login, what does DaoAuthenticationProvider do
      internally?
    options:
      - "Redirects to the OAuth2 authorization server"
      - "Reads the JWT signature and validates it"
      - "Calls UserDetailsService.loadUserByUsername, then PasswordEncoder.matches(raw, encoded)"
      - "Compares the raw password to the raw stored password directly"
    answer: 2
    explanation: |
      DaoAuthenticationProvider loads the UserDetails via UserDetailsService and
      delegates the password check to the configured PasswordEncoder.matches().
    ref: "concepts.md#authenticationmanager-and-authenticationprovider"

  - id: spring-security-basics-021
    difficulty: advanced
    tags: [authentication, eraseCredentials]
    question: |
      After a successful authentication, what typically happens to the raw
      credentials on the returned Authentication object?
    options:
      - "They are erased (credentials set to null) by default"
      - "They are stored in the session for reuse"
      - "They are re-encoded and returned to the client"
      - "They are logged for audit purposes"
    answer: 0
    explanation: |
      ProviderManager erases credentials by default (eraseCredentialsAfterAuthentication),
      so the raw password is removed from the authenticated token to limit exposure.
    ref: "concepts.md#authenticationmanager-and-authenticationprovider"

  - id: spring-security-basics-022
    difficulty: beginner
    tags: [passwordencoder, bcrypt]
    question: |
      Why is BCrypt preferred over MD5 or a single-round SHA-256 for storing
      passwords?
    options:
      - "It produces shorter hashes"
      - "It requires no salt because it is already fast"
      - "It is reversible so you can recover the password"
      - "It is adaptive (configurable cost) and salts each hash, making brute-force expensive"
    answer: 3
    explanation: |
      BCrypt is deliberately slow/adaptive (a cost factor) and embeds a random
      salt, defeating precomputed rainbow tables and slowing brute force. Fast
      hashes like MD5/SHA-256 are unsuitable for passwords.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-023
    difficulty: intermediate
    tags: [bcrypt, salt]
    question: |
      Where is the salt stored when using BCryptPasswordEncoder?
    options:
      - "In a separate salt column you must manage"
      - "In the application.properties file"
      - "Embedded within the produced hash string itself"
      - "BCrypt does not use a salt"
    answer: 2
    explanation: |
      BCrypt embeds the salt (and cost) inside the hash string (e.g.
      $2a$10$...). matches() re-derives using the embedded salt, so no separate
      salt storage is needed.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-024
    difficulty: advanced
    tags: [delegatingpasswordencoder, migration, gotcha]
    question: |
      Your DB stores hashes like {bcrypt}$2a$10$... but you wired a plain
      BCryptPasswordEncoder bean (not the delegating one). What happens on login?
    options:
      - "Login works because BCrypt ignores the prefix"
      - "Matching fails because the {bcrypt} prefix is treated as part of the hash"
      - "Spring auto-strips the prefix"
      - "The user is locked out after 3 tries"
    answer: 1
    explanation: |
      The {id} prefix is understood only by DelegatingPasswordEncoder. A bare
      BCryptPasswordEncoder treats {bcrypt} as part of the encoded value, so
      matches() fails. Use PasswordEncoderFactories.createDelegatingPasswordEncoder().
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-025
    difficulty: intermediate
    tags: [delegatingpasswordencoder]
    question: |
      What is the main purpose of the {id} prefix (e.g. {bcrypt}, {argon2}) used
      by the default DelegatingPasswordEncoder?
    options:
      - "To encrypt the hash a second time"
      - "To mark the password as expired"
      - "To store the username inside the hash"
      - "To allow multiple encoding algorithms to coexist and enable migration between them"
    answer: 3
    explanation: |
      The prefix lets the delegating encoder pick the right algorithm per stored
      hash, so you can verify legacy hashes and migrate to newer algorithms over
      time.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-026
    difficulty: beginner
    tags: [http-basic, form-login]
    question: |
      Which authentication style resends the credentials (base64-encoded) on
      every single request?
    options:
      - "HTTP Basic"
      - "Form login"
      - "OAuth2 authorization code"
      - "Session cookie"
    answer: 0
    explanation: |
      HTTP Basic sends Authorization: Basic base64(user:pass) on every request.
      base64 is encoding, not encryption, so Basic must be used over TLS.
    ref: "concepts.md#form-login-vs-http-basic-vs-stateless"

  - id: spring-security-basics-027
    difficulty: intermediate
    tags: [form-login, session, jsessionid]
    question: |
      In form login, after the initial POST to /login succeeds, how are
      subsequent requests authenticated?
    options:
      - "The browser resends the username and password each time"
      - "Via a JWT placed in the Authorization header"
      - "Via the server session referenced by the JSESSIONID cookie"
      - "They are not authenticated again for the rest of the day"
    answer: 2
    explanation: |
      Form login is stateful: on success the server creates an HttpSession and
      the browser holds JSESSIONID; later requests are authenticated from the
      session, not the credentials.
    ref: "concepts.md#form-login-vs-http-basic-vs-stateless"

  - id: spring-security-basics-028
    difficulty: intermediate
    tags: [stateless, session-policy]
    question: |
      Which configuration makes a REST API stateless so no HttpSession is created
      or used for the security context?
    options:
      - "sessionManagement(sm -> sm.maximumSessions(1))"
      - "csrf(csrf -> csrf.disable())"
      - "httpBasic(Customizer.withDefaults())"
      - "sessionManagement(sm -> sm.sessionCreationPolicy(SessionCreationPolicy.STATELESS))"
    answer: 3
    explanation: |
      SessionCreationPolicy.STATELESS tells Spring Security never to create or use
      an HttpSession; the SecurityContext lives only for that request and must be
      rebuilt from a token each time.
    ref: "concepts.md#form-login-vs-http-basic-vs-stateless"

  - id: spring-security-basics-029
    difficulty: beginner
    tags: [jwt, structure]
    question: |
      A JWT consists of three Base64URL-encoded parts separated by dots. What are
      they, in order?
    options:
      - "signature.payload.header"
      - "header.payload.signature"
      - "payload.header.signature"
      - "header.signature.payload"
    answer: 1
    explanation: |
      A JWT is header.payload.signature. Header names the algorithm, payload
      carries claims, and the signature guarantees integrity/authenticity.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-030
    difficulty: intermediate
    tags: [jwt, confidentiality, gotcha]
    question: |
      A developer stores a user's credit-card number in the JWT payload because
      "JWTs are signed and secure." Why is this wrong?
    options:
      - "The signature encrypts the payload, so it is actually fine"
      - "The payload is limited to 64 bytes"
      - "A signed JWT payload is only Base64-encoded, not encrypted — anyone can decode and read it"
      - "JWTs cannot contain custom claims"
    answer: 2
    explanation: |
      A JWS (signed JWT) payload is Base64URL-encoded, not encrypted. Signing
      provides integrity, not confidentiality — never put secrets in the payload
      unless using encryption (JWE).
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-031
    difficulty: intermediate
    tags: [jwt, access-token, refresh-token]
    question: |
      What is the main reason for issuing a short-lived access token alongside a
      long-lived refresh token?
    options:
      - "To limit the damage window of a stolen access token while avoiding frequent re-login via the refresh token"
      - "To make tokens larger and harder to guess"
      - "Because the access token cannot carry claims"
      - "Refresh tokens are sent on every API request instead of access tokens"
    answer: 0
    explanation: |
      Short access-token lifetimes shrink the exposure of a leaked token; the
      long-lived refresh token (used only against the auth server) obtains new
      access tokens without forcing the user to log in again.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-032
    difficulty: advanced
    tags: [jwt, revocation, blacklisting]
    question: |
      Why can't a standard signed JWT be revoked before it expires, and what is a
      common mitigation?
    options:
      - "It can be revoked instantly by deleting it from the server session; no mitigation needed"
      - "It cannot be revoked and there is no possible mitigation"
      - "Because the signature changes every request; mitigate by resigning it"
      - "Because it is self-validating (no server lookup); mitigate with short expiry plus a server-side denylist of jti or token versioning"
    answer: 3
    explanation: |
      A signed JWT validates purely from its signature, so the server keeps no
      state to invalidate. Mitigations: keep access tokens short-lived, maintain a
      denylist of revoked jti until expiry, rotate refresh tokens, or bump a
      per-user token version.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-033
    difficulty: advanced
    tags: [jwt, alg-none, validation]
    question: |
      Which of the following is a genuine JWT security risk to guard against?
    options:
      - "Including an exp claim"
      - "Base64-encoding the header"
      - "Accepting tokens with alg: none, which bypasses signature verification"
      - "Using RS256 with a public key"
    answer: 2
    explanation: |
      The classic 'alg: none' attack tricks servers into accepting unsigned
      tokens. Always pin/validate the expected algorithm and verify signature,
      exp, iss, and aud.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-034
    difficulty: intermediate
    tags: [jwt, resource-server, boot3]
    question: |
      In Spring Boot 3, what is the idiomatic way to validate incoming JWT access
      tokens on a resource-server API?
    options:
      - "Manually split the token and verify HMAC in a @ControllerAdvice"
      - "Use spring-boot-starter-oauth2-resource-server with http.oauth2ResourceServer(o -> o.jwt(...)) and a JwtDecoder"
      - "Store every issued JWT in the HttpSession"
      - "Enable form login and let Spring parse the token"
    answer: 1
    explanation: |
      The OAuth2 resource-server support validates the signature via a JwtDecoder
      (JWK set or shared secret) and maps claims to authorities — you rarely
      hand-roll JWT parsing.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-035
    difficulty: beginner
    tags: [csrf, definition]
    question: |
      What does a CSRF attack exploit?
    options:
      - "That servers echo request headers back to the client"
      - "That JWTs are stored in localStorage"
      - "That TLS certificates can be forged"
      - "That the browser automatically attaches ambient credentials (cookies) to cross-site state-changing requests"
    answer: 3
    explanation: |
      CSRF relies on the browser auto-sending cookies (the session) with a forged
      cross-site request. The attacker never reads the cookie; they just cause the
      browser to use it.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-036
    difficulty: intermediate
    tags: [csrf, stateless, disable]
    question: |
      Under which condition is disabling CSRF protection generally acceptable?
    options:
      - "When authentication is via a token in the Authorization header (not a cookie), so the browser doesn't auto-attach the credential"
      - "Whenever the API uses HTTPS"
      - "For all REST APIs unconditionally"
      - "Only for GET requests"
    answer: 0
    explanation: |
      CSRF is a browser-cookie problem. If you authenticate with a bearer token in
      the Authorization header, the browser won't auto-send it cross-site, so CSRF
      doesn't apply. Cookie-based auth (session or JWT-in-cookie) still needs CSRF.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-037
    difficulty: intermediate
    tags: [csrf, safe-methods]
    question: |
      By default, Spring Security's CSRF protection requires a token for which
      requests?
    options:
      - "All requests including GET and HEAD"
      - "Only DELETE requests"
      - "State-changing methods (POST, PUT, PATCH, DELETE); safe methods like GET/HEAD/OPTIONS/TRACE are exempt"
      - "Only requests with a JSON body"
    answer: 2
    explanation: |
      CSRF protection applies to unsafe, state-changing methods. Safe, idempotent
      methods (GET, HEAD, OPTIONS, TRACE) are exempt because they should not
      change server state.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-038
    difficulty: advanced
    tags: [csrf, cookie, jwt, gotcha]
    question: |
      A team switches from bearer-header JWT to storing the JWT in an HttpOnly
      cookie and keeps csrf().disable(). What new risk have they introduced?
    options:
      - "None; HttpOnly cookies are immune to all attacks"
      - "CORS will block all requests"
      - "The token can no longer be validated"
      - "CSRF becomes exploitable again, because the browser now auto-attaches the auth cookie to cross-site requests"
    answer: 3
    explanation: |
      Moving auth into a cookie means the browser auto-sends it, so CSRF is
      relevant again. HttpOnly stops XSS from reading it, but does not stop CSRF —
      CSRF protection must be re-enabled.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-039
    difficulty: beginner
    tags: [cors, definition]
    question: |
      What is CORS fundamentally?
    options:
      - "A server-side firewall that blocks malicious IPs"
      - "A browser mechanism that relaxes the same-origin policy so a page can call a server on a different origin when that server opts in"
      - "An encryption protocol for cross-origin data"
      - "A replacement for CSRF tokens"
    answer: 1
    explanation: |
      CORS is a browser-enforced relaxation of the same-origin policy; the server
      opts in via Access-Control-* headers. It is not a server-side security
      control and does nothing against non-browser clients.
    ref: "concepts.md#cors"

  - id: spring-security-basics-040
    difficulty: intermediate
    tags: [cors, preflight, ordering]
    question: |
      Why must the CORS filter run early (before authentication) in the chain?
    options:
      - "So it can encrypt the request body"
      - "Because authentication depends on the Origin header"
      - "So preflight OPTIONS requests (which carry no credentials) are handled and not rejected as unauthorized"
      - "It doesn't matter where CORS runs"
    answer: 2
    explanation: |
      Preflight OPTIONS requests are sent without credentials. If CORS ran after
      authentication, they'd be rejected with 401. Spring places CorsFilter early
      to answer preflights correctly.
    ref: "concepts.md#cors"

  - id: spring-security-basics-041
    difficulty: advanced
    tags: [cors, credentials, wildcard, gotcha]
    question: |
      A developer sets allowedOrigins("*") together with allowCredentials(true).
      What is the problem?
    options:
      - "The CORS spec forbids wildcard origin with credentials; use allowedOriginPatterns instead"
      - "Nothing; this is the recommended setup"
      - "It disables HTTPS"
      - "It also disables CSRF automatically"
    answer: 0
    explanation: |
      The spec prohibits Access-Control-Allow-Origin: * combined with
      credentials. Spring will error/refuse; use allowedOriginPatterns to match
      origins while allowing credentials.
    ref: "concepts.md#cors"

  - id: spring-security-basics-042
    difficulty: intermediate
    tags: [cors, csrf, distinction]
    question: |
      Which statement about CORS vs CSRF is correct?
    options:
      - "Disabling CORS protects against CSRF"
      - "CORS is a server-side defense against CSRF"
      - "CSRF tokens are sent as CORS headers"
      - "They are unrelated: CORS governs cross-origin reads allowed by the browser; CSRF is about forged state-changing requests using ambient cookies"
    answer: 3
    explanation: |
      CORS and CSRF solve different problems. CORS lets a server opt into
      cross-origin access; CSRF protection stops forged cookie-authenticated
      writes. Neither substitutes for the other.
    ref: "concepts.md#cors"

  - id: spring-security-basics-043
    difficulty: intermediate
    tags: [session, fixation]
    question: |
      What does Spring Security's default session-fixation protection do on a
      successful login?
    options:
      - "Deletes all cookies from the browser"
      - "Disables the session entirely"
      - "Changes the session id so any pre-authentication session id an attacker planted is invalidated"
      - "Encrypts the JSESSIONID cookie"
    answer: 2
    explanation: |
      The default (changeSessionId in Servlet 3.1+) creates a new session id at
      login, so a fixed/planted pre-auth session id can't be used to hijack the
      authenticated session.
    ref: "concepts.md#session-management"

  - id: spring-security-basics-044
    difficulty: beginner
    tags: [session, creation-policy]
    question: |
      What is the default SessionCreationPolicy in Spring Security?
    options:
      - "ALWAYS"
      - "IF_REQUIRED"
      - "NEVER"
      - "STATELESS"
    answer: 1
    explanation: |
      IF_REQUIRED is the default: a session is created only when needed. For
      token-based APIs you switch to STATELESS.
    ref: "concepts.md#session-management"

  - id: spring-security-basics-045
    difficulty: intermediate
    tags: [session, concurrent]
    question: |
      Which setting limits a user to one active session at a time?
    options:
      - "sessionCreationPolicy(STATELESS)"
      - "httpBasic()"
      - "csrf().disable()"
      - "maximumSessions(1) (with an HttpSessionEventPublisher registered)"
    answer: 3
    explanation: |
      maximumSessions(1) enables concurrent-session control; an
      HttpSessionEventPublisher bean is needed so Spring is notified of session
      lifecycle events.
    ref: "concepts.md#session-management"

  - id: spring-security-basics-046
    difficulty: beginner
    tags: [method-security, enable]
    question: |
      In Spring Boot 3, which annotation enables method-level security (and turns
      on @PreAuthorize by default)?
    options:
      - "@EnableMethodSecurity"
      - "@EnableGlobalMethodSecurity"
      - "@EnableWebSecurity"
      - "@MethodSecurity"
    answer: 0
    explanation: |
      @EnableMethodSecurity replaces the deprecated @EnableGlobalMethodSecurity;
      it enables prePostEnabled (@PreAuthorize/@PostAuthorize) by default.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-047
    difficulty: intermediate
    tags: [method-security, prePostAuthorize, secured, rolesallowed]
    question: |
      Which statement about @PreAuthorize, @Secured, and @RolesAllowed is
      correct?
    options:
      - "@RolesAllowed is a Spring-specific annotation"
      - "All three support SpEL expressions"
      - "@PreAuthorize supports full SpEL expressions; @Secured and @RolesAllowed only take plain role/authority strings"
      - "@Secured can inspect the method's return value"
    answer: 2
    explanation: |
      @PreAuthorize/@PostAuthorize evaluate SpEL (hasRole, method args,
      returnObject). @Secured (Spring) and @RolesAllowed (JSR-250) accept only
      static role strings, no expressions.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-048
    difficulty: advanced
    tags: [method-security, postauthorize]
    question: |
      What is the key difference between @PreAuthorize and @PostAuthorize?
    options:
      - "@PreAuthorize runs after the method; @PostAuthorize runs before it"
      - "@PostAuthorize can only be used on void methods"
      - "They are identical aliases"
      - "@PreAuthorize runs before the method; @PostAuthorize runs after and can inspect the returnObject to allow/deny"
    answer: 3
    explanation: |
      @PreAuthorize gates entry before execution; @PostAuthorize evaluates after
      execution and can use returnObject in its expression — but the method (and
      its side effects) has already run.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-049
    difficulty: advanced
    tags: [method-security, proxy, self-invocation, gotcha]
    question: |
      A public @PreAuthorize-annotated method is called by another method in the
      SAME bean via a plain this.method() call. Is the security check enforced?
    options:
      - "Yes, always"
      - "No — internal self-invocation bypasses the AOP proxy that enforces the check"
      - "Only if the method is private"
      - "Only when using JWT authentication"
    answer: 1
    explanation: |
      Like @Transactional, method security is enforced by an AOP proxy. A this.
      self-invocation doesn't pass through the proxy, so @PreAuthorize is skipped.
      The call must go through the proxied reference.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-050
    difficulty: intermediate
    tags: [method-security, secured, role-prefix]
    question: |
      Which annotation usage requires you to include the ROLE_ prefix explicitly?
    options:
      - "hasRole('ADMIN') in @PreAuthorize"
      - "@RolesAllowed(\"ADMIN\")"
      - "@Secured(\"ROLE_ADMIN\")"
      - "requestMatchers(...).hasRole(\"ADMIN\")"
    answer: 2
    explanation: |
      @Secured requires the full authority string including ROLE_. hasRole(...) and
      @RolesAllowed add the ROLE_ prefix for you.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-051
    difficulty: beginner
    tags: [rbac, abac]
    question: |
      Which best describes RBAC (Role-Based Access Control)?
    options:
      - "Permissions are attached to roles, and users are granted roles"
      - "Access is decided from attributes of subject, resource, action, and environment"
      - "Every user has a unique per-resource policy"
      - "Access is decided randomly per request"
    answer: 0
    explanation: |
      RBAC groups permissions into roles and assigns roles to users — coarse,
      easy to audit, but prone to role explosion. ABAC uses attributes for
      fine-grained decisions.
    ref: "concepts.md#rbac-vs-abac"

  - id: spring-security-basics-052
    difficulty: intermediate
    tags: [abac, spel, preauthorize]
    question: |
      You need "a user may edit a document only if they own it." Which Spring
      Security feature expresses this ABAC-style rule most directly?
    options:
      - "hasRole('EDITOR') in the DSL"
      - "sessionManagement STATELESS"
      - "@Secured(\"ROLE_OWNER\")"
      - "@PreAuthorize(\"#doc.owner == authentication.name\") using SpEL"
    answer: 3
    explanation: |
      Attribute-based rules use SpEL in @PreAuthorize/@PostAuthorize (referencing
      method args, the authentication, or returnObject), or a custom
      PermissionEvaluator. Plain role checks can't express per-resource ownership.
    ref: "concepts.md#rbac-vs-abac"

  - id: spring-security-basics-053
    difficulty: intermediate
    tags: [role, authority, distinction]
    question: |
      In Spring Security, what is the relationship between a "role" and an
      "authority"?
    options:
      - "They are completely unrelated concepts"
      - "An authority is a role prefixed with AUTH_"
      - "A role is just an authority conventionally prefixed with ROLE_; hasRole('X') equals hasAuthority('ROLE_X')"
      - "Roles are stored in the session; authorities in the database"
    answer: 2
    explanation: |
      Roles are authorities with the ROLE_ convention. hasRole('X') is equivalent
      to hasAuthority('ROLE_X'). Fine-grained permissions are typically modeled as
      plain authorities.
    ref: "concepts.md#rbac-vs-abac"

  - id: spring-security-basics-054
    difficulty: intermediate
    tags: [oauth2, grant-types]
    question: |
      Which OAuth2 grant type is standard for a machine-to-machine call where
      there is no end user involved?
    options:
      - "Authorization Code"
      - "Client Credentials"
      - "Implicit"
      - "Resource Owner Password Credentials"
    answer: 1
    explanation: |
      The Client Credentials grant is for service-to-service access: the client
      authenticates with its own credentials to obtain a token, with no resource
      owner present.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-055
    difficulty: advanced
    tags: [oauth2, pkce, public-client]
    question: |
      Why is Authorization Code with PKCE the recommended flow for SPAs and mobile
      apps?
    options:
      - "Because they can safely store a client secret"
      - "Because it avoids any redirect to the authorization server"
      - "Because it returns the token directly in the URL fragment"
      - "Because PKCE (code_challenge/code_verifier) protects public clients that cannot keep a secret against authorization-code interception"
    answer: 3
    explanation: |
      Public clients can't safely hold a secret. PKCE binds the code exchange to a
      one-time verifier, so an intercepted authorization code is useless without
      the matching code_verifier.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-056
    difficulty: intermediate
    tags: [oauth2, deprecated-grants, gotcha]
    question: |
      Which OAuth2 grant types are discouraged/deprecated under OAuth 2.1 for new
      applications?
    options:
      - "Implicit and Resource Owner Password Credentials (ROPC)"
      - "Authorization Code and Client Credentials"
      - "Refresh Token and PKCE"
      - "Authorization Code with PKCE"
    answer: 0
    explanation: |
      OAuth 2.1 deprecates the Implicit grant (tokens leaked via URL fragment) and
      ROPC (app must handle raw passwords). Authorization Code (+PKCE) and Client
      Credentials remain recommended.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-057
    difficulty: advanced
    tags: [oauth2, oidc, authn-vs-authz]
    question: |
      Which statement about OAuth2 vs OpenID Connect (OIDC) is correct?
    options:
      - "They are identical protocols"
      - "OAuth2 is for authentication; OIDC is for authorization"
      - "OAuth2 is primarily an authorization framework; OIDC adds an identity/authentication layer on top of it"
      - "OIDC replaces TLS"
    answer: 2
    explanation: |
      OAuth2 delegates authorization (access to resources). OIDC layers
      authentication/identity (the ID token) on top of OAuth2. Using bare OAuth2
      access tokens as proof of identity is a common mistake.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-058
    difficulty: advanced
    tags: [custom-filter, jwt, ordering]
    question: |
      You add a custom JWT authentication filter. Where should it typically be
      registered relative to the built-in filters?
    options:
      - "After AuthorizationFilter, so authorization runs first"
      - "As the very first filter, before SecurityContextHolderFilter"
      - "It must replace the DispatcherServlet"
      - "Before UsernamePasswordAuthenticationFilter via addFilterBefore, so the SecurityContext is populated before authorization"
    answer: 3
    explanation: |
      A custom auth filter is usually added with
      addFilterBefore(jwtFilter, UsernamePasswordAuthenticationFilter.class) so it
      authenticates and sets the SecurityContext before the AuthorizationFilter
      (last) evaluates access rules.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-059
    difficulty: intermediate
    tags: [authorizehttprequests, migration]
    question: |
      What replaced the deprecated authorizeRequests() in modern Spring Security?
    options:
      - "secureRequests(), backed by FilterSecurityInterceptor"
      - "authorizeHttpRequests(), backed by AuthorizationManager / AuthorizationFilter"
      - "permitAllRequests()"
      - "authenticateRequests()"
    answer: 1
    explanation: |
      authorizeHttpRequests() (AuthorizationFilter/AuthorizationManager) supersedes
      the older authorizeRequests() (FilterSecurityInterceptor), which is
      deprecated.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-060
    difficulty: beginner
    tags: [boot, autoconfiguration, default]
    question: |
      With spring-boot-starter-security on the classpath and no custom config,
      what is the default behavior?
    options:
      - "All endpoints are open until you add security"
      - "Only /admin is secured"
      - "All endpoints are secured, HTTP Basic + form login are enabled, and a random password for user 'user' is logged at startup"
      - "The application fails to start until you define a SecurityFilterChain"
    answer: 2
    explanation: |
      SecurityAutoConfiguration locks down every endpoint, enables form login and
      HTTP Basic, and generates a random password for the default 'user',
      printed in the startup log — until you supply your own configuration.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-061
    difficulty: expert
    tags: [filter-chain, dispatcher-types, authorizationfilter, gotcha]
    question: |
      Your app renders views via server-side FORWARD and has this config:
      ```
      http.authorizeHttpRequests(auth -> auth
          .requestMatchers("/dashboard").hasRole("USER")
          .anyRequest().denyAll());
      ```
      A logged-in USER hits /dashboard; the controller forwards to
      /WEB-INF/views/dashboard.jsp to render. The initial request is allowed but
      the user gets a 403 during rendering. What is the root cause in Spring
      Security 6?
    options:
      - "The JSP path needs its own hasRole('USER') rule because forwards are treated as new authenticated users"
      - "Server-side forwards strip the SecurityContext, so the forwarded dispatch is anonymous and denied"
      - "AuthorizationFilter runs on every dispatch (shouldFilterAllDispatcherTypes defaults to true), so the internal FORWARD to the JSP path hits anyRequest().denyAll()"
      - "The CsrfFilter blocks the forward because it is a state-changing dispatch"
    answer: 2
    explanation: |
      Since Security 6, AuthorizationFilter applies to REQUEST, FORWARD, ERROR,
      and INCLUDE dispatches by default. The forward to the JSP path is authorized
      against the rules and matches anyRequest().denyAll(). The idiomatic fix is
      .dispatcherTypeMatchers(FORWARD, ERROR).permitAll(). The SecurityContext is
      NOT lost across a forward, so the "anonymous" explanations are wrong.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-062
    difficulty: advanced
    tags: [anonymous, trust-resolver, 401-vs-403]
    question: |
      An unauthenticated browser (no session, no credentials) requests a URL
      protected by .authenticated(). Inside the chain, what does
      SecurityContextHolder.getContext().getAuthentication() hold at the point
      AuthorizationFilter evaluates the rule, and what response results?
    options:
      - "An AnonymousAuthenticationToken; the AuthenticationTrustResolver recognizes it as anonymous, so the entry point (401 / login redirect) is triggered, not 403"
      - "null; ExceptionTranslationFilter returns 403 Forbidden because there is no principal"
      - "A fully authenticated UsernamePasswordAuthenticationToken for 'anonymousUser'; the request is permitted"
      - "null; the request is silently permitted because null means 'no rule applies'"
    answer: 0
    explanation: |
      AnonymousAuthenticationFilter populates an AnonymousAuthenticationToken when
      nothing else authenticated. authenticated() rejects it, and because the
      trust resolver classifies the token as anonymous, ExceptionTranslationFilter
      launches the authentication entry point (401 or login redirect) rather than
      403. An anonymous token is authenticated=true but is not a "real" user.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-063
    difficulty: expert
    tags: [authorizationmanager, performance, deferred-auth]
    question: |
      Why can .requestMatchers("/health").permitAll() be measurably faster than
      .requestMatchers("/health").authenticated() on a stateful app, beyond the
      obvious authorization outcome?
    options:
      - "permitAll() caches the response body so the controller is skipped entirely"
      - "authenticated() forces HTTPS while permitAll() allows HTTP"
      - "permitAll() bypasses the entire FilterChainProxy, running zero filters"
      - "For permitAll()/denyAll(), AuthorizationManager never invokes the Supplier<Authentication>, so the HttpSession isn't loaded and no anonymous token is built"
    answer: 3
    explanation: |
      authorizeHttpRequests defers the Authentication lookup: for always-allow or
      always-deny rules the Supplier<Authentication> is never called, so the
      session isn't deserialized and no AnonymousAuthenticationToken is created.
      permitAll() still runs the rest of the filter chain (headers, etc.); it does
      not bypass FilterChainProxy.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-064
    difficulty: advanced
    tags: [authorizationmanager, voters, migration]
    question: |
      In the migration to Spring Security 6's authorizeHttpRequests, which legacy
      authorization abstractions were replaced by the single AuthorizationManager
      interface?
    options:
      - "AuthenticationManager and AuthenticationProvider"
      - "AccessDecisionManager, AccessDecisionVoter, and ConfigAttribute/metadata sources"
      - "SecurityContextRepository and SecurityContextHolderStrategy"
      - "HandlerInterceptor and HandlerMethodArgumentResolver"
    answer: 1
    explanation: |
      authorizeHttpRequests uses the simplified AuthorizationManager API instead
      of the older metadata sources, config attributes, AccessDecisionManager, and
      AccessDecisionVoter architecture. The authentication-side abstractions were
      not part of this change.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-065
    difficulty: expert
    tags: [securitymatcher, requestmatchers, multiple-chains, gotcha]
    question: |
      You register two chains: chain A (@Order(1)) has NO securityMatcher and
      formLogin; chain B (@Order(2)) has securityMatcher("/api/**") and stateless
      bearer auth. Requests to /api/data hit the form-login chain and redirect to
      /login instead of returning 401. Why?
    options:
      - "securityMatcher and requestMatchers are aliases, so B never scopes anything"
      - "@Order is ignored for SecurityFilterChain beans; ordering is alphabetical by bean name"
      - "Chain A has no securityMatcher, so it matches every request; being ordered before B, it wins for /api/** and B is effectively dead code"
      - "Stateless chains cannot be ordered after stateful ones"
    answer: 2
    explanation: |
      A chain with no securityMatcher matches all requests. FilterChainProxy uses
      the FIRST matching chain by order, so chain A (order 1) handles /api/**
      before chain B is considered. Give the specific /api chain the lower order,
      or add a securityMatcher to chain A. securityMatcher selects the chain;
      requestMatchers configures rules within it.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-066
    difficulty: expert
    tags: [role-hierarchy, method-security, gotcha]
    question: |
      You declare a RoleHierarchy bean (ROLE_ADMIN implies ROLE_USER). URL rules
      like requestMatchers("/user/**").hasRole("USER") now pass for admins, but
      @PreAuthorize("hasRole('USER')") on a service method still returns 403 for
      an admin. What is the most likely reason?
    options:
      - "The RoleHierarchy is wired into web authorization but not into the MethodSecurityExpressionHandler, which needs it set explicitly"
      - "@PreAuthorize ignores role hierarchy entirely; it is impossible to apply"
      - "RoleHierarchy only works for hasAuthority, never hasRole"
      - "The admin lost ROLE_USER because hierarchy replaces rather than augments authorities"
    answer: 0
    explanation: |
      A RoleHierarchy bean is picked up for web (request) authorization, but
      method security uses a separate MethodSecurityExpressionHandler. You must
      inject the RoleHierarchy into a DefaultMethodSecurityExpressionHandler bean
      for @PreAuthorize to honor the hierarchy — otherwise it applies only to URL
      rules.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"

  - id: spring-security-basics-067
    difficulty: expert
    tags: [securitycontext, inheritablethreadlocal, thread-pool, concurrency]
    question: |
      A team sets spring.security.strategy=MODE_INHERITABLETHREADLOCAL to make
      @Async tasks see the user. Under load they observe tasks occasionally
      running as the WRONG user. What is the fundamental flaw?
    options:
      - "MODE_INHERITABLETHREADLOCAL disables the SecurityContextHolder entirely under load"
      - "INHERITABLETHREADLOCAL serializes the context to disk, and concurrent reads corrupt it"
      - "The property name is wrong, so nothing is propagated and every task is anonymous"
      - "INHERITABLETHREADLOCAL copies the context only when a child thread is created; a pooled thread created under user A keeps A's context for later tasks submitted by user B"
    answer: 3
    explanation: |
      InheritableThreadLocal snapshots the parent's value at thread CREATION. With
      a thread pool, threads are reused: a worker spawned while serving user A
      retains A's context and will leak it into a later task submitted by user B.
      Use DelegatingSecurityContextExecutor/AsyncTaskExecutor, which copy the
      context per submission and clear it afterward.
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-068
    difficulty: advanced
    tags: [securitycontext, null-safety, gotcha]
    question: |
      Which statement about SecurityContextHolder null-handling is correct?
    options:
      - "getContext() can return null on a fresh thread, so you must null-check the context before calling getAuthentication()"
      - "getContext() lazily creates an empty context and never returns null, but getAuthentication() can return null (e.g., on a thread with no auth), which is the real check to make"
      - "Both getContext() and getAuthentication() are guaranteed non-null inside a filter chain"
      - "getAuthentication() throws IllegalStateException when no user is authenticated"
    answer: 1
    explanation: |
      The holder lazily creates an empty SecurityContext on first access per
      thread, so getContext() is never null. getAuthentication() can be null on a
      thread that was never populated. Guarding only the context (not the
      authentication) is a common NPE source.
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-069
    difficulty: advanced
    tags: [securitycontext, persistence, programmatic-login, boot3]
    question: |
      In Spring Security 6 you log a user in programmatically inside a controller:
      you build an Authentication, put it in a new SecurityContext, and call
      SecurityContextHolder.setContext(ctx). The user is authenticated for THIS
      request but not on the next one. What is missing?
    options:
      - "You must call SecurityContextHolder.clearContext() first"
      - "Nothing is missing; ThreadLocal contexts always persist automatically in 6.x"
      - "You must persist the context via the SecurityContextRepository (e.g. saveContext), because SecurityContextHolderFilter no longer auto-saves like the old persistence filter"
      - "You must switch the strategy to MODE_GLOBAL for the login to stick"
    answer: 2
    explanation: |
      Security 6 replaced the eager-saving SecurityContextPersistenceFilter with
      SecurityContextHolderFilter, which does not automatically write the context
      back. For programmatic login you must explicitly save via a
      SecurityContextRepository (e.g. HttpSessionSecurityContextRepository) so it
      persists across requests.
    ref: "concepts.md#securitycontext-and-securitycontextholder"

  - id: spring-security-basics-070
    difficulty: expert
    tags: [providermanager, ordering, exception-handling]
    question: |
      A ProviderManager holds [ProviderX, ProviderY], both of which support
      UsernamePasswordAuthenticationToken. For a given login, ProviderX throws
      BadCredentialsException and ProviderY would authenticate successfully. What
      does ProviderManager return?
    options:
      - "It tries ProviderY after ProviderX throws; ProviderY succeeds, so authentication succeeds"
      - "It immediately rethrows ProviderX's BadCredentialsException and never tries ProviderY"
      - "It requires BOTH providers to succeed, so it fails"
      - "It returns null because the first provider threw"
    answer: 0
    explanation: |
      ProviderManager iterates providers; an AuthenticationException from one
      supporting provider does not abort the loop. It records the last exception
      and continues; if a later provider authenticates, that success is returned.
      Only if no provider (and no parent) authenticates does it rethrow the
      remembered exception. A success short-circuits remaining providers.
    ref: "concepts.md#authenticationmanager-and-authenticationprovider"

  - id: spring-security-basics-071
    difficulty: advanced
    tags: [authenticationmanager, local-vs-global, boot3, gotcha]
    question: |
      You define a custom AuthenticationProvider bean AND call
      http.authenticationProvider(myProvider) inside the SecurityFilterChain, then
      inject AuthenticationManager via AuthenticationConfiguration in a login
      controller. Your provider is never invoked from the controller path. What is
      the most likely explanation?
    options:
      - "Custom AuthenticationProviders can only be used by filters, never by an injected AuthenticationManager"
      - "The provider bean must be annotated @Primary or it is ignored everywhere"
      - "AuthenticationConfiguration always returns a no-op manager in Boot 3"
      - "http.authenticationProvider(...) registers the provider on a local AuthenticationManager scoped to that HttpSecurity, which is not the same instance the global AuthenticationConfiguration builds/exposes"
    answer: 3
    explanation: |
      Registering a provider via http.authenticationProvider(...) builds a local
      AuthenticationManager for that HttpSecurity's filters. The manager obtained
      from AuthenticationConfiguration is the global one and may not include that
      local provider. Mixing local and global wiring is a classic cause of "my
      provider is never called." Expose one AuthenticationManager consistently.
    ref: "concepts.md#authenticationmanager-and-authenticationprovider"

  - id: spring-security-basics-072
    difficulty: expert
    tags: [userdetailsservice, timing-attack, enumeration]
    question: |
      DaoAuthenticationProvider runs the PasswordEncoder against a dummy hash even
      when loadUserByUsername reports the user does not exist. What attack does
      this specifically defend against, and what breaks it?
    options:
      - "It defends against rainbow-table attacks; disabling BCrypt salting breaks it"
      - "It defends against a timing side-channel for username enumeration; a custom AuthenticationProvider that returns early on 'user not found' reintroduces the timing difference"
      - "It defends against CSRF; disabling the CsrfFilter breaks it"
      - "It defends against replay attacks; short token expiry breaks it"
    answer: 1
    explanation: |
      By encoding against a fixed dummy password when the user is absent, the
      provider keeps response times similar for "no such user" and "wrong
      password," preventing timing-based user enumeration. A custom provider that
      short-circuits on missing users measurably speeds up that path and leaks
      which usernames exist.
    ref: "concepts.md#userdetailsservice-and-userdetails"

  - id: spring-security-basics-073
    difficulty: expert
    tags: [passwordencoder, upgradeEncoding, migration]
    question: |
      You want to transparently upgrade legacy {md5} and low-cost bcrypt hashes to
      {argon2} without forcing password resets. Which mechanism enables this, and
      when can you actually perform the rehash?
    options:
      - "You call encoder.rehash(oldHash) at application startup for every stored user"
      - "DelegatingPasswordEncoder rehashes automatically on every matches() call with no code needed"
      - "PasswordEncoder.upgradeEncoding(encoded) signals a hash is outdated; you rehash right after a successful matches(), when you still hold the raw password, then persist the new hash"
      - "You cannot upgrade without a reset because you never have the raw password"
    answer: 2
    explanation: |
      DelegatingPasswordEncoder.upgradeEncoding returns true when a stored hash
      uses an older id or weaker parameters. Spring does not rehash automatically;
      you must re-encode after a successful matches() (the only moment you have the
      raw password) and save the new value. That migrates users seamlessly on next
      login.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-074
    difficulty: advanced
    tags: [bcrypt, truncation, gotcha]
    question: |
      A system pre-hashes user input and then BCrypt-encodes it, and separately
      allows very long passphrases. Why might two distinct long inputs
      unexpectedly authenticate against the same stored BCrypt hash?
    options:
      - "BCrypt only processes the first 72 bytes of input and silently ignores the rest, so inputs sharing a 72-byte prefix collide"
      - "BCrypt lowercases all input, collapsing case variants"
      - "BCrypt strips whitespace, so trailing spaces are ignored"
      - "BCrypt uses a global salt, so all hashes collide"
    answer: 0
    explanation: |
      BCrypt hashes at most 72 bytes and ignores everything beyond. Passphrases
      (or pre-hashed hex strings) that share the same first 72 bytes verify as
      equal. Argon2/PBKDF2 don't have this limit; if you pre-hash, base64-encode a
      full digest so it fits within 72 bytes distinctly.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-075
    difficulty: expert
    tags: [jwt, resource-server, authority-mapping, gotcha]
    question: |
      An OAuth2 resource server (http.oauth2ResourceServer(o -> o.jwt(...))) has
      requestMatchers("/admin/**").hasRole("ADMIN"). The incoming JWT contains
      "roles": ["ADMIN"], the signature is valid, yet every /admin call is 403.
      What is the default behavior causing this?
    options:
      - "JWTs must place roles in the 'sub' claim to be recognized"
      - "hasRole cannot be used with JWT authentication; only hasAuthority works"
      - "The resource server strips all authorities from JWTs for safety"
      - "The default JwtGrantedAuthoritiesConverter reads the scope/scp claim and prefixes SCOPE_; it ignores a custom 'roles' claim, so no ROLE_ADMIN authority is produced"
    answer: 3
    explanation: |
      By default authorities come from the scope/scp claim, each mapped to a
      SCOPE_ prefixed authority. A custom "roles" claim is not read and no
      ROLE_ADMIN is created, so hasRole('ADMIN') fails. Supply a custom
      JwtAuthenticationConverter/JwtGrantedAuthoritiesConverter to map the roles
      claim (with the ROLE_ prefix) if you want hasRole to work.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-076
    difficulty: advanced
    tags: [jwt, resource-server, 401-vs-403]
    question: |
      On a resource server, a request arrives with an expired bearer JWT. What
      status and header does Spring Security's default handling return?
    options:
      - "403 Forbidden with no special header, because the token is present but invalid"
      - "401 Unauthorized with a WWW-Authenticate: Bearer error=\"invalid_token\" header, because a bad/expired token is an authentication failure"
      - "302 redirect to the OAuth2 authorization server to re-authenticate"
      - "200 OK, because expiry is only advisory unless you validate it manually"
    answer: 1
    explanation: |
      An expired or otherwise invalid token is an authentication failure, so
      BearerTokenAuthenticationEntryPoint returns 401 with WWW-Authenticate: Bearer
      and an invalid_token error. 403 is reserved for a valid token that lacks the
      required authority. Expiry is validated by JwtTimestampValidator by default.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-077
    difficulty: expert
    tags: [jwt, validation, audience, security]
    question: |
      Service A and Service B both trust tokens from the same issuer and both only
      verify the signature and expiry. An attacker replays a valid token minted
      for Service A against Service B and succeeds. Which validation was missing?
    options:
      - "Signature verification (the token was forged)"
      - "The exp claim (the token was expired)"
      - "Audience (aud) validation — each service should reject tokens not intended for it, even if issuer and signature are valid"
      - "The alg header check (the token used none)"
    answer: 2
    explanation: |
      A valid, signed, unexpired token from the shared issuer passes signature and
      timestamp checks. Without audience (aud) validation, Service B accepts a
      token meant for Service A — a token-substitution/confused-deputy issue. Each
      resource server must validate aud (and typically iss) via an
      OAuth2TokenValidator in addition to the signature.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-078
    difficulty: expert
    tags: [jwt, algorithm-confusion, rs256, hs256]
    question: |
      An "algorithm confusion" attack against a naive JWT verifier that uses the
      RSA public key as the secret works because:
    options:
      - "The attacker changes alg from RS256 to HS256 and HMAC-signs the token using the well-known RSA PUBLIC key as the HMAC secret; a verifier that keys off the token's alg header verifies it successfully"
      - "The attacker sets alg to none, which all libraries accept"
      - "RS256 signatures are reversible, letting the attacker recompute the private key"
      - "HS256 tokens cannot carry an exp claim, so they never expire"
    answer: 0
    explanation: |
      If the verifier trusts the token's alg header and shares one key, an attacker
      switches RS256 to HS256 and HMACs the token using the public key (which they
      know) as the secret. The server, expecting RSA, instead HMAC-verifies with
      that same public key and accepts the forgery. Mitigation: pin the expected
      algorithm/key type rather than trusting the header.
    ref: "concepts.md#jwt-stateless-authentication"

  - id: spring-security-basics-079
    difficulty: expert
    tags: [csrf, xor, breach, spa, gotcha]
    question: |
      A Spring Security 6 app uses CookieCsrfTokenRepository.withHttpOnlyFalse().
      The SPA reads the XSRF-TOKEN cookie and sends its value in the X-XSRF-TOKEN
      header, but POSTs still get 403. With the default CSRF configuration, why?
    options:
      - "Cookies cannot be read by JavaScript even with HttpOnly=false"
      - "The header name must be Authorization, not X-XSRF-TOKEN"
      - "CookieCsrfTokenRepository is deprecated and always returns 403"
      - "The default XorCsrfTokenRequestAttributeHandler expects the XOR-encoded token value, but JavaScript only has the raw token from the cookie, so the submitted value fails to match after decoding"
    answer: 3
    explanation: |
      Security 6 defaults to XorCsrfTokenRequestAttributeHandler for BREACH
      protection, which encodes randomness into each rendered token. The SPA reads
      only the raw token from the cookie; when submitted it decodes to something
      that doesn't match. In Security 6 the fix is a custom CsrfTokenRequestHandler
      (the reference SpaCsrfTokenRequestHandler) or the plain
      CsrfTokenRequestAttributeHandler (opting out of BREACH). Spring Security 7.0
      later added the http.csrf(c -> c.spa()) convenience method for this.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-080
    difficulty: advanced
    tags: [csrf, token-rotation, login, gotcha]
    question: |
      A test logs in, then reuses a CSRF token it captured BEFORE authenticating,
      and the subsequent POST fails with 403. What Spring Security behavior
      explains this?
    options:
      - "CSRF tokens expire after exactly 30 seconds regardless of login"
      - "CsrfAuthenticationStrategy rotates (regenerates) the CSRF token on successful authentication, so a pre-login token is stale afterward"
      - "The CsrfFilter only validates the very first POST of a session"
      - "Login disables CSRF entirely, so any token is rejected"
    answer: 1
    explanation: |
      On authentication success, CsrfAuthenticationStrategy generates a new CSRF
      token (and CsrfLogoutHandler clears it on logout) to defend against fixation.
      A token grabbed before login no longer matches the persisted post-login
      token. The client must read the refreshed token after authenticating.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-081
    difficulty: intermediate
    tags: [csrf, cookie-repository, httponly]
    question: |
      Why does CookieCsrfTokenRepository.withHttpOnlyFalse() set HttpOnly=false,
      and what is the security trade-off versus new CookieCsrfTokenRepository()?
    options:
      - "It makes the cookie encrypted; the trade-off is slower requests"
      - "It marks the cookie Secure so it only travels over HTTPS; there is no trade-off"
      - "It lets client-side JavaScript read the token to echo it in a header; the trade-off is the token becomes readable by any XSS on the page"
      - "It disables CSRF checks for that cookie; the trade-off is CORS must be enabled"
    answer: 2
    explanation: |
      HttpOnly=false allows JavaScript (e.g. Angular) to read the XSRF-TOKEN cookie
      and send it back in a header. The cost is that XSS can also read it; if JS
      doesn't need to read it, the plain CookieCsrfTokenRepository (HttpOnly) is
      more secure.
    ref: "concepts.md#csrf-protection-and-why-disabled-for-stateless-apis"

  - id: spring-security-basics-082
    difficulty: advanced
    tags: [cors, configuration, corsconfigurationsource]
    question: |
      What is the idiomatic way to make Spring Security honor your cross-origin
      rules, and how does http.cors() discover them?
    options:
      - "Annotate the config class with @EnableCors and list origins in application.properties only"
      - "Expose a CorsConfigurationSource bean and enable http.cors(Customizer.withDefaults()); the DSL picks up that bean to build the CorsFilter"
      - "Call http.addFilter(new CorsFilter()) with no bean; Spring infers origins from the Origin header automatically"
      - "Set allowedOrigins on the SecurityFilterChain's securityMatcher"
    answer: 1
    explanation: |
      The standard wiring is a CorsConfigurationSource bean plus
      http.cors(Customizer.withDefaults()); the CORS DSL locates that bean and uses
      it to configure the CorsFilter (placed early so preflights are answered).
      There is no @EnableCors, and origins are never inferred from the request.
    ref: "concepts.md#cors"

  - id: spring-security-basics-083
    difficulty: intermediate
    tags: [cors, non-browser, misconception]
    question: |
      A developer claims "our CORS config with a strict allowedOrigins list
      protects the API from unauthorized backends and scripts." Why is this
      reasoning flawed?
    options:
      - "CORS is identical to CSRF protection, so it already covers this"
      - "CORS only works over HTTP/2, so most clients bypass it"
      - "CORS actually blocks all cross-origin requests including same-origin ones"
      - "CORS is enforced by the browser; non-browser clients (curl, servers, mobile) ignore Access-Control headers, so CORS is not an access-control mechanism for the server"
    answer: 3
    explanation: |
      CORS relaxes the browser same-origin policy; it is enforced client-side by
      the browser. Servers, curl, and mobile apps simply ignore the
      Access-Control-* headers, so CORS provides no server-side authorization.
      Real access control still comes from authentication/authorization.
    ref: "concepts.md#cors"

  - id: spring-security-basics-084
    difficulty: expert
    tags: [method-security, transactional, ordering, gotcha]
    question: |
      A repository-backed service method has both @Transactional and
      @PostAuthorize("returnObject.owner == authentication.name") and it also
      performs a write. Why is this combination dangerous by default?
    options:
      - "@PostAuthorize cannot read returnObject, so it always denies"
      - "The transaction advisor can wrap outside the post-authorize check, so the DB write may commit before authorization runs; if denied, state was already mutated"
      - "@Transactional silently disables @PostAuthorize"
      - "@PostAuthorize forces a new transaction, causing a deadlock"
    answer: 1
    explanation: |
      @PostAuthorize evaluates after the method returns. With default advisor
      ordering the transaction can commit before the security check, so a write
      persists even when access is ultimately denied. Guidance: use @PostAuthorize
      only on reads, or ensure @EnableTransactionManagement is ordered before
      @EnableMethodSecurity so security advice runs first.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-085
    difficulty: expert
    tags: [method-security, inheritance, startup-failure]
    question: |
      A concrete class implements two interfaces, and it inherits @PreAuthorize
      from BOTH (with different expressions) on the same method signature, with no
      annotation on the concrete method. What happens?
    options:
      - "The two expressions are ORed together at runtime"
      - "The first interface (alphabetically) wins silently"
      - "The application fails at startup due to ambiguous/conflicting inherited annotations; you must place the annotation on the concrete method to resolve it"
      - "Both are ignored and the method is unsecured"
    answer: 2
    explanation: |
      Method security searches the whole type hierarchy for annotations. Inheriting
      the same annotation from two different interfaces is ambiguous and fails at
      startup. Resolve by annotating the concrete method (which overrides
      inherited annotations).
    ref: "concepts.md#method-security"

  - id: spring-security-basics-086
    difficulty: advanced
    tags: [method-security, unannotated, hardening]
    question: |
      With @EnableMethodSecurity and annotation-based rules, a new service method
      is added WITHOUT any @PreAuthorize. From method security's perspective, what
      is its access status, and what is the recommended safeguard?
    options:
      - "It is unsecured by method security (annotation security is opt-in); safeguard with a catch-all authorization rule in HttpSecurity and code review"
      - "It is denied by default (fail-closed); no safeguard needed"
      - "It inherits ROLE_ADMIN automatically"
      - "It throws AccessDeniedException until annotated"
    answer: 0
    explanation: |
      Annotation-based method security is opt-in: unannotated methods are not
      guarded by it (they're subject only to URL rules). This fails open at the
      method layer, so a catch-all authorizeHttpRequests rule (anyRequest
      authenticated/denyAll) plus review is the standard safeguard.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-087
    difficulty: advanced
    tags: [method-security, prefilter, postfilter]
    question: |
      Which capability is unique to @PreFilter/@PostFilter compared with
      @PreAuthorize/@PostAuthorize?
    options:
      - "They can call remote services during evaluation"
      - "They automatically add the ROLE_ prefix to authorities"
      - "They run before the AOP proxy is created"
      - "They evaluate a SpEL expression per element of a Collection argument (@PreFilter) or return value (@PostFilter), pruning non-matching elements via filterObject"
    answer: 3
    explanation: |
      @PreFilter/@PostFilter iterate collections and remove elements for which the
      SpEL (referencing filterObject) is false — e.g. returning only rows the
      caller owns. @PreAuthorize/@PostAuthorize make a single allow/deny decision
      and cannot prune collection contents.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-088
    difficulty: expert
    tags: [method-security, aspectj, self-invocation]
    question: |
      You need @PreAuthorize enforced even on private methods and internal
      self-invocations within the same bean. Which configuration achieves this,
      and what is the cost?
    options:
      - "@EnableMethodSecurity(prePostEnabled=false); no cost"
      - "@EnableMethodSecurity(mode=AdviceMode.ASPECTJ) uses bytecode weaving instead of proxies, so private/self-invoked calls are advised; the cost is load-time or compile-time weaving setup"
      - "Mark the methods final; the JVM then enforces security"
      - "Inject the bean into itself with @Lazy; this makes proxies intercept private calls"
    answer: 1
    explanation: |
      Default proxy-based AOP cannot intercept private methods or this-invocations.
      Switching to AspectJ mode weaves advice into the bytecode, enforcing security
      on those calls, at the cost of setting up load-time/compile-time weaving.
      Self-injection helps self-invocation for public methods but not private ones.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-089
    difficulty: intermediate
    tags: [method-security, combining, repeat]
    question: |
      Which statement about combining method-security annotations on one method is
      correct?
    options:
      - "You may place @PreAuthorize twice to express two independent conditions"
      - "Only one method-security annotation is allowed per class"
      - "@PreAuthorize and @PostAuthorize can coexist and are effectively ANDed (both must pass), but you cannot repeat the same annotation; use SpEL &&/|| instead"
      - "@PreAuthorize and @Secured on the same method are ORed"
    answer: 2
    explanation: |
      Different annotation types combine and are all evaluated (ANDed). Repeating
      the same annotation (two @PreAuthorize) is unsupported; combine conditions
      with SpEL boolean operators or delegate to a bean. Conflicting configs are
      flagged at startup.
    ref: "concepts.md#method-security"

  - id: spring-security-basics-090
    difficulty: advanced
    tags: [headers, frame-options, h2-console, gotcha]
    question: |
      After enabling Spring Security, the embedded H2 console renders as a blank
      page and the browser console shows it refused to display in a frame. What is
      the correct, minimal fix?
    options:
      - "http.headers(h -> h.frameOptions(f -> f.sameOrigin())) because the default X-Frame-Options: DENY blocks the console's iframe"
      - "Disable all security headers with http.headers(HeadersConfigurer::disable)"
      - "Add the console path to web.ignoring() so no filters run"
      - "Set Content-Security-Policy to default-src *"
    answer: 0
    explanation: |
      Spring sends X-Frame-Options: DENY by default, and the H2 console uses
      frames. Switching frame options to sameOrigin lets the console (same origin)
      render while still blocking cross-origin framing. Disabling all headers or
      bypassing the chain is overbroad and insecure.
    ref: "concepts.md#security-response-headers"

  - id: spring-security-basics-091
    difficulty: advanced
    tags: [headers, csp, misconception]
    question: |
      A team assumes Spring Security protects them from XSS "because it adds
      security headers by default." Which statement is accurate?
    options:
      - "Content-Security-Policy is added by default and blocks all inline scripts"
      - "The default HSTS header prevents XSS"
      - "X-XSS-Protection: 1 fully prevents XSS in modern browsers"
      - "Content-Security-Policy is NOT added by default; you must configure it explicitly, so relying on Spring for CSP-based XSS defense without configuring it is a false sense of security"
    answer: 3
    explanation: |
      Spring adds nosniff, frame-options, cache-control, and (over HTTPS) HSTS by
      default, but NOT Content-Security-Policy — you must configure it. Assuming
      CSP is on without setting it leaves XSS largely unmitigated by headers. HSTS
      and nosniff address different threats.
    ref: "concepts.md#security-response-headers"

  - id: spring-security-basics-092
    difficulty: advanced
    tags: [authentication-principal, argument-resolver, gotcha]
    question: |
      A developer injects @AuthenticationPrincipal into a plain @Service method
      (not a controller) and finds it is always null. Why?
    options:
      - "@AuthenticationPrincipal only reads the JWT, which services cannot access"
      - "@AuthenticationPrincipal is resolved by a Spring MVC HandlerMethodArgumentResolver, which only applies to web controller handler methods, not arbitrary bean methods"
      - "Services run on a different SecurityContextHolder strategy"
      - "@AuthenticationPrincipal requires @EnableMethodSecurity to function anywhere"
    answer: 1
    explanation: |
      @AuthenticationPrincipal is wired through an MVC/WebFlux argument resolver,
      so it only populates controller handler method parameters. In a service, read
      the principal from SecurityContextHolder.getContext().getAuthentication()
      instead.
    ref: "concepts.md#accessing-the-principal-and-testing-security"

  - id: spring-security-basics-093
    difficulty: advanced
    tags: [testing, mockmvc, csrf, gotcha]
    question: |
      A @WebMvcTest MockMvc POST to a protected endpoint returns 403 even though
      the test uses @WithMockUser with the right role. What is the most common
      cause and fix?
    options:
      - "MockMvc cannot test POST endpoints; switch to WebTestClient"
      - "@WithMockUser does not work with MockMvc; use a real login"
      - "CSRF protection is active in the test; add .with(csrf()) to the request (or the token) so the state-changing POST passes CSRF validation"
      - "The endpoint needs @CrossOrigin to accept test requests"
    answer: 2
    explanation: |
      CSRF is enabled by default, and a MockMvc POST without a token fails CSRF
      (403) regardless of the mock user's roles. Add
      SecurityMockMvcRequestPostProcessors.csrf() via .with(csrf()) to supply a
      valid token in the test.
    ref: "concepts.md#accessing-the-principal-and-testing-security"

  - id: spring-security-basics-094
    difficulty: intermediate
    tags: [testing, withmockuser, roles-vs-authorities]
    question: |
      What is the difference between @WithMockUser(roles = "ADMIN") and
      @WithMockUser(authorities = "ADMIN")?
    options:
      - "roles = \"ADMIN\" grants authority ROLE_ADMIN (prefix added), while authorities = \"ADMIN\" grants the literal authority ADMIN (no prefix)"
      - "They are identical"
      - "authorities = \"ADMIN\" grants ROLE_ADMIN; roles adds no prefix"
      - "roles works only with @Secured; authorities works only with @PreAuthorize"
    answer: 0
    explanation: |
      roles="ADMIN" produces ROLE_ADMIN (the prefix is added), matching
      hasRole('ADMIN'). authorities="ADMIN" produces exactly ADMIN with no prefix,
      matching hasAuthority('ADMIN'). Mixing them causes tests to pass/fail
      unexpectedly, mirroring the role-vs-authority distinction.
    ref: "concepts.md#accessing-the-principal-and-testing-security"

  - id: spring-security-basics-095
    difficulty: advanced
    tags: [remember-me, fully-authenticated, session]
    question: |
      Why does Spring Security distinguish fullyAuthenticated() from
      authenticated(), and when does it matter?
    options:
      - "fullyAuthenticated() requires MFA; authenticated() requires a password"
      - "There is no functional difference; fullyAuthenticated() is deprecated"
      - "fullyAuthenticated() means the session is not expired; authenticated() ignores expiry"
      - "authenticated() accepts remember-me tokens, while fullyAuthenticated() rejects remember-me and demands a fresh login — useful to gate sensitive operations like changing a password"
    answer: 3
    explanation: |
      A RememberMeAuthenticationToken is authenticated but not "fully"
      authenticated. authenticated() allows it; fullyAuthenticated() does not, so
      you can require the user to re-enter credentials for high-value actions
      rather than relying on a persisted remember-me cookie.
    ref: "concepts.md#logout-remember-me-and-authentication-events"

  - id: spring-security-basics-096
    difficulty: advanced
    tags: [logout, csrf, http-method, gotcha]
    question: |
      With default configuration (CSRF enabled), a link that does GET /logout does
      not log the user out. Why, and what is the correct approach?
    options:
      - "Logout is disabled by default; you must call SecurityContextHolder.clearContext() manually"
      - "By default LogoutFilter matches POST /logout (a state-changing action needing a CSRF token); a GET does not trigger logout, so submit a POST with the CSRF token"
      - "GET /logout works but only after the session times out"
      - "Logout requires the Authorization header to be cleared client-side first"
    answer: 1
    explanation: |
      Because logout changes state, with CSRF enabled the default LogoutFilter
      matches POST /logout and requires a CSRF token; a plain GET link won't log
      out. Use a form POST (with token) or, if you must use GET, configure a
      logoutRequestMatcher accordingly (less safe).
    ref: "concepts.md#logout-remember-me-and-authentication-events"

  - id: spring-security-basics-097
    difficulty: intermediate
    tags: [events, audit, brute-force]
    question: |
      What is the idiomatic Spring Security mechanism for implementing audit
      logging and a failed-login lockout counter, rather than editing filters?
    options:
      - "Override DispatcherServlet to log every request"
      - "Parse the server access log after the fact"
      - "Listen for published authentication events such as AuthenticationSuccessEvent and AuthenticationFailureBadCredentialsEvent (and authorization events) via ApplicationListeners"
      - "Set a ThreadLocal counter inside BCryptPasswordEncoder"
    answer: 2
    explanation: |
      Spring publishes authentication success/failure and authorization
      granted/denied events. Subscribing with ApplicationListeners is the clean
      extension point for audit trails and brute-force lockout logic, keeping the
      filter chain untouched.
    ref: "concepts.md#logout-remember-me-and-authentication-events"

  - id: spring-security-basics-098
    difficulty: expert
    tags: [session, stateless, csrf, interaction]
    question: |
      An API sets SessionCreationPolicy.STATELESS but leaves CSRF enabled with the
      default HttpSessionCsrfTokenRepository. Clients authenticate with a bearer
      header. What is the practical consequence?
    options:
      - "CSRF validation is effectively broken/awkward because the synchronizer token has nowhere to persist without a session, while CSRF is also unnecessary for header-token auth — so CSRF should be disabled here"
      - "Everything works perfectly; STATELESS and CSRF are fully compatible"
      - "STATELESS forces the creation of a session anyway to hold the CSRF token"
      - "The bearer token is rejected because CSRF requires form login"
    answer: 0
    explanation: |
      The default CSRF repository stores the synchronizer token in the HttpSession,
      but STATELESS means no session is created, so token persistence/validation
      falls apart. Moreover, header-token auth isn't auto-attached cross-site, so
      CSRF isn't needed. The correct config for such an API is to disable CSRF.
    ref: "concepts.md#session-management"

  - id: spring-security-basics-099
    difficulty: expert
    tags: [oauth2, oidc, access-token, misuse]
    question: |
      A resource server treats a valid OAuth2 access token's presence as proof of
      the end user's identity and reads user attributes straight from it. Why is
      this an anti-pattern, and what is the correct construct?
    options:
      - "Access tokens are encrypted, so reading them is impossible; use the refresh token instead"
      - "You must decode the access token with the client secret to get identity"
      - "Access tokens never contain a subject, so identity must come from the session cookie"
      - "OAuth2 access tokens are authorization artifacts whose format/claims are opaque to the client and may lack verified identity; identity should come from an OIDC ID token (or the userinfo endpoint), not by mining the access token"
    answer: 3
    explanation: |
      OAuth2 concerns delegated authorization; the access token grants API access
      and its contents are not a contract for the client. OpenID Connect adds
      authentication via the ID token (and userinfo). Using a bare access token as
      an identity assertion is the classic OAuth-as-authentication mistake.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-100
    difficulty: expert
    tags: [oauth2, pkce, interception, mechanism]
    question: |
      Precisely how does PKCE defeat an authorization-code interception attack on a
      public client?
    options:
      - "It encrypts the authorization code so interception yields ciphertext"
      - "The client sends a hashed code_challenge with the auth request; at token exchange it must present the matching plaintext code_verifier, so an intercepted code is useless without the verifier the attacker never saw"
      - "It embeds the client secret in the redirect URI"
      - "It shortens the code's lifetime to zero, so codes cannot be reused"
    answer: 1
    explanation: |
      PKCE binds the code to a one-time secret: the client registers
      SHA256(code_verifier) as code_challenge up front and must supply the original
      code_verifier at exchange. An attacker who intercepts the code cannot redeem
      it without the verifier, which never travels on the front channel.
    ref: "concepts.md#oauth2-grant-types-and-pkce"

  - id: spring-security-basics-101
    difficulty: advanced
    tags: [custom-filter, once-per-request, gotcha]
    question: |
      A custom JWT authentication filter added via addFilterBefore(...) sometimes
      runs twice per request (e.g. on ERROR dispatch), causing duplicate work and
      odd logs. What is the standard remedy?
    options:
      - "Register it as a servlet Listener instead of a Filter"
      - "Add @Order(Integer.MIN_VALUE) to the filter"
      - "Extend OncePerRequestFilter so it executes at most once per request dispatch, avoiding re-execution on forwards/errors"
      - "Move the filter after AuthorizationFilter"
    answer: 2
    explanation: |
      Filters can be invoked on multiple dispatches (forward/error/include).
      OncePerRequestFilter guarantees a single execution per request via a request
      attribute guard, which is why nearly all Spring Security auth filters extend
      it. Ordering tricks don't solve re-dispatch.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-102
    difficulty: expert
    tags: [filter-chain, exception-translation, controller, gotcha]
    question: |
      An AccessDeniedException is thrown from deep inside a @Service (via
      @PreAuthorize) during a web request. It is translated to a clean 403. But the
      same exception thrown from a @Scheduled job just propagates and crashes the
      task. Why the difference?
    options:
      - "ExceptionTranslationFilter only sits in the servlet filter chain; it converts AccessDeniedException/AuthenticationException to HTTP responses only for requests flowing through the chain, not for non-web threads"
      - "@Scheduled methods have no SecurityContext, so no exception is thrown there"
      - "Scheduled jobs run with ROLE_ADMIN and cannot be denied"
      - "AccessDeniedException is a checked exception outside web requests"
    answer: 0
    explanation: |
      ExceptionTranslationFilter is a servlet filter; it only handles exceptions on
      requests passing through the filter chain, mapping them to 401/403. A
      @Scheduled task runs off the request path, so nothing translates the
      AccessDeniedException and it propagates. You must handle it yourself in
      non-web contexts.
    ref: "concepts.md#security-filter-chain-and-request-flow"

  - id: spring-security-basics-103
    difficulty: advanced
    tags: [passwordencoder, delegating, default, boot3]
    question: |
      In a Boot 3 app you declare only a UserDetailsService with users stored as
      {bcrypt}$2a$10$... but no PasswordEncoder bean. Login works. Which encoder is
      actually used, and why does the {bcrypt} prefix matter?
    options:
      - "NoOpPasswordEncoder; the prefix is ignored"
      - "Plaintext comparison, because no encoder bean means no hashing"
      - "A bare BCryptPasswordEncoder, which requires you to strip the prefix first"
      - "A DelegatingPasswordEncoder (the framework default when no PasswordEncoder bean is defined), which reads the {bcrypt} id prefix to select BCrypt for matching"
    answer: 3
    explanation: |
      When no PasswordEncoder bean is present, Spring Security defaults to a
      DelegatingPasswordEncoder (via PasswordEncoderFactories). It uses the {id}
      prefix to pick the right algorithm, so {bcrypt}-prefixed hashes verify with
      BCrypt. This is why the default handles prefixed hashes seamlessly.
    ref: "concepts.md#passwordencoder-and-bcrypt"

  - id: spring-security-basics-104
    difficulty: expert
    tags: [authorizehttprequests, matcher-ordering, startup, gotcha]
    question: |
      Consider:
      ```
      http.authorizeHttpRequests(auth -> auth
          .requestMatchers("/api/**").authenticated()
          .requestMatchers("/api/public/**").permitAll()
          .anyRequest().denyAll());
      ```
      What is the effective behavior for GET /api/public/info?
    options:
      - "It is permitted, because permitAll() is more specific and always wins"
      - "It requires authentication, because /api/** is listed first and first-match-wins means /api/public/** is shadowed"
      - "It fails at startup with an ambiguous-matcher error"
      - "It is denied by anyRequest().denyAll() because /api/public paths never match /api/**"
    answer: 1
    explanation: |
      Rules are evaluated top-down, first match wins. /api/public/info matches
      /api/** first, so it requires authentication and the later, more specific
      /api/public/** permitAll() rule is never reached. Order specific rules before
      broader ones to fix this.
    ref: "concepts.md#securityfilterchain-and-the-lambda-dsl"
