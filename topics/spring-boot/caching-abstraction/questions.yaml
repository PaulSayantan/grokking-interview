topic: Caching Abstraction
domain: spring-boot
topic_slug: caching-abstraction
version: 1
questions:
- id: caching-abstraction-001
  difficulty: beginner
  tags:
  - enablecaching
  - fundamentals
  question: |
    What happens if you annotate methods with @Cacheable but never add
    @EnableCaching to any configuration class (and no auto-config enables it)?
  options:
  - The annotations are silently ignored and the methods run normally with no caching
  - The application fails to start with a BeanCreationException at context refresh
  - Caching works but only for the very first invocation of each annotated method
  - Spring throws a CacheConfigurationException at the first cached call
  answer: 0
  explanation: |
    Caching is opt-in. Without @EnableCaching (or Boot auto-config enabling it),
    the caching AOP infrastructure is not registered, so the annotations are
    inert — the methods execute normally every time. No error is thrown.
  ref: concepts.md#enablecaching
- id: caching-abstraction-002
  difficulty: beginner
  tags:
  - cacheable
  - fundamentals
  question: |
    On a cache HIT, what does @Cacheable do?
  options:
  - Runs the method and then compares the result to the cached value
  - Runs the method but discards its result in favor of the cached value
  - Returns the cached value and skips the method body entirely
  - Refreshes the cached value by re-running the method asynchronously
  answer: 2
  explanation: |
    On a hit, @Cacheable returns the stored value without invoking the method
    body at all. That is precisely why methods with side effects are poor
    candidates — the side effects won't happen on a hit.
  ref: concepts.md#cacheable
- id: caching-abstraction-003
  difficulty: beginner
  tags:
  - cacheput
  question: |
    How does @CachePut differ from @Cacheable?
  options:
  - '@CachePut skips execution on a hit just like @Cacheable but additionally refreshes the entry TTL'
  - '@CachePut only stores the result when the key is currently absent, behaving as a put-if-missing operation'
  - '@CachePut removes the matching entry from the cache after the method returns, acting as a deferred evict'
  - '@CachePut always executes the method and stores/updates the result; it never skips execution'
  answer: 3
  explanation: |
    @CachePut always runs the method and puts (updates) the return value into
    the cache. Unlike @Cacheable it never short-circuits on a hit, so it is used
    to keep the cache fresh after an update/write.
  ref: concepts.md#cacheput
- id: caching-abstraction-004
  difficulty: beginner
  tags:
  - cacheevict
  question: |
    Which annotation removes entries from a cache, typically used on delete or
    update methods to invalidate stale data?
  options:
  - '@Cacheable'
  - '@CacheEvict'
  - '@CachePut'
  - '@CacheRemove'
  answer: 1
  explanation: |
    @CacheEvict removes one entry (by key) or all entries (allEntries=true).
    @CacheRemove is the JSR-107 (JCache) annotation, not the core Spring one.
  ref: concepts.md#cacheevict
- id: caching-abstraction-005
  difficulty: intermediate
  tags:
  - cacheevict
  - beforeinvocation
  question: |
    A @CacheEvict method throws an exception before returning. With the default
    settings, what happens to the cache entry?
  options:
  - It is evicted anyway because eviction happens before invocation by default
  - It is evicted and then automatically restored on rollback
  - It is NOT evicted, because the default beforeInvocation=false evicts only after successful return
  - The whole named cache is cleared as a safety measure whenever an evict method throws
  answer: 2
  explanation: |
    By default beforeInvocation=false, so eviction runs only after the method
    returns normally. If the method throws, no eviction occurs. Set
    beforeInvocation=true to evict before the method runs regardless of outcome.
  ref: concepts.md#cacheevict
- id: caching-abstraction-006
  difficulty: intermediate
  tags:
  - cacheevict
  - allentries
  question: |
    What does @CacheEvict(cacheNames = "books", allEntries = true) do?
  options:
  - Clears every entry in the 'books' cache, ignoring the key attribute
  - Evicts only the entry whose key equals the string 'true'
  - Evicts only the entries older than the cache's configured TTL threshold
  - Marks the 'books' cache read-only so that no new entries can be added
  answer: 0
  explanation: |
    allEntries=true clears the entire named cache and ignores the key
    expression. It is used for bulk changes where invalidating individual keys
    would be impractical.
  ref: concepts.md#cacheevict
- id: caching-abstraction-007
  difficulty: intermediate
  tags:
  - caching
  - composition
  question: |
    You need a single method to perform two @CacheEvict operations against two
    different caches with two different keys. Which annotation lets you express
    this?
  options:
  - '@CacheEvict with allEntries=true'
  - '@Cacheable with multiple cacheNames'
  - Two separate @CacheEvict annotations stacked directly on the method
  - '@Caching, grouping the multiple evict operations'
  answer: 3
  explanation: |
    @Caching aggregates multiple caching annotations (cacheable/put/evict) on one
    method. It exists precisely because you otherwise cannot place two @CacheEvict
    annotations with distinct keys on the same method.
  ref: concepts.md#caching
- id: caching-abstraction-008
  difficulty: beginner
  tags:
  - key-generation
  - default
  question: |
    With the default SimpleKeyGenerator, what is the cache key for a @Cacheable
    method that takes exactly one argument?
  options:
  - A SimpleKey wrapping the argument
  - The argument instance itself
  - SimpleKey.EMPTY
  - The method name concatenated with the argument's hashCode
  answer: 1
  explanation: |
    SimpleKeyGenerator uses: no params -> SimpleKey.EMPTY, one param -> that
    param instance, multiple params -> a SimpleKey wrapping all of them.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-009
  difficulty: beginner
  tags:
  - key-generation
  - default
  question: |
    With the default SimpleKeyGenerator, what key is generated for a @Cacheable
    method that takes NO arguments?
  options:
  - SimpleKey.EMPTY
  - The method name
  - 'null'
  - A random UUID per invocation
  answer: 0
  explanation: |
    For a no-arg method, SimpleKeyGenerator returns the singleton
    SimpleKey.EMPTY, so all invocations share one entry. A per-invocation random
    key would defeat caching entirely.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-010
  difficulty: intermediate
  tags:
  - spel
  - key
  question: |
    Which SpEL expression correctly keys a cache on the isbn field of a Book
    argument named 'book'?
  options:
  - key = "book.isbn"
  - key = "@book.isbn"
  - key = "#book.isbn"
  - key = "${book.isbn}"
  answer: 2
  explanation: |
    Method arguments are referenced with the # prefix in caching SpEL, so
    #book.isbn navigates the isbn property of the 'book' argument. ${...} is
    property-placeholder syntax and @ references beans, neither applies here.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-011
  difficulty: advanced
  tags:
  - spel
  - result
  question: |
    Why can't you reference #result in the key attribute of a @Cacheable method?
  options:
  - 'Because #result is reserved for @CacheEvict operations only and is stripped from the @Cacheable evaluation context'
  - 'Because #result is only ever exposed inside the condition attribute, and never inside key or unless expressions'
  - Because Spring's SpEL evaluator is deliberately sandboxed and cannot read a method's return value at any point
  - Because the key must be computed before the method runs (to check for a hit), and the result doesn't
    exist yet
  answer: 3
  explanation: |
    For @Cacheable, the key is needed BEFORE invocation to look for an existing
    entry. Since the method hasn't run, #result is unavailable. #result is
    available in unless, @CachePut, and @CacheEvict(beforeInvocation=false).
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-012
  difficulty: intermediate
  tags:
  - condition
  - unless
  - timing
  question: |
    What is the fundamental difference between 'condition' and 'unless' in
    @Cacheable?
  options:
  - 'condition can read #result to inspect the return value, whereas unless is evaluated too early to see it'
  - 'condition is evaluated before invocation (no #result); unless is evaluated after invocation (can
    use #result)'
  - condition applies only to @CachePut operations, while unless applies only to @Cacheable operations
  - They are exact aliases of each other and behave identically regardless of which one you choose
  answer: 1
  explanation: |
    condition is a pre-invocation gate (no #result yet). unless is a
    post-invocation veto that can inspect #result to decide whether to store it.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-013
  difficulty: intermediate
  tags:
  - unless
  - null
  question: |
    By default, if a @Cacheable method returns null, what happens? And how do
    you prevent caching nulls?
  options:
  - null is never cached by default; the abstraction filters nulls out so nothing extra is needed
  - The call throws a NullPointerException at store time; wrap the return value in an Optional to avoid it
  - null IS cached by default; use unless = "#result == null" to avoid it
  - null is cached only when the computed key is non-null, and there is no configuration to change that
  answer: 2
  explanation: |
    By default Spring caches null return values (so a miss returning null won't
    be recomputed). To skip storing nulls, use unless = "#result == null" or a
    provider-level null policy.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-014
  difficulty: beginner
  tags:
  - cachemanager
  - abstraction
  question: |
    What is the role of CacheManager in Spring's caching abstraction?
  options:
  - It is the SPI that acts as a factory/registry of named Cache instances, letting you swap providers
  - It stores all cached values directly in a single shared ConcurrentHashMap it manages internally
  - It automatically evicts entries based on the TTL and maximum-size limits it enforces per region
  - It compiles and evaluates the SpEL key expressions used for every cache lookup and store
  answer: 0
  explanation: |
    CacheManager is the central abstraction: getCache(name) returns a Cache, and
    getCacheNames() lists them. Business code depends only on this SPI, so the
    concrete provider (Caffeine, Redis, etc.) can be swapped freely.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-015
  difficulty: beginner
  tags:
  - providers
  - simple
  question: |
    Which CacheManager does Spring Boot fall back to when no other cache
    provider is configured on the classpath?
  options:
  - RedisCacheManager, backed by an embedded Redis server that Boot starts automatically
  - CaffeineCacheManager, since Caffeine ships bundled inside spring-boot-starter by default
  - NoOpCacheManager, so that caching stays completely inert until a provider is added
  - ConcurrentMapCacheManager (the 'simple' in-heap cache)
  answer: 3
  explanation: |
    With nothing else configured, Boot uses the 'simple' provider backed by
    ConcurrentMapCacheManager (in-heap ConcurrentHashMap). NoOpCacheManager only
    applies when caching is explicitly disabled (spring.cache.type=none).
  ref: concepts.md#cache-providers
- id: caching-abstraction-016
  difficulty: intermediate
  tags:
  - providers
  - concurrentmap
  - hazard
  question: |
    Why is the default ConcurrentMap/simple cache dangerous for a large or
    continuously growing key space?
  options:
  - It serializes every value to a temp file on disk, so write throughput collapses under load
  - It has no TTL, size limit, or eviction, so it grows unbounded and can cause an OutOfMemoryError
  - It cannot store more than 1000 entries per region and silently drops writes past that cap
  - It clears the entire region on every write, so under mixed traffic hit rates fall to near zero
  answer: 1
  explanation: |
    ConcurrentMapCacheManager is an unbounded in-heap map with no eviction or
    TTL. Entries live until explicitly evicted, so an ever-growing key space is a
    memory leak that can OOM the JVM. Use Caffeine/Redis with limits instead.
  ref: concepts.md#cache-providers
- id: caching-abstraction-017
  difficulty: intermediate
  tags:
  - providers
  - caffeine
  question: |
    Which statement best characterizes Caffeine as a Spring cache provider?
  options:
  - A high-performance in-JVM cache (Guava successor) supporting max size, TTL, and stats, but not distributed
  - A distributed cache shared across all application instances via a built-in gossip replication protocol
  - A JDBC-backed cache that persists every entry to a relational database table for durability
  - A remote cache that requires a separate standalone server process to be running alongside the app
  answer: 0
  explanation: |
    Caffeine is a fast local (in-JVM) cache with maximumSize, expireAfterWrite/
    Access, reference-based eviction, and statistics. Being local, each node has
    its own copy — it is not distributed.
  ref: concepts.md#cache-providers
- id: caching-abstraction-018
  difficulty: intermediate
  tags:
  - providers
  - redis
  - distributed
  question: |
    In a horizontally scaled deployment where every instance must see the same
    cached data and cached entries should survive restarts, which provider fits
    best?
  options:
  - ConcurrentMapCacheManager, which auto-syncs its map across nodes on a schedule
  - Caffeine, since its entries are persisted to disk and survive process restarts
  - Redis (a distributed/remote cache)
  - NoOpCacheManager, configured with a shared backing store for cross-node reads
  answer: 2
  explanation: |
    Redis is a distributed, out-of-process cache shared by all instances and
    surviving app restarts, at the cost of network latency and serialization.
    Local caches (ConcurrentMap, Caffeine) give each node its own separate copy.
  ref: concepts.md#cache-providers
- id: caching-abstraction-019
  difficulty: advanced
  tags:
  - cachemanager
  - transaction
  question: |
    What does TransactionAwareCacheManagerProxy provide?
  options:
  - It automatically issues a database rollback whenever a cache put fails, treating the cache as the system of record
  - It detects @Transactional methods and disables all caching within them, so cached data can never diverge from the database
  - It enlists the cache as an XA resource so it takes part in a two-phase commit protocol alongside the database
  - It defers cache put/evict operations until the surrounding transaction commits, so a rollback doesn't
    leave stale data cached
  answer: 3
  explanation: |
    TransactionAwareCacheManagerProxy synchronizes cache writes with the
    transaction: puts/evicts are held until commit. If the transaction rolls
    back, the cache is never mutated with data that was never persisted.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-020
  difficulty: intermediate
  tags:
  - eviction
  - ttl
  - abstraction
  question: |
    Where do TTL, maximum size, and eviction policy (LRU/LFU) come from in
    Spring's caching abstraction?
  options:
  - From dedicated ttl, maxSize, and evictionPolicy attributes declared directly on the @Cacheable annotation
  - From the underlying provider's configuration — the abstraction itself has no TTL/size/eviction notion
  - From @EnableCaching configuration attributes such as defaultTtl and maxEntries applied context-wide
  - From the SpEL 'unless' expression, which is evaluated periodically to expire entries past the limit
  answer: 1
  explanation: |
    Spring's abstraction has no TTL/size/eviction concept. Those are configured
    on the provider (Caffeine spec, Redis entryTtl, ehcache.xml). The abstraction
    only offers explicit, event-driven @CacheEvict.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-021
  difficulty: advanced
  tags:
  - caffeine
  - ttl
  question: |
    In Caffeine, what is the difference between expireAfterWrite and
    expireAfterAccess?
  options:
  - They are exact aliases; both start their timer from entry creation and are provided only for readability
  - expireAfterWrite counts from the last read while expireAfterAccess counts from creation, so writes never reset either timer
  - expireAfterWrite counts from entry creation/update; expireAfterAccess counts from the last read or
    write
  - expireAfterWrite governs only read operations while expireAfterAccess governs only write operations, splitting the timeout by call type
  answer: 2
  explanation: |
    expireAfterWrite expires an entry a fixed duration after it was created or
    last written, regardless of reads. expireAfterAccess resets the timer on
    every access (read or write), so frequently-read entries stay longer.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-022
  difficulty: advanced
  tags:
  - self-invocation
  - proxy
  - trap
  question: |
    Given this bean, how many times does the DB-backed findBook run when an
    external caller invokes findAndFormat("123") five times in a row?

      @Service
      public class BookService {
          @Cacheable("books")
          public Book findBook(String isbn) { return repo.load(isbn); }
          public Book findAndFormat(String isbn) {
              return format(findBook(isbn));   // called via this
          }
      }
  options:
  - Five times — the internal call to findBook goes through 'this', bypassing the proxy, so caching is
    never applied
  - Once — the proxy intercepts the internal findBook call too, so it caches the result after the first invocation and reuses it
  - Zero — the proxy caches findAndFormat itself, so findBook is never actually reached after the initial warm-up call
  - Twice — the proxy uses a two-call warm-up before it begins serving findBook from the cache on later invocations
  answer: 0
  explanation: |
    In default PROXY mode, caching advice runs only for calls through the proxy.
    findAndFormat calls findBook via 'this', bypassing the proxy, so @Cacheable
    never fires — findBook runs all five times. Same trap as @Transactional/@Async.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-023
  difficulty: advanced
  tags:
  - self-invocation
  - fixes
  question: |
    Which of these does NOT fix the caching self-invocation problem?
  options:
  - Move the @Cacheable method into a separate Spring bean and call it through the injected reference
  - Self-inject the bean's own proxy and call the method via that reference
  - Switch to AspectJ weaving mode (mode = AdviceMode.ASPECTJ)
  - Mark the internal method private so the proxy can intercept it
  answer: 3
  explanation: |
    Making the method private makes things worse — proxies cannot advise private
    methods at all. Valid fixes: separate bean, self-injection of the proxy,
    AopContext.currentProxy(), or AspectJ weaving (which advises this-calls too).
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-024
  difficulty: advanced
  tags:
  - proxy
  - jdk
  - cglib
  question: |
    With mode=PROXY and proxyTargetClass=false, a @Cacheable bean that implements
    an interface will be proxied how, and what is a consequence?
  options:
  - With a CGLIB subclass proxy; because it extends the class directly, even final methods can be advised
  - With a JDK dynamic proxy; only interface-declared methods are advised
  - With no proxy at all; the caching annotations are woven straight into the bytecode at compile time
  - With a JDK proxy that reflectively unwraps the target, so even private methods end up advised too
  answer: 1
  explanation: |
    When the bean implements an interface and proxyTargetClass=false, Spring uses
    a JDK dynamic proxy, which can only advise methods declared on the interface.
    CGLIB (proxyTargetClass=true, Boot's default) subclasses the class but still
    cannot override final/private methods.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-025
  difficulty: intermediate
  tags:
  - stampede
  - sync
  question: |
    What is a cache stampede (thundering herd), and which built-in Spring feature
    mitigates it?
  options:
  - Many concurrent requests missing the same key at once and all recomputing; mitigated by @Cacheable(sync
    = true)
  - Registering too many named caches on one CacheManager, which is resolved by consolidating them behind a CompositeCacheManager
  - Silent value corruption when several threads write the same key at once, which is prevented by switching the method to @CachePut
  - The cache growing past its configured memory limit, which is fixed by periodically calling @CacheEvict with allEntries=true
  answer: 0
  explanation: |
    A stampede is many threads missing the same (expired/cold) key simultaneously
    and all triggering the expensive load. @Cacheable(sync=true) serializes
    concurrent misses for one key so only one thread computes; others wait.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-026
  difficulty: advanced
  tags:
  - stampede
  - sync
  - limitations
  question: |
    Which is a genuine limitation of @Cacheable(sync = true)?
  options:
  - It forces every call to bypass the cache and recompute, so the lookup step is skipped even on a hit
  - It disables the key attribute entirely, forcing all invocations to share one fixed SimpleKey.EMPTY slot
  - It cannot be combined with unless and is restricted to a single cache; not all providers support it
  - It only works when the backing provider is Redis, since it depends on a Redis distributed lock internally
  answer: 2
  explanation: |
    sync=true is restricted to a single cache, is incompatible with unless (and
    certain other attributes), and is only supported by some providers. It also
    coordinates only within one JVM unless the provider is distributed-lock aware.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-027
  difficulty: advanced
  tags:
  - stampede
  - caffeine
  - refresh
  question: |
    Which Caffeine feature serves a stale value while asynchronously reloading a
    key, avoiding a hard cache miss under load?
  options:
  - expireAfterWrite
  - maximumSize
  - weakKeys
  - refreshAfterWrite
  answer: 3
  explanation: |
    refreshAfterWrite triggers an asynchronous reload after the interval while
    still returning the existing (stale) value to callers, smoothing out reloads
    and avoiding a synchronous miss storm.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-028
  difficulty: intermediate
  tags:
  - when-to-cache
  - hurts
  question: |
    Which scenario is the WORST fit for @Cacheable?
  options:
  - An expensive, rarely-changing reference-data lookup
  - A write-heavy method whose data changes on almost every request
  - A pure computation over a small hot set of keys
  - A slow remote call whose results are valid for minutes
  answer: 1
  explanation: |
    Caching helps read-mostly, expensive, idempotent operations. Write-heavy,
    rapidly-changing data yields constant invalidation, low hit rates, and stale
    reads — caching hurts more than it helps.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-029
  difficulty: intermediate
  tags:
  - when-to-cache
  - side-effects
  question: |
    Why are methods with side effects poor candidates for @Cacheable?
  options:
  - Because SpEL cannot evaluate cache keys for methods that perform I/O or mutate external state
  - Because the abstraction requires side-effecting methods to return null, so nothing useful gets stored
  - Because on a cache hit the method body is skipped, so the side effects don't happen
  - Because the cache captures each side effect into a serialized journal and replays it on every hit
  answer: 2
  explanation: |
    @Cacheable short-circuits execution on a hit, returning only the stored
    value. Any side effects (logging, counters, sending messages) inside the
    method won't run on hits, breaking the intended behavior.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-030
  difficulty: beginner
  tags:
  - enablecaching
  - config
  question: |
    Where must @EnableCaching be placed?
  options:
  - On a @Configuration class (or a class that Spring processes as configuration)
  - Directly on every individual @Cacheable method so each one opts into the caching infrastructure
  - On the CacheManager bean definition itself, so the provider registers the caching AOP advisors
  - In application.properties as a boolean flag such as spring.cache.enable-caching=true
  answer: 0
  explanation: |
    @EnableCaching is a class-level annotation for a configuration class. It
    imports the caching AOP infrastructure that then processes the method-level
    caching annotations across the context.
  ref: concepts.md#enablecaching
- id: caching-abstraction-031
  difficulty: advanced
  tags:
  - enablecaching
  - aspectj
  question: |
    Setting @EnableCaching(mode = AdviceMode.ASPECTJ) has what notable effect
    relative to the default PROXY mode?
  options:
  - It disables all caching until a compile-time AspectJ weaver is explicitly attached to the build
  - It makes every @Cacheable operation synchronous by default, as if sync=true were set everywhere
  - It forces the backing provider to be Redis, because AspectJ weaving depends on Redis-side coordination
  - It weaves the caching aspect into the bytecode, so even self-invocation (this-calls) and private/final
    methods can be advised
  answer: 3
  explanation: |
    ASPECTJ mode uses compile/load-time weaving rather than a runtime proxy, so
    caching applies to internal this-calls as well — defeating the self-invocation
    limitation. It requires the AspectJ weaver to be set up.
  ref: concepts.md#enablecaching
- id: caching-abstraction-032
  difficulty: intermediate
  tags:
  - cacheable
  - cacheput
  - conflict
  question: |
    Why should you avoid placing both @Cacheable and @CachePut on the same
    method?
  options:
  - They compile down to the same bytecode advisor, so the context refresh fails with a duplicate-annotation error
  - Their semantics conflict — @Cacheable skips execution on a hit while @CachePut forces execution —
    leading to unpredictable behavior
  - '@CachePut silently strips the @Cacheable advice at startup, wasting the annotation and confusing readers'
  - It stores the return value twice under the same key, doubling the memory each entry consumes in the region
  answer: 1
  explanation: |
    @Cacheable wants to skip the method on a hit; @CachePut wants to always run
    it. Combined on one method the behaviors contradict each other, so Spring's
    docs advise against it. Use one or the other per method.
  ref: concepts.md#cacheput
- id: caching-abstraction-033
  difficulty: intermediate
  tags:
  - cacheput
  - pattern
  question: |
    A common consistency pattern uses @Cacheable on the read method and, on the
    update method, an annotation with the SAME key expression so subsequent reads
    see fresh data without a miss. Which annotation belongs on the update method?
  options:
  - '@CachePut with the matching key'
  - '@CacheEvict(beforeInvocation=true)'
  - '@Cacheable'
  - '@Caching(cacheable=...)'
  answer: 0
  explanation: |
    @CachePut runs the update and writes the fresh value under the same key the
    read uses, so the very next @Cacheable read hits the refreshed entry. An
    evict would also work but forces the next read to miss and recompute.
  ref: concepts.md#cacheput
- id: caching-abstraction-034
  difficulty: intermediate
  tags:
  - key-generation
  - keygenerator
  question: |
    You want a reusable custom key strategy across many methods instead of
    repeating SpEL. What do you do, and what constraint applies?
  options:
  - Set both key and keyGenerator on each method; Spring merges the SpEL key with the generator output into a composite key
  - Override hashCode() on every argument type instead; a reusable keyGenerator strategy is not supported by the abstraction
  - Provide a KeyGenerator bean and reference it via keyGenerator = "myGen"; note that key and keyGenerator
    are mutually exclusive
  - Use @Caching to nest several key generators so the outermost one produces the shared key for every method
  answer: 2
  explanation: |
    Implement a KeyGenerator bean and reference it with keyGenerator="beanName".
    You cannot use key and keyGenerator on the same operation — they are mutually
    exclusive because both define how the key is produced.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-035
  difficulty: advanced
  tags:
  - spel
  - root
  - metadata
  question: |
    Which SpEL reference gives the name of the invoked method inside a cache key
    expression?
  options:
  - '#method.name'
  - '#target.name'
  - '#this.method'
  - '#root.methodName'
  answer: 3
  explanation: |
    The caching evaluation context exposes #root.methodName (and #root.method,
    #root.target, #root.targetClass, #root.args, #root.caches). So
    key = "#root.methodName + '_' + #isbn" produces a method-qualified key.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-036
  difficulty: advanced
  tags:
  - spel
  - parameter-names
  question: |
    Referencing an argument by name like #isbn in a cache key requires what, and
    what is the fallback if it's unavailable?
  options:
  - 'Nothing special; the JVM always retains parameter names in bytecode, and the fallback is the #name accessor'
  - 'The -parameters compiler flag (default in Boot''s build plugins); otherwise use positional #p0/#a0'
  - A @Param annotation on each argument to expose its name to SpEL; the fallback is a plain @Value binding
  - Runtime reflection to be explicitly enabled via a JVM flag; the fallback is the argument's toString() value
  answer: 1
  explanation: |
    Parameter-name resolution needs debug info or the -parameters javac flag
    (Spring Boot's Maven/Gradle plugins enable it). Without it, use positional
    references #p0/#a0 (or #p<index>) to reach arguments.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-037
  difficulty: intermediate
  tags:
  - condition
  - timing
  question: |
    A @Cacheable method has condition = "#id > 10". What is true?
  options:
  - 'The condition is evaluated after the method returns, using #result to veto the earlier lookup'
  - The condition only affects @CacheEvict operations, never the lookup or store path of a read
  - The condition is evaluated before the method; if false, no lookup or store happens and the method
    just runs normally
  - The condition parses each id numerically and caches only the even-numbered ones, skipping odd ids
  answer: 2
  explanation: |
    condition is a pre-invocation gate. If it evaluates false, caching is skipped
    entirely (no lookup, no store) and the method executes as if uncached.
    #result is not available in condition.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-038
  difficulty: intermediate
  tags:
  - unless
  - result
  question: |
    Which is a correct use of 'unless' to avoid caching out-of-print books?
  options:
  - 'unless = "#result == null || #result.outOfPrint"'
  - unless = "#isbn == null || #isbn.length() == 0"
  - condition = "#result != null && #result.outOfPrint"
  - key = "#result.outOfPrint ? #isbn : 'none'"
  answer: 0
  explanation: |
    unless is evaluated after the method and can inspect #result. Vetoing when
    the result is null or out of print prevents storing those entries. condition
    and @Cacheable's key cannot see #result.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-039
  difficulty: beginner
  tags:
  - providers
  - disable
  - tests
  question: |
    How do you disable caching (use a no-op cache) in a test profile via Spring
    Boot properties?
  options:
  - spring.cache.enabled=false
  - Remove @EnableCaching at runtime
  - spring.cache.provider=noop
  - spring.cache.type=none
  answer: 3
  explanation: |
    spring.cache.type=none wires a NoOpCacheManager, so caching annotations run
    but store nothing — every call executes the method. Handy for isolating tests
    from cache behavior.
  ref: concepts.md#cache-providers
- id: caching-abstraction-040
  difficulty: intermediate
  tags:
  - providers
  - jcache
  - ehcache
  question: |
    Ehcache 3 is integrated with Spring caching through which mechanism?
  options:
  - The legacy EhCacheCacheManager bridge that shipped for the Ehcache 2.x XML configuration
  - The JSR-107 (JCache) API via JCacheCacheManager
  - RedisCacheManager, since Ehcache 3 stores its tiers in an embedded Redis instance
  - A custom ConcurrentMap adapter that Spring generates around the Ehcache 3 heap store
  answer: 1
  explanation: |
    Ehcache 3 is a JSR-107 (JCache) provider, so it plugs in via
    JCacheCacheManager. EhCacheCacheManager is only for the older Ehcache 2.x
    API.
  ref: concepts.md#cache-providers
- id: caching-abstraction-041
  difficulty: advanced
  tags:
  - providers
  - coherence
  question: |
    A team uses a local Caffeine cache on 4 nodes. After an update on node A, node
    B keeps returning stale data. What is the root cause?
  options:
  - Local caches keep a separate copy per JVM, so an evict/put on node A does not affect node B's cache
    — a coherence problem
  - Caffeine has a known bug where expireAfterWrite fails to reset the timer on updated entries
  - The CacheManager bean was defined but the class was never annotated with @EnableCaching to activate it
  - unless was set to a constant true expression, so node B silently refuses to store any new entries
  answer: 0
  explanation: |
    Local (in-JVM) caches are per-node. A @CacheEvict/@CachePut on node A only
    touches node A's map; node B is unaffected and stays stale. Solutions: a
    distributed cache (Redis/Hazelcast) or a cross-node eviction/broadcast.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-042
  difficulty: beginner
  tags:
  - cacheable
  - return-type
  question: |
    Which annotation is allowed on a void method?
  options:
  - '@Cacheable'
  - '@CachePut'
  - '@CacheEvict'
  - None — caching requires a return value
  answer: 2
  explanation: |
    @CacheEvict just removes entries and needs no return value, so it works on
    void methods (e.g. delete/clear operations). @Cacheable and @CachePut cache
    the return value, so a void return makes no sense for them.
  ref: concepts.md#cacheevict
- id: caching-abstraction-043
  difficulty: intermediate
  tags:
  - cachemanager
  - composite
  question: |
    What does CompositeCacheManager do?
  options:
  - Merges the caches from several providers into one physically distributed, cluster-wide cache region
  - Composes a single SpEL cache key by concatenating the output of multiple registered key generators
  - Automatically replicates every entry between a Redis tier and a Caffeine tier to keep them in sync
  - Delegates cache lookups to an ordered list of CacheManagers, returning the first that has the named
    cache
  answer: 3
  explanation: |
    CompositeCacheManager iterates a list of delegate CacheManagers to resolve a
    cache by name, letting you combine providers (e.g. a primary plus a fallback,
    optionally with a NoOpCacheManager tail).
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-044
  difficulty: advanced
  tags:
  - enablecaching
  - proxytargetclass
  - boot
  question: |
    In Spring Boot, what is the default value of proxyTargetClass for AOP-based
    features like caching, and what does it imply?
  options:
  - false — JDK dynamic proxies are always used, so a cached bean must implement at least one interface
  - true — CGLIB subclass proxies are used by default, so interface-less classes are proxied too
  - It defaults to unset, and caching silently fails on any bean that does not implement an interface
  - true — but the CGLIB default applies only to @Transactional beans, while caching still uses JDK proxies
  answer: 1
  explanation: |
    Spring Boot defaults proxyTargetClass to true, so CGLIB subclass proxies are
    used across AOP features (including caching), meaning classes without
    interfaces are proxied. CGLIB still cannot advise final/private methods.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-045
  difficulty: intermediate
  tags:
  - cacheevict
  - beforeinvocation
  - reason
  question: |
    When is beforeInvocation=true on @CacheEvict the RIGHT choice?
  options:
  - When you want eviction to happen strictly on success, so a thrown exception preserves the entry
  - When you want to cache the method's fresh return value first and only then evict the older entry
  - When the method may throw but you still want the (now-suspect) entry evicted regardless of outcome
  - When allEntries is false and the resolved key evaluates to null so no single entry can be targeted
  answer: 2
  explanation: |
    beforeInvocation=true evicts before the method runs, so eviction occurs even
    if the method later throws. Use it when a stale entry must go regardless of
    whether the operation succeeds.
  ref: concepts.md#cacheevict
- id: caching-abstraction-046
  difficulty: advanced
  tags:
  - cacheable
  - sync
  - semantics
  question: |
    With @Cacheable(sync = true), two threads simultaneously miss the same key.
    What happens?
  options:
  - One thread computes the value while the other(s) block and then reuse the computed result
  - Both threads compute the value independently and the last one to finish overwrites the entry
  - Both threads immediately receive null and only a later invocation triggers the real computation
  - Spring aborts one caller with a ConcurrentCacheAccessException to prevent the duplicate load
  answer: 0
  explanation: |
    sync=true makes Spring use the cache's atomic get(key, valueLoader): only one
    thread runs the loader for a given key; concurrent callers wait and then get
    the same computed value — preventing duplicate expensive work (stampede).
  ref: concepts.md#cache-stampede
- id: caching-abstraction-047
  difficulty: intermediate
  tags:
  - providers
  - autoconfig
  - order
  question: |
    In Spring Boot, how can you explicitly force the cache provider to Redis
    regardless of what else is on the classpath?
  options:
  - Annotate with @Cacheable(provider = "redis")
  - Set @EnableCaching(mode = REDIS)
  - Define a bean named 'redis'
  - Set spring.cache.type=redis
  answer: 3
  explanation: |
    spring.cache.type pins the provider (e.g. redis, caffeine, none). Without it,
    Boot auto-detects by a fixed order of candidates. There is no 'provider'
    attribute on @Cacheable nor a REDIS advice mode.
  ref: concepts.md#cache-providers
- id: caching-abstraction-048
  difficulty: advanced
  tags:
  - redis
  - serialization
  question: |
    Which is a real trade-off of using Redis as the Spring cache versus a local
    Caffeine cache?
  options:
  - Redis can only store plain strings, so cached domain objects must be flattened into delimited text
  - Redis adds network latency and requires serializing/deserializing values (default JDK serialization,
    often switched to JSON)
  - Redis provides no TTL mechanism, forcing you to expire every cache entry with a manual @CacheEvict
  - Redis caches are strictly per-JVM like Caffeine, so each application node keeps its own private copy
  answer: 1
  explanation: |
    Redis is remote, so every access crosses the network and values must be
    serialized (default JDK serialization; teams commonly switch to JSON). In
    return you get a shared, restart-surviving, horizontally scalable cache.
  ref: concepts.md#cache-providers
- id: caching-abstraction-049
  difficulty: beginner
  tags:
  - when-to-cache
  - good-fit
  question: |
    Which is the BEST fit for @Cacheable?
  options:
  - An expensive, idempotent lookup of rarely-changing reference data with a high hit ratio
  - A method that debits a bank account balance and must persist the mutation on every single call
  - A method that generates a fresh cryptographically random token that must differ on each invocation
  - A method that streams a large file to the client incrementally rather than returning a value to store
  answer: 0
  explanation: |
    Caching shines for read-mostly, idempotent, expensive computations over a
    small hot set with a high hit ratio. Non-idempotent writes, per-call random
    output, and streaming are poor or incorrect fits.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-050
  difficulty: intermediate
  tags:
  - caching
  - mixed
  question: |
    Which @Caching usage is valid for a method that should populate two caches on
    read AND evict one entry from a third cache?
  options:
  - Stacking two @Cacheable annotations plus one @CacheEvict directly on the method, with no @Caching wrapper
  - '@Caching(put = {...two...}, unless = {...}) since put covers both the read population and the eviction'
  - '@Caching with both cacheable = {...two...} and evict = {...one...} arrays'
  - '@Caching(evict = {...one...}) on the method plus a separate class-level @Cacheable for the two reads'
  answer: 2
  explanation: |
    @Caching accepts arrays for cacheable, put, and evict simultaneously, so you
    can combine two @Cacheable operations with one @CacheEvict on a single method.
    That composition is exactly what @Caching is for.
  ref: concepts.md#caching
- id: caching-abstraction-051
  difficulty: advanced
  tags:
  - self-invocation
  - aopcontext
  question: |
    To call a @Cacheable method on the current bean's PROXY from within the same
    class (so caching applies), which approach works?
  options:
  - Call the method with this.findBook(isbn), since the proxy re-intercepts any call originating in the bean
  - Wrap the internal call in a try/catch block, which forces the invocation back through the proxy handler
  - Declare the method static so the proxy resolves it through the shared class-level advice chain
  - Set @EnableCaching(exposeProxy=true) is not a thing; instead enable exposeProxy on the proxy config
    and call ((BookService) AopContext.currentProxy()).findBook(isbn)
  answer: 3
  explanation: |
    Enabling exposeProxy makes the current proxy available via
    AopContext.currentProxy(); casting and invoking through it routes the call
    through the proxy so caching advice fires. this.method() bypasses the proxy.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-052
  difficulty: beginner
  tags:
  - cacheable
  - cachenames
  question: |
    In @Cacheable("books"), what does the string "books" represent?
  options:
  - The SpEL expression that computes the key each stored entry is filed under
  - The name of the cache (region) in which entries are stored
  - The bean name of the CacheManager that should resolve this operation's cache
  - The time-to-live, in seconds, after which entries in this region expire
  answer: 1
  explanation: |
    The value/cacheNames attribute names the cache (region). Entries for this
    method are stored in the "books" cache resolved from the CacheManager. It is
    not a key, TTL, or bean name.
  ref: concepts.md#cacheable
- id: caching-abstraction-053
  difficulty: intermediate
  tags:
  - enablecaching
  - boot
  - starter
  question: |
    A developer adds spring-boot-starter-cache and Caffeine but no caching seems
    to occur. The most likely missing piece is:
  options:
  - A @Bean of type Cache for each region
  - Setting spring.cache.type=caffeine (it is mandatory)
  - '@EnableCaching on a configuration class'
  - Annotating the main class with @EnableAutoConfiguration
  answer: 2
  explanation: |
    The starter and auto-config wire the CacheManager, but annotation processing
    only activates with @EnableCaching present. Without it, @Cacheable is inert.
    spring.cache.type is optional here since Caffeine is auto-detected.
  ref: concepts.md#enablecaching
- id: caching-abstraction-054
  difficulty: advanced
  tags:
  - stampede
  - ttl
  - jitter
  question: |
    Many cache entries were created at startup with the same 10-minute TTL. Ten
    minutes later the DB is hammered. Besides sync loading, what design change
    most directly prevents this synchronized expiry?
  options:
  - Add randomized jitter to per-entry TTLs so keys don't all expire at the same instant
  - Increase the ConcurrentMap capacity
  - Switch condition to unless
  - Set allEntries=true on reads
  answer: 0
  explanation: |
    Uniform TTLs cause synchronized mass expiry and a coordinated stampede.
    Adding jitter (randomized TTL offsets) spreads expirations over time so
    reloads are staggered rather than simultaneous.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-055
  difficulty: intermediate
  tags:
  - cachemanager
  - noop
  question: |
    What is the behavior of NoOpCacheManager?
  options:
  - It throws an UnsupportedOperationException on every cache get or put, so cached methods fail fast
  - It quietly delegates each cache operation to a backing ConcurrentMapCacheManager instance it wraps
  - It stores only the first entry written to each named region and silently drops every later put
  - It accepts all cache operations but stores nothing, so every @Cacheable call re-executes the method
  answer: 3
  explanation: |
    NoOpCacheManager satisfies the API but never actually stores values (gets
    always miss). It effectively disables caching while keeping annotations
    valid — useful for tests or turning caching off (spring.cache.type=none).
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-056
  difficulty: advanced
  tags:
  - key-generation
  - collision
  question: |
    Two overloaded @Cacheable methods findBook(String isbn) and
    findBook(String isbn, boolean full) share cacheNames="books" and rely on the
    default key generator. What risk exists?
  options:
  - None — the default SimpleKeyGenerator embeds the fully-qualified method signature into every key, so the two overloads can never collide
  - Key collision — the single-arg call keys on the isbn instance and could collide with entries only
    intended for the same isbn, since the default key does not include the method or all overloads' arity
    distinctly
  - Compilation fails outright, because Spring forbids two methods in one class from sharing the same cacheNames value
  - The boolean argument is always silently ignored by SpEL, so both overloads deterministically resolve to the identical single-argument key
  answer: 1
  explanation: |
    The default SimpleKeyGenerator keys on arguments only (single arg -> the arg
    itself), not the method name. Different methods sharing a cache can collide.
    Fix by using distinct cacheNames or an explicit key including the method name.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-057
  difficulty: expert
  tags:
  - reactive
  - cacheable
  - spring61
  question: |
    In Spring Framework 6.1+, a method is declared `@Cacheable("books") public
    Mono<Book> findBook(String isbn)` and the CacheManager is a plain
    CaffeineCacheManager configured with default settings. What is the most likely
    outcome at runtime?
  options:
  - It fails / does not cache as expected because async caching of a Mono requires the CaffeineCacheManager to have setAsyncCacheMode(true); otherwise the async adaptation is not available
  - Caching silently degrades to no-op because Mono cannot be serialized by Caffeine
  - Caching works transparently because Caffeine always supports CompletableFuture-based retrieval
  - The Mono is cached as a raw reactive publisher, so every subscriber replays the same stale emission forever
  answer: 0
  explanation: |
    Spring 6.1 adapts Mono/Flux/CompletableFuture, but the backing cache must
    support CompletableFuture-based retrieval. ConcurrentMapCacheManager adapts
    automatically; CaffeineCacheManager requires setAsyncCacheMode(true). Without
    it, the async cache path is unavailable. Spring stores the emitted object (not
    the publisher), so the "raw publisher replay" option is also wrong.
  ref: concepts.md#cacheable
- id: caching-abstraction-058
  difficulty: expert
  tags:
  - reactive
  - flux
  - semantics
  question: |
    How does Spring 6.1 cache the result of a `@Cacheable` method returning
    `Flux<Book>`, and what is the key caveat?
  options:
  - The emitted items are collected into a List and that List is cached; it is coarse-grained and not suitable for streaming or back-pressure-sensitive interactions
  - The Flux itself (the publisher instance) is stored, so a second caller re-subscribes to the original upstream
  - Each emitted Book is cached under its own individually-derived key, and reactive back-pressure is preserved end-to-end from the cache down to the subscriber
  - Only the very first emitted element is cached, and every subsequent element bypasses the cache and is streamed straight from the upstream source
  answer: 0
  explanation: |
    For Flux, Spring collects the emitted elements into a List, caches the List,
    and re-emits it as a Flux on a hit (backed by a CompletableFuture for the
    list). This is deliberately coarse-grained: it materializes the whole stream
    and is unsuitable for large/infinite streams or fine-grained back-pressure.
  ref: concepts.md#cacheable
- id: caching-abstraction-059
  difficulty: advanced
  tags:
  - optional
  - unless
  - spel
  question: |
    A method is `@Cacheable(cacheNames="book", unless="#result.hardback")
    public Optional<Book> findBook(String name)`. Reads intermittently throw
    EvaluationException. What is the correct diagnosis and fix?
  options:
  - The key attribute must always be specified explicitly whenever the method's return type is an Optional, otherwise SpEL cannot resolve it
  - '#result refers to the Optional wrapper itself, so the expression must unwrap it first by calling #result.get().hardback on every read'
  - unless cannot be used with Optional return types at all under any provider, so the only correct fix is to delete the attribute entirely
  - '#result refers to the unwrapped Book (or null for an empty Optional), so calling .hardback on a null result NPEs/throws; use null-safe navigation: unless = "#result?.hardback"'
  answer: 3
  explanation: |
    Spring unwraps Optional: #result is the Book, and an empty Optional yields a
    null #result. Evaluating #result.hardback on null throws, so the idiomatic fix
    is safe navigation #result?.hardback. #result is never the Optional wrapper.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-060
  difficulty: expert
  tags:
  - cacheresolver
  - cachemanager
  - exclusivity
  question: |
    A method is annotated `@Cacheable(cacheNames="books", cacheManager="cm1",
    cacheResolver="cr1")`. What happens?
  options:
  - Both are honored at once; cr1 resolves the target caches while cm1 is retained as a fallback CacheManager if resolution fails
  - cm1 silently wins and cr1 is ignored, because the cacheManager attribute is documented as having higher precedence than cacheResolver
  - cr1 takes effect only when the resolver bean is additionally annotated @Primary; otherwise cm1 is used instead
  - It is an error: cacheManager and cacheResolver are mutually exclusive, since the CacheResolver owns cache selection and would ignore any CacheManager
  answer: 3
  explanation: |
    cacheManager and cacheResolver are mutually exclusive. A CacheResolver fully
    controls which Cache instances an operation targets, so specifying a
    CacheManager alongside it is contradictory and rejected.
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-061
  difficulty: advanced
  tags:
  - cacheconfig
  - override
  question: |
    A class is annotated `@CacheConfig(cacheNames="global", keyGenerator="genA")`.
    A method inside it is annotated `@Cacheable(key="#id")`. Which caches/key
    strategy apply to that method?
  options:
  - cacheNames="global" from @CacheConfig, but key="#id" overrides genA at the operation level
  - Nothing is cached at all, because a class-level @CacheConfig deactivates every per-method caching annotation inside that class
  - Both key="#id" and the genA keyGenerator are applied together, and Spring concatenates their outputs into one composite key
  - cacheNames resolves to empty because @Cacheable did not repeat it locally, so the context refresh fails with a missing-cache-name error
  answer: 0
  explanation: |
    @CacheConfig supplies class-level defaults (cacheNames, keyGenerator, etc.)
    that operation-level attributes override. The method inherits cacheNames=global
    but its explicit key="#id" overrides the class-level keyGenerator (and since
    key and keyGenerator are mutually exclusive, genA is not applied here).
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-062
  difficulty: intermediate
  tags:
  - cacheconfig
  question: |
    Which statement about @CacheConfig is correct?
  options:
  - It enables caching for the entire class on its own, serving as a drop-in replacement for @EnableCaching at the type level
  - It shares common cache settings (names, keyGenerator, cacheManager, cacheResolver) across a class's operations but does NOT itself enable any caching
  - It can only be placed on interfaces, never on concrete classes, so annotating a @Service class with it fails
  - It automatically turns every public method declared in the class into a @Cacheable operation by default
  answer: 1
  explanation: |
    @CacheConfig is purely a convenience for sharing defaults across a class's
    caching annotations. It does not enable caching (you still need @EnableCaching)
    and does not turn methods into cached operations by itself.
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-063
  difficulty: expert
  tags:
  - cacheerrorhandler
  - failure-modes
  question: |
    Your Redis-backed @Cacheable method occasionally throws
    RedisConnectionFailureException to callers during Redis blips. Business logic
    could tolerate running against the DB instead. What is the cleanest Spring-idiomatic
    fix?
  options:
  - Register a custom CacheErrorHandler (via CachingConfigurer) that logs and swallows GET errors so a cache failure degrades to a cache miss
  - Wrap every @Cacheable call site in try/catch and re-invoke the repository manually
  - Set spring.cache.type=none in production so Redis is never contacted
  - Switch to @CachePut, which ignores cache-store exceptions by design
  answer: 0
  explanation: |
    By default cache-store exceptions propagate (SimpleCacheErrorHandler rethrows).
    A custom CacheErrorHandler lets you handle get/put/evict/clear failures
    independently — commonly swallowing GET errors so the method runs against the
    source of truth. try/catch at every call site is brittle; disabling caching
    everywhere is overkill; @CachePut does not swallow errors.
  ref: concepts.md#cacheerrorhandler--failure-modes
- id: caching-abstraction-064
  difficulty: advanced
  tags:
  - cacheerrorhandler
  - eviction-risk
  question: |
    A team writes a CacheErrorHandler that silently swallows ALL four callbacks
    (get, put, evict, clear). Which subtle correctness risk does swallowing EVICT
    errors introduce that swallowing GET errors does not?
  options:
  - Swallowing evict errors doubles the memory each entry consumes, because the failed eviction leaves a duplicate copy of the value behind in the region
  - A failed-but-swallowed evict leaves a stale entry in the cache, so subsequent reads return outdated data even though the underlying store changed
  - Swallowing evict errors permanently disables the configured TTL on the whole cache, so no entry ever expires again afterward
  - It forces the CacheManager bean to be torn down and recreated on every subsequent cache call, adding heavy startup overhead
  answer: 1
  explanation: |
    A swallowed GET error just degrades to a miss (safe: you hit the source of
    truth). A swallowed EVICT error means invalidation silently failed, so the
    cache keeps serving stale data that no longer matches the datastore — a
    correctness hazard. Evict/put failures deserve more caution than get failures.
  ref: concepts.md#cacheerrorhandler--failure-modes
- id: caching-abstraction-065
  difficulty: expert
  tags:
  - advice-ordering
  - transaction
  question: |
    A @Transactional method also carries @CachePut. If the caching advice runs
    OUTSIDE (before) the transaction advice, what dangerous outcome is possible?
  options:
  - The value is written to the cache but the surrounding transaction later rolls back, leaving the cache holding data that was never committed to the database
  - The cache put is silently skipped, because an active transaction always suspends and blocks any cache write until the method returns
  - The transaction can never commit, because the outer cache advice acquires a lock on the entry that the transaction manager waits on forever
  - Nothing dangerous happens; the relative ordering of transaction advice and cache advice is irrelevant to correctness in every case
  answer: 0
  explanation: |
    If cache advice is outermost, the put happens around the whole call while the
    transaction (inner) may roll back afterward, so the cache retains uncommitted
    data. You generally want transaction advice outermost (cache ops inside the tx),
    or use TransactionAwareCacheManagerProxy to defer writes to commit.
  ref: concepts.md#interception-internals--advice-ordering
- id: caching-abstraction-066
  difficulty: expert
  tags:
  - transaction-aware
  - read-after-write
  question: |
    Using TransactionAwareCacheManagerProxy, inside a single transaction you call
    an @CachePut update method and then immediately call the @Cacheable read
    method for the same key (still within the same transaction). What do you observe?
  options:
  - The read sees the freshly put value, because the transaction-aware proxy applies puts eagerly and only defers evictions until commit
  - The surrounding transaction is forced to commit early by the proxy so that the just-written value becomes visible to the read
  - The read throws a CacheAccessException, because the entry stays write-locked by the proxy until the transaction commits
  - The read does NOT see the put — puts are deferred to AFTER_COMMIT, but lookups read current cache state immediately, so the read reflects the pre-update cache (or misses)
  answer: 3
  explanation: |
    The transaction-aware proxy only defers the write side (put/evict) until
    AFTER_COMMIT. A @Cacheable lookup reads current state immediately, so a
    read-after-write in the same transaction won't see the deferred put. This is a
    frequently-missed nuance of the proxy.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-067
  difficulty: advanced
  tags:
  - simplekey
  - equals
  - collision
  question: |
    A team writes a custom multi-field key class used across @Cacheable methods but
    forgets to override equals()/hashCode(). What is the most likely production symptom?
  options:
  - Every call is a guaranteed cache miss, so behavior stays fully correct and is merely a little slower than with a proper key class
  - The application fails to start, because Spring validates key classes at refresh and throws a KeyGenerationException when equals/hashCode are absent
  - Spring detects the missing overrides at runtime and transparently falls back to SimpleKeyGenerator, logging a one-time warning
  - Cache lookups almost never hit (identity-based equals means new key objects never match stored ones), so it degrades to no caching — and if any keys DO collide by identity reuse, wrong values could be returned
  answer: 3
  explanation: |
    Without equals/hashCode, key objects use identity semantics: a freshly built
    key on each call never equals the stored one, so lookups miss and caching is
    effectively disabled. The historical DefaultKeyGenerator bug (using only
    hashCode) could even return wrong values on collisions — value-based keys are
    mandatory for correctness.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-068
  difficulty: expert
  tags:
  - simplekeygenerator
  - history
  question: |
    Why was DefaultKeyGenerator deprecated in favor of SimpleKeyGenerator for
    multi-argument methods?
  options:
  - DefaultKeyGenerator always prepended the fully-qualified method name to the key, making keys so long that large-argument methods overflowed the cache's key-length limit
  - DefaultKeyGenerator combined only the arguments' hashCode() values (not equals), so distinct argument tuples that happened to share a combined hash would collide and return each other's cached values
  - DefaultKeyGenerator threw a NullPointerException whenever any method argument was null, so nullable-parameter methods could not be cached at all
  - DefaultKeyGenerator required the -parameters compiler flag to resolve argument names, whereas SimpleKeyGenerator works without any special build configuration
  answer: 1
  explanation: |
    Pre-4.0 DefaultKeyGenerator derived the key from argument hashCodes only, so
    different argument sets with a colliding combined hash mapped to the same key —
    a real correctness bug (spring-framework#14870). SimpleKeyGenerator wraps all
    args in a SimpleKey with proper equals/hashCode over the full tuple.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-069
  difficulty: advanced
  tags:
  - mutable-key
  - concurrency
  question: |
    Which practice most reliably causes an entry to become "lost" (unreachable)
    in a local cache after it was successfully stored?
  options:
  - Using an immutable String as the key, since interned String literals are garbage-collected out of the cache once no caller references them
  - Using a mutable object (or array) as the key and mutating it after the put, so its hashCode/equals shift and no future lookup can locate the entry
  - Using @CachePut instead of @Cacheable, because @CachePut overwrites the slot with a null-keyed entry that later reads cannot address
  - Setting unless = "#result == null", which retroactively removes any entry whose value later becomes null in the backing store
  answer: 1
  explanation: |
    Most local providers store the key by reference. If the key is mutable and you
    change fields that affect hashCode/equals after insertion, the entry lands in
    the wrong hash bucket relative to any future lookup key and becomes
    unreachable. Always use immutable, value-based keys.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-070
  difficulty: expert
  tags:
  - sync
  - cacheput
  - constraints
  question: |
    A developer wants stampede protection on an update method and writes
    `@CachePut(cacheNames="books", sync=true)`. What is wrong?
  options:
  - Nothing; sync provides stampede protection on @CachePut as well
  - The sync attribute is declared only on @Cacheable — @CachePut (and @CacheEvict) have no sync attribute, so this does not even compile
  - sync=true silently converts @CachePut into @Cacheable
  - sync=true is valid but requires proxyTargetClass=true to be set as well
  answer: 1
  explanation: |
    sync is an attribute of @Cacheable only; @CachePut and @CacheEvict do not
    declare it, so the code fails to compile. Conceptually sync is also
    meaningless for @CachePut, which always executes the method rather than
    coordinating concurrent misses on a lookup. (sync=true itself is further
    restricted to a single cache and is incompatible with unless.)
  ref: concepts.md#cache-stampede
- id: caching-abstraction-071
  difficulty: expert
  tags:
  - sync
  - scope
  - distributed
  question: |
    Two application nodes both run @Cacheable(sync=true) against a Caffeine cache.
    A hot key expires simultaneously on both. How many backend computations occur
    in the worst case?
  options:
  - Exactly one computation across the whole cluster, because sync=true opens a cluster-wide distributed lock that every node coordinates through
  - Zero computations, because Caffeine keeps serving the stale value on both nodes and never reloads an expired key while sync=true is set
  - Up to one per node (two total): sync serializes only within a single JVM's cache, not across nodes, unless the provider itself is distributed-lock aware
  - An unbounded number of computations, because the sync attribute is ignored entirely by Caffeine and provides no per-key coordination at all
  answer: 2
  explanation: |
    sync=true coordinates concurrent misses within one JVM via the local cache's
    atomic loader. It does not coordinate across nodes with a local provider like
    Caffeine, so each node can independently run one load — cross-node stampede
    protection needs a distributed lock or a distributed cache.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-072
  difficulty: advanced
  tags:
  - redis
  - allentries
  - performance
  question: |
    A service calls @CacheEvict(allEntries=true) on a large Redis-backed cache on
    every write. Why is this a performance concern compared to the same call on a
    Caffeine cache?
  options:
  - On Caffeine allEntries=true is a cheap in-memory Map.clear(), but on Redis it must delete all keys under the cache's prefix (historically a KEYS/pattern scan), which can be expensive/blocking on a large keyspace
  - Redis cannot support allEntries=true at all, so RedisCacheManager throws an UnsupportedOperationException the moment the method is invoked
  - Redis replicates the clear synchronously to every connected client before returning, so the write path blocks and its latency roughly doubles
  - allEntries=true on Redis silently clears only the calling node's local connection pool, leaving the shared server-side entries untouched
  answer: 0
  explanation: |
    Caffeine's clear is an O(1)-ish in-heap map operation. Redis has no single
    "clear this logical cache" primitive, so RedisCacheManager must find and delete
    all keys under the cache prefix; on large keyspaces this pattern scan is costly.
    Frequent allEntries=true against Redis is a known footgun.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-073
  difficulty: advanced
  tags:
  - caffeine
  - eviction
  - internals
  question: |
    Which statement about Caffeine's size-based eviction is accurate?
  options:
  - Caffeine uses a strict LRU policy and evicts synchronously the instant maximumSize is exceeded
  - Caffeine uses Window TinyLFU (frequency + recency) and its maximumSize eviction is amortized, so the cache may briefly exceed the configured size before catching up
  - Caffeine evicts entries at random from across the whole keyspace to reduce lock contention, deliberately ignoring both recency and access frequency
  - Caffeine performs no size-based eviction at all; it only supports time-based expiry via expireAfterWrite, so any configured maximumSize is silently ignored
  answer: 1
  explanation: |
    Caffeine's admission policy is Window TinyLFU, which considers access frequency
    as well as recency, typically beating plain LRU on hit ratio. Its maximumSize
    enforcement is amortized/eventual, so transient overshoot is normal, not a bug.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-074
  difficulty: expert
  tags:
  - caching
  - ordering
  - hit-behavior
  question: |
    A method has `@Caching(cacheable=@Cacheable("books"),
    evict=@CacheEvict(cacheNames="stats", key="#isbn"))`. On a cache HIT for the
    cacheable operation, what happens to the evict?
  options:
  - On a hit, @Cacheable short-circuits and returns the stored value without invoking the method; because the method body is skipped the behavior around the sibling evict is subtle/unreliable, which is why mixing them like this is discouraged
  - The evict is guaranteed to run first because @Caching always processes evict operations ahead of any cacheable lookup, and only then is the cached value returned to the caller
  - The evict always runs after the method body in a strictly deterministic order that @Caching documents and enforces, regardless of whether the cacheable operation produced a hit or a miss
  - The whole @Caching block is skipped on a hit because Spring treats any hit on one grouped operation as short-circuiting every sibling operation declared alongside it
  answer: 0
  explanation: |
    @Cacheable short-circuits on a hit (method body skipped). @Caching does not
    guarantee ordering among its grouped operations, and combining a short-circuiting
    cacheable with an evict in one @Caching yields subtle behavior. For anything
    order-sensitive, split into separate proxied methods.
  ref: concepts.md#caching
- id: caching-abstraction-075
  difficulty: advanced
  tags:
  - cacheput
  - key-alignment
  question: |
    A read method uses @Cacheable(cacheNames="books", key="#isbn") where isbn is a
    String. The update method uses @CachePut(cacheNames="books", key="#book").
    After an update, reads still miss. Why?
  options:
  - '@CachePut is forbidden from writing into any cache region that a @Cacheable method also reads from, so Spring routes its writes to a hidden shadow region the reader never consults'
  - The two operations produce different keys (the String isbn vs the whole Book object as a SimpleKey), so the put lands under a different slot than the read looks up
  - The key expression "#book" is rejected as invalid SpEL at context refresh and silently dropped, so @CachePut falls back to the default generator and stores nothing under the isbn
  - '@CachePut only ever updates entries that already physically exist in the region and never inserts new ones, so a first-time write after a cold start is quietly discarded'
  answer: 1
  explanation: |
    For the read-through-write pattern to work, both operations must compute the
    exact same key. Here the reader keys on the String isbn while the writer keys
    on the Book instance (wrapped as a key), so they never align and the next read
    misses. Align on key="#book.isbn".
  ref: concepts.md#cacheput
- id: caching-abstraction-076
  difficulty: expert
  tags:
  - enablecaching
  - missing-cachemanager
  question: |
    @EnableCaching is present, @Cacheable methods exist, but there is NO
    CacheManager bean and no cache provider on the classpath at all (auto-config
    cannot supply one). What is the outcome?
  options:
  - Silent no-op: the annotations are ignored like when @EnableCaching is missing
  - It lazily creates a ConcurrentMapCacheManager the first time any cached method is invoked, so the very first call is uncached but every later call is served from that auto-created in-heap region
  - It quietly falls back to a NoOpCacheManager so the context still starts, and every @Cacheable call simply re-executes the method while storing nothing at all
  - Startup fails: the caching infrastructure requires a CacheManager (or CacheResolver) bean and cannot resolve one
  answer: 3
  explanation: |
    Unlike a missing @EnableCaching (which is a silent no-op), having @EnableCaching
    with no resolvable CacheManager/CacheResolver bean fails context startup — the
    interceptor has no cache to operate on. In plain Spring Boot the simple
    ConcurrentMapCacheManager is auto-provided, but "no provider at all" breaks it.
  ref: concepts.md#interception-internals--advice-ordering
- id: caching-abstraction-077
  difficulty: expert
  tags:
  - self-invocation
  - internals
  question: |
    Which precisely explains WHY a `this.findBook()` self-call skips @Cacheable
    advice in PROXY mode?
  options:
  - Because the CacheInterceptor advice lives on the proxy object; a this-call targets the raw target instance directly, so the invocation never passes through the proxy's invocation handler where the advice fires
  - Because the JVM aggressively inlines intra-class method calls during JIT compilation and, in doing so, discards the runtime annotation metadata the CacheInterceptor would otherwise read
  - Because SpEL cannot resolve argument references or evaluate the key expression for a call that originates inside the bean, so the interceptor aborts before it can consult the cache
  - Because @Cacheable advice only fires when the caller and the callee reside in different packages, and an internal this-call keeps both on the same declaring class
  answer: 0
  explanation: |
    The advice is applied by the proxy's invocation handler (JDK) or the CGLIB
    subclass's method override. A this.method() call executes against the target
    instance's own method reference, bypassing the proxy entirely, so no
    CacheInterceptor is invoked. AspectJ weaving fixes this by advising the bytecode.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-078
  difficulty: advanced
  tags:
  - final-method
  - cglib
  question: |
    A @Service (no interface) has `@Cacheable public final Book findBook(String
    isbn)`. Spring Boot uses CGLIB proxies by default. What happens to caching?
  options:
  - It works completely normally, because the final keyword only affects class inheritance and has no bearing on how Spring generates and applies a CGLIB proxy around the bean
  - Caching works, but the final modifier forces the CGLIB proxy into a single-threaded advice path, so concurrent callers are serialized one at a time through the cache interceptor
  - The application context fails to start with a fatal BeanCreationException, because CGLIB refuses to build any proxy for a class that declares a final cached method
  - CGLIB cannot override a final method, so the proxy cannot advise it and caching is silently NOT applied (Spring may also log a warning that the method is not proxyable)
  answer: 3
  explanation: |
    CGLIB proxies subclass the target and override methods to insert advice. A
    final method cannot be overridden, so it is not advised — caching silently does
    nothing on it (Spring can log a warning). private and static methods are
    similarly non-proxyable.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-079
  difficulty: intermediate
  tags:
  - cacheresolver
  - runtime
  question: |
    When would you reach for a custom CacheResolver instead of just naming caches
    on the annotation?
  options:
  - When you want to vary the time-to-live per individual entry, since the CacheResolver is the hook Spring exposes for attaching a distinct expiry to each key it resolves
  - When you want to build the cache key by combining several argument fields, because a CacheResolver is the component responsible for computing the composite key from the method parameters
  - When you need to disable caching in a test profile, as swapping in a no-op CacheResolver is the documented way to turn off storage without editing the annotations
  - When the target cache(s) must be selected dynamically at runtime based on the method arguments or context, rather than being fixed at compile time
  answer: 3
  explanation: |
    A CacheResolver controls which Cache instances an operation uses and is
    resolved per invocation, so it can pick caches based on runtime arguments
    (e.g. tenant-specific caches). Static cacheNames cannot express that. TTL, test
    disabling, and key generation are separate concerns.
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-080
  difficulty: expert
  tags:
  - beforeinvocation
  - allentries
  - failure
  question: |
    A bulk-reload method is annotated @CacheEvict(cacheNames="catalog",
    allEntries=true, beforeInvocation=true) and the reload throws halfway through.
    What is the cache state afterward, and why might beforeInvocation=true be the
    RIGHT choice here despite the failure?
  options:
  - The cache is fully repopulated, because a before-invocation eviction is enlisted as transactional and automatically rolls back together with the failed method, restoring every prior entry
  - Only the entries that were successfully reloaded before the exception were evicted, because allEntries eviction is applied incrementally in lockstep with each reloaded key
  - Nothing was evicted at all, because a thrown exception cancels a pending before-invocation eviction just as it cancels the default after-invocation one
  - The cache was cleared before the method ran, so it is now empty; this is often acceptable because an empty cache (all misses -> reload from source) is safer than serving a half-stale catalog after a partial failure
  answer: 3
  explanation: |
    With beforeInvocation=true the clear happens before the body, so a mid-method
    exception leaves the cache empty. That can be the desired safety property: an
    empty cache falls back to the authoritative source on every read, avoiding
    serving stale/partial data that a post-invocation (default) evict would leave
    intact after a failure.
  ref: concepts.md#cacheevict
- id: caching-abstraction-081
  difficulty: advanced
  tags:
  - null
  - condition
  - lookup
  question: |
    @Cacheable(cacheNames="books", condition="#includeDetails") on
    findBook(String isbn, boolean includeDetails). A caller invokes with
    includeDetails=false. What is the caching behavior?
  options:
  - The result is cached under a composite key that encodes includeDetails=false alongside the isbn, so false-detail calls simply occupy their own separate slot in the region
  - condition is false, so there is NO cache lookup and NO store — the method just runs uncached every time for includeDetails=false calls
  - The result is still looked up in the cache but, because the condition failed, the returned value is deliberately never written back to the store
  - Spring aborts the call with an EvaluationException, because a condition expression is required to yield a comparison and cannot be a bare boolean argument
  answer: 1
  explanation: |
    For @Cacheable, condition gates both lookup and store. When false, there is no
    cache interaction at all: the method executes as if uncached. So
    includeDetails=false calls bypass the cache entirely.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-082
  difficulty: expert
  tags:
  - condition
  - unless
  - difference
  question: |
    For @Cacheable, what is a behavioral difference between using condition to
    exclude some inputs versus using unless, beyond the #result availability?
  options:
  - condition when false skips the cache LOOKUP too (so even a previously-stored value is not returned), whereas unless only vetoes STORING the result and never suppresses returning an existing cached hit
  - There is no behavioral difference between them at all beyond the availability of #result; both gate the lookup and the store identically for every input
  - unless is the pre-invocation gate evaluated before the method runs, whereas condition is the post-invocation veto evaluated after it returns, exactly reversing their usual roles
  - condition takes effect only on @CachePut operations while unless takes effect only on @Cacheable operations, so on a single @Cacheable method one of them is inert
  answer: 0
  explanation: |
    If condition is false, Spring performs no lookup, so an already-cached value is
    NOT returned for that call. unless is post-invocation and only decides whether
    to store; it can never prevent returning a value that was already cached on a
    hit. This asymmetry matters when a key sometimes qualifies and sometimes not.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-083
  difficulty: advanced
  tags:
  - composite
  - fallback
  - noop
  question: |
    CompositeCacheManager is configured with setFallbackToNoOpCache(true) and two
    delegates. A @Cacheable references cache name "reports" that none of the
    delegates know. What happens?
  options:
  - Startup fails with an IllegalArgumentException, because CompositeCacheManager validates every referenced cache name against its delegates during context refresh and rejects any it cannot resolve
  - The first delegate in the configured list is forced to lazily create a "reports" cache on demand, since fallbackToNoOpCache delegates unknown names to the primary provider rather than to a no-op
  - CompositeCacheManager spins up a brand-new ConcurrentMapCacheManager region named "reports" and registers it back onto the first delegate for all subsequent lookups
  - The fallback NoOp cache handles "reports": operations are accepted but nothing is stored, so the method is invoked every time
  answer: 3
  explanation: |
    With fallbackToNoOpCache=true, any cache name not resolved by the delegates is
    served by a no-op cache instead of throwing. That means caching for "reports"
    silently does nothing (every call runs the method) — convenient for mixed
    environments but a subtle "why isn't it caching?" trap.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-084
  difficulty: expert
  tags:
  - interception
  - order
  - flow
  question: |
    Considering the CacheInterceptor's internal flow, in what order are these
    handled for a single method carrying both @CacheEvict(beforeInvocation=true)
    and @Cacheable?
  options:
  - The Cacheable lookup is performed first and, only if it misses, the before-invocation evict fires just ahead of the method body executing
  - Both the eviction and the cacheable store are deferred until after the method returns, so the beforeInvocation flag is effectively ignored when a lookup is also present
  - The method body runs first, then the eviction is applied to the freshly computed state, and finally the cacheable lookup decides whether to store the result
  - Before-invocation evict runs first; then the Cacheable lookup — and on a hit the method is skipped, so the target never runs
  answer: 3
  explanation: |
    The interceptor runs beforeInvocation=true evictions first, then performs the
    @Cacheable lookup. On a hit it returns the stored value without proceeding to
    the target. So a before-invocation evict clears the entry, but a separate
    cacheable can still short-circuit if its key hits.
  ref: concepts.md#interception-internals--advice-ordering
- id: caching-abstraction-085
  difficulty: advanced
  tags:
  - cacheput
  - reactive
  - spring61
  question: |
    In Spring 6.1, a method `@CachePut("books") public Mono<Book> save(Book b)` is
    invoked but the returned Mono is never subscribed to. Does the cache get updated?
  options:
  - No — for reactive return types the put occurs when the produced publisher completes; if nothing subscribes, the pipeline never runs and no put happens
  - Yes, the cache is updated the instant the method returns the Mono, because Spring eagerly extracts and stores the value from the publisher before handing it back to the caller
  - Yes, but the put stores only the computed key placeholder and leaves the value slot empty until the Mono is later subscribed to and actually emits
  - It throws an IllegalStateException at invocation time, because @CachePut rejects any reactive return type such as Mono or Flux and demands a materialized value
  answer: 0
  explanation: |
    For reactive/async types the cache put/evict is tied to completion of the
    produced publisher/future. A Mono is lazy: without a subscriber the work never
    executes, so the cache is not updated. This mirrors normal reactive semantics
    and is a common surprise when adopting reactive caching.
  ref: concepts.md#cacheput
- id: caching-abstraction-086
  difficulty: expert
  tags:
  - redis
  - serialization
  - versioning
  question: |
    A Redis cache uses default JDK serialization. A new deployment changes a cached
    class by adding a field (without setting serialVersionUID). During rolling
    deploy, reads of old entries start failing. What is the root cause and a robust fix?
  options:
  - JDK serialization ties entries to the class's computed serialVersionUID; changing the class changes it, so deserializing old bytes throws InvalidClassException — switch to a versioning-tolerant serializer (e.g. JSON) and/or set an explicit serialVersionUID plus a TTL/namespace strategy
  - Redis physically corrupted the stored byte payloads during the rolling restart; the robust fix is to issue a FLUSHALL that wipes the entire database at the start of every single deployment
  - The generated @Cacheable key silently changed with the new class layout, so every old entry is simply missed rather than erroring, and no exception is ever thrown to callers
  - Redis expired all of the cached entries at exactly the same instant because the deployment reset their shared TTL, so the failures are ordinary post-expiry misses
  answer: 0
  explanation: |
    Default JDK serialization is brittle across class changes: an auto-computed
    serialVersionUID shifts and old bytes fail to deserialize (InvalidClassException).
    Teams commonly switch to JSON (GenericJackson2JsonRedisSerializer) which
    tolerates additive changes, and/or namespace cache keys per schema version and
    keep TTLs short so stale-format entries age out.
  ref: concepts.md#cache-providers
- id: caching-abstraction-087
  difficulty: advanced
  tags:
  - coherence
  - invalidation
  - design
  question: |
    A local Caffeine cache across N nodes needs writes on one node to invalidate
    the entry on all nodes. Which approach directly achieves cross-node coherence
    while keeping reads local and fast?
  options:
  - Increase the Caffeine maximumSize on every node so each cache holds more entries, which lets the nodes converge on a shared view of the data and keeps their copies coherent
  - Publish an invalidation event (e.g. via Redis pub/sub or a message bus) that each node consumes to evict the key locally — a "near cache" / broadcast-eviction pattern
  - Set expireAfterAccess to zero on every node so each entry is dropped immediately after it is read, guaranteeing that no node can ever serve another node's stale value
  - Wrap each node's Caffeine manager in a TransactionAwareCacheManagerProxy, which propagates every committed put and evict outward to the other nodes' local caches
  answer: 1
  explanation: |
    Broadcast eviction (near-cache pattern): keep the fast local read path but
    propagate invalidations over pub/sub or a message bus so every node evicts the
    stale key. Sizing, zero-TTL, and the transaction-aware proxy do not solve
    cross-node coherence.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-088
  difficulty: expert
  tags:
  - sync
  - null
  - store
  question: |
    With @Cacheable(sync=true), the loader (method) returns null on a miss. Compared
    to the default (sync=false) behavior of caching nulls, what is the key concern
    about sync + null?
  options:
  - Because sync uses the atomic get(key, valueLoader) path and cannot express unless, you lose the usual unless-based null veto; whether a null is stored depends on the provider's valueLoader/null-handling semantics, so behavior is less controllable
  - sync=true is specified to never store a null under any provider, so a null-returning loader is guaranteed to force a fresh recomputation on every subsequent call to that key
  - sync=true automatically converts a null loader result into an empty Optional before storing it, so callers always receive a present wrapper rather than a raw null
  - sync=true always raises an IllegalStateException the moment the loader returns null, because the atomic loader path is documented as strictly forbidding null values
  answer: 0
  explanation: |
    sync=true routes through the cache's atomic loader and forbids unless, so the
    familiar unless="#result==null" veto is unavailable. How a null loader result is
    treated (stored vs. not, whether the lock is held) is provider-dependent — a
    reason to be careful combining sync with methods that can return null.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-089
  difficulty: advanced
  tags:
  - keygenerator
  - global
  - configurer
  question: |
    You want ALL cache operations in the application to use a custom KeyGenerator by
    default, without annotating each method. What is the correct mechanism?
  options:
  - Annotate every single cached method with keyGenerator="myGen", since there is no application-wide default hook and the attribute must be repeated on each operation individually
  - Register the KeyGenerator bean with @Primary, and the caching interceptor will automatically pick up the primary candidate as the global default for every operation
  - Set the spring.cache.key-generator property in application.properties to the bean name, which Boot's auto-configuration applies as the context-wide default generator
  - Implement CachingConfigurer and override keyGenerator() to return the bean, establishing the global default (overridable per class via @CacheConfig or per operation)
  answer: 3
  explanation: |
    CachingConfigurer#keyGenerator() sets the application-wide default KeyGenerator
    (also where you override cacheManager/cacheResolver/errorHandler). Class-level
    @CacheConfig and operation-level attributes can still override it. There is no
    such property, and @Primary alone does not wire the caching default.
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-090
  difficulty: expert
  tags:
  - jsr107
  - annotations
  - difference
  question: |
    A codebase mixes Spring's @Cacheable with JSR-107's @CacheResult on different
    methods. Which statement is accurate about running both under Spring?
  options:
  - They are byte-for-byte identical annotations that differ only in their package names, so Spring treats @CacheResult as a straight alias of @Cacheable with no behavioral distinction whatsoever
  - Spring supports the JSR-107 (JCache) annotations (@CacheResult, @CachePut, @CacheRemove, @CacheRemoveAll) alongside its own when the JCache API and a compliant provider are present; semantics differ subtly (e.g. JCache's @CachePut uses a @CacheValue parameter, and exception caching differs)
  - The JSR-107 annotations are silently ignored under the default PROXY mode and only begin to take effect once @EnableCaching is switched to mode=ASPECTJ weaving
  - Placing both annotation families anywhere in the same application triggers a conflicting-annotation error that fails the context refresh at startup
  answer: 1
  explanation: |
    Spring can process the standard JSR-107 annotations in addition to its own,
    given the JCache API on the classpath. They are not identical: JCache's
    @CachePut marks the cached argument with @CacheValue, key generation defaults
    differ, and JCache supports caching exceptions — subtleties that bite when
    mixing the two families.
  ref: concepts.md#cache-providers
- id: caching-abstraction-091
  difficulty: advanced
  tags:
  - condition
  - argument
  - lookup-store-symmetry
  question: |
    @Cacheable(cacheNames="u", key="#id", condition="#id > 0"). Suppose id=5 is
    cached. Later a bug passes id=-5, then again id=5. Does the id=-5 call disturb
    the cached id=5 entry?
  options:
  - Yes — because #id is the key, the id=-5 call hashes into the same slot as id=5 and silently overwrites that entry with the negative-id result
  - No — condition is false for id=-5, so that call performs no lookup and no store; it cannot touch the id=5 entry, which remains intact for the later id=5 call
  - Yes — whenever a condition evaluates false Spring clears the whole 'u' cache as a safety measure, so the id=5 entry is wiped along with the rest
  - The id=-5 call is treated as a lookup for id=5 and refreshes that entry's stored value, extending its lifetime on every negative-id invocation
  answer: 1
  explanation: |
    condition=false means the id=-5 invocation bypasses the cache entirely (no
    lookup, no store, no evict). It cannot affect the separately-keyed id=5 entry,
    which is served normally on the subsequent id=5 call.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-092
  difficulty: advanced
  tags:
  - exception
  - caching
  - semantics
  question: |
    A @Cacheable method throws an exception on a miss (e.g. the DB is down). What
    does Spring store in the cache for that key?
  options:
  - It stores the thrown exception object under that key so subsequent calls fail fast by re-throwing the cached exception instead of retrying the method
  - It stores a null value under that key, so every subsequent call returns null immediately without ever re-invoking the failed method
  - It stores a special poison marker for the key that blocks further lookups until an operator manually evicts it via @CacheEvict
  - Nothing is stored — the exception propagates and no cache entry is created, so the next call will attempt the method again
  answer: 3
  explanation: |
    Spring's core caching does not cache exceptions: if the target throws, no value
    is put and the exception propagates. The next invocation retries the method.
    (JSR-107 @CacheResult, by contrast, can be configured to cache exceptions.)
  ref: concepts.md#cacheable
- id: caching-abstraction-093
  difficulty: advanced
  tags:
  - refreshafterwrite
  - expireafterwrite
  - distinction
  question: |
    In Caffeine, how do refreshAfterWrite and expireAfterWrite interact for a key
    that is read after its refresh interval but before its expire interval?
  options:
  - The read blocks the calling thread until Caffeine finishes a synchronous reload from the loader, so past the refresh interval every read pays the full recomputation latency
  - The read returns the existing (stale) value immediately and triggers an asynchronous reload; only after expireAfterWrite would a read become a hard, blocking miss
  - The entry is treated as already absent the moment the refresh interval passes, so the caller receives null until the next write repopulates the key
  - refreshAfterWrite and expireAfterWrite are mutually exclusive on one cache, so configuring both together makes Caffeine reject the builder at startup
  answer: 1
  explanation: |
    refreshAfterWrite reloads asynchronously while serving the current value, so
    reads stay fast and one reload is triggered. expireAfterWrite is the hard limit
    after which the entry is gone and a read must block/miss. Setting refresh <
    expire gives smooth background refresh with a stale-tolerance window.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-094
  difficulty: expert
  tags:
  - proxy
  - startup
  - injection
  question: |
    A bean self-injects its own proxy for caching (`@Autowired private BookService
    self;`) but the field is a concrete class and the bean has an interface with
    proxyTargetClass=false. What problem arises?
  options:
  - Nothing arises; a JDK dynamic proxy is generated as a subclass of the concrete class as well as the interface, so injecting it into the concrete-typed field resolves cleanly
  - The JDK dynamic proxy implements only the interface, not the concrete class, so injecting the proxy into a field typed as the concrete class fails (BeanNotOfRequiredType) — self-inject the interface type instead, or use CGLIB (proxyTargetClass=true)
  - Self-injecting a bean into itself always trips Spring's circular-dependency guard, so the context refresh aborts with a BeanCurrentlyInCreationException before caching is even considered
  - The proxy is injected without error, but Spring strips caching advice from any method reached through a self-injected reference, so self-calls remain uncached anyway
  answer: 1
  explanation: |
    A JDK dynamic proxy is an instance of the interface(s), not the concrete class.
    Autowiring it into a field typed as the concrete class throws a type-mismatch.
    Fix by typing the self-reference as the interface, or switch to CGLIB proxies
    so the proxy is a subclass of the concrete type. (Self-injection itself is
    allowed and resolves the proxy.)
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-095
  difficulty: advanced
  tags:
  - cacheput
  - unless
  - result
  question: |
    Which is a VALID and meaningful use of unless on @CachePut?
  options:
  - '@CachePut(cacheNames="books", unless="#result == null || #result.draft") to skip storing null or draft entities while still always executing the method'
  - The unless attribute is declared only on @Cacheable; @CachePut has no unless attribute, so adding it fails to compile against the annotation
  - '@CachePut(unless="#isbn == null") is how you skip running the method body itself whenever the isbn argument is null, short-circuiting the invocation'
  - '@CachePut(unless="true") turns the annotation into a pure read-through @Cacheable that skips execution whenever the key is already present'
  answer: 0
  explanation: |
    @CachePut always executes the method but supports unless (with #result) to veto
    STORING the returned value. So skipping storage for null/draft results is valid.
    unless cannot prevent method execution (that is condition's before-invocation
    role) and cannot turn @CachePut into @Cacheable.
  ref: concepts.md#cacheput
- id: caching-abstraction-096
  difficulty: expert
  tags:
  - autoconfig
  - order
  - customizer
  question: |
    Spring Boot's cache auto-configuration finds both Caffeine and Redis on the
    classpath and spring.cache.type is unset. Which provider is chosen, and how do
    you override just the RedisCacheConfiguration without abandoning auto-config?
  options:
  - Redis is selected ahead of Caffeine in the detection order; to tune it while keeping auto-config, expose a RedisCacheConfiguration bean (or a RedisCacheManagerBuilderCustomizer) rather than replacing the CacheManager
  - Caffeine is chosen because Boot always prefers the local in-JVM provider over a remote one; to tune Redis you must instead replace the whole CacheManager with your own full @Bean definition
  - Both providers are wired at once behind an implicit CompositeCacheManager, and you override Redis by adjusting that composite's delegate ordering in configuration
  - The application refuses to start with a NoUniqueBeanDefinitionException because two cache providers on the classpath are treated as an ambiguous, unresolvable configuration
  answer: 0
  explanation: |
    Boot's detection order considers Redis before Caffeine, so Redis is chosen when
    both are present and the type is unset. To customize without replacing
    auto-config, contribute a RedisCacheConfiguration bean or a
    RedisCacheManagerBuilderCustomizer; defining your own CacheManager bean backs
    off the auto-configuration entirely.
  ref: concepts.md#cache-providers
- id: caching-abstraction-097
  difficulty: intermediate
  tags:
  - cacheresolver
  - cacheconfig
  - precedence
  question: |
    Which list correctly orders caching configuration precedence from LOWEST to
    HIGHEST?
  options:
  - Operation-level attributes -> @CacheConfig -> global CachingConfigurer
  - Global CachingConfigurer defaults -> class-level @CacheConfig -> operation-level attributes
  - '@CacheConfig -> operation-level attributes -> global defaults'
  - They all have equal precedence; the last one wins arbitrarily
  answer: 1
  explanation: |
    The override hierarchy is: global defaults (CachingConfigurer) are the base,
    class-level @CacheConfig overrides those, and operation-level attributes on the
    specific annotation have the highest precedence.
  ref: concepts.md#cacheresolver-cacheconfig-and-multiple-cachemanagers
- id: caching-abstraction-098
  difficulty: expert
  tags:
  - stampede
  - sync
  - vs-refresh
  question: |
    Contrast @Cacheable(sync=true) with Caffeine's refreshAfterWrite as stampede
    mitigations. Which statement is the most accurate?
  options:
  - sync=true blocks concurrent callers on a cold/expired key until one thread computes (callers wait, no stale value served), whereas refreshAfterWrite serves the existing stale value and reloads asynchronously (callers do not wait) — different latency/staleness trade-offs
  - They are functionally interchangeable: both serve the existing stale value during reload and both coordinate concurrent misses, so the choice between them is purely a matter of naming preference
  - refreshAfterWrite is only activated when @Cacheable(sync=true) is also set, because Spring drives Caffeine's background reload exclusively through the sync loader path
  - sync=true serves the stale value immediately while reloading in the background, whereas refreshAfterWrite blocks every reader on a cold or expired key until one thread finishes computing
  answer: 0
  explanation: |
    sync=true coordinates the FIRST load: on a cold/expired key concurrent callers
    block until one computes (no stale value, but they wait). refreshAfterWrite
    trades freshness for latency: it returns the stale value immediately and
    reloads in the background. They address stampede differently and can even be
    combined thoughtfully.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-099
  difficulty: advanced
  tags:
  - condition
  - keygenerator
  - evaluation
  question: |
    For @Cacheable with both condition and a custom keyGenerator, in what order are
    the key and the condition computed relative to the method invocation on a miss?
  options:
  - The method body always runs first to produce a result, and only afterward is condition checked and then the key computed from the returned value
  - Both condition and the key are evaluated after the method returns, and only the unless veto is evaluated before invocation as the true pre-invocation gate
  - The key is generated after the method returns so that the custom keyGenerator can incorporate #result into the key it produces for the lookup and store
  - condition is evaluated before invocation; if true, the key is generated and the cache is probed; on a miss the method runs and the (possibly unless-vetoed) result is stored under that key
  answer: 3
  explanation: |
    condition is the pre-invocation gate. If it passes, the key is computed (before
    the body, so no #result) and used for the lookup; a miss runs the method, then
    unless decides whether to store the result under that already-computed key.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-100
  difficulty: expert
  tags:
  - self-invocation
  - aspectj
  - tradeoff
  question: |
    Switching @EnableCaching(mode=ASPECTJ) fixes self-invocation, but what is a
    real trade-off/requirement compared to the default PROXY mode?
  options:
  - AspectJ mode is only supported when the backing provider is Redis, because the weaver embeds Redis-specific coordination hooks into the advised bytecode
  - It requires setting up the AspectJ weaver (compile-time or load-time weaving), adding build/agent complexity; it also advises ALL matching calls including internal ones, which can surprise code that relied on internal calls being uncached
  - AspectJ mode drops support for the condition and unless attributes, since the woven aspect cannot build a SpEL evaluation context the way the runtime proxy does
  - AspectJ mode forces every cache operation to run synchronously, behaving as if sync=true were applied to all @Cacheable methods across the context
  answer: 1
  explanation: |
    ASPECTJ mode weaves the aspect into bytecode (compile-time or load-time weaving
    via the AspectJ weaver/agent), which adds build/runtime setup. Because it no
    longer relies on a proxy boundary, even internal this-calls get advised — a
    behavior change that can surprise code assuming internal calls skip caching.
  ref: concepts.md#proxy-self-invocation-caveat
