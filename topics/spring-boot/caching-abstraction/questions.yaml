topic: Caching Abstraction
domain: spring-boot
topic_slug: caching-abstraction
version: 1
questions:
- id: caching-abstraction-001
  difficulty: beginner
  tags:
  - enablecaching
  - fundamentals
  question: |
    What happens if you annotate methods with @Cacheable but never add
    @EnableCaching to any configuration class (and no auto-config enables it)?
  options:
  - The annotations are silently ignored and the methods run normally with no caching
  - The application fails to start with a BeanCreationException
  - Caching works but only for the first method call
  - Spring throws a CacheConfigurationException at the first cached call
  answer: 0
  explanation: |
    Caching is opt-in. Without @EnableCaching (or Boot auto-config enabling it),
    the caching AOP infrastructure is not registered, so the annotations are
    inert — the methods execute normally every time. No error is thrown.
  ref: concepts.md#enablecaching
- id: caching-abstraction-002
  difficulty: beginner
  tags:
  - cacheable
  - fundamentals
  question: |
    On a cache HIT, what does @Cacheable do?
  options:
  - Runs the method and then compares the result to the cached value
  - Runs the method but discards its result in favor of the cached value
  - Returns the cached value and skips the method body entirely
  - Refreshes the cached value by re-running the method asynchronously
  answer: 2
  explanation: |
    On a hit, @Cacheable returns the stored value without invoking the method
    body at all. That is precisely why methods with side effects are poor
    candidates — the side effects won't happen on a hit.
  ref: concepts.md#cacheable
- id: caching-abstraction-003
  difficulty: beginner
  tags:
  - cacheput
  question: |
    How does @CachePut differ from @Cacheable?
  options:
  - '@CachePut caches the result only when a transaction commits'
  - '@CachePut only stores the result if the key is absent'
  - '@CachePut removes the entry from the cache after execution'
  - '@CachePut always executes the method and stores/updates the result; it never skips execution'
  answer: 3
  explanation: |
    @CachePut always runs the method and puts (updates) the return value into
    the cache. Unlike @Cacheable it never short-circuits on a hit, so it is used
    to keep the cache fresh after an update/write.
  ref: concepts.md#cacheput
- id: caching-abstraction-004
  difficulty: beginner
  tags:
  - cacheevict
  question: |
    Which annotation removes entries from a cache, typically used on delete or
    update methods to invalidate stale data?
  options:
  - '@Cacheable'
  - '@CacheEvict'
  - '@CachePut'
  - '@CacheRemove'
  answer: 1
  explanation: |
    @CacheEvict removes one entry (by key) or all entries (allEntries=true).
    @CacheRemove is the JSR-107 (JCache) annotation, not the core Spring one.
  ref: concepts.md#cacheevict
- id: caching-abstraction-005
  difficulty: intermediate
  tags:
  - cacheevict
  - beforeinvocation
  question: |
    A @CacheEvict method throws an exception before returning. With the default
    settings, what happens to the cache entry?
  options:
  - It is evicted anyway because eviction happens before invocation by default
  - It is evicted and then automatically restored on rollback
  - It is NOT evicted, because the default beforeInvocation=false evicts only after successful return
  - The whole cache is cleared as a safety measure
  answer: 2
  explanation: |
    By default beforeInvocation=false, so eviction runs only after the method
    returns normally. If the method throws, no eviction occurs. Set
    beforeInvocation=true to evict before the method runs regardless of outcome.
  ref: concepts.md#cacheevict
- id: caching-abstraction-006
  difficulty: intermediate
  tags:
  - cacheevict
  - allentries
  question: |
    What does @CacheEvict(cacheNames = "books", allEntries = true) do?
  options:
  - Clears every entry in the 'books' cache, ignoring the key attribute
  - Evicts only the entry whose key equals the string 'true'
  - Evicts entries older than the configured TTL
  - Marks the cache read-only so no new entries are added
  answer: 0
  explanation: |
    allEntries=true clears the entire named cache and ignores the key
    expression. It is used for bulk changes where invalidating individual keys
    would be impractical.
  ref: concepts.md#cacheevict
- id: caching-abstraction-007
  difficulty: intermediate
  tags:
  - caching
  - composition
  question: |
    You need a single method to perform two @CacheEvict operations against two
    different caches with two different keys. Which annotation lets you express
    this?
  options:
  - '@CacheEvict with allEntries=true'
  - '@Cacheable with multiple cacheNames'
  - Two separate @CacheEvict annotations stacked directly on the method
  - '@Caching, grouping the multiple evict operations'
  answer: 3
  explanation: |
    @Caching aggregates multiple caching annotations (cacheable/put/evict) on one
    method. It exists precisely because you otherwise cannot place two @CacheEvict
    annotations with distinct keys on the same method.
  ref: concepts.md#caching
- id: caching-abstraction-008
  difficulty: beginner
  tags:
  - key-generation
  - default
  question: |
    With the default SimpleKeyGenerator, what is the cache key for a @Cacheable
    method that takes exactly one argument?
  options:
  - A SimpleKey wrapping the argument
  - The argument instance itself
  - SimpleKey.EMPTY
  - The method name concatenated with the argument's hashCode
  answer: 1
  explanation: |
    SimpleKeyGenerator uses: no params -> SimpleKey.EMPTY, one param -> that
    param instance, multiple params -> a SimpleKey wrapping all of them.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-009
  difficulty: beginner
  tags:
  - key-generation
  - default
  question: |
    With the default SimpleKeyGenerator, what key is generated for a @Cacheable
    method that takes NO arguments?
  options:
  - SimpleKey.EMPTY
  - The method name
  - 'null'
  - A random UUID per invocation
  answer: 0
  explanation: |
    For a no-arg method, SimpleKeyGenerator returns the singleton
    SimpleKey.EMPTY, so all invocations share one entry. A per-invocation random
    key would defeat caching entirely.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-010
  difficulty: intermediate
  tags:
  - spel
  - key
  question: |
    Which SpEL expression correctly keys a cache on the isbn field of a Book
    argument named 'book'?
  options:
  - key = "book.isbn"
  - key = "@book.isbn"
  - key = "#book.isbn"
  - key = "${book.isbn}"
  answer: 2
  explanation: |
    Method arguments are referenced with the # prefix in caching SpEL, so
    #book.isbn navigates the isbn property of the 'book' argument. ${...} is
    property-placeholder syntax and @ references beans, neither applies here.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-011
  difficulty: advanced
  tags:
  - spel
  - result
  question: |
    Why can't you reference #result in the key attribute of a @Cacheable method?
  options:
  - 'Because #result is reserved for @CacheEvict only'
  - 'Because #result is only valid inside condition, never key'
  - Because SpEL cannot evaluate method return values
  - Because the key must be computed before the method runs (to check for a hit), and the result doesn't
    exist yet
  answer: 3
  explanation: |
    For @Cacheable, the key is needed BEFORE invocation to look for an existing
    entry. Since the method hasn't run, #result is unavailable. #result is
    available in unless, @CachePut, and @CacheEvict(beforeInvocation=false).
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-012
  difficulty: intermediate
  tags:
  - condition
  - unless
  - timing
  question: |
    What is the fundamental difference between 'condition' and 'unless' in
    @Cacheable?
  options:
  - 'condition can use #result; unless cannot'
  - 'condition is evaluated before invocation (no #result); unless is evaluated after invocation (can
    use #result)'
  - condition applies to @CachePut only; unless applies to @Cacheable only
  - They are aliases and behave identically
  answer: 1
  explanation: |
    condition is a pre-invocation gate (no #result yet). unless is a
    post-invocation veto that can inspect #result to decide whether to store it.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-013
  difficulty: intermediate
  tags:
  - unless
  - null
  question: |
    By default, if a @Cacheable method returns null, what happens? And how do
    you prevent caching nulls?
  options:
  - null is never cached; nothing extra is needed
  - The call throws NullPointerException; wrap in Optional
  - null IS cached by default; use unless = "#result == null" to avoid it
  - null is cached only if the key is non-null; no way to change it
  answer: 2
  explanation: |
    By default Spring caches null return values (so a miss returning null won't
    be recomputed). To skip storing nulls, use unless = "#result == null" or a
    provider-level null policy.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-014
  difficulty: beginner
  tags:
  - cachemanager
  - abstraction
  question: |
    What is the role of CacheManager in Spring's caching abstraction?
  options:
  - It is the SPI that acts as a factory/registry of named Cache instances, letting you swap providers
  - It stores the cached values directly in a ConcurrentHashMap
  - It evicts entries based on TTL automatically
  - It generates SpEL keys for cache lookups
  answer: 0
  explanation: |
    CacheManager is the central abstraction: getCache(name) returns a Cache, and
    getCacheNames() lists them. Business code depends only on this SPI, so the
    concrete provider (Caffeine, Redis, etc.) can be swapped freely.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-015
  difficulty: beginner
  tags:
  - providers
  - simple
  question: |
    Which CacheManager does Spring Boot fall back to when no other cache
    provider is configured on the classpath?
  options:
  - RedisCacheManager
  - CaffeineCacheManager
  - NoOpCacheManager
  - ConcurrentMapCacheManager (the 'simple' in-heap cache)
  answer: 3
  explanation: |
    With nothing else configured, Boot uses the 'simple' provider backed by
    ConcurrentMapCacheManager (in-heap ConcurrentHashMap). NoOpCacheManager only
    applies when caching is explicitly disabled (spring.cache.type=none).
  ref: concepts.md#cache-providers
- id: caching-abstraction-016
  difficulty: intermediate
  tags:
  - providers
  - concurrentmap
  - hazard
  question: |
    Why is the default ConcurrentMap/simple cache dangerous for a large or
    continuously growing key space?
  options:
  - It serializes every value to disk, slowing writes
  - It has no TTL, size limit, or eviction, so it grows unbounded and can cause an OutOfMemoryError
  - It cannot store more than 1000 entries
  - It clears itself on every write, so hit rates are near zero
  answer: 1
  explanation: |
    ConcurrentMapCacheManager is an unbounded in-heap map with no eviction or
    TTL. Entries live until explicitly evicted, so an ever-growing key space is a
    memory leak that can OOM the JVM. Use Caffeine/Redis with limits instead.
  ref: concepts.md#cache-providers
- id: caching-abstraction-017
  difficulty: intermediate
  tags:
  - providers
  - caffeine
  question: |
    Which statement best characterizes Caffeine as a Spring cache provider?
  options:
  - A high-performance in-JVM cache (Guava successor) supporting max size, TTL, and stats, but not distributed
  - A distributed cache shared across all application instances
  - A JDBC-backed cache that persists to a relational database
  - A remote cache requiring a separate server process
  answer: 0
  explanation: |
    Caffeine is a fast local (in-JVM) cache with maximumSize, expireAfterWrite/
    Access, reference-based eviction, and statistics. Being local, each node has
    its own copy — it is not distributed.
  ref: concepts.md#cache-providers
- id: caching-abstraction-018
  difficulty: intermediate
  tags:
  - providers
  - redis
  - distributed
  question: |
    In a horizontally scaled deployment where every instance must see the same
    cached data and cached entries should survive restarts, which provider fits
    best?
  options:
  - ConcurrentMapCacheManager
  - Caffeine
  - Redis (a distributed/remote cache)
  - NoOpCacheManager
  answer: 2
  explanation: |
    Redis is a distributed, out-of-process cache shared by all instances and
    surviving app restarts, at the cost of network latency and serialization.
    Local caches (ConcurrentMap, Caffeine) give each node its own separate copy.
  ref: concepts.md#cache-providers
- id: caching-abstraction-019
  difficulty: advanced
  tags:
  - cachemanager
  - transaction
  question: |
    What does TransactionAwareCacheManagerProxy provide?
  options:
  - It rolls back the database if a cache put fails
  - It disables caching inside transactional methods
  - It makes the cache participate in two-phase commit with the database
  - It defers cache put/evict operations until the surrounding transaction commits, so a rollback doesn't
    leave stale data cached
  answer: 3
  explanation: |
    TransactionAwareCacheManagerProxy synchronizes cache writes with the
    transaction: puts/evicts are held until commit. If the transaction rolls
    back, the cache is never mutated with data that was never persisted.
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-020
  difficulty: intermediate
  tags:
  - eviction
  - ttl
  - abstraction
  question: |
    Where do TTL, maximum size, and eviction policy (LRU/LFU) come from in
    Spring's caching abstraction?
  options:
  - From attributes on the @Cacheable annotation
  - From the underlying provider's configuration — the abstraction itself has no TTL/size/eviction notion
  - From @EnableCaching configuration attributes
  - From the SpEL 'unless' expression
  answer: 1
  explanation: |
    Spring's abstraction has no TTL/size/eviction concept. Those are configured
    on the provider (Caffeine spec, Redis entryTtl, ehcache.xml). The abstraction
    only offers explicit, event-driven @CacheEvict.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-021
  difficulty: advanced
  tags:
  - caffeine
  - ttl
  question: |
    In Caffeine, what is the difference between expireAfterWrite and
    expireAfterAccess?
  options:
  - They are identical; both count from creation
  - expireAfterWrite counts from the last read; expireAfterAccess counts from creation
  - expireAfterWrite counts from entry creation/update; expireAfterAccess counts from the last read or
    write
  - expireAfterWrite applies to reads; expireAfterAccess applies to writes
  answer: 2
  explanation: |
    expireAfterWrite expires an entry a fixed duration after it was created or
    last written, regardless of reads. expireAfterAccess resets the timer on
    every access (read or write), so frequently-read entries stay longer.
  ref: concepts.md#cache-eviction--ttl
- id: caching-abstraction-022
  difficulty: advanced
  tags:
  - self-invocation
  - proxy
  - trap
  question: |
    Given this bean, how many times does the DB-backed findBook run when an
    external caller invokes findAndFormat("123") five times in a row?

      @Service
      public class BookService {
          @Cacheable("books")
          public Book findBook(String isbn) { return repo.load(isbn); }
          public Book findAndFormat(String isbn) {
              return format(findBook(isbn));   // called via this
          }
      }
  options:
  - Five times — the internal call to findBook goes through 'this', bypassing the proxy, so caching is
    never applied
  - Once — the result is cached after the first call
  - Zero — the proxy caches findAndFormat instead
  - Twice — the proxy caches after the second call
  answer: 0
  explanation: |
    In default PROXY mode, caching advice runs only for calls through the proxy.
    findAndFormat calls findBook via 'this', bypassing the proxy, so @Cacheable
    never fires — findBook runs all five times. Same trap as @Transactional/@Async.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-023
  difficulty: advanced
  tags:
  - self-invocation
  - fixes
  question: |
    Which of these does NOT fix the caching self-invocation problem?
  options:
  - Move the @Cacheable method into a separate Spring bean and call it through the injected reference
  - Self-inject the bean's own proxy and call the method via that reference
  - Switch to AspectJ weaving mode (mode = AdviceMode.ASPECTJ)
  - Mark the internal method private so the proxy can intercept it
  answer: 3
  explanation: |
    Making the method private makes things worse — proxies cannot advise private
    methods at all. Valid fixes: separate bean, self-injection of the proxy,
    AopContext.currentProxy(), or AspectJ weaving (which advises this-calls too).
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-024
  difficulty: advanced
  tags:
  - proxy
  - jdk
  - cglib
  question: |
    With mode=PROXY and proxyTargetClass=false, a @Cacheable bean that implements
    an interface will be proxied how, and what is a consequence?
  options:
  - With a CGLIB subclass proxy; final methods can be advised
  - With a JDK dynamic proxy; only interface-declared methods are advised
  - With no proxy; annotations are woven at compile time
  - With a JDK proxy; private methods are advised too
  answer: 1
  explanation: |
    When the bean implements an interface and proxyTargetClass=false, Spring uses
    a JDK dynamic proxy, which can only advise methods declared on the interface.
    CGLIB (proxyTargetClass=true, Boot's default) subclasses the class but still
    cannot override final/private methods.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-025
  difficulty: intermediate
  tags:
  - stampede
  - sync
  question: |
    What is a cache stampede (thundering herd), and which built-in Spring feature
    mitigates it?
  options:
  - Many concurrent requests missing the same key at once and all recomputing; mitigated by @Cacheable(sync
    = true)
  - Too many caches configured; fixed by CompositeCacheManager
  - Cache corruption under concurrent writes; fixed by @CachePut
  - The cache exceeding its memory limit; fixed by allEntries=true
  answer: 0
  explanation: |
    A stampede is many threads missing the same (expired/cold) key simultaneously
    and all triggering the expensive load. @Cacheable(sync=true) serializes
    concurrent misses for one key so only one thread computes; others wait.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-026
  difficulty: advanced
  tags:
  - stampede
  - sync
  - limitations
  question: |
    Which is a genuine limitation of @Cacheable(sync = true)?
  options:
  - It forces every call to bypass the cache
  - It disables the key attribute entirely
  - It cannot be combined with unless and is restricted to a single cache; not all providers support it
  - It only works with Redis
  answer: 2
  explanation: |
    sync=true is restricted to a single cache, is incompatible with unless (and
    certain other attributes), and is only supported by some providers. It also
    coordinates only within one JVM unless the provider is distributed-lock aware.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-027
  difficulty: advanced
  tags:
  - stampede
  - caffeine
  - refresh
  question: |
    Which Caffeine feature serves a stale value while asynchronously reloading a
    key, avoiding a hard cache miss under load?
  options:
  - expireAfterWrite
  - maximumSize
  - weakKeys
  - refreshAfterWrite
  answer: 3
  explanation: |
    refreshAfterWrite triggers an asynchronous reload after the interval while
    still returning the existing (stale) value to callers, smoothing out reloads
    and avoiding a synchronous miss storm.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-028
  difficulty: intermediate
  tags:
  - when-to-cache
  - hurts
  question: |
    Which scenario is the WORST fit for @Cacheable?
  options:
  - An expensive, rarely-changing reference-data lookup
  - A write-heavy method whose data changes on almost every request
  - A pure computation over a small hot set of keys
  - A slow remote call whose results are valid for minutes
  answer: 1
  explanation: |
    Caching helps read-mostly, expensive, idempotent operations. Write-heavy,
    rapidly-changing data yields constant invalidation, low hit rates, and stale
    reads — caching hurts more than it helps.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-029
  difficulty: intermediate
  tags:
  - when-to-cache
  - side-effects
  question: |
    Why are methods with side effects poor candidates for @Cacheable?
  options:
  - Because SpEL cannot evaluate their keys
  - Because side-effecting methods always return null
  - Because on a cache hit the method body is skipped, so the side effects don't happen
  - Because the cache serializes side effects to disk
  answer: 2
  explanation: |
    @Cacheable short-circuits execution on a hit, returning only the stored
    value. Any side effects (logging, counters, sending messages) inside the
    method won't run on hits, breaking the intended behavior.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-030
  difficulty: beginner
  tags:
  - enablecaching
  - config
  question: |
    Where must @EnableCaching be placed?
  options:
  - On a @Configuration class (or a class that Spring processes as configuration)
  - On every @Cacheable method
  - On the CacheManager bean definition
  - In application.properties as a boolean flag
  answer: 0
  explanation: |
    @EnableCaching is a class-level annotation for a configuration class. It
    imports the caching AOP infrastructure that then processes the method-level
    caching annotations across the context.
  ref: concepts.md#enablecaching
- id: caching-abstraction-031
  difficulty: advanced
  tags:
  - enablecaching
  - aspectj
  question: |
    Setting @EnableCaching(mode = AdviceMode.ASPECTJ) has what notable effect
    relative to the default PROXY mode?
  options:
  - It disables all caching
  - It makes @Cacheable synchronous by default
  - It forces the use of Redis
  - It weaves the caching aspect into the bytecode, so even self-invocation (this-calls) and private/final
    methods can be advised
  answer: 3
  explanation: |
    ASPECTJ mode uses compile/load-time weaving rather than a runtime proxy, so
    caching applies to internal this-calls as well — defeating the self-invocation
    limitation. It requires the AspectJ weaver to be set up.
  ref: concepts.md#enablecaching
- id: caching-abstraction-032
  difficulty: intermediate
  tags:
  - cacheable
  - cacheput
  - conflict
  question: |
    Why should you avoid placing both @Cacheable and @CachePut on the same
    method?
  options:
  - They compile to the same bytecode and cause a duplicate-annotation error
  - Their semantics conflict — @Cacheable skips execution on a hit while @CachePut forces execution —
    leading to unpredictable behavior
  - '@CachePut silently disables @Cacheable, wasting an annotation'
  - It doubles the memory used per entry
  answer: 1
  explanation: |
    @Cacheable wants to skip the method on a hit; @CachePut wants to always run
    it. Combined on one method the behaviors contradict each other, so Spring's
    docs advise against it. Use one or the other per method.
  ref: concepts.md#cacheput
- id: caching-abstraction-033
  difficulty: intermediate
  tags:
  - cacheput
  - pattern
  question: |
    A common consistency pattern uses @Cacheable on the read method and, on the
    update method, an annotation with the SAME key expression so subsequent reads
    see fresh data without a miss. Which annotation belongs on the update method?
  options:
  - '@CachePut with the matching key'
  - '@CacheEvict(beforeInvocation=true)'
  - '@Cacheable'
  - '@Caching(cacheable=...)'
  answer: 0
  explanation: |
    @CachePut runs the update and writes the fresh value under the same key the
    read uses, so the very next @Cacheable read hits the refreshed entry. An
    evict would also work but forces the next read to miss and recompute.
  ref: concepts.md#cacheput
- id: caching-abstraction-034
  difficulty: intermediate
  tags:
  - key-generation
  - keygenerator
  question: |
    You want a reusable custom key strategy across many methods instead of
    repeating SpEL. What do you do, and what constraint applies?
  options:
  - Set both key and keyGenerator; Spring merges them
  - Override hashCode on every argument type; keyGenerator is not supported
  - Provide a KeyGenerator bean and reference it via keyGenerator = "myGen"; note that key and keyGenerator
    are mutually exclusive
  - Use @Caching to nest key generators
  answer: 2
  explanation: |
    Implement a KeyGenerator bean and reference it with keyGenerator="beanName".
    You cannot use key and keyGenerator on the same operation — they are mutually
    exclusive because both define how the key is produced.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-035
  difficulty: advanced
  tags:
  - spel
  - root
  - metadata
  question: |
    Which SpEL reference gives the name of the invoked method inside a cache key
    expression?
  options:
  - '#method.name'
  - '#target.name'
  - '#this.method'
  - '#root.methodName'
  answer: 3
  explanation: |
    The caching evaluation context exposes #root.methodName (and #root.method,
    #root.target, #root.targetClass, #root.args, #root.caches). So
    key = "#root.methodName + '_' + #isbn" produces a method-qualified key.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-036
  difficulty: advanced
  tags:
  - spel
  - parameter-names
  question: |
    Referencing an argument by name like #isbn in a cache key requires what, and
    what is the fallback if it's unavailable?
  options:
  - 'Nothing special; names are always retained. Fallback is #name.'
  - 'The -parameters compiler flag (default in Boot''s build plugins); otherwise use positional #p0/#a0'
  - A @Param annotation on the argument; fallback is @Value
  - Reflection to be enabled at runtime; fallback is toString()
  answer: 1
  explanation: |
    Parameter-name resolution needs debug info or the -parameters javac flag
    (Spring Boot's Maven/Gradle plugins enable it). Without it, use positional
    references #p0/#a0 (or #p<index>) to reach arguments.
  ref: concepts.md#key-generation--spel-keys
- id: caching-abstraction-037
  difficulty: intermediate
  tags:
  - condition
  - timing
  question: |
    A @Cacheable method has condition = "#id > 10". What is true?
  options:
  - 'The condition is evaluated after the method, using #result'
  - The condition only affects eviction, not lookup
  - The condition is evaluated before the method; if false, no lookup or store happens and the method
    just runs normally
  - The condition caches only even-numbered ids
  answer: 2
  explanation: |
    condition is a pre-invocation gate. If it evaluates false, caching is skipped
    entirely (no lookup, no store) and the method executes as if uncached.
    #result is not available in condition.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-038
  difficulty: intermediate
  tags:
  - unless
  - result
  question: |
    Which is a correct use of 'unless' to avoid caching out-of-print books?
  options:
  - 'unless = "#result == null || #result.outOfPrint"'
  - unless = "#isbn == null"
  - condition = "#result.outOfPrint"
  - key = "#result.outOfPrint"
  answer: 0
  explanation: |
    unless is evaluated after the method and can inspect #result. Vetoing when
    the result is null or out of print prevents storing those entries. condition
    and @Cacheable's key cannot see #result.
  ref: concepts.md#condition-and-unless
- id: caching-abstraction-039
  difficulty: beginner
  tags:
  - providers
  - disable
  - tests
  question: |
    How do you disable caching (use a no-op cache) in a test profile via Spring
    Boot properties?
  options:
  - spring.cache.enabled=false
  - Remove @EnableCaching at runtime
  - spring.cache.provider=noop
  - spring.cache.type=none
  answer: 3
  explanation: |
    spring.cache.type=none wires a NoOpCacheManager, so caching annotations run
    but store nothing — every call executes the method. Handy for isolating tests
    from cache behavior.
  ref: concepts.md#cache-providers
- id: caching-abstraction-040
  difficulty: intermediate
  tags:
  - providers
  - jcache
  - ehcache
  question: |
    Ehcache 3 is integrated with Spring caching through which mechanism?
  options:
  - The legacy EhCacheCacheManager for Ehcache 2.x
  - The JSR-107 (JCache) API via JCacheCacheManager
  - RedisCacheManager
  - A custom ConcurrentMap adapter
  answer: 1
  explanation: |
    Ehcache 3 is a JSR-107 (JCache) provider, so it plugs in via
    JCacheCacheManager. EhCacheCacheManager is only for the older Ehcache 2.x
    API.
  ref: concepts.md#cache-providers
- id: caching-abstraction-041
  difficulty: advanced
  tags:
  - providers
  - coherence
  question: |
    A team uses a local Caffeine cache on 4 nodes. After an update on node A, node
    B keeps returning stale data. What is the root cause?
  options:
  - Local caches keep a separate copy per JVM, so an evict/put on node A does not affect node B's cache
    — a coherence problem
  - Caffeine has a bug in expireAfterWrite
  - The CacheManager was not annotated with @EnableCaching
  - unless was set to true, disabling storage
  answer: 0
  explanation: |
    Local (in-JVM) caches are per-node. A @CacheEvict/@CachePut on node A only
    touches node A's map; node B is unaffected and stays stale. Solutions: a
    distributed cache (Redis/Hazelcast) or a cross-node eviction/broadcast.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-042
  difficulty: beginner
  tags:
  - cacheable
  - return-type
  question: |
    Which annotation is allowed on a void method?
  options:
  - '@Cacheable'
  - '@CachePut'
  - '@CacheEvict'
  - None — caching requires a return value
  answer: 2
  explanation: |
    @CacheEvict just removes entries and needs no return value, so it works on
    void methods (e.g. delete/clear operations). @Cacheable and @CachePut cache
    the return value, so a void return makes no sense for them.
  ref: concepts.md#cacheevict
- id: caching-abstraction-043
  difficulty: intermediate
  tags:
  - cachemanager
  - composite
  question: |
    What does CompositeCacheManager do?
  options:
  - Merges multiple caches into a single distributed cache
  - Composes SpEL keys from multiple generators
  - Automatically replicates entries between Redis and Caffeine
  - Delegates cache lookups to an ordered list of CacheManagers, returning the first that has the named
    cache
  answer: 3
  explanation: |
    CompositeCacheManager iterates a list of delegate CacheManagers to resolve a
    cache by name, letting you combine providers (e.g. a primary plus a fallback,
    optionally with a NoOpCacheManager tail).
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-044
  difficulty: advanced
  tags:
  - enablecaching
  - proxytargetclass
  - boot
  question: |
    In Spring Boot, what is the default value of proxyTargetClass for AOP-based
    features like caching, and what does it imply?
  options:
  - false — JDK dynamic proxies are always used
  - true — CGLIB subclass proxies are used by default, so interface-less classes are proxied too
  - It is unset and caching fails without an interface
  - true — but only for @Transactional, not caching
  answer: 1
  explanation: |
    Spring Boot defaults proxyTargetClass to true, so CGLIB subclass proxies are
    used across AOP features (including caching), meaning classes without
    interfaces are proxied. CGLIB still cannot advise final/private methods.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-045
  difficulty: intermediate
  tags:
  - cacheevict
  - beforeinvocation
  - reason
  question: |
    When is beforeInvocation=true on @CacheEvict the RIGHT choice?
  options:
  - When you want eviction to happen only on success
  - When you want to cache the result before eviction
  - When the method may throw but you still want the (now-suspect) entry evicted regardless of outcome
  - When allEntries is false and the key is null
  answer: 2
  explanation: |
    beforeInvocation=true evicts before the method runs, so eviction occurs even
    if the method later throws. Use it when a stale entry must go regardless of
    whether the operation succeeds.
  ref: concepts.md#cacheevict
- id: caching-abstraction-046
  difficulty: advanced
  tags:
  - cacheable
  - sync
  - semantics
  question: |
    With @Cacheable(sync = true), two threads simultaneously miss the same key.
    What happens?
  options:
  - One thread computes the value while the other(s) block and then reuse the computed result
  - Both threads compute the value and the last write wins
  - Both threads receive null until the next call
  - Spring throws a ConcurrentCacheAccessException
  answer: 0
  explanation: |
    sync=true makes Spring use the cache's atomic get(key, valueLoader): only one
    thread runs the loader for a given key; concurrent callers wait and then get
    the same computed value — preventing duplicate expensive work (stampede).
  ref: concepts.md#cache-stampede
- id: caching-abstraction-047
  difficulty: intermediate
  tags:
  - providers
  - autoconfig
  - order
  question: |
    In Spring Boot, how can you explicitly force the cache provider to Redis
    regardless of what else is on the classpath?
  options:
  - Annotate with @Cacheable(provider = "redis")
  - Set @EnableCaching(mode = REDIS)
  - Define a bean named 'redis'
  - Set spring.cache.type=redis
  answer: 3
  explanation: |
    spring.cache.type pins the provider (e.g. redis, caffeine, none). Without it,
    Boot auto-detects by a fixed order of candidates. There is no 'provider'
    attribute on @Cacheable nor a REDIS advice mode.
  ref: concepts.md#cache-providers
- id: caching-abstraction-048
  difficulty: advanced
  tags:
  - redis
  - serialization
  question: |
    Which is a real trade-off of using Redis as the Spring cache versus a local
    Caffeine cache?
  options:
  - Redis cannot store objects, only strings
  - Redis adds network latency and requires serializing/deserializing values (default JDK serialization,
    often switched to JSON)
  - Redis has no TTL support
  - Redis caches are per-JVM like Caffeine
  answer: 1
  explanation: |
    Redis is remote, so every access crosses the network and values must be
    serialized (default JDK serialization; teams commonly switch to JSON). In
    return you get a shared, restart-surviving, horizontally scalable cache.
  ref: concepts.md#cache-providers
- id: caching-abstraction-049
  difficulty: beginner
  tags:
  - when-to-cache
  - good-fit
  question: |
    Which is the BEST fit for @Cacheable?
  options:
  - An expensive, idempotent lookup of rarely-changing reference data with a high hit ratio
  - A method that debits a bank account balance
  - A method that generates a new random token each call
  - A method that streams a large file to the client
  answer: 0
  explanation: |
    Caching shines for read-mostly, idempotent, expensive computations over a
    small hot set with a high hit ratio. Non-idempotent writes, per-call random
    output, and streaming are poor or incorrect fits.
  ref: concepts.md#when-caching-helps-vs-hurts
- id: caching-abstraction-050
  difficulty: intermediate
  tags:
  - caching
  - mixed
  question: |
    Which @Caching usage is valid for a method that should populate two caches on
    read AND evict one entry from a third cache?
  options:
  - Stacking @Cacheable twice directly, no @Caching needed
  - '@Caching(put = {...}, unless = {...})'
  - '@Caching with both cacheable = {...two...} and evict = {...one...} arrays'
  - '@Caching(evict = {...}) plus a separate @Cacheable on the class'
  answer: 2
  explanation: |
    @Caching accepts arrays for cacheable, put, and evict simultaneously, so you
    can combine two @Cacheable operations with one @CacheEvict on a single method.
    That composition is exactly what @Caching is for.
  ref: concepts.md#caching
- id: caching-abstraction-051
  difficulty: advanced
  tags:
  - self-invocation
  - aopcontext
  question: |
    To call a @Cacheable method on the current bean's PROXY from within the same
    class (so caching applies), which approach works?
  options:
  - Call the method with this.method()
  - Wrap the call in a try/catch
  - Declare the method static
  - Set @EnableCaching(exposeProxy=true) is not a thing; instead enable exposeProxy on the proxy config
    and call ((BookService) AopContext.currentProxy()).findBook(isbn)
  answer: 3
  explanation: |
    Enabling exposeProxy makes the current proxy available via
    AopContext.currentProxy(); casting and invoking through it routes the call
    through the proxy so caching advice fires. this.method() bypasses the proxy.
  ref: concepts.md#proxy-self-invocation-caveat
- id: caching-abstraction-052
  difficulty: beginner
  tags:
  - cacheable
  - cachenames
  question: |
    In @Cacheable("books"), what does the string "books" represent?
  options:
  - The SpEL key for the entry
  - The name of the cache (region) in which entries are stored
  - The bean name of the CacheManager
  - The TTL in seconds
  answer: 1
  explanation: |
    The value/cacheNames attribute names the cache (region). Entries for this
    method are stored in the "books" cache resolved from the CacheManager. It is
    not a key, TTL, or bean name.
  ref: concepts.md#cacheable
- id: caching-abstraction-053
  difficulty: intermediate
  tags:
  - enablecaching
  - boot
  - starter
  question: |
    A developer adds spring-boot-starter-cache and Caffeine but no caching seems
    to occur. The most likely missing piece is:
  options:
  - A @Bean of type Cache for each region
  - Setting spring.cache.type=caffeine (it is mandatory)
  - '@EnableCaching on a configuration class'
  - Annotating the main class with @EnableAutoConfiguration
  answer: 2
  explanation: |
    The starter and auto-config wire the CacheManager, but annotation processing
    only activates with @EnableCaching present. Without it, @Cacheable is inert.
    spring.cache.type is optional here since Caffeine is auto-detected.
  ref: concepts.md#enablecaching
- id: caching-abstraction-054
  difficulty: advanced
  tags:
  - stampede
  - ttl
  - jitter
  question: |
    Many cache entries were created at startup with the same 10-minute TTL. Ten
    minutes later the DB is hammered. Besides sync loading, what design change
    most directly prevents this synchronized expiry?
  options:
  - Add randomized jitter to per-entry TTLs so keys don't all expire at the same instant
  - Increase the ConcurrentMap capacity
  - Switch condition to unless
  - Set allEntries=true on reads
  answer: 0
  explanation: |
    Uniform TTLs cause synchronized mass expiry and a coordinated stampede.
    Adding jitter (randomized TTL offsets) spreads expirations over time so
    reloads are staggered rather than simultaneous.
  ref: concepts.md#cache-stampede
- id: caching-abstraction-055
  difficulty: intermediate
  tags:
  - cachemanager
  - noop
  question: |
    What is the behavior of NoOpCacheManager?
  options:
  - It throws on every cache access
  - It delegates to ConcurrentMapCacheManager
  - It caches only the first entry per region
  - It accepts all cache operations but stores nothing, so every @Cacheable call re-executes the method
  answer: 3
  explanation: |
    NoOpCacheManager satisfies the API but never actually stores values (gets
    always miss). It effectively disables caching while keeping annotations
    valid — useful for tests or turning caching off (spring.cache.type=none).
  ref: concepts.md#cachemanager-abstraction
- id: caching-abstraction-056
  difficulty: advanced
  tags:
  - key-generation
  - collision
  question: |
    Two overloaded @Cacheable methods findBook(String isbn) and
    findBook(String isbn, boolean full) share cacheNames="books" and rely on the
    default key generator. What risk exists?
  options:
  - None; the method signature is part of the key automatically
  - Key collision — the single-arg call keys on the isbn instance and could collide with entries only
    intended for the same isbn, since the default key does not include the method or all overloads' arity
    distinctly
  - Compilation fails due to duplicate cache names
  - The boolean is always ignored by SpEL
  answer: 1
  explanation: |
    The default SimpleKeyGenerator keys on arguments only (single arg -> the arg
    itself), not the method name. Different methods sharing a cache can collide.
    Fix by using distinct cacheNames or an explicit key including the method name.
  ref: concepts.md#key-generation--spel-keys
