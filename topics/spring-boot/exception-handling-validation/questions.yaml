topic: "Exception Handling & Validation"
domain: spring-boot
topic_slug: exception-handling-validation
version: 1
questions:
  - id: exception-handling-validation-001
    difficulty: beginner
    tags: [exception-handler, basics]
    question: |
      What is the primary purpose of a method annotated with `@ExceptionHandler` inside a controller?
    options:
      - "To handle exceptions thrown by handler methods of that controller and produce a response"
      - "To intercept HTTP requests before they reach the handler method"
      - "To validate incoming request bodies automatically"
      - "To schedule background retries when a handler fails"
    answer: 0
    explanation: |
      `@ExceptionHandler` marks a method that catches exceptions thrown from the controller's
      handler methods and turns them into a response, instead of letting them propagate to the
      servlet container as a generic error.
    ref: "concepts.md#exceptionhandler"

  - id: exception-handling-validation-002
    difficulty: intermediate
    tags: [exception-handler, status-code, gotcha]
    question: |
      An `@ExceptionHandler` method returns a plain `@ResponseBody` DTO and has NO `@ResponseStatus`
      annotation and does not return a `ResponseEntity`. What HTTP status will the client receive?
    options:
      - "500 Internal Server Error"
      - "400 Bad Request"
      - "200 OK"
      - "The status of the original exception's default mapping"
    answer: 2
    explanation: |
      Without `@ResponseStatus` or a `ResponseEntity`, the handler is treated like a normal
      controller return and defaults to 200 OK — a classic trap. Set `@ResponseStatus` or return
      a `ResponseEntity.status(...)`.
    ref: "concepts.md#exceptionhandler"

  - id: exception-handling-validation-003
    difficulty: intermediate
    tags: [exception-handler, matching]
    question: |
      Two `@ExceptionHandler` methods exist: one for `RuntimeException` and one for
      `IllegalArgumentException`. An `IllegalArgumentException` is thrown. Which handler is invoked?
    options:
      - "The `IllegalArgumentException` handler, because it is the most specific matching supertype"
      - "The `RuntimeException` handler, because it is registered first"
      - "Both handlers, in declaration order"
      - "Neither; ambiguity causes a 500"
    answer: 0
    explanation: |
      Spring selects the handler whose declared exception type is the closest match (most specific)
      to the thrown exception by walking its class hierarchy.
    ref: "concepts.md#exceptionhandler"

  - id: exception-handling-validation-004
    difficulty: advanced
    tags: [exception-handler, resolution-order, filter]
    question: |
      A `ServletException` is thrown inside a custom servlet `Filter` that runs before the
      DispatcherServlet dispatches to a handler. Can a controller-local `@ExceptionHandler` handle it?
    options:
      - "Yes, `@ExceptionHandler` catches all exceptions in the request lifecycle"
      - "Yes, but only if the filter is registered after the DispatcherServlet"
      - "No, exceptions thrown in filters occur outside the handler invocation and are not seen by `@ExceptionHandler`"
      - "No, unless the exception is a `RuntimeException`"
    answer: 2
    explanation: |
      `@ExceptionHandler`/`@ControllerAdvice` resolution happens within DispatcherServlet's handler
      invocation. Exceptions in filters run outside that scope and go through servlet error-dispatch,
      not the handler-exception resolvers.
    ref: "concepts.md#exceptionhandler"

  - id: exception-handling-validation-005
    difficulty: beginner
    tags: [controller-advice, basics]
    question: |
      What does `@ControllerAdvice` allow you to do?
    options:
      - "Apply `@ExceptionHandler`, `@InitBinder`, and `@ModelAttribute` methods globally across controllers"
      - "Advise Spring on which controller to route a request to"
      - "Cache controller responses across requests"
      - "Automatically retry failed controller methods"
    answer: 0
    explanation: |
      `@ControllerAdvice` is a `@Component` specialization that centralizes cross-cutting handler
      logic (`@ExceptionHandler`, `@InitBinder`, `@ModelAttribute`) across many controllers.
    ref: "concepts.md#controlleradvice--restcontrolleradvice"

  - id: exception-handling-validation-006
    difficulty: beginner
    tags: [controller-advice, rest]
    question: |
      What is the difference between `@RestControllerAdvice` and `@ControllerAdvice`?
    options:
      - "`@RestControllerAdvice` = `@ControllerAdvice` + `@ResponseBody`, so return values are serialized to the response body"
      - "`@RestControllerAdvice` can only handle 4xx errors"
      - "`@ControllerAdvice` is deprecated in Spring Boot 3"
      - "`@RestControllerAdvice` disables view resolution globally for all controllers"
    answer: 0
    explanation: |
      `@RestControllerAdvice` composes `@ControllerAdvice` and `@ResponseBody`, so handler returns
      are written directly to the body (JSON) rather than treated as view names.
    ref: "concepts.md#controlleradvice--restcontrolleradvice"

  - id: exception-handling-validation-007
    difficulty: intermediate
    tags: [controller-advice, scoping]
    question: |
      Which is a valid way to restrict a `@ControllerAdvice` to apply only to certain controllers?
    options:
      - "`@ControllerAdvice(assignableTypes = OrderController.class)`"
      - "`@ControllerAdvice(scope = \"web\")`"
      - "`@ControllerAdvice(only = RestController.class)`"
      - "`@ControllerAdvice(include = \"com.acme.*\")`"
    answer: 0
    explanation: |
      Advice can be scoped by `basePackages`, `assignableTypes`, or `annotations`. `assignableTypes`
      limits it to the listed controller types.
    ref: "concepts.md#controlleradvice--restcontrolleradvice"

  - id: exception-handling-validation-008
    difficulty: advanced
    tags: [controller-advice, ordering]
    question: |
      You have two `@RestControllerAdvice` beans: advice A (with `@Order(0)`) declares
      `@ExceptionHandler(Exception.class)`, and advice B (with `@Order(10)`) declares
      `@ExceptionHandler(OrderNotFoundException.class)`. An `OrderNotFoundException` is thrown.
      Which handler wins and why?
    options:
      - "Advice A's `Exception` handler, because A has higher priority and its handler matches the exception"
      - "Advice B's specific handler, because most-specific-exception matching is global across all advices"
      - "Neither; the ambiguity throws an `IllegalStateException` at startup"
      - "Both run in order; A first then B"
    answer: 0
    explanation: |
      The most-specific-exception rule applies WITHIN a single advice class. Across advice beans,
      `@Order` decides which advice is consulted first, so the higher-priority advice A's broad
      `Exception` handler shadows B's specific one. Keep catch-all advice last (lowest priority).
    ref: "concepts.md#controlleradvice--restcontrolleradvice"

  - id: exception-handling-validation-009
    difficulty: intermediate
    tags: [response-entity-exception-handler, base-class]
    question: |
      Why would you extend `ResponseEntityExceptionHandler` in your `@ControllerAdvice`?
    options:
      - "To gain overridable handlers for Spring MVC's built-in exceptions so you can customize their response bodies"
      - "To automatically enable database transaction rollback on exceptions"
      - "To register your advice as the only exception handler in the application"
      - "To convert all checked exceptions into runtime exceptions"
    answer: 0
    explanation: |
      `ResponseEntityExceptionHandler` provides `@ExceptionHandler` methods for standard Spring MVC
      exceptions (validation, unreadable body, method not supported, etc.); extend it to reshape
      those responses in one place.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: exception-handling-validation-010
    difficulty: advanced
    tags: [response-entity-exception-handler, boot3, upgrade]
    question: |
      After upgrading to Spring Boot 3, your override of `handleMethodArgumentNotValid(...)` in a
      subclass of `ResponseEntityExceptionHandler` no longer takes effect. What is the most likely cause?
    options:
      - "Your override still declares the last parameter as `HttpStatus` while Spring 6 changed it to `HttpStatusCode`, so it no longer overrides the parent"
      - "The method was renamed to `handleValidationException` in Spring 6"
      - "`ResponseEntityExceptionHandler` was removed entirely in Spring 6"
      - "You must now annotate the override with `@Override(force = true)`"
    answer: 0
    explanation: |
      Spring 6 changed the signatures to use the `HttpStatusCode` interface instead of the
      `HttpStatus` enum. An override still using `HttpStatus` compiles as a new method and silently
      fails to override, so the base behavior runs instead.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: exception-handling-validation-011
    difficulty: advanced
    tags: [response-entity-exception-handler, internals]
    question: |
      In `ResponseEntityExceptionHandler`, which method is the single central hook you override to
      attach a body or adjust the status for all standard exceptions?
    options:
      - "`handleExceptionInternal`"
      - "`resolveException`"
      - "`doResolveException`"
      - "`afterPropertiesSet`"
    answer: 0
    explanation: |
      `handleExceptionInternal` is the common choke point through which all the standard handlers
      route; overriding it lets you uniformly shape the body/status (e.g. produce `ProblemDetail`).
    ref: "concepts.md#responseentityexceptionhandler"

  - id: exception-handling-validation-012
    difficulty: beginner
    tags: [problem-detail, rfc7807]
    question: |
      Which class did Spring Framework 6 / Spring Boot 3 introduce for RFC 7807 style error responses?
    options:
      - "`ErrorAttributes`"
      - "`ApiError`"
      - "`ProblemDetail`"
      - "`HttpError`"
    answer: 2
    explanation: |
      `org.springframework.http.ProblemDetail` models the RFC 7807 problem structure (`type`,
      `title`, `status`, `detail`, `instance`, plus extension members).
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-013
    difficulty: intermediate
    tags: [problem-detail, content-type]
    question: |
      When a handler returns a `ProblemDetail`, what `Content-Type` does Spring use by default?
    options:
      - "`application/json`"
      - "`text/plain`"
      - "`application/problem+json`"
      - "`application/vnd.error+json`"
    answer: 2
    explanation: |
      RFC 7807 defines the media type `application/problem+json`, and Spring serializes
      `ProblemDetail` responses with it.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-014
    difficulty: intermediate
    tags: [problem-detail, configuration, boot3]
    question: |
      Which Spring Boot 3 property makes Spring MVC automatically produce `ProblemDetail` responses
      for its built-in exceptions without you subclassing `ResponseEntityExceptionHandler`?
    options:
      - "`spring.mvc.problemdetails.enabled=true`"
      - "`spring.web.rfc7807=true`"
      - "`server.error.problem-detail=on`"
      - "`spring.mvc.error.format=problem`"
    answer: 0
    explanation: |
      `spring.mvc.problemdetails.enabled=true` enables ProblemDetail responses for Spring MVC's
      built-in exceptions out of the box.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-015
    difficulty: advanced
    tags: [problem-detail, error-response, spring6]
    question: |
      In Spring 6, what does the `ErrorResponse` interface represent?
    options:
      - "A marker interface that disables the default `/error` controller"
      - "A repository interface for persisting error logs"
      - "An exception abstraction carrying an HTTP status, a `ProblemDetail` body, and headers"
      - "A functional interface for building custom `HandlerExceptionResolver`s"
    answer: 2
    explanation: |
      `ErrorResponse` models an exception that exposes an HTTP status, a `ProblemDetail`, and
      headers. Spring's own exceptions implement it, and `ErrorResponseException` is a ready-made
      throwable implementation.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-016
    difficulty: intermediate
    tags: [security, error-responses, best-practice]
    question: |
      What is the recommended way to handle a raw `Exception` (unexpected) in a global handler for a
      public API?
    options:
      - "Return the full stack trace in the body so clients can debug"
      - "Return 200 with an empty body to avoid alarming clients"
      - "Log the detail with a correlation id server-side and return a generic 500 body (optionally echoing the id)"
      - "Rethrow it so the servlet container renders the default Whitelabel page"
    answer: 2
    explanation: |
      Never leak internal details/stack traces. Log full detail server-side with a correlation id
      and return a safe, generic 500 body, optionally including the id so support can trace it.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-017
    difficulty: beginner
    tags: [status-mapping, response-status]
    question: |
      How can you make a custom exception map to 404 automatically, even without an `@ExceptionHandler`?
    options:
      - "Name the class ending in `NotFoundException`"
      - "Implement the `NotFound` marker interface"
      - "Annotate the exception class with `@ResponseStatus(HttpStatus.NOT_FOUND)`"
      - "Throw it from a method annotated `@GetMapping`"
    answer: 2
    explanation: |
      `@ResponseStatus` on an exception class is picked up by `ResponseStatusExceptionResolver` and
      maps the exception to the declared status without any handler.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-018
    difficulty: intermediate
    tags: [status-mapping, response-status-exception]
    question: |
      Which mechanism lets you set an HTTP status for an error without creating a dedicated exception class?
    options:
      - "`throw new ResponseStatusException(HttpStatus.NOT_FOUND, \"not found\")`"
      - "`response.setStatusCode(404)` inside the service layer"
      - "`@StatusCode(404)` on the service method"
      - "Returning `null` from the controller"
    answer: 0
    explanation: |
      `ResponseStatusException` (Spring 5+) lets you throw an exception with a chosen status and
      reason inline, avoiding proliferation of one-off exception classes.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-019
    difficulty: advanced
    tags: [status-mapping, constraint-violation, gotcha]
    question: |
      A `ConstraintViolationException` from method-level parameter validation reaches the client.
      With no custom handler configured, what status is returned by default (pre Spring 6.1 behavior)?
    options:
      - "400 Bad Request"
      - "422 Unprocessable Entity"
      - "500 Internal Server Error"
      - "409 Conflict"
    answer: 2
    explanation: |
      Unlike `MethodArgumentNotValidException` (default 400), `ConstraintViolationException` has no
      default 400 mapping, so it surfaces as 500 unless you add a handler. This asymmetry is a
      frequent trap.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-020
    difficulty: intermediate
    tags: [status-mapping, defaults]
    question: |
      Which default status does Spring's `DefaultHandlerExceptionResolver` assign to
      `HttpRequestMethodNotSupportedException`?
    options:
      - "400 Bad Request"
      - "404 Not Found"
      - "405 Method Not Allowed"
      - "415 Unsupported Media Type"
    answer: 2
    explanation: |
      An unsupported HTTP method for a mapped path yields 405 Method Not Allowed via the default
      resolver.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-021
    difficulty: intermediate
    tags: [status-mapping, media-type]
    question: |
      A client POSTs with `Content-Type: text/plain` to an endpoint that only consumes
      `application/json`. Which status/exception results by default?
    options:
      - "406 Not Acceptable / `HttpMediaTypeNotAcceptableException`"
      - "400 Bad Request / `HttpMessageNotReadableException`"
      - "415 Unsupported Media Type / `HttpMediaTypeNotSupportedException`"
      - "500 Internal Server Error / generic"
    answer: 2
    explanation: |
      A `Content-Type` the endpoint cannot consume triggers `HttpMediaTypeNotSupportedException` →
      415. (406 is the `Accept`-header/`produces` mismatch case.)
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-022
    difficulty: advanced
    tags: [status-mapping, precedence, response-entity]
    question: |
      An `@ExceptionHandler` method is annotated `@ResponseStatus(HttpStatus.CONFLICT)` but its body
      returns `ResponseEntity.status(HttpStatus.NOT_FOUND).body(dto)`. What status does the client see?
    options:
      - "409 Conflict, because `@ResponseStatus` always wins"
      - "500, due to conflicting status declarations"
      - "404 Not Found, because the returned `ResponseEntity`'s status takes precedence"
      - "200 OK, because the two cancel out"
    answer: 2
    explanation: |
      When a handler returns a `ResponseEntity`, its status is authoritative and the method-level
      `@ResponseStatus` is ignored.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-023
    difficulty: beginner
    tags: [bean-validation, hibernate-validator, starter]
    question: |
      Which starter must you add (since Spring Boot 2.3) to get Bean Validation / Hibernate Validator
      auto-configured, as it is no longer transitively pulled in by the web starter?
    options:
      - "`spring-boot-starter-web`"
      - "`spring-boot-starter-aop`"
      - "`spring-boot-starter-validation`"
      - "`spring-boot-starter-hibernate`"
    answer: 2
    explanation: |
      Since Boot 2.3 the validation starter is separate; add `spring-boot-starter-validation` to
      bring in Hibernate Validator and auto-configuration.
    ref: "concepts.md#bean-validation-jakarta--hibernate-validator"

  - id: exception-handling-validation-024
    difficulty: beginner
    tags: [bean-validation, jakarta, namespace]
    question: |
      In Spring Boot 3 / Spring 6, from which package do Bean Validation constraint annotations like
      `@NotNull` come?
    options:
      - "`javax.validation.constraints`"
      - "`org.springframework.validation`"
      - "`jakarta.validation.constraints`"
      - "`org.hibernate.validator.constraints`"
    answer: 2
    explanation: |
      Boot 3 / Spring 6 migrated to the Jakarta namespace: `jakarta.validation.constraints.*`.
      A leftover `javax.validation.@NotNull` is silently ignored by the Jakarta-based validator.
    ref: "concepts.md#bean-validation-jakarta--hibernate-validator"

  - id: exception-handling-validation-025
    difficulty: intermediate
    tags: [bean-validation, constraints, notblank-notempty]
    question: |
      Given a `String` field, which annotation requires it to be non-null AND to contain at least one
      non-whitespace character after trimming?
    options:
      - "`@NotNull`"
      - "`@NotEmpty`"
      - "`@NotBlank`"
      - "`@Size(min = 1)`"
    answer: 2
    explanation: |
      `@NotBlank` (String only) requires non-null and trimmed length > 0. `@NotEmpty` only checks
      length > 0 (whitespace passes); `@Size(min=1)` allows a single space and permits null.
    ref: "concepts.md#bean-validation-jakarta--hibernate-validator"

  - id: exception-handling-validation-026
    difficulty: intermediate
    tags: [bean-validation, null-handling, gotcha]
    question: |
      A field is annotated only with `@Size(min = 3, max = 10)` (no `@NotNull`). The field value is
      `null`. What is the validation result?
    options:
      - "Invalid — null violates the minimum size"
      - "Invalid — `@Size` always implies `@NotNull`"
      - "Valid — `@Size` treats null as valid; only non-null values are checked"
      - "A `NullPointerException` is thrown during validation"
    answer: 2
    explanation: |
      Most constraints (`@Size`, `@Email`, `@Pattern`, `@Min`...) consider `null` valid and only
      validate non-null values. Add `@NotNull` if the field must be present.
    ref: "concepts.md#bean-validation-jakarta--hibernate-validator"

  - id: exception-handling-validation-027
    difficulty: beginner
    tags: [valid-vs-validated, groups]
    question: |
      Which annotation supports validation groups?
    options:
      - "`jakarta.validation.Valid`"
      - "`jakarta.validation.constraints.NotNull`"
      - "`org.springframework.web.bind.annotation.Validated`"
      - "`org.springframework.validation.annotation.Validated`"
    answer: 3
    explanation: |
      Spring's `@Validated` supports groups (`@Validated(OnCreate.class)`). The spec's `@Valid`
      cannot specify groups and always validates the default group.
    ref: "concepts.md#valid-vs-validated-groups"

  - id: exception-handling-validation-028
    difficulty: intermediate
    tags: [valid-vs-validated, comparison]
    question: |
      Which statement correctly distinguishes `@Valid` from `@Validated`?
    options:
      - "`@Valid` supports groups; `@Validated` does not"
      - "Both are Spring annotations that behave identically"
      - "`@Validated` is the cascade marker for nested objects; `@Valid` is not"
      - "`@Valid` is the Jakarta cascade marker (no groups); `@Validated` is Spring's, supports groups and enables method-level validation on a class"
    answer: 3
    explanation: |
      `@Valid` (Jakarta) is the cascade marker and validates the default group; `@Validated`
      (Spring) adds group support and, on a class, enables method-level validation. `@Validated`
      is NOT a cascade marker.
    ref: "concepts.md#valid-vs-validated-groups"

  - id: exception-handling-validation-029
    difficulty: advanced
    tags: [valid-vs-validated, groups, default-group]
    question: |
      A constraint is declared as `@NotBlank(groups = OnUpdate.class)`. A request validates with
      `@Validated` (no group specified, i.e. `Default`). Is this constraint evaluated?
    options:
      - "Yes — group-specific constraints always run"
      - "Yes — but only if `OnUpdate` extends `Default`"
      - "Only if the field is also annotated with `@Valid`"
      - "No — it belongs only to `OnUpdate`, which is not part of the `Default` group being validated"
    answer: 3
    explanation: |
      A constraint assigned to a specific group runs only when that group (or a group extending it)
      is validated. Validating the `Default` group does not trigger an `OnUpdate`-only constraint.
    ref: "concepts.md#valid-vs-validated-groups"

  - id: exception-handling-validation-030
    difficulty: intermediate
    tags: [valid-vs-validated, groups, compile]
    question: |
      A developer writes `@Valid(groups = OnCreate.class) @RequestBody UserDto dto`. What happens?
    options:
      - "It works and validates the OnCreate group"
      - "It compiles but validates the Default group instead"
      - "It throws a `ConstraintDeclarationException` at runtime"
      - "It does not compile — `@Valid` has no `groups` attribute; use `@Validated(OnCreate.class)`"
    answer: 3
    explanation: |
      `jakarta.validation.Valid` has no `groups` element, so `@Valid(groups=...)` won't compile.
      Use Spring's `@Validated(OnCreate.class)` for group selection.
    ref: "concepts.md#valid-vs-validated-groups"

  - id: exception-handling-validation-031
    difficulty: intermediate
    tags: [binding-result, exception]
    question: |
      What happens if you declare a `BindingResult` parameter immediately after a `@Valid @RequestBody`
      object, but forget to check `result.hasErrors()`?
    options:
      - "Spring still throws `MethodArgumentNotValidException` on validation failure"
      - "The request is rejected with 500 automatically"
      - "The `BindingResult` forces a redirect to `/error`"
      - "Validation failures are silently swallowed and invalid data flows into your method body"
    answer: 3
    explanation: |
      Declaring a `BindingResult` suppresses the thrown exception; if you don't check `hasErrors()`
      yourself, invalid data proceeds — a real bug.
    ref: "concepts.md#valid--bindingresult"

  - id: exception-handling-validation-032
    difficulty: advanced
    tags: [binding-result, ordering, gotcha]
    question: |
      Regarding the position of a `BindingResult` parameter in a handler method signature, which is true?
    options:
      - "It can appear anywhere in the parameter list"
      - "It must be the first parameter"
      - "It must be the last parameter, after all others"
      - "It must appear immediately after the `@Valid`/`@Validated` object it refers to"
    answer: 3
    explanation: |
      Spring associates a `BindingResult` with the validated object directly preceding it; they must
      be adjacent, and you need one `BindingResult` per validated model.
    ref: "concepts.md#valid--bindingresult"

  - id: exception-handling-validation-033
    difficulty: intermediate
    tags: [binding-result, best-practice, rest]
    question: |
      For a REST API, which approach to `@RequestBody` validation errors is generally preferred?
    options:
      - "Always use `BindingResult` and handle errors in every controller method"
      - "Disable validation and check fields manually"
      - "Catch `Exception` in each method and return 400"
      - "Omit `BindingResult` so failures throw `MethodArgumentNotValidException`, handled centrally in `@ControllerAdvice`"
    answer: 3
    explanation: |
      Centralized handling via a global advice keeps error responses consistent; `BindingResult` is
      more suited to server-side form flows where you re-render the form.
    ref: "concepts.md#valid--bindingresult"

  - id: exception-handling-validation-034
    difficulty: advanced
    tags: [binding-result, binding-errors]
    question: |
      Besides constraint violations, what other kind of error does a `BindingResult` capture?
    options:
      - "Database connection failures"
      - "Authentication failures"
      - "Serialization errors when writing the response"
      - "Type-mismatch / binding errors (e.g. a non-numeric value bound to an `int` field)"
    answer: 3
    explanation: |
      `BindingResult` also records data-binding/type-mismatch errors, which is why it is central to
      form binding, not just Bean Validation constraint violations.
    ref: "concepts.md#valid--bindingresult"

  - id: exception-handling-validation-035
    difficulty: intermediate
    tags: [path-query-params, validated, gotcha]
    question: |
      You put `@Min(1)` on a `@RequestParam int page` but constraint violations never occur even for
      `page=0`. What is the most likely fix?
    options:
      - "Add `@Valid` before the `@RequestParam`"
      - "Change `@Min` to `@Size`"
      - "Register a `BindingResult` parameter"
      - "Add class-level `@Validated` on the controller to enable method-level validation"
    answer: 3
    explanation: |
      Constraints on `@RequestParam`/`@PathVariable` require method-level validation, which is only
      enabled when the controller class is annotated with `@Validated`. Without it they are ignored.
    ref: "concepts.md#validating-pathquery-params"

  - id: exception-handling-validation-036
    difficulty: intermediate
    tags: [path-query-params, exception-type]
    question: |
      When a `@PathVariable @Positive Long id` fails on a `@Validated` controller (pre Spring 6.1),
      which exception is thrown?
    options:
      - "`MethodArgumentNotValidException`"
      - "`BindException`"
      - "`IllegalArgumentException`"
      - "`ConstraintViolationException`"
    answer: 3
    explanation: |
      Method-level validation on `@Validated` beans throws `jakarta.validation.ConstraintViolationException`,
      not `MethodArgumentNotValidException` (which is for `@Valid` on `@RequestBody`/`@ModelAttribute`).
    ref: "concepts.md#validating-pathquery-params"

  - id: exception-handling-validation-037
    difficulty: advanced
    tags: [path-query-params, method-validation, proxy]
    question: |
      Method-level validation (`@Validated` on a class) is implemented via which mechanism, and what
      is a consequence of that?
    options:
      - "Bytecode weaving at compile time; no runtime consequence"
      - "A servlet filter; it validates before the DispatcherServlet"
      - "Reflection on every method call; it validates private methods too"
      - "An AOP proxy (`MethodValidationPostProcessor`); self-invocation of a validated method within the same bean bypasses validation"
    answer: 3
    explanation: |
      `MethodValidationPostProcessor` wraps `@Validated` beans in an AOP proxy. Like `@Transactional`,
      internal self-invocation bypasses the proxy and thus skips validation.
    ref: "concepts.md#validating-pathquery-params"

  - id: exception-handling-validation-038
    difficulty: advanced
    tags: [path-query-params, boot3.2, handler-method-validation]
    question: |
      In Spring Framework 6.1 / Boot 3.2+, how did controller method-parameter validation improve?
    options:
      - "Class-level `@Validated` is no longer needed at all"
      - "All validation now runs asynchronously"
      - "`ConstraintViolationException` was renamed to `ValidationException`"
      - "Violations can be adapted into `HandlerMethodValidationException` (an `ErrorResponse`), giving a proper 400 with field details in many cases"
    answer: 3
    explanation: |
      Spring 6.1 introduced `HandlerMethodValidationException` (an `ErrorResponse`), so param
      violations can produce a 400 with field-error-like detail without a custom handler. Class-level
      `@Validated` is still the trigger.
    ref: "concepts.md#validating-pathquery-params"

  - id: exception-handling-validation-039
    difficulty: beginner
    tags: [custom-validator, structure]
    question: |
      A custom constraint annotation is linked to its validation logic using which meta-annotation?
    options:
      - "`@Constraint(validatedBy = MyValidator.class)`"
      - "`@Validator(MyValidator.class)`"
      - "`@UseValidator(MyValidator.class)`"
      - "`@ConstraintValidator(MyValidator.class)`"
    answer: 0
    explanation: |
      `@Constraint(validatedBy = ...)` on the annotation declares which `ConstraintValidator`
      implementation performs the check.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-040
    difficulty: intermediate
    tags: [custom-validator, required-members]
    question: |
      Which three members MUST a custom constraint annotation declare to be spec-compliant?
    options:
      - "`value()`, `name()`, `type()`"
      - "`code()`, `severity()`, `field()`"
      - "`message()`, `regexp()`, `flags()`"
      - "`message()`, `groups()`, `payload()`"
    answer: 3
    explanation: |
      Every Bean Validation constraint must declare `message()`, `groups()`, and `payload()`.
      Missing any makes it an invalid constraint.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-041
    difficulty: advanced
    tags: [custom-validator, spring-beans, injection]
    question: |
      You need a custom validator that checks email uniqueness by querying the database. How can the
      validator access a Spring repository?
    options:
      - "It cannot; validators are created by reflection outside the Spring context"
      - "Use a static `ApplicationContextHolder` because DI is impossible in validators"
      - "Pass the repository through the annotation's attributes"
      - "Inject the repository via `@Autowired` — Spring resolves validators as beans through `SpringConstraintValidatorFactory`"
    answer: 3
    explanation: |
      When Hibernate Validator is integrated with Spring, `ConstraintValidator` instances are
      resolved as Spring beans (via `SpringConstraintValidatorFactory`), so normal `@Autowired`
      dependency injection works.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-042
    difficulty: intermediate
    tags: [custom-validator, null-convention]
    question: |
      By convention, what should a custom `ConstraintValidator.isValid` typically return when the value
      is `null`?
    options:
      - "`false`, to reject null values"
      - "It must throw `IllegalArgumentException`"
      - "It should log a warning and return `false`"
      - "`true`, letting a separate `@NotNull` handle nullness — keeps constraints composable"
    answer: 3
    explanation: |
      Following the built-in convention, validators return `true` for null and rely on `@NotNull`
      for presence, keeping constraints composable.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-043
    difficulty: advanced
    tags: [custom-validator, cross-field, class-level]
    question: |
      You need to validate that `password` equals `confirmPassword`. What kind of constraint is
      appropriate?
    options:
      - "A field-level constraint on `password`"
      - "A class/type-level constraint (`@Target(TYPE)`) whose validator inspects the whole object"
      - "Two separate `@Pattern` constraints"
      - "A `@NotNull` on both fields"
    answer: 1
    explanation: |
      Cross-field rules require a class-level (type-targeted) constraint whose validator receives the
      whole bean and can compare multiple fields.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-044
    difficulty: advanced
    tags: [custom-validator, custom-message, context]
    question: |
      To emit a dynamic, non-default violation message from a `ConstraintValidator`, which sequence
      is correct?
    options:
      - "Return `false` and set a field on the annotation"
      - "Call `ctx.disableDefaultConstraintViolation()` then `ctx.buildConstraintViolationWithTemplate(msg).addConstraintViolation()`"
      - "Throw a `ConstraintViolationException` with the message"
      - "Return `null` from `isValid`"
    answer: 1
    explanation: |
      Disable the default violation, then build one with a custom template and add it via the
      `ConstraintValidatorContext`.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-045
    difficulty: beginner
    tags: [cascading, valid]
    question: |
      How do you make validation recurse into a nested object's own constraints?
    options:
      - "Annotate the nested field reference with `@Valid`"
      - "Annotate the nested field with `@Validated`"
      - "Annotate the nested field with `@NotNull`"
      - "Nothing — nested objects are always validated automatically"
    answer: 0
    explanation: |
      Cascaded validation requires `@Valid` on the nested reference; without it the nested object's
      constraints are not evaluated.
    ref: "concepts.md#cascading-validation"

  - id: exception-handling-validation-046
    difficulty: intermediate
    tags: [cascading, nested, gotcha]
    question: |
      An `OrderDto` has `@NotNull private Address shippingAddress;` (no `@Valid`). `Address` has
      `@NotBlank private String street;`. A request supplies a non-null Address with a blank street.
      What is the validation outcome?
    options:
      - "Fails — the blank street violates `@NotBlank`"
      - "Passes — without `@Valid` on the field, `Address`'s constraints are not cascaded/evaluated"
      - "Fails — `@NotNull` cascades into nested constraints"
      - "Throws `ConstraintDeclarationException`"
    answer: 1
    explanation: |
      `@NotNull` only checks the reference is non-null; it does not cascade. Without `@Valid` on
      `shippingAddress`, `Address.street`'s `@NotBlank` is never evaluated, so validation passes.
    ref: "concepts.md#cascading-validation"

  - id: exception-handling-validation-047
    difficulty: intermediate
    tags: [cascading, collections, container-elements]
    question: |
      How do you validate each element inside a `List<LineItem>` field where each `LineItem` has its
      own constraints?
    options:
      - "`@NotEmpty private List<LineItem> items;`"
      - "`@Valid private List<LineItem> items;` (or `List<@Valid LineItem> items;`)"
      - "`@Validated private List<LineItem> items;`"
      - "Iterate and call a validator manually — the framework can't do it"
    answer: 1
    explanation: |
      `@Valid` on the collection cascades to each element; Bean Validation 2.0+ also supports
      container-element annotations like `List<@Valid LineItem>`.
    ref: "concepts.md#cascading-validation"

  - id: exception-handling-validation-048
    difficulty: advanced
    tags: [cascading, groups, convert-group]
    question: |
      When cascading validation with groups, which annotation translates a group across a cascade
      boundary (e.g. from the parent's group to a different group on the nested object)?
    options:
      - "`@GroupSequence`"
      - "`@ConvertGroup(from = X.class, to = Y.class)`"
      - "`@GroupTranslate`"
      - "`@Validated(X.class)`"
    answer: 1
    explanation: |
      `@ConvertGroup` remaps the validated group as validation cascades into a nested object,
      allowing the nested bean to be validated against a different group.
    ref: "concepts.md#cascading-validation"

  - id: exception-handling-validation-049
    difficulty: intermediate
    tags: [request-body, exception-type]
    question: |
      A `@Valid @RequestBody` DTO fails validation and there is NO `BindingResult` parameter. Which
      exception does Spring throw?
    options:
      - "`ConstraintViolationException`"
      - "`MethodArgumentNotValidException`"
      - "`HttpMessageNotReadableException`"
      - "`BindException`"
    answer: 1
    explanation: |
      `@Valid` on a `@RequestBody`/`@ModelAttribute` argument (without a `BindingResult`) throws
      `MethodArgumentNotValidException`, which maps to 400 by default.
    ref: "concepts.md#valid--bindingresult"

  - id: exception-handling-validation-050
    difficulty: advanced
    tags: [exception-handler, cause-matching]
    question: |
      No `@ExceptionHandler` matches the thrown exception type directly. What else does Spring inspect
      before giving up?
    options:
      - "The exception's message string for keywords"
      - "The exception's cause chain, to find a handler matching a wrapped cause"
      - "The stack trace class names"
      - "Nothing; it immediately returns 500"
    answer: 1
    explanation: |
      If no handler matches the thrown exception directly, Spring also examines the exception's cause
      chain to find a matching handler.
    ref: "concepts.md#exceptionhandler"

  - id: exception-handling-validation-051
    difficulty: intermediate
    tags: [problem-detail, extension-members]
    question: |
      How do you attach a custom field (e.g. `orderId`) to a `ProblemDetail` response body?
    options:
      - "`pd.addHeader(\"orderId\", 42)`"
      - "`pd.setProperty(\"orderId\", 42)` — extension members are serialized alongside the standard fields"
      - "You cannot; `ProblemDetail` is a fixed structure"
      - "`pd.setDetail(\"orderId=42\")` is the only option"
    answer: 1
    explanation: |
      `ProblemDetail.setProperty(name, value)` adds RFC 7807 extension members, which are serialized
      next to `type`/`title`/`status`/`detail`/`instance`.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-052
    difficulty: beginner
    tags: [boot-defaults, error-controller]
    question: |
      With no `@ControllerAdvice` defined, what does Spring Boot use as a fallback to render error
      responses at the `/error` path?
    options:
      - "`BasicErrorController` with `DefaultErrorAttributes`"
      - "`GlobalExceptionHandler` auto-created bean"
      - "`ResponseEntityExceptionHandler` singleton"
      - "Nothing; the request hangs"
    answer: 0
    explanation: |
      Boot ships `BasicErrorController` (mapped to `/error`) plus `DefaultErrorAttributes`, producing
      a default JSON error body via servlet error-dispatch.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-053
    difficulty: intermediate
    tags: [boot-defaults, error-attributes, security]
    question: |
      Which Boot property controls whether the exception message is included in the default error
      response, and what is its typical default?
    options:
      - "`server.error.include-message`, default `never`"
      - "`spring.error.show-message`, default `always`"
      - "`server.error.message-enabled`, default `true`"
      - "`spring.mvc.error.detail`, default `on`"
    answer: 0
    explanation: |
      `server.error.include-message` gates the `message` field; since Boot 2.3 it defaults to
      `never` (like `include-stacktrace`) to avoid leaking internals.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-054
    difficulty: advanced
    tags: [controller-advice, init-binder, model-attribute]
    question: |
      Besides `@ExceptionHandler`, which additional method types can a `@ControllerAdvice` apply
      globally?
    options:
      - "`@RequestMapping` and `@ResponseBody` only"
      - "`@InitBinder` and `@ModelAttribute`"
      - "`@Scheduled` and `@Async`"
      - "`@Transactional` and `@Cacheable`"
    answer: 1
    explanation: |
      `@ControllerAdvice` can host `@InitBinder` (per-request binder customization) and
      `@ModelAttribute` (shared model data) methods applied across controllers, in addition to
      `@ExceptionHandler`.
    ref: "concepts.md#controlleradvice--restcontrolleradvice"

  - id: exception-handling-validation-055
    difficulty: advanced
    tags: [status-mapping, response-status, override]
    question: |
      A custom exception is annotated `@ResponseStatus(HttpStatus.NOT_FOUND)`, but you also define an
      `@ExceptionHandler` for it that returns `ResponseEntity.status(HttpStatus.GONE).body(...)`.
      What status does the client get?
    options:
      - "404, because the class-level `@ResponseStatus` always wins"
      - "410 Gone, because the explicit `@ExceptionHandler`/`ResponseEntity` overrides the class annotation"
      - "500, due to the conflict"
      - "Both are sent; the client picks one"
    answer: 1
    explanation: |
      A matching `@ExceptionHandler` takes precedence over the exception's `@ResponseStatus`, so the
      returned `ResponseEntity`'s 410 wins.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-056
    difficulty: intermediate
    tags: [valid-vs-validated, method-validation, class-level]
    question: |
      Where must `@Validated` be placed to enable validation of a service bean's method parameters
      annotated with `@NotNull`/`@Min`?
    options:
      - "On each method parameter"
      - "On the service class (type level)"
      - "On the interface's package-info"
      - "On the calling controller only"
    answer: 1
    explanation: |
      Class-level `@Validated` triggers `MethodValidationPostProcessor` to proxy the bean and enforce
      parameter constraints, throwing `ConstraintViolationException` on failure.
    ref: "concepts.md#valid-vs-validated-groups"

  - id: exception-handling-validation-057
    difficulty: beginner
    tags: [request-body, malformed-json]
    question: |
      A client sends syntactically invalid JSON in the request body. Which exception/status results
      by default?
    options:
      - "`MethodArgumentNotValidException` / 400"
      - "`HttpMessageNotReadableException` / 400"
      - "`ConstraintViolationException` / 500"
      - "`HttpMediaTypeNotSupportedException` / 415"
    answer: 1
    explanation: |
      Malformed/unreadable request bodies produce `HttpMessageNotReadableException`, mapped to 400 by
      the default resolver. This occurs before Bean Validation even runs.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-058
    difficulty: advanced
    tags: [response-entity-exception-handler, webflux, packages]
    question: |
      Which statement about `ResponseEntityExceptionHandler` across Spring stacks is correct?
    options:
      - "There is a single class shared by MVC and WebFlux"
      - "There are separate MVC (servlet) and WebFlux (reactive) variants in different packages"
      - "It only exists for WebFlux since Spring 6"
      - "It was replaced by `ProblemDetail` and no longer exists"
    answer: 1
    explanation: |
      The servlet MVC variant lives under `web.servlet.mvc.method.annotation`, and a reactive
      counterpart exists under `web.reactive.result.method.annotation` for WebFlux.
    ref: "concepts.md#responseentityexceptionhandler"

  - id: exception-handling-validation-059
    difficulty: intermediate
    tags: [custom-validator, composed]
    question: |
      What is a "composed constraint" in Bean Validation?
    options:
      - "A constraint that runs only in the composed group"
      - "A new annotation meta-annotated with existing constraints (e.g. `@NotNull @Size @Pattern`), optionally bundled with `@ReportAsSingleViolation`"
      - "A constraint applied to two beans simultaneously"
      - "A validator that composes multiple `ConstraintValidatorContext` objects"
    answer: 1
    explanation: |
      Composed constraints combine existing constraints into a reusable annotation;
      `@ReportAsSingleViolation` collapses the sub-violations into one reported error.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-060
    difficulty: intermediate
    tags: [valid, dual-role]
    question: |
      Which pair correctly describes the TWO distinct roles of `@Valid`?
    options:
      - "Selecting a validation group AND enabling method-level validation"
      - "Triggering validation of a controller parameter (e.g. `@RequestBody`) AND marking a nested reference for cascading"
      - "Rolling back transactions AND caching results"
      - "Setting the HTTP status AND serializing the body"
    answer: 1
    explanation: |
      `@Valid` both triggers validation of a controller method argument and acts as the cascade
      marker on nested object references. It does neither group selection nor method-validation
      enablement (that's `@Validated`).
    ref: "concepts.md#cascading-validation"

  - id: exception-handling-validation-061
    difficulty: expert
    tags: [method-validation, spring6.1, handler-method-validation, upgrade]
    question: |
      A Spring Boot 3.2 controller class is annotated with class-level `@Validated` and has
      `@GetMapping List<X> list(@RequestParam @Min(1) int page)`. The team expected a clean 400 with
      field details from the new built-in method validation, but `page=0` produces a 500 with a raw
      `ConstraintViolationException`. What is the correct explanation?
    options:
      - "The presence of class-level `@Validated` routes validation through the legacy AOP proxy path, which throws `ConstraintViolationException` (no default 400 mapping); you must REMOVE class-level `@Validated` to activate MVC's built-in `HandlerMethodValidationException` support"
      - "`@Min` is not supported on `int` parameters in Boot 3.2; it must be a boxed `Integer`"
      - "The built-in method validation only produces `HandlerMethodValidationException` for `@PathVariable`, never for `@RequestParam`"
      - "You must additionally set `spring.mvc.method-validation.enabled=true` for the built-in path to engage"
    answer: 0
    explanation: |
      Spring 6.1 has two mutually-exclusive method-validation paths per controller. Class-level
      `@Validated` forces the AOP-proxy path (raw `ConstraintViolationException` → 500 unless handled).
      Removing it lets MVC's built-in, non-AOP support run, which raises `HandlerMethodValidationException`
      (an `ErrorResponse`) → 400 with per-parameter detail.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-062
    difficulty: expert
    tags: [method-validation, spring6.1, valid, constraint-trigger]
    question: |
      In a Spring 6.1 controller WITHOUT class-level `@Validated`, which single handler parameter
      declaration will, by itself, trigger method-level validation (and thus a possible
      `HandlerMethodValidationException`)?
    options:
      - "`@RequestParam @Valid String q` — because `@Valid` always triggers method validation"
      - "`@RequestParam @NotNull String q` — because `@NotNull` is a real constraint annotation, and a constraint directly on a parameter triggers built-in method validation"
      - "`@RequestBody @Valid Foo f` — a single command object always causes `HandlerMethodValidationException`"
      - "`@RequestParam String q` with no annotation — any `@RequestParam` is validated by default in 6.1"
    answer: 1
    explanation: |
      `@Valid` is not a constraint; alone it only marks a parameter for nested/cascaded validation and
      does not trigger method validation. A genuine constraint like `@NotNull` placed directly on a
      simple parameter does trigger the built-in method validation. A single `@Valid @RequestBody`
      command object goes through individual validation → `MethodArgumentNotValidException`, not
      `HandlerMethodValidationException`.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-063
    difficulty: advanced
    tags: [method-validation, exception-type, decision-rule]
    question: |
      A Spring 6.1 handler (no class-level `@Validated`) is
      `create(@Valid @RequestBody User u)` with NO `BindingResult`. The body fails a `@NotBlank`
      on `User.name`. Which exception is thrown?
    options:
      - "`HandlerMethodValidationException`, because 6.1 unified everything into method validation"
      - "`ConstraintViolationException`, because bean validation on a body always produces it"
      - "`MethodArgumentNotValidException`, because a single command object with `@Valid` (and no trailing `Errors`) goes through individual/command-object validation"
      - "`HttpMessageNotReadableException`, because a blank name cannot be deserialized"
    answer: 2
    explanation: |
      A single command object (`@RequestBody`/`@ModelAttribute`/`@RequestPart`) marked `@Valid` with no
      following `Errors`/`BindingResult` uses individual validation, which raises
      `MethodArgumentNotValidException` (400). Constraints placed *directly on* simple parameters are
      what produce `HandlerMethodValidationException`.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-064
    difficulty: expert
    tags: [method-validation, aop, adapt-constraint-violations]
    question: |
      On the AOP method-validation path for a `@Validated` service bean, how do you make Spring raise
      `MethodValidationException` (with violations adapted to `MessageSourceResolvable`/`FieldError`s
      grouped per parameter) instead of the raw `ConstraintViolationException`?
    options:
      - "Annotate the service with `@Validated(adapt = true)`"
      - "Set `spring.validation.adapt-constraint-violations=true` in application.properties"
      - "Implement `MessageSourceResolvable` on your custom exception"
      - "Call `setAdaptConstraintViolations(true)` on a custom `MethodValidationPostProcessor` bean"
    answer: 3
    explanation: |
      `MethodValidationPostProcessor.setAdaptConstraintViolations(true)` switches the AOP path to raise
      `MethodValidationException`, whose `ParameterValidationResult`/`ParameterErrors` expose adapted
      `FieldError`s suitable for message-source rendering.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-065
    difficulty: advanced
    tags: [method-validation, mixed-params, supersede]
    question: |
      A Spring 6.1 handler (no class `@Validated`) mixes a constrained simple parameter and a
      cascaded body: `save(@RequestParam @Min(1) int id, @Valid @RequestBody Order o)`. Both `id=0`
      and an invalid `Order` field are sent. What happens?
    options:
      - "Method-level validation supersedes individual command-object validation for that method, so a single `HandlerMethodValidationException` is raised covering both (with a `ParameterErrors` result for the cascaded body)"
      - "Two separate exceptions are thrown and merged into a 500"
      - "Only the `@RequestParam` violation is reported; the body is ignored"
      - "`MethodArgumentNotValidException` wins because a `@RequestBody` is present"
    answer: 0
    explanation: |
      When any parameter requires method validation, it supersedes individual command-object validation
      on that method; Spring raises one `HandlerMethodValidationException` whose `ParameterValidationResult`
      list includes a `ParameterErrors` (an `Errors`/`FieldError` view) for the cascaded `@Valid` body.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-066
    difficulty: intermediate
    tags: [method-validation, robust-advice]
    question: |
      For a robust `@RestControllerAdvice` in a Spring Boot 3.2 app that validates both request bodies
      and path/query params (built-in path), which set of exceptions should you handle to cover
      validation failures?
    options:
      - "Only `MethodArgumentNotValidException`"
      - "Both `MethodArgumentNotValidException` and `HandlerMethodValidationException`"
      - "Only `ConstraintViolationException`"
      - "Only `BindException`"
    answer: 1
    explanation: |
      Body/command-object validation yields `MethodArgumentNotValidException`; constrained simple
      parameters yield `HandlerMethodValidationException`. A complete advice handles both (both are
      `ErrorResponse` in Spring 6 and default to 400).
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-067
    difficulty: expert
    tags: [binding-result, global-errors, cross-field, bug]
    question: |
      A DTO has a class-level cross-field constraint (`password == confirmPassword`). Your
      `handleMethodArgumentNotValid` override builds the response by iterating
      `ex.getBindingResult().getFieldErrors()`. The password-mismatch message never appears in
      responses. Why?
    options:
      - "Class-level constraints are validated last and get truncated"
      - "Cross-field constraints are not supported by `MethodArgumentNotValidException`"
      - "A class-level constraint produces an `ObjectError`/global error, which lives in `getGlobalErrors()`, not `getFieldErrors()`; iterating only field errors drops it"
      - "`getFieldErrors()` throws for class-level violations, silently caught by Spring"
    answer: 2
    explanation: |
      Field constraints become `FieldError`s; class/type-level constraints become `ObjectError`
      (global) errors. Only reading `getFieldErrors()` omits global errors — iterate `getAllErrors()`
      (or also `getGlobalErrors()`) to include cross-field messages.
    ref: "concepts.md#methodargumentnotvalidexception-internals--bindingresult-vs-errors"

  - id: exception-handling-validation-068
    difficulty: expert
    tags: [ordering, hibernate-validator, determinism]
    question: |
      A test asserts that the FIRST field error in a `MethodArgumentNotValidException` response is
      always `email`, but it flakes across runs and JVMs. What is the accurate root cause and fix?
    options:
      - "Hibernate Validator caches errors by hashcode; disable the cache"
      - "The flakiness is a Jackson serialization bug; register a custom serializer"
      - "You must annotate the DTO with `@GroupSequence` to force field order"
      - "The order in which constraint violations are reported is not guaranteed by Bean Validation / Hibernate Validator; do not depend on it — sort the errors (e.g. by field name) before responding/asserting"
    answer: 3
    explanation: |
      Constraint iteration order is unspecified; relying on a particular first error is inherently
      flaky. Impose a deterministic order yourself (sort by field/code) for stable payloads and tests.
    ref: "concepts.md#methodargumentnotvalidexception-internals--bindingresult-vs-errors"

  - id: exception-handling-validation-069
    difficulty: advanced
    tags: [message-codes, field-error, message-source]
    question: |
      For a `@NotBlank` failure on `UserDto.name`, which of the following is a valid message-resolution
      code that Spring generates for the `FieldError` (usable as a key in `messages.properties`)?
    options:
      - "`NotBlank.userDto.name`"
      - "`error.userDto.name.notBlank`"
      - "`validation:name:NotBlank`"
      - "`jakarta.NotBlank[name]`"
    answer: 0
    explanation: |
      Spring generates a hierarchy of codes from most to least specific, e.g. `NotBlank.userDto.name`,
      `NotBlank.name`, `NotBlank.java.lang.String`, `NotBlank`. Any of these can be a message-source key
      to override the default message.
    ref: "concepts.md#methodargumentnotvalidexception-internals--bindingresult-vs-errors"

  - id: exception-handling-validation-070
    difficulty: expert
    tags: [jackson, ordering, type-coercion, request-body]
    question: |
      A DTO field is `@Positive Integer age`. The client sends `{"age": "not-a-number"}`. What does
      the client receive, and why?
    options:
      - "400 with a `@Positive` violation message, because validation coerces then checks"
      - "400 from `HttpMessageNotReadableException`, because Jackson cannot deserialize the value into `Integer` and body reading fails BEFORE Bean Validation runs"
      - "500, because `@Positive` throws `NumberFormatException`"
      - "400 with a `@NotNull` violation, because the field ends up null"
    answer: 1
    explanation: |
      Deserialization runs first. A non-numeric string that can't bind to `Integer` produces
      `HttpMessageNotReadableException` (400) before any constraint executes; the object is never
      constructed, so `@Positive` never fires. You cannot express "must be numeric" with `@Positive`.
    ref: "concepts.md#jackson-deserialization-vs-bean-validation-ordering--type-coercion"

  - id: exception-handling-validation-071
    difficulty: expert
    tags: [jackson, primitives, notnull, gotcha]
    question: |
      A request DTO declares `@NotNull private long id;` (primitive `long`). A client sends a JSON
      body that omits `id` entirely. What is the validation outcome?
    options:
      - "Validation fails with 'id must not be null' because the property was missing"
      - "`HttpMessageNotReadableException` because a missing primitive is a parse error"
      - "Validation passes — the missing primitive defaults to `0`, which is non-null, so `@NotNull` is satisfied; use a boxed `Long` to make it truly required"
      - "500, because `@NotNull` cannot be applied to primitives"
    answer: 2
    explanation: |
      A missing JSON property leaves a primitive at its default (`0L`), which is never null, so
      `@NotNull` is trivially satisfied and the omission goes undetected. Boxed reference types
      (`Long`) are required for meaningful presence checks.
    ref: "concepts.md#jackson-deserialization-vs-bean-validation-ordering--type-coercion"

  - id: exception-handling-validation-072
    difficulty: advanced
    tags: [jackson, enum, ordering]
    question: |
      An endpoint binds `{"status": "SHIPPPED"}` (typo) to a DTO field `@NotNull OrderStatus status`
      where `OrderStatus` is an enum. What is the most likely default result?
    options:
      - "`@NotNull` violation → 400, because the invalid enum becomes null"
      - "The value is silently coerced to the first enum constant"
      - "500 `ConstraintViolationException`"
      - "`HttpMessageNotReadableException` → 400, because Jackson cannot map the unknown value to the enum during deserialization (before validation)"
    answer: 3
    explanation: |
      An unknown enum literal is a deserialization failure (`HttpMessageNotReadableException` → 400) by
      default, occurring before Bean Validation. (Only with `READ_UNKNOWN_ENUM_VALUES_AS_NULL` would it
      bind to null and then trip `@NotNull`.)
    ref: "concepts.md#jackson-deserialization-vs-bean-validation-ordering--type-coercion"

  - id: exception-handling-validation-073
    difficulty: expert
    tags: [validator, thread-safety, concurrency]
    question: |
      A custom `ConstraintValidator` stores the value it receives in an instance field during
      `isValid` to "remember the last checked value" for logging. Under load, logs show mismatched
      values. What is the fundamental problem?
    options:
      - "`ConstraintValidator` instances are cached and reused concurrently across threads; storing per-invocation state in instance fields is not thread-safe. Validators must be stateless apart from immutable config captured in `initialize`"
      - "Hibernate Validator creates a fresh validator per call, so the field is always null"
      - "The field must be `volatile` to work"
      - "Logging inside `isValid` is prohibited and corrupts state"
    answer: 0
    explanation: |
      Validator instances are reused across concurrent requests. Only immutable configuration set in
      `initialize(annotation)` is safe; per-call mutable state in instance fields causes races. Keep
      validators stateless.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-074
    difficulty: expert
    tags: [validator, regex, redos, performance]
    question: |
      A public endpoint validates a free-text field with `@Pattern(regexp = "(a+)+$")` and no length
      constraint. What senior-level risk does this introduce?
    options:
      - "None; `@Pattern` short-circuits on the first mismatch"
      - "A catastrophic-backtracking (ReDoS) risk: a crafted input can make the regex engine run for exponential time, consuming a request thread. Bound input length (`@Size`) first and use a linear/anchored pattern"
      - "It throws `PatternSyntaxException` at startup"
      - "`@Pattern` treats null as invalid, causing spurious 400s"
    answer: 1
    explanation: |
      Nested quantifiers like `(a+)+` cause catastrophic backtracking; attacker-controlled input can
      pin a thread with exponential matching time (ReDoS). Constrain length before pattern matching and
      write linear, anchored regexes.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-075
    difficulty: expert
    tags: [validator, uniqueness, toctou, concurrency]
    question: |
      A `@UniqueEmail` validator queries the DB in `isValid`. Two concurrent registrations with the
      same email both pass validation, then one insert fails. What is the correct characterization and
      remedy?
    options:
      - "The validator is buggy; add `synchronized` to `isValid`"
      - "Bean Validation runs in a serializable transaction, so this cannot happen"
      - "This is an inherent time-of-check/time-of-use (TOCTOU) race; the DB unique constraint is the real source of truth — keep it and handle the resulting `DataIntegrityViolationException` (map to 409)"
      - "Move the check to a `@PostConstruct` method"
    answer: 2
    explanation: |
      A validation-time uniqueness check can never be atomic with the later insert under concurrency
      (TOCTOU). Rely on the database unique constraint and translate `DataIntegrityViolationException`
      into a clean 409; the validator is best-effort UX.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-076
    difficulty: advanced
    tags: [validator-factory, singleton, performance]
    question: |
      Which statement about `Validator`/`ValidatorFactory` lifecycle in a Spring Boot app is correct?
    options:
      - "You should build a new `ValidatorFactory` per request for isolation"
      - "`Validator` is not thread-safe and must be pooled"
      - "The factory is recreated on every `@Valid` invocation by Spring"
      - "`LocalValidatorFactoryBean` is a thread-safe singleton; building a `ValidatorFactory` is expensive, so it is created once and reused — do not call `Validation.buildDefaultValidatorFactory()` per request"
    answer: 3
    explanation: |
      `ValidatorFactory`/`Validator` are thread-safe; factory construction is costly. Spring exposes a
      single `LocalValidatorFactoryBean`; reuse it rather than constructing factories per request.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-077
    difficulty: expert
    tags: [group-sequence, short-circuit, performance]
    question: |
      You want cheap format checks to run before an expensive DB-backed uniqueness check, skipping the
      DB call if the format is already invalid. Which mechanism achieves ordered, short-circuiting
      validation?
    options:
      - "`@GroupSequence` defining an ordered list of groups — if an earlier group fails, later groups are not evaluated"
      - "Declaration order of the annotations on the field"
      - "`@Order` on the `ConstraintValidator`"
      - "`@ReportAsSingleViolation`"
    answer: 0
    explanation: |
      Within a single group, constraint order is unspecified and all run. `@GroupSequence` imposes
      ordering across groups and short-circuits: if an earlier group has violations, subsequent groups
      are skipped — the supported way to gate expensive checks behind cheap ones.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-078
    difficulty: advanced
    tags: [cascading, collections, dos, size]
    question: |
      Why is `@Valid List<@Valid LineItem> items;` on an unbounded request collection considered a
      potential denial-of-service surface, and what's the mitigation?
    options:
      - "It isn't; cascaded validation is constant time"
      - "Cascaded validation is O(elements × constraints); a huge list forces enormous validation work on a request thread. Bound it with `@Size(max = ...)` (validated first) to cap the cost"
      - "Lists cannot be cascaded, so it throws at runtime"
      - "Only the first element is validated, so there is no cost concern"
    answer: 1
    explanation: |
      Cascading validates every element's every constraint; an attacker sending a massive list drives
      CPU on the request path. A `@Size` bound (evaluated cheaply) caps the element count before the
      per-element cascade dominates.
    ref: "concepts.md#validator-lifecycle-thread-safety--performance"

  - id: exception-handling-validation-079
    difficulty: expert
    tags: [controller-advice, controller-local, ordering, precedence, internals]
    question: |
      A controller `OrderController` has a LOCAL `@ExceptionHandler(Exception.class)` method. Separately,
      a `@RestControllerAdvice` bean annotated `@Order(Ordered.HIGHEST_PRECEDENCE)` declares a specific
      `@ExceptionHandler(OrderNotFoundException.class)`. `OrderController` throws `OrderNotFoundException`.
      Which handler wins?
    options:
      - "The advice's specific `OrderNotFoundException` handler, because `HIGHEST_PRECEDENCE` beats any controller-local handler"
      - "The controller-local `Exception` handler, because controller-local `@ExceptionHandler` methods are always tried before ANY advice, regardless of the advice's `@Order`"
      - "Neither; a local handler plus a matching advice handler is an ambiguity error at startup"
      - "The most-specific match globally wins, so the advice's `OrderNotFoundException` handler runs"
    answer: 1
    explanation: |
      `ExceptionHandlerExceptionResolver` first looks for a matching `@ExceptionHandler` on the
      controller (handler bean) itself; only if none matches does it consult `@ControllerAdvice` beans in
      `@Order`. So a controller-local handler — even a broad `Exception` one — wins over any advice,
      irrespective of the advice's precedence. Advice `@Order` only orders advices relative to each other.
    ref: "concepts.md#order-advice-selection-and-multiple-controlleradvice-internals"

  - id: exception-handling-validation-080
    difficulty: advanced
    tags: [controller-advice, ordering, tie]
    question: |
      Two `@RestControllerAdvice` beans both declare `@Order(Ordered.LOWEST_PRECEDENCE)` and each has a
      handler that could match a thrown exception. What can you rely on for which one wins?
    options:
      - "Alphabetical bean-name order, guaranteed by Spring"
      - "Declaration order in the source file"
      - "The one in the package closest to the controller"
      - "Nothing — the relative order of advices with the same `@Order` is undefined; assign distinct orders (e.g. give the true catch-all the lowest precedence and others higher)"
    answer: 3
    explanation: |
      Equal `@Order` values leave relative ordering undefined. Never depend on it; give each advice a
      distinct, intentional order so shadowing behavior is deterministic.
    ref: "concepts.md#order-advice-selection-and-multiple-controlleradvice-internals"

  - id: exception-handling-validation-081
    difficulty: expert
    tags: [exception-handler, ambiguous, startup]
    question: |
      A `@RestControllerAdvice` class contains two methods: `@ExceptionHandler(IllegalArgumentException.class)`
      on `handleA` and `@ExceptionHandler(IllegalArgumentException.class)` on `handleB`. What happens?
    options:
      - "An `IllegalStateException` ('Ambiguous @ExceptionHandler method mapped') is raised when the resolver builds its method cache — effectively at startup/first use, not per request"
      - "At request time Spring randomly picks one"
      - "Both run in declaration order"
      - "It compiles and the second silently overrides the first"
    answer: 0
    explanation: |
      Two handlers mapping the exact same exception type in one class are ambiguous; the resolver's
      method cache construction throws `IllegalStateException` ("Ambiguous @ExceptionHandler method
      mapped"). It's a wiring error surfaced early, not a runtime coin-flip.
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-082
    difficulty: expert
    tags: [exception-handler, handler-throws, failure-mode]
    question: |
      Inside a matched `@ExceptionHandler`, the handler body itself throws a new exception (e.g. an NPE
      building the error DTO). What does Spring do?
    options:
      - "It re-dispatches the new exception to other `@ExceptionHandler` methods until one matches"
      - "The new exception is NOT re-routed to other handlers; it propagates out of the resolver and typically results in a container 500 (Whitelabel/`/error`). Handlers must be defensive"
      - "It falls back to the original exception's `@ResponseStatus`"
      - "It retries the handler up to three times"
    answer: 1
    explanation: |
      Exception-handler methods are not recursively re-resolved; an exception escaping a handler
      propagates and usually yields a raw 500 via error-dispatch. Keep handlers simple and null-safe.
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-083
    difficulty: advanced
    tags: [exception-handler, async, deferred-result]
    question: |
      A controller returns `CompletableFuture<Order>` and the future completes exceptionally with
      `OrderNotFoundException`. Is your `@ExceptionHandler(OrderNotFoundException.class)` invoked?
    options:
      - "No — async results bypass exception resolvers entirely"
      - "Only if you annotate the method with `@Async`"
      - "Yes — when the async result is dispatched back, the completing exception is routed through the same `@ExceptionHandler` machinery"
      - "Only for `DeferredResult`, never `CompletableFuture`"
    answer: 2
    explanation: |
      On async dispatch, an exception that completed the `CompletableFuture`/`DeferredResult`
      exceptionally is handled by the normal `@ExceptionHandler`/advice resolution. (A synchronous throw
      while producing the wrapper is handled inline.)
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-084
    difficulty: advanced
    tags: [exception-handler, restcontrolleradvice, view-name, misconfig]
    question: |
      A handler in a plain `@ControllerAdvice` (NOT `@RestControllerAdvice`) returns a `String`
      `"An error occurred"` intending it as the JSON body. What is the likely result?
    options:
      - "The client receives the literal JSON string body"
      - "A 204 No Content with the string in a header"
      - "Compilation fails"
      - "Spring treats the `String` as a VIEW NAME and tries to resolve a view called 'An error occurred', typically failing (500 / view-not-found). Use `@RestControllerAdvice` or `@ResponseBody`"
    answer: 3
    explanation: |
      Without `@ResponseBody` (which `@RestControllerAdvice` adds), a returned `String` is interpreted
      as a logical view name and goes through view resolution — not serialized as the body. This is a
      classic advice misconfiguration.
    ref: "concepts.md#order-advice-selection-and-multiple-controlleradvice-internals"

  - id: exception-handling-validation-085
    difficulty: advanced
    tags: [resolver-chain, fallthrough, error-dispatch]
    question: |
      No local `@ExceptionHandler` and no `@ControllerAdvice` handler matches a thrown exception. In
      what order are the remaining resolvers/mechanisms consulted?
    options:
      - "`ExceptionHandlerExceptionResolver` → `ResponseStatusExceptionResolver` → `DefaultHandlerExceptionResolver` → servlet error-dispatch (`/error`)"
      - "`DefaultHandlerExceptionResolver` → `ResponseStatusExceptionResolver` → servlet error-dispatch"
      - "It immediately renders the Whitelabel page, skipping all resolvers"
      - "It is routed back to the controller's first handler method"
    answer: 0
    explanation: |
      The default resolver chain is `ExceptionHandlerExceptionResolver` (annotation handlers), then
      `ResponseStatusExceptionResolver` (`@ResponseStatus`/`ResponseStatusException`), then
      `DefaultHandlerExceptionResolver` (built-in MVC exceptions). If none handles it, it falls through
      to servlet error-dispatch and `/error`.
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-086
    difficulty: expert
    tags: [group-sequence, default-redefinition]
    question: |
      Placing `@GroupSequence({BasicChecks.class, MyEntity.class})` directly ON the class `MyEntity`
      accomplishes what?
    options:
      - "It disables the `Default` group entirely for `MyEntity`"
      - "It redefines the `Default` group for `MyEntity` to be an ordered sequence (BasicChecks first, then MyEntity's own default constraints), short-circuiting if BasicChecks fails — so callers validating the default group get ordered validation without naming groups"
      - "It makes every constraint belong to `BasicChecks`"
      - "It causes a `GroupDefinitionException` because a class cannot reference itself"
    answer: 1
    explanation: |
      A class-level `@GroupSequence` listing the class itself redefines that class's `Default` group as
      an ordered sequence with short-circuiting between phases, letting default-group validation run
      cheap checks before expensive ones without callers selecting groups explicitly.
    ref: "concepts.md#validation-groups-sequences-inheritance--default-group-redefinition"

  - id: exception-handling-validation-087
    difficulty: expert
    tags: [groups, inheritance, default]
    question: |
      Given `interface OnUpdate extends Default {}` and a DTO with `@NotBlank private String name;`
      (no group → Default) plus `@NotNull(groups = OnUpdate.class) private Long id;`. A request uses
      `@Validated(OnUpdate.class)`. Which constraints are evaluated?
    options:
      - "Only the `@NotNull` on `id`, because only the `OnUpdate` group was requested"
      - "Only the `@NotBlank` on `name`"
      - "Both the `@NotNull` on `id` AND the `@NotBlank` on `name`, because `OnUpdate extends Default` so validating `OnUpdate` also validates the `Default` group"
      - "Neither, because groups and default cannot be mixed"
    answer: 2
    explanation: |
      Because `OnUpdate extends Default`, requesting `OnUpdate` also pulls in the `Default` group, so
      both the default `@NotBlank` and the `OnUpdate`-scoped `@NotNull` run. Group inheritance is the
      idiomatic way to say "everything default, plus update-only rules."
    ref: "concepts.md#validation-groups-sequences-inheritance--default-group-redefinition"

  - id: exception-handling-validation-088
    difficulty: expert
    tags: [convert-group, cascade, groups]
    question: |
      `@ConvertGroup(from = Default.class, to = Strict.class)` is placed alongside `@Valid` on a nested
      `Address` field. What does it do, and where is it valid?
    options:
      - "It converts the top-level requested group before validation begins; valid on any parameter"
      - "It merges the two groups into a combined group for the whole object graph"
      - "It is an alias for `@GroupSequence`"
      - "It remaps the group ONLY as validation cascades into the nested `Address` (so when the parent is validated with `Default`, `Address` is validated with `Strict`); it is meaningful only on a cascaded `@Valid` reference"
    answer: 3
    explanation: |
      `@ConvertGroup` only applies at a cascade boundary (`@Valid`), translating the group as validation
      descends into the nested bean. It cannot convert the top-level requested group.
    ref: "concepts.md#validation-groups-sequences-inheritance--default-group-redefinition"

  - id: exception-handling-validation-089
    difficulty: advanced
    tags: [groups, cascade, propagation, bug]
    question: |
      A parent is validated with `@Validated(OnCreate.class)` and has `@Valid Address address;`.
      `Address.zip` is annotated `@NotBlank` with NO group (i.e. `Default`). The zip is blank but no
      violation is reported. Why?
    options:
      - "The requested group `OnCreate` propagates down the cascade unchanged; `Address.zip`'s constraint is in the `Default` group, which is not being validated, so it doesn't run. Assign it to `OnCreate` (or make `OnCreate extends Default`, or use `@ConvertGroup`)"
      - "`@Valid` does not cascade groups at all"
      - "Nested validation always uses the `Default` group regardless of the parent"
      - "`@NotBlank` is ignored on nested beans"
    answer: 0
    explanation: |
      The active group propagates unchanged across `@Valid` (absent `@ConvertGroup`). A nested
      `Default`-group constraint won't fire when only `OnCreate` is validated. Align the groups or
      convert them.
    ref: "concepts.md#validation-groups-sequences-inheritance--default-group-redefinition"

  - id: exception-handling-validation-090
    difficulty: expert
    tags: [response-status, reason, message-source]
    question: |
      A custom exception is annotated `@ResponseStatus(value = HttpStatus.FORBIDDEN, reason = "Access denied")`
      and is thrown. What is a correct and important consequence of specifying `reason`?
    options:
      - "The `reason` becomes an extension member of a `ProblemDetail`"
      - "Specifying `reason` causes Spring to call `HttpServletResponse.sendError(...)`, which routes through the container error page / `/error` dispatch rather than writing the body directly — so a body you tried to return is discarded"
      - "`reason` is ignored unless combined with `@ExceptionHandler`"
      - "`reason` sets the `Location` header"
    answer: 1
    explanation: |
      When `@ResponseStatus` has a `reason`, `ResponseStatusExceptionResolver` uses
      `response.sendError(status, reason)`, triggering error-dispatch (`/error`) instead of a direct
      body write. This surprises developers expecting to also control the body.
    ref: "concepts.md#mapping-exceptions-to-status-codes"

  - id: exception-handling-validation-091
    difficulty: advanced
    tags: [response-status-exception, error-response, spring6]
    question: |
      In Spring 6, how does a thrown `ResponseStatusException` integrate with RFC 7807 responses?
    options:
      - "It cannot produce `ProblemDetail`; you must catch and convert it"
      - "It always renders as plain text"
      - "`ResponseStatusException` implements `ErrorResponse` and carries a `ProblemDetail`, so it can be rendered as `application/problem+json` (and you can set properties on its body)"
      - "It is deprecated in favor of `ProblemDetailException`"
    answer: 2
    explanation: |
      In Spring 6, `ResponseStatusException` implements `ErrorResponse`, exposing a `ProblemDetail` body
      and headers, enabling uniform RFC 7807 rendering.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-092
    difficulty: expert
    tags: [problemdetail, spring6, jackson, non-null]
    question: |
      You return a `ProblemDetail` but only see `type`, `title`, `status`, `detail`, `instance` — your
      `setProperty("traceId", null)` value is missing from the JSON. Which explanation is most accurate?
    options:
      - "`setProperty` silently rejects null keys"
      - "Extension members are never serialized"
      - "You must call `flushProperties()` before returning"
      - "`ProblemDetail` serialization typically omits null-valued members (and `type` defaults to `about:blank` if unset); a null extension value simply isn't emitted — set a non-null value if you need the field present"
    answer: 3
    explanation: |
      Null values are not rendered (standard JSON null-omission behavior for the problem body), and an
      unset `type` defaults to `about:blank`. To surface a field, give it a non-null value.
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-093
    difficulty: expert
    tags: [problemdetail, controlleradvice, content-negotiation]
    question: |
      A global handler returns a `ProblemDetail`, but a client sending `Accept: application/xml`
      receives a 406 instead of the problem body. What is the underlying cause?
    options:
      - "Content negotiation still applies to error responses: the configured message converters could not produce a representation matching the `Accept` header (no XML/problem+xml converter registered), so a 406 results. Register an appropriate converter or the client must accept `application/problem+json`/`application/json`"
      - "`ProblemDetail` can only be JSON; it never supports XML"
      - "`ProblemDetail` disables content negotiation globally"
      - "The advice must be annotated `@Produces`"
    answer: 0
    explanation: |
      Error responses go through the same `HttpMessageConverter`/content-negotiation pipeline. If no
      converter can satisfy the requested `Accept`, you get 406. Ensure a converter for the requested
      media type exists (or constrain what clients accept).
    ref: "concepts.md#global-exception-handling--consistent-error-responses-problemdetail--rfc-7807"

  - id: exception-handling-validation-094
    difficulty: advanced
    tags: [self-invocation, method-validation, proxy]
    question: |
      A `@Validated` service bean has `public void a()` calling `this.b(null)` where
      `public void b(@NotNull String s)`. `a()` is invoked externally. Is `b`'s `@NotNull` enforced?
    options:
      - "Yes — validation applies to all internal calls"
      - "No — `this.b(...)` is a self-invocation that bypasses the AOP proxy, so method validation on `b` is skipped (same limitation as `@Transactional` self-invocation)"
      - "Yes, but only if `b` is `private`"
      - "It throws `ConstraintDeclarationException` at startup"
    answer: 1
    explanation: |
      The AOP-based method validation only intercepts calls that go through the proxy. An internal
      `this.b(...)` call bypasses the proxy, so `b`'s parameter constraint is not enforced.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-095
    difficulty: expert
    tags: [method-validation, return-value, aop]
    question: |
      On a `@Validated` service bean, a method is annotated with a constraint on its RETURN value:
      `@NotNull public Foo find(...)`, and it returns null. What happens and when?
    options:
      - "Nothing; return-value constraints are not supported"
      - "The null is validated before the method runs, so the body never executes"
      - "A `ConstraintViolationException` is thrown AFTER the method executes (the proxy validates the returned value), so the caller sees the violation rather than the null"
      - "It is validated only if the caller adds `@Valid`"
    answer: 2
    explanation: |
      Method validation supports return-value constraints: the proxy invokes the method, then validates
      the returned value; a null return against `@NotNull` triggers `ConstraintViolationException`
      post-invocation.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-096
    difficulty: advanced
    tags: [custom-message, el, interpolation, security]
    question: |
      A validator builds a message with `ctx.buildConstraintViolationWithTemplate("Value " + userInput + " rejected")`
      where `userInput` is attacker-controlled and may contain `${...}`. What is the risk?
    options:
      - "None; templates are plain strings"
      - "It always throws `PatternSyntaxException`"
      - "The message is truncated to 255 chars"
      - "The default message interpolator evaluates `${...}` / EL-like expressions in the template, so interpolating untrusted input into the template can lead to expression-injection/information disclosure. Put dynamic values in message PARAMETERS/attributes, not concatenated into the template"
    answer: 3
    explanation: |
      Message templates are subject to parameter/EL interpolation. Concatenating untrusted input into
      the template risks expression evaluation of `${...}`. Pass dynamic content via attributes/message
      parameters (or escape it), never by building the template from raw user input.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-097
    difficulty: expert
    tags: [report-as-single-violation, composed-constraint]
    question: |
      A composed constraint `@StrongPassword` meta-annotates `@Size(min=8)`, `@Pattern(digit)`,
      `@Pattern(upper)`. Without `@ReportAsSingleViolation`, a weak password produces multiple messages;
      the team wants exactly one "password not strong enough" message. What is the correct change?
    options:
      - "Add `@ReportAsSingleViolation` to the `@StrongPassword` annotation definition so the composing constraints' violations are collapsed into a single reported violation using the composed constraint's message"
      - "Set `groups` on each composing constraint"
      - "Add `@ReportAsSingleViolation` to the field usage site"
      - "Override `getConstraintDescriptor` in a validator"
    answer: 0
    explanation: |
      `@ReportAsSingleViolation` on the composed constraint definition suppresses the individual
      composing violations and reports one violation with the composed constraint's message.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-098
    difficulty: advanced
    tags: [class-level-constraint, null-payload, cross-field]
    question: |
      A class-level cross-field validator (`@PasswordsMatch` on the type) receives the bean instance in
      `isValid`. If the whole object could be null (e.g. an optional nested `@Valid` reference that is
      null), what is the recommended handling?
    options:
      - "Throw `NullPointerException` to signal misuse"
      - "Return `true` when the object is null (let a separate `@NotNull` on the reference handle nullness), keeping the cross-field validator focused only on comparing fields of a present object"
      - "Return `false` to reject nulls"
      - "Class-level validators never receive null; no handling needed"
    answer: 1
    explanation: |
      Following the null convention, a class-level validator should return `true` for a null target and
      leave presence to `@NotNull`, so constraints stay composable and NPE-free.
    ref: "concepts.md#custom-constraint-validators"

  - id: exception-handling-validation-099
    difficulty: expert
    tags: [filter, security, exception-handler, edge-case]
    question: |
      A Spring Security authentication filter throwing `AuthenticationException` runs before the
      DispatcherServlet. A team adds `@ExceptionHandler(AuthenticationException.class)` in a
      `@RestControllerAdvice` but it never fires for auth failures. Why, and what's the right layer?
    options:
      - "The advice needs `@Order(0)`"
      - "`AuthenticationException` is checked and cannot be handled"
      - "Filter-thrown exceptions occur OUTSIDE DispatcherServlet's handler invocation, so `@ExceptionHandler`/advice cannot see them; auth errors must be handled at the filter layer (e.g. `AuthenticationEntryPoint`/`AccessDeniedHandler`) or via an error-page mapping"
      - "You must annotate the filter with `@ControllerAdvice`"
    answer: 2
    explanation: |
      `@ExceptionHandler`/`@ControllerAdvice` resolution only covers exceptions within the handler
      invocation. Security filters run earlier; their exceptions are handled by Security's
      `AuthenticationEntryPoint`/`AccessDeniedHandler` (or servlet error pages), not MVC advice.
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-100
    difficulty: advanced
    tags: [webflux, reactive, error-signal, edge-case]
    question: |
      In a WebFlux `@RestControllerAdvice`, an `@ExceptionHandler(BusinessException.class)` handles
      errors from most endpoints but misses one where the exception is thrown inside a `.map(...)`
      lambda that was written to `throw` rather than signal. Which statement is most accurate?
    options:
      - "WebFlux never supports `@ExceptionHandler`"
      - "You must use `@ControllerAdvice` not `@RestControllerAdvice` in WebFlux"
      - "Reactive errors always yield 500 regardless of handlers"
      - "To be routed to `@ExceptionHandler`, the error must be propagated as an error SIGNAL in the reactive pipeline; a `throw` inside an operator is generally captured by the operator and turned into an error signal, but code that escapes the reactive chain (e.g. thrown before the pipeline is assembled, or on a different thread) will not be caught"
    answer: 3
    explanation: |
      Reactive error handling depends on errors flowing as error signals through the pipeline. Throws
      inside standard operators are captured into signals and reach `@ExceptionHandler`, but exceptions
      that escape assembly-time or run off the reactive chain are not routed to the advice.
    ref: "concepts.md#exceptionhandler-resolution-edge-cases--failure-modes"

  - id: exception-handling-validation-101
    difficulty: expert
    tags: [handler-method-validation, visitor, api]
    question: |
      To render structured per-parameter details from a `HandlerMethodValidationException`, which API
      does Spring provide?
    options:
      - "`ex.visitResults(new HandlerMethodValidationException.Visitor(){...})` plus `getAllValidationResults()`/`getParameterValidationResults()`, exposing `ParameterValidationResult`/`ParameterErrors` grouped by parameter (with typed callbacks for `requestParam`, `pathVariable`, `modelAttribute`, etc.)"
      - "`ex.getBindingResult().getFieldErrors()` — it extends `BindException`"
      - "`ex.getConstraintViolations()` — it wraps `ConstraintViolationException`"
      - "There is no structured API; only `getMessage()`"
    answer: 0
    explanation: |
      `HandlerMethodValidationException` exposes `ParameterValidationResult`s (and `ParameterErrors` for
      cascaded objects) and a `Visitor` with typed callbacks (`requestParam`, `pathVariable`,
      `modelAttribute`, `other`) for building tailored error payloads.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-102
    difficulty: advanced
    tags: [required-flag, notnull, best-practice, spring6.1]
    question: |
      For a required `@RequestBody` in Spring 6.1+, which approach does the framework guidance prefer
      for enforcing presence, and why?
    options:
      - "Put `@NotNull` on the `@RequestBody` parameter, because it reads most naturally"
      - "Use the `required` flag of `@RequestBody` (`@RequestBody(required = true)`, the default) rather than adding a constraint like `@NotNull` on the parameter — adding a bare constraint would push the whole method into method-level validation semantics unnecessarily"
      - "Return `Optional<T>` from the deserializer"
      - "Add a class-level `@Validated`"
    answer: 1
    explanation: |
      The `required` flag already enforces body presence. Adding `@NotNull` (a constraint) directly on
      the parameter would trigger method-level validation for the method — usually not what you want for
      a command object; prefer the `required` flag.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-103
    difficulty: expert
    tags: [binding-result, method-validation, spring6.1, edge-case]
    question: |
      In Spring 6.1 built-in method validation, a handler is
      `search(@RequestParam @Min(1) int page, @RequestParam @Max(50) int size, BindingResult result)`.
      A request sends `page=0` (violates `@Min`). Given the built-in support's rule about `Errors`
      parameters, what happens?
    options:
      - "The method is invoked normally with the error recorded in `result`, always"
      - "`BindingResult` is illegal with `@RequestParam` and fails at startup"
      - "The method is invoked ONLY if all validation errors are on parameters immediately followed by an `Errors`/`BindingResult`; since `page` (the erroring param) is not immediately followed by an `Errors`, `HandlerMethodValidationException` is raised instead"
      - "It always throws `ConstraintViolationException`"
    answer: 2
    explanation: |
      The built-in support only proceeds into the method when every error is on a parameter directly
      followed by an `Errors`. A constrained simple param not paired that way makes Spring raise
      `HandlerMethodValidationException` rather than silently passing the error via `BindingResult`.
    ref: "concepts.md#method-validation-internals-spring-61--handlermethodvalidationexception"

  - id: exception-handling-validation-104
    difficulty: intermediate
    tags: [validation-groups, default, notnull-null-combo]
    question: |
      A DTO field is `@Null(groups = OnCreate.class) @NotNull(groups = OnUpdate.class) Long id;`.
      Which statement is correct?
    options:
      - "The two constraints conflict and cause a startup error"
      - "Both constraints always run regardless of group"
      - "`@Null` and `@NotNull` cannot coexist on one field"
      - "On create (`@Validated(OnCreate.class)`) `id` must be null, and on update (`@Validated(OnUpdate.class)`) `id` must be non-null — the same field enforces opposite rules per group"
    answer: 3
    explanation: |
      Group-scoped constraints let one field enforce different rules per operation: `@Null` for
      `OnCreate` (id must be absent) and `@NotNull` for `OnUpdate` (id required). Only the constraints in
      the requested group run, so there is no conflict.
    ref: "concepts.md#valid-vs-validated-groups"
