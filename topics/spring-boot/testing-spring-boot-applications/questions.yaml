topic: "Testing Spring Boot Applications"
domain: spring-boot
topic_slug: testing-spring-boot-applications
version: 1
questions:
  - id: testing-spring-boot-applications-001
    difficulty: beginner
    tags: [test-pyramid, strategy]
    question: |
      According to the test pyramid, which category of tests should be the most
      numerous in a well-balanced Spring Boot suite?
    options:
      - "Fast unit tests of individual classes with collaborators mocked"
      - "Full end-to-end tests with a running server and real database"
      - "Slice tests such as @WebMvcTest and @DataJpaTest"
      - "Manual exploratory tests carried out by QA before each release"
    answer: 0
    explanation: |
      The pyramid's wide base is fast, isolated unit tests. Slices are the middle
      band and full e2e tests the narrow top. Inverting this (mostly e2e) is the
      "ice-cream cone" anti-pattern that makes suites slow and brittle.
    ref: "concepts.md#test-pyramid-in-spring-boot"

  - id: testing-spring-boot-applications-002
    difficulty: beginner
    tags: [dependencies, starter]
    question: |
      Which single dependency brings JUnit 5, Mockito, AssertJ, Hamcrest,
      JSONassert and JsonPath into a Spring Boot project for testing?
    options:
      - "spring-boot-starter-web"
      - "spring-boot-starter-data-jpa"
      - "junit-jupiter-engine"
      - "spring-boot-starter-test"
    answer: 3
    explanation: |
      spring-boot-starter-test aggregates the standard testing libraries
      (JUnit 5, Mockito, AssertJ, Hamcrest, JSONassert, JsonPath, Spring Test)
      so you don't declare each individually.
    ref: "concepts.md#test-pyramid-in-spring-boot"

  - id: testing-spring-boot-applications-003
    difficulty: beginner
    tags: [springboottest, context]
    question: |
      What does @SpringBootTest load by default?
    options:
      - "Only the @Controller and @RestController beans, along with the auto-configured MockMvc"
      - "Only the JPA repositories, entities, and an embedded in-memory DataSource for them"
      - "The entire application context, discovered from the @SpringBootConfiguration class"
      - "Nothing at runtime — it is a marker annotation read only by the build tooling"
    answer: 2
    explanation: |
      @SpringBootTest searches upward for the @SpringBootConfiguration
      (typically your @SpringBootApplication) and loads the full context with all
      auto-configuration and beans, making it the tool for broad integration tests.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-004
    difficulty: intermediate
    tags: [springboottest, webenvironment]
    question: |
      What is the default value of @SpringBootTest's webEnvironment attribute,
      and what does it do?
    options:
      - "RANDOM_PORT — starts a real embedded server on a random free port"
      - "DEFINED_PORT — starts a real server on the configured port"
      - "MOCK — provides a mock servlet environment without a real server"
      - "NONE — no web environment is created and a random free port is still opened"
    answer: 2
    explanation: |
      The default is WebEnvironment.MOCK: it loads the web layer but does not
      start a real HTTP server. MockMvc is auto-configured against it; you need
      RANDOM_PORT/DEFINED_PORT for a real socket.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-005
    difficulty: intermediate
    tags: [springboottest, webenvironment, trap]
    question: |
      A test uses @SpringBootTest (no attributes) and autowires TestRestTemplate
      to hit http://localhost:${port}/orders, but every call fails with
      "connection refused." What is the fix?
    options:
      - "Add @AutoConfigureMockMvc so the embedded server boots and binds the port"
      - "Replace TestRestTemplate with MockMvc — TestRestTemplate is deprecated"
      - "Set webEnvironment = WebEnvironment.RANDOM_PORT so a real server actually starts"
      - "Add @Transactional so the request commits and the connection is released"
    answer: 2
    explanation: |
      The default MOCK environment starts no real server, so there is nothing
      listening on a port. TestRestTemplate makes real HTTP calls and needs
      RANDOM_PORT (or DEFINED_PORT) to have a running embedded server.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-006
    difficulty: intermediate
    tags: [springboottest, port-injection]
    question: |
      With webEnvironment = RANDOM_PORT, how do you obtain the actual port the
      embedded server bound to?
    options:
      - "Inject it with @LocalServerPort (or @Value(\"${local.server.port}\"))"
      - "It is always 8080, since RANDOM_PORT only randomizes the management port"
      - "Read it from System.getProperty(\"server.port\"), which Boot sets at startup"
      - "Call ServletContext.getPort() on the autowired servlet context instance"
    answer: 0
    explanation: |
      A random free port is chosen at startup and exposed via the
      local.server.port property, most conveniently injected with @LocalServerPort.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-007
    difficulty: beginner
    tags: [webmvctest, web-slice]
    question: |
      Which beans does @WebMvcTest load into the context?
    options:
      - "Every bean in the application, exactly like a full @SpringBootTest context"
      - "Only the JPA repositories and their backing embedded DataSource"
      - "Only @Service and @Component beans, with controllers deliberately excluded"
      - "Web-layer beans (controllers, @ControllerAdvice, converters, filters) plus MockMvc, but not @Service/@Repository"
    answer: 3
    explanation: |
      @WebMvcTest restricts the context to MVC infrastructure and controllers and
      auto-configures MockMvc. Service and repository beans are deliberately
      excluded, so collaborators must be mocked.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-008
    difficulty: intermediate
    tags: [webmvctest, trap, missing-bean]
    question: |
      A @WebMvcTest(OrderController.class) fails at context startup with
      "No qualifying bean of type OrderService available." Why, and what is the
      idiomatic fix?
    options:
      - "The controller wasn't detected; annotate it with @RestController so the slice can register it"
      - "You must switch to @SpringBootTest — slices cannot inject services"
      - "@WebMvcTest doesn't load @Service beans; provide OrderService as a @MockitoBean/@MockBean"
      - "OrderService needs @Lazy so it is created after the controller"
    answer: 2
    explanation: |
      The web slice intentionally omits service/repository beans. The controller
      still needs its OrderService dependency, so you supply a mock bean
      (@MockitoBean in Boot 3.4+, otherwise @MockBean) that Spring injects.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-009
    difficulty: advanced
    tags: [webmvctest, security, gotcha]
    question: |
      In a @WebMvcTest, a GET to a normally-open endpoint unexpectedly returns
      401. What is the most likely explanation?
    options:
      - "@WebMvcTest disables all controllers by default, returning 401 until one is enabled"
      - "MockMvc always requires authentication and injects a synthetic 401 on the first request"
      - "The endpoint must be annotated @PermitAll for MockMvc to treat it as publicly accessible"
      - "Spring Security auto-configuration is applied in the slice, so requests are secured unless you add @WithMockUser or configure security"
    answer: 3
    explanation: |
      @WebMvcTest applies Spring Security auto-config when Security is on the
      classpath, so protected requests get 401/403. Use @WithMockUser or supply a
      test SecurityFilterChain to authenticate.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-010
    difficulty: intermediate
    tags: [webmvctest, webflux]
    question: |
      For testing a reactive WebFlux controller in a slice (auto-configuring
      WebTestClient), which annotation should you use?
    options:
      - "@WebMvcTest"
      - "@DataJpaTest"
      - "@WebFluxTest"
      - "@JsonTest"
    answer: 2
    explanation: |
      @WebFluxTest is the reactive counterpart of @WebMvcTest; it loads the
      WebFlux web slice and auto-configures WebTestClient. @WebMvcTest targets the
      servlet stack.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-011
    difficulty: beginner
    tags: [datajpatest, defaults]
    question: |
      By default, against what database does @DataJpaTest run if an embedded
      driver (e.g. H2) is on the classpath?
    options:
      - "An in-memory embedded database that replaces the configured DataSource"
      - "The production database configured in application.properties"
      - "No database at all — repositories are replaced with Mockito mocks automatically"
      - "A Testcontainers Postgres instance that the slice launches via Docker on startup"
    answer: 0
    explanation: |
      @DataJpaTest defaults to replacing the configured DataSource with an
      embedded in-memory DB (via @AutoConfigureTestDatabase). Set
      replace = Replace.NONE to use the real configured database.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-012
    difficulty: beginner
    tags: [datajpatest, rollback]
    question: |
      What happens to the data written during a @DataJpaTest test method by
      default when the method finishes?
    options:
      - "It is committed to the database as soon as the method returns normally"
      - "It is written to a temporary WAL file and replayed for the next test method"
      - "It remains in the database until the class-level @AfterAll callback clears it"
      - "It is rolled back, so tests don't interfere with each other"
    answer: 3
    explanation: |
      @DataJpaTest is @Transactional and rolls back at the end of each method by
      default, keeping the database clean between tests.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-013
    difficulty: advanced
    tags: [datajpatest, testcontainers, real-db]
    question: |
      You want @DataJpaTest to run repository tests against a real Postgres
      (via Testcontainers) instead of H2. Which configuration is required?
    options:
      - "@DataJpaTest(realDatabase = true) to opt out of the embedded database replacement"
      - "@SpringBootTest instead, because @DataJpaTest can never talk to a real database"
      - "@AutoConfigureTestDatabase(replace = Replace.NONE) so the auto-replacement of the DataSource is disabled"
      - "Remove @DataJpaTest's default @Transactional with @Commit"
    answer: 2
    explanation: |
      @DataJpaTest replaces the DataSource with an embedded DB by default. Adding
      @AutoConfigureTestDatabase(replace = Replace.NONE) keeps the real configured
      DataSource, which you point at the Testcontainers Postgres.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-014
    difficulty: advanced
    tags: [datajpatest, flush, gotcha]
    question: |
      A @DataJpaTest persists an entity that violates a NOT NULL constraint, yet
      the test does not fail. What is the most likely reason?
    options:
      - "H2 silently ignores NOT NULL constraints unless it runs in strict MySQL mode"
      - "@DataJpaTest disables all constraint checking to keep persistence tests fast"
      - "The entity was served from the Hibernate second-level cache without touching the DB"
      - "The persist was buffered in the persistence context and never flushed, so the INSERT (and its constraint check) didn't run before the method's rollback"
    answer: 3
    explanation: |
      Inside the test transaction, JPA may defer the INSERT until flush/commit.
      Since the test rolls back, the SQL may never execute. Use
      persistAndFlush()/flush() to force it and surface the violation.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-015
    difficulty: intermediate
    tags: [datajpatest, testentitymanager]
    question: |
      What is TestEntityManager (available in @DataJpaTest) primarily used for?
    options:
      - "A test-friendly wrapper around EntityManager for setting up and flushing entities (e.g. persistAndFlush)"
      - "Mocking the repository layer so queries return canned results without a DB"
      - "Starting an embedded web server so repositories can be tested over HTTP"
      - "Configuring the Jackson ObjectMapper used to serialize entities to JSON"
    answer: 0
    explanation: |
      TestEntityManager is an alternative to the standard JPA EntityManager
      offering convenience methods (persist, persistAndFlush, find) tailored to
      arranging test fixtures.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-016
    difficulty: beginner
    tags: [jsontest, serialization]
    question: |
      What is @JsonTest designed to test?
    options:
      - "Controller request mappings, verifying that URLs route to the right handler methods"
      - "Database queries, checking that repository methods return the expected persisted rows"
      - "Outbound REST calls, asserting the request/response contract against a remote service"
      - "JSON serialization/deserialization (marshalling) in isolation, auto-configuring Jackson/Gson and testers"
    answer: 3
    explanation: |
      @JsonTest sets up the JSON mapping infrastructure (Jackson ObjectMapper,
      JacksonTester, etc.) plus AssertJ/JSONassert/JsonPath so you can verify how
      objects serialize/deserialize without a full context.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-017
    difficulty: intermediate
    tags: [restclienttest, mockrestserviceserver]
    question: |
      @RestClientTest auto-configures which component so you can stub outbound
      HTTP responses without a real remote server?
    options:
      - "MockMvc"
      - "TestRestTemplate"
      - "MockRestServiceServer"
      - "EmbeddedKafkaBroker"
    answer: 2
    explanation: |
      @RestClientTest tests beans that call remote services (RestTemplate/
      RestClient/WebClient) and provides a MockRestServiceServer to declare
      expected requests and stubbed responses.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-018
    difficulty: intermediate
    tags: [restclienttest, scenario]
    question: |
      You have a WeatherClient that uses a RestTemplate built from
      RestTemplateBuilder to fetch data from an external API. Which is the most
      appropriate, fastest way to unit-test its request/response handling?
    options:
      - "@SpringBootTest(webEnvironment = RANDOM_PORT) and call the real external API"
      - "@DataJpaTest so the client shares the test's rolled-back transaction and connection"
      - "@WebMvcTest(WeatherClient.class) with MockMvc driving the client through the servlet"
      - "@RestClientTest(WeatherClient.class) with MockRestServiceServer to stub the remote responses"
    answer: 3
    explanation: |
      @RestClientTest loads just the client and its REST infrastructure and gives
      you MockRestServiceServer to define expected requests and canned responses —
      no real network, no full context.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-019
    difficulty: intermediate
    tags: [slices, meta-annotation]
    question: |
      Slice annotations like @WebMvcTest and @DataJpaTest limit which beans load
      primarily by combining which mechanisms?
    options:
      - "Only a narrowed @ComponentScan whose basePackages are computed from the test's own package"
      - "Reflection that parses the test class name at runtime to decide which stereotypes to register"
      - "A set of @AutoConfigure... annotations plus @TypeExcludeFilters that exclude beans outside the slice"
      - "A runtime SecurityManager that blocks any bean outside the slice's declared package from loading"
    answer: 2
    explanation: |
      Each slice is a composed annotation bundling @BootstrapWith, targeted
      @AutoConfigure... annotations, and @TypeExcludeFilters to keep only the
      relevant bean types, producing a minimal focused context.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-020
    difficulty: intermediate
    tags: [context-caching, performance]
    question: |
      Why does the Spring TestContext framework cache application contexts across
      test classes?
    options:
      - "Because building a context is expensive; identical configurations reuse the same cached context, dramatically speeding suites"
      - "To reduce memory usage by having the production runtime and the test suite share a single pool of singleton beans"
      - "To guarantee that every test class runs in a fixed, deterministic order defined by the cache insertion sequence"
      - "To avoid initializing the JUnit platform engine more than once per suite, which would otherwise double startup time"
    answer: 0
    explanation: |
      Context creation is costly. The framework keys contexts by their
      configuration and reuses a cached context when a later test requests an
      identical setup — the biggest lever on suite speed.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-021
    difficulty: advanced
    tags: [context-caching, cache-key]
    question: |
      Which of the following will NOT, by itself, cause a new (separate) cached
      application context to be created?
    options:
      - "Adding a @MockitoBean/@MockBean to one test class but not the otherwise-identical sibling class"
      - "Using a different @ActiveProfiles value than an otherwise-identically-configured test class uses"
      - "Setting different properties via @TestPropertySource than a sibling test class declares"
      - "Adding a new @Test method to an existing test class with unchanged configuration"
    answer: 3
    explanation: |
      The cache key is the context configuration (profiles, properties, mock
      definitions, web env, etc.). Adding another test method to a class with the
      same configuration reuses the existing context; the other options change the
      key and force a new context.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-022
    difficulty: advanced
    tags: [context-caching, dirtiescontext]
    question: |
      What is the effect of @DirtiesContext, and why should it be used sparingly?
    options:
      - "It marks the context as dirty so it is closed and removed from the cache, forcing a costly rebuild for the next test"
      - "It truncates every table in the configured DataSource between tests to guarantee a clean database"
      - "It disables Spring Security auto-configuration for the annotated test so protected endpoints return 200"
      - "It automatically resets all Mockito mocks and re-applies their recorded stubbings before each method"
    answer: 0
    explanation: |
      @DirtiesContext evicts and closes the cached context, so subsequent tests
      must build a fresh one. Overusing it defeats context caching and slows the
      suite significantly.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-023
    difficulty: advanced
    tags: [context-caching, cache-size]
    question: |
      What is the default maximum number of contexts held by the TestContext
      cache before least-recently-used eviction occurs?
    options:
      - "1"
      - "8"
      - "32"
      - "Unlimited"
    answer: 2
    explanation: |
      The default cache size is 32 (LRU), configurable via
      spring.test.context.cache.maxSize. Many distinct configurations can thrash
      this cache and hurt performance.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-024
    difficulty: beginner
    tags: [mockbean, mock, difference]
    question: |
      What is the key difference between Mockito's @Mock and Spring Boot's
      @MockBean/@MockitoBean?
    options:
      - "@Mock is faster but produces a less accurate mock because it skips Spring's proxy-based interception layer"
      - "They are identical aliases that Spring processes through exactly the same bean-override post-processor"
      - "@MockBean can only mock interfaces via JDK dynamic proxies, whereas @Mock can only mock concrete classes via CGLIB"
      - "@Mock creates a plain mock object with no Spring involvement; @MockBean/@MockitoBean registers the mock as a bean in the ApplicationContext, replacing the real one"
    answer: 3
    explanation: |
      @Mock is pure Mockito for unit tests. @MockBean/@MockitoBean requires a
      Spring context and swaps the real bean for a mock so all Spring-managed
      injection points receive the mock.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-025
    difficulty: intermediate
    tags: [mock, trap, springboottest]
    question: |
      In a @SpringBootTest, a developer annotates a collaborator field with
      Mockito's @Mock expecting the service to use it. What actually happens?
    options:
      - "Spring detects the @Mock field and injects that mock everywhere the collaborator type is required"
      - "The context fails to start because Spring cannot resolve the duplicate bean created by the @Mock field"
      - "Spring transparently converts the @Mock into a @MockBean registration during context bootstrap"
      - "The @Mock is not added to the context; the real bean is still autowired and the mock is effectively ignored"
    answer: 3
    explanation: |
      @Mock only creates a local mock object; it is not registered as a bean. In a
      Spring context you must use @MockBean/@MockitoBean so the container replaces
      the real collaborator.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-026
    difficulty: intermediate
    tags: [spybean, spy]
    question: |
      What does @SpyBean (@MockitoSpyBean) do to a bean in the context?
    options:
      - "Replaces it with a bare mock whose methods all return null/default until each one is explicitly stubbed"
      - "Removes the bean from the context entirely so any injection point for that type resolves to null"
      - "Wraps the real bean in a Mockito spy so real methods execute unless explicitly stubbed"
      - "Marks the bean definition read-only so the container rejects any attempt to override or reset it"
    answer: 2
    explanation: |
      A spy delegates to the real object by default; you can verify interactions
      or override specific methods with doReturn(...).when(spy).method(). Useful
      when you want mostly-real behavior with selective stubbing.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-027
    difficulty: advanced
    tags: [mockitobean, deprecation, boot-3-4]
    question: |
      In Spring Boot 3.4 / Spring Framework 6.2, what replaced the now-deprecated
      @MockBean and @SpyBean annotations?
    options:
      - "@MockitoBean and @MockitoSpyBean from spring-test's bean override support"
      - "@MockDefinition and @SpyDefinition, the internal metadata records promoted to public annotations"
      - "@Mock and @Spy from Mockito directly, now wired into the context by the SpringExtension"
      - "@TestBean and @TestSpy, a new pair introduced alongside the generic @TestBean override"
    answer: 0
    explanation: |
      The functionality moved into Spring Framework's core bean-override support:
      @MockitoBean and @MockitoSpyBean (org.springframework.test.context.bean.
      override.mockito). @MockBean/@SpyBean are deprecated.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-028
    difficulty: intermediate
    tags: [mockbean, context-reset]
    question: |
      What happens to a @MockitoBean/@MockBean mock's recorded interactions and
      stubbings between test methods in the same class?
    options:
      - "They persist for the whole class, accumulating across every test method until the class finishes"
      - "They persist until the JVM exits because the mock lives in the shared, long-lived cached context"
      - "They are cleared at nondeterministic points whenever the context cache evicts the enclosing context"
      - "The mock is reset after each test method (via Mockito's test execution listener)"
    answer: 3
    explanation: |
      Spring Boot's ResetMocksTestExecutionListener resets the mocks around each
      test method (the core-framework @MockitoBean support uses
      MockitoResetTestExecutionListener) so stubbings/verifications don't leak
      between tests sharing the context.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-029
    difficulty: beginner
    tags: [mockmvc, no-server]
    question: |
      Which statement about MockMvc is correct?
    options:
      - "It sends real HTTP requests over a TCP socket to the embedded server started for the test"
      - "It only works against reactive WebFlux applications, delegating to the Netty HttpHandler pipeline"
      - "It requires webEnvironment = RANDOM_PORT so a real connector exists for it to bind against"
      - "It invokes the Spring MVC DispatcherServlet in-process without a running server or network socket"
    answer: 3
    explanation: |
      MockMvc drives the full MVC stack (mappings, converters, advice, filters)
      directly in-process — no real server or socket — making controller tests fast
      and deterministic.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-030
    difficulty: intermediate
    tags: [testresttemplate, integration]
    question: |
      Which statement about TestRestTemplate is TRUE?
    options:
      - "It throws exceptions on 4xx/5xx responses exactly like a plain RestTemplate does by default"
      - "It works with the default MOCK web environment because it targets the DispatcherServlet directly"
      - "It is fault-tolerant (does not throw on error statuses; returns the ResponseEntity) and needs a real running server"
      - "It is only usable for reactive WebFlux applications and cannot call a servlet-stack endpoint"
    answer: 2
    explanation: |
      TestRestTemplate is a RestTemplate variant tuned for integration tests: it
      won't throw on error status codes and requires a running server
      (RANDOM_PORT/DEFINED_PORT).
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-031
    difficulty: intermediate
    tags: [webtestclient, reactive]
    question: |
      What is distinctive about WebTestClient compared with TestRestTemplate?
    options:
      - "It is a fluent, reactive client that can bind to a real server, to a WebFlux application context, or directly to controllers/MockMvc"
      - "It can only test database repositories and has no facility for issuing HTTP requests"
      - "It cannot make assertions on the response body, only on the returned HTTP status code"
      - "It requires JUnit 4 and the deprecated SpringRunner rather than the JUnit 5 platform"
    answer: 0
    explanation: |
      WebTestClient offers a fluent assertion API and can bind to a running
      server, an application context, or directly to controllers — idiomatic for
      WebFlux and usable for MVC too.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-032
    difficulty: advanced
    tags: [mockmvc, limitations, scenario]
    question: |
      A team relies solely on MockMvc controller tests and is surprised that a
      production bug in the embedded server's HTTP connector (chunked encoding)
      was never caught. Which explanation is most accurate?
    options:
      - "MockMvc mis-parses chunked JSON payloads, so the assertions ran against corrupted test data"
      - "MockMvc silently restricts itself to GET requests, so the POST that triggers the bug never ran"
      - "The connector bug can only be reproduced from within a @DataJpaTest persistence slice"
      - "MockMvc does not exercise the real embedded server or network layer; it calls the DispatcherServlet in-process, so connector-level issues are invisible to it"
    answer: 3
    explanation: |
      MockMvc bypasses the real server/socket. It validates Spring MVC handling
      but not the embedded server, connectors, or true over-the-wire behavior — for
      that you need RANDOM_PORT + TestRestTemplate/WebTestClient.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-033
    difficulty: beginner
    tags: [testconfiguration, beans]
    question: |
      How does @TestConfiguration differ from a plain @Configuration placed in
      the test source tree?
    options:
      - "@TestConfiguration is picked up by the application's component scan automatically, whereas a plain @Configuration in test sources is not"
      - "There is no functional difference; both are auto-detected and applied identically to every test context"
      - "@TestConfiguration may declare only a single @Bean method, while @Configuration can declare many"
      - "@TestConfiguration is excluded from the application's component scanning and is applied only when nested in the test or explicitly imported"
    answer: 3
    explanation: |
      @TestConfiguration is not auto-scanned into the main context; it is used as a
      nested static class (auto-detected) or via @Import, keeping test beans opt-in
      and out of production-style contexts.
    ref: "concepts.md#testconfiguration-and-test-specific-beans"

  - id: testing-spring-boot-applications-034
    difficulty: intermediate
    tags: [testconfiguration, import]
    question: |
      You define a @TestConfiguration class in a separate file (not nested in the
      test). How do you make its beans available to a @SpringBootTest?
    options:
      - "Nothing — a standalone @TestConfiguration is applied globally to every test context automatically"
      - "Add @ComponentScan for its package to the production application so the test beans are discovered"
      - "Add @Import(MyTestConfig.class) to the test class"
      - "Annotate the @TestConfiguration class @Primary so the container prefers its beans over the real ones"
    answer: 2
    explanation: |
      A standalone @TestConfiguration is not scanned automatically; import it
      explicitly with @Import so its beans join the test context. Only nested
      static @TestConfiguration classes are auto-detected.
    ref: "concepts.md#testconfiguration-and-test-specific-beans"

  - id: testing-spring-boot-applications-035
    difficulty: intermediate
    tags: [testconfiguration, use-case]
    question: |
      Which is a typical, appropriate use of @TestConfiguration?
    options:
      - "Providing a test-only bean such as a fixed Clock or a stub of an external gateway to override the real one during tests"
      - "Defining the production DataSource so the same connection pool is reused across every deployment environment"
      - "Replacing the JUnit platform with TestNG so parameterized data-driven tests can run in the suite"
      - "Disabling the default test transaction rollback so each method's writes are committed to the database"
    answer: 0
    explanation: |
      @TestConfiguration is ideal for supplying test doubles or deterministic
      infrastructure (e.g. Clock.fixed) that override or supplement the real
      beans only within tests.
    ref: "concepts.md#testconfiguration-and-test-specific-beans"

  - id: testing-spring-boot-applications-036
    difficulty: beginner
    tags: [testcontainers, docker]
    question: |
      What is the primary value of Testcontainers in Spring Boot integration
      tests?
    options:
      - "It removes the need for any database by keeping all repository state in an in-memory map instead"
      - "It transparently mocks all outbound HTTP calls so no external services are ever contacted in tests"
      - "It speeds tests up by skipping the database layer entirely and returning canned repository results"
      - "It runs real dependencies (Postgres, Kafka, Redis, etc.) in Docker containers for production-like fidelity beyond in-memory H2"
    answer: 3
    explanation: |
      Testcontainers spins up real services in Docker, catching dialect/behavioral
      differences that an in-memory DB hides — at the cost of needing Docker and
      being slower.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-037
    difficulty: intermediate
    tags: [testcontainers, dynamicpropertysource]
    question: |
      Before @ServiceConnection existed, how did you feed a Testcontainers
      database's dynamically-assigned JDBC URL/credentials into Spring's
      environment?
    options:
      - "Hard-code the container's JDBC URL, username, and password directly in application.properties before startup"
      - "Set them with System.setProperty for each JDBC property inside the test class's no-argument constructor"
      - "You cannot inject dynamic values, so the container must be pinned to a fixed, pre-declared host port"
      - "Use a static @DynamicPropertySource method that registers the container's getJdbcUrl/getUsername/getPassword"
    answer: 3
    explanation: |
      @DynamicPropertySource lets you lazily register properties (the container's
      URL/credentials, only known after startup) into the Environment before the
      context uses them.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-038
    difficulty: advanced
    tags: [testcontainers, serviceconnection, boot-3-1]
    question: |
      What does annotating a container field with @ServiceConnection (Spring Boot
      3.1+) achieve?
    options:
      - "It stops the container after context startup so no real service keeps running during the test"
      - "Spring Boot automatically derives and wires the connection details (URL, credentials) from the container, removing the need for @DynamicPropertySource"
      - "It makes the container start faster by caching a pre-pulled image layer and reusing it across every test class"
      - "It converts the container into an equivalent in-memory H2 database that mimics the same SQL dialect"
    answer: 1
    explanation: |
      @ServiceConnection lets Boot's ConnectionDetails auto-configuration read the
      container and supply the DataSource/broker/etc. connection details
      automatically — no manual property registration.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-039
    difficulty: intermediate
    tags: [testcontainers, lifecycle]
    question: |
      With JUnit 5 and @Testcontainers, what is the difference between a static
      and a non-static @Container field?
    options:
      - "Static containers never start because @Testcontainers only manages instance-level fields"
      - "A static @Container starts once per class (shared across all methods); a non-static one restarts for each test method"
      - "Non-static containers are shared across the whole class; static ones are restarted before every method"
      - "There is no difference; the @Testcontainers extension treats both fields identically at any level"
    answer: 1
    explanation: |
      Static @Container fields are managed at class level (started once, shared),
      while instance-level @Container fields are started/stopped around each test
      method — slower but fully isolated.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-040
    difficulty: beginner
    tags: [junit5, lifecycle]
    question: |
      In JUnit 5, which annotation replaces JUnit 4's @Before (run before every
      test method)?
    options:
      - "@BeforeAll"
      - "@BeforeEach"
      - "@BeforeClass"
      - "@PreTest"
    answer: 1
    explanation: |
      JUnit 5 uses @BeforeEach (per-method) and @BeforeAll (once, static). @Before/
      @BeforeClass are JUnit 4 names.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-041
    difficulty: beginner
    tags: [junit5, extension]
    question: |
      What replaced JUnit 4's @RunWith in JUnit 5's extension model?
    options:
      - "@ExtendWith"
      - "@RunAs"
      - "@Rule"
      - "@Category"
    answer: 0
    explanation: |
      JUnit 5 uses @ExtendWith(...) to register extensions (e.g.
      MockitoExtension, SpringExtension), replacing JUnit 4's @RunWith runner
      mechanism.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-042
    difficulty: intermediate
    tags: [junit5, springextension]
    question: |
      Do you need to add @ExtendWith(SpringExtension.class) to a class already
      annotated with @SpringBootTest?
    options:
      - "Yes, always — without declaring it explicitly the Spring TestContext never bootstraps and the context won't load"
      - "No — Boot's @SpringBootTest and slice annotations are already meta-annotated with @ExtendWith(SpringExtension.class)"
      - "Only for @DataJpaTest, whose persistence slice omits the meta-annotation that the other slices include"
      - "Only in JUnit 4, where the SpringRunner mechanism cannot be inherited through a meta-annotation"
    answer: 1
    explanation: |
      @SpringBootTest, @WebMvcTest, @DataJpaTest, etc. include SpringExtension via
      meta-annotation, so adding it yourself is redundant.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-043
    difficulty: intermediate
    tags: [mockito, injectmocks]
    question: |
      In a pure Mockito unit test, what does @InjectMocks do?
    options:
      - "Registers the annotated class as a Spring-managed bean so the container can autowire it into other tests"
      - "Creates an instance of the class under test and injects the declared @Mock fields into it (via constructor/field/setter)"
      - "Turns the annotated class itself into a Mockito mock whose methods all return default values"
      - "Starts a minimal Spring application context and wires the declared mocks into it as bean overrides"
    answer: 1
    explanation: |
      @InjectMocks instantiates the target class and injects matching @Mock
      collaborators, letting you test the real class with mocked dependencies — no
      Spring involved.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-044
    difficulty: advanced
    tags: [mockito, strict-stubbing]
    question: |
      Using @ExtendWith(MockitoExtension.class), a test declares
      when(repo.find(1)).thenReturn(x) but never calls repo.find(1). What is the
      default outcome?
    options:
      - "The test silently passes because MockitoExtension defaults to lenient stubbing and ignores unused stubs"
      - "Mockito's strict stubbing flags the unnecessary stubbing and fails the test with UnnecessaryStubbingException"
      - "The stub is applied to every method on repo, so any call returns the same configured value x"
      - "A NullPointerException is thrown at teardown when Mockito tries to verify the never-invoked stub"
    answer: 1
    explanation: |
      MockitoExtension defaults to strict stubbing, which detects unused stubs and
      fails with UnnecessaryStubbingException, encouraging clean, minimal tests.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-045
    difficulty: intermediate
    tags: [mockito, void-methods]
    question: |
      Which construct correctly stubs a void method (or safely stubs on a spy)
      that should throw an exception?
    options:
      - "when(mock.doThing()).thenThrow(ex)"
      - "doThrow(ex).when(mock).doThing()"
      - "verify(mock).doThing().thenThrow(ex)"
      - "mock.doThing().willThrow(ex)"
    answer: 1
    explanation: |
      For void methods you can't use when(...).thenThrow because the call returns
      void; use doThrow(ex).when(mock).doThing(). The do*() family is also the safe
      way to stub spies without invoking the real method.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-046
    difficulty: intermediate
    tags: [mockito, verify, argumentcaptor]
    question: |
      You need to assert that service.save() was called exactly once and inspect
      the Order object it received. Which combination is correct?
    options:
      - "verify(repo, times(1)).save(captor.capture()); then read captor.getValue()"
      - "when(repo.save(any())).thenReturn(null); then assert the returned value equals the Order"
      - "verifyNoInteractions(repo); then read the captured Order from the verification result"
      - "assertThat(repo.save(captor.capture())).isNotNull(); then inspect captor.getValue()"
    answer: 0
    explanation: |
      Use verify(repo, times(1)).save(captor.capture()) with an
      ArgumentCaptor<Order> and then captor.getValue() to inspect the argument
      passed to the mock.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-047
    difficulty: intermediate
    tags: [transactions, rollback-default]
    question: |
      A test method in a @SpringBootTest is annotated @Transactional. What is the
      default commit behavior at the end of the method?
    options:
      - "It commits, just like a production @Transactional service method, persisting all writes permanently"
      - "It rolls back by default (the test transaction is rolled back to keep the DB clean)"
      - "It neither commits nor rolls back, leaving the transaction open until the context is later evicted"
      - "It commits only if no exception was thrown, otherwise the TestContext framework rolls the changes back"
    answer: 1
    explanation: |
      In the TestContext framework, @Transactional test methods roll back by
      default — the opposite of production service methods. Use @Commit or
      @Rollback(false) to change this.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-048
    difficulty: intermediate
    tags: [transactions, commit-override]
    question: |
      How do you make a @Transactional test method actually commit its changes to
      the database?
    options:
      - "Add @Commit (or @Rollback(false)) to the method/class"
      - "Add @DirtiesContext so the closing context flushes and commits the pending transaction"
      - "Set webEnvironment = DEFINED_PORT so the real server's connector commits each request"
      - "Nothing — test transactions always commit unless you explicitly annotate the method @Rollback"
    answer: 0
    explanation: |
      @Commit (or equivalently @Rollback(false)) overrides the default test
      rollback so the transaction commits, letting you observe persisted state.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-049
    difficulty: advanced
    tags: [transactions, false-positive, gotcha]
    question: |
      Why can a @Transactional test around lazy-loaded JPA associations give a
      false sense of confidence compared to production?
    options:
      - "Tests run against a different Hibernate version whose proxies never require an open session"
      - "The test method and the code under test can share a single open transaction/session, so lazy loads succeed in the test even though production (where the service opens and closes its own transaction) would throw LazyInitializationException"
      - "Lazy loading is silently disabled in tests, so every association is eagerly fetched up front"
      - "The default test rollback pre-loads all lazy associations before the transaction is undone"
    answer: 1
    explanation: |
      When the test itself is @Transactional, the persistence context stays open
      for the whole method, so lazy access works. In production the service's
      transaction may already be closed, causing LazyInitializationException — a
      classic false positive.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-050
    difficulty: advanced
    tags: [transactions, testtransaction]
    question: |
      Which API lets you programmatically end, commit, or restart the managed test
      transaction to inspect committed state within a single test method?
    options:
      - "TransactionTemplate.executeWithoutResult to open a nested committing transaction mid-method"
      - "TestTransaction (flagForCommit(), end(), start())"
      - "@DirtiesContext, which commits the current test transaction as it evicts the context"
      - "EntityManager.getTransaction().begin() to seize control of the test-managed transaction"
    answer: 1
    explanation: |
      TestTransaction gives fine-grained control over the test-managed transaction
      (flagForCommit/flagForRollback, end, start), enabling assertions on committed
      vs rolled-back data mid-test.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-051
    difficulty: advanced
    tags: [transactions, self-invocation, proxy]
    question: |
      A test verifies that entryMethod() (which internally calls a second
      @Transactional method on the same bean via this.secondMethod()) applies the
      second method's REQUIRES_NEW propagation. The assertion fails. What is the
      root cause?
    options:
      - "REQUIRES_NEW propagation is unsupported inside the Spring TestContext framework's managed transaction"
      - "Self-invocation bypasses the AOP proxy, so the second method's @Transactional settings (including propagation) are ignored — a proxy limitation, not a test bug"
      - "The test forgot @DirtiesContext, so a stale cached context reused the outer transaction's propagation"
      - "MockMvc cannot invoke transactional methods, so the second method silently runs without a transaction"
    answer: 1
    explanation: |
      @Transactional is proxy-based; an internal this.secondMethod() call doesn't
      pass through the proxy, so its transaction attributes don't apply. To engage
      them, call through the injected/proxied bean or move the method to another
      bean.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-052
    difficulty: beginner
    tags: [slices, choose-annotation]
    question: |
      You want to test only the mapping/validation logic of a single REST
      controller as fast as possible, mocking the service layer. Which annotation
      fits best?
    options:
      - "@SpringBootTest"
      - "@DataJpaTest"
      - "@WebMvcTest"
      - "@RestClientTest"
    answer: 2
    explanation: |
      @WebMvcTest loads just the web slice and MockMvc, letting you test one
      controller quickly while mocking its service dependencies with @MockitoBean.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-053
    difficulty: intermediate
    tags: [springboottest, none-env]
    question: |
      For an integration test of a batch/service component in an application that
      has web dependencies on the classpath, but where you don't want any web
      environment set up, which webEnvironment value is appropriate?
    options:
      - "MOCK"
      - "RANDOM_PORT"
      - "NONE"
      - "DEFINED_PORT"
    answer: 2
    explanation: |
      WebEnvironment.NONE loads the ApplicationContext without any web environment
      (no mock servlet, no server) — right for non-web integration tests even when
      web libs are present.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-054
    difficulty: intermediate
    tags: [mockmvc, assertions]
    question: |
      In a MockMvc test, which fluent chain correctly asserts an HTTP 201 status
      and that the JSON response has a non-null id field?
    options:
      - "mvc.perform(...).andReturn().getResponse().is(201).jsonPath(\"$.id\").isNotNull()"
      - "mvc.perform(...).andExpect(status().isCreated()).andExpect(jsonPath(\"$.id\").exists())"
      - "mvc.assertThat(...).hasStatus(201).bodyJson().extractingPath(\"$.id\").isNotNull()"
      - "mvc.perform(...).expectStatus().isCreated().expectBody().jsonPath(\"$.id\").exists()"
    answer: 1
    explanation: |
      MockMvc uses andExpect(...) with ResultMatchers like status().isCreated() and
      jsonPath("$.id").exists(). The expectStatus()/expectBody() fluent style
      belongs to WebTestClient, not MockMvc.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-055
    difficulty: advanced
    tags: [slices, datajpatest, scope]
    question: |
      Which statement about @DataJpaTest is FALSE?
    options:
      - "It configures an in-memory database by default when one is available"
      - "It rolls back each test transaction by default to isolate methods"
      - "It loads @Service and @RestController beans so you can test the full flow"
      - "It provides TestEntityManager and Spring Data repositories"
    answer: 2
    explanation: |
      @DataJpaTest is a persistence slice — it deliberately does NOT load
      @Service/@RestController/@Component beans. The other three statements are
      true defaults of the slice.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-056
    difficulty: intermediate
    tags: [junit5, parameterized]
    question: |
      Which JUnit 5 feature lets you run the same test logic against multiple
      input sets?
    options:
      - "@RepeatedTest, which alone reruns one fixed test body a set number of times"
      - "@ParameterizedTest with sources like @ValueSource, @CsvSource, @MethodSource"
      - "@Nested, which groups related tests into an inner-class hierarchy for structure"
      - "@Tag, which labels tests so a runner can filter which subset executes"
    answer: 1
    explanation: |
      @ParameterizedTest combined with argument sources (@ValueSource, @CsvSource,
      @EnumSource, @MethodSource, etc.) runs one test method for each provided
      input, reducing duplication.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-057
    difficulty: intermediate
    tags: [profiles, properties, springboottest]
    question: |
      How do you activate the "test" profile and override a property for a
      specific @SpringBootTest class?
    options:
      - "@ActiveProfiles(\"test\") plus properties = {...} (or @TestPropertySource)"
      - "Call System.setProperty for each key inside the test's constructor"
      - "Rename application.properties to test.properties so Boot loads it instead"
      - "There is no supported way to change the active profile from a test"
    answer: 0
    explanation: |
      @ActiveProfiles("test") selects the profile, and @SpringBootTest's
      properties attribute (or @TestPropertySource) overrides configuration.
      Note: differing profiles/properties create distinct cached contexts.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-058
    difficulty: advanced
    tags: [restclienttest, jsontest, choose]
    question: |
      A bean serializes an object to JSON AND posts it to an external API. You want
      two focused, fast tests: one for the JSON shape and one for the outbound HTTP
      contract. Which pair of slice annotations is most appropriate?
    options:
      - "@WebMvcTest to assert the JSON body, @DataJpaTest to verify the outbound HTTP call"
      - "@JsonTest for the serialization test, @RestClientTest for the outbound call test"
      - "@SpringBootTest for both, loading the full context so each concern is exercised end to end"
      - "@DataJpaTest to check the JSON mapping, @RestClientTest for the outbound HTTP call"
    answer: 1
    explanation: |
      @JsonTest verifies serialization/deserialization in isolation; @RestClientTest
      with MockRestServiceServer verifies the outbound HTTP request/response contract
      — each fast and narrowly scoped.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-059
    difficulty: expert
    tags: [springboottest, config-discovery, failure-mode]
    question: |
      A @SpringBootTest class lives in package com.acme.orders.web, while the
      @SpringBootApplication class is in com.acme.orders. A second app-style
      @Configuration annotated with @SpringBootConfiguration was accidentally added
      in com.acme.orders.testsupport. The test now fails before any assertion runs.
      What is the most precise explanation?
    options:
      - "@SpringBootTest scans the classpath and randomly picks one @SpringBootConfiguration, so the failure is nondeterministic"
      - "The test package is below the application package, so no @SpringBootConfiguration can ever be found"
      - "@SpringBootTest walks up from the test package and finds more than one @SpringBootConfiguration, so it throws IllegalStateException for an ambiguous configuration"
      - "Two @SpringBootConfiguration classes are merged, doubling every bean definition and causing a BeanDefinitionOverrideException"
    answer: 2
    explanation: |
      @SpringBootTest searches upward for exactly one @SpringBootConfiguration.
      Zero matches throw "Unable to find a @SpringBootConfiguration"; more than one
      (as here — the app class plus the stray one both discoverable) throws an
      IllegalStateException about finding multiple candidates. It does not merge or
      randomly select them.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-060
    difficulty: advanced
    tags: [springboottest, mockmvc, autoconfigure]
    question: |
      A developer writes @SpringBootTest (default webEnvironment) and autowires
      MockMvc, but startup fails with "No qualifying bean of type
      org.springframework.test.web.servlet.MockMvc available." @WebMvcTest is not
      used. What is the correct fix?
    options:
      - "Switch webEnvironment to RANDOM_PORT so MockMvc is created against the real server"
      - "MockMvc cannot be used with @SpringBootTest at all; you must use TestRestTemplate"
      - "Add @EnableWebMvc to the test class so the MVC config registers a MockMvc bean"
      - "Add @AutoConfigureMockMvc — plain @SpringBootTest does not auto-configure MockMvc on its own"
    answer: 3
    explanation: |
      With MOCK env, @SpringBootTest loads the web layer but does NOT register
      MockMvc unless you add @AutoConfigureMockMvc (the @WebMvcTest slice bundles
      it, which is why it "just works" there). RANDOM_PORT would give a real server,
      not MockMvc.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-061
    difficulty: expert
    tags: [springboottest, random-port, transactions, data-leak]
    question: |
      An integration test uses @SpringBootTest(webEnvironment = RANDOM_PORT) and is
      annotated @Transactional, expecting each test's writes to roll back. Rows
      created via HTTP calls through TestRestTemplate persist across tests anyway.
      Why?
    options:
      - "@Transactional is silently ignored on any class also annotated @SpringBootTest, so nothing is ever rolled back"
      - "The test rollback applies only to read queries and leaves any INSERT/UPDATE statements committed"
      - "The HTTP request is handled on a separate server thread with its own transaction that commits independently of the test method's transaction, so the test's rollback never covers it"
      - "TestRestTemplate opens a second datasource of its own that bypasses the registered transaction manager"
    answer: 2
    explanation: |
      With a real server, the request runs on a container worker thread and the
      controller/service open their own transaction, which commits. The test
      method's @Transactional (and its rollback) is a different transaction on a
      different thread and cannot roll back the server-side commit. This is why
      RANDOM_PORT tests need explicit cleanup.
    ref: "concepts.md#springboottest-and-webenvironment-options"

  - id: testing-spring-boot-applications-062
    difficulty: advanced
    tags: [webmvctest, controlleradvice, scope]
    question: |
      @WebMvcTest(OrderController.class) is used to narrow the slice to one
      controller. A @ControllerAdvice exception handler that maps DomainException to
      HTTP 409 lives elsewhere in the app and depends on a MessageService bean. The
      context fails to start. Which statement is correct?
    options:
      - "@ControllerAdvice beans are global and still loaded by the slice; the advice's MessageService dependency is not loaded, so it must be provided as @MockitoBean"
      - "Narrowing to OrderController excludes all @ControllerAdvice beans, so the failure must be unrelated"
      - "@ControllerAdvice is a @Service-level bean and is never loaded in @WebMvcTest"
      - "You must switch to @SpringBootTest because slices cannot load any advice"
    answer: 0
    explanation: |
      @WebMvcTest loads @ControllerAdvice globally even when you name a single
      controller. If the advice depends on a service that the slice excludes, the
      context fails unless you supply that collaborator as a @MockitoBean.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-063
    difficulty: expert
    tags: [webmvctest, method-security, preauthorize]
    question: |
      A service method carries @PreAuthorize("hasRole('ADMIN')"). The team asserts
      in a @WebMvcTest that a non-admin user is rejected by this rule. The test
      passes the call through even for non-admins. What is the accurate reason?
    options:
      - "@PreAuthorize is honored only when the request carries @WithMockUser, which this test forgot to add"
      - "@PreAuthorize is inert unless webEnvironment = RANDOM_PORT starts a real server to enforce it"
      - "@WebMvcTest disables Spring Security entirely, so every authorization annotation is skipped"
      - "Method security is enforced by an AOP interceptor on the service bean, which the web slice does not load; @WebMvcTest only exercises URL/HttpSecurity rules, not @PreAuthorize on services"
    answer: 3
    explanation: |
      @PreAuthorize is applied by a method-security AOP proxy around the service.
      @WebMvcTest excludes @Service beans, so that interceptor never runs. Only
      HttpSecurity URL rules are exercised in the web slice; method-security tests
      need the service bean and @EnableMethodSecurity in scope.
    ref: "concepts.md#testing-security-and-web-layers-deeply"

  - id: testing-spring-boot-applications-064
    difficulty: advanced
    tags: [webmvctest, csrf, security]
    question: |
      In a Security-enabled @WebMvcTest, a POST to /orders with a valid mock user
      returns 403 even though the user is authorized. The GET tests work fine. What
      is the most likely cause and fix?
    options:
      - "The controller method is missing @ResponseBody, so the 403 is really a serialization failure; add it"
      - "MockMvc cannot issue POST requests at all; switch this test to TestRestTemplate to send the body"
      - "CSRF protection rejects the state-changing POST; add .with(csrf()) (or disable CSRF for the test)"
      - "The mock user needs its authorities re-declared with a ROLE_ prefix on the GET requests as well"
    answer: 2
    explanation: |
      Spring Security enables CSRF protection by default. State-changing MockMvc
      requests (POST/PUT/DELETE) are rejected with 403 unless you add the
      SecurityMockMvcRequestPostProcessors.csrf() post-processor (or disable CSRF).
      GETs are unaffected because they are not CSRF-protected.
    ref: "concepts.md#testing-security-and-web-layers-deeply"

  - id: testing-spring-boot-applications-065
    difficulty: expert
    tags: [security, withmockuser, roles, authorities]
    question: |
      An endpoint is secured with .hasAuthority("ORDER_WRITE"). A test uses
      @WithMockUser(roles = "ORDER_WRITE") and gets 403. The same endpoint with
      .hasRole("ORDER_WRITE") would pass with that annotation. What explains the
      difference?
    options:
      - "roles and authorities are stored identically, so the 403 must actually be coming from CSRF protection"
      - "@WithMockUser can only set roles and offers no way to grant raw authorities to the principal"
      - "@WithMockUser(roles = \"ORDER_WRITE\") grants the authority ROLE_ORDER_WRITE, but hasAuthority(\"ORDER_WRITE\") checks the literal authority without the ROLE_ prefix, so it does not match"
      - "hasAuthority always requires a real JWT-backed principal and ignores any mock user's authorities"
    answer: 2
    explanation: |
      roles = "X" is stored as authority ROLE_X, and hasRole("X") checks ROLE_X.
      hasAuthority("ORDER_WRITE") checks the exact string with no prefix, so the
      ROLE_ORDER_WRITE granted by roles = ... doesn't match. Use
      @WithMockUser(authorities = "ORDER_WRITE") instead.
    ref: "concepts.md#testing-security-and-web-layers-deeply"

  - id: testing-spring-boot-applications-066
    difficulty: advanced
    tags: [webmvctest, addfilters, security]
    question: |
      To avoid dealing with authentication, a developer adds
      @AutoConfigureMockMvc(addFilters = false) to a @WebMvcTest. Endpoints now
      return 200 without any credentials. What is the important trade-off being
      made?
    options:
      - "Nothing meaningful is lost; addFilters = false skips only the authentication filter and keeps the rest"
      - "It switches MockMvc into making real over-the-wire HTTP calls against the started embedded server"
      - "It permanently disables Spring Security for the whole application, not just the annotated test"
      - "It disables the entire servlet filter chain — including Spring Security AND any custom Filter/HandlerInterceptor logic — so filter-based behavior is no longer tested and real security misconfigurations can be masked"
    answer: 3
    explanation: |
      addFilters = false removes the servlet Filter chain that MockMvc would apply,
      which includes Security's FilterChainProxy but also any custom filters. It's a
      blunt instrument: convenient, but it stops exercising filter logic and can
      hide genuine security wiring bugs.
    ref: "concepts.md#webmvctest-web-slice"

  - id: testing-spring-boot-applications-067
    difficulty: expert
    tags: [datajpatest, first-level-cache, false-positive]
    question: |
      A @DataJpaTest persists a User via em.persist(user), then asserts
      repo.findById(user.getId()) returns an object whose mapped 'displayName'
      column is correct. The @Column mapping for displayName is actually wrong
      (typo), yet the test passes. What must you add to make the test catch the bug?
    options:
      - "Call em.flush() then em.clear() before findById, so the entity is detached and Hibernate must issue a real SELECT that exercises the column mapping"
      - "Add @Commit so the transaction commits, which forces the column mapping to be validated on write"
      - "Replace findById with findAll, since a collection query bypasses the first-level cache and re-reads columns"
      - "Switch to @SpringBootTest — @DataJpaTest can never detect an @Column mapping error on its own"
    answer: 0
    explanation: |
      After persist, the same instance is in the first-level cache, so findById
      returns it without a SELECT — the broken column mapping is never used. flush()
      pushes the INSERT and clear() detaches the entity, forcing a fresh SELECT that
      hydrates via the (broken) mapping, surfacing the bug.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-068
    difficulty: expert
    tags: [datajpatest, schema, migrations, gotcha]
    question: |
      Repository tests under @DataJpaTest (embedded H2, default settings) all pass,
      but production deployment fails because a Flyway migration has a bug. Why did
      the slice not catch it?
    options:
      - "@DataJpaTest by default builds the schema from Hibernate entity mappings on the embedded DB, so the tests validated the Hibernate-generated schema rather than the actual migration scripts"
      - "Flyway is globally disabled inside every Spring test, so no migration script ever executes there"
      - "H2 silently rewrites broken migration SQL into valid statements, hiding the defect during the slice"
      - "The slice quietly ran against the production database, whose existing schema masked the migration error"
    answer: 0
    explanation: |
      In @DataJpaTest the embedded DB schema is generated from @Entity mappings by
      Hibernate DDL by default, so migrations are not the source of truth. To test
      the real migration you need the real DB dialect (Testcontainers) with
      replace = NONE and migrations driving the schema.
    ref: "concepts.md#datajpatest-persistence-slice"

  - id: testing-spring-boot-applications-069
    difficulty: advanced
    tags: [datajpatest, rollback, commit-behavior]
    question: |
      A @DataJpaTest wants to verify that a database CHECK constraint fires on
      commit (a deferred constraint). The test persists an invalid row and expects
      an exception, but none is thrown. Which change most directly reproduces
      commit-time behavior?
    options:
      - "Add @Rollback(false)/@Commit so the transaction actually commits and the deferred constraint is checked (or use TestTransaction to flag-for-commit and end the transaction)"
      - "Add @DirtiesContext so the closing context flushes the transaction and triggers the deferred check"
      - "Increase the context cache size so the persistence context lives long enough to evaluate the constraint"
      - "Replace @DataJpaTest with @JsonTest, which serializes the row and thereby forces the constraint to fire"
    answer: 0
    explanation: |
      Deferred constraints are only evaluated at commit. Because @DataJpaTest rolls
      back by default, commit never happens. Forcing a commit (@Commit /
      @Rollback(false)) — or programmatically ending a committing TestTransaction —
      triggers the deferred check.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-070
    difficulty: advanced
    tags: [jsontest, objectmapper, config]
    question: |
      A unit test builds new ObjectMapper() and asserts an Instant serializes as a
      number; it passes. In production the same object serializes as an ISO-8601
      string and a downstream consumer breaks. A @JsonTest would have caught this.
      Why?
    options:
      - "@JsonTest swaps in a stricter JSON parser that rejects numeric timestamps and forces ISO-8601 output"
      - "@JsonTest always serializes dates as epoch numbers, so it would match and agree with the bare unit test"
      - "@JsonTest disables the JavaTimeModule, which is precisely what makes the string formatting appear"
      - "@JsonTest applies the application's Jackson configuration (spring.jackson.* and Jackson2ObjectMapperBuilderCustomizer beans, e.g. WRITE_DATES_AS_TIMESTAMPS=false and JavaTimeModule), whereas a bare new ObjectMapper() does not reflect that config"
    answer: 3
    explanation: |
      A raw ObjectMapper ignores Spring Boot's Jackson auto-configuration. @JsonTest
      wires the same customized ObjectMapper the app uses, so it reflects date
      handling, naming strategy, and module registration — catching config-dependent
      serialization differences.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-071
    difficulty: expert
    tags: [restclienttest, binding, failure-mode]
    question: |
      A @RestClientTest(WeatherClient.class) sets up MockRestServiceServer
      expectations, but they are never matched and a real network call is attempted.
      Inspection shows WeatherClient does `this.rest = new RestTemplate();` in its
      constructor. What is the root cause?
    options:
      - "MockRestServiceServer can only bind to a WebClient exchange function, never to a RestTemplate instance"
      - "The @RestClientTest must run with webEnvironment = RANDOM_PORT for the mock server to intercept calls"
      - "MockRestServiceServer binds to the RestTemplate the slice created via the auto-configured RestTemplateBuilder; because the client built its own RestTemplate, the mock server is bound to a different instance and never intercepts the calls"
      - "The client must be annotated @Service before the mock server's proxy can intercept its requests"
    answer: 2
    explanation: |
      @RestClientTest customizes the RestTemplate produced by the injected
      RestTemplateBuilder and binds MockRestServiceServer to it. A self-constructed
      new RestTemplate() is a different, un-instrumented instance, so expectations
      never match and real HTTP leaks. Inject the builder.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-072
    difficulty: advanced
    tags: [restclienttest, mockrestserviceserver, ordering]
    question: |
      A client makes two GET calls whose order depends on a HashMap iteration and is
      therefore nondeterministic. A @RestClientTest sets two expectations and
      intermittently fails with an assertion about an unexpected request. What is
      the correct remedy?
    options:
      - "Add a Thread.sleep between the two calls so their order becomes deterministic and matches the expectations"
      - "Call server.reset() before each expectation so previously declared requests no longer conflict with new ones"
      - "Build the server with MockRestServiceServer bindTo(...).ignoreExpectOrder(true) (or use the createServer variant that ignores order), since by default expectations must arrive in declared order"
      - "Use @DirtiesContext to rebuild the client on each run so a fresh RestTemplate re-orders the outgoing calls"
    answer: 2
    explanation: |
      By default MockRestServiceServer enforces the declared request order. When the
      client's call order is nondeterministic, enable ignoreExpectOrder so any
      declared expectation can match any incoming request regardless of sequence.
    ref: "concepts.md#jsontest-and-restclienttest-other-slices"

  - id: testing-spring-boot-applications-073
    difficulty: expert
    tags: [context-caching, cache-key, mockitobean]
    question: |
      Two @SpringBootTest classes have byte-for-byte identical configuration EXCEPT
      one declares `@MockitoBean PaymentGateway gateway;` and the other declares
      `@MockitoBean PaymentGateway paymentGateway;` (same type, different field
      name). Both mock the same single bean. What is the effect on the context
      cache?
    options:
      - "They always share a single cached context because the cache key is derived purely from the mocked bean's type, and identical types always collapse to one entry"
      - "Neither context is cached, because declaring any @MockitoBean permanently disables the TestContext cache and forces a brand-new context for every single test method"
      - "The second class fails to start with a BeanDefinitionOverrideException, because the two field names register conflicting duplicate mock definitions for one bean"
      - "They may create two separate cached contexts, because the mock definition (including the field/qualifier name used for resolution) contributes to the ContextCustomizer that is part of the cache key"
    answer: 3
    explanation: |
      The set of bean-override definitions is folded into a ContextCustomizer that
      participates in the MergedContextConfiguration cache key. Differing field/
      qualifier names can make the customizers unequal, producing two contexts.
      Naming mocks consistently across classes maximizes cache reuse.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-074
    difficulty: advanced
    tags: [context-caching, dirtiescontext, lifecycle]
    question: |
      When a cached ApplicationContext is evicted from the TestContext cache (LRU
      overflow or @DirtiesContext), what actually happens to that context?
    options:
      - "It is closed — @PreDestroy callbacks run and managed resources like embedded servers and connection pools are shut down"
      - "It is retained in memory indefinitely but flagged stale, so its singletons stay live and can be reattached if an identical configuration is requested again later"
      - "Only its bean definitions are discarded while the singleton instances remain live and running, so embedded servers and pools keep holding their resources"
      - "Nothing happens to the context itself; eviction merely frees the cache key entry and leaves the fully-initialized context running untouched in the background"
    answer: 0
    explanation: |
      Eviction closes the context, invoking destruction callbacks and releasing
      resources (embedded servers, datasources, thread pools). This is why
      thrashing the cache is doubly costly — teardown plus a full rebuild on the
      next miss.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-075
    difficulty: expert
    tags: [context-caching, dynamicpropertysource, key]
    question: |
      Test class A uses @DynamicPropertySource to register a Testcontainers JDBC
      URL. Test class B has otherwise-identical configuration but no
      @DynamicPropertySource (it relies on application-test.properties). Assuming the
      resolved property values end up the same, do A and B share a cached context?
    options:
      - "Yes — the framework snapshots the fully-resolved property values into the cache key, so once both classes yield the same effective JDBC URL they share one context"
      - "No — @DynamicPropertySource is internally meta-annotated with @DirtiesContext, so class A always closes and rebuilds its context and can never share one with B"
      - "Yes — @DynamicPropertySource callbacks are resolved lazily after context creation and are explicitly excluded from the cache key, so A and B key identically"
      - "No — the presence of @DynamicPropertySource contributes a ContextCustomizer, so the merged configurations differ and the contexts are not shared"
    answer: 3
    explanation: |
      The cache key is structural, not the resolved values. @DynamicPropertySource
      adds a customizer to A's merged configuration that B lacks, so their keys
      differ and each gets its own context even if the final property values would
      coincide.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-076
    difficulty: advanced
    tags: [context-caching, performance, debugging]
    question: |
      A CI suite of 300 tests is slow; you suspect context thrashing. Which is the
      most direct way to confirm how many distinct contexts are being built and
      whether the 32-entry cache is overflowing?
    options:
      - "Add @DirtiesContext to every class to force clean measurements, since only a freshly built context reports its own creation cost accurately in the logs"
      - "Bump spring.test.context.cache.maxSize to 1000 and watch whether the suite speeds up, since a faster run proves exactly how many contexts were previously thrashing"
      - "Enable DEBUG logging on org.springframework.test.context.cache to observe hit/miss/size counts"
      - "Fork each test class into a separate JVM and compare total wall-clock time, since isolated JVMs let you count context builds by summing the per-fork startups"
    answer: 2
    explanation: |
      The cache logger reports cache hits, misses, size, and parent contexts at
      DEBUG. That reveals whether many near-identical configurations are missing and
      evicting each other — the actionable diagnosis before you consolidate configs.
    ref: "concepts.md#slice-tests-and-context-caching"

  - id: testing-spring-boot-applications-077
    difficulty: expert
    tags: [mockitobean, replace-or-create, failure-mode]
    question: |
      A @SpringBootTest declares `@MockitoBean NotificationClient client;` but,
      because of a conditional, NotificationClient is NOT actually present in the
      loaded context. The stubbing appears to have no effect on the real code path.
      What happened?
    options:
      - "The context failed to start, because @MockitoBean requires an existing target bean and throws NoSuchBeanDefinitionException the moment its type is absent from the loaded context"
      - "The mock silently replaced an arbitrary unrelated bean of a different type, so your stubbings were quietly applied to whatever candidate the container happened to resolve first"
      - "Spring detected the absent target and silently downgraded the @MockitoBean into a plain Mockito @Mock that lives outside the context entirely"
      - "@MockitoBean's default REPLACE_OR_CREATE strategy created a brand-new mock bean (since none existed to replace); real code that never injects NotificationClient is unaffected, so your stub does nothing"
    answer: 3
    explanation: |
      @MockitoBean uses REPLACE_OR_CREATE: with no existing bean it creates a new
      mock rather than failing. If nothing injects that type, the mock is inert.
      Setting enforceOverride = true (REPLACE) would make the test fail fast when the
      target bean is absent.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-078
    difficulty: expert
    tags: [mockitospybean, wrap, scoped-proxy]
    question: |
      Which scenario will cause a @MockitoSpyBean (WRAP strategy) declaration to
      fail at context startup?
    options:
      - "The target bean is a plain eager singleton with exactly one candidate of that type in the context, which WRAP explicitly forbids wrapping to avoid double proxying"
      - "There are zero beans of the target type in the context, because WRAP requires exactly one existing candidate and cannot create one"
      - "The target bean carries a @Primary annotation, which WRAP treats as an unwrappable definition and rejects at context startup"
      - "The spy is declared on a private field, which WRAP cannot access without a public setter and therefore fails during injection"
    answer: 1
    explanation: |
      Unlike @MockitoBean (REPLACE_OR_CREATE), @MockitoSpyBean uses WRAP and must
      wrap an existing instance; zero candidates is an error. (Multiple candidates
      also fail without a qualifier; a scoped-proxy target also fails to be spied.)
      Private fields are fine.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-079
    difficulty: advanced
    tags: [mockitobean, reset, lifecycle, beforeall]
    question: |
      A test class stubs a @MockitoBean once in a static @BeforeAll method and reads
      it in three @Test methods. The first test sees the stub; but debugging shows
      the stub is gone. What is the cause?
    options:
      - "A static @BeforeAll runs before the Spring context exists, so the injected mock was still null and the stubbing was silently recorded against a throwaway reference"
      - "Spring Boot resets @MockitoBean/@MockBean mocks around each test method, wiping the stub configured once in @BeforeAll; re-stub in @BeforeEach instead"
      - "Static @BeforeAll methods are scheduled to run only after all @Test methods complete, so the stub was applied far too late to be observed by any test"
      - "The @MockitoBean is re-instantiated as a fresh mock object for every test method, so the instance stubbed in @BeforeAll is discarded before the tests run"
    answer: 1
    explanation: |
      Spring's mock-reset listener resets these mocks before/after each test method.
      A stub set once in @BeforeAll is cleared before the first (or by the second)
      test. Configure stubs per-method (@BeforeEach or inside the test) so they
      survive the reset.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-080
    difficulty: advanced
    tags: [mockitobean, ambiguity, qualifier]
    question: |
      A context has two beans of type Clock (a system clock and a UTC clock). A test
      declares `@MockitoBean Clock clock;` and the context fails with an error about
      an ambiguous bean. Which is the correct way to disambiguate which bean to
      replace?
    options:
      - "Rename the field to match one bean's name, add a @Qualifier, or use @MockitoBean(name = \"...\") to target a specific bean"
      - "You cannot mock a type that has two beans; @MockitoBean supports only types with a single unique candidate and always fails otherwise"
      - "Add @Primary to the @MockitoBean field so the override is preferred, which promotes the mock above both existing Clock candidates"
      - "Declare two separate @MockitoBean fields of type Clock with no names, letting Spring pair each mock positionally with one of the real beans"
    answer: 0
    explanation: |
      By-type resolution is ambiguous with two candidates. @MockitoBean falls back to
      the field name as a qualifier, and you can also use @Qualifier or the name
      attribute to pick the exact bean to replace. @Primary is not applicable to the
      override field itself.
    ref: "concepts.md#mockbean--mockitobean-vs-mockito-mock"

  - id: testing-spring-boot-applications-081
    difficulty: expert
    tags: [mockito, injectmocks, null-injection]
    question: |
      A pure Mockito test uses @InjectMocks on a service whose largest constructor
      takes (OrderRepo repo, AuditLog audit, Clock clock). The test declares @Mock
      for repo and clock but NOT audit. No error occurs at setup, but a test throws
      NPE inside the service on audit.write(). Why?
    options:
      - "@InjectMocks requires every constructor parameter to have a matching @Mock declared, and it fails fast at setup with a MissingMockException when audit is absent"
      - "Mockito silently instantiated a real AuditLog via its default constructor and injected that live instance, so the NPE must originate deeper inside AuditLog itself"
      - "@InjectMocks always ignores constructors and performs pure field injection, so the largest constructor is irrelevant and audit was simply never populated"
      - "Mockito chose the largest constructor it could use and injected null for the unmocked AuditLog parameter, so audit is null at runtime"
    answer: 3
    explanation: |
      @InjectMocks prefers the biggest constructor and injects available mocks;
      parameters with no matching mock are passed as null (no error). AuditLog was
      null, so calling it NPEs. Declare a @Mock AuditLog to fix it.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-082
    difficulty: advanced
    tags: [mockito, matchers, primitives]
    question: |
      Which stubbing line throws InvalidUseOfMatchersException at runtime in modern
      Mockito?
    options:
      - "when(svc.calc(5, anyLong())).thenReturn(9) — a raw literal 5 alongside the anyLong() matcher"
      - "when(repo.findByStatus(anyInt())).thenReturn(list) — for an int parameter"
      - "when(repo.find(any())).thenReturn(x) — relying on the no-arg any() to also match a null argument at call time"
      - "when(repo.findById(anyLong())).thenReturn(opt) — for a long parameter"
    answer: 0
    explanation: |
      Mockito's rule: if ANY argument uses a matcher, then EVERY argument must use
      one. Passing a raw literal (5) beside anyLong() throws
      InvalidUseOfMatchersException — wrap it as eq(5). The others are fine:
      anyInt()/anyLong() correctly handle primitives, and the no-arg any() matches
      anything INCLUDING null (only any(Class) excludes null since Mockito 2.1.0,
      where you would use isNull()/nullable()).
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-083
    difficulty: expert
    tags: [mockito, spy, self-invocation, aop-contrast]
    question: |
      A Mockito spy of a class where publicA() internally calls this.publicB(). The
      test does `doReturn(42).when(spy).publicB();` then calls spy.publicA(). What
      happens, and how does this contrast with Spring's @Transactional self-invocation?
    options:
      - "publicA() sees the stubbed 42, because a Mockito spy is a subclass with copied state so self-invoked this.publicB() dispatches through the spy and IS intercepted — the OPPOSITE of Spring AOP proxies, where this.method() bypasses the proxy"
      - "publicA() runs the real publicB(), because Mockito spies delegate to the untouched original object exactly like an AOP proxy, so self-invocation is never intercepted"
      - "The test fails at stub time with a CannotStubSelfInvocationException, because Mockito explicitly forbids stubbing any method that is reached through an internal this.* call on a spy"
      - "It behaves identically to a Spring @Transactional self-call: the internal this.publicB() bypasses interception, the stubbed 42 is ignored, and the real method executes"
    answer: 0
    explanation: |
      A Mockito spy is a ByteBuddy SUBCLASS whose state is copied from the real
      object — it does not delegate to the original instance. So every call on the
      spy reference, including internal this.publicB() self-invocations, is
      intercepted, and the stub returns 42. This is the reverse of Spring AOP /
      @Transactional proxies, where 'this' is the raw target and self-invocation
      bypasses the proxy. (doReturn().when(spy) is still preferred over
      when(spy.publicB()) only because the latter executes the real method while
      stubbing.)
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-084
    difficulty: advanced
    tags: [mockito, strictness, unnecessarystubbing]
    question: |
      A team migrating from JUnit 4's MockitoJUnitRunner to JUnit 5's
      MockitoExtension suddenly sees UnnecessaryStubbingException failures on tests
      that previously passed. What changed, and what is the least-invasive way to
      keep a specific legitimate-but-unused stub?
    options:
      - "MockitoExtension defaults to STRICT_STUBS (vs the runner's more lenient default); mark the intentional stub with lenient().when(...) or set @MockitoSettings(strictness = LENIENT)"
      - "JUnit 5 dropped support for when(...) stubbing entirely, so you must rewrite every affected test to use real collaborator objects instead of stubs"
      - "MockitoExtension disables interaction verification by default, so you must add verifyNoMoreInteractions to each test to restore the previously passing behavior"
      - "Downgrade Mockito to an earlier version to restore the old behavior, since there is no per-stub option to exempt one legitimate unused stub"
    answer: 0
    explanation: |
      MockitoExtension enforces STRICT_STUBS by default, flagging unused stubs. Use
      lenient().when(...) for a single stub, or @MockitoSettings(strictness =
      Strictness.LENIENT) for the class, rather than abandoning strictness wholesale.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-085
    difficulty: expert
    tags: [mockito, static-mock, thread-local, leak]
    question: |
      A test uses `try (MockedStatic<Instant> m = mockStatic(Instant.class)) { ... }`
      to freeze time, but a later unrelated test on the same thread intermittently
      sees frozen time. Which explanation and remedy are correct?
    options:
      - "mockStatic installs a JVM-wide global registration for the class, so try-with-resources cannot undo it and you must call the static Mockito.unmockStatic(Instant.class) yourself"
      - "The leak is caused by strict stubbing leaving an unverified static stub behind, and it is resolved by wrapping the stub in lenient() so Mockito clears it after the test"
      - "Static method mocking is fundamentally impossible in Mockito, so the frozen time you observe is actually a JVM clock caching bug rather than a leaked mock"
      - "A MockedStatic registration is thread-local and active until closed; if a code path escapes the try-with-resources (e.g. an exception before close, or reuse across threads), it leaks. Ensure the MockedStatic is always closed (try-with-resources) and confined to one thread"
    answer: 3
    explanation: |
      mockStatic returns a thread-local MockedStatic scoped registration that stays
      active until closed. If it isn't closed on the same thread (leaked scope or
      cross-thread use), subsequent tests observe the mock. Always use
      try-with-resources and keep it single-threaded.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-086
    difficulty: advanced
    tags: [mockmvc, mockmvctester, spring-6-2]
    question: |
      What is a correct distinction between classic MockMvc (Hamcrest style) and the
      MockMvcTester introduced in Spring Framework 6.2?
    options:
      - "MockMvcTester provides a fluent AssertJ-based API for both requests and assertions, handles unresolved exceptions itself (so tests need not declare throws Exception), and treats async results as complete by default"
      - "MockMvcTester issues real HTTP calls over a socket to the embedded server, whereas classic MockMvc merely invokes the DispatcherServlet in-process"
      - "MockMvcTester works only against the reactive WebFlux stack and cannot drive a servlet-based Spring MVC controller at all"
      - "MockMvcTester eliminates the need for a Spring context entirely, standing up the controllers on their own without any TestContext bootstrapping"
    answer: 0
    explanation: |
      MockMvcTester is the AssertJ entry point: fluent request building and
      assertions, no required static imports, consistent handling of unresolved
      exceptions (no throws Exception needed), and async results complete by default.
      Neither MockMvc nor MockMvcTester makes real network calls.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-087
    difficulty: advanced
    tags: [webtestclient, mvc, binding]
    question: |
      Which statement about WebTestClient is accurate?
    options:
      - "It can only be used against reactive WebFlux applications talking to a real server, and has no way to exercise a servlet-based Spring MVC controller"
      - "It can bind to a running server (RANDOM_PORT), to a WebFlux application context, OR to Spring MVC controllers without a server via MockMvc integration — making it a unified client for both stacks"
      - "It can assert only on the returned HTTP status code and offers no fluent API for making assertions against the response body payload"
      - "It requires a live Reactor Netty server to be running underneath, so it cannot operate purely in-process without an actual network connector"
    answer: 1
    explanation: |
      WebTestClient is a unified fluent test client. Besides real-server and WebFlux
      context binding, MockMvcWebTestClient lets it drive MVC controllers in-process
      without a server. The reactive-only belief is a common misconception.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-088
    difficulty: intermediate
    tags: [mockmvc, forward, assertions]
    question: |
      In a MockMvc test of a controller that returns a view name resulting in a
      server-side forward to "/WEB-INF/views/order.jsp", which assertion verifies the
      forward target?
    options:
      - "andExpect(redirectedUrl(\"/WEB-INF/views/order.jsp\"))"
      - "andExpect(status().isFound())"
      - "andExpect(forwardedUrl(\"/WEB-INF/views/order.jsp\"))"
      - "andExpect(header().string(\"Location\", \"/WEB-INF/views/order.jsp\"))"
    answer: 2
    explanation: |
      MockMvc records but does not actually execute the forward; forwardedUrl(...)
      asserts the forward target. redirectedUrl / Location / 302 are for client
      redirects, not server-side forwards.
    ref: "concepts.md#mockmvc-vs-testresttemplate-vs-webtestclient"

  - id: testing-spring-boot-applications-089
    difficulty: expert
    tags: [testconfiguration, override, bean-definition-override]
    question: |
      A @TestConfiguration nested in a @SpringBootTest defines
      `@Bean PaymentGateway paymentGateway() { return new StubGateway(); }` with the
      SAME bean name as the production bean. Startup fails with
      BeanDefinitionOverrideException. Which options both resolve it correctly?
    options:
      - "Only setting spring.main.allow-bean-definition-overriding=true and nothing else, since that flag is the single supported way to reconcile two beans that share one name"
      - "Annotate the production bean @Lazy so it is created after the test bean, letting the later definition win the name without a conflict being raised"
      - "Rename the production bean at runtime via a BeanFactoryPostProcessor so the two definitions no longer collide on the same bean name"
      - "Either enable spring.main.allow-bean-definition-overriding=true, OR replace the @TestConfiguration override with a @MockitoBean (which replaces rather than redefines and sidesteps the override flag)"
    answer: 3
    explanation: |
      Since Boot 2.1 bean-definition overriding is disabled by default, so a
      same-named @Bean throws. You can enable overriding, or avoid the redefinition
      entirely by using @MockitoBean, which registers a replacement through the
      bean-override mechanism rather than a conflicting definition.
    ref: "concepts.md#testconfiguration-and-test-specific-beans"

  - id: testing-spring-boot-applications-090
    difficulty: advanced
    tags: [testconfiguration, import, autoconfig]
    question: |
      When you @Import a top-level @TestConfiguration into a @SpringBootTest, how does
      it interact with the discovered @SpringBootConfiguration?
    options:
      - "It supplants the discovered @SpringBootConfiguration entirely, so auto-configuration no longer runs and only the imported test beans populate the context"
      - "It is added on top of the discovered configuration, so you still get full auto-configuration plus the test beans"
      - "It is silently ignored on import unless the test class additionally declares @EnableAutoConfiguration to re-activate its bean methods"
      - "It only takes effect when declared as a nested static class, and an @Import of a top-level @TestConfiguration contributes no beans at all"
    answer: 1
    explanation: |
      @Import of a @TestConfiguration supplements the primary configuration; the
      normal @SpringBootConfiguration/auto-configuration still applies and the test
      beans are added. (Nested static @TestConfiguration is auto-detected without
      @Import for that class only.)
    ref: "concepts.md#testconfiguration-and-test-specific-beans"

  - id: testing-spring-boot-applications-091
    difficulty: expert
    tags: [testcontainers, singleton-container, performance]
    question: |
      A large suite spins up a fresh PostgreSQLContainer per test class (static
      @Container) and is still too slow because there are 40 classes. Which pattern
      minimizes container startups the most while remaining CI-safe?
    options:
      - "Make the container non-static so JUnit restarts a fresh instance before every test method, which guarantees isolation but actually multiplies startups across the 40 classes"
      - "Set testcontainers.reuse.enable=true so the Ryuk reaper is disabled and the identical container is kept alive between separate CI builds, eliminating startups entirely"
      - "Add @DirtiesContext to every class so Spring closes and rebuilds the context between classes, which coalesces all 40 containers into one shared instance for the whole run"
      - "Use the singleton-container pattern: declare a static container in a base class and start it once in a static initializer (not via @Container lifecycle), sharing it across all classes so it starts a single time per JVM"
    answer: 3
    explanation: |
      The singleton-container pattern starts one container in a static block shared
      by all test classes (Ryuk reaps it at JVM exit), so it starts once per run —
      ideal when combined with a shared cached context. Reuse across builds is a
      local-dev optimization, typically disabled in CI.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-092
    difficulty: advanced
    tags: [testcontainers, serviceconnection, precedence]
    question: |
      A test declares both a @ServiceConnection on a PostgreSQLContainer AND a
      @DynamicPropertySource setting spring.datasource.url to a typo'd value. The app
      still connects correctly. Why?
    options:
      - "@ServiceConnection produces a ConnectionDetails bean that takes precedence over the datasource URL property, so the correct container-derived URL is used and the typo'd property is overridden"
      - "@DynamicPropertySource callbacks are unconditionally skipped by the framework whenever any @Container field is detected on the test class"
      - "Spring parses both candidate URLs, merges their query parameters, and deterministically selects the lexicographically shorter of the two strings"
      - "Testcontainers runs a JDBC-URL syntax validator on startup and silently rewrites the typo'd host segment back to the container's real mapped address"
    answer: 0
    explanation: |
      @ServiceConnection registers ConnectionDetails beans that outrank ordinary
      properties for connection setup. So the container's real coordinates win, and
      the mistyped @DynamicPropertySource value is effectively shadowed — which can
      mask configuration mistakes.
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-093
    difficulty: expert
    tags: [testcontainers, lifecycle, ordering, failure-mode]
    question: |
      A test class declares `static PostgreSQLContainer<?> pg = new
      PostgreSQLContainer<>("postgres:16");` and a @DynamicPropertySource calling
      pg::getJdbcUrl, but FORGOT the @Testcontainers annotation on the class. What is
      the likely failure?
    options:
      - "The container starts twice — once by the JUnit extension and once by the static field initializer — leaking a duplicate Docker instance on every run"
      - "Nothing goes wrong — @Testcontainers is purely optional for static fields, which the framework starts eagerly via their static initializer regardless"
      - "The TestcontainersExtension never runs, so the static container is never started; getJdbcUrl() is called on a non-running container and fails (IllegalStateException / connection errors)"
      - "The context loads and wires normally, but every repository query silently returns null because the container has no mapped port bound yet"
    answer: 2
    explanation: |
      Without @Testcontainers there is no extension to manage @Container lifecycle,
      so the static container isn't started. @DynamicPropertySource then queries a
      stopped container's mapped URL/port, throwing. Add @Testcontainers (or start
      the container manually in the singleton pattern).
    ref: "concepts.md#testcontainers-for-real-integration"

  - id: testing-spring-boot-applications-094
    difficulty: expert
    tags: [transactions, testtransaction, propagation]
    question: |
      Within one @Transactional test method you need to (1) insert a row, (2) confirm
      it is actually committed and visible to a fresh connection, then (3) continue
      asserting. Which approach works?
    options:
      - "Use TestTransaction.flagForCommit(); TestTransaction.end(); then TestTransaction.start() to run the commit and begin a new transaction for further work"
      - "Call entityManager.getTransaction().begin() and commit() directly to drive the same JPA transaction the TestContext framework already manages for you"
      - "Annotate the method @Commit(atStatement = true) so each persist statement is flushed and committed the instant it executes mid-method"
      - "There is genuinely no supported hook to commit mid-method; a managed test transaction can only be resolved once, at the very end of the method"
    answer: 0
    explanation: |
      TestTransaction gives programmatic control of the test-managed transaction:
      flagForCommit() then end() commits it, and start() opens a new one for
      subsequent steps. @Commit only affects end-of-method behavior, and calling the
      JPA EntityManager transaction directly conflicts with the managed transaction.
    ref: "concepts.md#verifying-transactions-and-rollback-in-tests"

  - id: testing-spring-boot-applications-095
    difficulty: expert
    tags: [transactions, async, isolation]
    question: |
      A @SpringBootTest is @Transactional. Inside the test, code calls an @Async
      service method that reads a row the test just inserted (but not committed). The
      async method reports the row as missing. Why?
    options:
      - "The @Async annotation switches the whole application into a no-transaction mode, so persistence is disabled globally for the duration of the test"
      - "The @Async method runs on a different thread with its own transaction/connection and cannot see the test's uncommitted changes (which live in the test thread's transaction that hasn't committed)"
      - "Spring pre-emptively rolls back the freshly inserted row the moment an @Async invocation is dispatched from within a transactional test"
      - "A @Transactional test is forbidden from invoking any @Async method and the container rejects the call with an IllegalStateException"
    answer: 1
    explanation: |
      The test's insert is uncommitted and bound to the test thread's transaction.
      The @Async method executes on a separate thread with a separate transaction and
      connection, so under normal isolation it cannot see the uncommitted row. Commit
      first (or restructure) to make it visible.
    ref: "concepts.md#flaky-tests-ordering-isolation-and-parallelism"

  - id: testing-spring-boot-applications-096
    difficulty: advanced
    tags: [flaky, ordering, shared-state]
    question: |
      A suite passes when run whole but a single test fails when run in isolation
      (and vice versa in another case). What is the most likely root cause and the
      most principled fix?
    options:
      - "JUnit 5 deliberately randomizes method execution order on every run, so the durable fix is to pin a fixed sequence with @TestMethodOrder(OrderAnnotation.class)"
      - "Mockito's strict-stubbing default is failing on stubs used only in the whole-suite path; switch the affected mocks to lenient() to stabilize both runs"
      - "The TestContext cache is overflowing its 32-entry limit and evicting a context the test depends on; raise spring.test.context.cache.maxSize to fix it"
      - "Hidden inter-test coupling via shared mutable state (a committed row from a real-server test, a mutated cached singleton, or a static field); fix by eliminating shared state / cleaning up in @AfterEach rather than depending on execution order"
    answer: 3
    explanation: |
      Order-dependence is a symptom of leaked shared state, not a reason to enforce
      an order. The durable fix is to remove the coupling — clean up committed data,
      avoid mutating shared singletons/cached-context beans, reset statics — so any
      order passes.
    ref: "concepts.md#flaky-tests-ordering-isolation-and-parallelism"

  - id: testing-spring-boot-applications-097
    difficulty: advanced
    tags: [flaky, async, awaitility]
    question: |
      A test triggers an @Async handler and then immediately asserts a side effect,
      failing intermittently. Which is the best fix?
    options:
      - "Add a fixed Thread.sleep(500) before the assertion so the async handler is guaranteed to have finished writing its side effect first"
      - "Await the condition with Awaitility (or await the returned CompletableFuture), polling until the side effect is observed or a timeout elapses"
      - "Annotate the test @RepeatedTest(10) so it reruns until at least one attempt happens to catch the completed side effect"
      - "Configure the handler to run synchronously in production while keeping it asynchronous inside the test harness only"
    answer: 1
    explanation: |
      Fixed sleeps are flaky and slow. Awaitility polls for the expected condition
      with a timeout, or you can join the returned CompletableFuture — deterministic
      and fast when the async work finishes early.
    ref: "concepts.md#flaky-tests-ordering-isolation-and-parallelism"

  - id: testing-spring-boot-applications-098
    difficulty: expert
    tags: [parallelism, junit5, mockitobean]
    question: |
      A team enables JUnit 5 parallel execution and several @SpringBootTest classes
      that share one cached context and use @MockitoBean start failing
      intermittently. What is the underlying problem?
    options:
      - "Parallel execution is categorically unsupported by the Spring TestContext framework, which requires every test to run on the single main thread"
      - "The TestContext context cache is not thread-safe, so it must be disabled entirely before any parallel execution can be enabled safely"
      - "Concurrent tests share the same mock instances in the cached context; mock reset and concurrent stubbing/verification race across threads, corrupting each other's expectations — serialize the risky classes (@ResourceLock / @Execution(SAME_THREAD)) or avoid sharing mutable context state"
      - "@MockitoBean is restricted to a single test class per JVM and throws once a second class attempts to declare one"
    answer: 2
    explanation: |
      The context cache itself is thread-safe, but the shared mock beans are not
      safe to stub/verify/reset concurrently. Parallel tests on the same context race
      over mock state. Serialize them or redesign to avoid shared mutable state.
    ref: "concepts.md#flaky-tests-ordering-isolation-and-parallelism"

  - id: testing-spring-boot-applications-099
    difficulty: advanced
    tags: [slice-internals, importautoconfiguration]
    question: |
      You want a @DataJpaTest to also run your Flyway migrations (which the slice
      normally may not fully wire for your setup) without escalating to
      @SpringBootTest. Which mechanism most precisely adds just that
      auto-configuration to the slice?
    options:
      - "@EnableAutoConfiguration on the test class, which re-enables the full set of auto-configurations and thereby escalates the slice to a near-@SpringBootTest context"
      - "@ImportAutoConfiguration(FlywayAutoConfiguration.class), which imports only the named auto-configuration into the slice"
      - "@ComponentScan(\"org.flywaydb\") so the migrator's own classes are discovered and registered as beans directly by the slice"
      - "@Import(Flyway.class) to add the Flyway type as a bean and let it self-configure its datasource and migration locations"
    answer: 1
    explanation: |
      @ImportAutoConfiguration adds specific auto-configuration classes to a slice
      without turning on full auto-configuration, keeping the context minimal while
      enabling exactly the piece you need.
    ref: "concepts.md#slice-internals-autoconfigure-importautoconfiguration-filters"

  - id: testing-spring-boot-applications-100
    difficulty: advanced
    tags: [slice-internals, typeexcludefilters]
    question: |
      Inside a @WebMvcTest you add @ComponentScan with an includeFilter to bring your
      @Service back into the slice, but it still isn't registered. What is the
      mechanism preventing it?
    options:
      - "@Service classes are categorically ineligible to become Spring beans in any test context and are always skipped"
      - "The slice's @TypeExcludeFilters (e.g. WebMvcTypeExcludeFilter) exclude non-web stereotypes and take precedence, so @Service beans are filtered out regardless of your includeFilter"
      - "Declaring @ComponentScan on a test class is rejected by the framework and its filters are quietly discarded at bootstrap"
      - "The @Service must additionally be marked @Primary before it is allowed to survive the slice's component filtering"
    answer: 1
    explanation: |
      Slices enforce a @TypeExcludeFilters that drops components outside the slice's
      scope. That exclusion wins over a user includeFilter, so services stay out.
      Provide the service as @MockitoBean, @Import its config, or use @SpringBootTest.
    ref: "concepts.md#slice-internals-autoconfigure-importautoconfiguration-filters"

  - id: testing-spring-boot-applications-101
    difficulty: intermediate
    tags: [security, spring-security-test, dependency]
    question: |
      A test tries to use @WithMockUser and SecurityMockMvcRequestPostProcessors but
      the symbols don't resolve at compile time. What is missing?
    options:
      - "The spring-security-test dependency, which provides the test-only security annotations and MockMvc post-processors"
      - "An @EnableWebSecurity annotation on the test class, which is what exports the @WithMockUser and post-processor symbols onto the test classpath"
      - "Nothing extra — spring-boot-starter-security already bundles these utilities, so the unresolved symbols must be a package-import typo in the test"
      - "A custom SecurityFilterChain bean, whose presence is what registers the @WithMockUser annotation processor for the compiler to resolve"
    answer: 0
    explanation: |
      @WithMockUser, @WithUserDetails, and SecurityMockMvcRequestPostProcessors live
      in spring-security-test, a separate test dependency. The runtime security
      starter does not include these test utilities.
    ref: "concepts.md#testing-security-and-web-layers-deeply"

  - id: testing-spring-boot-applications-102
    difficulty: intermediate
    tags: [junit5, methodsource, parameterized]
    question: |
      A @ParameterizedTest uses @MethodSource("cases") but fails at runtime because
      the factory method cannot be found/used. Which requirement is most likely
      violated?
    options:
      - "The factory method must return void and populate a shared arguments field as a side effect for the runner to read back"
      - "The factory method must be static (unless the test class is @TestInstance(PER_CLASS)) and provide a Stream/Collection/array of arguments"
      - "@MethodSource can reference only a factory method that lives in a completely separate, fully-qualified helper class, never one in the test class itself"
      - "The factory method must itself be annotated @Test so the JUnit platform discovers and registers it as an argument provider"
    answer: 1
    explanation: |
      @MethodSource factory methods must be static by default (or the class must use
      PER_CLASS lifecycle) and return a Stream/Iterable/array of arguments. A void or
      @Test-annotated method won't work.
    ref: "concepts.md#junit-5-and-mockito-basics"

  - id: testing-spring-boot-applications-103
    difficulty: expert
    tags: [datajpatest, native-query, validation]
    question: |
      A repository declares a native query
      `@Query(value = "SELECT * FROM ordrs WHERE customer_id = ?1", nativeQuery = true)`
      (note the typo 'ordrs'). A @DataJpaTest exists for the repository but never
      invokes this method, and the whole suite is green — yet production fails. In
      contrast, a typo in a DERIVED query method name (e.g. findByCustmerId) would
      have failed the same @DataJpaTest at context startup. What explains the
      difference?
    options:
      - "Native query SQL is an opaque string that is NOT parsed against the entity metamodel; it is only validated when the DB actually executes it, so an uncalled native query hides its error — whereas derived query method names ARE parsed by Spring Data at repository bootstrap (default eager mode), failing fast even if never called"
      - "It is the reverse: native query SQL is fully validated against the schema at EntityManagerFactory bootstrap, while derived query method names are resolved lazily only on first invocation"
      - "The embedded H2 database used by the slice silently ignores references to unknown table names, whereas the production Postgres dialect rejects them at execution time"
      - "@DataJpaTest selectively disables Spring Data's query validation for native queries only, while continuing to eagerly validate every JPQL and derived query"
    answer: 0
    explanation: |
      Derived query methods are parsed by Spring Data (PartTree → property paths) at
      repository initialization, and JPQL @Query strings by Hibernate at
      EntityManagerFactory bootstrap — so with the default eager bootstrap mode their
      typos fail at startup regardless of invocation. A NATIVE query's SQL is opaque
      to Hibernate/Spring Data and is only checked when the database executes it, so
      an uncalled native query with a bad table/column name goes undetected. Add a
      test that actually invokes each native query.
    ref: "concepts.md#datajpatest-persistence-slice"
