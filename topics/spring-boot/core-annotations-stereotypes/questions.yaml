topic: "Core Annotations & Stereotypes"
domain: spring-boot
topic_slug: core-annotations-stereotypes
version: 1
questions:
  - id: core-annotations-stereotypes-001
    difficulty: beginner
    tags: [stereotypes, component]
    question: |
      Which annotation is the generic root stereotype that all the other
      Spring stereotype annotations are meta-annotated with?
    options:
      - "@Component"
      - "@Bean"
      - "@Repository"
      - "@Service"
    answer: 0
    explanation: |
      @Component is the root stereotype. @Service, @Repository, and @Controller
      are all meta-annotated with @Component, which is why component scanning
      picks them all up as beans. @Bean is method-level and unrelated to the
      stereotype hierarchy.
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-002
    difficulty: beginner
    tags: [restcontroller, controller]
    question: |
      @RestController is equivalent to combining which two annotations?
    options:
      - "@Component + @ResponseBody"
      - "@Controller + @ResponseBody"
      - "@Service + @ResponseBody"
      - "@Controller + @RequestMapping"
    answer: 1
    explanation: |
      @RestController is a convenience composed annotation equal to @Controller
      plus @ResponseBody at the type level, so every handler method's return
      value is written to the HTTP response body instead of being resolved as a
      view name.
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-003
    difficulty: intermediate
    tags: [repository, exception-translation]
    question: |
      Which stereotype annotation, among the standard ones, adds actual runtime
      behavior beyond marking a class as a bean?
    options:
      - "@Controller (adds automatic JSON serialization)"
      - "@Service (adds transaction demarcation automatically)"
      - "@Repository (enables persistence exception translation)"
      - "@Component (enables automatic lazy initialization of the bean)"
    answer: 2
    explanation: |
      Only @Repository adds runtime behavior: when a
      PersistenceExceptionTranslationPostProcessor is present (auto-registered in
      Spring Boot), beans annotated @Repository are proxied so provider-specific
      persistence exceptions are translated into Spring's DataAccessException
      hierarchy. @Service adds no behavior; transactions require @Transactional.
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-004
    difficulty: intermediate
    tags: [repository, exception-translation, data-access]
    question: |
      What is the primary purpose of @Repository's exception translation?
    options:
      - "To log every SQL statement executed by the DAO to a dedicated audit appender so operators can trace all query activity at runtime"
      - "To open and close a database transaction around each DAO method automatically, committing on success and rolling back on any exception"
      - "To transparently retry failed database operations a configurable number of times with exponential backoff before surfacing the error"
      - "To convert checked SQLException/PersistenceException into Spring's unchecked DataAccessException hierarchy for a consistent, technology-agnostic model"
    answer: 3
    explanation: |
      Different persistence technologies throw different exceptions (SQLException,
      JPA PersistenceException, HibernateException). Exception translation maps
      them all into Spring's consistent, unchecked DataAccessException hierarchy
      so service code isn't coupled to a specific persistence provider.
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-005
    difficulty: advanced
    tags: [repository, exception-translation, proxy]
    question: |
      A developer writes a hand-coded DAO annotated with @Repository. Inside a
      method they catch the JPA PersistenceException, wrap it in their own
      RuntimeException, and rethrow. They are surprised no DataAccessException
      appears. Why?
    options:
      - "Translation happens at the proxy boundary on exceptions propagating out; by catching and rewrapping inside the method, they bypass the translator"
      - "@Repository must also be annotated with @Transactional for translation to occur"
      - "PersistenceExceptionTranslationPostProcessor is disabled by default in Spring Boot"
      - "Exception translation only works for Spring Data repositories, never hand-written ones"
    answer: 0
    explanation: |
      Translation is applied by an AOP advisor at the proxy boundary to
      exceptions that propagate out of the method. If the code catches the
      original exception and throws a different one, the translator never sees
      the original persistence exception, so no DataAccessException is produced.
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-006
    difficulty: beginner
    tags: [service, component]
    question: |
      At runtime today, what is the behavioral difference between @Service and
      @Component?
    options:
      - "@Service automatically enables declarative transaction management on its methods, whereas a plain @Component gets no such behavior"
      - "There is no behavioral difference; @Service is a semantic marker meta-annotated with @Component"
      - "@Service beans are eagerly initialized; @Component beans are lazy"
      - "@Service beans are always singletons; @Component beans are prototypes"
    answer: 1
    explanation: |
      @Service is meta-annotated with @Component and currently adds no extra
      runtime behavior. It exists to communicate the business/service-layer role
      and to allow tooling or pointcuts to target that layer. Choosing it over
      @Component is about readability and intent.
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-007
    difficulty: intermediate
    tags: [controller, restcontroller, view]
    question: |
      A method in a plain @Controller returns the String "user" and is not
      annotated with @ResponseBody. What happens?
    options:
      - "Spring returns a JSON object {\"value\":\"user\"}"
      - "The literal text 'user' is written to the HTTP response body"
      - "A view named 'user' is resolved and rendered by the ViewResolver"
      - "A 500 error is thrown because String is not a valid return type"
    answer: 2
    explanation: |
      In a @Controller without @ResponseBody, a returned String is treated as a
      logical view name and passed to the ViewResolver. To write the literal
      string to the body you'd need @ResponseBody (or use @RestController, which
      applies it to every method).
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-008
    difficulty: intermediate
    tags: [meta-annotations, composed]
    question: |
      What is a "meta-annotation" in Spring?
    options:
      - "An annotation processed only at compile time and stripped from the class file, leaving no trace available for runtime reflection"
      - "An annotation that must be registered in application.properties before the container will recognize and process it at startup"
      - "An annotation that can only be applied to interfaces and is silently ignored when placed on a concrete class or method"
      - "An annotation that is applied to another annotation, forming the basis of composed/stereotype annotations"
    answer: 3
    explanation: |
      A meta-annotation is an annotation used to annotate another annotation.
      Spring's stereotypes rely on this: @Service is meta-annotated with
      @Component. Spring transitively searches meta-annotations via
      MergedAnnotations/AnnotatedElementUtils.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-009
    difficulty: advanced
    tags: [meta-annotations, aliasfor]
    question: |
      What does @AliasFor enable in Spring's composed annotations?
    options:
      - "It lets a composed annotation declare an attribute that overrides/aliases an attribute from a meta-annotation (e.g. @GetMapping's path aliasing @RequestMapping's path)"
      - "It marks an annotation attribute as deprecated so that Spring logs a warning whenever that attribute is set on any annotated element"
      - "It forces the annotation to be inherited by subclasses even when the annotation itself is not meta-annotated with @Inherited"
      - "It renames the resulting bean at registration time using the value supplied to the aliased attribute"
    answer: 0
    explanation: |
      @AliasFor establishes aliases between annotation attributes, either within
      one annotation or between a composed annotation and its meta-annotation.
      For example @GetMapping is @RequestMapping(method=GET) and its path
      attribute is @AliasFor the path attribute of @RequestMapping.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-010
    difficulty: beginner
    tags: [component-scanning, basepackages]
    question: |
      With a standard @SpringBootApplication on class com.acme.app.Application,
      which packages are component-scanned by default?
    options:
      - "Only com.acme.app (no sub-packages)"
      - "com.acme.app and all of its sub-packages"
      - "The entire com.acme tree including parent packages"
      - "Only classes explicitly listed in application.properties"
    answer: 1
    explanation: |
      @SpringBootApplication includes @ComponentScan with no basePackages, so it
      defaults to the package of the annotated class and all sub-packages. Beans
      in sibling or parent packages are not discovered — a common reason to place
      the main class in a root package.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-011
    difficulty: advanced
    tags: [component-scanning, asm, internals]
    question: |
      How does ClassPathScanningCandidateComponentProvider determine which
      classes are candidate components?
    options:
      - "It instantiates each class via its no-arg constructor and checks whether the resulting object implements the marker Component interface"
      - "It loads every class on the classpath into the JVM and calls getAnnotations() reflectively to look for stereotype annotations"
      - "It reads class file metadata with ASM without loading the classes, matching against include/exclude filters"
      - "It queries a compile-time-generated component index that Spring stores as key/value entries inside application.properties"
    answer: 2
    explanation: |
      Scanning uses ASM to read class bytecode metadata without loading/initializing
      the classes, which is fast and avoids side effects. Candidates are matched
      against the include filters (default: @Component/meta-annotated) and
      exclude filters to produce bean definitions.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-012
    difficulty: advanced
    tags: [component-scanning, filters]
    question: |
      You add includeFilters to @ComponentScan to pick up classes annotated with
      your custom @FeatureFlag, but you find that ordinary @Component/@Service
      classes are STILL being scanned too. Why, and how do you scan only your
      filtered classes?
    options:
      - "You must also add a matching excludeFilter for every built-in stereotype (@Component, @Service, @Repository, @Controller) to suppress them"
      - "includeFilters are silently ignored unless basePackageClasses is also set to anchor the scan to a specific marker type"
      - "Include filters always win over the defaults; the only fix is to remove the @Component annotations from the other classes"
      - "The default @Component filter is still active; set useDefaultFilters = false to disable it so only your includeFilters apply"
    answer: 3
    explanation: |
      By default useDefaultFilters = true, which keeps the built-in @Component
      filter. Adding includeFilters augments rather than replaces it. To scan
      ONLY your filtered classes, set useDefaultFilters = false so the default
      stereotype filter is turned off.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-013
    difficulty: intermediate
    tags: [component-scanning, filters, filtertype]
    question: |
      Which of the following is NOT a valid FilterType for @ComponentScan
      include/exclude filters?
    options:
      - "BEAN_NAME"
      - "REGEX"
      - "ANNOTATION"
      - "ASSIGNABLE_TYPE"
    answer: 0
    explanation: |
      The valid FilterType values are ANNOTATION, ASSIGNABLE_TYPE, ASPECTJ,
      REGEX, and CUSTOM. There is no BEAN_NAME filter type.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-014
    difficulty: intermediate
    tags: [component-scanning, basepackages, type-safe]
    question: |
      Which @ComponentScan attribute provides a type-safe alternative to
      basePackages that survives package renames/refactors?
    options:
      - "typedPackages"
      - "basePackageClasses"
      - "scanMarkers"
      - "packageRoot"
    answer: 1
    explanation: |
      basePackageClasses accepts marker classes/interfaces; Spring scans the
      packages of those types. Because it references actual types, an IDE refactor
      that moves a package updates it automatically, unlike the String-based
      basePackages.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-015
    difficulty: intermediate
    tags: [configuration, cglib, full-mode]
    question: |
      In a full @Configuration class (proxyBeanMethods = true), when @Bean method
      a() internally calls @Bean method b(), what happens?
    options:
      - "b() returns null because @Bean methods can never be invoked directly from other methods within the configuration class"
      - "b() executes its full body each time it is called, constructing and returning a brand-new instance on every invocation"
      - "A CGLIB interceptor returns the shared container singleton for b() instead of re-running the method"
      - "Spring throws a circular-reference exception because two @Bean methods in the same class are calling one another"
    answer: 2
    explanation: |
      Full @Configuration classes are subclassed with CGLIB. The interceptor
      detects inter-bean method calls and returns the singleton managed by the
      container, guaranteeing singleton semantics even when @Bean methods call
      each other directly.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-016
    difficulty: advanced
    tags: [configuration, lite-mode, proxybeanmethods]
    question: |
      Given this config, how many distinct ServiceB instances exist after startup?

          @Configuration(proxyBeanMethods = false)
          class Cfg {
            @Bean ServiceA a() { return new ServiceA(b()); }
            @Bean ServiceB b() { return new ServiceB(); }
          }
    options:
      - "Zero — the config fails to start because lite mode forbids one @Bean method from calling another within the same class"
      - "Unbounded — a fresh ServiceB is created on every access since lite mode disables all singleton caching for @Bean methods"
      - "One — Spring always enforces singleton semantics regardless of the proxyBeanMethods setting on the configuration class"
      - "Two — the container creates one ServiceB bean, and a()'s direct call to b() creates a second plain instance"
    answer: 3
    explanation: |
      With proxyBeanMethods = false (lite mode) there is no CGLIB interception, so
      a()'s direct call to b() is a plain Java call that creates a NEW ServiceB.
      The container also creates its own ServiceB singleton from the b() bean
      definition. Result: two instances. Using @Bean ServiceA a(ServiceB b) would
      inject the container singleton instead.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-017
    difficulty: intermediate
    tags: [configuration, lite-mode, startup]
    question: |
      Why might a Spring Boot auto-configuration class use
      @Configuration(proxyBeanMethods = false)?
    options:
      - "To skip CGLIB subclassing for faster startup and lower memory when @Bean methods don't call each other"
      - "To make the beans it declares eligible for persistence exception translation into the DataAccessException hierarchy"
      - "To allow the configuration class itself to be picked up and registered as a @Component-scanned bean definition"
      - "To force every bean the class declares to be created as a prototype rather than a shared singleton instance"
    answer: 0
    explanation: |
      Lite mode (proxyBeanMethods = false) avoids creating a CGLIB proxy for the
      configuration class, reducing startup time and memory. It's appropriate when
      @Bean methods don't invoke each other (dependencies are passed as method
      parameters instead), which is common in Boot auto-config.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-018
    difficulty: advanced
    tags: [configuration, final, cglib]
    question: |
      Which statement about a full @Configuration class (default proxyBeanMethods)
      is TRUE?
    options:
      - "It can be freely declared final, since CGLIB proxies the interface rather than subclassing the configuration class"
      - "It cannot be final because Spring must create a CGLIB subclass of it"
      - "Its @Bean methods must all be declared static so the container can invoke them before instantiating the class"
      - "It cannot depend on other beans because CGLIB interception blocks constructor and field injection into the class"
    answer: 1
    explanation: |
      Because full @Configuration relies on CGLIB subclassing to intercept @Bean
      methods, the class (and its @Bean methods) cannot be final. Lite mode
      (proxyBeanMethods = false) does not subclass, so the class may be final.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-019
    difficulty: advanced
    tags: [configuration, method-parameter-injection]
    question: |
      You want two beans to share the same ServiceB singleton regardless of proxy
      mode. What is the most robust approach?
    options:
      - "Call the b() factory method twice at startup so Spring caches the first ServiceB and reuses it thereafter"
      - "Always annotate the enclosing class with @Component instead of @Configuration so its bean methods are shared"
      - "Declare @Bean ServiceA a(ServiceB b) so the container injects the ServiceB singleton as a method parameter"
      - "Mark ServiceB as @Lazy so the container defers its creation and hands back the same proxy to every caller"
    answer: 2
    explanation: |
      Receiving the dependency as a method parameter (@Bean ServiceA a(ServiceB b))
      always resolves the container-managed singleton, whether or not the config
      class is CGLIB-proxied. This sidesteps the proxyBeanMethods dependency
      entirely and is the recommended pattern.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-020
    difficulty: intermediate
    tags: [configuration, component, comparison]
    question: |
      What happens when @Bean methods are placed on a class annotated with
      @Component (rather than @Configuration)?
    options:
      - "They behave identically to full @Configuration because Spring CGLIB-proxies any class that declares @Bean methods"
      - "The beans are not registered at all because @Bean is only honored on classes annotated with @Configuration"
      - "It is a compile error, since the @Bean annotation is not permitted on methods of a @Component-annotated class"
      - "They operate in lite mode: no CGLIB interception, so inter-@Bean-method calls create new instances rather than returning container singletons"
    answer: 3
    explanation: |
      @Bean methods on a @Component (or any non-@Configuration class) run in lite
      mode. There's no CGLIB proxy, so a @Bean method calling another @Bean method
      is a plain call producing a new instance, not the shared container singleton.
    ref: "concepts.md#configuration-vs-component"

  - id: core-annotations-stereotypes-021
    difficulty: beginner
    tags: [bean, component, comparison]
    question: |
      What is the key structural difference between @Bean and @Component?
    options:
      - "@Bean is applied to a method; @Component is applied to a class"
      - "@Bean is applied to a class; @Component is applied to a method"
      - "Both are applied only to fields and are read reflectively during autowiring"
      - "@Bean is usable only from XML configuration; @Component is usable only from annotation config"
    answer: 0
    explanation: |
      @Bean annotates a factory method (typically in a @Configuration class) and
      you write the instantiation logic. @Component annotates a class discovered
      through component scanning, with the container constructing the instance.
    ref: "concepts.md#bean-vs-component"

  - id: core-annotations-stereotypes-022
    difficulty: intermediate
    tags: [bean, third-party]
    question: |
      You need to register a bean for a third-party class (e.g. ObjectMapper or
      RestTemplate) whose source you cannot modify. Which is the correct approach?
    options:
      - "Extend the third-party class in a subclass, add @Component to that subclass, and let component scanning register it"
      - "Declare a @Bean method in a @Configuration class that constructs and configures the instance"
      - "List the fully-qualified class name in application.properties under the spring.beans registration key"
      - "It is impossible to register beans for third-party classes whose source code you are not able to modify"
    answer: 1
    explanation: |
      Since you can't add @Component to library code, the canonical solution is a
      @Bean factory method inside a @Configuration class where you instantiate and
      configure the third-party object. This is one of @Bean's primary use cases.
    ref: "concepts.md#bean-vs-component"

  - id: core-annotations-stereotypes-023
    difficulty: intermediate
    tags: [bean, naming]
    question: |
      By default, what is the bean name for a method declared as
      @Bean public DataSource primaryDataSource() { ... }?
    options:
      - "A random UUID generated by the container to guarantee the bean name is globally unique"
      - "dataSource, the decapitalized simple name of the method's declared return type"
      - "primaryDataSource (the method name)"
      - "DataSource, the exact simple name of the return type kept in its original capitalization"
    answer: 2
    explanation: |
      For @Bean methods, the default bean name is the method name
      (primaryDataSource). You can override it with @Bean("name") or
      @Bean(name = {"a","b"}). For scanned @Component classes, the default name is
      the decapitalized simple class name.
    ref: "concepts.md#bean-vs-component"

  - id: core-annotations-stereotypes-024
    difficulty: intermediate
    tags: [import, configuration]
    question: |
      What is the primary purpose of @Import?
    options:
      - "To import external property files into the environment so their keys become resolvable placeholders"
      - "To import beans from a remote application context over HTTP and merge them into the local registry"
      - "To import Java packages at configuration time so their classes can be referenced without qualification"
      - "To pull additional @Configuration classes, ImportSelectors, or ImportBeanDefinitionRegistrars into the current context"
    answer: 3
    explanation: |
      @Import composes configuration by bringing in other @Configuration classes,
      or programmatic registrations via ImportSelector /
      ImportBeanDefinitionRegistrar. It's the mechanism behind many @Enable*
      annotations.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-025
    difficulty: advanced
    tags: [import, importselector, autoconfiguration]
    question: |
      Which mechanism does Spring Boot's @EnableAutoConfiguration use to register
      auto-configuration classes?
    options:
      - "A DeferredImportSelector (AutoConfigurationImportSelector) that reads the AutoConfiguration.imports metadata file"
      - "A BeanFactoryPostProcessor that reflectively loads every jar on the classpath and registers their @Bean methods"
      - "Recursive component scanning of the org.springframework.boot package tree at application context refresh time"
      - "An ImportBeanDefinitionRegistrar that scans the classpath for @Component-annotated auto-configuration classes"
    answer: 0
    explanation: |
      @EnableAutoConfiguration imports AutoConfigurationImportSelector, a
      DeferredImportSelector that reads candidate configuration class names from
      META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports
      (Boot 2.7+/3.x; older versions used spring.factories).
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-026
    difficulty: advanced
    tags: [import, registrar]
    question: |
      Which @Import target lets you register bean definitions directly against a
      BeanDefinitionRegistry (used by Spring Data / MyBatis mapper scanning)?
    options:
      - "ImportSelector"
      - "ImportBeanDefinitionRegistrar"
      - "BeanPostProcessor"
      - "FactoryBean"
    answer: 1
    explanation: |
      ImportBeanDefinitionRegistrar exposes registerBeanDefinitions(metadata,
      registry), allowing programmatic registration of arbitrary bean definitions.
      Frameworks like Spring Data and MyBatis use it to register generated
      repository/mapper proxies.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-027
    difficulty: beginner
    tags: [value, property-injection]
    question: |
      Which syntax injects the property mail.host into a field via @Value?
    options:
      - "@Value(\"mail.host\")"
      - "@Value(\"#{mail.host}\")"
      - "@Value(\"${mail.host}\")"
      - "@Value(\"@{mail.host}\")"
    answer: 2
    explanation: |
      ${...} is the property placeholder syntax resolved by
      PropertySourcesPlaceholderConfigurer. #{...} is SpEL. A bare string is
      injected literally.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-028
    difficulty: intermediate
    tags: [value, default]
    question: |
      What does @Value("${mail.port:25}") do when the property mail.port is not
      defined?
    options:
      - "Injects null"
      - "Injects the literal string '25' but fails to convert it"
      - "Throws IllegalArgumentException at startup"
      - "Injects the default value 25"
    answer: 3
    explanation: |
      The colon in ${key:default} supplies a default used when the property is
      absent. Here the field receives 25. Without a default and no matching
      property, Spring fails startup with an unresolved-placeholder error.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-029
    difficulty: intermediate
    tags: [value, placeholder, failure]
    question: |
      A field is annotated @Value("${app.token}") but no property app.token exists
      and no default is provided. What happens at startup?
    options:
      - "The context fails to start with IllegalArgumentException: Could not resolve placeholder 'app.token'"
      - "Spring generates a random token value and injects it so the application can still start cleanly"
      - "The field is silently set to null and startup proceeds without any warning being logged"
      - "The field is set to the empty string, which Spring treats as the implicit default for missing keys"
    answer: 0
    explanation: |
      An unresolved placeholder without a default causes
      PropertySourcesPlaceholderConfigurer to throw
      IllegalArgumentException ('Could not resolve placeholder'), failing the
      context startup. This fail-fast behavior surfaces misconfiguration early.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-030
    difficulty: intermediate
    tags: [value, configuration-properties]
    question: |
      For binding many related, type-safe, and optionally validated configuration
      values, what is preferred over scattering numerous @Value annotations?
    options:
      - "@Autowired Environment plus getProperty calls everywhere"
      - "@ConfigurationProperties on a POJO with a prefix"
      - "@PropertySource on every field"
      - "A static Properties object loaded manually"
    answer: 1
    explanation: |
      @ConfigurationProperties binds a whole group of properties (by prefix) onto
      a strongly-typed POJO, supports relaxed binding, nested objects, collections,
      and JSR-303 validation. It's cleaner and more maintainable than many @Value
      annotations.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-031
    difficulty: beginner
    tags: [spel, syntax]
    question: |
      Which prefix denotes a Spring Expression Language (SpEL) expression?
    options:
      - "&{...}"
      - "${...}"
      - "#{...}"
      - "%{...}"
    answer: 2
    explanation: |
      SpEL expressions use #{...}. ${...} is property placeholder resolution.
      Placeholders are resolved first, and their result can be embedded inside a
      SpEL expression.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-032
    difficulty: intermediate
    tags: [spel, elvis]
    question: |
      In SpEL, what does the Elvis operator in #{config.timeout ?: 5000} do?
    options:
      - "Throws a SpelEvaluationException immediately whenever config.timeout evaluates to null"
      - "Compares config.timeout against 5000 for equality and returns a boolean result instead of a number"
      - "Multiplies config.timeout by 5000 and returns the numeric product as the resolved value"
      - "Returns config.timeout if non-null, otherwise the default 5000"
    answer: 3
    explanation: |
      The Elvis operator ?: returns the left operand if it is non-null (and not
      throwing), otherwise the right operand. It's a concise null-default idiom.
      Safe navigation ?. is a related null-safety operator.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-033
    difficulty: advanced
    tags: [spel, static, T-operator]
    question: |
      In SpEL, how do you reference a static method or constant, such as Math.PI?
    options:
      - "#{T(java.lang.Math).PI}"
      - "#{class:java.lang.Math.PI}"
      - "#{@java.lang.Math.PI}"
      - "#{static(java.lang.Math).PI}"
    answer: 0
    explanation: |
      The T(...) operator specifies a java.lang.Class, enabling access to static
      methods and fields, e.g. T(java.lang.Math).PI or
      T(java.lang.Integer).parseInt('5'). The @ prefix references beans, not
      classes.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-034
    difficulty: advanced
    tags: [spel, bean-reference]
    question: |
      In a SpEL expression, what does #{@dataSourceConfig.maxPoolSize} reference?
    options:
      - "A JVM system property named dataSourceConfig whose maxPoolSize sub-key is then read"
      - "The maxPoolSize property/method result of the bean named dataSourceConfig"
      - "A variable named dataSourceConfig passed into the expression's evaluation context at runtime"
      - "A public static field named maxPoolSize declared on the DataSourceConfig class type"
    answer: 1
    explanation: |
      The @ symbol in SpEL references a Spring bean by name; @dataSourceConfig
      resolves to that bean, and .maxPoolSize accesses its property/getter. (Use
      T(...) for static class members, and # for variables/arguments.)
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-035
    difficulty: advanced
    tags: [spel, collection-selection]
    question: |
      What does the SpEL expression #{jobs.?[priority > 5]} evaluate to?
    options:
      - "The single first job in iteration order whose priority value exceeds the threshold 5"
      - "A boolean flag indicating whether at least one job in the collection has a priority above 5"
      - "A new collection containing all jobs whose priority is greater than 5 (collection selection)"
      - "The integer count of how many jobs in the collection have a priority greater than 5"
    answer: 2
    explanation: |
      .?[...] is SpEL's collection selection operator; it filters the collection,
      returning a new collection of elements matching the predicate. (.^[] selects
      the first match, .$[] the last, and .![] is projection.)
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-036
    difficulty: beginner
    tags: [primary, qualifier, ambiguity]
    question: |
      Two beans of type DataSource exist and you autowire a single DataSource
      without any qualifier. What error occurs?
    options:
      - "BeanCreationException: circular reference"
      - "No error; Spring injects a random one"
      - "NoSuchBeanDefinitionException"
      - "NoUniqueBeanDefinitionException"
    answer: 3
    explanation: |
      When multiple candidates match by type and none is marked @Primary and no
      @Qualifier disambiguates, Spring throws NoUniqueBeanDefinitionException.
      @Primary or @Qualifier resolves the ambiguity.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-037
    difficulty: intermediate
    tags: [primary, qualifier, precedence]
    question: |
      A DataSource bean is marked @Primary, but an injection point uses
      @Qualifier("audit") naming a different DataSource. Which bean is injected?
    options:
      - "The bean named 'audit', because @Qualifier at the injection point overrides @Primary"
      - "Neither; the @Primary/@Qualifier clash raises NoUniqueBeanDefinitionException at startup"
      - "Both DataSources are injected together as a List because @Qualifier widens the match"
      - "The @Primary bean, because a bean-level @Primary always outranks an injection-point @Qualifier"
    answer: 0
    explanation: |
      @Qualifier at the injection point is more specific than @Primary and wins.
      @Primary only acts as the default when no qualifier narrows the choice.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-038
    difficulty: intermediate
    tags: [primary, qualifier, semantics]
    question: |
      Which statement best captures the difference between @Primary and @Qualifier?
    options:
      - "@Primary is declared at the injection point, while @Qualifier is placed on the bean definition itself"
      - "@Primary marks one bean as the default candidate (bean side); @Qualifier selects a specific bean at the injection point"
      - "They are functionally synonymous, differing only in the annotation name Spring recognizes"
      - "@Qualifier is honored only in XML bean configuration and is ignored by annotation-based wiring"
    answer: 1
    explanation: |
      @Primary is coarse-grained and lives on the bean definition, declaring the
      default when multiple candidates match. @Qualifier is fine-grained and lives
      at the injection point, naming exactly which bean to wire.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-039
    difficulty: advanced
    tags: [qualifier, collection, order]
    question: |
      When you inject List<Validator> and several Validator beans exist (one is
      @Primary), what is injected and in what order?
    options:
      - "An empty list, because collection injection requires an explicit @Qualifier to match candidates"
      - "Only the @Primary Validator, since @Primary filters the collection down to the preferred bean"
      - "All Validator beans, ordered by @Order/Ordered; @Primary is irrelevant for collection injection"
      - "A single arbitrarily-chosen Validator, since Spring cannot inject multiple beans into one point"
    answer: 2
    explanation: |
      Injecting a collection gathers ALL matching beans, ordered via @Order or the
      Ordered interface (and @Priority). @Primary has no effect here because there's
      no single-bean disambiguation to perform.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-040
    difficulty: advanced
    tags: [autowiring, resolution-order, name-fallback]
    question: |
      No @Qualifier and no @Primary is present, but two beans of the type exist. A
      constructor parameter is named 'auditDs' and one of the beans is named
      'auditDs'. What does Spring do?
    options:
      - "Injects whichever matching bean was defined first, using registration order as the tiebreaker"
      - "Injects null silently, leaving the constructor parameter unset and deferring any failure"
      - "Throws NoUniqueBeanDefinitionException immediately, since name-based fallback is never attempted"
      - "Falls back to matching the parameter name against a bean name and injects the bean named 'auditDs'"
    answer: 3
    explanation: |
      After type matching yields multiple candidates and neither @Qualifier nor
      @Primary applies, Spring falls back to matching the parameter/field name to a
      bean name. Since a bean is named 'auditDs', that one is injected instead of
      failing.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-041
    difficulty: intermediate
    tags: [injection, constructor, field]
    question: |
      Why is constructor injection generally preferred over field injection?
    options:
      - "It enables final fields, guarantees fully-initialized objects, makes dependencies explicit, and needs no reflection for testing"
      - "It permits circular dependencies between beans that field injection would otherwise reject at startup"
      - "It automatically switches the bean to prototype scope so a fresh instance is created per injection"
      - "It is measurably faster at runtime because it bypasses the container's proxy and injection machinery"
    answer: 0
    explanation: |
      Constructor injection supports immutability (final fields), fails fast if a
      dependency is missing, makes the dependency set explicit (surfacing
      too-many-dependencies smells), and lets tests construct the object without
      reflection. Field injection hides dependencies and complicates testing.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-042
    difficulty: intermediate
    tags: [injection, autowired, single-constructor]
    question: |
      Since Spring 4.3, if a bean class has exactly one constructor, is @Autowired
      required on it for dependency injection?
    options:
      - "Yes, @Autowired is always required on every constructor regardless of how many exist"
      - "No, @Autowired is optional for a single constructor; Spring uses it automatically"
      - "Only if the single constructor declares more than three parameters to inject"
      - "Only for @Configuration classes, where constructor autowiring must be requested explicitly"
    answer: 1
    explanation: |
      As of Spring 4.3, a class with a single constructor does not need @Autowired;
      Spring uses that constructor for autowiring automatically. @Autowired is only
      needed to disambiguate when multiple constructors exist.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-043
    difficulty: intermediate
    tags: [jakarta, javax, spring-boot-3]
    question: |
      In Spring Boot 3.x / Spring Framework 6.x, which package do annotations like
      @PostConstruct and @Inject now come from?
    options:
      - "java.annotation.* (a new JDK-bundled package introduced for these annotations)"
      - "javax.* (kept unchanged from Boot 2.x for backward compatibility with existing code)"
      - "jakarta.* (e.g. jakarta.annotation.PostConstruct, jakarta.inject.Inject)"
      - "org.springframework.jakarta.* (Spring's own re-hosted copy of the Jakarta annotations)"
    answer: 2
    explanation: |
      Spring Boot 3 / Spring 6 migrated to Jakarta EE 9+, moving these annotations
      from javax.* to jakarta.* (jakarta.annotation.PostConstruct,
      jakarta.inject.Inject). Spring's own org.springframework.* annotations were
      unaffected.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-044
    difficulty: advanced
    tags: [proxy, jdk, cglib, aop]
    question: |
      For general Spring AOP proxying of a service bean, when is a JDK dynamic
      proxy used versus a CGLIB proxy?
    options:
      - "CGLIB is used only for @Configuration classes, while JDK dynamic proxies handle every other bean"
      - "The proxy mechanism is chosen at random per bean, so neither type can be relied upon"
      - "A JDK dynamic proxy is always used because CGLIB proxying was deprecated and removed"
      - "JDK dynamic proxy when the bean implements at least one interface (proxying the interface); CGLIB when it has no interface or proxyTargetClass=true"
    answer: 3
    explanation: |
      Spring AOP uses a JDK dynamic proxy when the target implements an interface
      (the proxy implements that interface), and falls back to CGLIB subclass
      proxying when there is no interface or when proxyTargetClass=true is set.
      Note @Configuration classes always use CGLIB. (Spring Boot defaults
      proxyTargetClass to true for many starters.)
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-045
    difficulty: advanced
    tags: [meta-annotations, custom-stereotype]
    question: |
      You create @interface AuditedService annotated with @Service and
      @Transactional. What is true of a class annotated only with @AuditedService?
    options:
      - "It is a component-scanned bean AND transactional, because Spring resolves meta-annotations transitively"
      - "It is a bean but not transactional; @Transactional is ignored on meta-annotations"
      - "It compiles cleanly, but Spring throws a configuration exception at startup for the composed type"
      - "It is neither registered as a bean nor transactional, since custom composed annotations are ignored"
    answer: 0
    explanation: |
      Spring resolves meta-annotations transitively. @AuditedService carries
      @Service (→ @Component, so it's scanned as a bean) and @Transactional (so the
      class gets transactional proxying). Composed stereotype annotations are a
      standard way to bundle cross-cutting semantics.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-046
    difficulty: intermediate
    tags: [value, spel, distinction]
    question: |
      Which statement correctly distinguishes ${...} from #{...} in @Value?
    options:
      - "${...} is a SpEL expression, while #{...} is the property placeholder resolved before startup"
      - "${...} is a property placeholder resolved by PropertySourcesPlaceholderConfigurer; #{...} is a SpEL expression"
      - "Both are SpEL expressions using different bracket syntaxes but the same underlying evaluator"
      - "${...} is usable only in XML configuration, whereas #{...} is usable only in Java-based config"
    answer: 1
    explanation: |
      ${...} resolves externalized property placeholders; #{...} evaluates SpEL.
      Placeholder resolution runs first so a resolved property value can be
      embedded inside a SpEL expression when both are combined.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-047
    difficulty: beginner
    tags: [configuration, bean, purpose]
    question: |
      What is the role of a @Configuration class?
    options:
      - "To enable exception translation for the annotated class"
      - "To mark a class for component scanning as a controller"
      - "To serve as a source of bean definitions via @Bean methods"
      - "To bind a group of external properties onto a typed POJO"
    answer: 2
    explanation: |
      @Configuration designates a class whose purpose is to declare beans through
      @Bean methods (and to compose configuration via @Import). In full mode it is
      CGLIB-proxied to guarantee singleton semantics for inter-bean method calls.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-048
    difficulty: intermediate
    tags: [enable-annotations, import]
    question: |
      Annotations like @EnableCaching, @EnableScheduling, and
      @EnableTransactionManagement are typically implemented using which mechanism?
    options:
      - "Runtime bytecode weaving performed exclusively by the AspectJ compiler at build time"
      - "Reflection over feature keys declared in application.properties at startup"
      - "Component scanning of a dedicated reserved package that Spring registers per feature"
      - "@Import of configuration classes / ImportSelectors (they are @Import-driven meta-annotations)"
    answer: 3
    explanation: |
      The @Enable* family are composed annotations that use @Import to bring in the
      configuration (or an ImportSelector) that registers the required
      infrastructure beans (e.g. cache advisors, scheduling post-processors,
      transaction management).
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-049
    difficulty: advanced
    tags: [value, conversion, collection]
    question: |
      A property is defined as mail.recipients=a@x.com,b@y.com and injected via
      @Value("${mail.recipients}") private List<String> recipients. What is the
      result?
    options:
      - "A two-element list [a@x.com, b@y.com] via the ConversionService splitting on commas"
      - "An IllegalArgumentException because List is not a supported @Value type"
      - "A null list, because @Value cannot bind comma-separated strings to collections"
      - "A single-element list containing the whole comma-separated string"
    answer: 0
    explanation: |
      Spring's ConversionService converts a comma-separated string into a
      List/array of the element type. So the two comma-separated recipients become
      a two-element List<String>.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-050
    difficulty: advanced
    tags: [restcontroller, responsebody, scenario]
    question: |
      A class is annotated @RestController. One method returns a User object.
      Assuming Jackson is on the classpath, what does the client receive?
    options:
      - "A rendered HTML view whose name comes from the returned User"
      - "A JSON representation of the User serialized into the response body"
      - "An HTTP 302 redirect to the /user path instead of a body"
      - "An empty 204 response because objects can't be returned directly"
    answer: 1
    explanation: |
      Because @RestController implies @ResponseBody on every method, the returned
      User is passed through message converters (Jackson) and serialized to JSON in
      the response body — no view resolution occurs.
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-051
    difficulty: intermediate
    tags: [component-scanning, missing-bean, scenario]
    question: |
      Your @SpringBootApplication is in com.acme.web.App. A @Service lives in
      com.acme.services.PaymentService and fails to autowire
      (NoSuchBeanDefinitionException). What is the most likely cause and fix?
    options:
      - "@Service beans require an accompanying @Primary annotation before scanning discovers them"
      - "PaymentService needs @Bean instead of @Service; change the annotation"
      - "com.acme.services is not under the main class's package, so it isn't scanned; move the main class up to com.acme or add @ComponentScan(\"com.acme\")"
      - "You must explicitly register PaymentService by its class name in application.properties"
    answer: 2
    explanation: |
      Default component scanning covers the main class's package and sub-packages.
      com.acme.services is a sibling of com.acme.web, so it isn't scanned. Move the
      main class to com.acme (a common root) or widen scanning with
      @ComponentScan("com.acme").
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-052
    difficulty: advanced
    tags: [configuration, cglib, inter-bean, scenario]
    question: |
      Given a full @Configuration class where singletonCounter() returns
      new Counter() and both a() and b() call singletonCounter() directly, how
      many Counter instances back the a and b beans?
    options:
      - "Three — a() and b() each build one, plus an extra created by the container"
      - "Zero — no Counter exists until the bean is first accessed lazily at runtime"
      - "Two — each calling method constructs its own separate Counter instance"
      - "One — CGLIB interception makes both calls return the same container singleton"
    answer: 3
    explanation: |
      In full @Configuration mode, CGLIB intercepts the calls to singletonCounter()
      inside a() and b(), returning the single container-managed Counter both
      times. Both a and b share exactly one Counter instance.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-053
    difficulty: intermediate
    tags: [repository, spring-data, translation]
    question: |
      Do Spring Data JPA repository interfaces benefit from persistence exception
      translation even without explicitly annotating them @Repository?
    options:
      - "Yes, Spring Data's proxy factory applies exception translation to its repositories regardless"
      - "Only if you also add @Transactional to activate the translation post-processor"
      - "Only for interfaces extending JpaRepository, not CrudRepository"
      - "No, you must add @Repository to every repository interface"
    answer: 0
    explanation: |
      Spring Data creates repository proxies via a factory that already applies
      persistence exception translation, so its repositories get DataAccessException
      mapping without a manual @Repository annotation. The @Repository annotation is
      what triggers translation for hand-written DAO beans.
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-054
    difficulty: beginner
    tags: [qualifier, jsr330, named]
    question: |
      Which JSR-330 annotation is the analog of Spring's @Qualifier for selecting a
      specific bean by name?
    options:
      - "@Inject"
      - "@Named"
      - "@Resource"
      - "@Singleton"
    answer: 1
    explanation: |
      @Named (jakarta.inject.Named / javax.inject.Named) is the JSR-330 analog of
      @Qualifier for by-name selection, while @Inject corresponds to @Autowired.
      @Resource (JSR-250) resolves primarily by name too but is a separate
      mechanism.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-055
    difficulty: advanced
    tags: [value, field-injection, testing]
    question: |
      Why can @Value field injection make unit testing harder compared to
      constructor-based @Value injection?
    options:
      - "Spring rejects @Value on constructor parameters at startup, so constructor-based value injection simply is not a supported feature of the framework"
      - "Field @Value values are stored in an encrypted form inside the ApplicationContext and can only be decrypted at runtime, so a unit test can never read them back"
      - "The value is set by the container via reflection after construction, so a plain 'new' in a test leaves it unset unless you use reflection or a test context"
      - "Field @Value injection is silently disabled outside the production profile, so during a unit test the annotation is skipped and the field keeps its default"
    answer: 2
    explanation: |
      With field @Value, the value is injected by the container via reflection
      after the object is constructed. In a plain unit test using new, the field
      stays at its default. Constructor @Value lets you pass the value directly,
      making the class trivially testable without reflection or a Spring context.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-056
    difficulty: intermediate
    tags: [bean, component, multiple-instances]
    question: |
      You need three differently-configured instances of the same connection-pool
      class as beans. Which approach is most natural?
    options:
      - "Use @Value to inject three separate copies of the pool into a single field, letting Spring populate a distinct configuration for each copy"
      - "It is impossible to register more than one bean of a given type, so you must merge the three configurations into one shared pool instance"
      - "Annotate the class with @Component three times, once per configuration, so component scanning produces three independently-configured beans"
      - "Declare three @Bean methods (each returning a configured instance) in a @Configuration class"
    answer: 3
    explanation: |
      Multiple @Bean methods in a @Configuration class cleanly produce several
      distinctly-configured beans of the same type, each with its own name. A class
      can only carry one @Component, so scanning can't easily yield multiple
      configured instances of that single class.
    ref: "concepts.md#bean-vs-component"

  - id: core-annotations-stereotypes-057
    difficulty: expert
    tags: [configuration, cglib, static-bean, post-processor]
    question: |
      A team declares a BeanPostProcessor via a NON-static @Bean method inside a
      @Configuration class, and the same @Configuration class has an @Value-annotated
      field it reads inside other @Bean methods. At startup they see a log warning that
      the config class "is not eligible for getting processed by all BeanPostProcessors"
      and the @Value field is null in some beans. What is the correct explanation and fix?
    options:
      - "The @Value field must be static so the config class can be loaded early; make the field static and the warning disappears."
      - "BeanPostProcessors cannot be defined with @Bean at all; they must be registered via @Import of an ImportBeanDefinitionRegistrar."
      - "The BeanPostProcessor must be instantiated very early; because the @Bean method is non-static, Spring instantiates the enclosing @Configuration class prematurely (before annotation-processing BeanPostProcessors run), so its @Value isn't injected. Declare the post-processor @Bean method static."
      - "The warning is benign; the null @Value is caused by a missing default and is unrelated to the post-processor declaration."
    answer: 2
    explanation: |
      Post-processor beans are created before the container has finished setting up the
      annotation-processing BeanPostProcessors. A non-static @Bean factory method forces
      early instantiation of its enclosing @Configuration instance, so @Autowired/@Value
      on that instance are not yet applied — hence the warning and null values. Declaring
      the post-processor @Bean method static decouples it from the config instance and
      resolves both issues.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-058
    difficulty: expert
    tags: [configuration, cglib, final, private-bean]
    question: |
      In a full @Configuration class (proxyBeanMethods=true), a developer marks one
      @Bean method private and another @Bean method final, then has a public @Bean method
      call both directly. What is the most accurate outcome?
    options:
      - "Compilation fails because @Bean cannot be applied to private or final methods."
      - "The private and final @Bean methods cannot be overridden by the CGLIB subclass, so direct calls to them are NOT intercepted and create new instances instead of returning the container singletons — a silent correctness bug."
      - "The container refuses to start with a BeanDefinitionParsingException naming the private/final methods."
      - "All three methods behave identically; visibility and finality have no effect on interception in full mode."
    answer: 1
    explanation: |
      Full @Configuration relies on a CGLIB subclass overriding @Bean methods to insert
      container-lookup interception. A private method is not overridable (not visible to
      the subclass) and a final method cannot be overridden, so calls to them run the
      original body every time, producing new instances rather than the shared singleton.
      Spring does not fail the build for this; it silently loses singleton semantics for
      those methods.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-059
    difficulty: advanced
    tags: [configuration, constructor-injection, cglib]
    question: |
      Which statement about constructors on a full @Configuration class is TRUE?
    options:
      - "A @Configuration class must have a public no-arg constructor or the context fails."
      - "@Configuration classes cannot use constructor injection; dependencies must be @Autowired fields."
      - "A @Configuration class constructor must be private to prevent direct instantiation."
      - "A @Configuration class may declare a constructor (including one for @Autowired/constructor injection); it only must not be final and must be subclassable by CGLIB."
    answer: 3
    explanation: |
      The only CGLIB-imposed restriction is that the class not be final (so it can be
      subclassed) and be instantiable by the generated subclass. Any constructor is
      allowed, including a single non-default constructor for default injection or an
      @Autowired constructor — a no-arg constructor is not required.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-060
    difficulty: expert
    tags: [configuration, lite-mode, scenario, code-analysis]
    question: |
      Consider:

          @Component
          class Cfg {
            @Bean Clock clock() { return Clock.systemUTC(); }
            @Bean TimeService ts() { return new TimeService(clock()); }
          }

      TimeService is also injected elsewhere via @Autowired. How many Clock instances
      exist, and why?
    options:
      - "One — @Component classes are wrapped in a CGLIB subclass exactly like @Configuration, so the call to clock() inside ts() is intercepted and returns the container singleton"
      - "Two — the container creates one Clock bean from clock(), and ts()'s direct call to clock() (lite mode, no CGLIB) creates a second unmanaged Clock."
      - "Zero — @Bean methods are rejected on @Component classes, so the context fails to refresh with a BeanDefinitionParsingException before any Clock is created"
      - "Unbounded — a brand-new Clock is constructed every time any other bean resolves or re-reads the TimeService dependency at runtime"
    answer: 1
    explanation: |
      @Bean methods on a @Component (not @Configuration) run in lite mode: no CGLIB
      subclass, so ts()'s direct call to clock() is a plain Java call creating a fresh
      Clock. The container separately creates its own Clock singleton from the clock()
      definition. Result: two Clock instances. Passing Clock as a method parameter
      (ts(Clock clock)) would inject the singleton.
    ref: "concepts.md#configuration-vs-component"

  - id: core-annotations-stereotypes-061
    difficulty: advanced
    tags: [primary, ambiguity, failure-mode]
    question: |
      Two DataSource @Bean methods are BOTH annotated @Primary, and an injection point
      autowires a single DataSource with no @Qualifier. What happens?
    options:
      - "Spring resolves the tie by injecting whichever @Primary bean was registered first, using bean-definition order as the deciding factor"
      - "Spring transparently merges the two candidates into a single composite DataSource that delegates each call to both underlying sources"
      - "The context starts successfully but the injection point is left null, deferring the ambiguity failure until the DataSource is first used"
      - "NoUniqueBeanDefinitionException — @Primary resolves ambiguity only when exactly one primary candidate exists; two primaries leave it ambiguous."
    answer: 3
    explanation: |
      @Primary designates a single preferred candidate. With two primaries of the same
      type, the "exactly one primary" condition fails and the ambiguity is unresolved, so
      Spring throws NoUniqueBeanDefinitionException (reporting more than one primary bean).
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-062
    difficulty: expert
    tags: [fallback, primary, spring-6.2]
    question: |
      A library ships a default @Bean of type MessageSender annotated @Fallback (Spring
      Framework 6.2+). An application defines its own MessageSender @Bean with no special
      annotation. Which is injected for a single-valued MessageSender dependency, and why?
    options:
      - "The application's bean, because @Fallback demarcates a NON-preferred bean; with one non-fallback (regular) candidate remaining, that regular bean is effectively primary."
      - "The library's @Fallback bean, because @Fallback designates the preferred candidate exactly like @Primary and therefore outranks the application's plain bean"
      - "Neither — a @Fallback bean alongside one regular bean is treated as an unresolved ambiguity, so Spring throws NoUniqueBeanDefinitionException at startup"
      - "Both candidates are collected and injected together as a List, because @Fallback widens the match even for a single-valued dependency"
    answer: 0
    explanation: |
      @Fallback is the inverse of @Primary: it marks beans as non-preferred. When only one
      regular (non-fallback) candidate remains, it becomes effectively primary and is
      chosen. This lets a library provide a default that any user-supplied bean
      automatically supersedes.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-063
    difficulty: expert
    tags: [autowiring, order, priority, resolution]
    question: |
      For a SINGLE-valued injection point with multiple type matches (no @Qualifier, no
      @Primary), which mechanism can still break the tie, and how does it differ from
      @Order used on a List<T> injection?
    options:
      - "@Order (field- or method-level, lower value wins) breaks the single-value tie, while @Priority is consulted only when injecting a collection such as List<T>"
      - "Neither @Order nor @Priority influences single-value resolution at all; once @Primary is absent, only matching the parameter name to a bean name can break the tie"
      - "@Priority (JSR-250, class-level, lower value wins) can break a single-value tie after @Primary; whereas for a List<T> injection @Order/Ordered/@Priority only SORT the elements and never filter which are injected."
      - "@Order and @Priority are fully interchangeable aliases that both filter a single-value injection point down to one candidate in exactly the same way"
    answer: 2
    explanation: |
      In single-valued resolution, after @Qualifier and @Primary, Spring consults
      @Priority (class-level JSR-250, lower value = higher priority) to break the tie. For
      collection injection, @Order/Ordered/@Priority determine element ordering but never
      exclude candidates — all matching beans are injected.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-064
    difficulty: advanced
    tags: [order, startup-order, misconception]
    question: |
      A developer adds @Order to two singleton @Service beans hoping to control which is
      constructed first during startup. What actually happens?
    options:
      - "@Order has no effect on singleton instantiation order (that follows the dependency graph and @DependsOn); it only influences ordering when the beans are injected as a collection or act as ordered advisors."
      - "@Order dictates singleton instantiation order during startup, so the bean carrying the lower @Order value is always constructed first"
      - "@Order triggers a startup failure because the annotation is not permitted on stereotype-annotated beans such as @Service classes"
      - "@Order defers each bean's construction, keeping both beans lazy until the container reaches their assigned ordered position"
    answer: 0
    explanation: |
      Singleton creation order is determined by dependency relationships and @DependsOn,
      not @Order. @Order only affects the order of elements handed to a collection
      injection point (List/array/Set) and the ordering of AOP advisors / config classes.
      To force creation order, use @DependsOn.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-065
    difficulty: expert
    tags: [import, deferredimportselector, autoconfiguration, ordering]
    question: |
      Why must Spring Boot's auto-configuration use a DeferredImportSelector rather than a
      plain ImportSelector?
    options:
      - "DeferredImportSelector executes its selectImports call on a dedicated background thread, parallelizing auto-configuration parsing to shorten overall startup time"
      - "A plain ImportSelector has no access to the classpath scanner, whereas a DeferredImportSelector is granted classpath read access needed to discover auto-configuration jars"
      - "DeferredImportSelector is the only selector permitted to import plain non-@Configuration POJOs, a capability a plain ImportSelector explicitly forbids at parse time"
      - "DeferredImportSelector is processed AFTER all regular @Configuration classes are parsed, so user beans and @Conditional state are known — enabling @ConditionalOnMissingBean back-off and letting auto-config be overridden and ordered (via Group / @AutoConfigureBefore/After)."
    answer: 3
    explanation: |
      Auto-configuration must yield to user configuration (back off when a user bean
      exists) and be evaluated last with full knowledge of the context. A
      DeferredImportSelector runs after all other config classes are processed and its
      Group mechanism sorts/batches imports, honoring @AutoConfigureOrder/Before/After.
      A plain ImportSelector runs inline during parsing, too early for these decisions.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-066
    difficulty: advanced
    tags: [import, importselector, aware, timing]
    question: |
      An ImportSelector needs to decide which configuration classes to register based on
      an active Spring profile / Environment property. How does it access the Environment,
      and what can it NOT do?
    options:
      - "It simply @Autowires an Environment field the way any bean does, and it may likewise @Autowire other fully-initialized application beans it needs during selectImports"
      - "It implements EnvironmentAware (or one of BeanFactoryAware/ResourceLoaderAware/BeanClassLoaderAware) to receive the Environment before selectImports runs; it cannot inject or reference live application beans because it executes at configuration-parsing time before beans are instantiated."
      - "It must read System.getenv directly, because Spring's Environment abstraction has not been created yet at the point where import selectors are invoked during parsing"
      - "It must itself be registered as a @Bean first, after which Spring invokes its selectImports method during the context refresh phase once all beans exist"
    answer: 1
    explanation: |
      ImportSelectors/Registrars run during configuration parsing, before bean
      instantiation, so they cannot autowire application beans. To make environment-based
      decisions they implement the relevant *Aware callbacks (EnvironmentAware, etc.),
      which Spring invokes before selectImports/registerBeanDefinitions.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-067
    difficulty: intermediate
    tags: [import, registrar, non-configuration-bean]
    question: |
      What does @Import(MyPlainPojo.class) do when MyPlainPojo is a regular class that is
      neither @Configuration, nor an ImportSelector, nor an ImportBeanDefinitionRegistrar?
    options:
      - "It is silently ignored, because @Import accepts only configuration-related types such as @Configuration classes, ImportSelectors, or registrars"
      - "It throws an IllegalArgumentException at context startup, since a plain class is not one of the import target types Spring recognizes"
      - "Since Spring 4.2, the plain class is registered directly as a bean — a concise way to register a single bean without a stereotype or @Bean method."
      - "It triggers a component scan of the package that contains MyPlainPojo, registering every stereotype-annotated class found there"
    answer: 2
    explanation: |
      As of Spring 4.2, @Import can take a regular component class and register it directly
      as a bean definition. This is a lesser-known mechanism to register one bean without
      adding a stereotype annotation or writing a @Bean method.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-068
    difficulty: expert
    tags: [value, bean-post-processor, timing, failure]
    question: |
      A custom BeanFactoryPostProcessor has a field annotated @Value("${feature.enabled}").
      At runtime the field is always false/null even though the property is set. Why?
    options:
      - "@Value injection works only on singleton-scoped beans, and every BeanFactoryPostProcessor is registered as a prototype, so its annotated fields are skipped"
      - "@Value is applied by an annotation-processing BeanPostProcessor that runs LATER than BeanFactoryPostProcessors; the post-processor is instantiated too early for @Value injection, so read the value from the Environment directly."
      - "The placeholder key contains a typo that fails to resolve; @Value is otherwise fully supported inside BeanFactoryPostProcessors once the name is corrected"
      - "@Value cannot populate a final field, and the field here is effectively final; declaring it as a plain mutable field is all that is needed to fix it"
    answer: 1
    explanation: |
      @Value and @Autowired are handled by AutowiredAnnotationBeanPostProcessor, a
      BeanPostProcessor. BeanFactoryPostProcessors (and BeanPostProcessors themselves) are
      created before that infrastructure is active, so their @Value fields are never
      injected. Read such configuration directly from the injected Environment instead.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-069
    difficulty: advanced
    tags: [value, relaxed-binding, configuration-properties]
    question: |
      An app defines the environment variable MY_APP_TIMEOUT and expects
      @Value("${my.app.timeout}") to pick it up via relaxed binding the way
      @ConfigurationProperties(prefix="my.app") does. What is the accurate statement?
    options:
      - "@Value performs the same relaxed binding as @ConfigurationProperties, so MY_APP_TIMEOUT maps to my.app.timeout automatically and this works."
      - "@Value can never read operating-system environment variables at all; it resolves keys exclusively from application.properties and application.yml files"
      - "Relaxed binding is a JVM-level feature applied to all placeholder resolution, so both @Value and @ConfigurationProperties inherit the exact same name-normalization for free"
      - "@Value does NOT perform relaxed binding; it resolves the exact placeholder key. It works only because Spring's system-environment PropertySource also exposes the canonical dotted form; but any name-shape mismatch that relaxed binding would tolerate will fail with @Value."
    answer: 3
    explanation: |
      Relaxed binding (case/dash/underscore-insensitive) is a feature of
      @ConfigurationProperties binding, not of @Value placeholder resolution. @Value
      resolves the literal key against PropertySources; env-var lookup works via the
      SystemEnvironmentPropertySource's name mapping, but @Value will not tolerate the
      broader name variations relaxed binding allows.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-070
    difficulty: expert
    tags: [value, constructor, field, timing, code-analysis]
    question: |
      Given:

          @Component
          class Cache {
            @Value("${cache.size:100}") private int size;
            private final int[] buckets;
            Cache() { this.buckets = new int[size]; }  // uses size in constructor
          }

      What is the length of buckets after the bean is created?
    options:
      - "100, the declared default value, because Spring applies @Value field defaults immediately before the constructor body executes"
      - "0 — field @Value is injected by a BeanPostProcessor AFTER construction, so 'size' is still 0 when the constructor runs."
      - "The configured cache.size value, because Spring resolves and assigns @Value fields eagerly during the bean's instantiation phase"
      - "The context fails to refresh, because reading an @Value-annotated field inside the bean's own constructor is a disallowed initialization pattern"
    answer: 1
    explanation: |
      Field @Value injection happens after the object is constructed (via reflection by the
      annotation-processing BeanPostProcessor). During the constructor, size is still its
      default primitive value 0, so buckets has length 0. To use the value at construction
      time, inject it as a constructor parameter: Cache(@Value("${cache.size:100}") int size).
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-071
    difficulty: intermediate
    tags: [value, static-field]
    question: |
      A developer annotates a private static field with @Value("${app.region}") and finds
      it is never populated. Why?
    options:
      - "Static-field injection requires the @Value annotation to be placed on the enclosing class rather than on the individual static field"
      - "The referenced property is simply undefined; @Value injection into static fields otherwise works exactly like instance-field injection"
      - "Static @Value injection only takes effect when the enclosing class is a full @Configuration with proxyBeanMethods=true enabled"
      - "Spring injects @Value only into instance fields via the bean instance; it does not populate static fields. Use a non-static field or a setter that stores into the static field."
    answer: 3
    explanation: |
      Spring's dependency injection operates on bean instances and does not inject into
      static fields. A common workaround is a non-static setter (or @PostConstruct) that
      copies the injected instance value into the static field, though shared mutable
      static state is discouraged.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-072
    difficulty: expert
    tags: [spel, evaluation-context, security]
    question: |
      Which statement about SpEL evaluation contexts is correct?
    options:
      - "Every SpEL evaluation, whether from @Value or from @PreAuthorize, shares a single StandardEvaluationContext granting identical full type and bean access across all use sites"
      - "@Value SpEL uses a StandardEvaluationContext (T(...), @beanRef, ctor calls allowed), while method-security/cache SpEL uses a MethodBasedEvaluationContext exposing #argName and #root; evaluating untrusted input against StandardEvaluationContext risks SpEL injection, so SimpleEvaluationContext should be used for untrusted expressions."
      - "SpEL is unable to reference Spring beans in any evaluation context, because bean lookup from expressions was removed as a deliberate security hardening measure"
      - "The Elvis operator ?: is available only within a MethodBasedEvaluationContext and is rejected as a syntax error when used inside a @Value expression"
    answer: 1
    explanation: |
      @Value expressions evaluate against a full StandardEvaluationContext (type
      references, bean references, constructors). Spring Security/cache expressions use a
      MethodBasedEvaluationContext that exposes method arguments (#name) and root objects.
      Because StandardEvaluationContext is powerful, evaluating untrusted strings enables
      SpEL injection (e.g. T(java.lang.Runtime)); use SimpleEvaluationContext to lock it
      down.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-073
    difficulty: advanced
    tags: [spel, projection, selection, code-analysis]
    question: |
      Given a list 'jobs' of objects each with a 'name' and 'priority', what does
      #{jobs.![name]} produce (note the ! projection operator)?
    options:
      - "A filtered sub-list containing only the jobs whose 'name' field is non-null and non-empty."
      - "The single job object that happens to hold the numerically highest 'priority' value."
      - "A new list containing the 'name' value of every job (projection maps each element to its name)."
      - "A single boolean flag reporting whether every job in the list has a non-blank name."
    answer: 2
    explanation: |
      .![expr] is SpEL projection: it evaluates the expression against each element and
      collects the results into a new collection. So jobs.![name] yields the list of all
      job names. (.?[] is selection/filter, .^[]/.$[] select first/last matching element.)
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-074
    difficulty: advanced
    tags: [spel, placeholder, order, code-analysis]
    question: |
      A property list.csv=a,b,c is defined. What does
      @Value("#{'${list.csv}'.split(',')}") private String[] items resolve to, and in what
      order are the two resolutions applied?
    options:
      - "SpEL is evaluated FIRST, so split(',') runs against the literal '${list.csv}' before the placeholder resolves, and startup then fails with an unresolved-placeholder error."
      - "Both resolutions run in a single simultaneous pass, so the comma is never treated as a delimiter and the result is a one-element array holding the whole string ['a,b,c']."
      - "Neither resolution triggers, so the field is injected with the raw literal string \"#{'${list.csv}'.split(',')}\" exactly as written in the annotation."
      - "The placeholder ${list.csv} is resolved FIRST to the string 'a,b,c', then SpEL evaluates 'a,b,c'.split(',') producing [a, b, c]."
    answer: 3
    explanation: |
      Property placeholders (${...}) are resolved before SpEL (#{...}) is evaluated. The
      placeholder becomes the literal 'a,b,c', then SpEL calls String.split(',') to yield
      the three-element array. This ordering is why placeholders can be embedded inside SpEL.
    ref: "concepts.md#value-and-property-injection"

  - id: core-annotations-stereotypes-075
    difficulty: expert
    tags: [meta-annotations, inherited, transactional, code-analysis]
    question: |
      An interface method carries @Transactional. A concrete class implements it without
      re-declaring @Transactional. Standard Java reflection (getAnnotation with @Inherited
      semantics) would NOT report the annotation as present on the class's method, yet
      Spring applies the transaction. Why?
    options:
      - "Because @Transactional is itself meta-annotated with @Inherited, which the JVM extends to propagate method-level annotations down onto interface implementations."
      - "Because Spring uses MergedAnnotations/AnnotatedElementUtils with a type-hierarchy search that considers implemented interfaces and superclasses — independent of Java's @Inherited, which only covers class-level annotations on superclasses and ignores interfaces."
      - "Because the JVM, during class loading, physically copies annotations from interface methods onto the implementing class's overriding methods so reflection can see them."
      - "It does not actually work — Spring is unable to honor interface-level @Transactional, so the scenario as described is simply incorrect and no transaction is applied."
    answer: 1
    explanation: |
      Java's @Inherited only propagates class-level (not method-level) annotations down a
      superclass chain and never through interfaces. Spring performs its own merged,
      interface-and-hierarchy-aware annotation search (MergedAnnotations /
      AnnotatedElementUtils), so it detects @Transactional declared on an interface method
      and applies transactional advice to the implementation.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-076
    difficulty: expert
    tags: [meta-annotations, aliasfor, failure]
    question: |
      A custom annotation uses @AliasFor to alias 'value' and 'path' to each other, but the
      two attributes declare different return types (String vs String[]). When is the
      problem detected and how?
    options:
      - "At compile time, where the annotation processor detects the mismatched return types and rejects the annotation before the class file is even produced."
      - "Never — Spring silently ignores the type mismatch and simply picks whichever of the two aliased attributes it happens to encounter first."
      - "At the first runtime resolution of the annotation, Spring throws AnnotationConfigurationException because @AliasFor requires aliased attributes to share the same return type (and each declare a default)."
      - "Only at context refresh, and only when the offending annotation is actually placed on a registered bean, so unused annotations never surface the problem."
    answer: 2
    explanation: |
      @AliasFor imposes a contract (same return type, a declared default, mutual aliasing).
      Violations are not caught by the compiler; Spring validates them when it first
      resolves/merges the annotation and throws AnnotationConfigurationException.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-077
    difficulty: advanced
    tags: [component-scanning, inheritance, abstract]
    question: |
      A concrete class ConcreteHandler extends an abstract class AbstractHandler that is
      annotated @Component. ConcreteHandler itself has no stereotype. Is ConcreteHandler
      registered as a bean by default component scanning?
    options:
      - "Yes — @Component is declared @Inherited, so the stereotype flows onto ConcreteHandler and the subclass is picked up by scanning automatically."
      - "Yes, but only when AbstractHandler is itself concrete (non-abstract); an abstract base blocks the subclass from inheriting the stereotype."
      - "Only when useDefaultFilters=false is set, which reconfigures the scanner to also walk superclass stereotypes onto subclasses."
      - "No — the default component-scan filter does not traverse superclasses for the stereotype, and abstract classes are not candidate components; annotate the concrete class itself."
    answer: 3
    explanation: |
      The default AnnotationTypeFilter for @Component considers meta-annotations but does
      not walk superclasses, and abstract classes are not eligible candidate components.
      So a subclass inheriting a stereotype from an abstract base is not auto-registered;
      put the stereotype on the concrete class.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-078
    difficulty: advanced
    tags: [component-scanning, naming, collision, code-analysis]
    question: |
      Two classes named Handler exist in packages com.a and com.b, both annotated
      @Component, both under the scanned base package. What happens at startup?
    options:
      - "Both register fine as 'com.a.Handler' and 'com.b.Handler', because the scanner defaults to fully-qualified class names whenever a simple-name collision is detected."
      - "ConflictingBeanDefinitionException — both default to the same bean name 'handler' from the decapitalized simple class name; fix with an explicit @Component(\"name\") or a FullyQualifiedAnnotationBeanNameGenerator."
      - "The second definition encountered during scanning silently overrides the first, leaving only one 'handler' bean registered in the context."
      - "Spring detects the clash and automatically appends a numeric suffix (handler, handler1) to the second bean name so both can coexist."
    answer: 1
    explanation: |
      AnnotationBeanNameGenerator uses the decapitalized simple class name, so both map to
      'handler'. Two scanned definitions with the same name throw
      ConflictingBeanDefinitionException. Resolve by giving explicit names, or by using
      FullyQualifiedAnnotationBeanNameGenerator so the fully-qualified class name is used.
    ref: "concepts.md#bean-naming-and-beannamegenerator"

  - id: core-annotations-stereotypes-079
    difficulty: expert
    tags: [bean-naming, decapitalize, code-analysis]
    question: |
      A scanned @Component class is named URLParser (two leading capitals). What is its
      default bean name?
    options:
      - "URLParser — java.beans.Introspector.decapitalize leaves names with two or more consecutive leading capitals unchanged."
      - "uRLParser, because the generator lowercases only the very first character and always leaves the remaining leading capitals untouched."
      - "urlParser, because the generator lowercases the entire run of leading uppercase letters before the first lowercase character."
      - "url.parser, because the generator inserts a dot at each internal case boundary and lowercases every segment."
    answer: 0
    explanation: |
      AnnotationBeanNameGenerator delegates to Introspector.decapitalize, which does NOT
      lowercase the first letter when the first two characters are both uppercase. So
      URLParser stays URLParser (whereas UserService becomes userService). This surprises
      people relying on autowire-by-name.
    ref: "concepts.md#bean-naming-and-beannamegenerator"

  - id: core-annotations-stereotypes-080
    difficulty: advanced
    tags: [bean-definition-overriding, spring-boot, failure]
    question: |
      In a default Spring Boot 3 app, a scanned @Component named 'reportService' and a
      @Bean method named reportService both exist. What is the default outcome?
    options:
      - "The @Bean method silently wins, because Spring Boot treats programmatic @Bean definitions as higher precedence and always lets them override scanned ones."
      - "The scanned @Component always wins, because component-scanned definitions are registered last and therefore take priority over @Bean methods."
      - "Startup fails with a bean-definition-overriding error, because Spring Boot defaults spring.main.allow-bean-definition-overriding to false; you must rename one or explicitly enable overriding."
      - "Both beans are registered under distinct auto-generated names, with the scanner appending a suffix to keep the two 'reportService' definitions separate."
    answer: 2
    explanation: |
      Since Spring Boot 2.1 the default for spring.main.allow-bean-definition-overriding is
      false, so a name clash between differently-sourced definitions fails fast at startup
      rather than silently overriding. Rename one, use @Qualifier/distinct names, or opt in
      to overriding explicitly.
    ref: "concepts.md#bean-naming-and-beannamegenerator"

  - id: core-annotations-stereotypes-081
    difficulty: expert
    tags: [scoped-proxy, singleton, prototype, code-analysis]
    question: |
      A @RequestScope bean RequestContext is injected as a plain field into a singleton
      service. Requests see stale/shared data. What is the root cause and the idiomatic fix?
    options:
      - "The singleton captured the first RequestContext instance at wiring time and reuses it forever; inject via a scoped proxy (@RequestScope already sets proxyMode=TARGET_CLASS) or an ObjectProvider so each call resolves the current request's instance."
      - "Request scope simply cannot be injected into a singleton bean at all, so the only fix is to promote the surrounding service to request scope as well."
      - "The RequestContext bean must be annotated @Primary, which is what tells the container to rebuild and re-inject it fresh on every incoming request."
      - "Adding @Lazy to the singleton service forces the container to recreate that service per request, which in turn hands out a new RequestContext each time."
    answer: 0
    explanation: |
      A singleton is created once and its dependencies wired once, so a directly-injected
      shorter-lived bean is frozen to the first instance. A scoped proxy (which @RequestScope
      configures) delegates each method call to the instance for the current scope; an
      ObjectProvider is an alternative that fetches the current instance on demand.
    ref: "concepts.md#bean-scopes-and-scoped-proxy-interaction-with-stereotypes"

  - id: core-annotations-stereotypes-082
    difficulty: advanced
    tags: [prototype, lifecycle, predestroy]
    question: |
      Which statement about prototype-scoped beans is TRUE?
    options:
      - "Spring tracks every prototype it hands out and calls their @PreDestroy methods together when the application context is finally closed."
      - "Spring fully manages the prototype lifecycle end to end, including invoking destruction callbacks exactly as it does for singleton beans."
      - "Prototype instances are cached like singletons after the first creation, so subsequent lookups of the same bean return the identical object."
      - "Spring creates and configures (and runs @PostConstruct on) each prototype instance but does NOT manage its destruction — @PreDestroy/DisposableBean are not invoked by the container; the caller is responsible for cleanup."
    answer: 3
    explanation: |
      For prototypes, the container instantiates, populates, and runs initialization
      callbacks, then hands the instance to the caller. It does not track the instance
      afterward, so destruction callbacks are not called automatically — a known source of
      resource leaks unless you manage cleanup yourself (e.g. via a custom BeanPostProcessor
      or explicit destroy call).
    ref: "concepts.md#bean-scopes-and-scoped-proxy-interaction-with-stereotypes"

  - id: core-annotations-stereotypes-083
    difficulty: advanced
    tags: [lazy, circular-dependency, code-analysis]
    question: |
      Two singleton beans A and B require each other via constructor injection, causing a
      startup BeanCurrentlyInCreationException. Which change most directly breaks the cycle
      without switching to setter/field injection?
    options:
      - "Mark both A and B with @Primary so the container prefers each when resolving the other and can complete the constructor cycle."
      - "Annotate one constructor parameter (e.g. B in A's constructor) with @Lazy, so Spring injects a lazy-resolving proxy for B and defers its actual initialization until first use."
      - "Add @Order to both beans so the container constructs A fully before B and thereby sidesteps the circular reference."
      - "Make both A and B prototype-scoped, which lets the container build a fresh throwaway instance to satisfy each side of the cycle."
    answer: 1
    explanation: |
      Constructor-injection cycles cannot be resolved by Spring's early-reference mechanism
      (which relies on setter/field injection). Placing @Lazy on one injection point makes
      Spring inject a proxy that resolves the real bean lazily, so neither constructor needs
      the other fully built at creation time, breaking the cycle. (Redesigning to remove the
      cycle is the cleaner long-term fix.)
    ref: "concepts.md#lazy-initialization-and-lazy-nuances"

  - id: core-annotations-stereotypes-084
    difficulty: advanced
    tags: [lazy, spring-boot, tradeoffs]
    question: |
      What is a real downside of enabling spring.main.lazy-initialization=true globally?
    options:
      - "It disables component scanning entirely, so beans must instead be declared one by one with explicit @Bean methods."
      - "It silently converts every singleton bean into a prototype, so a brand-new instance is created on each injection point."
      - "Wiring errors, missing-property (@Value) failures, and other misconfigurations that normally fail fast at startup are deferred until a bean is first used, shifting failures to runtime and adding latency to the first request that triggers creation."
      - "It prevents full @Configuration classes from being CGLIB-proxied, so inter-@Bean-method calls stop returning the shared container singleton."
    answer: 2
    explanation: |
      Global lazy initialization speeds up startup by deferring bean creation, but it also
      defers the fail-fast validation Spring normally performs at startup. Broken wiring or
      unresolved placeholders surface only when the affected bean is first accessed, and the
      first request can pay initialization latency.
    ref: "concepts.md#lazy-initialization-and-lazy-nuances"

  - id: core-annotations-stereotypes-085
    difficulty: expert
    tags: [conditional, ordering, conditionalonbean, autoconfiguration]
    question: |
      A developer puts @ConditionalOnMissingBean on a @Bean inside their own regular
      @Configuration class and finds it behaves inconsistently, sometimes backing off and
      sometimes not. What is the underlying reason?
    options:
      - "@ConditionalOnMissingBean was deprecated in Spring Boot 3 and now behaves unpredictably until you migrate to its replacement condition."
      - "It requires the conditional @Bean to also be annotated @Primary before the back-off logic will evaluate consistently."
      - "It works only for beans discovered via component scanning and is quietly ignored when placed on @Bean factory methods."
      - "@ConditionalOnBean/@ConditionalOnMissingBean are evaluated at definition-registration time and only see beans/definitions registered SO FAR; they are order-sensitive and reliable only in auto-configuration (which is ordered and processed after user config), not in ordinary user @Configuration."
    answer: 3
    explanation: |
      These conditions are checked as configuration classes are parsed and bean definitions
      registered, so the outcome depends on how many relevant definitions already exist at
      that moment. Because user @Configuration ordering isn't guaranteed relative to other
      user config, the result is fragile. Auto-configurations are explicitly ordered and run
      after user config, which is why the annotations are intended for that context.
    ref: "concepts.md#conditional-bean-registration-conditional-family"

  - id: core-annotations-stereotypes-086
    difficulty: intermediate
    tags: [conditional, profile, meta-annotation]
    question: |
      How is @Profile implemented under the hood?
    options:
      - "As a special reserved keyword the JVM class loader interprets directly, skipping non-matching classes before Spring ever sees them."
      - "As a @Conditional(ProfileCondition.class) meta-annotation — @Profile is just a condition that checks the active profiles in the Environment at registration time."
      - "As an ImportBeanDefinitionRegistrar that scans profile-named sub-packages and registers only the beans found under the active profile's package."
      - "As a BeanPostProcessor that lets every bean be created and then removes the ones whose profile is inactive after the context has started."
    answer: 1
    explanation: |
      @Profile is a composed annotation meta-annotated with @Conditional(ProfileCondition.class).
      The condition consults the Environment's active/default profiles when deciding whether
      to register the annotated bean definition, making profiles a specialization of the
      general @Conditional mechanism.
    ref: "concepts.md#conditional-bean-registration-conditional-family"

  - id: core-annotations-stereotypes-087
    difficulty: expert
    tags: [aot, native, proxybeanmethods, cglib]
    question: |
      Why is @Configuration(proxyBeanMethods=false) especially favored in Spring Boot 3
      GraalVM native-image / AOT builds?
    options:
      - "Because lite mode switches the container to the extra runtime reflection metadata that GraalVM native images require in order to instantiate beans."
      - "Because a native image is physically unable to execute @Bean factory methods when the enclosing class runs in full (proxied) @Configuration mode."
      - "Because setting proxyBeanMethods=false turns off classpath component scanning, an operation the closed-world native image explicitly forbids at build time."
      - "Because it avoids the runtime CGLIB subclass generation (bytecode generation is problematic in a closed-world native image), while AOT resolves inter-bean references at build time; it also lowers footprint. Auto-configs already lean on lite mode plus method-parameter injection."
    answer: 3
    explanation: |
      Native images use a closed world and cannot generate bytecode at runtime, so CGLIB
      subclassing of full @Configuration classes is undesirable. Lite mode skips that
      subclass; combined with method-parameter (constructor) injection instead of inter-bean
      method calls, it fits the AOT model well and reduces footprint.
    ref: "concepts.md#aot-graalvm-native-image-and-proxies"

  - id: core-annotations-stereotypes-088
    difficulty: advanced
    tags: [proxy, self-invocation, transactional, repository]
    question: |
      Inside a proxied bean (e.g. a @Repository or a @Transactional @Service), method m1()
      calls this.m2() where m2() is @Transactional/translated. Does the advice on m2() apply?
    options:
      - "Yes — at load time Spring rewrites every internal 'this' reference so that even self-calls are routed through the generated proxy and its advice runs."
      - "No — self-invocation via 'this' bypasses the proxy, so proxy-based advice (transactions, exception translation, caching) on m2() does not run; only external calls through the proxy trigger it."
      - "Yes, but only when the bean is wrapped in a CGLIB subclass proxy; JDK dynamic-proxy beans do not honor internal self-invocation."
      - "Only when m2() is declared public and m1() is private, in which case the visibility change makes Spring route the call through the proxy."
    answer: 1
    explanation: |
      Spring AOP is proxy-based: advice runs when a call passes through the proxy. An
      internal this.m2() call goes straight to the target instance, bypassing the proxy and
      its advice. Workarounds include self-injecting the proxy, splitting into two beans, or
      using AspectJ weaving.
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-089
    difficulty: expert
    tags: [repository, exception-translation, jdbc, sqlexception]
    question: |
      A hand-written @Repository uses a raw JDBC Connection/PreparedStatement (not
      JdbcTemplate) and lets a SQLException propagate out. Is it translated into a
      DataAccessException by the PersistenceExceptionTranslationPostProcessor?
    options:
      - "Yes — the @Repository post-processor translates every persistence-related exception, checked SQLException from raw JDBC included, into the DataAccessException hierarchy."
      - "Yes, but only when the DAO method is also annotated @Transactional, which is what activates the SQLException-to-DataAccessException translation."
      - "No — PersistenceExceptionTranslationPostProcessor chains PersistenceExceptionTranslator beans that target JPA/Hibernate runtime exceptions; a checked SQLException from raw JDBC is not translated. Use JdbcTemplate (which applies a SQLExceptionTranslator via SQLState/error codes) to get DataAccessException."
      - "No, because @Repository is a purely semantic marker that never contributes any runtime behavior of its own to a bean."
    answer: 2
    explanation: |
      The @Repository post-processor applies registered PersistenceExceptionTranslators,
      which handle ORM runtime exceptions (JPA/Hibernate). A checked SQLException from raw
      JDBC has no matching translator in that chain, so it is not converted. JdbcTemplate is
      what translates SQLException (via SQLExceptionTranslator using SQLState/vendor codes).
    ref: "concepts.md#repository-exception-translation"

  - id: core-annotations-stereotypes-090
    difficulty: advanced
    tags: [restcontroller, responsebody, string, code-analysis]
    question: |
      A @RestController method has return type String and returns "home". Assuming default
      Spring Boot MVC configuration, what does the client receive?
    options:
      - "A fully rendered HTML view whose logical name 'home' is passed to the configured ViewResolver and resolved to a template."
      - "An HTTP 302 redirect sending the client to the /home path instead of returning any response body."
      - "The literal text 'home' written to the response body (as text/plain via the String message converter), because @RestController implies @ResponseBody — no view resolution occurs."
      - "A JSON-quoted string \"home\" serialized by Jackson and returned with an application/json content type by default."
    answer: 2
    explanation: |
      @RestController applies @ResponseBody to every method, so the returned String is
      written directly to the body by the StringHttpMessageConverter (text/plain by default),
      not resolved as a view name. This is the key behavioral difference from a plain
      @Controller returning a String (which would be a view name).
    ref: "concepts.md#component--service--repository--controller--restcontroller-differences"

  - id: core-annotations-stereotypes-091
    difficulty: expert
    tags: [autowiring, objectprovider, optional, resolution]
    question: |
      A component may have zero, one, or many implementations of interface Plugin at
      runtime, and you want to handle "none present" and "exactly one present" cleanly
      without failing startup. Which injection approach is most idiomatic?
    options:
      - "@Autowired(required=false) Plugin plugin — leaves the field null when none exist and transparently collapses multiple candidates into the single one you need for the many case too."
      - "@Autowired ObjectProvider<Plugin> plugins — use getIfAvailable()/getIfUnique() for 0-or-1 and orderedStream() for many, avoiding NoSuchBean/NoUniqueBean failures and giving lazy resolution."
      - "@Autowired Plugin plugin with @Primary declared on every implementation, letting the container pick whichever one it prefers for the zero-, one-, and many-candidate cases."
      - "@Qualifier(\"any\") Plugin plugin, relying on the built-in 'any' qualifier Spring matches against every candidate so one field can absorb zero, one, or many beans."
    answer: 1
    explanation: |
      ObjectProvider<T> is designed exactly for optional/multiple dependencies: getIfAvailable
      returns null (or a supplied default) when absent, getIfUnique returns the single
      candidate or null when ambiguous, and orderedStream()/stream() iterate all candidates in
      order. It is lazy and avoids the NoSuchBeanDefinition/NoUniqueBeanDefinition exceptions
      that a plain injection would throw.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-092
    difficulty: advanced
    tags: [resource, autowired, resolution-order, jsr250]
    question: |
      A field private DataSource auditDs is annotated with @Resource (JSR-250), and beans
      'auditDs' and 'primaryDs' (marked @Primary) both exist. Which bean is injected?
    options:
      - "primaryDs, because @Resource honors @Primary exactly like @Autowired and always injects the primary candidate whenever more than one bean of the type exists."
      - "Neither; @Resource detects the two matching beans and throws NoUniqueBeanDefinitionException at startup because JSR-250 injection refuses to guess on ambiguity."
      - "auditDs, because @Resource resolves by NAME first (matching the field name 'auditDs'), only falling back to type — the opposite default of @Autowired which is type-first."
      - "A brand-new DataSource instance is created on the fly, since @Resource constructs a fresh object whenever no single unambiguous bean matches the field."
    answer: 2
    explanation: |
      @Resource matches by name first (defaulting to the field/property name), then by type.
      Since a bean named 'auditDs' exists, it is chosen regardless of @Primary. @Autowired,
      by contrast, is type-first and would consult @Primary. This name-vs-type default is a
      classic distinction.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-093
    difficulty: expert
    tags: [qualifier, custom-qualifier, meta-annotation]
    question: |
      You define @Qualifier-meta-annotated @interface DataStore { StoreType value(); } with
      an enum attribute, annotate two beans @DataStore(SQL) and @DataStore(NOSQL), and
      inject with @DataStore(NOSQL). How does Spring resolve it?
    options:
      - "It ignores the enum attribute entirely and falls back to matching the injection point against a bean whose name equals the lowercased annotation type 'dataStore'."
      - "It throws AnnotationConfigurationException at startup because @Qualifier-meta-annotated types are only permitted to declare a single String value() attribute, never an enum."
      - "It injects both beans together as a List<Object> because the container treats any two candidates sharing the @DataStore stereotype as a collection to be gathered."
      - "Spring matches candidates whose @DataStore qualifier has value==NOSQL — custom qualifier annotations are matched on ALL their attributes, not just a name string."
    answer: 3
    explanation: |
      A custom annotation meta-annotated with @Qualifier acts as a typed qualifier; Spring
      matches injection points to candidates by comparing all qualifier attribute values.
      @DataStore(NOSQL) therefore selects exactly the bean annotated @DataStore(NOSQL),
      giving type-safe qualification beyond a plain string name.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-094
    difficulty: intermediate
    tags: [map-injection, autowiring, code-analysis]
    question: |
      You inject Map<String, Validator> validators where three Validator beans named
      'emailValidator', 'phoneValidator', 'addressValidator' exist. What is the map's
      content?
    options:
      - "An empty map, because Map injection populates entries only when each candidate carries an explicit @Qualifier naming its intended map key."
      - "A map with three entries whose keys are the bean names and whose values are the corresponding Validator beans (String-keyed Map injection maps bean name -> bean)."
      - "A single entry keyed by the @Primary bean's name, since Map injection narrows to the one preferred candidate exactly like single-value autowiring does."
      - "A map keyed by each validator's fully-qualified class name rather than its bean name, because Spring derives Map keys from the concrete value type."
    answer: 1
    explanation: |
      When you inject a Map with a String key type, Spring populates it with every bean of
      the value type, using bean names as keys. This is a handy way to get a name-addressable
      registry of all implementations. For non-String key types this special handling does
      not apply.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-095
    difficulty: expert
    tags: [configuration, inter-bean, scope, code-analysis]
    question: |
      In a full @Configuration class, a prototype-scoped @Bean method proto() is called
      directly from two different singleton @Bean methods a() and b(). How many proto
      instances are created for a and b?
    options:
      - "One shared instance, because the CGLIB interceptor caches the first return value of proto() and hands that same object to every subsequent inter-bean call regardless of scope."
      - "Two — CGLIB interception respects the bean's scope, so each intercepted call to a prototype @Bean method asks the container for a NEW prototype instance; a and b get different ones."
      - "Zero — a prototype @Bean is never built during singleton wiring and materializes only when explicitly requested later through a getBean lookup on the context."
      - "Unbounded — full-mode interception is bypassed for prototypes, so a brand-new proto is constructed on every method entry throughout the application's lifetime."
    answer: 1
    explanation: |
      The CGLIB interceptor does not blindly cache; it delegates to the container honoring
      the bean's scope. For a singleton @Bean method it returns the shared instance, but for
      a prototype @Bean method each intercepted call produces a fresh instance. So a() and b()
      each receive their own prototype proto.
    ref: "concepts.md#configuration-full-vs-lite-mode-cglib-proxying-of-bean-methods"

  - id: core-annotations-stereotypes-096
    difficulty: advanced
    tags: [component-scanning, indexer, performance, aot]
    question: |
      For a very large application, which mechanism can replace runtime classpath scanning
      to speed startup by using a compile-time-generated index of components?
    options:
      - "Setting useDefaultFilters=false on @ComponentScan, which switches the scanner from classpath walking to a cached in-memory registry of previously discovered components."
      - "Marking every @Component as @Lazy so the classpath scan is deferred and amortized across the first few requests rather than paid up front at startup."
      - "The Spring Context Indexer (spring-context-indexer), an annotation processor that generates META-INF/spring.components at build time; Spring reads that index instead of ASM-scanning the classpath (largely superseded by AOT/native processing in Boot 3)."
      - "Enabling spring.main.allow-bean-definition-overriding, which lets the container skip re-scanning packages whose bean definitions were already registered on a prior pass."
    answer: 2
    explanation: |
      spring-context-indexer generates a META-INF/spring.components index at compile time so
      the container performs an index lookup rather than scanning the classpath with ASM at
      startup — beneficial for large apps. In Spring Boot 3 much of this benefit is provided
      by AOT/native-image processing.
    ref: "concepts.md#component-scanning-how-it-works-filters-basepackages"

  - id: core-annotations-stereotypes-097
    difficulty: expert
    tags: [meta-annotation, retention, custom-stereotype, failure]
    question: |
      A developer builds a custom stereotype @MyService, meta-annotated with @Component, but
      forgets to add @Retention(RUNTIME) (leaving the default). Classes annotated
      @MyService are not discovered by component scanning. Why?
    options:
      - "Custom stereotypes must physically extend @Component through annotation inheritance rather than meta-annotation, and Java offers no such extends clause so the scan silently finds nothing."
      - "Custom stereotypes must additionally be registered by name under a spring.components key in application.properties before the classpath scanner will treat them as component markers."
      - "@Component is sealed by the framework and cannot legally be placed as a meta-annotation on any user-defined annotation, so @MyService never carries stereotype semantics."
      - "The default retention is CLASS, so @MyService is not visible via runtime reflection/ASM metadata reading the way scanning requires; it must be @Retention(RUNTIME)."
    answer: 3
    explanation: |
      Annotations default to CLASS retention, which is not available for runtime discovery.
      Component scanning (and Spring's annotation metadata reading) needs the annotation to be
      retained at runtime, so a custom stereotype must declare @Retention(RetentionPolicy.RUNTIME)
      (and an appropriate @Target) to be picked up.
    ref: "concepts.md#meta-annotations"

  - id: core-annotations-stereotypes-098
    difficulty: advanced
    tags: [configuration, order, config-class, bean-order]
    question: |
      @Order is placed on a @Configuration class. What does it affect?
    options:
      - "It orders the @Bean methods declared within that class relative to one another, so that a List injection receives those beans in the source-declaration order the class defines."
      - "It orders the evaluation of that configuration class relative to other configuration classes during startup; it does NOT set the ordering of the beans produced by its @Bean methods — each @Bean needs its own @Order for collection ordering."
      - "It sets the singleton instantiation priority of every bean the class defines, forcing all of them to be constructed before any bean from a higher-@Order configuration."
      - "It has no effect anywhere, because @Order is honored only on stereotype-annotated beans and is silently discarded when placed on a @Configuration class."
    answer: 1
    explanation: |
      @Order on a configuration class only influences the order in which config classes are
      processed among the set of config classes. It does not propagate to the ordering of the
      beans created by its @Bean methods; for collection-injection ordering, annotate each
      @Bean method with its own @Order.
    ref: "concepts.md#primary-vs-qualifier"

  - id: core-annotations-stereotypes-099
    difficulty: expert
    tags: [spel, simpleevaluationcontext, security, untrusted-input]
    question: |
      An application evaluates user-supplied SpEL strings (e.g. dynamic filter expressions).
      What is the correct security posture?
    options:
      - "Use a StandardEvaluationContext but sanitize the input first with a regex denylist that strips T(...), new, and other dangerous tokens before the expression is compiled and evaluated."
      - "Use a SimpleEvaluationContext, which restricts SpEL to property access and a configured feature set while disabling type references (T(...)), bean references (@...), and constructor invocation — preventing SpEL-injection RCE like T(java.lang.Runtime)."
      - "SpEL is always safe for user input because the parser refuses to resolve any type or bean reference unless the expression is explicitly compiled in advance."
      - "Disable SpEL entirely and hand-parse the filter strings yourself, because the expression engine cannot be secured for untrusted input under any evaluation-context configuration."
    answer: 1
    explanation: |
      SimpleEvaluationContext is purpose-built for untrusted/data-binding scenarios: it
      exposes a limited feature set (typically property/collection access) and disables the
      powerful capabilities (type references, bean references, constructors) that enable SpEL
      injection. StandardEvaluationContext is full-power and unsafe for untrusted expressions;
      denylists are error-prone.
    ref: "concepts.md#spel-basics-and-use-cases"

  - id: core-annotations-stereotypes-100
    difficulty: advanced
    tags: [import, deduplication, configuration, code-analysis]
    question: |
      Configuration class Root @Imports both SecurityConfig and WebConfig, and WebConfig
      ALSO @Imports SecurityConfig. How many times is SecurityConfig processed and how many
      of each of its beans exist?
    options:
      - "Twice, once per import path, producing a duplicate set of SecurityConfig beans that then collide with a ConflictingBeanDefinitionException at startup."
      - "Twice, once per import path, but the second processing silently overrides the first so only the last-registered copy of each SecurityConfig bean survives."
      - "Once — Spring de-duplicates imported @Configuration classes, so SecurityConfig is processed a single time and its beans exist once."
      - "It fails with a circular-import exception, because Spring detects that SecurityConfig is reachable through two distinct @Import chains from Root."
    answer: 2
    explanation: |
      The configuration-class parser tracks imported classes and processes each @Configuration
      class only once regardless of how many import paths reach it. SecurityConfig's @Bean
      definitions are registered a single time, so there are no duplicate beans or collisions.
    ref: "concepts.md#import"

  - id: core-annotations-stereotypes-101
    difficulty: expert
    tags: [autowired, self-injection, transactional, code-analysis]
    question: |
      To make an internal call honor @Transactional despite the self-invocation limitation, a
      developer @Autowires the bean's own type into a field of itself and calls
      self.transactionalMethod(). Which statement is accurate?
    options:
      - "This is impossible; Spring forbids a bean from depending on itself and fails startup with a BeanCurrentlyInCreationException as soon as the self-reference is detected."
      - "The self-injected field is wired to the raw target instance rather than the proxy, so calls through it still bypass the advice and the transaction does not apply."
      - "Self-injection always forces the container to build a second, independent instance of the bean to satisfy the circular reference to itself."
      - "Spring supports self-injection as a last-resort fallback; the injected reference is the PROXY, so calling self.transactionalMethod() goes through the proxy and the transaction advice applies. Note a self-reference is never treated as @Primary and has lowest precedence."
    answer: 3
    explanation: |
      Spring permits self-injection as a fallback; the injected object is the AOP proxy, so
      invoking a method through it triggers the advice (transactions/caching) that plain
      this.method() would bypass. Spring documents self-references as last-resort, never
      participating as primary and having lowest autowiring precedence.
    ref: "concepts.md#primary-vs-qualifier"
