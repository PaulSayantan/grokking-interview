topic: "Security Fundamentals, CIA Triad & Threat Modeling"
domain: security
topic_slug: security-fundamentals-and-threat-modeling
version: 1
questions:
  - id: security-fundamentals-and-threat-modeling-001
    difficulty: beginner
    tags: [cia-triad, fundamentals]
    question: |
      What do the three letters of the "CIA triad" stand for in information security?
    options:
      - "Confidentiality, Integrity, Availability"
      - "Central Intelligence Authorization"
      - "Cryptography, Identity, Auditing"
      - "Control, Isolation, Assurance"
    answer: 0
    explanation: |
      The CIA triad is the core model of security goals: Confidentiality (only authorized
      parties see data), Integrity (data isn't altered undetectably), and Availability
      (systems are usable when needed). Every concrete security requirement maps to one of
      these three.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-002
    difficulty: beginner
    tags: [cia-triad, availability]
    question: |
      A distributed denial-of-service (DDoS) attack that takes a checkout service offline
      primarily violates which element of the CIA triad?
    options:
      - "Confidentiality"
      - "Integrity"
      - "Availability"
      - "Authenticity"
    answer: 2
    explanation: |
      DDoS floods a system so authorized users can no longer reach it — an attack on
      Availability. Confidentiality is about disclosure and Integrity about unauthorized
      modification; neither is the primary target of a flooding attack.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-003
    difficulty: beginner
    tags: [cia-triad, integrity]
    question: |
      An attacker intercepts a bank transfer request and silently changes the payee account
      number before it reaches the server. Which CIA property is primarily violated?
    options:
      - "Availability"
      - "Confidentiality"
      - "Integrity"
      - "Non-repudiation"
    answer: 2
    explanation: |
      Unauthorized, undetected modification of data in transit is a violation of Integrity.
      A message authentication code or digital signature over the request would let the
      server detect the tampering.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-004
    difficulty: intermediate
    tags: [cia-triad, tradeoffs]
    question: |
      A team enforces "lock the account permanently after 3 failed login attempts." Which CIA
      tension does this most directly illustrate?
    options:
      - "It strengthens integrity at the cost of confidentiality"
      - "It strengthens availability at the cost of integrity"
      - "It strengthens confidentiality but can reduce availability (self-inflicted DoS via lockout)"
      - "It has no effect on any CIA property"
    answer: 2
    explanation: |
      Lockouts protect against password guessing (a confidentiality/access control concern)
      but an attacker (or a mistyping user) can trivially lock out legitimate accounts,
      harming Availability. CIA properties trade off against each other; the balance must fit
      the asset's risk.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-005
    difficulty: intermediate
    tags: [cia-triad, parkerian]
    question: |
      Which statement about extending the CIA triad is correct?
    options:
      - "Authenticity and non-repudiation are commonly added properties, and the Parkerian hexad extends CIA to six elements"
      - "The Parkerian hexad replaces CIA with six entirely different properties"
      - "TLS provides all three CIA properties equally well"
      - "Availability is not a real security property, only a reliability concern"
    answer: 0
    explanation: |
      Authenticity (data really comes from the claimed source) and non-repudiation (the actor
      can't deny it) are frequently added beyond CIA. The Parkerian hexad keeps CIA and adds
      possession/control, authenticity, and utility. TLS gives confidentiality and integrity
      in transit but does nothing for availability.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-006
    difficulty: beginner
    tags: [aaa, authentication, authorization]
    question: |
      In the AAA model, what is the difference between authentication and authorization?
    options:
      - "Authentication proves who you are; authorization decides what you are allowed to do"
      - "Authentication decides what you may do; authorization proves who you are"
      - "They are two names for the same check"
      - "Authentication applies to users, authorization only to servers"
    answer: 0
    explanation: |
      Authentication (AuthN) establishes identity ("is this really Alice?"). Authorization
      (AuthZ) decides whether that authenticated principal may perform a given action on a
      resource. Conflating "logged in" with "allowed" is the root of broken access control.
    ref: "concepts.md#aaa-and-non-repudiation"

  - id: security-fundamentals-and-threat-modeling-007
    difficulty: intermediate
    tags: [aaa, accounting, auditing]
    question: |
      In AAA, what does the third "A" (Accounting / Accountability) provide?
    options:
      - "It records what authenticated principals did, supporting detection, forensics, and audit"
      - "It encrypts data at rest"
      - "It grants permissions to new users"
      - "It load-balances requests across servers"
    answer: 0
    explanation: |
      Accounting (also called accountability or auditing) is the continuous recording of
      actions in tamper-evident logs. It supports intrusion detection, incident forensics, and
      compliance — you can attribute actions to principals after the fact.
    ref: "concepts.md#aaa-and-non-repudiation"

  - id: security-fundamentals-and-threat-modeling-008
    difficulty: advanced
    tags: [non-repudiation, hmac, signatures]
    question: |
      Why does an HMAC (a symmetric message authentication code) NOT provide non-repudiation?
    options:
      - "Because both parties share the same secret key, either party could have produced the tag, so the sender can deny authorship"
      - "HMAC output is too short to be trusted"
      - "HMAC does not provide integrity, only confidentiality"
      - "HMAC can only be verified by the original sender"
    answer: 0
    explanation: |
      Non-repudiation requires that ONLY the originator could have produced the proof. With a
      shared symmetric key, both the sender and receiver can compute the same HMAC, so the
      receiver could have forged it — the sender can plausibly deny it. Non-repudiation needs
      an asymmetric digital signature, where only the private-key holder could sign.
    ref: "concepts.md#aaa-and-non-repudiation"

  - id: security-fundamentals-and-threat-modeling-009
    difficulty: intermediate
    tags: [authorization, complete-mediation]
    question: |
      A web app checks the user's role once at login and stores "isAdmin=true" in the session,
      then trusts it for the session's lifetime. What is the primary security concern?
    options:
      - "Authorization should be evaluated per action/request, not decided once at login, because permissions and context can change"
      - "Sessions should never store booleans"
      - "The check should have happened before authentication"
      - "There is no concern; caching the decision is best practice"
    answer: 0
    explanation: |
      You authorize actions, not users-once. Permissions can be revoked and long-lived sessions
      outlive the decision. Complete mediation requires checking authorization at the point of
      use on every sensitive action, not trusting a stale flag set at login.
    ref: "concepts.md#aaa-and-non-repudiation"

  - id: security-fundamentals-and-threat-modeling-010
    difficulty: beginner
    tags: [design-principles, least-privilege]
    question: |
      A reporting microservice is given a database account with full read/write/DDL rights on
      all tables, though it only needs to read two tables. Which design principle is violated?
    options:
      - "Complete mediation"
      - "Least privilege"
      - "Open design"
      - "Psychological acceptability"
    answer: 1
    explanation: |
      Least privilege says every principal gets the minimum permissions needed for the minimum
      time. A read-only account scoped to the two tables would limit the blast radius if the
      service is compromised. Over-provisioned accounts turn a small breach into a large one.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-011
    difficulty: intermediate
    tags: [design-principles, defense-in-depth]
    question: |
      Which scenario best exemplifies defense in depth?
    options:
      - "Relying solely on a WAF to block all injection attacks"
      - "Keeping the source code secret so attackers can't find flaws"
      - "Storing all secrets in a single, heavily guarded location"
      - "Using parameterized queries AND least-privilege DB accounts AND a WAF AND egress filtering, so one failure doesn't breach the system"
    answer: 3
    explanation: |
      Defense in depth layers independent controls so that if one fails, others still protect
      the system. If the WAF misses an injection payload, the parameterized query still blocks
      it, and even a successful query is limited by least-privilege credentials.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-012
    difficulty: intermediate
    tags: [design-principles, fail-secure]
    question: |
      Consider this authorization code:

          try:
              allowed = authz.check(user, resource)
          except Exception:
              allowed = True   # don't block users if authz is flaky
          if allowed: serve(resource)

      What principle does it violate, and what is the fix?
    options:
      - "It violates least privilege; fix by adding more roles"
      - "It violates open design; fix by hiding the authz service"
      - "It violates fail-secure (fail-closed); on error it should default to deny (allowed = False)"
      - "Nothing is wrong; failing open keeps the app available"
    answer: 2
    explanation: |
      The code fails OPEN: any exception in the authz check grants access. Security controls
      must fail-closed (deny by default) — set allowed = False on error and only proceed on an
      explicit grant. Otherwise an outage or induced error becomes an authorization bypass.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-013
    difficulty: intermediate
    tags: [design-principles, secure-defaults]
    question: |
      A product ships with a well-known default admin password that most customers never
      change. Which design principle does this most directly violate?
    options:
      - "Separation of duties"
      - "Complete mediation"
      - "Economy of mechanism"
      - "Secure defaults (secure by default)"
    answer: 3
    explanation: |
      Secure defaults means the out-of-the-box configuration is the safe one; security is
      opt-out, not opt-in. A shipped default/blank credential means the default posture is
      insecure. Since users rarely change defaults, the default effectively IS the security.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-014
    difficulty: intermediate
    tags: [design-principles, complete-mediation, toctou]
    question: |
      Which situation is a failure of "complete mediation"?
    options:
      - "Every request re-checks authorization against the current policy"
      - "The UI checks permissions on the page, but the underlying API endpoint the page calls performs no authorization check"
      - "Secrets are stored in a vault instead of source code"
      - "Two people are required to approve a wire transfer"
    answer: 1
    explanation: |
      Complete mediation requires every access to every object to be checked every time. If the
      UI hides a button but the API behind it isn't protected, an attacker calls the API
      directly and bypasses the control. TOCTOU races are another complete-mediation failure.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-015
    difficulty: intermediate
    tags: [design-principles, separation-of-duties]
    question: |
      Requiring that the developer who writes a change cannot also approve and deploy it to
      production is an application of which principle?
    options:
      - "Least common mechanism"
      - "Separation of duties"
      - "Psychological acceptability"
      - "Fail-secure"
    answer: 1
    explanation: |
      Separation of duties (SoD) ensures no single person or component can complete a sensitive
      action alone. Splitting write / approve / deploy across people prevents unilateral fraud
      or mistakes and contains insider threat.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-016
    difficulty: intermediate
    tags: [design-principles, open-design, obscurity]
    question: |
      What does the principle "open design / no security through obscurity" (Kerckhoffs's
      principle) assert?
    options:
      - "All source code must be open source"
      - "Security must not depend on the design being secret; assume the attacker knows the mechanism, so secrecy belongs in keys/credentials, not the algorithm"
      - "Obscurity is the strongest possible security control"
      - "Attackers can never reverse-engineer a proprietary protocol"
    answer: 1
    explanation: |
      Open design says the security of a system should not rely on the secrecy of its design or
      implementation — assume the adversary knows how it works (Kerckhoffs's principle). Only
      keys and credentials should be secret. Obscurity can be a thin extra layer but is never a
      standalone control.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-017
    difficulty: beginner
    tags: [design-principles, psychological-acceptability]
    question: |
      Users are given a 40-character password policy with forced changes every 15 days, and
      they respond by writing passwords on sticky notes. Which principle was neglected?
    options:
      - "Psychological acceptability (usable security)"
      - "Least privilege"
      - "Complete mediation"
      - "Non-repudiation"
    answer: 0
    explanation: |
      Psychological acceptability holds that controls too painful to use get circumvented,
      making the system less secure in practice. Overly harsh password rules push users to
      insecure workarounds; usable security is more secure security.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-018
    difficulty: beginner
    tags: [zero-trust]
    question: |
      What is the central idea of Zero Trust Architecture (NIST SP 800-207)?
    options:
      - "Trust everything inside the corporate network but nothing outside it"
      - "Encrypt all data at rest and consider the job done"
      - "Trust is granted once at VPN login and never re-checked"
      - "Never trust, always verify — no implicit trust is granted based on network location; every request is authenticated and authorized"
    answer: 3
    explanation: |
      Zero Trust replaces the castle-and-moat model. It grants no implicit trust based on
      network location — every request is authenticated, authorized, and encrypted whether it
      originates inside or outside the network, and trust is re-evaluated continuously.
    ref: "concepts.md#zero-trust-architecture"

  - id: security-fundamentals-and-threat-modeling-019
    difficulty: intermediate
    tags: [zero-trust, lateral-movement]
    question: |
      Which practice is most characteristic of a Zero Trust architecture?
    options:
      - "A single flat internal network where every host can reach every service"
      - "Allowing all traffic that has passed the perimeter firewall"
      - "Relying on IP allowlists as the sole access control"
      - "Micro-segmentation plus per-request authentication/authorization based on dynamic context (identity, device posture)"
    answer: 3
    explanation: |
      Zero Trust assumes breach and limits lateral movement via micro-segmentation, while
      authenticating and authorizing every request per session using dynamic context (identity,
      device health, location). A flat network or perimeter-only trust is exactly what Zero
      Trust rejects.
    ref: "concepts.md#zero-trust-architecture"

  - id: security-fundamentals-and-threat-modeling-020
    difficulty: advanced
    tags: [zero-trust, misconceptions]
    question: |
      Which statement about Zero Trust is a common misconception that should be corrected?
    options:
      - "Zero Trust is an architecture/strategy, not a single product you buy"
      - "Zero Trust means literally trusting nothing and no one, ever, so users can never be granted access"
      - "Zero Trust uses a Policy Decision Point and Policy Enforcement Point to make and enforce access decisions"
      - "Zero Trust often uses mTLS and short-lived credentials between services"
    answer: 1
    explanation: |
      Zero Trust does NOT mean no trust ever. It means no IMPLICIT trust from network position;
      trust is established explicitly per request and continually re-evaluated. The other three
      statements are accurate: it's a strategy (not a product) built on PDP/PEP, mTLS, and
      short-lived credentials.
    ref: "concepts.md#zero-trust-architecture"

  - id: security-fundamentals-and-threat-modeling-021
    difficulty: beginner
    tags: [attack-surface]
    question: |
      What does "reducing the attack surface" mean?
    options:
      - "Encrypting more of the database"
      - "Adding more logging"
      - "Minimizing the points where an attacker can interact with the system — e.g., closing unused ports, removing dead endpoints, dropping unneeded dependencies"
      - "Hiring more security engineers"
    answer: 2
    explanation: |
      The attack surface is the sum of all points where an attacker can enter data, extract
      data, or interact with the system. Disabling unused features, closing ports, removing
      dead endpoints, and trimming dependencies shrink it — you can't be attacked through an
      interface that doesn't exist.
    ref: "concepts.md#attack-surface-and-trust-boundaries"

  - id: security-fundamentals-and-threat-modeling-022
    difficulty: intermediate
    tags: [trust-boundaries, validation]
    question: |
      A developer argues "the frontend JavaScript already validates the input, so the server
      doesn't need to re-validate." Why is this wrong?
    options:
      - "Server-side validation is slower, so it should be skipped"
      - "The client is outside the server's trust boundary; its checks can be bypassed with a raw HTTP request, so server-side validation is mandatory"
      - "Frontend validation guarantees data integrity end to end"
      - "It's actually correct; double validation is wasteful"
    answer: 1
    explanation: |
      A trust boundary is where the trust level changes (browser to server). The client is
      untrusted — an attacker can send arbitrary requests bypassing any client-side check.
      Data crossing inward must be validated/authorized server-side; client-side validation is
      only a UX convenience.
    ref: "concepts.md#attack-surface-and-trust-boundaries"

  - id: security-fundamentals-and-threat-modeling-023
    difficulty: intermediate
    tags: [trust-boundaries, dfd, threat-modeling]
    question: |
      In a data flow diagram (DFD) used for threat modeling, what does a trust boundary
      (drawn as a dashed line) represent, and why does it matter?
    options:
      - "A network cable; it matters for performance"
      - "The physical rack location of a server"
      - "The boundary of the source code repository"
      - "A line where the level of trust changes; every place a data flow crosses it is where you enumerate threats"
    answer: 3
    explanation: |
      A trust boundary marks where trust changes (e.g., internet to app, app to DB). In a DFD
      it's a dashed line; each crossing is exactly where you apply STRIDE and ask "what can go
      wrong here?" Identifying boundaries is the first step of threat modeling.
    ref: "concepts.md#attack-surface-and-trust-boundaries"

  - id: security-fundamentals-and-threat-modeling-024
    difficulty: beginner
    tags: [terminology, threat, vulnerability]
    question: |
      Which pair correctly matches the definition?
    options:
      - "A vulnerability is the actor who attacks; a threat is the weakness"
      - "A vulnerability and a threat are exactly the same thing"
      - "A vulnerability is a weakness that can be exploited; a threat is a potential cause of an unwanted incident"
      - "A threat is the code that attacks; a vulnerability is the person"
    answer: 2
    explanation: |
      A vulnerability is a weakness (e.g., an unpatched SQLi flaw). A threat is the potential
      cause of harm — the actor or event that could exploit that weakness. They are distinct:
      a threat exploits a vulnerability.
    ref: "concepts.md#vulnerability-vs-threat-vs-risk-vs-exploit"

  - id: security-fundamentals-and-threat-modeling-025
    difficulty: intermediate
    tags: [terminology, risk]
    question: |
      Using standard security terminology, how is risk best described?
    options:
      - "Any weakness in the code, regardless of context"
      - "The exploit code published on the internet"
      - "The potential for loss when a threat exploits a vulnerability against a valuable asset — roughly likelihood × impact"
      - "The number of open ports on a server"
    answer: 2
    explanation: |
      Risk is the potential for loss, a function of likelihood × impact. It exists only when a
      threat and a vulnerability meet over a valuable asset. A weakness with no threat to reach
      it, or a threat with no weakness to exploit, carries little risk.
    ref: "concepts.md#vulnerability-vs-threat-vs-risk-vs-exploit"

  - id: security-fundamentals-and-threat-modeling-026
    difficulty: intermediate
    tags: [terminology, exploit, zero-day]
    question: |
      What is an "exploit," and what is a "zero-day"?
    options:
      - "An exploit is a weakness; a zero-day is a patched vulnerability"
      - "An exploit is a firewall rule; a zero-day is a type of encryption"
      - "An exploit is the technique/code that takes advantage of a vulnerability; a zero-day is a vulnerability with no available patch yet"
      - "Both terms mean the same thing as 'threat actor'"
    answer: 2
    explanation: |
      An exploit is the concrete technique or code (e.g., a specific SQLi payload) that
      leverages a vulnerability. A zero-day is a vulnerability for which no patch exists yet —
      defenders have "zero days" to remediate before exploitation is possible.
    ref: "concepts.md#vulnerability-vs-threat-vs-risk-vs-exploit"

  - id: security-fundamentals-and-threat-modeling-027
    difficulty: advanced
    tags: [terminology, risk, prioritization]
    question: |
      A scanner reports a SQL injection vulnerability in an internal admin tool that is only
      reachable from an isolated management network with no untrusted users. Why might its
      RISK still be lower than a lower-severity flaw on a public login page?
    options:
      - "Because SQL injection is never serious"
      - "Because risk = likelihood × impact, and the low likelihood of a threat reaching the isolated tool reduces overall risk even if impact is high"
      - "Because internal tools have no vulnerabilities by definition"
      - "Because public pages are always fully patched"
    answer: 1
    explanation: |
      A vulnerability is only potential loss; risk depends on a threat being able to reach and
      exploit it (likelihood) and the resulting harm (impact). Low exposure/likelihood lowers
      the risk. This is why risk-based prioritization beats fixing every finding by raw
      severity.
    ref: "concepts.md#vulnerability-vs-threat-vs-risk-vs-exploit"

  - id: security-fundamentals-and-threat-modeling-028
    difficulty: beginner
    tags: [threat-modeling, four-questions]
    question: |
      Adam Shostack's threat-modeling framework is built around four questions. Which set is
      correct?
    options:
      - "Who did it? When? Where? Why?"
      - "Is it encrypted? Is it patched? Is it logged? Is it backed up?"
      - "What's the budget? Who approves? When do we ship? Who's on call?"
      - "What are we building? What can go wrong? What are we going to do about it? Did we do a good job?"
    answer: 3
    explanation: |
      The four questions structure any threat model: (1) What are we building (model/DFD),
      (2) What can go wrong (enumerate threats, e.g., STRIDE), (3) What are we going to do about
      it (mitigate/eliminate/transfer/accept), (4) Did we do a good job (validate and iterate).
    ref: "concepts.md#threat-modeling-and-the-four-questions"

  - id: security-fundamentals-and-threat-modeling-029
    difficulty: intermediate
    tags: [threat-modeling, responses]
    question: |
      For a given threat, "buying cyber-insurance" or "moving the workload to a managed
      provider who assumes the risk" is an example of which threat response?
    options:
      - "Mitigate"
      - "Eliminate"
      - "Transfer"
      - "Accept"
    answer: 2
    explanation: |
      The four standard responses are mitigate (add a control), eliminate (remove the feature/
      exposure), transfer (shift the risk to a third party via insurance or a provider), and
      accept (document and move on). Insurance and outsourcing are transfer.
    ref: "concepts.md#threat-modeling-and-the-four-questions"

  - id: security-fundamentals-and-threat-modeling-030
    difficulty: intermediate
    tags: [threat-modeling, when, anti-patterns]
    question: |
      Which statement about when and how to threat model is most accurate?
    options:
      - "Threat modeling should be done once, at the end, as a release gate"
      - "Threat modeling is most valuable at design time and should be iterative, involving developers and revisited as the architecture changes"
      - "Only dedicated security specialists should threat model; developers add noise"
      - "A large document that is never updated is the ideal deliverable"
    answer: 1
    explanation: |
      Threat modeling shifts security left — it's most valuable at design time and should be
      repeated as data flows, architecture, or the threat landscape change. Developers who
      understand the system should participate. Stale documents and one-time gates are
      anti-patterns.
    ref: "concepts.md#threat-modeling-and-the-four-questions"

  - id: security-fundamentals-and-threat-modeling-031
    difficulty: beginner
    tags: [stride]
    question: |
      What does the STRIDE mnemonic enumerate?
    options:
      - "Six phases of the software development lifecycle"
      - "Six encryption algorithms"
      - "Six categories of threats: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege"
      - "Six severity levels for CVSS"
    answer: 2
    explanation: |
      STRIDE (Microsoft) is a threat-enumeration mnemonic: Spoofing, Tampering, Repudiation,
      Information disclosure, Denial of service, and Elevation of privilege. Each category is
      the negation of a desirable security property.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-032
    difficulty: intermediate
    tags: [stride, mapping]
    question: |
      In STRIDE, "Elevation of privilege" is the negation of which security property?
    options:
      - "Confidentiality"
      - "Availability"
      - "Non-repudiation"
      - "Authorization"
    answer: 3
    explanation: |
      Each STRIDE category maps to a property: Spoofing↔Authentication, Tampering↔Integrity,
      Repudiation↔Non-repudiation, Information disclosure↔Confidentiality, Denial of service↔
      Availability, and Elevation of privilege↔Authorization. EoP is an attacker gaining
      capabilities they weren't granted.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-033
    difficulty: intermediate
    tags: [stride, mapping]
    question: |
      Which STRIDE category corresponds to a violation of Confidentiality?
    options:
      - "Spoofing"
      - "Tampering"
      - "Information disclosure"
      - "Denial of service"
    answer: 2
    explanation: |
      Information disclosure is the STRIDE category for an attacker reading data they shouldn't
      — a violation of Confidentiality. Spoofing attacks authentication, tampering attacks
      integrity, and denial of service attacks availability.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-034
    difficulty: advanced
    tags: [stride, per-element, dfd]
    question: |
      In STRIDE-per-element, why do you apply the letters differently to different DFD element
      types (e.g., data stores vs. external entities)?
    options:
      - "It's arbitrary; all elements face all six threats equally"
      - "Because data stores can never be tampered with"
      - "Because different element types are susceptible to different threats — e.g., external entities face Spoofing and Repudiation, while data flows face Tampering, Information disclosure, and DoS"
      - "Because only processes need any analysis"
    answer: 2
    explanation: |
      STRIDE-per-element systematizes enumeration by recognizing that element types face
      characteristic threats: external entities (S, R), processes (all six), data stores
      (T, R, I, D), and data flows (T, I, D). Walking each element against its applicable
      letters avoids ad hoc, incomplete analysis.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-035
    difficulty: advanced
    tags: [stride, limits]
    question: |
      What is a recognized limitation of STRIDE?
    options:
      - "It cannot identify spoofing threats"
      - "It tells you what can go wrong but not how likely or how bad, so it must be paired with a risk-rating step, and it can produce a large noisy list"
      - "It only works for network hardware, not software"
      - "It automatically fixes the threats it finds"
    answer: 1
    explanation: |
      STRIDE is comprehensive for enumeration but says nothing about likelihood or impact — you
      still need a rating method (CVSS or risk = L×I) to prioritize. It can also generate a
      large, noisy list, and its output is only as good as the underlying model.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-036
    difficulty: beginner
    tags: [dread]
    question: |
      In the DREAD model, what are the five factors used to rate a threat?
    options:
      - "Damage, Reproducibility, Exploitability, Affected users, Discoverability"
      - "Design, Review, Encrypt, Audit, Deploy"
      - "Detection, Response, Escalation, Analysis, Documentation"
      - "Data, Risk, Exposure, Assets, Defenses"
    answer: 0
    explanation: |
      DREAD scores Damage, Reproducibility, Exploitability, Affected users, and Discoverability
      (historically 1-10 each) and combines them to rank threat severity. It is a rating
      framework, not an enumeration one.
    ref: "concepts.md#dread-and-its-critique"

  - id: security-fundamentals-and-threat-modeling-037
    difficulty: advanced
    tags: [dread, critique, obscurity]
    question: |
      Why is DREAD largely deprecated, and why is its "Discoverability" factor especially
      criticized?
    options:
      - "Because it uses too many factors to be practical"
      - "Because its scores are subjective/inconsistent and averaging can mask a critical factor; Discoverability rewards security through obscurity ('attackers won't find it, score it low')"
      - "Because it was never used by any real organization"
      - "Because it only applies to physical security"
    answer: 1
    explanation: |
      DREAD's 1-10 scores are arbitrary and irreproducible across analysts, and averaging can
      hide a catastrophic single factor. Discoverability encourages security through obscurity —
      a discredited assumption, since you must assume flaws will be found. Modern practice
      prefers CVSS.
    ref: "concepts.md#dread-and-its-critique"

  - id: security-fundamentals-and-threat-modeling-038
    difficulty: intermediate
    tags: [pasta, methodology]
    question: |
      How does PASTA (Process for Attack Simulation and Threat Analysis) differ in emphasis
      from STRIDE?
    options:
      - "PASTA is a lightweight mnemonic; STRIDE is a seven-stage process"
      - "They are identical, just different vendors"
      - "PASTA only analyzes network layers, STRIDE only application layers"
      - "PASTA is a risk-centric, attacker- and business-focused seven-stage methodology, whereas STRIDE is a lighter, system-centric enumeration framework"
    answer: 3
    explanation: |
      PASTA is a seven-stage, risk-centric methodology that starts from business objectives and
      simulates real attackers, aligning security with business risk. STRIDE is lighter and
      system-centric (great for fast developer-run enumeration). PASTA suits heavier,
      risk-driven analysis.
    ref: "concepts.md#pasta-and-attack-trees"

  - id: security-fundamentals-and-threat-modeling-039
    difficulty: intermediate
    tags: [attack-trees]
    question: |
      In an attack tree, what do the root node and the AND/OR child logic represent?
    options:
      - "The root is a mitigation; children are budgets"
      - "The root is the CEO; children are employees"
      - "The root is a firewall; children are ports"
      - "The root is the attacker's goal; children are sub-goals/methods combined with AND (all needed) or OR (any suffices)"
    answer: 3
    explanation: |
      An attack tree's root node is the attacker's goal (e.g., "read a victim's messages").
      Children are sub-goals/methods; OR means any child achieves the parent, AND means all are
      required. Annotating nodes with cost/skill lets you find the cheapest attack path.
    ref: "concepts.md#pasta-and-attack-trees"

  - id: security-fundamentals-and-threat-modeling-040
    difficulty: advanced
    tags: [attack-trees, complementary]
    question: |
      How do attack trees complement STRIDE in threat modeling?
    options:
      - "They replace STRIDE entirely and cover the same ground"
      - "STRIDE finds categories of threats broadly; an attack tree explores concrete paths to a specific chosen goal in depth"
      - "Attack trees only work for physical security, STRIDE only for software"
      - "Attack trees compute CVSS scores automatically"
    answer: 1
    explanation: |
      STRIDE enumerates categories of threats across the model (breadth); an attack tree drills
      into the many concrete paths to achieve one specific attacker goal (depth). Used together,
      you get broad coverage plus deep reasoning about a critical asset and where to place
      mitigations.
    ref: "concepts.md#pasta-and-attack-trees"

  - id: security-fundamentals-and-threat-modeling-041
    difficulty: beginner
    tags: [risk-rating, formula]
    question: |
      What is the standard qualitative formula for risk?
    options:
      - "Risk = Threats + Vulnerabilities"
      - "Risk = Assets − Controls"
      - "Risk = Likelihood × Impact"
      - "Risk = Exploits ÷ Patches"
    answer: 2
    explanation: |
      Risk = Likelihood × Impact. A high-impact but near-impossible attack and a trivial but
      harmless bug are both low risk; you prioritize threats that are both likely and damaging.
      This turns a raw threat list into a prioritized action list.
    ref: "concepts.md#risk-rating-likelihood-times-impact"

  - id: security-fundamentals-and-threat-modeling-042
    difficulty: intermediate
    tags: [risk-rating, owasp]
    question: |
      In the OWASP Risk Rating Methodology, likelihood is estimated from which kinds of factors?
    options:
      - "Only the market capitalization of the company"
      - "Threat-agent factors (skill, motive, opportunity, size) and vulnerability factors (ease of discovery, ease of exploit, awareness, intrusion detection)"
      - "Only the programming language used"
      - "The number of lines of code in the application"
    answer: 1
    explanation: |
      OWASP estimates likelihood from threat-agent factors (skill level, motive, opportunity,
      group size) and vulnerability factors (ease of discovery, ease of exploit, awareness,
      intrusion detection). Impact is estimated separately from technical and business factors,
      then combined in a matrix.
    ref: "concepts.md#risk-rating-likelihood-times-impact"

  - id: security-fundamentals-and-threat-modeling-043
    difficulty: advanced
    tags: [risk-rating, quantitative, ale]
    question: |
      In quantitative risk analysis, how is Annualized Loss Expectancy (ALE) computed?
    options:
      - "ALE = Asset Value × Exposure Factor"
      - "ALE = Likelihood + Impact"
      - "ALE = Single Loss Expectancy (SLE) × Annualized Rate of Occurrence (ARO)"
      - "ALE = Number of vulnerabilities × 10"
    answer: 2
    explanation: |
      SLE = Asset Value × Exposure Factor (loss from one occurrence). ALE = SLE × ARO
      (Annualized Rate of Occurrence), the expected annual loss. ALE helps justify a control's
      cost, though the inputs are often estimates — qualitative rating is more common when data
      is scarce.
    ref: "concepts.md#risk-rating-likelihood-times-impact"

  - id: security-fundamentals-and-threat-modeling-044
    difficulty: beginner
    tags: [cvss, scoring]
    question: |
      CVSS scores vulnerabilities on what scale, and what does a score of 9.0-10.0 mean?
    options:
      - "0.0-10.0; 9.0-10.0 is the Critical severity band"
      - "0-100; 9-10 means informational"
      - "1-5 stars; 9-10 is impossible"
      - "A-F letter grades; 9-10 is a passing grade"
    answer: 0
    explanation: |
      CVSS (maintained by FIRST) scores 0.0-10.0. The v3.x bands are None (0.0), Low (0.1-3.9),
      Medium (4.0-6.9), High (7.0-8.9), and Critical (9.0-10.0). It makes vulnerability severity
      comparable across products.
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-045
    difficulty: intermediate
    tags: [cvss, metric-groups]
    question: |
      Which are the three CVSS metric groups?
    options:
      - "Base, Temporal (Threat), and Environmental"
      - "Low, Medium, and High"
      - "Static, Dynamic, and Interactive"
      - "Spoofing, Tampering, and Elevation"
    answer: 0
    explanation: |
      CVSS has three metric groups: Base (intrinsic, constant characteristics — the score
      usually quoted), Temporal/Threat (changes over time, e.g., exploit maturity), and
      Environmental (how it matters in your specific deployment). Base itself splits into
      exploitability and impact metrics.
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-046
    difficulty: advanced
    tags: [cvss, risk, epss, kev]
    question: |
      A team has two open vulnerabilities: Vuln A (CVSS Base 9.8, no known exploit, on a
      component behind strong compensating controls) and Vuln B (CVSS Base 7.5, listed in the
      CISA KEV catalog and with a high EPSS score). Which statement is most defensible?
    options:
      - "Always patch A first because its CVSS Base score is higher"
      - "B likely deserves priority: CVSS Base measures technical severity, not real-world risk, and KEV/EPSS show B is actively exploited and likely to be exploited"
      - "Neither matters because both are under 10.0"
      - "CVSS Base score alone is a complete measure of risk to your environment"
    answer: 1
    explanation: |
      CVSS Base is technical severity in the abstract, not risk to you. Prioritization should
      factor exposure, EPSS (probability of exploitation), and CISA KEV (known exploited in the
      wild), plus business impact. A 7.5 that's actively exploited usually outranks a 9.8 with
      no known exploit and strong compensating controls.
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-047
    difficulty: advanced
    tags: [cvss, v4, scope]
    question: |
      What notable change did CVSS v4.0 make relative to v3.1?
    options:
      - "It removed the CIA impact metrics entirely"
      - "It renamed Temporal to Threat and replaced the confusing 'Scope' metric with separate Vulnerable System and Subsequent System impact metrics"
      - "It changed the scale from 0-10 to 0-1000"
      - "It made all scores default to Critical"
    answer: 1
    explanation: |
      CVSS v4.0 (2023) renamed the Temporal group to Threat, replaced the ambiguous Scope
      metric with distinct Vulnerable System and Subsequent System impact metrics, added Attack
      Requirements, and introduced Supplemental metrics plus CVSS-B/BT/BTE nomenclature.
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-048
    difficulty: beginner
    tags: [shift-left, secure-sdlc]
    question: |
      What does "shift-left" mean in the context of the secure SDLC?
    options:
      - "Moving all servers to a data center on the west coast"
      - "Left-aligning all security documentation"
      - "Moving security activities earlier in the lifecycle (design and coding) rather than only before release, because fixing defects earlier is far cheaper"
      - "Delaying security testing until after deployment"
    answer: 2
    explanation: |
      Shift-left moves security activities (like threat modeling and SAST) earlier in the SDLC.
      The motivation is economic: the cost to fix a defect rises roughly an order of magnitude
      at each later stage, so catching issues in design/coding is far cheaper than in
      production.
    ref: "concepts.md#shift-left-and-the-secure-sdlc"

  - id: security-fundamentals-and-threat-modeling-049
    difficulty: intermediate
    tags: [secure-sdlc, sast, dast, sca]
    question: |
      Which description correctly distinguishes SAST, DAST, and SCA?
    options:
      - "SAST analyzes source code without running it; DAST tests the running app from the outside; SCA finds known-vulnerable dependencies (CVEs)"
      - "SAST tests the running app; DAST reads source; SCA encrypts data"
      - "All three are the same tool with different names"
      - "SAST scans dependencies; DAST scans source; SCA runs the app"
    answer: 0
    explanation: |
      SAST (static) analyzes source code without execution and finds issues early. DAST
      (dynamic) tests the running app black-box from outside. SCA (Software Composition
      Analysis) finds known-vulnerable third-party dependencies and license issues — the answer
      to OWASP's Vulnerable and Outdated Components category.
    ref: "concepts.md#shift-left-and-the-secure-sdlc"

  - id: security-fundamentals-and-threat-modeling-050
    difficulty: intermediate
    tags: [secure-sdlc, frameworks, devsecops]
    question: |
      Which of the following is an authoritative framework for measuring or maturing a secure
      software development program?
    options:
      - "OWASP SAMM (or BSIMM, Microsoft SDL, NIST SSDF / SP 800-218)"
      - "TCP/IP"
      - "REST"
      - "GDPR encryption mode 7"
    answer: 0
    explanation: |
      OWASP SAMM and BSIMM measure/mature an organization's security program; Microsoft SDL is
      the original secure-development lifecycle; NIST SSDF (SP 800-218) is the Secure Software
      Development Framework. DevSecOps operationalizes shift-left by automating security into
      CI/CD.
    ref: "concepts.md#shift-left-and-the-secure-sdlc"

  - id: security-fundamentals-and-threat-modeling-051
    difficulty: intermediate
    tags: [cia-triad, integrity, controls]
    question: |
      Which control set is most directly aimed at protecting INTEGRITY (not confidentiality or
      availability)?
    options:
      - "Encryption at rest and access control lists"
      - "Autoscaling and redundant data centers"
      - "Cryptographic hashing, digital signatures/MACs, and input validation"
      - "Rate limiting and traffic shaping"
    answer: 2
    explanation: |
      Integrity controls detect or prevent unauthorized modification: hashes and MACs/signatures
      detect tampering, and input validation prevents malicious data from corrupting state.
      Encryption/ACLs target confidentiality; autoscaling and rate limiting target availability.
    ref: "concepts.md#the-cia-triad"

  - id: security-fundamentals-and-threat-modeling-052
    difficulty: intermediate
    tags: [design-principles, least-common-mechanism, mapping]
    question: |
      Two customer tenants are served by a process that caches computed results in a single
      shared, unpartitioned in-memory store keyed only by request path, so one tenant can
      occasionally be served another tenant's cached data. Which design principle does this
      most directly violate?
    options:
      - "Psychological acceptability"
      - "Open design"
      - "Complete mediation"
      - "Least common mechanism"
    answer: 3
    explanation: |
      Least common mechanism says minimize mechanisms and state shared between principals,
      because a shared resource becomes a channel for interference and information leakage. A
      single unpartitioned cache serving multiple tenants is exactly such a shared mechanism;
      the fix is to isolate/partition state per tenant (e.g. include tenant identity in the key
      and scope).
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-053
    difficulty: advanced
    tags: [fail-secure, life-safety]
    question: |
      A candidate says "security controls should always fail-closed." What nuance should they
      add to be fully correct?
    options:
      - "None; controls should literally always fail-closed with no exceptions"
      - "All systems should fail-open to preserve availability"
      - "For most security controls fail-closed (deny) is right, but life-safety systems may need to fail-open — e.g., an electronic door lock should unlock during a fire"
      - "Fail-open and fail-closed mean the same thing"
    answer: 2
    explanation: |
      Fail-secure generally means fail-closed (deny by default) for access controls. But "safe"
      depends on the asset: life-safety systems like door locks must fail-open (unlock) in an
      emergency so people aren't trapped. Recognizing this distinction shows depth.
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-054
    difficulty: intermediate
    tags: [threat-modeling, four-questions, validate]
    question: |
      In Shostack's four-question framework, which activity answers "Did we do a good job?"
    options:
      - "Drawing the initial data flow diagram"
      - "Reviewing the model, verifying mitigations exist and are tested, and iterating as the system changes"
      - "Listing all assets for the first time"
      - "Choosing an encryption algorithm"
    answer: 1
    explanation: |
      The fourth question is about validation: check the model's completeness, confirm each
      threat has an owned, tested mitigation, and iterate as the system evolves. It closes the
      loop so threat modeling produces actionable, verified risk reduction rather than a stale
      diagram.
    ref: "concepts.md#threat-modeling-and-the-four-questions"

  - id: security-fundamentals-and-threat-modeling-055
    difficulty: advanced
    tags: [linddun, privacy, threat-modeling]
    question: |
      A team applies STRIDE to a customer analytics pipeline and reports it "secure." A privacy
      reviewer objects that the biggest issues are missed. Which framework and threat types most
      directly address the gap?
    options:
      - "LINDDUN, especially Linking, Identifying, and Non-compliance — privacy threats STRIDE does not enumerate"
      - "DREAD, because it rates the analytics threats numerically"
      - "CVSS environmental metrics, which capture privacy impact"
      - "The Cyber Kill Chain, which models how attackers reach the data"
    answer: 0
    explanation: |
      STRIDE enumerates *security* threats and is blind to privacy harms like combining records
      to profile a person (Linking), re-identification (Identifying), or violating privacy law
      (Non-compliance). LINDDUN is the privacy dual of STRIDE. DREAD/CVSS only rate severity, and
      the kill chain is adversary-centric, not privacy-centric.
    ref: "concepts.md#linddun-privacy-threat-modeling"

  - id: security-fundamentals-and-threat-modeling-056
    difficulty: expert
    tags: [linddun, non-repudiation, stride]
    question: |
      In STRIDE, non-repudiation is a desirable property (repudiation is the threat). What is the
      status of "non-repudiation" in LINDDUN, and why?
    options:
      - "It is also a desirable property, so LINDDUN and STRIDE agree on it"
      - "It is a synonym for LINDDUN's Detecting threat"
      - "It is not part of LINDDUN at all"
      - "It is a threat: being able to undeniably attribute an action to an individual can harm their privacy/plausible deniability"
    answer: 3
    explanation: |
      LINDDUN inverts the security view: its 'N' (Non-repudiation) is a *threat* — if a system
      makes a data subject's action undeniable (e.g. a whistleblower's submission, a vote), it
      erodes plausible deniability and privacy. In security we *want* non-repudiation for
      accountability; in privacy that same undeniability can be a harm. This inversion is a
      classic interview probe.
    ref: "concepts.md#linddun-privacy-threat-modeling"

  - id: security-fundamentals-and-threat-modeling-057
    difficulty: intermediate
    tags: [linddun, privacy, pets]
    question: |
      Which countermeasure most directly addresses LINDDUN privacy threats (rather than only a
      security property)?
    options:
      - "Data minimization and pseudonymization (collect/retain less, and de-identify what you keep)"
      - "Enabling TLS 1.3 between all services"
      - "Adding a WAF in front of the application"
      - "Rotating the database encryption key monthly"
    answer: 0
    explanation: |
      Privacy-enhancing technologies (PETs) — data minimization, pseudonymization, k-anonymity,
      differential privacy — target privacy threats at the source by reducing what is collected
      and how identifiable it is. TLS, a WAF, and key rotation are confidentiality/security
      controls; they do nothing about excessive collection or re-identification.
    ref: "concepts.md#linddun-privacy-threat-modeling"

  - id: security-fundamentals-and-threat-modeling-058
    difficulty: expert
    tags: [kill-chain, attack, lateral-movement]
    question: |
      An incident responder says "we broke the Cyber Kill Chain at C2, so we're safe," but the
      attacker had already been inside for weeks moving between hosts with stolen credentials.
      What is the core limitation of the kill chain this exposes?
    options:
      - "The kill chain is linear and perimeter/malware-centric, so it poorly models post-compromise lateral movement and insider/credential abuse"
      - "The kill chain has no Command & Control stage"
      - "The kill chain requires malware to be present at every stage"
      - "The kill chain only applies to physical intrusions"
    answer: 0
    explanation: |
      The Lockheed Martin kill chain models a linear intrusion from outside and assumes breaking
      any one link stops the attack. It underrepresents what happens *after* initial compromise —
      lateral movement, living-off-the-land with valid credentials, and insider threat — which is
      exactly why ATT&CK (a non-linear matrix with deep post-exploitation coverage) is used
      alongside it.
    ref: "concepts.md#adversary-centric-analysis-kill-chain-mitre-attck-diamond-model"

  - id: security-fundamentals-and-threat-modeling-059
    difficulty: advanced
    tags: [mitre-attck, ttp, terminology]
    question: |
      In MITRE ATT&CK, what is the correct relationship between Tactics, Techniques, and
      Procedures?
    options:
      - "Tactics are the adversary's goal (the why), Techniques are how they achieve it, and Procedures are a specific actor's implementation of a technique"
      - "Tactics are specific exploit code, Techniques are CVEs, and Procedures are patches"
      - "They are three names for the same matrix cell"
      - "Procedures are the goal, Tactics are the tools, and Techniques are the victims"
    answer: 0
    explanation: |
      ATT&CK's TTP hierarchy: Tactics answer *why* (the adversarial objective, e.g. Persistence),
      Techniques (and sub-techniques) answer *how* (e.g. T1566 Phishing), and Procedures are the
      concrete way a particular threat actor implements a technique. This vocabulary is the basis
      of threat-informed defense and detection engineering.
    ref: "concepts.md#adversary-centric-analysis-kill-chain-mitre-attck-diamond-model"

  - id: security-fundamentals-and-threat-modeling-060
    difficulty: expert
    tags: [diamond-model, threat-intel, correlation]
    question: |
      An analyst notices two separate intrusions used the same command-and-control IP block and
      wants to determine whether they are the same campaign. Which model is designed for this
      pivoting/correlation, and along which elements does it pivot?
    options:
      - "STRIDE, pivoting across its six threat categories"
      - "The Diamond Model, pivoting across Adversary, Capability, Infrastructure, and Victim"
      - "CVSS, pivoting across Base, Temporal, and Environmental groups"
      - "DREAD, pivoting across Damage and Discoverability"
    answer: 1
    explanation: |
      The Diamond Model represents each intrusion event with four vertices — Adversary,
      Capability, Infrastructure, Victim — and analysts pivot along the edges (e.g. from shared
      Infrastructure to other Victims/Capabilities) to correlate events into campaigns. STRIDE
      and DREAD are system-centric threat-modeling/rating tools, and CVSS scores single vulns.
    ref: "concepts.md#adversary-centric-analysis-kill-chain-mitre-attck-diamond-model"

  - id: security-fundamentals-and-threat-modeling-061
    difficulty: advanced
    tags: [mitre-attck, kill-chain, comparison]
    question: |
      A candidate is asked to contrast the Cyber Kill Chain with MITRE ATT&CK. Which statement is
      the most accurate distinction?
    options:
      - "ATT&CK is linear with 7 stages; the kill chain is a non-linear matrix"
      - "They are identical, produced by the same organization"
      - "The kill chain is a linear phase model; ATT&CK is a non-linear, continuously-updated matrix of tactics/techniques with deep post-compromise coverage"
      - "The kill chain scores vulnerabilities; ATT&CK rates business risk"
    answer: 2
    explanation: |
      The kill chain (Lockheed Martin) is a linear 7-stage intrusion model. ATT&CK (MITRE) is a
      non-linear matrix of tactics and techniques built from real-world observation, with strong
      post-exploitation coverage. They complement each other — phase vs technique — and neither
      scores vulnerabilities (that is CVSS).
    ref: "concepts.md#adversary-centric-analysis-kill-chain-mitre-attck-diamond-model"

  - id: security-fundamentals-and-threat-modeling-062
    difficulty: expert
    tags: [fair, quantitative-risk, decomposition]
    question: |
      In the FAIR quantitative risk model, how is risk decomposed at the top level?
    options:
      - "Risk = Threats + Vulnerabilities + Assets"
      - "Risk = CVSS Base × EPSS"
      - "Risk = Loss Event Frequency (LEF) × Loss Magnitude (LM), where LEF = Threat Event Frequency × Vulnerability"
      - "Risk = Single Loss Expectancy ÷ Annualized Rate of Occurrence"
    answer: 2
    explanation: |
      FAIR (Open Group O-RA) defines Risk = Loss Event Frequency × Loss Magnitude. LEF further
      decomposes into Threat Event Frequency × Vulnerability, and Vulnerability is Threat
      Capability versus Resistance/Control Strength; LM splits into Primary and Secondary loss.
      This decomposition is what makes the estimate defensible.
    ref: "concepts.md#quantitative-risk-with-fair"

  - id: security-fundamentals-and-threat-modeling-063
    difficulty: expert
    tags: [fair, risk-communication, monte-carlo]
    question: |
      A CFO asks security to "quantify this breach risk defensibly, not just a red cell on a heat
      map." Why is a FAIR analysis more defensible than either a qualitative heat map or a single
      ALE figure?
    options:
      - "Because FAIR always produces a lower number, which the CFO prefers"
      - "Because FAIR eliminates all uncertainty and gives an exact loss figure"
      - "Because FAIR ignores loss magnitude and focuses only on frequency"
      - "Because FAIR uses input distributions and Monte Carlo simulation to produce a loss-exceedance range that makes uncertainty explicit, rather than a subjective label or a single point estimate"
    answer: 3
    explanation: |
      FAIR feeds distributions (min/most-likely/max) for each factor into Monte Carlo simulation,
      yielding a loss-exceedance curve ("5% chance annual loss exceeds \$10M"). That surfaces the
      uncertainty and lets the CFO compare risks on a money scale — unlike a subjective "High"
      cell (two Highs can differ 100×) or a single ALE that hides the distribution. FAIR does not
      remove uncertainty; it quantifies it.
    ref: "concepts.md#quantitative-risk-with-fair"

  - id: security-fundamentals-and-threat-modeling-064
    difficulty: advanced
    tags: [fair, vulnerability, control-strength]
    question: |
      In FAIR, the "Vulnerability" factor is not a CVE — it is defined as a function of two things.
      Which two?
    options:
      - "Attack Vector and Attack Complexity"
      - "Threat Capability versus Resistance Strength (control strength)"
      - "Likelihood and Impact"
      - "Exploit maturity and remediation level"
    answer: 1
    explanation: |
      In FAIR, Vulnerability is the probability that a threat event becomes a loss event, modeled
      as Threat Capability (how capable the attacker is) versus Resistance/Control Strength (how
      strong your controls are). It is a relationship between attacker and defender strength, not
      a specific software flaw. Attack Vector/Complexity are CVSS metrics.
    ref: "concepts.md#quantitative-risk-with-fair"

  - id: security-fundamentals-and-threat-modeling-065
    difficulty: expert
    tags: [scaling, threat-modeling-as-code, ci]
    question: |
      An org runs 300 microservices shipping daily and asks how to threat model at scale. Which
      approach best fits a modern, continuous program?
    options:
      - "Schedule a two-day whiteboard STRIDE workshop per service every quarter"
      - "Rely solely on an annual external penetration test"
      - "Threat-modeling-as-code: model each system in a DSL (e.g. OWASP pytm or Threagile) that runs in CI, plus reusable component threat libraries"
      - "Hire enough security engineers to sit with every team full-time"
    answer: 2
    explanation: |
      At that scale, per-service whiteboard sessions can't keep up with daily change. Codifying
      the model in a DSL (pytm generates DFDs + STRIDE findings; Threagile processes YAML in CI)
      makes threat modeling continuous, diffable in code review, and reusable via component
      libraries. Pen tests and headcount don't scale to per-commit design coverage.
    ref: "concepts.md#scaling-threat-modeling-threat-modeling-as-code-vast-and-the-manifesto"

  - id: security-fundamentals-and-threat-modeling-066
    difficulty: advanced
    tags: [vast, scaling, methodology]
    question: |
      The VAST methodology distinguishes two model types to scale across an enterprise. What are
      they?
    options:
      - "Static models and dynamic models"
      - "Application threat models (DFD-based, for developers) and operational threat models (attacker/process-flow view, for infrastructure/ops)"
      - "Qualitative models and quantitative models"
      - "Internal models and external models"
    answer: 1
    explanation: |
      VAST (Visual, Agile, Simple Threat modeling) separates application threat models — DFD-based
      and developer-facing — from operational threat models that take an attacker/process-flow
      view for infrastructure and operations. Serving both audiences from reusable components is
      how it scales across an Agile organization.
    ref: "concepts.md#scaling-threat-modeling-threat-modeling-as-code-vast-and-the-manifesto"

  - id: security-fundamentals-and-threat-modeling-067
    difficulty: expert
    tags: [slsa, supply-chain, build-integrity]
    question: |
      A build server is compromised and an attacker injects malicious code during the build (as in
      SolarWinds/SUNBURST). Which SLSA v1.0 Build level is specifically designed to make this class
      of in-build tampering hard, and how?
    options:
      - "Build L1, because provenance exists"
      - "Build L2, because the provenance is signed after the build"
      - "Build L0, because it requires reproducible builds"
      - "Build L3, because builds are isolated (runs can't influence each other) and the provenance signing key is inaccessible to user-defined build steps"
    answer: 3
    explanation: |
      SLSA Build L3 adds hardened, isolated builds: runs cannot influence one another and the
      signing key is unreachable from user-defined build steps, so forging provenance or tampering
      in-build requires a serious exploit. L1 provenance can be forged; L2 signs provenance on a
      hosted platform (protecting *after* the build) but does not by itself guarantee in-build
      isolation.
    ref: "concepts.md#supply-chain-security-sbom-slsa-and-provenance"

  - id: security-fundamentals-and-threat-modeling-068
    difficulty: advanced
    tags: [sbom, supply-chain, log4shell]
    question: |
      When Log4Shell (CVE-2021-44228) dropped, teams scrambled to answer "are we even affected?"
      Which artifact most directly answers that question quickly, and what are its two dominant
      formats?
    options:
      - "A CVSS score; formats v3.1 and v4.0"
      - "A WAF rule set; formats ModSecurity and Snort"
      - "A penetration test report; formats PDF and HTML"
      - "An SBOM (Software Bill of Materials); formats CycloneDX and SPDX"
    answer: 3
    explanation: |
      An SBOM is a machine-readable inventory of every component (including transitive
      dependencies) in a build, so you can query for the vulnerable log4j-core version in minutes.
      The two dominant formats are CycloneDX (OWASP) and SPDX (Linux Foundation/ISO). A CVSS score
      rates severity but does not tell you whether *you* ship the component.
    ref: "concepts.md#supply-chain-security-sbom-slsa-and-provenance"

  - id: security-fundamentals-and-threat-modeling-069
    difficulty: expert
    tags: [supply-chain, trust-boundary, owasp, xz-utils]
    question: |
      In threat-modeling terms, the xz-utils backdoor (CVE-2024-3094) exploited which element, and
      which OWASP Top 10 (2021) category best captures it?
    options:
      - "The client-side input field; A03 Injection"
      - "The dependency-ingestion trust boundary; A08 Software & Data Integrity Failures (with A06 Vulnerable & Outdated Components)"
      - "The TLS termination point; A02 Cryptographic Failures"
      - "The session cookie; A07 Identification & Authentication Failures"
    answer: 1
    explanation: |
      xz-utils was a supply-chain compromise: malicious code entered through a trusted upstream
      dependency — the dependency-ingestion trust boundary teams rarely model. It maps to A08
      (Software & Data Integrity Failures — trusting unverified build/update integrity) and relates
      to A06. Controls: SLSA L3 build isolation, signed provenance verification, SBOM, and
      dependency review.
    ref: "concepts.md#supply-chain-security-sbom-slsa-and-provenance"

  - id: security-fundamentals-and-threat-modeling-070
    difficulty: advanced
    tags: [supply-chain, provenance, in-toto]
    question: |
      What is the purpose of build "provenance" and attestations (e.g. via in-toto) in a secure
      software supply chain?
    options:
      - "To encrypt the source code repository at rest"
      - "To automatically generate CVSS scores for dependencies"
      - "To provide signed, verifiable statements about how an artifact was built (build platform, process, and inputs), so consumers can detect tampering before deploying"
      - "To replace the need for a build system entirely"
    answer: 2
    explanation: |
      Provenance is signed metadata describing how an artifact was produced — the build platform,
      steps, and materials — captured with frameworks like in-toto. Verifying it at deploy time
      lets consumers confirm the artifact came from the expected build and was not tampered with,
      which is the control that catches a poisoned build. It is not encryption or scoring.
    ref: "concepts.md#supply-chain-security-sbom-slsa-and-provenance"

  - id: security-fundamentals-and-threat-modeling-071
    difficulty: expert
    tags: [assurance, security, asvs]
    question: |
      A staff interviewer asks: "Can a system be secure without assurance?" What is the best
      answer?
    options:
      - "No — security and assurance are the same thing"
      - "No — assurance always implies security, so having one guarantees the other"
      - "Yes — security is the properties the system actually has, while assurance is the justified evidence that they hold; you can be secure by luck yet unable to demonstrate it"
      - "Yes, but only for open-source systems"
    answer: 2
    explanation: |
      Security = the protective properties a system possesses; assurance = the justified confidence
      (evidence: testing, pen tests, formal verification, ASVS/Common Criteria) that those
      properties hold. A system can be secure without assurance (correct but undemonstrable) and,
      worse, have assurance without security (a passed checklist over a flawed system). They are
      distinct axes.
    ref: "concepts.md#assurance-vs-security-and-the-asvs-ladder"

  - id: security-fundamentals-and-threat-modeling-072
    difficulty: advanced
    tags: [assurance, asvs, levels]
    question: |
      OWASP ASVS defines Levels 1, 2, and 3. What do these levels represent?
    options:
      - "Three severity bands for vulnerabilities, like CVSS"
      - "An assurance ladder of increasing verification rigor — L1 basic/opportunistic, L2 the standard for apps handling sensitive data, L3 for the highest-value systems"
      - "Three phases of the software development lifecycle"
      - "Three encryption strength tiers"
    answer: 1
    explanation: |
      ASVS levels form an assurance ladder: L1 is a basic level suited to lower-assurance apps, L2
      is the recommended standard for most applications handling sensitive data, and L3 is reserved
      for the most critical systems requiring the highest verification rigor. They express *how
      much verification effort* is applied, not vulnerability severity.
    ref: "concepts.md#assurance-vs-security-and-the-asvs-ladder"

  - id: security-fundamentals-and-threat-modeling-073
    difficulty: advanced
    tags: [cwe, cve, capec, taxonomy]
    question: |
      How do CWE, CVE, and CAPEC relate to one another?
    options:
      - "CWE is a specific instance, CVE is a weakness class, and CAPEC is a patch"
      - "They are three interchangeable names for the OWASP Top 10"
      - "CVE is the attack pattern, CAPEC is the weakness, and CWE is the instance"
      - "CWE is the weakness class (e.g. CWE-89 SQLi), CVE is a specific vulnerability instance in a product, and CAPEC is the attack pattern used to exploit the weakness"
    answer: 3
    explanation: |
      CWE enumerates weakness *classes* (CWE-89 SQL Injection, CWE-79 XSS); a single CWE spawns
      many concrete CVE *instances* tied to specific products/versions; CAPEC catalogs the attack
      *patterns* adversaries use against those weaknesses. Relationship: a CAPEC pattern exploits a
      CWE weakness, which manifests as a CVE.
    ref: "concepts.md#cwe-vs-cve-vs-capec-and-ssvc"

  - id: security-fundamentals-and-threat-modeling-074
    difficulty: expert
    tags: [ssvc, prioritization, cvss]
    question: |
      CISA's SSVC is offered as an alternative to raw CVSS-numeric prioritization. What kind of
      output does SSVC produce?
    options:
      - "A 0.0-10.0 numeric severity score, like CVSS"
      - "A probability of exploitation in the next 30 days, like EPSS"
      - "A categorical decision (e.g. Track / Track* / Attend / Act) reached by walking a decision tree over factors like exploitation status, exposure, and mission impact"
      - "A signed provenance attestation for the affected build"
    answer: 2
    explanation: |
      SSVC (Stakeholder-Specific Vulnerability Categorization) is a decision-tree method: you walk
      qualitative decision points — exploitation status, exposure, automatability, mission/well-
      being impact — to a categorical action (Track, Track*, Attend, Act). It complements CVSS
      (severity), EPSS (probability), and KEV (known-exploited) by structuring the *decision* about
      what to do.
    ref: "concepts.md#cwe-vs-cve-vs-capec-and-ssvc"

  - id: security-fundamentals-and-threat-modeling-075
    difficulty: expert
    tags: [design-principles, saltzer-schroeder, trick]
    question: |
      An interviewer asks: "Is defense in depth one of Saltzer & Schroeder's original design
      principles?" What is the correct answer?
    options:
      - "Yes, it is the first of their eight principles"
      - "Yes, along with zero trust and micro-segmentation"
      - "No — defense in depth and secure defaults are later additions; the canonical eight include economy of mechanism, fail-safe defaults, complete mediation, open design, separation of privilege, least privilege, least common mechanism, and psychological acceptability"
      - "No, because Saltzer & Schroeder never proposed any named principles"
    answer: 2
    explanation: |
      Defense in depth is a widely-cited principle but is NOT among Saltzer & Schroeder's original
      set; nor is 'secure defaults' by that name (their term is fail-safe defaults). The canonical
      eight are economy of mechanism, fail-safe defaults, complete mediation, open design,
      separation of privilege, least privilege, least common mechanism, and psychological
      acceptability (with work factor and compromise recording sometimes added).
    ref: "concepts.md#core-security-design-principles"

  - id: security-fundamentals-and-threat-modeling-076
    difficulty: expert
    tags: [cvss, v4, metrics]
    question: |
      Which set of changes accurately describes CVSS v4.0 Base metrics relative to v3.1?
    options:
      - "Adds Attack Requirements (AT), makes User Interaction Passive/Active instead of a yes/no, and splits impact into Vulnerable System (VC/VI/VA) and Subsequent System (SC/SI/SA) in place of Scope"
      - "Removes the Attack Vector metric and adds a Discoverability metric"
      - "Replaces the 0-10 scale with a 0-100 scale and drops the Base group"
      - "Merges Confidentiality, Integrity, and Availability into a single Impact metric"
    answer: 0
    explanation: |
      CVSS v4.0 adds Attack Requirements (AT: None/Present), refines User Interaction to
      Passive/Active, and replaces the confusing Scope metric with separate Vulnerable System
      (VC/VI/VA) and Subsequent System (SC/SI/SA) impact metrics. It retains the 0-10 scale and the
      distinct C/I/A dimensions; it did not add Discoverability (that was DREAD).
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-077
    difficulty: expert
    tags: [cvss, v4, supplemental, nomenclature]
    question: |
      In CVSS v4.0, what is true of the new Supplemental metrics (Safety, Automatable, Recovery,
      Value Density, Vulnerability Response Effort, Provider Urgency), and what does the
      nomenclature "CVSS-BTE" mean?
    options:
      - "Supplemental metrics dominate the score; CVSS-BTE means Base minus Threat minus Environmental"
      - "Supplemental metrics replace the Base group; CVSS-BTE means the score is capped at the Base value"
      - "Supplemental metrics do NOT change the computed score (they convey extra context); CVSS-BTE denotes a score computed from Base + Threat + Environmental groups"
      - "Supplemental metrics are mandatory inputs to the Base score; CVSS-BTE is an error code"
    answer: 2
    explanation: |
      v4.0 Supplemental metrics are purely informational context (e.g. Safety, Automatable) and by
      design do NOT affect the numeric score. The nomenclature encodes which groups contributed:
      CVSS-B (Base only), CVSS-BT (+Threat), CVSS-BE (+Environmental), CVSS-BTE (Base + Threat +
      Environmental) — signaling how contextualized the score is.
    ref: "concepts.md#cvss-scoring-basics"

  - id: security-fundamentals-and-threat-modeling-078
    difficulty: advanced
    tags: [zero-trust, nist, components]
    question: |
      In NIST SP 800-207, the Policy Decision Point is split into two logical components. What are
      they, and what is the role of the Policy Enforcement Point (PEP)?
    options:
      - "Public Encryptor and Private Authenticator; the PEP stores the session keys"
      - "Policy Engine (PE) and Policy Administrator (PA) make/execute the access decision; the PEP is the data-plane gate that enforces it on the connection"
      - "Perimeter Endpoint and Proxy Agent; the PEP issues user passwords"
      - "Policy Editor and Policy Auditor; the PEP writes the audit log"
    answer: 1
    explanation: |
      In SP 800-207 the PDP comprises the Policy Engine (PE), which decides whether to grant
      access, and the Policy Administrator (PA), which establishes/tears down the session and
      instructs the enforcement point. The PEP is the data-plane component that actually gates the
      connection to the resource, sitting between the subject and the protected resource.
    ref: "concepts.md#zero-trust-architecture"

  - id: security-fundamentals-and-threat-modeling-079
    difficulty: advanced
    tags: [threat-actors, apt, likelihood]
    question: |
      When defining "who are we defending against," why does distinguishing an APT/nation-state
      from commodity cybercrime matter for the threat model?
    options:
      - "It doesn't; all attackers should be treated identically for simplicity"
      - "Because nation-states only attack physical infrastructure, never software"
      - "Because attacker capability feeds likelihood/vulnerability estimates — an APT can burn a zero-day and persist, so you shift from prevention toward detection and blast-radius limitation, whereas commodity crime is stopped by hygiene"
      - "Because commodity cybercrime is always more dangerous than an APT"
    answer: 2
    explanation: |
      Threat-actor capability directly informs likelihood (OWASP threat-agent factors, FAIR Threat
      Capability). A well-resourced APT can use zero-days and persist stealthily, so realistic
      goals are raising cost, detecting, and containing blast radius rather than assuming
      prevention. Commodity crimeware is largely defeated by basic hygiene. Matching controls to
      the realistic adversary avoids both over- and under-investing.
    ref: "concepts.md#threat-actors-and-threat-intelligence"

  - id: security-fundamentals-and-threat-modeling-080
    difficulty: expert
    tags: [stride, per-element, per-interaction]
    question: |
      Compared with STRIDE-per-element, when would STRIDE-per-interaction produce FEWER threats,
      and why is that sometimes preferred?
    options:
      - "It produces fewer false threats by analyzing each (source, data flow, destination, boundary crossing) tuple, so it can rule out threats that can't occur at a given non-boundary interaction"
      - "It always produces more threats because it enumerates every tuple"
      - "It produces fewer threats only because it ignores data stores entirely"
      - "It produces fewer threats because it drops the Elevation-of-privilege category"
    answer: 0
    explanation: |
      Per-element marks every threat applicable to an element type, over-generating threats that
      can't actually occur at a specific interaction. Per-interaction reasons about each (source,
      flow, destination, boundary-crossing) tuple, so it can eliminate threats that don't apply to
      a particular non-boundary flow — reducing false positives. Modern guidance often focuses
      per-interaction analysis on trust-boundary crossings.
    ref: "concepts.md#stride"

  - id: security-fundamentals-and-threat-modeling-081
    difficulty: intermediate
    tags: [threat-modeling-manifesto, culture]
    question: |
      The Threat Modeling Manifesto (2020) is best described as which of the following?
    options:
      - "A scoring algorithm that replaces CVSS"
      - "A mandatory compliance certification for software vendors"
      - "A statement of values and principles for threat modeling (e.g. finding and fixing design issues over checkbox compliance, doing over talking)"
      - "A specific tool that generates data flow diagrams"
    answer: 2
    explanation: |
      The Threat Modeling Manifesto is a values/principles document authored by leading
      practitioners — favoring a culture of finding and fixing design issues over checkbox
      compliance, and doing threat modeling over merely talking about it. It is philosophy, not a
      tool, certification, or scoring system.
    ref: "concepts.md#scaling-threat-modeling-threat-modeling-as-code-vast-and-the-manifesto"

  - id: security-fundamentals-and-threat-modeling-082
    difficulty: expert
    tags: [cisa-ztmm, zero-trust, pillars]
    question: |
      The CISA Zero Trust Maturity Model organizes zero trust around five pillars. Which set is
      correct?
    options:
      - "Firewall, VPN, Antivirus, Backup, Encryption"
      - "Confidentiality, Integrity, Availability, Authenticity, Non-repudiation"
      - "Reconnaissance, Delivery, Exploitation, Installation, C2"
      - "Identity, Devices, Networks, Applications & Workloads, and Data"
    answer: 3
    explanation: |
      The CISA Zero Trust Maturity Model's five pillars are Identity, Devices, Networks,
      Applications & Workloads, and Data, each maturing across stages (Traditional → Initial →
      Advanced → Optimal). It is the operational companion to NIST SP 800-207's architecture. The
      other options are the CIA/Parkerian properties or kill-chain stages.
    ref: "concepts.md#zero-trust-architecture"
