topic: SSRF & Server-Side Request Attacks
domain: security
topic_slug: ssrf-and-server-side-request-attacks
version: 1
questions:
- id: ssrf-and-server-side-request-attacks-001
  difficulty: beginner
  tags:
  - definition
  - fundamentals
  question: |
    What best defines Server-Side Request Forgery (SSRF)?
  options:
  - An attacker tricks a server into making an attacker-controlled outbound request
  - An attacker forges cookies to impersonate another user on the server
  - An attacker injects SQL into a server-side database query
  - An attacker floods a server with requests to exhaust its resources
  answer: 0
  explanation: |
    SSRF is when a server is coerced into making a request to a destination the attacker
    controls. The server lends its network position and identity, reaching resources the
    attacker could not reach directly.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-002
  difficulty: beginner
  tags:
  - owasp
  - classification
  question: |
    Which OWASP Top 10 2021 category is dedicated to SSRF?
  options:
  - A01:2021 – Broken Access Control
  - A10:2021 – Server-Side Request Forgery
  - A03:2021 – Injection
  - A07:2021 – Identification and Authentication Failures
  answer: 1
  explanation: |
    SSRF was added as its own category, A10:2021 – Server-Side Request Forgery, in the
    OWASP Top 10 2021, promoted by the community survey due to its severity and prevalence.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-003
  difficulty: beginner
  tags:
  - impact
  - cloud-metadata
  question: |
    Why is the cloud instance metadata endpoint (169.254.169.254) considered the
    highest-impact SSRF target?
  options:
  - It can be used to crash the instance
  - It reveals the instance's public DNS name only
  - It exposes temporary IAM/role credentials that can lead to account compromise
  - It allows changing the instance's security group rules directly
  answer: 2
  explanation: |
    The metadata service exposes short-lived IAM role credentials (e.g. at
    /latest/meta-data/iam/security-credentials/). Stealing them can lead to broad cloud
    account compromise — the essence of the Capital One 2019 breach.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-004
  difficulty: intermediate
  tags:
  - impact
  - breach
  question: |
    The 2019 Capital One breach is the canonical SSRF case study. What did the attacker
    ultimately obtain through the SSRF?
  options:
  - Plaintext user passwords from the login page
  - TLS private keys from the load balancer
  - Database backups from an S3 bucket via SQL injection
  - IAM credentials from the EC2 instance metadata service
  answer: 3
  explanation: |
    The SSRF reached the EC2 metadata service (IMDSv1) and retrieved the instance role's
    IAM credentials, which were then used to access data. It is the textbook SSRF →
    credential-theft → cloud-compromise chain.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-005
  difficulty: beginner
  tags:
  - impact
  - internal-access
  question: |
    Besides cloud metadata, which of the following is a typical SSRF impact?
  options:
  - Decrypting TLS traffic on the wire
  - Bypassing the browser's same-origin policy
  - Reaching internal-only admin panels and services behind the firewall
  - Forging JWT signatures
  answer: 2
  explanation: |
    Because the request originates inside the trust boundary, SSRF can reach internal
    admin consoles, databases, key-value stores, and microservices unreachable from the
    public internet.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-006
  difficulty: intermediate
  tags:
  - port-scanning
  - blind
  question: |
    How can an attacker use SSRF to port-scan an internal network even when the response
    body is never returned?
  options:
  - By observing timing and status/error differences between open, closed, and filtered ports
  - By reading the Content-Length of the fetched page
  - By decoding the server's TLS certificate
  - It is impossible to port scan without the response body
  answer: 0
  explanation: |
    Semi-blind SSRF turns response timing (fast connection-refused vs. slow filtered
    timeout) and status/error differences into an oracle that reveals which internal
    hosts and ports are open.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-007
  difficulty: intermediate
  tags:
  - blind
  - oob
  question: |
    You suspect a blind SSRF where nothing is reflected in the response. What is the
    standard way to confirm the vulnerability?
  options:
  - Compare the byte length of two responses
  - Read the server's error stack trace
  - Send an XSS payload and see if it executes
  - Point the server at a domain/URL you control and watch for an out-of-band DNS or HTTP callback
  answer: 3
  explanation: |
    Blind SSRF is confirmed with an out-of-band (OOB) interaction: point the server at a
    listener you control (Collaborator/interactsh/your own DNS+HTTP server); a callback
    proves the server made the request.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-008
  difficulty: beginner
  tags:
  - in-band
  - blind
  - definitions
  question: |
    What distinguishes in-band SSRF from blind SSRF?
  options:
  - In-band SSRF works only over HTTPS; blind SSRF only over HTTP
  - In-band SSRF reflects the fetched response to the attacker; blind SSRF reflects nothing
  - In-band SSRF affects databases; blind SSRF affects caches
  - There is no difference; the terms are synonyms
  answer: 1
  explanation: |
    In-band SSRF returns the fetched content to the attacker directly. Blind SSRF returns
    nothing observable, so it must be confirmed and exploited via out-of-band channels or
    side-effect oracles.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-009
  difficulty: intermediate
  tags:
  - schemes
  - gopher
  - rce
  question: |
    Which URL scheme is most associated with escalating SSRF to remote code execution
    because it lets an attacker send arbitrary bytes to a TCP port?
  options:
  - https://
  - 'mailto:'
  - gopher://
  - 'blob:'
  answer: 2
  explanation: |
    gopher:// lets an attacker craft arbitrary bytes to a target port, so a single URL can
    script a full Redis/FastCGI/SMTP request. This is the canonical SSRF-to-RCE path
    (e.g. writing a cron job via an unauthenticated Redis).
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-010
  difficulty: beginner
  tags:
  - schemes
  - file
  question: |
    An SSRF-able fetcher accepts the URL file:///etc/passwd and returns its contents.
    What went wrong?
  options:
  - The client failed to validate the TLS certificate
  - The DNS resolver was misconfigured
  - The response was not compressed
  - The client honored the file:// scheme instead of restricting to http/https
  answer: 3
  explanation: |
    Allowing the file:// scheme lets SSRF read local files. The fix is to restrict the
    client to only the schemes you actually need — typically http and https.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-011
  difficulty: intermediate
  tags:
  - schemes
  - defense
  question: |
    Which is the correct default policy for URL schemes in an outbound fetcher that only
    needs to download web content?
  options:
  - Allow only http and https and reject every other scheme
  - Allow all schemes and rely on the firewall to block the dangerous ones
  - Block only file:// and gopher:// and allow everything else
  - Allow any scheme but disable TLS verification
  answer: 0
  explanation: |
    Use a scheme allowlist: permit only http/https and reject file, gopher, dict, ftp,
    data, and the rest. Denylisting individual dangerous schemes is fragile.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-012
  difficulty: intermediate
  tags:
  - imds
  - aws
  - defense
  question: |
    What makes IMDSv2 more resistant to SSRF than IMDSv1?
  options:
  - IMDSv2 encrypts metadata with TLS
  - IMDSv2 requires a PUT to obtain a session token plus a custom token header on GETs, which most SSRF
    fetchers cannot send
  - IMDSv2 moves the endpoint to a public IP address
  - IMDSv2 requires the caller to solve a CAPTCHA
  answer: 1
  explanation: |
    IMDSv2 uses a session handshake: a PUT to /latest/api/token returns a token that must
    be sent in the X-aws-ec2-metadata-token header on every GET. Most SSRF primitives can
    only issue GETs without custom headers, so they cannot obtain a token.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-013
  difficulty: advanced
  tags:
  - imds
  - hop-limit
  question: |
    By default, the IMDSv2 PUT token response has an IP-level hop limit of 1. Why does this
    help defend against SSRF?
  options:
  - It limits how many bytes the metadata service returns
  - It forces the token to expire after one second
  - It restricts the token to a single GET request
  - A request proxied through an extra network hop (reverse proxy or container) has the token response
    dropped
  answer: 3
  explanation: |
    The hop-limit of 1 means the token response cannot traverse an additional hop, so
    SSRF routed through a reverse proxy or a container network layer loses the token
    response — blocking a common SSRF path to metadata.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-014
  difficulty: intermediate
  tags:
  - imds
  - headers
  question: |
    Which header does an IMDSv2 client send to request a session token, and which header
    carries the token on subsequent metadata reads?
  options:
  - 'Authorization: Bearer on the PUT; Cookie on the GET'
  - Metadata-Flavor on both requests
  - X-aws-ec2-metadata-token-ttl-seconds on the PUT; X-aws-ec2-metadata-token on the GET
  - X-Forwarded-For on the PUT; X-Real-IP on the GET
  answer: 2
  explanation: |
    The PUT to /latest/api/token includes X-aws-ec2-metadata-token-ttl-seconds (TTL, up to
    21600s). The returned token is then sent in X-aws-ec2-metadata-token on every GET.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-015
  difficulty: advanced
  tags:
  - imds
  - limitations
  question: |
    Which statement about IMDSv2 as an SSRF control is most accurate?
  options:
  - IMDSv2 fixes the SSRF vulnerability itself in the application
  - 'IMDSv2 is defense in depth: it removes a high-value target but the underlying SSRF must still be
    fixed'
  - IMDSv2 makes egress filtering unnecessary
  - IMDSv2 blocks all outbound requests from the instance
  answer: 1
  explanation: |
    IMDSv2 hardens the metadata target but does nothing about the application's SSRF flaw.
    A powerful SSRF primitive that can PUT and set headers could still reach it. Fix the
    SSRF, enforce IMDSv2, and filter egress.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-016
  difficulty: intermediate
  tags:
  - imds
  - config
  question: |
    Which instance metadata configuration best mitigates credential-stealing SSRF on AWS?
  options:
  - HttpTokens=required (IMDSv2 only) with HttpPutResponseHopLimit=1, or disable IMDS entirely if unused
  - HttpTokens=optional so both v1 and v2 work
  - Increase the hop limit to 64 for compatibility
  - Expose the metadata service on a public IP with a password
  answer: 0
  explanation: |
    Setting HttpTokens=required enforces IMDSv2 (disabling IMDSv1), and keeping the hop
    limit at 1 blocks proxied access. If the workload doesn't need metadata, disable IMDS.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-017
  difficulty: intermediate
  tags:
  - bypass
  - ip-encoding
  question: |
    A denylist blocks the literal string "127.0.0.1". Which of these still reaches
    localhost?
  options:
  - http://example.com/127.0.0.1
  - http://256.256.256.256/
  - http://2130706433/
  - http://0.0.0.256/
  answer: 2
  explanation: |
    2130706433 is the 32-bit decimal (dword) representation of 127.0.0.1, which the OS
    resolver accepts. It bypasses a string denylist. 256.x is not a valid octet.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-018
  difficulty: intermediate
  tags:
  - bypass
  - ip-encoding
  question: |
    Which of the following is an octal representation of 127.0.0.1 used to bypass naive
    filters?
  options:
  - http://0x7f000001/
  - http://127.1/
  - http://[::1]/
  - http://0177.0.0.1/
  answer: 3
  explanation: |
    0177 is octal for 127. Hex would be 0x7f..., 127.1 is octet-shorthand, and [::1] is
    the IPv6 loopback — all valid loopback forms, but the octal one is 0177.0.0.1.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-019
  difficulty: intermediate
  tags:
  - bypass
  - ipv6
  question: |
    How can an attacker express 169.254.169.254 to evade an IPv4-only denylist?
  options:
  - http://169.254.169.254.example.com/
  - http://[::ffff:169.254.169.254]/ (IPv6-mapped IPv4)
  - http://169-254-169-254/
  - https://169.254.169.254:0/
  answer: 1
  explanation: |
    The IPv6-mapped IPv4 form [::ffff:169.254.169.254] resolves to the same link-local
    metadata address but slips past filters that only match IPv4 dotted-decimal strings.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-020
  difficulty: intermediate
  tags:
  - bypass
  - dns
  question: |
    Services like nip.io and sslip.io are abused in SSRF because they:
  options:
  - Map arbitrary IP addresses into legitimate-looking hostnames that resolve to that IP
  - Provide free TLS certificates for internal hosts
  - Proxy requests through Tor
  - Bypass same-origin policy in the browser
  answer: 0
  explanation: |
    Wildcard-DNS services resolve names like 10.0.0.5.nip.io directly to 10.0.0.5, letting
    an attacker hide an internal target inside a public-looking hostname.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-021
  difficulty: advanced
  tags:
  - defense
  - ip-validation
  question: |
    What is the robust way to validate that a target address is not internal, given all
    the encoding tricks?
  options:
  - Maintain a regular expression of forbidden IP strings
  - Reject any URL containing a digit
  - Only allow URLs shorter than 30 characters
  - Resolve the hostname and compare the numeric IP object against blocked CIDR ranges
  answer: 3
  explanation: |
    Comparing the normalized numeric IP (parsed into an IP-address object) against blocked
    CIDR ranges neutralizes every textual encoding at once. String/regex denylists are
    bypass-prone.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-022
  difficulty: advanced
  tags:
  - dns-rebinding
  - toctou
  question: |
    An application resolves a hostname, confirms it maps to a public IP, then makes the
    request by resolving the hostname again. Why is this still vulnerable?
  options:
  - The second resolution is slower and times out
  - The public IP could be behind a CDN
  - 'DNS rebinding: an attacker-controlled low-TTL record can return a public IP for the check and an
    internal IP at connect time'
  - HTTPS certificates cannot be validated twice
  answer: 2
  explanation: |
    This is a TOCTOU (time-of-check to time-of-use) flaw called DNS rebinding. Between the
    validating lookup and the connecting lookup, the attacker's DNS server switches the
    answer to an internal/link-local IP.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-023
  difficulty: advanced
  tags:
  - dns-rebinding
  - defense
  question: |
    What is the correct defense against DNS rebinding in an SSRF-sensitive fetcher?
  options:
  - Resolve once, validate the resolved IP, then connect to that exact pinned IP (not re-resolve the name)
  - Cache DNS answers for 24 hours
  - Only accept hostnames, never IP literals
  - Follow all redirects to reach the final host
  answer: 0
  explanation: |
    Pin the validated IP: resolve, check the IP is public/allowlisted, then connect to that
    literal IP (setting the Host header/SNI to the original name for TLS). This removes the
    second lookup the attacker would rebind.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-024
  difficulty: advanced
  tags:
  - dns-rebinding
  - a-aaaa
  question: |
    A validator checks only the A record of a hostname and confirms it is public, but the
    HTTP client connects over IPv6. How is this exploited?
  options:
  - The IPv6 stack is always disabled, so nothing happens
  - The attacker publishes a malicious AAAA record pointing to an internal IPv6 address that is never
    validated
  - IPv6 addresses cannot be internal
  - The A record automatically overrides the AAAA record
  answer: 1
  explanation: |
    Validating only the A record leaves the AAAA record unchecked; the client may connect
    over IPv6 to a malicious internal address. Resolve and validate all A and AAAA records.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-025
  difficulty: intermediate
  tags:
  - bypass
  - redirect
  question: |
    An app validates the initial URL is on an allowed public host, then fetches it and
    follows redirects. How does an attacker abuse this?
  options:
  - By sending a very large URL
  - By using HTTP/2 instead of HTTP/1.1
  - The allowed host returns a 302 Location to http://169.254.169.254/, and the client follows it unchecked
  - By compressing the response with gzip
  answer: 2
  explanation: |
    Redirect-based bypass: validation only inspected the first URL. The trusted host issues
    a redirect to an internal target, and the client follows it without re-validating.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-026
  difficulty: intermediate
  tags:
  - redirect
  - defense
  question: |
    Which pair of measures correctly mitigates redirect-based SSRF bypasses?
  options:
  - Enable redirect following and trust the first host only
  - Follow only HTTPS redirects without re-validating
  - Limit the number of redirects to 100
  - Disable automatic redirect following, or re-run full IP validation on every redirect hop
  answer: 3
  explanation: |
    Either disable auto-follow entirely, or validate the resolved IP of each redirect
    target (and restrict redirect protocols to http/https). Validating only the first URL
    is the flaw.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-027
  difficulty: advanced
  tags:
  - parser-confusion
  - bypass
  question: |
    Consider the URL http://expected-host@169.254.169.254/. Why can this bypass a host
    validator while the HTTP client connects to the metadata endpoint?
  options:
  - The @ makes the whole string a path, not a host
  - The validator may read 'expected-host' as the host (userinfo confusion) while the client connects
    to the real host after the @
  - The URL is invalid and both components reject it
  - 169.254.169.254 is treated as a port number
  answer: 1
  explanation: |
    Everything before @ is userinfo (credentials); the true host is 169.254.169.254. A
    validator that grabs the part before @ sees expected-host, but the HTTP client connects
    to the address after the @ — classic parser-confusion SSRF.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-028
  difficulty: advanced
  tags:
  - parser-confusion
  - defense
  question: |
    Which approach most reliably defeats URL-parser-confusion SSRF bypasses?
  options:
  - Use one well-tested parser for both validation and the request, reject userinfo/@, then resolve and
    pin the IP you connect to
  - Use two different URL parsers and require they agree
  - Lowercase the URL before parsing
  - Strip all query parameters
  answer: 0
  explanation: |
    Parser confusion arises when validation and the request layer disagree. Use a single
    parser, reject @/userinfo and odd characters, and — decisively — connect to the
    resolved, pinned IP so hostname disagreements can't route you anywhere unexpected.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-029
  difficulty: beginner
  tags:
  - defense
  - allowlist
  question: |
    Which SSRF defense is preferred when the set of legitimate destinations is known in
    advance?
  options:
  - A denylist of known-bad IP addresses
  - Blocking requests larger than 1 MB
  - Rate limiting the fetch endpoint
  - An allowlist of trusted hosts, schemes, ports, and path prefixes
  answer: 3
  explanation: |
    When destinations are knowable, use a strict allowlist of hosts (plus scheme, port, and
    path). OWASP is explicit: allowlists are preferred; denylists are bypass-prone.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-030
  difficulty: intermediate
  tags:
  - defense
  - denylist
  question: |
    Why does OWASP warn against relying on a denylist alone to stop SSRF?
  options:
  - Denylists are too slow to evaluate at runtime
  - Alternate IP encodings, wildcard DNS, rebinding, redirects, and parser tricks all evade string matching
  - Denylists require a database
  - Denylists only work over HTTPS
  answer: 1
  explanation: |
    A denylist tries to enumerate every bad form, but attackers have many equivalent
    encodings and dynamic techniques. The positive check — allowlist plus resolved-IP
    range validation — is what actually holds.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-031
  difficulty: intermediate
  tags:
  - defense
  - webhooks
  - case-2
  question: |
    For a public webhook feature (arbitrary external URLs are legitimate), an allowlist of
    hosts is impossible. What combination of controls is correct?
  options:
  - Trust any https URL because TLS proves the endpoint is safe
  - Only block 169.254.169.254 as a string
  - Enforce http/https + allowed ports, resolve all A/AAAA records and require public IPs, pin the IP
    or re-validate redirects, and optionally require a secret token
  - Allow the request but log it for later review
  answer: 2
  explanation: |
    In the Case-2 (unknown destinations) scenario you cannot allowlist hosts, so you must
    layer: scheme/port checks, resolve-and-verify-public on all records, IP pinning or
    redirect re-validation, and ideally a shared secret the endpoint echoes.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-032
  difficulty: intermediate
  tags:
  - defense
  - ranges
  question: |
    Which set of ranges should a minimum SSRF denylist block (in addition to cloud
    metadata hostnames)?
  options:
  - Loopback (127.0.0.0/8, ::1), link-local (169.254.0.0/16, fe80::/10), RFC1918 private, CGNAT 100.64.0.0/10,
    and multicast
  - Only 10.0.0.0/8
  - Only public IP ranges assigned to your cloud provider
  - Any address ending in .1
  answer: 0
  explanation: |
    A minimum denylist must cover loopback, link-local (which includes the metadata IP),
    RFC 1918 private ranges, CGNAT (100.64.0.0/10), 0.0.0.0/8, and multicast — plus metadata
    hostnames. Even so, treat it as a supplement to allowlisting.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-033
  difficulty: intermediate
  tags:
  - defense
  - input-handling
  question: |
    For a Case-1 internal-app fetcher, which input-handling practice reduces SSRF risk the
    most?
  options:
  - Accept a full user-supplied URL and pass it straight to the HTTP client
  - Accept only a validated identifier/enum from the user and build the URL server-side against the allowlist
  - Accept any URL but strip the scheme
  - Accept URLs only from authenticated users, with no other checks
  answer: 1
  explanation: |
    Where possible, don't take a raw URL at all. Accept a constrained identifier and
    construct the destination server-side from the allowlist, eliminating attacker control
    over the host.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-034
  difficulty: intermediate
  tags:
  - defense
  - egress
  question: |
    What is the role of network egress filtering in SSRF defense?
  options:
  - It replaces the need for any application-layer validation
  - It encrypts all outbound traffic
  - It blocks inbound attacker requests to the app
  - It constrains outbound connections so that even a perfect SSRF cannot reach internal targets or metadata
  answer: 3
  explanation: |
    Egress filtering is defense in depth at the network layer: restrict a fetching
    service's outbound rules to only what it needs, denying access to metadata, RFC 1918,
    and other internal ranges — so an app-layer bug has nowhere valuable to go.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-035
  difficulty: intermediate
  tags:
  - defense
  - architecture
  question: |
    A design routes all user-driven outbound fetches through a single hardened egress
    proxy in an isolated network segment. What is the main benefit for SSRF?
  options:
  - It speeds up the fetches with caching
  - It removes the need for TLS
  - It centralizes allowlist/IP enforcement and isolates fetching from internal services and metadata
  - It eliminates the need for authentication on internal services
  answer: 2
  explanation: |
    A dedicated fetch/forward proxy centralizes the SSRF controls and lives in a segment
    with no access to internal services or metadata, so a bypass reaches nothing sensitive.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-036
  difficulty: intermediate
  tags:
  - defense
  - least-privilege
  question: |
    Even with SSRF fixed, why is least-privilege IAM on the instance role still important?
  options:
  - If credentials ever leak, a narrowly scoped role limits how useful they are to an attacker
  - It makes the metadata service faster
  - It prevents the instance from booting without permissions
  - It disables the metadata service entirely
  answer: 0
  explanation: |
    Defense in depth: if any credential leaks (via SSRF or otherwise), a least-privilege
    role that grants only what the workload needs sharply limits the blast radius.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-037
  difficulty: advanced
  tags:
  - defense
  - zero-trust
  question: |
    SSRF succeeds partly because internal services assume "if you can reach me, you are
    trusted." What principle counters this assumption?
  options:
  - Perimeter-only security
  - Security through obscurity
  - Disabling logging on internal services
  - 'Zero trust: internal services authenticate every caller rather than trusting network origin'
  answer: 3
  explanation: |
    Zero trust removes the implicit trust in network location. If internal services require
    authenticated, authorized callers, an SSRF that merely reaches them still cannot act.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-038
  difficulty: beginner
  tags:
  - webhooks
  - features
  question: |
    Which product feature is a classic hiding place for SSRF because it inherently fetches
    user-supplied URLs?
  options:
  - A static CSS file server
  - A password strength meter
  - A webhook / callback URL configured by the user
  - A client-side date picker
  answer: 2
  explanation: |
    Webhooks let a user specify a callback URL that the server then connects to — a textbook
    SSRF surface (a Case-2 scenario requiring public-IP validation on every delivery).
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-039
  difficulty: intermediate
  tags:
  - pdf
  - renderer
  - features
  question: |
    Why are server-side HTML-to-PDF / HTML-to-image renderers (e.g. headless Chromium,
    wkhtmltopdf) prone to SSRF and local-file disclosure?
  options:
  - They compress images poorly
  - They fetch embedded resources — img src, iframes, CSS url(), and may follow file:// or internal URLs
    in attacker HTML
  - They require a public IP to run
  - They cannot render CSS
  answer: 1
  explanation: |
    A renderer fed attacker HTML will fetch the embedded resources it references, including
    internal URLs or file:// paths, pulling metadata or local files into the generated PDF/
    image.
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-040
  difficulty: beginner
  tags:
  - url-preview
  - features
  question: |
    Chat and social apps that fetch a URL to render a title/thumbnail (link unfurling) have
    repeatedly had SSRF. What is the underlying reason?
  options:
  - The server fetches a user-supplied URL to build the preview, so an attacker can point it at internal
    targets
  - They store the URL in a database
  - They render the preview in the user's browser
  - They use OAuth for the preview
  answer: 0
  explanation: |
    Link previews/unfurling require the server to fetch the URL (for Open Graph tags), which
    is exactly a user-controlled server-side request — SSRF unless the destination is
    validated and IP-pinned.
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-041
  difficulty: intermediate
  tags:
  - features
  - defense
  question: |
    What is the common defense across all URL-fetching features (webhooks, previews,
    importers, PDF generators)?
  options:
  - Different bespoke logic for each feature
  - Disable the features in production only
  - Route every fetch through the same validated, IP-pinned, scheme-restricted, egress-filtered path
  - Only allow authenticated users to trigger them
  answer: 2
  explanation: |
    Treat every feature that turns user input into an outbound connection as SSRF-sensitive
    and funnel it through one hardened fetch path (validate, resolve, pin IP, restrict
    schemes/redirects, egress-filter).
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-042
  difficulty: intermediate
  tags:
  - xxe
  - related
  question: |
    How is XML External Entity (XXE) injection related to SSRF?
  options:
  - XXE is a type of SQL injection unrelated to SSRF
  - XXE can force an XML parser to fetch a SYSTEM URL (e.g. http://169.254.169.254/...), acting as an
    SSRF/file-read delivery mechanism
  - XXE only causes cross-site scripting
  - XXE and SSRF are the same vulnerability
  answer: 1
  explanation: |
    An external entity with a SYSTEM URL makes the parser fetch that URL, so XXE is one way
    to deliver SSRF (and to read local files via file://). Interviewers commonly pair them.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-043
  difficulty: intermediate
  tags:
  - xxe
  - payload
  question: |
    Given this XML, what is the attacker trying to achieve?
    <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]>
    <data>&xxe;</data>
  options:
  - Cause a buffer overflow in the parser
  - Perform an SQL injection
  - Trigger a cross-site request forgery
  - Read a local file (/etc/passwd) by resolving an external entity
  answer: 3
  explanation: |
    The external entity xxe references file:///etc/passwd; if the parser resolves external
    entities, its contents are substituted into the document and disclosed — a local-file
    read via XXE.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-044
  difficulty: intermediate
  tags:
  - xxe
  - defense
  question: |
    What is the single most effective defense against XXE?
  options:
  - Disable DTD processing and external entity resolution in the XML parser
  - Validate the XML against a schema
  - Base64-encode all XML input
  - Rate-limit XML uploads
  answer: 0
  explanation: |
    Disabling DTDs and external general/parameter entity resolution (secure-processing /
    disallow-doctype-decl) removes the mechanism XXE relies on. Prefer JSON where possible.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-045
  difficulty: advanced
  tags:
  - xxe
  - blind
  - dos
  question: |
    Which statement about advanced XXE is correct?
  options:
  - XXE cannot be exploited if the entity value is not reflected in the response
  - Blind XXE can exfiltrate data out-of-band via a malicious external DTD, and entity expansion can cause
    a 'billion laughs' DoS
  - XXE only affects SOAP services
  - The billion-laughs attack steals credentials
  answer: 1
  explanation: |
    When the entity isn't reflected, blind XXE uses parameter entities and an external DTD
    to exfiltrate data out-of-band. Separately, recursive entity expansion (billion laughs)
    is a denial-of-service vector.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-046
  difficulty: intermediate
  tags:
  - ssrf-vs-csrf
  - concepts
  question: |
    What is the key difference between SSRF and CSRF?
  options:
  - They are the same attack with different names
  - CSRF only works over HTTPS while SSRF works over HTTP
  - SSRF requires the victim to click a link; CSRF does not
  - SSRF abuses the server to make requests from its network position; CSRF abuses the victim's browser
    to make requests with the victim's cookies
  answer: 3
  explanation: |
    Different actor and trust boundary: CSRF rides the victim's authenticated browser
    session; SSRF coerces the server itself into making requests using the server's network
    access and identity.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-047
  difficulty: advanced
  tags:
  - gcp
  - azure
  - metadata
  question: |
    An SSRF payload targets GCP's metadata server. Which detail is correct?
  options:
  - GCP metadata requires no special header, unlike AWS IMDSv1
  - GCP metadata is served over HTTPS with client certificates
  - 'GCP metadata (metadata.google.internal / 169.254.169.254) requires the header Metadata-Flavor: Google'
  - GCP does not expose a metadata service
  answer: 2
  explanation: |
    GCP requires the Metadata-Flavor: Google header on metadata requests (Azure requires
    Metadata: true). This header requirement is itself a mild SSRF mitigation, since many
    fetchers cannot set custom headers.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-048
  difficulty: advanced
  tags:
  - scenario
  - defense-review
  question: |
    A team fixes their SSRF-prone image importer. Which implementation is actually safe?
  options:
  - Parse with one URL library, allow only http/https, resolve all A/AAAA records, reject non-public IPs,
    connect to the pinned IP, and disable redirect following
  - Block the strings '127.0.0.1' and '169.254.169.254', then fetch with redirects enabled
  - Only allow URLs from logged-in users and follow all redirects
  - Resolve the hostname, confirm it is public, then re-resolve and connect by name
  answer: 0
  explanation: |
    The safe design combines every control: single parser, scheme allowlist, resolve-all-
    records + public-IP check, IP pinning (defeats rebinding), and no redirect following.
    The others fall to encoding tricks, redirects, or DNS rebinding.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-049
  difficulty: beginner
  tags:
  - schemes
  - disable-redirects
  question: |
    Why should automatic redirect following be disabled (or re-validated) in an
    SSRF-sensitive client?
  options:
  - Redirects slow down the request
  - Redirects break TLS
  - Redirects are deprecated in HTTP/2
  - A validated URL can redirect to an unvalidated internal target or a dangerous scheme like gopher://
  answer: 3
  explanation: |
    If validation only checks the first URL, a redirect can send the client to an internal
    IP or switch to a dangerous scheme. Disable auto-follow or re-validate each hop and
    restrict redirect protocols.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-050
  difficulty: intermediate
  tags:
  - rce
  - redis
  - scenario
  question: |
    An attacker has SSRF that can send arbitrary bytes to an internal, unauthenticated
    Redis on port 6379. What is the realistic worst case?
  options:
  - They can only read Redis version information
  - They can slow down Redis but not compromise the host
  - Remote code execution — e.g. scripting Redis to write a cron job or SSH key, achieving command execution
  - Nothing, because Redis ignores HTTP requests
  answer: 2
  explanation: |
    With arbitrary-byte SSRF (e.g. via gopher://), an unauthenticated Redis can be driven to
    write files (cron entries, SSH keys, webshells), turning SSRF into remote code
    execution on the host.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
