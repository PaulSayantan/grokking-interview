topic: "Authentication & Multi-Factor Authentication"
domain: security
topic_slug: authentication-and-mfa
version: 1
questions:
  - id: authentication-and-mfa-001
    difficulty: beginner
    tags: [authn, authz, fundamentals]
    question: |
      What does authentication (as opposed to authorization) establish?
    options:
      - "Who the requester is, verified by proof of a credential"
      - "What actions a principal is permitted to perform"
      - "Which resources currently exist within the system's catalog"
      - "How long an authenticated session should remain valid before expiry"
    answer: 0
    explanation: |
      Authentication answers "who are you, and can you prove it?" — it produces a verified
      identity/principal. Deciding what that identity may do is authorization.
    ref: "concepts.md#authentication-versus-authorization"

  - id: authentication-and-mfa-002
    difficulty: beginner
    tags: [http, status-codes, authn, authz]
    question: |
      A user is logged in but requests an admin-only page they are not permitted to see.
      Which HTTP status is semantically correct?
    options:
      - "401 Unauthorized"
      - "403 Forbidden"
      - "400 Bad Request"
      - "302 Found"
    answer: 1
    explanation: |
      401 actually means un-authenticated (no/invalid credentials, should carry
      WWW-Authenticate). The user here IS authenticated but lacks authorization, so 403
      Forbidden is correct.
    ref: "concepts.md#authentication-versus-authorization"

  - id: authentication-and-mfa-003
    difficulty: intermediate
    tags: [http, status-codes, authn]
    question: |
      Which statement about 401 vs 403 is correct?
    options:
      - "401 means authenticated-but-not-permitted; 403 means credentials were missing"
      - "Both mean exactly the same thing and can be used interchangeably by clients and servers"
      - "401 means not-authenticated and should include a WWW-Authenticate header; 403 means authenticated but not authorized"
      - "403 should always be returned before authentication is attempted, and 401 only afterward"
    answer: 2
    explanation: |
      Despite its name, 401 Unauthorized means un-authenticated and should carry
      WWW-Authenticate. 403 Forbidden means the request is authenticated but the principal
      is not authorized for the resource.
    ref: "concepts.md#authentication-versus-authorization"

  - id: authentication-and-mfa-004
    difficulty: beginner
    tags: [factors, mfa]
    question: |
      The three classic authentication factor categories are best described as:
    options:
      - "A memorized password, a numeric PIN, and a longer passphrase"
      - "The account username, its password, and a recovery email address"
      - "Symmetric encryption, one-way hashing, and digital signing"
      - "Something you know, something you have, something you are"
    answer: 3
    explanation: |
      The categories are knowledge (know), possession (have), and inherence (are).
      True MFA combines factors from different categories.
    ref: "concepts.md#authentication-factors"

  - id: authentication-and-mfa-005
    difficulty: beginner
    tags: [factors]
    question: |
      Which authentication factor category does a hardware security key belong to?
    options:
      - "Possession"
      - "Knowledge"
      - "Inherence"
      - "Location"
    answer: 0
    explanation: |
      A security key is a physical device you must have — the possession factor. A password
      is knowledge; a fingerprint is inherence.
    ref: "concepts.md#authentication-factors"

  - id: authentication-and-mfa-006
    difficulty: intermediate
    tags: [factors, mfa]
    question: |
      A login requires a password plus the answer to a security question ("mother's maiden
      name"). Is this multi-factor authentication?
    options:
      - "Yes — it uses two separate credentials"
      - "No — both are knowledge factors, so it is single-factor"
      - "Yes — the security question counts as possession"
      - "No — security questions are an inherence factor and cannot be combined"
    answer: 1
    explanation: |
      MFA requires factors from DIFFERENT categories. A password and a security-question
      answer are both knowledge, so this is still single-factor.
    ref: "concepts.md#authentication-factors"

  - id: authentication-and-mfa-007
    difficulty: intermediate
    tags: [biometrics, factors]
    question: |
      Why are biometrics (fingerprint, face) generally not treated as a secret you send to
      the server like a password?
    options:
      - "The raw templates are too large to transmit within a standard HTTP request body"
      - "They change too frequently between scans to be stored as a stable server-side value"
      - "They are not secret and not revocable, so they are used to locally unlock a key rather than sent as a shared secret"
      - "Servers lack the specialized hardware needed to compute secure hashes of biometric data"
    answer: 2
    explanation: |
      You leave fingerprints everywhere and your face is public; you also cannot reissue a
      compromised iris. So biometrics locally unlock a possession-based key (e.g., in a
      secure enclave); the server verifies the key, not the biometric.
    ref: "concepts.md#authentication-factors"

  - id: authentication-and-mfa-008
    difficulty: beginner
    tags: [mfa, 2fa]
    question: |
      What is the core security benefit of MFA against credential stuffing?
    options:
      - "It automatically increases the minimum length of every user's password"
      - "It encrypts the password in transit so it cannot be sniffed on the wire"
      - "It removes the need to store any password hashes on the server at all"
      - "An attacker with a stolen/reused password still lacks the second factor"
    answer: 3
    explanation: |
      Most account takeovers start with stolen or reused passwords. MFA breaks that chain
      because possession of the password alone is no longer sufficient to log in.
    ref: "concepts.md#mfa-and-2fa"

  - id: authentication-and-mfa-009
    difficulty: intermediate
    tags: [mfa, strength-ladder]
    question: |
      Rank these MFA second factors from weakest to strongest in resistance to remote
      compromise and phishing.
    options:
      - "SMS OTP < TOTP app < WebAuthn/passkey"
      - "WebAuthn key < TOTP app < SMS OTP"
      - "TOTP app < SMS OTP < WebAuthn key"
      - "They are all equally strong once MFA is enabled"
    answer: 0
    explanation: |
      SMS is phishable and interceptable (SIM swap/SS7); TOTP is not remotely interceptable
      but is still phishable by a real-time proxy; WebAuthn/passkeys are phishing-resistant
      via origin binding.
    ref: "concepts.md#mfa-and-2fa"

  - id: authentication-and-mfa-010
    difficulty: intermediate
    tags: [mfa, sessions]
    question: |
      An attacker steals a valid session cookie after the victim completed MFA at login.
      Why can the attacker still access the account?
    options:
      - "MFA re-validates every subsequent request individually, so a stolen cookie is inert"
      - "MFA protects the login event, not the resulting session; a stolen session token bypasses it"
      - "Session cookies become cryptographically immune to theft once MFA is enabled on the account"
      - "The attacker is forced to re-solve the MFA challenge before the stolen cookie will work"
    answer: 1
    explanation: |
      MFA gates the authentication event that mints the session. A stolen session token or
      cookie rides an already-authenticated session, which is why session hardening and token
      binding matter alongside MFA.
    ref: "concepts.md#mfa-and-2fa"

  - id: authentication-and-mfa-011
    difficulty: intermediate
    tags: [hotp, rfc-4226]
    question: |
      In HOTP (RFC 4226), what moving value is combined with the shared secret to produce
      each one-time code?
    options:
      - "The current wall-clock time truncated to the nearest 30-second step"
      - "A fresh random nonce chosen by the server and sent to the client per request"
      - "A counter that increments on each use"
      - "The salted hash of the user's account password, recomputed each time"
    answer: 2
    explanation: |
      HOTP = Truncate(HMAC-SHA-1(K, C)) mod 10^Digits, where C is an 8-byte counter that
      increments on each use. Replacing that counter with time yields TOTP.
    ref: "concepts.md#hotp-mechanics-rfc-4226"

  - id: authentication-and-mfa-012
    difficulty: advanced
    tags: [hotp, hmac, sha1]
    question: |
      Why is it acceptable that HOTP/TOTP use HMAC-SHA-1 even though SHA-1 is considered
      broken for collision resistance?
    options:
      - "SHA-1 is not actually broken and remains fully collision-resistant in practice"
      - "Truncating the output to 6 digits mathematically repairs SHA-1's collision weaknesses"
      - "The incrementing counter makes the choice of underlying hash function completely irrelevant"
      - "HMAC's security does not depend on the hash's collision resistance, so HMAC-SHA-1 remains secure here"
    answer: 3
    explanation: |
      HMAC relies on the pseudorandomness/PRF property of the underlying hash, not collision
      resistance, so HMAC-SHA-1 is still considered secure. Newer deployments nonetheless
      allow SHA-256/512.
    ref: "concepts.md#hotp-mechanics-rfc-4226"

  - id: authentication-and-mfa-013
    difficulty: advanced
    tags: [hotp, counter-sync]
    question: |
      Why do HOTP verifiers accept a look-ahead window of several future counter values?
    options:
      - "Because the client counter can advance past the server's when codes are generated but never submitted, causing desync"
      - "To let several different users share and take turns with one physical token"
      - "To keep each generated code valid across a much longer span of time"
      - "To support one-time codes that are longer than the usual 8 digits"
    answer: 0
    explanation: |
      Users may generate codes that never reach the server (cancelled/fat-fingered),
      advancing the client counter. A look-ahead window of s future counters resyncs them.
      This desync fragility is a key reason TOTP replaced HOTP for apps.
    ref: "concepts.md#hotp-mechanics-rfc-4226"

  - id: authentication-and-mfa-014
    difficulty: intermediate
    tags: [hotp, expiry]
    question: |
      A user generates an HOTP code but does not use it; an attacker phishes it. Compared to
      a TOTP code, what is the risk?
    options:
      - "The HOTP code self-expires after 30 seconds, exactly like a rotating TOTP code"
      - "The HOTP code stays valid until that counter value is consumed, so it does not self-expire"
      - "The HOTP code is useless to the attacker because it is derived purely from time"
      - "The HOTP code is locked to the original device and rejected from any other client"
    answer: 1
    explanation: |
      HOTP codes do not expire on their own — a counter value's code remains valid until that
      counter is consumed. TOTP codes die with their time step, limiting the phishing window.
    ref: "concepts.md#hotp-mechanics-rfc-4226"

  - id: authentication-and-mfa-015
    difficulty: beginner
    tags: [totp, rfc-6238]
    question: |
      What is the default time step (X) for TOTP as defined in RFC 6238?
    options:
      - "10 seconds"
      - "60 seconds"
      - "30 seconds"
      - "300 seconds"
    answer: 2
    explanation: |
      RFC 6238 uses a default time step X of 30 seconds and T0 of the Unix epoch (0), so
      T = floor((now - T0)/X). Codes rotate every 30 seconds.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-016
    difficulty: intermediate
    tags: [totp, drift-window]
    question: |
      Why do TOTP verifiers typically accept the code for the current step plus the previous
      and next step (±1)?
    options:
      - "To let the same code be reused all day"
      - "Because RFC 6238 requires a 10-minute window"
      - "To support multiple secrets per user"
      - "To tolerate small clock skew and user typing delay while limiting the attack surface"
    answer: 3
    explanation: |
      A small drift window (about ±1 step, ~90s total) tolerates clock skew and entry delay.
      RFC 6238 recommends at most one step of tolerance because each extra step widens the
      brute-force/replay surface.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-017
    difficulty: intermediate
    tags: [totp, replay]
    question: |
      Which server-side control prevents an eavesdropper from replaying a TOTP code within
      its valid 30-second window?
    options:
      - "Recording accepted codes/steps and refusing to accept the same code again"
      - "Widening the drift window to ±5 steps"
      - "Increasing the code from 6 to 8 digits"
      - "Storing the seed in plaintext for faster lookup"
    answer: 0
    explanation: |
      Once a code for step T is accepted, the server must mark it consumed and reject reuse;
      otherwise an eavesdropper replays it within the same window. Rate-limiting is also
      required to stop brute force.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-018
    difficulty: advanced
    tags: [totp, phishing]
    question: |
      Why does TOTP fail to stop a real-time phishing proxy (adversary-in-the-middle) even
      though the code changes every 30 seconds?
    options:
      - "The proxy can predict future codes from past ones"
      - "The proxy relays the code the victim just typed to the real site within the same window"
      - "TOTP codes never change, so they are trivially replayed"
      - "The proxy can derive the shared secret from a single code"
    answer: 1
    explanation: |
      Rotation only prevents LATER reuse. A live proxy captures the 6 digits and forwards
      them to the genuine site inside the 30-second window. Only origin-bound credentials
      (WebAuthn) defeat this relay.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-019
    difficulty: advanced
    tags: [totp, secret-storage]
    question: |
      Compared to storing a password verifier, what makes leaking a TOTP seed database
      especially damaging?
    options:
      - "TOTP seeds are stored as one-way salted SHA-256 hashes, so even a full database dump cannot reveal a usable seed"
      - "TOTP seeds are the public half of an asymmetric key pair, so leaking them exposes nothing an attacker could forge codes with"
      - "The seed is a shared symmetric secret the server also holds, so a breach lets an attacker generate valid codes for every user"
      - "The seed merely unlocks the local authenticator app on the client and is never actually retained on the server side"
    answer: 2
    explanation: |
      Unlike a salted password hash, the TOTP seed is a shared symmetric secret stored on the
      server. Leaking seeds lets an attacker compute valid codes for every account, so seeds
      should be encrypted / kept in an HSM.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-020
    difficulty: beginner
    tags: [sms, sim-swap]
    question: |
      What is a SIM swap attack?
    options:
      - "Malware on the phone that silently clones the seed out of the authenticator app and mirrors every generated OTP"
      - "Brute-forcing the victim's 6-digit code offline by iterating all one million combinations against a captured hash"
      - "Intercepting the carrier's TLS session to read the plaintext bodies of SMS messages as they transit the network"
      - "Social-engineering a carrier to port the victim's number to an attacker-controlled SIM, capturing SMS OTPs"
    answer: 3
    explanation: |
      In a SIM swap the attacker convinces (or bribes) the carrier to move the victim's number
      to their SIM. All SMS — including OTPs and reset links — then arrive on the attacker's
      device, with no malware on the victim.
    ref: "concepts.md#sms-otp-weaknesses-sim-swap-and-ss7"

  - id: authentication-and-mfa-021
    difficulty: intermediate
    tags: [sms, ss7]
    question: |
      Why is SS7 a concern for SMS-based OTP delivery?
    options:
      - "SS7 is the carrier signaling protocol with weak inter-operator authentication, letting a network-positioned attacker reroute/intercept SMS remotely"
      - "SS7 applies end-to-end encryption to every SMS, so a breach of one carrier exposes the shared keys that protect all OTP traffic"
      - "SS7 governs only voice-call setup and teardown, so text-message OTP delivery rides an entirely separate and unaffected path"
      - "SS7 caps the length of any signaling payload, which forces all delivered one-time passcodes down to just 4 digits"
    answer: 0
    explanation: |
      SS7 is the legacy signaling network between carriers with weak authentication. An
      attacker with SS7 access can reroute or intercept SMS and calls at scale, remotely,
      without touching the victim's SIM.
    ref: "concepts.md#sms-otp-weaknesses-sim-swap-and-ss7"

  - id: authentication-and-mfa-022
    difficulty: intermediate
    tags: [sms, nist, 800-63b]
    question: |
      How does NIST SP 800-63B classify OTP delivered via SMS/voice over the public switched
      telephone network?
    options:
      - "Fully recommended across every assurance level, including the highest, provided the message body is kept under 160 characters"
      - "RESTRICTED — permitted only with risk assessment and a migration path, not recommended for new systems"
      - "Prohibited outright at all assurance levels with no exceptions, grandfathering, or migration allowance whatsoever"
      - "Treated as equivalent to a certified hardware authenticator once the carrier confirms the number is a postpaid line"
    answer: 1
    explanation: |
      NIST SP 800-63B labels PSTN-delivered OTP (SMS/voice) as a RESTRICTED authenticator:
      allowed with a documented risk assessment and migration plan, but discouraged for new
      deployments due to SIM-swap and SS7 risks.
    ref: "concepts.md#sms-otp-weaknesses-sim-swap-and-ss7"

  - id: authentication-and-mfa-023
    difficulty: intermediate
    tags: [sms, recovery, downgrade]
    question: |
      An app uses TOTP as its second factor but lets users reset TOTP via an SMS code. What
      is the effective strength of the account's MFA?
    options:
      - "TOTP strength, because a rarely-used SMS backup path does not lower the strength of the primary factor"
      - "Stronger than TOTP alone, since combining two independent delivery channels compounds the security of both"
      - "SMS strength, because the weakest accepted path (SMS) can reset the stronger factor"
      - "Unaffected, because account recovery is a separate subsystem that has no bearing on the login factor's strength"
    answer: 2
    explanation: |
      Security equals the weakest accepted path. If SMS can reset TOTP, an attacker only needs
      to beat SMS (SIM swap/SS7), collapsing the whole scheme to SMS strength. Never let a weak
      channel recover a stronger factor.
    ref: "concepts.md#sms-otp-weaknesses-sim-swap-and-ss7"

  - id: authentication-and-mfa-024
    difficulty: intermediate
    tags: [push, mfa-fatigue]
    question: |
      What is an MFA fatigue (prompt bombing) attack?
    options:
      - "Flooding the authentication server with traffic until it fails open and disables MFA enforcement for all users"
      - "Repeatedly waking the push app so it drains the phone battery and the second factor can no longer run at all"
      - "Capturing one push token and brute-forcing the TOTP seed offline by regenerating codes until one matches"
      - "An attacker with the password triggers repeated push prompts until the victim approves one out of annoyance or confusion"
    answer: 3
    explanation: |
      Having the password, the attacker spams login attempts, flooding the victim with push
      approvals until they tap Approve. This technique featured in several 2022 breaches
      (Uber, Cisco).
    ref: "concepts.md#push-based-authentication-and-mfa-fatigue"

  - id: authentication-and-mfa-025
    difficulty: intermediate
    tags: [push, number-matching]
    question: |
      How does number matching defend against MFA fatigue?
    options:
      - "It requires the user to enter/select a number shown on the legitimate login screen into the prompt, forcing them to look at the real login and defeating blind approvals"
      - "It end-to-end encrypts the push notification payload so an attacker who triggers prompts can never see or reuse the approval"
      - "It throttles the account to a single push prompt per day, so a spamming attacker simply runs out of allowed attempts"
      - "It transparently replaces the push channel with an SMS one-time code that the attacker cannot see on the victim's phone"
    answer: 0
    explanation: |
      Number matching makes the user transcribe a number from the actual login screen into the
      push prompt, so they cannot blindly approve or be spammed into approving. It does not,
      however, stop a full AiTM relay.
    ref: "concepts.md#push-based-authentication-and-mfa-fatigue"

  - id: authentication-and-mfa-026
    difficulty: advanced
    tags: [push, number-matching, aitm]
    question: |
      Which statement about number matching is accurate?
    options:
      - "It makes push authentication fully phishing-resistant like WebAuthn by binding the approval to the real site's origin"
      - "It defeats blind approval and prompt spam but not a real-time adversary-in-the-middle relay"
      - "It eliminates the need to protect the resulting session, since an approved number can no longer be replayed"
      - "It functions only when the challenge number is delivered over an SMS-based code channel rather than an app push"
    answer: 1
    explanation: |
      Number matching stops fatigue/blind approvals, but a real-time proxy can display the
      matching number from the real site, so it is not phishing-resistant in the WebAuthn
      (origin-bound) sense.
    ref: "concepts.md#push-based-authentication-and-mfa-fatigue"

  - id: authentication-and-mfa-027
    difficulty: beginner
    tags: [webauthn, fido2, public-key]
    question: |
      In WebAuthn/FIDO2, where does the private key live and what does the server store?
    options:
      - "The server retains the private key in an HSM while the client holds only the matching public key for verification"
      - "Both halves of the key pair are escrowed on the server so the account can be recovered if the authenticator is lost"
      - "The private key never leaves the authenticator; the server stores the corresponding public key"
      - "The freshly generated private key is emailed to the user at registration so it can be re-imported on new devices"
    answer: 2
    explanation: |
      WebAuthn uses public-key crypto: the authenticator generates a key pair per site, keeps
      the private key locally, and registers the public key with the relying party. Login is a
      challenge signed by the private key.
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-028
    difficulty: intermediate
    tags: [webauthn, phishing-resistant, origin-binding]
    question: |
      Which mechanism makes WebAuthn phishing-resistant?
    options:
      - "The 6-digit code rotates every 30 seconds, so a phished code expires before the attacker can relay it onward"
      - "The user must physically approve a push notification, which an attacker on a look-alike domain is unable to trigger"
      - "The server aggressively rate-limits login attempts, so a phishing proxy cannot submit the captured credential in time"
      - "The credential is bound to the origin/RP ID, so the browser will not produce a valid assertion for a look-alike domain"
    answer: 3
    explanation: |
      The browser includes the real origin in the signed clientDataJSON and scopes the
      credential to an RP ID. A key registered for example.com will not sign for examp1e.com,
      so a phishing proxy cannot obtain a usable assertion.
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-029
    difficulty: advanced
    tags: [webauthn, breach]
    question: |
      Why is a database breach of a relying party that uses WebAuthn far less damaging than a
      breach of password hashes or TOTP seeds?
    options:
      - "The server only holds public keys, which are useless to an attacker"
      - "WebAuthn stores no user records at all server-side, so a database dump yields nothing that maps back to an account"
      - "WebAuthn key pairs automatically expire and rotate every 24 hours, so any leaked material is stale before it can be used"
      - "The per-user private keys are held on the server but sealed under envelope encryption, so a dump exposes only ciphertext"
    answer: 0
    explanation: |
      The RP stores only public keys. Leaking public keys gives an attacker nothing usable —
      there is no shared secret to reverse or replay, unlike password hashes or TOTP seeds.
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-030
    difficulty: advanced
    tags: [webauthn, attestation]
    question: |
      What does attestation provide in a WebAuthn registration?
    options:
      - "It transmits the user's enrolled biometric template to the server so the relying party can verify it centrally"
      - "A signature (from a manufacturer key) asserting the model/type of authenticator, useful for high-assurance policy but privacy-sensitive"
      - "It backs up the newly generated private key to the manufacturer's cloud so the credential survives device loss"
      - "It cryptographically proves the user's real-world legal identity, binding the credential to a government-issued document"
    answer: 1
    explanation: |
      Attestation lets the authenticator assert what kind of device it is (model/certification)
      via a manufacturer signature — useful for enterprises requiring certified hardware, but
      privacy-sensitive, so many consumer RPs request attestation "none".
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-031
    difficulty: intermediate
    tags: [passkeys, synced, device-bound]
    question: |
      What is the main trade-off of synced passkeys versus device-bound passkeys?
    options:
      - "Synced passkeys are phishable via look-alike domains while device-bound passkeys enforce origin binding and are not"
      - "Device-bound passkeys transmit their private key during login, so they can be intercepted by a network eavesdropper"
      - "Synced passkeys offer better recovery/UX but tie assurance to the cloud account and allow the key to be copied across devices; device-bound keys never leave one authenticator"
      - "There is no meaningful difference; the two terms are interchangeable labels for the exact same credential storage model"
    answer: 2
    explanation: |
      Synced passkeys are backed up to a cloud keychain — great UX and recovery, but assurance
      depends on that cloud account and the key can propagate to other devices. Device-bound
      keys stay on one authenticator (highest assurance, but lose it and it is gone).
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-032
    difficulty: intermediate
    tags: [webauthn, biometrics]
    question: |
      When you use a fingerprint to sign in with a platform passkey, what is actually sent to
      the server?
    options:
      - "Your raw enrolled fingerprint template, uploaded so the relying party can match it against future scans"
      - "A one-way salted hash of your fingerprint minutiae, which the server compares to the hash stored at enrollment"
      - "The captured biometric bundled together with the private key, so the server can verify both in a single step"
      - "A signature over the server's challenge produced by the private key that the fingerprint unlocked locally"
    answer: 3
    explanation: |
      The biometric only unlocks the local private key; it never leaves the device. The server
      receives a cryptographic signature over its challenge and verifies it against the stored
      public key.
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-033
    difficulty: beginner
    tags: [recovery-codes]
    question: |
      How should backup/recovery codes be stored on the server?
    options:
      - "Hashed (like passwords), single-use, shown once, and regenerable"
      - "In reversible plaintext in the user record so a support agent can read them back to a caller during recovery"
      - "Encrypted under a symmetric key that is printed on the login page so any browser can decrypt and verify them"
      - "Never persisted anywhere; they are computed on the fly from the username each time one is needed for recovery"
    answer: 0
    explanation: |
      Recovery codes are bearer secrets. Store them hashed like passwords, display once, mark
      each single-use, and let users regenerate (invalidating the old set).
    ref: "concepts.md#recovery-codes-and-account-recovery-risks"

  - id: authentication-and-mfa-034
    difficulty: intermediate
    tags: [recovery, downgrade, threat-model]
    question: |
      A high-value app enforces WebAuthn but keeps a "Forgot your key? Get a code by SMS"
      recovery path. Why is this a problem?
    options:
      - "It roughly doubles the login friction, and the added user drop-off outweighs any marginal security benefit it provides"
      - "It is a bypass: the account's real security drops to SMS strength because that weaker path can restore access"
      - "SMS one-time codes carry more entropy than a WebAuthn assertion, so routing recovery through them actually hardens the account"
      - "It is perfectly fine because WebAuthn remains the primary factor and a recovery channel is never part of the threat model"
    answer: 1
    explanation: |
      Every path to authenticated=true must meet the same bar. A weaker recovery channel (SMS)
      that grants access downgrades the whole scheme to that channel's strength — a bypass, not
      defense-in-depth.
    ref: "concepts.md#recovery-codes-and-account-recovery-risks"

  - id: authentication-and-mfa-035
    difficulty: intermediate
    tags: [recovery, security-questions, nist]
    question: |
      What is NIST SP 800-63B's stance on knowledge-based "secret questions" (e.g., mother's
      maiden name) as an authenticator?
    options:
      - "They are recommended as a strong standalone second factor, on par with a TOTP app, for any AAL2 deployment"
      - "They count as a possession factor because only the legitimate account owner can recall the pre-registered answer"
      - "They are prohibited as an authenticator because answers are often public or guessable"
      - "They are permitted only when the question and answer are transmitted to the user over an out-of-band SMS channel"
    answer: 2
    explanation: |
      NIST prohibits secret/security questions as authenticators because answers are commonly
      public, guessable, or discoverable. If used at all, they should be treated like passwords,
      but are best dropped.
    ref: "concepts.md#recovery-codes-and-account-recovery-risks"

  - id: authentication-and-mfa-036
    difficulty: intermediate
    tags: [recovery, help-desk, social-engineering]
    question: |
      Which is a realistic risk of human-driven (help-desk) account recovery for high-value
      accounts?
    options:
      - "It is immune to social engineering precisely because a trained human agent, not an automated flow, makes the final decision"
      - "It automatically enforces phishing-resistant MFA on the caller before any reset can be performed by the agent"
      - "It is structurally incapable of resetting or removing a registered MFA authenticator under any circumstances"
      - "It is a prime social-engineering target — effectively the enterprise equivalent of a SIM swap — so it needs strong identity proofing"
    answer: 3
    explanation: |
      Help-desk recovery is frequently attacked via social engineering (impersonation), the
      enterprise analog of a SIM swap. High-value resets require robust identity proofing.
    ref: "concepts.md#recovery-codes-and-account-recovery-risks"

  - id: authentication-and-mfa-037
    difficulty: beginner
    tags: [step-up, re-auth]
    question: |
      What is step-up authentication?
    options:
      - "Requiring additional/fresh proof for higher-risk actions even within an active session"
      - "Requiring MFA only at the very first login and then never prompting for it again"
      - "Gradually increasing the minimum password length requirement for all users over time"
      - "Automatically logging every user out on a fixed one-hour timer regardless of activity"
    answer: 0
    explanation: |
      Step-up (re-authentication) demands a stronger or fresher factor for sensitive operations
      (money transfer, changing email) within an existing session, limiting the damage of a
      hijacked idle session.
    ref: "concepts.md#step-up-and-adaptive-authentication"

  - id: authentication-and-mfa-038
    difficulty: intermediate
    tags: [adaptive, risk-based]
    question: |
      What best describes adaptive (risk-based) authentication?
    options:
      - "It always demands the maximum possible number of authentication factors on every login attempt"
      - "It scores each attempt from signals (device, IP, geo, impossible travel) and demands more proof only when risk is high"
      - "It disables MFA entirely to prioritize user convenience over any additional login security"
      - "It automatically rotates the user's password on a fixed schedule regardless of any risk signals"
    answer: 1
    explanation: |
      Adaptive auth uses contextual signals to compute a risk score and steps up friction
      (MFA/step-up) for risky attempts while letting low-risk logins proceed smoothly, balancing
      security and UX.
    ref: "concepts.md#step-up-and-adaptive-authentication"

  - id: authentication-and-mfa-039
    difficulty: advanced
    tags: [adaptive, signals]
    question: |
      Why should IP address and device fingerprint be treated as risk signals rather than
      authenticators?
    options:
      - "They are cryptographically signed by the browser on every request, making them impossible to forge"
      - "They are always accurate identifiers of a device and can therefore fully replace a second factor"
      - "They are spoofable, so 'trusted network → skip MFA' is a weak control; signals should add friction, rarely remove a real factor"
      - "They are stored inside the device's secure enclave, so they cannot be read or altered by an attacker"
    answer: 2
    explanation: |
      IPs and device fingerprints can be spoofed, so they are inputs to a decision, not proofs
      of identity. Use them to ADD friction on risky attempts; avoid using them to REMOVE a
      genuine authenticator.
    ref: "concepts.md#step-up-and-adaptive-authentication"

  - id: authentication-and-mfa-040
    difficulty: beginner
    tags: [passwordless]
    question: |
      What does passwordless authentication mean?
    options:
      - "Using a single very long password as the only credential, with no other factor involved"
      - "Storing every user's password in reversible plaintext so it can be echoed back during login"
      - "Requiring three separate authentication factors on each login instead of the usual two"
      - "Removing the knowledge (password) factor, replacing it with possession/inherence such as a passkey or magic link"
    answer: 3
    explanation: |
      Passwordless removes the password entirely, relying on possession/inherence — e.g.,
      WebAuthn/passkeys, magic links, or OTPs. It eliminates password reuse/stuffing, but its
      strength depends on what replaces the password.
    ref: "concepts.md#passwordless-authentication"

  - id: authentication-and-mfa-041
    difficulty: intermediate
    tags: [passwordless, magic-link]
    question: |
      Which statement about magic-link passwordless login is correct?
    options:
      - "Its security collapses to email-account security and the link can be phished/relayed, so links should be single-use, short-TTL, and session-bound"
      - "It is inherently phishing-resistant because the link is bound to the browser that requested it"
      - "It never leaks in practice because the link body is encrypted end-to-end before it is emailed"
      - "It is cryptographically stronger than a passkey since the link carries far more entropy"
    answer: 0
    explanation: |
      A magic link is only as strong as the email account and can be phished or relayed; it can
      leak via referrer/history/shared inboxes. Mitigate with single-use, short-lived links bound
      to the requesting session — but it is not phishing-resistant like a passkey.
    ref: "concepts.md#passwordless-authentication"

  - id: authentication-and-mfa-042
    difficulty: intermediate
    tags: [passwordless, mfa, passkeys]
    question: |
      Why are passkeys often described as "MFA in a single tap"?
    options:
      - "They deliver two separate one-time passcodes simultaneously, one by app and one by SMS"
      - "One gesture combines the device you have (possession) with the biometric/PIN that unlocks it (inherence/knowledge), so it is both passwordless and multi-factor"
      - "They require the user to enter a password and then separately submit a scanned fingerprint"
      - "They split verification across two independent servers that must both approve the sign-in"
    answer: 1
    explanation: |
      A passkey authentication uses the authenticator you possess plus a local biometric/PIN that
      unlocks its private key — two factor categories in one action — making it simultaneously
      passwordless and multi-factor.
    ref: "concepts.md#passwordless-authentication"

  - id: authentication-and-mfa-043
    difficulty: beginner
    tags: [nist, aal, 800-63b]
    question: |
      In NIST SP 800-63B, what is the defining requirement of AAL2?
    options:
      - "A single authentication factor, such as a password alone, is sufficient to meet the level"
      - "A hardware-based authenticator that is verifier-impersonation (phishing) resistant is mandatory"
      - "Multi-factor authentication using two distinct factors and approved cryptography"
      - "A biometric factor used entirely on its own, with no additional password or possession factor"
    answer: 2
    explanation: |
      AAL2 requires MFA — two distinct factors with approved cryptography. It does NOT require
      phishing resistance, so TOTP/push-based MFA can meet AAL2 while remaining phishable.
    ref: "concepts.md#nist-sp-800-63b-authenticator-assurance-levels"

  - id: authentication-and-mfa-044
    difficulty: advanced
    tags: [nist, aal3, phishing-resistant]
    question: |
      What distinguishes AAL3 from AAL2 in NIST SP 800-63B?
    options:
      - "AAL3 only requires a longer minimum password length than AAL2 and nothing more beyond that"
      - "AAL3 additionally permits SMS-delivered OTP as a factor, whereas AAL2 disallows SMS entirely"
      - "AAL3 removes the multi-factor requirement and instead trusts a single hardware token by itself"
      - "AAL3 requires a hardware-based authenticator AND verifier-impersonation (phishing) resistance, effectively FIDO2/PIV"
    answer: 3
    explanation: |
      AAL3 demands both a hardware authenticator and verifier-impersonation resistance
      (origin-bound crypto) — in practice FIDO2/WebAuthn security keys or PIV/smart cards. AAL2
      is MFA without a phishing-resistance requirement.
    ref: "concepts.md#nist-sp-800-63b-authenticator-assurance-levels"

  - id: authentication-and-mfa-045
    difficulty: intermediate
    tags: [nist, aal, sms]
    question: |
      A team says "we require MFA, so we are AAL3." What is the sharpest objection?
    options:
      - "MFA alone meets AAL2; AAL3 additionally requires hardware-based, phishing-resistant authenticators, so TOTP/SMS/push does not qualify"
      - "AAL3 imposes no multi-factor requirement, so ordinary MFA already exceeds what it asks for"
      - "AAL3 forbids the use of any multi-factor authentication and relies on a single strong factor"
      - "There is no meaningful difference between AAL2 and AAL3, so meeting one satisfies the other"
    answer: 0
    explanation: |
      MFA satisfies AAL2. AAL3 needs hardware-backed, phishing-resistant authenticators; phishable
      factors like TOTP, SMS, or plain push cannot reach AAL3. Ask "AAL2 or AAL3?" i.e., "is it
      phishing-resistant?"
    ref: "concepts.md#nist-sp-800-63b-authenticator-assurance-levels"

  - id: authentication-and-mfa-046
    difficulty: intermediate
    tags: [authn, authz, idor]
    question: |
      A developer reasons: "The user is logged in, so let them view invoice 42." Which flaw
      does this illustrate?
    options:
      - "A cryptographic weakness in how the session token is signed, letting it be forged offline"
      - "Treating authentication as authorization — a missing authorization (IDOR/BOLA) check"
      - "An MFA fatigue attack that spams the victim with repeated push prompts until one is approved"
      - "A TOTP replay in which a captured time-based code is resubmitted within its validity window"
    answer: 1
    explanation: |
      Authentication tells you WHO the user is, not WHETHER they may access a specific object.
      Skipping the per-object authorization check is a missing-authorization bug (IDOR/BOLA).
    ref: "concepts.md#authentication-versus-authorization"

  - id: authentication-and-mfa-047
    difficulty: advanced
    tags: [totp, brute-force, rate-limiting]
    question: |
      Given a 6-digit TOTP and a ±1 step acceptance window, why is server-side rate limiting
      mandatory (per RFC 4226)?
    options:
      - "Because rate limiting shortens the TOTP time step from 30 seconds down to just 10 seconds"
      - "Because throttling transparently encrypts the shared seed at rest so a leak cannot reveal it"
      - "Because codes are 1-in-1,000,000 and, without throttling, online guessing across many attempts becomes feasible"
      - "Because it lets the acceptance drift window be safely widened to many additional steps"
    answer: 2
    explanation: |
      A 6-digit code has a 1-in-10^6 guess probability per attempt; with a widened window and no
      throttling, sustained online brute force is realistic. RFC 4226 requires throttling/lockout
      to keep OTPs secure.
    ref: "concepts.md#totp-mechanics-and-the-drift-window-rfc-6238"

  - id: authentication-and-mfa-048
    difficulty: beginner
    tags: [webauthn, challenge-response]
    question: |
      During WebAuthn login, what does the server send that the authenticator signs?
    options:
      - "The user's account password, which the authenticator re-signs to prove knowledge of it"
      - "The stored public key itself, which the authenticator echoes back after signing over it"
      - "A fresh 6-digit numeric code that the authenticator must transcribe and return in order"
      - "A random challenge, which the authenticator signs with the private key"
    answer: 3
    explanation: |
      The server issues a fresh random challenge; the authenticator signs it (after a user
      gesture) with the private key, and the server verifies the signature against the stored
      public key. Fresh challenges prevent replay.
    ref: "concepts.md#webauthn-fido2-and-passkeys"

  - id: authentication-and-mfa-049
    difficulty: expert
    tags: [aitm, phishing, sessions, evilginx]
    question: |
      In an adversary-in-the-middle (AiTM) reverse-proxy phishing attack (Evilginx-style)
      against a site protected by TOTP MFA, what is the attacker's ultimate payoff that lets
      them access the account without re-solving MFA?
    options:
      - "They reconstruct the victim's TOTP shared seed by observing several relayed 6-digit codes in sequence"
      - "They capture the authenticated session cookie/token the real site issues, and import it into their own browser"
      - "They negotiate a protocol downgrade that silently disables MFA enforcement on the genuine site"
      - "They brute-force the session identifier offline after observing a single successful login"
    answer: 1
    explanation: |
      The proxy relays password and OTP to the genuine site in real time; once the site is
      satisfied it issues a session cookie/tokens, which the in-line proxy captures. The
      attacker replays that already-authenticated cookie — MFA is already satisfied, so nothing
      needs re-solving. This links MFA bypass to session management.
    ref: "concepts.md#aitm-reverse-proxy-phishing-evilginx-and-friends"

  - id: authentication-and-mfa-050
    difficulty: expert
    tags: [aitm, webauthn, origin-binding]
    question: |
      Why does a WebAuthn/FIDO2 credential structurally defeat an AiTM reverse proxy that
      successfully relays TOTP and push?
    options:
      - "The signed clientDataJSON carries the origin the browser actually connected to (the proxy's), so the assertion fails origin/RP-ID validation at the real site"
      - "The authenticator detects the presence of a relaying proxy on the network path and refuses to sign"
      - "WebAuthn assertions are individually encrypted in transit, so the interposed proxy cannot read them"
      - "WebAuthn rotates its signing key on a faster interval than the proxy is able to relay each request"
    answer: 0
    explanation: |
      The browser binds the assertion to the origin it connected to — the proxy's look-alike
      domain — and the credential is scoped to the real RP ID. The relayed assertion is a
      signature for the wrong origin, so the genuine RP rejects it. There is nothing the proxy
      can forward that the real site will accept.
    ref: "concepts.md#aitm-reverse-proxy-phishing-evilginx-and-friends"

  - id: authentication-and-mfa-051
    difficulty: advanced
    tags: [aitm, incident-response, defense]
    question: |
      Users all have app-based TOTP MFA and there is no evidence of password reuse, yet
      attackers are logging into accounts. Which combination best explains AND fixes it?
    options:
      - "Cause: weak passwords; Fix: raise minimum password length to 20"
      - "Cause: TOTP seed database leak; Fix: rotate all seeds and rely on the same TOTP"
      - "Cause: SIM swapping; Fix: move TOTP recovery to email links"
      - "Cause: AiTM proxy relaying OTP and stealing the session cookie; Fix: phishing-resistant WebAuthn plus token binding and session-anomaly detection"
    answer: 3
    explanation: |
      Working MFA with no reuse and successful takeovers is the signature of AiTM cookie theft.
      The durable fix is phishing-resistant WebAuthn (blocks the relay), sender-constrained
      tokens (a stolen cookie is useless), and detecting anomalous reuse of an existing session.
    ref: "concepts.md#aitm-reverse-proxy-phishing-evilginx-and-friends"

  - id: authentication-and-mfa-052
    difficulty: advanced
    tags: [aitm, number-matching, mfa-fatigue]
    question: |
      A security lead proposes enabling push number-matching to stop the AiTM attacks the org
      is seeing. Why is this insufficient?
    options:
      - "Number matching is only supported on iOS devices, so it leaves the Android user base unprotected"
      - "Number matching defeats blind approval/fatigue, but an AiTM proxy simply relays the matching number from the real site, so the relay still succeeds"
      - "Number matching invalidates the resulting session cookie, which ends up breaking legitimate logins"
      - "Number matching depends on delivering the challenge over SMS, a channel that is itself weak"
    answer: 1
    explanation: |
      Number matching solves prompt bombing / blind approval, not a real-time relay: the proxy
      forwards the number it received from the genuine site to the victim. It is not
      phishing-resistant in the origin-bound (WebAuthn) sense.
    ref: "concepts.md#aitm-reverse-proxy-phishing-evilginx-and-friends"

  - id: authentication-and-mfa-053
    difficulty: intermediate
    tags: [aitm, tooling]
    question: |
      Which set names actual adversary-in-the-middle / phishing-proxy tooling used to defeat
      MFA?
    options:
      - "Evilginx2, Modlishka, Muraena, EvilProxy, Tycoon 2FA"
      - "Wireshark, tcpdump, tshark, Burp Repeater, mitmproxy passive capture"
      - "Nmap, Masscan, Shodan, ZMap, RustScan network host discovery"
      - "Hashcat, John the Ripper, Hydra, Medusa, Ophcrack offline crackers"
    answer: 0
    explanation: |
      Evilginx2, Modlishka, and Muraena are open-source AiTM frameworks; EvilProxy and Tycoon
      2FA are phishing-as-a-service kits that automate the reverse proxy plus session-cookie
      exfiltration. The other lists are packet-capture, scanning, and offline-cracking tools.
    ref: "concepts.md#aitm-reverse-proxy-phishing-evilginx-and-friends"

  - id: authentication-and-mfa-054
    difficulty: expert
    tags: [dpop, rfc-9449, tokens]
    question: |
      In a DPoP proof JWT (RFC 9449), which JOSE header/claim configuration is correct?
    options:
      - "typ=JWT, alg=HS256 using the access token string itself as the shared HMAC key, no jwk header"
      - "typ=dpop+jwt, alg=none for speed, with the raw private key embedded directly in the jwk header"
      - "typ=dpop+jwt, an asymmetric alg, jwk carrying the client public key, with htm/htu/iat/jti claims"
      - "typ=at+jwt, alg=RS256, carrying only an exp claim and omitting htm, htu, iat, and jti entirely"
    answer: 2
    explanation: |
      RFC 9449 requires typ=dpop+jwt, an asymmetric signature alg (never none or a symmetric
      MAC), and jwk holding the PUBLIC key (never the private key). Claims include htm (method),
      htu (URI without query/fragment), iat, and jti (unique, replay-tracked).
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: authentication-and-mfa-055
    difficulty: expert
    tags: [dpop, cnf, proof-of-possession]
    question: |
      How is a DPoP access token cryptographically tied to the client's key so a stolen token
      cannot be replayed by a thief?
    options:
      - "The token carries a cnf claim with jkt = the SHA-256 JWK thumbprint of the DPoP key, and the resource requires a proof signed by the matching private key"
      - "The token is encrypted with the client's public key, so only the holder of the matching private key can decrypt it before replay"
      - "The token embeds a copy of the client's private key inside the cnf claim, which the resource server extracts to verify each call"
      - "The resource server escrows the token inside the client device's TPM, releasing it only after a successful local attestation"
    answer: 0
    explanation: |
      The access token's cnf.jkt is the base64url SHA-256 thumbprint of the DPoP public key.
      A resource server accepts the token only alongside a DPoP proof signed by the matching
      private key (and with ath/htm/htu matching), which the thief lacks — turning a bearer
      token into a proof-of-possession token.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: authentication-and-mfa-056
    difficulty: advanced
    tags: [tokens, theft, sender-constrained]
    question: |
      An attacker exfiltrated a valid access token/session cookie from a victim's browser.
      Which single control most directly makes that stolen token worthless?
    options:
      - "Rotating the identity provider's token-signing key every hour so previously issued access tokens are invalidated sooner"
      - "Sender-constraining the token (DPoP cnf.jkt or mTLS x5t#S256) so it is only usable with the client's private key"
      - "Increasing the token's exp lifetime so re-issuance happens less often and the client faces fewer refresh round-trips"
      - "Adding the user's originating IP address as a signed claim the resource server re-checks on every incoming request"
    answer: 1
    explanation: |
      Sender-constrained (proof-of-possession) tokens bind the token to a key the legitimate
      client holds. Without that private key the attacker cannot produce a valid DPoP proof or
      complete the mTLS handshake, so the stolen token is unusable. An IP claim is trivially
      spoofable and often wrong behind NAT/proxies.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: authentication-and-mfa-057
    difficulty: expert
    tags: [mtls, rfc-8705, cnf]
    question: |
      In certificate-bound access tokens (RFC 8705, mTLS), what does the token's cnf claim
      hold and how is possession proven?
    options:
      - "x5t#S256 = the SHA-256 thumbprint of the client TLS certificate; the token is usable only over a mutual-TLS connection presenting that cert"
      - "The full client certificate chain, which the resource server re-signs with its own CA before accepting the bound token"
      - "The client's account password hash, which the resource server re-verifies on each request alongside the TLS session"
      - "A shared HMAC key negotiated during the TLS handshake, which both endpoints then use to re-sign the token per call"
    answer: 0
    explanation: |
      RFC 8705 binds the token via cnf.x5t#S256 = the SHA-256 thumbprint of the client
      certificate. The resource server accepts the token only over an mTLS connection presenting
      that same cert, whose private key an attacker lacks. It is heavier (PKI) but strong,
      common in FAPI/financial APIs.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: authentication-and-mfa-058
    difficulty: expert
    tags: [dpop, ath, replay]
    question: |
      When a client presents a DPoP-bound access token to a resource server, which additional
      DPoP proof claim binds the proof to that specific token, and why does it matter?
    options:
      - "aud, so the proof names the resource server and the token can only be presented at that single audience endpoint"
      - "sub, identifying the end user whose delegated consent the access token was issued to represent"
      - "ath, the base64url SHA-256 hash of the access token, so a captured proof cannot be paired with a different token"
      - "azp, the authorized party, naming the OAuth client that originally requested and received the access token"
    answer: 2
    explanation: |
      At the resource, the proof MUST include ath = base64url SHA-256 of the access token. This
      binds the proof to that exact token, so a captured proof cannot be reused with another
      token, and combined with jti/htm/htu/nonce checks it blocks replay.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: authentication-and-mfa-059
    difficulty: advanced
    tags: [enumeration, timing, defense]
    question: |
      Your login returns "user not found" vs "wrong password" and valid usernames respond
      ~200 ms slower than invalid ones. What two problems exist and what is the correct fix?
    options:
      - "Only a message-based leak; fix it by rewording both responses to the identical generic string and nothing else"
      - "Only a timing-based leak; fix it by adding a uniform random 0-500 ms delay to every login response path"
      - "A CSRF flaw exposing the login form; fix it by adding a per-request synchronizer token and SameSite cookies"
      - "Message-based AND timing-based account enumeration; fix with a generic identical message AND always running a dummy password hash for non-existent users"
    answer: 3
    explanation: |
      Differential messages leak existence directly; running bcrypt/Argon2 only for real users
      creates a timing oracle. Fix both: return an identical generic message and perform a dummy
      hash for missing accounts so response time is uniform. Random jitter is weak — averaging
      defeats it.
    ref: "concepts.md#username-and-account-enumeration"

  - id: authentication-and-mfa-060
    difficulty: intermediate
    tags: [enumeration, forgot-password]
    question: |
      Which forgot-password response best avoids account enumeration?
    options:
      - "\"If an account exists for that address, we've sent a reset link\" — identical for known and unknown addresses"
      - "\"That email is not registered\" when the address is unknown, and \"Reset link sent\" only when the account genuinely exists"
      - "Returning HTTP 404 for unknown email addresses and HTTP 200 for ones that map to a real registered account"
      - "Deliberately adding a longer response delay for registered emails so the user gets confirmation the address was found"
    answer: 0
    explanation: |
      A single generic message returned identically (same body, status, timing) for existing and
      non-existing accounts prevents the endpoint from confirming which addresses are
      registered. Differential text, status codes, or timing all leak existence.
    ref: "concepts.md#username-and-account-enumeration"

  - id: authentication-and-mfa-061
    difficulty: advanced
    tags: [credential-stuffing, password-spraying, brute-force]
    question: |
      An attacker tries the single password "Summer2025!" against 50,000 different accounts,
      one attempt each. Which attack is this and why does it evade a common defense?
    options:
      - "Credential stuffing; it works because users reuse the same leaked password pairs across many unrelated sites"
      - "Brute force; it works because \"Summer2025!\" is short enough to exhaust the full keyspace in seconds"
      - "Password spraying; one attempt per account stays under per-account lockout thresholds"
      - "A dictionary attack replaying wordlist entries against a stolen, unsalted password hash database offline"
    answer: 2
    explanation: |
      Spraying uses one common password across many accounts, so no single account crosses its
      lockout threshold. Credential stuffing replays breached user:pass PAIRS; brute force hammers
      one account with many guesses. Defenses: MFA, per-IP/global throttling, and spray detection.
    ref: "concepts.md#credential-stuffing-password-spraying-and-brute-force"

  - id: authentication-and-mfa-062
    difficulty: expert
    tags: [breach-check, k-anonymity, hibp]
    question: |
      How does the Have I Been Pwned range API let a service check a password against breach
      corpora without sending the password or its full hash?
    options:
      - "The client encrypts the password with HIBP's published RSA public key so only HIBP can decrypt and match it server-side"
      - "The client sends the first 5 hex characters of the SHA-1 hash (k-anonymity) and receives all matching suffixes to compare locally"
      - "The client sends the plaintext password over TLS and trusts HIBP to hash it and immediately discard the raw value"
      - "HIBP streams its entire multi-gigabyte breached-hash database to the client, which greps it locally on every check"
    answer: 1
    explanation: |
      The k-anonymity model sends only a 5-character SHA-1 prefix; the API returns every hash
      suffix sharing that prefix, and the client checks locally. The full password/hash never
      leaves the client. NIST SP 800-63B SHALL requires blocklist-checking against such lists.
    ref: "concepts.md#credential-stuffing-password-spraying-and-brute-force"

  - id: authentication-and-mfa-063
    difficulty: advanced
    tags: [account-lockout, dos, tradeoffs]
    question: |
      Why do modern guidelines favor throttling/exponential backoff plus MFA over aggressive
      hard account lockout after N failures?
    options:
      - "Hard lockout is too computationally expensive for the server to track failure counters at large user scale"
      - "Throttling with backoff makes user passwords unnecessary, so the knowledge factor can be dropped entirely"
      - "Hard lockout after N failures directly violates the HTTP specification's rules on authentication status codes"
      - "Hard lockout enables denial-of-service (lock any user by failing their logins) and can aid enumeration, while throttling+MFA resists guessing without those downsides"
    answer: 3
    explanation: |
      An attacker can weaponize hard lockout to lock out legitimate users (DoS), and locked-vs-not
      responses can leak which accounts exist. Throttling/backoff plus MFA slows online guessing
      while avoiding the DoS and enumeration side effects.
    ref: "concepts.md#credential-stuffing-password-spraying-and-brute-force"

  - id: authentication-and-mfa-064
    difficulty: expert
    tags: [rate-limit-bypass, x-forwarded-for]
    question: |
      A login endpoint enforces "max 5 attempts per IP," deriving the IP from the
      X-Forwarded-For header. Why does brute force still succeed and what is the fix?
    options:
      - "X-Forwarded-For arrives TLS-encrypted, so the counter never increments; fix it by decrypting the header before counting"
      - "The per-IP attempt counter silently overflows past 5 and wraps; fix it by widening the counter to a 64-bit integer"
      - "The attacker spoofs/rotates X-Forwarded-For to reset the per-IP counter each request; fix by taking the client IP from the trusted edge/proxy, not a client header"
      - "The X-Forwarded-For header name is case-sensitive, so entries are missed; fix it by normalizing the header casing first"
    answer: 2
    explanation: |
      A client-supplied X-Forwarded-For can be set to any value, so the attacker rotates it and
      each request looks like a new IP, resetting the limit. Derive the client IP from the trusted
      reverse proxy/edge (which sets the real value), never from an arbitrary request header.
    ref: "concepts.md#brute-force-and-rate-limit-bypasses"

  - id: authentication-and-mfa-065
    difficulty: advanced
    tags: [otp, rate-limit-bypass, brute-force]
    question: |
      The password login is well rate-limited, but attackers are compromising accounts by
      guessing the 6-digit OTP. What is the most likely gap?
    options:
      - "The OTP is only 6 digits, which is inherently unsafe regardless of any rate limiting or lockout controls applied"
      - "The OTP verification step itself is not throttled per account, so ~1-in-10^6 guessing over many attempts succeeds"
      - "The OTP shared secret is stored as a bcrypt hash, which slows each verification enough to enable guessing"
      - "The TOTP acceptance drift is misconfigured to zero steps, which blocks valid codes and forces insecure retries"
    answer: 1
    explanation: |
      Rate limits often protect the password step but not the OTP verification step. Without
      per-account throttling there, an attacker brute-forces the 1-in-10^6 code. RFC 4226 caps
      attempts and NIST SP 800-63B caps at <=100 consecutive failures per authenticator.
    ref: "concepts.md#brute-force-and-rate-limit-bypasses"

  - id: authentication-and-mfa-066
    difficulty: expert
    tags: [password-reset, host-header-injection]
    question: |
      Victims report reset emails whose link points to attacker.com/reset?token=... How is
      this happening and what is the correct fix?
    options:
      - "The outbound mail server itself is compromised and rewriting links; fix it by rotating the SMTP relay credentials"
      - "The reset token is being encrypted with the attacker's key; fix it by issuing a longer, higher-entropy token value"
      - "DNS for the mail domain was hijacked to redirect links; fix it by enabling DNSSEC signing on that mail domain"
      - "Password-reset poisoning: the app builds the link from the request Host / X-Forwarded-Host header, which the attacker controls; fix by using a server-configured canonical base URL"
    answer: 3
    explanation: |
      When the reset link is constructed from a request header (Host/X-Forwarded-Host), an
      attacker requesting a reset for the victim sets it to attacker.com; the victim's email
      link then leaks the token when clicked. Build links from a trusted, server-configured
      canonical URL, never from the incoming request header.
    ref: "concepts.md#password-reset-and-forgot-password-flow-attacks"

  - id: authentication-and-mfa-067
    difficulty: advanced
    tags: [password-reset, access-control]
    question: |
      A reset-completion POST includes both the reset token and a userId field, and the server
      resets the password for the submitted userId. What is the flaw?
    options:
      - "A CSRF flaw, because the reset token travels in the POST body instead of a header, letting a forged form submit it"
      - "An access-control flaw: the token is not bound to the account server-side, so an attacker changes userId to reset anyone's password"
      - "A timing side-channel in the token comparison that leaks the valid token byte by byte to an attacker"
      - "No flaw at all; passing the userId alongside the token is a required part of a correct password-reset design"
    answer: 1
    explanation: |
      The token must be bound to one account server-side; trusting a client-supplied userId lets
      an attacker with a valid token for their own account reset an arbitrary victim's password.
      Never trust a client-provided identity in the reset flow — resolve the account from the token.
    ref: "concepts.md#password-reset-and-forgot-password-flow-attacks"

  - id: authentication-and-mfa-068
    difficulty: intermediate
    tags: [password-reset, token-lifecycle]
    question: |
      Which set of properties describes a correctly designed password-reset token?
    options:
      - "Low-entropy but long-lived, kept valid for days so users have plenty of time to click through the reset link"
      - "Deterministically derived from the user ID so a support agent can regenerate the same token on demand"
      - "Reusable any number of times within a 24-hour window so users can retry the reset if the first attempt fails"
      - "High-entropy, single-use, short-TTL, hashed at rest, and invalidated on use/expiry/new request"
    answer: 3
    explanation: |
      Reset tokens should be high-entropy (unguessable), single-use, short-lived, stored hashed,
      and invalidated after use, on expiry, when a new reset is requested, and after the password
      changes. Reusable or predictable tokens enable takeover.
    ref: "concepts.md#password-reset-and-forgot-password-flow-attacks"

  - id: authentication-and-mfa-069
    difficulty: advanced
    tags: [magic-link, passwordless, delivery]
    question: |
      Users report that magic-link logins sometimes fail with "link already used" even though
      they clicked it first. What is the likely cause?
    options:
      - "The link's time-to-live is set too long, so it expires and reports as used before the recipient can click it"
      - "The user's device clock is skewed, causing the server to treat the still-valid link as already consumed"
      - "A mail-scanner / AV that prefetches URLs clicks the single-use link first, consuming it before the user"
      - "The magic link was signed with the wrong server key, so verification fails and reports it as already used"
    answer: 2
    explanation: |
      Security appliances and mail scanners often prefetch links to check safety, which consumes
      a single-use magic link before the human clicks. Mitigations include requiring an explicit
      POST/confirmation step, session-binding the link, and not consuming on GET prefetch.
    ref: "concepts.md#password-reset-and-forgot-password-flow-attacks"

  - id: authentication-and-mfa-070
    difficulty: expert
    tags: [webauthn, user-verification, user-presence]
    question: |
      What is the difference between User Presence (UP) and User Verification (UV) in WebAuthn,
      and why does UV make a passkey "MFA in one tap"?
    options:
      - "UP is a biometric scan and UV is just a physical touch; because UV only proves possession, a UV assertion is single-factor"
      - "UP and UV are two interchangeable names for the exact same authenticatorData flag set on every assertion"
      - "UV works by transmitting the enrolled biometric template to the relying party so it can run a second-factor match server-side"
      - "UP proves someone is physically present (a touch); UV proves who via a local biometric/PIN, so a UV assertion combines possession (the key) with inherence/knowledge — two factor categories in one gesture"
    answer: 3
    explanation: |
      UP = presence (a touch); UV = who, verified locally by biometric/PIN. When UV is satisfied,
      one gesture supplies possession plus inherence/knowledge — effectively MFA. The RP requests
      userVerification and must check the UV flag in authenticatorData; the biometric never leaves
      the device.
    ref: "concepts.md#fido2-architecture-ctap2-up-vs-uv-and-webauthn-hardening"

  - id: authentication-and-mfa-071
    difficulty: advanced
    tags: [webauthn, registration, exclude-credentials]
    question: |
      During WebAuthn registration, what does the excludeCredentials parameter accomplish?
    options:
      - "It provides the user's already-registered credential IDs so the authenticator refuses to create a duplicate credential on a key already enrolled for that account"
      - "It lists the set of web origins on which the newly created credential is forbidden from ever being used"
      - "It tells the authenticator which weak attestation statement formats the relying party will refuse to accept"
      - "It marks the generated private key as non-exportable so it can never be copied off the authenticator device"
    answer: 0
    explanation: |
      excludeCredentials passes the account's existing credential IDs; if the presented
      authenticator already holds one, it declines to create a second, preventing duplicate/
      re-enrollment on the same key and the confusing UX that follows.
    ref: "concepts.md#fido2-architecture-ctap2-up-vs-uv-and-webauthn-hardening"

  - id: authentication-and-mfa-072
    difficulty: expert
    tags: [webauthn, signcount, clone-detection]
    question: |
      A WebAuthn assertion returns a signCount lower than the value the RP stored for that
      credential. What does this indicate, and what is the important caveat?
    options:
      - "A possible cloned authenticator — flag/step-up/lock — but note many platform authenticators and synced passkeys always return 0, so clone detection is best-effort"
      - "The user's authenticator clock drifted out of sync; the RP should simply ignore the lower value and continue"
      - "The credential's private key reached its expiry and must be re-registered from scratch before the next login"
      - "The RP originally stored the counter incorrectly; it should silently overwrite it with the new lower value and move on"
    answer: 0
    explanation: |
      A monotonic counter going backward suggests a cloned authenticator in use, so the RP should
      flag/step-up/lock. However, many platform authenticators and synced passkeys always report
      signCount=0, so it is a best-effort signal, not a guarantee.
    ref: "concepts.md#fido2-architecture-ctap2-up-vs-uv-and-webauthn-hardening"

  - id: authentication-and-mfa-073
    difficulty: advanced
    tags: [fido2, ctap2, webauthn]
    question: |
      In FIDO2, what is the role split between WebAuthn and CTAP2?
    options:
      - "WebAuthn is the browser/RP JS API; CTAP2 is the protocol between the client and a roaming authenticator over USB/NFC/BLE"
      - "WebAuthn secures the transport channel to the RP; CTAP2 is the vault protocol that stores account passwords on the security key"
      - "CTAP2 is the browser-facing JavaScript API for relying parties; WebAuthn is the low-level USB/NFC protocol to the security key"
      - "Both are the same underlying protocol published under two names, differing only in version numbers and transport bindings"
    answer: 0
    explanation: |
      WebAuthn (W3C) is the JS API between browser and relying party; CTAP2 (FIDO2) is how the
      client communicates with an external roaming authenticator over USB/NFC/BLE. Hybrid transport
      (caBLE) lets a phone act as an authenticator for a nearby computer.
    ref: "concepts.md#fido2-architecture-ctap2-up-vs-uv-and-webauthn-hardening"

  - id: authentication-and-mfa-074
    difficulty: expert
    tags: [nist, aal3, passkeys, 800-63-4]
    question: |
      Per NIST SP 800-63B-4 (2025), why can a synced (cloud-backed) passkey NOT satisfy AAL3?
    options:
      - "AAL3 forbids public-key cryptography entirely and mandates symmetric HMAC-based authenticators, which passkeys cannot provide"
      - "Synced passkeys are not phishing-resistant, so any credential that binds to an origin/RP ID is automatically disqualified from AAL3"
      - "AAL3 requires a non-exportable private key in a hardware-protected environment, and syncable authenticators use exportable keys, so they SHALL NOT be used at AAL3"
      - "AAL3 mandates an SMS or voice one-time code as a fallback recovery factor, which passkey-only enrollments structurally lack"
    answer: 2
    explanation: |
      800-63B-4 requires a non-exportable private key for AAL3. Because syncable authenticators
      necessarily allow the key to be exported/copied across the cloud fabric, they SHALL NOT be
      used at AAL3 — only device-bound authenticators (security keys, PIV) qualify. Passkeys ARE
      phishing-resistant; exportability is the AAL3 blocker.
    ref: "concepts.md#nist-sp-800-63-4-updates-finalized-2025"

  - id: authentication-and-mfa-075
    difficulty: advanced
    tags: [nist, passwords, 800-63-4]
    question: |
      Which password policy is consistent with NIST SP 800-63B-4?
    options:
      - "Mandate composition rules (>=1 uppercase, digit, and symbol), forced rotation every 90 days, and a 12-character maximum length ceiling"
      - "Disallow password managers and clipboard paste on the login field to prevent shoulder-surfing, and expire any password after five reuses"
      - "Require security questions as a mandatory second knowledge factor and store the answers reversibly so support agents can verify callers"
      - "Allow >=64 chars, no composition rules, no periodic rotation (change only on compromise), and blocklist-check against compromised-password lists"
    answer: 3
    explanation: |
      800-63B-4 mandates minimum lengths (8 in MFA, 15 single-factor), allowing >=64, NO
      composition rules, NO periodic rotation (rotate only on evidence of compromise), blocklist
      checks, allowing paste/managers, and prohibits hints and knowledge-based security questions.
    ref: "concepts.md#nist-sp-800-63-4-updates-finalized-2025"

  - id: authentication-and-mfa-076
    difficulty: expert
    tags: [nist, aal3, session, reauth, 800-63-4]
    question: |
      Under NIST SP 800-63B-4, what is the maximum overall AAL3 session lifetime before
      reauthentication is required?
    options:
      - "30 days overall, with an inactivity timeout of about 24 hours before a fresh factor is required"
      - "24 hours overall (with an inactivity timeout of ~1 hour), and reauth may use a single factor"
      - "12 hours (with an inactivity timeout of ~15 minutes), and reauth must use the full authentication"
      - "There is no fixed limit as long as the session remains bound to a hardware key presented at login"
    answer: 2
    explanation: |
      800-63B-4 sets AAL3 overall reauthentication at no more than 12 hours and inactivity at
      about 15 minutes, with reauth matching the initial (full) authentication. AAL2 is more
      lenient: ~24 hours overall and ~1 hour inactivity.
    ref: "concepts.md#nist-sp-800-63-4-updates-finalized-2025"

  - id: authentication-and-mfa-077
    difficulty: expert
    tags: [webauthn, credprotect, discoverable-credentials]
    question: |
      What does the WebAuthn credProtect extension control for a discoverable (resident)
      credential?
    options:
      - "Whether the credential's private key is stored encrypted at rest inside the authenticator's secure element versus in cleartext flash"
      - "Whether the credential can be used/enumerated without user verification (e.g., userVerificationRequired forbids silent use without UV)"
      - "How many distinct relying parties are permitted to share and reuse the same discoverable credential across their origins"
      - "The maximum signature counter value the credential may reach before the authenticator automatically retires and deletes it"
    answer: 1
    explanation: |
      credProtect policy (userVerificationOptional / ...OptionalWithCredentialIDList /
      userVerificationRequired) governs whether a discoverable credential can be silently used or
      enumerated without UV. Discoverable creds enable usernameless login but consume limited
      on-authenticator storage.
    ref: "concepts.md#fido2-architecture-ctap2-up-vs-uv-and-webauthn-hardening"

  - id: authentication-and-mfa-078
    difficulty: advanced
    tags: [oidc, step-up, re-auth]
    question: |
      In OpenID Connect, which parameters/claims implement step-up authentication for a
      high-risk action within an existing session?
    options:
      - "scope and state on the authorization request, then re-checking the iss and aud claims returned inside the ID token"
      - "response_type=code together with a PKCE code_verifier and code_challenge pair exchanged during the token request"
      - "acr_values / max_age / prompt=login on the request, then verifying the returned acr/amr and auth_time"
      - "The nonce request parameter and the at_hash token claim, verified together to confirm the freshness of the sign-in"
    answer: 2
    explanation: |
      Step-up is driven by acr_values (requested assurance/context), max_age (max age of prior
      authentication), and prompt=login (force fresh auth). The RP then verifies the returned acr
      (assurance), amr (methods used), and auth_time to confirm recency and strength before the
      sensitive action.
    ref: "concepts.md#step-up-and-adaptive-authentication"
