topic: OWASP Top 10 & API Security Top 10 Walkthrough
domain: security
topic_slug: owasp-top-10-walkthrough
version: 1
questions:
- id: owasp-top-10-walkthrough-001
  difficulty: beginner
  tags:
  - methodology
  - fundamentals
  question: |
    What is the OWASP Top 10 best described as?
  options:
  - An awareness document ranking the most critical categories of web application security risk
  - A legally binding compliance standard applications must certify against
  - A code-scanning tool that automatically finds the ten worst bugs
  - A firewall ruleset that blocks the ten most common attacks
  answer: 0
  explanation: |
    The OWASP Top 10 is an awareness document — a prioritized list of the most critical
    web application security risk categories. It is not a standard you certify against
    (use OWASP ASVS for verifiable requirements), not a tool, and not a WAF ruleset.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-002
  difficulty: beginner
  tags:
  - a01
  - ranking
  question: |
    Which category holds the #1 position in the OWASP Top 10 2021?
  options:
  - Injection
  - Broken Authentication
  - Cryptographic Failures
  - Broken Access Control
  answer: 3
  explanation: |
    A01:2021 Broken Access Control moved up from #5 in 2017 to #1 in 2021. It was found
    in ~94% of tested applications and maps the most CWE instances of any category.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-003
  difficulty: intermediate
  tags:
  - methodology
  - data-vs-survey
  question: |
    In the OWASP Top 10 2021, how are the categories selected?
  options:
  - All ten are chosen purely by a community survey of practitioners
  - All ten are derived purely from contributed vulnerability data
  - Eight come from contributed data and two are chosen by a community survey
  - They are copied unchanged from the CVE database each year
  answer: 2
  explanation: |
    Eight of the ten categories are derived from contributed vulnerability data
    (incidence rates across many applications), and two slots are chosen by an industry
    survey to capture risks that are hard to detect automatically. In 2021 the two
    survey-selected categories were A04 Insecure Design and A10 SSRF.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-004
  difficulty: intermediate
  tags:
  - methodology
  - incidence-rate
  question: |
    Why does the OWASP Top 10 rank data-driven categories by "incidence rate" (the
    percentage of applications containing at least one instance of a CWE) rather than by
    the raw count of findings?
  options:
  - Raw counts are impossible to compute from contributed data
  - Raw counts are biased by tools that report huge numbers of a single easy-to-find bug
  - Incidence rate is required by ISO 27001
  - Incidence rate always produces the same ranking as raw counts
  answer: 1
  explanation: |
    Incidence rate (per-application prevalence) reduces bias from automated tools that
    report enormous counts of one easy-to-detect issue, giving a fairer view of how
    widespread a category truly is across applications.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-005
  difficulty: intermediate
  tags:
  - a03
  - xss
  - merges
  question: |
    In the 2021 edition, where did Cross-Site Scripting (XSS) end up?
  options:
  - It became its own standalone category, A03
  - It was merged into A05 Security Misconfiguration
  - It was removed from the Top 10 entirely
  - It was merged into A03 Injection
  answer: 3
  explanation: |
    XSS was merged into A03 Injection in 2021, because XSS is injection into the
    browser's HTML/JS interpreter and shares the same code-vs-data root cause.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-006
  difficulty: intermediate
  tags:
  - a05
  - xxe
  - merges
  question: |
    In 2017 "XML External Entities (XXE)" was its own category. Where did it go in 2021?
  options:
  - Merged into A05 Security Misconfiguration
  - Merged into A03 Injection
  - Merged into A08 Software and Data Integrity Failures
  - Promoted to A01
  answer: 0
  explanation: |
    XXE merged into A05 Security Misconfiguration in 2021, because it stems from an XML
    parser configured (often by default) to resolve external entities.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-007
  difficulty: intermediate
  tags:
  - a08
  - deserialization
  - merges
  question: |
    "Insecure Deserialization" was a standalone 2017 category (#8). In the 2021 edition
    it is part of which category?
  options:
  - A03 Injection
  - A06 Vulnerable and Outdated Components
  - A08 Software and Data Integrity Failures
  - A10 Server-Side Request Forgery
  answer: 2
  explanation: |
    Insecure deserialization is subsumed under A08 Software and Data Integrity Failures
    in 2021, which broadens the theme to integrity of code, updates, and CI/CD pipelines.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-008
  difficulty: beginner
  tags:
  - a04
  - a10
  - new-categories
  question: |
    Which two categories were newly introduced in the OWASP Top 10 2021?
  options:
  - Injection and Broken Access Control
  - Insecure Design and Server-Side Request Forgery (SSRF)
  - Cryptographic Failures and Security Misconfiguration
  - Broken Authentication and Sensitive Data Exposure
  answer: 1
  explanation: |
    A04 Insecure Design and A10 SSRF were both new in 2021 (both were survey-selected).
    Cryptographic Failures is a rename of Sensitive Data Exposure, not a new category.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-009
  difficulty: beginner
  tags:
  - a01
  - idor
  - bola
  question: |
    A user sends `GET /api/invoices/1002` with their own valid token and receives
    another customer's invoice, simply by changing the ID in the URL. What is this?
  options:
  - Insecure Direct Object Reference (IDOR) / Broken Object Level Authorization
  - Cross-site request forgery (CSRF)
  - SQL injection
  - Security misconfiguration
  answer: 0
  explanation: |
    This is IDOR (called BOLA in API terms), a form of Broken Access Control (A01). The
    server looks up the object by the supplied ID but never verifies that the object
    belongs to the authenticated caller.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-010
  difficulty: intermediate
  tags:
  - a01
  - idor
  - defense
  question: |
    A team "fixes" IDOR by replacing sequential integer IDs with random UUIDs. Why is
    this insufficient on its own?
  options:
  - UUIDs are slower to look up, causing a denial of service
  - UUIDs cannot be used as database primary keys
  - It fully fixes the problem; no further work is needed
  - It only makes enumeration harder; without a per-request ownership check, a leaked or shared ID still exposes the object
  answer: 3
  explanation: |
    Unguessable identifiers are defense in depth, not a fix. The real defense is a
    server-side authorization check that the authenticated principal owns / may access
    the requested object. A leaked, logged, or shared UUID would still be served.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-011
  difficulty: intermediate
  tags:
  - a01
  - defense
  - deny-by-default
  question: |
    Which principle is the foundation of correct access control per A01?
  options:
  - Allow by default, then block known-bad requests
  - Trust the role claim sent by the client
  - Deny by default; grant access only when explicitly authorized, enforced server-side on every request
  - Hide sensitive endpoints from the navigation menu
  answer: 2
  explanation: |
    Access control should deny by default and be enforced server-side on every request
    based on the authenticated identity — never on client-supplied role/ID values, and
    not by merely hiding links (that is forced-browsing bait).
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-012
  difficulty: intermediate
  tags:
  - a02
  - rename
  question: |
    A02:2021 Cryptographic Failures was formerly known by what 2017 name, and why was it
    renamed?
  options:
  - '''Broken Authentication''; renamed to broaden its scope to sessions'
  - '''Sensitive Data Exposure''; renamed to describe the root cause (bad/missing crypto) rather than the symptom'
  - '''Security Misconfiguration''; renamed for clarity'
  - It is a brand-new 2021 category with no predecessor
  answer: 1
  explanation: |
    It was "Sensitive Data Exposure" in 2017. The 2021 rename shifts focus from the
    symptom (data exposed) to the root cause (cryptography done wrong or omitted).
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-013
  difficulty: intermediate
  tags:
  - a02
  - password-hashing
  question: |
    A developer stores user passwords as a single unsalted SHA-256 hash. Under A02 this
    is a cryptographic failure primarily because:
  options:
  - SHA-256 is a fast general-purpose hash; passwords need a slow, salted KDF like Argon2id, bcrypt, scrypt, or PBKDF2
  - SHA-256 output is too short to be secure
  - SHA-256 is a broken algorithm like MD5
  - Hashing passwords is unnecessary if the database is encrypted
  answer: 0
  explanation: |
    SHA-256 is fast, so attackers can test billions of guesses per second against stolen
    hashes. Password storage requires a deliberately slow, salted password-hashing
    function (Argon2id/bcrypt/scrypt/PBKDF2). SHA-256 itself is not broken, but it is the
    wrong tool for passwords.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-014
  difficulty: advanced
  tags:
  - a02
  - algorithms
  - weak-crypto
  question: |
    Which combination best reflects current A02 guidance on cryptographic primitives?
  options:
  - Use MD5 for integrity, DES for encryption, and store the key in the source repo
  - Use AES in ECB mode because it is a NIST-approved cipher
  - Use SHA-1 for signatures because it is faster than SHA-256
  - Use AEAD (AES-GCM or ChaCha20-Poly1305) for confidentiality+integrity, avoid MD5/SHA-1 and ECB mode, and manage keys in a KMS/HSM
  answer: 3
  explanation: |
    Prefer authenticated encryption (AES-GCM / ChaCha20-Poly1305). Avoid MD5 and SHA-1
    (both broken for collision resistance) and ECB mode (leaks plaintext structure).
    Keys should be managed properly (rotation, KMS/HSM), never checked into source.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-015
  difficulty: intermediate
  tags:
  - a02
  - ecb
  question: |
    Why is AES in ECB mode considered a cryptographic failure for structured data?
  options:
  - ECB is not a real cipher mode
  - ECB requires a nonce that is always reused
  - Identical plaintext blocks encrypt to identical ciphertext blocks, leaking patterns/structure of the data
  - ECB uses a 40-bit key by law
  answer: 2
  explanation: |
    ECB encrypts each block independently, so equal plaintext blocks yield equal
    ciphertext blocks. This leaks structure (the classic "ECB penguin" image) and
    provides no integrity. Use an AEAD mode instead.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-016
  difficulty: beginner
  tags:
  - a03
  - sql-injection
  - defense
  question: |
    What is the primary defense against SQL injection?
  options:
  - Escaping every single quote in user input
  - Parameterized queries / prepared statements that separate query structure from data
  - A web application firewall (WAF)
  - Renaming database tables to non-obvious names
  answer: 1
  explanation: |
    Parameterized queries bind user data out-of-band so it is never parsed as part of
    the SQL text. Escaping, WAFs, and obscurity are at best defense in depth, not the
    primary fix.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-017
  difficulty: intermediate
  tags:
  - a03
  - injection
  - root-cause
  question: |
    What is the common root cause across SQL, OS command, LDAP, and XSS injection?
  options:
  - Weak passwords
  - Missing TLS on the connection
  - Outdated third-party libraries
  - Untrusted data crosses from a data context into a code/structure context of an interpreter
  answer: 3
  explanation: |
    All injection stems from failing to keep code separate from data: untrusted input is
    interpreted as code/structure by some interpreter (SQL engine, shell, LDAP, or the
    browser's HTML/JS parser for XSS).
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-018
  difficulty: intermediate
  tags:
  - a03
  - command-injection
  question: |
    To avoid OS command injection when a program must run an external command with
    user-supplied arguments, the safest approach is to:
  options:
  - Pass the command and its arguments as a separate argument array, avoiding a shell interpreter
  - Build a single shell string and escape spaces
  - Base64-encode the user input before concatenating it
  - Run the command as root so it always succeeds
  answer: 0
  explanation: |
    Invoking the executable directly with an argument array (no shell) prevents shell
    metacharacters (;, |, &&, backticks) from being interpreted, eliminating the
    injection surface that string concatenation creates.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-019
  difficulty: intermediate
  tags:
  - a04
  - insecure-design
  - threat-modeling
  question: |
    A04 Insecure Design is best distinguished from an implementation bug because:
  options:
  - It only affects mobile applications
  - It is always caused by an outdated dependency
  - It represents a missing or flawed security control by design that cannot be fixed by writing more careful code
  - It only occurs in the database layer
  answer: 2
  explanation: |
    Insecure Design means a needed control was never designed in. You cannot patch your
    way out of it — the design must change. This contrasts with implementation defects
    where the control exists but is coded wrong.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-020
  difficulty: intermediate
  tags:
  - a04
  - threat-modeling
  - defense
  question: |
    Which practice is the headline defense for A04 Insecure Design?
  options:
  - Running a dependency scanner in CI
  - Threat modeling and secure design patterns / abuse cases during design
  - Adding a WAF in front of production
  - Rotating passwords every 30 days
  answer: 1
  explanation: |
    Insecure Design is countered by building security in early: threat modeling (e.g.
    STRIDE), secure design patterns, abuse/misuse cases, and security requirements as
    first-class acceptance criteria.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-021
  difficulty: advanced
  tags:
  - a04
  - a05
  - distinction
  question: |
    An online shop lets a single account reserve unlimited concert seats indefinitely
    with no quantity or time limit, enabling scalper bots to lock out real buyers. No
    setting is misconfigured — the limit simply was never designed. Which category fits
    best?
  options:
  - A04 Insecure Design
  - A05 Security Misconfiguration
  - A06 Vulnerable and Outdated Components
  - A02 Cryptographic Failures
  answer: 0
  explanation: |
    This is a business-logic / anti-automation flaw that was never designed in — A04
    Insecure Design. A05 would apply if a control existed but was deployed with insecure
    settings; here the control is simply absent by design.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-022
  difficulty: beginner
  tags:
  - a05
  - misconfiguration
  question: |
    Which of the following is a classic example of A05 Security Misconfiguration?
  options:
  - A password stored with Argon2id
  - A parameterized SQL query
  - A short-lived, sender-constrained access token
  - Default admin credentials (admin/admin) left enabled and verbose stack traces returned to users
  answer: 3
  explanation: |
    Default credentials, unnecessary enabled features, directory listing, and verbose
    error/stack-trace disclosure are hallmark A05 misconfigurations. The other options
    are secure practices.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-023
  difficulty: intermediate
  tags:
  - a05
  - xxe
  - defense
  question: |
    Given this XML being parsed by a server:
    `<!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]><foo>&xxe;</foo>`,
    what is the primary defense against this XXE attack?
  options:
  - Rename /etc/passwd on the server
  - Base64-encode the XML before parsing
  - Disable DTD processing / external entity resolution in the XML parser
  - Add a WAF rule blocking the word 'passwd'
  answer: 2
  explanation: |
    XXE is defeated by disabling DTDs and external entity resolution in the XML parser
    (or using a simpler format like JSON). Blocklists and file renames are brittle and
    easily bypassed.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-024
  difficulty: intermediate
  tags:
  - a05
  - hardening
  - defense
  question: |
    Which approach best addresses the systemic cause of Security Misconfiguration across
    environments?
  options:
  - Manually hardening each server the night before launch
  - A repeatable, automated hardening process (e.g. infrastructure-as-code, hardened base images) applied identically to every environment
  - Allowing all origins in CORS so nothing breaks
  - Turning on directory listing for easier debugging
  answer: 1
  explanation: |
    Misconfiguration recurs when environments drift. A repeatable, automated hardening
    process ensures dev/test/prod are configured identically and minimally, and can be
    verified in review.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-025
  difficulty: beginner
  tags:
  - a06
  - components
  question: |
    A06:2021 Vulnerable and Outdated Components is primarily about:
  options:
  - Using libraries, frameworks, runtimes, or containers with known vulnerabilities or that are unsupported
  - Writing insecure code in your own application
  - Misconfiguring the web server
  - Failing to log security events
  answer: 0
  explanation: |
    A06 concerns the security posture inherited from third-party components (including
    transitive dependencies) that are known-vulnerable or out of support.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-026
  difficulty: intermediate
  tags:
  - a06
  - log4shell
  - examples
  question: |
    Log4Shell (CVE-2021-44228) is a canonical A06 example. What made it so dangerous?
  options:
  - It required physical access to the server
  - It only affected a single vendor's proprietary product
  - It was a misconfiguration that only occurred with default passwords
  - A JNDI lookup RCE triggered by logging attacker-controlled text, affecting countless apps through transitive Log4j dependencies
  answer: 3
  explanation: |
    Log4Shell was a remote-code-execution flaw in Log4j 2 triggered when the library
    logged a string like ${jndi:ldap://...}. Because Log4j was a ubiquitous transitive
    dependency, a vast number of applications were exposed.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-027
  difficulty: intermediate
  tags:
  - a06
  - sbom
  - sca
  - defense
  question: |
    Which practice most directly defends against A06 and is NOT achievable by
    pen-testing your own code alone?
  options:
  - Rewriting all third-party code from scratch
  - Increasing the session timeout
  - Maintaining an SBOM and running Software Composition Analysis (SCA) against CVE/advisory feeds in CI
  - Enabling verbose error messages
  answer: 2
  explanation: |
    Because vulnerabilities live in (often transitive) dependencies, you need an
    inventory/SBOM plus SCA tooling that matches your components against known-CVE feeds,
    wired into CI, plus prompt patching. Testing your own code won't surface these.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-028
  difficulty: beginner
  tags:
  - a07
  - authentication
  - rename
  question: |
    A07:2021 Identification and Authentication Failures was called what in 2017?
  options:
  - Sensitive Data Exposure
  - Broken Authentication
  - Security Misconfiguration
  - Insufficient Logging & Monitoring
  answer: 1
  explanation: |
    It was "Broken Authentication" (2017 #2). It was renamed and moved down to #7,
    partly because standard frameworks now handle authentication more reliably.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-029
  difficulty: intermediate
  tags:
  - a07
  - credential-stuffing
  question: |
    Attackers replay millions of username/password pairs leaked from other breaches
    against your login endpoint. What is this attack, and what best mitigates it?
  options:
  - Session fixation; mitigated by longer cookies
  - SQL injection; mitigated by ECB encryption
  - SSRF; mitigated by disabling XML entities
  - Credential stuffing; mitigated by rate limiting/throttling, MFA, and checking against breached-password lists
  answer: 3
  explanation: |
    Credential stuffing exploits password reuse. Defenses include throttling/lockout,
    MFA, and screening passwords against known-breached lists (per NIST SP 800-63B),
    plus monitoring for stuffing patterns.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-030
  difficulty: intermediate
  tags:
  - a07
  - session-fixation
  question: |
    Under A07, which is the correct way to prevent session fixation?
  options:
  - Generate a new, high-entropy session ID server-side immediately after successful authentication
  - Reuse the same session ID before and after login for consistency
  - Put the session ID in the URL so it can be bookmarked
  - Store the session ID in localStorage
  answer: 0
  explanation: |
    Rotating (regenerating) the session identifier at login prevents an attacker who
    planted a known session ID from riding the authenticated session. Session IDs should
    also be kept out of URLs and stored in Secure/HttpOnly cookies.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-031
  difficulty: advanced
  tags:
  - a07
  - nist-800-63b
  - passwords
  question: |
    Per NIST SP 800-63B, which password policy is now recommended?
  options:
  - Force password changes every 30 days and require special characters
  - Require exactly 8 characters with at least one uppercase, one digit, and one symbol
  - Allow long passphrases, check against breached-password lists, and do NOT force periodic rotation or arbitrary composition rules
  - Provide password hints to help users remember
  answer: 2
  explanation: |
    NIST SP 800-63B recommends supporting long passphrases, screening against breached
    lists, and dropping forced periodic rotation, composition rules, and password hints
    (which harm usability without improving security).
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-032
  difficulty: intermediate
  tags:
  - a08
  - integrity
  - new-category
  question: |
    A08:2021 Software and Data Integrity Failures centers on which theme?
  options:
  - Encrypting data at rest
  - Trusting code, updates, plugins, or CI/CD pipelines without verifying they have not been tampered with
  - Rate limiting login attempts
  - Rendering user input in HTML
  answer: 1
  explanation: |
    A08 is about integrity: relying on software, data, updates, or build/deploy
    pipelines without verifying their integrity (e.g. via signatures). Insecure
    deserialization is one instance folded into this category.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-033
  difficulty: advanced
  tags:
  - a08
  - deserialization
  - defense
  question: |
    An application accepts a serialized object from the client and deserializes it into
    native objects, enabling a gadget-chain RCE. What is the correct primary defense?
  options:
  - Do not deserialize untrusted data into complex objects; prefer data-only formats and, if unavoidable, enforce type allowlists / integrity checks
  - Base64-decode the object before deserializing it
  - Compress the serialized blob to make gadget chains impossible
  - Run the deserializer in a faster runtime
  answer: 0
  explanation: |
    The fix is to avoid deserializing untrusted input into rich object graphs. Use
    data-only formats (e.g. JSON) with strict schemas; if native deserialization is
    unavoidable, restrict to allowlisted types and verify integrity first. Sanitizing
    the blob does not work.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-034
  difficulty: advanced
  tags:
  - a08
  - supply-chain
  - solarwinds
  question: |
    The SolarWinds SUNBURST incident is often cited under A08 because:
  options:
  - A user chose a weak password on an admin panel
  - An unpatched Log4j library allowed remote code execution
  - A public S3 bucket exposed customer data
  - The CI/CD build pipeline was compromised so signed, 'trusted' updates carried a backdoor to thousands of customers
  answer: 3
  explanation: |
    SolarWinds was a software-integrity / supply-chain failure: malicious code was
    inserted into the build pipeline, so legitimately signed Orion updates distributed a
    backdoor. Defense includes pipeline hardening, artifact signing, and dependency
    verification.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-035
  difficulty: beginner
  tags:
  - a09
  - logging-monitoring
  question: |
    A09:2021 Security Logging and Monitoring Failures is fundamentally about:
  options:
  - Preventing attacks before they happen
  - Encrypting logs at rest only
  - Detecting, alerting on, and responding to breaches — without it, incidents go unnoticed for a long time
  - Compressing logs to save disk space
  answer: 2
  explanation: |
    A09 is a detection-and-response category. Insufficient logging, monitoring, and
    alerting lets attackers dwell undetected; historically breaches took hundreds of
    days to detect, often by outsiders.
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-036
  difficulty: intermediate
  tags:
  - a09
  - secrets-in-logs
  - gotcha
  question: |
    Which statement about A09 logging practices is correct?
  options:
  - Log passwords and full session tokens so investigations are easier
  - Log security-relevant events off-box to a tamper-resistant store, but never log secrets/PII and encode untrusted values to prevent log injection
  - Keep logs only on the compromised host to reduce network traffic
  - Disable logging in production to improve performance
  answer: 1
  explanation: |
    Log the right events (auth, access-control failures, high-value actions) and ship
    them to a central, tamper-resistant SIEM with alerting — but never log credentials,
    tokens, or PII, and sanitize/encode logged input to prevent log forging (CRLF
    injection).
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-037
  difficulty: beginner
  tags:
  - a10
  - ssrf
  - definition
  question: |
    What defines a Server-Side Request Forgery (SSRF) vulnerability (A10)?
  options:
  - The application fetches a user-supplied/influenced URL without validating the destination, letting the server reach targets the attacker couldn't
  - The browser is tricked into submitting a form to another site
  - The database executes attacker SQL
  - The user's session cookie is stolen via script
  answer: 0
  explanation: |
    SSRF is when the server-side app fetches a URL that the attacker controls or
    influences, without validating it, allowing requests to internal services, cloud
    metadata endpoints, or localhost that the attacker could not otherwise reach.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-038
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - cloud-metadata
  question: |
    A "fetch image from URL" feature is abused with
    `http://169.254.169.254/latest/meta-data/iam/security-credentials/role`. What is the
    danger and a key mitigation?
  options:
  - It causes XSS; mitigate with output encoding
  - It downloads a huge file; mitigate by compressing responses
  - It leaks the TLS private key; mitigate by rotating certificates
  - It reaches the cloud metadata endpoint to steal temporary IAM credentials; mitigate by blocking the metadata IP/internal ranges, allowlisting destinations, and requiring IMDSv2
  answer: 3
  explanation: |
    This SSRF targets the instance metadata service (169.254.169.254) to exfiltrate
    temporary IAM credentials (as in the Capital One breach). Mitigations: allowlist
    allowed destinations, block link-local/internal ranges, egress segmentation, and
    require IMDSv2.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-039
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - dns-rebinding
  - defense
  question: |
    Why is validating only the hostname of a user-supplied URL insufficient to stop
    SSRF, and what addresses the gap?
  options:
  - Hostnames are case-sensitive; lowercase them first
  - Hostnames cannot contain internal IP addresses
  - DNS rebinding / TOCTOU lets the resolved IP change between check and connect, so you must validate the resolved IP at connection time
  - The gap is closed simply by using HTTPS
  answer: 2
  explanation: |
    An allowlisted hostname can resolve to an internal IP at connection time (DNS
    rebinding / time-of-check-to-time-of-use). Robust SSRF defense validates the actual
    resolved IP when the connection is made, and re-validates after any redirect.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-040
  difficulty: intermediate
  tags:
  - api-top-10
  - bola
  - reference
  question: |
    What is the #1 risk in the OWASP API Security Top 10 2023?
  options:
  - Security Misconfiguration
  - Broken Object Level Authorization (BOLA)
  - SQL Injection
  - Insufficient Logging
  answer: 1
  explanation: |
    API1:2023 Broken Object Level Authorization (BOLA) tops the API list — the same
    object-ownership authorization failure that dominates web A01. Authorization failures
    lead both lists.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-041
  difficulty: intermediate
  tags:
  - api-top-10
  - distinction
  - reference
  question: |
    How does the OWASP API Security Top 10 relate to the web OWASP Top 10?
  options:
  - It is an older, deprecated version of the web Top 10
  - It is a strict subset containing only three of the web categories
  - They are identical lists with different names
  - It is a separate, complementary list emphasizing object-/function-/property-level authorization, resource consumption, and API inventory
  answer: 3
  explanation: |
    The API Security Top 10 is a distinct, complementary list reflecting the API threat
    profile: fine-grained authorization (object/function/property level), resource
    consumption, and inventory (shadow/zombie APIs). Both lists put an authorization
    failure at #1.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-042
  difficulty: advanced
  tags:
  - api-top-10
  - bopla
  - reference
  question: |
    In the API Security Top 10 2023, which entry merged the 2019 categories "Excessive
    Data Exposure" and "Mass Assignment"?
  options:
  - Broken Object Property Level Authorization (BOPLA)
  - Broken Object Level Authorization (BOLA)
  - Unrestricted Resource Consumption
  - Improper Inventory Management
  answer: 0
  explanation: |
    Broken Object Property Level Authorization (BOPLA), new in 2023, consolidated
    Excessive Data Exposure and Mass Assignment — both concern authorization at the level
    of individual object properties.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-043
  difficulty: intermediate
  tags:
  - standards
  - asvs
  - methodology
  question: |
    If a stakeholder asks for a verifiable set of security requirements to test an
    application against (rather than an awareness ranking), which OWASP resource is most
    appropriate?
  options:
  - The OWASP Top 10
  - The OWASP API Security Top 10
  - The OWASP Application Security Verification Standard (ASVS)
  - The CVE database
  answer: 2
  explanation: |
    The Top 10 is an awareness document. For verifiable, level-based security
    requirements to test against, use ASVS; for testing methodology, use the WSTG.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-044
  difficulty: advanced
  tags:
  - a01
  - function-level
  - scenario
  question: |
    A regular user discovers that `POST /admin/users/promote` is not linked in the UI but
    still succeeds when they call it directly with their normal session. Which category
    and fix apply?
  options:
  - A02 Cryptographic Failures; encrypt the request body
  - A01 Broken Access Control (missing function-level authorization); enforce a server-side role/permission check on the endpoint and deny by default
  - A09 Logging Failures; add more logging
  - A06 Vulnerable Components; upgrade the framework
  answer: 1
  explanation: |
    Hiding an endpoint from the UI is not access control (forced browsing defeats it).
    This is missing function-level authorization under A01; the fix is a server-side
    permission check that denies unauthorized principals regardless of how they reach the
    endpoint.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-045
  difficulty: intermediate
  tags:
  - a02
  - transit
  - hsts
  question: |
    An application serves login over HTTPS but sends no Strict-Transport-Security header
    and still answers on plain HTTP. Under A02, why is this a cryptographic failure?
  options:
  - Without HSTS the connection can be downgraded/stripped to HTTP, exposing credentials in transit
  - HTTPS is inherently insecure without a WAF
  - The TLS certificate must be self-signed to be valid
  - HTTP is faster, so attackers won't bother
  answer: 0
  explanation: |
    Missing HSTS plus an available HTTP endpoint permits SSL-strip downgrade attacks,
    letting an on-path attacker read data (including credentials) in transit. HSTS forces
    browsers to use HTTPS and refuse downgrade.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-046
  difficulty: beginner
  tags:
  - ranking
  - changes
  - methodology
  question: |
    Which statement about changes from the 2017 to the 2021 Top 10 is correct?
  options:
  - Broken Access Control dropped out of the list
  - Cryptographic Failures is a brand-new category with no 2017 predecessor
  - Logging & Monitoring was removed
  - 'Injection moved from #1 down to #3 and absorbed XSS'
  answer: 3
  explanation: |
    Injection fell from #1 (2017) to #3 (2021) and now includes XSS. Broken Access
    Control rose to #1, Cryptographic Failures is a rename of Sensitive Data Exposure,
    and Logging & Monitoring moved up (not removed).
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-047
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - defense
  - allowlist
  question: |
    Which set of controls best mitigates SSRF in a URL-fetching feature?
  options:
  - Blocklist the word 'localhost' in the URL string
  - Follow all redirects automatically and return raw responses to the client
  - Allowlist permitted schemes/hosts/ports, block internal/link-local ranges, don't follow redirects blindly, and enforce network egress segmentation
  - Only allow HTTP (not HTTPS) so responses are easier to inspect
  answer: 2
  explanation: |
    Robust SSRF defense combines destination allowlisting (scheme/host/port), blocking
    internal and link-local ranges, controlled redirect handling, not echoing raw
    responses, and network egress segmentation so the server cannot reach internal
    targets. String blocklists are trivially bypassed.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-048
  difficulty: intermediate
  tags:
  - a03
  - xss
  - reflected
  - scenario
  question: |
    A search page reflects the `q` parameter into HTML without encoding, and
    `?q=<script>...</script>` executes in the victim's browser. Which category is this,
    and what is the primary defense?
  options:
  - A01 Broken Access Control; add an ownership check
  - A03 Injection (reflected XSS); apply context-aware output encoding and a strong Content-Security-Policy as defense in depth
  - A05 Misconfiguration; disable XML entities
  - A10 SSRF; block the metadata IP
  answer: 1
  explanation: |
    Reflecting unencoded input into HTML is reflected XSS, which lives under A03 in 2021.
    The primary fix is context-aware output encoding (and safe templating), with CSP as a
    strong secondary layer.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-049
  difficulty: intermediate
  tags:
  - api-top-10
  - ssrf
  - overlap
  - reference
  question: |
    Which risk appears on BOTH the web OWASP Top 10 2021 and the API Security Top 10?
  options:
  - Server-Side Request Forgery (SSRF)
  - XML External Entities (XXE)
  - Cross-Site Scripting (XSS) as a standalone item
  - Cryptographic Failures as a standalone item
  answer: 0
  explanation: |
    SSRF is present on both lists (A10 on the web list and as an entry on the API list).
    XXE and XSS are folded into other web categories, and the API list frames crypto
    differently.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-050
  difficulty: advanced
  tags:
  - a08
  - ci-cd
  - defense
  question: |
    Which combination best hardens a CI/CD pipeline against A08 Software and Data
    Integrity Failures?
  options:
  - Give every developer admin on the build server and skip code review to move faster
  - Disable logging in the pipeline to reduce noise
  - Pull dependencies from whatever registry responds fastest
  - Least-privilege pipeline access, mandatory code review, signed build artifacts, and verification of dependency checksums/signatures with lockfiles
  answer: 3
  explanation: |
    A08 defenses for CI/CD include least privilege, code review, artifact signing, and
    verifying dependency integrity (checksums/signatures, lockfiles) so unsigned or
    tampered code cannot be built or deployed.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-051
  difficulty: beginner
  tags:
  - a09
  - dwell-time
  question: |
    Why does A09 emphasize shipping logs off the host and alerting in near real-time?
  options:
  - To save local disk space only
  - Because logs must be encrypted with MD5
  - Because attackers can wipe local logs, and without alerting, breaches dwell undetected for long periods
  - Because logging locally violates GDPR by default
  answer: 2
  explanation: |
    Local-only logs can be tampered with or deleted by an attacker, and without alerting
    nobody notices suspicious patterns (e.g. mass failed logins). Centralized,
    tamper-resistant logging with alerting shortens detection/dwell time.
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-052
  difficulty: advanced
  tags:
  - a04
  - a05
  - distinction
  - scenario
  question: |
    Two teams describe issues: Team A shipped a product whose password-reset flow relies
    on easily-guessable security questions (the flow was designed that way); Team B left
    directory listing and default admin credentials enabled in production. Which mapping
    is correct?
  options:
  - Both are A05 Security Misconfiguration
  - Team A is A04 Insecure Design; Team B is A05 Security Misconfiguration
  - Team A is A05; Team B is A04
  - Both are A01 Broken Access Control
  answer: 1
  explanation: |
    Team A's weakness is baked into the design (a flawed control, not a wrong setting) —
    A04. Team B left insecure defaults/settings on a correctly designed system — A05. The
    key distinction: missing/flawed control by design vs. a control deployed with
    insecure settings.
  ref: concepts.md#a042021--insecure-design
