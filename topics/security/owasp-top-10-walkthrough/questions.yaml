topic: OWASP Top 10 & API Security Top 10 Walkthrough
domain: security
topic_slug: owasp-top-10-walkthrough
version: 1
questions:
- id: owasp-top-10-walkthrough-001
  difficulty: beginner
  tags:
  - methodology
  - fundamentals
  question: |
    What is the OWASP Top 10 best described as?
  options:
  - An awareness document ranking the most critical categories of web application security risk
  - A legally binding compliance standard applications must certify against
  - A code-scanning tool that automatically detects and reports the ten worst bugs
  - A firewall ruleset that automatically blocks the ten most common web attacks
  answer: 0
  explanation: |
    The OWASP Top 10 is an awareness document — a prioritized list of the most critical
    web application security risk categories. It is not a standard you certify against
    (use OWASP ASVS for verifiable requirements), not a tool, and not a WAF ruleset.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-002
  difficulty: beginner
  tags:
  - a01
  - ranking
  question: |
    Which category holds the #1 position in the OWASP Top 10 2021?
  options:
  - Injection
  - Broken Authentication
  - Cryptographic Failures
  - Broken Access Control
  answer: 3
  explanation: |
    A01:2021 Broken Access Control moved up from #5 in 2017 to #1 in 2021. It was found
    in ~94% of tested applications and maps the most CWE instances of any category.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-003
  difficulty: intermediate
  tags:
  - methodology
  - data-vs-survey
  question: |
    In the OWASP Top 10 2021, how are the categories selected?
  options:
  - All ten are chosen purely by a community survey of practitioners
  - All ten are derived purely from contributed vulnerability data
  - Eight come from contributed data and two are chosen by a community survey
  - They are copied unchanged from the CVE database each year
  answer: 2
  explanation: |
    Eight of the ten categories are derived from contributed vulnerability data
    (incidence rates across many applications), and two slots are chosen by an industry
    survey to capture risks that are hard to detect automatically. In 2021 the two
    survey-selected categories were A04 Insecure Design and A10 SSRF.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-004
  difficulty: intermediate
  tags:
  - methodology
  - incidence-rate
  question: |
    Why does the OWASP Top 10 rank data-driven categories by "incidence rate" (the
    percentage of applications containing at least one instance of a CWE) rather than by
    the raw count of findings?
  options:
  - Raw counts are impossible to derive from the contributed vulnerability data sets
  - Raw counts are biased by tools that report huge numbers of a single easy-to-find bug
  - Incidence rate is required by the ISO 27001 information security standard
  - Incidence rate always produces exactly the same ranking as a raw finding count would
  answer: 1
  explanation: |
    Incidence rate (per-application prevalence) reduces bias from automated tools that
    report enormous counts of one easy-to-detect issue, giving a fairer view of how
    widespread a category truly is across applications.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-005
  difficulty: intermediate
  tags:
  - a03
  - xss
  - merges
  question: |
    In the 2021 edition, where did Cross-Site Scripting (XSS) end up?
  options:
  - It became its own standalone category, A03
  - It was merged into A05 Security Misconfiguration
  - It was removed from the Top 10 entirely
  - It was merged into A03 Injection
  answer: 3
  explanation: |
    XSS was merged into A03 Injection in 2021, because XSS is injection into the
    browser's HTML/JS interpreter and shares the same code-vs-data root cause.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-006
  difficulty: intermediate
  tags:
  - a05
  - xxe
  - merges
  question: |
    In 2017 "XML External Entities (XXE)" was its own category. Where did it go in 2021?
  options:
  - Merged into A05 Security Misconfiguration
  - Merged into A03 Injection
  - Merged into A08 Software and Data Integrity Failures
  - Promoted to A01
  answer: 0
  explanation: |
    XXE merged into A05 Security Misconfiguration in 2021, because it stems from an XML
    parser configured (often by default) to resolve external entities.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-007
  difficulty: intermediate
  tags:
  - a08
  - deserialization
  - merges
  question: |
    "Insecure Deserialization" was a standalone 2017 category (#8). In the 2021 edition
    it is part of which category?
  options:
  - A03 Injection (SQL and command flaws)
  - A06 Vulnerable and Outdated Components
  - A08 Software and Data Integrity Failures
  - A10 Server-Side Request Forgery
  answer: 2
  explanation: |
    Insecure deserialization is subsumed under A08 Software and Data Integrity Failures
    in 2021, which broadens the theme to integrity of code, updates, and CI/CD pipelines.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-008
  difficulty: beginner
  tags:
  - a04
  - a10
  - new-categories
  question: |
    Which two categories were newly introduced in the OWASP Top 10 2021?
  options:
  - Injection and Broken Access Control
  - Insecure Design and Server-Side Request Forgery (SSRF)
  - Cryptographic Failures and Security Misconfiguration
  - Broken Authentication and Sensitive Data Exposure
  answer: 1
  explanation: |
    A04 Insecure Design and A10 SSRF were both new in 2021 (both were survey-selected).
    Cryptographic Failures is a rename of Sensitive Data Exposure, not a new category.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-009
  difficulty: beginner
  tags:
  - a01
  - idor
  - bola
  question: |
    A user sends `GET /api/invoices/1002` with their own valid token and receives
    another customer's invoice, simply by changing the ID in the URL. What is this?
  options:
  - Insecure Direct Object Reference (IDOR) / Broken Object Level Authorization
  - Cross-site request forgery (CSRF) that rides the victim's authenticated session
  - SQL injection through the numeric ID parameter in the request path
  - Security misconfiguration exposing the invoices endpoint without authentication
  answer: 0
  explanation: |
    This is IDOR (called BOLA in API terms), a form of Broken Access Control (A01). The
    server looks up the object by the supplied ID but never verifies that the object
    belongs to the authenticated caller.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-010
  difficulty: intermediate
  tags:
  - a01
  - idor
  - defense
  question: |
    A team "fixes" IDOR by replacing sequential integer IDs with random UUIDs. Why is
    this insufficient on its own?
  options:
  - UUIDs are far slower to index and look up, causing a denial-of-service condition
  - UUIDs cannot be used as database primary keys, so the mapping is inherently broken
  - It fully fixes the problem; random identifiers make ownership checks unnecessary
  - It only makes enumeration harder; without a per-request ownership check, a leaked or shared ID still exposes the object
  answer: 3
  explanation: |
    Unguessable identifiers are defense in depth, not a fix. The real defense is a
    server-side authorization check that the authenticated principal owns / may access
    the requested object. A leaked, logged, or shared UUID would still be served.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-011
  difficulty: intermediate
  tags:
  - a01
  - defense
  - deny-by-default
  question: |
    Which principle is the foundation of correct access control per A01?
  options:
  - Allow by default, then block requests that match a list of known-bad patterns
  - Trust the role claim sent by the client, since it was issued at login time
  - Deny by default; grant access only when explicitly authorized, enforced server-side on every request
  - Hide sensitive endpoints from the navigation menu so users cannot discover them
  answer: 2
  explanation: |
    Access control should deny by default and be enforced server-side on every request
    based on the authenticated identity — never on client-supplied role/ID values, and
    not by merely hiding links (that is forced-browsing bait).
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-012
  difficulty: intermediate
  tags:
  - a02
  - rename
  question: |
    A02:2021 Cryptographic Failures was formerly known by what 2017 name, and why was it
    renamed?
  options:
  - '''Broken Authentication''; renamed to broaden its scope to sessions'
  - '''Sensitive Data Exposure''; renamed to describe the root cause (bad/missing crypto) rather than the symptom'
  - '''Security Misconfiguration''; renamed for clarity'
  - It is a brand-new 2021 category with no predecessor
  answer: 1
  explanation: |
    It was "Sensitive Data Exposure" in 2017. The 2021 rename shifts focus from the
    symptom (data exposed) to the root cause (cryptography done wrong or omitted).
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-013
  difficulty: intermediate
  tags:
  - a02
  - password-hashing
  question: |
    A developer stores user passwords as a single unsalted SHA-256 hash. Under A02 this
    is a cryptographic failure primarily because:
  options:
  - SHA-256 is a fast general-purpose hash; passwords need a slow, salted KDF like Argon2id, bcrypt, scrypt, or PBKDF2
  - SHA-256 output is only 256 bits, which is too short to resist modern brute forcing
  - SHA-256 is a fundamentally broken algorithm like MD5, prone to practical collisions
  - Hashing passwords is unnecessary once the database volume is encrypted at rest
  answer: 0
  explanation: |
    SHA-256 is fast, so attackers can test billions of guesses per second against stolen
    hashes. Password storage requires a deliberately slow, salted password-hashing
    function (Argon2id/bcrypt/scrypt/PBKDF2). SHA-256 itself is not broken, but it is the
    wrong tool for passwords.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-014
  difficulty: advanced
  tags:
  - a02
  - algorithms
  - weak-crypto
  question: |
    Which combination best reflects current A02 guidance on cryptographic primitives?
  options:
  - Use MD5 for integrity and DES for encryption, and commit the shared key into the source repository
  - Use AES in ECB mode because AES is a NIST-approved cipher and the mode does not matter
  - Use SHA-1 for digital signatures because it is faster to compute than SHA-256
  - Use AEAD (AES-GCM or ChaCha20-Poly1305) for confidentiality+integrity, avoid MD5/SHA-1 and ECB mode, and manage keys in a KMS/HSM
  answer: 3
  explanation: |
    Prefer authenticated encryption (AES-GCM / ChaCha20-Poly1305). Avoid MD5 and SHA-1
    (both broken for collision resistance) and ECB mode (leaks plaintext structure).
    Keys should be managed properly (rotation, KMS/HSM), never checked into source.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-015
  difficulty: intermediate
  tags:
  - a02
  - ecb
  question: |
    Why is AES in ECB mode considered a cryptographic failure for structured data?
  options:
  - ECB is not a real cipher mode and is rejected by every AES implementation
  - ECB requires a per-message nonce that the standard mandates always be reused
  - Identical plaintext blocks encrypt to identical ciphertext blocks, leaking patterns/structure of the data
  - ECB is legally restricted to a 40-bit key, making it trivially brute-forceable
  answer: 2
  explanation: |
    ECB encrypts each block independently, so equal plaintext blocks yield equal
    ciphertext blocks. This leaks structure (the classic "ECB penguin" image) and
    provides no integrity. Use an AEAD mode instead.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-016
  difficulty: beginner
  tags:
  - a03
  - sql-injection
  - defense
  question: |
    What is the primary defense against SQL injection?
  options:
  - Escaping every single quote character found in the user-supplied input
  - Parameterized queries / prepared statements that separate query structure from data
  - A web application firewall (WAF) filtering inbound HTTP request payloads
  - Renaming database tables to non-obvious names so attackers cannot guess them
  answer: 1
  explanation: |
    Parameterized queries bind user data out-of-band so it is never parsed as part of
    the SQL text. Escaping, WAFs, and obscurity are at best defense in depth, not the
    primary fix.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-017
  difficulty: intermediate
  tags:
  - a03
  - injection
  - root-cause
  question: |
    What is the common root cause across SQL, OS command, LDAP, and XSS injection?
  options:
  - Weak or reused account passwords across the affected systems
  - Missing TLS encryption on the connection between client and server
  - Outdated third-party libraries carrying known published vulnerabilities
  - Untrusted data crosses from a data context into a code/structure context of an interpreter
  answer: 3
  explanation: |
    All injection stems from failing to keep code separate from data: untrusted input is
    interpreted as code/structure by some interpreter (SQL engine, shell, LDAP, or the
    browser's HTML/JS parser for XSS).
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-018
  difficulty: intermediate
  tags:
  - a03
  - command-injection
  question: |
    To avoid OS command injection when a program must run an external command with
    user-supplied arguments, the safest approach is to:
  options:
  - Pass the command and its arguments as a separate argument array, avoiding a shell interpreter
  - Build a single shell command string and escape the space characters within it
  - Base64-encode the user input before concatenating it into the shell command
  - Run the command with root privileges so it always executes and never fails
  answer: 0
  explanation: |
    Invoking the executable directly with an argument array (no shell) prevents shell
    metacharacters (;, |, &&, backticks) from being interpreted, eliminating the
    injection surface that string concatenation creates.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-019
  difficulty: intermediate
  tags:
  - a04
  - insecure-design
  - threat-modeling
  question: |
    A04 Insecure Design is best distinguished from an implementation bug because:
  options:
  - It exclusively affects native mobile applications and never appears in server-side or browser-based web code
  - It is always caused by importing an outdated third-party dependency that ships with a known published CVE
  - It represents a missing or flawed security control by design that cannot be fixed by writing more careful code
  - It occurs only within the database persistence layer, arising when schema constraints are left undefined
  answer: 2
  explanation: |
    Insecure Design means a needed control was never designed in. You cannot patch your
    way out of it — the design must change. This contrasts with implementation defects
    where the control exists but is coded wrong.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-020
  difficulty: intermediate
  tags:
  - a04
  - threat-modeling
  - defense
  question: |
    Which practice is the headline defense for A04 Insecure Design?
  options:
  - Running a dependency scanner in CI to flag known-vulnerable third-party libraries
  - Threat modeling and secure design patterns / abuse cases during design
  - Adding a WAF in front of production to filter malicious inbound request payloads
  - Rotating every user's password on a fixed 30-day schedule to shrink exposure
  answer: 1
  explanation: |
    Insecure Design is countered by building security in early: threat modeling (e.g.
    STRIDE), secure design patterns, abuse/misuse cases, and security requirements as
    first-class acceptance criteria.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-021
  difficulty: advanced
  tags:
  - a04
  - a05
  - distinction
  question: |
    An online shop lets a single account reserve unlimited concert seats indefinitely
    with no quantity or time limit, enabling scalper bots to lock out real buyers. No
    setting is misconfigured — the limit simply was never designed. Which category fits
    best?
  options:
  - A04 Insecure Design
  - A05 Security Misconfiguration
  - A06 Vulnerable and Outdated Components
  - A02 Cryptographic Failures
  answer: 0
  explanation: |
    This is a business-logic / anti-automation flaw that was never designed in — A04
    Insecure Design. A05 would apply if a control existed but was deployed with insecure
    settings; here the control is simply absent by design.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-022
  difficulty: beginner
  tags:
  - a05
  - misconfiguration
  question: |
    Which of the following is a classic example of A05 Security Misconfiguration?
  options:
  - A user password stored with Argon2id using a per-user random salt and tuned memory cost
  - A parameterized SQL query that binds every user-supplied value out-of-band from the statement text
  - A short-lived, sender-constrained access token scoped to a single audience and rotated frequently
  - Default admin credentials (admin/admin) left enabled and verbose stack traces returned to users
  answer: 3
  explanation: |
    Default credentials, unnecessary enabled features, directory listing, and verbose
    error/stack-trace disclosure are hallmark A05 misconfigurations. The other options
    are secure practices.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-023
  difficulty: intermediate
  tags:
  - a05
  - xxe
  - defense
  question: |
    Given this XML being parsed by a server:
    `<!DOCTYPE foo [ <!ENTITY xxe SYSTEM "file:///etc/passwd"> ]><foo>&xxe;</foo>`,
    what is the primary defense against this XXE attack?
  options:
  - Rename /etc/passwd on the server so the entity resolves to a nonexistent path and fails
  - Base64-encode the XML document before parsing so the entity declaration is never interpreted
  - Disable DTD processing / external entity resolution in the XML parser
  - Add a WAF rule blocking any request whose body contains the literal string 'passwd'
  answer: 2
  explanation: |
    XXE is defeated by disabling DTDs and external entity resolution in the XML parser
    (or using a simpler format like JSON). Blocklists and file renames are brittle and
    easily bypassed.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-024
  difficulty: intermediate
  tags:
  - a05
  - hardening
  - defense
  question: |
    Which approach best addresses the systemic cause of Security Misconfiguration across
    environments?
  options:
  - Manually hardening each server by hand the night before launch, following a written checklist
  - A repeatable, automated hardening process (e.g. infrastructure-as-code, hardened base images) applied identically to every environment
  - Allowing all origins in CORS with a wildcard so cross-origin calls never break in any environment
  - Turning on directory listing across environments to make debugging misrouted requests easier
  answer: 1
  explanation: |
    Misconfiguration recurs when environments drift. A repeatable, automated hardening
    process ensures dev/test/prod are configured identically and minimally, and can be
    verified in review.
  ref: concepts.md#a052021--security-misconfiguration
- id: owasp-top-10-walkthrough-025
  difficulty: beginner
  tags:
  - a06
  - components
  question: |
    A06:2021 Vulnerable and Outdated Components is primarily about:
  options:
  - Using libraries, frameworks, runtimes, or containers with known vulnerabilities or that are unsupported
  - Writing insecure code in your own application logic, such as unvalidated input handling in your controllers
  - Misconfiguring the web server by leaving default virtual hosts, sample apps, and management ports enabled
  - Failing to log security-relevant events, so intrusions and abuse go unrecorded and undetected for months
  answer: 0
  explanation: |
    A06 concerns the security posture inherited from third-party components (including
    transitive dependencies) that are known-vulnerable or out of support.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-026
  difficulty: intermediate
  tags:
  - a06
  - log4shell
  - examples
  question: |
    Log4Shell (CVE-2021-44228) is a canonical A06 example. What made it so dangerous?
  options:
  - It required physical console access to the server and could not be triggered over the network at all
  - It only affected a single vendor's proprietary closed-source product rather than any shared open-source library
  - It was purely a misconfiguration that occurred solely when an administrator left default passwords in place
  - A JNDI lookup RCE triggered by logging attacker-controlled text, affecting countless apps through transitive Log4j dependencies
  answer: 3
  explanation: |
    Log4Shell was a remote-code-execution flaw in Log4j 2 triggered when the library
    logged a string like ${jndi:ldap://...}. Because Log4j was a ubiquitous transitive
    dependency, a vast number of applications were exposed.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-027
  difficulty: intermediate
  tags:
  - a06
  - sbom
  - sca
  - defense
  question: |
    Which practice most directly defends against A06 and is NOT achievable by
    pen-testing your own code alone?
  options:
  - Rewriting every third-party library from scratch in-house so no external code ships in the product
  - Increasing the authenticated session timeout so users are re-prompted for credentials far less often
  - Maintaining an SBOM and running Software Composition Analysis (SCA) against CVE/advisory feeds in CI
  - Enabling verbose error messages so stack traces reveal which library version raised each exception
  answer: 2
  explanation: |
    Because vulnerabilities live in (often transitive) dependencies, you need an
    inventory/SBOM plus SCA tooling that matches your components against known-CVE feeds,
    wired into CI, plus prompt patching. Testing your own code won't surface these.
  ref: concepts.md#a062021--vulnerable-and-outdated-components
- id: owasp-top-10-walkthrough-028
  difficulty: beginner
  tags:
  - a07
  - authentication
  - rename
  question: |
    A07:2021 Identification and Authentication Failures was called what in 2017?
  options:
  - Sensitive Data Exposure
  - Broken Authentication
  - Security Misconfiguration
  - Insufficient Logging & Monitoring
  answer: 1
  explanation: |
    It was "Broken Authentication" (2017 #2). It was renamed and moved down to #7,
    partly because standard frameworks now handle authentication more reliably.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-029
  difficulty: intermediate
  tags:
  - a07
  - credential-stuffing
  question: |
    Attackers replay millions of username/password pairs leaked from other breaches
    against your login endpoint. What is this attack, and what best mitigates it?
  options:
  - Session fixation; mitigated by issuing cookies with a much longer random value and extended lifetime
  - SQL injection; mitigated by switching the credential store to AES in ECB mode for faster lookups
  - SSRF; mitigated by disabling external XML entity resolution in the login request parser
  - Credential stuffing; mitigated by rate limiting/throttling, MFA, and checking against breached-password lists
  answer: 3
  explanation: |
    Credential stuffing exploits password reuse. Defenses include throttling/lockout,
    MFA, and screening passwords against known-breached lists (per NIST SP 800-63B),
    plus monitoring for stuffing patterns.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-030
  difficulty: intermediate
  tags:
  - a07
  - session-fixation
  question: |
    Under A07, which is the correct way to prevent session fixation?
  options:
  - Generate a new, high-entropy session ID server-side immediately after successful authentication
  - Reuse the same session ID before and after login so the user's activity stays on one continuous session
  - Put the session ID in the URL query string so authenticated pages can be bookmarked and shared easily
  - Store the session ID in browser localStorage so client-side scripts can read and reattach it on reload
  answer: 0
  explanation: |
    Rotating (regenerating) the session identifier at login prevents an attacker who
    planted a known session ID from riding the authenticated session. Session IDs should
    also be kept out of URLs and stored in Secure/HttpOnly cookies.
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-031
  difficulty: advanced
  tags:
  - a07
  - nist-800-63b
  - passwords
  question: |
    Per NIST SP 800-63B, which password policy is now recommended?
  options:
  - Force password changes every 30 days and require at least one special character in every password
  - Require exactly 8 characters with at least one uppercase letter, one digit, and one symbol present
  - Allow long passphrases, check against breached-password lists, and do NOT force periodic rotation or arbitrary composition rules
  - Provide user-chosen password hints on the login page to help people recall a forgotten password
  answer: 2
  explanation: |
    NIST SP 800-63B recommends supporting long passphrases, screening against breached
    lists, and dropping forced periodic rotation, composition rules, and password hints
    (which harm usability without improving security).
  ref: concepts.md#a072021--identification-and-authentication-failures
- id: owasp-top-10-walkthrough-032
  difficulty: intermediate
  tags:
  - a08
  - integrity
  - new-category
  question: |
    A08:2021 Software and Data Integrity Failures centers on which theme?
  options:
  - Encrypting data at rest so stored records stay confidential if the disk or backup is stolen
  - Trusting code, updates, plugins, or CI/CD pipelines without verifying they have not been tampered with
  - Rate limiting login attempts to slow automated password guessing against the authentication endpoint
  - Rendering user-supplied input directly into HTML pages without applying context-aware output encoding
  answer: 1
  explanation: |
    A08 is about integrity: relying on software, data, updates, or build/deploy
    pipelines without verifying their integrity (e.g. via signatures). Insecure
    deserialization is one instance folded into this category.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-033
  difficulty: advanced
  tags:
  - a08
  - deserialization
  - defense
  question: |
    An application accepts a serialized object from the client and deserializes it into
    native objects, enabling a gadget-chain RCE. What is the correct primary defense?
  options:
  - Do not deserialize untrusted data into complex objects; prefer data-only formats and, if unavoidable, enforce type allowlists / integrity checks
  - Base64-decode the serialized object before deserializing it so the gadget chain bytes are normalized first
  - Compress the serialized blob with gzip before deserialization so embedded gadget chains cannot be assembled
  - Run the deserializer inside a faster runtime so the object graph is rebuilt before an exploit can trigger
  answer: 0
  explanation: |
    The fix is to avoid deserializing untrusted input into rich object graphs. Use
    data-only formats (e.g. JSON) with strict schemas; if native deserialization is
    unavoidable, restrict to allowlisted types and verify integrity first. Sanitizing
    the blob does not work.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-034
  difficulty: advanced
  tags:
  - a08
  - supply-chain
  - solarwinds
  question: |
    The SolarWinds SUNBURST incident is often cited under A08 because:
  options:
  - A user chose a weak, easily guessed password on an internet-facing administrative panel
  - An unpatched Log4j library allowed remote code execution through a crafted logged string
  - A publicly readable S3 bucket left customer data exposed to anyone who knew the object URL
  - The CI/CD build pipeline was compromised so signed, 'trusted' updates carried a backdoor to thousands of customers
  answer: 3
  explanation: |
    SolarWinds was a software-integrity / supply-chain failure: malicious code was
    inserted into the build pipeline, so legitimately signed Orion updates distributed a
    backdoor. Defense includes pipeline hardening, artifact signing, and dependency
    verification.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-035
  difficulty: beginner
  tags:
  - a09
  - logging-monitoring
  question: |
    A09:2021 Security Logging and Monitoring Failures is fundamentally about:
  options:
  - Preventing attacks from happening in the first place by blocking malicious traffic at the network edge
  - Encrypting log files at rest only, so that stored logs stay confidential if the log server is stolen
  - Detecting, alerting on, and responding to breaches — without it, incidents go unnoticed for a long time
  - Compressing archived log files to save disk space so longer retention windows fit the same storage budget
  answer: 2
  explanation: |
    A09 is a detection-and-response category. Insufficient logging, monitoring, and
    alerting lets attackers dwell undetected; historically breaches took hundreds of
    days to detect, often by outsiders.
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-036
  difficulty: intermediate
  tags:
  - a09
  - secrets-in-logs
  - gotcha
  question: |
    Which statement about A09 logging practices is correct?
  options:
  - Log full plaintext passwords and complete session tokens so that incident investigations have every detail
  - Log security-relevant events off-box to a tamper-resistant store, but never log secrets/PII and encode untrusted values to prevent log injection
  - Keep logs only on the local host where the event occurred to reduce cross-network traffic and storage cost
  - Disable application logging entirely in production so request handling spends no time on I/O and runs faster
  answer: 1
  explanation: |
    Log the right events (auth, access-control failures, high-value actions) and ship
    them to a central, tamper-resistant SIEM with alerting — but never log credentials,
    tokens, or PII, and sanitize/encode logged input to prevent log forging (CRLF
    injection).
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-037
  difficulty: beginner
  tags:
  - a10
  - ssrf
  - definition
  question: |
    What defines a Server-Side Request Forgery (SSRF) vulnerability (A10)?
  options:
  - The application fetches a user-supplied/influenced URL without validating the destination, letting the server reach targets the attacker couldn't
  - The browser is tricked into silently submitting a forged form to another site while riding the victim's already-authenticated session cookie
  - The backend database engine parses and executes attacker-supplied SQL because untrusted input was concatenated straight into the query text
  - The victim's session cookie is exfiltrated by attacker-injected JavaScript running in their browser because the output was never encoded
  answer: 0
  explanation: |
    SSRF is when the server-side app fetches a URL that the attacker controls or
    influences, without validating it, allowing requests to internal services, cloud
    metadata endpoints, or localhost that the attacker could not otherwise reach.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-038
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - cloud-metadata
  question: |
    A "fetch image from URL" feature is abused with
    `http://169.254.169.254/latest/meta-data/iam/security-credentials/role`. What is the
    danger and a key mitigation?
  options:
  - It causes stored cross-site scripting in the image gallery; mitigate by HTML-encoding the fetched filename before rendering it back to users
  - It forces the server to download a multi-gigabyte file and exhaust disk; mitigate by gzip-compressing the response body before storing it
  - It leaks the server's TLS private key through the fetched path; mitigate by rotating the certificate and re-issuing it from the CA weekly
  - It reaches the cloud metadata endpoint to steal temporary IAM credentials; mitigate by blocking the metadata IP/internal ranges, allowlisting destinations, and requiring IMDSv2
  answer: 3
  explanation: |
    This SSRF targets the instance metadata service (169.254.169.254) to exfiltrate
    temporary IAM credentials (as in the Capital One breach). Mitigations: allowlist
    allowed destinations, block link-local/internal ranges, egress segmentation, and
    require IMDSv2.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-039
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - dns-rebinding
  - defense
  question: |
    Why is validating only the hostname of a user-supplied URL insufficient to stop
    SSRF, and what addresses the gap?
  options:
  - Hostnames are case-sensitive, so an attacker bypasses the check with mixed casing; lowercasing the hostname before comparison fully closes the gap
  - Hostnames can never resolve to internal or link-local IP addresses, so a hostname allowlist is already a complete SSRF defense on its own
  - DNS rebinding / TOCTOU lets the resolved IP change between check and connect, so you must validate the resolved IP at connection time
  - The gap is closed simply by upgrading the outbound fetch from HTTP to HTTPS so the destination cannot be tampered with in transit
  answer: 2
  explanation: |
    An allowlisted hostname can resolve to an internal IP at connection time (DNS
    rebinding / time-of-check-to-time-of-use). Robust SSRF defense validates the actual
    resolved IP when the connection is made, and re-validates after any redirect.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-040
  difficulty: intermediate
  tags:
  - api-top-10
  - bola
  - reference
  question: |
    What is the #1 risk in the OWASP API Security Top 10 2023?
  options:
  - Security Misconfiguration
  - Broken Object Level Authorization (BOLA)
  - SQL Injection
  - Insufficient Logging
  answer: 1
  explanation: |
    API1:2023 Broken Object Level Authorization (BOLA) tops the API list — the same
    object-ownership authorization failure that dominates web A01. Authorization failures
    lead both lists.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-041
  difficulty: intermediate
  tags:
  - api-top-10
  - distinction
  - reference
  question: |
    How does the OWASP API Security Top 10 relate to the web OWASP Top 10?
  options:
  - It is an older, now-deprecated release of the web Top 10 that OWASP froze once the API threat landscape stabilized around REST
  - It is a strict subset containing only three of the web categories, dropping every risk that does not apply verbatim to JSON APIs
  - They are byte-for-byte identical lists published under two different names purely for search-engine and marketing reach
  - It is a separate, complementary list emphasizing object-/function-/property-level authorization, resource consumption, and API inventory
  answer: 3
  explanation: |
    The API Security Top 10 is a distinct, complementary list reflecting the API threat
    profile: fine-grained authorization (object/function/property level), resource
    consumption, and inventory (shadow/zombie APIs). Both lists put an authorization
    failure at #1.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-042
  difficulty: advanced
  tags:
  - api-top-10
  - bopla
  - reference
  question: |
    In the API Security Top 10 2023, which entry merged the 2019 categories "Excessive
    Data Exposure" and "Mass Assignment"?
  options:
  - Broken Object Property Level Authorization (BOPLA)
  - Broken Object Level Authorization (BOLA)
  - Unrestricted Resource Consumption
  - Improper Inventory Management
  answer: 0
  explanation: |
    Broken Object Property Level Authorization (BOPLA), new in 2023, consolidated
    Excessive Data Exposure and Mass Assignment — both concern authorization at the level
    of individual object properties.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-043
  difficulty: intermediate
  tags:
  - standards
  - asvs
  - methodology
  question: |
    If a stakeholder asks for a verifiable set of security requirements to test an
    application against (rather than an awareness ranking), which OWASP resource is most
    appropriate?
  options:
  - The OWASP Top 10
  - The OWASP API Security Top 10
  - The OWASP Application Security Verification Standard (ASVS)
  - The CVE database
  answer: 2
  explanation: |
    The Top 10 is an awareness document. For verifiable, level-based security
    requirements to test against, use ASVS; for testing methodology, use the WSTG.
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-044
  difficulty: advanced
  tags:
  - a01
  - function-level
  - scenario
  question: |
    A regular user discovers that `POST /admin/users/promote` is not linked in the UI but
    still succeeds when they call it directly with their normal session. Which category
    and fix apply?
  options:
  - A02 Cryptographic Failures; encrypt the request body with AES-GCM so the promote action cannot be tampered with before it reaches the controller
  - A01 Broken Access Control (missing function-level authorization); enforce a server-side role/permission check on the endpoint and deny by default
  - A09 Logging Failures; add verbose audit logging around the promote handler so the unauthorized call is recorded and can be reviewed later
  - A06 Vulnerable Components; upgrade the web framework to the patched release that removes the hidden administrative route from the router
  answer: 1
  explanation: |
    Hiding an endpoint from the UI is not access control (forced browsing defeats it).
    This is missing function-level authorization under A01; the fix is a server-side
    permission check that denies unauthorized principals regardless of how they reach the
    endpoint.
  ref: concepts.md#a012021--broken-access-control
- id: owasp-top-10-walkthrough-045
  difficulty: intermediate
  tags:
  - a02
  - transit
  - hsts
  question: |
    An application serves login over HTTPS but sends no Strict-Transport-Security header
    and still answers on plain HTTP. Under A02, why is this a cryptographic failure?
  options:
  - Without HSTS the connection can be downgraded/stripped to HTTP, exposing credentials in transit
  - HTTPS is inherently insecure unless a web application firewall terminates and re-inspects every encrypted request first
  - The TLS certificate must be self-signed rather than CA-issued for the browser to treat the login page as fully valid
  - HTTP is faster to serve than HTTPS, so on-path attackers won't bother intercepting the plaintext login traffic
  answer: 0
  explanation: |
    Missing HSTS plus an available HTTP endpoint permits SSL-strip downgrade attacks,
    letting an on-path attacker read data (including credentials) in transit. HSTS forces
    browsers to use HTTPS and refuse downgrade.
  ref: concepts.md#a022021--cryptographic-failures
- id: owasp-top-10-walkthrough-046
  difficulty: beginner
  tags:
  - ranking
  - changes
  - methodology
  question: |
    Which statement about changes from the 2017 to the 2021 Top 10 is correct?
  options:
  - Broken Access Control dropped off the list entirely after 2017 because frameworks now enforce authorization automatically
  - Cryptographic Failures is a brand-new 2021 category with no 2017 predecessor of any kind
  - Security Logging & Monitoring was removed from the 2021 edition once SIEM tooling became a standard operational baseline
  - 'Injection moved from #1 down to #3 and absorbed XSS'
  answer: 3
  explanation: |
    Injection fell from #1 (2017) to #3 (2021) and now includes XSS. Broken Access
    Control rose to #1, Cryptographic Failures is a rename of Sensitive Data Exposure,
    and Logging & Monitoring moved up (not removed).
  ref: concepts.md#how-the-top-10-is-built-and-what-changed-since-2017
- id: owasp-top-10-walkthrough-047
  difficulty: advanced
  tags:
  - a10
  - ssrf
  - defense
  - allowlist
  question: |
    Which set of controls best mitigates SSRF in a URL-fetching feature?
  options:
  - Blocklist the literal word 'localhost' in the URL string and reject any request whose host field contains it before fetching
  - Follow all HTTP redirects automatically to the final hop and return the raw upstream response body straight to the client
  - Allowlist permitted schemes/hosts/ports, block internal/link-local ranges, don't follow redirects blindly, and enforce network egress segmentation
  - Only allow plain HTTP rather than HTTPS for the fetch so security tooling can inspect the cleartext responses more easily
  answer: 2
  explanation: |
    Robust SSRF defense combines destination allowlisting (scheme/host/port), blocking
    internal and link-local ranges, controlled redirect handling, not echoing raw
    responses, and network egress segmentation so the server cannot reach internal
    targets. String blocklists are trivially bypassed.
  ref: concepts.md#a102021--server-side-request-forgery-ssrf
- id: owasp-top-10-walkthrough-048
  difficulty: intermediate
  tags:
  - a03
  - xss
  - reflected
  - scenario
  question: |
    A search page reflects the `q` parameter into HTML without encoding, and
    `?q=<script>...</script>` executes in the victim's browser. Which category is this,
    and what is the primary defense?
  options:
  - A01 Broken Access Control; add a per-request ownership check so the caller can only read search results tied to their own account
  - A03 Injection (reflected XSS); apply context-aware output encoding and a strong Content-Security-Policy as defense in depth
  - A05 Misconfiguration; disable external XML entity resolution in the search parser so the injected markup is never expanded
  - A10 SSRF; block the link-local cloud metadata IP range so the reflected request cannot reach internal endpoints
  answer: 1
  explanation: |
    Reflecting unencoded input into HTML is reflected XSS, which lives under A03 in 2021.
    The primary fix is context-aware output encoding (and safe templating), with CSP as a
    strong secondary layer.
  ref: concepts.md#a032021--injection
- id: owasp-top-10-walkthrough-049
  difficulty: intermediate
  tags:
  - api-top-10
  - ssrf
  - overlap
  - reference
  question: |
    Which risk appears on BOTH the web OWASP Top 10 2021 and the API Security Top 10?
  options:
  - Server-Side Request Forgery (SSRF)
  - XML External Entities (XXE)
  - Cross-Site Scripting (XSS) as a standalone item
  - Cryptographic Failures as a standalone item
  answer: 0
  explanation: |
    SSRF is present on both lists (A10 on the web list and as an entry on the API list).
    XXE and XSS are folded into other web categories, and the API list frames crypto
    differently.
  ref: concepts.md#referencing-the-api-security-top-10-2023
- id: owasp-top-10-walkthrough-050
  difficulty: advanced
  tags:
  - a08
  - ci-cd
  - defense
  question: |
    Which combination best hardens a CI/CD pipeline against A08 Software and Data
    Integrity Failures?
  options:
  - Give every developer standing admin on the build server and skip mandatory code review so releases can be cut faster during crunch
  - Disable audit logging inside the pipeline to reduce noise so the build dashboard shows only green successful stages
  - Pull each dependency from whichever public or private registry responds fastest at build time, without pinning a source or version
  - Least-privilege pipeline access, mandatory code review, signed build artifacts, and verification of dependency checksums/signatures with lockfiles
  answer: 3
  explanation: |
    A08 defenses for CI/CD include least privilege, code review, artifact signing, and
    verifying dependency integrity (checksums/signatures, lockfiles) so unsigned or
    tampered code cannot be built or deployed.
  ref: concepts.md#a082021--software-and-data-integrity-failures
- id: owasp-top-10-walkthrough-051
  difficulty: beginner
  tags:
  - a09
  - dwell-time
  question: |
    Why does A09 emphasize shipping logs off the host and alerting in near real-time?
  options:
  - To save local disk space only, since streaming events off-box frees the application host from retaining any log files at all
  - Because compliance requires every log line to be hashed with MD5 before it can legally leave the originating host
  - Because attackers can wipe local logs, and without alerting, breaches dwell undetected for long periods
  - Because writing logs to the local filesystem is a GDPR violation by default unless they are shipped elsewhere within minutes
  answer: 2
  explanation: |
    Local-only logs can be tampered with or deleted by an attacker, and without alerting
    nobody notices suspicious patterns (e.g. mass failed logins). Centralized,
    tamper-resistant logging with alerting shortens detection/dwell time.
  ref: concepts.md#a092021--security-logging-and-monitoring-failures
- id: owasp-top-10-walkthrough-052
  difficulty: advanced
  tags:
  - a04
  - a05
  - distinction
  - scenario
  question: |
    Two teams describe issues: Team A shipped a product whose password-reset flow relies
    on easily-guessable security questions (the flow was designed that way); Team B left
    directory listing and default admin credentials enabled in production. Which mapping
    is correct?
  options:
  - Both are A05 Security Misconfiguration, since each is just an insecure setting left on a system that was otherwise designed correctly
  - Team A is A04 Insecure Design; Team B is A05 Security Misconfiguration
  - Team A is A05 Security Misconfiguration; Team B is A04 Insecure Design, because a weak reset flow is a deployment setting and stale defaults are a design gap
  - Both are A01 Broken Access Control, since each ultimately lets an unauthorized actor reach data they should not be able to access
  answer: 1
  explanation: |
    Team A's weakness is baked into the design (a flawed control, not a wrong setting) —
    A04. Team B left insecure defaults/settings on a correctly designed system — A05. The
    key distinction: missing/flawed control by design vs. a control deployed with
    insecure settings.
  ref: concepts.md#a042021--insecure-design
- id: owasp-top-10-walkthrough-053
  difficulty: advanced
  tags:
  - 2025-edition
  - ssrf
  - trap
  question: |
    A candidate confidently states "SSRF is A10 in the OWASP Top 10." In the 2025 edition,
    what is the accurate statement about where SSRF sits?
  options:
  - SSRF was promoted to its own #1 category in 2025 after overtaking Broken Access Control in the contributed incidence data
  - SSRF is no longer a standalone category; it was merged up into A01 Broken Access Control
  - SSRF was renamed to A10 Mishandling of Exceptional Conditions, keeping the same #10 slot it held in the 2021 edition
  - SSRF was removed from the Top 10 entirely in 2025 because contributed data showed it had become rare in practice
  answer: 1
  explanation: |
    In the 2021 edition SSRF was A10, but the 2025 edition merges SSRF up into A01 Broken
    Access Control (a dashed-line mapping in the official change table). "SSRF = A10" is now
    an outdated answer; it is still a tested class, just categorized under access control.
  ref: concepts.md#the-2025-edition--what-changed-from-2021
- id: owasp-top-10-walkthrough-054
  difficulty: advanced
  tags:
  - 2025-edition
  - supply-chain
  - methodology
  question: |
    In the OWASP Top 10:2025, which category rose to A03 and was the #1 concern in the
    community survey, and what does it now encompass beyond the old 2021 scope?
  options:
  - Injection; it rose to A03 in 2025 and now formally absorbs prompt injection against LLM-backed application features as a new sub-class
  - Cryptographic Failures; it rose to A03 in 2025 and now folds in post-quantum readiness and mandatory migration off RSA-2048 as its headline expansion
  - Software Supply Chain Failures; it expands the old "Vulnerable & Outdated Components" to also cover build systems (CI/CD, IDEs, artifact repos) and distribution
  - Security Misconfiguration; it rose to A03 in 2025 and now encompasses all cloud IAM policy definitions and every managed-service default across providers
  answer: 2
  explanation: |
    A03:2025 Software Supply Chain Failures expands A06:2021 (Vulnerable & Outdated
    Components) from just dependencies to the whole chain — direct/transitive deps, build
    systems (CI/CD, IDEs and extensions, image/artifact repos), and distribution
    (registries, SaaS). It was the top community-survey concern in 2025.
  ref: concepts.md#the-2025-edition--what-changed-from-2021
- id: owasp-top-10-walkthrough-055
  difficulty: expert
  tags:
  - a10-2025
  - fail-secure
  - cwe-636
  question: |
    Your API gateway calls an external authorization service to decide each request. Under
    load the auth service starts timing out. Which gateway behavior is correct per A10:2025
    Mishandling of Exceptional Conditions?
  options:
  - Catch the timeout and allow the request through so users are not locked out (fail open)
  - Catch the timeout, deny the request, and surface a generic error (fail closed)
  - Retry indefinitely with no timeout so the decision always eventually returns
  - Skip authorization only for requests that look like normal traffic
  answer: 1
  explanation: |
    A10:2025 centers on failing securely. When a security decision cannot be made, the
    system must fail closed (deny) — CWE-636 "Not Failing Securely." Failing open on a
    timeout lets an attacker who can induce the error bypass authorization; the availability
    pressure ("don't lock users out") is exactly what makes fail-open tempting and wrong.
  ref: concepts.md#a102025--mishandling-of-exceptional-conditions
- id: owasp-top-10-walkthrough-056
  difficulty: intermediate
  tags:
  - cwe
  - cve
  - cvss
  - vocabulary
  question: |
    Which mapping of the terms is correct?
  options:
  - CWE = a specific bug in a specific product version; CVE = a weakness class; CVSS = an exploitation probability
  - CWE = a weakness class/type; CVE = a specific vulnerability instance in a product; CVSS = a severity score
  - CWE = a severity score; CVE = a weakness class; CVSS = the catalog of exploited bugs
  - All three are interchangeable names for the same MITRE-issued vulnerability identifier
  answer: 1
  explanation: |
    CWE (Common Weakness Enumeration) is the class of weakness (e.g. CWE-89 SQLi); CVE is a
    specific instance in a product/version (e.g. CVE-2021-44228); CVSS is a 0-10 severity
    score assigned to a CVE. The Top 10 categories are groupings of CWEs.
  ref: concepts.md#cwe-vs-cve-vs-cvss-and-prioritizing-patches-kev-epss
- id: owasp-top-10-walkthrough-057
  difficulty: advanced
  tags:
  - kev
  - epss
  - prioritization
  question: |
    You have hundreds of open CVEs and limited patching capacity. Which prioritization
    approach is most defensible at senior level?
  options:
  - Patch strictly in descending CVSS base-score order, clearing every 9.0-and-above CVE first regardless of exploitability or reachability
  - Patch only CVEs disclosed in the last 30 days, assuming older vulnerabilities were already handled by previous update cycles
  - Combine CISA KEV (is it exploited in the wild?), EPSS (probability of near-term exploitation), CVSS (impact), and your own reachability/exposure
  - Wait for a vendor WAF signature to be published for each CVE and rely on it for protection until a patch is eventually scheduled
  answer: 2
  explanation: |
    CVSS base score alone ignores whether a bug is actually being exploited. Mature triage
    combines KEV (observed exploitation), EPSS (predicted exploitation), CVSS (impact if hit),
    and your own context (is the code path reachable / internet-facing?). A high-CVSS,
    unreachable, low-EPSS bug may rank below a moderate one that is in KEV.
  ref: concepts.md#cwe-vs-cve-vs-cvss-and-prioritizing-patches-kev-epss
- id: owasp-top-10-walkthrough-058
  difficulty: advanced
  tags:
  - asvs
  - levels
  - standards
  question: |
    A payments application handling sensitive financial data asks which ASVS level to
    target. Which statement about ASVS levels is correct?
  options:
  - L1 is reserved for the most critical high-value systems, L2 is a documentation-only tier, and L3 is merely the automated scanning baseline
  - L1 is an opportunistic baseline; L2 is the standard target for most sensitive-data apps; L3 is for high-value/critical systems and needs the most rigor
  - All ASVS levels enforce identical requirements; the number is only a documentation tag that teams pick for branding on their audit reports
  - ASVS defines just two outcomes, a binary "pass" and "fail" gate, with no graduated levels of verification rigor at all
  answer: 1
  explanation: |
    ASVS L1 is opportunistic (largely automated) baseline; L2 is the standard, recommended
    target for apps handling sensitive data; L3 is for high-value/critical systems and
    demands the most rigorous, largely manual verification. A payments app typically targets
    L2 (or L3 for the most critical flows).
  ref: concepts.md#the-owasp-framework-family--top-10-vs-asvs-wstg-masvs-samm-proactive-controls
- id: owasp-top-10-walkthrough-059
  difficulty: advanced
  tags:
  - samm
  - program-maturity
  - standards
  question: |
    A director asks not "what bugs do we have?" but "how mature is our appsec program across
    governance, design, and operations?" Which OWASP resource is designed for that question?
  options:
  - OWASP SAMM (Software Assurance Maturity Model)
  - The OWASP Top 10 awareness ranking of the most critical web application risk categories
  - OWASP WSTG (Web Security Testing Guide), the step-by-step methodology for testing individual applications
  - The CVE database catalog of specific disclosed vulnerability instances across products
  answer: 0
  explanation: |
    SAMM measures and improves the maturity of a whole software-assurance program
    (governance, design, implementation, verification, operations). The Top 10 is awareness,
    WSTG is a testing methodology, and CVE is a vulnerability catalog — none answers program
    maturity. (BSIMM is a similar model.)
  ref: concepts.md#the-owasp-framework-family--top-10-vs-asvs-wstg-masvs-samm-proactive-controls
- id: owasp-top-10-walkthrough-060
  difficulty: expert
  tags:
  - a01
  - authorization-models
  - rebac
  question: |
    You need fine-grained "can Alice edit *this* document?" decisions derived from
    relationships like folder membership and sharing, at large scale. Which model best fits,
    and what is its canonical design?
  options:
  - Plain RBAC, because assigning each user a static role like "editor" inherently captures every per-document relationship at scale
  - ReBAC (Relationship-Based Access Control), exemplified by Google Zanzibar
  - Maintaining a per-user blocklist that enumerates the specific document IDs each user should be prevented from seeing
  - Hiding the documents a user cannot access from the navigation UI so the links are never rendered for them
  answer: 1
  explanation: |
    Relationship-Based Access Control (ReBAC) derives permission from a graph of
    relationships (Alice is editor of a folder containing the doc). Google's Zanzibar is the
    canonical design for fine-grained object-level authorization at scale. RBAC struggles
    with per-object decisions; UI hiding is not access control (forced browsing defeats it).
  ref: concepts.md#access-control-models-and-deeper-a01-attacks-rbacabacrebac-path-traversal-mass-assignment
- id: owasp-top-10-walkthrough-061
  difficulty: advanced
  tags:
  - a01
  - path-traversal
  - cwe-22
  question: |
    A download endpoint takes a `file` parameter and reads it from a base directory. An
    attacker sends `file=../../../../etc/passwd`. What is this, and what is the robust fix?
  options:
  - Path/directory traversal (CWE-22); canonicalize the resolved path and verify it stays within the allowed base directory (allowlisting), not blocklist "../"
  - SQL injection; switch the file lookup to parameterized queries so the path value is bound out-of-band from any statement
  - SSRF; block the 169.254.169.254 link-local metadata IP so the file fetch cannot reach internal endpoints
  - CSRF; add a synchronizer anti-CSRF token to the download form so forged cross-site requests are rejected
  answer: 0
  explanation: |
    Path traversal (CWE-22) escapes the intended directory using ../ sequences (or encoded
    variants). Blocklisting "../" is bypassable (encodings, absolute paths). The robust fix
    is to canonicalize the fully-resolved path and confirm it remains inside the allowed base
    directory, ideally combined with an allowlist of permitted filenames.
  ref: concepts.md#access-control-models-and-deeper-a01-attacks-rbacabacrebac-path-traversal-mass-assignment
- id: owasp-top-10-walkthrough-062
  difficulty: expert
  tags:
  - a01
  - mass-assignment
  - auto-binding
  question: |
    A profile-update endpoint binds the entire JSON body onto the user model. An attacker
    adds `"role":"admin"` and `"emailVerified":true` to the body and the framework persists
    them. What is this, and the correct fix?
  options:
  - Insecure deserialization; stop accepting JSON and switch the endpoint to a binary object format that clients cannot easily craft by hand
  - Mass assignment / auto-binding (write-side authorization failure); bind only an explicit allowlist of client-editable fields (a DTO), never the whole object
  - Reflected XSS; HTML-encode the request body fields before persisting them so any injected markup is neutralized on write
  - Security misconfiguration; enable directory listing on the profile service so the extra bound fields become visible for auditing
  answer: 1
  explanation: |
    Mass assignment (auto-binding) lets the client set fields it should never control. It is
    a write-side authorization failure adjacent to A01. The fix is to bind only an explicit
    allowlist of editable fields (e.g. via a DTO/input schema) so privileged fields like role
    or emailVerified can never be set from the request body.
  ref: concepts.md#access-control-models-and-deeper-a01-attacks-rbacabacrebac-path-traversal-mass-assignment
- id: owasp-top-10-walkthrough-063
  difficulty: expert
  tags:
  - a01
  - jwt
  - alg-confusion
  question: |
    A service verifies JWTs. An attacker takes a valid RS256 token, changes the header to
    `alg:HS256`, and signs it using the service's *public* RSA key as the HMAC secret. If the
    service accepts it, what happened?
  options:
  - Nothing exploitable; the RS256 signature check will always fail because an HMAC tag can never validate against an RSA verification routine
  - An algorithm-confusion (key-confusion) attack — the verifier used the public key as an HMAC key, letting the attacker forge tokens; also reject alg:none and pin the expected algorithm
  - A padding oracle attack on the JWT, in which distinguishable decryption errors on the token's payload let the attacker recover its bytes
  - A CSRF attack that smuggles the token in as a hidden form field so the victim's browser submits it on an authenticated cross-site request
  answer: 1
  explanation: |
    RS256->HS256 key confusion: the verifier treats the RSA public key (which the attacker
    knows) as the HMAC-SHA256 secret, so the attacker can forge valid tokens. The fix is to
    pin/enforce the expected algorithm server-side and reject alg:none and mismatched algs.
    This is an authorization-bypass vector; deeper protocol detail lives in the OAuth/JWT topic.
  ref: concepts.md#access-control-models-and-deeper-a01-attacks-rbacabacrebac-path-traversal-mass-assignment
- id: owasp-top-10-walkthrough-064
  difficulty: advanced
  tags:
  - a02-2025
  - security-headers
  - deprecated
  question: |
    During a hardening review, which recommendation is actually correct for modern browsers?
  options:
  - Set `X-XSS-Protection: 1; mode=block` as the primary XSS defense, since its built-in auditor reliably neutralizes reflected script across all current browsers
  - Rely on a strong Content-Security-Policy for XSS defense in depth; `X-XSS-Protection` is deprecated (set it to 0 or omit)
  - Remove Content-Security-Policy entirely because the newer X-XSS-Protection auditor fully supersedes it and covers every injection vector CSP would
  - Use `X-Frame-Options` in place of TLS to prevent on-path interception of data, since framing controls also encrypt the response in transit
  answer: 1
  explanation: |
    The legacy X-XSS-Protection auditor is deprecated and can itself introduce issues;
    current guidance is to set it to 0 (or omit) and rely on a strong CSP (with Trusted Types
    in CSP L3) as the defense-in-depth XSS layer. Recommending X-XSS-Protection as the primary
    defense is a red flag.
  ref: concepts.md#security-headers-cors-and-cloud-misconfiguration-a02a05-deep-dive
- id: owasp-top-10-walkthrough-065
  difficulty: expert
  tags:
  - a02-2025
  - cors
  - credentials
  question: |
    An API responds with `Access-Control-Allow-Origin: *` and
    `Access-Control-Allow-Credentials: true` for a request carrying cookies. What actually
    happens, and why?
  options:
  - The browser blocks exposure of the response — the Fetch spec forbids the wildcard origin together with credentials; credentialed CORS requires an explicit, exact echoed origin
  - The browser exposes the response as normal; combining a wildcard origin with credentials is the officially recommended pattern for maximizing cross-origin compatibility
  - The server rejects the request before responding, returning a 403 because the wildcard and credentials headers conflict at the application layer
  - The response body is exposed to the caller, but the server transparently strips the cookies from it so no session data can leak cross-origin
  answer: 0
  explanation: |
    The Fetch spec forbids combining `Access-Control-Allow-Origin: *` with
    `Access-Control-Allow-Credentials: true`; the browser will not expose the response.
    Credentialed cross-origin requests require the server to echo a specific exact origin —
    and reflecting arbitrary origins turns every authenticated endpoint into a cross-origin read.
  ref: concepts.md#security-headers-cors-and-cloud-misconfiguration-a02a05-deep-dive
- id: owasp-top-10-walkthrough-066
  difficulty: expert
  tags:
  - a02-2025
  - cors
  - origin-validation
  question: |
    A server validates the CORS `Origin` with the check `origin.startsWith("https://example.com")`
    and echoes it back. Why is this exploitable?
  options:
  - The unanchored match also accepts `https://example.com.evil.com`, so an attacker-controlled subdomain-style origin is trusted
  - startsWith performs a case-sensitive comparison, which rejects every legitimate origin and forces the check to fall back to a permissive default
  - CORS origins are opaque tokens that cannot be validated with ordinary string functions at all, so the check has no defined behavior here
  - It is not exploitable at all; prefix matching against the site's base URL is in fact the pattern the CORS specification recommends for allowlists
  answer: 0
  explanation: |
    An unanchored prefix/regex match like startsWith("https://example.com") also matches
    `https://example.com.evil.com` (and similar). Origin validation must match the full,
    exact origin against an allowlist; sloppy prefix/regex checks are a classic CORS bypass.
  ref: concepts.md#security-headers-cors-and-cloud-misconfiguration-a02a05-deep-dive
- id: owasp-top-10-walkthrough-067
  difficulty: expert
  tags:
  - a04-2025
  - password-hashing
  - argon2id
  question: |
    Why is Argon2id preferred for password hashing, and what parameter is most responsible
    for resisting GPU/ASIC cracking?
  options:
  - It is memory-hard; the memory-cost parameter (e.g. m ≈ 19+ MiB with t=2, p=1) forces attackers to spend RAM per guess, defeating cheap parallel GPU/ASIC cracking
  - It is far faster to compute than SHA-256, so users log in more quickly and the server spends fewer CPU cycles per authentication attempt
  - It derives a compact 40-bit output key that is small and easy to audit, log, and compare during incident-response reviews of the credential store
  - It stores the passwords in plaintext but confines them to a tamper-resistant hardware enclave that no attacker process can read from
  answer: 0
  explanation: |
    Argon2id is memory-hard: its memory-cost parameter (OWASP baseline ~19 MiB, t=2, p=1;
    more if affordable) forces each guess to consume RAM, which undercuts the massive
    parallelism of GPUs/ASICs that make fast hashes cheap to crack. A per-password random salt
    is also required.
  ref: concepts.md#password-hashing-and-aead--concrete-parameters-a04-deep-dive
- id: owasp-top-10-walkthrough-068
  difficulty: expert
  tags:
  - a04-2025
  - bcrypt
  - truncation
  question: |
    A team uses bcrypt with a work factor of 12 but reports that very long passphrases (100+
    chars) seem interchangeable past a point. What bcrypt caveat explains this, and how do
    you handle it?
  options:
  - bcrypt truncates input at 72 bytes, so entropy beyond that is ignored; pre-hash long inputs (e.g. SHA-256 then base64) before bcrypt, or use Argon2id/scrypt
  - bcrypt imposes no input length limit whatsoever, so the observation must stem from an unrelated bug in the framework's form-parsing or trimming logic
  - bcrypt requires exactly 8-character passwords, so any characters entered beyond the eighth position are silently discarded before the hash is computed
  - Lowering the configured work factor from 12 down to 4 removes the truncation behavior by shortening the internal key-schedule that causes it
  answer: 0
  explanation: |
    bcrypt truncates its input at 72 bytes, so anything beyond that adds no entropy — long
    passphrases can collide on their first 72 bytes. A common mitigation is to pre-hash the
    password (e.g. SHA-256 then base64-encode) before feeding bcrypt, or to use a KDF without
    this limit such as Argon2id or scrypt.
  ref: concepts.md#password-hashing-and-aead--concrete-parameters-a04-deep-dive
- id: owasp-top-10-walkthrough-069
  difficulty: advanced
  tags:
  - a04-2025
  - pbkdf2
  - kdf
  question: |
    A FIPS-constrained environment cannot use Argon2 and must use a NIST-approved KDF for
    passwords. Which choice and configuration aligns with current OWASP guidance?
  options:
  - MD5 with a static application-wide salt, chosen because it is fast, FIPS-listed, and widely supported across legacy runtime libraries
  - Plain AES-CBC encryption of each password under a shared server-side key, so the original value can be decrypted and compared at login time
  - A single unsalted SHA-256 hash of the password, on the grounds that SHA-256 is a NIST-approved algorithm suitable for credential storage
  - PBKDF2-HMAC-SHA256 with roughly 600,000 iterations and a unique per-password salt
  answer: 3
  explanation: |
    When Argon2/scrypt are unavailable (e.g. FIPS constraints), PBKDF2 is the NIST-approved
    KDF; OWASP (2023) recommends about 600,000 iterations for PBKDF2-HMAC-SHA256, with a
    unique random salt per password. PBKDF2 is not memory-hard, so use a high iteration count.
    Unsalted/fast hashes and reversible encryption are wrong.
  ref: concepts.md#password-hashing-and-aead--concrete-parameters-a04-deep-dive
- id: owasp-top-10-walkthrough-070
  difficulty: expert
  tags:
  - a04-2025
  - aes-gcm
  - nonce-reuse
  question: |
    An engineer generates AES-GCM nonces from a low-resolution timestamp to "keep them
    simple," so two messages under the same key occasionally share a nonce. Why is this
    catastrophic?
  options:
  - It only adds a small amount of latency to each encryption call and has no effect on the confidentiality or integrity guarantees of the ciphertext
  - GCM does not rely on a nonce at all, deriving its counter solely from the key, so two messages can never actually share nonce material in the first place
  - It merely pads the ciphertext to a larger block-aligned size, occasionally making the encrypted message too long to transmit within the protocol's frame limit
  - GCM nonce reuse under one key leaks the XOR of the plaintexts and enables recovery of the GCM authentication subkey, allowing forgery of arbitrary messages
  answer: 3
  explanation: |
    AES-GCM uses a 96-bit nonce that must never repeat under a given key. Nonce reuse leaks
    the XOR of the two plaintexts and, worse, allows recovery of the GHASH authentication
    subkey, letting an attacker forge valid authentication tags for arbitrary messages. Use a
    counter or CSPRNG nonce with a strict no-reuse guarantee and rotate keys appropriately.
  ref: concepts.md#password-hashing-and-aead--concrete-parameters-a04-deep-dive
- id: owasp-top-10-walkthrough-071
  difficulty: advanced
  tags:
  - a04-2025
  - padding-oracle
  - aead
  question: |
    A legacy service encrypts with AES-CBC and returns distinguishable errors for "bad
    padding" vs "bad MAC/decrypt." What attack class does this enable, and what is the
    correct remedy?
  options:
  - A padding oracle attack allowing decryption/forgery via the padding error side channel; switch to an AEAD mode (AES-GCM or ChaCha20-Poly1305)
  - A brute-force attack on the symmetric key exploiting the error timing; simply rotate the encryption key on a weekly schedule to shrink the exposure window
  - SQL injection reaching the ciphertext store; switch every affected query to parameterized prepared statements that bind values out-of-band
  - A CSRF attack replaying the encrypted blob cross-site; add SameSite cookie attributes and a synchronizer token to the decrypting endpoint
  answer: 0
  explanation: |
    Distinguishable padding errors in CBC create a padding oracle, letting an attacker
    decrypt (and often forge) ciphertext without the key. The durable fix is authenticated
    encryption (AEAD: AES-GCM or ChaCha20-Poly1305) so ciphertext integrity is verified before
    any decryption/padding processing.
  ref: concepts.md#password-hashing-and-aead--concrete-parameters-a04-deep-dive
- id: owasp-top-10-walkthrough-072
  difficulty: advanced
  tags:
  - a05-2025
  - nosql-injection
  question: |
    A MongoDB-backed login builds a query from a JSON body: `{ "user": <u>, "pass": <p> }`.
    An attacker sends `{"user":"admin","pass":{"$ne":null}}` and logs in. What happened, and
    the fix?
  options:
  - Classic SQL injection against the login query; switch to prepared statements that bind the username and password parameters out-of-band from the statement text
  - SSRF triggered by the JSON login body; block internal and link-local IP ranges so the crafted request cannot reach backend authentication services
  - An XXE attack embedded in the request payload; disable DTD processing and external entity resolution in the parser that reads the login body
  - NoSQL operator injection — the object `{"$ne":null}` became a query operator matching any non-null password; reject operator objects where a scalar is expected and use typed/validated queries
  answer: 3
  explanation: |
    Passing an object where a scalar password was expected lets `{"$ne":null}` act as a
    Mongo operator that matches any non-null value, bypassing the password check. Defend by
    validating types (expect a string), rejecting operator objects, and using typed query
    builders. This is NoSQL injection, still within the Injection category.
  ref: concepts.md#injection-breadth-and-xss-taxonomy-a05-deep-dive
- id: owasp-top-10-walkthrough-073
  difficulty: expert
  tags:
  - a05-2025
  - ssti
  question: |
    A "custom email template" feature lets users enter text that the server renders through
    its template engine. A tester submits `{{7*7}}` and the email shows `49`. What is the
    risk and the correct fix?
  options:
  - Reflected cross-site scripting only, because the value is echoed back into the email body; HTML-encode the output so the `{{7*7}}` renders as literal text rather than being evaluated
  - SQL injection reaching the mail-log table through the template field; switch to parameterized prepared statements so the `{{7*7}}` payload is bound as data and can never execute
  - A harmless built-in arithmetic helper the template engine exposes on purpose; the `49` output is expected behavior and requires no remediation beyond documenting it
  - Server-Side Template Injection (SSTI), which can escalate to remote code execution; never compile user input as a template — treat it strictly as data, or use a sandboxed/logic-less engine
  answer: 3
  explanation: |
    `{{7*7}}` evaluating to 49 proves user input is compiled as template code (SSTI), which
    on many engines escalates to RCE via object/attribute access. The fix is to never render
    user-supplied content as a template; pass it as data into a fixed template, or use a
    sandboxed, logic-less templating engine.
  ref: concepts.md#injection-breadth-and-xss-taxonomy-a05-deep-dive
- id: owasp-top-10-walkthrough-074
  difficulty: expert
  tags:
  - a05-2025
  - second-order-sqli
  question: |
    User registration safely parameterizes the username on insert. Later, a batch job builds
    a report query by concatenating stored usernames into SQL. An attacker registered the
    name `x'; DROP TABLE audit;--`. What is this, and the lesson?
  options:
  - Not injection at all, because the registration insert was safely parameterized, so the stored username can be reused freely by any later query without further escaping
  - Mass assignment during registration, where the sign-up form auto-bound an attacker-supplied `role` field onto the user record and the report job merely surfaces it later
  - A padding oracle in the report job, where distinguishable decryption errors on the stored username let the attacker recover its bytes one block at a time
  - Second-order SQL injection — stored input is later concatenated unsafely by a different code path; parameterize queries everywhere, not just at the entry point, and never treat stored data as trusted
  answer: 3
  explanation: |
    Parameterizing only at the front door is insufficient: second-order (stored) SQL
    injection occurs when previously-stored input is later concatenated into a query by a
    different code path that trusts "internal" data. Every query that consumes the data —
    including background jobs and reports — must use parameterization.
  ref: concepts.md#injection-breadth-and-xss-taxonomy-a05-deep-dive
- id: owasp-top-10-walkthrough-075
  difficulty: expert
  tags:
  - a05-2025
  - dom-xss
  - trusted-types
  question: |
    A single-page app reads `location.hash` and assigns it to an element's `innerHTML`. The
    server never reflects this value. Why does server-side output encoding fail to fix it,
    and what does?
  options:
  - Server-side encoding does fix it and the report is a false positive, since the framework auto-escapes every response body before it is ever written into the page's DOM
  - It is a cross-site request forgery issue; add a synchronizer anti-CSRF token to the page so the forged hash-fragment request from another origin is rejected on submit
  - It is server-side request forgery; block the 169.254.169.254 link-local metadata endpoint so the fragment value cannot be used to reach internal cloud services
  - This is DOM-based XSS — the source (location.hash) and sink (innerHTML) are entirely client-side, so server encoding never sees the data; fix with safe DOM APIs (e.g. textContent) and enforce Trusted Types (CSP L3)
  answer: 3
  explanation: |
    In DOM-based XSS the tainted data flows from a client-side source (location.hash) into a
    dangerous client-side sink (innerHTML) without ever touching the server, so server-side
    output encoding cannot help. Use safe sinks (textContent), sanitize before insertion, and
    enforce Trusted Types (CSP Level 3) to lock down dangerous DOM sinks.
  ref: concepts.md#injection-breadth-and-xss-taxonomy-a05-deep-dive
- id: owasp-top-10-walkthrough-076
  difficulty: advanced
  tags:
  - a07-2025
  - passkeys
  - webauthn
  question: |
    Why are WebAuthn/FIDO2 passkeys considered phishing-resistant in a way that TOTP codes
    are not?
  options:
  - Passkeys work by displaying much longer numeric codes than TOTP, which are harder for a user to mistype into a fake look-alike site and easier for the server to validate
  - Passkeys expire every 30 seconds just like TOTP one-time codes but use a longer digit sequence, so a stolen value is only briefly useful to a phishing proxy
  - Passkeys are always transmitted over an encrypted TLS channel to the server, whereas TOTP codes travel in plaintext and can be read by any on-path network attacker
  - Passkey credentials are cryptographically bound to the origin (RP ID), so a look-alike phishing domain cannot elicit a usable assertion; the private key never leaves the authenticator
  answer: 3
  explanation: |
    WebAuthn ties each credential to the relying-party origin and uses public-key challenge
    -response; a phishing site on a different origin cannot obtain a valid assertion, and the
    private key never leaves the authenticator. TOTP codes are phishable — a proxy site can
    relay the code the user types. This is why AAL3 favors phishing-resistant authenticators.
  ref: concepts.md#modern-authentication-depth--passkeys-and-nist-800-63-aals-a07-deep-dive
- id: owasp-top-10-walkthrough-077
  difficulty: expert
  tags:
  - a07-2025
  - jwt-revocation
  - refresh-rotation
  question: |
    A team uses stateless access JWTs and worries a stolen token can't be revoked before it
    expires. Which design best manages this risk?
  options:
  - Set the access-token TTL to a full 30 days so users rarely have to re-authenticate, keeping the login experience smooth
  - Sign the JWT with the alg:none header so the server can freely edit claims and instantly invalidate a stolen token in place
  - Store the JWT in browser localStorage with no expiry so any tab can reuse it and the session never needs refreshing
  - Use short-lived access tokens plus refresh-token rotation with reuse detection (a replayed old refresh token revokes the whole token family)
  answer: 3
  explanation: |
    A stateless JWT cannot be easily revoked before expiry, so keep access-token TTL short
    and pair it with refresh-token rotation and reuse detection: presenting a previously-used
    (rotated-out) refresh token signals theft, so the server revokes the entire token family.
    Long TTLs and non-expiring tokens worsen the exposure window. (OAuth topic covers the flow.)
  ref: concepts.md#modern-authentication-depth--passkeys-and-nist-800-63-aals-a07-deep-dive
- id: owasp-top-10-walkthrough-078
  difficulty: advanced
  tags:
  - a07-2025
  - nist-800-63-4
  - aal
  question: |
    Per NIST SP 800-63-4, how should SMS one-time passcodes be treated as an authenticator?
  options:
  - As the strongest phishing-resistant authenticator available, fully suitable for AAL3 because the code is delivered out-of-band over the carrier's separate signaling channel
  - As completely forbidden in every case, so any system that still offers an SMS one-time passcode fails the 800-63-4 requirements outright and cannot be certified at any level
  - As a "restricted" authenticator — permitted but discouraged due to risks like SIM-swap and SS7 interception; prefer app-based or phishing-resistant authenticators
  - As equivalent in assurance to a hardware security key, since both deliver a second factor the user must physically possess in addition to their password
  answer: 2
  explanation: |
    NIST 800-63-4 classifies SMS OTP as a restricted authenticator: allowed but discouraged
    because the delivery channel is vulnerable (SIM-swap, SS7 interception, phishing).
    Higher assurance (AAL2/AAL3) favors authenticator apps and phishing-resistant hardware
    (WebAuthn/FIDO2), which are far stronger than SMS.
  ref: concepts.md#modern-authentication-depth--passkeys-and-nist-800-63-aals-a07-deep-dive
- id: owasp-top-10-walkthrough-079
  difficulty: expert
  tags:
  - a03-2025
  - dependency-confusion
  - supply-chain
  question: |
    Your build references an internal package `@acme/auth-utils` from a private registry, but
    the resolver is also configured to consult the public registry. How does a dependency
    confusion attack exploit this, and what stops it?
  options:
  - The attacker guesses the registry admin password and republishes `@acme/auth-utils` from the inside; enforce MFA on all private-registry maintainer accounts to stop it
  - The attacker floods the private registry with resolution requests until it fails over to serving a stale cached copy; add per-client rate limiting to keep the registry responsive
  - The attacker publishes a higher-version `@acme/auth-utils` on the public registry; the resolver prefers the higher version and pulls the attacker's package — stop it with scoped/namespaced packages pinned to the private registry, version/host pinning, and reserving the name publicly
  - The attacker downgrades the TLS connection to the registry and swaps the tarball in transit on the wire; enforce HSTS so the client always negotiates HTTPS and blocks the strip
  answer: 2
  explanation: |
    Dependency confusion (Alex Birsan, 2021) abuses resolvers that consult a public registry
    alongside a private one: publishing a same-named package with a higher version on the
    public registry causes the attacker's code to be pulled. Defenses include scope/namespace
    binding to the private registry, explicit registry/version pinning, and registering your
    internal names publicly so they can't be squatted.
  ref: concepts.md#supply-chain-defense-internals--slsa-sbom-provenance-dependency-confusion-a032025-deep-dive
- id: owasp-top-10-walkthrough-080
  difficulty: expert
  tags:
  - a03-2025
  - slsa
  - sbom
  - provenance
  question: |
    A compliance reviewer asks you to distinguish an SBOM from build provenance and from
    SLSA. Which explanation is correct?
  options:
  - They are three interchangeable names for the same signed manifest that a build emits, differing only in which tool consumes it downstream
  - SLSA is a runtime dependency scanner, an SBOM is a network firewall rule that blocks untrusted registries, and provenance is a password-rotation policy for build agents
  - An SBOM (SPDX/CycloneDX) is the inventory of what you ship; provenance is a signed attestation of how/where an artifact was built; SLSA is a framework of levels that raise build-integrity and provenance guarantees
  - Provenance is simply the list of your project's dependencies, while an SBOM is the cryptographic signature that attests to the identity of your build server
  answer: 2
  explanation: |
    An SBOM (SPDX or CycloneDX) is the bill of materials — what components are in the
    artifact. Provenance is a signed attestation of how and where the artifact was built
    (e.g. via in-toto/Sigstore). SLSA (slsa.dev) is a maturity framework of levels that
    strengthen build integrity and provenance. VEX complements the SBOM by stating whether a
    listed component's vuln is actually exploitable.
  ref: concepts.md#supply-chain-defense-internals--slsa-sbom-provenance-dependency-confusion-a032025-deep-dive
- id: owasp-top-10-walkthrough-081
  difficulty: advanced
  tags:
  - a03-2025
  - reachability
  - sca
  question: |
    An SCA tool flags 40 vulnerable transitive dependencies, but your team is overwhelmed.
    Which insight best focuses remediation without ignoring real risk?
  options:
  - Ignore all transitive dependencies outright, since you never added them to your manifest directly and are therefore not responsible for the code paths they introduce
  - Delete or stop generating the SBOM so the composition scanner has no inventory to match against and the 40 findings simply disappear from the dashboard
  - Prioritize vulnerabilities whose vulnerable functions are actually reachable/called by your code, while still keeping the inventory current and pinning versions with hash verification
  - Fix only the vulnerabilities carrying the lowest CVSS base scores first, on the theory that clearing the easy low-severity items quickly reduces the raw open-finding count
  answer: 2
  explanation: |
    Reachability analysis distinguishes vulnerable dependencies whose flawed code paths are
    actually invoked from those that are merely present, letting teams prioritize real
    exposure. It complements (does not replace) a current inventory/SBOM and lockfile pinning
    with hash verification. Ignoring transitive deps or deleting the SBOM increases risk.
  ref: concepts.md#supply-chain-defense-internals--slsa-sbom-provenance-dependency-confusion-a032025-deep-dive
- id: owasp-top-10-walkthrough-082
  difficulty: intermediate
  tags:
  - 2025-edition
  - methodology
  - survey
  question: |
    Which statement about the OWASP Top 10:2025 methodology is correct?
  options:
  - It abandoned the community survey entirely and now selects all ten categories 100% from contributed vulnerability data with no human judgment applied
  - It ranked the categories purely by raw finding counts contributed by a single security vendor, dropping the per-application incidence-rate weighting used in prior editions
  - It still uses "8 from data, 2 from community survey," drew on roughly 2.8 million applications, and its two survey picks were Software Supply Chain Failures and Security Logging & Alerting Failures
  - It analyzed a far smaller pool of CWEs than the 2021 edition, narrowing the mapping to only the handful of weaknesses that appeared in every contributed data set
  answer: 2
  explanation: |
    The 2025 edition keeps the data-informed model: 8 categories from contributed data
    (~2.8M applications, 589 CWEs analyzed, 248 mapped into the final ten) and 2 from the
    community survey — Software Supply Chain Failures and Security Logging & Alerting Failures.
    It remains "data-informed, not blindly data-driven."
  ref: concepts.md#the-2025-edition--what-changed-from-2021
