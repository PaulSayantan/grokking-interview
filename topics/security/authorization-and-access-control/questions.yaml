topic: "Authorization & Access Control Models"
domain: security
topic_slug: authorization-and-access-control
version: 1
questions:
  - id: authorization-and-access-control-001
    difficulty: beginner
    tags: [authn-vs-authz, fundamentals]
    question: |
      In one sentence, what is the difference between authentication and
      authorization?
    options:
      - "Authentication decides what you may do; authorization proves who you are"
      - "Authentication proves who you are; authorization decides what you may do"
      - "They are two names for the same identity-verification step"
      - "Authentication applies to users while authorization applies only to services"
    answer: 1
    explanation: |
      Authentication (AuthN) establishes and verifies identity ("who are you?").
      Authorization (AuthZ) decides whether that identified principal may perform an
      action on a resource ("what may you do?"). AuthN happens first and produces the
      identity that AuthZ consumes.
    ref: "concepts.md#authorization-versus-authentication"

  - id: authorization-and-access-control-002
    difficulty: beginner
    tags: [authn-vs-authz, http-status]
    question: |
      A logged-in user with a valid session requests a page they are not permitted to
      view. Which HTTP status code most correctly signals "I know who you are, but you
      still may not do this"?
    options:
      - "401 Unauthorized"
      - "400 Bad Request"
      - "403 Forbidden"
      - "302 Found"
    answer: 2
    explanation: |
      403 Forbidden means the request is understood and the caller is authenticated, but
      authorization was denied. 401 (misnamed "Unauthorized") actually means
      *unauthenticated* — authenticate first.
    ref: "concepts.md#authorization-versus-authentication"

  - id: authorization-and-access-control-003
    difficulty: intermediate
    tags: [authn-vs-authz, tokens]
    question: |
      Why is "the request carries a valid, unexpired JWT" NOT sufficient to allow access
      to `GET /orders/57231`?
    options:
      - "A valid token only proves authentication; whether this user owns order 57231 is a separate authorization decision"
      - "JWTs cannot be used for authorization, only for authentication of services"
      - "The token must be re-signed by the resource server before it is trusted"
      - "Because 57231 is a sequential ID, which automatically makes the request invalid"
    answer: 0
    explanation: |
      A valid token means AuthN passed and yields trusted claims. Whether this specific
      principal is allowed to act on this specific object is an authorization check the
      server must still perform (ownership/scoping). Skipping it is exactly IDOR/BOLA.
    ref: "concepts.md#authorization-versus-authentication"

  - id: authorization-and-access-control-004
    difficulty: beginner
    tags: [dac, models]
    question: |
      Unix file permissions where the file's owner uses `chmod` to grant read access to
      others are an example of which access control model?
    options:
      - "Discretionary Access Control (DAC)"
      - "Mandatory Access Control (MAC)"
      - "Attribute-Based Access Control (ABAC)"
      - "Relationship-Based Access Control (ReBAC)"
    answer: 0
    explanation: |
      In DAC the resource owner decides, at their discretion, who else may access it.
      chmod/ACLs and "share this document" features are canonical DAC.
    ref: "concepts.md#access-control-models-overview-dac-and-mac"

  - id: authorization-and-access-control-005
    difficulty: intermediate
    tags: [mac, models, bell-lapadula]
    question: |
      Which statement best characterizes Mandatory Access Control (MAC)?
    options:
      - "Each resource owner grants and revokes access to their own resources"
      - "Access is computed from arbitrary subject and resource attributes at request time"
      - "A central authority assigns security labels and users cannot override the policy"
      - "Access follows relationship tuples in a graph, as in Google Zanzibar"
    answer: 2
    explanation: |
      MAC is enforced by a central authority via security labels (e.g., Unclassified <
      Secret < Top Secret) that users cannot override. Bell–LaPadula and Biba are the
      classic MAC models; SELinux/AppArmor are MAC-style enforcement.
    ref: "concepts.md#access-control-models-overview-dac-and-mac"

  - id: authorization-and-access-control-006
    difficulty: intermediate
    tags: [dac, mac, comparison]
    question: |
      What is the primary security weakness of DAC compared to MAC?
    options:
      - "DAC is too rigid and imposes heavy administrative overhead"
      - "DAC cannot express roles or permissions at all"
      - "Owners can widen access at will, so permissions sprawl and a compromised user can leak data"
      - "DAC requires a distributed graph store to evaluate decisions"
    answer: 2
    explanation: |
      Because owners grant access at their discretion, DAC tends toward permission sprawl,
      and a careless or compromised owner (or a trojan running as them) can widen or leak
      access. MAC is rigid but users can't override the mandated policy.
    ref: "concepts.md#access-control-models-overview-dac-and-mac"

  - id: authorization-and-access-control-007
    difficulty: beginner
    tags: [rbac, models]
    question: |
      In classic RBAC, how do users obtain permissions?
    options:
      - "Permissions are assigned directly to each user individually"
      - "Permissions are derived from resource attributes evaluated at request time"
      - "Permissions are granted by whichever user owns the resource"
      - "Users inherit permissions by being assigned to roles that bundle those permissions"
    answer: 3
    explanation: |
      RBAC assigns permissions to roles and roles to users; users never get permissions
      directly. This scales administration and audits cleanly ("who has admin?").
    ref: "concepts.md#role-based-access-control-rbac"

  - id: authorization-and-access-control-008
    difficulty: intermediate
    tags: [rbac, role-vs-permission]
    question: |
      What is the difference between a role and a permission in RBAC?
    options:
      - "A permission is an atomic allowed action; a role is a reusable named set of permissions"
      - "A role is an atomic allowed action; a permission is a bundle of roles"
      - "They are synonyms; the terms are interchangeable"
      - "A role applies to resources and a permission applies to environments"
    answer: 0
    explanation: |
      A permission is an atomic allowed operation on a resource (e.g., `invoice:approve`).
      A role is a reusable named bundle of permissions assigned to users. Code should check
      permissions/capabilities, not role names, so roles can be reshuffled without code
      changes.
    ref: "concepts.md#role-based-access-control-rbac"

  - id: authorization-and-access-control-009
    difficulty: intermediate
    tags: [rbac, role-explosion]
    question: |
      A team keeps creating roles like `accountant_us_west_readonly_2024` and
      `accountant_eu_readwrite_2025`. What does this "role explosion" usually indicate?
    options:
      - "The RBAC implementation is broken and should be replaced with DAC"
      - "Roles should be assigned directly as permissions to avoid bundling"
      - "Access rules depend on context (region, department, time), which suggests ABAC/ReBAC is a better fit"
      - "The system needs more roles, not fewer, to be secure"
    answer: 2
    explanation: |
      Combinatorial role names are the classic smell that access depends on dynamic
      attributes/context. That's exactly what ABAC (attribute/policy) — or ReBAC for
      relationship-driven cases — expresses without exploding the role count.
    ref: "concepts.md#role-based-access-control-rbac"

  - id: authorization-and-access-control-010
    difficulty: advanced
    tags: [rbac, code-smell, best-practice]
    question: |
      Which check in application code is the more maintainable RBAC practice?
    options:
      - "`if user.role == 'admin'` scattered across every handler"
      - "`if 'admin' in request.headers['X-Roles']` from a client-supplied header"
      - "`if user.isAdmin` set from the profile-update request body"
      - "`if user.can('document:delete')` — checking a capability/permission, not a role name"
    answer: 3
    explanation: |
      Checking a permission/capability (`user.can('document:delete')`) decouples code from
      role naming, so roles can be re-shuffled without touching code. Trusting a
      client-supplied header or body field is a privilege-escalation vector.
    ref: "concepts.md#role-based-access-control-rbac"

  - id: authorization-and-access-control-011
    difficulty: intermediate
    tags: [abac, models]
    question: |
      Which of the following is the defining characteristic of ABAC?
    options:
      - "Decisions evaluate attributes of subject, resource, action, and environment against policies"
      - "Decisions are based on the caller's assigned role only"
      - "Decisions traverse a graph of relationship tuples"
      - "The resource owner grants access at their discretion"
    answer: 0
    explanation: |
      ABAC (NIST SP 800-162, XACML) decides by evaluating subject/resource/action/
      environment attributes against policies — enabling dynamic, context-dependent rules
      that RBAC can't express without role explosion.
    ref: "concepts.md#attribute-based-access-control-abac"

  - id: authorization-and-access-control-012
    difficulty: intermediate
    tags: [abac, environment-attributes]
    question: |
      "Permit `approve` on an invoice only during business hours, from a corporate IP,
      if the user completed MFA." Which ABAC attribute category do "business hours,"
      "corporate IP," and "MFA completed" belong to?
    options:
      - "Subject attributes"
      - "Resource attributes"
      - "Environment (contextual) attributes"
      - "Action attributes"
    answer: 2
    explanation: |
      Time of day, source IP/geo, device posture, and MFA-completed status are environment
      (contextual) attributes in ABAC — properties of the moment/context rather than of the
      subject or resource.
    ref: "concepts.md#attribute-based-access-control-abac"

  - id: authorization-and-access-control-013
    difficulty: advanced
    tags: [abac, tradeoffs]
    question: |
      Which is a genuine drawback of ABAC compared to RBAC?
    options:
      - "ABAC cannot express context-dependent rules"
      - "ABAC requires assigning permissions directly to each user"
      - "ABAC makes 'who can access resource X?' (reverse queries) and auditing harder, and depends on trustworthy attribute sources"
      - "ABAC can only be used with MAC-style security labels"
    answer: 2
    explanation: |
      ABAC's flexibility costs analyzability: reverse queries ("who can access X?") and
      audit/testing are harder, and a spoofable attribute (e.g., a client-supplied
      `isAdmin`) becomes an escalation vector. Attribute sourcing must be trustworthy.
    ref: "concepts.md#attribute-based-access-control-abac"

  - id: authorization-and-access-control-014
    difficulty: intermediate
    tags: [rebac, zanzibar, models]
    question: |
      A "Google Docs-style" sharing system where "Alice can edit doc123 because she's in
      group-eng, and group-eng is an editor of the folder containing doc123" is best
      modeled by which paradigm?
    options:
      - "MAC with security labels"
      - "DAC via chmod bits"
      - "Static RBAC roles with no hierarchy"
      - "ReBAC — relationship-based access control (graph reachability)"
    answer: 3
    explanation: |
      Relationship-driven access with nested groups and inheritance is a graph-reachability
      problem — exactly ReBAC (popularized by Google Zanzibar; OpenFGA/SpiceDB/Ory Keto
      implement it).
    ref: "concepts.md#relationship-based-access-control-rebac-and-google-zanzibar"

  - id: authorization-and-access-control-015
    difficulty: advanced
    tags: [zanzibar, relation-tuples]
    question: |
      In Google Zanzibar, what does a relation tuple like `doc:readme#viewer@user:anne`
      express?
    options:
      - "anne owns the document readme and may delete it"
      - "anne has the `viewer` relation on the object `doc:readme`"
      - "the document readme should be replicated to anne's region"
      - "anne's session token is valid for viewing readme"
    answer: 1
    explanation: |
      A Zanzibar relation tuple `⟨object#relation@user⟩` records that a subject has a
      relation to an object. Here anne is a `viewer` of `doc:readme`. Userset rewrites let
      relations reference groups and imply other relations (e.g., editor ⇒ viewer).
    ref: "concepts.md#relationship-based-access-control-rebac-and-google-zanzibar"

  - id: authorization-and-access-control-016
    difficulty: advanced
    tags: [zanzibar, consistency, zookie]
    question: |
      What problem do Zanzibar "zookies" (consistency tokens) primarily solve?
    options:
      - "Compressing relation tuples to save storage"
      - "Encrypting tuples at rest in Spanner"
      - "The 'new enemy' problem — ensuring a permission check reflects an ACL update at least as fresh as a prior state, preventing stale-replica leaks"
      - "Rate-limiting how often clients may query the PDP"
    answer: 2
    explanation: |
      Zookies are consistency tokens that guarantee a check observes ACL data at least as
      fresh as some prior point, preventing races where a just-revoked user still sees data
      from a stale replica (the "new enemy" problem).
    ref: "concepts.md#relationship-based-access-control-rebac-and-google-zanzibar"

  - id: authorization-and-access-control-017
    difficulty: beginner
    tags: [least-privilege, principles]
    question: |
      What does the principle of least privilege state?
    options:
      - "Every principal should have only the minimum privileges needed to do its job, for the shortest time needed"
      - "Every principal should hold the maximum privileges it might ever need, to avoid outages"
      - "Only administrators should have any privileges at all"
      - "Privileges should be granted by resource owners at their discretion"
    answer: 0
    explanation: |
      Least privilege (Saltzer & Schroeder, 1975) means granting the minimum rights needed,
      for the minimum time, to shrink blast radius when a credential leaks or a component is
      compromised.
    ref: "concepts.md#principle-of-least-privilege"

  - id: authorization-and-access-control-018
    difficulty: intermediate
    tags: [least-privilege, blast-radius]
    question: |
      Why is least privilege valuable even if you trust all your users and services?
    options:
      - "It makes the code run faster"
      - "It eliminates the need for authentication"
      - "It shrinks the blast radius: when a credential leaks or a component is compromised, damage is bounded by what that principal could do"
      - "It guarantees no vulnerabilities can ever exist"
    answer: 2
    explanation: |
      Least privilege assumes compromise is inevitable. By bounding each principal's rights,
      a leaked key or exploited component can only reach a limited set of resources —
      containing the damage.
    ref: "concepts.md#principle-of-least-privilege"

  - id: authorization-and-access-control-019
    difficulty: intermediate
    tags: [least-privilege, iam, antipattern]
    question: |
      Which practice most directly VIOLATES least privilege?
    options:
      - "Issuing a read-only widget an access token scoped to `read:profile`"
      - "Creating per-service DB users limited to the tables they need"
      - "Granting time-boxed just-in-time admin access with approval"
      - "Attaching a wildcard `Action: *` / `*:*` grant 'temporarily' and never tightening it"
    answer: 3
    explanation: |
      Wildcard grants and standing admin are the most common least-privilege failures —
      they hand a principal far more than it needs and dramatically enlarge blast radius.
      Scoped tokens, per-service users, and JIT elevation all uphold least privilege.
    ref: "concepts.md#principle-of-least-privilege"

  - id: authorization-and-access-control-020
    difficulty: beginner
    tags: [privilege-escalation, horizontal-vertical]
    question: |
      User 1001 changes the URL from `/users/1001/invoices` to `/users/1002/invoices` and
      views another customer's invoices. What kind of privilege escalation is this?
    options:
      - "Horizontal escalation"
      - "Vertical escalation"
      - "Mandatory escalation"
      - "No escalation — it's a normal read"
    answer: 0
    explanation: |
      Accessing another user's data at the same privilege level is horizontal escalation
      (the IDOR/BOLA family). Vertical escalation would be gaining a higher privilege level,
      such as invoking an admin function.
    ref: "concepts.md#privilege-escalation-horizontal-versus-vertical"

  - id: authorization-and-access-control-021
    difficulty: intermediate
    tags: [privilege-escalation, vertical, mass-assignment]
    question: |
      A regular user sends a profile-update request containing `"role":"admin"` and the
      server persists it, giving them admin rights. This is:
    options:
      - "Horizontal escalation via IDOR"
      - "A confused deputy attack"
      - "A TOCTOU race condition"
      - "Vertical escalation via mass assignment / trusting client-supplied privilege data"
    answer: 3
    explanation: |
      Gaining a higher privilege level is vertical escalation. Trusting a client-supplied
      `role`/`isAdmin` field (mass assignment) is a classic vector — the server must never
      derive privilege from the request body.
    ref: "concepts.md#privilege-escalation-horizontal-versus-vertical"

  - id: authorization-and-access-control-022
    difficulty: intermediate
    tags: [privilege-escalation, defense]
    question: |
      Which combination best defends against both horizontal and vertical escalation?
    options:
      - "Hide privileged buttons in the UI and use unguessable resource IDs"
      - "Enforce authorization on every request using server-side identity, checking both object ownership and required capability, and deny by default"
      - "Return 200 for all requests and log anomalies for later review"
      - "Rely on the client to send only requests the user is allowed to make"
    answer: 1
    explanation: |
      You must check both object ownership (horizontal) and required capability/role
      (vertical), using identity taken from the session/token server-side, on every request,
      denying by default. UI hiding and unguessable IDs are not authorization.
    ref: "concepts.md#privilege-escalation-horizontal-versus-vertical"

  - id: authorization-and-access-control-023
    difficulty: beginner
    tags: [bola, idor, owasp-api]
    question: |
      What does IDOR / BOLA stand for and which OWASP list ranks it #1?
    options:
      - "Insecure Direct Object Reference / Broken Object Level Authorization — #1 in the OWASP API Security Top 10 (2023)"
      - "Invalid Data Object Response / Broken Origin Level Access — #1 in the OWASP Web Top 10"
      - "Indirect Data Ownership Rule / Basic Object Login Access — a CORS issue"
      - "Injection of Dangerous Object References — an injection subclass"
    answer: 0
    explanation: |
      Insecure Direct Object Reference (IDOR) / Broken Object Level Authorization (BOLA) is
      failing to verify the caller may act on the specific object. It is API1:2023, the #1
      OWASP API Security risk, and part of A01:2021 Broken Access Control.
    ref: "concepts.md#bola-and-idor-broken-object-level-authorization"

  - id: authorization-and-access-control-024
    difficulty: intermediate
    tags: [bola, idor, fix]
    question: |
      An endpoint runs `order = db.orders.find(id=request.params["id"])` and returns it
      after only checking the user is logged in. What is the correct fix?
    options:
      - "Switch the ID from an integer to a random UUID and keep the query as-is"
      - "Add a client-side check that hides orders belonging to other users"
      - "Scope the query to the authenticated caller, e.g. `find(id=..., owner_id=current_user.id)`, and return 404 if no match"
      - "Rate-limit the endpoint to slow down enumeration"
    answer: 2
    explanation: |
      The fix is a per-object authorization check bound to server-side identity — ideally by
      scoping the query (`WHERE owner_id = :me`) so "not yours" and "not found" collapse.
      UUIDs, client-side hiding, and rate limits are not authorization.
    ref: "concepts.md#bola-and-idor-broken-object-level-authorization"

  - id: authorization-and-access-control-025
    difficulty: intermediate
    tags: [bola, uuid, defense-in-depth]
    question: |
      Why is switching resource IDs to random UUIDs NOT a sufficient defense against IDOR?
    options:
      - "UUIDs are too long to fit in a URL"
      - "Unguessable is not the same as authorized; IDs leak via URLs, logs, and other endpoints, and authorization is still required"
      - "UUIDs are always predictable in practice"
      - "UUIDs break database indexing so the query fails"
    answer: 1
    explanation: |
      Random UUIDs are defense-in-depth against enumeration, not authorization. IDs leak in
      URLs, referrers, logs, and other API responses; the server must still verify the caller
      is allowed to access the specific object.
    ref: "concepts.md#bola-and-idor-broken-object-level-authorization"

  - id: authorization-and-access-control-026
    difficulty: advanced
    tags: [bola, waf, detection]
    question: |
      Why do WAFs and generic vulnerability scanners typically fail to detect BOLA?
    options:
      - "BOLA only occurs over HTTP/2, which WAFs cannot parse"
      - "The request is perfectly well-formed with a valid ID and token — only your business logic knows the caller doesn't own that object"
      - "WAFs block all requests containing numeric IDs by default"
      - "Scanners cannot send authenticated requests at all"
    answer: 1
    explanation: |
      BOLA requests are legitimate and syntactically valid; nothing in the payload signals
      abuse. Only the application's own ownership rules know user 1001 doesn't own order
      57231, which is why BOLA needs per-object-type test coverage rather than a WAF.
    ref: "concepts.md#bola-and-idor-broken-object-level-authorization"

  - id: authorization-and-access-control-027
    difficulty: beginner
    tags: [bfla, owasp-api]
    question: |
      BFLA (Broken Function Level Authorization) is best described as:
    options:
      - "Invoking a function/operation (often admin-only) that the caller is not authorized to call"
      - "Accessing another user's object at the same privilege level"
      - "Leaking data through a stale cache"
      - "Sending a request with a forged Origin header"
    answer: 0
    explanation: |
      BFLA (API5:2023) is calling a function/operation the caller may not invoke — typically
      privileged/admin endpoints missing a role check. It is a vertical escalation; BOLA is
      the object-level, horizontal counterpart.
    ref: "concepts.md#bfla-broken-function-level-authorization"

  - id: authorization-and-access-control-028
    difficulty: intermediate
    tags: [bfla, obscurity]
    question: |
      An admin-only endpoint is "protected" only by not rendering its button in the UI; it
      merely checks that the caller is authenticated. Why is this insecure?
    options:
      - "Because the endpoint uses HTTP instead of HTTPS"
      - "Because authenticated users are automatically admins"
      - "It is actually secure as long as the button is hidden"
      - "Because attackers can read the JS bundle or guess the route and call the API directly; hiding the UI is not authorization"
    answer: 3
    explanation: |
      Security through obscurity fails: the endpoint still exists and attackers call it
      directly (from the JS bundle or by guessing routes). Privileged functions need an
      enforced capability/role check at the function boundary, deny-by-default.
    ref: "concepts.md#bfla-broken-function-level-authorization"

  - id: authorization-and-access-control-029
    difficulty: intermediate
    tags: [bfla, method-gap]
    question: |
      A team protects `GET /api/users/{id}` with an admin check but forgets it on
      `DELETE /api/users/{id}`, and legacy `/api/v1` lacks the check entirely. What lesson
      does this illustrate for BFLA defense?
    options:
      - "Only GET requests need authorization"
      - "Authorization must cover all HTTP methods and all API versions for every resource, ideally via centralized middleware"
      - "DELETE should be disabled across the whole API"
      - "Legacy API versions are automatically secure"
    answer: 1
    explanation: |
      Function-level checks must cover every method (GET/POST/PUT/DELETE) and every API
      version. Centralizing enforcement in middleware/policy — rather than per-handler —
      prevents these easy-to-forget gaps, with deny-by-default for unlisted routes.
    ref: "concepts.md#bfla-broken-function-level-authorization"

  - id: authorization-and-access-control-030
    difficulty: intermediate
    tags: [bola, bfla, comparison]
    question: |
      Which pairing correctly maps the vulnerability to its escalation direction?
    options:
      - "BOLA = vertical escalation; BFLA = horizontal escalation"
      - "BOLA = horizontal (wrong object); BFLA = vertical (wrong function)"
      - "Both BOLA and BFLA are horizontal escalation"
      - "Both BOLA and BFLA are vertical escalation"
    answer: 1
    explanation: |
      BOLA/IDOR is accessing the wrong object at the same level (horizontal); BFLA is calling
      a higher-privilege function (vertical). Fix BOLA with per-object ownership checks and
      BFLA with per-function capability checks.
    ref: "concepts.md#bfla-broken-function-level-authorization"

  - id: authorization-and-access-control-031
    difficulty: beginner
    tags: [deny-by-default, principles]
    question: |
      What does "deny by default" (fail-safe defaults) mean in access control?
    options:
      - "The default answer is deny; access is granted only by an explicit matching rule, and errors are treated as denied"
      - "Access is granted unless a rule explicitly denies it"
      - "All requests are logged but always allowed"
      - "Only the resource owner is ever denied"
    answer: 0
    explanation: |
      Deny by default (Saltzer & Schroeder's fail-safe defaults) means the base state is
      "deny," access requires an explicit grant, and if a check errors/times out you fail
      closed (treat as denied), not open.
    ref: "concepts.md#deny-by-default-fail-closed"

  - id: authorization-and-access-control-032
    difficulty: intermediate
    tags: [deny-by-default, fail-open, antipattern]
    question: |
      Consider: `try { checkAccess() } catch (e) { /* proceed anyway */ }`. What is wrong
      with it?
    options:
      - "Nothing — swallowing the error keeps the service available"
      - "It fails closed, which is too strict"
      - "It fails open: an error in the authorization check results in access being granted"
      - "It only affects GET requests"
    answer: 2
    explanation: |
      Catching the authz exception and proceeding "fails open" — any error grants access.
      Secure design fails closed: if the decision can't be made, deny. Availability concerns
      don't justify granting access on error.
    ref: "concepts.md#deny-by-default-fail-closed"

  - id: authorization-and-access-control-033
    difficulty: intermediate
    tags: [deny-by-default, allowlist-vs-denylist]
    question: |
      Why does secure access control prefer allowlists over denylists?
    options:
      - "Allowlists are shorter to write in every case"
      - "Denylists cannot be expressed in policy engines"
      - "Allowlists remove the need for authentication"
      - "Denylists are always incomplete — the case you didn't think of falls through and is allowed; allowlists make the unanticipated case deny"
    answer: 3
    explanation: |
      A denylist can never enumerate every dangerous case, so an unforeseen request slips
      through as allowed. An allowlist makes the absence of an explicit grant mean deny —
      aligning with fail-safe defaults.
    ref: "concepts.md#deny-by-default-fail-closed"

  - id: authorization-and-access-control-034
    difficulty: intermediate
    tags: [pep-pdp, architecture]
    question: |
      In the PEP/PDP model, what is the role of the Policy Enforcement Point (PEP)?
    options:
      - "It stores and evaluates the policy rules"
      - "It sits in the request path, asks the PDP for a decision, and enforces the allow/deny result"
      - "It authors and manages the policies"
      - "It supplies additional attributes needed to evaluate a decision"
    answer: 1
    explanation: |
      The PEP intercepts the request (middleware/gateway/sidecar), queries the PDP ("may this
      happen?"), and enforces the returned decision. The PDP evaluates the rules; the PAP
      manages them; the PIP supplies extra attributes.
    ref: "concepts.md#centralized-policy-pep-pdp-and-oparego"

  - id: authorization-and-access-control-035
    difficulty: intermediate
    tags: [pep-pdp, opa, rego]
    question: |
      What is Open Policy Agent (OPA)?
    options:
      - "A general-purpose Policy Decision Point that evaluates policies written in the declarative Rego language, often deployed as a sidecar"
      - "A password-hashing library"
      - "A WAF that blocks IDOR requests"
      - "A Zanzibar-style relationship-tuple store"
    answer: 0
    explanation: |
      OPA is a general-purpose PDP that evaluates Rego policies and returns decisions via API
      (commonly a sidecar, e.g., for Kubernetes admission control). It decouples policy from
      code so rules are versioned, tested, and audited centrally.
    ref: "concepts.md#centralized-policy-pep-pdp-and-oparego"

  - id: authorization-and-access-control-036
    difficulty: advanced
    tags: [pep-pdp, availability, fail-closed]
    question: |
      A microservice's PEP calls a centralized PDP on every request. The PDP becomes
      unreachable. What should the PEP do to stay secure?
    options:
      - "Allow all requests until the PDP recovers to preserve availability"
      - "Randomly allow half the requests"
      - "Skip authorization entirely for admin routes"
      - "Fail closed — deny requests it cannot get a decision for (optionally with a short-lived cached decision)"
    answer: 3
    explanation: |
      Centralizing on a PDP adds a hot-path dependency, so it must fail closed: if no
      decision can be obtained, deny. Caching recent decisions can soften availability
      impact, but the unreachable-PDP default must be "deny," not "allow."
    ref: "concepts.md#centralized-policy-pep-pdp-and-oparego"

  - id: authorization-and-access-control-037
    difficulty: advanced
    tags: [pep-pdp, tradeoffs]
    question: |
      Which is a genuine trade-off of centralizing authorization in a PDP rather than
      hand-coding checks in each service?
    options:
      - "It makes policies impossible to audit"
      - "It adds a hot-path dependency (latency/availability) and a bug in central policy affects everything at once"
      - "It forces you to abandon RBAC entirely"
      - "It prevents you from ever using attributes in decisions"
    answer: 1
    explanation: |
      Centralization gains consistency, auditability, and testability, but the PDP is now on
      the critical path (latency/availability, must fail closed) and a single policy bug has
      blast radius across all services. Relationship-heavy checks may still need a Zanzibar
      store.
    ref: "concepts.md#centralized-policy-pep-pdp-and-oparego"

  - id: authorization-and-access-control-038
    difficulty: intermediate
    tags: [confused-deputy, ssrf]
    question: |
      Why is SSRF (Server-Side Request Forgery) described as a "confused deputy" attack?
    options:
      - "The attacker directly connects to the internal network"
      - "The server misuses its own network authority on the attacker's behalf, reaching internal targets the attacker cannot"
      - "The attacker confuses the DNS resolver into caching bad records"
      - "The database is tricked into running attacker SQL"
    answer: 1
    explanation: |
      In SSRF the server is the confused deputy: it has legitimate access to internal
      services (e.g., the metadata endpoint), and the attacker tricks it into fetching an
      attacker-chosen URL, borrowing the server's ambient authority/network position.
    ref: "concepts.md#the-confused-deputy-problem"

  - id: authorization-and-access-control-039
    difficulty: intermediate
    tags: [confused-deputy, csrf]
    question: |
      In a CSRF attack, which component acts as the confused deputy?
    options:
      - "The victim's browser, which holds the session cookie and is tricked into sending an authenticated state-changing request"
      - "The database server"
      - "The attacker's own server"
      - "The TLS terminator"
    answer: 0
    explanation: |
      CSRF's deputy is the victim's browser: it carries the victim's session cookie
      (authority) and a malicious page confuses it into sending an authenticated request the
      user never intended. Anti-CSRF tokens and SameSite cookies constrain it.
    ref: "concepts.md#the-confused-deputy-problem"

  - id: authorization-and-access-control-040
    difficulty: advanced
    tags: [confused-deputy, ambient-authority, defense]
    question: |
      What is the root cause behind confused-deputy attacks, and a principled defense?
    options:
      - "Weak passwords; enforce longer passwords"
      - "Ambient authority — the deputy acts with its own privileges decoupled from the requester's intent; defend by passing capabilities/handles so authority travels with the request"
      - "Missing TLS; enforce HTTPS everywhere"
      - "Slow databases; add caching"
    answer: 1
    explanation: |
      The core issue is ambient authority: the deputy uses its own rights regardless of what
      the requester was actually authorized for. Capability/handle-passing (and on-behalf-of
      tokens, RFC 8693) tie the authority to the specific request/resource.
    ref: "concepts.md#the-confused-deputy-problem"

  - id: authorization-and-access-control-041
    difficulty: intermediate
    tags: [toctou, race-condition]
    question: |
      What is a TOCTOU (time-of-check to time-of-use) vulnerability?
    options:
      - "A flaw where a token expires before it is used"
      - "A misconfiguration of the system clock"
      - "A race condition where state validated at check time changes before use time, so the check no longer holds"
      - "A cross-origin request that bypasses CORS"
    answer: 2
    explanation: |
      TOCTOU (CWE-367) is an atomicity failure between "verify allowed/valid" and "act": the
      relevant state (a file path, a balance, a permission) changes between the two, so the
      action runs under conditions the check never approved.
    ref: "concepts.md#toctou-time-of-check-to-time-of-use-race-conditions"

  - id: authorization-and-access-control-042
    difficulty: advanced
    tags: [toctou, double-spend, defense]
    question: |
      Two concurrent withdrawal requests each check `balance >= amount`, both pass, and both
      debit — driving the account negative. Which fix best prevents this TOCTOU double-spend?
    options:
      - "Add a client-side confirmation dialog before withdrawal"
      - "Increase the server's memory so requests run faster"
      - "Cache the balance so both requests read the same value"
      - "Make check-and-act atomic, e.g. a conditional update `UPDATE ... SET balance = balance - :amt WHERE id = :id AND balance >= :amt` (or row lock / optimistic concurrency)"
    answer: 3
    explanation: |
      The defense is atomicity: fold the check into the write with a conditional/CAS update,
      or use `SELECT ... FOR UPDATE`/transactions/optimistic version numbers, plus idempotency
      keys. Caching the balance makes the race worse.
    ref: "concepts.md#toctou-time-of-check-to-time-of-use-race-conditions"

  - id: authorization-and-access-control-043
    difficulty: advanced
    tags: [toctou, filesystem, symlink]
    question: |
      A privileged program calls `access(path)` to check permission, then `open(path)` to
      read the file, and an attacker swaps `path` to a symlink in between. Besides
      transactions, what technique specifically defeats this file-race?
    options:
      - "Sleeping for a random interval between check and use"
      - "Operating on a stable handle (open file descriptor) rather than re-resolving the path/name"
      - "Reading the file twice and comparing the contents"
      - "Renaming the file to a UUID before opening it"
    answer: 1
    explanation: |
      The race exists because the name/path is re-resolved between check and use. Using a
      handle (an open file descriptor obtained once and then checked/used) removes the
      re-resolution window and defeats symlink swaps.
    ref: "concepts.md#toctou-time-of-check-to-time-of-use-race-conditions"

  - id: authorization-and-access-control-044
    difficulty: intermediate
    tags: [multi-tenancy, isolation]
    question: |
      In a "pool" multi-tenancy model (shared tables with a `tenant_id` column), what is the
      most critical rule to prevent cross-tenant data leakage?
    options:
      - "Scope every query by the tenant_id derived from the authenticated context, ideally enforced below the app layer (e.g., Row-Level Security)"
      - "Encrypt the tenant_id column"
      - "Give each tenant its own subdomain"
      - "Sort query results by tenant_id"
    answer: 0
    explanation: |
      In the pool model, every query must be constrained by the authenticated tenant. A
      single forgotten `WHERE tenant_id = :ctx` leaks across tenants — so enforce it below
      the app layer (RLS, an un-bypassable query scope) where possible.
    ref: "concepts.md#multi-tenancy-isolation"

  - id: authorization-and-access-control-045
    difficulty: intermediate
    tags: [multi-tenancy, client-supplied-id]
    question: |
      A multi-tenant API determines the tenant from a client-supplied `X-Tenant-Id` header.
      Why is this dangerous?
    options:
      - "Headers are always stripped by proxies"
      - "It makes requests larger and slower"
      - "An attacker simply changes the header to another tenant's id and reads their data; tenant must be bound to the authenticated identity server-side"
      - "It is safe as long as the header is base64-encoded"
    answer: 2
    explanation: |
      Trusting a client-controlled tenant identifier is BOLA at the org scale — the attacker
      just changes it. Derive the tenant from the verified session/token server-side, never
      from a header or query parameter the client controls.
    ref: "concepts.md#multi-tenancy-isolation"

  - id: authorization-and-access-control-046
    difficulty: advanced
    tags: [multi-tenancy, cache, isolation]
    question: |
      Beyond the primary database, which is a commonly overlooked source of cross-tenant
      data bleed in a multi-tenant system?
    options:
      - "Using HTTPS for all endpoints"
      - "Assigning each request a unique trace ID"
      - "Compressing HTTP responses with gzip"
      - "Shared caches keyed without a tenant namespace, or pooled DB sessions carrying one tenant's context into another's request"
    answer: 3
    explanation: |
      Isolation must cover all resources, not just the DB rows: a cache key without the
      tenant can cross-serve another tenant's data, and a pooled connection/session that
      retains one tenant's context can leak into the next request. Object storage, indices,
      queues, and logs must be tenant-scoped too.
    ref: "concepts.md#multi-tenancy-isolation"

  - id: authorization-and-access-control-047
    difficulty: intermediate
    tags: [multi-tenancy, silo, models]
    question: |
      Which multi-tenancy isolation model provides the STRONGEST separation but the highest
      cost/complexity?
    options:
      - "Pool — shared tables with a tenant_id column"
      - "Bridge — shared DB with a schema/partition per tenant"
      - "Silo — a separate database or instance per tenant"
      - "There is no difference in isolation strength between models"
    answer: 2
    explanation: |
      The silo model (separate DB/instance per tenant) gives the strongest isolation because
      data is physically separated, at the highest cost/complexity. Bridge (schema per tenant)
      is medium; pool (shared tables) is weakest and relies entirely on app-layer scoping.
    ref: "concepts.md#multi-tenancy-isolation"

  - id: authorization-and-access-control-048
    difficulty: beginner
    tags: [http-status, resource-existence]
    question: |
      Some APIs deliberately return 404 instead of 403 when a caller requests an object they
      are not authorized for. What is the rationale?
    options:
      - "404 responses are cached longer by browsers"
      - "To avoid disclosing that the resource exists to a caller who shouldn't know about it"
      - "403 is not a valid HTTP status code for REST APIs"
      - "404 automatically logs the attacker's IP"
    answer: 1
    explanation: |
      Returning 403 confirms the object exists; returning 404 hides its existence from an
      unauthorized caller, reducing information leakage (useful against enumeration). Scoping
      the query so "not yours" collapses into "not found" achieves this naturally.
    ref: "concepts.md#authorization-versus-authentication"

  - id: authorization-and-access-control-049
    difficulty: advanced
    tags: [least-privilege, jit-elevation]
    question: |
      Which approach best embodies least privilege for an operator who occasionally needs
      admin rights?
    options:
      - "Grant standing (permanent) admin so they never wait for access"
      - "Share a single admin credential across the whole ops team"
      - "Attach a wildcard policy to their normal account"
      - "Just-in-time, time-boxed elevation with approval that auto-revokes after a short window"
    answer: 3
    explanation: |
      JIT, time-boxed elevation (granted with approval, auto-revoked) upholds least privilege
      by minimizing both the scope and the duration of elevated rights, unlike standing admin,
      shared credentials, or wildcard grants.
    ref: "concepts.md#principle-of-least-privilege"

  - id: authorization-and-access-control-050
    difficulty: advanced
    tags: [rbac, separation-of-duties]
    question: |
      A payments system prevents any single user from being both the `requester` and the
      `approver` of the same payment. Which RBAC concept is this?
    options:
      - "Separation of Duties (SoD) constraint"
      - "Role hierarchy"
      - "Attribute-based delegation"
      - "Discretionary sharing"
    answer: 0
    explanation: |
      Separation of Duties (SoD) is an RBAC constraint that forbids one user from holding
      conflicting roles/permissions on the same transaction, reducing fraud and error by
      requiring collusion for abuse.
    ref: "concepts.md#role-based-access-control-rbac"

  - id: authorization-and-access-control-051
    difficulty: intermediate
    tags: [rebac, tradeoffs]
    question: |
      Which is a real trade-off of adopting a Zanzibar-style ReBAC system?
    options:
      - "It cannot model nested groups or inheritance"
      - "It only works for single-user applications"
      - "You must run a distributed, consistency-sensitive tuple store and keep it in sync with your app's source of truth"
      - "It makes 'who can access X' impossible to answer"
    answer: 2
    explanation: |
      ReBAC naturally models nested groups/inheritance and answers "who can access X" and
      "what can Y access" as graph traversals — but you now operate a distributed,
      consistency-sensitive store (zookies) and must keep tuples synced with your data.
    ref: "concepts.md#relationship-based-access-control-rebac-and-google-zanzibar"

  - id: authorization-and-access-control-052
    difficulty: intermediate
    tags: [dac, mac, rbac, comparison]
    question: |
      Match the model to its "who decides" description that is INCORRECT.
    options:
      - "DAC — the resource owner decides who else may access"
      - "MAC — a central authority mandates policy via labels users cannot override"
      - "RBAC — permissions are assigned to roles and roles to users"
      - "ABAC — the resource owner grants access at their personal discretion"
    answer: 3
    explanation: |
      ABAC decides by evaluating subject/resource/action/environment attributes against
      policies — not by owner discretion (that description belongs to DAC). The other three
      pairings are correct.
    ref: "concepts.md#attribute-based-access-control-abac"

  - id: authorization-and-access-control-053
    difficulty: advanced
    tags: [bfla, defense, centralization]
    question: |
      Which single measure most reliably prevents forgotten function-level authorization
      checks across a large API?
    options:
      - "Documenting the admin routes in a README"
      - "Renaming admin routes to hard-to-guess paths"
      - "Adding rate limits to admin endpoints"
      - "Enforcing required capability/role centrally (e.g., middleware/gateway policy) with deny-by-default for any unlisted route"
    answer: 3
    explanation: |
      Centralizing enforcement so every route must pass a capability check — and unlisted
      routes are denied by default — removes the per-handler forgetfulness that causes BFLA.
      Obscure names, docs, and rate limits are not authorization.
    ref: "concepts.md#bfla-broken-function-level-authorization"

  - id: authorization-and-access-control-054
    difficulty: beginner
    tags: [confused-deputy, definition]
    question: |
      A confused deputy is best defined as:
    options:
      - "A privileged program tricked by a less-privileged caller into misusing its authority on the caller's behalf"
      - "A user who forgot their password and is locked out"
      - "A load balancer that routes to the wrong backend"
      - "An expired certificate that a client still trusts"
    answer: 0
    explanation: |
      The confused deputy (Norm Hardy, 1988) is a program with legitimate authority that a
      less-privileged party tricks into acting for them — the deputy is "confused" into
      wielding its authority on the attacker's behalf (e.g., SSRF, CSRF).
    ref: "concepts.md#the-confused-deputy-problem"

  - id: authorization-and-access-control-055
    difficulty: intermediate
    tags: [least-privilege, zero-trust, scoped-tokens]
    question: |
      A read-only dashboard widget is issued an OAuth access token with the `admin` scope
      "to be safe." Which principle does this violate and what is the fix?
    options:
      - "It violates deny-by-default; fix by adding a denylist of admin actions"
      - "It violates least privilege; issue a token scoped only to the reads it needs (e.g., `read:profile`) with a short TTL"
      - "It violates confused-deputy protection; fix by removing the token entirely"
      - "It violates nothing; broad scopes improve reliability"
    answer: 1
    explanation: |
      Over-scoping a token violates least privilege and enlarges blast radius if the token
      leaks. Scope tokens to exactly what the component needs (read-only here), with short
      TTLs and refresh rotation to bound the replay window.
    ref: "concepts.md#principle-of-least-privilege"
