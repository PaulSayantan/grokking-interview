topic: "Session Management & Secure Cookies"
domain: security
topic_slug: session-management-and-secure-cookies
version: 1
questions:
  - id: session-management-and-secure-cookies-001
    difficulty: beginner
    tags: [statelessness, sessions, cookies]
    question: |
      HTTP is stateless. How does a web application "remember" that a user is logged
      in across many separate requests?
    options:
      - "The client returns a session identifier (typically a cookie) that the server maps to stored state"
      - "TCP keeps the connection open for the entire login, carrying identity in the socket"
      - "The browser re-sends the username and password on every request automatically"
      - "The server pins the user to their IP address for the duration of the login"
    answer: 0
    explanation: |
      Because each HTTP request is independent, the server issues a session identifier
      on login and the client returns it on every subsequent request (usually via the
      Cookie header). The server maps that opaque ID to trusted server-side state.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-002
    difficulty: beginner
    tags: [cookies, forgery]
    question: |
      Why is it unsafe to simply store `Cookie: user=alice` and trust it to identify
      the logged-in user?
    options:
      - "Cookies are too small to hold a username"
      - "The browser will not send custom cookie names back to the server"
      - "Cookies are client-controlled, so the user can edit the value to impersonate anyone"
      - "Cookie values are always encrypted, so the server cannot read the name"
    answer: 2
    explanation: |
      Cookies are fully under the client's control; a user could change `user=alice`
      to `user=admin`. A session ID works because it is a high-entropy random token the
      server maps to trusted state, or because the cookie is cryptographically signed.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-003
    difficulty: intermediate
    tags: [server-side-sessions, stateless-tokens, revocation]
    question: |
      What is the primary trade-off when choosing stateless self-contained tokens over
      server-side sessions?
    options:
      - "Stateless tokens are easier to revoke but harder to scale"
      - "Server-side sessions cannot be used behind a load balancer"
      - "Server-side sessions expose more data on the wire than tokens"
      - "Stateless tokens scale without a shared store but are hard to revoke before expiry"
    answer: 3
    explanation: |
      Stateless tokens remove the shared session store and let any node validate with a
      key, but you cannot truly invalidate one before it expires without adding a
      denylist. Server-side sessions are trivially revocable (delete the row) at the
      cost of a shared store.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-004
    difficulty: intermediate
    tags: [stateless-tokens, revocation, jwt]
    question: |
      A team stores a self-contained signed token in an HttpOnly cookie and claims this
      makes logout immediate. Why is that claim wrong?
    options:
      - "HttpOnly cookies cannot be deleted, so logout is impossible"
      - "The token is self-contained and remains valid until it expires regardless of the cookie"
      - "Signed tokens cannot be placed in cookies at all"
      - "The server always re-validates the token against a database, so logout is instant"
    answer: 1
    explanation: |
      Putting a self-contained token in a cookie does not make it revocable. The token
      validates on its own signature and stays valid until expiry unless you add a
      server-side denylist or short expiry + refresh-token rotation.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-005
    difficulty: beginner
    tags: [entropy, csprng, session-id]
    question: |
      What is the OWASP-recommended minimum entropy for a session identifier to resist
      brute-force guessing?
    options:
      - "64 bits"
      - "16 bits"
      - "32 bits"
      - "256 bits"
    answer: 0
    explanation: |
      OWASP's Session Management Cheat Sheet recommends at least 64 bits of entropy.
      In practice framework session IDs are 128 bits, which is comfortably secure.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-006
    difficulty: intermediate
    tags: [csprng, prng, session-id]
    question: |
      Which of these is an acceptable source for generating session identifiers?
    options:
      - "`Math.random()` in the browser or server runtime"
      - "An incrementing counter combined with the current timestamp"
      - "A cryptographically secure PRNG (CSPRNG)"
      - "A linear congruential generator seeded with the process ID"
    answer: 2
    explanation: |
      Session IDs must come from a CSPRNG. Math.random(), counters, timestamps, and LCGs
      are predictable; an attacker who observes a few IDs can model the generator and
      predict others.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-007
    difficulty: advanced
    tags: [entropy, session-id]
    question: |
      A developer builds a 40-character session ID but the first 24 characters are a
      constant server prefix and only the last 16 are random hex. What is the security
      concern?
    options:
      - "The cookie is too large and will be truncated by the browser"
      - "Only the random portion counts toward entropy, so effective entropy is far lower than the length suggests"
      - "Hex encoding cannot represent enough characters for a session ID"
      - "The constant prefix makes the ID easier for the server to validate, which is insecure"
    answer: 1
    explanation: |
      Effective entropy depends only on the random portion. A long ID with a fixed prefix
      has the entropy of just its random bytes, which may fall below the 64-bit threshold
      and enable guessing.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-008
    difficulty: intermediate
    tags: [transmission, url, leakage]
    question: |
      Why should a session identifier never be placed in a URL (e.g. `?sessionid=abc`)?
    options:
      - "URLs cannot hold enough characters for a session ID"
      - "Browsers refuse to send query strings over HTTPS"
      - "Query strings are always cached by CDNs, corrupting the session"
      - "It leaks through Referer headers, browser history, shared links, and server access logs"
    answer: 3
    explanation: |
      Session IDs in URLs leak via Referer headers to third parties, browser history,
      bookmarks, shared links, and plaintext proxy/server logs. IDs belong only in secure
      cookies.
    ref: "concepts.md#session-id-storage-and-transmission"

  - id: session-management-and-secure-cookies-009
    difficulty: intermediate
    tags: [storage, server-side, hashing]
    question: |
      Which server-side practice reduces the damage if the session store is leaked?
    options:
      - "Storing raw session IDs so they can be matched quickly"
      - "Logging every session ID for audit purposes"
      - "Storing a hash of the session ID rather than the raw value"
      - "Encoding session IDs in Base64 before saving them"
    answer: 2
    explanation: |
      Treating the session ID like a password and storing only a hash means a leaked store
      dump cannot be replayed directly. Raw IDs (and logging them) create replayable
      credentials; Base64 is encoding, not protection.
    ref: "concepts.md#session-id-storage-and-transmission"

  - id: session-management-and-secure-cookies-010
    difficulty: beginner
    tags: [httponly, xss, cookies]
    question: |
      What attack does the `HttpOnly` cookie attribute primarily mitigate?
    options:
      - "Theft of the cookie by JavaScript injected via XSS"
      - "Cross-Site Request Forgery (CSRF)"
      - "Network sniffing of the cookie in transit"
      - "Brute-forcing the session ID value"
    answer: 0
    explanation: |
      HttpOnly hides the cookie from JavaScript (document.cookie), so even injected XSS
      script cannot read and exfiltrate it. It does not stop CSRF, sniffing, or guessing.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-011
    difficulty: intermediate
    tags: [httponly, fetch]
    question: |
      True or false, with reason: setting `HttpOnly` stops the cookie from being sent on
      `fetch()`/XMLHttpRequest calls made by page scripts.
    options:
      - "True — HttpOnly blocks both reading and sending by scripts"
      - "True — HttpOnly cookies are only sent on full-page navigations"
      - "False — HttpOnly has no effect on JavaScript at all"
      - "False — HttpOnly blocks scripts from *reading* the cookie, but the browser still *sends* it on those requests"
    answer: 3
    explanation: |
      HttpOnly prevents script from reading document.cookie, but the browser still attaches
      the cookie automatically to same-origin fetch/XHR requests. HttpOnly blocks reading,
      not sending.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-012
    difficulty: beginner
    tags: [secure, https, cookies]
    question: |
      What does the `Secure` cookie attribute do?
    options:
      - "Encrypts the cookie value so the server must decrypt it"
      - "Instructs the browser to send the cookie only over HTTPS (not plaintext HTTP)"
      - "Hides the cookie from JavaScript"
      - "Prevents the cookie from being sent to other sites"
    answer: 1
    explanation: |
      Secure means the browser only transmits the cookie over the https: scheme (localhost
      exempted for dev), preventing plaintext leakage and downgrade. It does not encrypt the
      value or hide it from JS.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-013
    difficulty: intermediate
    tags: [cookie-attributes, defense-in-depth]
    question: |
      Match the defense: which attribute set correctly maps HttpOnly, Secure, and SameSite
      to the threats they primarily address?
    options:
      - "HttpOnly → XSS token theft; Secure → network sniffing/downgrade; SameSite → CSRF"
      - "HttpOnly → CSRF; Secure → XSS; SameSite → sniffing"
      - "HttpOnly → sniffing; Secure → CSRF; SameSite → XSS"
      - "HttpOnly → brute force; Secure → fixation; SameSite → hijacking"
    answer: 0
    explanation: |
      Each attribute targets a different threat: HttpOnly blocks XSS-based reading/exfiltration,
      Secure blocks plaintext sniffing/downgrade, and SameSite blocks CSRF by restricting
      cross-site sending.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-014
    difficulty: intermediate
    tags: [samesite, csrf]
    question: |
      With `SameSite=Strict`, when is the cookie sent?
    options:
      - "On all cross-site requests as long as they use GET"
      - "On cross-site top-level navigations only"
      - "Only on requests originating from the same site that set the cookie"
      - "Never — Strict disables the cookie entirely"
    answer: 2
    explanation: |
      SameSite=Strict sends the cookie only for same-site requests and never on any
      cross-site request, including top-level navigation. That is the strongest CSRF
      protection but can make the user appear logged out when following an inbound link.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-015
    difficulty: intermediate
    tags: [samesite, lax, csrf]
    question: |
      Under `SameSite=Lax`, which cross-site request WILL carry the cookie?
    options:
      - "A cross-site POST form submission"
      - "A cross-site `fetch()` API call"
      - "An `<img>` tag on another site loading a resource from the site"
      - "A user clicking a link that performs a top-level GET navigation to the site"
    answer: 3
    explanation: |
      Lax sends the cookie on cross-site requests only when they are top-level navigations
      using a safe method (GET) — e.g. clicking a link. It withholds it on cross-site POST,
      fetch, and subresource loads, blocking classic form-POST CSRF.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-016
    difficulty: intermediate
    tags: [samesite, none, secure]
    question: |
      An engineer sets `Set-Cookie: id=x; SameSite=None`. Why does the browser reject it?
    options:
      - "SameSite=None is not a valid value"
      - "SameSite=None requires the `Secure` attribute to also be set"
      - "SameSite=None requires the `HttpOnly` attribute to also be set"
      - "SameSite=None can only be used with a Domain attribute"
    answer: 1
    explanation: |
      SameSite=None re-enables full cross-site sending and is only accepted when Secure is
      also present. Without Secure, modern browsers reject the cookie.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-017
    difficulty: advanced
    tags: [samesite, csrf, defense-in-depth]
    question: |
      Why is `SameSite` considered defense-in-depth rather than a complete CSRF defense?
    options:
      - "The Lax default still allows cross-site top-level GETs, older browsers may not enforce it, and it does nothing for same-site attacks"
      - "It only works on cookies smaller than 4 KB"
      - "It disables all cross-site requests, breaking legitimate traffic"
      - "It encrypts the cookie, which some proxies strip"
    answer: 0
    explanation: |
      Lax still permits cross-site top-level GET requests (so state-changing GET endpoints
      are exploitable), legacy browsers may ignore SameSite, and it offers no protection
      against same-site attackers. Keep anti-CSRF tokens for state-changing requests.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-018
    difficulty: intermediate
    tags: [domain, subdomains, cookies]
    question: |
      For a session cookie, why is *omitting* the `Domain` attribute preferred over
      setting `Domain=example.com`?
    options:
      - "Omitting Domain makes the cookie persistent instead of session-scoped"
      - "Setting Domain prevents the cookie from being sent over HTTPS"
      - "Omitting Domain yields a host-only cookie; setting Domain broadens it to all subdomains, exposing it to a compromised subdomain"
      - "Omitting Domain increases the cookie's entropy"
    answer: 2
    explanation: |
      Without Domain, the cookie is host-only (sent only to the exact host). Setting
      Domain=example.com shares it with example.com and every subdomain, so a compromised
      or untrusted subdomain (e.g. blog.example.com) would receive the main app's session
      cookie.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-019
    difficulty: intermediate
    tags: [path, cookies, scoping]
    question: |
      Which statement about the cookie `Path` attribute is correct?
    options:
      - "Path is a strong security boundary that isolates cookies from same-origin scripts"
      - "Path is a scoping convenience; same-origin script under a different path can still access the cookie and it does not protect against XSS"
      - "Path encrypts the cookie for the matching directory"
      - "Path controls which subdomains receive the cookie"
    answer: 1
    explanation: |
      Path only limits which URL paths the browser sends the cookie to. It is not a
      security boundary — same-origin script can still reach it, and Domain (not Path)
      governs subdomains.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-020
    difficulty: intermediate
    tags: [max-age, expires, lifetime]
    question: |
      A `Set-Cookie` header contains both `Max-Age=60` and `Expires=Wed, 21 Oct 2026
      07:28:00 GMT`. Which wins, and what if neither were present?
    options:
      - "Expires wins; with neither, the cookie is rejected"
      - "Expires wins; with neither, the cookie lasts forever"
      - "Whichever is later wins; with neither, it lasts 24 hours"
      - "Max-Age wins; with neither, it becomes a session cookie dropped when the browser closes"
    answer: 3
    explanation: |
      When both are present, Max-Age takes precedence over Expires. If neither is set, the
      cookie is a non-persistent session cookie held in memory and removed when the browser
      closes.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-021
    difficulty: intermediate
    tags: [lifetime, session-cookie, owasp]
    question: |
      Why does OWASP recommend non-persistent (session) cookies for session IDs?
    options:
      - "They load faster than persistent cookies"
      - "They can hold more entropy than persistent cookies"
      - "They are not written to disk, so they don't survive after the browser closes"
      - "They are automatically encrypted by the browser"
    answer: 2
    explanation: |
      Non-persistent cookies live only in memory and are dropped when the browser closes, so
      the session ID isn't left on disk for later theft. Persistent cookies with Max-Age/
      Expires are stored on disk.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-022
    difficulty: advanced
    tags: [host-prefix, cookie-prefixes, cookie-tossing]
    question: |
      Which requirements must a cookie satisfy for a browser to accept it under the
      `__Host-` name prefix?
    options:
      - "Secure, set from HTTPS, Path=/, and NO Domain attribute"
      - "HttpOnly and SameSite=Strict only"
      - "Secure and a Domain attribute covering all subdomains"
      - "Max-Age set and Path restricted to a subdirectory"
    answer: 0
    explanation: |
      __Host- requires Secure, an HTTPS origin, Path=/, and no Domain attribute. This
      host-locks the cookie so subdomains cannot set or override it, defeating cookie
      tossing/overwriting. OWASP recommends __Host- for session cookies.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-023
    difficulty: intermediate
    tags: [secure-prefix, cookie-prefixes]
    question: |
      What does the `__Secure-` cookie name prefix enforce?
    options:
      - "That the cookie value is encrypted by the browser"
      - "That the cookie is host-only with Path=/"
      - "That the cookie is never sent cross-site"
      - "That the cookie is only accepted if it was set with the Secure attribute from an HTTPS page"
    answer: 3
    explanation: |
      __Secure- makes the browser accept the cookie only when it carries the Secure attribute
      and was set over HTTPS. It is weaker than __Host-, which additionally forbids Domain and
      requires Path=/.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-024
    difficulty: advanced
    tags: [cookie-prefixes, legacy-browsers]
    question: |
      What is the key caveat about relying on the `__Host-`/`__Secure-` prefixes?
    options:
      - "They cause the server to reject the cookie if it is too long"
      - "They are enforced only by browsers that understand them; a legacy browser treats a prefixed cookie like any other"
      - "They can only be used with SameSite=None"
      - "They automatically add HttpOnly to the cookie"
    answer: 1
    explanation: |
      The prefix is a signal the browser enforces; browsers lacking prefix support accept the
      cookie normally without the guarantees. The server must still set the real attributes;
      the prefix does not add them.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-025
    difficulty: intermediate
    tags: [session-fixation, definition]
    question: |
      What best describes a session fixation attack?
    options:
      - "The attacker gets a known session ID established in the victim's browser before login, then reuses it after the victim authenticates"
      - "The attacker guesses a valid session ID by brute force"
      - "The attacker steals an active session cookie via XSS"
      - "The attacker floods the server with session creation requests"
    answer: 0
    explanation: |
      In fixation, the attacker plants or supplies a session ID they already know into the
      victim's browser and relies on the app not regenerating it at login, so the
      authenticated session is bound to the attacker-known ID.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-026
    difficulty: intermediate
    tags: [session-fixation, regenerate, login]
    question: |
      What is the primary defense against session fixation?
    options:
      - "Encrypt the session cookie value"
      - "Set a very short Max-Age on the cookie"
      - "Regenerate (rotate) the session ID on login and other privilege changes"
      - "Store the session ID in localStorage instead of a cookie"
    answer: 2
    explanation: |
      Regenerating the session ID at authentication invalidates any pre-auth ID the attacker
      could know, so the authenticated session never reuses a fixed identifier. Rotate on any
      privilege-level change.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-027
    difficulty: advanced
    tags: [session-fixation, vulnerable-pattern]
    question: |
      An application accepts a session ID passed in the query string and keeps that same
      ID after the user logs in. Which flaw does this create and what is the fix?
    options:
      - "CSRF; fix with SameSite=Strict"
      - "Session hijacking; fix by encrypting the cookie"
      - "Brute force; fix by increasing entropy only"
      - "Session fixation; fix by rejecting app-unissued IDs, never using URLs, and regenerating the ID at login"
    answer: 3
    explanation: |
      Accepting a client-supplied ID and not rotating it at login is the textbook fixation
      pattern. Fix by never accepting an ID the app didn't issue, never passing IDs in URLs,
      and regenerating the ID on authentication.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-028
    difficulty: intermediate
    tags: [session-hijacking, definition]
    question: |
      How does session hijacking differ from session fixation?
    options:
      - "Hijacking plants an ID before login; fixation steals an active ID"
      - "Hijacking steals a valid, active session ID; fixation plants a known ID before login"
      - "They are two names for the same attack"
      - "Hijacking only works over HTTPS; fixation only over HTTP"
    answer: 1
    explanation: |
      Hijacking = theft and replay of an already-valid session ID (via XSS, sniffing, URL
      leakage). Fixation = the attacker forces a known ID before auth and the app fails to
      regenerate it.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-029
    difficulty: intermediate
    tags: [session-hijacking, vectors]
    question: |
      Which of the following is NOT a common session hijacking vector?
    options:
      - "The server regenerating the session ID after login"
      - "XSS reading a non-HttpOnly cookie or a token in localStorage"
      - "Network sniffing of a cookie sent over plaintext HTTP"
      - "A session ID leaked through a URL and Referer header"
    answer: 0
    explanation: |
      Regenerating the ID at login is a defense (against fixation), not a hijacking vector.
      XSS theft, plaintext sniffing, and URL/Referer leakage are all real hijacking vectors.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-030
    difficulty: advanced
    tags: [session-hijacking, ip-binding]
    question: |
      A team wants to hard-bind each session to the client's exact IP address to stop
      hijacking. What is the main downside?
    options:
      - "IP binding is impossible over IPv6"
      - "It exposes the session ID in the URL"
      - "Legitimate users' IPs change (mobile networks, roaming), causing frequent false logouts"
      - "It disables HttpOnly automatically"
    answer: 2
    explanation: |
      Client IPs legitimately change on mobile/roaming networks and behind NAT/proxies, so
      hard IP-binding causes false logouts. Loose context checks (flag or re-auth on coarse
      changes) plus short timeouts are more practical.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-031
    difficulty: beginner
    tags: [idle-timeout, absolute-timeout]
    question: |
      What is the difference between an idle timeout and an absolute timeout?
    options:
      - "Idle expires at a fixed time after creation; absolute expires after inactivity"
      - "Idle expires after a period of inactivity; absolute expires a fixed time after session creation regardless of activity"
      - "They are the same thing measured differently"
      - "Idle applies to cookies; absolute applies only to tokens"
    answer: 1
    explanation: |
      Idle (inactivity) timeout is a sliding window reset on each request. Absolute timeout is
      a hard cap measured from session creation, forcing periodic re-authentication regardless
      of activity.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-032
    difficulty: intermediate
    tags: [timeout, server-side-enforcement]
    question: |
      Why is relying on the cookie's `Max-Age`/`Expires` insufficient for enforcing session
      timeouts?
    options:
      - "Max-Age cannot exceed 30 minutes"
      - "Expires is not supported by modern browsers"
      - "Cookies never expire on their own"
      - "The client controls the cookie and can ignore or edit its expiry; timeouts must be enforced server-side against a stored timestamp"
    answer: 3
    explanation: |
      Cookie expiry is a client-side hint the user can tamper with. Authoritative timeout
      enforcement must be server-side: the server rejects requests whose stored session has
      idled or aged out.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-033
    difficulty: advanced
    tags: [renewal-timeout, id-rotation]
    question: |
      What is the purpose of a renewal (rotation) timeout that periodically regenerates the
      session ID mid-session?
    options:
      - "To keep the cookie under the 4 KB size limit"
      - "To reset the user's password automatically"
      - "To shrink the window during which a captured session ID remains valid"
      - "To switch the session from a cookie to localStorage"
    answer: 2
    explanation: |
      Periodically regenerating the ID while keeping the session alive means a stolen ID is
      only useful until the next rotation, limiting the hijacking window without forcing the
      user to log in again.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-034
    difficulty: intermediate
    tags: [logout, server-side-invalidation, vulnerable-pattern]
    question: |
      A logout endpoint only sends `Set-Cookie: SESSIONID=; Max-Age=0` and does nothing
      else. What is the vulnerability?
    options:
      - "The server-side session record still exists and remains valid, so a captured ID keeps working"
      - "The cookie deletion syntax is invalid"
      - "Deleting the cookie logs out all users at once"
      - "Max-Age=0 makes the cookie persistent"
    answer: 0
    explanation: |
      Clearing the client cookie does not destroy the server-side session. Anyone who captured
      the ID can keep using it. Logout must invalidate the session record server-side, then
      clear the cookie.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-035
    difficulty: intermediate
    tags: [logout, correct-defense]
    question: |
      What does a correct logout implementation do?
    options:
      - "Redirect the user to the login page only"
      - "Rotate the user's CSRF token but keep the session alive"
      - "Set the cookie's SameSite to Strict"
      - "Invalidate the session record on the server, then clear the client cookie"
    answer: 3
    explanation: |
      Correct logout destroys the server-side session (delete/expire the store entry) so the ID
      is dead everywhere, then clears the client cookie. Redirecting or rotating tokens alone
      does not invalidate the session.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-036
    difficulty: advanced
    tags: [logout, stateless-tokens, denylist]
    question: |
      For a stateless self-contained token there is no server record to delete on logout.
      Which approach makes logout effective?
    options:
      - "Do nothing — tokens cannot be revoked, so logout is impossible"
      - "A server-side denylist checked per request, or short expiry plus refresh-token rotation with reuse detection"
      - "Change the signing key on every logout for every user"
      - "Rely solely on clearing the cookie in the browser"
    answer: 1
    explanation: |
      Because the token validates on its own, effective logout needs a server-side denylist
      (checked each request) or short-lived access tokens with rotating refresh tokens and
      reuse detection. Clearing the cookie alone is insufficient.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-037
    difficulty: intermediate
    tags: [concurrent-sessions, revocation]
    question: |
      What capability does maintaining a server-side registry of a user's active sessions
      enable?
    options:
      - "Listing devices and selectively revoking sessions ('sign out other devices'), plus global logout"
      - "Larger session IDs"
      - "Automatic encryption of all cookies"
      - "Elimination of the need for HTTPS"
    answer: 0
    explanation: |
      A per-user active-session registry lets users and admins view devices and revoke
      individual sessions, supports global logout, and enables concurrent-login detection —
      none of which is possible with purely stateless tokens.
    ref: "concepts.md#concurrent-sessions-and-session-fixation-cousins"

  - id: session-management-and-secure-cookies-038
    difficulty: intermediate
    tags: [concurrent-sessions, policy]
    question: |
      A high-security app invalidates the previous session whenever the same user starts a
      new one. What is a downside of this single-session policy?
    options:
      - "It makes session IDs predictable"
      - "It disables the Secure attribute"
      - "It is hostile to legitimate multi-device use (phone + laptop) since one logs the other out"
      - "It prevents the server from hashing session IDs"
    answer: 2
    explanation: |
      Restricting to one session limits blast radius but frustrates legitimate users who work
      across multiple devices, since starting a session on one device invalidates the others.
    ref: "concepts.md#concurrent-sessions-and-session-fixation-cousins"

  - id: session-management-and-secure-cookies-039
    difficulty: intermediate
    tags: [localstorage, xss, tokens]
    question: |
      Why does OWASP discourage storing session tokens in `localStorage`?
    options:
      - "localStorage has a 4 KB size limit too small for tokens"
      - "localStorage is automatically sent with every request, causing CSRF"
      - "localStorage is cleared when the browser closes, losing the session"
      - "Any JavaScript on the page can read localStorage, so a single XSS discloses every token"
    answer: 3
    explanation: |
      localStorage is fully readable by page scripts, so one XSS exfiltrates the token. An
      HttpOnly cookie is unreadable by JavaScript, which is why OWASP recommends cookies for
      session credentials.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-040
    difficulty: advanced
    tags: [cookies, localstorage, xss, csrf, trade-off]
    question: |
      What is the core security trade-off between an HttpOnly cookie and localStorage for
      storing an auth token?
    options:
      - "Cookies are faster; localStorage is slower"
      - "Cookies are auto-sent (CSRF exposure, mitigated by SameSite + tokens) but XSS-safe via HttpOnly; localStorage is CSRF-immune but fully XSS-exposed"
      - "localStorage is XSS-safe but CSRF-exposed; cookies are the opposite"
      - "There is no difference; both are equally exposed to XSS and CSRF"
    answer: 1
    explanation: |
      Cookies are auto-attached (CSRF risk, handled by SameSite + anti-CSRF tokens) but HttpOnly
      keeps them out of JavaScript's reach. localStorage isn't auto-sent (no CSRF) but any XSS
      reads it. XSS is the harder, higher-impact problem, so HttpOnly cookies are preferred.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-041
    difficulty: intermediate
    tags: [cookies, tokens, recommendation]
    question: |
      When asked "cookie or localStorage for the JWT session credential?", what is the
      strongest general answer?
    options:
      - "An HttpOnly cookie, because it removes the token from JavaScript's reach (neutralizing XSS theft), and handle CSRF with SameSite plus anti-CSRF tokens"
      - "localStorage, because it avoids CSRF entirely"
      - "Either one — the choice is purely about developer convenience"
      - "A regular (non-HttpOnly) cookie so the SPA can read it"
    answer: 0
    explanation: |
      The strong answer is an HttpOnly cookie: it neutralizes the biggest risk (XSS reading the
      token) and the resulting CSRF exposure has robust defenses (SameSite + anti-CSRF tokens).
      A non-HttpOnly cookie or localStorage leaves the token script-readable.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-042
    difficulty: beginner
    tags: [rfc-6265, cookies]
    question: |
      Which RFC defines the HTTP cookie mechanism (Set-Cookie / Cookie headers)?
    options:
      - "RFC 6749"
      - "RFC 7519"
      - "RFC 6265"
      - "RFC 7636"
    answer: 2
    explanation: |
      RFC 6265 (HTTP State Management Mechanism) defines cookies. RFC 6749 is OAuth 2.0,
      RFC 7519 is JWT, and RFC 7636 is PKCE.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-043
    difficulty: advanced
    tags: [cookie-tossing, host-prefix, subdomains]
    question: |
      An attacker who controls `evil.example.com` sets a cookie with `Domain=example.com`
      to overwrite the main app's cookie ("cookie tossing"). Which mechanism specifically
      defends against this for the session cookie?
    options:
      - "Setting SameSite=None on the session cookie"
      - "Using the `__Host-` prefix, which forbids Domain and host-locks the cookie so subdomains cannot set or override it"
      - "Increasing the session ID entropy to 256 bits"
      - "Adding HttpOnly to the session cookie"
    answer: 1
    explanation: |
      The __Host- prefix requires no Domain and Path=/, host-locking the cookie so a subdomain
      cannot set or overwrite it. HttpOnly and entropy don't stop cookie tossing, and SameSite
      addresses cross-site request sending, not overwriting.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-044
    difficulty: intermediate
    tags: [scaling, server-side-sessions, stateless-tokens]
    question: |
      A service must scale horizontally across many stateless nodes with no shared session
      store, and can tolerate short credential lifetimes. Which model fits best and why?
    options:
      - "Server-side sessions, because they are always more secure"
      - "Server-side sessions with sticky routing, because tokens cannot be validated"
      - "Neither — horizontal scaling requires storing IDs in the URL"
      - "Stateless signed tokens, because any node can validate with the key without a shared store"
    answer: 3
    explanation: |
      Stateless tokens let any node validate independently using the signing/verification key,
      removing the shared store — ideal when you can accept short lifetimes plus a revocation
      mechanism. Server-side sessions would need a shared or sticky store.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-045
    difficulty: intermediate
    tags: [secure-cookie, header, best-practice]
    question: |
      Which `Set-Cookie` header best reflects OWASP's recommendations for a session ID
      cookie?
    options:
      - "`Set-Cookie: sid=abc; Domain=example.com; Path=/`"
      - "`Set-Cookie: sid=abc; Max-Age=2592000`"
      - "`Set-Cookie: __Host-sid=abc; Secure; HttpOnly; SameSite=Strict; Path=/`"
      - "`Set-Cookie: sid=abc; SameSite=None`"
    answer: 2
    explanation: |
      The recommended form uses the __Host- prefix with Secure, HttpOnly, SameSite=Strict, and
      Path=/ (and no Domain). The others omit protections, broaden scope to subdomains, make the
      cookie persistent on disk, or set SameSite=None without Secure.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-046
    difficulty: intermediate
    tags: [idle-timeout, high-value, owasp]
    question: |
      Per OWASP guidance, roughly what idle timeout suits a high-value application (e.g.
      banking)?
    options:
      - "2–5 minutes"
      - "1–2 hours"
      - "12 hours"
      - "7 days"
    answer: 0
    explanation: |
      OWASP suggests idle timeouts of about 2–5 minutes for high-value apps and 15–30 minutes
      for lower-risk apps, with absolute timeouts on the order of 4–8 hours.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-047
    difficulty: advanced
    tags: [global-logout, invalidation]
    question: |
      A user reports their account was compromised and wants to be logged out everywhere
      immediately. Which approach achieves this?
    options:
      - "Clear the cookie in the user's current browser only"
      - "Rotate the session ID in the current session"
      - "Set SameSite=Strict on future cookies"
      - "Invalidate all of the user's active sessions/tokens server-side (global logout)"
    answer: 3
    explanation: |
      Global logout requires invalidating all of the user's sessions on the server (deleting
      records or denylisting tokens across devices). Clearing one browser's cookie or rotating a
      single session does not evict an attacker on another device.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-048
    difficulty: beginner
    tags: [pointer, indirection, server-side-sessions]
    question: |
      In the classic server-side session model, what does the session ID cookie actually
      contain?
    options:
      - "The user's roles and permissions in plaintext"
      - "An opaque high-entropy pointer that the server maps to stored session state"
      - "The user's hashed password"
      - "A signed copy of all session data"
    answer: 1
    explanation: |
      The session ID is an opaque, meaningless pointer. The real data (user ID, roles, CSRF
      token, timestamps) lives server-side, keyed by that ID — which is what makes the session
      revocable by deleting the record.
    ref: "concepts.md#sessions-and-statelessness"
