topic: "Session Management & Secure Cookies"
domain: security
topic_slug: session-management-and-secure-cookies
version: 1
questions:
  - id: session-management-and-secure-cookies-001
    difficulty: beginner
    tags: [statelessness, sessions, cookies]
    question: |
      HTTP is stateless. How does a web application "remember" that a user is logged
      in across many separate requests?
    options:
      - "The client returns a session identifier (typically a cookie) that the server maps to stored state"
      - "TCP keeps the connection open for the entire login, carrying identity in the socket"
      - "The browser re-sends the username and password on every request automatically"
      - "The server pins the user to their IP address for the duration of the login"
    answer: 0
    explanation: |
      Because each HTTP request is independent, the server issues a session identifier
      on login and the client returns it on every subsequent request (usually via the
      Cookie header). The server maps that opaque ID to trusted server-side state.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-002
    difficulty: beginner
    tags: [cookies, forgery]
    question: |
      Why is it unsafe to simply store `Cookie: user=alice` and trust it to identify
      the logged-in user?
    options:
      - "Cookies are capped at 4 KB, far too small to hold a full username string"
      - "The browser will not send custom cookie names back to the server"
      - "Cookies are client-controlled, so the user can edit the value to impersonate anyone"
      - "Cookie values are always encrypted, so the server cannot read the name"
    answer: 2
    explanation: |
      Cookies are fully under the client's control; a user could change `user=alice`
      to `user=admin`. A session ID works because it is a high-entropy random token the
      server maps to trusted state, or because the cookie is cryptographically signed.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-003
    difficulty: intermediate
    tags: [server-side-sessions, stateless-tokens, revocation]
    question: |
      What is the primary trade-off when choosing stateless self-contained tokens over
      server-side sessions?
    options:
      - "Stateless tokens are trivially revoked with a single delete but are much harder to scale out"
      - "Server-side sessions cannot be used behind a round-robin load balancer without sticky routing"
      - "Server-side sessions serialize the full user record into every request, exposing more on the wire"
      - "Stateless tokens scale without a shared store but are hard to revoke before expiry"
    answer: 3
    explanation: |
      Stateless tokens remove the shared session store and let any node validate with a
      key, but you cannot truly invalidate one before it expires without adding a
      denylist. Server-side sessions are trivially revocable (delete the row) at the
      cost of a shared store.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-004
    difficulty: intermediate
    tags: [stateless-tokens, revocation, jwt]
    question: |
      A team stores a self-contained signed token in an HttpOnly cookie and claims this
      makes logout immediate. Why is that claim wrong?
    options:
      - "HttpOnly cookies can only be overwritten, never cleared, so logout can never take effect"
      - "The token is self-contained and remains valid until it expires regardless of the cookie"
      - "Signed tokens exceed the cookie size limit and so cannot be placed in cookies at all"
      - "The server always re-validates the token against a database on each call, so logout is instant"
    answer: 1
    explanation: |
      Putting a self-contained token in a cookie does not make it revocable. The token
      validates on its own signature and stays valid until expiry unless you add a
      server-side denylist or short expiry + refresh-token rotation.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-005
    difficulty: beginner
    tags: [entropy, csprng, session-id]
    question: |
      What is the OWASP-recommended minimum entropy for a session identifier to resist
      brute-force guessing?
    options:
      - "64 bits"
      - "16 bits"
      - "32 bits"
      - "256 bits"
    answer: 0
    explanation: |
      OWASP's Session Management Cheat Sheet recommends at least 64 bits of entropy.
      In practice framework session IDs are 128 bits, which is comfortably secure.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-006
    difficulty: intermediate
    tags: [csprng, prng, session-id]
    question: |
      Which of these is an acceptable source for generating session identifiers?
    options:
      - "`Math.random()` in the browser or server runtime"
      - "An incrementing counter combined with the current timestamp"
      - "A cryptographically secure PRNG (CSPRNG)"
      - "A linear congruential generator seeded with the process ID"
    answer: 2
    explanation: |
      Session IDs must come from a CSPRNG. Math.random(), counters, timestamps, and LCGs
      are predictable; an attacker who observes a few IDs can model the generator and
      predict others.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-007
    difficulty: advanced
    tags: [entropy, session-id]
    question: |
      A developer builds a 40-character session ID but the first 24 characters are a
      constant server prefix and only the last 16 are random hex. What is the security
      concern?
    options:
      - "The 40-character cookie exceeds the browser limit and will be silently truncated on storage"
      - "Only the random portion counts toward entropy, so effective entropy is far lower than the length suggests"
      - "Hex encoding maps two characters per byte, so it cannot represent enough distinct session IDs"
      - "The constant prefix makes the ID easier for the server to validate, which is insecure"
    answer: 1
    explanation: |
      Effective entropy depends only on the random portion. A long ID with a fixed prefix
      has the entropy of just its random bytes, which may fall below the 64-bit threshold
      and enable guessing.
    ref: "concepts.md#session-id-generation-entropy-and-csprng"

  - id: session-management-and-secure-cookies-008
    difficulty: intermediate
    tags: [transmission, url, leakage]
    question: |
      Why should a session identifier never be placed in a URL (e.g. `?sessionid=abc`)?
    options:
      - "URLs are capped at 255 characters, too short to hold a high-entropy session ID"
      - "Browsers strip query strings from requests sent over HTTPS for confidentiality"
      - "Query strings are always cached by intermediate CDNs, corrupting the stored session"
      - "It leaks through Referer headers, browser history, shared links, and server access logs"
    answer: 3
    explanation: |
      Session IDs in URLs leak via Referer headers to third parties, browser history,
      bookmarks, shared links, and plaintext proxy/server logs. IDs belong only in secure
      cookies.
    ref: "concepts.md#session-id-storage-and-transmission"

  - id: session-management-and-secure-cookies-009
    difficulty: intermediate
    tags: [storage, server-side, hashing]
    question: |
      Which server-side practice reduces the damage if the session store is leaked?
    options:
      - "Storing raw session IDs so they can be matched quickly"
      - "Logging every session ID for audit purposes"
      - "Storing a hash of the session ID rather than the raw value"
      - "Encoding session IDs in Base64 before saving them"
    answer: 2
    explanation: |
      Treating the session ID like a password and storing only a hash means a leaked store
      dump cannot be replayed directly. Raw IDs (and logging them) create replayable
      credentials; Base64 is encoding, not protection.
    ref: "concepts.md#session-id-storage-and-transmission"

  - id: session-management-and-secure-cookies-010
    difficulty: beginner
    tags: [httponly, xss, cookies]
    question: |
      What attack does the `HttpOnly` cookie attribute primarily mitigate?
    options:
      - "Theft of the cookie by JavaScript injected via XSS"
      - "Cross-Site Request Forgery (CSRF) on state-changing requests"
      - "Network sniffing of the cookie as it travels in plaintext transit"
      - "Brute-forcing the session ID value by guessing high-entropy tokens"
    answer: 0
    explanation: |
      HttpOnly hides the cookie from JavaScript (document.cookie), so even injected XSS
      script cannot read and exfiltrate it. It does not stop CSRF, sniffing, or guessing.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-011
    difficulty: intermediate
    tags: [httponly, fetch]
    question: |
      True or false, with reason: setting `HttpOnly` stops the cookie from being sent on
      `fetch()`/XMLHttpRequest calls made by page scripts.
    options:
      - "True — HttpOnly blocks both script reading and script-initiated sending of the cookie"
      - "True — HttpOnly cookies are only attached to full-page top-level navigations, not fetch/XHR"
      - "False — HttpOnly is purely a documentation hint and has no effect on JavaScript at all"
      - "False — HttpOnly blocks scripts from *reading* the cookie, but the browser still *sends* it on those requests"
    answer: 3
    explanation: |
      HttpOnly prevents script from reading document.cookie, but the browser still attaches
      the cookie automatically to same-origin fetch/XHR requests. HttpOnly blocks reading,
      not sending.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-012
    difficulty: beginner
    tags: [secure, https, cookies]
    question: |
      What does the `Secure` cookie attribute do?
    options:
      - "Encrypts the cookie value with a server key so the server must decrypt it on receipt"
      - "Instructs the browser to send the cookie only over HTTPS (not plaintext HTTP)"
      - "Hides the cookie from JavaScript so document.cookie cannot read it"
      - "Prevents the cookie from being sent on any cross-site request to other origins"
    answer: 1
    explanation: |
      Secure means the browser only transmits the cookie over the https: scheme (localhost
      exempted for dev), preventing plaintext leakage and downgrade. It does not encrypt the
      value or hide it from JS.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-013
    difficulty: intermediate
    tags: [cookie-attributes, defense-in-depth]
    question: |
      Match the defense: which attribute set correctly maps HttpOnly, Secure, and SameSite
      to the threats they primarily address?
    options:
      - "HttpOnly → XSS token theft; Secure → network sniffing/downgrade; SameSite → CSRF"
      - "HttpOnly → CSRF; Secure → XSS; SameSite → sniffing"
      - "HttpOnly → sniffing; Secure → CSRF; SameSite → XSS"
      - "HttpOnly → brute force; Secure → fixation; SameSite → hijacking"
    answer: 0
    explanation: |
      Each attribute targets a different threat: HttpOnly blocks XSS-based reading/exfiltration,
      Secure blocks plaintext sniffing/downgrade, and SameSite blocks CSRF by restricting
      cross-site sending.
    ref: "concepts.md#cookie-attributes-httponly-and-secure"

  - id: session-management-and-secure-cookies-014
    difficulty: intermediate
    tags: [samesite, csrf]
    question: |
      With `SameSite=Strict`, when is the cookie sent?
    options:
      - "On all cross-site requests as long as they use a safe GET method"
      - "On cross-site top-level navigations only, but never on subresource loads"
      - "Only on requests originating from the same site that set the cookie"
      - "Never — Strict disables the cookie entirely, even for same-site requests"
    answer: 2
    explanation: |
      SameSite=Strict sends the cookie only for same-site requests and never on any
      cross-site request, including top-level navigation. That is the strongest CSRF
      protection but can make the user appear logged out when following an inbound link.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-015
    difficulty: intermediate
    tags: [samesite, lax, csrf]
    question: |
      Under `SameSite=Lax`, which cross-site request WILL carry the cookie?
    options:
      - "A cross-site POST form submission that auto-submits on page load"
      - "A cross-site `fetch()` API call issued in the background by page script"
      - "An `<img>` tag on another site loading a resource from the site"
      - "A user clicking a link that performs a top-level GET navigation to the site"
    answer: 3
    explanation: |
      Lax sends the cookie on cross-site requests only when they are top-level navigations
      using a safe method (GET) — e.g. clicking a link. It withholds it on cross-site POST,
      fetch, and subresource loads, blocking classic form-POST CSRF.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-016
    difficulty: intermediate
    tags: [samesite, none, secure]
    question: |
      An engineer sets `Set-Cookie: id=x; SameSite=None`. Why does the browser reject it?
    options:
      - "SameSite=None is not a recognized value and only Lax or Strict are accepted"
      - "SameSite=None requires the `Secure` attribute to also be set"
      - "SameSite=None requires the `HttpOnly` attribute to also be present"
      - "SameSite=None can only be used together with an explicit Domain attribute"
    answer: 1
    explanation: |
      SameSite=None re-enables full cross-site sending and is only accepted when Secure is
      also present. Without Secure, modern browsers reject the cookie.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-017
    difficulty: advanced
    tags: [samesite, csrf, defense-in-depth]
    question: |
      Why is `SameSite` considered defense-in-depth rather than a complete CSRF defense?
    options:
      - "The Lax default still allows cross-site top-level GETs, older browsers may not enforce it, and it does nothing for same-site attacks"
      - "It is only enforced on cookies smaller than 4 KB, so larger session cookies get no protection"
      - "It disables all cross-site requests outright, breaking legitimate inbound links and embeds"
      - "It encrypts the cookie value in transit, which some corporate proxies strip and downgrade"
    answer: 0
    explanation: |
      Lax still permits cross-site top-level GET requests (so state-changing GET endpoints
      are exploitable), legacy browsers may ignore SameSite, and it offers no protection
      against same-site attackers. Keep anti-CSRF tokens for state-changing requests.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-018
    difficulty: intermediate
    tags: [domain, subdomains, cookies]
    question: |
      For a session cookie, why is *omitting* the `Domain` attribute preferred over
      setting `Domain=example.com`?
    options:
      - "Omitting Domain makes the cookie persistent on disk instead of an in-memory session cookie"
      - "Setting Domain forces the cookie onto plaintext HTTP and blocks it from being sent over HTTPS"
      - "Omitting Domain yields a host-only cookie; setting Domain broadens it to all subdomains, exposing it to a compromised subdomain"
      - "Omitting Domain increases the cookie's effective entropy against brute-force guessing"
    answer: 2
    explanation: |
      Without Domain, the cookie is host-only (sent only to the exact host). Setting
      Domain=example.com shares it with example.com and every subdomain, so a compromised
      or untrusted subdomain (e.g. blog.example.com) would receive the main app's session
      cookie.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-019
    difficulty: intermediate
    tags: [path, cookies, scoping]
    question: |
      Which statement about the cookie `Path` attribute is correct?
    options:
      - "Path is a strong security boundary that fully isolates a cookie from same-origin scripts running under any other URL path"
      - "Path is a scoping convenience; same-origin script under a different path can still access the cookie and it does not protect against XSS"
      - "Path applies AES encryption to the cookie value scoped to the matching directory so other paths cannot decrypt it"
      - "Path is the attribute that controls which subdomains of the registrable domain receive the cookie, overriding Domain"
    answer: 1
    explanation: |
      Path only limits which URL paths the browser sends the cookie to. It is not a
      security boundary — same-origin script can still reach it, and Domain (not Path)
      governs subdomains.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-020
    difficulty: intermediate
    tags: [max-age, expires, lifetime]
    question: |
      A `Set-Cookie` header contains both `Max-Age=60` and `Expires=Wed, 21 Oct 2026
      07:28:00 GMT`. Which wins, and what if neither were present?
    options:
      - "Expires always wins because it is an absolute date; with neither present the cookie is rejected as malformed"
      - "Expires wins because it is more specific; with neither present the cookie persists on disk forever until deleted"
      - "Whichever timestamp is later wins; with neither present the cookie defaults to a fixed 24-hour lifetime"
      - "Max-Age wins; with neither, it becomes a session cookie dropped when the browser closes"
    answer: 3
    explanation: |
      When both are present, Max-Age takes precedence over Expires. If neither is set, the
      cookie is a non-persistent session cookie held in memory and removed when the browser
      closes.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-021
    difficulty: intermediate
    tags: [lifetime, session-cookie, owasp]
    question: |
      Why does OWASP recommend non-persistent (session) cookies for session IDs?
    options:
      - "They load faster because in-memory cookies skip the browser's disk-based cookie store lookup on each request"
      - "They can hold more entropy because session cookies are exempt from the ~4096-byte per-cookie size limit"
      - "They are not written to disk, so they don't survive after the browser closes"
      - "They are automatically encrypted by the browser with a per-profile key before being stored in memory"
    answer: 2
    explanation: |
      Non-persistent cookies live only in memory and are dropped when the browser closes, so
      the session ID isn't left on disk for later theft. Persistent cookies with Max-Age/
      Expires are stored on disk.
    ref: "concepts.md#cookie-attributes-domain-path-and-lifetime"

  - id: session-management-and-secure-cookies-022
    difficulty: advanced
    tags: [host-prefix, cookie-prefixes, cookie-tossing]
    question: |
      Which requirements must a cookie satisfy for a browser to accept it under the
      `__Host-` name prefix?
    options:
      - "Secure, set from HTTPS, Path=/, and NO Domain attribute"
      - "Only HttpOnly together with SameSite=Strict, with Secure and Path being optional for the prefix"
      - "The Secure attribute plus an explicit Domain attribute covering the registrable domain and all its subdomains"
      - "A Max-Age of at least one day and a Path restricted to a specific subdirectory rather than the root"
    answer: 0
    explanation: |
      __Host- requires Secure, an HTTPS origin, Path=/, and no Domain attribute. This
      host-locks the cookie so subdomains cannot set or override it, defeating cookie
      tossing/overwriting. OWASP recommends __Host- for session cookies.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-023
    difficulty: intermediate
    tags: [secure-prefix, cookie-prefixes]
    question: |
      What does the `__Secure-` cookie name prefix enforce?
    options:
      - "That the cookie value is transparently encrypted by the browser before storage and decrypted on send"
      - "That the cookie is host-only with Path=/ and forbidden from carrying any Domain attribute"
      - "That the cookie is never attached to any cross-site request, equivalent to SameSite=Strict"
      - "That the cookie is only accepted if it was set with the Secure attribute from an HTTPS page"
    answer: 3
    explanation: |
      __Secure- makes the browser accept the cookie only when it carries the Secure attribute
      and was set over HTTPS. It is weaker than __Host-, which additionally forbids Domain and
      requires Path=/.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-024
    difficulty: advanced
    tags: [cookie-prefixes, legacy-browsers]
    question: |
      What is the key caveat about relying on the `__Host-`/`__Secure-` prefixes?
    options:
      - "They cause the origin server to reject any incoming cookie whose name plus value exceeds the 4096-byte limit"
      - "They are enforced only by browsers that understand them; a legacy browser treats a prefixed cookie like any other"
      - "They can only be combined with SameSite=None and are silently dropped with SameSite=Lax or Strict"
      - "They automatically add the HttpOnly attribute to the cookie even if the Set-Cookie header omits it"
    answer: 1
    explanation: |
      The prefix is a signal the browser enforces; browsers lacking prefix support accept the
      cookie normally without the guarantees. The server must still set the real attributes;
      the prefix does not add them.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-025
    difficulty: intermediate
    tags: [session-fixation, definition]
    question: |
      What best describes a session fixation attack?
    options:
      - "The attacker gets a known session ID established in the victim's browser before login, then reuses it after the victim authenticates"
      - "The attacker guesses a valid active session ID by brute-forcing the token space until one matches a live session"
      - "The attacker steals an already-authenticated session cookie via an XSS payload and replays it from their own machine"
      - "The attacker floods the server with session-creation requests to exhaust the store and force a fixed fallback ID"
    answer: 0
    explanation: |
      In fixation, the attacker plants or supplies a session ID they already know into the
      victim's browser and relies on the app not regenerating it at login, so the
      authenticated session is bound to the attacker-known ID.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-026
    difficulty: intermediate
    tags: [session-fixation, regenerate, login]
    question: |
      What is the primary defense against session fixation?
    options:
      - "Encrypt the session cookie value with a server-held key so a planted ID cannot be reused"
      - "Set a very short Max-Age on the cookie so any attacker-fixed ID expires within a few minutes"
      - "Regenerate (rotate) the session ID on login and other privilege changes"
      - "Store the session ID in localStorage instead of a cookie so an attacker cannot pre-seed it"
    answer: 2
    explanation: |
      Regenerating the session ID at authentication invalidates any pre-auth ID the attacker
      could know, so the authenticated session never reuses a fixed identifier. Rotate on any
      privilege-level change.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-027
    difficulty: advanced
    tags: [session-fixation, vulnerable-pattern]
    question: |
      An application accepts a session ID passed in the query string and keeps that same
      ID after the user logs in. Which flaw does this create and what is the fix?
    options:
      - "Cross-site request forgery; fix by setting the session cookie to SameSite=Strict on every response"
      - "Session hijacking; fix by encrypting the cookie value so a leaked query-string ID cannot be replayed"
      - "Brute-force guessing; fix solely by increasing the session ID entropy to at least 128 bits"
      - "Session fixation; fix by rejecting app-unissued IDs, never using URLs, and regenerating the ID at login"
    answer: 3
    explanation: |
      Accepting a client-supplied ID and not rotating it at login is the textbook fixation
      pattern. Fix by never accepting an ID the app didn't issue, never passing IDs in URLs,
      and regenerating the ID on authentication.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-028
    difficulty: intermediate
    tags: [session-hijacking, definition]
    question: |
      How does session hijacking differ from session fixation?
    options:
      - "Hijacking plants an attacker-known ID before login, while fixation steals an already-active authenticated ID"
      - "Hijacking steals a valid, active session ID; fixation plants a known ID before login"
      - "They are two interchangeable names for the exact same attack technique against session IDs"
      - "Hijacking is only feasible over HTTPS connections, whereas fixation only works over plaintext HTTP"
    answer: 1
    explanation: |
      Hijacking = theft and replay of an already-valid session ID (via XSS, sniffing, URL
      leakage). Fixation = the attacker forces a known ID before auth and the app fails to
      regenerate it.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-029
    difficulty: intermediate
    tags: [session-hijacking, vectors]
    question: |
      Which of the following is NOT a common session hijacking vector?
    options:
      - "The server regenerating the session ID after login"
      - "XSS reading a non-HttpOnly cookie or a token in localStorage"
      - "Network sniffing of a cookie sent over plaintext HTTP"
      - "A session ID leaked through a URL and Referer header"
    answer: 0
    explanation: |
      Regenerating the ID at login is a defense (against fixation), not a hijacking vector.
      XSS theft, plaintext sniffing, and URL/Referer leakage are all real hijacking vectors.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-030
    difficulty: advanced
    tags: [session-hijacking, ip-binding]
    question: |
      A team wants to hard-bind each session to the client's exact IP address to stop
      hijacking. What is the main downside?
    options:
      - "IP binding is technically impossible over IPv6 because addresses rotate on every TCP connection"
      - "It forces the server to echo the client IP and session ID together in the URL query string"
      - "Legitimate users' IPs change (mobile networks, roaming), causing frequent false logouts"
      - "It automatically disables the HttpOnly attribute, re-exposing the cookie to page JavaScript"
    answer: 2
    explanation: |
      Client IPs legitimately change on mobile/roaming networks and behind NAT/proxies, so
      hard IP-binding causes false logouts. Loose context checks (flag or re-auth on coarse
      changes) plus short timeouts are more practical.
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-031
    difficulty: beginner
    tags: [idle-timeout, absolute-timeout]
    question: |
      What is the difference between an idle timeout and an absolute timeout?
    options:
      - "Idle expires at a fixed time measured from session creation, while absolute expires only after a period of user inactivity"
      - "Idle expires after a period of inactivity; absolute expires a fixed time after session creation regardless of activity"
      - "They are the same underlying limit, just measured in different units by the server versus the client"
      - "Idle timeout applies only to browser cookies, whereas absolute timeout applies exclusively to stateless bearer tokens"
    answer: 1
    explanation: |
      Idle (inactivity) timeout is a sliding window reset on each request. Absolute timeout is
      a hard cap measured from session creation, forcing periodic re-authentication regardless
      of activity.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-032
    difficulty: intermediate
    tags: [timeout, server-side-enforcement]
    question: |
      Why is relying on the cookie's `Max-Age`/`Expires` insufficient for enforcing session
      timeouts?
    options:
      - "The Max-Age attribute is hard-capped at 30 minutes by browsers, too short to express most session timeouts"
      - "The Expires attribute was deprecated in RFC 6265bis and is silently ignored by all modern browsers"
      - "Cookies never expire on their own and must always be cleared by an explicit server-side delete"
      - "The client controls the cookie and can ignore or edit its expiry; timeouts must be enforced server-side against a stored timestamp"
    answer: 3
    explanation: |
      Cookie expiry is a client-side hint the user can tamper with. Authoritative timeout
      enforcement must be server-side: the server rejects requests whose stored session has
      idled or aged out.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-033
    difficulty: advanced
    tags: [renewal-timeout, id-rotation]
    question: |
      What is the purpose of a renewal (rotation) timeout that periodically regenerates the
      session ID mid-session?
    options:
      - "To keep the cookie under the 4 KB size limit as session metadata accumulates over time"
      - "To automatically reset the user's account password each time the rotation interval elapses"
      - "To shrink the window during which a captured session ID remains valid"
      - "To migrate the live session from an HttpOnly cookie into localStorage for faster script access"
    answer: 2
    explanation: |
      Periodically regenerating the ID while keeping the session alive means a stolen ID is
      only useful until the next rotation, limiting the hijacking window without forcing the
      user to log in again.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-034
    difficulty: intermediate
    tags: [logout, server-side-invalidation, vulnerable-pattern]
    question: |
      A logout endpoint only sends `Set-Cookie: SESSIONID=; Max-Age=0` and does nothing
      else. What is the vulnerability?
    options:
      - "The server-side session record still exists and remains valid, so a captured ID keeps working"
      - "The cookie-deletion syntax is invalid because clearing a cookie requires Expires in the past, not Max-Age"
      - "Deleting the shared session cookie name signs out every currently logged-in user of the application at once"
      - "Max-Age=0 is interpreted as no expiry, which makes the cookie persistent on disk instead of removing it"
    answer: 0
    explanation: |
      Clearing the client cookie does not destroy the server-side session. Anyone who captured
      the ID can keep using it. Logout must invalidate the session record server-side, then
      clear the cookie.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-035
    difficulty: intermediate
    tags: [logout, correct-defense]
    question: |
      What does a correct logout implementation do?
    options:
      - "Redirect the user to the login page only, leaving the session record intact server-side"
      - "Rotate the user's anti-CSRF token but keep the underlying authenticated session alive"
      - "Set the session cookie's SameSite attribute to Strict on the logout response"
      - "Invalidate the session record on the server, then clear the client cookie"
    answer: 3
    explanation: |
      Correct logout destroys the server-side session (delete/expire the store entry) so the ID
      is dead everywhere, then clears the client cookie. Redirecting or rotating tokens alone
      does not invalidate the session.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-036
    difficulty: advanced
    tags: [logout, stateless-tokens, denylist]
    question: |
      For a stateless self-contained token there is no server record to delete on logout.
      Which approach makes logout effective?
    options:
      - "Do nothing, because self-contained tokens can never be revoked and so logout is fundamentally impossible"
      - "A server-side denylist checked per request, or short expiry plus refresh-token rotation with reuse detection"
      - "Rotate the global signing key on every single logout, forcibly invalidating every other user's tokens too"
      - "Rely solely on clearing the token cookie in the browser and trust the client to discard its copy"
    answer: 1
    explanation: |
      Because the token validates on its own, effective logout needs a server-side denylist
      (checked each request) or short-lived access tokens with rotating refresh tokens and
      reuse detection. Clearing the cookie alone is insufficient.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-037
    difficulty: intermediate
    tags: [concurrent-sessions, revocation]
    question: |
      What capability does maintaining a server-side registry of a user's active sessions
      enable?
    options:
      - "Listing devices and selectively revoking sessions ('sign out other devices'), plus global logout"
      - "Generating longer, higher-entropy session identifiers automatically for every registered device"
      - "Transparent server-side encryption of every session cookie value before it is sent to the client"
      - "Removing the need for HTTPS since the server-side registry already tracks each device securely"
    answer: 0
    explanation: |
      A per-user active-session registry lets users and admins view devices and revoke
      individual sessions, supports global logout, and enables concurrent-login detection —
      none of which is possible with purely stateless tokens.
    ref: "concepts.md#concurrent-sessions-and-session-fixation-cousins"

  - id: session-management-and-secure-cookies-038
    difficulty: intermediate
    tags: [concurrent-sessions, policy]
    question: |
      A high-security app invalidates the previous session whenever the same user starts a
      new one. What is a downside of this single-session policy?
    options:
      - "It makes newly issued session IDs predictable by reusing the previous session's random seed"
      - "It silently disables the Secure attribute on the surviving session cookie whenever a login occurs"
      - "It is hostile to legitimate multi-device use (phone + laptop) since one logs the other out"
      - "It prevents the server from storing session IDs as hashes, forcing raw values into the store"
    answer: 2
    explanation: |
      Restricting to one session limits blast radius but frustrates legitimate users who work
      across multiple devices, since starting a session on one device invalidates the others.
    ref: "concepts.md#concurrent-sessions-and-session-fixation-cousins"

  - id: session-management-and-secure-cookies-039
    difficulty: intermediate
    tags: [localstorage, xss, tokens]
    question: |
      Why does OWASP discourage storing session tokens in `localStorage`?
    options:
      - "localStorage is hard-capped at 4 KB per origin, far too small to hold a signed session token"
      - "localStorage is automatically attached to every outgoing request, exposing the token to CSRF"
      - "localStorage is wiped as soon as the browser tab or window closes, silently losing the session"
      - "Any JavaScript on the page can read localStorage, so a single XSS discloses every token"
    answer: 3
    explanation: |
      localStorage is fully readable by page scripts, so one XSS exfiltrates the token. An
      HttpOnly cookie is unreadable by JavaScript, which is why OWASP recommends cookies for
      session credentials.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-040
    difficulty: advanced
    tags: [cookies, localstorage, xss, csrf, trade-off]
    question: |
      What is the core security trade-off between an HttpOnly cookie and localStorage for
      storing an auth token?
    options:
      - "Cookies are read faster from the browser's in-memory cache while localStorage always incurs a slow synchronous disk read on every access"
      - "Cookies are auto-sent (CSRF exposure, mitigated by SameSite + tokens) but XSS-safe via HttpOnly; localStorage is CSRF-immune but fully XSS-exposed"
      - "localStorage is inherently XSS-safe because scripts cannot read it, whereas cookies are the ones fully exposed to script-based token theft"
      - "There is no meaningful difference; both storage mechanisms are equally exposed to XSS reads and equally auto-attached to trigger CSRF"
    answer: 1
    explanation: |
      Cookies are auto-attached (CSRF risk, handled by SameSite + anti-CSRF tokens) but HttpOnly
      keeps them out of JavaScript's reach. localStorage isn't auto-sent (no CSRF) but any XSS
      reads it. XSS is the harder, higher-impact problem, so HttpOnly cookies are preferred.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-041
    difficulty: intermediate
    tags: [cookies, tokens, recommendation]
    question: |
      When asked "cookie or localStorage for the JWT session credential?", what is the
      strongest general answer?
    options:
      - "An HttpOnly cookie, because it removes the token from JavaScript's reach (neutralizing XSS theft), and handle CSRF with SameSite plus anti-CSRF tokens"
      - "localStorage, because it avoids CSRF entirely and the residual XSS read risk is negligible in practice"
      - "Either one — the decision is purely a matter of developer convenience and has no real security bearing"
      - "A regular non-HttpOnly cookie so the SPA's own JavaScript can read the JWT and attach it to each call"
    answer: 0
    explanation: |
      The strong answer is an HttpOnly cookie: it neutralizes the biggest risk (XSS reading the
      token) and the resulting CSRF exposure has robust defenses (SameSite + anti-CSRF tokens).
      A non-HttpOnly cookie or localStorage leaves the token script-readable.
    ref: "concepts.md#cookies-vs-localstorage-for-tokens-xss-exposure"

  - id: session-management-and-secure-cookies-042
    difficulty: beginner
    tags: [rfc-6265, cookies]
    question: |
      Which RFC defines the HTTP cookie mechanism (Set-Cookie / Cookie headers)?
    options:
      - "RFC 6749"
      - "RFC 7519"
      - "RFC 6265"
      - "RFC 7636"
    answer: 2
    explanation: |
      RFC 6265 (HTTP State Management Mechanism) defines cookies. RFC 6749 is OAuth 2.0,
      RFC 7519 is JWT, and RFC 7636 is PKCE.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-043
    difficulty: advanced
    tags: [cookie-tossing, host-prefix, subdomains]
    question: |
      An attacker who controls `evil.example.com` sets a cookie with `Domain=example.com`
      to overwrite the main app's cookie ("cookie tossing"). Which mechanism specifically
      defends against this for the session cookie?
    options:
      - "Setting SameSite=None on the session cookie so that subdomain-set cookies are never accepted by the browser"
      - "Using the `__Host-` prefix, which forbids Domain and host-locks the cookie so subdomains cannot set or override it"
      - "Increasing the session ID entropy to 256 bits so an overwriting cookie value cannot collide with the real one"
      - "Adding HttpOnly to the session cookie so that scripts on a compromised subdomain cannot write over its value"
    answer: 1
    explanation: |
      The __Host- prefix requires no Domain and Path=/, host-locking the cookie so a subdomain
      cannot set or overwrite it. HttpOnly and entropy don't stop cookie tossing, and SameSite
      addresses cross-site request sending, not overwriting.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-044
    difficulty: intermediate
    tags: [scaling, server-side-sessions, stateless-tokens]
    question: |
      A service must scale horizontally across many stateless nodes with no shared session
      store, and can tolerate short credential lifetimes. Which model fits best and why?
    options:
      - "Server-side sessions, because a shared store is always strictly more secure than any signed token scheme"
      - "Server-side sessions with sticky routing, because signed tokens cannot be validated without a central store"
      - "Neither model works — true horizontal scaling requires passing the session ID in the URL to every node"
      - "Stateless signed tokens, because any node can validate with the key without a shared store"
    answer: 3
    explanation: |
      Stateless tokens let any node validate independently using the signing/verification key,
      removing the shared store — ideal when you can accept short lifetimes plus a revocation
      mechanism. Server-side sessions would need a shared or sticky store.
    ref: "concepts.md#server-side-sessions-vs-stateless-tokens"

  - id: session-management-and-secure-cookies-045
    difficulty: intermediate
    tags: [secure-cookie, header, best-practice]
    question: |
      Which `Set-Cookie` header best reflects OWASP's recommendations for a session ID
      cookie?
    options:
      - "`Set-Cookie: sid=abc; Domain=example.com; Path=/; HttpOnly; SameSite=Lax`"
      - "`Set-Cookie: sid=abc; Max-Age=2592000; Path=/; Domain=example.com; HttpOnly`"
      - "`Set-Cookie: __Host-sid=abc; Secure; HttpOnly; SameSite=Strict; Path=/`"
      - "`Set-Cookie: sid=abc; SameSite=None; HttpOnly; Path=/; Domain=example.com`"
    answer: 2
    explanation: |
      The recommended form uses the __Host- prefix with Secure, HttpOnly, SameSite=Strict, and
      Path=/ (and no Domain). The others omit protections, broaden scope to subdomains, make the
      cookie persistent on disk, or set SameSite=None without Secure.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-046
    difficulty: intermediate
    tags: [idle-timeout, high-value, owasp]
    question: |
      Per OWASP guidance, roughly what idle timeout suits a high-value application (e.g.
      banking)?
    options:
      - "2–5 minutes"
      - "1–2 hours"
      - "12 hours"
      - "7 days"
    answer: 0
    explanation: |
      OWASP suggests idle timeouts of about 2–5 minutes for high-value apps and 15–30 minutes
      for lower-risk apps, with absolute timeouts on the order of 4–8 hours.
    ref: "concepts.md#idle-vs-absolute-timeout"

  - id: session-management-and-secure-cookies-047
    difficulty: advanced
    tags: [global-logout, invalidation]
    question: |
      A user reports their account was compromised and wants to be logged out everywhere
      immediately. Which approach achieves this?
    options:
      - "Clear the session cookie in the user's current browser only, leaving other devices untouched"
      - "Rotate the session ID within the current session so the old identifier stops validating locally"
      - "Set SameSite=Strict on all cookies issued from now on to block any further cross-site access"
      - "Invalidate all of the user's active sessions/tokens server-side (global logout)"
    answer: 3
    explanation: |
      Global logout requires invalidating all of the user's sessions on the server (deleting
      records or denylisting tokens across devices). Clearing one browser's cookie or rotating a
      single session does not evict an attacker on another device.
    ref: "concepts.md#logout-and-server-side-invalidation"

  - id: session-management-and-secure-cookies-048
    difficulty: beginner
    tags: [pointer, indirection, server-side-sessions]
    question: |
      In the classic server-side session model, what does the session ID cookie actually
      contain?
    options:
      - "The user's full list of roles and permissions serialized in plaintext for the server to read directly"
      - "An opaque high-entropy pointer that the server maps to stored session state"
      - "The user's password stored as a salted hash so the server can re-verify it on each incoming request"
      - "A signed and serialized copy of the complete session data set, carried in full on every request"
    answer: 1
    explanation: |
      The session ID is an opaque, meaningless pointer. The real data (user ID, roles, CSRF
      token, timestamps) lives server-side, keyed by that ID — which is what makes the session
      revocable by deleting the record.
    ref: "concepts.md#sessions-and-statelessness"

  - id: session-management-and-secure-cookies-049
    difficulty: advanced
    tags: [rfc-6265bis, samesite, none, secure]
    question: |
      Which pair of rules did RFC 6265bis / modern browsers make authoritative regarding
      the default SameSite behavior and SameSite=None?
    options:
      - "No attribute defaults to None; SameSite=None is accepted without Secure"
      - "No attribute defaults to Strict; SameSite=None requires HttpOnly"
      - "No attribute defaults to Lax; SameSite=None is rejected unless Secure is also set"
      - "No attribute defaults to Lax; SameSite=None is only valid with a Domain attribute"
    answer: 2
    explanation: |
      6265bis codifies SameSite=Lax as the default when the attribute is absent, and requires
      that any SameSite=None cookie also carry Secure or the browser rejects it. HttpOnly and
      Domain are unrelated to these two rules.
    ref: "concepts.md#rfc-6265bis-modern-cookie-rules-and-limits"

  - id: session-management-and-secure-cookies-050
    difficulty: expert
    tags: [rfc-6265bis, limits, max-age, psl]
    question: |
      Which set of hard limits does modern cookie handling (RFC 6265bis / Chrome) enforce?
    options:
      - "~4096 bytes per Set-Cookie, Max-Age/Expires capped at 400 days, and Domain cannot be a public suffix"
      - "~8192 bytes per cookie, no lifetime cap, and Domain may be any public suffix"
      - "~2048 bytes per cookie, 90-day lifetime cap, and no PSL restriction"
      - "No size cap, 1-year lifetime cap, and Domain must always be set"
    answer: 0
    explanation: |
      A single Set-Cookie is limited to ~4096 bytes (name+value+attributes), Chrome caps
      Max-Age/Expires at 400 days, and the Public Suffix List forbids setting a cookie on a
      public suffix (e.g. Domain=.com), preventing supercookies.
    ref: "concepts.md#rfc-6265bis-modern-cookie-rules-and-limits"

  - id: session-management-and-secure-cookies-051
    difficulty: expert
    tags: [schemeful-same-site, samesite, downgrade]
    question: |
      A cross-scheme redirect flow that worked for years suddenly stops sending a Lax cookie
      after a browser update. What change most likely caused this?
    options:
      - "The browser now mandates the HttpOnly attribute on every cookie sent during a top-level navigation"
      - "The browser started enforcing a 4096-byte cookie limit that truncated the cookie during the redirect"
      - "SameSite=Lax was removed as a valid attribute value in the browser update, so the cookie now defaults to None"
      - "Schemeful same-site: http:// and https:// of the same domain are now treated as cross-site, so Lax withholds the cookie"
    answer: 3
    explanation: |
      Modern browsers treat http:// and https:// versions of the same registrable domain as
      cross-site for SameSite purposes (schemeful same-site). A cross-scheme navigation is now
      cross-site, so a Lax (or Strict) cookie is withheld — closing a downgrade gap an on-path
      attacker could exploit.
    ref: "concepts.md#schemeful-same-site-and-the-lax-post-grace-window"

  - id: session-management-and-secure-cookies-052
    difficulty: expert
    tags: [samesite, lax-post, csrf, default]
    question: |
      Why is a cookie set with NO SameSite attribute subtly less safe than one explicitly set
      to SameSite=Lax, with respect to CSRF?
    options:
      - "The default cookie is attached to background cross-site fetch() calls, whereas an explicit Lax cookie is withheld from them"
      - "The default cookie inherits Chrome's Lax+POST 2-minute grace window and is briefly sent on top-level cross-site POST after being set"
      - "The default cookie is quietly treated by the browser as SameSite=None and sent on every cross-site subrequest"
      - "Explicit Lax uniquely disables the cookie even on same-site POST submissions, making it stricter in absolutely all cases"
    answer: 1
    explanation: |
      Chrome's compatibility intervention still sends a default-Lax cookie on top-level cross-site
      POST for the first 2 minutes after it is set. An explicitly declared SameSite=Lax cookie does
      not get that carve-out, so a freshly set default cookie is briefly CSRF-exposed on POST.
    ref: "concepts.md#schemeful-same-site-and-the-lax-post-grace-window"

  - id: session-management-and-secure-cookies-053
    difficulty: expert
    tags: [cookie-tossing, shadowing, path, rfc-6265]
    question: |
      In a cookie-tossing attack, how does the attacker's same-named cookie come to be read
      instead of the legitimate one when both are sent?
    options:
      - "The Cookie header includes each cookie's attribute metadata, so the server can see and deliberately pick the Secure one"
      - "The browser automatically deletes the older of two same-named cookies, leaving only the attacker's copy to be sent"
      - "The Cookie header carries no origin/attribute info, and by giving their cookie a longer Path the attacker makes it sort first, shadowing the real one"
      - "The attacker's cookie is delivered over a separate dedicated header that the server is required to read before Cookie"
    answer: 2
    explanation: |
      The Cookie header carries only name=value pairs with no scope/attribute/origin data. RFC 6265
      sorts cookies by longer Path first (then earlier creation), so an attacker who sets a more
      specific Path makes their same-named cookie appear ahead of the real one — a naive "first
      value wins" server reads the attacker's.
    ref: "concepts.md#cookie-tossing-and-shadowing"

  - id: session-management-and-secure-cookies-054
    difficulty: advanced
    tags: [cookie-tossing, host-prefix, defense]
    question: |
      Which single measure most directly prevents a subdomain from tossing/shadowing the main
      app's session cookie?
    options:
      - "Setting SameSite=Strict on the session cookie so a subdomain is blocked from writing a same-named value"
      - "Adding the Secure attribute so that cookies set by any subdomain over HTTPS cannot shadow the real one"
      - "Raising the session ID entropy to 256 bits so an attacker cannot craft a colliding overwrite value"
      - "Using the __Host- prefix, which forbids Domain and host-locks the cookie so a subdomain cannot set or overwrite it"
    answer: 3
    explanation: |
      Cookie tossing relies on a subdomain setting a Domain-scoped cookie with the same name.
      A __Host- cookie has no Domain and is host-locked, so a subdomain cannot create or overwrite
      it. SameSite governs cross-site sending, and entropy/Secure do not stop same-name overwrites.
    ref: "concepts.md#cookie-tossing-and-shadowing"

  - id: session-management-and-secure-cookies-055
    difficulty: expert
    tags: [session-puzzling, authorization, logic-flaw]
    question: |
      A password-reset flow stores the target account in session.userId, and the authenticated
      area also reads session.userId to identify the logged-in user. How is this exploited?
    options:
      - "An attacker repeatedly brute-forces the numeric session.userId value, incrementing it through the account range until it lands on an administrator"
      - "An attacker walks the reset flow to populate session.userId without logging in, then hits an authenticated endpoint that trusts it — impersonating that user"
      - "An attacker steals the session cookie via injected XSS because password-reset pages are mistakenly served without the HttpOnly flag set"
      - "An attacker captures an already-expired password-reset token from an email link and replays it to silently extend the current session"
    answer: 1
    explanation: |
      This is session puzzling / variable overloading: the same session attribute serves two
      purposes. By advancing the reset flow far enough to set session.userId without authenticating,
      the attacker gets the authenticated area to trust that variable. Defense is per-flow namespacing
      and never inferring identity from partially populated session state.
    ref: "concepts.md#session-puzzling-and-variable-overloading"

  - id: session-management-and-secure-cookies-056
    difficulty: advanced
    tags: [session-puzzling, defense, namespacing]
    question: |
      What is the correct defense against session puzzling (session variable overloading)?
    options:
      - "Encrypt the session cookie value with an authenticated AES-GCM key so its overloaded contents cannot be read or tampered with in transit"
      - "Shorten the idle timeout to two minutes so any overloaded session variable is discarded long before an attacker can reach the authenticated area"
      - "Store the session server-side in a shared Redis store instead of in a self-contained JWT, so the overloaded variable never leaves the server"
      - "Namespace session variables per flow and require an explicit authenticated marker set only by successful login, never inferring identity from arbitrary session state"
    answer: 3
    explanation: |
      Session puzzling is a logic flaw in server-side state, not a confidentiality or storage
      problem. The fix is to isolate each flow's variables and gate the authenticated area on an
      explicit "authenticated" flag set only by login — not on whatever value happens to be present.
    ref: "concepts.md#session-puzzling-and-variable-overloading"

  - id: session-management-and-secure-cookies-057
    difficulty: expert
    tags: [cookie-bomb, dos, availability]
    question: |
      A cookie bomb (cookie jar overflow) attack achieves what effect, and by what mechanism?
    options:
      - "It reads the victim's session cookie by overflowing the browser's cookie store buffer until the HttpOnly protection wraps around and exposes the value to page JavaScript"
      - "It plants many/large cookies scoped to the domain so the browser sends huge Cookie headers, making the server return 400/431 and denying the victim access to the site"
      - "It forges a valid session ID by flooding the cookie store with predictable sequential values until one collides with a live server-side session"
      - "It bypasses the SameSite=Strict restriction entirely by inflating a single cookie past the ~4096-byte per-cookie size limit"
    answer: 1
    explanation: |
      A cookie bomb is a client-side DoS: via XSS, a subdomain, or a hosting neighbor, the attacker
      sets many large domain-scoped cookies. The victim's browser then attaches an oversized Cookie
      header and the server/proxy responds 400 or 431 (Request Header Fields Too Large), locking the
      victim out until they clear cookies.
    ref: "concepts.md#cookie-bomb-and-header-overflow-dos"

  - id: session-management-and-secure-cookies-058
    difficulty: expert
    tags: [infostealer, pass-the-cookie, mfa, sender-constrained]
    question: |
      Infostealer malware on a victim's machine copies a live session cookie from the browser
      profile and replays it from attacker infrastructure, bypassing MFA. HttpOnly, Secure, and
      SameSite were all set. What actually mitigates this replay?
    options:
      - "Rotating the session cookie name on each request so the infostealer copies a cookie key that is stale by the time it is replayed"
      - "Adding the __Host- prefix to the session cookie so the malware cannot copy a host-locked cookie out of the browser profile"
      - "Sender-constrained sessions (DBSC, DPoP, or mTLS) that bind the credential to a key the attacker cannot exfiltrate, plus short renewal timeouts and anomaly detection"
      - "Setting SameSite=Strict and a shorter Max-Age so the copied cookie is refused when replayed from the attacker's own network origin"
    answer: 2
    explanation: |
      Cookie attributes protect against guessing and interception, not theft of a live credential
      by malware reading the cookie store directly. Only binding the session to a non-exportable
      key (DBSC hardware key, DPoP/mTLS proof-of-possession) makes a copied cookie useless off the
      device; short renewal and anomaly detection add depth.
    ref: "concepts.md#sender-constrained-sessions-dbsc-dpop-mtls"

  - id: session-management-and-secure-cookies-059
    difficulty: expert
    tags: [dbsc, device-bound, tpm]
    question: |
      How does Device Bound Session Credentials (DBSC) make a stolen cookie useless on another
      machine?
    options:
      - "It encrypts the cookie value with a passphrase only the user knows and prompts for it each time the cookie is refreshed on the device"
      - "It marks the cookie HttpOnly and stores it in an OS-protected keychain so malware running as the user cannot read it from disk"
      - "It pins the session to the device's MAC address and refuses to validate the cookie from any machine with a different network adapter"
      - "It stores a non-exportable private key in the device TPM and refreshes short-lived cookies only via a challenge-response signed with that key, which the other machine cannot produce"
    answer: 3
    explanation: |
      DBSC binds the session to a hardware-backed (TPM) key pair whose private key is
      non-exportable. Cookies are short-lived and can only be refreshed by signing a server
      challenge with that key. A cookie copied elsewhere cannot be refreshed (no key) and expires
      quickly. HttpOnly does not stop malware reading the on-disk store.
    ref: "concepts.md#sender-constrained-sessions-dbsc-dpop-mtls"

  - id: session-management-and-secure-cookies-060
    difficulty: expert
    tags: [dpop, mtls, token-binding, proof-of-possession]
    question: |
      Which statement about proof-of-possession session/token binding standards is correct?
    options:
      - "DPoP (RFC 9449) attaches a per-request signed JWT proving key possession; mTLS (RFC 8705) binds the token to a client certificate; Token Binding (RFC 8471) was an earlier approach that failed to gain adoption"
      - "DPoP requires a client TLS certificate presented during the handshake, while mTLS instead attaches a per-request signed JWT header carrying the key thumbprint"
      - "Token Binding (RFC 8471) is the current IETF-recommended standard for proof-of-possession and formally supersedes both DPoP and mTLS in modern deployments"
      - "All three standards work by encrypting the bearer token so it is readable only by the issuing server, which is what prevents an XSS payload from stealing it"
    answer: 0
    explanation: |
      DPoP proves possession of a key via a per-request signed JWT (token bound to the key
      thumbprint); mTLS binds the token to the client's TLS certificate; Token Binding was the
      earlier TLS-layer attempt that is effectively dead. None of them is about making tokens
      unreadable to XSS — they make a stolen token unusable without the key/cert.
    ref: "concepts.md#sender-constrained-sessions-dbsc-dpop-mtls"

  - id: session-management-and-secure-cookies-061
    difficulty: expert
    tags: [chips, partitioned, tracking]
    question: |
      What does the Partitioned attribute (CHIPS) do to a cookie set by a third-party embed?
    options:
      - "It encrypts the embed's cookie with a per-frame key so the enclosing top-level site cannot read the value out of the shared cookie jar"
      - "It double-keys the cookie by (top-level site + cookie host), giving the embed a separate cookie jar per top-level site so it cannot be used for cross-site tracking"
      - "It allows the embed to share one unified cookie across every top-level site that embeds it, improving cross-site single sign-on"
      - "It removes the long-standing requirement that cross-site SameSite=None cookies must also carry the Secure attribute"
    answer: 1
    explanation: |
      CHIPS partitions the cookie by the top-level site as well as the cookie host, so the same
      embed on siteA and siteB gets isolated jars and cannot correlate the user across sites.
      Partitioned cookies must still be Secure (typically SameSite=None for the embed context).
    ref: "concepts.md#partitioned-cookies-chips"

  - id: session-management-and-secure-cookies-062
    difficulty: advanced
    tags: [jwt, logout, revocation, expiry]
    question: |
      A stateless JWT access token has a 15-minute expiry and no denylist. The user clicks
      logout, and the app revokes the refresh token. Is the access token dead immediately?
    options:
      - "Yes — revoking the refresh token cascades to every access token minted from it, invalidating the current one on the server instantly"
      - "Yes — the logout handler always rotates the global signing key, so the old access token's signature stops verifying immediately"
      - "No — the access token keeps validating on its own signature for up to its remaining 15 minutes unless you denylist its jti or bump a token_version"
      - "No — but only because the browser cookie holding the access token was not cleared on the logout response; deleting it would end validity at once"
    answer: 2
    explanation: |
      A self-contained access token validates on its signature and remains valid until expiry.
      Revoking the refresh token only stops new access tokens being minted. To kill the current
      access token immediately you need a jti denylist or a per-user token_version/sessionEpoch bump.
    ref: "concepts.md#stateless-token-revocation-toolkit"

  - id: session-management-and-secure-cookies-063
    difficulty: expert
    tags: [refresh-token, rotation, reuse-detection, oauth]
    question: |
      With refresh-token rotation and reuse detection, what should happen when a previously used
      (already-rotated) refresh token is presented again?
    options:
      - "Issue a fresh access and refresh token pair as normal, since the presented refresh token is still within its configured lifetime window"
      - "Extend the already-rotated token's expiry by another interval and log a low-severity warning for the security team to review later"
      - "Silently ignore the duplicate request and keep the previously rotated refresh token valid for the remainder of its lifetime"
      - "Treat it as a signal of theft and revoke the entire token family/lineage"
    answer: 3
    explanation: |
      Each refresh issues a new refresh token and invalidates the prior one. Re-presentation of an
      already-used refresh token indicates the token was stolen and both copies are now in play, so
      the server revokes the whole family/lineage (OAuth 2.1 guidance). Honoring it would let the
      attacker persist.
    ref: "concepts.md#stateless-token-revocation-toolkit"

  - id: session-management-and-secure-cookies-064
    difficulty: expert
    tags: [token-version, global-logout, revocation]
    question: |
      You need "log out everywhere" and immediate invalidation for stateless tokens, but want to
      avoid a per-token denylist lookup on every request. Which mechanism fits best?
    options:
      - "Shorten every issued token's TTL to one second so a logout is effectively immediate without any per-user server-side lookup"
      - "Move all outstanding tokens into browser localStorage so a logout handler can clear them across every open tab at once"
      - "Change the global signing key on each logout, which invalidates the requesting user's tokens without needing a per-user version claim"
      - "Store a per-user token_version claim and bump the integer on logout/password change, invalidating all outstanding tokens with one cheap per-user check"
    answer: 3
    explanation: |
      A per-user token_version (sessionEpoch) claim, compared against a stored integer, invalidates
      all of that user's tokens at once when bumped — cheaper than a per-jti denylist and scoped to
      the one user (unlike rotating the global signing key, which logs everyone out).
    ref: "concepts.md#stateless-token-revocation-toolkit"

  - id: session-management-and-secure-cookies-065
    difficulty: advanced
    tags: [step-up, reauthentication, nist-800-63b]
    question: |
      Per NIST SP 800-63B, when should an application require step-up / fresh authentication even
      in the middle of an active session?
    options:
      - "Only when the session cookie is within a few minutes of its absolute expiry and about to be dropped by the browser"
      - "Before high-value operations such as password/email change, adding MFA, payments, or admin actions"
      - "On every GET request to any page, so that each individual navigation is independently re-verified against a fresh factor"
      - "Never — once the initial login succeeds, the established session should silently authorize all subsequent actions until the user logs out"
    answer: 1
    explanation: |
      Step-up authentication requires a fresh factor before sensitive operations (credential
      changes, adding MFA, payments, admin actions), defeating an attacker riding an open session.
      SP 800-63B also mandates periodic reauthentication (e.g. AAL2 every 12h or 30 min idle).
    ref: "concepts.md#re-authentication-and-step-up-authentication"

  - id: session-management-and-secure-cookies-066
    difficulty: expert
    tags: [reauthentication, aal, nist-800-63b, timeout]
    question: |
      Per NIST SP 800-63B, which reauthentication intervals apply at AAL2 versus AAL3?
    options:
      - "AAL2: reauth every 12 hours or after 30 minutes inactivity; AAL3: every 12 hours or after 15 minutes inactivity"
      - "AAL2: reauthenticate at least every 30 days of use; AAL3: at least every 7 days, with inactivity never forcing an earlier prompt"
      - "AAL2: reauthenticate every 1 hour of use; AAL3: every 4 hours, applied on a fixed clock regardless of any period of user inactivity"
      - "Both AAL2 and AAL3 require reauthentication only once every 24 hours, with no separate shorter interval triggered by inactivity"
    answer: 0
    explanation: |
      SP 800-63B §7.2 sets AAL2 reauthentication at least every 12 hours of use or after 30 minutes
      of inactivity, and AAL3 at every 12 hours or after 15 minutes of inactivity — whichever comes
      first.
    ref: "concepts.md#re-authentication-and-step-up-authentication"

  - id: session-management-and-secure-cookies-067
    difficulty: expert
    tags: [remember-me, selector-validator, persistent-token]
    question: |
      What is the secure design for a persistent "remember me" token?
    options:
      - "Reuse the existing session ID as a long-lived persistent cookie written to disk with a multi-week Max-Age so the user stays signed in"
      - "Store a raw high-entropy random token directly in the database and compare it byte-for-byte against the cookie on each returning visit"
      - "Use a selector:validator token where the validator is stored only as a hash, compared in constant time, and rotated on each use; a selector-hit with a validator mismatch signals theft and invalidates the whole series"
      - "Store the user's password in a reversibly encrypted cookie so the server can decrypt it and re-run login automatically on each return visit"
    answer: 2
    explanation: |
      The selector+validator pattern indexes by selector, stores only a hash of the high-entropy
      validator, compares in constant time, and rotates on use. A matching selector with a mismatched
      validator indicates a stolen/cloned token, so the whole series is invalidated. Reusing the
      session ID or storing raw tokens/passwords is unsafe.
    ref: "concepts.md#persistent-remember-me-tokens"

  - id: session-management-and-secure-cookies-068
    difficulty: advanced
    tags: [remember-me, absolute-timeout]
    question: |
      How should a persistent "remember me" feature interact with the absolute session timeout?
    options:
      - "Remember-me should override the absolute session timeout entirely, keeping the user continuously authenticated so they are never forced to log in again"
      - "The absolute timeout still applies and forces re-authentication; remember-me only streamlines that re-auth, and sensitive actions should still step up"
      - "Remember-me replaces the rotating session ID with a single permanent identifier that stays valid for the life of the account"
      - "The absolute session timeout should be disabled entirely whenever the user has opted into the remember-me feature at login"
    answer: 1
    explanation: |
      Remember-me is a separate long-lived credential and must not defeat the absolute session
      timeout, which still forces periodic re-authentication. Remember-me can make that re-auth
      silent/streamlined, but sensitive operations should still require step-up.
    ref: "concepts.md#persistent-remember-me-tokens"

  - id: session-management-and-secure-cookies-069
    difficulty: expert
    tags: [oidc, back-channel-logout, sso]
    question: |
      In an OIDC SSO deployment, a user logs out of one relying party but remains logged in at the
      IdP, which can silently re-authenticate them. Which mechanism most robustly ends sessions
      across relying parties, even with the browser closed?
    options:
      - "Front-Channel Logout, which loads a hidden iframe pointing at each relying party's logout URL so every browser session is cleared in parallel"
      - "Setting SameSite=Strict on the IdP session cookie so the identity provider cannot silently re-authenticate the user across relying parties"
      - "Clearing the session cookie at the current relying party only, which ends the browser session everywhere it was propagated"
      - "Back-Channel Logout, where the IdP POSTs a signed logout_token (sub/sid) server-to-server to each RP's logout endpoint"
    answer: 3
    explanation: |
      Back-Channel Logout uses a direct server-to-server POST of a signed logout_token, so it works
      even when the browser is closed and does not depend on iframe/third-party-cookie behavior.
      Front-channel iframes are browser-dependent, and clearing one RP's cookie leaves the IdP
      session intact.
    ref: "concepts.md#federated-logout-and-clearing-client-state"

  - id: session-management-and-secure-cookies-070
    difficulty: advanced
    tags: [clear-site-data, logout, client-state]
    question: |
      Which response header instructs the browser to wipe cookies and web storage for the origin,
      useful as part of a thorough logout?
    options:
      - "Clear-Site-Data"
      - "Cache-Control: no-store"
      - "Strict-Transport-Security"
      - "Cross-Origin-Resource-Policy"
    answer: 0
    explanation: |
      Clear-Site-Data: "cookies", "storage" tells the browser to clear cookies, localStorage/
      sessionStorage, and caches for the origin — cleaning up client-side state the server cannot
      otherwise reach. The other headers govern caching, HTTPS enforcement, and resource sharing.
    ref: "concepts.md#federated-logout-and-clearing-client-state"

  - id: session-management-and-secure-cookies-071
    difficulty: advanced
    tags: [logout-csrf, method, csrf]
    question: |
      Why should a logout endpoint be a POST protected by an anti-CSRF token rather than a plain
      GET?
    options:
      - "GET requests are read-only by HTTP semantics and are therefore incapable of deleting the server-side session record on logout"
      - "A GET/no-token logout is itself CSRF-able, letting an attacker force-log-out the victim (a denial), and it can be chained with login CSRF"
      - "POST endpoints are automatically exempt from SameSite cookie rules, so only a POST logout can reliably carry the session cookie"
      - "Browsers deliberately refuse to attach cookies on cross-site GET logout requests, so a GET logout can never actually reach the session"
    answer: 1
    explanation: |
      An unprotected logout endpoint can be triggered cross-site to forcibly log the victim out (a
      nuisance/denial that can be chained with login CSRF). Making logout a POST with a CSRF token
      prevents attacker-initiated logout. GET can technically invalidate a session; the issue is
      forgeability.
    ref: "concepts.md#federated-logout-and-clearing-client-state"

  - id: session-management-and-secure-cookies-072
    difficulty: expert
    tags: [bff, spa, tokens, xss]
    question: |
      In the Backend-for-Frontend (BFF) pattern for a SPA, where do the OAuth access/refresh tokens
      live, and what does the browser hold?
    options:
      - "Tokens live on the BFF server; the browser holds only an HttpOnly, Secure, SameSite first-party session cookie and never sees the OAuth tokens"
      - "Tokens live in the SPA's localStorage and the browser script attaches them in an Authorization: Bearer header on every proxied API call"
      - "Tokens live in a non-HttpOnly first-party cookie so the SPA's own JavaScript can read and re-attach them to each outgoing request"
      - "Tokens are embedded directly in the SPA's JavaScript bundle at build time and shipped to the browser with the static assets"
    answer: 0
    explanation: |
      The BFF holds the OAuth tokens server-side and exposes only an HttpOnly first-party session
      cookie to the SPA, proxying API calls with the real tokens attached server-side. No token
      reaches JavaScript, so an XSS cannot exfiltrate a bearer token — it can at most ride the
      bounded, revocable session.
    ref: "concepts.md#backend-for-frontend-bff-pattern"

  - id: session-management-and-secure-cookies-073
    difficulty: expert
    tags: [double-submit, cookie-tossing, csrf]
    question: |
      A team's naive double-submit-cookie CSRF defense is bypassed in production. What is the most
      likely cause and the correct fix?
    options:
      - "A compromised/sibling subdomain tossed a CSRF cookie with a value it controls; fix with a __Host- prefixed CSRF cookie and/or an HMAC-signed token bound to the session"
      - "The CSRF token had too little entropy at 64 bits; regenerate it as a 256-bit random value so no attacker can brute-force a matching double-submit pair"
      - "The SameSite=Lax attribute silently stripped the CSRF cookie on the cross-site POST; switch the cookie to SameSite=None to restore the double-submit match"
      - "The token was persisted in a server-side session store instead of the cookie; move it entirely into the double-submit cookie so both copies originate client-side"
    answer: 0
    explanation: |
      Naive double-submit relies on an attacker being unable to set the CSRF cookie, but cookie
      tossing from a sibling/subdomain overwrites it with a known value, so the forged request's
      matching token passes. The fix is a __Host- CSRF cookie (host-locked) and/or an HMAC token
      bound to the victim's session, which the attacker cannot forge.
    ref: "concepts.md#signed-double-submit-cookies-and-csrf-token-binding"

  - id: session-management-and-secure-cookies-074
    difficulty: expert
    tags: [host-prefix, domain, rejection]
    question: |
      A developer sends `Set-Cookie: __Host-SESSION=abc; Secure; HttpOnly; Path=/; Domain=example.com`
      over HTTPS. What does a conforming browser do?
    options:
      - "Accept it but quietly strip the __Host- prefix, storing it under the bare name SESSION"
      - "Accept it and, honoring the Domain, share the cookie with every subdomain of example.com"
      - "Reject the Set-Cookie entirely, because __Host- forbids a Domain attribute"
      - "Accept it but silently downgrade it to an equivalent __Secure- prefixed cookie"
    answer: 2
    explanation: |
      The __Host- prefix requires no Domain attribute (plus Secure, HTTPS, Path=/). Including
      Domain violates the prefix rule, so the browser rejects the whole Set-Cookie. Browsers do not
      strip the prefix — the server must read the literal __Host- name.
    ref: "concepts.md#cookie-prefixes-__host--and-__secure-"

  - id: session-management-and-secure-cookies-075
    difficulty: advanced
    tags: [samesite, get, csrf, scenario]
    question: |
      A state-changing endpoint is implemented as a GET, and the team sets the session cookie to
      SameSite=Lax to stop CSRF. Why is this insufficient, and what is the correct fix?
    options:
      - "Lax withholds the cookie from every GET including same-site ones, so the endpoint will break for real users; switch the cookie to SameSite=None to make the GET function again"
      - "Lax still sends the cookie on top-level cross-site GET navigations, so the endpoint remains CSRF-exploitable; make it POST with an anti-CSRF token (or SameSite=Strict plus a token)"
      - "Lax already blocks the cross-site GET completely, so the endpoint is fully protected and no further change to method or tokens is needed"
      - "The endpoint should move its anti-CSRF token out of the cookie and into browser localStorage, since values kept in localStorage are never auto-sent cross-site"
    answer: 1
    explanation: |
      SameSite=Lax permits the cookie on top-level cross-site GET navigations, so a state-changing
      GET is still forgeable (e.g. via a link or img/redirect). State-changing actions should never
      be GET; make it POST with an anti-CSRF token, or use SameSite=Strict plus a token.
    ref: "concepts.md#cookie-attributes-samesite-lax-strict-none"

  - id: session-management-and-secure-cookies-076
    difficulty: advanced
    tags: [login-csrf, session-fixation, rotation]
    question: |
      In a login CSRF attack, the attacker forces the victim's browser to log in to the ATTACKER's
      account. Which combination best defends against it?
    options:
      - "An anti-CSRF token on the login form plus regenerating the session ID after login"
      - "Setting HttpOnly on the session cookie alone, so the forged login response cannot be read by script"
      - "Storing the session token in localStorage instead of a cookie, so a forged login form cannot reach it"
      - "Setting a longer absolute session timeout so a forced login is flushed at the next re-auth"
    answer: 0
    explanation: |
      Login CSRF is prevented by protecting the login form itself with an anti-CSRF token (and
      SameSite), so an attacker cannot silently submit their credentials into the victim's browser,
      plus rotating the session ID at login (the fixation-style defense). HttpOnly, localStorage, and
      timeouts don't address forged logins.
    ref: "concepts.md#session-fixation"

  - id: session-management-and-secure-cookies-077
    difficulty: intermediate
    tags: [firesheep, secure, hsts, history]
    question: |
      Firesheep famously demonstrated hijacking sessions on open Wi-Fi. If a site already uses TLS
      for login, why does the Secure attribute (with HTTPS-everywhere and HSTS) still matter?
    options:
      - "Secure encrypts the cookie value at rest inside the server's session store, so a stolen database dump cannot be replayed on the open network"
      - "Without Secure (and full HTTPS/HSTS), any later plaintext HTTP request leaks the cookie on the wire, so the session can be sniffed even if the login page used TLS"
      - "Secure hides the cookie from page JavaScript so an injected script on shared Wi-Fi cannot read document.cookie and exfiltrate the session"
      - "Firesheep only ever worked against session tokens kept in localStorage, so a cookie-based session on the same open Wi-Fi was never actually at risk"
    answer: 1
    explanation: |
      Firesheep captured session cookies sent over plaintext HTTP on shared networks. Encrypting
      only the login page leaves post-login requests exposed; Secure ensures the cookie is never sent
      over HTTP, and HSTS/HTTPS-everywhere removes the plaintext path entirely. Secure is about
      transport, not at-rest encryption or JS access (that's HttpOnly).
    ref: "concepts.md#session-hijacking"

  - id: session-management-and-secure-cookies-078
    difficulty: expert
    tags: [pass-the-cookie, mfa, moveit, incident]
    question: |
      Why do "pass-the-cookie" attacks (and incidents where a stolen/forged session cookie bypasses
      MFA) reframe which artifact is the real "crown jewel"?
    options:
      - "Because the password is always the more valuable artifact, since it unlocks every downstream account through credential reuse and never expires like a session token does"
      - "Because a stolen live session cookie already represents a post-authentication (post-MFA) state, so replaying it grants access without re-prompting a second factor — the session token, not the password, is the prize"
      - "Because TOTP and other MFA codes never actually expire once generated, so a captured second-factor code can be replayed indefinitely alongside the password"
      - "Because session cookies are always written to disk completely unencrypted while passwords are salted and hashed, making the cookie the softer target"
    answer: 1
    explanation: |
      A live session cookie encodes an already-authenticated, post-MFA state; replaying it doesn't
      trigger a new MFA prompt. So an attacker who steals the session token bypasses MFA entirely,
      making the live session — not the password — the crown jewel. This is why sender-constrained
      sessions and anomaly detection matter.
    ref: "concepts.md#sender-constrained-sessions-dbsc-dpop-mtls"
