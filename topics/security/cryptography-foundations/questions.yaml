topic: "Cryptography Foundations: Symmetric, Asymmetric, Hashing & Signatures"
domain: security
topic_slug: cryptography-foundations
version: 1
questions:
  - id: cryptography-foundations-001
    difficulty: beginner
    tags: [symmetric, aes, fundamentals]
    question: |
      What fundamentally distinguishes symmetric encryption from asymmetric encryption?
    options:
      - "Symmetric encryption uses one shared key for both encryption and decryption; asymmetric uses a public/private key pair"
      - "Symmetric encryption is always more secure than asymmetric encryption"
      - "Symmetric encryption can only encrypt text, while asymmetric can encrypt binary data"
      - "Symmetric encryption provides non-repudiation, while asymmetric does not"
    answer: 0
    explanation: |
      Symmetric ciphers (AES) use a single shared secret key for both directions and are fast.
      Asymmetric crypto uses a key pair (public + private), solving key distribution and
      enabling signatures, at the cost of much slower operations.
    ref: "concepts.md#symmetric-encryption-and-aes"

  - id: cryptography-foundations-002
    difficulty: beginner
    tags: [aes, block-cipher]
    question: |
      AES is a block cipher. What is its block size, and what key sizes does it support?
    options:
      - "64-bit blocks; 56/112/168-bit keys"
      - "256-bit blocks; 256/512/1024-bit keys"
      - "Variable block size; only 256-bit keys"
      - "128-bit blocks; 128/192/256-bit keys"
    answer: 3
    explanation: |
      AES (FIPS 197) operates on fixed 128-bit (16-byte) blocks and supports 128-, 192-, and
      256-bit keys. AES-128 and AES-256 are both secure; AES-256 is chosen mainly for
      long-term/post-quantum margin.
    ref: "concepts.md#symmetric-encryption-and-aes"

  - id: cryptography-foundations-003
    difficulty: beginner
    tags: [symmetric, key-distribution]
    question: |
      What is the primary practical challenge of symmetric encryption that asymmetric
      cryptography was designed to solve?
    options:
      - "It is too slow for bulk data"
      - "Securely distributing the shared secret key to both parties"
      - "It cannot provide confidentiality"
      - "It requires quantum-resistant hardware"
    answer: 1
    explanation: |
      Symmetric encryption is fast but both parties must already share the secret key over
      some secure channel — the key-distribution problem. Asymmetric crypto (and DH key
      exchange) solves establishing that shared secret without prior contact.
    ref: "concepts.md#symmetric-encryption-and-aes"

  - id: cryptography-foundations-004
    difficulty: intermediate
    tags: [stream-cipher, chacha20]
    question: |
      In what scenario is ChaCha20-Poly1305 typically preferred over AES-GCM?
    options:
      - "When you need a hash function instead of a cipher"
      - "On devices without AES hardware acceleration, where software AES is slower and can leak timing"
      - "When you must avoid using any authentication tag"
      - "Only when encrypting data larger than 4 GB"
    answer: 1
    explanation: |
      ChaCha20-Poly1305 (RFC 8439) is a fast software-friendly AEAD stream cipher. On
      hardware lacking AES-NI (e.g., older mobile), software AES is slower and more prone to
      cache-timing leaks, so ChaCha20-Poly1305 is preferred.
    ref: "concepts.md#symmetric-encryption-and-aes"

  - id: cryptography-foundations-005
    difficulty: beginner
    tags: [ecb, modes]
    question: |
      Why is ECB (Electronic Codebook) mode considered insecure, even with AES-256?
    options:
      - "It uses a key that is too short"
      - "It cannot decrypt what it encrypts"
      - "It is far slower than every other mode"
      - "Identical plaintext blocks always encrypt to identical ciphertext blocks, leaking patterns"
    answer: 3
    explanation: |
      ECB encrypts each block independently with the same key, so repeating plaintext blocks
      produce identical ciphertext (the "ECB penguin"). This leaks structure and allows block
      reordering. Key size does not fix this — the mode itself is broken.
    ref: "concepts.md#block-cipher-modes-and-aead"

  - id: cryptography-foundations-006
    difficulty: intermediate
    tags: [aead, gcm]
    question: |
      What does AEAD (Authenticated Encryption with Associated Data) provide that plain
      CBC or CTR mode does not?
    options:
      - "Faster encryption throughput"
      - "Smaller ciphertext than the plaintext"
      - "Built-in integrity/authenticity via an authentication tag, failing closed on tampering"
      - "The ability to encrypt without a key"
    answer: 2
    explanation: |
      AEAD (AES-GCM, ChaCha20-Poly1305) bundles confidentiality with an integrity/authenticity
      tag and can authenticate associated data. Decryption fails if the tag doesn't verify.
      Plain CBC/CTR give confidentiality but no integrity, so bits can be flipped undetected.
    ref: "concepts.md#block-cipher-modes-and-aead"

  - id: cryptography-foundations-007
    difficulty: intermediate
    tags: [cbc, padding-oracle]
    question: |
      Which weakness is historically associated with CBC mode when the receiver reveals
      whether padding is valid?
    options:
      - "Padding-oracle attacks (e.g., POODLE, Vaudenay)"
      - "Length-extension attacks"
      - "Birthday collisions"
      - "Key-recovery via Shor's algorithm"
    answer: 0
    explanation: |
      CBC needs PKCS#7 padding. If the server distinguishes valid vs invalid padding (via
      error, timing, or behavior), an attacker can decrypt ciphertext byte-by-byte — the
      padding-oracle attack (Vaudenay; POODLE was a variant). AEAD modes avoid this.
    ref: "concepts.md#block-cipher-modes-and-aead"

  - id: cryptography-foundations-008
    difficulty: intermediate
    tags: [ctr, malleability]
    question: |
      A developer encrypts data with AES-CTR and no MAC. What is the main security problem?
    options:
      - "CTR mode cannot be decrypted without the IV"
      - "CTR mode reveals the key after enough blocks"
      - "CTR provides confidentiality but no integrity — an attacker can flip ciphertext bits to flip the same plaintext bits"
      - "CTR mode requires padding, which leaks length"
    answer: 2
    explanation: |
      CTR turns AES into a stream cipher (keystream XOR plaintext). It is malleable: flipping
      a ciphertext bit flips the corresponding plaintext bit, and there is no integrity check.
      Use an AEAD mode (GCM) or add a MAC (encrypt-then-MAC).
    ref: "concepts.md#block-cipher-modes-and-aead"

  - id: cryptography-foundations-009
    difficulty: advanced
    tags: [composition, encrypt-then-mac]
    question: |
      If you must compose encryption and a MAC manually, which order is the safe generic choice?
    options:
      - "MAC-then-encrypt"
      - "Encrypt-and-MAC (both over the plaintext)"
      - "Encrypt-then-MAC (MAC computed over the ciphertext)"
      - "Order does not matter for security"
    answer: 2
    explanation: |
      Encrypt-then-MAC is the provably safe generic composition: the MAC is computed over the
      ciphertext, so tampering is detected before decryption. MAC-then-encrypt and
      encrypt-and-MAC have led to real attacks. Better still: use an AEAD mode and don't
      compose it yourself.
    ref: "concepts.md#block-cipher-modes-and-aead"

  - id: cryptography-foundations-010
    difficulty: intermediate
    tags: [nonce, gcm]
    question: |
      For AES-GCM, what property must the nonce (IV) satisfy?
    options:
      - "It must be secret and never transmitted"
      - "It must be identical for all messages so both sides agree"
      - "It must be at least 256 bits long"
      - "It must be unique per key — it must never repeat for a given key"
    answer: 3
    explanation: |
      A GCM nonce need not be secret or even random, but it must be unique per key. The
      recommended size is 96 bits (12 bytes). Repeating a nonce under the same key is
      catastrophic for both confidentiality and integrity.
    ref: "concepts.md#iv-and-nonce-reuse-dangers"

  - id: cryptography-foundations-011
    difficulty: advanced
    tags: [nonce-reuse, gcm, forbidden-attack]
    question: |
      A service hardcodes a single 12-byte nonce and reuses it for every AES-GCM message
      under one key. What is the full impact?
    options:
      - "No impact; GCM tolerates nonce reuse"
      - "Only performance degrades"
      - "Confidentiality is lost (C1 XOR C2 leaks P1 XOR P2) AND integrity is lost (the GHASH subkey can be recovered to forge tags)"
      - "Only the authentication tag becomes larger"
    answer: 2
    explanation: |
      Reusing a GCM nonce reuses the keystream, so C1 XOR C2 = P1 XOR P2 leaks plaintext
      relationships. Worse, it lets an attacker recover the GHASH authentication subkey H and
      forge valid tags for arbitrary messages — the "forbidden attack," a total break.
    ref: "concepts.md#iv-and-nonce-reuse-dangers"

  - id: cryptography-foundations-012
    difficulty: intermediate
    tags: [cbc, iv]
    question: |
      For CBC mode, what property must the IV have (assuming it is sent alongside the ciphertext)?
    options:
      - "It must be random and unpredictable per message"
      - "It must be the all-zero block for compatibility"
      - "It must equal the encryption key"
      - "It must be reused across messages to save space"
    answer: 0
    explanation: |
      A CBC IV may be public but must be random and unpredictable per message. A predictable
      IV enabled the TLS BEAST attack. (In CTR/GCM the nonce need not be random but must be
      unique per key.)
    ref: "concepts.md#iv-and-nonce-reuse-dangers"

  - id: cryptography-foundations-013
    difficulty: advanced
    tags: [nonce, aes-gcm-siv, high-volume]
    question: |
      A high-throughput system generates random 96-bit GCM nonces and worries about
      collisions. Which mitigation is most appropriate?
    options:
      - "Switch to ECB mode to avoid nonces entirely"
      - "Reduce the nonce to 32 bits so collisions are easier to detect"
      - "Encrypt every message twice"
      - "Use a deterministic counter nonce or a misuse-resistant AEAD like AES-GCM-SIV (RFC 8452)"
    answer: 3
    explanation: |
      With random 96-bit nonces, the birthday bound limits a single key to roughly 2^32
      messages before repeat risk. High-volume systems should use a deterministic counter or
      a nonce-misuse-resistant AEAD (AES-GCM-SIV), which degrades gracefully on reuse.
    ref: "concepts.md#iv-and-nonce-reuse-dangers"

  - id: cryptography-foundations-014
    difficulty: beginner
    tags: [asymmetric, direction]
    question: |
      To send a confidential message to Alice using asymmetric encryption, which key do you
      encrypt with?
    options:
      - "Alice's private key"
      - "Your own private key"
      - "A shared symmetric key only"
      - "Alice's public key"
    answer: 3
    explanation: |
      For confidentiality you encrypt with the recipient's public key so that only the
      recipient — the sole holder of the matching private key — can decrypt. (For signatures
      it's the reverse: sign with your private key, verify with your public key.)
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-015
    difficulty: intermediate
    tags: [rsa, ecc, key-size]
    question: |
      Roughly what RSA key size gives security comparable to a 256-bit ECC key (P-256)?
    options:
      - "3072-bit RSA"
      - "512-bit RSA"
      - "1024-bit RSA"
      - "16384-bit RSA"
    answer: 0
    explanation: |
      256-bit ECC ≈ 3072-bit RSA ≈ 128-bit symmetric security. ECC achieves equivalent
      strength with far smaller keys, which is why new systems favor it — faster operations
      and less bandwidth.
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-016
    difficulty: intermediate
    tags: [rsa, padding, oaep]
    question: |
      Which RSA constructions should be used for encryption and signatures respectively,
      to avoid classic padding attacks?
    options:
      - "Textbook RSA for both"
      - "PKCS#1 v1.5 encryption and MD5-based signatures"
      - "RSA-OAEP for encryption and RSA-PSS for signatures"
      - "ECB-RSA and CBC-RSA"
    answer: 2
    explanation: |
      Use RSA-OAEP for encryption and RSA-PSS for signatures. Textbook RSA is deterministic
      and malleable; PKCS#1 v1.5 encryption padding enabled the Bleichenbacher oracle attack.
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-017
    difficulty: advanced
    tags: [ecdsa, nonce, rfc6979]
    question: |
      Why did reusing or leaking the per-signature value 'k' compromise ECDSA private keys
      (as in the Sony PS3 breach), and what fixes it?
    options:
      - "k is the public key; making it public leaks the private key. Fix: keep k secret in a file"
      - "A repeated or biased k lets an attacker solve for the private key; deterministic ECDSA (RFC 6979) or Ed25519 removes the RNG dependency"
      - "k must equal the message hash; the fix is to hash twice"
      - "There is no real risk; the PS3 breach was unrelated to k"
    answer: 1
    explanation: |
      ECDSA needs a unique, secret, unbiased random k per signature. Reuse or bias lets an
      attacker recover the private key from signatures. Deterministic ECDSA (RFC 6979) derives
      k from key+message, and Ed25519 is deterministic by design — both eliminate this bug.
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-018
    difficulty: intermediate
    tags: [eddsa, ed25519]
    question: |
      What makes Ed25519 (EdDSA) attractive for new signature work compared with classic ECDSA?
    options:
      - "It is based on integer factorization, which is faster"
      - "It uses 4096-bit keys for extra safety"
      - "It provides encryption as well as signing in one step"
      - "It is deterministic by design (no per-signature RNG), fast, and resistant to many side channels"
    answer: 3
    explanation: |
      Ed25519 (RFC 8032) is deterministic — no per-signature random k that can fail — plus
      fast and side-channel resistant. This removes an entire class of ECDSA nonce-reuse
      vulnerabilities.
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-019
    difficulty: advanced
    tags: [post-quantum, shor]
    question: |
      A large quantum computer running Shor's algorithm most directly breaks which of these?
    options:
      - "AES-256 symmetric encryption"
      - "SHA-256 hashing"
      - "RSA and ECC (factoring / discrete-log based public-key crypto)"
      - "HMAC-SHA256"
    answer: 2
    explanation: |
      Shor's algorithm breaks factoring and discrete-log problems, so RSA, ECC, and DH fall.
      Symmetric ciphers and hashes are only weakened by Grover (effectively halved strength),
      so AES-256 and SHA-256 remain safe. Hence the PQC migration targets key exchange and
      signatures (ML-KEM/ML-DSA).
    ref: "concepts.md#asymmetric-encryption-rsa-and-ecc"

  - id: cryptography-foundations-020
    difficulty: beginner
    tags: [diffie-hellman, key-exchange]
    question: |
      What problem does Diffie-Hellman key exchange solve?
    options:
      - "It lets two parties who share no prior secret derive a shared secret over a public channel"
      - "It compresses data before encryption"
      - "It stores passwords securely"
      - "It signs documents for non-repudiation"
    answer: 0
    explanation: |
      DH allows two parties with no pre-shared secret to agree on a shared key over a public
      channel; an eavesdropper who sees the full exchange cannot compute the secret (discrete-log
      hardness). ECDH is the elliptic-curve variant (X25519 is popular).
    ref: "concepts.md#key-exchange-diffie-hellman-and-ecdh"

  - id: cryptography-foundations-021
    difficulty: intermediate
    tags: [diffie-hellman, mitm, authentication]
    question: |
      Unauthenticated Diffie-Hellman is vulnerable to which attack, and why?
    options:
      - "Man-in-the-middle, because DH provides key agreement but not authentication of who you agreed with"
      - "Padding-oracle, because DH uses CBC internally"
      - "Length-extension, because DH uses SHA-1"
      - "Replay, because DH keys never change"
    answer: 0
    explanation: |
      DH establishes a shared key but does not authenticate the parties. An attacker can run a
      separate DH with each side (MITM). DH must be combined with authentication — signatures,
      certificates, or a pre-shared key — to know who you share the key with.
    ref: "concepts.md#key-exchange-diffie-hellman-and-ecdh"

  - id: cryptography-foundations-022
    difficulty: advanced
    tags: [forward-secrecy, ecdhe]
    question: |
      Why does ephemeral ECDHE provide forward secrecy while static RSA key transport does not?
    options:
      - "ECDHE uses larger keys, so it is simply harder to break"
      - "RSA cannot be recorded on the wire"
      - "Ephemeral session keys aren't derivable from the long-term key, so later compromise of that key can't decrypt past recorded sessions"
      - "ECDHE encrypts twice, RSA only once"
    answer: 2
    explanation: |
      With ephemeral (EC)DHE a fresh key pair is used per session and session keys are not
      derived solely from the long-term key. Stealing the server's long-term private key later
      cannot decrypt previously recorded sessions. Static RSA key transport lacks this: one key
      compromise decrypts all recorded traffic.
    ref: "concepts.md#key-exchange-diffie-hellman-and-ecdh"

  - id: cryptography-foundations-023
    difficulty: intermediate
    tags: [hkdf, kdf, dh]
    question: |
      After an ECDH exchange, why should you run the raw shared secret through a KDF like
      HKDF rather than using it directly as an AES key?
    options:
      - "To make the key longer than 256 bits"
      - "Because AES cannot accept ECDH output"
      - "To encrypt the shared secret a second time"
      - "To concentrate/normalize entropy and derive independent keys with context labels; the raw secret isn't uniformly distributed key material"
    answer: 3
    explanation: |
      The raw DH output is a group element, not uniform key bits. HKDF's extract step
      concentrates entropy into a pseudorandom key, and the expand step derives multiple
      independent keys with distinct 'info' labels (e.g., separate send/receive keys).
    ref: "concepts.md#key-exchange-diffie-hellman-and-ecdh"

  - id: cryptography-foundations-024
    difficulty: beginner
    tags: [hashing, properties]
    question: |
      Which is a defining property of a cryptographic hash function?
    options:
      - "It is reversible with the right key"
      - "It is deterministic and maps arbitrary input to a fixed-length, one-way digest"
      - "It always produces output larger than the input"
      - "It requires a secret key to compute"
    answer: 1
    explanation: |
      A cryptographic hash is deterministic, one-way, and produces a fixed-length digest from
      arbitrary-length input (SHA-256 → 256 bits). It uses no secret key (that's what makes a
      MAC different), and it is not reversible.
    ref: "concepts.md#cryptographic-hash-functions-and-properties"

  - id: cryptography-foundations-025
    difficulty: intermediate
    tags: [collision, birthday]
    question: |
      Because of the birthday bound, roughly how much work does finding a collision in an
      n-bit hash require?
    options:
      - "About 2^(n/2)"
      - "About 2^n"
      - "About n^2"
      - "About 2n"
    answer: 0
    explanation: |
      Collisions cost ~2^(n/2) work due to the birthday paradox, versus ~2^n for a preimage.
      So SHA-256 gives ~128-bit collision resistance and ~256-bit preimage resistance — which
      is why digests are sized 256+ bits.
    ref: "concepts.md#cryptographic-hash-functions-and-properties"

  - id: cryptography-foundations-026
    difficulty: intermediate
    tags: [preimage, second-preimage, definitions]
    question: |
      "Given a message m1, it is infeasible to find a different m2 with the same hash" defines
      which property?
    options:
      - "Preimage resistance"
      - "Second-preimage resistance"
      - "Collision resistance"
      - "Avalanche effect"
    answer: 1
    explanation: |
      Second-preimage resistance fixes one message m1 and asks for a different m2 with the same
      digest. Preimage resistance is inverting a given digest; collision resistance is finding
      ANY two colliding messages (the easiest to break, per the birthday bound).
    ref: "concepts.md#cryptographic-hash-functions-and-properties"

  - id: cryptography-foundations-027
    difficulty: advanced
    tags: [length-extension, sha3, sha256]
    question: |
      SHA-256 is vulnerable to length-extension attacks, but SHA-3 (Keccak) is not. Why?
    options:
      - "SHA-3 uses a longer digest"
      - "SHA-3 is keyed by default"
      - "SHA-256 is actually not vulnerable to length extension"
      - "SHA-3 uses a sponge construction, structurally different from SHA-2's Merkle-Damgard design"
    answer: 3
    explanation: |
      SHA-2 uses Merkle-Damgard, exposing internal state in the output and enabling
      length-extension (which breaks naive H(secret||message) MACs). SHA-3's sponge
      construction doesn't leak the full state, so it isn't length-extension-vulnerable.
      Either way, use HMAC rather than raw H(key||msg).
    ref: "concepts.md#cryptographic-hash-functions-and-properties"

  - id: cryptography-foundations-028
    difficulty: intermediate
    tags: [md5, sha1, collisions]
    question: |
      When we say MD5 and SHA-1 are "broken," which specific property has been defeated?
    options:
      - "Collision resistance — finding two different inputs with the same hash is practical"
      - "Preimage resistance — they can be trivially inverted"
      - "Determinism — they now produce random output"
      - "Fixed output length — they now vary"
    answer: 0
    explanation: |
      Both are broken on collision resistance: MD5 collisions take seconds; SHA-1 fell to the
      SHAttered attack (2017) and later chosen-prefix collisions. Preimage resistance is not
      (fully) broken, which is why HMAC-SHA1 remains technically unbroken — but migrate anyway.
    ref: "concepts.md#why-md5-and-sha-1-are-broken"

  - id: cryptography-foundations-029
    difficulty: advanced
    tags: [md5, certificates, flame]
    question: |
      How did the Flame malware abuse MD5's weakness?
    options:
      - "It brute-forced MD5 preimages of passwords"
      - "It reversed MD5 to recover a private key"
      - "It forged a Microsoft code-signing certificate using an MD5 chosen-prefix collision"
      - "It used MD5 to encrypt stolen data"
    answer: 2
    explanation: |
      Flame (2012) used an MD5 chosen-prefix collision to forge a certificate that appeared to
      be signed by Microsoft, enabling it to masquerade as a legitimate Windows Update. This is
      a concrete demonstration of why collision resistance matters for certificates/signatures.
    ref: "concepts.md#why-md5-and-sha-1-are-broken"

  - id: cryptography-foundations-030
    difficulty: advanced
    tags: [hmac-sha1, collision, subtlety]
    question: |
      Is HMAC-SHA1 necessarily insecure just because SHA-1's collision resistance is broken?
    options:
      - "Yes — any use of SHA-1 is immediately exploitable"
      - "No — HMAC's security doesn't rely on collision resistance, so HMAC-SHA1 remains technically unbroken, though migration is still recommended"
      - "Yes — HMAC amplifies collisions"
      - "No — because HMAC does not use the hash function at all"
    answer: 1
    explanation: |
      HMAC's security proof depends on properties other than collision resistance, so
      HMAC-SHA1 is not directly broken by SHA-1 collisions. Still, best practice is to migrate
      to HMAC-SHA256 — there's no reason to keep a wounded primitive.
    ref: "concepts.md#why-md5-and-sha-1-are-broken"

  - id: cryptography-foundations-031
    difficulty: beginner
    tags: [mac, hmac]
    question: |
      What does a MAC (Message Authentication Code) such as HMAC provide?
    options:
      - "Confidentiality only"
      - "Non-repudiation to any third party"
      - "Compression of the message"
      - "Integrity and authenticity to parties who share the secret key"
    answer: 3
    explanation: |
      A MAC proves integrity and authenticity to holders of the shared secret: only someone
      with the key can produce a valid tag. It does not provide confidentiality, and because
      both parties share the key, it does not give non-repudiation.
    ref: "concepts.md#hmac-and-message-authentication-codes"

  - id: cryptography-foundations-032
    difficulty: intermediate
    tags: [hmac, length-extension]
    question: |
      Why is HMAC preferred over the naive construction H(key || message)?
    options:
      - "H(key || message) is slower"
      - "HMAC does not require a key"
      - "H(key || message) produces a longer tag"
      - "HMAC's nested construction is immune to length-extension attacks that affect H(key || message) with Merkle-Damgard hashes"
    answer: 3
    explanation: |
      With Merkle-Damgard hashes (MD5, SHA-1, SHA-256), H(key||message) is vulnerable to
      length-extension: an attacker can append data and compute a valid tag without the key.
      HMAC's two-pass nested design (ipad/opad) defeats this.
    ref: "concepts.md#hmac-and-message-authentication-codes"

  - id: cryptography-foundations-033
    difficulty: intermediate
    tags: [mac-vs-signature, non-repudiation]
    question: |
      Why can a symmetric MAC NOT provide non-repudiation, while a digital signature can?
    options:
      - "Both parties hold the same secret key, so either could have produced the tag; only the signer holds a signature's private key"
      - "MACs are too short to be legally binding"
      - "MACs do not verify integrity"
      - "Signatures are symmetric and MACs are asymmetric"
    answer: 0
    explanation: |
      With a shared-secret MAC, sender and receiver both hold the key, so either could have
      generated a valid tag — you can't prove authorship to a third party. Only the signer
      holds a signature's private key, so a valid signature binds it to them: non-repudiation.
    ref: "concepts.md#hmac-and-message-authentication-codes"

  - id: cryptography-foundations-034
    difficulty: advanced
    tags: [timing-attack, constant-time]
    question: |
      A server verifies a MAC with ordinary string equality: `if (receivedTag == expected)`.
      What is the vulnerability and the fix?
    options:
      - "No issue; string equality is fine for tags"
      - "The tag is stored in plaintext; fix by hashing it"
      - "Early-exit comparison leaks how many leading bytes matched via timing, enabling byte-by-byte forgery; fix with a constant-time comparison"
      - "The comparison is too slow; fix with a faster hash"
    answer: 2
    explanation: |
      Byte-by-byte equality returns as soon as a byte differs, so response timing reveals the
      length of the matching prefix. An attacker can recover the correct tag one byte at a
      time. Use a constant-time comparison over the full length.
    ref: "concepts.md#hmac-and-message-authentication-codes"

  - id: cryptography-foundations-035
    difficulty: beginner
    tags: [signatures, direction]
    question: |
      In a digital signature scheme, which key signs and which key verifies?
    options:
      - "Sign with the public key, verify with the private key"
      - "Sign with the private key, verify with the public key"
      - "Both operations use the same shared key"
      - "Sign with a hash, verify with a nonce"
    answer: 1
    explanation: |
      You sign (the hash of) the message with your private key; anyone can verify with your
      public key. This is the reverse of confidentiality (encrypt with recipient's public,
      decrypt with their private).
    ref: "concepts.md#digital-signatures-and-non-repudiation"

  - id: cryptography-foundations-036
    difficulty: intermediate
    tags: [hash-then-sign, collision]
    question: |
      Digital signatures sign the hash of a message rather than the message itself. Why does
      this make the hash's collision resistance security-critical?
    options:
      - "Because hashing speeds up the network transfer"
      - "Because signing requires the message to be exactly one block"
      - "If collisions are cheap, an attacker crafts two messages with the same hash, gets the benign one signed, and the signature is also valid for the malicious one"
      - "Because the hash is the private key"
    answer: 2
    explanation: |
      Since the signature is over the digest, two messages sharing a digest share a valid
      signature. If collisions are feasible (MD5/SHA-1), an attacker gets a benign document
      signed and transfers the signature to a colliding malicious document.
    ref: "concepts.md#digital-signatures-and-non-repudiation"

  - id: cryptography-foundations-037
    difficulty: intermediate
    tags: [jwt, hs256, rs256]
    question: |
      In JWT terms, HS256 is an HMAC while RS256/ES256 are signatures. Which statement is correct?
    options:
      - "HS256 uses a shared secret to sign and verify; RS256/ES256 sign with a private key and verify with a public key"
      - "All three use a public/private key pair"
      - "HS256 provides non-repudiation but RS256 does not"
      - "RS256 uses a shared secret; HS256 uses a key pair"
    answer: 0
    explanation: |
      HS256 is HMAC — the same secret both signs and verifies. RS256/ES256 are asymmetric
      signatures — private key signs, public key verifies (publicly verifiable, non-repudiation).
      Confusing the two enables the classic algorithm-confusion attack.
    ref: "concepts.md#digital-signatures-and-non-repudiation"

  - id: cryptography-foundations-038
    difficulty: beginner
    tags: [kdf, password-hash, distinction]
    question: |
      What is the key difference between a general-purpose KDF (like HKDF) and a password
      hashing function (like Argon2id)?
    options:
      - "They are identical and interchangeable"
      - "HKDF assumes high-entropy input and must be fast; password hashes assume low-entropy input and must be deliberately slow/memory-hard"
      - "HKDF is for passwords; Argon2id is for network keys"
      - "Only Argon2id uses a salt"
    answer: 1
    explanation: |
      HKDF derives keys from already-strong input and is intentionally fast. Password hashes
      protect low-entropy human passwords, so they must be slow and memory-hard (plus salted)
      to make offline brute force expensive. Using a fast KDF for passwords is a serious bug.
    ref: "concepts.md#key-derivation-functions-vs-password-hashes"

  - id: cryptography-foundations-039
    difficulty: intermediate
    tags: [argon2, password-storage, recommendation]
    question: |
      Which algorithm does OWASP recommend as the first choice for hashing new passwords?
    options:
      - "MD5 with a salt"
      - "SHA-256 with many iterations"
      - "Argon2id"
      - "Plain bcrypt with work factor 4"
    answer: 2
    explanation: |
      OWASP's Password Storage Cheat Sheet recommends Argon2id as the preferred memory-hard
      choice (e.g., m=19 MiB, t=2, p=1), with scrypt and bcrypt as alternatives and PBKDF2
      when FIPS compliance is required. Fast hashes like MD5/SHA-256 are unsuitable.
    ref: "concepts.md#key-derivation-functions-vs-password-hashes"

  - id: cryptography-foundations-040
    difficulty: intermediate
    tags: [pbkdf2, gpu]
    question: |
      Why is PBKDF2 considered weaker than Argon2id or scrypt for password storage, despite
      being FIPS-approved?
    options:
      - "PBKDF2 is only CPU-hard, not memory-hard, so it is cheap to accelerate massively on GPUs/ASICs"
      - "PBKDF2 does not use a salt"
      - "PBKDF2 truncates passwords at 72 bytes"
      - "PBKDF2 output is too short to store"
    answer: 0
    explanation: |
      PBKDF2 increases only CPU cost via iterations, which GPUs and ASICs parallelize cheaply.
      Argon2id and scrypt are memory-hard, raising the cost of large-scale cracking. Use PBKDF2
      (PBKDF2-HMAC-SHA256, >=600k iterations) mainly when FIPS forces it.
    ref: "concepts.md#key-derivation-functions-vs-password-hashes"

  - id: cryptography-foundations-041
    difficulty: advanced
    tags: [bcrypt, truncation]
    question: |
      A team uses bcrypt but allows long passphrases. What subtle bcrypt behavior must they
      account for?
    options:
      - "bcrypt requires exactly 8-character passwords"
      - "bcrypt cannot use a salt"
      - "bcrypt rejects any password over 20 characters"
      - "bcrypt silently truncates input at 72 bytes, so longer passphrases lose entropy unless pre-hashed"
    answer: 3
    explanation: |
      bcrypt only considers the first 72 bytes of input; everything beyond is ignored. For
      long passphrases, pre-hash the password (e.g., base64(SHA-256(pw))) before bcrypt so the
      full entropy contributes.
    ref: "concepts.md#key-derivation-functions-vs-password-hashes"

  - id: cryptography-foundations-042
    difficulty: intermediate
    tags: [salt, password-storage]
    question: |
      What is the primary purpose of a per-user random salt in password hashing?
    options:
      - "To ensure identical passwords hash differently, defeating precomputed rainbow tables and preventing detection of shared passwords"
      - "To encrypt the password so it can be decrypted later"
      - "To make the hash shorter"
      - "To replace the need for a slow hash function"
    answer: 0
    explanation: |
      A unique random salt per user makes each hash different even for identical passwords, so
      precomputed rainbow tables are useless and attackers must attack each hash separately.
      Salt is stored alongside the hash; it complements (does not replace) a slow function.
    ref: "concepts.md#key-derivation-functions-vs-password-hashes"

  - id: cryptography-foundations-043
    difficulty: beginner
    tags: [csprng, prng, tokens]
    question: |
      Which function is appropriate for generating a security-sensitive value like a session
      ID or password-reset token?
    options:
      - "Math.random() / language default rand()"
      - "A Mersenne Twister PRNG seeded with the current time"
      - "An incrementing counter starting at 1"
      - "A CSPRNG such as SecureRandom, crypto.randomBytes, or getrandom(2)"
    answer: 3
    explanation: |
      Security-sensitive randomness must come from a CSPRNG (SecureRandom, crypto.randomBytes,
      /dev/urandom, getrandom). Ordinary PRNGs like Math.random() or Mersenne Twister are
      predictable — an attacker can recover state and forge tokens.
    ref: "concepts.md#entropy-csprng-vs-prng"

  - id: cryptography-foundations-044
    difficulty: intermediate
    tags: [prng, predictability, attack]
    question: |
      Why is a standard PRNG (e.g., Mersenne Twister / Math.random) dangerous for generating
      tokens, even though its output "looks random"?
    options:
      - "Its output is biased toward zero"
      - "It is too slow for real-time use"
      - "From a few observed outputs an attacker can recover the internal state and predict all past and future outputs"
      - "It cannot produce enough distinct values"
    answer: 2
    explanation: |
      Non-cryptographic PRNGs are statistically random-looking but deterministic and
      reversible: observing some outputs reveals the internal state, letting an attacker
      predict future (and past) values — so tokens/session IDs become forgeable.
    ref: "concepts.md#entropy-csprng-vs-prng"

  - id: cryptography-foundations-045
    difficulty: intermediate
    tags: [session-id, entropy]
    question: |
      According to OWASP guidance, how much entropy should a session identifier carry?
    options:
      - "At least 16 bits"
      - "At least 32 bits"
      - "At least 128 bits, from a CSPRNG"
      - "Exactly 64 bits, from any RNG"
    answer: 2
    explanation: |
      OWASP's Session Management guidance recommends session IDs with at least 128 bits of
      entropy generated by a CSPRNG, making brute-force/guessing infeasible.
    ref: "concepts.md#entropy-csprng-vs-prng"

  - id: cryptography-foundations-046
    difficulty: beginner
    tags: [at-rest, in-transit]
    question: |
      What is the difference between encryption in transit and encryption at rest?
    options:
      - "In transit protects data moving over a network; at rest protects stored data on disk/DB/backups"
      - "In transit uses symmetric keys; at rest always uses asymmetric keys"
      - "They are two names for the same thing"
      - "At rest protects network traffic; in transit protects files"
    answer: 0
    explanation: |
      In transit (TLS, mTLS, SSH) protects data moving over the network from eavesdropping and
      tampering. At rest (FDE, TDE, field-level, envelope encryption) protects stored data
      against theft of media or storage. They are complementary; you need both.
    ref: "concepts.md#encryption-at-rest-vs-in-transit"

  - id: cryptography-foundations-047
    difficulty: intermediate
    tags: [envelope-encryption, kms]
    question: |
      In envelope encryption (the KMS pattern), what is the relationship between the DEK and
      the KEK?
    options:
      - "The DEK encrypts the KEK, which encrypts the data"
      - "DEK and KEK are the same key used twice"
      - "A data encryption key (DEK) encrypts the data, and a key encryption key (KEK) in a KMS/HSM encrypts (wraps) the DEK"
      - "The KEK encrypts the data directly and the DEK is discarded"
    answer: 2
    explanation: |
      A per-object DEK encrypts the data; the KEK (held in a KMS/HSM) wraps the DEK, which is
      stored next to the ciphertext. This enables cheap KEK rotation (re-wrap DEKs without
      re-encrypting data) and keeps the root key in hardware.
    ref: "concepts.md#encryption-at-rest-vs-in-transit"

  - id: cryptography-foundations-048
    difficulty: advanced
    tags: [at-rest, threat-model]
    question: |
      Full-disk / transparent database encryption (encryption at rest) protects against which
      threat, and which threat does it NOT address?
    options:
      - "Protects against a compromised application with legitimate access; does not protect against stolen disks"
      - "Protects against stolen disks/DB files; does NOT protect against a compromised app that already has legitimate decrypt access"
      - "Protects against network eavesdropping; does not protect stored data"
      - "Protects against all threats, including SQL injection"
    answer: 1
    explanation: |
      At-rest encryption defends against theft of physical media or storage files. It does not
      help against a compromised application that legitimately decrypts the data — for that you
      need field-level encryption, tokenization, or tighter access control.
    ref: "concepts.md#encryption-at-rest-vs-in-transit"

  - id: cryptography-foundations-049
    difficulty: intermediate
    tags: [key-size, nist, security-level]
    question: |
      Per NIST SP 800-57, which set gives a consistent ~128-bit security level?
    options:
      - "AES-128, RSA-3072, ECC P-256, SHA-256"
      - "AES-256, RSA-1024, ECC P-192, SHA-1"
      - "3DES, RSA-2048, ECC P-521, MD5"
      - "AES-128, RSA-512, ECC P-224, SHA-224"
    answer: 0
    explanation: |
      NIST SP 800-57 maps the 128-bit level to AES-128, RSA/DH-3072, ECC P-256, and SHA-256.
      Choose one consistent level end to end — the weakest link sets the effective strength.
    ref: "concepts.md#key-sizes-and-algorithm-selection"

  - id: cryptography-foundations-050
    difficulty: intermediate
    tags: [weakest-link, key-size]
    question: |
      A system uses AES-256 for data but wraps the key with RSA-2048. What is the effective
      security level, roughly?
    options:
      - "About 112-bit, set by RSA-2048 as the weak link"
      - "256-bit, set by AES-256"
      - "384-bit, the sum of both"
      - "Undefined, because the two cannot be combined"
    answer: 0
    explanation: |
      Security is bounded by the weakest component. RSA-2048 provides ~112-bit security, so
      pairing it with AES-256 (256-bit) yields ~112-bit overall — the RSA is the weak link.
      Match the strength across the whole system.
    ref: "concepts.md#key-sizes-and-algorithm-selection"

  - id: cryptography-foundations-051
    difficulty: advanced
    tags: [crypto-agility, post-quantum]
    question: |
      What is "crypto-agility" and why does it matter for the post-quantum transition?
    options:
      - "The ability to encrypt faster by skipping padding"
      - "Using multiple ciphers simultaneously on the same data"
      - "Automatically shrinking key sizes over time"
      - "Designing systems so algorithms and key sizes can be swapped (versioned key IDs, algorithm identifiers), which is essential for migrating to ML-KEM/ML-DSA"
    answer: 3
    explanation: |
      Crypto-agility means building formats and systems (versioned key IDs, algorithm labels)
      so you can replace algorithms and key sizes without redesign. It's crucial for the
      post-quantum migration to ML-KEM (FIPS 203) and ML-DSA (FIPS 204).
    ref: "concepts.md#key-sizes-and-algorithm-selection"

  - id: cryptography-foundations-052
    difficulty: intermediate
    tags: [recommended-stack, defaults]
    question: |
      Which is a sensible modern default cryptographic stack for a new application?
    options:
      - "3DES-ECB, RSA-1024, MD5, unsalted SHA-1 passwords, Math.random()"
      - "AES-256-GCM (or ChaCha20-Poly1305), X25519/ECDH, Ed25519/RSA-PSS, SHA-256, HKDF, Argon2id, and a CSPRNG for all randomness"
      - "RC4, DH-512, SHA-1, PBKDF2 with 10 iterations"
      - "AES-ECB, ECDSA with a fixed k, SHA-256 passwords"
    answer: 1
    explanation: |
      A modern default: AES-256-GCM or ChaCha20-Poly1305 for AEAD, X25519/ECDH for key
      agreement, Ed25519 or RSA-PSS-3072 for signatures, SHA-256/SHA-3 for hashing, HKDF for
      key derivation, Argon2id for passwords, and a CSPRNG everywhere randomness is needed.
    ref: "concepts.md#key-sizes-and-algorithm-selection"

  - id: cryptography-foundations-053
    difficulty: expert
    tags: [committing-aead, partitioning-oracle, gcm]
    question: |
      A password manager encrypts vault blobs with AES-GCM; blobs are shared between users,
      and the sync server returns a distinct error when a submitted blob fails to decrypt
      under the target user's key. An attacker crafts blobs to probe many candidate passwords
      per request. Which property is missing and what closes it?
    options:
      - "AES-GCM is not key-committing, enabling a partitioning oracle; switch to a committing AEAD that binds the ciphertext to exactly one key"
      - "The nonce is reused; assign a unique 96-bit nonce per blob and the attack disappears"
      - "The tag is too short; use a 256-bit authentication tag instead of 128-bit"
      - "AES-GCM lacks forward secrecy; wrap each blob key with ephemeral ECDHE"
    answer: 0
    explanation: |
      Standard AEADs (AES-GCM, ChaCha20-Poly1305, GCM-SIV) are not key-committing: an attacker
      can craft one ciphertext valid under many keys (key multi-collision). A success/fail
      oracle then partitions the password set per query (Len-Grubbs-Ristenpart, USENIX 2021,
      which broke Shadowsocks/early OPAQUE). Nonce uniqueness, longer tags, and forward secrecy
      do not address commitment. Fix: a committing AEAD (e.g., hash-of-key commitment).
    ref: "concepts.md#key-committing-aead-and-partitioning-oracle-attacks"

  - id: cryptography-foundations-054
    difficulty: advanced
    tags: [committing-aead, gcm-siv, misconception]
    question: |
      A team hears that AES-GCM-SIV is "misuse-resistant" and concludes it also solves the
      key-commitment problem for their multi-recipient encryption. Are they correct?
    options:
      - "No — GCM-SIV resists nonce misuse but is still not key-committing; those are different properties"
      - "Yes — misuse-resistance implies key-commitment by definition"
      - "Yes — the synthetic IV commits the ciphertext to the key"
      - "No — GCM-SIV is actually weaker than GCM and should never be used"
    answer: 0
    explanation: |
      Nonce-misuse resistance (graceful degradation on nonce reuse) and key-commitment
      (ciphertext valid under only one key) are orthogonal. AES-GCM-SIV (RFC 8452) provides the
      former but is explicitly NOT key-committing, so multi-recipient/partitioning-oracle risks
      remain. You need a dedicated committing construction.
    ref: "concepts.md#key-committing-aead-and-partitioning-oracle-attacks"

  - id: cryptography-foundations-055
    difficulty: expert
    tags: [cbc, padding-oracle, mechanics]
    question: |
      In a CBC padding-oracle attack, after you brute-force byte position 15 of the crafted
      preceding block C' until the oracle reports valid padding (implying plaintext 0x01),
      what have you actually learned, and how do you get the real plaintext byte?
    options:
      - "You learned the AES key directly; decrypt normally"
      - "You learned C'[15]; the real plaintext is just C'[15] itself"
      - "You learned the intermediate value I[15] = C'[15] XOR 0x01; the real plaintext is P[15] = I[15] XOR (genuine C[i-1][15])"
      - "You learned the tag; recompute the MAC to recover plaintext"
    answer: 2
    explanation: |
      Valid padding means P = I XOR C' ended in 0x01, so I[15] = C'[15] XOR 0x01 — the
      key-independent intermediate value D_K(C[i])[15]. XORing it with the genuine previous
      ciphertext byte recovers the true plaintext P[15]. Repeating right-to-left decrypts the
      whole block with no key.
    ref: "concepts.md#cbc-padding-oracles-and-aead-composition-order"

  - id: cryptography-foundations-056
    difficulty: expert
    tags: [lucky13, mac-then-encrypt, tls]
    question: |
      Why were TLS 1.0-1.2 CBC cipher suites vulnerable to Lucky13 while GCM/AEAD suites were
      not, and what is the correct composition?
    options:
      - "CBC used encrypt-then-MAC, which is inherently broken; the fix is MAC-then-encrypt"
      - "GCM suites reuse nonces, which accidentally masked the timing signal"
      - "CBC used encrypt-and-MAC, which leaks the key; the fix is to encrypt the MAC"
      - "CBC suites used MAC-then-encrypt, so the record was decrypted and depadded before the MAC check, and MAC timing leaked padding validity; encrypt-then-MAC (as AEAD does) is correct"
    answer: 3
    explanation: |
      TLS CBC suites used MAC-then-encrypt: on receipt the record is decrypted and padding
      removed before the MAC is verified, and the MAC computation time depended on how much
      padding was stripped — a timing padding oracle (Lucky13, CVE-2013-0169). Encrypt-then-MAC
      (verify tag over ciphertext before decrypting), which AEAD/TLS 1.3 use, avoids this.
    ref: "concepts.md#cbc-padding-oracles-and-aead-composition-order"

  - id: cryptography-foundations-057
    difficulty: advanced
    tags: [composition, ssh, encrypt-and-mac]
    question: |
      Match each AEAD-composition order to its real-world example: which protocol historically
      used Encrypt-and-MAC (encrypt plaintext, MAC plaintext separately)?
    options:
      - "TLS 1.3 record layer"
      - "SSH"
      - "TLS 1.2 CBC suites"
      - "IPsec ESP with AES-GCM"
    answer: 1
    explanation: |
      SSH uses Encrypt-and-MAC (the MAC is over the plaintext, sent alongside the ciphertext),
      which can leak plaintext equality. TLS 1.2 CBC used MAC-then-encrypt (Lucky13); TLS 1.3
      and IPsec-GCM use AEAD (effectively encrypt-then-MAC), the recommended order.
    ref: "concepts.md#cbc-padding-oracles-and-aead-composition-order"

  - id: cryptography-foundations-058
    difficulty: expert
    tags: [length-extension, merkle-damgard, forgery]
    question: |
      An API authenticates requests with sig = SHA256(secret || request). An attacker captures
      one valid (request, sig) pair and knows len(secret). What can they forge, and why?
    options:
      - "Nothing — SHA-256 is collision-resistant, so the signature can't be forged"
      - "They can recover the secret by inverting SHA-256"
      - "A valid signature for SHA256(secret || request || glue-padding || extension), by resuming the Merkle-Damgard state from sig, without knowing the secret"
      - "Only a signature for the identical request, which is useless"
    answer: 2
    explanation: |
      Merkle-Damgard hashes output their full internal state. Knowing H(secret||request) and
      the length lets the attacker reconstruct the deterministic glue padding, set the hash
      state to sig, and continue hashing appended data — producing a valid tag for an extended
      message without the secret (the Flickr API forgery). HMAC's outer wrap prevents this.
    ref: "concepts.md#length-extension-attacks-in-depth"

  - id: cryptography-foundations-059
    difficulty: advanced
    tags: [length-extension, sha3, blake2, hmac]
    question: |
      Which set of constructions is NOT vulnerable to length-extension attacks?
    options:
      - "Raw SHA-256, raw SHA-512, and MD5"
      - "HMAC-SHA256, SHA-3/Keccak, BLAKE2, and SHA-512/256"
      - "SHA-1 and SHA-224"
      - "Any hash truncated to 256 bits, including SHA-256 truncated to 256 bits"
    answer: 1
    explanation: |
      HMAC (outer hash wraps the inner digest), SHA-3's sponge (doesn't emit full state),
      BLAKE2/BLAKE3, and SHA-512/256 (truncated so the full absorbing state isn't exposed) all
      resist length extension. Full-width Merkle-Damgard outputs (MD5, SHA-1, SHA-256, SHA-512)
      are vulnerable when used as H(secret||msg).
    ref: "concepts.md#length-extension-attacks-in-depth"

  - id: cryptography-foundations-060
    difficulty: expert
    tags: [ghash, gcm, forbidden-attack, polynomial-mac]
    question: |
      Mechanically, why does reusing a nonce in AES-GCM let an attacker forge tags for
      arbitrary messages, whereas the same reuse in ChaCha20-Poly1305 does not hand over a
      reusable forgery key?
    options:
      - "GCM's tag evaluates a polynomial at a fixed secret point H = E_K(0^128) reused across all messages; two tags under a repeated mask give equations solvable for H. Poly1305 derives a fresh one-time (r,s) key per (key,nonce)"
      - "ChaCha20 uses a longer key, so H cannot be recovered"
      - "GCM has no authentication tag, so nothing needs forging"
      - "Poly1305 encrypts the tag a second time, hiding the polynomial"
    answer: 0
    explanation: |
      GHASH evaluates a GF(2^128) polynomial at the static secret H = E_K(0^128), identical for
      every message under the key. A repeated per-message mask (nonce reuse) yields solvable
      equations for H, enabling universal forgery — the forbidden attack. Poly1305's MAC key is
      one-time per (key,nonce), so reuse leaks the keystream but not a reusable subkey.
    ref: "concepts.md#polynomial-macs-and-gcm-siv-internals"

  - id: cryptography-foundations-061
    difficulty: expert
    tags: [gcm-siv, synthetic-iv, misuse-resistance]
    question: |
      How does AES-GCM-SIV (RFC 8452) achieve nonce-misuse resistance, and what is the residual
      leakage if a (key, nonce, plaintext, AAD) tuple is accidentally repeated?
    options:
      - "It encrypts twice with two keys; repetition leaks nothing at all"
      - "It MACs plaintext+AAD (POLYVAL) first to derive a synthetic IV used for CTR; repeating an identical tuple leaks only that the messages are equal, never full H-recovery"
      - "It uses a random 192-bit nonce; repetition is impossible"
      - "It disables the authentication tag on reuse to preserve confidentiality"
    answer: 1
    explanation: |
      GCM-SIV derives the IV synthetically by MACing plaintext+AAD with POLYVAL, then runs CTR
      with that IV. Identical inputs produce identical ciphertext (deterministic), so accidental
      reuse only reveals message equality — it never gives the catastrophic H-recovery/universal
      forgery of plain GCM. (It is still not key-committing.)
    ref: "concepts.md#polynomial-macs-and-gcm-siv-internals"

  - id: cryptography-foundations-062
    difficulty: advanced
    tags: [gcm, truncated-tag, forgery]
    question: |
      A protocol truncates AES-GCM tags to 32 bits to save bandwidth on an online API. Why is
      this dangerous?
    options:
      - "32-bit tags break confidentiality of the plaintext"
      - "Forgery probability scales as ~2^(-t) per attempt, so a 32-bit tag can be forged online in feasibly few tries; NIST SP 800-38D imposes much stricter limits for short tags"
      - "Truncated tags force nonce reuse"
      - "It has no effect; tag length does not influence forgery resistance"
    answer: 1
    explanation: |
      Forgery success per attempt is ~2^(-t) for a t-bit tag. A 32-bit tag is forgeable after
      roughly 2^32 online attempts — feasible for an active attacker — so SP 800-38D Appendix C
      sharply restricts invocation/message limits for short tags. Use the full 128-bit tag
      unless a standard explicitly requires otherwise.
    ref: "concepts.md#polynomial-macs-and-gcm-siv-internals"

  - id: cryptography-foundations-063
    difficulty: expert
    tags: [marvin, rsa, timing, remediation]
    question: |
      A 2024 scanner flags your TLS endpoint as supporting RSA key exchange and hints at
      Bleichenbacher/Marvin. Your team says "we already made the PKCS#1 padding check
      constant-time." Why is that insufficient, and what is the correct remediation?
    options:
      - "It's sufficient; a constant-time padding check fully closes Marvin"
      - "Switch from RSA-2048 to RSA-4096; larger keys defeat the timing attack"
      - "Marvin is a timing side channel in the bignum/modular-exponentiation layer (affecting OAEP too), not just the padding branch; drop RSA key transport and use (EC)DHE, reserving RSA for signatures/OAEP with an audited constant-time library"
      - "Enable AES-256 instead of AES-128 for the record layer"
    answer: 2
    explanation: |
      Marvin (2023-2024) lives in the non-constant-time bignum decryption path (BIGNUM,
      BigInteger, math/big), so it revives Bleichenbacher and even affects RSA-OAEP, which
      routes through the same code. A padding-branch fix doesn't help. The real fix is to stop
      using RSA key transport entirely — use ephemeral (EC)DHE for forward secrecy.
    ref: "concepts.md#rsa-padding-attacks-bleichenbacher-robot-and-marvin"

  - id: cryptography-foundations-064
    difficulty: advanced
    tags: [rsa, padding, oaep, pss]
    question: |
      Which pairing of RSA padding to purpose is correct?
    options:
      - "OAEP for signatures, PSS for encryption"
      - "PKCS#1 v1.5 for encryption (preferred), PSS for signatures"
      - "OAEP for encryption, PSS for signatures"
      - "PSS for both encryption and signatures"
    answer: 2
    explanation: |
      RSA-OAEP is the correct randomized encryption padding (IND-CCA2 when properly
      implemented); RSA-PSS is the correct probabilistic signature padding. PKCS#1 v1.5
      encryption is the legacy scheme behind Bleichenbacher/ROBOT and should be avoided; PSS is
      preferred over v1.5 signatures.
    ref: "concepts.md#rsa-padding-attacks-bleichenbacher-robot-and-marvin"

  - id: cryptography-foundations-065
    difficulty: expert
    tags: [rsa, signature-forgery, berserk, e3]
    question: |
      The Bleichenbacher '06 / BERserk signature forgery works against RSA PKCS#1 v1.5
      signatures under which conditions?
    options:
      - "A small public exponent (e=3) combined with a lax padding parser that doesn't require the hash to occupy the rightmost bytes, letting an attacker build a perfect cube that looks validly padded"
      - "Any RSA key with e=65537 and a correct padding parser"
      - "Reuse of the signing nonce k across two signatures"
      - "A 4096-bit modulus with OAEP padding"
    answer: 0
    explanation: |
      With e=3 and a verifier that doesn't check the hash is right-aligned (accepts trailing
      garbage after the ASN.1/hash), an attacker constructs a value whose cube looks like valid
      PKCS#1 v1.5 padding — forging a signature with no private key. Fix: strict
      constant-position padding validation (and avoid e=3). RSA signatures have no per-signature
      nonce, so k-reuse is irrelevant here.
    ref: "concepts.md#rsa-padding-attacks-bleichenbacher-robot-and-marvin"

  - id: cryptography-foundations-066
    difficulty: expert
    tags: [ecdsa, lattice, nonce-bias, minerva]
    question: |
      Two Bitcoin transactions from one address share the same r value — you can compute the
      private key. Follow-up: across thousands of signatures, only the top 3 bits of each nonce
      k are biased toward zero. What can an attacker do?
    options:
      - "Nothing — partial bias is harmless; only full nonce reuse leaks the key"
      - "Recover only the public key, which is already known"
      - "Force the signer to reuse k on the next signature"
      - "Recover the full private key via a lattice reduction / hidden-number-problem attack (as in Minerva, TPM-Fail, LadderLeak)"
    answer: 3
    explanation: |
      Full r-reuse gives the key immediately from two signatures. But even a few biased bits of
      k across many signatures reduce to a hidden-number problem solvable by lattice reduction
      (LLL/BKZ) — Minerva, TPM-Fail (CVE-2019-11090), LadderLeak (under 1 bit of bias). This is
      why deterministic ECDSA (RFC 6979) and constant-time implementations matter.
    ref: "concepts.md#ecdsa-nonce-lattice-attacks-and-signature-malleability"

  - id: cryptography-foundations-067
    difficulty: advanced
    tags: [ecdsa, malleability, low-s, bitcoin]
    question: |
      Why does an ECDSA (r, s) signature exhibit malleability, and how does Bitcoin address it?
    options:
      - "Because (r, s) and (r, -s mod n) are both valid for the same message; Bitcoin enforces a canonical low-S rule (BIP 62/146)"
      - "Because r can be any value; Bitcoin requires r to be prime"
      - "Because the hash is malleable; Bitcoin double-hashes with SHA-256"
      - "Because the public key can be negated; Bitcoin pins the public key"
    answer: 0
    explanation: |
      For any valid ECDSA signature (r, s), the value (r, n-s) is also valid, so a third party
      can produce a second encoding — transaction malleability if the signature bytes identify
      the transaction. Bitcoin mandates canonical low-S signatures to make the encoding unique.
    ref: "concepts.md#ecdsa-nonce-lattice-attacks-and-signature-malleability"

  - id: cryptography-foundations-068
    difficulty: expert
    tags: [ed25519, verification, cofactor]
    question: |
      A signature verifies with your Ed25519 library but a partner's batch verifier rejects it
      (or vice versa). Per "Taming the Many EdDSAs," what is the most likely root cause?
    options:
      - "Ed25519 is non-deterministic, so the signature differs each run"
      - "One library used SHA-256 and the other SHA-512 for the nonce"
      - "The private key was reused across messages"
      - "Cofactored vs cofactorless verification (and non-canonical S / small-subgroup point handling) differ between implementations; pick one RFC 8032 strict convention system-wide"
    answer: 3
    explanation: |
      Ed25519's group has cofactor 8; some verifiers include the cofactor in the verification
      equation and some don't, and libraries differ on rejecting non-canonical S (S >= L) and
      small-subgroup points — so batch and single verification can disagree. Standardize on RFC
      8032 strict verification across the whole system.
    ref: "concepts.md#ed25519-verification-pitfalls"

  - id: cryptography-foundations-069
    difficulty: expert
    tags: [ecdh, invalid-curve, small-subgroup, static-key]
    question: |
      An ECDH endpoint uses a STATIC private key and accepts any peer point without validation.
      What is the concrete risk and the fix?
    options:
      - "No risk; ECDH output goes through a KDF, which sanitizes bad points"
      - "The peer can force a weak shared secret, but only for that one session"
      - "Invalid-curve/small-subgroup attacks leak the static private key modulo small factors per exchange; CRT-combining many leaks recovers the full key. Fix: validate points are on-curve/in-subgroup (SP 800-56A) or use X25519"
      - "The endpoint's public key is leaked, which is harmless"
    answer: 2
    explanation: |
      Sending points on a different curve with small-order subgroups makes each exchange leak
      the static key modulo a small factor; combining leaks via CRT recovers it bit-by-bit (Go
      P-256 CVE-2017-8932). Defend by validating the peer key is on the correct curve and
      subgroup, or use X25519, whose design (clamping, twist security) resists this without
      explicit validation.
    ref: "concepts.md#diffie-hellman-parameter-validation-and-invalid-curve-attacks"

  - id: cryptography-foundations-070
    difficulty: advanced
    tags: [logjam, dhe, downgrade, safe-primes]
    question: |
      What made the Logjam attack possible against finite-field DHE?
    options:
      - "512-bit DH keys were reused as AES keys directly"
      - "The DH generator g was set to 1"
      - "A MITM downgraded the connection to export-grade 512-bit DH, which is precomputable, and many servers shared the same weak groups so precomputation amortized across targets"
      - "Servers used ephemeral keys, which are inherently weak"
    answer: 2
    explanation: |
      Logjam (2015) was a downgrade: a MITM forced negotiation of export-grade 512-bit DH,
      which is feasible to break with per-group precomputation — and because many servers used
      the same standard 512/1024-bit groups, the expensive precomputation was reused across
      many victims. Use large safe-prime groups (or ECDHE) and reject export/weak groups.
    ref: "concepts.md#diffie-hellman-parameter-validation-and-invalid-curve-attacks"

  - id: cryptography-foundations-071
    difficulty: advanced
    tags: [x25519, clamping, validation]
    question: |
      Why can X25519 safely skip explicit public-key point validation that a naive P-256 static
      ECDH implementation must perform?
    options:
      - "X25519 encrypts the point before use"
      - "X25519 uses 512-bit keys, so small-subgroup attacks are infeasible"
      - "Curve25519's design (Montgomery curve with twist-secure near-prime order, plus scalar clamping that clears low cofactor bits) confines malicious points to a large-order subgroup, so they don't leak the key"
      - "X25519 rejects all points not equal to the base point"
    answer: 2
    explanation: |
      Curve25519 is chosen so that both the curve and its quadratic twist have near-prime order,
      and scalar clamping clears the low cofactor bits (and fixes a high bit). Malicious/off-curve
      x-coordinates fall into large-order subgroups, so x-only ECDH doesn't leak the private key
      even without validation — safety by construction.
    ref: "concepts.md#diffie-hellman-parameter-validation-and-invalid-curve-attacks"

  - id: cryptography-foundations-072
    difficulty: expert
    tags: [side-channel, cache-timing, aes-ni, chacha20]
    question: |
      Why is table-based ("T-box") software AES vulnerable to cache-timing attacks, and what
      are the standard mitigations?
    options:
      - "It uses a weak key schedule; the fix is more rounds"
      - "It indexes lookup tables using secret key/plaintext bytes, so a co-resident attacker infers accessed cache lines (Flush+Reload/Prime+Probe) and recovers the key; use AES-NI or bit-sliced AES, or ciphers like ChaCha20 with no secret-indexed tables"
      - "It leaks via the authentication tag; truncate the tag"
      - "It reuses the IV; randomize the IV to fix timing"
    answer: 1
    explanation: |
      Table-based AES performs secret-dependent memory lookups, so which cache lines are touched
      depends on the key — observable by a co-resident attacker and used to recover the key.
      Constant-time remedies: hardware AES-NI (data-independent) or bit-sliced software AES.
      ChaCha20 (ARX, no secret table indexing) is constant-time by design.
    ref: "concepts.md#constant-time-programming-and-side-channels"

  - id: cryptography-foundations-073
    difficulty: advanced
    tags: [constant-time, secrets, general]
    question: |
      Which single rule best captures constant-time programming for secret-handling code?
    options:
      - "Always encrypt secrets before comparing them"
      - "No branch, table index, or loop bound may depend on secret data"
      - "Always use the largest available key size"
      - "Compare secrets with a fast hash before the real comparison"
    answer: 1
    explanation: |
      The core discipline is that control flow, memory-access patterns, and timing must be
      independent of secret values — no secret-dependent branches, table indices, or loop
      bounds. Padding oracles (Lucky13), Marvin, and Minerva all stem from violating this.
    ref: "concepts.md#constant-time-programming-and-side-channels"

  - id: cryptography-foundations-074
    difficulty: expert
    tags: [gcm, wear-out, xchacha20, nonce]
    question: |
      You must encrypt ~10^12 messages under one key and cannot guarantee a monotonic counter,
      so you plan random 96-bit GCM nonces. Is this safe, and what should you do?
    options:
      - "Safe — 96-bit nonces never collide in practice"
      - "Safe if you also truncate the tag to 64 bits to reduce state"
      - "Unsafe — switch to CBC mode, which has no nonce limit"
      - "Unsafe — 10^12 approx 2^40 far exceeds the ~2^32 random-96-bit-nonce birthday bound; use a counter nonce, AES-GCM-SIV, or XChaCha20-Poly1305 (192-bit nonce, ~2^80 random safe) and rotate keys"
    answer: 3
    explanation: |
      Random 96-bit GCM nonces become unsafe past ~2^32 messages (birthday bound → nonce
      collision → H recovery). 10^12 ≈ 2^40 is far beyond that. Use a deterministic counter,
      AES-GCM-SIV (misuse-resistant), or XChaCha20-Poly1305 whose 192-bit nonce makes random
      nonces safe to ~2^80 — and rekey before data-volume wear-out.
    ref: "concepts.md#nonce-reuse-resistance-and-key-wear-out"

  - id: cryptography-foundations-075
    difficulty: advanced
    tags: [xchacha20, nonce, app-layer]
    question: |
      What is the primary advantage of XChaCha20-Poly1305 over standard ChaCha20-Poly1305 for
      application-layer encryption?
    options:
      - "It is authenticated while ChaCha20-Poly1305 is not"
      - "Its 192-bit (24-byte) nonce makes randomly-chosen nonces collision-safe to ~2^80 messages, so you can pick random nonces without maintaining a counter"
      - "It is faster because it uses fewer rounds"
      - "It provides key-commitment that ChaCha20-Poly1305 lacks"
    answer: 1
    explanation: |
      XChaCha20-Poly1305 extends the nonce to 192 bits, so random nonce selection stays
      collision-safe to roughly 2^80 messages — ideal when you can't guarantee a unique counter.
      Both variants are AEAD; XChaCha20 is not key-committing either.
    ref: "concepts.md#nonce-reuse-resistance-and-key-wear-out"

  - id: cryptography-foundations-076
    difficulty: expert
    tags: [post-quantum, shor, grover, key-size]
    question: |
      Explain precisely why AES-256 survives quantum computers but RSA-3072 does not, and the
      key-size implication for symmetric crypto.
    options:
      - "Both are broken equally; double all key sizes"
      - "AES-256 is quantum-resistant because it is symmetric; RSA is broken by Grover, and no key increase helps"
      - "RSA-3072 survives; only ECC is broken by Shor"
      - "Shor's algorithm polynomially breaks factoring/discrete-log (RSA/ECC/DH); Grover gives only a square-root speedup on symmetric search, so AES-256 retains ~128-bit post-quantum security — mitigate by doubling symmetric key/hash sizes"
    answer: 3
    explanation: |
      Shor solves factoring and discrete log in polynomial time, fully breaking RSA, ECC, and
      DH regardless of size. Grover only quadratically speeds up brute-force search, halving
      effective symmetric strength — so AES-256 → ~128-bit PQ security, and the fix is doubling
      symmetric key/hash output sizes, not abandoning them.
    ref: "concepts.md#post-quantum-cryptography-and-hybrid-key-exchange"

  - id: cryptography-foundations-077
    difficulty: expert
    tags: [post-quantum, hybrid, hndl, migration]
    question: |
      You must make a key-exchange protocol post-quantum-ready today. Which approach best
      reflects current (2024-2025) practice and its rationale?
    options:
      - "Replace ECDHE with ML-KEM-768 alone immediately, dropping all classical algorithms"
      - "Do nothing until quantum computers exist, since signatures aren't broken yet"
      - "Deploy hybrid key exchange (e.g., X25519 + ML-KEM-768, TLS's X25519MLKEM768) so the secret is safe if either component holds, plus crypto-agility; harvest-now-decrypt-later makes KEM migration the priority over signatures"
      - "Switch to AES-512 for the record layer to resist Shor's algorithm"
    answer: 2
    explanation: |
      The deployed transition is hybrid: combine a classical KEM (X25519) and ML-KEM-768 in the
      KDF so a break of either still leaves the shared secret safe, hedging against both quantum
      attacks and immature PQ math. HNDL — adversaries recording traffic now to decrypt later —
      makes confidentiality/KEM migration urgent; signatures only need future forgery resistance.
      AES-512 isn't a standard and doesn't address the KEM problem.
    ref: "concepts.md#post-quantum-cryptography-and-hybrid-key-exchange"

  - id: cryptography-foundations-078
    difficulty: advanced
    tags: [post-quantum, fips, standards]
    question: |
      Which mapping of the August 2024 NIST PQC standards is correct?
    options:
      - "FIPS 203 = ML-KEM (Kyber, KEM), FIPS 204 = ML-DSA (Dilithium, signatures), FIPS 205 = SLH-DSA (SPHINCS+, hash-based signatures)"
      - "FIPS 203 = ML-DSA signatures, FIPS 204 = ML-KEM, FIPS 205 = Falcon"
      - "FIPS 203/204/205 are all KEMs; signatures remain RSA-only"
      - "FIPS 205 = ML-KEM (Kyber), FIPS 203 = SLH-DSA"
    answer: 0
    explanation: |
      FIPS 203 standardizes ML-KEM (Kyber) for key encapsulation, FIPS 204 ML-DSA (Dilithium)
      for lattice signatures, and FIPS 205 SLH-DSA (SPHINCS+) for stateless hash-based
      signatures. FN-DSA (Falcon) and the HQC KEM are still being finalized separately.
    ref: "concepts.md#post-quantum-cryptography-and-hybrid-key-exchange"

  - id: cryptography-foundations-079
    difficulty: expert
    tags: [key-management, rotation, envelope, kek]
    question: |
      In an envelope-encryption design storing petabytes of ciphertext, you must rotate keys
      regularly with minimal cost. Which rotation strategy is correct?
    options:
      - "Rotate the DEKs frequently, re-encrypting all data each time, to limit blast radius"
      - "Never rotate keys, since rotation risks data loss"
      - "Store the DEK unwrapped next to the ciphertext so rotation is a simple metadata update"
      - "Design routine rotation to rotate the KEK, which only requires re-wrapping the (small) DEKs — the bulk ciphertext is untouched; reserve full data re-encryption for a DEK/key-compromise event"
    answer: 3
    explanation: |
      Envelope encryption lets you rotate the KEK by re-wrapping the tiny DEKs — cheap and fast,
      leaving petabytes of ciphertext untouched. Rotating a DEK forces re-encryption of the data
      it protects (expensive), reserved for compromise. Never store unwrapped DEKs beside the
      ciphertext — that defeats separation of keys from data.
    ref: "concepts.md#key-management-lifecycle-and-rotation"

  - id: cryptography-foundations-080
    difficulty: advanced
    tags: [key-management, key-states, deactivated]
    question: |
      Per NIST SP 800-57 key-state guidance, what is a "deactivated" key permitted to do?
    options:
      - "Encrypt and sign new data, but not decrypt old data"
      - "Nothing — it must be destroyed immediately"
      - "Decrypt/verify previously protected data, but not encrypt or sign new data"
      - "Only be used inside an HSM for any operation"
    answer: 2
    explanation: |
      A deactivated key has passed its active cryptoperiod: it may still decrypt/verify data
      protected earlier, but must not be used to encrypt or sign new data. A compromised key
      must be revoked and its data re-protected. This separation limits exposure while allowing
      access to historical data.
    ref: "concepts.md#key-management-lifecycle-and-rotation"

  - id: cryptography-foundations-081
    difficulty: advanced
    tags: [pki, ca-compromise, certificate-transparency]
    question: |
      Why is the compromise of a certificate authority (as in DigiNotar, 2011) catastrophic,
      and which control most directly helps detect mis-issuance?
    options:
      - "A compromised CA can mint valid certificates for any domain, defeating authentication; Certificate Transparency (CT) logs make issued certs publicly auditable so mis-issuance is detectable"
      - "A compromised CA only affects its own website; OCSP prevents any impact"
      - "CA compromise leaks the TLS session keys of all past connections; forward secrecy prevents it"
      - "It only matters for expired certificates; renewing certs fixes it"
    answer: 0
    explanation: |
      Because trust chains to a small set of roots, a rogue/compromised CA can issue valid certs
      for arbitrary domains, breaking authentication entirely. Certificate Transparency logs
      publish all issued certificates for public auditing, so unauthorized issuance can be
      detected; pinning and revocation are complementary controls.
    ref: "concepts.md#pki-trust-chains-and-certificate-verification"

  - id: cryptography-foundations-082
    difficulty: expert
    tags: [randomness, debian, csprng, incident]
    question: |
      The Debian OpenSSL incident (2008, CVE-2008-0166) is a canonical randomness failure. What
      actually went wrong?
    options:
      - "SecureRandom was replaced with Math.random by a patch"
      - "The CSPRNG algorithm itself was cryptographically broken"
      - "A patch removed code feeding entropy into the PRNG seed, leaving essentially only the PID (~15 bits), so all generated keys came from a tiny, enumerable set"
      - "Keys were generated with /dev/random, which blocked and returned zeros"
    answer: 2
    explanation: |
      A maintainer removed lines that seeded the PRNG (they looked like uninitialized-memory
      reads), leaving the PID (~15 bits) as nearly the only entropy. Every SSH/TLS/OpenVPN key
      generated on affected systems for ~2 years was drawn from a tiny predictable set and could
      be enumerated. The algorithm was fine; the seeding lifecycle was fatally broken.
    ref: "concepts.md#randomness-failures-and-real-incidents"

  - id: cryptography-foundations-083
    difficulty: expert
    tags: [randomness, fork, vm-snapshot, reseeding]
    question: |
      Why can cloning a VM/container image or calling fork() produce duplicate "random" values
      (nonces, keys, session IDs), and how is it mitigated?
    options:
      - "Because CSPRNGs are seeded from the MAC address, which is unique per clone"
      - "Because two processes/instances can inherit identical CSPRNG state and emit the same outputs; mitigate with fork detection / MADV_WIPEONFORK and per-boot reseeding, and avoid generating keys from a shared golden image"
      - "Because random values are stored on disk and copied with the image; encrypt the disk to fix it"
      - "It cannot happen; each process always gets fresh entropy automatically"
    answer: 1
    explanation: |
      After fork() or restoring a VM/container snapshot, both instances can share identical
      CSPRNG internal state and generate the same values — a real source of nonce/key/session-ID
      collisions. Mitigations include fork/snapshot detection, MADV_WIPEONFORK, and reseeding on
      boot; avoid baking key generation into cloned golden images.
    ref: "concepts.md#randomness-failures-and-real-incidents"

  - id: cryptography-foundations-084
    difficulty: expert
    tags: [hkdf, info, key-separation]
    question: |
      In HKDF, what security purpose does the `info` parameter in HKDF-Expand serve?
    options:
      - "It secretly authenticates the PRK like a MAC key"
      - "It binds derived keys to a context (protocol, version, key-id, direction), yielding cryptographically independent keys and preventing cross-protocol/cross-purpose key reuse"
      - "It replaces the salt when no salt is available"
      - "It lengthens the output beyond the hash size, which Expand otherwise cannot do"
    answer: 1
    explanation: |
      HKDF-Expand's `info` label binds context: the same PRK expanded with different `info`
      values produces independent keys, so client→server vs server→client (or different
      protocols/versions) can't collide or be reused across purposes. The salt belongs to
      Extract, not Expand, and Expand can already produce multi-block output via its counter.
    ref: "concepts.md#hkdf-internals-kdf-vs-prf-vs-xof"

  - id: cryptography-foundations-085
    difficulty: expert
    tags: [aead, associated-data, confused-deputy]
    question: |
      A service encrypts each user's profile field with AES-GCM using a per-tenant key but
      passes empty AAD. An attacker who can write ciphertext copies a validly-encrypted
      "role=admin" blob from an admin record into their own record's role field, and it
      decrypts and is accepted. What is the flaw and fix?
    options:
      - "Nonce reuse; assign unique nonces and the splice fails"
      - "The ciphertext wasn't bound to its context (recipient/field/record), enabling a ciphertext-relocation / confused-deputy attack; bind user-id, field name, and record id into the AAD and verify on decrypt"
      - "The tag was truncated; use a 128-bit tag"
      - "AES-GCM is broken for structured data; switch to CBC"
    answer: 1
    explanation: |
      AEAD guarantees integrity for a fixed key but does nothing to tie a ciphertext to its
      intended context. With empty AAD, a valid ciphertext can be relocated to another
      field/record/user and still verifies — a confused-deputy/relocation attack. Bind all
      disambiguating context (user-id, field, record-id, purpose, sequence) into the AAD and
      check it on decrypt.
    ref: "concepts.md#associated-data-misuse-in-aead"
