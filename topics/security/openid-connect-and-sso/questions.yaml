topic: "OpenID Connect & Federated SSO"
domain: security
topic_slug: openid-connect-and-sso
version: 1
questions:
  - id: openid-connect-and-sso-001
    difficulty: beginner
    tags: [oidc, oauth, identity]
    question: |
      What does OpenID Connect (OIDC) add on top of OAuth 2.0?
    options:
      - A standard identity/authentication layer (who the user is) via the ID Token
      - A faster binary encoding for OAuth authorization messages sent on the wire
      - Transport encryption that replaces TLS specifically on the token endpoint
      - A drop-in replacement for OAuth's authorization-code grant type
    answer: 0
    explanation: |
      OAuth 2.0 is a delegated-authorization framework (access to APIs). OIDC layers a
      standard authentication mechanism on top: the `openid` scope, the ID Token (a signed
      JWT proving who the user is), and standard endpoints/metadata.
    ref: "concepts.md#oidc-as-an-identity-layer-on-top-of-oauth-20"

  - id: openid-connect-and-sso-002
    difficulty: beginner
    tags: [scope, openid]
    question: |
      Which scope value signals to the provider that a client wants OIDC authentication and
      an ID Token?
    options:
      - profile
      - auth
      - openid
      - id_token
    answer: 2
    explanation: |
      Requesting `scope=openid ...` is what turns an OAuth flow into an OIDC flow and causes
      the OpenID Provider to return an ID Token.
    ref: "concepts.md#oidc-as-an-identity-layer-on-top-of-oauth-20"

  - id: openid-connect-and-sso-003
    difficulty: intermediate
    tags: [terminology, roles]
    question: |
      In OIDC terminology, what is the client application called and what is the
      authorization server called?
    options:
      - Service Provider (SP) and Identity Provider (IdP)
      - Consumer and Issuer
      - Resource Server and Token Authority
      - Relying Party (RP) and OpenID Provider (OP)
    answer: 3
    explanation: |
      OIDC renames the OAuth client to Relying Party (RP) and the authorization server to
      OpenID Provider (OP). SP/IdP is SAML terminology.
    ref: "concepts.md#oidc-as-an-identity-layer-on-top-of-oauth-20"

  - id: openid-connect-and-sso-004
    difficulty: intermediate
    tags: [access-token, anti-pattern]
    question: |
      Why is using an OAuth access token as proof that a user has logged in considered an
      anti-pattern?
    options:
      - Access tokens are always already expired by the time the client parses them, so they cannot certify a login
      - Access tokens are bearer credentials for an API, are often opaque to the client, and carry no standard authentication context
      - Access tokens cannot be transmitted over HTTPS and so are unsafe to inspect for login state on the client side
      - Access tokens are only ever issued directly to resource servers, so a client never actually holds one to inspect
    answer: 1
    explanation: |
      An access token authorizes API access; it is typically audience-bound to a resource
      server, may be opaque to the client, and says nothing standard about who authenticated
      or when. Treating it as login proof enables token-substitution attacks — which is why
      OIDC introduced the ID Token.
    ref: "concepts.md#oidc-as-an-identity-layer-on-top-of-oauth-20"

  - id: openid-connect-and-sso-005
    difficulty: beginner
    tags: [id-token, access-token, audience]
    question: |
      Who is the intended audience (`aud`) of an ID Token?
    options:
      - The resource server / API the client intends to call with it
      - The OpenID Provider itself, since it minted and signed the token
      - The client (Relying Party) that requested authentication
      - Any party that can verify the token's signature against the JWKS
    answer: 2
    explanation: |
      The ID Token authenticates the user to the client, so its `aud` is the client's
      `client_id`. The access token, by contrast, is audience-bound to the resource server.
    ref: "concepts.md#id-token-vs-access-token"

  - id: openid-connect-and-sso-006
    difficulty: intermediate
    tags: [id-token, access-token, misuse]
    question: |
      A developer sends the ID Token as the `Authorization: Bearer` credential when calling a
      backend REST API. What is wrong with this?
    options:
      - The ID Token's audience is the client, not the API, so it should not be used to call resource servers
      - Nothing — the ID Token and access token are fully interchangeable credentials at any endpoint
      - ID Tokens cannot be base64url-encoded, so a resource server has no way to parse the incoming header
      - It is perfectly fine, but only in the case where the ID Token was issued unsigned by the provider
    answer: 0
    explanation: |
      The ID Token proves identity to the client; its audience is the client. Calling APIs is
      the access token's job (audience = resource server). Mixing them is a common integration
      bug and can lead to audience-confusion issues.
    ref: "concepts.md#id-token-vs-access-token"

  - id: openid-connect-and-sso-007
    difficulty: intermediate
    tags: [id-token, format]
    question: |
      Which statement about the FORMAT of the two tokens is correct?
    options:
      - Both the ID Token and the access token are always opaque reference strings with no parseable structure
      - The access token is always a signed JWT, while the ID Token is always an opaque server-side reference
      - Both the ID Token and the access token are always signed JWTs, as mandated by the OAuth 2.0 specification
      - The ID Token is always a signed JWT; the access token may be opaque or a JWT (OAuth does not mandate a format)
    answer: 3
    explanation: |
      OIDC requires the ID Token to be a signed JWT (JWS). OAuth 2.0 does not standardize the
      access token format — it can be an opaque reference string or a JWT, at the issuer's
      discretion.
    ref: "concepts.md#id-token-vs-access-token"

  - id: openid-connect-and-sso-008
    difficulty: advanced
    tags: [aud, cross-client, login-bypass]
    question: |
      A client verifies an ID Token's signature and expiry but never checks the `aud` claim.
      What attack does this enable?
    options:
      - SQL injection executed through crafted claim values placed inside the token payload
      - An ID Token issued to a different client at the same OP can be replayed to log in  — a cross-client token substitution
      - A silent downgrade of the running flow from authorization code back to the implicit flow
      - Denial of service caused by oversized tokens exhausting the verifier's parsing memory
    answer: 1
    explanation: |
      A valid signature only proves the OP minted the token — not that it was minted for you.
      Without checking `aud == my client_id`, a token issued for a sibling client is accepted,
      giving a login bypass.
    ref: "concepts.md#id-token-vs-access-token"

  - id: openid-connect-and-sso-009
    difficulty: intermediate
    tags: [claims, sub, user-key]
    question: |
      Which claim should an application use as the stable primary key for a user, and why not
      email?
    options:
      - '`sub` (with `iss`), because it is stable and non-reassignable; emails can change and be reused'
      - '`email`, because the provider guarantees it is globally unique and permanent for every user'
      - '`name`, because it is human-readable and the provider keeps it constant across sessions'
      - '`jti`, because it uniquely identifies the user and stays constant across every issued token'
    answer: 0
    explanation: |
      `sub` is the stable, non-reassignable subject identifier, unique within an issuer — so
      apps key on the `(iss, sub)` pair. Emails change ownership and can be reassigned, so they
      are unsafe as a primary identity key.
    ref: "concepts.md#id-token-structure-and-standard-claims"

  - id: openid-connect-and-sso-010
    difficulty: intermediate
    tags: [claims, email-verified]
    question: |
      Before trusting the `email` claim to match a user to an existing account, what should
      you check?
    options:
      - That the email domain matches the issuer's domain
      - That the email appears in the `aud` claim
      - That `email_verified` is true
      - Nothing — presence of the claim is sufficient
    answer: 2
    explanation: |
      An `email` claim may be unverified. OIDC provides `email_verified`; only a verified email
      should be used for account matching, otherwise an attacker could claim someone else's
      address.
    ref: "concepts.md#id-token-structure-and-standard-claims"

  - id: openid-connect-and-sso-011
    difficulty: intermediate
    tags: [claims, auth_time, amr]
    question: |
      Which pair of ID Token claims helps a relying party confirm WHEN the user authenticated
      and by WHICH methods (e.g. password + OTP)?
    options:
      - '`iss` and `aud`'
      - '`exp` and `iat`'
      - '`nonce` and `state`'
      - '`auth_time` and `amr`'
    answer: 3
    explanation: |
      `auth_time` is when the user actually authenticated (drives `max_age` re-auth), and `amr`
      (Authentication Methods References, e.g. `["pwd","otp"]`) tells the RP which methods were
      used — useful to confirm MFA occurred. `acr` conveys the assurance level.
    ref: "concepts.md#id-token-structure-and-standard-claims"

  - id: openid-connect-and-sso-012
    difficulty: advanced
    tags: [azp, aud, multiple-audiences]
    question: |
      When an ID Token contains multiple values in `aud`, which claim identifies the party the
      token was actually issued to?
    options:
      - '`sub`'
      - '`azp` (authorized party)'
      - '`iss`'
      - '`jti`'
    answer: 1
    explanation: |
      Per OIDC Core, when there are multiple audiences the `azp` (authorized party) claim SHOULD
      be present and must be the client's `client_id`. The RP verifies its own id is an
      acceptable audience and that `azp` matches it.
    ref: "concepts.md#id-token-structure-and-standard-claims"

  - id: openid-connect-and-sso-013
    difficulty: beginner
    tags: [id-token, jwt, structure]
    question: |
      An ID Token is a JWS-signed JWT. What are its three dot-separated parts?
    options:
      - header, payload, signature
      - issuer, subject, signature
      - scope, audience, nonce
      - algorithm, key, ciphertext
    answer: 0
    explanation: |
      A compact JWS/JWT is `base64url(header).base64url(payload).base64url(signature)`. The
      header names the `alg` and `kid`; the payload holds the claims.
    ref: "concepts.md#id-token-structure-and-standard-claims"

  - id: openid-connect-and-sso-014
    difficulty: intermediate
    tags: [validation, checklist]
    question: |
      Which set of checks best captures full ID Token validation by a relying party?
    options:
      - Decode the payload and confirm the `exp` timestamp shows the token has not yet expired
      - Confirm the token is present in the response and that all three parts are base64url-decodable
      - Verify signature (correct kid, expected asymmetric alg, reject none), then iss, aud==client_id, exp/iat, and nonce
      - Verify only the signature and trust the OP to have already guaranteed every other claim value
    answer: 2
    explanation: |
      OIDC Core §3.1.3.7 requires verifying the signature with the correct key and an expected
      algorithm (rejecting `none`), then validating `iss`, `aud` (contains client_id), `exp`/`iat`
      with limited skew, and `nonce`.
    ref: "concepts.md#validating-the-id-token-iss-aud-exp-signature"

  - id: openid-connect-and-sso-015
    difficulty: advanced
    tags: [alg, none, signature]
    question: |
      During ID Token validation, why must the verifier pin the expected signing algorithm
      rather than trusting the token header's `alg`?
    options:
      - To improve parsing performance by skipping the algorithm-negotiation step on every verification
      - Because the `alg` header values are not standardized and differ unpredictably between providers
      - Because the OP deliberately randomizes the `alg` header on every request to prevent fingerprinting
      - Because an attacker can set `alg:none` or force key confusion (e.g. HS256 verified against a public key) to bypass signature checks
    answer: 3
    explanation: |
      Trusting the attacker-supplied `alg` allows `alg:none` (no signature) or key-confusion
      attacks where an RSA public key is misused as an HMAC secret. Verifiers must pin expected
      asymmetric algorithms. (Details in jwt-and-token-security.)
    ref: "concepts.md#validating-the-id-token-iss-aud-exp-signature"

  - id: openid-connect-and-sso-016
    difficulty: intermediate
    tags: [validation, clock-skew, exp]
    question: |
      When validating `exp` and `iat`, why is a small allowed clock skew (e.g. a couple of
      minutes) typically permitted?
    options:
      - To let already-expired tokens be reused indefinitely as long as they were once valid
      - To tolerate minor clock differences between the OP and the RP while keeping the window tight
      - Because the `exp` claim is optional under OIDC and is frequently absent from real ID Tokens
      - To allow tokens minted by other trusted issuers in the federation to validate against this RP
    answer: 1
    explanation: |
      Server clocks drift slightly. A small skew tolerance avoids false rejections without
      meaningfully widening the replay window. Large skews defeat the purpose of `exp`.
    ref: "concepts.md#validating-the-id-token-iss-aud-exp-signature"

  - id: openid-connect-and-sso-017
    difficulty: beginner
    tags: [nonce, state, defense]
    question: |
      Where does the `state` parameter appear on the way back to the client, and what does it
      defend against?
    options:
      - Inside the ID Token; defends against signature forgery
      - In the UserInfo response; defends against replay
      - In the redirect query string; defends against CSRF / callback confusion
      - In the JWKS document; defends against key rotation
    answer: 2
    explanation: |
      `state` (an OAuth parameter) is reflected on the redirect query string. The client checks
      it matches the session value, binding the callback to the browser that started the flow —
      defending against CSRF/callback confusion.
    ref: "concepts.md#nonce-vs-state-replay-and-csrf-defenses"

  - id: openid-connect-and-sso-018
    difficulty: intermediate
    tags: [nonce, replay]
    question: |
      Where does the `nonce` value appear, and what does it defend against?
    options:
      - Embedded inside the ID Token; defends against ID Token replay
      - In the redirect query string; defends against CSRF
      - In the token endpoint URL; defends against SSRF
      - In the JWKS `kid`; defends against key confusion
    answer: 0
    explanation: |
      The client sends `nonce` in the authorization request; the OP embeds it in the ID Token.
      The client verifies the token's `nonce` matches the session value, so a replayed/old ID
      Token from another flow is rejected.
    ref: "concepts.md#nonce-vs-state-replay-and-csrf-defenses"

  - id: openid-connect-and-sso-019
    difficulty: intermediate
    tags: [nonce, state, comparison]
    question: |
      Which statement correctly contrasts `state` and `nonce`?
    options:
      - Both values are returned inside the signed ID Token and defend against the same replay attack
      - '`nonce` is reflected on the redirect to stop CSRF; `state` sits inside the ID Token to stop replay'
      - Both are entirely optional parameters that provide no real security value and can be safely omitted
      - '`state` is reflected on the redirect and stops CSRF; `nonce` is inside the ID Token and stops replay'
    answer: 3
    explanation: |
      Different location, different threat: `state` (redirect query, OAuth) counters
      CSRF/callback confusion; `nonce` (inside the ID Token, OIDC) counters ID Token replay.
    ref: "concepts.md#nonce-vs-state-replay-and-csrf-defenses"

  - id: openid-connect-and-sso-020
    difficulty: advanced
    tags: [nonce, state, pkce]
    question: |
      How does PKCE relate to `state` and `nonce`?
    options:
      - PKCE fully replaces both `state` and `nonce`, so a client using PKCE no longer needs either parameter
      - PKCE protects the authorization code against interception and is complementary to state/nonce, not a replacement
      - PKCE is used only in the implicit flow, where it secures tokens returned directly in the URL fragment
      - PKCE is simply the `nonce` mechanism under a different name, computing the same value with a different label
    answer: 1
    explanation: |
      PKCE (RFC 7636) binds the authorization code to the client via `code_verifier`/
      `code_challenge`, protecting against code interception. It complements `state`
      (CSRF) and `nonce` (ID Token replay) rather than replacing them.
    ref: "concepts.md#nonce-vs-state-replay-and-csrf-defenses"

  - id: openid-connect-and-sso-021
    difficulty: intermediate
    tags: [randomness, single-use]
    question: |
      What property must both `state` and `nonce` have to be effective?
    options:
      - They must be cryptographically random, single-use, and per-request
      - They must be short and predictable to allow provider caching
      - They must be identical across every request from a given client
      - They must be derived from the user's registered email address
    answer: 0
    explanation: |
      Predictable or reused values defeat the defense. Both should be high-entropy, generated
      per authorization request, stored in the session, and used exactly once.
    ref: "concepts.md#nonce-vs-state-replay-and-csrf-defenses"

  - id: openid-connect-and-sso-022
    difficulty: beginner
    tags: [flow, authorization-code]
    question: |
      Which OIDC/OAuth flow is recommended (and mandated for all clients by OAuth 2.1, with
      PKCE)?
    options:
      - Implicit flow
      - Resource Owner Password Credentials flow
      - Authorization Code flow
      - Client Credentials flow
    answer: 2
    explanation: |
      The Authorization Code flow (with PKCE) is the recommended, most secure option for all
      client types including SPAs and mobile apps. OAuth 2.1 removes the implicit and password
      grants.
    ref: "concepts.md#the-authorization-code-flow-in-oidc"

  - id: openid-connect-and-sso-023
    difficulty: intermediate
    tags: [flow, back-channel]
    question: |
      In the Authorization Code flow, why is delivering tokens via the back-channel token
      endpoint more secure than the implicit flow?
    options:
      - It uses a faster binary network protocol that lowers the latency of the token round-trip
      - It removes the need for TLS on the token endpoint because the channel is already server-side
      - It eliminates the need for the client to authenticate itself to the token endpoint at all
      - Tokens are exchanged server-to-server and never exposed in the browser URL, history, or Referer
    answer: 3
    explanation: |
      The code is exchanged for tokens in a server-to-server POST to `/token`; tokens never
      appear in the browser URL/fragment where they could leak to history, logs, or the
      `Referer` header (the implicit flow's weakness).
    ref: "concepts.md#the-authorization-code-flow-in-oidc"

  - id: openid-connect-and-sso-024
    difficulty: intermediate
    tags: [implicit, deprecated]
    question: |
      Why does OAuth 2.1 remove the implicit flow (`response_type=id_token token`)?
    options:
      - It was too slow for mobile devices because the extra token round-trips drained battery and bandwidth
      - It returns tokens in the URL fragment, leaking them to history/Referer/logs, and cannot use PKCE properly
      - It required tokens to be encoded as XML documents instead of the JSON the rest of OAuth 2.0 uses
      - It only ever worked with SAML identity providers and could not integrate with pure OAuth servers
    answer: 1
    explanation: |
      Implicit returned tokens directly on the front channel (URL fragment), exposing them to
      browser history, the `Referer` header, and logs, without PKCE protection. Modern guidance
      is authorization code + PKCE for everyone.
    ref: "concepts.md#the-authorization-code-flow-in-oidc"

  - id: openid-connect-and-sso-025
    difficulty: advanced
    tags: [hybrid, c_hash, at_hash]
    question: |
      In the hybrid flow, a front-channel ID Token is returned alongside the authorization
      code. What extra validation binds that ID Token to the code and access token?
    options:
      - Validating the `c_hash` and `at_hash` claims against the code and access token
      - Verifying the `nonce` claim is empty to stop front-channel token replay
      - Checking that the `sid` claim matches the browser session cookie value
      - Confirming the token's `alg` header is set to `none` to skip signature checks
    answer: 0
    explanation: |
      The hybrid flow's front-channel ID Token carries `c_hash` (hash of the authorization
      code) and `at_hash` (hash of the access token) so the RP can confirm the token belongs
      with the code/access token it received.
    ref: "concepts.md#the-authorization-code-flow-in-oidc"

  - id: openid-connect-and-sso-026
    difficulty: beginner
    tags: [userinfo, access-token]
    question: |
      Which token does a client present to call the UserInfo endpoint?
    options:
      - The ID Token
      - The refresh token
      - The access token
      - The client secret
    answer: 2
    explanation: |
      UserInfo is an OAuth-protected resource; the client calls it with the access token in the
      `Authorization: Bearer` header. Sending the ID Token there is a mix-up of the two tokens.
    ref: "concepts.md#userinfo-endpoint"

  - id: openid-connect-and-sso-027
    difficulty: advanced
    tags: [userinfo, sub, substitution]
    question: |
      Per OIDC Core, what MUST a client verify about the UserInfo response relative to the ID
      Token?
    options:
      - That the UserInfo response body is larger than the ID Token, proving it carries the richer claim set
      - That UserInfo echoes back the same `nonce` value that was embedded in the ID Token by the provider
      - That the UserInfo endpoint is served from a different domain than the OP's token endpoint
      - That the UserInfo `sub` exactly matches the ID Token `sub`
    answer: 3
    explanation: |
      OIDC Core §5.3.2 requires that the `sub` in the UserInfo response match the ID Token's
      `sub`; otherwise a token-substitution could splice one user's claims onto another's
      session.
    ref: "concepts.md#userinfo-endpoint"

  - id: openid-connect-and-sso-028
    difficulty: intermediate
    tags: [userinfo, id-token, design]
    question: |
      Why might an integration deliver only minimal claims in the ID Token and fetch richer
      claims from UserInfo?
    options:
      - UserInfo claims are automatically signed with a stronger key than the ID Token, so they are more trustworthy
      - It keeps the ID Token small and avoids pushing extra PII into browser-reachable places, while allowing fresher/richer claims on demand
      - ID Tokens are structurally limited to the `sub` claim and cannot carry any other user attributes at all
      - The OIDC specification mandates a UserInfo call on every single login before a session may be established
    answer: 1
    explanation: |
      A compact ID Token avoids bloating browser-reachable tokens with PII; UserInfo lets the
      client pull a richer or fresher claim set server-side when needed. Which claims go where
      is issuer-configurable.
    ref: "concepts.md#userinfo-endpoint"

  - id: openid-connect-and-sso-029
    difficulty: beginner
    tags: [discovery, well-known]
    question: |
      Where does a client fetch an OpenID Provider's metadata to auto-configure endpoints?
    options:
      - /oauth/metadata.xml
      - /userinfo
      - /.well-known/openid-configuration
      - /token/discovery
    answer: 2
    explanation: |
      OpenID Connect Discovery defines the JSON metadata document at
      `/.well-known/openid-configuration`, listing the authorization/token/userinfo endpoints,
      `jwks_uri`, supported algorithms, scopes, and more.
    ref: "concepts.md#discovery-and-jwks-well-known"

  - id: openid-connect-and-sso-030
    difficulty: intermediate
    tags: [jwks, kid, rotation]
    question: |
      How does the `kid` (key ID) in a JWT header support signing-key rotation?
    options:
      - It tells the verifier which public key in the JWKS to use, so the OP can publish new keys and clients select the matching one
      - It carries the symmetric key that the verifier uses to decrypt the token's encrypted payload section
      - It stores the token's expiry timestamp so the verifier can reject keys that have passed their rotation date
      - It indicates which client the token was issued to, letting the verifier map the key to that client's audience
    answer: 0
    explanation: |
      The `kid` lets the verifier pick the right key from the JWKS. The OP publishes new keys
      before signing with them; clients cache the JWKS, match `kid`, and refresh on an unknown
      `kid` — enabling smooth key rotation.
    ref: "concepts.md#discovery-and-jwks-well-known"

  - id: openid-connect-and-sso-031
    difficulty: intermediate
    tags: [jwks, tls, trust]
    question: |
      Why must the discovery document and JWKS always be fetched over TLS with a pinned
      expected issuer?
    options:
      - TLS compresses the JSON on the wire, making the discovery document and key set smaller to download
      - The specification forbids caching the documents over plain HTTP purely for performance and CDN reasons
      - TLS is only actually needed on the token endpoint, since that is where credentials are exchanged
      - A tampered JWKS lets an attacker substitute their own signing key, and an attacker-controlled issuer can point you at rogue metadata
    answer: 3
    explanation: |
      If discovery/JWKS is tampered with, an attacker can inject their own signing key and forge
      valid-looking tokens. TLS protects integrity, and pinning the expected issuer stops a
      token's `iss` from steering you to rogue metadata.
    ref: "concepts.md#discovery-and-jwks-well-known"

  - id: openid-connect-and-sso-032
    difficulty: advanced
    tags: [jwks, dos, kid-injection]
    question: |
      A verifier refetches the JWKS whenever it sees an unknown `kid`. Without a safeguard, how
      could an attacker abuse this?
    options:
      - By forcing the verifier to silently accept `alg:none` tokens whenever a JWKS refetch is in progress
      - By sending tokens with many bogus `kid` values to trigger unbounded outbound JWKS fetches (a request-amplification/DoS vector)
      - By rapidly rotating the client secret so the verifier's cached key set is invalidated on every request
      - By replaying an already-expired ID Token whose `kid` still resolves to a key present in the JWKS
    answer: 1
    explanation: |
      Refetching on every unknown `kid` can be abused to make the verifier issue many outbound
      requests. The mitigation is to rate-limit/cache JWKS refreshes so bogus `kid`s can't drive
      amplification.
    ref: "concepts.md#discovery-and-jwks-well-known"

  - id: openid-connect-and-sso-033
    difficulty: beginner
    tags: [sso, concept]
    question: |
      What is Single Sign-On (SSO)?
    options:
      - Authenticating once at a central Identity Provider to access multiple applications without re-entering credentials
      - A scheme where every connected application keeps its own synchronized copy of the user's password on file
      - A protocol that cryptographically signs every outbound HTTP request with the user's personal private key
      - A mechanism for signing a user out of exactly one participating application while leaving the others active
    answer: 0
    explanation: |
      SSO lets a user authenticate once at a central IdP/OP; connected apps trust the IdP's
      identity assertion, so the user does not re-enter credentials per app.
    ref: "concepts.md#single-sign-on-sso-concepts"

  - id: openid-connect-and-sso-034
    difficulty: intermediate
    tags: [sso, session, silent-auth]
    question: |
      What makes the "single" in single sign-on work seamlessly when the user opens a second
      app?
    options:
      - The second app directly reads and reuses the first app's session cookie from shared browser storage
      - The user's password is cached in the browser's credential store and silently auto-filled on the login form
      - The IdP maintains its own browser session, so a redirect can yield a fresh assertion without prompting
      - Every connected app shares one central database of active sessions that each queries on page load
    answer: 2
    explanation: |
      The IdP holds a session (usually a cookie on the IdP domain). When an app redirects an
      already-logged-in user to the IdP, it can issue a new assertion silently. OIDC exposes
      `prompt=none` to attempt this silent authentication.
    ref: "concepts.md#single-sign-on-sso-concepts"

  - id: openid-connect-and-sso-035
    difficulty: intermediate
    tags: [sso, blast-radius, tradeoff]
    question: |
      What is a key risk of centralizing authentication at a single IdP for SSO?
    options:
      - It makes de-provisioning departed users harder because each app must be revoked individually by hand
      - It forces every connected application to keep storing the user's password locally as a fallback path
      - It structurally prevents the use of multi-factor authentication anywhere in the federated login flow
      - 'It creates a single point of failure and large blast radius: IdP outage blocks all logins and IdP compromise affects every connected app'
    answer: 3
    explanation: |
      Centralization is powerful (central policy, fast de-provisioning) but the IdP becomes a
      single point of failure and a high-value target. Mitigations include phishing-resistant
      MFA at the IdP, monitoring, and high availability.
    ref: "concepts.md#single-sign-on-sso-concepts"

  - id: openid-connect-and-sso-036
    difficulty: beginner
    tags: [saml, oidc, format]
    question: |
      What assertion/token format does SAML 2.0 use versus OIDC?
    options:
      - SAML uses JSON Web Tokens signed with JWS, while OIDC uses XML assertions signed with XML-DSig
      - SAML uses XML assertions signed with XML-DSig; OIDC uses JWTs (JWS) on top of OAuth 2.0
      - Both SAML and OIDC use XML assertions signed with the XML Digital Signature standard
      - Both SAML and OIDC use opaque binary tokens that carry no client-parseable claim structure
    answer: 1
    explanation: |
      SAML 2.0 (2005) uses XML assertions signed with XML Digital Signature. OIDC (2014) uses
      JSON Web Tokens signed with JWS, layered on OAuth 2.0.
    ref: "concepts.md#saml-vs-oidc"

  - id: openid-connect-and-sso-037
    difficulty: intermediate
    tags: [saml, oidc, use-case]
    question: |
      Which statement best captures when OIDC is generally preferred over SAML?
    options:
      - OIDC's JSON + bearer-token model fits mobile, SPA, and API scenarios better than SAML's XML + browser-POST model
      - OIDC works only with on-premise enterprise directories and cannot authenticate users over the public internet
      - SAML can only carry coarse authorization scopes and is structurally incapable of expressing any user identity attributes
      - OIDC mandates SOAP web-service envelopes and WS-Security headers for every authentication request it issues
    answer: 0
    explanation: |
      OIDC's JSON and OAuth bearer-token model suit mobile/SPA/API use cases; SAML's XML +
      browser-POST design is clunky outside server-rendered web apps, though it remains common
      for enterprise web SSO.
    ref: "concepts.md#saml-vs-oidc"

  - id: openid-connect-and-sso-038
    difficulty: intermediate
    tags: [saml, roles]
    question: |
      In SAML, what are the two primary roles, corresponding to OIDC's OP and RP?
    options:
      - OpenID Provider (OP) and Relying Party (RP), the exact SAML-defined role names
      - Assertion Issuer and Assertion Consumer, the two SAML endpoint roles for token exchange
      - Identity Provider (IdP) and Service Provider (SP)
      - Authorization Server and Resource Server
    answer: 2
    explanation: |
      SAML uses Identity Provider (IdP) and Service Provider (SP). These map roughly to OIDC's
      OpenID Provider (OP) and Relying Party (RP).
    ref: "concepts.md#saml-vs-oidc"

  - id: openid-connect-and-sso-039
    difficulty: advanced
    tags: [xsw, saml, signature]
    question: |
      What is the essence of an XML Signature Wrapping (XSW) attack against a SAML SP?
    options:
      - Brute-forcing the Service Provider's private signing key offline until a matching assertion signature can be produced
      - Overflowing the XML parser with millions of deeply nested elements until it crashes and fails open, accepting the assertion
      - Downgrading the assertion's signature algorithm to `none` by rewriting the SignatureMethod so the SP skips verification
      - Exploiting the gap between the element the signature covers and the element the application logic actually reads, by injecting a forged unsigned assertion while keeping the signed one
    answer: 3
    explanation: |
      XSW abuses the difference between "there is a valid signature over some assertion" and
      "the logic reads assertion X." The attacker wraps the genuinely-signed assertion and
      injects an unsigned forged one that the business logic consumes.
    ref: "concepts.md#xml-signature-wrapping-attacks-saml"

  - id: openid-connect-and-sso-040
    difficulty: advanced
    tags: [xsw, defense]
    question: |
      Which is the correct primary defense against XML Signature Wrapping?
    options:
      - Accept any document that contains at least one valid signature anywhere, on the assumption that a present signature proves the whole response is authentic
      - After verifying the signature, operate only on the exact element the signature covers (resolve the signed Reference/ID), and reject duplicate assertion IDs
      - Disable XML signature verification entirely and rely solely on the TLS channel to the IdP to guarantee the assertion's integrity and origin
      - Re-query the document for the first `<Assertion>` element by tag name after verification, since the first assertion is always the signed one
    answer: 1
    explanation: |
      The verifier must consume exactly the element that was signed (resolve the signature's
      Reference URI/ID), validate the schema, and reject documents with multiple/duplicate
      assertion IDs — not re-select an assertion by tag name that may differ from the signed one.
    ref: "concepts.md#xml-signature-wrapping-attacks-saml"

  - id: openid-connect-and-sso-041
    difficulty: intermediate
    tags: [xsw, principle]
    question: |
      "The signature verified, so the assertion is trustworthy." Why is this reasoning unsafe
      for XML/SAML?
    options:
      - Because XML digital signatures are cryptographically weak and can always be forged offline given the public certificate alone
      - Because SAML assertions are never actually signed and instead rely entirely on the TLS session for their integrity
      - Because what matters is WHAT was signed and whether that is exactly what you consumed  — wrapping attacks break the assumption
      - Because an XML signature only covers the transport layer and says nothing about the assertion elements the SP parses
    answer: 2
    explanation: |
      A passing signature check only proves some element was signed; XSW exploits consuming a
      different (forged) element. You must ensure the signed element is the one your logic uses.
    ref: "concepts.md#xml-signature-wrapping-attacks-saml"

  - id: openid-connect-and-sso-042
    difficulty: intermediate
    tags: [idp-initiated, sp-initiated]
    question: |
      What distinguishes IdP-initiated SSO from SP-initiated SSO?
    options:
      - IdP-initiated starts at the IdP portal and pushes an unsolicited assertion; SP-initiated starts at the app, which redirects the user to the IdP
      - IdP-initiated starts at the application, which mints its own request, while SP-initiated starts at the IdP portal and pushes an assertion
      - They are identical flows that differ only in the token format used, XML for one and JWT for the other, with no difference in where they begin
      - SP-initiated SSO is defined only in the SAML specification, while IdP-initiated SSO is a feature exclusive to the OIDC specification
    answer: 0
    explanation: |
      SP-initiated: user hits the app first; the app redirects to the IdP with request context.
      IdP-initiated: user starts at the IdP portal and the IdP pushes an unsolicited
      assertion/token to the app.
    ref: "concepts.md#idp-initiated-vs-sp-initiated-sso"

  - id: openid-connect-and-sso-043
    difficulty: advanced
    tags: [idp-initiated, csrf, replay]
    question: |
      Why is IdP-initiated SSO generally considered less secure than SP-initiated SSO?
    options:
      - It is structurally incompatible with TLS and must transmit the assertion over plain HTTP to the Service Provider
      - It always places the access token directly in the redirect URL query string, where it leaks to browser history and logs
      - It can only be implemented on top of the OAuth implicit flow, which returns all tokens in the front-channel URL fragment
      - The assertion is unsolicited — there is no InResponseTo/state/nonce tying it  to a request the SP made, enabling login CSRF and assertion replay
    answer: 3
    explanation: |
      Without a request the SP generated (no `InResponseTo` in SAML, no `state`/`nonce`), the SP
      cannot confirm the response corresponds to this browser's request, opening login CSRF and
      replay. SP-initiated flows carry that binding context.
    ref: "concepts.md#idp-initiated-vs-sp-initiated-sso"

  - id: openid-connect-and-sso-044
    difficulty: intermediate
    tags: [idp-initiated, oidc, best-practice]
    question: |
      For OIDC, what is the recommended way to handle an "IdP-initiated" launch from a portal?
    options:
      - Have the IdP push an unsolicited ID Token straight to the RP's callback endpoint, skipping the /authorize redirect entirely
      - Have the IdP trigger a standard SP-initiated flow (redirect to /authorize) so state/nonce/PKCE are present
      - Disable ID Token signature validation for portal-launched sessions, since the IdP portal is already a trusted origin
      - Send the ID Token as a URL fragment to the RP so the browser JavaScript can read it and establish the session locally
    answer: 1
    explanation: |
      OIDC has no standardized IdP-initiated login primitive. The secure pattern is for the IdP
      to kick off a normal SP-initiated flow to `/authorize`, so `state`, `nonce`, and PKCE
      provide the usual request binding.
    ref: "concepts.md#idp-initiated-vs-sp-initiated-sso"

  - id: openid-connect-and-sso-045
    difficulty: intermediate
    tags: [logout, front-channel, back-channel]
    question: |
      What is the main difference between OIDC front-channel and back-channel logout?
    options:
      - Front-channel loads each RP's logout URL in hidden browser iframes; back-channel sends a server-to-server signed Logout Token to each RP
      - Front-channel uses direct server-to-server POSTs with a signed Logout Token; back-channel loads each RP's logout URL in hidden browser iframes
      - Front-channel logout is defined only in the SAML specification, while back-channel logout is a mechanism exclusive to OIDC
      - They are two interchangeable names for the same logout mechanism and differ only in which specification document describes them
    answer: 0
    explanation: |
      Front-channel logout uses hidden iframes in the browser to hit each RP's logout URL (fragile
      under third-party-cookie blocking). Back-channel logout is a server-to-server POST carrying a
      signed Logout Token — more reliable but requires the RP to map it to its session store.
    ref: "concepts.md#logout-front-channel-and-back-channel"

  - id: openid-connect-and-sso-046
    difficulty: advanced
    tags: [logout, logout-token, validation]
    question: |
      When validating an OIDC Back-Channel Logout Token, which of these is a required/correct
      rule?
    options:
      - It must contain a `nonce` claim exactly as an ID Token does, so the RP can replay-check the logout against its stored session nonce
      - It must be delivered completely unsigned so the RP can cheaply tell it apart from a signed ID Token at parse time
      - It must contain the logout `events` claim, and must NOT contain a `nonce` (which would indicate an ID Token being misused)
      - It must include a salted hash of the user's account password so the RP can confirm the logout targets the right credential
    answer: 2
    explanation: |
      A Logout Token must carry the `events` claim identifying the back-channel-logout event and
      must NOT include a `nonce` (that would signal an ID Token). It requires `sub`/`sid`, and
      `jti` for replay protection, plus signature/iss/aud/iat validation.
    ref: "concepts.md#logout-front-channel-and-back-channel"

  - id: openid-connect-and-sso-047
    difficulty: intermediate
    tags: [logout, slo, tradeoff]
    question: |
      Single Logout (SLO) is often unreliable in practice. What complementary design reduces the
      window where a revoked user still has access?
    options:
      - Longer access-token lifetimes so a single logout event has more time to propagate to every relying party
      - Disabling refresh tokens entirely so that every access token issued becomes permanent and never needs re-issuing
      - Storing all issued tokens only in browser localStorage so the RP can clear them synchronously on logout
      - Short access-token lifetimes so revocation converges quickly
    answer: 3
    explanation: |
      Because front-channel iframes break under third-party-cookie restrictions and not all RPs
      implement back-channel logout, SLO is best-effort. Short access-token lifetimes limit how
      long a session stays usable after logout/revocation.
    ref: "concepts.md#logout-front-channel-and-back-channel"

  - id: openid-connect-and-sso-048
    difficulty: advanced
    tags: [audience-confusion, federation]
    question: |
      A resource server accepts any validly-signed token from its trusted OP without checking
      the audience. Which principle does this violate?
    options:
      - Tokens should never be cryptographically signed, since a signature is what tempts services into skipping the audience check
      - '"Valid signature" implies "for me" — every consumer must independently pin  issuer and check that the token''s audience matches itself'
      - The OpenID Provider is solely responsible for enforcing audience restrictions, so a resource server may safely accept any token the OP signed
      - Audience claims only need to be checked on ID Tokens, and never on access tokens presented to a resource server
    answer: 1
    explanation: |
      A valid signature only proves the OP issued the token, not that it was minted for this
      service. Every relying party and resource server must pin `iss` and verify `aud` (and
      scope) for itself, or fall to audience-confusion/token-substitution attacks.
    ref: "concepts.md#federation-trust-and-token-audience-confusion"

  - id: openid-connect-and-sso-049
    difficulty: advanced
    tags: [mix-up, multi-op, rfc9207]
    question: |
      In an OAuth/OIDC mix-up attack against a client that supports multiple OPs, what is the
      recommended defense?
    options:
      - Pin the expected issuer per authorization request, use the `iss` response parameter (RFC 9207), and validate the token's `iss` matches the OP you started with
      - Register and use one identical redirect_uri across every OP so the callback destination is indistinguishable between providers
      - Disable PKCE for multi-OP clients so the authorization code can be redeemed at whichever provider the response arrives from
      - Trust whichever OP's token endpoint responds first to the code exchange, treating the fastest responder as the legitimate provider
    answer: 0
    explanation: |
      A mix-up attack steers a multi-OP client's response to the wrong OP. Tracking which OP a
      response belongs to — via per-request issuer pinning and the RFC 9207 `iss` response
      parameter — prevents redeeming a code at, or trusting a token from, the wrong provider.
    ref: "concepts.md#federation-trust-and-token-audience-confusion"

  - id: openid-connect-and-sso-050
    difficulty: advanced
    tags: [token-exchange, audience, api-to-api]
    question: |
      Service API_A receives an access token with `aud=API_A`. It needs to call API_B on the
      user's behalf. What is the correct handling?
    options:
      - Forward the exact same `aud=API_A` token to API_B unchanged, since audience claims are only advisory hints and not a hard constraint
      - Strip the `aud` claim out of the token before forwarding it, so API_B sees an audience-less token it can accept unconditionally
      - Obtain an audience-scoped token for API_B (e.g. via token exchange, RFC 8693); API_B must reject a token whose aud is API_A
      - Re-sign the token with API_A's own private key and a new `aud=API_B` so that API_B validates the signature and trusts it
    answer: 2
    explanation: |
      A token is only valid for its audience. Blindly forwarding an `aud=API_A` token to API_B is
      audience confusion; API_B must reject it. The correct pattern is token exchange (RFC 8693)
      or a fresh token scoped to API_B, and sender-constrained tokens further limit theft impact.
    ref: "concepts.md#federation-trust-and-token-audience-confusion"

  - id: openid-connect-and-sso-051
    difficulty: expert
    tags: [hybrid, at_hash, token-substitution]
    question: |
      An RP uses the hybrid flow (`response_type=code id_token`) and validates the front-channel
      ID Token's signature, `iss`, `exp`, and `nonce` — but not `aud`, `c_hash`, or `at_hash`.
      Which fix actually closes the token-substitution hole?
    options:
      - Rotate the OP signing keys on a much shorter schedule so any substituted front-channel token is invalidated before it can be replayed
      - Move `nonce` validation off the ID Token and onto the back-channel token response, checking it against the stored session value there
      - Validate `c_hash` against the received code and `at_hash` against the received access token, AND pin `aud` to the client_id
      - Switch the ID Token signing algorithm from RS256 to ES256, whose elliptic-curve signatures resist token-substitution splicing
    answer: 2
    explanation: |
      In the hybrid flow the ID Token rides the front channel alongside the code/access token, so
      an attacker can swap a different `code`/`access_token` while the honest ID Token still
      verifies (OIDC Core §16.11). Only `c_hash`/`at_hash` bind the ID Token to those artifacts;
      pinning `aud` is also required. Key rotation, alg choice, and moving nonce do nothing here.
    ref: "concepts.md#at_hash--c_hash-and-hybrid-flow-token-substitution"

  - id: openid-connect-and-sso-052
    difficulty: expert
    tags: [at_hash, hashing, algorithm]
    question: |
      An ID Token is signed with `RS256` and carries an `at_hash`. How is `at_hash` computed and
      verified against the access token?
    options:
      - SHA-256 the ASCII octets of the access token, take the left-most half of the digest, then base64url-encode
      - HMAC-SHA256 of the access token bytes keyed with the client secret, then base64url-encode the full 256-bit digest
      - SHA-512 the raw access-token bytes and compare the entire base64-encoded digest against the claim, using no truncation
      - Concatenate the access token with the request `nonce`, SHA-1 the combined string, and hex-encode the resulting digest
    answer: 0
    explanation: |
      Per OIDC Core §3.3.2.11, the hash function matches the JWS `alg` (RS256 → SHA-256). You hash
      the ASCII octets of the value, take the LEFT-MOST HALF of the digest (128 bits of a 256-bit
      hash), and base64url-encode that half. `c_hash` is computed the same way over the code.
    ref: "concepts.md#at_hash--c_hash-and-hybrid-flow-token-substitution"

  - id: openid-connect-and-sso-053
    difficulty: advanced
    tags: [code-flow, c_hash, binding]
    question: |
      Why is validating `c_hash` optional in the pure Authorization Code flow but required in the
      hybrid flow?
    options:
      - The pure Authorization Code flow never returns an ID Token at all, so there is no token in which a `c_hash` claim could appear
      - In the code flow the ID Token arrives on the back channel with the code, so it is already bound; in hybrid the ID Token rides the untrusted front channel alongside the code
      - The `c_hash` claim can only be computed over an access token and is undefined for authorization codes, so the code flow cannot use it
      - The Authorization Code flow signs its ID Tokens with a symmetric HMAC key, which makes the separate `c_hash` binding entirely redundant
    answer: 1
    explanation: |
      In the code flow the ID Token is delivered server-to-server in the token response together
      with the code, so nothing can be swapped in transit. In the hybrid flow the ID Token travels
      through the browser next to the code, so `c_hash` is the only thing binding them.
    ref: "concepts.md#at_hash--c_hash-and-hybrid-flow-token-substitution"

  - id: openid-connect-and-sso-054
    difficulty: expert
    tags: [request_uri, jar, ssrf]
    question: |
      An OP supports `request_uri` (JAR / RFC 9101) and fetches the referenced JWT server-side.
      An attacker sets `request_uri=http://169.254.169.254/latest/meta-data/`. What is the risk
      and the correct mitigation?
    options:
      - Denial of service only, because the large metadata document ties up the OP's fetcher; mitigate simply by raising the outbound fetch timeout
      - Cross-site scripting on the consent page, because the fetched metadata is rendered inline; mitigate purely with HTML output encoding
      - No real risk at all, because the JWT signature validation step will reject the IMDS metadata response before any harm is done
      - Server-Side Request Forgery to internal endpoints; mitigate by allowlisting request_uri to pre-registered values, blocking internal address ranges, and capping response size
    answer: 3
    explanation: |
      Fetching an attacker-controlled `request_uri` lets them target cloud IMDS / internal admin
      URLs — classic SSRF. The signature check happens after the fetch, so it does not prevent the
      request being made. Mitigate by restricting `request_uri` to registered/allowlisted URLs,
      blocking link-local/internal ranges, and limiting response size.
    ref: "concepts.md#request-objects-request_uri-and-jar-ssrf--validation-bypass"

  - id: openid-connect-and-sso-055
    difficulty: expert
    tags: [jar, request-object, redirect-uri]
    question: |
      A server validates the query-string `redirect_uri` against its allowlist, but when a signed
      Request Object (`request` JWT) is present it uses the `redirect_uri` inside the JWT — which
      it does NOT re-check. What is the consequence?
    options:
      - The attacker can smuggle an unvalidated `redirect_uri` inside the JWT and steal the authorization code — a redirect-URI validation bypass
      - Nothing at all, since a signed Request Object is inherently trusted end to end once its JWT signature verifies
      - The token endpoint will reject the whole flow outright, returning a duplicate-parameter error for the repeated redirect_uri
      - The ID Token's `aud` claim silently changes to the attacker's client_id, but the authorization code itself stays safe
    answer: 0
    explanation: |
      Parameters can appear both in the query string and inside the Request Object. If validation
      runs on the query copy but the JWT copy is honored, an attacker smuggles a malicious
      `redirect_uri` past the check and captures the code. Per JAR the in-JWT parameters take
      precedence and must be the ones validated.
    ref: "concepts.md#request-objects-request_uri-and-jar-ssrf--validation-bypass"

  - id: openid-connect-and-sso-056
    difficulty: expert
    tags: [dynamic-registration, ssrf, logo_uri]
    question: |
      Your OIDC OP fetches the client's `logo_uri` server-side to render it on the consent screen,
      and registration is unauthenticated. Referencing CVE-2021-26715, what can go wrong?
    options:
      - Only increased bandwidth and storage cost from caching oversized logo images, with no meaningful security impact to the OP
      - Second-order SSRF (the OP fetches attacker URLs) and, if content-type is unchecked, stored XSS on the consent page
      - The client secret leaks outbound in the Authorization header the OP attaches when it fetches the attacker-supplied logo
      - The fetched logo overwrites the OP's TLS certificate chain, letting the attacker impersonate the provider's HTTPS endpoint
    answer: 1
    explanation: |
      `logo_uri` is a server-fetched URL. An attacker registering it can drive SSRF to internal
      endpoints, and if the fetched content-type is not validated the "image" can become stored
      XSS on the consent page (MITREid Connect CVE-2021-26715). Defenses: gate registration,
      allowlist/validate hosts, block internal ranges, and check content-type.
    ref: "concepts.md#dynamic-client-registration-abuse--second-order-ssrf"

  - id: openid-connect-and-sso-057
    difficulty: advanced
    tags: [dynamic-registration, ssrf, metadata]
    question: |
      Which set of Dynamic Client Registration metadata fields are the SERVER-FETCHED URLs that
      need SSRF hardening (allowlist, host validation, size caps)?
    options:
      - '`redirect_uri`, `client_uri`, `policy_uri`, `tos_uri`'
      - '`client_name`, `contacts`, `grant_types`, `scope`'
      - '`jwks_uri`, `logo_uri`, `sector_identifier_uri`, `request_uris`'
      - '`token_endpoint_auth_method`, `response_types`, `application_type`'
    answer: 2
    explanation: |
      The OP fetches `jwks_uri` (for JWT client auth), `logo_uri` (consent rendering),
      `sector_identifier_uri` (pairwise grouping), and `request_uris` — all SSRF-prone. The others
      are stored or handed to the browser (`redirect_uri`, `client_uri`, `policy_uri`, `tos_uri`)
      and are client-side only.
    ref: "concepts.md#dynamic-client-registration-abuse--second-order-ssrf"

  - id: openid-connect-and-sso-058
    difficulty: expert
    tags: [account-takeover, email, sign-in-with]
    question: |
      An app supports "Sign in with Google" and matches federated logins to existing local
      accounts by `email`. Why is this dangerous, and what is the correct fix?
    options:
      - It is perfectly fine as long as the ID Token's signature verifies, since a valid signature already proves the asserted email belongs to the user
      - The only real risk is email deliverability; fix it by verifying the domain's MX records resolve before matching the account
      - Match on the `name` claim together with `email` so the combined pair uniquely identifies the user and eliminates the collision risk
      - Unverified-email / pre-hijack ATO — key accounts on `(iss, sub)`, require `email_verified: true`, and never auto-link a federated identity to a local account by email alone
    answer: 3
    explanation: |
      If an OP does not verify email ownership (or the RP ignores `email_verified`), an attacker
      can obtain a token asserting the victim's email and be matched/linked into their account.
      Key on the stable `(iss, sub)` pair, require `email_verified`, and require re-auth /
      ownership proof before linking — never auto-merge by email.
    ref: "concepts.md#sign-in-with-x-account-takeover-via-unverified-email"

  - id: openid-connect-and-sso-059
    difficulty: advanced
    tags: [account-linking, merge, defense]
    question: |
      Which practice most directly prevents account-linking/merge attacks in federated login?
    options:
      - Automatically merging any federated identity into a local account the instant the two email addresses match, with no further confirmation step
      - Requiring the user to authenticate to the existing local account (or complete ownership proof) before linking a federated identity, and treating linking as a step-up operation
      - Trusting whichever OP is the first to return a matching email address and linking that federated identity into the account immediately
      - Storing the federated `sub` value as the account key but ignoring the `iss`, so identities from different providers collapse together
    answer: 1
    explanation: |
      Auto-merging by matching email is exactly the vulnerability. Safe linking requires the user
      to prove control of the existing account before a federated identity is attached, and
      linking should be gated like a sensitive operation.
    ref: "concepts.md#sign-in-with-x-account-takeover-via-unverified-email"

  - id: openid-connect-and-sso-060
    difficulty: expert
    tags: [saml, cve, parser-differential]
    question: |
      A single valid signed SAML assertion for a low-privilege user lets an attacker sign in as
      admin (Ruby-SAML CVE-2025-25291/25292). What is the class of bug and its root cause?
    options:
      - Weak signing key; the root cause is the IdP signing assertions with a factorable 1024-bit RSA key the attacker can reconstruct
      - Assertion replay; the root cause is a missing `NotOnOrAfter` letting a captured admin assertion be resubmitted indefinitely
      - Open redirect via `RelayState`; the root cause is an unvalidated deep-link target reflected verbatim after login completes
      - Parser-differential signature-wrapping — two XML parsers interpret the same document differently and signature verification was not linked to the consumed/hashed content
    answer: 3
    explanation: |
      Ruby-SAML used REXML and Nokogiri, which disagree on a document containing a second
      `<Signature>` hidden in `StatusDetail`. Because hash verification and signature verification
      were not linked, each passed independently — so one valid signed assertion for any user
      allowed impersonating anyone. It is a parser-differential form of XML signature wrapping.
    ref: "concepts.md#saml-parser-differential-auth-bypass-cve-2025-25291292-and-response-validation"

  - id: openid-connect-and-sso-061
    difficulty: advanced
    tags: [saml, destination, replay]
    question: |
      Beyond Issuer/Audience/timestamps, which SAML `<Response>`/`<SubjectConfirmationData>`
      checks specifically stop an assertion minted for a DIFFERENT SP being replayed to yours?
    options:
      - Verifying the `Destination` matches this SP's ACS URL and the `Recipient` matches the ACS URL (plus `InResponseTo` and `NotOnOrAfter`)
      - Checking the assertion carries a valid `logo_uri` attribute pointing at the issuing IdP's branding endpoint before accepting it
      - Ensuring the assertion's signature algorithm is SHA-1 with RSA, since older SPs require that digest for interoperability
      - Confirming the `RelayState` parameter is reflected back verbatim so the post-login redirect target survives the round trip
    answer: 0
    explanation: |
      `Destination` (on the Response) and `Recipient` (in SubjectConfirmationData) must match this
      SP's ACS URL, so an assertion intended for another SP is rejected; `InResponseTo` and
      `NotOnOrAfter` add request-binding and freshness. SHA-1 should be rejected, not required.
    ref: "concepts.md#saml-parser-differential-auth-bypass-cve-2025-25291292-and-response-validation"

  - id: openid-connect-and-sso-062
    difficulty: advanced
    tags: [saml, relaystate, open-redirect]
    question: |
      A SAML SP reflects the `RelayState` parameter as the post-login redirect target without
      validation. What is the vulnerability and the fix?
    options:
      - Open redirect (and post-login bounce); treat RelayState as opaque and validate it against an allowlist of internal targets
      - Assertion signature bypass; fix it by requiring the IdP to XML-sign the `RelayState` value alongside the assertion body
      - XML external entity (XXE) injection; fix it by disabling DTD processing in the SP's XML parser before consuming the value
      - Login CSRF; fix it by embedding a per-session nonce inside the `RelayState` and rejecting any value whose nonce does not match
    answer: 0
    explanation: |
      `RelayState` is unsigned deep-link state. Reflecting an arbitrary URL turns it into an open
      redirect that can bounce a user to an attacker site after login. Treat it as opaque and
      validate against an allowlist rather than redirecting to arbitrary values.
    ref: "concepts.md#saml-parser-differential-auth-bypass-cve-2025-25291292-and-response-validation"

  - id: openid-connect-and-sso-063
    difficulty: expert
    tags: [saml, xml-comment, canonicalization]
    question: |
      The 2018 SAML "XML comment" bug let an attacker controlling `evil.com` impersonate
      `admin@example.com` using a NameID like `admin@example.com<!---->.evil.com`. What made this
      work, and how is it distinct from XSW?
    options:
      - The attacker forged the assertion's signature outright, and XSW works the same way by producing a second valid forged signature over the tampered NameID
      - The assertion was entirely unsigned so the SP accepted it blindly, whereas XSW instead requires a genuinely signed assertion to be present
      - Canonicalization stripped the comment while the library's text extraction read only the text before it (`admin@example.com`), so the signed-but-differently-canonicalized value was misread — distinct from XSW, which injects a separate unsigned element
      - The bug was really a TLS-layer protocol downgrade unrelated to the XML itself, tricking the SP into a plaintext assertion exchange
    answer: 2
    explanation: |
      Inserting an XML comment split the NameID text node; some libraries concatenated only the
      first text chunk after canonicalization removed the comment, extracting `admin@example.com`.
      Unlike XSW (which injects a forged unsigned element the logic reads instead of the signed
      one), this abuses a canonicalization/text-extraction mismatch on a single element.
    ref: "concepts.md#saml-parser-differential-auth-bypass-cve-2025-25291292-and-response-validation"

  - id: openid-connect-and-sso-064
    difficulty: expert
    tags: [session-management, postmessage, xss]
    question: |
      In OIDC Session Management, the RP iframe and the OP's `check_session_iframe` communicate
      via `postMessage`. What is the mandatory security control on that channel?
    options:
      - Strictly validating the message origin on both sides; accepting messages from any origin is an XSS/spoofing vector
      - Encrypting the `session_state` value with the client secret before it crosses the frame boundary so a malicious frame cannot read it
      - Setting the OP's session-state cookie to HttpOnly so that page JavaScript in either iframe is unable to read or tamper with it
      - Polling the `check_session_iframe` exactly once per established session to avoid message amplification and needless re-auth loops
    answer: 0
    explanation: |
      `postMessage` handlers MUST validate the sender/target origin; an unrestricted handler lets a
      malicious frame spoof session-state responses. Note the session-state cookie cannot be
      HttpOnly (JS must read it), so it must carry no PII — only opaque state.
    ref: "concepts.md#oidc-session-management-check_session_iframe--session_state"

  - id: openid-connect-and-sso-065
    difficulty: advanced
    tags: [session-management, third-party-cookies, reliability]
    question: |
      An RP relies on the OIDC `check_session_iframe` to detect OP logout. After browsers block
      third-party cookies, users hit an infinite silent re-auth loop. Why, and what is the fix?
    options:
      - The session `nonce` expired mid-loop; fix it by removing nonce validation from the silent re-auth path so the check stops failing
      - The cross-site OP iframe can no longer read its session-state cookie, so it reports `changed`/`error` repeatedly, triggering endless `prompt=none` re-auth; add retry caps and graceful fallback
      - The OP's JWKS rotated its signing keys; fix it by pinning one signing key permanently so the iframe never sees an unknown `kid`
      - The access token's lifetime is too short and keeps expiring; fix it by issuing access tokens that never expire for that session
    answer: 1
    explanation: |
      The `check_session_iframe` is cross-site, so third-party-cookie blocking / ITP prevents it
      from reading the OP session cookie, producing spurious `changed`/`error` results that drive
      repeated silent re-auth. Defensive code must cap retries and degrade gracefully — the same
      fragility that makes front-channel Single Logout unreliable.
    ref: "concepts.md#oidc-session-management-check_session_iframe--session_state"

  - id: openid-connect-and-sso-066
    difficulty: expert
    tags: [nist, fal, holder-of-key]
    question: |
      Per NIST SP 800-63C Federation Assurance Levels, what distinguishes FAL3 from FAL1/FAL2?
    options:
      - FAL3 requires holder-of-key — the subscriber proves possession of a key bound to the assertion — whereas FAL1 (signed bearer) and FAL2 (signed+encrypted bearer) are bearer assertions
      - FAL3 simply mandates a longer assertion-signing key (4096-bit RSA) than FAL1 and FAL2, while the bearer presentation model stays identical across all three
      - FAL3 removes the assertion signature requirement entirely and relies on the mutually authenticated TLS channel to the RP for integrity instead
      - FAL3 is defined only for SAML deployments while FAL1 and FAL2 apply only to OIDC, so the level dictates which protocol you must use
    answer: 0
    explanation: |
      FAL1 = signed bearer; FAL2 = signed AND encrypted-to-RP bearer (encryption required for
      front-channel presentation); FAL3 = holder-of-key, where the subscriber must prove
      possession of a bound key directly to the RP, so a stolen assertion alone is useless.
    ref: "concepts.md#assurance-levels-bearer-vs-holder-of-key-nist-800-63c"

  - id: openid-connect-and-sso-067
    difficulty: advanced
    tags: [bearer, holder-of-key, sender-constrained]
    question: |
      Which statement best contrasts a bearer assertion with a holder-of-key assertion?
    options:
      - Bearer assertions are always encrypted to the RP while holder-of-key assertions are always sent in the clear, which is what makes bearer the stronger of the two
      - Holder-of-key assertions cannot carry a digital signature at all, because the bound-key proof mechanism replaces the issuer's signature entirely
      - With a bearer assertion, possession equals use (steal-and-replay works); a holder-of-key assertion is bound to a key the subscriber must prove they hold, so a stolen assertion alone is useless
      - Bearer assertions require mutual TLS between subscriber and RP, whereas holder-of-key assertions only need ordinary server-authenticated TLS
    answer: 2
    explanation: |
      Bearer = anyone in possession can impersonate the subject. Holder-of-key binds the assertion
      to a subscriber-held key proven to the RP — the SSO analog of sender-constrained tokens
      (DPoP/mTLS). A merely referenced, unproven key degrades back to bearer.
    ref: "concepts.md#assurance-levels-bearer-vs-holder-of-key-nist-800-63c"

  - id: openid-connect-and-sso-068
    difficulty: advanced
    tags: [assertion-presentation, front-channel, back-channel]
    question: |
      In NIST 800-63C terms, what is the security advantage of back-channel assertion
      presentation over front-channel presentation?
    options:
      - Back-channel presentation is faster because it lets the RP skip signature verification once the IdP connection is server-to-server and already trusted
      - Front-channel assertions are automatically upgraded to holder-of-key by the browser, so they resist replay just as well as back-channel ones
      - Back-channel presentation eliminates the need for the RP to check the assertion's audience, since the direct IdP fetch already scopes it
      - The subscriber passes only a single-use artifact/reference through the browser and the RP fetches the real assertion directly from the IdP, so the full assertion never traverses the browser (smaller attack surface, less replay exposure)
    answer: 3
    explanation: |
      Back-channel (like SAML Artifact Binding) passes only a single-use reference through the
      browser; the RP retrieves the assertion server-to-server. Front-channel (like POST Binding)
      sends the full assertion through the browser where it is visible and replayable — which is
      why front-channel assertions must be encrypted (FAL2).
    ref: "concepts.md#assurance-levels-bearer-vs-holder-of-key-nist-800-63c"

  - id: openid-connect-and-sso-069
    difficulty: expert
    tags: [ppid, pairwise, privacy]
    question: |
      Two RPs run by different teams must be able to correlate the same user; a third RP must NOT
      be correlatable with them. How does an OP support both using subject identifiers?
    options:
      - Use `subject_type=public` for all three RPs so the `sub` is always identical, then have the third RP voluntarily discard the value it receives
      - Register all three RPs under one shared `client_id` so they present as a single client and the OP hands them a common subject identifier
      - Use `subject_type=pairwise`, place the two correlatable RPs in the same sector (shared `sector_identifier_uri`) so they receive the same PPID, and give the third its own sector so it gets a different `sub`
      - Disable the `sub` claim entirely for these clients and have them correlate users on the `email` claim instead of a subject identifier
    answer: 2
    explanation: |
      Pairwise (PPID) issues a different `sub` per sector. Grouping RPs under the same
      `sector_identifier_uri` makes them share a PPID (correlatable), while a separate sector
      yields a different `sub` for the third RP (not correlatable). Public would make all three
      correlatable.
    ref: "concepts.md#pairwise-vs-public-subject-identifiers-ppid"

  - id: openid-connect-and-sso-070
    difficulty: advanced
    tags: [ppid, sector-identifier, gotcha]
    question: |
      An RP using pairwise subject identifiers changes its `sector_identifier_uri`. What happens
      to existing users keyed on `(iss, sub)`?
    options:
      - The `sub` values change, so accounts keyed on `(iss, sub)` appear to "reset" and users look like new accounts
      - Nothing changes at all, because pairwise `sub` values are derived purely from the user identity and are independent of the sector identifier
      - The OP transparently migrates every user's old `sub` to the new one and emits both values during a grace period so nothing breaks
      - The ID Token's signature becomes invalid because the sector identifier is one of the inputs bound into the JWS signature computation
    answer: 0
    explanation: |
      With pairwise subjects the OP derives `sub` from the sector host. Changing the sector
      identifier changes every user's `sub`, so accounts keyed on `(iss, sub)` no longer match —
      a well-known operational gotcha requiring a planned migration.
    ref: "concepts.md#pairwise-vs-public-subject-identifiers-ppid"

  - id: openid-connect-and-sso-071
    difficulty: expert
    tags: [step-up, acr, max_age]
    question: |
      A banking RP must force phishing-resistant MFA before a wire transfer and prove it happened.
      Which approach is correct?
    options:
      - Trust the original login's ID Token indefinitely, since the user already completed authentication once when the session was first established
      - Send `prompt=none` for a silent round trip and simply assume phishing-resistant MFA occurred whenever no error response comes back from the OP
      - Ask the resource server to inspect the access token for an `mfa` scope string and treat its presence as proof that strong auth just happened
      - Re-run `/authorize` requesting the stronger `acr_values` (and/or a low `max_age`), then verify `acr`/`amr`/`auth_time` in the returned ID Token and re-prompt if the level is insufficient
    answer: 3
    explanation: |
      Step-up means requesting the required `acr_values` (e.g. a phishing-resistant level) or a
      tighter `max_age`, then VERIFYING the returned `acr`/`amr`/`auth_time` meets the bar and
      re-prompting otherwise. Merely requesting `acr_values` without verifying the returned `acr`
      is a common bug; a prior ID Token does not prove fresh, strong auth for this action.
    ref: "concepts.md#step-up-authentication-and-assertion-strength-acr-amr-max_age"

  - id: openid-connect-and-sso-072
    difficulty: advanced
    tags: [prompt, silent-auth, max_age]
    question: |
      What does `prompt=none` do, and what must the RP be prepared to handle?
    options:
      - It attempts silent authentication and returns `error=login_required` / `interaction_required` if any UI would be needed, which the RP must handle by starting an interactive flow
      - It silently logs the user out of the OP session as a side effect, so the RP must be ready to clear its own local session on return
      - It forces a full interactive re-authentication on every request regardless of whether a valid OP session already exists for the user
      - It disables `nonce` validation for that single request, so the RP must skip its usual replay check when handling the response
    answer: 0
    explanation: |
      `prompt=none` requests authentication without any user interaction; if the OP would need to
      show UI it returns `login_required`/`interaction_required` instead of prompting. The RP must
      catch that and fall back to an interactive flow. `prompt=login` is what forces re-auth.
    ref: "concepts.md#step-up-authentication-and-assertion-strength-acr-amr-max_age"

  - id: openid-connect-and-sso-073
    difficulty: expert
    tags: [redirect-uri, code-theft, state]
    question: |
      A reviewer argues that `state` and `nonce` alone protect the login callback, so exact
      redirect-URI matching is unnecessary. Why is this reasoning wrong?
    options:
      - '`state` and `nonce` are constructs defined only inside the SAML `<AuthnRequest>` protocol, not in OIDC, so an OIDC login callback exposes no such values to compare against the redirect URI in the first place'
      - '`state` and `nonce` are opaque values the client keeps server-side and never receives back on the callback, so there is nothing to validate there and the redirect URI becomes the only field the client can actually inspect'
      - Exact redirect-URI matching is redundant because the OP always encrypts the authorization code to the registered client's public key, so even if the code lands on an attacker-controlled URL it can never be decrypted or redeemed
      - In a redirect-hijack the attacker runs their own flow with their own valid `state`/`nonce`, so those checks pass on the attacker side; exact redirect-URI matching (plus PKCE binding the code to the legitimate client) is what actually prevents code theft
    answer: 3
    explanation: |
      `state`/`nonce` bind a callback to the session that started it, but an attacker generating
      their own values passes those checks. Parsing-discrepancy redirect tricks (path traversal,
      duplicate params, deceptive hosts) land the code on an attacker URL; exact-match registration
      and PKCE are what close code theft.
    ref: "concepts.md#redirect_uri-validation-in-the-oidc-login-context"

  - id: openid-connect-and-sso-074
    difficulty: intermediate
    tags: [redirect-uri, matching]
    question: |
      Which redirect-URI registration strategy is the robust default against parsing-discrepancy
      attacks?
    options:
      - Exact string matching against pre-registered redirect URIs
      - Prefix matching (any URL starting with the registered value is allowed)
      - Allowing any subdomain of the registered host
      - Matching only the host, ignoring path and query
    answer: 0
    explanation: |
      Exact-match registration avoids the loopholes that prefix/host/subdomain matching open
      (path append/traversal, `localhost.evil.com`, duplicate params). Loose matching repeatedly
      leads to open-redirect / code-theft bugs.
    ref: "concepts.md#redirect_uri-validation-in-the-oidc-login-context"

  - id: openid-connect-and-sso-075
    difficulty: intermediate
    tags: [nist, currency, 800-63-4]
    question: |
      A candidate cites NIST SP 800-63C for federation guidance. What currency caveat should they
      mention as of 2025?
    options:
      - 800-63C (part of 800-63-3) was superseded by SP 800-63-4, finalized July 2025, though its FAL/PPID/bearer-vs-holder-of-key concepts carry over
      - 800-63C was formally withdrawn in 2023 with no successor document, so federation deployments must now cite the ISO/IEC 29115 assurance framework instead of any NIST publication
      - 800-63C was revised to drop OIDC coverage entirely and now mandates SAML 2.0 as the only NIST-approved federation protocol for U.S. government relying parties
      - 800-63C was rescinded and its federation guidance folded directly into RFC 6749, so OAuth 2.0's core specification is now the authoritative source for FALs
    answer: 0
    explanation: |
      SP 800-63-4 was finalized on July 31, 2025, superseding the 800-63-3 family (including
      800-63C). The federation concepts — FALs, PPID, bearer vs holder-of-key, audience checks —
      remain relevant, but citing the current revision shows awareness.
    ref: "concepts.md#assurance-levels-bearer-vs-holder-of-key-nist-800-63c"

  - id: openid-connect-and-sso-076
    difficulty: expert
    tags: [jwks, kid-injection, dynamic-registration]
    question: |
      A multi-tenant OIDC broker lets clients register a `jwks_uri` for private_key_jwt client
      authentication and uses the token's `kid` to select a verification key. Which combination of
      hardening is correct?
    options:
      - Fetch whatever `jwks_uri` the incoming token header names at verification time, and trust any `kid` it references, since a token that supplies its own key location is self-describing and needs no separate registration lookup
      - Disable signature verification for clients that have completed dynamic registration, on the assumption that a registered `client_id` already proves authenticity, which also removes the JWKS-fetch traffic entirely
      - Accept `alg:none` tokens from any client that registered a `jwks_uri`, treating the prior key registration as sufficient proof of the client's identity for that authentication request
      - Pin each client's `jwks_uri` from its registration (not from the token), allowlist/validate that URL against SSRF, cap key-set and response size, and reject a `kid` that resolves to a key outside the pinned set
    answer: 3
    explanation: |
      The trusted `jwks_uri` must come from server-side registration, not be dictated by the token,
      and it must be SSRF-hardened (allowlist, block internal ranges, cap size). `kid` must only
      select among the pinned keys, preventing `kid`-injection at attacker keys. Disabling
      verification or accepting `alg:none` is never acceptable.
    ref: "concepts.md#dynamic-client-registration-abuse--second-order-ssrf"
