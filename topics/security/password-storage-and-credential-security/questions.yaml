topic: "Password Storage & Credential Security"
domain: security
topic_slug: password-storage-and-credential-security
version: 1
questions:
  - id: password-storage-and-credential-security-001
    difficulty: beginner
    tags: [storage, fundamentals]
    question: |
      Which approach is the correct way to store user passwords for a login
      system?
    options:
      - "A salted, adaptive, memory-hard one-way hash such as Argon2id"
      - "Plaintext, protected by database access controls"
      - "AES-256 encryption so the password can be verified by decrypting it"
      - "SHA-256 of the password so it cannot be reversed"
    answer: 0
    explanation: |
      Passwords should be verified, not recovered, so they must be stored as a
      one-way hash. It must be salted (per user) and adaptive/memory-hard
      (deliberately slow) — Argon2id by default. Plaintext and reversible
      encryption expose all passwords on a breach; plain SHA-256 is far too fast.
    ref: "concepts.md#why-never-plaintext-encrypted-or-fast-hashes"

  - id: password-storage-and-credential-security-002
    difficulty: beginner
    tags: [storage, encryption]
    question: |
      Why is storing passwords with reversible encryption (e.g., AES) considered
      wrong for a login system?
    options:
      - "AES is not a standardized algorithm"
      - "Encryption is slower than hashing and hurts login latency"
      - "AES output is too short to store safely"
      - "Whoever holds the key can recover every password, and the app must keep the key reachable"
    answer: 3
    explanation: |
      Encryption is reversible by design. The decryption key must be reachable by
      the app, so an attacker who breaches the system usually obtains it too,
      exposing all passwords. A login only needs to *verify* a password, never
      decrypt it — so a one-way hash is the right tool.
    ref: "concepts.md#why-never-plaintext-encrypted-or-fast-hashes"

  - id: password-storage-and-credential-security-003
    difficulty: intermediate
    tags: [fast-hash, md5, sha]
    question: |
      Why are general-purpose hashes like MD5, SHA-1, and SHA-256 unsuitable for
      password storage even when a unique salt is used?
    options:
      - "They produce hashes that are too long to index in a database"
      - "They cannot accept a salt as input"
      - "They are designed to be fast, so attackers compute billions of guesses per second offline"
      - "They are patented and cannot be used in commercial software"
    answer: 2
    explanation: |
      These hashes are engineered for speed. GPUs/ASICs compute billions to
      hundreds of billions of them per second, so even salted, an attacker who
      steals the table can brute-force low-entropy human passwords quickly.
      Passwords need a deliberately slow, tunable (adaptive) function instead.
    ref: "concepts.md#why-never-plaintext-encrypted-or-fast-hashes"

  - id: password-storage-and-credential-security-004
    difficulty: beginner
    tags: [plaintext, indicators]
    question: |
      A website emails you your original password when you click "forgot
      password." What does this most strongly indicate?
    options:
      - "The password is stored in a recoverable form (plaintext or reversible encryption)"
      - "The password is hashed with bcrypt"
      - "The site uses a pepper stored in an HSM"
      - "The site enforces NIST SP 800-63B guidelines"
    answer: 0
    explanation: |
      If a site can send you your actual password, it can recover it — meaning it
      is stored in plaintext or reversibly encrypted, not as a one-way hash. A
      properly designed system can only reset the password, never retrieve it.
    ref: "concepts.md#why-never-plaintext-encrypted-or-fast-hashes"

  - id: password-storage-and-credential-security-005
    difficulty: beginner
    tags: [salt, definition]
    question: |
      What is a salt in the context of password hashing?
    options:
      - "A secret key stored outside the database and shared by all users"
      - "The number of iterations the hash function performs"
      - "A unique, random value generated per password and stored alongside the hash"
      - "A checksum that detects tampering with the hash"
    answer: 2
    explanation: |
      A salt is a unique, random per-password value stored (in the clear) with the
      resulting hash. It ensures identical passwords produce different hashes and
      defeats precomputed (rainbow-table) attacks. It is not secret and is not the
      iteration count — those are different concepts.
    ref: "concepts.md#salting-per-user-unique-and-its-purpose"

  - id: password-storage-and-credential-security-006
    difficulty: intermediate
    tags: [salt, rainbow-tables]
    question: |
      What class of attack does a unique per-user salt specifically defeat?
    options:
      - "Online brute-force guessing against the login endpoint"
      - "Credential stuffing using passwords from other breaches"
      - "Timing side-channel attacks on the comparison"
      - "Precomputation attacks such as rainbow tables"
    answer: 3
    explanation: |
      A unique salt destroys precomputation: an attacker would need a separate
      rainbow table per salt, which is infeasible. Salting does not slow a targeted
      brute force (the adaptive hash does that) and does nothing against credential
      stuffing, which uses already-valid plaintext passwords.
    ref: "concepts.md#salting-per-user-unique-and-its-purpose"

  - id: password-storage-and-credential-security-007
    difficulty: intermediate
    tags: [salt, uniqueness]
    question: |
      Why is a single global salt (one value for the whole database) insufficient?
    options:
      - "It makes hashing too slow to be practical"
      - "One rainbow table built for that salt can crack the whole database, and identical passwords still collide"
      - "Global salts cannot be stored in the clear"
      - "Global salts violate FIPS-140 requirements"
    answer: 1
    explanation: |
      With one shared salt, identical passwords hash identically again, and an
      attacker can build a single rainbow table tuned to that one salt to attack
      every user at once. Salts must be unique per password to force per-user work.
    ref: "concepts.md#salting-per-user-unique-and-its-purpose"

  - id: password-storage-and-credential-security-008
    difficulty: intermediate
    tags: [salt, secrecy]
    question: |
      Is it a problem if an attacker who steals the password hashes also obtains
      the salts?
    options:
      - "No — salts are not secret; their purpose is uniqueness, and they are stored with the hash"
      - "Yes — salts must be kept secret or the hashes are trivially reversible"
      - "Yes — the salts let the attacker decrypt the passwords directly"
      - "No — but only if the salts are shorter than 8 bits"
    answer: 0
    explanation: |
      A salt's purpose is uniqueness/anti-precomputation, not secrecy. It is
      expected to be stored with the hash and it is fine that a breached attacker
      has it. Secrecy is the job of a pepper, which is kept out of the database.
    ref: "concepts.md#salting-per-user-unique-and-its-purpose"

  - id: password-storage-and-credential-security-009
    difficulty: advanced
    tags: [salt, phc-string]
    question: |
      A stored value looks like `$argon2id$v=19$m=19456,t=2,p=1$c29tZXNhbHQ$aGFzaA`.
      Where is the salt?
    options:
      - "It is not stored; it must be kept in a separate secret store"
      - "It is the `v=19` version field"
      - "It is derived deterministically from the username at verification time"
      - "It is embedded in the string (the second-to-last segment), along with the algorithm and parameters"
    answer: 3
    explanation: |
      Modern password hashes use a self-describing PHC string that embeds the
      algorithm, its parameters (m/t/p), the salt, and the hash. The salt is the
      penultimate segment. You store this one string; verification re-reads the
      parameters and salt from it — no separate salt column needed.
    ref: "concepts.md#salting-per-user-unique-and-its-purpose"

  - id: password-storage-and-credential-security-010
    difficulty: intermediate
    tags: [pepper, definition]
    question: |
      What distinguishes a pepper from a salt?
    options:
      - "A pepper is unique per user; a salt is shared by all users"
      - "A pepper is a secret kept outside the database (often the same for all users); a salt is unique per user and stored with the hash"
      - "A pepper is longer than a salt but otherwise identical in purpose"
      - "A pepper is the iteration count; a salt is the random input"
    answer: 1
    explanation: |
      A pepper is an application-level secret kept out of the database (config,
      secrets manager, or HSM), typically shared across users. A salt is unique per
      user and stored in the clear with the hash. The pepper adds secrecy;
      the salt adds uniqueness.
    ref: "concepts.md#peppering-an-application-level-secret"

  - id: password-storage-and-credential-security-011
    difficulty: intermediate
    tags: [pepper, threat-model]
    question: |
      Which threat scenario does a pepper primarily protect against?
    options:
      - "An attacker guessing passwords at the live login endpoint"
      - "A user choosing a weak, common password"
      - "A rainbow-table attack on unsalted hashes"
      - "A database-only compromise where the attacker gets hashes and salts but not the application's secrets"
    answer: 3
    explanation: |
      A pepper is defense in depth for a database-only breach (leaked backup, SQLi,
      read-only access). Because the pepper lives outside the DB, the stolen
      hashes+salts cannot be attacked offline without also compromising the app
      secret. It does nothing for online guessing or weak-password choice.
    ref: "concepts.md#peppering-an-application-level-secret"

  - id: password-storage-and-credential-security-012
    difficulty: advanced
    tags: [pepper, construction]
    question: |
      What is the OWASP-recommended way to apply a pepper to a password before an
      adaptive hash?
    options:
      - "Use an HMAC keyed by the pepper first, e.g., argon2id(HMAC-SHA256(password, pepper))"
      - "Concatenate the pepper and password: hash(pepper || password)"
      - "Store the pepper as an extra column next to the salt"
      - "XOR the pepper into the salt before hashing"
    answer: 0
    explanation: |
      OWASP recommends applying the pepper via a keyed function (HMAC) before the
      slow hash, e.g., argon2id(HMAC-SHA256(password, pepper)). Naive concatenation
      is discouraged (length/null-byte issues and harder rotation), and the pepper
      must never be stored with the hash.
    ref: "concepts.md#peppering-an-application-level-secret"

  - id: password-storage-and-credential-security-013
    difficulty: advanced
    tags: [pepper, rotation]
    question: |
      Why is rotating a pepper operationally hard, and what design makes it easier?
    options:
      - "It is easy — you just change the config value and existing hashes keep working"
      - "Rotation requires re-salting every record, which corrupts the salts"
      - "Because it is mixed into every hash at hash time, changing it invalidates all stored hashes; encrypting the hash with the pepper (rather than mixing it in) lets you decrypt-then-re-encrypt to rotate"
      - "Peppers cannot be rotated at all once chosen"
    answer: 2
    explanation: |
      A shared pepper applied inside the hash means every stored hash depends on it,
      so changing it breaks all verifications. Encrypting the stored hash using the
      pepper as the key makes rotation feasible: decrypt with the old pepper and
      re-encrypt with the new one, without needing the plaintext password.
    ref: "concepts.md#peppering-an-application-level-secret"

  - id: password-storage-and-credential-security-014
    difficulty: beginner
    tags: [argon2, recommended]
    question: |
      Which password-hashing algorithm does OWASP recommend as the default first
      choice for new systems?
    options:
      - "PBKDF2-HMAC-SHA1"
      - "bcrypt"
      - "SHA-512 with a salt"
      - "Argon2id"
    answer: 3
    explanation: |
      OWASP's preference order is Argon2id, then scrypt, then bcrypt, then PBKDF2
      (mainly for FIPS compliance). Argon2id is memory-hard and won the 2015
      Password Hashing Competition; its `id` variant balances GPU- and
      side-channel-resistance.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-015
    difficulty: intermediate
    tags: [argon2, parameters]
    question: |
      What do the Argon2id parameters m, t, and p control?
    options:
      - "m = maximum password length, t = timeout, p = padding"
      - "m = memory (KiB), t = iterations (time cost), p = parallelism (lanes)"
      - "m = mode, t = truncation length, p = pepper size"
      - "m = minimum entropy, t = table size, p = precomputation flag"
    answer: 1
    explanation: |
      Argon2id is tuned by m (memory in KiB), t (iterations / time cost), and p
      (parallelism). Higher memory is what makes it GPU/ASIC-resistant. OWASP's
      baseline is m=19456 KiB (19 MiB), t=2, p=1, among several equivalent configs.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-016
    difficulty: intermediate
    tags: [memory-hard, gpu]
    question: |
      Why does making a password hash "memory-hard" help against GPU/ASIC cracking?
    options:
      - "GPUs cannot execute hashing code at all"
      - "It forces the attacker to use a salt"
      - "High per-guess memory use limits how many guesses can run in parallel, since memory is expensive to replicate per core"
      - "Memory-hard functions produce longer hashes that take more time to compare"
    answer: 2
    explanation: |
      GPUs/ASICs win by massive parallelism (thousands of cores). Forcing each guess
      to consume a lot of RAM caps how many can run at once, since replicating large
      memory per core is costly. This neutralizes the attacker's parallelism
      advantage — the key idea behind Argon2 and scrypt.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-017
    difficulty: intermediate
    tags: [pbkdf2, fips]
    question: |
      When is PBKDF2 the appropriate choice despite not being memory-hard?
    options:
      - "When FIPS-140 compliance is required, since PBKDF2 is NIST-approved"
      - "When you need the fastest possible verification"
      - "When passwords may exceed 72 bytes"
      - "When you cannot generate a random salt"
    answer: 0
    explanation: |
      PBKDF2 is only CPU-hard (not memory-hard), so it is the weakest against GPU
      attacks. Its main value is that it is FIPS-140-approved (NIST SP 800-132), so
      it is chosen where compliance mandates an approved algorithm. Otherwise prefer
      Argon2id or scrypt.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-018
    difficulty: advanced
    tags: [pbkdf2, iterations]
    question: |
      Per current OWASP guidance, roughly how many iterations should PBKDF2-HMAC-
      SHA256 use?
    options:
      - "1,000"
      - "10,000"
      - "50"
      - "600,000"
    answer: 3
    explanation: |
      OWASP currently recommends about 600,000 iterations for PBKDF2-HMAC-SHA256
      (and ~210,000 for SHA-512). NIST's floor of "at least 10,000" is an absolute
      minimum, not a target; use the much higher OWASP numbers in practice.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-019
    difficulty: intermediate
    tags: [scrypt, parameters]
    question: |
      Which parameters tune the scrypt KDF (RFC 7914)?
    options:
      - "m (memory), t (time), p (parallelism)"
      - "N (CPU/memory cost), r (block size), p (parallelization)"
      - "cost factor only"
      - "iteration count and salt length only"
    answer: 1
    explanation: |
      scrypt is tuned by N (CPU/memory cost, a power of two), r (block size), and p
      (parallelization). OWASP's baseline is N=2^17 (128 MiB), r=8, p=1. It is the
      second choice after Argon2id.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-020
    difficulty: intermediate
    tags: [bcrypt, cost]
    question: |
      What does the bcrypt "cost" (work factor) represent, and what is OWASP's
      minimum recommendation?
    options:
      - "The salt length in bytes; minimum 16"
      - "The number of bytes of the password processed; minimum 72"
      - "The log2 of the number of rounds; each +1 doubles the work; minimum 10"
      - "The memory in MiB used per hash; minimum 19"
    answer: 2
    explanation: |
      bcrypt's cost is the base-2 logarithm of the iteration count, so each
      increment doubles the work. OWASP recommends a cost of at least 10, raised as
      high as server performance allows. bcrypt is not memory-hard and truncates
      input at 72 bytes.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-021
    difficulty: beginner
    tags: [bcrypt, limit]
    question: |
      What is the maximum input length bcrypt actually processes?
    options:
      - "16 bytes"
      - "72 bytes"
      - "256 bytes"
      - "There is no limit"
    answer: 1
    explanation: |
      bcrypt only hashes the first 72 bytes of input; anything beyond is silently
      ignored, so a long passphrase is effectively truncated. Applications should
      enforce or communicate this limit so users don't assume extra length adds
      security.
    ref: "concepts.md#bcrypts-72-byte-limit-and-password-shucking"

  - id: password-storage-and-credential-security-022
    difficulty: advanced
    tags: [bcrypt, shucking]
    question: |
      Why is `bcrypt(sha256(password))` — used to work around the 72-byte limit — a
      dangerous anti-pattern?
    options:
      - "SHA-256 output is longer than 72 bytes so it gets truncated"
      - "bcrypt cannot accept hexadecimal input"
      - "SHA-256 is reversible, so the password can be recovered"
      - "It enables 'password shucking': an attacker with a separate breach of unsalted sha256(password) values can feed them into the bcrypt verifier offline"
    answer: 3
    explanation: |
      Pre-hashing with an unsalted, predictable SHA-256 lets an attacker who already
      has sha256(password) values from another breach "shuck" the bcrypt layer by
      testing those hashes directly. The fix is to pre-hash with a keyed function
      (HMAC with a secret pepper), then base64-encode, then bcrypt.
    ref: "concepts.md#bcrypts-72-byte-limit-and-password-shucking"

  - id: password-storage-and-credential-security-023
    difficulty: advanced
    tags: [bcrypt, pre-hash]
    question: |
      If you must support passwords longer than 72 bytes with bcrypt, what is the
      safe pre-hashing construction?
    options:
      - "bcrypt(base64(HMAC-SHA384(password, pepper)))"
      - "bcrypt(md5(password))"
      - "bcrypt(sha256(password))"
      - "bcrypt(password truncated to 72 bytes)"
    answer: 0
    explanation: |
      Pre-hash with a keyed function the attacker cannot reproduce:
      bcrypt(base64(HMAC-SHA384(password, pepper))). The HMAC's secret key defeats
      shucking, and base64-encoding avoids NUL-byte truncation issues in bcrypt.
    ref: "concepts.md#bcrypts-72-byte-limit-and-password-shucking"

  - id: password-storage-and-credential-security-024
    difficulty: intermediate
    tags: [timing, comparison]
    question: |
      Why should secrets like tokens and HMAC signatures be compared with a
      constant-time comparison rather than ordinary `==`?
    options:
      - "Ordinary comparison is case-insensitive and may match wrong values"
      - "Ordinary comparison returns early at the first differing byte, leaking timing that lets an attacker recover the secret byte-by-byte"
      - "Constant-time comparison is faster on modern CPUs"
      - "Ordinary comparison cannot handle binary data"
    answer: 1
    explanation: |
      Short-circuiting comparisons take longer the more leading bytes match, a
      timing side channel an attacker can exploit over many requests to recover a
      secret incrementally. Constant-time comparison always examines all bytes,
      removing the signal.
    ref: "concepts.md#timing-safe-comparison"

  - id: password-storage-and-credential-security-025
    difficulty: intermediate
    tags: [timing, enumeration]
    question: |
      To avoid leaking which usernames exist, what should a login endpoint do when
      the submitted username is not found?
    options:
      - "Return immediately with a 'user not found' message"
      - "Redirect the user to the registration page"
      - "Perform a dummy password hash and return the same generic error with similar timing as a wrong password"
      - "Lock the (nonexistent) account for 15 minutes"
    answer: 2
    explanation: |
      Distinct responses or timings for "no such user" vs. "wrong password" leak
      valid usernames (user enumeration). A common mitigation is to hash a dummy
      password even when the account doesn't exist, and return one generic error, so
      response time and content are similar in both cases.
    ref: "concepts.md#timing-safe-comparison"

  - id: password-storage-and-credential-security-026
    difficulty: advanced
    tags: [timing, functions]
    question: |
      Which of these is a constant-time comparison suitable for secrets?
    options:
      - "String equality (`a == b` / `.equals()`)"
      - "`memcmp` in C"
      - "A hash-set membership check"
      - "`hmac.compare_digest` / `crypto.timingSafeEqual` / `MessageDigest.isEqual`"
    answer: 3
    explanation: |
      Purpose-built constant-time functions (hmac.compare_digest, timingSafeEqual,
      MessageDigest.isEqual) examine all bytes regardless of where they differ.
      Ordinary equality and memcmp short-circuit at the first mismatch and leak
      timing.
    ref: "concepts.md#timing-safe-comparison"

  - id: password-storage-and-credential-security-027
    difficulty: beginner
    tags: [credential-stuffing, definition]
    question: |
      What is credential stuffing?
    options:
      - "Replaying username/password pairs stolen from other sites' breaches, betting on password reuse"
      - "Trying every possible character combination against one account"
      - "Precomputing hash-to-plaintext tables for unsalted hashes"
      - "Padding a password with random characters before hashing"
    answer: 0
    explanation: |
      Credential stuffing uses already-valid email:password pairs from other
      breaches and replays them against your login, exploiting password reuse. It
      does not attack your password storage at all, so a strong Argon2id hash does
      nothing to stop it.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-028
    difficulty: intermediate
    tags: [credential-stuffing, defense]
    question: |
      Which set of defenses is most effective against credential stuffing?
    options:
      - "A stronger password hash (Argon2id) and a longer salt"
      - "MFA, breached-password screening, bot/device detection, and rate limiting"
      - "Encrypting the password column with AES-256"
      - "Adding a pepper stored in an HSM"
    answer: 1
    explanation: |
      Since the attacker already has valid plaintext passwords, hash strength,
      salts, and peppers are irrelevant. The durable defenses are MFA, screening
      against breached passwords, bot/anomaly detection (many usernames, one attempt
      each), and rate limiting.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-029
    difficulty: intermediate
    tags: [brute-force, dictionary]
    question: |
      What is the difference between a brute-force attack and a dictionary attack?
    options:
      - "Brute force works only online; dictionary works only offline"
      - "Brute force requires a salt; a dictionary attack does not"
      - "Brute force tries all combinations in the keyspace; a dictionary attack tries a curated list of likely passwords"
      - "They are identical terms"
    answer: 2
    explanation: |
      Brute force exhaustively tries combinations across the keyspace; a dictionary
      attack tries a curated wordlist of probable passwords first, which is far more
      efficient against low-entropy human passwords. Both can run online or offline.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-030
    difficulty: intermediate
    tags: [rainbow-tables]
    question: |
      What is a rainbow table, and what makes it ineffective?
    options:
      - "A list of common passwords; it is defeated by minimum-length rules"
      - "A GPU cracking rig; it is defeated by using SHA-512"
      - "A table of breached credentials; it is defeated by MFA"
      - "A precomputed hash-to-plaintext lookup (time-memory trade-off) for unsalted fast hashes; a unique per-user salt defeats it"
    answer: 3
    explanation: |
      A rainbow table is a precomputed, space-efficient lookup for reversing
      unsalted fast hashes. Adding a unique per-user salt means an attacker would
      need a separate table per salt, rendering precomputation useless.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-031
    difficulty: advanced
    tags: [salt, adaptive, distinction]
    question: |
      A candidate says "salting protects against offline brute force." What is the
      precise correction?
    options:
      - "Salting defeats precomputation (rainbow tables) and cross-user correlation, but it is the slow/adaptive hash — not the salt — that defeats targeted offline brute force"
      - "Salting protects against nothing; only encryption does"
      - "Salting fully defeats offline brute force by making each hash unique"
      - "Salting only matters for online attacks, not offline ones"
    answer: 0
    explanation: |
      Salt makes each hash unique, defeating precomputation and stopping an attacker
      from cracking many users at once — but it does not slow the guessing of a
      single hash. The adaptive/memory-hard cost factor is what makes targeted
      offline brute force expensive.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-032
    difficulty: advanced
    tags: [credential-stuffing, detection]
    question: |
      Which traffic pattern most strongly suggests a credential-stuffing campaign
      rather than a targeted brute force?
    options:
      - "Many failed attempts against a single account from one IP"
      - "Logins spread across many different usernames, each with only one or few attempts, often from many IPs"
      - "Repeated password resets for the same account"
      - "A spike in successful logins from the same device"
    answer: 1
    explanation: |
      Credential stuffing replays many distinct email:password pairs, so it shows a
      low failure-per-account but a high account count, frequently across rotating
      IPs. This spread is exactly why per-account lockout thresholds often miss it,
      motivating bot detection and breached-password checks.
    ref: "concepts.md#credential-attacks-stuffing-brute-force-dictionary-rainbow-tables"

  - id: password-storage-and-credential-security-033
    difficulty: beginner
    tags: [hibp, breached-passwords]
    question: |
      What is the purpose of checking a new password against the Have I Been Pwned
      Pwned Passwords service?
    options:
      - "To measure the password's entropy in bits"
      - "To generate a salt for the password"
      - "To reject passwords that already appear in known data breaches"
      - "To enforce a minimum length of 8 characters"
    answer: 2
    explanation: |
      Breached-password screening rejects passwords already exposed in breach
      corpuses — exactly the passwords credential-stuffing lists contain. NIST SP
      800-63B requires screening new/changed passwords against known-compromised
      lists.
    ref: "concepts.md#breached-password-checks-k-anonymity--hibp-range-api"

  - id: password-storage-and-credential-security-034
    difficulty: intermediate
    tags: [hibp, k-anonymity]
    question: |
      In the HIBP Pwned Passwords range API, how much of the password's SHA-1 hash
      does the client send to the server?
    options:
      - "The full 40-character hash"
      - "The plaintext password over TLS"
      - "The last 35 characters (the suffix) only"
      - "The first 5 hex characters (the prefix) only"
    answer: 3
    explanation: |
      The client sends only the first 5 hex characters of SHA-1(password). The
      server returns all suffixes sharing that prefix, and the client matches
      locally. The server never sees the full hash or password — the k-anonymity
      guarantee.
    ref: "concepts.md#breached-password-checks-k-anonymity--hibp-range-api"

  - id: password-storage-and-credential-security-035
    difficulty: intermediate
    tags: [hibp, k-anonymity, privacy]
    question: |
      How does the k-anonymity model in the HIBP range API protect the user's
      password from the API server?
    options:
      - "The 5-char prefix is shared by hundreds of candidate hashes, so the server cannot tell which one the client is checking"
      - "It encrypts the password with the server's public key"
      - "It sends a bcrypt hash instead of SHA-1"
      - "It routes the request through Tor"
    answer: 0
    explanation: |
      A 5-character prefix corresponds to many hundreds of possible full hashes, so
      the server cannot determine which specific password is being checked. The
      client downloads the candidate suffixes and does the final match locally.
    ref: "concepts.md#breached-password-checks-k-anonymity--hibp-range-api"

  - id: password-storage-and-credential-security-036
    difficulty: intermediate
    tags: [breached-passwords, when]
    question: |
      When should breached-password screening occur, per OWASP/NIST guidance?
    options:
      - "Only after an account has been compromised"
      - "At registration and at password change, rejecting compromised choices with actionable feedback"
      - "On every single login attempt, blocking the login if matched"
      - "Once a year as part of a scheduled audit"
    answer: 1
    explanation: |
      Screen at registration and password change so users cannot pick a
      known-compromised password, with clear guidance to choose another. This is the
      NIST-endorsed replacement for arbitrary composition rules.
    ref: "concepts.md#breached-password-checks-k-anonymity--hibp-range-api"

  - id: password-storage-and-credential-security-037
    difficulty: beginner
    tags: [nist, rotation-myth]
    question: |
      What does NIST SP 800-63B say about forcing users to change passwords
      periodically (e.g., every 90 days)?
    options:
      - "It is required for all systems handling personal data"
      - "Passwords must be rotated every 30 days"
      - "Verifiers SHOULD NOT require arbitrary periodic changes; force a change only on evidence of compromise"
      - "Rotation should occur every login"
    answer: 2
    explanation: |
      NIST SP 800-63B says verifiers should NOT require arbitrary/periodic password
      changes. Forced rotation drives users to weak, predictable variants
      (Spring2026 -> Summer2026) and reuse. Force a change only when compromise is
      evident.
    ref: "concepts.md#nist-sp-800-63b-password-policy-and-the-rotation-myth"

  - id: password-storage-and-credential-security-038
    difficulty: intermediate
    tags: [nist, composition]
    question: |
      Which password rule does NIST SP 800-63B recommend AGAINST imposing?
    options:
      - "A minimum length of 8 characters"
      - "Screening against breached-password lists"
      - "Supporting passwords up to at least 64 characters"
      - "Composition rules requiring mixtures of uppercase, digits, and symbols"
    answer: 3
    explanation: |
      NIST advises against composition rules (require an uppercase, a digit, a
      symbol, etc.) because they yield predictable patterns like "Password1!"
      without adding real entropy. It favors length, breach screening, and allowing
      the full character set instead.
    ref: "concepts.md#nist-sp-800-63b-password-policy-and-the-rotation-myth"

  - id: password-storage-and-credential-security-039
    difficulty: intermediate
    tags: [nist, usability]
    question: |
      Which usability practices does NIST SP 800-63B recommend for password entry?
    options:
      - "Block pasting to prevent shoulder-surfing, and never show the password"
      - "Permit pasting (to support password managers) and offer an option to temporarily show the password"
      - "Require the password to be typed twice on every login"
      - "Disable password managers via autocomplete=off"
    answer: 1
    explanation: |
      NIST recommends allowing paste (so password managers work) and offering a
      show-password toggle to reduce entry errors. Blocking paste and hiding the
      password harm usability and push users toward weaker, memorable passwords.
    ref: "concepts.md#nist-sp-800-63b-password-policy-and-the-rotation-myth"

  - id: password-storage-and-credential-security-040
    difficulty: intermediate
    tags: [nist, length]
    question: |
      Per NIST SP 800-63B, what are reasonable minimum and supported-maximum lengths
      for user-chosen passwords?
    options:
      - "Minimum 8 (SHALL), support at least 64 (SHOULD), with no truncation"
      - "Minimum 12, maximum 20, with truncation allowed"
      - "Minimum 6, maximum 16"
      - "There is no minimum; any length is acceptable"
    answer: 0
    explanation: |
      NIST requires at least an 8-character minimum for user-chosen secrets and that
      verifiers support at least 64 characters, accept all printable/Unicode
      characters and spaces, and not truncate. Length matters more than composition.
    ref: "concepts.md#nist-sp-800-63b-password-policy-and-the-rotation-myth"

  - id: password-storage-and-credential-security-041
    difficulty: advanced
    tags: [nist, rotation-myth, reasoning]
    question: |
      Why does forced periodic rotation tend to REDUCE security in practice?
    options:
      - "It increases server load, causing timeouts during login"
      - "It invalidates the stored salts, weakening the hashes"
      - "Users respond by choosing weaker, predictable incremental variants and reusing patterns"
      - "It disables MFA for the rotation window"
    answer: 2
    explanation: |
      When forced to change often, users pick minimal, predictable changes
      (Summer2026! -> Autumn2026!) and reuse patterns across sites, making passwords
      easier to guess — the opposite of the intent. Hence NIST's advice to rotate
      only on evidence of compromise.
    ref: "concepts.md#nist-sp-800-63b-password-policy-and-the-rotation-myth"

  - id: password-storage-and-credential-security-042
    difficulty: intermediate
    tags: [lockout, dos]
    question: |
      What is the main downside of aggressive account lockout (disable after N
      failures) as a brute-force defense?
    options:
      - "It slows down legitimate logins for everyone"
      - "It requires storing passwords in plaintext"
      - "It only works if the password is memory-hard hashed"
      - "It enables a denial-of-service: an attacker who knows a username can lock the victim out at will"
    answer: 3
    explanation: |
      Lockout lets an attacker deliberately lock out any account whose username they
      know, causing a denial of service. Lockout behavior can also leak whether an
      account exists. Throttling with progressive delays and CAPTCHA usually
      preserves availability better.
    ref: "concepts.md#account-lockout-vs-throttling-and-rate-limiting"

  - id: password-storage-and-credential-security-043
    difficulty: intermediate
    tags: [throttling, rate-limiting]
    question: |
      How does throttling/rate limiting differ from account lockout?
    options:
      - "Throttling permanently disables the account; lockout only delays it"
      - "Throttling slows attempts (progressive delays, CAPTCHA, per-IP and per-account limits) without disabling the account"
      - "Throttling applies only to offline attacks"
      - "They are the same mechanism with different names"
    answer: 1
    explanation: |
      Throttling slows attempts — exponential backoff, CAPTCHA after a threshold,
      per-IP and per-account limits, risk signals — rather than disabling the
      account. This crushes automated guessing while keeping the legitimate user
      able to log in.
    ref: "concepts.md#account-lockout-vs-throttling-and-rate-limiting"

  - id: password-storage-and-credential-security-044
    difficulty: intermediate
    tags: [nist, rate-limiting]
    question: |
      NIST SP 800-63B requires verifiers to limit consecutive failed authentication
      attempts on an account to no more than how many?
    options:
      - "100"
      - "5"
      - "10"
      - "1000"
    answer: 0
    explanation: |
      NIST SP 800-63B mandates a rate-limiting mechanism capping consecutive failed
      attempts at no more than 100 per account, and recommends layering CAPTCHA,
      increasing delays, and risk-based signals rather than blunt permanent lockout.
    ref: "concepts.md#account-lockout-vs-throttling-and-rate-limiting"

  - id: password-storage-and-credential-security-045
    difficulty: advanced
    tags: [rate-limiting, evasion]
    question: |
      Why can purely IP-based rate limiting fail to stop credential stuffing?
    options:
      - "IP addresses cannot be logged"
      - "IP-based limits are illegal under GDPR"
      - "Attackers distribute attempts across many rotating IPs (botnets/proxies), and shared NAT can wrongly punish real users"
      - "Rate limiting only works on the hash layer, not the network layer"
    answer: 2
    explanation: |
      Credential-stuffing attackers rotate through large IP pools, so a per-IP limit
      sees few attempts per IP and lets the attack through, while legitimate users
      behind shared NAT/CGNAT can be unfairly limited. Combine per-account and
      per-IP limits with bot detection, MFA, and breach screening.
    ref: "concepts.md#account-lockout-vs-throttling-and-rate-limiting"

  - id: password-storage-and-credential-security-046
    difficulty: advanced
    tags: [rehashing, migration]
    question: |
      When is the only practical moment to re-hash a user's password with stronger
      parameters or a new algorithm?
    options:
      - "During a nightly batch job over the database"
      - "When the salt is rotated"
      - "It can be done at any time directly from the stored hash"
      - "At successful login, when the plaintext password is briefly available"
    answer: 3
    explanation: |
      You cannot re-hash a password you don't hold in plaintext. Login is the one
      moment the plaintext is available: on success, if the stored hash uses
      outdated parameters (readable from the PHC string), re-hash and overwrite.
    ref: "concepts.md#rehashing-and-credential-migration"

  - id: password-storage-and-credential-security-047
    difficulty: advanced
    tags: [migration, legacy]
    question: |
      You inherit a legacy database of `md5(password)` values and cannot force all
      users to reset. How do you eliminate the naked fast hash immediately?
    options:
      - "Encrypt the md5 column with AES until users log in"
      - "Wrap every hash now as argon2id(md5(password)), then peel off the inner md5 on each user's next login"
      - "Add a per-user salt to the existing md5 hashes"
      - "Increase the md5 iteration count to 600,000"
    answer: 1
    explanation: |
      Re-hash the existing md5 values in bulk with a strong algorithm —
      argon2id(md5(password)) — so no bare fast hash remains. On each subsequent
      login you verify the wrapped value and can then re-hash the plaintext directly,
      peeling off the legacy inner layer.
    ref: "concepts.md#rehashing-and-credential-migration"

  - id: password-storage-and-credential-security-048
    difficulty: intermediate
    tags: [migration, phc-string]
    question: |
      What makes it possible to support multiple hash formats during a credential
      migration and know when a stored hash needs upgrading?
    options:
      - "Storing the algorithm identifier and parameters with each hash (e.g., a PHC string)"
      - "Storing all hashes with the same fixed algorithm"
      - "Keeping a plaintext copy of each password"
      - "Using the username as the salt"
    answer: 0
    explanation: |
      Self-describing PHC strings embed the algorithm and its parameters, so the
      verifier can support several formats simultaneously and detect, on login,
      which hashes use outdated settings and should be re-hashed.
    ref: "concepts.md#rehashing-and-credential-migration"

  - id: password-storage-and-credential-security-049
    difficulty: beginner
    tags: [md5, sha1, broken]
    question: |
      Which statement about MD5 and SHA-1 is correct in the context of password
      storage?
    options:
      - "They are safe if you add a long enough salt"
      - "They are memory-hard and therefore acceptable"
      - "They are broken for collision resistance and far too fast, making them unfit for password hashing"
      - "They are FIPS-approved for password storage"
    answer: 2
    explanation: |
      MD5 and SHA-1 have known collision attacks and, more importantly for
      passwords, are extremely fast — the opposite of what a password hash needs. No
      salt fixes their speed. Use a slow, memory-hard adaptive function.
    ref: "concepts.md#why-never-plaintext-encrypted-or-fast-hashes"

  - id: password-storage-and-credential-security-050
    difficulty: advanced
    tags: [argon2, tuning]
    question: |
      What is a sound method for choosing Argon2id parameters for a production
      login service?
    options:
      - "Use the library defaults without measuring anything"
      - "Set memory to 1 KiB so logins are fast"
      - "Pick the parameters that make verification take at least 5 seconds"
      - "Benchmark on production hardware to a target verify time (~250-500 ms) at the highest memory you can afford, starting from OWASP's m=19 MiB, t=2, p=1"
    answer: 3
    explanation: |
      Tune to a target per-login verification time (roughly 250-500 ms) using the
      highest memory the server can sustain under load, starting from OWASP's
      baseline (m=19456 KiB, t=2, p=1) and raising from there. Too fast weakens
      defense; multi-second times harm usability and enable login-endpoint DoS.
    ref: "concepts.md#adaptive-and-memory-hard-password-hashes"

  - id: password-storage-and-credential-security-051
    difficulty: advanced
    tags: [nist, rev4, length]
    question: |
      Per NIST SP 800-63B Revision 4 (2024), what is the minimum length required for
      a password used as the SINGLE authentication factor?
    options:
      - "8 characters"
      - "12 characters"
      - "15 characters"
      - "20 characters"
    answer: 2
    explanation: |
      Rev-4 raised the single-factor password minimum to 15 characters (SHALL). The
      older 8-character minimum now applies only when the password is used within a
      multi-factor process (password plus a second factor). Verifiers must still
      support at least 64 characters and must not truncate.
    ref: "concepts.md#nist-sp-800-63b-rev-4-the-15-character-minimum-and-updated-rules"

  - id: password-storage-and-credential-security-052
    difficulty: expert
    tags: [nist, rev4, mfa]
    question: |
      Under NIST SP 800-63B Rev. 4, in which situation is an 8-character password
      still acceptable?
    options:
      - "Only when the password is one factor within a multi-factor authentication process"
      - "Whenever the password is stored with Argon2id"
      - "For any consumer-facing application"
      - "When the password is screened against a breach list"
    answer: 0
    explanation: |
      Rev-4 permits an 8-character minimum only when the password is used inside an
      MFA flow; as a sole factor the minimum is 15. Neither the storage algorithm nor
      breach screening changes the length floor — those are independent requirements.
    ref: "concepts.md#nist-sp-800-63b-rev-4-the-15-character-minimum-and-updated-rules"

  - id: password-storage-and-credential-security-053
    difficulty: expert
    tags: [argon2, rfc9106, parameters]
    question: |
      RFC 9106 gives two recommended Argon2id settings. Which pair correctly
      describes them?
    options:
      - "m=2 GiB/t=1/p=4 (high-memory) and m=64 MiB/t=3/p=4 (memory-constrained)"
      - "m=1 KiB/t=1/p=1 and m=8 MiB/t=2/p=2"
      - "m=19 MiB/t=2/p=1 and m=12 MiB/t=3/p=1"
      - "m=128 MiB/t=10/p=8 and m=256 MiB/t=10/p=8"
    answer: 0
    explanation: |
      RFC 9106 §4 recommends a high-memory option (m=2 GiB, t=1, p=4) for well-
      provisioned back-end servers and a memory-constrained option (m=64 MiB, t=3,
      p=4). Both RFC baselines use p=4; OWASP's smaller m=19 MiB, p=1 floor is a
      minimum tuned for high-concurrency web tiers, not an RFC 9106 baseline.
    ref: "concepts.md#argon2id--scrypt--pbkdf2-parameter-internals-deep-dive"

  - id: password-storage-and-credential-security-054
    difficulty: expert
    tags: [argon2, parallelism, dos]
    question: |
      Why do web-tier deployments typically set Argon2id parallelism p=1 rather than
      RFC 9106's p=4?
    options:
      - "p greater than 1 disables the memory-hardness property"
      - "p=1 is required for the salt to be embedded in the PHC string"
      - "Higher p consumes an extra CPU core per concurrent login, multiplying core pressure under a login storm; p=1 keeps the concurrency budget predictable"
      - "Argon2id only supports p=1"
    answer: 2
    explanation: |
      Parallelism spends an additional core per concurrent login. On a shared web
      tier under many simultaneous logins, p>1 multiplies CPU pressure and risks a
      DoS; p=1 makes the per-login cost predictable. RFC 9106's p=4 assumes a
      dedicated auth service, not a shared tier. Memory-hardness is unaffected by p.
    ref: "concepts.md#argon2id--scrypt--pbkdf2-parameter-internals-deep-dive"

  - id: password-storage-and-credential-security-055
    difficulty: advanced
    tags: [pbkdf2, fips]
    question: |
      Among Argon2, scrypt, bcrypt, and PBKDF2, which is the only one that is
      FIPS-140 approved — and why does that matter?
    options:
      - "PBKDF2, so regulated environments requiring FIPS-validated cryptography must use it even though it is not memory-hard"
      - "Argon2id, because it won the Password Hashing Competition"
      - "bcrypt, because it is the oldest"
      - "scrypt, because it is memory-hard"
    answer: 0
    explanation: |
      Only PBKDF2 (NIST SP 800-132) is FIPS-approved; Argon2, scrypt, and bcrypt are
      not FIPS-validated. In FIPS-regulated systems that is the sole reason to accept
      PBKDF2's weaker (CPU-only) GPU resistance. Elsewhere, prefer Argon2id.
    ref: "concepts.md#argon2id--scrypt--pbkdf2-parameter-internals-deep-dive"

  - id: password-storage-and-credential-security-056
    difficulty: expert
    tags: [bcrypt, pre-hash, hmac]
    question: |
      In the construction bcrypt(base64(HMAC-SHA384(password, pepper))), why is
      SHA-384 chosen specifically rather than SHA-512?
    options:
      - "SHA-512 is cryptographically broken"
      - "SHA-384's 48-byte digest base64-encodes to 64 characters (<=72), while SHA-512's 64-byte digest encodes to 88 characters and would exceed bcrypt's 72-byte limit"
      - "SHA-384 is faster than SHA-512 on all hardware"
      - "bcrypt cannot process SHA-512 output at all"
    answer: 1
    explanation: |
      base64 expands bytes by 4/3. SHA-384's 48-byte digest becomes 64 base64
      characters, safely within bcrypt's 72-byte window; SHA-512's 64-byte digest
      becomes 88 characters, which bcrypt would silently truncate. base64 also strips
      NUL bytes, and the HMAC key (pepper) is what actually defeats shucking.
    ref: "concepts.md#argon2id--scrypt--pbkdf2-parameter-internals-deep-dive"

  - id: password-storage-and-credential-security-057
    difficulty: expert
    tags: [bcrypt, shucking, base64]
    question: |
      A team pre-hashes with plain bcrypt(base64(sha512(password))) to support long
      passwords. What is the residual weakness?
    options:
      - "It is only as strong as SHA-512 and remains shuckable: an attacker with a sha512(password) breach corpus can feed those digests into the bcrypt verifier"
      - "base64 reintroduces NUL-byte truncation"
      - "SHA-512 output is too short for bcrypt"
      - "There is no weakness; this is the recommended construction"
    answer: 0
    explanation: |
      base64 fixes NUL/length issues but does nothing for shucking. Because sha512 is
      unkeyed and predictable, an attacker holding sha512(password) values from
      another breach can test them directly against the bcrypt layer. The fix is a
      keyed HMAC (pepper) as the inner function, which the attacker cannot reproduce.
    ref: "concepts.md#argon2id--scrypt--pbkdf2-parameter-internals-deep-dive"

  - id: password-storage-and-credential-security-058
    difficulty: expert
    tags: [entropy, tokens, hashing]
    question: |
      A service must store the hash of a 256-bit random session token for lookup.
      Which storage approach is most appropriate?
    options:
      - "A single fast hash such as SHA-256 (or HMAC), because the token's high entropy makes brute force infeasible and verification must be cheap on every request"
      - "Argon2id with m=19 MiB, t=2, p=1 and a per-token salt"
      - "bcrypt at cost 12"
      - "PBKDF2 with 600,000 iterations"
    answer: 0
    explanation: |
      Adaptive/memory-hard hashing exists to slow guessing of low-entropy human
      inputs. A 256-bit random token cannot be brute-forced regardless of hash speed,
      so a fast SHA-256 or HMAC is correct and desirable — token lookup happens on
      every request and must be cheap. Argon2/bcrypt/PBKDF2 here just waste CPU.
    ref: "concepts.md#high-entropy-secrets-vs-low-entropy-passwords-when-not-to-use-a-slow-hash"

  - id: password-storage-and-credential-security-059
    difficulty: advanced
    tags: [entropy, principle]
    question: |
      What is the deciding factor for whether a credential needs a slow, salted,
      memory-hard hash versus a fast hash?
    options:
      - "Whether the credential is stored in a relational or NoSQL database"
      - "The entropy of the input: low-entropy human passwords need a slow hash; high-entropy random secrets do not"
      - "Whether the credential is transmitted over TLS"
      - "The length of the credential in characters"
    answer: 1
    explanation: |
      The threat is offline guessing, which is only feasible against low-entropy
      inputs. Human passwords have small keyspaces, so slowness raises per-guess cost;
      high-entropy random secrets are infeasible to guess at any speed, so a fast hash
      is both safe and preferable. Storage engine, TLS, and raw length are not the
      criterion.
    ref: "concepts.md#high-entropy-secrets-vs-low-entropy-passwords-when-not-to-use-a-slow-hash"

  - id: password-storage-and-credential-security-060
    difficulty: expert
    tags: [encryption, kms, replay]
    question: |
      Your application must store a downstream mail server's SMTP password and later
      present it in cleartext to authenticate to that server. How should it be stored?
    options:
      - "Argon2id hash, verified at send time"
      - "SHA-256 hash with a per-record salt"
      - "Authenticated envelope encryption under a KMS/HSM-managed key, because the value must be recovered (re-presented), not merely verified"
      - "Plaintext, protected only by database ACLs"
    answer: 2
    explanation: |
      A one-way hash is impossible here because the app must recover the original
      secret to replay it to the mail server. The correct control is reversible
      authenticated encryption (e.g., AES-GCM) with keys managed by a KMS/HSM and
      tight access control — the verify-vs-re-present distinction. Hashing cannot be
      undone; plaintext is unacceptable.
    ref: "concepts.md#when-reversible-encryption-is-the-correct-choice"

  - id: password-storage-and-credential-security-061
    difficulty: advanced
    tags: [encryption, distinction]
    question: |
      "Never encrypt passwords, always hash." When is this rule correctly overridden?
    options:
      - "When the password is longer than 72 bytes"
      - "When the credential must be replayed to a third party in cleartext (e.g., stored service passwords, OAuth refresh tokens), so it must be recoverable via KMS-managed encryption"
      - "When you want faster login verification"
      - "When you are using PBKDF2 for FIPS compliance"
    answer: 1
    explanation: |
      The hash-only rule applies to credentials you only need to verify (your users'
      login passwords). Secrets your app must present back to another system in
      cleartext cannot be hashed; they require reversible, KMS/HSM-backed encryption.
      Length, latency, and KDF choice do not justify encrypting your users' passwords.
    ref: "concepts.md#when-reversible-encryption-is-the-correct-choice"

  - id: password-storage-and-credential-security-062
    difficulty: advanced
    tags: [password-spraying, attack]
    question: |
      How does password spraying differ from a classic brute-force attack against one
      account, and why does per-account lockout miss it?
    options:
      - "It tries all combinations against a single account faster than brute force"
      - "It only works against offline stolen hashes"
      - "It relies on rainbow tables rather than live login attempts"
      - "It tries one or a few common passwords across many accounts, staying under each account's failure threshold, so per-account counters only ever see one or two failures"
    answer: 3
    explanation: |
      Spraying is low-and-slow: a common password (e.g., Winter2026!) tried across
      thousands of usernames, deliberately below each account's lockout limit.
      Per-account counters see almost no failures per account; the detectable signal
      is global (one password value against many usernames), motivating global anomaly
      detection, breach screening, and MFA.
    ref: "concepts.md#password-spraying-low-and-slow"

  - id: password-storage-and-credential-security-063
    difficulty: expert
    tags: [password-spraying, defense]
    question: |
      Which defense most directly detects a password-spraying campaign that stays
      under every per-account lockout threshold?
    options:
      - "Increasing the Argon2id memory cost"
      - "Global/tenant-wide anomaly detection on the volume of distinct usernames attempted against the same password or source"
      - "A longer per-user salt"
      - "Rotating passwords every 90 days"
    answer: 1
    explanation: |
      Because the signal is spread across accounts, only a global view — many distinct
      usernames hitting the same password value or the same source cluster — reveals
      spraying. Salt length and hash cost are irrelevant to an online attack, and
      forced rotation does not address it (and is itself discouraged).
    ref: "concepts.md#password-spraying-low-and-slow"

  - id: password-storage-and-credential-security-064
    difficulty: expert
    tags: [credential-stuffing, fingerprinting]
    question: |
      An attacker runs credential stuffing from 100k rotating residential-proxy IPs,
      one attempt per account. Which control best clusters this bot traffic despite
      the IP rotation?
    options:
      - "TLS/HTTP fingerprinting (JA3/JA4, HTTP/2 fingerprint, header ordering), which is far harder to spoof than IP or User-Agent"
      - "Per-IP rate limiting with a fixed threshold"
      - "Blocking the attacker's User-Agent string"
      - "A stronger password hash"
    answer: 0
    explanation: |
      IP and User-Agent are trivially rotated/spoofed; connection fingerprints (JA3/
      JA4, HTTP/2 settings, header order) reflect the client's actual TLS/HTTP stack
      and are much harder to vary per request, letting you cluster bot traffic across
      IPs. Hash strength is irrelevant to an online replay of valid passwords.
    ref: "concepts.md#credential-stuffing--ato-defense-stack-deep-dive"

  - id: password-storage-and-credential-security-065
    difficulty: advanced
    tags: [credential-stuffing, mfa, notification]
    question: |
      During a stuffing campaign, an account shows a CORRECT password but a FAILED MFA
      challenge. What is the appropriate response?
    options:
      - "Ignore it because MFA already blocked the login"
      - "Permanently lock the account and require admin unlock"
      - "Treat the account's password as compromised: notify the user and prompt a password reset"
      - "Disable MFA for that account to reduce friction"
    answer: 2
    explanation: |
      A correct password with a failed second factor means the password is already in
      the attacker's list even though MFA saved the login. Best practice is to notify
      the user and force a reset. MFA blocking the login (~99.9% per Microsoft) is why
      the attempt failed, but the leaked password should still be rotated.
    ref: "concepts.md#credential-stuffing--ato-defense-stack-deep-dive"

  - id: password-storage-and-credential-security-066
    difficulty: expert
    tags: [enumeration, channels]
    question: |
      A login endpoint returns identical timing for valid and invalid usernames but
      still leaks which accounts exist. Which residual channel is the most likely
      cause?
    options:
      - "The Argon2id memory parameter is too high"
      - "The salt is stored in the PHC string"
      - "The password is compared with a constant-time function"
      - "The response differs in HTTP status code, body content, or length (or the registration/reset flow reveals existing accounts)"
    answer: 3
    explanation: |
      Timing is only one enumeration channel. Different status codes, response
      bodies/lengths, or a registration/reset flow that says "email already taken" or
      differs for known vs. unknown addresses all leak account existence. The fix is a
      single generic message, identical status, and uniform response shape everywhere.
    ref: "concepts.md#user-enumeration-beyond-timing"

  - id: password-storage-and-credential-security-067
    difficulty: advanced
    tags: [enumeration, defense]
    question: |
      Which combination best prevents username enumeration across login,
      registration, and password reset?
    options:
      - "Lock accounts after 3 failures and show a specific 'account locked' message"
      - "Return 'user not found' quickly and 'wrong password' slowly so users get accurate feedback"
      - "A single generic message, identical HTTP status and response shape, uniform timing (dummy-hash on missing user), and generic 'if that account exists, we sent a link' reset responses"
      - "Require CAPTCHA only on the registration form"
    answer: 2
    explanation: |
      Enumeration is closed only by making the observable behavior identical across
      cases everywhere: one generic message, same status and body shape, uniform
      timing (hash a dummy password when the user is missing), and generic reset
      responses. Accurate per-case feedback and case-specific lockout messages leak
      exactly what you are trying to hide.
    ref: "concepts.md#user-enumeration-beyond-timing"

  - id: password-storage-and-credential-security-068
    difficulty: expert
    tags: [dos, argon2, memory]
    question: |
      A reviewer objects to a proposal to configure Argon2id with m=1 GiB, t=10 for
      "maximum security." What is the strongest objection?
    options:
      - "Argon2id does not support memory above 64 MiB"
      - "It weakens the hash because high memory reduces entropy"
      - "Each concurrent login allocates ~1 GiB and verification takes seconds, so a modest login flood exhausts RAM/CPU — a self-inflicted DoS; tune to ~250-500 ms and size memory against peak concurrent logins"
      - "It requires disabling the per-user salt"
    answer: 2
    explanation: |
      Over-tuning turns the login endpoint into a DoS target: concurrent_logins x 1
      GiB exhausts memory and multi-second verifies pile up. Size m so that peak
      concurrent logins times per-hash memory fits available RAM, and target roughly
      250-500 ms latency. Argon2 supports large memory and higher memory does not
      reduce security — it is the operational blast radius that is the problem.
    ref: "concepts.md#denial-of-service-via-password--kdf-input"

  - id: password-storage-and-credential-security-069
    difficulty: expert
    tags: [dos, django, cve]
    question: |
      Django CVE-2013-1443 was a denial-of-service in which a very long password
      caused expensive PBKDF2 computation. What was the fix?
    options:
      - "Switching from PBKDF2 to MD5"
      - "Capping the accepted password input length (Django limited it to 4096 bytes) before hashing"
      - "Removing the salt to speed up hashing"
      - "Lowering the PBKDF2 iteration count to 1,000"
    answer: 1
    explanation: |
      Unbounded input let an attacker submit a multi-megabyte password that pinned CPU
      in the KDF. The fix was to enforce a maximum input length before hashing (4096
      bytes in Django's case). Weakening the hash (MD5, no salt, low iterations) would
      trade a DoS for a far worse cracking exposure.
    ref: "concepts.md#denial-of-service-via-password--kdf-input"

  - id: password-storage-and-credential-security-070
    difficulty: expert
    tags: [okta, bcrypt, truncation]
    question: |
      In Okta's October 2024 Delegated Authentication vulnerability, the cache key was
      bcrypt(userId + username + password). Why could a long username let an attacker
      authenticate with ANY password on a cache hit?
    options:
      - "bcrypt hashes the username separately from the password"
      - "The username was used as the salt, colliding across users"
      - "When userId + username reached >=52 characters, the password bytes fell past bcrypt's 72-byte limit and were silently truncated away, so they no longer affected the hash"
      - "bcrypt reverses to plaintext when the input exceeds 72 bytes"
    answer: 2
    explanation: |
      bcrypt processes only the first 72 bytes. With a >=52-character userId+username
      prefix, the password bytes landed beyond byte 72 and were dropped, so the cached
      hash was independent of the password — any password matched. Okta's fix was to
      move from bcrypt to PBKDF2 (no 72-byte cap).
    ref: "concepts.md#the-okta-2024-bcrypt-truncation-incident-root-cause-it"

  - id: password-storage-and-credential-security-071
    difficulty: expert
    tags: [okta, design, input-framing]
    question: |
      Beyond bcrypt's 72-byte limit, what was the SECOND independent design mistake in
      the Okta bcrypt(userId + username + password) construction?
    options:
      - "Using bcrypt instead of Argon2id"
      - "Concatenating variable-length, attacker-controlled data (username) BEFORE the secret (password), letting an attacker push the password out of the hashed range"
      - "Failing to add a per-user salt"
      - "Using a cache at all for authentication"
    answer: 1
    explanation: |
      Two faults compounded: the 72-byte truncation AND placing an attacker-controlled
      variable-length field (username) ahead of the password. Because the attacker
      controlled the prefix length, they could deterministically push the password
      past byte 72. The lesson: never let a secret sit behind attacker-controlled
      variable-length data in a hash input.
    ref: "concepts.md#the-okta-2024-bcrypt-truncation-incident-root-cause-it"

  - id: password-storage-and-credential-security-072
    difficulty: expert
    tags: [php, type-juggling, comparison]
    question: |
      In PHP, comparing password hashes with loose equality (md5(pw) == stored) can be
      bypassed by "magic hashes." What is the mechanism, and the correct fix?
    options:
      - "The hashes are too long; fix by truncating them to 32 bytes"
      - "== is case-insensitive; fix by upper-casing both sides"
      - "md5 collisions cause the match; fix by using == with SHA-256"
      - "Digests of the form 0e followed by all digits are coerced to the float 0, so different passwords compare equal; fix with strict, type-safe, constant-time comparison (hash_equals())"
    answer: 3
    explanation: |
      Loose == coerces a "0e[digits]" digest to 0 * 10^n = 0, so any two such digests
      compare equal, yielding an auth bypass independent of timing. The fix is
      type-safe strict comparison and, for secrets, constant-time hash_equals().
      Switching to SHA-256 with == does not help — some SHA-256 digests match 0e[digits] too.
    ref: "concepts.md#comparison-function-bypasses-type-juggling-and-magic-hashes"

  - id: password-storage-and-credential-security-073
    difficulty: advanced
    tags: [comparison, timing, type-safety]
    question: |
      Which single comparison of a computed authentication tag against a stored value
      is safe against BOTH timing side channels and PHP-style type juggling?
    options:
      - "Loose equality (==)"
      - "String equality after casting both to integers"
      - "A constant-time, type-safe comparison such as hash_equals() / timingSafeEqual"
      - "memcmp on the raw bytes"
    answer: 2
    explanation: |
      hash_equals()/timingSafeEqual examine all bytes (no early return, no timing leak)
      and compare as byte strings (no numeric coercion, so no magic-hash bypass). Loose
      == leaks timing and allows type juggling; integer casting reintroduces coercion;
      memcmp short-circuits and leaks timing.
    ref: "concepts.md#comparison-function-bypasses-type-juggling-and-magic-hashes"

  - id: password-storage-and-credential-security-074
    difficulty: expert
    tags: [pepper, secrets-management]
    question: |
      A design stores the pepper in the same application config file that holds the
      database connection string. What is the security value of this pepper?
    options:
      - "Full protection, since the pepper is not in the database table itself"
      - "It doubles the effective key length of every hash"
      - "It makes the hashes FIPS-compliant"
      - "Near-zero: an attacker who reads the config to reach the DB obtains both the hashes' pepper and DB access, so there is no separate trust boundary"
    answer: 3
    explanation: |
      A pepper adds defense-in-depth only if it lives behind a separate trust boundary
      (HSM/TPM/TEE, KMS, or a dedicated secrets manager). Sitting in the same config as
      the DB credentials means one compromise yields both, so it adds essentially
      nothing. It does not change key length or confer FIPS status.
    ref: "concepts.md#secrets-management-for-the-pepper-and-keys"

  - id: password-storage-and-credential-security-075
    difficulty: advanced
    tags: [pepper, hsm, rotation]
    question: |
      Which arrangement gives a pepper real defense-in-depth AND supports rotation
      without knowing users' plaintext passwords?
    options:
      - "Store the pepper in a second column next to each hash"
      - "Have an HSM/KMS perform the keyed operation (key never leaves hardware), and encrypt the stored hash under a KMS-managed key so rotation is a re-wrap, not a re-hash"
      - "Hard-code the pepper as a constant in the source code"
      - "Derive the pepper from each user's salt"
    answer: 1
    explanation: |
      Keeping the key in an HSM/KMS (raw key never exposed) provides a separate trust
      boundary, and encrypting the stored hash under a KMS key (envelope encryption)
      lets you rotate by decrypt-then-re-encrypt without the plaintext password.
      Storing the pepper beside the hash, in source, or deriving it from the salt
      defeats the point.
    ref: "concepts.md#secrets-management-for-the-pepper-and-keys"

  - id: password-storage-and-credential-security-076
    difficulty: expert
    tags: [password-reset, tokens]
    question: |
      Which set of properties is correct for password-reset tokens?
    options:
      - "Sequential numeric IDs, reusable, no expiry, stored in plaintext"
      - "CSPRNG-generated, single-use, time-limited, and stored HASHED so a database leak of tokens does not enable takeover"
      - "The user's email address, valid for 30 days"
      - "A fast MD5 of the username, valid until used"
    answer: 1
    explanation: |
      Reset tokens are bearer credentials: a leak equals account takeover. They must
      be high-entropy (CSPRNG), single-use, short-lived, and stored hashed (like a
      password) so a DB compromise does not hand over raw tokens. Predictable or
      long-lived tokens, or plaintext storage, are all exploitable.
    ref: "concepts.md#password-reset-flow-security"

  - id: password-storage-and-credential-security-077
    difficulty: expert
    tags: [password-reset, host-header]
    question: |
      A reset email builds its link from the incoming request's Host header. What
      attack does this enable, and what is the fix?
    options:
      - "Clickjacking; fix with X-Frame-Options"
      - "Host-header injection: an attacker sets Host to their domain so the emailed link leaks the token to them; fix by building links from a trusted server-configured origin, not the request Host"
      - "CSRF; fix with a SameSite cookie"
      - "SQL injection; fix with prepared statements"
    answer: 1
    explanation: |
      If the link is constructed from the attacker-controllable Host header, a crafted
      request poisons the link so that when the victim clicks it, the valid token is
      sent to the attacker's domain. Build reset URLs from a trusted, server-side
      configured origin (allowlist), never from the incoming Host header.
    ref: "concepts.md#password-reset-flow-security"

  - id: password-storage-and-credential-security-078
    difficulty: advanced
    tags: [password-reset, sessions]
    question: |
      After a user successfully resets their password, which behavior is correct?
    options:
      - "Automatically log the user in and keep all existing sessions active"
      - "Do not auto-login; require a fresh login and invalidate all existing sessions"
      - "Email the new password to the user for their records"
      - "Lock the account for 24 hours as a precaution"
    answer: 1
    explanation: |
      A reset may be attacker-initiated, so you should not auto-login, and you must
      invalidate all existing sessions so an attacker who had a session is evicted.
      Emailing the new password implies recoverable storage and leaks it; locking the
      account after a legitimate reset is a needless DoS.
    ref: "concepts.md#password-reset-flow-security"

  - id: password-storage-and-credential-security-079
    difficulty: advanced
    tags: [reauth, step-up]
    question: |
      Why require the current password to be re-entered before changing the password,
      email, or MFA settings, even in an active session?
    options:
      - "To satisfy periodic rotation requirements"
      - "To re-derive the salt for the new password"
      - "To block an attacker riding a hijacked or unattended session from taking over the account; after re-auth, rotate the session and invalidate others"
      - "To measure password entropy before the change"
    answer: 2
    explanation: |
      Step-up re-authentication ensures the person performing a sensitive action holds
      the current credential, defeating session-riding on a stolen or unattended
      session. Best practice also rotates the session and invalidates other sessions
      after the re-auth. It is unrelated to rotation policy or salt derivation.
    ref: "concepts.md#re-authentication-step-up-and-change-notifications"

  - id: password-storage-and-credential-security-080
    difficulty: expert
    tags: [passkeys, webauthn, fido2]
    question: |
      Why does a database breach of a service that uses passkeys (WebAuthn/FIDO2)
      yield nothing crackable for the affected accounts?
    options:
      - "Passkeys are stored as Argon2id hashes with very high memory"
      - "The server stores only the per-origin PUBLIC key; authentication is a signed challenge, so there is no server-side secret to steal or brute-force"
      - "Passkeys are encrypted with a KMS key the attacker cannot reach"
      - "The passkey private key is stored salted and peppered on the server"
    answer: 1
    explanation: |
      WebAuthn/FIDO2 uses public-key credentials: the authenticator keeps the private
      key, and the relying party stores only the public key. Login proves possession by
      signing a fresh challenge, which is non-replayable and phishing-resistant. A DB
      breach exposes only public keys — useless to an attacker — structurally
      eliminating offline cracking and credential stuffing of that factor.
    ref: "concepts.md#passwordless-and-passkeys-webauthn--fido2"
