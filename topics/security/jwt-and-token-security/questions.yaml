topic: "JSON Web Tokens (JWT) & Token Security"
domain: security
topic_slug: jwt-and-token-security
version: 1
questions:
- id: jwt-and-token-security-001
  difficulty: beginner
  tags: [structure, base64url, format]
  question: |
    A signed JWT in JWS compact serialization consists of which three
    dot-separated parts?
  options:
  - "header.payload.signature"
  - "algorithm.claims.checksum"
  - "iv.ciphertext.tag"
  - "issuer.subject.audience"
  answer: 0
  explanation: |
    A JWS compact token is base64url(header) + "." + base64url(payload) + "."
    + base64url(signature). The signature is computed over the first two
    segments joined by a dot.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-002
  difficulty: beginner
  tags: [confidentiality, base64url, encoding]
  question: |
    A developer says "our JWTs are safe to put a user's password in because
    they're encoded." Why is this wrong?
  options:
  - "base64url is encryption, but the key is too weak"
  - "base64url is only encoding, not encryption — anyone with the token can decode and read the payload"
  - "The payload is hashed, so it can be reversed"
  - "JWTs compress the payload, which is lossy"
  answer: 1
  explanation: |
    A signed JWT (JWS) protects integrity and authenticity, not
    confidentiality. The header and payload are base64url-encoded and trivially
    decoded by anyone holding the token. Never store secrets in a JWS payload.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-003
  difficulty: beginner
  tags: [jws, jwe, encryption]
  question: |
    What is the key difference between a JWS and a JWE?
  options:
  - "JWS is encrypted; JWE is only signed"
  - "JWS uses base64; JWE uses base32"
  - "JWS provides integrity/authenticity with a readable payload; JWE provides confidentiality by encrypting the payload"
  - "There is no difference; they are two names for the same thing"
  answer: 2
  explanation: |
    JWS (RFC 7515) signs the token — the payload stays readable. JWE (RFC 7516)
    encrypts the payload so it is not readable. A default JWT is a JWS.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-004
  difficulty: intermediate
  tags: [jwe, structure]
  question: |
    A token you receive has five dot-separated segments
    (header.encrypted_key.iv.ciphertext.tag). What is it?
  options:
  - "A malformed JWS"
  - "A JWK Set"
  - "A refresh token"
  - "A JWE (JSON Web Encryption) token"
  answer: 3
  explanation: |
    JWE compact serialization has exactly five parts: protected header,
    encrypted content-encryption key, IV, ciphertext, and authentication tag.
    A JWS has three parts.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-005
  difficulty: beginner
  tags: [claims, exp, expiration]
  question: |
    Which registered JWT claim specifies the time after which the token must
    no longer be accepted?
  options:
  - "exp"
  - "iat"
  - "nbf"
  - "jti"
  answer: 0
  explanation: |
    exp (Expiration Time, RFC 7519) is a NumericDate; the verifier must reject
    the token when the current time is at or after exp (allowing minor clock
    skew).
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-006
  difficulty: intermediate
  tags: [claims, aud, audience]
  question: |
    One authorization server signs tokens for both a billing API and an admin
    API using the same key. The admin API does not check the aud claim. What is
    the risk?
  options:
  - "Tokens will expire too quickly"
  - "A token legitimately issued for the billing API can be replayed against the admin API and accepted"
  - "The signature will fail to verify"
  - "The token becomes readable by clients"
  answer: 1
  explanation: |
    Without verifying aud, the admin API accepts any token the shared key
    signed — including one minted for the billing API. Always confirm this
    service's identifier is in aud.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-007
  difficulty: intermediate
  tags: [claims, numericdate, gotcha]
  question: |
    A team sets exp using JavaScript's Date.now(). Tokens then never seem to
    expire. What went wrong?
  options:
  - "exp must be an ISO 8601 string, not a number"
  - "exp is ignored unless nbf is also set"
  - "Date.now() returns milliseconds, but NumericDate is seconds since the epoch — so exp lands thousands of years in the future"
  - "exp only works with asymmetric algorithms"
  answer: 2
  explanation: |
    NumericDate is measured in seconds since the Unix epoch. Passing
    milliseconds inflates exp by ~1000x, pushing expiry far into the future and
    effectively disabling it.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-008
  difficulty: beginner
  tags: [claims, jti]
  question: |
    What is the primary purpose of the jti claim?
  options:
  - "To store the token's issuer domain"
  - "To specify the signing algorithm"
  - "To hold the user's email address"
  - "To provide a unique token identifier usable for replay detection and revocation denylists"
  answer: 3
  explanation: |
    jti (JWT ID) is a unique identifier for the token. It is commonly used to
    detect replay and to key a server-side revocation denylist.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-009
  difficulty: beginner
  tags: [algorithms, hs256, symmetric]
  question: |
    HS256 is which kind of algorithm?
  options:
  - "A symmetric HMAC using one shared secret to both sign and verify"
  - "An asymmetric digital signature using a private/public keypair"
  - "An encryption algorithm producing a JWE"
  - "A key-derivation function"
  answer: 0
  explanation: |
    HS256 is HMAC-SHA256: a single shared secret both signs and verifies.
    Anyone able to verify can also forge, so it suits a single trust boundary.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-010
  difficulty: intermediate
  tags: [algorithms, rs256, asymmetric, distributed]
  question: |
    Why is RS256 (or ES256) usually preferred over HS256 when many independent
    resource servers must verify tokens issued by one authorization server?
  options:
  - "RS256 tokens are smaller than HS256 tokens"
  - "HS256 cannot express an expiration claim"
  - "RS256 encrypts the payload while HS256 does not"
  - "With asymmetric signing, verifiers hold only the public key and cannot mint tokens, so a compromised verifier can't forge"
  answer: 3
  explanation: |
    Asymmetric signing separates signing (private key, held only by the issuer)
    from verifying (public key, freely distributable). A compromised resource
    server can verify but not forge tokens.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-011
  difficulty: intermediate
  tags: [algorithms, es256, ecdsa]
  question: |
    ES256 is based on which primitive?
  options:
  - "RSA PKCS#1 v1.5 signatures"
  - "HMAC with SHA-512"
  - "ECDSA on the P-256 curve with SHA-256"
  - "AES-GCM authenticated encryption"
  answer: 2
  explanation: |
    ES256 is ECDSA using the P-256 curve and SHA-256. It produces smaller keys
    and signatures than RS256 and is generally preferred for new asymmetric
    designs.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-012
  difficulty: beginner
  tags: [alg-none, attack, bypass]
  question: |
    In the alg:none attack, what does the attacker do to the token?
  options:
  - "Encrypts the payload so the server cannot read it"
  - "Adds a second signature segment"
  - "Replaces the payload with a longer one to overflow the parser"
  - "Sets the header alg to 'none' and removes the signature, hoping the verifier skips signature checking"
  answer: 3
  explanation: |
    RFC 7518 defines "none" as the Unsecured JWS with an empty signature. If the
    verifier trusts the token's alg, it skips signature verification and accepts
    the attacker's forged claims.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-013
  difficulty: intermediate
  tags: [alg-none, defense, allowlist]
  question: |
    Which is the correct defense against the alg:none attack?
  options:
  - "Pin an explicit algorithm allowlist at the verifier and never read the verification algorithm from the token"
  - "Blocklist the exact string 'none' in the header"
  - "Use a longer HMAC secret"
  - "Base64-encode the signature twice"
  answer: 0
  explanation: |
    The root cause is trusting the token to describe how to verify itself. The
    verifier must decide the algorithm from an allowlist. A string blocklist is
    bypassable with case variants like 'None' or 'nOnE'.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-014
  difficulty: advanced
  tags: [key-confusion, attack, rs256, hs256]
  question: |
    In the classic RS256-to-HS256 key-confusion attack, what does the attacker
    use as the HMAC secret to forge a token?
  options:
  - "A brute-forced random string"
  - "The server's RSA public key bytes, which are publicly available"
  - "The server's RSA private key, which they stole"
  - "The base64url of the header alone"
  answer: 1
  explanation: |
    The attacker crafts an HS256 token and computes its HMAC using the RSA
    public key as the secret. A verifier that reads alg from the token then runs
    HMAC with that same public key and it matches — forgery from public info.
  ref: "concepts.md#attack-hsrs-key-confusion-algorithm-confusion"

- id: jwt-and-token-security-015
  difficulty: advanced
  tags: [key-confusion, defense]
  question: |
    What single practice most directly prevents HS/RS key-confusion?
  options:
  - "Rotating the RSA keypair daily"
  - "Encrypting the token as a JWE"
  - "Binding the accepted algorithm to the key type, so an RSA public key can never be used on the HMAC verification path"
  - "Removing the kid header"
  answer: 2
  explanation: |
    Restricting alg to an allowlist that matches the key type (e.g. only RS256
    when verifying with an RSA key) prevents an HS* token from being verified
    with an asymmetric key, closing the confusion.
  ref: "concepts.md#attack-hsrs-key-confusion-algorithm-confusion"

- id: jwt-and-token-security-016
  difficulty: intermediate
  tags: [weak-secret, brute-force, hmac]
  question: |
    Why is a weak HS256 secret especially dangerous compared to, say, a weak
    login password?
  options:
  - "It disables the exp claim"
  - "It forces the server to use alg:none"
  - "It makes the payload unreadable"
  - "An attacker with one captured token can brute-force the secret entirely offline, with no rate limiting, then sign arbitrary tokens"
  answer: 3
  explanation: |
    With one valid token, an attacker recomputes HMAC over header.payload for
    candidate secrets offline (e.g. hashcat/jwt_tool). No server interaction
    means no rate limiting. A cracked secret lets them mint any token.
  ref: "concepts.md#attack-weak-hmac-secret-brute-force"

- id: jwt-and-token-security-017
  difficulty: intermediate
  tags: [weak-secret, defense, key-length, rfc-7518]
  question: |
    Per RFC 7518, an HMAC key for HS256 should be at least how long, and how
    should it be generated?
  options:
  - "At least 256 bits (32 bytes), generated by a CSPRNG — never a human passphrase"
  - "At least 8 characters, chosen to be memorable"
  - "Exactly 16 bytes, derived from the app name"
  - "At least 512 bits, derived from the user's password"
  answer: 0
  explanation: |
    RFC 7518 §3.2 requires the key be at least as long as the hash output (256
    bits for HS256). It must be high-entropy random from a CSPRNG, not a
    guessable passphrase.
  ref: "concepts.md#attack-weak-hmac-secret-brute-force"

- id: jwt-and-token-security-018
  difficulty: beginner
  tags: [claim-validation, exp]
  question: |
    A verifier checks only the signature and never checks exp. What is the
    consequence?
  options:
  - "Tokens cannot be decoded"
  - "A leaked or stolen token remains valid indefinitely"
  - "The signature will always fail"
  - "The aud claim is ignored automatically"
  answer: 1
  explanation: |
    Signature validity only proves the token was signed by a trusted key. Without
    an exp check, an old leaked token works forever. Signature and claim
    validation are two separate gates.
  ref: "concepts.md#attack-missing-claim-validation-of-exp-aud-and-iss"

- id: jwt-and-token-security-019
  difficulty: intermediate
  tags: [claim-validation, iss, aud, defense]
  question: |
    Which set of checks represents proper claim validation on every request
    (assuming the signature already verified)?
  options:
  - "Only that jti is present"
  - "Only that the payload is valid JSON"
  - "Reject if expired (exp), not-yet-valid (nbf), wrong audience (aud), or untrusted issuer (iss)"
  - "Only that the token is under 1 KB"
  answer: 2
  explanation: |
    After the signature, validate exp/nbf (time window), aud (this service is the
    intended audience), and iss (the token came from a trusted issuer). Missing
    any of these enables replay or cross-service misuse.
  ref: "concepts.md#attack-missing-claim-validation-of-exp-aud-and-iss"

- id: jwt-and-token-security-020
  difficulty: advanced
  tags: [kid, path-traversal, attack]
  question: |
    A server locates its HMAC key via keys/<kid>.pem using the token's kid
    directly. An attacker sets kid to "../../../../dev/null". Why can this forge
    a valid token?
  options:
  - "/dev/null contains the server's private key"
  - "The path traversal crashes the verifier, which then fails open"
  - "It forces the server to use RS256"
  - "/dev/null reads as empty, so the attacker signs the token with an empty key and it verifies"
  answer: 3
  explanation: |
    Pointing kid at /dev/null makes the key read as an empty string. The attacker
    simply signs their forged token with that empty key, and it validates. kid is
    untrusted input and must never be used as a filesystem path.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-021
  difficulty: advanced
  tags: [kid, sql-injection, attack]
  question: |
    A verifier runs SELECT key FROM keys WHERE id='<kid>' with the raw kid. How
    can an attacker abuse this?
  options:
  - "Inject a UNION SELECT so the query returns an attacker-chosen key, which they then use to sign the token"
  - "They cannot; kid is always numeric"
  - "Force the database to delete all keys"
  - "Make the query return the RSA private key"
  answer: 0
  explanation: |
    An unsanitized kid is an injection sink. A payload like
    ' UNION SELECT 'attacker-known-secret' -- makes the query return a key the
    attacker controls, letting them sign a forged token that verifies.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-022
  difficulty: intermediate
  tags: [kid, defense]
  question: |
    What is the correct way to handle the kid header?
  options:
  - "Interpolate it directly into the key-lookup path for flexibility"
  - "Treat it as untrusted input: exact-match it against known key IDs (allowlist / parameterized lookup) and never put it in a path, SQL, or shell string"
  - "Ignore kid and always use the first key"
  - "Trust kid only if the token also sets alg:none"
  answer: 1
  explanation: |
    kid is attacker-controlled. Use it only as an exact-match lookup key against
    a fixed map or parameterized query, and never interpolate it into
    filesystem, SQL, LDAP, or shell contexts.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-023
  difficulty: advanced
  tags: [jku, ssrf, key-injection, attack]
  question: |
    A verifier fetches the JWK Set from whatever URL the token's jku header
    specifies. Beyond SSRF, what is the most severe consequence?
  options:
  - "The token expires faster"
  - "The payload becomes encrypted"
  - "An attacker hosts their own keypair, points jku at it, signs with their private key, and the server verifies the attacker's signature — full auth bypass"
  - "The signature segment is dropped"
  answer: 2
  explanation: |
    Trusting jku lets the attacker supply their own JWKS. The server downloads the
    attacker's public key and validates the attacker's signature, forging any
    identity. jku is also an SSRF primitive (e.g. cloud metadata).
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-024
  difficulty: advanced
  tags: [jku, x5u, ssrf, defense]
  question: |
    Which is the safest handling of jku/x5u headers?
  options:
  - "Follow any URL but only over HTTPS"
  - "Allow only URLs shorter than 100 characters"
  - "Cache whatever URL was seen first"
  - "Do not fetch keys from a token-supplied URL at all; configure the JWKS URI out-of-band from trusted issuer metadata/config"
  answer: 3
  explanation: |
    Keys should come from a JWKS URI you configure out-of-band, never from the
    token header. If jku must be honored, strictly allowlist the host to the
    known issuer and forbid redirects — but not fetching from it is safest.
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-025
  difficulty: advanced
  tags: [jku, ssrf, cloud-metadata]
  question: |
    An attacker sets jku to http://169.254.169.254/latest/meta-data/. What class
    of attack is this primarily exploiting?
  options:
  - "Server-Side Request Forgery (SSRF) — the server makes an outbound request to a token-controlled internal URL"
  - "Cross-site scripting"
  - "SQL injection"
  - "Clickjacking"
  answer: 0
  explanation: |
    Because the verifier fetches from the token-controlled URL, jku/x5u become an
    SSRF primitive. 169.254.169.254 is the cloud instance metadata endpoint, a
    common SSRF target for credential theft.
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-026
  difficulty: intermediate
  tags: [jwks, jwk, rfc-7517]
  question: |
    What is a JWKS?
  options:
  - "A JWT Key Store binary format"
  - "A JSON Web Key Set — a JSON document ({\"keys\":[...]}) of public keys, each identified by a kid"
  - "A symmetric key wrapped in a cookie"
  - "A signature algorithm negotiation protocol"
  answer: 1
  explanation: |
    A JWK (RFC 7517) is a JSON key representation; a JWK Set is {"keys":[...]}.
    Asymmetric issuers publish their public keys as a JWKS, and tokens reference a
    key by kid.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-027
  difficulty: intermediate
  tags: [jwks, key-rotation, oidc]
  question: |
    How does publishing a JWKS enable key rotation without downtime?
  options:
  - "It forces all clients to re-login immediately"
  - "It encrypts all outstanding tokens with the new key"
  - "The issuer adds the new public key (new kid) to the set and signs new tokens with it, while old tokens still verify against the still-present old key until they expire"
  - "It shortens exp on every existing token retroactively"
  answer: 2
  explanation: |
    During rotation the JWKS temporarily contains both old and new keys.
    Verifiers select by kid, so old tokens keep verifying until they expire; the
    old key is removed afterward.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-028
  difficulty: intermediate
  tags: [jwks, kid, caching, dos]
  question: |
    When a verifier caches a JWKS and encounters an unknown kid, what is a safe
    behavior?
  options:
  - "Accept the token without verifying, since the kid is new"
  - "Downgrade to alg:none"
  - "Use the RSA public key as an HMAC secret"
  - "Refetch the JWKS (rate-limited to avoid a token-driven fetch storm); if the kid is still unknown, fail closed"
  answer: 3
  explanation: |
    Refetch to pick up rotated keys, but rate-limit the refetch so attacker
    tokens with random kids can't DoS the JWKS endpoint. If the kid is truly
    unknown, reject the token.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-029
  difficulty: intermediate
  tags: [revocation, statelessness, tradeoff]
  question: |
    Why can't a self-contained signed JWT be revoked instantly the way a
    server-side session can?
  options:
  - "Because verification is stateless — the verifier does no lookup, so there is no server-side flag to flip; the token is valid until it expires"
  - "Because the signature changes every second"
  - "Because JWTs cannot carry an exp claim"
  - "Because the payload is encrypted"
  answer: 0
  explanation: |
    The statelessness that makes JWTs fast also means no per-request lookup, so
    you can't un-issue a token mid-life. It stays valid until exp unless you
    reintroduce state.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-030
  difficulty: intermediate
  tags: [revocation, short-ttl, refresh]
  question: |
    What is the primary, most-recommended strategy for limiting the damage of a
    stolen access token given JWT's revocation problem?
  options:
  - "Make access tokens last a year so users rarely re-auth"
  - "Use short-lived access tokens plus a longer-lived, revocable refresh token"
  - "Store the entire session in the token payload"
  - "Sign tokens with alg:none for speed"
  answer: 1
  explanation: |
    Short TTL bounds how long a stolen access token is useful. A refresh token is
    exchanged for new access tokens and, being a stateful operation, can be
    revoked when needed.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-031
  difficulty: advanced
  tags: [revocation, denylist, jti]
  question: |
    A team needs immediate revocation of specific tokens. They add a server-side
    denylist keyed by jti, checked on each request. What is the correct trade-off
    statement?
  options:
  - "It keeps the system fully stateless with zero cost"
  - "It makes tokens un-decodable to clients"
  - "It reintroduces a per-request lookup (state), trading some statelessness for instant revocation; entries can be dropped once the token's exp passes"
  - "It only works with HS256"
  answer: 2
  explanation: |
    A jti denylist gives immediate revocation but adds server-side state and a
    per-request check. Entries only need to live until each token's exp, keeping
    the list bounded.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-032
  difficulty: advanced
  tags: [revocation, token-version]
  question: |
    A per-user token_version (or min_iat) stored server-side and bumped on
    logout/password-change achieves what?
  options:
  - "It encrypts the token payload"
  - "It removes the need for any signature"
  - "It lengthens the token TTL automatically"
  - "It revokes all of that user's outstanding tokens at once with a single small lookup"
  answer: 3
  explanation: |
    Bumping a per-user version or min_iat invalidates every token issued before
    the bump, so all of a user's tokens are revoked together — with just one
    record and lookup per user.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-033
  difficulty: advanced
  tags: [refresh-token, rotation, reuse-detection]
  question: |
    With refresh-token rotation and reuse detection, what happens when an
    already-used (rotated-out) refresh token is presented again?
  options:
  - "It is treated as a theft signal, so the server revokes the entire token family and forces re-authentication"
  - "It is silently accepted and a new access token is issued"
  - "It extends the family's lifetime"
  - "It is converted into an access token"
  answer: 0
  explanation: |
    Rotation issues a new refresh token each exchange and invalidates the old
    one. Replay of an old refresh token indicates theft, so the whole family is
    revoked — bounding the damage of a stolen refresh token.
  ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

- id: jwt-and-token-security-034
  difficulty: intermediate
  tags: [refresh-token, rotation, storage]
  question: |
    Which practice is recommended for refresh tokens?
  options:
  - "Store them in plaintext and never expire them"
  - "Make them one-time-use (rotated on each exchange), store them hashed at rest, bind them to the client, and give them an absolute maximum lifetime"
  - "Embed the user's password in them"
  - "Sign them with alg:none to save CPU"
  answer: 1
  explanation: |
    Because refresh tokens are long-lived and high-value, rotate them on use,
    store them hashed, bind them to the client, and cap their absolute lifetime.
  ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

- id: jwt-and-token-security-035
  difficulty: intermediate
  tags: [bearer, sender-constrained, theft]
  question: |
    Why is an ordinary JWT access token called a "bearer" token, and why is that
    a risk?
  options:
  - "Because it must be carried in a cookie; cookies are always insecure"
  - "Because it can only be used once"
  - "Because whoever holds it can use it — so if it leaks (logs, XSS, a proxy), the thief has full access without any additional proof"
  - "Because it bears the user's password"
  answer: 2
  explanation: |
    A bearer token grants access to anyone presenting it, with no proof of
    possession. Leakage equals compromise. Sender-constrained tokens (mTLS, DPoP)
    address this by binding the token to a client-held key.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-036
  difficulty: advanced
  tags: [dpop, sender-constrained, rfc-9449]
  question: |
    How does DPoP (RFC 9449) make a stolen access token less useful?
  options:
  - "It encrypts the token so it can't be read"
  - "It shortens the token to under 100 bytes"
  - "It stores the token only in localStorage"
  - "The client sends a fresh signed proof JWT on each request, and the access token carries a thumbprint (cnf.jkt) of the client's public key; without the private key a thief can't produce a valid proof"
  answer: 3
  explanation: |
    DPoP binds the access token to a client keypair via a cnf.jkt thumbprint. Each
    request carries a DPoP proof signed by the private key and bound to
    method/URI, so a stolen token alone is unusable.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-037
  difficulty: advanced
  tags: [mtls, sender-constrained, rfc-8705]
  question: |
    Certificate-bound access tokens (RFC 8705) bind a token to what?
  options:
  - "The client's TLS client certificate (via an x5t#S256 thumbprint in the token's cnf claim)"
  - "The user's password hash"
  - "The server's IP address"
  - "The token's jti value"
  answer: 0
  explanation: |
    mTLS-bound tokens embed a thumbprint (cnf.x5t#S256) of the client's TLS
    certificate. The resource server checks the connection used the matching
    cert, so a token presented over a different connection is rejected.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-038
  difficulty: intermediate
  tags: [storage, localstorage, xss]
  question: |
    What is the main risk of storing a JWT in browser localStorage?
  options:
  - "It is automatically sent with every request, enabling CSRF"
  - "Any XSS on the page can read and exfiltrate the token because JavaScript can access localStorage"
  - "It cannot be read by the same-origin script"
  - "It disables the token's signature"
  answer: 1
  explanation: |
    localStorage is readable by JavaScript, so an XSS payload can steal the token.
    Its risk profile is theft-via-script (not CSRF, since it isn't sent
    automatically).
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-039
  difficulty: intermediate
  tags: [storage, cookie, httponly, csrf]
  question: |
    A JWT is stored in an HttpOnly; Secure; SameSite cookie. Which statement is
    correct?
  options:
  - "It is exposed to XSS theft but immune to CSRF"
  - "It cannot be transmitted over HTTPS"
  - "It is protected from XSS theft (JS can't read it) but, because cookies are sent automatically, needs CSRF defenses like SameSite/anti-CSRF tokens"
  - "It no longer needs a signature"
  answer: 2
  explanation: |
    HttpOnly keeps the token out of JavaScript's reach (mitigating XSS theft), but
    automatic cookie sending means CSRF must be addressed via SameSite and/or
    anti-CSRF tokens. Secure enforces HTTPS-only transmission.
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-040
  difficulty: beginner
  tags: [storage, transport, url]
  question: |
    Why should JWTs not be placed in URLs or query strings?
  options:
  - "URLs cannot hold base64url characters"
  - "It makes the token expire immediately"
  - "Query strings strip the signature"
  - "They leak into server logs, browser history, and the Referer header"
  answer: 3
  explanation: |
    Tokens in URLs are recorded in access logs, browser history, and Referer
    headers, and shared when links are copied — all avenues for leakage. Use the
    Authorization header or a secure cookie instead.
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-041
  difficulty: beginner
  tags: [confidentiality, payload, sensitive-data]
  question: |
    Which data is safe to include in a standard (signed, unencrypted) JWT
    payload?
  options:
  - "A non-sensitive user id and roles the resource server needs, but nothing secret"
  - "The user's plaintext password"
  - "The HMAC signing secret"
  - "The user's full credit card number"
  answer: 0
  explanation: |
    A JWS payload is readable by anyone with the token, so include only the
    minimum non-sensitive claims the verifier needs. Keep secrets and sensitive
    PII server-side, keyed by sub/jti.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-042
  difficulty: intermediate
  tags: [header, claims, structure]
  question: |
    Which fields legitimately live in the JWT header rather than the payload?
  options:
  - "sub, aud, and exp"
  - "alg, typ, and (optionally) kid"
  - "iss, iat, and jti"
  - "roles and tenant_id"
  answer: 1
  explanation: |
    The header describes the token: alg (algorithm), typ/cty (media type), and an
    optional kid (key id). Claims like sub, aud, exp, iss, iat, jti belong in the
    payload.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-043
  difficulty: advanced
  tags: [nested-jwt, jws, jwe, confidentiality]
  question: |
    A team needs both authenticity and confidentiality of claims in a token.
    Which approach fits?
  options:
  - "Use a plain HS256 JWS with a long secret"
  - "Base64-encode the payload twice"
  - "Use a nested JWT: sign the claims as a JWS, then encrypt that as a JWE (sign-then-encrypt)"
  - "Add alg:none and a strong kid"
  answer: 2
  explanation: |
    A JWS alone gives integrity/authenticity but a readable payload. To also hide
    the claims, nest it: sign then encrypt (JWS inside a JWE), yielding both
    properties.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-044
  difficulty: advanced
  tags: [alg-none, case-bypass, defense]
  question: |
    A filter rejects tokens whose header alg equals the exact string "none", but
    the app is still exploited. What is the most likely explanation and correct
    fix?
  options:
  - "The token used ES256; switch to RS256"
  - "The secret was too long; shorten it"
  - "The kid header was missing; require it"
  - "The attacker used a case variant like 'None' or 'nOnE' to slip past the string check — the correct fix is an algorithm allowlist, not a blocklist"
  answer: 3
  explanation: |
    String blocklists of "none" are bypassable with alternate casing. The robust
    fix is an allowlist of accepted algorithms at the verifier, which rejects any
    unlisted alg regardless of casing.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-045
  difficulty: beginner
  tags: [claims, iss, issuer]
  question: |
    What does the iss claim identify?
  options:
  - "The party that issued (minted) the token"
  - "The principal (user) the token is about"
  - "The intended recipient service"
  - "The token's unique identifier"
  answer: 0
  explanation: |
    iss (Issuer) names the party that created and signed the token. Verifiers
    should pin the expected issuer so a token from a different (even trusted)
    issuer isn't accepted where it shouldn't be.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-046
  difficulty: intermediate
  tags: [nbf, clock-skew, validation]
  question: |
    A distributed system intermittently rejects freshly issued tokens with a
    "token not yet valid" error. What is the most likely cause and mitigation?
  options:
  - "The exp claim is missing; add it"
  - "Clock skew between issuer and verifier makes nbf/iat appear in the future — allow a small leeway (e.g. 60s) and sync clocks with NTP"
  - "The signature algorithm is too slow; switch to alg:none"
  - "The kid is wrong; remove it"
  answer: 1
  explanation: |
    nbf marks when a token becomes valid. If the verifier's clock lags the
    issuer's, a just-minted token can look not-yet-valid. Allow a small clock-skew
    leeway and synchronize clocks.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-047
  difficulty: advanced
  tags: [jwk-injection, header, attack]
  question: |
    A token arrives with header {"alg":"RS256","typ":"JWT","jwk":{"kty":"RSA",
    "n":"...","e":"AQAB"}} and the verifier accepts it. Why is this a total
    forgery, and what is the fix?
  options:
  - "The jwk header only affects encryption, so it is harmless here"
  - "The verifier trusts the public key embedded in the token itself, so an attacker self-signs with their own keypair; resolve keys only from trusted server-side config/JWKS by kid, never from the token"
  - "The token is fine as long as e is AQAB (65537)"
  - "The risk is only an SSRF because the server fetches the key"
  answer: 1
  explanation: |
    RFC 7515 §4.1.3's jwk header carries an inline public key. A verifier that
    trusts it will validate any signature the attacker makes with their matching
    private key. Unlike jku, no fetch/SSRF is involved — it is self-referential
    trust. Fix: resolve verification keys only from trusted config, never from the
    token header.
  ref: "concepts.md#attack-embedded-key-header-injection-jwk-and-x5c"

- id: jwt-and-token-security-048
  difficulty: advanced
  tags: [x5c, jwk, jku, header, distinction]
  question: |
    Which statement best distinguishes the jwk/x5c headers from the jku/x5u
    headers as attack surfaces?
  options:
  - "jwk/x5c embed the key material directly in the token, while jku/x5u point at a URL the verifier fetches; both share the root cause of trusting token-supplied keys"
  - "jwk/x5c are for encryption only; jku/x5u are for signing only"
  - "jku/x5u are safe because they use HTTPS, whereas jwk/x5c are always malicious"
  - "Only jku can be exploited; jwk and x5c are ignored by all libraries"
  answer: 0
  explanation: |
    jwk (inline JWK) and x5c (inline X.509 chain) put the key in the header; jku
    (JWK Set URL) and x5u (X.509 URL) reference a fetchable URL (also an SSRF
    primitive). All four are the same flaw: the token dictating its own
    verification key. The universal fix is to resolve keys from trusted config.
  ref: "concepts.md#attack-embedded-key-header-injection-jwk-and-x5c"

- id: jwt-and-token-security-049
  difficulty: expert
  tags: [x5c, x509, cert-chain, defense]
  question: |
    A design genuinely requires the x5c (X.509 certificate chain) header. Which
    handling is correct?
  options:
  - "Trust the embedded leaf certificate as long as it parses without error"
  - "Accept any self-signed chain, since the signature over the token still verifies against the leaf"
  - "Validate the full chain to a pinned trust anchor and confirm the leaf's subject/thumbprint matches the expected issuer; never accept a self-signed embedded chain"
  - "Skip chain validation but require the alg to be ES256"
  answer: 2
  explanation: |
    An attacker can embed a self-signed chain in x5c; verifying the token's
    signature against that leaf always succeeds. Safe handling validates the chain
    to a pinned CA and checks the leaf identity. Complex ASN.1/X.509 parsing has
    also caused forgery CVEs (e.g. CVE-2017-2800, CVE-2018-2633).
  ref: "concepts.md#attack-embedded-key-header-injection-jwk-and-x5c"

- id: jwt-and-token-security-050
  difficulty: expert
  tags: [crit, header, rfc-7515, validation]
  question: |
    Per RFC 7515 §4.1.11, what must a verifier do when a JWS carries a crit
    header listing an extension parameter the verifier does not understand?
  options:
  - "Ignore the crit header and process the token normally"
  - "Reject the token — crit lists parameters the recipient MUST understand and process, so an unrecognized one requires failure"
  - "Strip the unknown parameter and continue"
  - "Downgrade the token to alg:none and re-verify"
  answer: 1
  explanation: |
    crit enumerates critical header extensions the recipient is required to
    understand. If any listed extension is not implemented, the spec mandates
    rejecting the token. Libraries that silently ignore crit violate RFC 7515 and
    can be tricked into skipping directives.
  ref: "concepts.md#header-abuse-cty-crit-and-content-type-confusion"

- id: jwt-and-token-security-051
  difficulty: expert
  tags: [cty, content-type, chained-injection, attack]
  question: |
    After an attacker has already achieved a signature bypass, how can the cty
    (content type) header escalate the impact?
  options:
  - "It forces the token to expire, denying service"
  - "It re-encrypts the payload so defenders cannot inspect it"
  - "It changes the signing algorithm to none automatically"
  - "Setting cty to e.g. application/x-java-serialized-object or text/xml can steer a consumer that dispatches on cty into insecure deserialization or XXE on the attacker-controlled payload"
  answer: 3
  explanation: |
    cty declares the payload's content type. A consumer that hands the payload to
    a content-type-driven parser/deserializer can be pivoted into XXE or insecure
    deserialization once the signature no longer protects the content — turning the
    JWT into a second-stage injection vector.
  ref: "concepts.md#header-abuse-cty-crit-and-content-type-confusion"

- id: jwt-and-token-security-052
  difficulty: expert
  tags: [key-confusion, sig2n, rsa, attack]
  question: |
    A service verifies RS256 with a hardcoded RSA public key that is NOT published
    anywhere. A candidate claims algorithm-confusion forgery is therefore
    impossible. Why are they wrong?
  options:
  - "The private key is always recoverable from a single token"
  - "Given two tokens signed by the same key, tools like sig2n/rsa_sign2n recover candidate RSA moduli n from the signatures; the attacker then tries each as an HMAC secret for a forged HS256 token"
  - "RS256 tokens leak the private key in the kid header"
  - "The server will always fall back to alg:none when the key is hidden"
  answer: 1
  explanation: |
    Two signatures over known data let sig2n (docker run portswigger/sig2n)
    derive candidate n values. Each candidate is tried as the HMAC key for an
    HS256 forgery. Secrecy of a public key is not a control — the fix is binding
    the algorithm to the key type so an RSA key can never be an HMAC secret.
  ref: "concepts.md#algorithm-confusion-when-the-public-key-is-not-published"

- id: jwt-and-token-security-053
  difficulty: expert
  tags: [key-confusion, byte-exactness, pem, attack]
  question: |
    In an HS/RS confusion forgery, the recovered public key is correct but the
    forged token still fails to verify. What byte-level detail most likely
    explains this?
  options:
  - "The HMAC secret must byte-for-byte match the server's exact key serialization — including PEM header/footer, trailing newline, and X.509 (SPKI) vs PKCS#1 encoding"
  - "The token's exp must be omitted for HMAC to work"
  - "The kid header must be removed before signing"
  - "HS256 forgeries only work on weekends due to clock skew"
  answer: 0
  explanation: |
    The server keys HMAC on the exact bytes of its stored public key. If the
    attacker's secret differs by a trailing newline or uses PKCS#1 where the server
    uses X.509/SPKI, the HMAC won't match. Tools emit both encodings precisely
    because the attacker doesn't know which the server holds.
  ref: "concepts.md#algorithm-confusion-when-the-public-key-is-not-published"

- id: jwt-and-token-security-054
  difficulty: advanced
  tags: [sidejacking, fingerprint, defense, owasp]
  question: |
    OWASP's user-context fingerprint defense against token sidejacking stores what
    where?
  options:
  - "The raw random fingerprint in the JWT payload and its hash in a cookie"
  - "The raw random fingerprint in a hardened __Secure-Fgp; HttpOnly; Secure; SameSite=Strict cookie, and only its SHA-256 hash as a claim in the JWT"
  - "The user's password hash in both the cookie and the token"
  - "A copy of the access token in localStorage for redundancy"
  answer: 1
  explanation: |
    The raw high-entropy value goes in a hardened cookie; the token stores only the
    SHA-256 hash. The verifier re-hashes the cookie and compares. A stolen token
    alone is useless without the cookie, and storing the hash means an XSS reading
    the token cannot reconstruct the cookie value.
  ref: "concepts.md#token-sidejacking-and-the-user-context-fingerprint-defense"

- id: jwt-and-token-security-055
  difficulty: expert
  tags: [sidejacking, fingerprint, hash, reasoning]
  question: |
    Why does the fingerprint defense store the SHA-256 HASH of the fingerprint in
    the token rather than the raw value?
  options:
  - "Hashing compresses the token to save bandwidth"
  - "So the token verifies faster"
  - "If the token itself is stolen (e.g. via XSS reading it), the attacker still cannot derive the raw cookie value needed to pass the check; the HttpOnly cookie is also unreadable to JS"
  - "Because NumericDate requires hashed values"
  answer: 2
  explanation: |
    Storing only the hash means possession of the token does not reveal the raw
    fingerprint. Combined with the HttpOnly cookie (unreadable by JS), an attacker
    must steal BOTH the token and the raw cookie to replay — defeating pure
    token-theft via XSS.
  ref: "concepts.md#token-sidejacking-and-the-user-context-fingerprint-defense"

- id: jwt-and-token-security-056
  difficulty: expert
  tags: [rfc-8725, bcp, algorithm-verification]
  question: |
    RFC 8725 §3.1 "Perform Algorithm Verification" prescribes which behavior?
  options:
  - "Read the alg from the token header and trust it, since the issuer set it"
  - "Determine the acceptable algorithm(s) from an out-of-band allowlist and reject any token whose alg is not in it — do not let the token choose"
  - "Accept any algorithm as long as the signature verifies"
  - "Prefer alg:none for internal services to reduce CPU"
  answer: 1
  explanation: |
    BCP §3.1 requires the verifier to decide acceptable algorithms independently of
    the token and reject mismatches. This is the standards-level statement of the
    "pin the algorithm" defense against alg:none and key-confusion attacks.
  ref: "concepts.md#rfc-8725-jwt-best-current-practices"

- id: jwt-and-token-security-057
  difficulty: expert
  tags: [rfc-8725, cross-jwt, substitution, threats]
  question: |
    Which RFC 8725 threat describes one kind of JWT being accepted where a
    different kind was intended (e.g. an ID token used as an access token)?
  options:
  - "§2.8 Cross-JWT Confusion"
  - "§2.3 Incorrect Composition of Encryption and Signature"
  - "§2.6 Weak Symmetric Keys"
  - "§2.1 Weak Signatures and Insufficient Signature Validation"
  answer: 0
  explanation: |
    RFC 8725 §2.8 is Cross-JWT Confusion. The mitigations are explicit typing
    (§3.11) and mutually exclusive validation rules (§3.12), realized concretely by
    RFC 9068's typ: at+jwt requirement for access tokens.
  ref: "concepts.md#rfc-8725-jwt-best-current-practices"

- id: jwt-and-token-security-058
  difficulty: expert
  tags: [cross-jwt, at-jwt, rfc-9068, explicit-typing]
  question: |
    A resource server is found to accept OIDC ID tokens as access tokens. Which
    standards-based fix directly addresses this?
  options:
  - "Shorten the ID token's exp so it can't be reused"
  - "Enforce RFC 9068 explicit typing: require the header typ: at+jwt and a resource-specific aud, rejecting tokens that are not access tokens"
  - "Encrypt all ID tokens as JWEs"
  - "Move the access token from the Authorization header to a cookie"
  answer: 1
  explanation: |
    RFC 9068 profiles OAuth 2.0 access tokens with typ: at+jwt and per-resource
    aud, and the verifier must check typ. This implements BCP §3.11/§3.12 so an ID
    token (different typ/aud) is rejected by the access-token verifier. RFC 9068
    also prohibits none and mandates RS256 as MTI.
  ref: "concepts.md#cross-jwt-confusion-and-explicit-typing-atjwt"

- id: jwt-and-token-security-059
  difficulty: advanced
  tags: [clock-skew, leeway, exp, nbf]
  question: |
    Choosing the leeway for exp/nbf validation is a trade-off. Which statement
    correctly captures both sides?
  options:
  - "More leeway is always safer because it never rejects valid tokens"
  - "Leeway has no security impact; set it as high as convenient"
  - "Too little leeway intermittently rejects valid tokens across desynced clocks; too much leeway keeps expired tokens acceptable longer, widening the replay window"
  - "Leeway only matters for HS256, not asymmetric algorithms"
  answer: 2
  explanation: |
    exp/nbf compare against the verifier's clock, so skew matters. A small leeway
    (commonly <=60s) plus NTP balances rejecting legitimate tokens against
    extending the window in which an expired token is still honored.
  ref: "concepts.md#clock-skew-and-leeway-for-exp-nbf-and-iat"

- id: jwt-and-token-security-060
  difficulty: expert
  tags: [cve-2022-21449, ecdsa, psychic-signatures]
  question: |
    On Java 17.0.2, an ES256 JWT with an all-zero signature verifies against any
    key. Name the vulnerability and its root cause.
  options:
  - "Heartbleed — a buffer over-read in TLS"
  - "CVE-2022-21449 'Psychic Signatures' — the JVM failed to check that ECDSA r and s satisfy 1 <= r,s < n (and reject the point at infinity), so (r=0,s=0) validated for any key"
  - "CVE-2021-44228 'Log4Shell' — JNDI lookup in log messages"
  - "POODLE — SSLv3 padding oracle"
  answer: 1
  explanation: |
    CVE-2022-21449 affected Java 15–18 before the April 2022 CPU. ECDSA requires
    1 <= r,s < n; skipping that check let an all-zero (r,s) verify against any
    public key/message, forging any ES256/384/512 JWT (raw P1363 format). Fixed in
    15.0.7/16.0.3/17.0.3/18.0.1.
  ref: "concepts.md#ecdsa-pitfalls-psychic-signatures-and-malleable-signatures"

- id: jwt-and-token-security-061
  difficulty: expert
  tags: [ecdsa, malleability, denylist, jti]
  question: |
    Your logout adds SHA-256(rawToken) to a Redis denylist. A revoked ES256 token
    keeps working. What is happening and how do you fix the denylist?
  options:
  - "ECDSA signatures are malleable: (r, -s mod n) is also valid, so the attacker produces a byte-different token with a different SHA-256 that isn't on the denylist. Key the denylist on the signed (jti, iss) pair instead"
  - "The token's exp is refreshed automatically; shorten the TTL"
  - "Redis silently dropped the entry; use a SQL database"
  - "The signature is cached; disable verification caching"
  answer: 0
  explanation: |
    Both (r,s) and (r,-s mod n) verify but serialize to different bytes, so a raw
    token hash denylist is bypassable (non-strict base64url parsing causes the same
    issue). Key revocation on stable signed fields — (jti, iss); the pair because
    jti uniqueness is only per-issuer.
  ref: "concepts.md#ecdsa-pitfalls-psychic-signatures-and-malleable-signatures"

- id: jwt-and-token-security-062
  difficulty: expert
  tags: [denylist, jti, iss, keying]
  question: |
    Why key a revocation denylist on the pair (jti, iss) rather than jti alone?
  options:
  - "jti is encrypted, so iss is needed to decrypt it"
  - "jti uniqueness is only guaranteed per issuer, so two different issuers could mint colliding jti values; the (jti, iss) pair disambiguates"
  - "iss is required to compute the signature"
  - "A single jti cannot fit in a Redis key"
  answer: 1
  explanation: |
    RFC 7519 only guarantees jti uniqueness within a given issuer. Two issuers
    could reuse the same jti string, so a denylist keyed on jti alone could revoke
    the wrong token or miss one. Both fields are inside the signed payload, so the
    pair is tamper-evident.
  ref: "concepts.md#ecdsa-pitfalls-psychic-signatures-and-malleable-signatures"

- id: jwt-and-token-security-063
  difficulty: expert
  tags: [dos, jwe, decompression-bomb, cve-2024-33664]
  question: |
    A ~200-byte JWE causes a python-jose verifier to allocate gigabytes of memory.
    What is the mechanism and the fix?
  options:
  - "A huge exp value; clamp exp to a sane range"
  - "A JWE zip:\"DEF\" decompression bomb (CVE-2024-33664): tiny ciphertext inflates to enormous plaintext on decryption; cap decompression output size (RFC 8725 §3.6 avoid compressing encryption inputs)"
  - "An oversized kid; limit kid length"
  - "A base64url padding attack; require strict padding"
  answer: 1
  explanation: |
    JWE's zip:"DEF" DEFLATE-compresses plaintext before encryption. A malicious
    highly-compressible payload expands massively on decompression, exhausting
    memory. Defense: disable zip where unneeded and hard-cap decompression output.
    RFC 8725 §3.6 advises against compressing encryption inputs.
  ref: "concepts.md#jwt-denial-of-service-decompression-bombs-and-resource-exhaustion"

- id: jwt-and-token-security-064
  difficulty: advanced
  tags: [dos, resource-exhaustion, key-size, nesting]
  question: |
    Besides decompression bombs, which set of limits best mitigates JWT/JOSE
    resource-exhaustion DoS?
  options:
  - "Only enforcing HTTPS on the JWKS endpoint"
  - "Bounding accepted key sizes, limiting JWE nesting depth, and capping token and JWKS response sizes before performing crypto"
  - "Increasing the leeway on exp so tokens don't need re-verification"
  - "Switching all tokens to alg:none to skip signature CPU cost"
  answer: 1
  explanation: |
    Huge RSA moduli make verification arbitrarily costly, deeply nested JWEs
    multiply parse cost, and oversized JWKS responses exhaust memory. Enforce
    parse-time size/depth/key limits before doing crypto work.
  ref: "concepts.md#jwt-denial-of-service-decompression-bombs-and-resource-exhaustion"

- id: jwt-and-token-security-065
  difficulty: advanced
  tags: [algorithm-selection, rs256, eddsa, owasp]
  question: |
    For a NEW asymmetric JWT design, which signing algorithm choice best reflects
    current OWASP guidance?
  options:
  - "RS256 (RSASSA-PKCS1-v1_5), which OWASP recommends as the default"
  - "alg:none for internal services"
  - "EdDSA (Ed25519), ES256, or PS256 — OWASP now marks RS256 (PKCS1-v1_5) as not recommended for new designs"
  - "HS256 shared across all services for simplicity"
  answer: 2
  explanation: |
    OWASP now flags RS256 (RSASSA-PKCS1-v1_5) as not recommended and points to
    EdDSA (Ed25519), ES256, or PS256 (RSA-PSS). RFC 9068 still lists RS256 as
    mandatory-to-implement for interop, but stronger algorithms are preferred.
  ref: "concepts.md#algorithm-selection-and-jwe-hardening"

- id: jwt-and-token-security-066
  difficulty: expert
  tags: [jwe, nested-jwt, sign-then-encrypt, ordering]
  question: |
    For a nested JWT that must be both authentic and confidential, why is
    sign-then-encrypt (rather than encrypt-then-sign) the correct ordering?
  options:
  - "Encrypt-then-sign is faster, so it is always chosen"
  - "Sign-then-encrypt hides both header and payload; with encrypt-then-sign an attacker can strip or replace the outer signature since it is over ciphertext they can reproduce, and the signer identity is exposed"
  - "Both orderings are cryptographically identical"
  - "Encrypt-then-sign is required by RFC 7519 for all JWTs"
  answer: 1
  explanation: |
    RFC 8725 §2.3 warns about incorrect composition. Signing first then encrypting
    binds the signature under confidentiality; encrypt-then-sign leaves an outer
    signature over ciphertext that an attacker can strip/replace and also exposes
    who signed. Sign-then-encrypt is the recommended nested-JWT ordering.
  ref: "concepts.md#algorithm-selection-and-jwe-hardening"

- id: jwt-and-token-security-067
  difficulty: expert
  tags: [jwe, aead, padding-oracle, invalid-curve]
  question: |
    Which JWE choice most directly defends against padding-oracle attacks on the
    ciphertext?
  options:
  - "Use an AEAD content-encryption algorithm (e.g. A256GCM, or AES-CBC-HMAC with its integrated MAC) rather than a non-authenticated mode"
  - "Compress the plaintext with zip:\"DEF\" before encrypting"
  - "Use RSA-1_5 key wrapping for compatibility"
  - "Disable the authentication tag to reduce token size"
  answer: 0
  explanation: |
    Padding-oracle attacks target non-authenticated encryption. AEAD modes
    (A256GCM, or AES-CBC-HMAC which authenticates the ciphertext) reject tampered
    ciphertext before decryption is observable. Also validate ECDH points on-curve
    to avoid invalid-curve key recovery.
  ref: "concepts.md#algorithm-selection-and-jwe-hardening"

- id: jwt-and-token-security-068
  difficulty: advanced
  tags: [hmac, key-size, entropy, rfc-2104]
  question: |
    Which HMAC secret most precisely meets current best practice for HS512?
  options:
  - "A memorable passphrase of at least 12 characters"
  - "A 16-byte value derived from the application name"
  - "A CSPRNG-generated random secret at least as long as the hash output (512 bits for HS512) with sufficient entropy, never a password"
  - "The RSA public key, reused as the HMAC secret"
  answer: 2
  explanation: |
    The secret must be at least the hash output size (512 bits for HS512), CSPRNG
    generated with real entropy, and never a human password (RFC 2104 §3, RFC 7518
    §3.2). Reusing a public key as a secret is the key-confusion antipattern.
  ref: "concepts.md#algorithm-selection-and-jwe-hardening"

- id: jwt-and-token-security-069
  difficulty: advanced
  tags: [when-not-jwt, opaque-session, revocation, architecture]
  question: |
    A single monolithic app creates and consumes its own sessions and needs
    instant logout. Which choice is the better architectural fit and why?
  options:
  - "A stateless JWT, because JWTs are always the modern default"
  - "An opaque random session id in a HttpOnly; Secure; SameSite cookie backed by server-side state — it revokes instantly, stays small on the wire, and avoids stateless-verification crypto that JWTs don't need here"
  - "A JWT with alg:none to avoid key management"
  - "A JWT with a one-year exp to reduce re-auth friction"
  answer: 1
  explanation: |
    JWTs pay off for stateless cross-service verification. With one trust boundary
    and an instant-revocation requirement, an opaque server session is simpler and
    revokes immediately (delete it server-side), whereas a JWT needs a bolt-on
    denylist that reintroduces state.
  ref: "concepts.md#when-not-to-use-a-jwt"

- id: jwt-and-token-security-070
  difficulty: expert
  tags: [revocation, status-list, relying-parties, modern]
  question: |
    You must provide near-instant revocation across a large fleet of independent
    relying parties without each maintaining its own denylist. Which modern
    approach fits best?
  options:
  - "Give every token a 10-year exp and rely on TLS"
  - "Have each relying party call the issuer's introspection endpoint on every single request synchronously, accepting the added latency and coupling"
  - "An issuer-published Token Status List (IETF draft-ietf-oauth-status-list): a compact, cacheable bitmap the issuer maintains and relying parties consult to check whether a token's index is revoked"
  - "Embed the full revoked-token set inside every new access token"
  answer: 2
  explanation: |
    The IETF Token Status List draft (used in SD-JWT VCs) lets the issuer publish a
    compact, cacheable status bitmap indexed per token, so many relying parties get
    near-real-time revocation without each running a denylist or introspecting
    every request. Per-request synchronous introspection works but couples every
    RP to the issuer with per-call latency.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-071
  difficulty: intermediate
  tags: [iat, freshness, max-age]
  question: |
    Beyond ordering events, what security use does the iat (issued-at) claim
    enable?
  options:
  - "It encrypts the payload after issuance"
  - "It replaces the signature for internal services"
  - "It enforces a maximum token age (freshness) — e.g. requiring a recently issued token for sensitive operations — and anchors a per-user min_iat revocation check"
  - "It guarantees the token cannot be replayed"
  answer: 2
  explanation: |
    iat records when the token was minted. Verifiers can require step-up freshness
    (reject tokens older than N minutes for sensitive actions) and compare iat
    against a per-user min_iat to revoke all tokens issued before a logout/password
    change. It does not by itself prevent replay.
  ref: "concepts.md#clock-skew-and-leeway-for-exp-nbf-and-iat"

- id: jwt-and-token-security-072
  difficulty: expert
  tags: [alg-none, rfc-7515, allowlist, nuance]
  question: |
    Which is the CORRECT fix for the alg:none vulnerability?
  options:
  - "Blocklist the exact string 'none' in the header"
  - "Require that the signature segment always be non-empty"
  - "Pin a positive algorithm allowlist bound to the key material, rejecting any alg not on it (including all casings of none)"
  - "Reject only tokens whose header is lowercase"
  answer: 2
  explanation: |
    A string blocklist is defeated by case variants (None, nOnE). Merely requiring
    a non-empty signature can be gamed and doesn't address key-confusion. The robust
    fix is a positive allowlist tied to the key type, so the verifier — not the
    token — decides the algorithm.
  ref: "concepts.md#algorithm-selection-and-jwe-hardening"

- id: jwt-and-token-security-073
  difficulty: advanced
  tags: [rfc-8725, do-not-trust-claims, authorization]
  question: |
    RFC 8725 §3.10 "Do Not Trust Received Claims" is best summarized as which
    verifier behavior?
  options:
  - "A claim's mere presence proves the assertion, so accept it as-is"
  - "Validate each claim against expected values and current authorization state — a signed claim proves the issuer said it, not that it is currently authorized or intended for this action"
  - "Ignore all claims and rely only on the signature"
  - "Trust claims only if the token uses ES256"
  answer: 1
  explanation: |
    A valid signature proves the issuer emitted the claims, not that they satisfy
    this service's authorization rules. §3.10 says validate claims (iss/aud/scope/
    roles) against expectations and live state rather than trusting their presence.
  ref: "concepts.md#rfc-8725-jwt-best-current-practices"

- id: jwt-and-token-security-074
  difficulty: expert
  tags: [deterministic-ecdsa, rfc-6979, nonce-reuse]
  question: |
    Why might a signer in a low-entropy or embedded environment prefer
    deterministic ECDSA (RFC 6979)?
  options:
  - "It makes signatures shorter than randomized ECDSA"
  - "It derives the per-signature nonce k deterministically from the key and message, avoiding weak-RNG nonce reuse that would leak the private key"
  - "It removes the need to validate exp"
  - "It converts ECDSA into an HMAC scheme"
  answer: 1
  explanation: |
    ECDSA leaks the private key if the nonce k repeats or is predictable. RFC 6979
    derives k deterministically from the private key and message hash, eliminating
    dependence on a possibly-weak RNG — valuable on embedded/low-entropy signers.
  ref: "concepts.md#ecdsa-pitfalls-psychic-signatures-and-malleable-signatures"
