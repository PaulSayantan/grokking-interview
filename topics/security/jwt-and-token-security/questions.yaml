topic: "JSON Web Tokens (JWT) & Token Security"
domain: security
topic_slug: jwt-and-token-security
version: 1
questions:
- id: jwt-and-token-security-001
  difficulty: beginner
  tags: [structure, base64url, format]
  question: |
    A signed JWT in JWS compact serialization consists of which three
    dot-separated parts?
  options:
  - "header.payload.signature"
  - "algorithm.claims.checksum"
  - "iv.ciphertext.tag"
  - "issuer.subject.audience"
  answer: 0
  explanation: |
    A JWS compact token is base64url(header) + "." + base64url(payload) + "."
    + base64url(signature). The signature is computed over the first two
    segments joined by a dot.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-002
  difficulty: beginner
  tags: [confidentiality, base64url, encoding]
  question: |
    A developer says "our JWTs are safe to put a user's password in because
    they're encoded." Why is this wrong?
  options:
  - "base64url is encryption, but the key is too weak"
  - "base64url is only encoding, not encryption — anyone with the token can decode and read the payload"
  - "The payload is hashed, so it can be reversed"
  - "JWTs compress the payload, which is lossy"
  answer: 1
  explanation: |
    A signed JWT (JWS) protects integrity and authenticity, not
    confidentiality. The header and payload are base64url-encoded and trivially
    decoded by anyone holding the token. Never store secrets in a JWS payload.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-003
  difficulty: beginner
  tags: [jws, jwe, encryption]
  question: |
    What is the key difference between a JWS and a JWE?
  options:
  - "JWS is encrypted; JWE is only signed"
  - "JWS uses base64; JWE uses base32"
  - "JWS provides integrity/authenticity with a readable payload; JWE provides confidentiality by encrypting the payload"
  - "There is no difference; they are two names for the same thing"
  answer: 2
  explanation: |
    JWS (RFC 7515) signs the token — the payload stays readable. JWE (RFC 7516)
    encrypts the payload so it is not readable. A default JWT is a JWS.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-004
  difficulty: intermediate
  tags: [jwe, structure]
  question: |
    A token you receive has five dot-separated segments
    (header.encrypted_key.iv.ciphertext.tag). What is it?
  options:
  - "A malformed JWS"
  - "A JWK Set"
  - "A refresh token"
  - "A JWE (JSON Web Encryption) token"
  answer: 3
  explanation: |
    JWE compact serialization has exactly five parts: protected header,
    encrypted content-encryption key, IV, ciphertext, and authentication tag.
    A JWS has three parts.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-005
  difficulty: beginner
  tags: [claims, exp, expiration]
  question: |
    Which registered JWT claim specifies the time after which the token must
    no longer be accepted?
  options:
  - "exp"
  - "iat"
  - "nbf"
  - "jti"
  answer: 0
  explanation: |
    exp (Expiration Time, RFC 7519) is a NumericDate; the verifier must reject
    the token when the current time is at or after exp (allowing minor clock
    skew).
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-006
  difficulty: intermediate
  tags: [claims, aud, audience]
  question: |
    One authorization server signs tokens for both a billing API and an admin
    API using the same key. The admin API does not check the aud claim. What is
    the risk?
  options:
  - "Tokens will expire too quickly"
  - "A token legitimately issued for the billing API can be replayed against the admin API and accepted"
  - "The signature will fail to verify"
  - "The token becomes readable by clients"
  answer: 1
  explanation: |
    Without verifying aud, the admin API accepts any token the shared key
    signed — including one minted for the billing API. Always confirm this
    service's identifier is in aud.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-007
  difficulty: intermediate
  tags: [claims, numericdate, gotcha]
  question: |
    A team sets exp using JavaScript's Date.now(). Tokens then never seem to
    expire. What went wrong?
  options:
  - "exp must be an ISO 8601 string, not a number"
  - "exp is ignored unless nbf is also set"
  - "Date.now() returns milliseconds, but NumericDate is seconds since the epoch — so exp lands thousands of years in the future"
  - "exp only works with asymmetric algorithms"
  answer: 2
  explanation: |
    NumericDate is measured in seconds since the Unix epoch. Passing
    milliseconds inflates exp by ~1000x, pushing expiry far into the future and
    effectively disabling it.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-008
  difficulty: beginner
  tags: [claims, jti]
  question: |
    What is the primary purpose of the jti claim?
  options:
  - "To store the token's issuer domain"
  - "To specify the signing algorithm"
  - "To hold the user's email address"
  - "To provide a unique token identifier usable for replay detection and revocation denylists"
  answer: 3
  explanation: |
    jti (JWT ID) is a unique identifier for the token. It is commonly used to
    detect replay and to key a server-side revocation denylist.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-009
  difficulty: beginner
  tags: [algorithms, hs256, symmetric]
  question: |
    HS256 is which kind of algorithm?
  options:
  - "A symmetric HMAC using one shared secret to both sign and verify"
  - "An asymmetric digital signature using a private/public keypair"
  - "An encryption algorithm producing a JWE"
  - "A key-derivation function"
  answer: 0
  explanation: |
    HS256 is HMAC-SHA256: a single shared secret both signs and verifies.
    Anyone able to verify can also forge, so it suits a single trust boundary.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-010
  difficulty: intermediate
  tags: [algorithms, rs256, asymmetric, distributed]
  question: |
    Why is RS256 (or ES256) usually preferred over HS256 when many independent
    resource servers must verify tokens issued by one authorization server?
  options:
  - "RS256 tokens are smaller than HS256 tokens"
  - "With asymmetric signing, verifiers hold only the public key and cannot mint tokens, so a compromised verifier can't forge"
  - "HS256 cannot express an expiration claim"
  - "RS256 encrypts the payload while HS256 does not"
  answer: 1
  explanation: |
    Asymmetric signing separates signing (private key, held only by the issuer)
    from verifying (public key, freely distributable). A compromised resource
    server can verify but not forge tokens.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-011
  difficulty: intermediate
  tags: [algorithms, es256, ecdsa]
  question: |
    ES256 is based on which primitive?
  options:
  - "RSA PKCS#1 v1.5 signatures"
  - "HMAC with SHA-512"
  - "ECDSA on the P-256 curve with SHA-256"
  - "AES-GCM authenticated encryption"
  answer: 2
  explanation: |
    ES256 is ECDSA using the P-256 curve and SHA-256. It produces smaller keys
    and signatures than RS256 and is generally preferred for new asymmetric
    designs.
  ref: "concepts.md#signing-algorithms-hs256-vs-rs256-and-es256"

- id: jwt-and-token-security-012
  difficulty: beginner
  tags: [alg-none, attack, bypass]
  question: |
    In the alg:none attack, what does the attacker do to the token?
  options:
  - "Encrypts the payload so the server cannot read it"
  - "Adds a second signature segment"
  - "Replaces the payload with a longer one to overflow the parser"
  - "Sets the header alg to 'none' and removes the signature, hoping the verifier skips signature checking"
  answer: 3
  explanation: |
    RFC 7518 defines "none" as the Unsecured JWS with an empty signature. If the
    verifier trusts the token's alg, it skips signature verification and accepts
    the attacker's forged claims.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-013
  difficulty: intermediate
  tags: [alg-none, defense, allowlist]
  question: |
    Which is the correct defense against the alg:none attack?
  options:
  - "Pin an explicit algorithm allowlist at the verifier and never read the verification algorithm from the token"
  - "Blocklist the exact string 'none' in the header"
  - "Use a longer HMAC secret"
  - "Base64-encode the signature twice"
  answer: 0
  explanation: |
    The root cause is trusting the token to describe how to verify itself. The
    verifier must decide the algorithm from an allowlist. A string blocklist is
    bypassable with case variants like 'None' or 'nOnE'.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-014
  difficulty: advanced
  tags: [key-confusion, attack, rs256, hs256]
  question: |
    In the classic RS256-to-HS256 key-confusion attack, what does the attacker
    use as the HMAC secret to forge a token?
  options:
  - "A brute-forced random string"
  - "The server's RSA public key bytes, which are publicly available"
  - "The server's RSA private key, which they stole"
  - "The base64url of the header alone"
  answer: 1
  explanation: |
    The attacker crafts an HS256 token and computes its HMAC using the RSA
    public key as the secret. A verifier that reads alg from the token then runs
    HMAC with that same public key and it matches — forgery from public info.
  ref: "concepts.md#attack-hsrs-key-confusion-algorithm-confusion"

- id: jwt-and-token-security-015
  difficulty: advanced
  tags: [key-confusion, defense]
  question: |
    What single practice most directly prevents HS/RS key-confusion?
  options:
  - "Rotating the RSA keypair daily"
  - "Encrypting the token as a JWE"
  - "Binding the accepted algorithm to the key type, so an RSA public key can never be used on the HMAC verification path"
  - "Removing the kid header"
  answer: 2
  explanation: |
    Restricting alg to an allowlist that matches the key type (e.g. only RS256
    when verifying with an RSA key) prevents an HS* token from being verified
    with an asymmetric key, closing the confusion.
  ref: "concepts.md#attack-hsrs-key-confusion-algorithm-confusion"

- id: jwt-and-token-security-016
  difficulty: intermediate
  tags: [weak-secret, brute-force, hmac]
  question: |
    Why is a weak HS256 secret especially dangerous compared to, say, a weak
    login password?
  options:
  - "It disables the exp claim"
  - "It forces the server to use alg:none"
  - "It makes the payload unreadable"
  - "An attacker with one captured token can brute-force the secret entirely offline, with no rate limiting, then sign arbitrary tokens"
  answer: 3
  explanation: |
    With one valid token, an attacker recomputes HMAC over header.payload for
    candidate secrets offline (e.g. hashcat/jwt_tool). No server interaction
    means no rate limiting. A cracked secret lets them mint any token.
  ref: "concepts.md#attack-weak-hmac-secret-brute-force"

- id: jwt-and-token-security-017
  difficulty: intermediate
  tags: [weak-secret, defense, key-length, rfc-7518]
  question: |
    Per RFC 7518, an HMAC key for HS256 should be at least how long, and how
    should it be generated?
  options:
  - "At least 256 bits (32 bytes), generated by a CSPRNG — never a human passphrase"
  - "At least 8 characters, chosen to be memorable"
  - "Exactly 16 bytes, derived from the app name"
  - "At least 512 bits, derived from the user's password"
  answer: 0
  explanation: |
    RFC 7518 §3.2 requires the key be at least as long as the hash output (256
    bits for HS256). It must be high-entropy random from a CSPRNG, not a
    guessable passphrase.
  ref: "concepts.md#attack-weak-hmac-secret-brute-force"

- id: jwt-and-token-security-018
  difficulty: beginner
  tags: [claim-validation, exp]
  question: |
    A verifier checks only the signature and never checks exp. What is the
    consequence?
  options:
  - "Tokens cannot be decoded"
  - "A leaked or stolen token remains valid indefinitely"
  - "The signature will always fail"
  - "The aud claim is ignored automatically"
  answer: 1
  explanation: |
    Signature validity only proves the token was signed by a trusted key. Without
    an exp check, an old leaked token works forever. Signature and claim
    validation are two separate gates.
  ref: "concepts.md#attack-missing-claim-validation-of-exp-aud-and-iss"

- id: jwt-and-token-security-019
  difficulty: intermediate
  tags: [claim-validation, iss, aud, defense]
  question: |
    Which set of checks represents proper claim validation on every request
    (assuming the signature already verified)?
  options:
  - "Only that jti is present"
  - "Only that the payload is valid JSON"
  - "Reject if expired (exp), not-yet-valid (nbf), wrong audience (aud), or untrusted issuer (iss)"
  - "Only that the token is under 1 KB"
  answer: 2
  explanation: |
    After the signature, validate exp/nbf (time window), aud (this service is the
    intended audience), and iss (the token came from a trusted issuer). Missing
    any of these enables replay or cross-service misuse.
  ref: "concepts.md#attack-missing-claim-validation-of-exp-aud-and-iss"

- id: jwt-and-token-security-020
  difficulty: advanced
  tags: [kid, path-traversal, attack]
  question: |
    A server locates its HMAC key via keys/<kid>.pem using the token's kid
    directly. An attacker sets kid to "../../../../dev/null". Why can this forge
    a valid token?
  options:
  - "/dev/null contains the server's private key"
  - "The path traversal crashes the verifier, which then fails open"
  - "It forces the server to use RS256"
  - "/dev/null reads as empty, so the attacker signs the token with an empty key and it verifies"
  answer: 3
  explanation: |
    Pointing kid at /dev/null makes the key read as an empty string. The attacker
    simply signs their forged token with that empty key, and it validates. kid is
    untrusted input and must never be used as a filesystem path.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-021
  difficulty: advanced
  tags: [kid, sql-injection, attack]
  question: |
    A verifier runs SELECT key FROM keys WHERE id='<kid>' with the raw kid. How
    can an attacker abuse this?
  options:
  - "Inject a UNION SELECT so the query returns an attacker-chosen key, which they then use to sign the token"
  - "They cannot; kid is always numeric"
  - "Force the database to delete all keys"
  - "Make the query return the RSA private key"
  answer: 0
  explanation: |
    An unsanitized kid is an injection sink. A payload like
    ' UNION SELECT 'attacker-known-secret' -- makes the query return a key the
    attacker controls, letting them sign a forged token that verifies.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-022
  difficulty: intermediate
  tags: [kid, defense]
  question: |
    What is the correct way to handle the kid header?
  options:
  - "Interpolate it directly into the key-lookup path for flexibility"
  - "Treat it as untrusted input: exact-match it against known key IDs (allowlist / parameterized lookup) and never put it in a path, SQL, or shell string"
  - "Ignore kid and always use the first key"
  - "Trust kid only if the token also sets alg:none"
  answer: 1
  explanation: |
    kid is attacker-controlled. Use it only as an exact-match lookup key against
    a fixed map or parameterized query, and never interpolate it into
    filesystem, SQL, LDAP, or shell contexts.
  ref: "concepts.md#attack-kid-header-injection-via-path-traversal-and-sqli"

- id: jwt-and-token-security-023
  difficulty: advanced
  tags: [jku, ssrf, key-injection, attack]
  question: |
    A verifier fetches the JWK Set from whatever URL the token's jku header
    specifies. Beyond SSRF, what is the most severe consequence?
  options:
  - "The token expires faster"
  - "The payload becomes encrypted"
  - "An attacker hosts their own keypair, points jku at it, signs with their private key, and the server verifies the attacker's signature — full auth bypass"
  - "The signature segment is dropped"
  answer: 2
  explanation: |
    Trusting jku lets the attacker supply their own JWKS. The server downloads the
    attacker's public key and validates the attacker's signature, forging any
    identity. jku is also an SSRF primitive (e.g. cloud metadata).
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-024
  difficulty: advanced
  tags: [jku, x5u, ssrf, defense]
  question: |
    Which is the safest handling of jku/x5u headers?
  options:
  - "Follow any URL but only over HTTPS"
  - "Allow only URLs shorter than 100 characters"
  - "Cache whatever URL was seen first"
  - "Do not fetch keys from a token-supplied URL at all; configure the JWKS URI out-of-band from trusted issuer metadata/config"
  answer: 3
  explanation: |
    Keys should come from a JWKS URI you configure out-of-band, never from the
    token header. If jku must be honored, strictly allowlist the host to the
    known issuer and forbid redirects — but not fetching from it is safest.
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-025
  difficulty: advanced
  tags: [jku, ssrf, cloud-metadata]
  question: |
    An attacker sets jku to http://169.254.169.254/latest/meta-data/. What class
    of attack is this primarily exploiting?
  options:
  - "Server-Side Request Forgery (SSRF) — the server makes an outbound request to a token-controlled internal URL"
  - "Cross-site scripting"
  - "SQL injection"
  - "Clickjacking"
  answer: 0
  explanation: |
    Because the verifier fetches from the token-controlled URL, jku/x5u become an
    SSRF primitive. 169.254.169.254 is the cloud instance metadata endpoint, a
    common SSRF target for credential theft.
  ref: "concepts.md#attack-jku-and-x5u-header-ssrf-and-key-injection"

- id: jwt-and-token-security-026
  difficulty: intermediate
  tags: [jwks, jwk, rfc-7517]
  question: |
    What is a JWKS?
  options:
  - "A JWT Key Store binary format"
  - "A JSON Web Key Set — a JSON document ({\"keys\":[...]}) of public keys, each identified by a kid"
  - "A symmetric key wrapped in a cookie"
  - "A signature algorithm negotiation protocol"
  answer: 1
  explanation: |
    A JWK (RFC 7517) is a JSON key representation; a JWK Set is {"keys":[...]}.
    Asymmetric issuers publish their public keys as a JWKS, and tokens reference a
    key by kid.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-027
  difficulty: intermediate
  tags: [jwks, key-rotation, oidc]
  question: |
    How does publishing a JWKS enable key rotation without downtime?
  options:
  - "It forces all clients to re-login immediately"
  - "It encrypts all outstanding tokens with the new key"
  - "The issuer adds the new public key (new kid) to the set and signs new tokens with it, while old tokens still verify against the still-present old key until they expire"
  - "It shortens exp on every existing token retroactively"
  answer: 2
  explanation: |
    During rotation the JWKS temporarily contains both old and new keys.
    Verifiers select by kid, so old tokens keep verifying until they expire; the
    old key is removed afterward.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-028
  difficulty: intermediate
  tags: [jwks, kid, caching, dos]
  question: |
    When a verifier caches a JWKS and encounters an unknown kid, what is a safe
    behavior?
  options:
  - "Accept the token without verifying, since the kid is new"
  - "Downgrade to alg:none"
  - "Use the RSA public key as an HMAC secret"
  - "Refetch the JWKS (rate-limited to avoid a token-driven fetch storm); if the kid is still unknown, fail closed"
  answer: 3
  explanation: |
    Refetch to pick up rotated keys, but rate-limit the refetch so attacker
    tokens with random kids can't DoS the JWKS endpoint. If the kid is truly
    unknown, reject the token.
  ref: "concepts.md#jwks-and-key-rotation"

- id: jwt-and-token-security-029
  difficulty: intermediate
  tags: [revocation, statelessness, tradeoff]
  question: |
    Why can't a self-contained signed JWT be revoked instantly the way a
    server-side session can?
  options:
  - "Because verification is stateless — the verifier does no lookup, so there is no server-side flag to flip; the token is valid until it expires"
  - "Because the signature changes every second"
  - "Because JWTs cannot carry an exp claim"
  - "Because the payload is encrypted"
  answer: 0
  explanation: |
    The statelessness that makes JWTs fast also means no per-request lookup, so
    you can't un-issue a token mid-life. It stays valid until exp unless you
    reintroduce state.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-030
  difficulty: intermediate
  tags: [revocation, short-ttl, refresh]
  question: |
    What is the primary, most-recommended strategy for limiting the damage of a
    stolen access token given JWT's revocation problem?
  options:
  - "Make access tokens last a year so users rarely re-auth"
  - "Use short-lived access tokens plus a longer-lived, revocable refresh token"
  - "Store the entire session in the token payload"
  - "Sign tokens with alg:none for speed"
  answer: 1
  explanation: |
    Short TTL bounds how long a stolen access token is useful. A refresh token is
    exchanged for new access tokens and, being a stateful operation, can be
    revoked when needed.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-031
  difficulty: advanced
  tags: [revocation, denylist, jti]
  question: |
    A team needs immediate revocation of specific tokens. They add a server-side
    denylist keyed by jti, checked on each request. What is the correct trade-off
    statement?
  options:
  - "It keeps the system fully stateless with zero cost"
  - "It makes tokens un-decodable to clients"
  - "It reintroduces a per-request lookup (state), trading some statelessness for instant revocation; entries can be dropped once the token's exp passes"
  - "It only works with HS256"
  answer: 2
  explanation: |
    A jti denylist gives immediate revocation but adds server-side state and a
    per-request check. Entries only need to live until each token's exp, keeping
    the list bounded.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-032
  difficulty: advanced
  tags: [revocation, token-version]
  question: |
    A per-user token_version (or min_iat) stored server-side and bumped on
    logout/password-change achieves what?
  options:
  - "It encrypts the token payload"
  - "It removes the need for any signature"
  - "It lengthens the token TTL automatically"
  - "It revokes all of that user's outstanding tokens at once with a single small lookup"
  answer: 3
  explanation: |
    Bumping a per-user version or min_iat invalidates every token issued before
    the bump, so all of a user's tokens are revoked together — with just one
    record and lookup per user.
  ref: "concepts.md#the-revocation-problem-short-ttl-denylists-jti"

- id: jwt-and-token-security-033
  difficulty: advanced
  tags: [refresh-token, rotation, reuse-detection]
  question: |
    With refresh-token rotation and reuse detection, what happens when an
    already-used (rotated-out) refresh token is presented again?
  options:
  - "It is treated as a theft signal, so the server revokes the entire token family and forces re-authentication"
  - "It is silently accepted and a new access token is issued"
  - "It extends the family's lifetime"
  - "It is converted into an access token"
  answer: 0
  explanation: |
    Rotation issues a new refresh token each exchange and invalidates the old
    one. Replay of an old refresh token indicates theft, so the whole family is
    revoked — bounding the damage of a stolen refresh token.
  ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

- id: jwt-and-token-security-034
  difficulty: intermediate
  tags: [refresh-token, rotation, storage]
  question: |
    Which practice is recommended for refresh tokens?
  options:
  - "Store them in plaintext and never expire them"
  - "Make them one-time-use (rotated on each exchange), store them hashed at rest, bind them to the client, and give them an absolute maximum lifetime"
  - "Embed the user's password in them"
  - "Sign them with alg:none to save CPU"
  answer: 1
  explanation: |
    Because refresh tokens are long-lived and high-value, rotate them on use,
    store them hashed, bind them to the client, and cap their absolute lifetime.
  ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

- id: jwt-and-token-security-035
  difficulty: intermediate
  tags: [bearer, sender-constrained, theft]
  question: |
    Why is an ordinary JWT access token called a "bearer" token, and why is that
    a risk?
  options:
  - "Because it must be carried in a cookie; cookies are always insecure"
  - "Because it can only be used once"
  - "Because whoever holds it can use it — so if it leaks (logs, XSS, a proxy), the thief has full access without any additional proof"
  - "Because it bears the user's password"
  answer: 2
  explanation: |
    A bearer token grants access to anyone presenting it, with no proof of
    possession. Leakage equals compromise. Sender-constrained tokens (mTLS, DPoP)
    address this by binding the token to a client-held key.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-036
  difficulty: advanced
  tags: [dpop, sender-constrained, rfc-9449]
  question: |
    How does DPoP (RFC 9449) make a stolen access token less useful?
  options:
  - "It encrypts the token so it can't be read"
  - "It shortens the token to under 100 bytes"
  - "It stores the token only in localStorage"
  - "The client sends a fresh signed proof JWT on each request, and the access token carries a thumbprint (cnf.jkt) of the client's public key; without the private key a thief can't produce a valid proof"
  answer: 3
  explanation: |
    DPoP binds the access token to a client keypair via a cnf.jkt thumbprint. Each
    request carries a DPoP proof signed by the private key and bound to
    method/URI, so a stolen token alone is unusable.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-037
  difficulty: advanced
  tags: [mtls, sender-constrained, rfc-8705]
  question: |
    Certificate-bound access tokens (RFC 8705) bind a token to what?
  options:
  - "The client's TLS client certificate (via an x5t#S256 thumbprint in the token's cnf claim)"
  - "The user's password hash"
  - "The server's IP address"
  - "The token's jti value"
  answer: 0
  explanation: |
    mTLS-bound tokens embed a thumbprint (cnf.x5t#S256) of the client's TLS
    certificate. The resource server checks the connection used the matching
    cert, so a token presented over a different connection is rejected.
  ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

- id: jwt-and-token-security-038
  difficulty: intermediate
  tags: [storage, localstorage, xss]
  question: |
    What is the main risk of storing a JWT in browser localStorage?
  options:
  - "It is automatically sent with every request, enabling CSRF"
  - "Any XSS on the page can read and exfiltrate the token because JavaScript can access localStorage"
  - "It cannot be read by the same-origin script"
  - "It disables the token's signature"
  answer: 1
  explanation: |
    localStorage is readable by JavaScript, so an XSS payload can steal the token.
    Its risk profile is theft-via-script (not CSRF, since it isn't sent
    automatically).
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-039
  difficulty: intermediate
  tags: [storage, cookie, httponly, csrf]
  question: |
    A JWT is stored in an HttpOnly; Secure; SameSite cookie. Which statement is
    correct?
  options:
  - "It is exposed to XSS theft but immune to CSRF"
  - "It cannot be transmitted over HTTPS"
  - "It is protected from XSS theft (JS can't read it) but, because cookies are sent automatically, needs CSRF defenses like SameSite/anti-CSRF tokens"
  - "It no longer needs a signature"
  answer: 2
  explanation: |
    HttpOnly keeps the token out of JavaScript's reach (mitigating XSS theft), but
    automatic cookie sending means CSRF must be addressed via SameSite and/or
    anti-CSRF tokens. Secure enforces HTTPS-only transmission.
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-040
  difficulty: beginner
  tags: [storage, transport, url]
  question: |
    Why should JWTs not be placed in URLs or query strings?
  options:
  - "URLs cannot hold base64url characters"
  - "It makes the token expire immediately"
  - "Query strings strip the signature"
  - "They leak into server logs, browser history, and the Referer header"
  answer: 3
  explanation: |
    Tokens in URLs are recorded in access logs, browser history, and Referer
    headers, and shared when links are copied — all avenues for leakage. Use the
    Authorization header or a secure cookie instead.
  ref: "concepts.md#storing-and-transporting-jwts-securely"

- id: jwt-and-token-security-041
  difficulty: beginner
  tags: [confidentiality, payload, sensitive-data]
  question: |
    Which data is safe to include in a standard (signed, unencrypted) JWT
    payload?
  options:
  - "A non-sensitive user id and roles the resource server needs, but nothing secret"
  - "The user's plaintext password"
  - "The HMAC signing secret"
  - "The user's full credit card number"
  answer: 0
  explanation: |
    A JWS payload is readable by anyone with the token, so include only the
    minimum non-sensitive claims the verifier needs. Keep secrets and sensitive
    PII server-side, keyed by sub/jti.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-042
  difficulty: intermediate
  tags: [header, claims, structure]
  question: |
    Which fields legitimately live in the JWT header rather than the payload?
  options:
  - "sub, aud, and exp"
  - "alg, typ, and (optionally) kid"
  - "iss, iat, and jti"
  - "roles and tenant_id"
  answer: 1
  explanation: |
    The header describes the token: alg (algorithm), typ/cty (media type), and an
    optional kid (key id). Claims like sub, aud, exp, iss, iat, jti belong in the
    payload.
  ref: "concepts.md#jwt-structure-header-payload-signature"

- id: jwt-and-token-security-043
  difficulty: advanced
  tags: [nested-jwt, jws, jwe, confidentiality]
  question: |
    A team needs both authenticity and confidentiality of claims in a token.
    Which approach fits?
  options:
  - "Use a plain HS256 JWS with a long secret"
  - "Base64-encode the payload twice"
  - "Use a nested JWT: sign the claims as a JWS, then encrypt that as a JWE (sign-then-encrypt)"
  - "Add alg:none and a strong kid"
  answer: 2
  explanation: |
    A JWS alone gives integrity/authenticity but a readable payload. To also hide
    the claims, nest it: sign then encrypt (JWS inside a JWE), yielding both
    properties.
  ref: "concepts.md#jws-vs-jwe-signed-vs-encrypted"

- id: jwt-and-token-security-044
  difficulty: advanced
  tags: [alg-none, case-bypass, defense]
  question: |
    A filter rejects tokens whose header alg equals the exact string "none", but
    the app is still exploited. What is the most likely explanation and correct
    fix?
  options:
  - "The token used ES256; switch to RS256"
  - "The secret was too long; shorten it"
  - "The kid header was missing; require it"
  - "The attacker used a case variant like 'None' or 'nOnE' to slip past the string check — the correct fix is an algorithm allowlist, not a blocklist"
  answer: 3
  explanation: |
    String blocklists of "none" are bypassable with alternate casing. The robust
    fix is an allowlist of accepted algorithms at the verifier, which rejects any
    unlisted alg regardless of casing.
  ref: "concepts.md#attack-algnone-signature-bypass"

- id: jwt-and-token-security-045
  difficulty: beginner
  tags: [claims, iss, issuer]
  question: |
    What does the iss claim identify?
  options:
  - "The party that issued (minted) the token"
  - "The principal (user) the token is about"
  - "The intended recipient service"
  - "The token's unique identifier"
  answer: 0
  explanation: |
    iss (Issuer) names the party that created and signed the token. Verifiers
    should pin the expected issuer so a token from a different (even trusted)
    issuer isn't accepted where it shouldn't be.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"

- id: jwt-and-token-security-046
  difficulty: intermediate
  tags: [nbf, clock-skew, validation]
  question: |
    A distributed system intermittently rejects freshly issued tokens with a
    "token not yet valid" error. What is the most likely cause and mitigation?
  options:
  - "The exp claim is missing; add it"
  - "Clock skew between issuer and verifier makes nbf/iat appear in the future — allow a small leeway (e.g. 60s) and sync clocks with NTP"
  - "The signature algorithm is too slow; switch to alg:none"
  - "The kid is wrong; remove it"
  answer: 1
  explanation: |
    nbf marks when a token becomes valid. If the verifier's clock lags the
    issuer's, a just-minted token can look not-yet-valid. Allow a small clock-skew
    leeway and synchronize clocks.
  ref: "concepts.md#jwt-claims-iss-sub-aud-exp-nbf-iat-jti"
