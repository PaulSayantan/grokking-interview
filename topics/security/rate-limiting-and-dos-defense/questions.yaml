topic: "Rate Limiting, DoS/DDoS Defense & Abuse Prevention"
domain: security
topic_slug: rate-limiting-and-dos-defense
version: 1
questions:
- id: rate-limiting-and-dos-defense-001
  difficulty: beginner
  tags: [dos, cia-triad, availability]
  question: |
    Which property of a system does a Denial-of-Service (DoS) attack primarily
    target?
  options:
  - "Availability — making the system unusable for legitimate users"
  - "Confidentiality — reading data the attacker shouldn't see"
  - "Integrity — silently altering stored data"
  - "Non-repudiation — denying that an action occurred"
  answer: 0
  explanation: |
    DoS attacks target availability, the third leg of the CIA triad. Rather than
    stealing or altering data, they exhaust a finite resource (bandwidth, CPU,
    memory, connections, or a budget) so legitimate users cannot use the service.
  ref: "concepts.md#dos-vs-ddos"

- id: rate-limiting-and-dos-defense-002
  difficulty: beginner
  tags: [dos, ddos]
  question: |
    What most fundamentally distinguishes a DDoS attack from a plain DoS attack?
  options:
  - "DDoS only targets databases; DoS targets web servers"
  - "DDoS uses many coordinated sources; DoS comes from a single source"
  - "DDoS is always volumetric; DoS is always application-layer"
  - "DDoS requires encryption; DoS does not"
  answer: 1
  explanation: |
    A DoS attack originates from a single source, so you can often mitigate it by
    blocking that one IP/host. A DDoS spreads the attack across many coordinated
    sources (typically a botnet), so there is no single address to block — the
    defense usually has to absorb or scrub the traffic upstream.
  ref: "concepts.md#dos-vs-ddos"

- id: rate-limiting-and-dos-defense-003
  difficulty: intermediate
  tags: [ddos, mitigation]
  question: |
    Why is simple per-IP blocklisting an inadequate defense against a large DDoS
    from a botnet?
  options:
  - "IP addresses cannot be read from packets"
  - "Botnets only ever use a single IP address"
  - "Traffic arrives from thousands of distinct IPs and blocking them can also cut off real users behind shared NAT/CGNAT"
  - "Firewalls are legally prohibited from dropping traffic"
  answer: 2
  explanation: |
    A botnet spreads traffic across thousands or millions of distinct addresses, so
    there is no single IP to block. Aggressive per-IP blocking also risks cutting off
    legitimate users who share an IP via CGNAT/corporate NAT. Distributed attacks
    generally need upstream absorption/scrubbing and behavioral controls instead.
  ref: "concepts.md#dos-vs-ddos"

- id: rate-limiting-and-dos-defense-004
  difficulty: intermediate
  tags: [layers, classification]
  question: |
    A volumetric (L3/L4) DDoS attack is typically measured in which unit, and what
    resource does it exhaust?
  options:
  - "Requests/sec — it exhausts application worker threads"
  - "Queries/sec — it exhausts database connections"
  - "CPU cycles — it exhausts regex-matching capacity"
  - "Gbps/Tbps of bandwidth — it saturates the network pipe"
  answer: 3
  explanation: |
    Volumetric attacks aim to fill the victim's network pipe with sheer bit volume,
    so they are measured in Gbps/Tbps of bandwidth. Application-layer attacks are
    measured in requests/sec, and protocol/state-exhaustion attacks in packets/sec or
    half-open connections.
  ref: "concepts.md#attack-layers-volumetric-protocol-application"

- id: rate-limiting-and-dos-defense-005
  difficulty: advanced
  tags: [layers, rate-limiting, mitigation]
  question: |
    Your service has a robust per-key application-layer rate limiter, yet a
    volumetric flood still takes you offline. What is the most likely reason?
  options:
  - "The flood saturated the ingress bandwidth before packets ever reached the app to be counted"
  - "The rate limiter's counter reset too slowly"
  - "The rate limiter used token bucket instead of leaky bucket"
  - "The 429 responses were larger than the requests"
  answer: 0
  explanation: |
    An application-layer rate limiter can only count and reject requests that reach
    the application. A volumetric flood saturates the upstream network pipe first, so
    the packets never arrive to be limited. Volumetric defense must happen upstream
    (CDN/anycast/scrubbing) where there is more capacity than the attack.
  ref: "concepts.md#attack-layers-volumetric-protocol-application"

- id: rate-limiting-and-dos-defense-006
  difficulty: intermediate
  tags: [amplification, reflection, udp]
  question: |
    Why do reflection/amplification DDoS attacks almost always abuse UDP-based
    protocols with a spoofed source IP?
  options:
  - "UDP encrypts the source address so it cannot be traced"
  - "UDP is connectionless with no handshake, so the reflector never verifies the source and sends a large response to the spoofed victim"
  - "TCP cannot carry large payloads"
  - "UDP guarantees delivery, so responses are never lost"
  answer: 1
  explanation: |
    UDP has no handshake to verify the sender, so an attacker can spoof the victim's
    IP as the source of a small request. The reflector then sends a much larger
    response to the victim. TCP's three-way handshake makes such source spoofing
    impractical, which is why reflection attacks favor UDP services.
  ref: "concepts.md#volumetric-and-amplification-attacks"

- id: rate-limiting-and-dos-defense-007
  difficulty: advanced
  tags: [amplification, memcached, ntp]
  question: |
    Which protocol has been associated with the largest amplification factor (on the
    order of tens of thousands) and was used in record 1.35+ Tbps attacks?
  options:
  - "DNS ANY queries"
  - "NTP monlist"
  - "memcached over UDP (port 11211)"
  - "ICMP echo"
  answer: 2
  explanation: |
    Exposed memcached servers over UDP produced amplification factors on the order of
    10,000-50,000x, the highest known, and powered the 2018 1.35 Tbps GitHub attack.
    NTP monlist gives roughly 556x and DNS a few dozen times. Memcached UDP was
    disabled by default in version 1.5.6.
  ref: "concepts.md#volumetric-and-amplification-attacks"

- id: rate-limiting-and-dos-defense-008
  difficulty: intermediate
  tags: [amplification, ntp]
  question: |
    Which NTP feature was historically abused for reflection amplification because it
    returns a large list of recent clients from a small request?
  options:
  - "The `kiss-of-death` packet"
  - "The leap-second table"
  - "The stratum-0 broadcast"
  - "The `monlist` command"
  answer: 3
  explanation: |
    The NTP `monlist` command returns the details of up to the last 600 hosts that
    queried the server, turning a tiny request into a huge response (roughly 556x
    amplification). It was disabled/removed in later ntpd versions (4.2.7+).
  ref: "concepts.md#volumetric-and-amplification-attacks"

- id: rate-limiting-and-dos-defense-009
  difficulty: advanced
  tags: [amplification, ingress-filtering, bcp38]
  question: |
    Which network-operator practice most directly attacks the root cause that makes
    reflection/amplification attacks possible?
  options:
  - "Source-address validation / ingress filtering (BCP 38 / RFC 2827) that drops spoofed-source packets"
  - "Enabling HTTP/2 on all origins"
  - "Rotating TLS certificates more frequently"
  - "Increasing the TCP backlog size"
  answer: 0
  explanation: |
    Reflection attacks depend on spoofing the victim's source IP. BCP 38 / RFC 2827
    ingress filtering has operators drop packets whose source address could not
    legitimately originate from that network, choking spoofing at the source. Its
    incomplete adoption across the internet is why these attacks persist.
  ref: "concepts.md#volumetric-and-amplification-attacks"

- id: rate-limiting-and-dos-defense-010
  difficulty: beginner
  tags: [syn-flood, protocol]
  question: |
    In a TCP SYN flood, what server resource is exhausted?
  options:
  - "Disk storage from logging"
  - "The SYN backlog / half-open connection table"
  - "TLS session tickets"
  - "DNS cache entries"
  answer: 1
  explanation: |
    A SYN flood sends many SYN packets (often with spoofed sources) and never
    completes the handshake. Each SYN allocates a half-open connection in the bounded
    SYN backlog; once full, legitimate SYNs are dropped. It exhausts connection state,
    not bandwidth.
  ref: "concepts.md#protocol-attacks-syn-flood-and-syn-cookies"

- id: rate-limiting-and-dos-defense-011
  difficulty: advanced
  tags: [syn-cookies, protocol]
  question: |
    How do SYN cookies defeat a SYN flood?
  options:
  - "They rate-limit incoming SYN packets by source IP at the firewall"
  - "They drop all SYN packets during an attack"
  - "They encode connection state into the SYN-ACK sequence number and store no half-open entry, reconstructing state from the client's final ACK"
  - "They require clients to solve a proof-of-work puzzle before the handshake"
  answer: 2
  explanation: |
    With SYN cookies the server does not allocate backlog state on the first SYN.
    Instead it encodes the connection state into the initial sequence number of its
    SYN-ACK (a keyed hash of the tuple plus a secret/timestamp) and discards the
    half-open entry. A legitimate client's final ACK lets the server statelessly
    reconstruct and validate the connection (RFC 4987), so bare SYNs cost nothing.
  ref: "concepts.md#protocol-attacks-syn-flood-and-syn-cookies"

- id: rate-limiting-and-dos-defense-012
  difficulty: advanced
  tags: [syn-cookies, tradeoffs]
  question: |
    Why do modern TCP stacks typically enable SYN cookies only when the backlog is
    under pressure rather than always?
  options:
  - "SYN cookies leak the server's private key"
  - "They only work over IPv6"
  - "They double the bandwidth used per connection"
  - "Because state isn't stored, some TCP options negotiated in the original SYN (e.g. large windows/SACK) can be lost"
  answer: 3
  explanation: |
    SYN cookies trade functionality for statelessness: since no state is stored, TCP
    options carried in the original SYN (window scaling, SACK) may be lost or
    degraded. So stacks enable them adaptively — only when the backlog is filling —
    to preserve normal behavior under non-attack conditions.
  ref: "concepts.md#protocol-attacks-syn-flood-and-syn-cookies"

- id: rate-limiting-and-dos-defense-013
  difficulty: intermediate
  tags: [slowloris, l7]
  question: |
    How does a slowloris attack tie up a web server using very little bandwidth?
  options:
  - "It opens many connections and sends each request extremely slowly (never completing them), occupying worker/connection slots"
  - "It sends millions of complete requests per second"
  - "It floods the server with UDP amplification traffic"
  - "It exploits a buffer overflow in the TLS stack"
  answer: 0
  explanation: |
    Slowloris opens many connections and trickles partial HTTP requests (a header
    line every few seconds) without ever completing them. A connection- or
    thread-limited server keeps each slot occupied waiting for the rest, so a few
    hundred slow connections can exhaust all worker slots using only kilobits/sec.
  ref: "concepts.md#application-layer-l7-attacks-slowloris-and-expensive-endpoints"

- id: rate-limiting-and-dos-defense-014
  difficulty: intermediate
  tags: [slowloris, mitigation, timeouts]
  question: |
    What is the primary defense against slowloris and other slow-HTTP attacks?
  options:
  - "Increasing the number of worker threads without limit"
  - "Aggressive request/header/body read timeouts (and a buffering reverse proxy that forwards only complete requests)"
  - "Blocking all POST requests"
  - "Enabling gzip compression on responses"
  answer: 1
  explanation: |
    The core fix is to stop waiting on clients that dribble data: enforce aggressive
    read timeouts on headers/body and minimum data rates, cap connections per IP, and
    front the origin with an event-driven proxy/CDN that only forwards complete
    requests. Adding more threads just delays exhaustion.
  ref: "concepts.md#application-layer-l7-attacks-slowloris-and-expensive-endpoints"

- id: rate-limiting-and-dos-defense-015
  difficulty: intermediate
  tags: [l7, expensive-endpoints]
  question: |
    Why can a very low request rate against certain endpoints still cause a DoS?
  options:
  - "Low request rates always trigger autoscaling failures"
  - "HTTP requires a minimum request rate to function"
  - "Some endpoints are individually expensive (unbounded search, exports, deep GraphQL, heavy hashing), so few requests exhaust CPU/DB"
  - "Rate limiters cannot count fewer than 100 requests"
  answer: 2
  explanation: |
    Cost is not uniform across endpoints. A single unbounded search, report export,
    image resize, or deeply nested GraphQL query can consume enormous CPU/DB. Defend
    with weighted per-endpoint limits, query cost/depth analysis, pagination caps,
    timeouts, and offloading heavy work to async queues — not just a global req/sec.
  ref: "concepts.md#application-layer-l7-attacks-slowloris-and-expensive-endpoints"

- id: rate-limiting-and-dos-defense-016
  difficulty: advanced
  tags: [redos, regex, algorithmic-complexity]
  question: |
    What causes a Regular-expression Denial of Service (ReDoS)?
  options:
  - "A regex that matches too many strings at once"
  - "A regex compiled with the wrong character encoding"
  - "Using anchors like `^` and `$` in a pattern"
  - "Catastrophic backtracking from nested/overlapping quantifiers (e.g. `(a+)+$`) on a crafted input, making match time exponential"
  answer: 3
  explanation: |
    ReDoS (CWE-1333) exploits backtracking regex engines: patterns with nested or
    overlapping quantifiers such as `(a+)+$` explore exponentially many paths on a
    crafted non-matching input, pinning a CPU for seconds to minutes on a tiny string.
  ref: "concepts.md#algorithmic-complexity-dos-redos-zip-and-xml-bombs"

- id: rate-limiting-and-dos-defense-017
  difficulty: intermediate
  tags: [redos, mitigation]
  question: |
    Which of these best prevents ReDoS?
  options:
  - "Use a linear-time regex engine (e.g. RE2), bound input length, set match timeouts, and never accept user-supplied patterns"
  - "Increase the regex recursion limit"
  - "Run the regex on a faster CPU"
  - "Escape all HTML in the input before matching"
  answer: 0
  explanation: |
    The reliable fix is to remove the exponential behavior: use a linear-time engine
    like RE2 or Rust's regex (no backtracking), avoid nested quantifiers, cap input
    length before matching, and apply match timeouts. Crucially, never let untrusted
    users supply regex patterns.
  ref: "concepts.md#algorithmic-complexity-dos-redos-zip-and-xml-bombs"

- id: rate-limiting-and-dos-defense-018
  difficulty: intermediate
  tags: [zip-bomb, xml-bomb, decompression]
  question: |
    A "billion laughs" attack against an XML parser works by which mechanism, and
    what is the standard defense?
  options:
  - "SQL injection into the XML database; use prepared statements"
  - "Recursively nested entity definitions that expand exponentially in memory; disable DTD/entity processing or cap expansion"
  - "Buffer overflow in the XML tokenizer; enable ASLR"
  - "TLS downgrade of the XML transport; enforce TLS 1.3"
  answer: 1
  explanation: |
    The billion-laughs attack (CWE-776) defines nested XML entities that each
    reference the previous one many times, so a ~1 KB document expands to gigabytes in
    memory. The defense is to disable DTD/external-entity processing (which also
    prevents XXE) or enforce strict entity-expansion limits.
  ref: "concepts.md#algorithmic-complexity-dos-redos-zip-and-xml-bombs"

- id: rate-limiting-and-dos-defense-019
  difficulty: advanced
  tags: [algorithmic-complexity, rate-limiting]
  question: |
    Why do algorithmic-complexity attacks (ReDoS, zip/XML bombs) often defeat a
    request-count rate limiter?
  options:
  - "They send more than 1000 requests per second"
  - "Rate limiters cannot inspect HTTPS traffic"
  - "The cost lives in the payload, not the count — a single small request triggers huge work, so you must bound the work (timeouts, decompressed-size caps, parse depth), not just the rate"
  - "They only occur over UDP, which is not rate-limited"
  answer: 2
  explanation: |
    These attacks put the cost in the payload rather than in the number of requests.
    One small request can consume gigabytes of RAM or minutes of CPU, so a limiter
    that only counts requests won't stop it. You must bound the work itself: regex
    match timeouts, maximum decompressed size, and parser nesting/expansion limits.
  ref: "concepts.md#algorithmic-complexity-dos-redos-zip-and-xml-bombs"

- id: rate-limiting-and-dos-defense-020
  difficulty: beginner
  tags: [token-bucket, algorithms]
  question: |
    Which rate-limiting algorithm is best known for enforcing an average rate while
    still permitting controlled bursts?
  options:
  - "Leaky bucket (queue)"
  - "Fixed window counter"
  - "Sliding window log"
  - "Token bucket"
  answer: 3
  explanation: |
    The token bucket accumulates up to B tokens during idle periods; a burst of up to
    B requests passes immediately, after which the sustained rate is limited to the
    refill rate R. Allowing bounded bursts is its defining characteristic.
  ref: "concepts.md#rate-limiting-algorithm-token-bucket"

- id: rate-limiting-and-dos-defense-021
  difficulty: intermediate
  tags: [token-bucket, algorithms]
  question: |
    A token bucket has capacity B = 10 and refill rate R = 5 tokens/sec. After sitting
    idle, a burst of 10 requests arrives simultaneously, then requests keep coming.
    What happens?
  options:
  - "All 10 burst requests pass (draining the bucket), then the sustained rate is capped at 5 req/sec"
  - "Only 5 of the burst pass; the rest are always rejected"
  - "All requests are queued and delayed by 2 seconds each"
  - "The bucket rejects everything until it refills to 10 again"
  answer: 0
  explanation: |
    Because idle time let the bucket fill to its capacity of 10, the burst of 10
    passes at once, draining it. Thereafter tokens replenish at R = 5/sec, so the
    sustained throughput is capped at 5 req/sec. B controls burstiness; R controls the
    steady rate.
  ref: "concepts.md#rate-limiting-algorithm-token-bucket"

- id: rate-limiting-and-dos-defense-022
  difficulty: intermediate
  tags: [token-bucket, efficiency]
  question: |
    What per-key state does a token bucket need to store, and how are tokens usually
    updated?
  options:
  - "A full log of every request timestamp; updated by scanning the log"
  - "Just `{tokens, last_refill_timestamp}`; tokens are computed lazily on access as `min(B, tokens + (now - last)*R)`"
  - "A FIFO queue of pending requests; updated by a background drainer"
  - "One counter per second of the window; reset every second"
  answer: 1
  explanation: |
    A token bucket is O(1) in memory: it stores the current token count and the last
    refill time. Rather than refilling on a timer, it lazily recomputes tokens on each
    access based on elapsed time, capped at B. This makes it cheap and easy to run in
    a shared store.
  ref: "concepts.md#rate-limiting-algorithm-token-bucket"

- id: rate-limiting-and-dos-defense-023
  difficulty: intermediate
  tags: [leaky-bucket, algorithms]
  question: |
    What output behavior does a leaky-bucket (queue) rate limiter produce?
  options:
  - "Bursty output matching the input"
  - "Random output determined by a jitter function"
  - "A smooth, constant output rate regardless of input burstiness, at the cost of possible queuing delay"
  - "No output until the bucket is completely full"
  answer: 2
  explanation: |
    The leaky bucket queues incoming requests and drains them at a fixed rate, so its
    output is perfectly smooth/constant no matter how bursty the input. The trade-off
    is added queuing latency and drops when the queue is full. This is ideal for
    protecting a downstream that needs steady, predictable load.
  ref: "concepts.md#rate-limiting-algorithm-leaky-bucket"

- id: rate-limiting-and-dos-defense-024
  difficulty: advanced
  tags: [token-bucket, leaky-bucket, comparison]
  question: |
    You need to protect a fragile downstream service that must receive a steady,
    predictable request rate with no spikes. Which algorithm best fits, and why?
  options:
  - "Token bucket, because it allows bursts up to the bucket size"
  - "Fixed window, because it is the cheapest to implement"
  - "Sliding window log, because it stores every timestamp"
  - "Leaky bucket, because it smooths output to a constant rate even when input is bursty"
  answer: 3
  explanation: |
    A leaky bucket enforces a flat, constant output rate, which is exactly what a
    spike-sensitive downstream needs. Token bucket would let a burst through up to its
    capacity, which is the opposite of what you want here. The cost is added queuing
    delay, acceptable for this goal.
  ref: "concepts.md#rate-limiting-algorithm-leaky-bucket"

- id: rate-limiting-and-dos-defense-025
  difficulty: intermediate
  tags: [fixed-window, boundary-burst]
  question: |
    A fixed-window limiter allows 100 req/min. A client sends 100 requests at 23:59:30
    and 100 more at 00:00:10. What weakness does this illustrate?
  options:
  - "The boundary-burst problem: ~200 requests pass in ~40 seconds, double the intended rate, by straddling the window reset"
  - "Clock skew between client and server"
  - "A race condition in the counter increment"
  - "Token starvation in the bucket"
  answer: 0
  explanation: |
    Fixed windows reset at boundaries, so a client can spend the full quota at the end
    of one window and again at the start of the next, delivering up to 2x the limit in
    a short span across the boundary. Sliding-window approaches fix this.
  ref: "concepts.md#fixed-vs-sliding-window-and-the-boundary-burst-problem"

- id: rate-limiting-and-dos-defense-026
  difficulty: intermediate
  tags: [sliding-window-log, memory]
  question: |
    What is the main drawback of a sliding-window-log rate limiter compared to a
    counter-based approach?
  options:
  - "It cannot enforce limits accurately"
  - "It stores a timestamp for every request, so memory grows with request volume"
  - "It suffers from the boundary-burst problem"
  - "It requires UDP instead of TCP"
  answer: 1
  explanation: |
    A sliding-window log keeps one timestamp per request in a sorted structure so it
    can count exactly how many fall within the sliding window. This is precise and
    burst-proof but O(requests) in memory, which is expensive at high volume — hence
    the popular O(1) sliding-window-counter approximation.
  ref: "concepts.md#fixed-vs-sliding-window-and-the-boundary-burst-problem"

- id: rate-limiting-and-dos-defense-027
  difficulty: advanced
  tags: [sliding-window-counter, algorithms]
  question: |
    The sliding-window-counter approximation estimates the current rate using which
    formula?
  options:
  - "current_count * 2"
  - "max(current_count, previous_count)"
  - "current_count + previous_count * (fraction of the previous window still overlapping the sliding window)"
  - "previous_count - current_count"
  answer: 2
  explanation: |
    The sliding-window counter keeps the current and previous fixed-window counts and
    weights the previous by the fraction of it still overlapped by the sliding window
    (e.g. 25% into the current minute -> current + previous*0.75). It bounds the
    boundary burst with only two counters (O(1)) and is what many gateways/CDNs use.
  ref: "concepts.md#fixed-vs-sliding-window-and-the-boundary-burst-problem"

- id: rate-limiting-and-dos-defense-028
  difficulty: beginner
  tags: [per-key, dimensioning]
  question: |
    What is the "key" (dimension) in a rate limiter?
  options:
  - "The cryptographic key used to sign responses"
  - "The primary key of the database table being protected"
  - "The TLS session identifier"
  - "The attribute the limiter counts requests by (e.g. IP, user, API key, tenant)"
  answer: 3
  explanation: |
    The key/dimension is what the limiter buckets requests by — source IP, user
    account, API key, or tenant. Choosing it wrongly either lets attackers evade the
    limit (too coarse/spoofable) or punishes innocent users (e.g. many users behind
    one NAT IP).
  ref: "concepts.md#per-key-dimensioning-ip-user-api-key-tenant"

- id: rate-limiting-and-dos-defense-029
  difficulty: intermediate
  tags: [per-key, cgnat, ip]
  question: |
    What is a key pitfall of rate-limiting purely by source IP?
  options:
  - "CGNAT/shared NAT put many real users behind one IP (collateral throttling), while IPv6/botnets give attackers huge address pools to rotate through"
  - "IP addresses cannot be used as map keys"
  - "IPs change on every TCP packet"
  - "IP-based limiting only works for authenticated users"
  answer: 0
  explanation: |
    Per-IP limiting is essential for pre-auth endpoints but has real drawbacks: many
    legitimate users share one IP via CGNAT/corporate NAT (so a limit throttles
    innocents), and attackers can rotate through large IPv6 ranges or a botnet's many
    IPs to evade per-IP counts. Layer it with per-user/per-key limits where possible.
  ref: "concepts.md#per-key-dimensioning-ip-user-api-key-tenant"

- id: rate-limiting-and-dos-defense-030
  difficulty: advanced
  tags: [per-key, x-forwarded-for, spoofing]
  question: |
    Your rate limiter keys on the client IP taken from the `X-Forwarded-For` header.
    An attacker sends `X-Forwarded-For: 1.2.3.4` with a different value each request.
    What happens and how should it be fixed?
  options:
  - "Nothing — X-Forwarded-For cannot be forged"
  - "The attacker forges a fresh 'IP' per request and bypasses the limit; fix by trusting XFF only from your own proxy and taking the correct trusted hop"
  - "The limiter blocks all traffic from 1.2.3.4 permanently"
  - "The header is ignored because it is not RFC-standard"
  answer: 1
  explanation: |
    A client-supplied `X-Forwarded-For` can be anything, so trusting it blindly lets
    an attacker present a new source IP per request and defeat the limiter entirely.
    Strip/normalize the header at your edge and use only the leftmost value added by a
    proxy you actually trust.
  ref: "concepts.md#per-key-dimensioning-ip-user-api-key-tenant"

- id: rate-limiting-and-dos-defense-031
  difficulty: intermediate
  tags: [per-key, multi-tenant, fairness]
  question: |
    In a multi-tenant SaaS, why add a per-tenant rate limit on top of per-user limits?
  options:
  - "To reduce TLS handshake overhead"
  - "To comply with the token-bucket RFC"
  - "To prevent a single noisy tenant from starving other tenants of shared capacity (noisy-neighbor fairness)"
  - "Because per-user limits are impossible in multi-tenant systems"
  answer: 2
  explanation: |
    Per-tenant limits enforce fairness across customers: without them, one tenant's
    heavy usage (or abuse) can consume shared capacity and degrade every other
    tenant's experience — the noisy-neighbor problem. Layered limits (IP, user, tenant,
    global) each guard a different failure mode.
  ref: "concepts.md#per-key-dimensioning-ip-user-api-key-tenant"

- id: rate-limiting-and-dos-defense-032
  difficulty: advanced
  tags: [login, brute-force, account-lockout]
  question: |
    Why can hard account lockout keyed solely on username backfire as a defense on a
    login endpoint?
  options:
  - "It slows down the database"
  - "It violates the token-bucket algorithm"
  - "It prevents password managers from working"
  - "An attacker can deliberately lock out a victim's account (a DoS on that user) by submitting bad passwords for their username"
  answer: 3
  explanation: |
    Locking an account after N failures keyed only on username lets an attacker
    intentionally lock out any known victim by feeding wrong passwords, turning a
    brute-force defense into a targeted DoS. Prefer per-IP + per-account throttling,
    progressive delays, CAPTCHA on risk, and MFA over blunt username lockout.
  ref: "concepts.md#per-key-dimensioning-ip-user-api-key-tenant"

- id: rate-limiting-and-dos-defense-033
  difficulty: intermediate
  tags: [distributed, counter, fleet]
  question: |
    Ten app servers each keep their own in-memory rate-limit counters behind a load
    balancer. What is the effective global limit?
  options:
  - "Roughly 10x the intended limit, since each server only counts the requests it happens to receive"
  - "Exactly the intended per-server limit"
  - "One-tenth of the intended limit"
  - "Zero — the counters cancel out"
  answer: 0
  explanation: |
    Independent per-instance counters each only see the fraction of traffic routed to
    them, so the aggregate allowed rate becomes about N times the intended limit. To
    enforce a true global limit the counter state must be shared (e.g. a central
    atomic store).
  ref: "concepts.md#distributed-rate-limiting-and-counter-consistency"

- id: rate-limiting-and-dos-defense-034
  difficulty: advanced
  tags: [distributed, race-condition, atomicity]
  question: |
    Two app servers implement a shared counter with `GET`, compare, then `SET`. Under
    concurrency the limit is exceeded. What is the flaw and the fix?
  options:
  - "The TTL is too long; shorten it"
  - "Read-then-write is a race (both read 99, both allow, both write 100); use an atomic op like INCR/INCRBY or a server-side Lua script"
  - "GET and SET must run on different keys"
  - "The counter should be stored as a float, not an integer"
  answer: 1
  explanation: |
    A non-atomic read-modify-write races: two instances can both read the same value,
    both decide to allow, and both write back, letting extra requests slip through.
    The check-and-increment must be atomic — use INCR/INCRBY or execute a Lua script
    server-side so the operation is indivisible.
  ref: "concepts.md#distributed-rate-limiting-and-counter-consistency"

- id: rate-limiting-and-dos-defense-035
  difficulty: advanced
  tags: [distributed, fail-open, fail-closed]
  question: |
    Your central rate-limit store becomes unreachable. What does choosing "fail-open"
    mean, and when is it appropriate?
  options:
  - "Reject all traffic; appropriate for general public endpoints"
  - "Crash the service to force a restart"
  - "Allow all traffic (skip the limit); appropriate when availability matters more than the protection, e.g. general public traffic"
  - "Switch to leaky bucket automatically"
  answer: 2
  explanation: |
    Fail-open means allowing requests when the limiter can't make a decision,
    preserving availability at the cost of temporarily losing protection — often right
    for general public traffic. Fail-closed (reject) preserves protection but can
    cause a self-inflicted outage; reserve it for controls guarding costly/dangerous
    actions.
  ref: "concepts.md#distributed-rate-limiting-and-counter-consistency"

- id: rate-limiting-and-dos-defense-036
  difficulty: beginner
  tags: [http, status-code, 429]
  question: |
    Which HTTP status code should a server return when a client exceeds its rate
    limit?
  options:
  - "403 Forbidden"
  - "409 Conflict"
  - "500 Internal Server Error"
  - "429 Too Many Requests"
  answer: 3
  explanation: |
    RFC 6585 section 4 defines 429 Too Many Requests specifically for rate limiting:
    the request was well-formed but the client has sent too many requests. 403 is for
    authorization failures, not rate limiting.
  ref: "concepts.md#429-too-many-requests-and-retry-after"

- id: rate-limiting-and-dos-defense-037
  difficulty: beginner
  tags: [http, retry-after]
  question: |
    What does the `Retry-After` header on a 429 (or 503) response tell the client?
  options:
  - "How long to wait before retrying — either a delay in seconds or an HTTP-date"
  - "The client's remaining request quota"
  - "The server's current CPU load"
  - "Which endpoint to call instead"
  answer: 0
  explanation: |
    Retry-After (RFC 7231 section 7.1.3 / RFC 9110) tells a client how long to wait
    before making the request again, expressed as a number of seconds (e.g.
    `Retry-After: 30`) or an HTTP-date. Well-behaved clients honor it and stop
    hammering.
  ref: "concepts.md#429-too-many-requests-and-retry-after"

- id: rate-limiting-and-dos-defense-038
  difficulty: intermediate
  tags: [http, 429, 503]
  question: |
    When should a service return 503 rather than 429?
  options:
  - "Never — they are interchangeable"
  - "Use 429 when a specific client exceeded its quota; use 503 when the server itself is overloaded/shedding load globally"
  - "Use 503 only for authentication failures"
  - "Use 503 when the client's clock is wrong"
  answer: 1
  explanation: |
    429 signals that this particular client exceeded its rate limit (a client-side
    condition), while 503 Service Unavailable indicates the server as a whole is
    overloaded or down and is shedding load. Both may carry Retry-After, but they
    convey different causes.
  ref: "concepts.md#429-too-many-requests-and-retry-after"

- id: rate-limiting-and-dos-defense-039
  difficulty: advanced
  tags: [retry-storm, jitter, thundering-herd]
  question: |
    After you return 429s during a spike, all throttled clients retry at the exact
    same instant the window resets and re-overwhelm you. What client behavior would
    have prevented this?
  options:
  - "Retrying twice as fast"
  - "Switching from HTTPS to HTTP"
  - "Exponential backoff with randomized jitter, so retries are spread out instead of synchronized"
  - "Ignoring the Retry-After header"
  answer: 2
  explanation: |
    Synchronized retries cause a thundering-herd/retry-storm that re-DoSes the service
    the moment the window opens. Exponential backoff with jitter randomizes each
    client's wait so retries are spread over time. Server-side, load shedding (reject
    cheaply and early) complements this.
  ref: "concepts.md#429-too-many-requests-and-retry-after"

- id: rate-limiting-and-dos-defense-040
  difficulty: beginner
  tags: [abuse-prevention, captcha]
  question: |
    What is the primary purpose of a CAPTCHA challenge in abuse prevention?
  options:
  - "To encrypt the client's traffic"
  - "To replace the need for authentication"
  - "To compress request payloads"
  - "To raise the cost of automated abuse by forcing a challenge that humans can pass but bots find costly"
  answer: 3
  explanation: |
    CAPTCHAs make automated abuse (mass signups, credential stuffing, scraping)
    expensive by requiring a challenge easy for humans but hard for bots. Modern
    variants are risk-scored and mostly invisible, and should be triggered adaptively
    on suspicious sessions rather than on every request due to UX/accessibility costs.
  ref: "concepts.md#abuse-prevention-captcha-proof-of-work-progressive-backoff"

- id: rate-limiting-and-dos-defense-041
  difficulty: intermediate
  tags: [abuse-prevention, proof-of-work]
  question: |
    How does a proof-of-work (PoW) challenge deter high-volume abuse?
  options:
  - "It requires the client to solve a small computational puzzle per request — cheap once, but expensive at flood scale"
  - "It encrypts the request so bots cannot read it"
  - "It permanently blocks the client's IP"
  - "It forces the client to authenticate with a password"
  answer: 0
  explanation: |
    PoW (e.g. Hashcash) makes the client burn CPU to find a nonce whose hash meets a
    difficulty target before the request is served. One legitimate request is cheap,
    but issuing millions becomes costly, making floods uneconomical. Its weakness is
    that attackers with GPUs/botnets have cheap compute if difficulty isn't tuned.
  ref: "concepts.md#abuse-prevention-captcha-proof-of-work-progressive-backoff"

- id: rate-limiting-and-dos-defense-042
  difficulty: intermediate
  tags: [abuse-prevention, progressive-backoff]
  question: |
    What is "progressive backoff" (tarpitting) in the context of failed logins?
  options:
  - "Permanently banning the account after one failure"
  - "Increasing the delay/difficulty with each successive failure from the same key (1s, 2s, 4s, 8s...) to slow brute force with minimal impact on a legitimate typo"
  - "Redirecting the client to a CAPTCHA farm"
  - "Rotating the server's TLS certificate after each failure"
  answer: 1
  explanation: |
    Progressive backoff escalates the cost of each additional failure from the same
    source, throttling brute-force/credential-stuffing to a crawl while barely
    inconveniencing a real user who mistypes once. It's a graduated alternative to
    blunt lockout.
  ref: "concepts.md#abuse-prevention-captcha-proof-of-work-progressive-backoff"

- id: rate-limiting-and-dos-defense-043
  difficulty: advanced
  tags: [credential-stuffing, password-spraying, abuse]
  question: |
    An attacker tries one common password across thousands of different accounts, each
    from a different IP. Which control is LEAST likely to catch this on its own?
  options:
  - "Breached-password checks (rejecting known-compromised passwords)"
  - "Behavioral/risk scoring that correlates the distributed pattern"
  - "Per-account rate limiting alone"
  - "MFA on the account"
  answer: 2
  explanation: |
    This is password spraying: one password across many accounts from many IPs. Since
    each account sees only a single attempt and each IP is distinct, per-account (or
    per-IP) rate limiting alone rarely trips. Detection needs cross-account/global
    correlation, plus defenses like breached-password checks and MFA.
  ref: "concepts.md#abuse-prevention-captcha-proof-of-work-progressive-backoff"

- id: rate-limiting-and-dos-defense-044
  difficulty: intermediate
  tags: [waf, cdn, upstream]
  question: |
    Why is a CDN/edge network an effective front-line defense against volumetric
    DDoS?
  options:
  - "It rewrites the attacker's source IPs"
  - "It encrypts all attack traffic so it becomes harmless"
  - "It forces attackers to use TCP instead of UDP"
  - "Its massive, distributed anycast capacity can absorb volume across many PoPs and serve cached responses without hitting the origin"
  answer: 3
  explanation: |
    A CDN spreads traffic across a global anycast network with far more aggregate
    capacity than any single origin, absorbing floods, serving cached content, and
    buffering slow requests. Renting capacity larger than the attack is the practical
    answer to volumetric DDoS.
  ref: "concepts.md#waf-cdn-and-upstream-scrubbing-defense"

- id: rate-limiting-and-dos-defense-045
  difficulty: intermediate
  tags: [waf, defense-in-depth]
  question: |
    Which statement best characterizes a Web Application Firewall (WAF) as a DoS
    defense?
  options:
  - "It inspects L7 traffic and can apply rate-based/signature rules, but is bypassable and best used as defense in depth"
  - "It is a complete, unbypassable solution and the only control you need"
  - "It only operates at layers 3 and 4"
  - "It replaces the need for TLS"
  answer: 0
  explanation: |
    A WAF inspects application-layer traffic and can block known bad patterns, bad
    bots, and IPs exceeding rate-based thresholds. Like all signature/rule systems it
    can be bypassed, so it should be one layer of defense in depth — not the sole
    control.
  ref: "concepts.md#waf-cdn-and-upstream-scrubbing-defense"

- id: rate-limiting-and-dos-defense-046
  difficulty: advanced
  tags: [origin-protection, cdn-bypass]
  question: |
    You put a CDN/WAF in front of your app, but attackers still hit you directly. What
    is the likely gap and its fix?
  options:
  - "The CDN cache TTL is too short; increase it"
  - "Attackers found the origin IP (via DNS history/TLS certs) and bypassed the edge; lock the origin firewall to accept traffic only from the CDN/WAF ranges (or via mTLS/secret header)"
  - "The WAF rules were written in the wrong language"
  - "The origin is running an outdated TLS version"
  answer: 1
  explanation: |
    If the origin still accepts public traffic, an attacker who discovers its IP can
    skip the edge entirely, nullifying your CDN/WAF protection. The fix is origin
    protection: restrict the origin to accept traffic only from your edge provider's
    IP ranges (or enforce mTLS / a shared secret header).
  ref: "concepts.md#waf-cdn-and-upstream-scrubbing-defense"

- id: rate-limiting-and-dos-defense-047
  difficulty: intermediate
  tags: [economic-dos, edos, autoscaling]
  question: |
    What is "Economic Denial of Sustainability" (EDoS) / bill-shock DoS?
  options:
  - "An attack that deletes the victim's billing records"
  - "A denial of service caused by an expired credit card"
  - "An attack that can't take you down, but drives autoscaling/pay-per-use costs up until the victim faces a ruinous bill"
  - "A protocol attack against payment gateways"
  answer: 2
  explanation: |
    EDoS exploits elastic, pay-per-use infrastructure: instead of exhausting a fixed
    resource, the attacker makes you scale (compute, egress, serverless invocations,
    downstream calls) and pay for it. The system stays up but the bill can become
    unsustainable — especially on serverless/on-demand pricing.
  ref: "concepts.md#autoscaling-vs-bill-shock-economic-denial-of-service"

- id: rate-limiting-and-dos-defense-048
  difficulty: advanced
  tags: [economic-dos, autoscaling, ceilings]
  question: |
    Which combination best mitigates economic/bill-shock DoS while keeping the service
    responsive to real load?
  options:
  - "Unlimited autoscaling with no ceiling, trusting the provider to absorb cost"
  - "Disabling autoscaling entirely and running a single fixed instance"
  - "Returning 200 OK to every request to avoid retries"
  - "Hard scale/concurrency ceilings + load shedding (429/503) + billing anomaly alarms + CDN caching and WAF to filter the flood before it triggers billable work"
  answer: 3
  explanation: |
    Autoscaling protects availability but can amplify cost under attack, so pair it
    with hard ceilings that let the system shed load instead of scaling infinitely,
    billing/anomaly alarms to catch runaway spend early, and upstream filtering
    (CDN caching, WAF, rate limits) so the flood never triggers billable work. The
    degrade-vs-pay trade-off should be a deliberate business decision.
  ref: "concepts.md#autoscaling-vs-bill-shock-economic-denial-of-service"

- id: rate-limiting-and-dos-defense-049
  difficulty: expert
  tags: [http2, rapid-reset, cve-2023-44487]
  question: |
    In the HTTP/2 Rapid Reset attack (CVE-2023-44487), why does a strict
    `SETTINGS_MAX_CONCURRENT_STREAMS` limit fail to stop a single connection generating
    hundreds of millions of requests per second?
  options:
  - "The client sends HEADERS then an immediate RST_STREAM; a canceled stream stops counting against the concurrency cap, so new streams can be opened and canceled without bound"
  - "The client compresses the stream IDs so the server undercounts them"
  - "The concurrency limit only applies to server-initiated streams, not client ones"
  - "The attack downgrades the connection to HTTP/1.1 where no concurrency limit exists"
  answer: 0
  explanation: |
    Rapid Reset weaponizes stream cancellation. The client opens a stream with HEADERS
    (which the server begins processing) and immediately sends RST_STREAM. Because a
    reset stream no longer occupies a concurrent slot, the attacker loops open+cancel
    indefinitely over one connection. The exploit primitive is cancellation, not
    concurrency, so the cap is never reached.
  ref: "concepts.md#http2-rapid-reset-and-continuation-flood"

- id: rate-limiting-and-dos-defense-050
  difficulty: expert
  tags: [http2, rapid-reset, mitigation]
  question: |
    Which mitigation most directly addresses HTTP/2 Rapid Reset?
  options:
  - "Lower SETTINGS_MAX_CONCURRENT_STREAMS to 1 per connection"
  - "Disable HPACK header compression"
  - "Monitor the rate of client-initiated RST_STREAM frames per connection and send GOAWAY + close the connection when a reset threshold is crossed"
  - "Require TLS 1.3 for all HTTP/2 connections"
  answer: 2
  explanation: |
    Since the abuse signal is excessive cancellation, the fix is to count client
    RST_STREAM frames (and the ratio of resets to completed streams) and, above a
    threshold, GOAWAY and tear down the connection, optionally jailing the source IP.
    Lowering the concurrency cap does not help because reset streams never occupy a
    slot.
  ref: "concepts.md#http2-rapid-reset-and-continuation-flood"

- id: rate-limiting-and-dos-defense-051
  difficulty: expert
  tags: [http2, continuation-flood, logging]
  question: |
    An HTTP/2 server has its CPU pinned and memory climbing, yet the access log shows no
    corresponding requests. Which attack best explains this, and what is the mechanism?
  options:
  - "A SYN flood exhausting the backlog before TLS completes"
  - "A CONTINUATION flood: endless CONTINUATION frames never set END_HEADERS, so the server buffers and HPACK-decodes headers without bound and the request never completes (so it is never logged)"
  - "A DNS amplification attack reflecting off the server"
  - "A leaky-bucket misconfiguration queuing requests indefinitely"
  answer: 1
  explanation: |
    The CONTINUATION flood (CERT VU#421644) sends a stream of CONTINUATION frames with
    END_HEADERS never set, forcing unbounded header buffering and Huffman/HPACK decode
    work. Because the request is never finished, most servers never write an access-log
    entry, producing the hallmark "pinned CPU, empty log" symptom.
  ref: "concepts.md#http2-rapid-reset-and-continuation-flood"

- id: rate-limiting-and-dos-defense-052
  difficulty: advanced
  tags: [http2, continuation-flood, mitigation]
  question: |
    Which control actually stops an HTTP/2 CONTINUATION flood?
  options:
  - "A requests-per-second rate limit keyed on the client IP"
  - "Enabling gzip on responses to reduce bandwidth"
  - "Caps on total header-list size, header field count, and the number of HEADERS/CONTINUATION frames per stream"
  - "Increasing the number of worker threads"
  answer: 2
  explanation: |
    The cost lives in unbounded header material, not in request count, so a per-second
    request limiter never trips (the request never completes). You must bound the header
    work: maximum header-list size, field count, and frames per stream. RFC 9113 already
    flags streams of small/empty frames as a DoS vector.
  ref: "concepts.md#http2-rapid-reset-and-continuation-flood"

- id: rate-limiting-and-dos-defense-053
  difficulty: expert
  tags: [http2, cve, continuation-flood]
  question: |
    CVE-2023-45288 (Go net/http2), CVE-2024-28182 (nghttp2), and CVE-2024-27919 (Envoy)
    were all disclosed together in 2024. What class of vulnerability do they share?
  options:
  - "HTTP request smuggling via ambiguous Content-Length/Transfer-Encoding"
  - "TLS renegotiation denial of service"
  - "Integer overflow in stream-ID handling"
  - "The HTTP/2 CONTINUATION flood — unbounded processing of CONTINUATION frames lacking END_HEADERS"
  answer: 3
  explanation: |
    That CVE cluster (tracked under CERT VU#421644) is the HTTP/2 CONTINUATION flood:
    multiple implementations failed to bound the header material accumulated across
    CONTINUATION frames, allowing CPU/memory exhaustion from incomplete requests.
  ref: "concepts.md#http2-rapid-reset-and-continuation-flood"

- id: rate-limiting-and-dos-defense-054
  difficulty: expert
  tags: [hashdos, algorithmic-complexity]
  question: |
    A 2 KB POST body with hundreds of carefully chosen form-field names pins a CPU core,
    though the same endpoint is fine under load tests with random fields. What is
    happening?
  options:
  - "A ReDoS in the field-name validation regex"
  - "HashDoS: the crafted keys all collide into one hash-table bucket, degrading insertion from O(1) to O(n^2)"
  - "A zip bomb decompressing the body"
  - "A slowloris attack holding the connection open"
  answer: 1
  explanation: |
    HashDoS (hash flooding) exploits the hash table that stores parsed parameters: keys
    engineered to collide in the same bucket turn average O(1) inserts into O(n^2),
    so a small number of fields consumes disproportionate CPU. Random fields do not
    collide, which is why fuzz/load tests miss it.
  ref: "concepts.md#hashdos-and-hash-flooding"

- id: rate-limiting-and-dos-defense-055
  difficulty: advanced
  tags: [hashdos, mitigation, siphash]
  question: |
    Which pair of defenses best addresses HashDoS?
  options:
  - "A per-process randomized/keyed hash function (e.g. SipHash) plus a cap on the number of parameters/keys accepted per request"
  - "A larger hash table and a faster CPU"
  - "Rejecting requests larger than 1 MB"
  - "Rate-limiting the endpoint to 100 requests per second"
  answer: 0
  explanation: |
    A keyed/randomized hash (SipHash is widely adopted for this) prevents an attacker
    from precomputing colliding keys, removing the O(n^2) primitive. Independently,
    capping the parameter/key count (e.g. max_input_vars, header-count limits) bounds
    worst-case work. Size or rate limits alone miss it because the payload is tiny.
  ref: "concepts.md#hashdos-and-hash-flooding"

- id: rate-limiting-and-dos-defense-056
  difficulty: expert
  tags: [gcra, token-bucket, algorithms]
  question: |
    The GCRA (Generic Cell Rate Algorithm) rate limiter stores which piece of state, and
    how does it decide whether to admit a request?
  options:
  - "A FIFO queue of pending requests, admitting when the queue is not full"
  - "A single Theoretical Arrival Time (TAT); it admits when now >= TAT - burst_tolerance, then advances TAT by the emission interval T = 1/rate"
  - "One counter per fixed window, admitting when the counter is below the limit"
  - "A sorted set of every request timestamp, admitting when the count in the window is under the limit"
  answer: 1
  explanation: |
    GCRA keeps just one timestamp, the Theoretical Arrival Time. A request conforms if
    now is no earlier than TAT minus the burst tolerance tau; on admission TAT advances
    by T = 1/rate. This enforces rate and a bounded burst with O(1) single-value state,
    which is what redis-cell's CL.THROTTLE implements.
  ref: "concepts.md#gcra-the-generic-cell-rate-algorithm"

- id: rate-limiting-and-dos-defense-057
  difficulty: advanced
  tags: [gcra, token-bucket, distributed]
  question: |
    Why is GCRA often preferred over a classic token bucket for a distributed limiter
    backed by a shared store?
  options:
  - "GCRA allows unlimited bursts while token bucket does not"
  - "GCRA needs no state at all, so no store is required"
  - "GCRA is mathematically superior and enforces stricter limits than token bucket"
  - "GCRA's state is a single timestamp, so the check-and-update is a trivial atomic compare-and-set, and it is provably equivalent to a token bucket (tau ~ bucket depth, T ~ refill interval)"
  answer: 3
  explanation: |
    GCRA and token bucket are provably equivalent, but GCRA's single-timestamp state
    makes the atomic check-and-update easy in a shared store (one value to compare-and-
    set), avoiding the read-modify-write race. This is why redis-cell uses it.
  ref: "concepts.md#gcra-the-generic-cell-rate-algorithm"

- id: rate-limiting-and-dos-defense-058
  difficulty: expert
  tags: [load-shedding, concurrency, littles-law]
  question: |
    A service is flooded with requests that are individually valid but collectively
    overwhelming, so you cannot simply block a bad key. Which approach best keeps the
    service up?
  options:
  - "Increase the request-per-second rate limit so fewer requests are rejected"
  - "Load shedding via a concurrency/admission limit (bound in-flight requests, e.g. via Little's Law) that rejects excess work cheaply and early"
  - "Queue all excess requests until capacity frees up"
  - "Return 200 OK immediately and process later"
  answer: 1
  explanation: |
    When traffic is valid you shift from blocking to staying up: bound in-flight work
    with a concurrency/admission limit (Little's Law ties concurrency, latency, and
    throughput) and shed the excess cheaply and early. Unbounded queuing just converts
    overload into a latency collapse.
  ref: "concepts.md#load-shedding-and-adaptive-concurrency-control"

- id: rate-limiting-and-dos-defense-059
  difficulty: expert
  tags: [load-shedding, adaptive-concurrency, aimd]
  question: |
    Netflix's adaptive concurrency limits infer the concurrency ceiling instead of
    hard-coding it. What signal and control loop do they use?
  options:
  - "CPU temperature, adjusted linearly"
  - "The number of open TCP sockets, halved every second"
  - "The Retry-After values returned by downstreams"
  - "Observed request latency, adjusted with an AIMD loop (like TCP congestion control): raise the limit while latency is healthy, cut it multiplicatively when latency climbs"
  answer: 3
  explanation: |
    Adaptive concurrency limits watch latency and apply additive-increase/
    multiplicative-decrease, mirroring TCP congestion control: gently raise the limit
    while latency stays low, sharply cut it when latency rises, so the system finds a
    safe operating point without manual tuning.
  ref: "concepts.md#load-shedding-and-adaptive-concurrency-control"

- id: rate-limiting-and-dos-defense-060
  difficulty: advanced
  tags: [load-shedding, codel, queues]
  question: |
    A load-shedding queue uses CoDel-style management and flips to LIFO under load.
    What is the rationale?
  options:
  - "LIFO guarantees fairness by serving the oldest request first"
  - "CoDel bounds queue length by dropping the newest arrivals only"
  - "CoDel bounds queue sojourn time (how long items wait) and dropping/serving the freshest requests first means those still within their deadline get served while stale ones are shed"
  - "LIFO reduces memory usage compared to FIFO"
  answer: 2
  explanation: |
    CoDel manages the time an item spends in the queue rather than its length; under
    overload, serving fresh requests (LIFO) means those likely still within their
    deadline are handled, while long-waiting requests the client has probably abandoned
    are shed. It targets latency, not raw depth.
  ref: "concepts.md#load-shedding-and-adaptive-concurrency-control"

- id: rate-limiting-and-dos-defense-061
  difficulty: expert
  tags: [retry-storm, resilience, cascading-failure]
  question: |
    A one-second downstream blip triggered a multi-minute outage that far outlasted the
    blip. Every service tier retried failed calls. What happened and what bounds it?
  options:
  - "A memory leak; restart the services"
  - "A retry storm/amplification (each tier's retries multiply load); bound it with a retry budget capping retries to a small fraction of requests, plus backoff with jitter"
  - "Clock skew between the tiers; sync NTP"
  - "A cache stampede; add a longer TTL"
  answer: 1
  explanation: |
    When every layer retries, load multiplies per layer, so a brief fault becomes a
    self-sustaining flood that outlives the trigger. A retry budget (cap retries to,
    say, 10-20% of requests) bounds the amplification regardless of tier count; add
    backoff with jitter and circuit breakers so callers stop hammering a struggling
    dependency.
  ref: "concepts.md#circuit-breakers-bulkheads-and-retry-budgets"

- id: rate-limiting-and-dos-defense-062
  difficulty: advanced
  tags: [circuit-breaker, bulkhead, resilience]
  question: |
    A single slow downstream dependency consumes every worker thread in your service,
    taking down endpoints that don't even use that dependency. Which pattern prevents
    this?
  options:
  - "Bulkhead isolation: give each dependency its own bounded resource pool (threads/connections) so one saturated dependency cannot exhaust all workers"
  - "A longer request timeout so calls eventually succeed"
  - "A leaky-bucket rate limiter on the healthy endpoints"
  - "Switching the downstream call to UDP"
  answer: 0
  explanation: |
    Bulkheads isolate failures by partitioning resources per dependency. If the calls to
    the slow dependency draw from a separate bounded pool, they cannot consume every
    worker, so unrelated endpoints keep serving. A circuit breaker complements this by
    failing fast once the dependency is clearly unhealthy.
  ref: "concepts.md#circuit-breakers-bulkheads-and-retry-budgets"

- id: rate-limiting-and-dos-defense-063
  difficulty: advanced
  tags: [backoff, jitter, retry]
  question: |
    Clients already use exponential backoff, yet retries still arrive in synchronized
    waves that re-overload the service. What is the fix?
  options:
  - "Shorten the base backoff interval"
  - "Increase the maximum retry count"
  - "Have clients retry immediately without backoff"
  - "Add randomized jitter (e.g. decorrelated jitter) to the backoff so retries spread over time instead of clustering at the same computed instants"
  answer: 3
  explanation: |
    Pure exponential backoff still lands many clients on the same computed retry times,
    forming waves. Adding jitter (equal-jitter or decorrelated jitter) randomizes each
    client's wait, spreading retries across the interval and smoothing the load.
  ref: "concepts.md#circuit-breakers-bulkheads-and-retry-budgets"

- id: rate-limiting-and-dos-defense-064
  difficulty: expert
  tags: [cache-busting, cdn, l7]
  question: |
    Despite serving a page from a CDN, your origin is being flooded. The attack requests
    look like `GET /article?nocache=<random>` with a unique value each time. What is
    this and how do you stop it?
  options:
  - "Cache poisoning; sign all cached responses"
  - "Cache-busting/cache-piercing: each unique query string is a distinct cache key that misses and is forwarded to origin. Normalize the cache key to ignore unknown params (allowlist) and rate-limit cache-miss traffic"
  - "A slowloris variant; add read timeouts"
  - "DNS amplification; enable RRL"
  answer: 1
  explanation: |
    Random unkeyed query strings make every request a unique cache key, so the edge
    always misses and forwards to origin, defeating caching. Fix by normalizing the
    cache key to ignore unknown parameters (vary only on an allowlist) and by
    specifically rate-limiting high cache-miss traffic.
  ref: "concepts.md#cache-busting-and-cache-piercing-ddos"

- id: rate-limiting-and-dos-defense-065
  difficulty: expert
  tags: [cdn-bypass, origin-protection, cache-busting]
  question: |
    Name the TWO independent reasons a CDN-fronted origin can still be flooded, with the
    correct fix for each.
  options:
  - "TLS version too old (upgrade) and cache TTL too short (raise it)"
  - "Origin-IP discovery lets attackers skip the edge (lock the origin to edge IP ranges/mTLS), and cache-busting query strings pierce to origin (normalize the cache key + limit cache misses)"
  - "Weak WAF rules (rewrite them) and slow DNS (add anycast)"
  - "Compression disabled (enable gzip) and HTTP/1.1 in use (upgrade to HTTP/2)"
  answer: 1
  explanation: |
    Two distinct bypasses: (1) attackers find the origin IP (DNS history, TLS certs) and
    hit it directly, fixed by restricting the origin firewall to the edge provider's
    ranges or mTLS; and (2) cache-busting query strings force cache misses that reach
    origin, fixed by cache-key normalization and cache-miss rate limiting.
  ref: "concepts.md#cache-busting-and-cache-piercing-ddos"

- id: rate-limiting-and-dos-defense-066
  difficulty: expert
  tags: [amplification, tcp-middlebox-reflection]
  question: |
    TCP middlebox reflection (disclosed 2021) is notable because it can produce
    effectively unbounded amplification. Why is it possible despite TCP normally
    resisting source spoofing?
  options:
  - "It exploits the TCP timestamp option to replay packets"
  - "It uses TCP fast open to skip the handshake entirely"
  - "RFC-noncompliant censorship/filtering middleboxes reply to a spoofed SYN with large block-page content without completing a handshake, so the response is sent to the spoofed victim"
  - "It abuses TCP window scaling to multiply payload size"
  answer: 2
  explanation: |
    Certain in-path middleboxes (censorship/content filters) violate TCP by injecting
    large block-page or redirect responses in reply to a single spoofed SYN, without a
    completed handshake. Because they respond to the spoofed source, they act as
    reflectors and can be triggered repeatedly, yielding very high (near-unbounded)
    amplification.
  ref: "concepts.md#modern-amplification-vectors-and-dns-rrl"

- id: rate-limiting-and-dos-defense-067
  difficulty: advanced
  tags: [dns, rrl, amplification]
  question: |
    What does Response Rate Limiting (RRL) on an authoritative DNS server accomplish?
  options:
  - "It caches recursive queries to speed up resolution"
  - "It encrypts DNS responses to prevent eavesdropping"
  - "It blocks all queries from outside the local network"
  - "It detects many near-identical responses being sent to the same (spoofed) client and slows/drops them, reducing the server's usefulness as a reflection amplifier"
  answer: 3
  explanation: |
    RRL limits how many similar responses an authoritative server will send to the same
    apparent client in a time window. Since amplification relies on flooding a spoofed
    victim with large responses, throttling near-identical responses blunts the server's
    abuse as a reflector while leaving normal diverse traffic unaffected.
  ref: "concepts.md#modern-amplification-vectors-and-dns-rrl"

- id: rate-limiting-and-dos-defense-068
  difficulty: expert
  tags: [ingress-filtering, bcp84, multihoming]
  question: |
    BCP 38 ingress filtering can wrongly drop legitimate traffic at a multihomed network
    where routing is asymmetric. Which guidance addresses that case?
  options:
  - "RFC 6585 (HTTP 429)"
  - "RFC 4987 (SYN cookies)"
  - "RFC 3704 / BCP 84 (ingress filtering for multihomed networks, e.g. feasible-path reverse-path checks)"
  - "RFC 7541 (HPACK)"
  answer: 2
  explanation: |
    Strict unicast reverse-path forwarding can discard valid packets when a multihomed
    site sends and receives over different links. RFC 3704 / BCP 84 refines BCP 38 with
    feasible-path/loose modes so anti-spoofing filtering still works without dropping
    legitimate asymmetric traffic.
  ref: "concepts.md#modern-amplification-vectors-and-dns-rrl"

- id: rate-limiting-and-dos-defense-069
  difficulty: expert
  tags: [ratelimit-headers, structured-fields, standards]
  question: |
    The current IETF `draft-ietf-httpapi-ratelimit-headers` refactored the legacy
    RateLimit-Limit/Remaining/Reset trio. What is the new shape?
  options:
  - "A single JSON body field named rateLimit"
  - "Two Structured Fields: RateLimit-Policy (advertises quota policies, params q/qu/w/pk) and RateLimit (current state, params r/t/pk)"
  - "An X-RateLimit-* set of vendor-prefixed headers"
  - "A single Retry-After header replacing all rate-limit headers"
  answer: 1
  explanation: |
    The draft moved to two HTTP Structured Fields: RateLimit-Policy advertises one or
    more quota policies (q=quota, qu=quota-units, w=window, pk=partition-key), and
    RateLimit conveys current state (r=remaining, t=reset seconds, pk). Senior candidates
    should know the standard landed on structured fields and the old three-header form is
    now legacy.
  ref: "concepts.md#ratelimit-header-structured-fields"

- id: rate-limiting-and-dos-defense-070
  difficulty: advanced
  tags: [ratelimit-headers, structured-fields]
  question: |
    A response carries `RateLimit-Policy: "burst";q=100;w=60` and
    `RateLimit: "burst";r=50;t=30`. What does this tell a client?
  options:
  - "The burst policy permits 100 requests per 60-second window; 50 remain and the window resets in 30 seconds"
  - "The client has been rate-limited for 100 seconds and must wait 60"
  - "The server allows 50 requests total and 30 have been used"
  - "The client must retry after 100 seconds using policy version 60"
  answer: 0
  explanation: |
    RateLimit-Policy advertises the quota: q=100 over w=60 seconds for the policy named
    "burst". RateLimit reports live state for that policy: r=50 remaining, t=30 seconds
    until reset. The two structured fields separate the static policy from the current
    state.
  ref: "concepts.md#ratelimit-header-structured-fields"

- id: rate-limiting-and-dos-defense-071
  difficulty: expert
  tags: [distributed, two-tier, consistency]
  question: |
    You must design a rate limiter for 50 edge PoPs with a sub-millisecond per-request
    budget. Which design and consistency trade-off is most appropriate?
  options:
  - "A synchronous central Redis check on every request, accepting the added round-trip for exactness"
  - "Fully independent per-PoP counters with no coordination, accepting an N-times overshoot"
  - "A two-tier design: each PoP spends a local allowance without a round-trip and periodically reconciles with a central store, explicitly accepting a bounded overcount"
  - "Sticky-route every user to one PoP so a single in-memory counter suffices"
  answer: 2
  explanation: |
    A central check per request blows the latency budget and creates a bottleneck/SPOF;
    fully independent counters overshoot by ~N. The two-tier local+global design lets
    each PoP spend a local slice with no round-trip and reconcile periodically, trading a
    bounded, quantified overcount for very low latency, which is the right call at this
    scale.
  ref: "concepts.md#two-tier-distributed-limiting-and-clock-skew"

- id: rate-limiting-and-dos-defense-072
  difficulty: expert
  tags: [distributed, clock-skew, gcra]
  question: |
    Why can clock skew across nodes corrupt a distributed token-bucket/GCRA limiter, and
    what is the mitigation?
  options:
  - "Skew changes the TTL of counters; disable TTLs entirely"
  - "Skew corrupts the Lua script bytecode; recompile per node"
  - "These limiters compute allowances from timestamps, so a fast/slow node clock can admit requests early or reject them late; base the authoritative decision on the shared store's clock/monotonic time and keep hosts NTP-synced"
  - "Skew only affects fixed-window limiters, not token bucket or GCRA"
  answer: 2
  explanation: |
    Token bucket and GCRA derive the allowance from elapsed time, so if each node uses
    its own skewed wall clock, requests can be admitted too early or rejected too late.
    Use the store's clock (or monotonic time) for the authoritative check and keep hosts
    NTP-synchronized to bound skew.
  ref: "concepts.md#two-tier-distributed-limiting-and-clock-skew"

- id: rate-limiting-and-dos-defense-073
  difficulty: expert
  tags: [privacy-pass, private-access-tokens, challenge]
  question: |
    How do Privacy Pass / Private Access Tokens (RFC 9576) reduce abuse while preserving
    privacy compared with a visual CAPTCHA?
  options:
  - "They send the user's device ID to the origin so it can be rate-limited"
  - "The client redeems blind-signed, unlinkable tokens (attesting likely-human/attested device) per request, so the origin gets proof without a puzzle and without learning the client's identity"
  - "They require the user to solve a harder puzzle but store the result in a cookie"
  - "They proxy all traffic through an anonymizer that strips headers"
  answer: 1
  explanation: |
    In the Privacy Pass model a client obtains blind-signed, unlinkable tokens from an
    attester/issuer and spends one per request. The origin verifies a valid token
    (evidence of a human/attested device) without any interactive puzzle and without
    learning who the client is, avoiding CAPTCHA's UX and privacy costs.
  ref: "concepts.md#challenge-evolution-privacy-pass-turnstile-pow-pages"

- id: rate-limiting-and-dos-defense-074
  difficulty: advanced
  tags: [proof-of-work, challenge, scraping]
  question: |
    An interstitial proof-of-work challenge page (Anubis-style) is deployed against an
    aggressive L7 scraping flood. Why is it effective, and what is its main downside?
  options:
  - "It authenticates users cryptographically; downside is it needs a password"
  - "It forces each client to compute a small hash puzzle before proceeding — negligible for one human but costly for a bot issuing millions of requests; downside is it burdens low-power/legitimate devices"
  - "It blocks the attacker's IP permanently; downside is collateral CGNAT blocking"
  - "It encrypts responses; downside is added latency from TLS"
  answer: 1
  explanation: |
    A PoW interstitial makes every visitor spend CPU on a puzzle; the cost is trivial for
    a single human but multiplies painfully for a mass scraper. The trade-off is that it
    also taxes legitimate low-power devices, so it should be triggered adaptively on risk
    rather than universally.
  ref: "concepts.md#challenge-evolution-privacy-pass-turnstile-pow-pages"

- id: rate-limiting-and-dos-defense-075
  difficulty: expert
  tags: [slow-read, slow-attacks, tcp]
  question: |
    A Slow Read attack differs from slowloris in that it pins server resources on the
    response side. What is the mechanism, and why do body-read timeouts alone miss it?
  options:
  - "It sends a huge request body slowly; body-read timeouts do catch it"
  - "It opens millions of connections instantly, overwhelming the accept queue"
  - "The request is normal, but the client advertises a tiny/zero TCP receive window so the server cannot flush its response, holding the socket; read timeouts target inbound data, not stalled writes"
  - "It floods the server with RST packets"
  answer: 2
  explanation: |
    Slow Read sends a valid request but shrinks its TCP receive window (or advertises
    zero), so the server's response cannot drain and the connection/socket stays pinned.
    Header/body read timeouts watch inbound progress, so they do not fire; you need send
    timeouts / minimum write-rate enforcement and per-source connection caps.
  ref: "concepts.md#slow-attack-family-slow-read-rudy-concrete-knobs"

- id: rate-limiting-and-dos-defense-076
  difficulty: advanced
  tags: [slow-attacks, nginx, apache, knobs]
  question: |
    Which concrete configuration set most directly hardens a reverse proxy against the
    slow-HTTP family (slowloris, RUDY, slow read)?
  options:
  - "nginx client_header_timeout/client_body_timeout/send_timeout + limit_conn, or Apache mod_reqtimeout, enforcing per-phase timeouts, minimum data rates, and per-source connection caps"
  - "Increasing worker_processes and keepalive_timeout to very high values"
  - "Enabling gzip and HTTP/2 push"
  - "Setting a global requests-per-second rate limit only"
  answer: 0
  explanation: |
    Slow attacks are beaten by refusing to wait on trickling clients: nginx's
    client_header_timeout, client_body_timeout, and send_timeout (plus limit_conn) and
    Apache's mod_reqtimeout enforce per-phase timeouts and minimum data rates and cap
    concurrent connections per source. A req/sec limit alone does not help because the
    request count is low.
  ref: "concepts.md#slow-attack-family-slow-read-rudy-concrete-knobs"

- id: rate-limiting-and-dos-defense-077
  difficulty: expert
  tags: [breached-passwords, k-anonymity, nist]
  question: |
    The Pwned Passwords range API screens a password against a breach corpus without
    exposing it. How does the k-anonymity model work?
  options:
  - "The client sends the plaintext password over TLS and trusts the server to discard it"
  - "The client sends the full SHA-1 hash and the server returns yes/no"
  - "The client sends only the first 5 hex chars of the password's SHA-1 hash; the server returns all hash suffixes in that prefix bucket and the client matches locally, so the full credential never leaves"
  - "The server sends the entire breach list to the client to check offline"
  answer: 2
  explanation: |
    In the k-anonymity range model the client hashes the password (SHA-1) and sends only
    the 5-character prefix. The API returns every suffix sharing that prefix (thousands
    of candidates), and the client completes the match locally. The server learns only a
    prefix common to many hashes, never the password or full hash. NIST SP 800-63B
    requires screening passwords against known-breached lists.
  ref: "concepts.md#breached-credential-checks-and-login-throttling"

- id: rate-limiting-and-dos-defense-078
  difficulty: expert
  tags: [nist-800-63b, login-throttling, lockout]
  question: |
    Per NIST SP 800-63B, which authentication-throttling approach is recommended over a
    hard username-keyed lockout?
  options:
  - "Lock the account permanently after 3 failures and require an admin to unlock"
  - "Impose complex password-composition rules and force 30-day rotation"
  - "Rate-limit failed attempts (on the order of <=100 consecutive failures) with throttling/step-up such as CAPTCHA-on-risk and MFA, avoiding knowledge-based lockout that enables account-lockout DoS"
  - "Disable rate limiting so legitimate users are never inconvenienced"
  answer: 2
  explanation: |
    SP 800-63B advises limiting consecutive failed attempts (referencing an order of
    <=100 per account) and using throttling and risk-based step-up (CAPTCHA, MFA) rather
    than blunt username-keyed lockout, which an attacker can weaponize to lock out
    victims (account-lockout DoS). It also drops composition rules and routine rotation.
  ref: "concepts.md#breached-credential-checks-and-login-throttling"

- id: rate-limiting-and-dos-defense-079
  difficulty: advanced
  tags: [fingerprinting, ja3, bot-detection]
  question: |
    A request claims a common browser User-Agent, but its JA3/JA4 TLS fingerprint matches
    a scripting library. How should this signal be used?
  options:
  - "Immediately hard-block every request with that fingerprint as definitive proof of a bot"
  - "Ignore it, since TLS fingerprints are not related to bot detection"
  - "Feed the User-Agent/fingerprint mismatch into behavioral/anomaly risk scoring as a strong signal, while remembering fingerprints can be cloned so it should not be the sole basis for a hard block"
  - "Use it to set the rate-limit key, replacing the IP entirely"
  answer: 2
  explanation: |
    A mismatch between the claimed client and its JA3/JA4 (TLS) or HTTP/2 fingerprint
    strongly suggests automation, but fingerprints can be spoofed/cloned, so they are
    signals for risk/anomaly scoring rather than standalone verdicts. Combine them with
    behavior and reserve hard challenges for high-risk sessions.
  ref: "concepts.md#breached-credential-checks-and-login-throttling"
