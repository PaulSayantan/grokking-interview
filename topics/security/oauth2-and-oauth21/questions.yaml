topic: "OAuth 2.0 / 2.1 Delegated Authorization"
domain: security
topic_slug: oauth2-and-oauth21
version: 1
questions:
  - id: oauth2-and-oauth21-001
    difficulty: beginner
    tags: [fundamentals, authorization, authentication]
    question: |
      What problem is OAuth 2.0 primarily designed to solve?
    options:
      - "Encrypting the data stored at rest in the resource server's database using per-record symmetric keys"
      - "Letting a user grant a third-party app scoped, revocable access to their resources without sharing their password"
      - "Proving cryptographically which specific human is physically sitting at the keyboard during a session"
      - "Replacing TLS as the mechanism for securing data in transit between cooperating backend services"
    answer: 1
    explanation: |
      OAuth is a delegated authorization framework: the resource owner grants a client
      limited, revocable access via a scoped token instead of handing over credentials.
      It is not encryption, not transport security, and (on its own) not authentication.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-002
    difficulty: beginner
    tags: [fundamentals, authentication, oidc]
    question: |
      Why is using a plain OAuth access token to "log the user in" considered an
      anti-pattern?
    options:
      - "An access token conveys authorization, not verified identity, and carries no reliable claim about who the user is"
      - "Access tokens are always encrypted with the client secret and cannot be read or inspected by the client at all"
      - "Access tokens expire far too quickly (within a few seconds) to ever be useful for establishing a login session"
      - "OAuth explicitly forbids clients from calling any userinfo endpoint to look up who the current user actually is"
    answer: 0
    explanation: |
      An access token is a bearer of authorization ("what may this app do"), not an
      assertion of identity. Authenticating a user requires OpenID Connect's signed ID
      token (with aud, sub, nonce). Treating an access token as proof of login enables
      token-substitution/confused-deputy attacks.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-003
    difficulty: intermediate
    tags: [oidc, id-token, authentication]
    question: |
      Which artifact is specifically intended to authenticate the user *to the client*
      (prove who they are), as opposed to authorizing API calls?
    options:
      - "The OpenID Connect ID token (a signed JWT with aud, sub, nonce)"
      - "The OAuth access token, which the client decodes to read the user's verified name and email"
      - "The refresh token, which the client inspects to confirm the identity of the signed-in user"
      - "The authorization code, whose payload the client parses to authenticate who the user is"
    answer: 0
    explanation: |
      The ID token is OIDC's identity assertion, meant to be consumed by the client. The
      access token is for calling resource servers; the refresh token gets new access
      tokens; the code is a one-time exchange value. Only the ID token conveys verified
      identity to the client.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-004
    difficulty: beginner
    tags: [roles, architecture]
    question: |
      In OAuth terminology, what is the "resource owner"?
    options:
      - "The user who owns the data and can grant access to it"
      - "The server that issues access tokens after validating the client's grant"
      - "The API endpoint that stores and serves the protected data to clients"
      - "The third-party application requesting delegated access to the data"
    answer: 0
    explanation: |
      The resource owner is the user who owns the resources and can grant access. The API
      is the resource server, the token issuer is the authorization server, and the
      requesting app is the client.
    ref: "concepts.md#the-four-roles-and-the-endpoints"

  - id: oauth2-and-oauth21-005
    difficulty: intermediate
    tags: [roles, endpoints, channels]
    question: |
      Which statement about the authorization endpoint and token endpoint is correct?
    options:
      - "The authorization endpoint is browser-facing (front channel); the token endpoint is a back-channel server-to-server call"
      - "Both endpoints are back-channel, server-to-server calls that are completely invisible to the user's browser"
      - "The token endpoint is the page where the user types their account password directly into the client app"
      - "The authorization endpoint returns the final access token directly in the response body in all modern flows"
    answer: 0
    explanation: |
      The authorization endpoint is reached via browser redirect (front channel, where
      the user consents); the token endpoint is a direct back-channel HTTPS call where
      codes/credentials are exchanged for tokens. Front-channel values are visible in
      URLs/logs, which is why only a short-lived code travels there.
    ref: "concepts.md#the-four-roles-and-the-endpoints"

  - id: oauth2-and-oauth21-006
    difficulty: intermediate
    tags: [roles, confidential, public]
    question: |
      What distinguishes a "confidential" client from a "public" client?
    options:
      - "A confidential client can securely keep a client secret; a public client (SPA/mobile) cannot"
      - "Public clients are required to use HTTPS, whereas confidential clients are permitted to fall back to plain HTTP"
      - "Confidential clients are always written in compiled languages, while public clients are written in interpreted ones"
      - "Confidential clients are by definition first-party apps, while public clients are always operated by third parties"
    answer: 0
    explanation: |
      The defining question is whether the client can protect a secret. Server-side apps
      can (confidential); browser SPAs and native/mobile apps ship code to the user and
      cannot (public), so they authenticate with PKCE instead of a secret.
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-007
    difficulty: beginner
    tags: [grants, authorization-code, pkce]
    question: |
      In OAuth 2.1, which grant (with PKCE) is the default for both public and
      confidential clients?
    options:
      - "Implicit grant"
      - "Resource owner password credentials grant"
      - "Authorization code grant"
      - "Client credentials grant"
    answer: 2
    explanation: |
      OAuth 2.1 makes authorization code + PKCE the default for all client types.
      Implicit and ROPC are removed; client credentials is only for machine-to-machine
      with no user.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-008
    difficulty: intermediate
    tags: [authorization-code, flow]
    question: |
      In the authorization code flow, what does the authorization endpoint return to the
      client's redirect_uri after the user consents?
    options:
      - "The access token directly, embedded as a query parameter on the redirect_uri"
      - "The user's password, encrypted with the client secret, for the client to reuse later"
      - "A short-lived, single-use authorization code (plus the state value)"
      - "The refresh token in the URL fragment, so the client can mint tokens immediately"
    answer: 2
    explanation: |
      The front channel returns only a short-lived, single-use code (and the state). The
      client then exchanges the code for tokens over the back channel. No tokens travel on
      the front channel in the modern flow.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-009
    difficulty: advanced
    tags: [authorization-code, replay, security]
    question: |
      An authorization server sees the same authorization code presented twice at the
      token endpoint. What is the recommended response?
    options:
      - "Treat it as a possible interception: reject and revoke tokens already issued for that code"
      - "Silently ignore the second request but keep the first set of issued tokens fully valid"
      - "Issue a second, identical set of tokens for the second request as a convenience to the client"
      - "Extend the authorization code's lifetime so that both redemption requests succeed normally"
    answer: 0
    explanation: |
      Authorization codes are single-use. Double redemption signals the code may have been
      intercepted, so the AS should reject the second exchange and revoke tokens already
      issued for that code.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-010
    difficulty: intermediate
    tags: [pkce, code-challenge]
    question: |
      In PKCE with method S256, how is the code_challenge derived from the code_verifier?
    options:
      - "code_challenge = BASE64URL(SHA-256(code_verifier))"
      - "code_challenge = code_verifier (they are identical)"
      - "code_challenge = AES-encrypt(code_verifier) with the client secret"
      - "code_challenge = the client_id concatenated with the code_verifier"
    answer: 0
    explanation: |
      With S256, the challenge is the base64url-encoded SHA-256 hash of the verifier.
      Because the hash is one-way, an attacker who sees the challenge (on the front
      channel) cannot derive the verifier. With method 'plain' they would be identical —
      which is why plain is discouraged.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-011
    difficulty: intermediate
    tags: [pkce, attack, mobile]
    question: |
      PKCE was created to defend against which specific attack?
    options:
      - "SQL injection against the authorization server's token endpoint database queries"
      - "Cross-site scripting injected into the rendered user consent screen at the authorization server"
      - "Brute-forcing the resource owner's account password at the authorization server's login endpoint"
      - "Authorization code interception (e.g., a malicious app on the same device grabbing the redirect)"
    answer: 3
    explanation: |
      On mobile, a malicious app can register the same custom URL scheme and intercept the
      redirect containing the code. PKCE makes the intercepted code useless because the
      attacker lacks the code_verifier needed at token exchange.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-012
    difficulty: intermediate
    tags: [pkce, s256, plain]
    question: |
      Why should a PKCE-capable client use code_challenge_method=S256 rather than plain?
    options:
      - "The plain method is not supported by any conforming OAuth authorization server implementation"
      - "S256 is significantly faster to compute at token exchange than the plain comparison method"
      - "With plain the challenge equals the verifier, so intercepting the front-channel request leaks the secret"
      - "The plain method requires the client to also present a client secret, while S256 does not need one"
    answer: 2
    explanation: |
      With method=plain, the code_challenge is the code_verifier verbatim, so an attacker
      who intercepts the /authorize request learns the verifier and defeats PKCE. S256
      sends only a one-way hash. OAuth 2.1: if capable of S256, the client MUST use S256.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-013
    difficulty: advanced
    tags: [pkce, downgrade, authorization-server]
    question: |
      Which authorization-server behavior would silently defeat PKCE protection?
    options:
      - "Requiring the code_verifier to be between 43 and 128 characters of high-entropy randomness"
      - "Rejecting any authorization code that has already been redeemed once at the token endpoint"
      - "Binding the issued authorization code to the exact redirect_uri presented in the request"
      - "Accepting a token exchange with no code_verifier for a code that was created with a code_challenge"
    answer: 3
    explanation: |
      If the AS lets a code created with a challenge be redeemed without a matching
      verifier, PKCE is bypassed (a downgrade). The AS must enforce that a code with a
      challenge is only redeemable with the correct verifier.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-014
    difficulty: intermediate
    tags: [client-credentials, m2m]
    question: |
      When is the client credentials grant appropriate?
    options:
      - "Machine-to-machine access where the client acts on its own behalf and no user is involved"
      - "A single-page app that needs to read the currently logged-in user's profile and contact list"
      - "A mobile app logging an end user in for the very first time and establishing their session"
      - "Any interactive flow where you simply want to skip the consent screen for a human resource owner"
    answer: 0
    explanation: |
      Client credentials is for service-to-service access with no resource owner — the
      client authenticates with its own credentials. It is only for confidential clients
      and has no user consent and no refresh token.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-015
    difficulty: intermediate
    tags: [client-credentials, refresh-token]
    question: |
      Which statement about the client credentials grant is correct?
    options:
      - "It issues no refresh token; the client simply re-authenticates with its own credentials when needed"
      - "It is perfectly safe to use directly from a browser-based SPA because there is no user involved"
      - "It returns a long-lived refresh token so the client can avoid re-authenticating on every call"
      - "It requires the resource owner's account password to be included in the token request body"
    answer: 0
    explanation: |
      There is no refresh token in client credentials — the client can re-authenticate any
      time with its own credentials. It is only for confidential clients (never a browser
      SPA), and no user password is involved.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-016
    difficulty: advanced
    tags: [client-credentials, client-auth]
    question: |
      Which is a stronger form of client authentication for the client credentials grant
      than a shared client secret?
    options:
      - "Sending the same shared secret in the request query string instead of the POST body"
      - "Base64-encoding the shared client secret twice before placing it in the request"
      - "private_key_jwt or mTLS (certificate-bound) client authentication"
      - "Putting the shared secret in a custom HTTP request header named X-Secret instead"
    answer: 2
    explanation: |
      private_key_jwt (RFC 7523) has the client sign a JWT assertion with its private key,
      and mTLS (RFC 8705) binds the token to the client certificate. Both are stronger
      than a shared secret and avoid transmitting a reusable secret.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-017
    difficulty: beginner
    tags: [device-grant, iot]
    question: |
      The OAuth device authorization grant (RFC 8628) is designed for what kind of client?
    options:
      - "High-traffic web servers behind a load balancer that terminate TLS for many users at once"
      - "Confidential machine-to-machine backend services acting on their own behalf with no user present"
      - "Single-page apps running in a full desktop browser that can freely open redirect windows"
      - "Input-constrained devices like smart TVs, CLIs, and IoT that can't easily show a browser"
    answer: 3
    explanation: |
      The device grant lets an input-constrained device display a short user_code and URL,
      while the user completes authentication on a secondary device (phone/laptop) with a
      real browser.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-018
    difficulty: intermediate
    tags: [device-grant, polling]
    question: |
      After showing the user_code, how does a device using the device grant obtain its
      tokens?
    options:
      - "It receives the tokens instantly, embedded in the initial device authorization response body"
      - "It polls the token endpoint with the device_code until the user approves, honoring the interval and slow_down responses"
      - "The user manually reads the access token off the phone and types it into the constrained device"
      - "The authorization server pushes the issued tokens down to the device over an open WebSocket connection"
    answer: 1
    explanation: |
      The device polls the token endpoint with grant_type device_code, receiving
      authorization_pending until approval, and must back off on slow_down and respect the
      interval to avoid abuse.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-019
    difficulty: advanced
    tags: [device-grant, phishing]
    question: |
      What is a notable threat specific to the device authorization grant?
    options:
      - "The device_code the client polls with is always written to the authorization server's access logs in plaintext, letting any log reader replay it"
      - "The grant requires the resource owner to type their account password directly into the input-constrained device, which then forwards it to the token endpoint"
      - "Because approval happens on a separate device, an attacker can trick a victim into entering the attacker's user_code, capturing the victim's authorization"
      - "Access tokens issued through the device grant are permanently non-revocable because RFC 8628 omits any linkage to the authorization server's revocation endpoint"
    answer: 2
    explanation: |
      The out-of-band approval enables social engineering: an attacker displays their own
      user_code and lures the victim to approve it, hijacking the grant. Mitigations
      include short expiry, clear consent screens, and rate-limiting user_code entry.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-020
    difficulty: beginner
    tags: [implicit, deprecated, oauth21]
    question: |
      What happened to the implicit grant in OAuth 2.1?
    options:
      - "It became the officially recommended grant for all single-page apps because it avoids the extra token-endpoint round trip"
      - "It was renamed to the client credentials grant and repurposed for machine-to-machine, no-user scenarios"
      - "It was made mandatory for native mobile apps that cannot open a full system browser window"
      - "It was removed; SPAs should use authorization code + PKCE instead"
    answer: 3
    explanation: |
      OAuth 2.1 removes the implicit grant. It returned tokens directly in the URL
      fragment (front channel), where they leak and are instantly replayable. The
      replacement is authorization code + PKCE.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-021
    difficulty: intermediate
    tags: [implicit, token-leakage]
    question: |
      Why was returning the access token in the URL fragment (implicit grant) considered
      dangerous?
    options:
      - "URL fragments are always transmitted to the origin server and permanently persisted in the resource server's request-logging database"
      - "The fragment portion of a URL is unreadable by page JavaScript, so the client app could never actually extract or use the returned token"
      - "The fragment is transparently encrypted by the browser with the client secret, preventing the legitimate client from ever decrypting it"
      - "The token sat on the front channel, exposed to browser history, Referer headers, and any script that could read the fragment, with no proof-of-possession"
    answer: 3
    explanation: |
      A token in the fragment is exposed via history, Referer, and page scripts, and being
      a bearer token with no client authentication, a leaked one is immediately replayable.
      That is why implicit is removed in 2.1.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-022
    difficulty: intermediate
    tags: [ropc, deprecated, password]
    question: |
      Why is the Resource Owner Password Credentials (ROPC) grant discouraged and removed
      in OAuth 2.1?
    options:
      - "The extra password round trip makes it far too slow to meet the latency budgets of modern high-throughput APIs"
      - "It reintroduces the password anti-pattern (the client handles the raw credentials) and is incompatible with MFA and federated login"
      - "It mandates a confidential client secret in the request body, which browser and mobile public clients are unable to store safely"
      - "It is defined to operate exclusively over plaintext HTTP and cannot be carried over a TLS-secured connection"
    answer: 1
    explanation: |
      ROPC has the client collect and send the user's raw username/password, exactly the
      anti-pattern OAuth was built to avoid, and it breaks MFA, federation, and step-up
      auth because there is no interactive browser step.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-023
    difficulty: intermediate
    tags: [oauth21, migration, grants]
    question: |
      A team says "let's use the implicit or ROPC grant because it's simpler." What is the
      best guidance?
    options:
      - "Use implicit for single-page apps and ROPC for mobile clients — both remain fully recommended in the current specifications"
      - "Both are removed in OAuth 2.1 and discouraged by the Security BCP; migrate to authorization code + PKCE"
      - "Keep using ROPC as long as every request is carried over an HTTP/2 connection with header compression enabled"
      - "Keep using implicit but persist the returned token in browser localStorage, which fully mitigates the front-channel exposure"
    answer: 1
    explanation: |
      Both grants are removed in OAuth 2.1 and discouraged by RFC 9700. The correct path
      for SPAs and mobile apps alike is authorization code + PKCE.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-024
    difficulty: intermediate
    tags: [redirect-uri, exact-match]
    question: |
      What does OAuth 2.1 require regarding redirect_uri validation at the authorization
      server?
    options:
      - "Compare only the hostname component of the registered URI, ignoring the scheme, path, and query for flexibility"
      - "Accept any URI served from the same registered domain, regardless of the specific path or subdomain used"
      - "Exact string matching against a pre-registered redirect_uri (loopback ports on native apps excepted)"
      - "Permit trailing wildcard suffixes on the registered URI so that arbitrary subpaths are matched flexibly"
    answer: 2
    explanation: |
      OAuth 2.1 mandates exact string matching of redirect_uri against registered values,
      rejecting anything that doesn't match exactly (loopback ports for native apps are the
      exception). Loose/wildcard matching enables open-redirect code theft.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-025
    difficulty: advanced
    tags: [redirect-uri, open-redirect, attack]
    question: |
      An AS matches redirect_uri only on the host app.example.com. An attacker sends
      redirect_uri=https://app.example.com/redirect?next=https://evil.com/steal, and
      /redirect is an open redirector. What is the risk?
    options:
      - "None — because the code is initially delivered to the legitimate app.example.com host, the presence of the open redirector introduces no additional exposure"
      - "The authorization code is delivered to app.example.com and then bounced by the open redirector to evil.com, exfiltrating it"
      - "The authorization server will reject the entire request because the redirect_uri points at an HTTPS endpoint that also carries a next query parameter"
      - "The resource owner's account password is forwarded to evil.com in cleartext along with the code once the open redirector fires"
    answer: 1
    explanation: |
      Loose host-only matching plus an open redirector on the legitimate domain lets the
      code be handed off to the attacker's site. Defense: exact-match the full URI
      (including path) and eliminate open redirectors on OAuth-hosting domains.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-026
    difficulty: advanced
    tags: [mix-up, multiple-as, iss]
    question: |
      Which defense specifically mitigates the OAuth "mix-up" attack when a client
      supports multiple authorization servers?
    options:
      - "Configuring every client with a longer, higher-entropy client secret shared across all of its authorization servers"
      - "Increasing the access-token lifetime so fewer cross-server token exchanges are needed during a session"
      - "The AS returning an iss (issuer) parameter in the authorization response that the client verifies (RFC 9207)"
      - "Disabling PKCE for authorization servers the client has explicitly marked as trusted to reduce flow complexity"
    answer: 2
    explanation: |
      In a mix-up attack the client is confused about which AS a response came from. RFC
      9207's iss parameter lets the client confirm the response came from the AS it started
      with; using distinct redirect URIs per AS also helps.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-027
    difficulty: beginner
    tags: [state, csrf]
    question: |
      What is the primary purpose of the state parameter in the authorization request?
    options:
      - "To carry the issued access token back to the client on the redirect so it can call the API immediately"
      - "To protect the callback against CSRF by tying the response to the session that started the flow"
      - "To enumerate the set of permission scopes the client is requesting for the issued token"
      - "To symmetrically encrypt the authorization code so it cannot be read while on the front channel"
    answer: 1
    explanation: |
      state is an unguessable value the client sends and later verifies on the callback,
      ensuring the callback belongs to a flow this browser session initiated — i.e. CSRF
      protection on the authorization response.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-028
    difficulty: advanced
    tags: [state, csrf, attack]
    question: |
      Without state (or PKCE) validation, how can an attacker abuse the callback?
    options:
      - "By reading the confidential client's secret out of the redirect URL where the callback places it for convenience"
      - "By forcing the authorization server to downgrade the callback connection from HTTPS to plaintext so it can be sniffed"
      - "By obtaining a code for their own account and tricking the victim's browser into completing the flow, silently linking/logging the victim into the attacker's account"
      - "By capturing the callback and brute-forcing the returned access token offline using a precomputed rainbow table"
    answer: 2
    explanation: |
      This is login-CSRF: the attacker injects their own authorization code into the
      victim's callback. Without state binding the client accepts it, associating the
      victim's session/data with the attacker's account. state (or PKCE) prevents the
      foreign code from matching the session.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-029
    difficulty: intermediate
    tags: [state, nonce, oidc]
    question: |
      What is the difference between state (OAuth) and nonce (OIDC)?
    options:
      - "They are simply two different names for the exact same value, interchangeable across the OAuth and OIDC specifications"
      - "state protects the integrity of the ID token's signature, whereas nonce protects the access token from being replayed"
      - "state provides CSRF protection on the OAuth callback; nonce provides replay protection on the OIDC ID token"
      - "nonce is validated by the resource server on each API call, while state is validated at the token endpoint during exchange"
    answer: 2
    explanation: |
      state correlates the authorization request and callback to stop CSRF. nonce is placed
      in the request and echoed inside the signed ID token to stop ID-token replay. They
      solve different problems.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-030
    difficulty: intermediate
    tags: [state, best-practice]
    question: |
      Which is a correct practice for the state parameter?
    options:
      - "Embed secrets such as the client secret inside the state value so they round-trip back to the client for convenience"
      - "Generate a random, per-session value, bind it to the session, and reject callbacks whose state doesn't match"
      - "Reuse a single fixed, static state value across every authorization request to keep server-side validation logic simple"
      - "Send the state parameter only on the back-channel token request rather than on the front-channel authorization request"
    answer: 1
    explanation: |
      state must be random, session-bound, and validated on the callback. It travels on the
      front channel, so never put secrets in it, and never reuse a static value (that
      defeats its CSRF purpose).
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-031
    difficulty: beginner
    tags: [tokens, access-token, refresh-token]
    question: |
      Which best describes the difference between an access token and a refresh token?
    options:
      - "Access tokens are the long-lived credential, while refresh tokens are single-use codes delivered to the client on the front channel"
      - "They are fully interchangeable credentials, so either one may be presented to the resource server to call the API"
      - "Access tokens are presented to the resource server and are short-lived; refresh tokens are long-lived and used at the token endpoint to get new access tokens"
      - "Refresh tokens are attached in the Authorization header and sent to the resource server on every single API call"
    answer: 2
    explanation: |
      Access tokens are short-lived and presented to the RS (Authorization: Bearer).
      Refresh tokens are long-lived and sent only to the token endpoint (back channel) to
      mint new access tokens without re-prompting the user.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-032
    difficulty: intermediate
    tags: [bearer-token, header, rfc6750]
    question: |
      How should a bearer access token be sent to a resource server per RFC 6750 and
      OAuth 2.1?
    options:
      - "As a query-string parameter appended to the request URL, for example ?access_token=... so it is easy to log"
      - "Inside a browser cookie named oauth_token that is automatically attached to every request to the resource server"
      - "In the URL fragment after the # character, matching the transport used by the legacy implicit grant"
      - "In the Authorization request header: Authorization: Bearer <token>"
    answer: 3
    explanation: |
      The Authorization: Bearer header is the correct transport. The query string is
      forbidden because URLs leak via logs, history, and Referer. Fragments are for the
      removed implicit grant.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-033
    difficulty: intermediate
    tags: [bearer-token, replay, risk]
    question: |
      What is the key security weakness of a plain bearer access token?
    options:
      - "It is strictly single-use, so it is consumed and invalidated by the resource server on the very first API call"
      - "It cannot be carried over a TLS-secured connection and must be sent over a separate plaintext side channel"
      - "Anyone who obtains it can use it until it expires, since it requires no proof of possession"
      - "It must first be decrypted by the resource server using the client secret before any of its claims can be read"
    answer: 2
    explanation: |
      A bearer token is like cash: possession equals authorization. A stolen bearer token
      is fully usable until expiry. Mitigations: short lifetimes, narrow scope, TLS, and
      sender-constraining (DPoP/mTLS).
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-034
    difficulty: advanced
    tags: [resource-server, token-validation]
    question: |
      How does a resource server validate an incoming token?
    options:
      - "Accept any token whose payload cleanly decodes as valid base64url, treating successful decoding as sufficient proof of validity"
      - "For a JWT, verify the signature via JWKS and check iss/aud/exp/scope; for an opaque token, call the AS introspection endpoint (RFC 7662)"
      - "Check only that the token's exp claim has not passed, skipping signature, issuer, and audience verification entirely"
      - "Forward the incoming token back to the end user's browser and wait for the user to confirm it belongs to them"
    answer: 1
    explanation: |
      A JWT access token is validated by signature (via the AS's JWKS) plus claim checks
      (issuer, audience, expiry, scope). An opaque token is validated by calling the AS's
      introspection endpoint. Decoding alone proves nothing.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-035
    difficulty: intermediate
    tags: [refresh-token, rotation]
    question: |
      What does refresh token rotation mean?
    options:
      - "The stored refresh token value is re-encrypted every hour under a freshly derived server-side key while its string value stays the same"
      - "Each time a refresh token is used, the AS issues a new one and invalidates the old, making each refresh token effectively single-use"
      - "The refresh token's granted scope set is randomized on each use so that no two refreshes return the same permissions"
      - "The client is issued two refresh tokens up front and alternates between them on successive requests to spread load"
    answer: 1
    explanation: |
      With rotation, using a refresh token returns a fresh refresh token and revokes the
      prior one. This makes refresh tokens single-use and enables reuse detection.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-036
    difficulty: advanced
    tags: [refresh-token, reuse-detection, theft]
    question: |
      With rotation enabled, an already-consumed refresh token is presented again. What
      should the AS do and why?
    options:
      - "Silently issue a fresh set of tokens and continue, since replaying an already-consumed refresh token is expected client behavior"
      - "Extend the lifetime of the previously-issued refresh token so the replay request is able to succeed normally"
      - "Revoke the entire token family, because a replayed (already-used) refresh token signals theft"
      - "Downgrade the client to the implicit grant so subsequent token requests bypass the refresh mechanism entirely"
    answer: 2
    explanation: |
      A stale refresh token being replayed means either the attacker or the legitimate
      client is using a stolen copy. The AS revokes the whole rotation chain (family),
      cutting off the attacker and forcing re-authentication.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-037
    difficulty: advanced
    tags: [refresh-token, oauth21, public-client]
    question: |
      What does OAuth 2.1 require for refresh tokens issued to public clients?
    options:
      - "They must never be issued to public clients under any circumstance"
      - "They must be persisted in browser localStorage so a reloaded page keeps the session"
      - "They must be given a fixed minimum lifetime of at least one calendar year"
      - "They must be either sender-constrained or rotated with reuse detection"
    answer: 3
    explanation: |
      Because public clients can't protect a long-lived secret, OAuth 2.1 requires their
      refresh tokens to be sender-constrained (e.g. DPoP) or rotated with reuse detection.
      Refresh tokens must also be bound to the consented scope/audience.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-038
    difficulty: advanced
    tags: [refresh-token, race-condition]
    question: |
      What operational problem can naive refresh token rotation cause for legitimate
      clients?
    options:
      - "Rotation permanently disables the revocation endpoint, leaving every issued token impossible to revoke"
      - "The authorization server is forced to clamp every access token's lifetime down to exactly zero seconds"
      - "Each rotation silently escalates the granted scope set, handing the client broader permissions over time"
      - "Concurrent requests (e.g. two browser tabs refreshing at once) can replay a rotating token and trigger false-positive family revocation"
    answer: 3
    explanation: |
      Concurrent legitimate refreshes can look like reuse, causing false lockouts.
      Implementations add a short grace window allowing the immediately-preceding token
      briefly, while still catching genuine reuse.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-039
    difficulty: beginner
    tags: [scopes, least-privilege]
    question: |
      What is an OAuth scope?
    options:
      - "The allowlisted IP address range from which the issued token is permitted to be presented"
      - "The absolute expiry timestamp baked into the access token when it is minted"
      - "A space-delimited set of permissions the client requests, shown at consent and limiting the issued token"
      - "The client's globally unique registered identifier string assigned at onboarding"
    answer: 2
    explanation: |
      A scope is a permission label (e.g. contacts.read). The AS displays requested scopes
      at consent and limits the token to what was granted, implementing least privilege for
      delegated access.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-040
    difficulty: intermediate
    tags: [scopes, authorization, api]
    question: |
      Which statement about scopes and resource-server authorization is correct?
    options:
      - "A granted scope completely replaces the resource server's per-object ownership and access checks"
      - "Scopes are coarse authorization; the resource server must still enforce fine-grained checks (e.g. that the user owns the specific object)"
      - "Scopes are chosen unilaterally by the client at runtime with no authorization-server involvement or consent step"
      - "Holding the files.write scope authorizes the client to overwrite the files of any user on the platform"
    answer: 1
    explanation: |
      A scope like files.write says the client may write files in general; the RS must
      still verify which files this user is allowed to touch. Confusing scope with
      object-level authz is a classic broken-authorization bug.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-041
    difficulty: intermediate
    tags: [scopes, granted-vs-requested]
    question: |
      A client requests scope="contacts.read files.write" but the user only approves
      contacts.read. What happens?
    options:
      - "The AS aborts and rejects the entire authorization request as malformed"
      - "The issued token silently includes files.write anyway despite the user declining it"
      - "The token is issued for the granted scope (contacts.read), and the response includes a scope field reflecting the down-scoping"
      - "The client must resubmit the whole request accompanied by its confidential client secret"
    answer: 2
    explanation: |
      Granted scope can be narrower than requested. The token reflects only what was
      granted, and the token response carries a scope field when it differs. Clients must
      handle down-scoping gracefully.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-042
    difficulty: beginner
    tags: [token-leakage, referrer, logs]
    question: |
      Which of these is a real channel through which a token or code in a URL can leak?
    options:
      - "The Referer header sent to third-party resources loaded by the page"
      - "The ephemeral TLS session key negotiated between browser and server during the handshake"
      - "The client's private signing key held in its server-side keystore"
      - "The database B-tree index maintained on the authorization server's tokens table"
    answer: 0
    explanation: |
      A URL containing a code/token can leak via the Referer header (to third-party JS,
      images, analytics), browser history, and server/proxy logs. These are the reasons
      secrets must not ride in query strings or fragments.
    ref: "concepts.md#token-leakage-via-referrer-logs-and-browser-history"

  - id: oauth2-and-oauth21-043
    difficulty: intermediate
    tags: [token-leakage, referrer-policy, defense]
    question: |
      Which set of defenses best reduces token/code leakage from the OAuth callback page?
    options:
      - "Append the access token to the query string and log every incoming request in full for later auditing"
      - "Disable TLS on the callback endpoint to make request inspection and debugging easier during development"
      - "Deliberately retain the authorization code in browser history so support staff can audit past logins"
      - "Set Referrer-Policy: no-referrer, strip the code from the URL after handling it, and never place tokens in query strings"
    answer: 3
    explanation: |
      Setting a strict Referrer-Policy prevents Referer leaks, removing the code from the
      URL (redirect to a clean URL / replaceState) keeps it out of history, and keeping
      tokens out of query strings avoids log/history exposure.
    ref: "concepts.md#token-leakage-via-referrer-logs-and-browser-history"

  - id: oauth2-and-oauth21-044
    difficulty: beginner
    tags: [sender-constrained, dpop, mtls]
    question: |
      What is the goal of a sender-constrained (proof-of-possession) access token?
    options:
      - "To make the token's claims fully human-readable without any decoding step"
      - "To remove the need for TLS on the connection carrying the token"
      - "To bind the token to a key the legitimate client holds, so a stolen token is useless without the private key"
      - "To extend the token's usable lifetime well beyond the normal expiry window"
    answer: 2
    explanation: |
      Sender-constraining cryptographically binds the token to the client's key
      (certificate for mTLS, key pair for DPoP). Unlike a bearer token, a stolen one can't
      be replayed without the corresponding private key.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-045
    difficulty: advanced
    tags: [dpop, rfc9449, proof]
    question: |
      In DPoP (RFC 9449), how does the resource server confirm the caller holds the right
      key?
    options:
      - "It verifies the signed DPoP proof JWT and checks that its key thumbprint matches the cnf/jkt claim in the access token"
      - "It simply trusts the client_id value embedded in the access token as proof of key possession"
      - "It confirms only that the token string is well-formed base64url and decodes cleanly"
      - "It re-runs the full authorization code exchange against the AS on every incoming request"
    answer: 0
    explanation: |
      The access token carries a cnf claim with the thumbprint (jkt) of the client's public
      key. Each request includes a DPoP proof JWT (with htm, htu, iat, jti) signed by the
      client's private key; the RS verifies the signature and that the thumbprint matches.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-046
    difficulty: intermediate
    tags: [mtls, rfc8705, sender-constrained]
    question: |
      How does mTLS-based certificate-bound token binding (RFC 8705) work?
    options:
      - "The access token is encrypted end-to-end with the resource server's published public key"
      - "The client transmits its raw private key inside the Authorization request header on each call"
      - "The authorization server turns off TLS client-certificate validation for bound tokens"
      - "The token embeds the client certificate thumbprint, and the RS checks it matches the client cert on the current TLS connection"
    answer: 3
    explanation: |
      With mTLS binding, the token carries the client-certificate thumbprint (cnf x5t#S256),
      and the resource server verifies the certificate presented on the mutually
      authenticated TLS connection matches it, so the token is bound to that client.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-047
    difficulty: advanced
    tags: [spa, token-storage, xss]
    question: |
      A single-page app stores its access and refresh tokens in localStorage. What is the
      main risk?
    options:
      - "localStorage is automatically cleared on every page load, silently breaking the user's session"
      - "Tokens held in localStorage are technically ineligible to be placed in the Authorization header"
      - "Any XSS on the page can read localStorage and exfiltrate every token"
      - "Values written to localStorage are transparently shared across all origins the browser visits"
    answer: 2
    explanation: |
      localStorage is readable by any JavaScript on the origin, so a single XSS steals all
      stored tokens. Safer options are in-memory storage, HttpOnly cookies via a backend,
      or a BFF that keeps tokens off the front end entirely.
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-048
    difficulty: advanced
    tags: [bff, browser-apps, best-practice]
    question: |
      What is the Backend-For-Frontend (BFF) pattern's security benefit for browser apps?
    options:
      - "It allows the single-page app to embed and store the client secret safely within its JavaScript bundle"
      - "It completely removes the need for both PKCE and the state parameter in the flow"
      - "It relocates all access-token signature validation into the browser to gain speed"
      - "A server-side component holds the tokens and the browser holds only an HttpOnly session cookie, keeping tokens out of reach of front-end JS/XSS"
    answer: 3
    explanation: |
      In the BFF pattern, tokens live server-side and the browser only carries an HttpOnly
      session cookie; the BFF attaches the access token to API calls. This removes tokens
      from front-end JavaScript, neutralizing XSS token theft (CSRF defenses still needed).
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-049
    difficulty: intermediate
    tags: [redirect-uri, code-binding]
    question: |
      Besides exact matching, what additional redirect_uri protection does the
      authorization code flow apply?
    options:
      - "It symmetrically encrypts the redirect_uri using the resource owner's account password"
      - "It permits the client to substitute any different redirect_uri it likes at the token-exchange step"
      - "It binds the code to the redirect_uri used at authorization and requires the same value at token exchange"
      - "It appends the freshly issued access token onto the redirect_uri as a query parameter"
    answer: 2
    explanation: |
      RFC 6749 §4.1.3 requires the redirect_uri presented at token exchange to match the one
      from the authorization request, binding the code to its intended destination and
      closing certain code-injection/redirect paths.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-050
    difficulty: intermediate
    tags: [scopes, audience, rfc8707]
    question: |
      Why combine scopes with a resource/audience indicator (RFC 8707) rather than issuing
      one token every service accepts?
    options:
      - "To pad tokens to a larger byte size that is statistically harder for an attacker to guess"
      - "Because the OAuth spec forbids requesting any scope unless an audience is also supplied"
      - "To eliminate the requirement for TLS on connections between the cooperating backend services"
      - "To limit a token's validity to the intended resource server, reducing replay damage if one RS is compromised"
    answer: 3
    explanation: |
      Audience-restricting a token (RFC 8707) means a token accepted by service A can't be
      replayed against service B. A single god-token accepted everywhere maximizes blast
      radius if it leaks or an RS is compromised.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-051
    difficulty: advanced
    tags: [code-injection, pkce, attack]
    question: |
      How does authorization-code injection (RFC 9700 §4.5) differ from code interception,
      and why does PKCE stop it?
    options:
      - "Injection requires the attacker to present a valid client secret, and PKCE conveniently supplies that secret so the attack simply fails"
      - "Injection is a leaked/stolen code replayed into a session, and PKCE fails it because the injected code lacks the code_verifier generated by the session that started the flow"
      - "They are merely two names for one identical attack, and both are fully neutralized by enforcing TLS on the front channel"
      - "Injection can only ever affect the device authorization grant, which by design never participates in the PKCE exchange"
    answer: 1
    explanation: |
      Interception steals a code before redemption; injection replays a code the attacker
      obtained (via a leak/mix-up) into their own legitimate client session. PKCE binds the
      code to the browser instance that generated the code_verifier, so an injected code in
      a session with a different verifier fails the S256 check. OIDC nonce gives the
      equivalent binding for the identity leg — which is why 2.1 mandates PKCE for
      confidential clients too.
    ref: "concepts.md#authorization-code-injection-distinct-from-interception"

  - id: oauth2-and-oauth21-052
    difficulty: expert
    tags: [par, rfc9126, hardening]
    question: |
      What is the primary security benefit of Pushed Authorization Requests (PAR, RFC 9126)
      beyond exact redirect_uri matching?
    options:
      - "It permits public clients to omit PKCE entirely because the pushed request is already client-authenticated"
      - "It encrypts the issued access token so that only the intended resource server is able to decrypt it"
      - "The client POSTs request parameters to the AS over the back channel as an authenticated client, so front-channel parameter/redirect_uri tampering is eliminated"
      - "It replaces the short-lived authorization code with a long-lived bearer token returned up front"
    answer: 2
    explanation: |
      With PAR the client submits parameters to /par over the back channel (authenticating
      itself) and receives a one-time request_uri; the browser carries only that reference.
      Because the request is bound to an authenticated client, an attacker cannot tamper with
      redirect_uri or other params on the URL. PAR complements, not replaces, PKCE.
    ref: "concepts.md#par-jar-and-jarm-hardening-the-request-and-response"

  - id: oauth2-and-oauth21-053
    difficulty: expert
    tags: [jarm, jar, response-integrity]
    question: |
      A FAPI-grade design uses JAR, PAR, and JARM. Which statement correctly assigns their
      roles?
    options:
      - "JAR signs the request object, PAR pushes the request over the back channel, and JARM signs the authorization response"
      - "JAR signs the response, PAR signs the request, and JARM pushes tokens"
      - "All three replace PKCE and make it unnecessary"
      - "JARM encrypts the access token, JAR rotates refresh tokens, and PAR validates scopes"
    answer: 0
    explanation: |
      JAR (RFC 9101) carries request params in a signed JWT; PAR (RFC 9126) pushes the
      request to the AS over the back channel for a request_uri reference; JARM (OpenID)
      wraps the authorization response in a signed JWT with iss/aud/exp. They harden the
      request/push/response legs and are used together with PKCE, not instead of it.
    ref: "concepts.md#par-jar-and-jarm-hardening-the-request-and-response"

  - id: oauth2-and-oauth21-054
    difficulty: expert
    tags: [jwt, algorithm-confusion, resource-server]
    question: |
      An AS signs JWT access tokens with RS256 and publishes the RSA public key via JWKS.
      The RS verifies with a library that reads the algorithm from the token header. What is
      the exploit and the correct fix?
    options:
      - "There is no exploit here — the JWS specification actually mandates that a verifier read the algorithm directly from the token header"
      - "The attacker sets the header to alg=none to strip the signature entirely; the fix is simply to require a longer RSA modulus such as 4096 bits"
      - "The attacker changes alg to HS256 and signs a forged token using the RSA public key bytes as the HMAC secret; fix by pinning the expected algorithm server-side rather than trusting the header"
      - "The attacker brute-forces the RSA private key offline from the published modulus; the fix is to rotate the signing key on an hourly schedule"
    answer: 2
    explanation: |
      RS256->HS256 key confusion: because the public key is known, the attacker signs a token
      with HS256 using that public key as the HMAC secret, and a header-trusting verifier
      accepts it. The fix is to pin the expected algorithm (do not trust the header alg) and
      keep keys separated by algorithm.
    ref: "concepts.md#jwt-validation-attacks-at-the-resource-server"

  - id: oauth2-and-oauth21-055
    difficulty: expert
    tags: [jwt, jku, jwk, key-injection]
    question: |
      Why must a resource server ignore the jwk and jku headers of an incoming JWT access
      token?
    options:
      - "Because the jwk and jku headers inflate the token beyond the 8 KB Authorization-header limit, so resource servers truncate and reject it"
      - "Because an attacker can embed their own key (jwk) or point jku at a URL they control, so the token 'verifies' against an attacker-supplied key"
      - "Because the jwk and jku header parameters are defined by the spec to be legal only inside JWE-encrypted tokens, never signed JWS ones"
      - "Because the jwk and jku headers merely restate the key already named by kid, so parsing both wastes CPU on every request"
    answer: 1
    explanation: |
      jwk embeds a key in the token; jku references a key URL. Trusting either lets the
      attacker choose the verification key and forge tokens. The RS must resolve keys only
      from the AS's pre-configured jwks_uri and pin that origin.
    ref: "concepts.md#jwt-validation-attacks-at-the-resource-server"

  - id: oauth2-and-oauth21-056
    difficulty: expert
    tags: [account-takeover, aud, social-login]
    question: |
      A "Login with Facebook" backend receives an access_token parameter, calls Facebook to
      fetch the profile, and logs the user in by matching the returned email to a local
      account. Which fix actually closes the account-takeover hole (Salt Labs "OhAuth", 2023)?
    options:
      - "Enforce a minimum access-token length of 128 characters so that tokens minted by other apps are too short to pass the backend's validation check"
      - "Verify the token's audience/app-id (e.g. debug_token/introspection) so tokens minted for other apps are rejected, and link accounts by the immutable provider sub, not email"
      - "Move the access_token out of the query string and into a signed POST body, so a token issued to a different app cannot be replayed against this backend"
      - "Shorten the access token's lifetime to 60 seconds so any token issued to a foreign app expires before the attacker can inject it into this login flow"
    answer: 1
    explanation: |
      The root cause is accepting a token without verifying it was issued for THIS app. An
      attacker mints a token via their own app and injects it. The fix is to verify the
      token audience/app-id (debug_token/tokeninfo/introspection) and link by immutable sub,
      not by mutable email. Length, transport, and lifetime changes do not address audience
      confusion.
    ref: "concepts.md#access-token-audience-confusion-and-confused-deputy-login"

  - id: oauth2-and-oauth21-057
    difficulty: advanced
    tags: [consent-phishing, illicit-grant, mfa]
    question: |
      Why does an OAuth consent-phishing attack (e.g. the 2017 "Google Docs" worm) succeed
      even against users with strong passwords and MFA?
    options:
      - "It captures the TOTP seed from the authenticator's QR provisioning URI and derives every future MFA code offline before the user notices"
      - "It silently rewrites the authorization request to downgrade the flow to the implicit grant, which the specification exempts from any MFA challenge"
      - "The user willingly authenticates and grants a malicious app real, scoped access — no credential or MFA is defeated because the delegation itself is the goal"
      - "It exploits a TLS renegotiation flaw in the consent page to splice the attacker's session into the victim's authenticated connection"
    answer: 2
    explanation: |
      Consent phishing attacks the human consent step: the victim logs in normally (MFA and
      all) and approves a malicious app, which receives a real token and offline access. No
      password or MFA factor is stolen. Defenses are publisher verification, admin consent
      policy, scope review, and anomalous-consent detection.
    ref: "concepts.md#consent-phishing-and-illicit-application-grants"

  - id: oauth2-and-oauth21-058
    difficulty: expert
    tags: [redirect, 307, 303, credential-leak]
    question: |
      After the user submits the login form (a POST), which HTTP status must the
      authorization server use to redirect to the client's redirect_uri, and why (RFC 9700
      §4.12)?
    options:
      - "301 Moved Permanently, so the browser permanently caches the redirect and skips re-posting the credentials on later logins"
      - "302 Found, because browsers rewrite a 302 after a POST into a bodyless GET, making it the default and always safe for credential forms"
      - "307 Temporary Redirect, because preserving the original POST method is exactly what a secure credential handoff to the client requires"
      - "303 See Other, because 307 would re-send the POST body (the user's credentials) to the redirect_uri"
    answer: 3
    explanation: |
      307 preserves the method and body, so a 307 after the credential POST would re-send the
      credentials to the client's redirect_uri. 303 See Other forces a GET with no body, so
      the AS MUST use 303.
    ref: "concepts.md#307-vs-303-clickjacking-and-client-impersonation"

  - id: oauth2-and-oauth21-059
    difficulty: advanced
    tags: [clickjacking, consent, headers]
    question: |
      Which defense specifically prevents clickjacking of the authorization/consent screen
      (RFC 9700 §4.16)?
    options:
      - "Setting SameSite=Strict on the authorization-server session cookie so the framed consent page cannot inherit the user's logged-in session"
      - "Sending X-Frame-Options: DENY and/or CSP frame-ancestors 'none' on the authorization endpoint so the consent page cannot be framed"
      - "Rotating the authorization code every 10 seconds so a framed consent click cannot redeem a code that has already been silently replaced"
      - "Requiring PKCE S256 on the authorization request so a click captured through the framed consent UI cannot complete the token exchange"
    answer: 1
    explanation: |
      Clickjacking works by framing the consent UI and tricking the user into approving.
      Framing controls (X-Frame-Options / CSP frame-ancestors) on the authorization endpoint
      stop the page from being embedded. SameSite, code rotation, and PKCE address different
      threats.
    ref: "concepts.md#307-vs-303-clickjacking-and-client-impersonation"

  - id: oauth2-and-oauth21-060
    difficulty: expert
    tags: [redirect-uri, parser-bypass, attack]
    question: |
      An AS validates redirect_uri with a prefix check: it accepts any URI that starts with
      the registered value https://legit.com/cb. Which crafted value most likely defeats this
      and delivers the code to the attacker?
    options:
      - "https://legit.com/cb.evil.com/steal"
      - "https://legit.com/cb (the exact registered value)"
      - "https://legit.com/callback (a different registered path)"
      - "http://legit.com/cb over plaintext HTTP"
    answer: 0
    explanation: |
      A startsWith/prefix check accepts https://legit.com/cb.evil.com/steal because it begins
      with the registered prefix but resolves to the attacker's host. Exact byte-for-byte
      matching of the full URI (and canonical parsing) is required; prefix/suffix matching is
      unsafe.
    ref: "concepts.md#redirect_uri-parser-bypasses"

  - id: oauth2-and-oauth21-061
    difficulty: advanced
    tags: [scope-escalation, token-endpoint, refresh]
    question: |
      A client that was granted scope=contacts.read sends a token-exchange (or refresh)
      request adding scope=contacts.read files.write. What must a correct AS do?
    options:
      - "Grant the broader contacts.read files.write scope, since an already-authenticated client is trusted to widen its own permissions at the token endpoint"
      - "Issue the added files.write scope only when the client also presents its client secret, treating the secret as sufficient consent to expand the grant"
      - "Reject the escalation: the issued scope must be a subset of what the user consented to, and refresh must never widen scope"
      - "Silently drop the extra files.write scope, issue the narrower token, but also revoke the client's session and force a full re-login"
    answer: 2
    explanation: |
      RFC 6749 §3.3 requires the granted scope to be a subset of the consented scope;
      refresh may narrow but never widen scope. Allowing extra scopes at /token is scope
      escalation. The AS must cap the token at the originally consented set.
    ref: "concepts.md#scope-escalation-at-the-token-endpoint"

  - id: oauth2-and-oauth21-062
    difficulty: advanced
    tags: [account-linking, email, takeover]
    question: |
      A site links "Login with X" logins to existing local accounts by matching the email
      the IdP returns. What is the takeover risk and the correct mitigation?
    options:
      - "Risk: email addresses are case-sensitive so Bob@x.com and bob@x.com link to different accounts; mitigation: canonicalize and lowercase the address before the match"
      - "Risk: an attacker registers the victim's (unverified) email at a sloppy IdP and gets linked to the victim's account; mitigation: require email_verified=true and link on the immutable provider sub, not email"
      - "Risk: a long email can overflow the fixed-width account column and corrupt an adjacent row; mitigation: truncate the address to the column width before storing it"
      - "Risk: the IdP throttles repeated userinfo lookups and returns a stale email; mitigation: cache the returned email locally and reuse it across future logins"
    answer: 1
    explanation: |
      Linking on a mutable, unverified identifier lets an attacker who controls an
      unverified copy of the victim's email at some IdP take over the account. Require
      email_verified=true, link on the provider's immutable sub, and require proof of control
      when linking to a pre-existing local account.
    ref: "concepts.md#account-linking-takeover-via-unverified-identifiers"

  - id: oauth2-and-oauth21-063
    difficulty: expert
    tags: [device-code, cdcp, phishing, storm-2372]
    question: |
      In the 2025 Storm-2372 device-code phishing campaigns, why does the attack succeed
      despite the victim using MFA on their own trusted device?
    options:
      - "The attacker terminates and re-establishes the victim's TLS session to microsoft.com, splicing the approved token out of the decrypted stream mid-handshake"
      - "There is no proximity-bound, authenticated channel between the two devices, so the victim cannot tell the code they approve was initiated by the attacker; MFA on the victim's own device still authorizes the attacker's flow"
      - "Device codes travel in cleartext over the polling channel, so any on-path observer can capture and replay the code before the victim finishes approving it"
      - "The RFC 8628 device grant explicitly exempts the approving device from any MFA challenge, so the victim's second factor is never actually evaluated"
    answer: 1
    explanation: |
      Cross-device consent phishing exploits the lack of an authenticated proximity channel
      between the initiating device (attacker) and the approving device (victim). The victim
      authenticates normally, including MFA, but is approving the attacker's flow.
      Mitigations: proximity binding, request-initiation verification, trusted-device/network
      policy, short codes, limited scope, rate-limiting.
    ref: "concepts.md#cross-device-consent-phishing-device-code-phishing"

  - id: oauth2-and-oauth21-064
    difficulty: expert
    tags: [spa, xss, dpop, bff]
    question: |
      A SPA holds tokens in memory, uses DPoP-bound access tokens and rotating refresh
      tokens. Under an active XSS, which claim is correct?
    options:
      - "DPoP key binding plus refresh rotation make token exfiltration cryptographically impossible, so an in-memory SPA under XSS is fully safe"
      - "Only the refresh token can be stolen under this XSS; the DPoP-bound access token is protected because its private key never leaves the browser's memory"
      - "The attacker in the app's origin can silently mint new tokens via a hidden iframe or simply proxy authenticated requests, so DPoP and rotation do not stop it; only a BFF that keeps tokens off the browser mitigates it"
      - "Switching the tokens into HttpOnly cookies would neutralize all four XSS scenarios entirely, with no server-side backend component required"
    answer: 2
    explanation: |
      Because the attacker runs in the app's own origin, sender-constraining and rotation do
      not help against silent new-token acquisition (BCP scenario 3) or request proxying
      (scenario 4) — the attacker can mint new DPoP-bound tokens or ride the live session.
      Only a confidential-client BFF, where tokens never reach the browser, mitigates these.
    ref: "concepts.md#xss-threat-model-for-browser-apps-bff-vs-token-mediating-vs-spa"

  - id: oauth2-and-oauth21-065
    difficulty: advanced
    tags: [browser-apps, refresh-rotation, xss]
    question: |
      The Browser-Based Apps BCP notes that refresh-token rotation and short access-token
      lifetimes fail against which XSS scenario?
    options:
      - "A one-time single-shot token read, where the script grabs one token and leaves — a case that rotation and short lifetimes already fully neutralize"
      - "Persistent token theft, where malicious script keeps exfiltrating each freshly issued token as it is rotated"
      - "A cross-site request forgery against the token endpoint, where a foreign page silently drives the client's refresh call from another origin"
      - "A DNS-rebinding attack that re-points the resource server's hostname at attacker infrastructure after the initial token validation succeeds"
    answer: 1
    explanation: |
      Persistent (long-lived) malicious script simply keeps stealing each new token as it is
      issued, so shortening lifetimes and rotating tokens do not help — the attacker follows
      the rotation. This is why keeping tokens out of the browser (BFF) is the real fix.
    ref: "concepts.md#xss-threat-model-for-browser-apps-bff-vs-token-mediating-vs-spa"

  - id: oauth2-and-oauth21-066
    difficulty: expert
    tags: [client-auth, private-key-jwt, mtls]
    question: |
      Why are private_key_jwt and mTLS considered stronger client-authentication methods
      than client_secret_basic?
    options:
      - "They authenticate faster because the asymmetric handshake lets the client skip the TLS negotiation on the back-channel token call entirely"
      - "They let a confidential client omit PKCE on the authorization code flow, since the signed assertion already proves the code belongs to this client"
      - "The authorization server stores no replayable shared secret (only a public key/cert), and both support proof-of-possession, so a leaked AS-side credential store can't be used to impersonate the client"
      - "They allow a single client secret to be safely shared and reused across many registered clients without weakening any individual client's authentication"
    answer: 2
    explanation: |
      With asymmetric client auth (private_key_jwt RFC 7523, or mTLS RFC 8705) the AS holds
      only the client's public key/cert, not a shared secret, so an AS-side leak cannot
      impersonate the client, and keys rotate independently. Shared-secret methods keep a
      replayable secret on both sides. FAPI 2.0 requires the asymmetric methods.
    ref: "concepts.md#client-authentication-methods"

  - id: oauth2-and-oauth21-067
    difficulty: advanced
    tags: [client-auth, client-secret-jwt]
    question: |
      What is the main residual weakness of the client_secret_jwt authentication method
      compared to private_key_jwt?
    options:
      - "It transmits the raw shared secret in cleartext inside the assertion body on every token request, exposing it to any on-path proxy or log"
      - "It uses an HMAC keyed by a shared secret, so a weak secret can be brute-forced offline and the AS still stores a shared secret"
      - "It emits an opaque HMAC blob rather than a structured JWT, so the authorization server has no standard claims to validate the assertion against"
      - "It requires the resource server (not just the authorization server) to hold a copy of the client's private signing key in order to verify calls"
    answer: 1
    explanation: |
      client_secret_jwt signs the assertion with HMAC using the shared secret as the key. The
      secret is never sent on the wire (better than basic/post), but a low-entropy secret is
      brute-forceable, and the AS still stores a shared secret. private_key_jwt uses
      asymmetric keys, so the AS stores only a public key.
    ref: "concepts.md#client-authentication-methods"

  - id: oauth2-and-oauth21-068
    difficulty: expert
    tags: [jwt, revocation, introspection]
    question: |
      "Can you revoke a self-contained JWT access token before it expires?" What is the
      accurate answer?
    options:
      - "Yes — deleting the token's row from the authorization server's session database instantly invalidates it at every resource server that validates locally"
      - "No — with local (JWKS) validation it stays valid until exp; mitigate with short lifetimes, a jti denylist checked at the RS, or switching that RS to introspection"
      - "Yes — forcing the resource server to re-fetch the JWKS document rotates the signing key and thereby revokes every previously issued JWT at once"
      - "No — a self-contained JWT can never be revoked under any circumstance, which is why signed JWT access tokens must never be used in production"
    answer: 1
    explanation: |
      A stateless JWT validated locally against JWKS is valid until exp regardless of
      server-side state. Practical mitigations are short lifetimes plus a jti/revocation
      denylist at the RS, or using introspection (RFC 7662) for real-time active checks at
      the cost of a network hop.
    ref: "concepts.md#token-validation-jwt-vs-introspection-jwks-and-revocation"

  - id: oauth2-and-oauth21-069
    difficulty: advanced
    tags: [introspection, rfc7662, tradeoffs]
    question: |
      What is the primary tradeoff of using token introspection (RFC 7662) at the resource
      server instead of local JWT validation?
    options:
      - "Introspection is defined only for structured JWTs and cannot validate opaque reference tokens, forcing the resource server back to local key checks"
      - "Introspection gives real-time revocation and supports opaque tokens, but adds a network round-trip and coupling/load on the authorization server"
      - "Introspection has the authorization server pre-check the audience, so the resource server no longer needs to verify the token's intended audience itself"
      - "Introspection instructs the resource server to disregard the token's exp claim, treating any token the endpoint returns as active indefinitely"
    answer: 1
    explanation: |
      Introspection lets the RS ask the AS whether a token is active right now, enabling
      immediate revocation and opaque tokens, but each call is a round-trip that couples the
      RS to the AS and adds load. Local JWT validation is fast/stateless but cannot revoke
      before exp.
    ref: "concepts.md#token-validation-jwt-vs-introspection-jwks-and-revocation"

  - id: oauth2-and-oauth21-070
    difficulty: expert
    tags: [dpop, nonce, replay]
    question: |
      What problem does the DPoP nonce (server-supplied via a 401 with DPoP-Nonce and
      use_dpop_nonce) solve?
    options:
      - "It encrypts the access token end-to-end so only the target resource server, holding the matching nonce-derived key, can decrypt and read it"
      - "It lets the client skip signing the DPoP proof, since echoing the server nonce back is treated as sufficient proof of key possession"
      - "It forces a server-chosen freshness value into the proof, preventing an attacker from pre-generating or replaying DPoP proofs"
      - "It binds the refresh token to the client's TLS certificate, so a stolen refresh token cannot be redeemed from a different mTLS connection"
    answer: 2
    explanation: |
      The DPoP nonce is a server-controlled value the client must echo in its next proof, so
      proofs cannot be pre-generated ahead of time or replayed — they must incorporate the
      current server nonce. This complements jti caching and the iat skew window.
    ref: "concepts.md#dpop-and-mtls-binding-internals"

  - id: oauth2-and-oauth21-071
    difficulty: expert
    tags: [dpop, ath, binding]
    question: |
      What does the ath claim in a DPoP proof JWT bind, and why does it matter?
    options:
      - "It records the remaining access-token lifetime in seconds so the resource server can reject a proof presented after the paired token has already expired"
      - "It is the client's source IP address, binding the DPoP proof to a fixed network location so a proof captured elsewhere cannot be replayed from another host"
      - "It carries the original authentication timestamp so the resource server can decide whether a fresh step-up authentication is required for the request"
      - "It is the hash (base64url SHA-256) of the access token, binding the proof to that specific token so a proof can't be paired with a different token"
    answer: 3
    explanation: |
      ath = base64url(SHA-256(access token)). Including it ties a given DPoP proof to a given
      access token, so an attacker who captures a proof cannot reuse it with a different
      token. Combined with htm/htu/jti/iat and the server nonce, it locks the proof to this
      request and token.
    ref: "concepts.md#dpop-and-mtls-binding-internals"

  - id: oauth2-and-oauth21-072
    difficulty: advanced
    tags: [mtls, cnf, dpop, binding]
    question: |
      In sender-constrained tokens, what is the difference between the cnf.jkt and
      cnf.x5t#S256 confirmation claims?
    options:
      - "jkt encodes the token's expiry timestamp while x5t#S256 encodes its issued-at time, so together they let the RS bound the token's validity window"
      - "jkt is a DPoP public-key thumbprint; x5t#S256 is a mTLS client-certificate thumbprint"
      - "They are two aliases for the same value, and both simply name the resource server's own TLS certificate thumbprint for the client to pin"
      - "jkt is emitted only for confidential clients and x5t#S256 only for public clients, so the pair signals which client type the token was issued to"
    answer: 1
    explanation: |
      DPoP binds the token to the client's public key via cnf.jkt (JWK thumbprint); mTLS
      (RFC 8705) binds it to the client certificate via cnf.x5t#S256 (cert SHA-256
      thumbprint). The RS checks the presented DPoP key or TLS client cert against the
      respective claim.
    ref: "concepts.md#dpop-and-mtls-binding-internals"

  - id: oauth2-and-oauth21-073
    difficulty: intermediate
    tags: [oauth21, delta, changes]
    question: |
      Which of the following is NOT one of OAuth 2.1's changes relative to OAuth 2.0?
    options:
      - "PKCE becomes mandatory for the authorization code grant for all clients"
      - "The implicit grant and the resource owner password credentials grant are both removed"
      - "Access tokens must now be encrypted (JWE) before being sent to any resource server"
      - "redirect_uri must be compared by exact string match and bearer tokens are forbidden in the query string"
    answer: 2
    explanation: |
      OAuth 2.1 does not mandate JWE-encrypted access tokens. Its actual changes: PKCE for
      all clients, removal of implicit and ROPC, exact redirect_uri matching, no bearer
      tokens in the query string, sender-constrained-or-rotated public-client refresh tokens,
      and iss in the authorization response.
    ref: "concepts.md#oauth-21-the-exact-delta"

  - id: oauth2-and-oauth21-074
    difficulty: advanced
    tags: [native-apps, webview, rfc8252]
    question: |
      Per RFC 8252, why must a native app perform the OAuth flow in the system browser or an
      in-app browser tab rather than an embedded WebView?
    options:
      - "Embedded WebViews are hard-coded to reject TLS 1.2+ handshakes, so they cannot open the HTTPS connection the authorization endpoint requires"
      - "An embedded WebView is controlled by the app, so it can read the user's credentials as they type, defeats phishing resistance, and can't share the system SSO session"
      - "WebViews silently strip the Authorization header from every outbound request, so the bearer access token can never reach the resource server"
      - "The authorization server is required by PCI-DSS regulation to blocklist every known WebView user-agent string and return an error"
    answer: 1
    explanation: |
      Because the hosting app fully controls an embedded WebView, it can capture typed
      credentials and cannot leverage the trusted system SSO session, undermining phishing
      resistance. RFC 8252 requires the system browser / in-app tab and prefers claimed HTTPS
      redirects over custom schemes.
    ref: "concepts.md#native-app-security-rfc-8252"

  - id: oauth2-and-oauth21-075
    difficulty: expert
    tags: [native-apps, redirect, app-links]
    question: |
      Why does RFC 8252 prefer claimed HTTPS redirects (App Links / Universal Links) over
      custom URI schemes like myapp:// for mobile OAuth redirects?
    options:
      - "Custom schemes force the OS to spin up a fresh browser process on each redirect, adding several seconds of latency that claimed HTTPS URIs avoid"
      - "Custom schemes can be hijacked by another app registering the same scheme, whereas claimed HTTPS URIs are cryptographically bound to the app's verified domain"
      - "Claimed HTTPS redirects carry a domain-signed attestation that fully replaces the need for PKCE on the authorization code exchange"
      - "Custom URI schemes are defined to allow only a bare path, so they cannot carry query parameters such as code and state back to the app"
    answer: 1
    explanation: |
      Any app can register a custom scheme, so a malicious app can claim myapp:// and
      intercept the redirect (the classic code-interception risk). Claimed HTTPS redirects
      are bound to a domain the developer proves control of, so another app cannot silently
      claim them. PKCE is still required.
    ref: "concepts.md#native-app-security-rfc-8252"

  - id: oauth2-and-oauth21-076
    difficulty: expert
    tags: [mix-up, iss, pkce, multiple-as]
    question: |
      In a mix-up attack across two IdPs, why is PKCE alone insufficient, and what does the
      iss parameter (RFC 9207) add?
    options:
      - "PKCE already binds the response to the correct issuer through the code_challenge, so the iss parameter adds nothing and is fully redundant"
      - "In mix-up the client may send the code and verifier to the attacker's AS token endpoint, so the attacker learns the verifier; iss lets the client confirm which AS actually issued the response and abort if it mismatches the one it started with"
      - "PKCE fails because the S256 transform is reversible with the published JWKS key; the iss parameter supplies a stronger one-way SHA-512 hash instead"
      - "The iss parameter symmetrically encrypts the authorization code so that the attacker's rogue authorization server is unable to read or replay it"
    answer: 1
    explanation: |
      Mix-up confuses the client about which AS a response came from; if it sends the code
      and code_verifier to the attacker-controlled AS, the verifier is exposed and PKCE's
      binding is undone. RFC 9207's iss lets the client verify the response came from the
      expected AS (and it should track which AS a state belongs to), closing the confusion.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-077
    difficulty: expert
    tags: [fapi, high-assurance, design]
    question: |
      Which set of components best describes a FAPI-grade high-assurance authorization-code
      flow?
    options:
      - "Implicit grant returning tokens in the fragment + access and refresh tokens persisted in localStorage + long-lived non-expiring bearer tokens"
      - "ROPC collecting the user's raw password + a single shared client secret reused across tenants + access tokens passed in the URL query string"
      - "PAR + JAR + PKCE S256 + JARM + private_key_jwt or mTLS client auth + sender-constrained (DPoP/mTLS) tokens + iss in the response"
      - "Client credentials grant with no user + PKCE disabled for simplicity + wildcard-suffix redirect_uri matching for deployment flexibility"
    answer: 2
    explanation: |
      A high-assurance (FAPI 2.0) flow pushes a signed request (PAR + JAR), binds the code to
      the browser (PKCE S256), signs the response (JARM), authenticates the client
      asymmetrically (private_key_jwt/mTLS), sender-constrains tokens (DPoP/mTLS), and returns
      iss. The other options stack removed grants and insecure practices.
    ref: "concepts.md#par-jar-and-jarm-hardening-the-request-and-response"

  - id: oauth2-and-oauth21-078
    difficulty: advanced
    tags: [jwt, kid, path-traversal, injection]
    question: |
      A resource server uses the JWT kid header to locate the verification key by reading a
      file at that path. What is the danger and the correct handling?
    options:
      - "The kid header is constrained by the JWS spec to be a numeric key index, so it cannot carry a path and presents no injection danger"
      - "An attacker can set kid to a traversal path (e.g. pointing at a predictable/empty file) or inject SQL, forcing a known/empty key; treat kid as an opaque lookup key against a fixed keyset and never interpolate it into paths or queries"
      - "The kid header is delivered as a JWE-encrypted blob, so the resource server must decrypt it with the AS public key before using it to select a verification key"
      - "The kid value should first be HMAC-verified against the client secret so the server can confirm it was set by a legitimate client before loading the key"
    answer: 1
    explanation: |
      kid is attacker-controlled input. Using it in a filesystem path enables traversal
      (e.g. selecting an empty/known key so a forged HMAC verifies) and using it in a query
      enables SQLi. It must be an opaque index into a fixed, trusted keyset, never
      interpolated into paths or SQL.
    ref: "concepts.md#jwt-validation-attacks-at-the-resource-server"

  - id: oauth2-and-oauth21-079
    difficulty: advanced
    tags: [client-impersonation, multi-tenant, rfc9700]
    question: |
      Per RFC 9700 §4.15, what should an authorization server avoid to prevent client
      impersonation / client_id confusion?
    options:
      - "Issuing more than one active refresh token per client, since concurrent refresh tokens are what let one client impersonate another"
      - "Letting a client influence identifiers like client_id or sub such that it could collide with a genuine resource owner or another client"
      - "Supporting more than one pre-registered redirect URI per client, because multiple callbacks let a client masquerade under several identities"
      - "Caching the authorization server's JWKS signing keys for longer than five minutes, which lets a rotated-out client key impersonate a live one"
    answer: 1
    explanation: |
      The AS must derive client and subject identifiers from trusted server state, not from
      attacker-influenced parameters, so that a client cannot assert an identifier colliding
      with a legitimate resource owner or another client — a particular hazard in
      multi-tenant deployments.
    ref: "concepts.md#307-vs-303-clickjacking-and-client-impersonation"

  - id: oauth2-and-oauth21-080
    difficulty: expert
    tags: [jwt, decode-vs-verify, alg-none]
    question: |
      A resource server logs a bug: it base64url-decodes the JWT payload and trusts the sub
      and scope claims, only checking the signature "when present." Which two flaws does this
      combine?
    options:
      - "Negotiation of weak export-grade TLS ciphers on the resource server plus a missing HTTP Strict-Transport-Security response header"
      - "Decode-vs-verify confusion (trusting claims without cryptographic verification) and de-facto acceptance of unsigned/alg:none tokens"
      - "A cross-site request forgery hole on the token endpoint combined with an unvalidated open-redirect on the callback URL"
      - "A race condition in refresh-token rotation combined with silent scope down-scoping on the reissued access token"
    answer: 1
    explanation: |
      Decoding is not verifying — trusting decoded claims without validating the signature
      lets an attacker forge any claim. Checking the signature only "when present" effectively
      accepts unsigned (alg:none) tokens. The RS must always verify the signature with a
      pinned algorithm/allowlist and reject none.
    ref: "concepts.md#jwt-validation-attacks-at-the-resource-server"
