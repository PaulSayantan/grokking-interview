topic: "OAuth 2.0 / 2.1 Delegated Authorization"
domain: security
topic_slug: oauth2-and-oauth21
version: 1
questions:
  - id: oauth2-and-oauth21-001
    difficulty: beginner
    tags: [fundamentals, authorization, authentication]
    question: |
      What problem is OAuth 2.0 primarily designed to solve?
    options:
      - "Encrypting data at rest in the resource server's database"
      - "Letting a user grant a third-party app scoped, revocable access to their resources without sharing their password"
      - "Proving cryptographically which human is sitting at the keyboard"
      - "Replacing TLS for securing data in transit between services"
    answer: 1
    explanation: |
      OAuth is a delegated authorization framework: the resource owner grants a client
      limited, revocable access via a scoped token instead of handing over credentials.
      It is not encryption, not transport security, and (on its own) not authentication.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-002
    difficulty: beginner
    tags: [fundamentals, authentication, oidc]
    question: |
      Why is using a plain OAuth access token to "log the user in" considered an
      anti-pattern?
    options:
      - "An access token conveys authorization, not verified identity, and carries no reliable claim about who the user is"
      - "Access tokens are always encrypted and cannot be read by the client"
      - "Access tokens expire too quickly to be useful for login"
      - "OAuth forbids clients from calling any userinfo endpoint"
    answer: 0
    explanation: |
      An access token is a bearer of authorization ("what may this app do"), not an
      assertion of identity. Authenticating a user requires OpenID Connect's signed ID
      token (with aud, sub, nonce). Treating an access token as proof of login enables
      token-substitution/confused-deputy attacks.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-003
    difficulty: intermediate
    tags: [oidc, id-token, authentication]
    question: |
      Which artifact is specifically intended to authenticate the user *to the client*
      (prove who they are), as opposed to authorizing API calls?
    options:
      - "The OpenID Connect ID token (a signed JWT with aud, sub, nonce)"
      - "The OAuth access token"
      - "The refresh token"
      - "The authorization code"
    answer: 0
    explanation: |
      The ID token is OIDC's identity assertion, meant to be consumed by the client. The
      access token is for calling resource servers; the refresh token gets new access
      tokens; the code is a one-time exchange value. Only the ID token conveys verified
      identity to the client.
    ref: "concepts.md#oauth-is-delegated-authorization-not-authentication"

  - id: oauth2-and-oauth21-004
    difficulty: beginner
    tags: [roles, architecture]
    question: |
      In OAuth terminology, what is the "resource owner"?
    options:
      - "The user who owns the data and can grant access to it"
      - "The server that issues access tokens"
      - "The API that stores the protected data"
      - "The third-party application requesting access"
    answer: 0
    explanation: |
      The resource owner is the user who owns the resources and can grant access. The API
      is the resource server, the token issuer is the authorization server, and the
      requesting app is the client.
    ref: "concepts.md#the-four-roles-and-the-endpoints"

  - id: oauth2-and-oauth21-005
    difficulty: intermediate
    tags: [roles, endpoints, channels]
    question: |
      Which statement about the authorization endpoint and token endpoint is correct?
    options:
      - "The authorization endpoint is browser-facing (front channel); the token endpoint is a back-channel server-to-server call"
      - "Both are back-channel, server-to-server calls invisible to the browser"
      - "The token endpoint is where the user types their password into the client"
      - "The authorization endpoint returns the access token directly in all modern flows"
    answer: 0
    explanation: |
      The authorization endpoint is reached via browser redirect (front channel, where
      the user consents); the token endpoint is a direct back-channel HTTPS call where
      codes/credentials are exchanged for tokens. Front-channel values are visible in
      URLs/logs, which is why only a short-lived code travels there.
    ref: "concepts.md#the-four-roles-and-the-endpoints"

  - id: oauth2-and-oauth21-006
    difficulty: intermediate
    tags: [roles, confidential, public]
    question: |
      What distinguishes a "confidential" client from a "public" client?
    options:
      - "A confidential client can securely keep a client secret; a public client (SPA/mobile) cannot"
      - "Public clients use HTTPS; confidential clients may use HTTP"
      - "Confidential clients are written in compiled languages; public clients are interpreted"
      - "Confidential clients are first-party; public clients are always third-party"
    answer: 0
    explanation: |
      The defining question is whether the client can protect a secret. Server-side apps
      can (confidential); browser SPAs and native/mobile apps ship code to the user and
      cannot (public), so they authenticate with PKCE instead of a secret.
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-007
    difficulty: beginner
    tags: [grants, authorization-code, pkce]
    question: |
      In OAuth 2.1, which grant (with PKCE) is the default for both public and
      confidential clients?
    options:
      - "Implicit grant"
      - "Resource owner password credentials grant"
      - "Authorization code grant"
      - "Client credentials grant"
    answer: 2
    explanation: |
      OAuth 2.1 makes authorization code + PKCE the default for all client types.
      Implicit and ROPC are removed; client credentials is only for machine-to-machine
      with no user.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-008
    difficulty: intermediate
    tags: [authorization-code, flow]
    question: |
      In the authorization code flow, what does the authorization endpoint return to the
      client's redirect_uri after the user consents?
    options:
      - "The access token directly"
      - "The user's password, encrypted"
      - "A short-lived, single-use authorization code (plus the state value)"
      - "The refresh token in the URL fragment"
    answer: 2
    explanation: |
      The front channel returns only a short-lived, single-use code (and the state). The
      client then exchanges the code for tokens over the back channel. No tokens travel on
      the front channel in the modern flow.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-009
    difficulty: advanced
    tags: [authorization-code, replay, security]
    question: |
      An authorization server sees the same authorization code presented twice at the
      token endpoint. What is the recommended response?
    options:
      - "Treat it as a possible interception: reject and revoke tokens already issued for that code"
      - "Ignore the second request but keep the first tokens valid"
      - "Issue a second identical set of tokens for convenience"
      - "Extend the code's lifetime so both requests succeed"
    answer: 0
    explanation: |
      Authorization codes are single-use. Double redemption signals the code may have been
      intercepted, so the AS should reject the second exchange and revoke tokens already
      issued for that code.
    ref: "concepts.md#authorization-code-grant-with-pkce-the-21-default"

  - id: oauth2-and-oauth21-010
    difficulty: intermediate
    tags: [pkce, code-challenge]
    question: |
      In PKCE with method S256, how is the code_challenge derived from the code_verifier?
    options:
      - "code_challenge = BASE64URL(SHA-256(code_verifier))"
      - "code_challenge = code_verifier (they are identical)"
      - "code_challenge = AES-encrypt(code_verifier) with the client secret"
      - "code_challenge = the client_id concatenated with the code_verifier"
    answer: 0
    explanation: |
      With S256, the challenge is the base64url-encoded SHA-256 hash of the verifier.
      Because the hash is one-way, an attacker who sees the challenge (on the front
      channel) cannot derive the verifier. With method 'plain' they would be identical —
      which is why plain is discouraged.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-011
    difficulty: intermediate
    tags: [pkce, attack, mobile]
    question: |
      PKCE was created to defend against which specific attack?
    options:
      - "SQL injection at the token endpoint"
      - "Cross-site scripting in the consent screen"
      - "Brute-forcing the user's password at the authorization endpoint"
      - "Authorization code interception (e.g., a malicious app on the same device grabbing the redirect)"
    answer: 3
    explanation: |
      On mobile, a malicious app can register the same custom URL scheme and intercept the
      redirect containing the code. PKCE makes the intercepted code useless because the
      attacker lacks the code_verifier needed at token exchange.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-012
    difficulty: intermediate
    tags: [pkce, s256, plain]
    question: |
      Why should a PKCE-capable client use code_challenge_method=S256 rather than plain?
    options:
      - "plain is not supported by any authorization server"
      - "S256 is faster to compute than plain"
      - "With plain the challenge equals the verifier, so intercepting the front-channel request leaks the secret"
      - "plain requires a client secret while S256 does not"
    answer: 2
    explanation: |
      With method=plain, the code_challenge is the code_verifier verbatim, so an attacker
      who intercepts the /authorize request learns the verifier and defeats PKCE. S256
      sends only a one-way hash. OAuth 2.1: if capable of S256, the client MUST use S256.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-013
    difficulty: advanced
    tags: [pkce, downgrade, authorization-server]
    question: |
      Which authorization-server behavior would silently defeat PKCE protection?
    options:
      - "Requiring the code_verifier to be 43–128 characters"
      - "Rejecting reused authorization codes"
      - "Binding the code to the redirect_uri"
      - "Accepting a token exchange with no code_verifier for a code that was created with a code_challenge"
    answer: 3
    explanation: |
      If the AS lets a code created with a challenge be redeemed without a matching
      verifier, PKCE is bypassed (a downgrade). The AS must enforce that a code with a
      challenge is only redeemable with the correct verifier.
    ref: "concepts.md#pkce-and-the-authorization-code-interception-attack"

  - id: oauth2-and-oauth21-014
    difficulty: intermediate
    tags: [client-credentials, m2m]
    question: |
      When is the client credentials grant appropriate?
    options:
      - "Machine-to-machine access where the client acts on its own behalf and no user is involved"
      - "A single-page app that needs to read the logged-in user's profile"
      - "A mobile app logging a user in for the first time"
      - "Any flow where you want to skip the consent screen for a human user"
    answer: 0
    explanation: |
      Client credentials is for service-to-service access with no resource owner — the
      client authenticates with its own credentials. It is only for confidential clients
      and has no user consent and no refresh token.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-015
    difficulty: intermediate
    tags: [client-credentials, refresh-token]
    question: |
      Which statement about the client credentials grant is correct?
    options:
      - "It issues no refresh token; the client simply re-authenticates with its own credentials when needed"
      - "It is safe to use from a browser SPA because there is no user"
      - "It returns a refresh token so the client avoids re-authenticating"
      - "It requires the user's password in the request body"
    answer: 0
    explanation: |
      There is no refresh token in client credentials — the client can re-authenticate any
      time with its own credentials. It is only for confidential clients (never a browser
      SPA), and no user password is involved.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-016
    difficulty: advanced
    tags: [client-credentials, client-auth]
    question: |
      Which is a stronger form of client authentication for the client credentials grant
      than a shared client secret?
    options:
      - "Sending the secret in the query string instead of the body"
      - "Base64-encoding the secret twice"
      - "private_key_jwt or mTLS (certificate-bound) client authentication"
      - "Putting the secret in a custom HTTP header named X-Secret"
    answer: 2
    explanation: |
      private_key_jwt (RFC 7523) has the client sign a JWT assertion with its private key,
      and mTLS (RFC 8705) binds the token to the client certificate. Both are stronger
      than a shared secret and avoid transmitting a reusable secret.
    ref: "concepts.md#client-credentials-grant"

  - id: oauth2-and-oauth21-017
    difficulty: beginner
    tags: [device-grant, iot]
    question: |
      The OAuth device authorization grant (RFC 8628) is designed for what kind of client?
    options:
      - "High-traffic web servers behind a load balancer"
      - "Confidential machine-to-machine services with no user"
      - "Single-page apps running in a full desktop browser"
      - "Input-constrained devices like smart TVs, CLIs, and IoT that can't easily show a browser"
    answer: 3
    explanation: |
      The device grant lets an input-constrained device display a short user_code and URL,
      while the user completes authentication on a secondary device (phone/laptop) with a
      real browser.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-018
    difficulty: intermediate
    tags: [device-grant, polling]
    question: |
      After showing the user_code, how does a device using the device grant obtain its
      tokens?
    options:
      - "It receives them instantly in the initial device authorization response"
      - "It polls the token endpoint with the device_code until the user approves, honoring the interval and slow_down responses"
      - "The user manually types the access token into the device"
      - "The authorization server pushes tokens to the device over WebSocket"
    answer: 1
    explanation: |
      The device polls the token endpoint with grant_type device_code, receiving
      authorization_pending until approval, and must back off on slow_down and respect the
      interval to avoid abuse.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-019
    difficulty: advanced
    tags: [device-grant, phishing]
    question: |
      What is a notable threat specific to the device authorization grant?
    options:
      - "The device secret is always logged in plaintext"
      - "The grant requires the user's password to be sent to the device"
      - "Because approval happens on a separate device, an attacker can trick a victim into entering the attacker's user_code, capturing the victim's authorization"
      - "Access tokens issued via device grant cannot be revoked"
    answer: 2
    explanation: |
      The out-of-band approval enables social engineering: an attacker displays their own
      user_code and lures the victim to approve it, hijacking the grant. Mitigations
      include short expiry, clear consent screens, and rate-limiting user_code entry.
    ref: "concepts.md#device-authorization-grant"

  - id: oauth2-and-oauth21-020
    difficulty: beginner
    tags: [implicit, deprecated, oauth21]
    question: |
      What happened to the implicit grant in OAuth 2.1?
    options:
      - "It became the recommended grant for all SPAs"
      - "It was removed; SPAs should use authorization code + PKCE instead"
      - "It was renamed to the client credentials grant"
      - "It was made mandatory for mobile apps"
    answer: 1
    explanation: |
      OAuth 2.1 removes the implicit grant. It returned tokens directly in the URL
      fragment (front channel), where they leak and are instantly replayable. The
      replacement is authorization code + PKCE.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-021
    difficulty: intermediate
    tags: [implicit, token-leakage]
    question: |
      Why was returning the access token in the URL fragment (implicit grant) considered
      dangerous?
    options:
      - "URL fragments are always sent to the server and stored in databases"
      - "Fragments cannot be read by JavaScript, so the app could never use the token"
      - "The fragment is encrypted, preventing the client from decrypting it"
      - "The token sat on the front channel, exposed to browser history, Referer headers, and any script that could read the fragment, with no proof-of-possession"
    answer: 3
    explanation: |
      A token in the fragment is exposed via history, Referer, and page scripts, and being
      a bearer token with no client authentication, a leaked one is immediately replayable.
      That is why implicit is removed in 2.1.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-022
    difficulty: intermediate
    tags: [ropc, deprecated, password]
    question: |
      Why is the Resource Owner Password Credentials (ROPC) grant discouraged and removed
      in OAuth 2.1?
    options:
      - "It is too slow for modern APIs"
      - "It reintroduces the password anti-pattern (the client handles the raw credentials) and is incompatible with MFA and federated login"
      - "It requires a client secret that public clients cannot store"
      - "It only works over plain HTTP"
    answer: 1
    explanation: |
      ROPC has the client collect and send the user's raw username/password, exactly the
      anti-pattern OAuth was built to avoid, and it breaks MFA, federation, and step-up
      auth because there is no interactive browser step.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-023
    difficulty: intermediate
    tags: [oauth21, migration, grants]
    question: |
      A team says "let's use the implicit or ROPC grant because it's simpler." What is the
      best guidance?
    options:
      - "Use implicit for SPAs and ROPC for mobile — both are still recommended"
      - "Both are removed in OAuth 2.1 and discouraged by the Security BCP; migrate to authorization code + PKCE"
      - "Use ROPC but only over HTTP/2"
      - "Use implicit but store the token in localStorage to make it safe"
    answer: 1
    explanation: |
      Both grants are removed in OAuth 2.1 and discouraged by RFC 9700. The correct path
      for SPAs and mobile apps alike is authorization code + PKCE.
    ref: "concepts.md#deprecated-grants-implicit-and-ropc-removed-in-21"

  - id: oauth2-and-oauth21-024
    difficulty: intermediate
    tags: [redirect-uri, exact-match]
    question: |
      What does OAuth 2.1 require regarding redirect_uri validation at the authorization
      server?
    options:
      - "Match only the hostname of the registered URI"
      - "Allow any URI on the same registered domain"
      - "Exact string matching against a pre-registered redirect_uri (loopback ports on native apps excepted)"
      - "Allow wildcard suffixes so subpaths are flexible"
    answer: 2
    explanation: |
      OAuth 2.1 mandates exact string matching of redirect_uri against registered values,
      rejecting anything that doesn't match exactly (loopback ports for native apps are the
      exception). Loose/wildcard matching enables open-redirect code theft.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-025
    difficulty: advanced
    tags: [redirect-uri, open-redirect, attack]
    question: |
      An AS matches redirect_uri only on the host app.example.com. An attacker sends
      redirect_uri=https://app.example.com/redirect?next=https://evil.com/steal, and
      /redirect is an open redirector. What is the risk?
    options:
      - "None — the code is delivered to the legitimate domain"
      - "The authorization code is delivered to app.example.com and then bounced by the open redirector to evil.com, exfiltrating it"
      - "The AS will reject the request because it uses HTTPS"
      - "The user's password is sent to evil.com in cleartext"
    answer: 1
    explanation: |
      Loose host-only matching plus an open redirector on the legitimate domain lets the
      code be handed off to the attacker's site. Defense: exact-match the full URI
      (including path) and eliminate open redirectors on OAuth-hosting domains.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-026
    difficulty: advanced
    tags: [mix-up, multiple-as, iss]
    question: |
      Which defense specifically mitigates the OAuth "mix-up" attack when a client
      supports multiple authorization servers?
    options:
      - "Using a longer client secret"
      - "Increasing access-token lifetime"
      - "The AS returning an iss (issuer) parameter in the authorization response that the client verifies (RFC 9207)"
      - "Disabling PKCE for trusted ASes"
    answer: 2
    explanation: |
      In a mix-up attack the client is confused about which AS a response came from. RFC
      9207's iss parameter lets the client confirm the response came from the AS it started
      with; using distinct redirect URIs per AS also helps.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-027
    difficulty: beginner
    tags: [state, csrf]
    question: |
      What is the primary purpose of the state parameter in the authorization request?
    options:
      - "To carry the access token back to the client"
      - "To protect the callback against CSRF by tying the response to the session that started the flow"
      - "To specify which scopes the client wants"
      - "To encrypt the authorization code"
    answer: 1
    explanation: |
      state is an unguessable value the client sends and later verifies on the callback,
      ensuring the callback belongs to a flow this browser session initiated — i.e. CSRF
      protection on the authorization response.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-028
    difficulty: advanced
    tags: [state, csrf, attack]
    question: |
      Without state (or PKCE) validation, how can an attacker abuse the callback?
    options:
      - "By reading the client secret from the redirect"
      - "By forcing the AS to skip TLS"
      - "By obtaining a code for their own account and tricking the victim's browser into completing the flow, silently linking/logging the victim into the attacker's account"
      - "By brute-forcing the access token offline"
    answer: 2
    explanation: |
      This is login-CSRF: the attacker injects their own authorization code into the
      victim's callback. Without state binding the client accepts it, associating the
      victim's session/data with the attacker's account. state (or PKCE) prevents the
      foreign code from matching the session.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-029
    difficulty: intermediate
    tags: [state, nonce, oidc]
    question: |
      What is the difference between state (OAuth) and nonce (OIDC)?
    options:
      - "They are two names for the same value"
      - "state provides CSRF protection on the OAuth callback; nonce provides replay protection on the OIDC ID token"
      - "state protects the ID token; nonce protects the access token"
      - "nonce is for the resource server; state is for the token endpoint"
    answer: 1
    explanation: |
      state correlates the authorization request and callback to stop CSRF. nonce is placed
      in the request and echoed inside the signed ID token to stop ID-token replay. They
      solve different problems.
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-030
    difficulty: intermediate
    tags: [state, best-practice]
    question: |
      Which is a correct practice for the state parameter?
    options:
      - "Store secrets like the client secret inside state for convenience"
      - "Generate a random, per-session value, bind it to the session, and reject callbacks whose state doesn't match"
      - "Reuse the same static state for every request to simplify validation"
      - "Send state only on the token request, not the authorization request"
    answer: 1
    explanation: |
      state must be random, session-bound, and validated on the callback. It travels on the
      front channel, so never put secrets in it, and never reuse a static value (that
      defeats its CSRF purpose).
    ref: "concepts.md#the-state-parameter-and-csrf-on-the-callback"

  - id: oauth2-and-oauth21-031
    difficulty: beginner
    tags: [tokens, access-token, refresh-token]
    question: |
      Which best describes the difference between an access token and a refresh token?
    options:
      - "Access tokens are long-lived; refresh tokens are single-use codes sent on the front channel"
      - "They are interchangeable; either can call the API"
      - "Access tokens are presented to the resource server and are short-lived; refresh tokens are long-lived and used at the token endpoint to get new access tokens"
      - "Refresh tokens are sent to the resource server on every API call"
    answer: 2
    explanation: |
      Access tokens are short-lived and presented to the RS (Authorization: Bearer).
      Refresh tokens are long-lived and sent only to the token endpoint (back channel) to
      mint new access tokens without re-prompting the user.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-032
    difficulty: intermediate
    tags: [bearer-token, header, rfc6750]
    question: |
      How should a bearer access token be sent to a resource server per RFC 6750 and
      OAuth 2.1?
    options:
      - "As a query-string parameter: ?access_token=..."
      - "In a cookie named oauth_token"
      - "In the URL fragment after #"
      - "In the Authorization request header: Authorization: Bearer <token>"
    answer: 3
    explanation: |
      The Authorization: Bearer header is the correct transport. The query string is
      forbidden because URLs leak via logs, history, and Referer. Fragments are for the
      removed implicit grant.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-033
    difficulty: intermediate
    tags: [bearer-token, replay, risk]
    question: |
      What is the key security weakness of a plain bearer access token?
    options:
      - "It can only be used once before expiring"
      - "It cannot be transmitted over TLS"
      - "Anyone who obtains it can use it until it expires, since it requires no proof of possession"
      - "It must be decrypted with the client secret before use"
    answer: 2
    explanation: |
      A bearer token is like cash: possession equals authorization. A stolen bearer token
      is fully usable until expiry. Mitigations: short lifetimes, narrow scope, TLS, and
      sender-constraining (DPoP/mTLS).
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-034
    difficulty: advanced
    tags: [resource-server, token-validation]
    question: |
      How does a resource server validate an incoming token?
    options:
      - "Trust any token that decodes as valid base64"
      - "For a JWT, verify the signature via JWKS and check iss/aud/exp/scope; for an opaque token, call the AS introspection endpoint (RFC 7662)"
      - "Check only that the token has not expired, ignoring signature and audience"
      - "Forward the token to the user's browser for confirmation"
    answer: 1
    explanation: |
      A JWT access token is validated by signature (via the AS's JWKS) plus claim checks
      (issuer, audience, expiry, scope). An opaque token is validated by calling the AS's
      introspection endpoint. Decoding alone proves nothing.
    ref: "concepts.md#access-tokens-vs-refresh-tokens"

  - id: oauth2-and-oauth21-035
    difficulty: intermediate
    tags: [refresh-token, rotation]
    question: |
      What does refresh token rotation mean?
    options:
      - "The refresh token is re-encrypted every hour with a new key"
      - "Each time a refresh token is used, the AS issues a new one and invalidates the old, making each refresh token effectively single-use"
      - "The refresh token's scope is randomly changed on each use"
      - "The client rotates between two refresh tokens on alternating requests"
    answer: 1
    explanation: |
      With rotation, using a refresh token returns a fresh refresh token and revokes the
      prior one. This makes refresh tokens single-use and enables reuse detection.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-036
    difficulty: advanced
    tags: [refresh-token, reuse-detection, theft]
    question: |
      With rotation enabled, an already-consumed refresh token is presented again. What
      should the AS do and why?
    options:
      - "Silently issue new tokens; replays are normal"
      - "Extend the old token's lifetime"
      - "Revoke the entire token family, because a replayed (already-used) refresh token signals theft"
      - "Downgrade the client to the implicit grant"
    answer: 2
    explanation: |
      A stale refresh token being replayed means either the attacker or the legitimate
      client is using a stolen copy. The AS revokes the whole rotation chain (family),
      cutting off the attacker and forcing re-authentication.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-037
    difficulty: advanced
    tags: [refresh-token, oauth21, public-client]
    question: |
      What does OAuth 2.1 require for refresh tokens issued to public clients?
    options:
      - "They must never be issued to public clients under any circumstance"
      - "They must be stored in localStorage"
      - "They must be valid for at least one year"
      - "They must be either sender-constrained or rotated with reuse detection"
    answer: 3
    explanation: |
      Because public clients can't protect a long-lived secret, OAuth 2.1 requires their
      refresh tokens to be sender-constrained (e.g. DPoP) or rotated with reuse detection.
      Refresh tokens must also be bound to the consented scope/audience.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-038
    difficulty: advanced
    tags: [refresh-token, race-condition]
    question: |
      What operational problem can naive refresh token rotation cause for legitimate
      clients?
    options:
      - "Tokens become impossible to revoke"
      - "The access token lifetime is forced to zero"
      - "Scopes are silently escalated"
      - "Concurrent requests (e.g. two browser tabs refreshing at once) can replay a rotating token and trigger false-positive family revocation"
    answer: 3
    explanation: |
      Concurrent legitimate refreshes can look like reuse, causing false lockouts.
      Implementations add a short grace window allowing the immediately-preceding token
      briefly, while still catching genuine reuse.
    ref: "concepts.md#refresh-token-rotation-and-reuse-detection"

  - id: oauth2-and-oauth21-039
    difficulty: beginner
    tags: [scopes, least-privilege]
    question: |
      What is an OAuth scope?
    options:
      - "The IP range from which a token may be used"
      - "The expiry time of the access token"
      - "A space-delimited set of permissions the client requests, shown at consent and limiting the issued token"
      - "The client's unique identifier"
    answer: 2
    explanation: |
      A scope is a permission label (e.g. contacts.read). The AS displays requested scopes
      at consent and limits the token to what was granted, implementing least privilege for
      delegated access.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-040
    difficulty: intermediate
    tags: [scopes, authorization, api]
    question: |
      Which statement about scopes and resource-server authorization is correct?
    options:
      - "A granted scope fully replaces the resource server's object-level access checks"
      - "Scopes are coarse authorization; the resource server must still enforce fine-grained checks (e.g. that the user owns the specific object)"
      - "Scopes are decided by the client at runtime with no AS involvement"
      - "A files.write scope authorizes writing any user's files"
    answer: 1
    explanation: |
      A scope like files.write says the client may write files in general; the RS must
      still verify which files this user is allowed to touch. Confusing scope with
      object-level authz is a classic broken-authorization bug.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-041
    difficulty: intermediate
    tags: [scopes, granted-vs-requested]
    question: |
      A client requests scope="contacts.read files.write" but the user only approves
      contacts.read. What happens?
    options:
      - "The AS rejects the whole request"
      - "The token silently includes files.write anyway"
      - "The token is issued for the granted scope (contacts.read), and the response includes a scope field reflecting the down-scoping"
      - "The client must resubmit with a client secret"
    answer: 2
    explanation: |
      Granted scope can be narrower than requested. The token reflects only what was
      granted, and the token response carries a scope field when it differs. Clients must
      handle down-scoping gracefully.
    ref: "concepts.md#scopes-and-least-privilege"

  - id: oauth2-and-oauth21-042
    difficulty: beginner
    tags: [token-leakage, referrer, logs]
    question: |
      Which of these is a real channel through which a token or code in a URL can leak?
    options:
      - "The Referer header sent to third-party resources loaded by the page"
      - "The TLS session key negotiated during the handshake"
      - "The client's private signing key"
      - "The database index on the tokens table"
    answer: 0
    explanation: |
      A URL containing a code/token can leak via the Referer header (to third-party JS,
      images, analytics), browser history, and server/proxy logs. These are the reasons
      secrets must not ride in query strings or fragments.
    ref: "concepts.md#token-leakage-via-referrer-logs-and-browser-history"

  - id: oauth2-and-oauth21-043
    difficulty: intermediate
    tags: [token-leakage, referrer-policy, defense]
    question: |
      Which set of defenses best reduces token/code leakage from the OAuth callback page?
    options:
      - "Put the access token in the query string and log all requests"
      - "Disable TLS to make debugging easier"
      - "Store the code in browser history for auditing"
      - "Set Referrer-Policy: no-referrer, strip the code from the URL after handling it, and never place tokens in query strings"
    answer: 3
    explanation: |
      Setting a strict Referrer-Policy prevents Referer leaks, removing the code from the
      URL (redirect to a clean URL / replaceState) keeps it out of history, and keeping
      tokens out of query strings avoids log/history exposure.
    ref: "concepts.md#token-leakage-via-referrer-logs-and-browser-history"

  - id: oauth2-and-oauth21-044
    difficulty: beginner
    tags: [sender-constrained, dpop, mtls]
    question: |
      What is the goal of a sender-constrained (proof-of-possession) access token?
    options:
      - "To make the token human-readable"
      - "To remove the need for TLS"
      - "To bind the token to a key the legitimate client holds, so a stolen token is useless without the private key"
      - "To make the token last longer"
    answer: 2
    explanation: |
      Sender-constraining cryptographically binds the token to the client's key
      (certificate for mTLS, key pair for DPoP). Unlike a bearer token, a stolen one can't
      be replayed without the corresponding private key.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-045
    difficulty: advanced
    tags: [dpop, rfc9449, proof]
    question: |
      In DPoP (RFC 9449), how does the resource server confirm the caller holds the right
      key?
    options:
      - "It trusts the client_id in the token"
      - "It checks that the token is base64url-encoded"
      - "It verifies the signed DPoP proof JWT and checks that its key thumbprint matches the cnf/jkt claim in the access token"
      - "It re-runs the authorization code exchange"
    answer: 2
    explanation: |
      The access token carries a cnf claim with the thumbprint (jkt) of the client's public
      key. Each request includes a DPoP proof JWT (with htm, htu, iat, jti) signed by the
      client's private key; the RS verifies the signature and that the thumbprint matches.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-046
    difficulty: intermediate
    tags: [mtls, rfc8705, sender-constrained]
    question: |
      How does mTLS-based certificate-bound token binding (RFC 8705) work?
    options:
      - "The token is encrypted with the resource server's public key"
      - "The client sends its private key in the Authorization header"
      - "The AS disables TLS certificate validation"
      - "The token embeds the client certificate thumbprint, and the RS checks it matches the client cert on the current TLS connection"
    answer: 3
    explanation: |
      With mTLS binding, the token carries the client-certificate thumbprint (cnf x5t#S256),
      and the resource server verifies the certificate presented on the mutually
      authenticated TLS connection matches it, so the token is bound to that client.
    ref: "concepts.md#sender-constrained-tokens-dpop-and-mtls"

  - id: oauth2-and-oauth21-047
    difficulty: advanced
    tags: [spa, token-storage, xss]
    question: |
      A single-page app stores its access and refresh tokens in localStorage. What is the
      main risk?
    options:
      - "localStorage is wiped on every page load, breaking sessions"
      - "localStorage tokens cannot be sent in the Authorization header"
      - "Any XSS on the page can read localStorage and exfiltrate every token"
      - "Tokens in localStorage are automatically shared across origins"
    answer: 2
    explanation: |
      localStorage is readable by any JavaScript on the origin, so a single XSS steals all
      stored tokens. Safer options are in-memory storage, HttpOnly cookies via a backend,
      or a BFF that keeps tokens off the front end entirely.
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-048
    difficulty: advanced
    tags: [bff, browser-apps, best-practice]
    question: |
      What is the Backend-For-Frontend (BFF) pattern's security benefit for browser apps?
    options:
      - "It lets the SPA store the client secret safely in JavaScript"
      - "It eliminates the need for PKCE and state"
      - "It moves all token validation into the browser for speed"
      - "A server-side component holds the tokens and the browser holds only an HttpOnly session cookie, keeping tokens out of reach of front-end JS/XSS"
    answer: 3
    explanation: |
      In the BFF pattern, tokens live server-side and the browser only carries an HttpOnly
      session cookie; the BFF attaches the access token to API calls. This removes tokens
      from front-end JavaScript, neutralizing XSS token theft (CSRF defenses still needed).
    ref: "concepts.md#public-vs-confidential-clients-and-token-storage"

  - id: oauth2-and-oauth21-049
    difficulty: intermediate
    tags: [redirect-uri, code-binding]
    question: |
      Besides exact matching, what additional redirect_uri protection does the
      authorization code flow apply?
    options:
      - "It encrypts the redirect_uri with the user's password"
      - "It allows the client to change the redirect_uri freely at token exchange"
      - "It binds the code to the redirect_uri used at authorization and requires the same value at token exchange"
      - "It appends the access token to the redirect_uri"
    answer: 2
    explanation: |
      RFC 6749 §4.1.3 requires the redirect_uri presented at token exchange to match the one
      from the authorization request, binding the code to its intended destination and
      closing certain code-injection/redirect paths.
    ref: "concepts.md#redirect_uri-exact-matching-open-redirect-and-mix-up-attacks"

  - id: oauth2-and-oauth21-050
    difficulty: intermediate
    tags: [scopes, audience, rfc8707]
    question: |
      Why combine scopes with a resource/audience indicator (RFC 8707) rather than issuing
      one token every service accepts?
    options:
      - "To make tokens larger and harder to guess"
      - "Because scopes are not allowed without an audience"
      - "To avoid needing TLS between services"
      - "To limit a token's validity to the intended resource server, reducing replay damage if one RS is compromised"
    answer: 3
    explanation: |
      Audience-restricting a token (RFC 8707) means a token accepted by service A can't be
      replayed against service B. A single god-token accepted everywhere maximizes blast
      radius if it leaks or an RS is compromised.
    ref: "concepts.md#scopes-and-least-privilege"
