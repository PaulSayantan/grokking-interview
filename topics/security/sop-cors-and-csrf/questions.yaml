topic: "Same-Origin Policy, CORS & CSRF"
domain: security
topic_slug: sop-cors-and-csrf
version: 1
questions:
  - id: sop-cors-and-csrf-001
    difficulty: beginner
    tags: [same-origin-policy, origin-definition]
    question: |
      What three components must all match for two URLs to be considered the "same
      origin"?
    options:
      - "Scheme, host, and port"
      - "Host, path, and query string"
      - "Domain, subdomain, and path"
      - "Protocol, cookie name, and port"
    answer: 0
    explanation: |
      An origin is the tuple (scheme, host, port). All three must match exactly. Path,
      query string, and fragment are irrelevant to the origin comparison.
    ref: "concepts.md#same-origin-policy-definition"

  - id: sop-cors-and-csrf-002
    difficulty: beginner
    tags: [same-origin-policy, scheme]
    question: |
      Are `https://example.com` and `http://example.com` the same origin?
    options:
      - "Yes, because the host is identical"
      - "Yes, because ports 80 and 443 are both defaults"
      - "No, because the scheme differs"
      - "No, because the path differs"
    answer: 2
    explanation: |
      The scheme is part of the origin. `https` vs `http` means the two URLs are
      different origins even though the host is the same. This is a common trap.
    ref: "concepts.md#same-origin-policy-definition"

  - id: sop-cors-and-csrf-003
    difficulty: intermediate
    tags: [origin-vs-site, samesite]
    question: |
      How does "same site" differ from "same origin"?
    options:
      - "Same site compares the registrable domain (eTLD+1) and ignores subdomain and port, so it is looser than same origin"
      - "Same site is stricter, requiring the port to match; same origin ignores the port"
      - "They are identical concepts with different names"
      - "Same site requires the scheme to differ, while same origin requires it to match"
    answer: 0
    explanation: |
      "Same site" compares only the registrable domain (eTLD+1), ignoring subdomain and
      port, so it is looser than "same origin" (scheme+host+port exact match).
      `a.example.com` and `b.example.com` are same-site but not same-origin. SameSite
      cookies use the site concept.
    ref: "concepts.md#same-origin-policy-definition"

  - id: sop-cors-and-csrf-004
    difficulty: beginner
    tags: [same-origin-policy, port]
    question: |
      Given a page at `https://app.example.com` (default port 443), which of these is a
      DIFFERENT origin?
    options:
      - "https://app.example.com/settings"
      - "https://app.example.com:443/api"
      - "https://api.example.com"
      - "https://app.example.com/?tab=2"
    answer: 2
    explanation: |
      `api.example.com` has a different host (subdomain counts) so it is a different
      origin. The others differ only in path/query, and `:443` is the implied default
      port for https, so they are the same origin.
    ref: "concepts.md#same-origin-policy-definition"

  - id: sop-cors-and-csrf-005
    difficulty: intermediate
    tags: [sop, request-vs-response]
    question: |
      When a script on `evil.com` calls `fetch('https://bank.com/api', {credentials:'include'})`
      and bank.com returns no CORS headers, what actually happens?
    options:
      - "The browser refuses to send the request, so bank.com never receives it"
      - "The request is sent without cookies and the response is fully readable"
      - "The request is sent with cookies and processed by bank.com, but the browser blocks evil.com's script from reading the response"
      - "bank.com strips the cookies before processing the request"
    answer: 2
    explanation: |
      SOP is a read restriction on the response, not a request firewall. The request is
      sent (with cookies), bank.com processes it, and only the browser's exposure of the
      response to evil.com's script is blocked. This is exactly why CSRF side effects
      still occur.
    ref: "concepts.md#what-sop-blocks-and-doesnt-block"

  - id: sop-cors-and-csrf-006
    difficulty: intermediate
    tags: [sop, misconception]
    question: |
      Why is "SOP blocked the cross-origin request so my server never saw it" incorrect?
    options:
      - "SOP only applies to GET requests, not POST"
      - "SOP is enforced server-side, not in the browser"
      - "SOP encrypts the request so the server cannot decrypt it"
      - "SOP blocks the script from reading the response, but the request was still sent and may have caused a server-side side effect"
    answer: 3
    explanation: |
      SOP hides the response from the calling script; the request itself was sent and
      could have committed a write. Never treat SOP/CORS as server-side access control.
    ref: "concepts.md#what-sop-blocks-and-doesnt-block"

  - id: sop-cors-and-csrf-007
    difficulty: beginner
    tags: [sop, cross-origin-embedding]
    question: |
      Which of the following does the Same-Origin Policy NOT block?
    options:
      - "Reading the DOM of a cross-origin iframe from script"
      - "Loading a cross-origin image via `<img src>`"
      - "Reading a cross-origin fetch response body without CORS permission"
      - "Reading pixels of a cross-origin image drawn to a canvas"
    answer: 1
    explanation: |
      Cross-origin resource loading via `<img>`, `<script>`, `<link>`, etc. is allowed by
      design — you can use the resource but not read its bytes from script. The other
      options are all reads SOP blocks.
    ref: "concepts.md#what-sop-blocks-and-doesnt-block"

  - id: sop-cors-and-csrf-008
    difficulty: intermediate
    tags: [sop, canvas, tainting]
    question: |
      What happens when a cross-origin image is drawn onto a `<canvas>` and script tries
      to read its pixels?
    options:
      - "The read succeeds because images are public resources"
      - "The canvas is 'tainted' and pixel-reading operations throw a security error"
      - "The browser silently returns all-black pixels"
      - "The image fails to draw in the first place"
    answer: 1
    explanation: |
      Drawing a cross-origin image (without proper CORS) taints the canvas; subsequent
      `getImageData`/`toDataURL` calls throw. This prevents scripts from exfiltrating the
      bytes of cross-origin images they can only display.
    ref: "concepts.md#what-sop-blocks-and-doesnt-block"

  - id: sop-cors-and-csrf-009
    difficulty: beginner
    tags: [cors, definition]
    question: |
      What is CORS, at a conceptual level?
    options:
      - "A server-controlled, browser-enforced relaxation of the Same-Origin Policy that grants specific origins read access to responses"
      - "A firewall rule that blocks requests from untrusted origins before they reach the server"
      - "An encryption layer that secures cross-origin data in transit"
      - "A client-side setting that disables the Same-Origin Policy entirely"
    answer: 0
    explanation: |
      CORS lets a server opt specific origins into reading its responses via response
      headers, relaxing SOP in a controlled way. The browser enforces it; the server
      decides. It loosens SOP, never tightens it.
    ref: "concepts.md#cors-as-a-controlled-relaxation"

  - id: sop-cors-and-csrf-010
    difficulty: intermediate
    tags: [cors, direction]
    question: |
      Who does CORS actually protect, and from what?
    options:
      - "It protects the server from receiving malicious requests"
      - "It protects cookies from being stolen via XSS"
      - "It protects the network from man-in-the-middle attacks"
      - "It protects the user's data from being read by scripts on unauthorized origins"
    answer: 3
    explanation: |
      CORS is not a server request-firewall. It protects the user's (potentially
      authenticated) response data from being read by scripts on origins the server has
      not authorized. A server with no CORS headers is more locked down, not less.
    ref: "concepts.md#cors-as-a-controlled-relaxation"

  - id: sop-cors-and-csrf-011
    difficulty: beginner
    tags: [cors, acao]
    question: |
      What is the purpose of the `Access-Control-Allow-Origin` response header?
    options:
      - "It tells the browser which origin(s) may read the response"
      - "It lists the origins the server will accept requests from"
      - "It sets the origin the server will use for outbound requests"
      - "It encrypts the response for the specified origin"
    answer: 0
    explanation: |
      `Access-Control-Allow-Origin` (ACAO) declares which origin's script the browser may
      expose the response to. It is about read authorization, not request acceptance.
    ref: "concepts.md#cors-as-a-controlled-relaxation"

  - id: sop-cors-and-csrf-012
    difficulty: intermediate
    tags: [cors, multiple-origins, acao]
    question: |
      A server needs to allow reads from several specific origins. Why can't it just send
      `Access-Control-Allow-Origin` with a comma-separated list of all of them?
    options:
      - "Because the header has a strict length limit"
      - "Because a list would automatically enable credentials"
      - "Because commas are forbidden characters in HTTP headers"
      - "Because browsers require ACAO to be a single origin (or `*`); to support multiple, the server must reflect the request's Origin only if it is on an allowlist"
    answer: 3
    explanation: |
      ACAO must be a single origin value or `*`. To support multiple allowed origins the
      server checks the request `Origin` against an allowlist and echoes it back only if
      permitted, adding `Vary: Origin`.
    ref: "concepts.md#cors-as-a-controlled-relaxation"

  - id: sop-cors-and-csrf-013
    difficulty: intermediate
    tags: [cors, simple-request, methods]
    question: |
      Which combination qualifies as a CORS "simple request" that does NOT trigger a
      preflight?
    options:
      - "POST with Content-Type: application/x-www-form-urlencoded and no custom headers"
      - "PUT with Content-Type: application/json"
      - "GET with a custom X-Api-Key header"
      - "DELETE with no body"
    answer: 0
    explanation: |
      A simple request uses GET/HEAD/POST, only CORS-safelisted headers, and (if any) a
      Content-Type of application/x-www-form-urlencoded, multipart/form-data, or
      text/plain. The form-urlencoded POST with no custom headers qualifies; PUT/DELETE,
      JSON, and custom headers all force a preflight.
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-014
    difficulty: intermediate
    tags: [cors, content-type, simple-request]
    question: |
      Which three `Content-Type` values are allowed on a simple request without forcing a
      preflight?
    options:
      - "application/x-www-form-urlencoded, multipart/form-data, text/plain"
      - "text/html, application/json, multipart/form-data"
      - "application/json, text/xml, application/xml"
      - "text/plain, application/octet-stream, application/json"
    answer: 0
    explanation: |
      The only non-preflighting content types are application/x-www-form-urlencoded,
      multipart/form-data, and text/plain. Notably, application/json is NOT among them, so
      JSON requests are preflighted.
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-015
    difficulty: intermediate
    tags: [cors, preflight, options]
    question: |
      What are the two key request headers a browser sends in a CORS preflight OPTIONS
      request?
    options:
      - "Access-Control-Allow-Methods and Access-Control-Allow-Headers"
      - "Sec-Fetch-Mode and Sec-Fetch-Dest"
      - "Origin and Referer"
      - "Access-Control-Request-Method and Access-Control-Request-Headers"
    answer: 3
    explanation: |
      The preflight asks permission using Access-Control-Request-Method (the method the
      real request will use) and Access-Control-Request-Headers (the headers it will
      include). The server answers with the Access-Control-Allow-* headers.
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-016
    difficulty: intermediate
    tags: [cors, preflight, max-age]
    question: |
      What does the `Access-Control-Max-Age` response header on a preflight control?
    options:
      - "How long (in seconds) the browser may cache the preflight result and skip the OPTIONS round trip"
      - "The maximum age of cookies the server will accept"
      - "How long the browser session with the server stays open"
      - "The maximum time the actual request may take before timing out"
    answer: 0
    explanation: |
      Access-Control-Max-Age caches the preflight result for the given number of seconds,
      letting repeated calls skip the OPTIONS round trip. Browsers cap the value (e.g.,
      Chromium ~7200s, Firefox 86400s).
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-017
    difficulty: advanced
    tags: [cors, preflight, actual-request]
    question: |
      After a successful preflight, does the browser include the Access-Control-Request-*
      headers on the actual request?
    options:
      - "Yes, they are repeated on every subsequent request"
      - "No, those headers appear only on the OPTIONS preflight; the actual request omits them"
      - "Only Access-Control-Request-Method is repeated"
      - "Yes, but only if credentials are included"
    answer: 1
    explanation: |
      The Access-Control-Request-Method / Access-Control-Request-Headers headers exist
      only on the preflight OPTIONS request. The subsequent actual request does not carry
      them.
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-018
    difficulty: intermediate
    tags: [cors, credentials, wildcard]
    question: |
      A client makes a credentialed cross-origin request (`credentials: 'include'`). The
      server responds with `Access-Control-Allow-Origin: *`. What does the browser do?
    options:
      - "Blocks access — wildcard ACAO cannot be combined with credentials"
      - "Exposes the response, since `*` allows all origins"
      - "Strips the credentials and retries automatically"
      - "Exposes the response but ignores any Set-Cookie header"
    answer: 0
    explanation: |
      Wildcard ACAO with credentials is forbidden. The browser blocks the response. To
      allow credentialed reads the server must echo the explicit origin and send
      Access-Control-Allow-Credentials: true.
    ref: "concepts.md#allow-credentials-and-the-wildcard-rule"

  - id: sop-cors-and-csrf-019
    difficulty: intermediate
    tags: [cors, credentials]
    question: |
      For a browser to expose a credentialed cross-origin response to script, which TWO
      conditions must the server response satisfy?
    options:
      - "ACAO: * and Access-Control-Allow-Credentials: true"
      - "A matching Referer header and Set-Cookie"
      - "Access-Control-Max-Age > 0 and Vary: Origin"
      - "An explicit single origin in ACAO and Access-Control-Allow-Credentials: true"
    answer: 3
    explanation: |
      Credentialed reads require ACAO set to the explicit requesting origin (never `*`)
      AND Access-Control-Allow-Credentials: true. Missing either one causes the browser to
      block the response.
    ref: "concepts.md#allow-credentials-and-the-wildcard-rule"

  - id: sop-cors-and-csrf-020
    difficulty: advanced
    tags: [cors, credentials, allow-headers]
    question: |
      When a request includes credentials, why can't the server use `Access-Control-Allow-Headers: *`?
    options:
      - "Because with credentials, `*` is treated as the literal header name '*' rather than a wildcard, so real headers won't match"
      - "Because `*` is only valid on GET requests"
      - "Because credentialed requests cannot include custom headers at all"
      - "Because it would automatically expose all cookies"
    answer: 0
    explanation: |
      With credentials, the wildcard loses its special meaning: `*` in
      Access-Control-Allow-Headers/Methods/Expose-Headers is interpreted as a literal
      header/method named "*", not "all". You must enumerate explicit values.
    ref: "concepts.md#allow-credentials-and-the-wildcard-rule"

  - id: sop-cors-and-csrf-021
    difficulty: advanced
    tags: [cors, misconfiguration, reflection]
    question: |
      A server dynamically reflects the request's `Origin` into
      `Access-Control-Allow-Origin` and always adds `Access-Control-Allow-Credentials:
      true`, with no allowlist. Why is this dangerous?
    options:
      - "It slows down responses due to header computation"
      - "It only affects GET requests, so it is low risk"
      - "It causes the browser to strip cookies from the response"
      - "It effectively grants any origin (including attackers') credentialed read access to authenticated data, bypassing the browser's wildcard+credentials block"
    answer: 3
    explanation: |
      Reflecting arbitrary origins plus Allow-Credentials: true is equivalent to
      `*`+credentials but evades the wildcard block. Any attacker origin can read the
      victim's authenticated responses. Fix: reflect only allowlisted origins.
    ref: "concepts.md#common-cors-misconfigurations"

  - id: sop-cors-and-csrf-022
    difficulty: advanced
    tags: [cors, misconfiguration, origin-matching]
    question: |
      A CORS allowlist check uses `origin.endsWith("example.com")`. Which attacker origin
      would incorrectly pass this check?
    options:
      - "https://evilexample.com"
      - "https://app.example.com"
      - "https://example.org"
      - "https://sub.example.net"
    answer: 0
    explanation: |
      `endsWith("example.com")` matches `https://evilexample.com` because that string ends
      in "example.com". Substring/prefix/suffix matching is unsafe; use exact equality
      against an allowlist. (Anchored, escaped comparisons only.)
    ref: "concepts.md#common-cors-misconfigurations"

  - id: sop-cors-and-csrf-023
    difficulty: advanced
    tags: [cors, misconfiguration, null-origin]
    question: |
      Why is allowlisting `Access-Control-Allow-Origin: null` dangerous?
    options:
      - "The `null` origin is unused and simply wastes a header slot"
      - "An attacker can produce an `Origin: null` (e.g., via a sandboxed iframe or data: document) and read the response"
      - "It disables HTTPS for the connection"
      - "It forces all requests to be preflighted"
    answer: 1
    explanation: |
      `Origin: null` is sent by sandboxed iframes, data:/file: documents, and some
      redirects — situations an attacker can engineer. Allowlisting `null` (especially with
      credentials) lets attacker-controlled contexts read responses. Never allowlist null.
    ref: "concepts.md#common-cors-misconfigurations"

  - id: sop-cors-and-csrf-024
    difficulty: intermediate
    tags: [cors, vary-origin, caching]
    question: |
      Why should a server that reflects the request `Origin` into ACAO also send `Vary:
      Origin`?
    options:
      - "To prevent a shared cache from serving one origin's ACAO response to a different origin"
      - "To tell the browser to vary the request method"
      - "To force the browser to send credentials"
      - "To disable preflight caching"
    answer: 0
    explanation: |
      When ACAO depends on the request Origin, a shared cache keyed only on the URL could
      serve origin A's response (with A's ACAO) to origin B. `Vary: Origin` makes the
      cache key include the Origin header, avoiding this.
    ref: "concepts.md#common-cors-misconfigurations"

  - id: sop-cors-and-csrf-025
    difficulty: beginner
    tags: [csrf, definition]
    question: |
      What does a CSRF attack accomplish?
    options:
      - "It reads a victim's cross-origin data from a malicious script"
      - "It tricks a logged-in victim's browser into sending a state-changing request the victim didn't intend"
      - "It steals the victim's session cookie via injected JavaScript"
      - "It intercepts the victim's traffic on the network"
    answer: 1
    explanation: |
      CSRF forces the victim's browser to send an unintended state-changing request to a
      site where they're authenticated. It exploits the browser automatically attaching
      cookies (ambient authority). It is a write attack and doesn't require reading the
      response.
    ref: "concepts.md#csrf-mechanics"

  - id: sop-cors-and-csrf-026
    difficulty: intermediate
    tags: [csrf, ambient-authority]
    question: |
      What browser behavior does classic cookie-based CSRF fundamentally exploit?
    options:
      - "The browser caches responses across origins"
      - "The browser ignores the Same-Origin Policy for POST requests"
      - "The browser sends the Authorization header on every request"
      - "The browser automatically attaches the site's cookies to requests regardless of which page triggered them"
    answer: 3
    explanation: |
      CSRF relies on ambient authority: cookies (and Basic auth) are auto-sent to their
      domain no matter what page initiated the request. Bearer tokens the app must add
      explicitly are not auto-sent, so such APIs aren't CSRF-able the same way.
    ref: "concepts.md#csrf-mechanics"

  - id: sop-cors-and-csrf-027
    difficulty: intermediate
    tags: [csrf, get, side-effects]
    question: |
      Why is using GET for a state-changing operation especially dangerous with respect to
      CSRF?
    options:
      - "GET requests are always cached and replayed"
      - "A GET can be triggered by an `<img src>` tag with no user interaction, and SameSite=Lax still permits cross-site top-level GET navigations"
      - "GET requests bypass HTTPS"
      - "GET requests cannot include a CSRF token"
    answer: 1
    explanation: |
      A state-changing GET can be fired by a simple `<img>` tag (auto-loaded), by prefetch,
      or by a link — with cookies attached. Even SameSite=Lax allows cross-site top-level
      GET navigations. The first rule of CSRF defense is: never use GET for state changes.
    ref: "concepts.md#csrf-mechanics"

  - id: sop-cors-and-csrf-028
    difficulty: intermediate
    tags: [csrf, form, simple-request]
    question: |
      An attacker's page auto-submits a hidden form POSTing to `bank.com/transfer`. Why
      does this fire successfully without a CORS preflight?
    options:
      - "Forms are exempt from the Same-Origin Policy only for GET"
      - "The form request is same-origin, so CORS doesn't apply"
      - "The browser preflights it but the attacker's server approves it"
      - "A form POST uses a CORS-safelisted content type (e.g. x-www-form-urlencoded), making it a simple request that isn't preflighted"
    answer: 3
    explanation: |
      An HTML form can only produce safelisted content types (x-www-form-urlencoded,
      multipart/form-data, text/plain), so its cross-origin POST is a simple request — no
      preflight — and it fires with cookies. The attacker never needs to read the response.
    ref: "concepts.md#csrf-mechanics"

  - id: sop-cors-and-csrf-029
    difficulty: advanced
    tags: [csrf, bearer-tokens]
    question: |
      An API authenticates every request with a bearer token that the SPA reads from
      memory and puts in an `Authorization: Bearer ...` header. Is this API vulnerable to
      classic cookie-based CSRF?
    options:
      - "Yes, because all APIs are CSRF-vulnerable by default"
      - "No, because the browser does not automatically attach an Authorization header; the app must add the token explicitly"
      - "Yes, because bearer tokens are sent on cross-origin requests automatically"
      - "No, because bearer tokens cannot be stolen"
    answer: 1
    explanation: |
      Classic CSRF needs a credential the browser auto-attaches (cookies, Basic auth). A
      bearer token the app must explicitly add is not auto-sent cross-origin, so an
      attacker's forged request lacks it. (Other risks like XSS-based token theft still
      apply.)
    ref: "concepts.md#csrf-mechanics"

  - id: sop-cors-and-csrf-030
    difficulty: beginner
    tags: [csrf, samesite]
    question: |
      What does the cookie attribute `SameSite=Strict` do?
    options:
      - "Encrypts the cookie value"
      - "Sends the cookie only over HTTPS"
      - "Restricts the cookie to a single path"
      - "Prevents the cookie from being sent on any cross-site request, including link navigations"
    answer: 3
    explanation: |
      SameSite=Strict tells the browser never to send the cookie on cross-site requests,
      even top-level navigations from a link. This removes the ambient authority CSRF
      depends on (at some UX cost). Secure enforces HTTPS-only; that's a separate attribute.
    ref: "concepts.md#csrf-defense-samesite-cookies"

  - id: sop-cors-and-csrf-031
    difficulty: intermediate
    tags: [csrf, samesite, lax]
    question: |
      Under `SameSite=Lax`, on which cross-site requests IS the cookie still sent?
    options:
      - "Only on top-level navigations using a safe method (e.g. clicking a link that does a GET)"
      - "On cross-site `fetch`/XHR requests"
      - "On all cross-site POST requests"
      - "On cross-site iframe subresource loads"
    answer: 0
    explanation: |
      Lax sends the cookie only on top-level navigations with safe methods (GET). It is
      NOT sent on cross-site POST, fetch/XHR, image loads, or iframes. This is why a
      cross-site POST form attack is blocked under Lax but a state-changing GET is not.
    ref: "concepts.md#csrf-defense-samesite-cookies"

  - id: sop-cors-and-csrf-032
    difficulty: advanced
    tags: [csrf, samesite, subdomain]
    question: |
      Why is SameSite alone considered defense-in-depth rather than a complete CSRF
      solution?
    options:
      - "It is scoped to the registrable site (not origin), so a sibling/attacker-controlled subdomain counts as same-site; and Lax still permits state-changing GETs"
      - "It only works in Internet Explorer"
      - "It disables cookies entirely, breaking the session"
      - "It requires the Secure flag, which most sites cannot set"
    answer: 0
    explanation: |
      SameSite compares the registrable site, so `evil.example.com` is same-site with
      `app.example.com` and can send "same-site" requests. Also Lax still allows
      cross-site top-level GETs. OWASP recommends combining SameSite with a token.
    ref: "concepts.md#csrf-defense-samesite-cookies"

  - id: sop-cors-and-csrf-033
    difficulty: intermediate
    tags: [csrf, samesite-none]
    question: |
      A cookie must be sent on legitimate cross-site requests. Which SameSite setting is
      required, and what else must be true?
    options:
      - "SameSite=Strict, and the cookie must be HttpOnly"
      - "SameSite=None, and the cookie must also be marked Secure"
      - "SameSite=Lax, and the domain must be an eTLD"
      - "No SameSite attribute at all, which defaults to None"
    answer: 1
    explanation: |
      SameSite=None allows the cookie on all cross-site requests, but browsers require it
      to also be Secure (HTTPS-only). Note the modern browser default for an unspecified
      SameSite is Lax, not None.
    ref: "concepts.md#csrf-defense-samesite-cookies"

  - id: sop-cors-and-csrf-034
    difficulty: intermediate
    tags: [csrf, synchronizer-token]
    question: |
      Why does the synchronizer token pattern defeat CSRF?
    options:
      - "It encrypts the request body so the attacker can't read it"
      - "It sets the SameSite attribute automatically"
      - "It forces every request to be preflighted"
      - "The attacker's cross-site page cannot read the unpredictable token embedded in the victim's page (SOP blocks reading it), so it can't include the correct value"
    answer: 3
    explanation: |
      The server embeds a random, session-bound token in the page. SOP prevents the
      attacker's origin from reading bank.com's HTML, so the attacker cannot learn the
      token and cannot forge a valid request. The server rejects any request with a
      missing/wrong token.
    ref: "concepts.md#csrf-defense-synchronizer-token-pattern"

  - id: sop-cors-and-csrf-035
    difficulty: advanced
    tags: [csrf, synchronizer-token, storage]
    question: |
      For the synchronizer token pattern, which statement about the token is correct?
    options:
      - "It should be transmitted only in a cookie so the browser sends it automatically"
      - "It should be a high-entropy CSPRNG value, tied to the session server-side, and sent in the request body or a custom header — not leaked in URLs or the Referer"
      - "It can be a predictable counter as long as it changes every request"
      - "It must be the same for all users to simplify validation"
    answer: 1
    explanation: |
      The token must be unpredictable (CSPRNG), unique/bound per session, validated
      server-side, and not placed in cookies (that's double-submit) or leaked via URLs,
      logs, or Referer. Predictable or shared tokens defeat the purpose.
    ref: "concepts.md#csrf-defense-synchronizer-token-pattern"

  - id: sop-cors-and-csrf-036
    difficulty: advanced
    tags: [csrf, double-submit, naive]
    question: |
      Why is the "naive" double-submit cookie pattern (cookie value must equal a submitted
      parameter, with no cryptographic binding) discouraged?
    options:
      - "It requires server-side session state, defeating the point"
      - "It only works over HTTP/1.1"
      - "An attacker who can write a cookie on the target domain (e.g. via a subdomain) can set both the cookie and the matching parameter to a value they know"
      - "Browsers no longer send cookies twice"
    answer: 2
    explanation: |
      Naive double-submit is bypassable by cookie injection: cookies aren't origin-isolated
      like SOP reads, so an attacker controlling a subdomain (or MITMing an http subdomain)
      can plant a cookie for the parent domain and supply the same value as the parameter.
      The recommended fix is a signed (HMAC), session-bound token.
    ref: "concepts.md#csrf-defense-double-submit-cookie"

  - id: sop-cors-and-csrf-037
    difficulty: advanced
    tags: [csrf, double-submit, hmac]
    question: |
      What makes the "signed double-submit cookie" the recommended stateless variant?
    options:
      - "It stores the token in server-side session state"
      - "It uses a longer random value than the naive version"
      - "The token is an HMAC over a session-bound value using a server secret, so an attacker who can inject cookies still cannot forge a valid token"
      - "It transmits the token only over the Referer header"
    answer: 2
    explanation: |
      Signing the token with HMAC over a session-bound value (plus a secret and a nonce)
      means an attacker lacking the secret cannot produce a valid token even if they can
      write cookies. OWASP stresses that signing WITHOUT session binding is still weak.
    ref: "concepts.md#csrf-defense-double-submit-cookie"

  - id: sop-cors-and-csrf-038
    difficulty: intermediate
    tags: [csrf, custom-header]
    question: |
      Requiring a custom header like `X-CSRF-Token` on state-changing requests defends
      against CSRF because...
    options:
      - "custom headers are encrypted by the browser"
      - "the header value is checked against the user's password"
      - "adding a custom header on a cross-origin request forces a CORS preflight, which the attacker's origin cannot get approved; forms also can't set custom headers"
      - "the browser refuses to send custom headers cross-origin under any circumstances"
    answer: 2
    explanation: |
      A cross-origin request with a custom header is no longer a simple request — it
      triggers a preflight. The attacker's origin can't get that approved, and HTML forms
      can't set custom headers at all. So a successfully-received custom header implies a
      permitted/same-origin caller.
    ref: "concepts.md#csrf-defense-custom-header-and-fetch-metadata"

  - id: sop-cors-and-csrf-039
    difficulty: advanced
    tags: [csrf, fetch-metadata, sec-fetch-site]
    question: |
      How can the `Sec-Fetch-Site` header be used as a CSRF/clickjacking signal, and why
      is it trustworthy?
    options:
      - "The server can set it to force browsers to block cross-site requests"
      - "It contains the CSRF token so it can be validated directly"
      - "It is a browser-set forbidden header (script cannot spoof it); the server can reject state-changing requests where its value is `cross-site`"
      - "It is only present on same-origin requests, so its absence proves the request is safe"
    answer: 2
    explanation: |
      Sec-Fetch-Site is part of Fetch Metadata: a forbidden header the browser sets and
      script cannot forge. A server can allow same-origin/same-site/none and reject
      cross-site for state-changing endpoints, with an Origin/Referer fallback for older
      clients.
    ref: "concepts.md#csrf-defense-custom-header-and-fetch-metadata"

  - id: sop-cors-and-csrf-040
    difficulty: intermediate
    tags: [csrf, origin-referer]
    question: |
      Why can a server trust the `Origin` header for CSRF origin-validation but should not
      trust an ordinary custom header set by the request?
    options:
      - "Origin is encrypted end-to-end"
      - "Origin is validated by the DNS resolver"
      - "Origin is a forbidden request header set by the browser and cannot be spoofed by cross-origin script"
      - "Origin is only present on same-origin requests"
    answer: 2
    explanation: |
      Origin (and Referer) are forbidden headers the browser controls; page script cannot
      set or forge them cross-origin. So the server can compare Origin exactly against the
      expected target origin as a CSRF check (with Referer hostname as fallback).
    ref: "concepts.md#csrf-defense-origin-and-referer-validation"

  - id: sop-cors-and-csrf-041
    difficulty: advanced
    tags: [csrf, origin-referer, matching]
    question: |
      When validating the Origin header for CSRF defense, which is the correct approach?
    options:
      - "Accept the request if the Origin merely contains the expected domain as a substring"
      - "Accept any request whose Origin ends with your registrable domain"
      - "Exact-match the Origin against the expected target origin; if neither Origin nor Referer is present on a state-changing request, fail closed (block)"
      - "Trust the Referer but ignore the Origin entirely"
    answer: 2
    explanation: |
      Origin/Referer checks must use strict exact matching (so app.example.com.evil.com
      and evil.com/app.example.com are rejected). If both headers are absent on a
      state-changing request, block. Substring/suffix checks are exploitable.
    ref: "concepts.md#csrf-defense-origin-and-referer-validation"

  - id: sop-cors-and-csrf-042
    difficulty: intermediate
    tags: [cors, csrf, misconception]
    question: |
      A team says: "We configured a strict CORS allowlist, so our app is protected from
      CSRF." Why is this reasoning flawed?
    options:
      - "CORS only works over HTTP/2, which they aren't using"
      - "A strict CORS policy actually increases CSRF risk"
      - "CORS governs whether a script may READ a response; CSRF only needs the request's write side-effect to occur, which CORS does not prevent"
      - "CORS and CSRF are the same thing, so the statement is redundant"
    answer: 2
    explanation: |
      CORS is about read authorization; CSRF is about causing a write. The classic CSRF
      vectors (form/img/navigation) aren't even subject to CORS, and even a blocked fetch
      read still lets the request execute server-side. CORS and CSRF are orthogonal.
    ref: "concepts.md#cors-does-not-prevent-csrf"

  - id: sop-cors-and-csrf-043
    difficulty: advanced
    tags: [cors, csrf, incidental-protection]
    question: |
      In what narrow way does a CORS/preflight requirement INCIDENTALLY reduce CSRF risk?
    options:
      - "It blocks the attacker from reading the response, which stops the write"
      - "CORS automatically sets SameSite=Strict on all cookies"
      - "If the API only accepts application/json (or requires a custom header), an attacker's cross-origin fetch is preflighted; if the server denies the preflight, the actual request is never sent"
      - "CORS rejects all POST requests from other origins"
    answer: 2
    explanation: |
      Requiring a non-simple request (JSON body or custom header) forces a preflight; a
      denied preflight means the browser never sends the actual request. This is a fragile
      side effect, not real CSRF defense — pair it with SameSite and tokens.
    ref: "concepts.md#cors-does-not-prevent-csrf"

  - id: sop-cors-and-csrf-044
    difficulty: beginner
    tags: [clickjacking, definition]
    question: |
      What is clickjacking?
    options:
      - "Injecting JavaScript into a page to steal cookies"
      - "Loading a target site in a transparent/obscured iframe so the victim's real clicks trigger unintended authenticated actions"
      - "Guessing session IDs by brute force"
      - "Redirecting a user to a phishing page via DNS spoofing"
    answer: 1
    explanation: |
      Clickjacking (UI redressing) frames the real site invisibly over attacker content so
      the victim's genuine clicks act on the framed page while they believe they're
      clicking elsewhere. Because it uses the real page, CSRF tokens don't help.
    ref: "concepts.md#clickjacking-and-frame-ancestors"

  - id: sop-cors-and-csrf-045
    difficulty: intermediate
    tags: [clickjacking, csp, frame-ancestors]
    question: |
      Which is the modern, preferred mechanism to prevent your site from being framed for
      clickjacking?
    options:
      - "The CSP `frame-ancestors` directive (e.g. `frame-ancestors 'none'` or `'self'`)"
      - "Setting SameSite=Strict on all cookies"
      - "Adding a CSRF token to every button"
      - "Serving the page over HTTP/3"
    answer: 0
    explanation: |
      CSP's frame-ancestors directive controls which origins may frame the page and is the
      preferred, allowlist-capable control. `frame-ancestors 'none'` blocks all framing;
      `'self'` allows only same-origin.
    ref: "concepts.md#clickjacking-and-frame-ancestors"

  - id: sop-cors-and-csrf-046
    difficulty: advanced
    tags: [clickjacking, x-frame-options, frame-ancestors]
    question: |
      How do `X-Frame-Options` and CSP `frame-ancestors` relate?
    options:
      - "X-Frame-Options is the legacy header (DENY/SAMEORIGIN, no multi-origin allowlist); frame-ancestors is the modern CSP directive and overrides X-Frame-Options in modern browsers"
      - "They are identical; either one is sufficient and they never conflict"
      - "frame-ancestors is legacy and X-Frame-Options is the modern replacement"
      - "X-Frame-Options can list multiple allowed origins, but frame-ancestors cannot"
    answer: 0
    explanation: |
      X-Frame-Options (DENY/SAMEORIGIN; ALLOW-FROM is obsolete) is the legacy header and
      cannot express a multi-origin allowlist. CSP frame-ancestors is the modern directive,
      supports allowlists, and takes precedence in modern browsers. Keep X-Frame-Options
      only for old-browser support.
    ref: "concepts.md#clickjacking-and-frame-ancestors"

  - id: sop-cors-and-csrf-047
    difficulty: advanced
    tags: [clickjacking, csrf-tokens]
    question: |
      Why don't anti-CSRF tokens protect against clickjacking?
    options:
      - "Because the attacker frames the genuine page, which already contains the valid token; the victim's real click submits it legitimately"
      - "Because clickjacking strips the token from the request"
      - "Because tokens only work over HTTPS"
      - "Because clickjacking uses GET requests, which never carry tokens"
    answer: 0
    explanation: |
      In clickjacking the real page (with its correct token) is framed; the victim's actual
      click submits the real form with the valid token. The request is genuine from the
      server's view, so tokens don't help — you need framing controls (frame-ancestors).
    ref: "concepts.md#clickjacking-and-frame-ancestors"

  - id: sop-cors-and-csrf-048
    difficulty: intermediate
    tags: [csrf, defense-selection, scenario]
    question: |
      A stateless JSON API uses cookie-based sessions and wants robust CSRF protection.
      Which combination is the strongest, correct choice?
    options:
      - "Rely on CORS with `Access-Control-Allow-Origin: *`"
      - "Set the CSRF token in a cookie and compare it to the same cookie server-side"
      - "Only validate that the request uses POST rather than GET"
      - "SameSite=Lax (or Strict) cookies PLUS a signed, session-bound anti-CSRF token or a required custom header"
    answer: 3
    explanation: |
      Defense-in-depth: SameSite removes most ambient authority, and a signed
      session-bound token (or a required custom header forcing preflight) covers the gaps
      (sibling subdomains, older browsers). Wildcard CORS, POST-only, and comparing a
      cookie to itself are all inadequate.
    ref: "concepts.md#cors-does-not-prevent-csrf"

  - id: sop-cors-and-csrf-049
    difficulty: beginner
    tags: [same-origin-policy, storage]
    question: |
      Which of these is isolated per-origin by the Same-Origin Policy?
    options:
      - "The DNS cache"
      - "localStorage, cookies, and IndexedDB"
      - "The system clock"
      - "The list of installed browser extensions"
    answer: 1
    explanation: |
      SOP isolates client-side storage — localStorage, cookies, IndexedDB — so one origin's
      script cannot read another origin's stored data. (Cookies use the looser "site"/domain
      scope but are still not readable across unrelated origins by script.)
    ref: "concepts.md#what-sop-blocks-and-doesnt-block"

  - id: sop-cors-and-csrf-050
    difficulty: intermediate
    tags: [cors, preflight, scenario]
    question: |
      A frontend at `https://app.example.com` sends `fetch('https://api.example.com/orders',
      { method: 'POST', headers: {'Content-Type':'application/json'}, credentials:'include' })`.
      Which statement is correct?
    options:
      - "It is a simple request and no OPTIONS preflight is sent"
      - "The cookies are sent only if ACAO is `*`"
      - "Because both hosts share example.com, CORS does not apply"
      - "The browser first sends an OPTIONS preflight; the actual POST proceeds only if api.example.com approves the method, headers, origin, and credentials"
    answer: 3
    explanation: |
      application/json is not a safelisted content type, so the request is preflighted. The
      cross-origin POST proceeds only if the preflight response allows the origin, method,
      and headers, and (for credentials) echoes the explicit origin with
      Allow-Credentials: true. api and app are different origins, so CORS applies.
    ref: "concepts.md#simple-requests-vs-preflighted-requests"

  - id: sop-cors-and-csrf-051
    difficulty: advanced
    tags: [postmessage, cross-window, targetorigin]
    question: |
      A page calls `popup.postMessage(sensitiveToken, "*")` right after opening an SSO popup.
      What is the concrete risk of the wildcard `targetOrigin`?
    options:
      - "If the popup navigated to an attacker origin (e.g. via an open redirect) before delivery, the token is delivered to the attacker"
      - "The message is rejected because `*` is not a valid targetOrigin"
      - "The browser strips the message body when targetOrigin is `*`"
      - "It forces a CORS preflight before the message is delivered"
    answer: 0
    explanation: |
      targetOrigin is a delivery constraint. With `"*"`, the browser delivers to whatever
      origin the target window currently holds — if it was navigated to an attacker origin
      between the call and delivery, the sensitive message leaks. Always name the exact
      recipient origin.
    ref: "concepts.md#cross-window-messaging-with-postmessage"

  - id: sop-cors-and-csrf-052
    difficulty: expert
    tags: [postmessage, origin-check, anti-pattern]
    question: |
      A message handler guards with `if (event.origin.indexOf("trusted.com") !== -1) { ... }`.
      Which origin bypasses this check?
    options:
      - "https://trusted.com"
      - "https://api.trusted.com"
      - "https://trusted.com.attacker.com"
      - "https://TRUSTED.COM"
    answer: 2
    explanation: |
      A substring/`indexOf` test matches any origin that merely contains the string
      "trusted.com", including `https://trusted.com.attacker.com` (and `attacker-trusted.com`).
      Receivers must compare `event.origin` by exact FQDN equality, not substring.
    ref: "concepts.md#cross-window-messaging-with-postmessage"

  - id: sop-cors-and-csrf-053
    difficulty: advanced
    tags: [postmessage, dom-xss]
    question: |
      Beyond validating `event.origin`, what is the other essential rule when handling a
      received postMessage `event.data`?
    options:
      - "Echo it back to the sender with postMessage to confirm receipt"
      - "Store it in localStorage so other tabs can read it"
      - "Treat it as untrusted input and never sink it into innerHTML, eval, or document.write"
      - "Base64-encode it before use to neutralize any scripts"
    answer: 2
    explanation: |
      event.data is attacker-influenced input. Sinking it into innerHTML/eval/document.write/
      Function is a top DOM-XSS vector (and a client-side CSRF enabler). Validate/sanitize it
      and use safe sinks; exact-origin checking alone is not enough.
    ref: "concepts.md#cross-window-messaging-with-postmessage"

  - id: sop-cors-and-csrf-054
    difficulty: expert
    tags: [document-domain, origin-agent-cluster, deprecation]
    question: |
      Which statement about `document.domain` is correct in a modern browser?
    options:
      - "It is the recommended way for two subdomains to share the DOM securely"
      - "Setting it only relaxes access to the exact same host, preserving the port"
      - "Setting it grants blanket DOM access across the eTLD+1 and nulls the port; it is deprecated and disabled under Origin-Agent-Cluster: ?1 or COOP+COEP isolation"
      - "It has no effect on the Same-Origin Policy at all"
    answer: 2
    explanation: |
      document.domain widens the trust boundary to the whole registrable domain and resets
      the origin's port to null (so a different-port neighbor gains access). It is deprecated;
      Origin-Agent-Cluster: ?1 and cross-origin isolation disable it. Use postMessage instead.
    ref: "concepts.md#documentdomain-and-origin-agent-cluster"

  - id: sop-cors-and-csrf-055
    difficulty: expert
    tags: [cswsh, websocket, csrf]
    question: |
      A chat backend authenticates the WebSocket handshake using only the session cookie, with
      no Origin check and no CSRF token. Why is this MORE dangerous than a classic CSRF write?
    options:
      - "The WebSocket handshake cannot carry cookies, so no session is used"
      - "CORS blocks the handshake but allows the data frames"
      - "Sec-WebSocket-Key authenticates the connection, so only replay is possible"
      - "The handshake is a GET carrying cookies, and the WebSocket data channel is not gated by CORS, so the attacker gets bidirectional read AND write in the victim's session"
    answer: 3
    explanation: |
      The handshake is a plain HTTP GET with Upgrade: websocket and carries cookies. Because
      WebSocket data is not subject to CORS read-blocking, cross-site WebSocket hijacking lets
      the attacker both send commands and read replies. Sec-WebSocket-Key is anti-caching, not
      auth. Fix: server-side Origin validation + CSRF ticket + SameSite.
    ref: "concepts.md#cross-site-websocket-hijacking-cswsh"

  - id: sop-cors-and-csrf-056
    difficulty: advanced
    tags: [cswsh, defense]
    question: |
      Which set of measures correctly defends a cookie-authenticated WebSocket endpoint
      against Cross-Site WebSocket Hijacking?
    options:
      - "Rely on Sec-WebSocket-Key and wss:// (TLS) alone"
      - "Add Access-Control-Allow-Origin: * to the handshake response"
      - "Validate the Origin header server-side on the handshake, require a CSRF token/ticket in the handshake, and set SameSite on the session cookie"
      - "Switch the handshake from GET to POST"
    answer: 2
    explanation: |
      CORS does not protect WebSockets, so the defenses are: server-side Origin validation on
      the handshake, an unpredictable CSRF token/one-time ticket, and SameSite cookies so the
      cookie isn't sent cross-site. TLS and Sec-WebSocket-Key do not stop CSWSH; the handshake
      method is fixed as GET.
    ref: "concepts.md#cross-site-websocket-hijacking-cswsh"

  - id: sop-cors-and-csrf-057
    difficulty: expert
    tags: [coop, xs-leaks, window-opener]
    question: |
      What does `Cross-Origin-Opener-Policy: same-origin` accomplish?
    options:
      - "It allows any origin to read the page's fetch responses"
      - "It forces all subresources to be loaded with CORS"
      - "It severs the window.opener relationship across origins, so a cross-origin window cannot reach back into your window"
      - "It sets SameSite=Strict on all cookies for the document"
    answer: 2
    explanation: |
      COOP: same-origin isolates the browsing-context group so cross-origin windows you open
      (or that open you) lose the window.opener reference, mitigating XS-Leaks and
      tabnabbing-style probing. It is unrelated to reading fetch responses (that's CORS).
    ref: "concepts.md#cross-origin-isolation-coop-coep-corp"

  - id: sop-cors-and-csrf-058
    difficulty: expert
    tags: [coep, coop, sharedarraybuffer]
    question: |
      Which header combination makes a document "cross-origin isolated," unlocking APIs like
      SharedArrayBuffer and high-resolution timers?
    options:
      - "Cross-Origin-Opener-Policy: same-origin AND Cross-Origin-Embedder-Policy: require-corp"
      - "Access-Control-Allow-Origin: * AND Access-Control-Allow-Credentials: true"
      - "X-Frame-Options: DENY AND Content-Security-Policy: frame-ancestors 'none'"
      - "Strict-Transport-Security AND Referrer-Policy: no-referrer"
    answer: 0
    explanation: |
      Cross-origin isolation requires COOP: same-origin plus COEP: require-corp. Those powerful
      APIs are gated behind isolation because they enable Spectre-style timing side channels.
      The other combinations control framing, CORS, or transport, not isolation.
    ref: "concepts.md#cross-origin-isolation-coop-coep-corp"

  - id: sop-cors-and-csrf-059
    difficulty: advanced
    tags: [corp, embedding]
    question: |
      What does `Cross-Origin-Resource-Policy: same-origin` on a response do?
    options:
      - "Lets any origin's script read the response body via fetch"
      - "Adds the resource to the CORS safelist"
      - "Forces the resource to be served only over HTTP/2"
      - "Instructs the browser to refuse cross-origin no-cors embedding of that resource"
    answer: 3
    explanation: |
      CORP lets a resource declare who may embed it (same-origin, same-site, cross-origin). It
      lets a sensitive endpoint block cross-origin no-cors embedding, mitigating Spectre-style
      side-channel reads and XSSI. It is about embedding, not fetch-response reading (CORS).
    ref: "concepts.md#cross-origin-isolation-coop-coep-corp"

  - id: sop-cors-and-csrf-060
    difficulty: expert
    tags: [private-network-access, preflight]
    question: |
      Under Private Network Access, when a page on a public origin fetches from a loopback/
      private IP, what handshake must succeed?
    options:
      - "The browser sends a preflight with Access-Control-Request-Private-Network: true and the target must reply Access-Control-Allow-Private-Network: true (plus a matching ACAO)"
      - "The server must send Strict-Transport-Security"
      - "No preflight is sent because loopback is always same-origin"
      - "The browser requires the target to present a valid TLS certificate for the public origin"
    answer: 0
    explanation: |
      PNA adds a preflight carrying Access-Control-Request-Private-Network: true when a
      less-private origin targets a more-private address; the target must respond with
      Access-Control-Allow-Private-Network: true and allow the origin. This guards routers/IoT/
      localhost from CSRF and DNS rebinding.
    ref: "concepts.md#private-network-access-pna"

  - id: sop-cors-and-csrf-061
    difficulty: expert
    tags: [private-network-access, no-cors]
    question: |
      What is notable about when the Private Network Access preflight fires, compared to
      ordinary CORS?
    options:
      - "It only fires for requests with Content-Type: application/json"
      - "It never fires for GET requests"
      - "It fires even for no-cors requests (and otherwise-simple/same-origin ones) when the target address is more private than the initiator"
      - "It only fires when credentials are included"
    answer: 2
    explanation: |
      PNA guards exactly the requests classic CORS never did: it triggers a preflight even for
      no-cors requests and requests that would otherwise be simple/same-origin, whenever the
      destination is a more-private address space. That's what closes the localhost/IoT CSRF
      gap.
    ref: "concepts.md#private-network-access-pna"

  - id: sop-cors-and-csrf-062
    difficulty: expert
    tags: [dns-rebinding, sop-bypass]
    question: |
      In a DNS rebinding attack, how does the attacker read responses from an internal service
      despite the Same-Origin Policy?
    options:
      - "By sending Access-Control-Allow-Origin: * from the attacker's server"
      - "By exploiting a CORS reflection bug on the internal service"
      - "By re-resolving their own hostname to an internal IP after serving JS, so the browser still treats requests to that unchanged hostname as same-origin"
      - "By setting document.domain to the internal service's hostname"
    answer: 2
    explanation: |
      SOP keys on hostname, not resolved IP. The attacker serves JS from attacker.com, then
      rebinds attacker.com's DNS (short TTL) to 127.0.0.1 or an internal IP. The browser still
      considers attacker.com same-origin, so the JS reads the internal service's responses.
    ref: "concepts.md#dns-rebinding"

  - id: sop-cors-and-csrf-063
    difficulty: advanced
    tags: [dns-rebinding, defense]
    question: |
      Which defense most directly stops DNS rebinding against an internal HTTP service?
    options:
      - "Adding Vary: Origin to responses"
      - "Strict Host-header validation/allowlisting (reject unexpected Host values like attacker.com)"
      - "Setting SameSite=Lax on the service's cookies"
      - "Enabling gzip compression on responses"
    answer: 1
    explanation: |
      After rebinding, requests still carry Host: attacker.com. Validating the Host header
      against an allowlist rejects them. Complementary defenses: resolver rebinding protection,
      Private Network Access, authentication, and TLS (a cert for attacker.com won't validate
      for 127.0.0.1).
    ref: "concepts.md#dns-rebinding"

  - id: sop-cors-and-csrf-064
    difficulty: expert
    tags: [login-csrf, session-fixation]
    question: |
      Why does a login form need CSRF protection even though the user is not yet
      authenticated, and what is the correct mechanism?
    options:
      - "It doesn't — CSRF only applies after login"
      - "Use the victim's password hash as the token"
      - "Require the login to be a GET request so the browser attaches SameSite cookies"
      - "Login CSRF logs the victim into the ATTACKER's account; use a pre-session token issued to the anonymous visitor and rotate the session ID on successful login"
    answer: 3
    explanation: |
      In login CSRF the attacker forges a login with their own credentials so the victim's
      activity lands in the attacker's account. Since no session exists yet, bind a pre-session
      token to the anonymous visitor and rotate the session ID on authentication (which also
      prevents session fixation).
    ref: "concepts.md#login-csrf-and-logout-csrf"

  - id: sop-cors-and-csrf-065
    difficulty: expert
    tags: [samesite, lax-by-default, two-minute-window]
    question: |
      Chrome's "Lax-by-default" behavior has a subtlety attackers exploit. Which statement is
      accurate?
    options:
      - "Cookies with an explicit SameSite=Lax are sent on cross-site top-level POST for 2 minutes after being set"
      - "Cookies set with NO explicit SameSite are still sent on cross-site top-level POST for ~120 seconds after being set; explicitly setting SameSite=Lax avoids this window"
      - "The default is SameSite=None, so all cookies are sent cross-site"
      - "The 2-minute window applies to fetch/XHR requests, not navigations"
    answer: 1
    explanation: |
      Cookies with no explicit SameSite are Lax-by-default but exempt top-level cross-site POST
      for ~120s (an SSO/POST compatibility grace). This does NOT apply to explicit
      SameSite=Lax. Attackers can refresh the window by forcing a fresh cookie via a top-level
      OAuth round trip — so set SameSite explicitly.
    ref: "concepts.md#samesite-bypasses-and-edge-cases"

  - id: sop-cors-and-csrf-066
    difficulty: expert
    tags: [samesite, redirect-gadget, strict]
    question: |
      Even with SameSite=Strict session cookies, a state change is forged. The app has a
      CLIENT-SIDE open redirect (`location = params.next`). Why does the cookie get sent?
    options:
      - "Strict cookies are always sent on GET requests"
      - "SameSite=Strict is ignored on HTTPS"
      - "A client-side (DOM) redirect makes the secondary request originate from the site's own document, so the browser treats it as same-site and includes Strict cookies — unlike a server-side 3xx which the browser remembers as cross-site"
      - "The redirect converts the request to same-origin by changing the Host header"
    answer: 2
    explanation: |
      With a client-side redirect the navigation is initiated by the site's own document, so
      the browser considers the resulting request same-site and sends Strict cookies. A
      server-side 3xx redirect does NOT do this — the browser preserves the cross-site initiator
      and withholds the cookie. This asymmetry is a well-known Strict bypass.
    ref: "concepts.md#samesite-bypasses-and-edge-cases"

  - id: sop-cors-and-csrf-067
    difficulty: advanced
    tags: [samesite, method-override]
    question: |
      How can a `_method=POST` (method-override) gadget help bypass SameSite=Lax?
    options:
      - "It lets an attacker smuggle a state change through a Lax-allowed top-level GET navigation that the server internally treats as a POST"
      - "It encrypts the request so SameSite can't inspect it"
      - "It disables the cookie's Secure attribute"
      - "It forces the browser to attach SameSite=None cookies"
    answer: 0
    explanation: |
      Lax allows the cookie on top-level GET navigations. If the framework honors _method=POST
      (or X-HTTP-Method-Override) on a GET, the attacker fires a top-level GET that the server
      processes as a state-changing POST — smuggling the write past Lax. Don't honor method
      override for state changes on GET.
    ref: "concepts.md#samesite-bypasses-and-edge-cases"

  - id: sop-cors-and-csrf-068
    difficulty: expert
    tags: [client-side-csrf, tokens]
    question: |
      Why do valid, correctly-implemented anti-CSRF tokens fail to stop client-side CSRF?
    options:
      - "The token expires too quickly"
      - "The app's own JavaScript reads attacker-controlled input and builds the state-changing request itself, automatically attaching the legitimate token"
      - "Client-side CSRF strips the token from the request"
      - "The token is stored in a cookie that the attacker can overwrite"
    answer: 1
    explanation: |
      In client-side CSRF, the victim page's trusted JS consumes attacker-controlled input (URL
      param, postMessage) and forges the request itself, attaching the real token. The token is
      present and valid, so token checks pass. The root cause is an unsafe client-side sink; fix
      it with input validation/safe sinks.
    ref: "concepts.md#client-side-csrf"

  - id: sop-cors-and-csrf-069
    difficulty: expert
    tags: [cors, null-origin, sandboxed-iframe, exploit]
    question: |
      A server allowlists `Access-Control-Allow-Origin: null` with credentials "for local dev."
      How does an attacker weaponize this from a normal web page?
    options:
      - "By spoofing the Origin header to null with fetch()"
      - "By embedding a sandboxed iframe (allow-scripts) whose document emits Origin: null and performing the credentialed fetch from inside it"
      - "By setting document.domain to null"
      - "By sending an OPTIONS request with no Origin header"
    answer: 1
    explanation: |
      Script cannot set the Origin header, but a sandboxed iframe (sandbox="allow-scripts ...")
      forces its document's origin to null. The attacker runs the credentialed fetch inside
      that iframe, matching the null allowlist and reading the victim's authenticated data.
      Never allowlist null.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-070
    difficulty: expert
    tags: [cors, trusted-subdomain, http-downgrade]
    question: |
      An HTTPS API has a CORRECT, exact-match allowlist but includes `http://dev.example.com`.
      What is the risk?
    options:
      - "None — the allowlist is exact-match so it is safe"
      - "The browser will refuse to send credentials to any https origin"
      - "A network MITM can inject a page on the plaintext http origin that then performs the credentialed CORS read of the https data, effectively breaking TLS for the app"
      - "It only slows down the preflight"
    answer: 2
    explanation: |
      Allowlisting an http:// origin means an on-path attacker who can tamper with plaintext
      traffic to that subdomain can serve a page there that issues the credentialed cross-origin
      read of the https:// API — downgrading an otherwise HTTPS-only app. Allowlist only https://
      origins.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-071
    difficulty: expert
    tags: [cors, cache-poisoning, vary]
    question: |
      A CDN caches API responses keyed only on the URL, and the origin reflects the request
      Origin into ACAO. What is the attack, and the fix?
    options:
      - "No attack is possible because ACAO is per-request"
      - "The CDN will automatically add Vary: Origin, so nothing is needed"
      - "An attacker can poison the shared cache so a response carrying their origin's ACAO (or a victim-origin ACAO) is served to other users; fix with Vary: Origin and not caching credentialed responses"
      - "The fix is to add Access-Control-Allow-Credentials: true"
    answer: 2
    explanation: |
      When the reflected ACAO is an unkeyed cache input, an attacker poisons the shared cache
      so the wrong ACAO is served to victims (CORS cache poisoning). The fix is Vary: Origin so
      the cache keys on Origin, and never caching credentialed responses in shared caches.
      Adding Allow-Credentials would make it worse.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-072
    difficulty: advanced
    tags: [cors, expose-headers]
    question: |
      What does `Access-Control-Expose-Headers` control, and what is the risk of over-using it?
    options:
      - "Which request headers the browser may send; over-use forces preflights"
      - "Which response headers cross-origin script may READ (beyond the small default safelist); over-exposing can leak sensitive response headers to allowed origins"
      - "Which cookies are exposed to JavaScript"
      - "How long the preflight is cached"
    answer: 1
    explanation: |
      By default script can read only a few response headers (Cache-Control, Content-Language,
      Content-Type, Expires, Last-Modified, Pragma). Expose-Headers opts additional response
      headers into being readable cross-origin; listing sensitive headers (internal IDs, tokens)
      leaks them to allowed origins.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-073
    difficulty: expert
    tags: [csrf, text-plain, content-type]
    question: |
      An API parses request bodies as JSON regardless of Content-Type and relies on "we only
      accept JSON" as its CSRF defense. How does an attacker bypass this without a preflight?
    options:
      - "Send the request as multipart/form-data with a JSON part"
      - "Send the JSON-shaped body with Content-Type: text/plain, a CORS-safelisted type that triggers no preflight"
      - "Send an OPTIONS request first and ignore the response"
      - "Use HTTP/2 to skip the preflight"
    answer: 1
    explanation: |
      text/plain is one of the three safelisted content types, so a cross-origin fetch with a
      JSON body labeled text/plain is a simple request — no preflight — and the lax server parses
      it as JSON. Defense: strictly reject non-application/json Content-Types (or require and
      validate a token/custom header).
    ref: "concepts.md#content-type-boundary-textplain-smuggling-and-graphql-csrf"

  - id: sop-cors-and-csrf-074
    difficulty: expert
    tags: [csrf, graphql, content-type]
    question: |
      Why can a single-endpoint GraphQL server be CSRF-vulnerable despite the "GraphQL is JSON
      so it's preflighted" assumption?
    options:
      - "GraphQL always uses WebSockets, which ignore CSRF tokens"
      - "GraphQL responses are cached, enabling replay"
      - "GraphQL introspection discloses the CSRF token"
      - "If it accepts operations via GET or via x-www-form-urlencoded/text/plain POST, a mutation can be forged as a simple request that isn't preflighted"
    answer: 3
    explanation: |
      Many GraphQL servers accept queries over GET or accept form-encoded/text-plain POST
      bodies. Those are simple requests (no preflight), so a mutation can be CSRF-forged.
      Defense: accept only application/json, disable mutations over GET, verify Content-Type,
      and/or require a token/custom header.
    ref: "concepts.md#content-type-boundary-textplain-smuggling-and-graphql-csrf"

  - id: sop-cors-and-csrf-075
    difficulty: expert
    tags: [cookie-prefix, host-prefix, double-submit]
    question: |
      Why is a `__Host-` prefixed cookie preferable to a `__Secure-` prefixed one for a session
      or CSRF-token cookie?
    options:
      - "__Host- cookies are encrypted at rest by the browser"
      - "__Secure- cookies are sent over HTTP, __Host- over HTTPS"
      - "__Host- cookies bypass SameSite restrictions"
      - "__Host- forbids the Domain attribute and requires Path=/, pinning the cookie to the exact host so a sibling subdomain cannot overwrite it; __Secure- only requires the Secure flag"
    answer: 3
    explanation: |
      __Secure- only mandates the Secure flag. __Host- additionally forbids Domain and requires
      Path=/, so it is bound to the exact host that set it. A sibling/attacker subdomain cannot
      overwrite a __Host- cookie for the parent (no Domain scope to widen), hardening
      double-submit against the sibling-subdomain cookie-injection bypass.
    ref: "concepts.md#cookie-prefixes-and-cookie-stored-jwts"

  - id: sop-cors-and-csrf-076
    difficulty: advanced
    tags: [csrf, jwt-in-cookie]
    question: |
      A team stores their JWT in a cookie ("stateless auth, no CSRF needed"). Evaluate this.
    options:
      - "Correct — JWTs are immune to CSRF because they are signed"
      - "Correct — cookies are origin-isolated so CSRF cannot occur"
      - "Wrong — once the JWT is in a cookie the browser auto-sends it, so the endpoint is CSRF-able and needs SameSite plus a token/Origin check"
      - "Wrong — JWTs cannot be stored in cookies at all"
    answer: 2
    explanation: |
      Bearer tokens are CSRF-safe only because the app attaches them manually. Putting the JWT
      in a cookie means the browser auto-sends it on cross-site requests (ambient authority), so
      classic CSRF is back. JWT-in-cookie sessions need SameSite + token/Origin defenses like
      any cookie session.
    ref: "concepts.md#cookie-prefixes-and-cookie-stored-jwts"

  - id: sop-cors-and-csrf-077
    difficulty: expert
    tags: [cors, misconfiguration, fix-selection]
    question: |
      A server does `Access-Control-Allow-Origin: <reflected Origin>` + `Access-Control-Allow-
      Credentials: true` with no allowlist. Which change actually closes the vulnerability?
    options:
      - "Add Vary: Origin while keeping the reflection and credentials"
      - "Change ACAO to `*` (and drop credentials), leaving reflection logic in place"
      - "Reflect the Origin only when it exactly matches a strict server-side allowlist of trusted https origins"
      - "Cache the response so the ACAO is computed only once"
    answer: 2
    explanation: |
      The bug is trusting arbitrary origins, not caching. Vary: Origin only fixes cache keying,
      not the trust flaw. ACAO: * drops credentials but still leaks any non-credentialed data
      and doesn't address the design. The correct fix is an exact-match allowlist of trusted
      https origins before reflecting.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-078
    difficulty: expert
    tags: [csrf, scenario, end-to-end]
    question: |
      SPA on `app.example.com`, API on `api.example.com`, session in a cookie. Which end-to-end
      CSRF design is both correct and most robust?
    options:
      - "SameSite=None session cookie + reflect-origin CORS with credentials"
      - "__Host- session cookie with SameSite=Lax/Strict, PLUS a signed session-bound (HMAC) double-submit token or a required custom header that forces a preflight against a strict CORS allowlist"
      - "Rely solely on the API accepting only application/json"
      - "Naive double-submit cookie (compare cookie value to a submitted field) with no signing"
    answer: 1
    explanation: |
      Layered: a __Host- SameSite cookie removes most ambient authority and resists sibling
      overwrite; a signed session-bound token (or custom-header-forcing-preflight behind a strict
      allowlist) closes the same-site/subdomain and legacy gaps. SameSite=None + reflection,
      JSON-only, and naive double-submit are all inadequate or dangerous.
    ref: "concepts.md#cookie-prefixes-and-cookie-stored-jwts"

  - id: sop-cors-and-csrf-079
    difficulty: advanced
    tags: [cors, trust-chain, xss]
    question: |
      Even with a correct, exact-match CORS allowlist, what residual risk remains?
    options:
      - "The preflight can be replayed to bypass the allowlist"
      - "An XSS on any allowlisted origin lets attacker script issue the credentialed cross-origin read — your CORS security is only as strong as the weakest allowlisted origin"
      - "The allowlist automatically expires after Access-Control-Max-Age"
      - "Browsers ignore exact-match allowlists for credentialed requests"
    answer: 1
    explanation: |
      An exact allowlist still forms a trust chain: script running (via XSS) on any allowlisted
      subdomain can perform the credentialed CORS read against the main API. Minimize allowlisted
      origins and secure every one of them against XSS.
    ref: "concepts.md#advanced-cors-exploitation"

  - id: sop-cors-and-csrf-080
    difficulty: intermediate
    tags: [samesite, strict, immunity]
    question: |
      "We set SameSite=Strict on every cookie, so we're fully CSRF-immune." What is the correct
      critique?
    options:
      - "Correct — Strict eliminates all CSRF"
      - "Wrong — sibling-subdomain requests, a client-side open-redirect gadget re-issuing a same-site request, and client-side CSRF all survive Strict, so a token/Origin check is still needed"
      - "Wrong — Strict only works if cookies are also HttpOnly"
      - "Correct as long as the site uses HTTP/2"
    answer: 1
    explanation: |
      Strict is strong but not complete: same-site (sibling-subdomain) requests count as
      same-site, a client-side DOM redirect makes a secondary request same-site (sending Strict
      cookies), and client-side CSRF forges requests from the site's own code. Keep
      defense-in-depth with tokens/Origin checks.
    ref: "concepts.md#samesite-bypasses-and-edge-cases"
