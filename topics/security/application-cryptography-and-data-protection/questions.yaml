topic: "Application Cryptography & Data Protection (Design)"
domain: security
topic_slug: application-cryptography-and-data-protection
version: 1
questions:
- id: application-cryptography-and-data-protection-001
  difficulty: beginner
  tags: [data-states, fundamentals]
  question: |
    Data protection is commonly framed around three states. Which set correctly names
    all three?
  options:
  - "At rest, in transit, in use"
  - "Encrypted, hashed, signed"
  - "Public, internal, confidential"
  - "Hot, warm, cold"
  answer: 0
  explanation: |
    The three data states are at rest (stored), in transit (moving over a network), and
    in use (loaded in memory / being processed). Each needs a different control, and you
    generally need all three.
  ref: "concepts.md#data-states-at-rest-in-transit-in-use"

- id: application-cryptography-and-data-protection-002
  difficulty: beginner
  tags: [data-states, tls]
  question: |
    Which control primarily protects data IN TRANSIT?
  options:
  - "Full-disk encryption on the database host"
  - "TLS between client and server"
  - "Hashing passwords with bcrypt"
  - "Row-level access control in the database"
  answer: 1
  explanation: |
    TLS (and mTLS) protects data while it moves over the network, defending against
    eavesdropping and man-in-the-middle. Disk encryption addresses at-rest; hashing and
    access control address other concerns.
  ref: "concepts.md#data-states-at-rest-in-transit-in-use"

- id: application-cryptography-and-data-protection-003
  difficulty: intermediate
  tags: [data-states, threat-model, scenario]
  question: |
    A team says "we use TLS and encrypted EBS volumes, so our PII is safe." What is the
    key gap in that reasoning?
  options:
  - "TLS is deprecated and should be replaced with IPsec"
  - "Encrypted EBS is slower than plaintext, so it should not be used for PII"
  - "A SQL injection or leaked DB credential still returns plaintext, since data is decrypted at query time"
  - "TLS and disk encryption together double-encrypt data, corrupting it"
  answer: 2
  explanation: |
    TLS protects the wire and disk encryption protects a stolen drive, but once the volume
    is mounted and the process reads a row, the data is plaintext to any authorized reader.
    An app-level SQLi or a leaked credential exfiltrates plaintext. That threat needs
    field-level encryption above the database.
  ref: "concepts.md#data-states-at-rest-in-transit-in-use"

- id: application-cryptography-and-data-protection-004
  difficulty: intermediate
  tags: [encryption-at-rest, tde, layers]
  question: |
    Against which threat does Transparent Data Encryption (TDE) / full-volume encryption
    provide essentially NO protection?
  options:
  - "Theft of the physical disk"
  - "A leaked/stolen backup file of the data files"
  - "A SQL injection that exfiltrates rows via SELECT"
  - "Loss of decommissioned drives"
  answer: 2
  explanation: |
    TDE and disk encryption protect only the bytes at rest on media. They are invisible to
    the DB engine, so any authenticated query — including one driven by SQL injection or a
    leaked credential — returns decrypted plaintext. Stolen media and backups are what they
    do protect.
  ref: "concepts.md#encryption-at-rest-choosing-the-layer"

- id: application-cryptography-and-data-protection-005
  difficulty: intermediate
  tags: [encryption-at-rest, layers]
  question: |
    You must protect PII even from a rogue DBA and from leaked database dumps/backups. At
    which layer should you encrypt?
  options:
  - "Self-encrypting disk (SED)"
  - "Filesystem/volume encryption (LUKS, encrypted EBS)"
  - "Database TDE"
  - "Application / field-level encryption"
  answer: 3
  explanation: |
    Disk, volume, and TDE encryption all present plaintext to anyone with database access
    (including a DBA) and to the running engine. To keep data confidential even from
    DB-level access, encrypt above the database at the application/field layer, so the DB
    stores only ciphertext.
  ref: "concepts.md#encryption-at-rest-choosing-the-layer"

- id: application-cryptography-and-data-protection-006
  difficulty: beginner
  tags: [encryption-at-rest, blast-radius]
  question: |
    As you move encryption higher in the stack (disk → TDE → field-level), what is the
    general trade-off?
  options:
  - "Smaller blast radius / better threat coverage, but more application complexity"
  - "Larger blast radius but simpler application code"
  - "Weaker ciphers but faster queries"
  - "No trade-off; higher is always strictly better and free"
  answer: 0
  explanation: |
    Higher-layer encryption protects against more threats and shrinks the blast radius, but
    the application must manage keys and loses the DB's native indexing/search on encrypted
    fields — added complexity.
  ref: "concepts.md#encryption-at-rest-choosing-the-layer"

- id: application-cryptography-and-data-protection-007
  difficulty: beginner
  tags: [envelope-encryption, dek, kek]
  question: |
    In envelope encryption, what does the Data Encryption Key (DEK) do, and what does the
    Key Encryption Key (KEK) do?
  options:
  - "The DEK encrypts the actual data; the KEK encrypts (wraps) the DEK"
  - "The KEK encrypts the data; the DEK signs it"
  - "Both encrypt the data with different algorithms for defense in depth"
  - "The DEK authenticates users; the KEK authorizes them"
  answer: 0
  explanation: |
    In envelope encryption a DEK encrypts the bulk data, and a KEK (held in a KMS/HSM)
    encrypts, or "wraps," the DEK. The wrapped DEK is stored next to the ciphertext; the
    KEK never leaves the KMS/HSM in plaintext.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-008
  difficulty: intermediate
  tags: [envelope-encryption, kms]
  question: |
    AWS KMS `GenerateDataKey` returns the data key in two forms. Why both?
  options:
  - "One is for encryption and one is for signing"
  - "One is AES and one is RSA for algorithm agility"
  - "It returns two independent DEKs for redundancy"
  - "It returns the plaintext DEK (to encrypt now) and the KEK-encrypted DEK (to store), so you never store the plaintext key"
  answer: 3
  explanation: |
    You use the plaintext DEK immediately to encrypt data, then discard it; you persist the
    encrypted (wrapped) DEK next to the ciphertext. Later you send the wrapped DEK to KMS
    Decrypt to recover the plaintext DEK. The plaintext key is never written to storage.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-009
  difficulty: intermediate
  tags: [envelope-encryption, performance]
  question: |
    Why not just send all your data directly to the KMS to encrypt, skipping the DEK?
  options:
  - "KMS only supports asymmetric keys"
  - "KMS cannot encrypt data at all, only sign it"
  - "KMS has small request-size limits and per-call latency/cost, so bulk encryption is done locally with a DEK while KMS only handles the tiny DEK"
  - "Sending data to KMS violates TLS"
  answer: 2
  explanation: |
    KMS APIs cap payloads at a few KB and each call adds latency and cost. Envelope
    encryption keeps bulk (potentially gigabytes) encryption local and fast, and only sends
    the small DEK to KMS for wrapping/unwrapping.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-010
  difficulty: intermediate
  tags: [envelope-encryption, multi-tenant, scenario]
  question: |
    A multi-tenant SaaS wants per-tenant crypto isolation and easy tenant offboarding using
    envelope encryption. What is the standard design?
  options:
  - "One global DEK for all tenants, rotated weekly"
  - "A KEK per row and one shared DEK"
  - "Encrypt every tenant's data directly with the KEK"
  - "A DEK per tenant, each wrapped by a shared KEK; delete a tenant's DEK to render its data unreadable"
  answer: 3
  explanation: |
    Per-tenant DEKs wrapped by a shared KEK give crypto isolation (a leaked DEK exposes one
    tenant, not all) and make offboarding a crypto-shred: destroy that tenant's DEK and all
    its ciphertext becomes unreadable.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-011
  difficulty: advanced
  tags: [envelope-encryption, dek-caching, revocation]
  question: |
    What is a security downside of caching decrypted (plaintext) DEKs in application memory?
  options:
  - "It makes every operation require a KMS call"
  - "It corrupts the ciphertext stored in the database"
  - "It prevents key rotation entirely"
  - "It widens the window a plaintext DEK is exposed and weakens revocation, since disabling the KEK will not stop already-cached DEKs"
  answer: 3
  explanation: |
    Caching DEKs cuts KMS latency/cost, but a cached plaintext DEK sits in memory longer
    (bigger exposure) and survives even after you disable the wrapping KEK — so revocation
    is not immediate. It is a deliberate trade-off.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-012
  difficulty: intermediate
  tags: [envelope-encryption, storage]
  question: |
    Where should the wrapped (KEK-encrypted) DEK be stored?
  options:
  - "Inside the KMS, replacing the KEK"
  - "In a separate secrets manager only, never near the data"
  - "Alongside the ciphertext it protects (e.g., in the same record/file)"
  - "It should never be stored; regenerate it on every read"
  answer: 2
  explanation: |
    The wrapped DEK is safe to store next to the ciphertext because it is useless without
    the KEK (which stays in the KMS/HSM). Co-locating it means a read has everything it needs
    to ask KMS to unwrap and then decrypt.
  ref: "concepts.md#envelope-encryption-dek--kek"

- id: application-cryptography-and-data-protection-013
  difficulty: beginner
  tags: [kms, hsm]
  question: |
    What is the defining property of a Hardware Security Module (HSM) regarding key material?
  options:
  - "It stores keys in plaintext files for fast access"
  - "It only works for asymmetric keys"
  - "It exports keys to the application so the app can do crypto locally"
  - "The private/root key material never leaves the tamper-resistant hardware boundary in plaintext"
  answer: 3
  explanation: |
    An HSM is dedicated tamper-resistant hardware that generates and stores keys and performs
    crypto inside the boundary; the protected key material never leaves in plaintext. This is
    what enables FIPS 140-2/3 Level 3 "sole control" claims.
  ref: "concepts.md#kms-vs-hsm"

- id: application-cryptography-and-data-protection-014
  difficulty: intermediate
  tags: [kms, hsm, trade-offs]
  question: |
    Which statement best captures the KMS-vs-HSM trade-off for a typical application?
  options:
  - "Use a dedicated HSM by default; managed KMS is insecure"
  - "KMS and HSM are identical; the choice is purely cosmetic"
  - "HSMs are cheaper per key and require no operational effort"
  - "Use managed KMS for almost everything (often itself HSM-backed); reach for a dedicated HSM when a regulation demands sole control of FIPS-Level-3 hardware or custom PKCS#11"
  answer: 3
  explanation: |
    Managed KMS gives a simple API, low ops burden, and is frequently HSM-backed. Dedicated
    HSMs/CloudHSM cost more and add ops burden; you choose them for regulatory sole-control,
    custom crypto, or keeping the root key outside the provider's reach.
  ref: "concepts.md#kms-vs-hsm"

- id: application-cryptography-and-data-protection-015
  difficulty: advanced
  tags: [kms, hsm, envelope-encryption]
  question: |
    In an envelope-encryption design backed by a KMS/HSM, which key lives inside the
    KMS/HSM and which does the application handle directly?
  options:
  - "The DEK lives in the HSM; the KEK is handled by the app"
  - "Both keys live in the HSM and never touch the app"
  - "The KEK lives in the KMS/HSM; the app handles DEKs (in plaintext, briefly, to encrypt/decrypt data)"
  - "Neither key touches the HSM; both are in the database"
  answer: 2
  explanation: |
    The KEK is the root key that stays in the KMS/HSM. The application receives plaintext DEKs
    (briefly, in memory) to encrypt/decrypt bulk data, and stores the wrapped DEK. This split
    is exactly why envelope encryption scales.
  ref: "concepts.md#kms-vs-hsm"

- id: application-cryptography-and-data-protection-016
  difficulty: intermediate
  tags: [key-rotation, envelope-encryption]
  question: |
    Why does envelope encryption make KEK rotation cheap?
  options:
  - "Because the KEK never changes, only its alias does"
  - "Because all data is re-encrypted automatically by the disk controller"
  - "Because DEKs are rotated instead, which is free"
  - "Because rotating the KEK only requires re-wrapping the small DEKs, not re-encrypting the bulk data"
  answer: 3
  explanation: |
    Rotating a KEK means re-wrapping the (small) DEKs under the new KEK; the large data
    ciphertext is untouched. This is O(number of DEKs), not O(size of data), which is the core
    operational win of envelope encryption.
  ref: "concepts.md#key-rotation-strategy"

- id: application-cryptography-and-data-protection-017
  difficulty: advanced
  tags: [key-rotation, dek-compromise, scenario]
  question: |
    A plaintext DEK is believed to have leaked. Is rotating the KEK (re-wrapping the DEK)
    sufficient to protect the affected data?
  options:
  - "Yes, re-wrapping invalidates the leaked plaintext DEK"
  - "Yes, because the KMS refuses to decrypt with old versions"
  - "No, you must delete the entire database"
  - "No — the leaked plaintext DEK can still decrypt the existing ciphertext, so you must re-encrypt the data under a fresh DEK"
  answer: 3
  explanation: |
    The ciphertext was made with the DEK; anyone holding the leaked plaintext DEK can still
    decrypt it regardless of how the DEK is wrapped. Recovery requires decrypting and
    re-encrypting the data under a new DEK. KEK rotation only protects against KEK compromise.
  ref: "concepts.md#key-rotation-strategy"

- id: application-cryptography-and-data-protection-018
  difficulty: intermediate
  tags: [key-rotation, versioning]
  question: |
    Why should you store a key ID / version tag with each ciphertext record?
  options:
  - "To make the ciphertext longer and harder to brute force"
  - "Because the KMS refuses ciphertext without it"
  - "To let the database sort ciphertext efficiently"
  - "So you can decrypt old data with the right key while new writes use the current key, enabling rotation and algorithm changes (crypto-agility)"
  answer: 3
  explanation: |
    Tagging ciphertext with the key ID/version (and algorithm) lets you decrypt records under
    whichever key made them while writing new records under the current key. Without this tag
    you cannot rotate keys or change algorithms without guessing.
  ref: "concepts.md#key-rotation-strategy"

- id: application-cryptography-and-data-protection-019
  difficulty: intermediate
  tags: [key-rotation, strategies]
  question: |
    What distinguishes "lazy/on-write" key rotation from "eager" re-encryption?
  options:
  - "Lazy rotation re-encrypts records opportunistically (e.g., on next write), while eager rotation re-encrypts everything immediately"
  - "Lazy rotation deletes keys; eager rotation keeps them"
  - "They are the same thing with different names"
  - "Lazy rotation applies only to KEKs; eager only to DEKs"
  answer: 0
  explanation: |
    Lazy rotation tags records with their key version and re-encrypts them opportunistically or
    via a background job — no big-bang migration. Eager rotation scans and re-encrypts all data
    now, which is required when the old key is compromised and must not remain usable.
  ref: "concepts.md#key-rotation-strategy"

- id: application-cryptography-and-data-protection-020
  difficulty: advanced
  tags: [key-rotation, kms, internals]
  question: |
    When AWS KMS automatically rotates a customer managed key, what happens to data encrypted
    under the old key material?
  options:
  - "It becomes permanently unreadable and must be re-encrypted"
  - "It is silently re-encrypted by KMS in the background"
  - "The key ID stays stable and old backing key versions are retained, so old ciphertext still decrypts while new operations use the new material"
  - "The old ciphertext is migrated to a new key ID that the app must track"
  answer: 2
  explanation: |
    KMS keeps prior backing-key versions under the same stable key ID. Existing ciphertext
    still decrypts against retained versions; only new encrypt operations use the newest
    material. Nothing needs re-encryption.
  ref: "concepts.md#key-rotation-strategy"

- id: application-cryptography-and-data-protection-021
  difficulty: beginner
  tags: [field-level-encryption, definition]
  question: |
    What is field-level (application-layer) encryption?
  options:
  - "Encrypting the entire disk the database sits on"
  - "Encrypting network packets between microservices"
  - "Hashing every column with SHA-256"
  - "The application encrypts specific sensitive fields before storing them, so the DB holds only ciphertext for those columns"
  answer: 3
  explanation: |
    Field-level encryption means the app encrypts chosen sensitive fields (SSN, card number,
    health data) before they reach the database and decrypts on read; the DB stores ciphertext
    for those columns while other columns remain queryable plaintext.
  ref: "concepts.md#field-level--application-layer-encryption"

- id: application-cryptography-and-data-protection-022
  difficulty: advanced
  tags: [field-level-encryption, aead, aad, scenario]
  question: |
    You encrypt an SSN column with AES-GCM. To stop an attacker from copying one row's
    ciphertext into another row (or another tenant), what should you do?
  options:
  - "Use a longer nonce"
  - "Switch to ECB mode"
  - "Reuse the same nonce for every row so they can be compared"
  - "Bind Additional Authenticated Data (AAD), e.g., the row's primary key or tenant ID, into the AEAD encryption"
  answer: 3
  explanation: |
    AEAD modes let you authenticate associated data (AAD) that is not encrypted but is bound to
    the ciphertext — e.g., the row PK or tenant ID. Decryption fails if the ciphertext is moved
    to a context with different AAD, preventing cut-and-paste attacks.
  ref: "concepts.md#field-level--application-layer-encryption"

- id: application-cryptography-and-data-protection-023
  difficulty: intermediate
  tags: [field-level-encryption, cost]
  question: |
    What is the primary functional cost of encrypting a column at the application/field level?
  options:
  - "The database can no longer store the data at all"
  - "TLS must be disabled for that connection"
  - "The column must be stored in a separate database"
  - "The DB can no longer natively index, sort, range-query, or LIKE-search that column, and the app must manage keys"
  answer: 3
  explanation: |
    Randomized ciphertext is opaque to the DB, so normal indexing, sorting, range, and pattern
    queries stop working on that column, and the app takes on key management. This is why you
    encrypt only fields that truly need it and design search separately (blind indexes).
  ref: "concepts.md#field-level--application-layer-encryption"

- id: application-cryptography-and-data-protection-024
  difficulty: intermediate
  tags: [field-level-encryption, aead, modes]
  question: |
    Which encryption mode is appropriate for field-level encryption so ciphertext is
    tamper-evident?
  options:
  - "AES-ECB"
  - "AES-CBC with no MAC"
  - "An AEAD mode such as AES-GCM, AES-GCM-SIV, or ChaCha20-Poly1305"
  - "Plain XOR with a static key"
  answer: 2
  explanation: |
    AEAD modes provide confidentiality plus integrity/authenticity, so any tampering with the
    ciphertext is detected on decrypt. ECB leaks structure, and unauthenticated CBC lets an
    attacker flip bits undetected.
  ref: "concepts.md#field-level--application-layer-encryption"

- id: application-cryptography-and-data-protection-025
  difficulty: intermediate
  tags: [searchable-encryption, deterministic, randomized]
  question: |
    Why does properly randomized (AEAD, random nonce) encryption break `WHERE col = ?`
    equality search?
  options:
  - "The database rejects binary columns"
  - "The same plaintext encrypts to a different ciphertext each time, so you cannot reproduce the stored ciphertext to compare against"
  - "Randomized encryption is slower than the query timeout"
  - "AEAD strips the WHERE clause"
  answer: 1
  explanation: |
    With a fresh random nonce, encrypting the same value yields different ciphertext every time.
    Equality comparison on the stored ciphertext can never match a freshly computed ciphertext,
    so direct equality search is impossible — which is exactly why deterministic encryption or
    blind indexes exist.
  ref: "concepts.md#searchable-encryption-deterministic-vs-randomized"

- id: application-cryptography-and-data-protection-026
  difficulty: intermediate
  tags: [searchable-encryption, deterministic, leakage]
  question: |
    Deterministic encryption enables equality search. What does it leak that randomized
    encryption does not?
  options:
  - "The encryption key"
  - "The plaintext length only"
  - "Which rows share the same value, and the frequency of each value (enabling frequency analysis)"
  - "Nothing; deterministic encryption is strictly safer"
  answer: 2
  explanation: |
    Because equal plaintexts map to equal ciphertexts, deterministic encryption reveals value
    equality and frequency distribution. On low-entropy/skewed columns (status, ZIP, gender)
    this can be de-anonymized via frequency analysis.
  ref: "concepts.md#searchable-encryption-deterministic-vs-randomized"

- id: application-cryptography-and-data-protection-027
  difficulty: advanced
  tags: [searchable-encryption, ope, fhe]
  question: |
    Regarding range queries on encrypted data, which statement is accurate?
  options:
  - "Order-preserving/order-revealing encryption (OPE/ORE) enables ranges but leaks ordering and is generally considered weak; FHE can compute on ciphertext but is impractical for general production"
  - "AES-GCM natively supports encrypted range queries"
  - "Range queries on encrypted data are trivial and leak nothing"
  - "Deterministic encryption fully supports range and sort with no leakage"
  answer: 0
  explanation: |
    OPE/ORE preserves order to enable range queries but leaks ordering (and often more), making
    it weak. FHE allows computation on ciphertext but is far too slow for general workloads.
    Deterministic encryption supports only equality, not ranges. Practical exact-match uses a
    blind index.
  ref: "concepts.md#searchable-encryption-deterministic-vs-randomized"

- id: application-cryptography-and-data-protection-028
  difficulty: advanced
  tags: [searchable-encryption, deterministic, scenario]
  question: |
    Why is deterministic encryption especially dangerous on a low-cardinality column like
    `account_status` (active/closed/suspended)?
  options:
  - "The few distinct values with a skewed distribution let an observer infer plaintext from ciphertext frequencies"
  - "It makes the column too large to index"
  - "It requires a separate database"
  - "It disables TLS on that column"
  answer: 0
  explanation: |
    With only a handful of possible values and a known/skewed distribution, an attacker who
    sees the ciphertext frequencies can map the most common ciphertext to the most common
    status, defeating the encryption. Randomized encryption plus a coarse blind index (if search
    is needed) is safer.
  ref: "concepts.md#searchable-encryption-deterministic-vs-randomized"

- id: application-cryptography-and-data-protection-029
  difficulty: intermediate
  tags: [blind-index, hmac]
  question: |
    A blind index for exact-match search on an encrypted column should be computed as:
  options:
  - "A keyed HMAC (or KDF) of the normalized plaintext, using a secret index key separate from the encryption key"
  - "A plain SHA-256 hash of the value"
  - "The value stored in plaintext in a hidden column"
  - "The AES-GCM ciphertext itself, reused as the index"
  answer: 0
  explanation: |
    A blind index uses a keyed HMAC/KDF over the normalized value, stored in an indexed column
    alongside the randomized ciphertext. The secret index key (distinct from the DEK) prevents
    brute-forcing low-entropy values; a plain unkeyed hash of an SSN or email is trivially
    reversed.
  ref: "concepts.md#blind-indexing-hmac-exact-match-search"

- id: application-cryptography-and-data-protection-030
  difficulty: advanced
  tags: [blind-index, hashing, gotcha]
  question: |
    Why is a plain `SHA256(value)` a poor blind index for a column like phone number or SSN?
  options:
  - "SHA-256 is too slow for indexing"
  - "The value space is small/low-entropy, so an unkeyed hash is trivially brute-forced or rainbow-tabled to recover the plaintext"
  - "SHA-256 output cannot be stored in a database"
  - "SHA-256 produces collisions for all phone numbers"
  answer: 1
  explanation: |
    SSNs, phones, and emails have small/predictable value spaces. An attacker who obtains the
    hash column can simply hash all candidates offline to recover plaintexts. A keyed HMAC with
    a secret index key defeats this because the attacker lacks the key.
  ref: "concepts.md#blind-indexing-hmac-exact-match-search"

- id: application-cryptography-and-data-protection-031
  difficulty: advanced
  tags: [blind-index, leakage, bloom]
  question: |
    A blind index still leaks value equality (equal plaintexts produce equal index values).
    What technique reduces this frequency leakage?
  options:
  - "Storing the index in a second database"
  - "Using a coarse/truncated (bloom-style) blind index so many values collide into each bucket, then decrypting candidates to check exactly"
  - "Encrypting the index column with the same DEK as the data"
  - "Removing the index and doing full table scans"
  answer: 1
  explanation: |
    Truncating the HMAC output to a few bits makes many distinct values share a bucket, blunting
    frequency analysis. You filter by the coarse index then decrypt-and-verify the small
    candidate set, trading precision for reduced leakage.
  ref: "concepts.md#blind-indexing-hmac-exact-match-search"

- id: application-cryptography-and-data-protection-032
  difficulty: intermediate
  tags: [blind-index, normalization]
  question: |
    Why must you normalize a value (e.g., lowercase an email, strip formatting from a phone
    number) before computing its blind index?
  options:
  - "To make the index shorter"
  - "Because HMAC rejects uppercase letters"
  - "So that equal-but-differently-formatted values produce the same index and therefore match during lookup"
  - "To encrypt the value more strongly"
  answer: 2
  explanation: |
    A blind index only matches identical inputs. Without normalization, `Bob@x.com` and
    `bob@x.com`, or `(555) 123` and `555123`, would hash differently and fail to match. Normalize
    consistently on write and on lookup.
  ref: "concepts.md#blind-indexing-hmac-exact-match-search"

- id: application-cryptography-and-data-protection-033
  difficulty: intermediate
  tags: [blind-index, limitations]
  question: |
    What kind of query does a blind index support?
  options:
  - "Range queries (BETWEEN)"
  - "Substring / LIKE queries"
  - "Exact-match (equality) lookups only"
  - "Full-text search with ranking"
  answer: 2
  explanation: |
    A blind index maps a specific normalized value to a deterministic keyed hash, so it supports
    only exact equality lookups. Range, prefix, and substring searches are not possible on the
    hashed value.
  ref: "concepts.md#blind-indexing-hmac-exact-match-search"

- id: application-cryptography-and-data-protection-034
  difficulty: beginner
  tags: [tokenization, definition]
  question: |
    How does tokenization differ fundamentally from encryption?
  options:
  - "A token has no mathematical relationship to the original value; recovery requires a lookup in an isolated token vault, whereas ciphertext is reversible with the key"
  - "Tokenization uses a stronger cipher than encryption"
  - "Tokenization is just base64 encoding"
  - "Tokenization and encryption are identical in every respect"
  answer: 0
  explanation: |
    Encryption is key-reversible math over the data. A token is an unrelated surrogate; the only
    way back to the original is a lookup in the hardened token vault (or a keyed algorithm in an
    isolated service). There is no key that turns a token back into the value.
  ref: "concepts.md#tokenization-vs-encryption"

- id: application-cryptography-and-data-protection-035
  difficulty: intermediate
  tags: [tokenization, pci-dss, scope, scenario]
  question: |
    A payments team tokenizes card PANs so most services store only tokens. What is the main
    benefit?
  options:
  - "Tokens are faster to encrypt than PANs"
  - "Tokens eliminate the need for TLS"
  - "Systems that only ever handle tokens fall out of PCI-DSS scope, since they never hold real card numbers — shrinking the audit surface"
  - "Tokenization removes the need to ever store the real PAN anywhere"
  answer: 2
  explanation: |
    The killer use case for tokenization is PCI-DSS scope reduction. Services holding only tokens
    cannot leak card data because they never possess it, so they leave PCI scope. The real PAN
    lives only in the isolated vault or the payment provider.
  ref: "concepts.md#tokenization-vs-encryption"

- id: application-cryptography-and-data-protection-036
  difficulty: advanced
  tags: [tokenization, fpe]
  question: |
    Format-Preserving Encryption (FPE, e.g., NIST FF1/FF3) is sometimes called "vaultless
    tokenization." Why?
  options:
  - "It is not really encryption, just a hash"
  - "It is key-reversible encryption that outputs the same format/length as the input (a 16-digit PAN → a 16-digit ciphertext), fitting legacy schemas without a token vault"
  - "It stores tokens in the database with no key"
  - "It only works on 8-digit numbers"
  answer: 1
  explanation: |
    FPE is genuine encryption but preserves the input's format and length, so it drops into
    fixed-width legacy fields without a lookup vault. It provides a tokenization-like surrogate
    while remaining key-reversible.
  ref: "concepts.md#tokenization-vs-encryption"

- id: application-cryptography-and-data-protection-037
  difficulty: intermediate
  tags: [tokenization, encryption, trade-offs]
  question: |
    Compared to tokenization, what is a weakness of relying on encryption alone to reduce
    compliance scope for card data?
  options:
  - "Encryption cannot protect card numbers at all"
  - "Encryption leaves ciphertext (and the decryption key) inside your systems, so those systems remain in scope"
  - "Encryption is always slower than a vault lookup"
  - "Encryption changes the card number's checksum"
  answer: 1
  explanation: |
    Even encrypted, the ciphertext and the key management live within your environment, so those
    systems stay in PCI scope (they could recover the PAN). Tokenization removes the sensitive
    value entirely from most systems, which is why it is the scope-reduction tool of choice.
  ref: "concepts.md#tokenization-vs-encryption"

- id: application-cryptography-and-data-protection-038
  difficulty: beginner
  tags: [crypto-shredding, definition]
  question: |
    What is "crypto-shredding" (crypto-erasure)?
  options:
  - "Physically shredding the hard drives"
  - "Overwriting data with random bytes seven times"
  - "Deleting the encryption key so that the still-existing ciphertext becomes effectively unrecoverable"
  - "Compressing data before deleting it"
  answer: 2
  explanation: |
    Crypto-shredding deletes the key rather than the data. Once the DEK is irrecoverably gone,
    the ciphertext is indistinguishable from random and effectively unrecoverable, even though
    the bytes still physically exist in DBs, backups, and logs.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-039
  difficulty: intermediate
  tags: [crypto-shredding, gdpr, scenario]
  question: |
    A user invokes GDPR "right to erasure," but their data is spread across live DBs, replicas,
    daily backups, and an append-only event log. How does crypto-shredding help?
  options:
  - "If each user has their own DEK, destroying that one key renders all copies of that user's ciphertext unreadable at once — including immutable/backup copies"
  - "It rewrites every backup in place to remove the user"
  - "It exempts the company from GDPR"
  - "It deletes the entire event log"
  answer: 0
  explanation: |
    Physically deleting data from immutable logs and countless backups is impractical.
    Per-user DEKs let you satisfy erasure by destroying a single key; every ciphertext copy
    everywhere becomes unreadable, reconciling erasure with immutable storage.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-040
  difficulty: advanced
  tags: [crypto-shredding, granularity, gotcha]
  question: |
    Your system encrypts all user data under a single shared DEK. Why can't you satisfy a
    per-user erasure request via crypto-shredding?
  options:
  - "Because DEKs cannot be deleted"
  - "Because deleting the one shared key would make ALL users' data unreadable, not just the requesting user's — you can only shred at the granularity you keyed"
  - "Because GDPR forbids crypto-shredding entirely"
  - "Because the DEK is stored in the ciphertext"
  answer: 1
  explanation: |
    Crypto-shredding erases exactly at the key's granularity. A single shared DEK cannot be
    deleted without destroying everyone's data. Per-user (or per-record) DEKs are a prerequisite
    for per-user crypto-erasure.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-041
  difficulty: advanced
  tags: [crypto-shredding, key-backups, gotcha]
  question: |
    What is a critical caveat that can silently defeat crypto-shredding?
  options:
  - "If the key store's backups still contain the 'deleted' key, the data remains recoverable — key destruction must be as complete/durable as the erasure you claim"
  - "The ciphertext must be compressed first"
  - "Crypto-shredding only works on SSDs"
  - "You must also delete the algorithm implementation"
  answer: 0
  explanation: |
    Erasure is only as real as the key destruction. If KMS/HSM key backups, exports, or escrow
    copies survive, the key — and thus the data — can be recovered. Verified, complete key
    deletion (including backups) is essential.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-042
  difficulty: advanced
  tags: [crypto-shredding, harvest-now-decrypt-later]
  question: |
    Crypto-shredding provides no protection in which scenario?
  options:
  - "When the ciphertext sits in immutable backups"
  - "When an adversary already copied the ciphertext AND had the key (or the algorithm is later broken) before you destroyed the key"
  - "When the user has multiple records"
  - "When the data is stored in an event log"
  answer: 1
  explanation: |
    Crypto-shredding assumes the ciphertext was never usefully exposed while the key lived. If an
    attacker already exfiltrated both ciphertext and key (harvest-now, decrypt-later), destroying
    the key afterward does nothing for that captured copy.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-043
  difficulty: intermediate
  tags: [immutability, erasure, event-sourcing]
  question: |
    Which design tension does crypto-shredding specifically reconcile?
  options:
  - "Latency vs throughput"
  - "The conflict between append-only/immutable stores (audit logs, event sourcing, WORM backups) and the right to erasure"
  - "Symmetric vs asymmetric encryption"
  - "TLS 1.2 vs TLS 1.3"
  answer: 1
  explanation: |
    Immutable stores are designed so you cannot change the past, which conflicts directly with
    "delete my data." Crypto-shredding keeps the immutable ciphertext intact but destroys the
    key, removing the content while preserving record structure/existence.
  ref: "concepts.md#crypto-shredding--the-erasure-vs-immutability-tension"

- id: application-cryptography-and-data-protection-044
  difficulty: beginner
  tags: [data-masking, non-prod]
  question: |
    Why is copying production data into test/staging environments a significant risk, and what
    mitigates it?
  options:
  - "Lower environments typically have weaker controls, so copying real PII there expands exposure; static data masking (sanitizing the copy) mitigates it"
  - "It is not a risk; lower environments are always secure"
  - "It only wastes disk space; there is no security concern"
  - "You should encrypt the entire lower environment instead of masking"
  answer: 0
  explanation: |
    Non-prod environments usually have looser access and monitoring, so real PII there is a top
    breach source. Static data masking irreversibly replaces sensitive values before the data
    lands in the lower environment, so developers work with realistic but non-sensitive data.
  ref: "concepts.md#data-masking--redaction-non-prod--logs"

- id: application-cryptography-and-data-protection-045
  difficulty: intermediate
  tags: [data-masking, dynamic-masking, gotcha]
  question: |
    Dynamic Data Masking (DDM), which masks values on read for certain roles, should be
    understood as:
  options:
  - "A strong cryptographic security boundary equivalent to encryption"
  - "A convenience/least-privilege display control, NOT a strong security boundary, since the underlying data is intact and privileged or injection paths can bypass it"
  - "A replacement for access control"
  - "A form of tokenization with a vault"
  answer: 1
  explanation: |
    DDM masks presentation for some roles but the real value is still stored and returned to
    privileged paths; SQL injection or a bypass can reach it. It reduces casual exposure but is
    not a substitute for encryption or proper access control.
  ref: "concepts.md#data-masking--redaction-non-prod--logs"

- id: application-cryptography-and-data-protection-046
  difficulty: advanced
  tags: [data-masking, pseudonymization, gdpr, gotcha]
  question: |
    Under GDPR, how is pseudonymized data (e.g., values replaced by consistent tokens that can
    be re-linked via a mapping) treated?
  options:
  - "As fully anonymous data outside GDPR scope"
  - "As still personal data, because it is reversible via the mapping/key — only true (irreversible) anonymization removes data from scope"
  - "As public data"
  - "As deleted data"
  answer: 1
  explanation: |
    GDPR treats pseudonymized data as still personal because a mapping/key can re-identify
    individuals. Only irreversible anonymization (no re-linking possible) takes data out of
    scope. Masking with a consistent token is pseudonymization, not anonymization.
  ref: "concepts.md#data-masking--redaction-non-prod--logs"

- id: application-cryptography-and-data-protection-047
  difficulty: intermediate
  tags: [data-masking, logs, scenario]
  question: |
    A production incident shows full request bodies (including passwords and card numbers) in
    application logs and APM traces. Which control set addresses this?
  options:
  - "Encrypt the entire log volume at rest and consider it solved"
  - "Never log secrets/PII: scrub at the logging layer (allowlist fields, redaction filters for PANs/emails/tokens) and mark fields sensitive so serializers omit them"
  - "Delete logs immediately after every request"
  - "Move logging to a different cloud region"
  answer: 1
  explanation: |
    Logs, traces, and stack traces are a major, under-appreciated leak vector. The fix is to not
    emit sensitive data: allowlist logged fields, apply redaction filters, and mark fields so
    serializers/toString omit them. Disk encryption alone does not stop authorized log readers
    from seeing the plaintext.
  ref: "concepts.md#data-masking--redaction-non-prod--logs"

- id: application-cryptography-and-data-protection-048
  difficulty: intermediate
  tags: [in-use, confidential-computing]
  question: |
    Confidential computing (Intel SGX, AMD SEV-SNP, AWS Nitro Enclaves) primarily protects data
    in which state?
  options:
  - "At rest"
  - "In transit"
  - "In use (while decrypted in memory / processed by the CPU)"
  - "In backups"
  answer: 2
  explanation: |
    Confidential computing uses hardware Trusted Execution Environments to protect data while it
    is in use — decrypted in memory and processed — so even the OS, hypervisor, or cloud operator
    cannot read it. At-rest and in-transit are handled by encryption and TLS respectively.
  ref: "concepts.md#encryption-in-use--confidential-computing-brief"

- id: application-cryptography-and-data-protection-049
  difficulty: advanced
  tags: [in-use, attestation, scenario]
  question: |
    In a confidential-computing design, what is the role of remote attestation before releasing
    a DEK into an enclave?
  options:
  - "It compresses the DEK for faster transfer"
  - "It rotates the KEK automatically"
  - "It lets the client cryptographically verify it is talking to genuine, unmodified enclave code before releasing the secret"
  - "It disables the hypervisor"
  answer: 2
  explanation: |
    Remote attestation produces a verifiable measurement of the code/environment running in the
    enclave. The client checks this attestation to confirm it is the expected, untampered enclave
    before sending secrets like a DEK into it — establishing trust in an untrusted host.
  ref: "concepts.md#encryption-in-use--confidential-computing-brief"

- id: application-cryptography-and-data-protection-050
  difficulty: advanced
  tags: [in-use, homomorphic, mpc]
  question: |
    How do homomorphic encryption and secure multi-party computation relate to confidential
    computing?
  options:
  - "They are identical to hardware enclaves"
  - "They are cryptographic (software) approaches to protecting data 'in use' — computing on/over protected data — but remain mostly impractical for general workloads today"
  - "They only protect data at rest"
  - "They are older names for TLS"
  answer: 1
  explanation: |
    Homomorphic encryption (compute on ciphertext) and MPC (compute across parties without
    revealing inputs) address the in-use state cryptographically rather than via hardware TEEs.
    Both are powerful but still too slow/limited for general production use.
  ref: "concepts.md#encryption-in-use--confidential-computing-brief"
