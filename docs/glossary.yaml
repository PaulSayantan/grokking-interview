# glossary.yaml — the curated acronym / term-of-art list the clarity standard references.
#
# WHY THIS FILE EXISTS
# SKILL.md C2 ("thing before name") requires every term's first use to carry a gloss the
# reader already has the words for, and a locally coined abbreviation used before it is
# coined is a hard failure. Enforcing that needs one shared answer to "what counts as a
# load-bearing term of art, and what is its expansion?" — otherwise every rewriter invents
# a different list and the corpus ends up glossing `HTTP` and not glossing `HPACK`.
#
# NOTHING IS GATED YET. `enforce_domains` is EMPTY and must stay empty until a wave has
# actually run and the false-positive rate is known. `scripts/clarity_report.py` does not
# read this file; no CI check reads it. It is a lookup table for a human (or an agent)
# rewriting a topic, and a place to record the corpus evidence for each term.
#
# HOW THE CANDIDATES WERE FOUND (not guessed)
# Every ALLCAPS token of 2-6 chars was extracted from prose (scripts/prose.py's tokenizer,
# so code fences, tables and inline code are excluded), then its FIRST use in each file was
# tested for a nearby definition: a parenthetical immediately after ("TLS (Transport Layer
# Security)"), an initialism expansion in the preceding six words ("Transport Layer
# Security (TLS)"), or a gloss marker (`is`/`are`/`means`/`stands for`/`short for`) within
# C2's 25-word window. `undefined_first_use_files` is the number of files where the first
# use passed none of those tests. The counts below were measured on 2026-08-23 against 460
# concepts.md files; they are evidence, not a contract, and they will drift as the wave
# runs. Re-derive rather than trusting them.
#
# WHAT IS DELIBERATELY NOT HERE
# See `assumed_known` at the bottom. Glossing `HTTP` or `SQL` in a senior-interview corpus
# is noise, and SKILL.md's non-goals explicitly protect established product, API and type
# names (`PodTemplateSpec`, `ThreadPoolTaskExecutor`) from being unpacked at all.

schema: 1
updated: 2026-08-23
source: "scripts/prose.py tokenizer over topics/**/concepts.md"

# ---------------------------------------------------------------------------------------
# Enforcement. EMPTY ON PURPOSE — adding a domain here turns the C2 first-use check into a
# real constraint for that domain's rewrites. Add one domain, run one wave, measure the
# false-positive rate, and only then add another.
# ---------------------------------------------------------------------------------------
enforce_domains: []

policy:
  # C2's numbers, restated so a tool that reads this file does not re-invent them.
  first_use_gloss_window_words: 25
  concrete_instance_window_words: 60
  # A term is "glossed" if the first use carries any of these within the window.
  gloss_markers: ["is", "are", "means", "stands for", "short for", "—", ":", "(...)"]
  # An expansion on its own is not a gloss: "MVCC (multi-version concurrency control)"
  # still owes the reader a clause saying what it DOES. Where `gloss` below is present,
  # it is the minimum a first use has to convey.
  expansion_alone_is_not_a_gloss: true
  # C9's exemption principle applies here too: a topic ABOUT a term may use it densely
  # without re-glossing. Per-file exemptions belong in docs/continuity/<domain>.yaml.
  per_file_exemptions_live_in: "docs/continuity/<domain>.yaml (exemptions:)"

