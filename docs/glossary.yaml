# ---------------------------------------------------------------------------------------
# Non-acronym terms of art. Chosen by hand rather than by the acronym scan, because they
# are ordinary English words used with a precise technical meaning — which is exactly the
# case C2 says a reader cannot recover from context.
# ---------------------------------------------------------------------------------------
phrases:
  - term: backpressure
    gloss: "the consumer telling the producer to slow down, instead of silently buffering until something dies"
  - term: quorum
    gloss: "the number of replicas that must answer before a read or write counts — `R + W > N` is the overlap rule"
  - term: tail latency
    gloss: "the slow end of the distribution (p99, p99.9), which is what a user with several dependencies actually feels"
  - term: idempotent
    gloss: "safe to apply twice: the second application changes nothing, which is what makes a retry safe"
  - term: happens-before
    gloss: "the JMM's ordering edge: if X happens-before Y, everything X wrote is visible to Y — it says nothing about wall-clock time"
  - term: blast radius
    gloss: "how much of the system one failure can reach"

# ---------------------------------------------------------------------------------------
# Deliberately NOT gated. Two reasons, kept separate.
# ---------------------------------------------------------------------------------------
assumed_known:
  reason: >-
    A senior-interview reader has these. Glossing them is the noise that makes a reader
    stop trusting the glosses that matter.
  terms: [HTTP, HTTPS, JSON, YAML, XML, SQL, API, CPU, RAM, OS, URL, URI, ID, UI, CLI,
          SDK, JVM, JDK, TCP, UDP, IP, DNS, CDN, JWT, ORM, CRUD, GC, IO, VM, DB, ACID,
          REST, RPC, TLS, SSL, HTML, CSS, CI, CD, AWS, LTS, FIFO, LIFO, LRU, PR]

never_unpack:
  reason: >-
    SKILL.md non-goals: "Not unpacking established product, API or type names." These are
    what the reader searches for; expanding them into prose destroys the search term.
  examples: [PodTemplateSpec, ThreadPoolTaskExecutor,
             PersistenceExceptionTranslationPostProcessor, AnnotationTypeFilter,
             SynchronousQueue, ReentrantReadWriteLock]
