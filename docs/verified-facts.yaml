# VERIFIED FACTS LEDGER — the facts a prose rewrite may not quietly change.
#
# Checked by:  python3 scripts/rewrite_audit.py --audit-ledger
#              python3 scripts/rewrite_audit.py            (runs on every audited diff)
# Contract:    .claude/skills/clarity-standard/SKILL.md, "Fact safety"
#
# WHY THIS FILE EXISTS
# Commit 268a063 rewrote 59 concepts.md files for pedagogy and silently downgraded
# verified AWS values (SCPs attached per entity 10 -> 5, which is the RCP limit; the NLB
# idle timeout asserted as "fixed at 350 s" when it is configurable 60-6000 s). Every
# gate stayed green; only a second, web-enabled pass that read the DIFF caught it
# (cd08d66). Three further regressions on the clarity effort changed no number, no
# version and no citation at all — they de-hedged, swapped a mechanism for an observable
# property, and deleted a qualifier. A ledger makes those regressions STRUCTURALLY
# IMPOSSIBLE instead of merely findable: the value is pinned to its file, with its source.
#
# ENTRY SHAPE
#   id:        stable kebab-case identifier, unique in this file
#   file:      the concepts.md the fact lives in (repo-relative; must exist)
#   claim:     the verified fact in one plain sentence — what is TRUE
#   require:   OPTIONAL. A substring that must still appear in that file, matched on the
#              whole file flattened to one line, markdown-stripped, dashes normalised to
#              "-", case-insensitively. Keep it as SHORT as the fact allows: the
#              irreducible token of the fact, not the sentence around it. A long require
#              fires on every honest rewording and teaches people to edit the ledger
#              instead of reading it.
#   forbid:    OPTIONAL. Python regexes (case-insensitive, same flattened text) for the
#              KNOWN-WRONG forms. This half is what catches an ADDED false claim, which
#              is what three of the four real regressions were. Beware: several files
#              legitimately QUOTE the stale claim in order to refute it (this very
#              corpus does — see nlb-security-groups below), so every forbid pattern must
#              be proven absent today by `--audit-ledger`.
#   source:    primary source URL only — the spec, the RFC, the vendor's own limits page,
#              or the actual source file. Never a blog, never "standard architecture".
#   verified:  ISO date the source was last opened and the value read off it.
#   verified_by: the commit that established or repaired the value, when there is one.
#   note:      what makes this fact easy to get wrong. This is the field a rewriter
#              actually reads when the gate fires, so write it for them.
#
# At least one of require/forbid is mandatory. Both is better.
#
# WHEN THE GATE FIRES ON YOUR REWRITE
# It is telling you a fact-shaped line moved or changed. There is exactly one legitimate
# response: open `source`, re-read the value, then update `require` and `verified` in the
# same commit as the prose. A ledger edit is a reviewed diff line, which is the point.
# Never widen a require to make it pass, and never delete an entry.

schema: 1
pass: clarity-v1

facts:
  # ------------------------------------------------------------------------------------
  # Repaired by cd08d66 — "web-verify fact-check of the refinement pass".
  # These are the known-dangerous ones: they were already correct once, and a no-web
  # pedagogy pass made them wrong.
  # ------------------------------------------------------------------------------------
  - id: nlb-tcp-idle-timeout-configurable
    file: topics/system-design/aws-load-balancing-elb-autoscaling/concepts.md
    claim: >-
      An NLB's TCP connection idle timeout defaults to 350 s and has been configurable
      in the range 60-6000 s since a November 2023 update. It is not fixed.
    require: "60-6000"
    forbid:
      - "idle timeout[^.]{0,40}(?:is|are|remains|stays) (?:not tunable|fixed)"
      - "\\bnot tunable\\b"
    source: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      The pre-268a063 text said "fixed at 350 s / generally not tunable", which was the
      regression. Three different NLB timeouts coexist in this file (TCP configurable,
      TLS listener fixed, UDP fixed), so "350 s" appearing somewhere proves nothing —
      the configurable RANGE is the fact that was lost.

  - id: nlb-tls-listener-idle-timeout-fixed
    file: topics/system-design/aws-load-balancing-elb-autoscaling/concepts.md
    claim: An NLB TLS listener's idle timeout is a fixed 350 s and cannot be configured.
    require: "fixed 350 s"
    source: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      This is the one NLB timeout that really is fixed. A rewrite that "simplifies" the
      three timeouts into one sentence usually keeps the TCP number and loses this, or
      generalises "fixed" onto the TCP flow and reintroduces the original regression.

  - id: nlb-udp-flow-timeout-fixed-120s
    file: topics/system-design/aws-load-balancing-elb-autoscaling/concepts.md
    claim: NLB UDP flow timeout is a fixed 120 s (UDP has no connection concept).
    require: "120 s"
    source: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/network-load-balancers.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      The smallest of the three timeouts and the easiest to drop as "detail" while
      keeping the sentence's shape. Losing it makes the remaining prose read as though
      the TCP timeout governs UDP too.

  - id: nlb-security-groups-since-aug-2023
    file: topics/system-design/aws-load-balancing-elb-autoscaling/concepts.md
    claim: >-
      An NLB can have its own security group, launched 10 August 2023. The old "NLBs
      can't have security groups" line is out of date.
    require: "Aug 2023"
    source: https://aws.amazon.com/about-aws/whats-new/2023/08/network-load-balancer-supports-security-groups/
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      NO forbid pattern is possible here, and that is instructive: the file deliberately
      QUOTES the stale claim ("NLBs can't have security groups") in order to refute it,
      so any forbid on the wrong wording would fire on correct content. Where a file
      teaches by refuting, only `require` can guard the fact.

  - id: scps-per-org-10000
    file: topics/system-design/aws-saas-isolation-patterns/concepts.md
    claim: AWS Organizations allows 10,000 service control policies per organization.
    require: "SCPs per org | 10,000"
    forbid:
      - "SCPs per org \\|[^|]{0,30}~?1,000\\b"
    source: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      THIS IS THE 268a063 REGRESSION ITSELF, per the git record: a correct 10,000 was
      rewritten to "order of ~1,000 (verify live)" by a no-web pedagogy pass, and cd08d66
      put it back. Hedging a verified value into vagueness is information loss dressed as
      caution — it is the inverse failure, not the safe option. The require is
      the table row itself because this file quotes five other 10,000-shaped ceilings
      (Control Tower, GuardDuty, Security Hub, Macie, Inspector) — a bare "10,000" would
      match one of those and prove nothing.

  - id: scps-attached-per-entity-10
    file: topics/system-design/aws-saas-isolation-patterns/concepts.md
    claim: At most 10 SCPs may be attached to a single entity (root, OU or account).
    require: "10 attached per entity"
    forbid:
      - "\\b5 attached per entity\\b"
      - "SCPs?[^|]{0,40}max 5 per entity"
    source: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      5 is the RCP per-entity limit, sitting in the very next table row, and SKILL.md
      records a 10 -> 5 regression here. Checked against git: "5 attached per entity" has
      never existed in tracked history and this value has read 10 since 50f2396, so the
      confusion was caught before it shipped (268a063's own message says it fixed it).
      Ledgered anyway, because the two adjacent rows are the trap: any rewrite that merges
      the SCP and RCP rows, or writes "5 per entity" without SCP or RCP attached to it,
      recreates exactly the confusion the standard warns about. Both limits are real and
      they belong to different policy types.

  - id: scp-document-size-10240-chars
    file: topics/system-design/aws-saas-isolation-patterns/concepts.md
    claim: An SCP document may be at most 10,240 characters (the console strips whitespace).
    require: "10,240"
    source: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      Reads like a throwaway number in a dense table row, so it is the first thing a
      "tighten this table" pass deletes. It is also the limit that decides whether a
      tenant-isolation SCP strategy is implementable at all.

  - id: rcps-per-org-2000-and-5-per-entity
    file: topics/system-design/aws-saas-isolation-patterns/concepts.md
    claim: >-
      Resource control policies are a separate quota from SCPs: 2,000 per organization,
      at most 5 attached per entity.
    require: "RCPs | 2,000 per org; max 5 per entity"
    source: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
    verified: 2026-07-27
    verified_by: cd08d66
    note: >-
      cd08d66 added this row precisely so the SCP row could not be confused with it
      again. Keeping the SCP numbers while dropping this row restores the ambiguity that
      caused the original regression, which is why the RCP row is ledgered too.

  # ------------------------------------------------------------------------------------
  # Caught during the clarity effort itself, on the design-your-own-proof rewrites.
  # None of these changed a number, a version or a citation — which is exactly why
  # nothing mechanical saw them, and why they are ledgered as SHAPES with `forbid`.
  # ------------------------------------------------------------------------------------
  - id: jls-17-7-splitting-is-implementation-conditioned
    file: topics/java-jvm/synchronized-volatile-jmm/concepts.md
    claim: >-
      JLS 17.7 permits an implementation to split a non-volatile 64-bit write into two
      32-bit halves. The condition is the implementation, not the word size of the JVM,
      and the spec does not promise that a 64-bit JVM is safe.
    require: "JLS 17.7"
    forbid:
      - "on (?:a )?32-bit JVMs?"
      - "64-bit JVMs? (?:are|is) safe"
      - "only (?:on )?32-bit"
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.7
    verified: 2026-08-23
    note: >-
      The single most dangerous edit in the clarity standard is C9 de-hedging, and this
      is its canonical failure: "on some JVMs" became "on a 32-bit JVM". That reads like
      a helpful specific, but it invents a condition JLS 17.7 does not state and implies
      64-bit JVMs are safe BY SPEC, which they are not. If you cannot source the
      condition, keep the hedge.

  - id: hotspot-64bit-atomicity-is-a-property-not-a-codegen-claim
    file: topics/java-jvm/synchronized-volatile-jmm/concepts.md
    claim: >-
      In practice HotSpot on 64-bit platforms writes a long or double atomically. That is
      an observable property; how many machine instructions it takes is a codegen claim
      this file does not source.
    require: "atomically anyway"
    forbid:
      - "(?:writes?|write)[^.]{0,40}in one instruction"
      - "64-bit platforms?[^.]{0,30}(?:single|one) instruction"
    source: https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.7
    verified: 2026-08-23
    note: >-
      A rewrite replaced "writes them atomically" with "writes a long in one
      instruction" — a mechanism substituted for a property, in the same pass where the
      writer had explicitly REJECTED a different codegen claim as unsourceable. Atomicity
      is what the reader needs and what the file can defend; instruction counts are not.

  - id: x86-tso-is-qualified-not-absolute
    file: topics/java-jvm/synchronized-volatile-jmm/concepts.md
    claim: >-
      x86 is a relatively strong TSO model in which store-load is the reordering visible
      to another core. The guarantee covers ordinary write-back memory accesses; it is
      not an unconditional "nothing else can be reordered".
    require: "store-load"
    forbid:
      - "nothing else can"
      - "x86[^.]{0,50}sequentially consistent"
      - "x86[^.]{0,40}no reordering"
    source: https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html
    verified: 2026-08-23
    note: >-
      The regression deleted "relatively" and added an absolute: "x86 gives you TSO …
      nothing else can". Non-temporal stores, string operations and non-write-back memory
      types are outside the guarantee. `require: store-load` is deliberately the
      irreducible token, so an honest rewording of the sentence still passes while the
      absolutist form is caught by `forbid`.

  - id: increment-and-get-is-a-cas-loop-not-a-compareandset-call
    file: topics/java-jvm/synchronized-volatile-jmm/concepts.md
    claim: >-
      AtomicInteger.incrementAndGet() behaves as a CAS retry loop. It does not call
      compareAndSet: since JDK 8 it delegates to Unsafe.getAndAddInt, whose loop uses
      weakCompareAndSetInt, and on x86 it can compile to a single atomic add with no
      retry at all.
    require: "CAS loop"
    forbid:
      - "calls\\s+compareAndSet"
      - "incrementAndGet[^.]{0,60}calls\\s+compareAndSet"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/concurrent/atomic/AtomicInteger.java
    verified: 2026-08-23
    note: >-
      "Is a CAS loop" is an observable-behaviour claim and is true. "Calls
      compareAndSet(expected, expected + 1)" is a call-path claim and is false. A rewrite
      that turns a parenthetical into a verb makes the second claim while feeling like a
      paraphrase — SKILL.md's "call path" shape: X calls Y where the base said only that
      X behaves like Y.

  - id: increment-and-get-pseudocode-is-illustrative
    file: topics/java-jvm/multithreading-concurrency/concepts.md
    claim: >-
      The incrementAndGet body shown in this file is illustrative pseudocode for a CAS
      retry loop, not the JDK source: the real implementation delegates to
      Unsafe.getAndAddInt.
    require: "retry loop over CAS"
    forbid:
      - "calls\\s+compareAndSet"
    source: https://github.com/openjdk/jdk/blob/master/src/java.base/share/classes/java/util/concurrent/atomic/AtomicInteger.java
    verified: 2026-08-23
    note: >-
      Same fact, second file. A fence showing a do/while over compareAndSet is fine as
      long as the prose frames it as what CAS DOES; it becomes wrong the moment the prose
      says this is what the method calls.

  - id: go-context-is-explicit-but-not-compiler-enforced
    file: topics/observability/distributed-tracing-concepts-and-context-propagation/concepts.md
    claim: >-
      Go propagates trace context by passing context.Context explicitly as the first
      argument. Nothing in the compiler enforces that it is the RIGHT context:
      context.Background() compiles cleanly and silently orphans every child span.
    require: "context.Context"
    forbid:
      - "missing (?:one|context)[^.]{0,40}compile"
      - "compile[- ]time error"
      - "context\\.Background\\(\\)[^.]{0,60}(?:will not|won't|does not|doesn't) compile"
    source: https://pkg.go.dev/context
    verified: 2026-08-23
    note: >-
      A de-hedge turned "Go passes context.Context explicitly as the first argument" into
      "so a missing one is a compile error". False, and it inverts the teaching point:
      the danger in Go tracing is precisely that the wrong context compiles. The sibling
      topic grpc/deadlines-timeouts-cancellation documents the same trap at runtime.

