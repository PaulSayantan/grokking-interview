# LOSS ALLOWLIST — the only way to clear an information-inventory finding other than
# restoring the information. One entry per signed-off loss, and the reason is the point:
# it is a reviewed diff line, not a config toggle.
#
#   - file: topics/<domain>/<slug>/concepts.md   # or "*" for any file
#     kind: LOST_NUMBERS                        # LOST_{NUMBERS,VERSIONS,SPECS,
#                                               # IDENTIFIERS,URLS} | ADDED_NUMBER_UNCITED
#                                               # | NUMBER_CHANGED_UNCITED
#     item: "350s"                              # the exact inventory item, when known;
#                                               # omit `item` to allow the whole kind
#     reason: "…"                               # who verified what, and against which source
#
# Prefer `item` over `kind`: a whole-kind waiver on a file silences the next regression
# in that class too.
# ------------------------------------------------------------------------------------
  # --- docker pilot topic 3 (dockerfile-layers-build-cache) -----------------------
  - id: dockerfile-add-unpack-min-frontend-1-17
    file: topics/docker/dockerfile-layers-build-cache/concepts.md
    claim: "ADD's `--unpack` flag has a minimum Dockerfile syntax (frontend) version of 1.17. It controls
      automatic tar extraction in BOTH directions: local tar archives are unpacked by default and
      `--unpack=false` opts out, while remote tar archives (src is a URL) are downloaded WITHOUT
      unpacking and `--unpack=true` opts in. Archive recognition is by the file's CONTENTS, not its
      name."
    require: "1.17"
    source: https://docs.docker.com/reference/dockerfile/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 3
    note: "Ledgered rather than waived, because the version is the whole point of the sentence: the
      flag is useless to a reader on an older frontend, and `# syntax=` pinning is common in this
      corpus. Verified directly against the ADD options table, not taken from the pilot's own agents
      (both of which reported it independently and agreed). Sibling fact from the same table, guarded
      by the entry below: `--checksum` is minimum 1.6."
  - id: dockerfile-add-checksum-min-1-6-sha256-http-only
    file: topics/docker/dockerfile-layers-build-cache/concepts.md
    claim: "ADD's `--checksum` flag has a minimum Dockerfile version of 1.6. For HTTP sources SHA-256 is
      the only supported hash algorithm, formatted `sha256:<hash>`. For GIT sources the checksum is the
      commit SHA and may be a prefix of one or more characters rather than the full SHA."
    require: "1.6"
    source: https://docs.docker.com/reference/dockerfile/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 3
    note: "The trap is over-generalising 'SHA-256 only' to every source type - it is true for HTTP and
      false for git, where a commit-SHA prefix is accepted. A rewrite that compresses the two source
      types into one sentence usually loses the git half."

  # --- docker pilot topic 6 (volumes-and-storage) ---------------------------------
  - id: volume-prune-anonymous-only-from-api-1-42
    file: topics/docker/volumes-and-storage/concepts.md
    claim: "`docker volume prune` removes only ANONYMOUS unused volumes by default; that default arrived
      with Engine API 1.42 (Engine 23.0). `--all`/`-a` extends it to \"both unused anonymous and named
      volumes\", and the flag itself arrived in 23.0.5. Before 1.42 the unqualified command took named
      volumes too."
    require: "1.42"
    source: https://docs.docker.com/reference/api/engine/version-history/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 6
    note: "A destructive-command default that CHANGED, which is the worst shape of stale fact in this
      corpus: a reader on an older Engine who trusts the new default loses named volumes. The base file
      stated the modern behaviour with no version condition at all. Two numbers matter and are easy to
      collapse into one - 23.0 for the default, 23.0.5 for the flag."
  - id: docker-desktop-virtiofs-98-percent
    file: topics/docker/volumes-and-storage/concepts.md
    claim: "Docker's own docs say VirtioFS \"has reduced the time taken to complete filesystem operations
      by up to 98%\" against the older gRPC FUSE implementation. It is an upper bound on a comparison
      between two Desktop file-sharing implementations, not a general claim about bind-mount speed."
    require: "98%"
    source: https://docs.docker.com/desktop/settings-and-maintenance/settings/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 6
    note: "Ledgered because the misreading is so easy and so tempting: \"up to 98% faster\" reads as
      \"bind mounts are fast on Mac now\". The repair pass had to correct exactly this. Keep the
      \"up to\" and keep the comparison target named."

  # --- docker pilot topic 7 (docker-networking) ------------------------------------
  - id: linux-eight-namespaces-time-since-5-6
    file: topics/docker/docker-networking/concepts.md
    claim: "Current Linux has EIGHT namespace kinds - cgroup, IPC, network, mount, PID, time, user, UTS - so
      besides the network namespace there are seven others, not six. The time namespace is the newest:
      its `/proc/<pid>/ns/time` handle exists since Linux 5.6."
    require: "5.6"
    source: https://man7.org/linux/man-pages/man7/namespaces.7.html
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 7
    note: "The base said 'the other six', which was right before 5.6 and is now wrong. Any writeup that
      predates 2020 counts six, so the count alone is not evidence - keep the version attached to it."
  - id: vxlan-50-byte-overhead-charges-inner-ethernet
    file: topics/docker/docker-networking/concepts.md
    claim: "VXLAN over IPv4 costs 50 bytes: 20 outer IP + 8 UDP + 8 VXLAN + 14 for the INNER Ethernet header
      the tunnel carries. The OUTER Ethernet header is NOT charged against the MTU, because an MTU is the
      largest IP datagram a path carries. On a 1500-byte path the outer IP/UDP/VXLAN take 36, leaving 1464
      bytes of inner frame, of which the inner Ethernet header takes 14, leaving 1450 bytes of inner IP
      payload."
    require: "1464"
    source: https://www.rfc-editor.org/rfc/rfc7348
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 7
    note: "The pilot draft got this wrong in the standard way - it charged the outer Ethernet header and
      jumped straight to 1450, which lands on the right final number by the wrong route and therefore
      cannot be checked. RFC 7348 states only the 8-byte VXLAN header numerically; the rest is MTU
      semantics (RFC 1191/791). Keep BOTH intermediate figures, 36 and 1464, or the arithmetic is
      unverifiable again."

