# LOSS ALLOWLIST — the only way to clear an information-inventory finding other than
# restoring the information. One entry per signed-off loss, and the reason is the point:
# it is a reviewed diff line, not a config toggle.
#
#   - file: topics/<domain>/<slug>/concepts.md   # or "*" for any file
#     kind: LOST_NUMBERS                        # LOST_{NUMBERS,VERSIONS,SPECS,
#                                               # IDENTIFIERS,URLS} | ADDED_NUMBER_UNCITED
#                                               # | NUMBER_CHANGED_UNCITED
#     item: "350s"                              # the exact inventory item, when known;
#                                               # omit `item` to allow the whole kind
#     reason: "…"                               # who verified what, and against which source
#
# Prefer `item` over `kind`: a whole-kind waiver on a file silences the next regression
# in that class too.
# ------------------------------------------------------------------------------------
  # --- docker pilot topic 3 (dockerfile-layers-build-cache) -----------------------
  - id: dockerfile-add-unpack-min-frontend-1-17
    file: topics/docker/dockerfile-layers-build-cache/concepts.md
    claim: "ADD's `--unpack` flag has a minimum Dockerfile syntax (frontend) version of 1.17. It controls
      automatic tar extraction in BOTH directions: local tar archives are unpacked by default and
      `--unpack=false` opts out, while remote tar archives (src is a URL) are downloaded WITHOUT
      unpacking and `--unpack=true` opts in. Archive recognition is by the file's CONTENTS, not its
      name."
    require: "1.17"
    source: https://docs.docker.com/reference/dockerfile/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 3
    note: "Ledgered rather than waived, because the version is the whole point of the sentence: the
      flag is useless to a reader on an older frontend, and `# syntax=` pinning is common in this
      corpus. Verified directly against the ADD options table, not taken from the pilot's own agents
      (both of which reported it independently and agreed). Sibling fact from the same table, guarded
      by the entry below: `--checksum` is minimum 1.6."
  - id: dockerfile-add-checksum-min-1-6-sha256-http-only
    file: topics/docker/dockerfile-layers-build-cache/concepts.md
    claim: "ADD's `--checksum` flag has a minimum Dockerfile version of 1.6. For HTTP sources SHA-256 is
      the only supported hash algorithm, formatted `sha256:<hash>`. For GIT sources the checksum is the
      commit SHA and may be a prefix of one or more characters rather than the full SHA."
    require: "1.6"
    source: https://docs.docker.com/reference/dockerfile/
    verified: 2026-08-25
    verified_by: clarity-pilot-docker topic 3
    note: "The trap is over-generalising 'SHA-256 only' to every source type - it is true for HTTP and
      false for git, where a commit-SHA prefix is accepted. A rewrite that compresses the two source
      types into one sentence usually loses the git half."

