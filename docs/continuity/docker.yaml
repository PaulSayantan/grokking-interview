- file: topics/docker/docker-networking/concepts.md
  note: Whether `docker network rm` also refuses for a STOPPED attached container is still open. The rewrite briefly
    asserted "running or stopped"; the verify pass reverted it, because the CLI reference says only "you must first
    disconnect any containers connected to it" and moby's check is on remaining endpoints, which a stopped container
    has released. The prose in H2 'Managing networks and connecting containers' now carries the base's unconditioned
    wording. Close it from a live engine (`docker network rm` against a network with one exited container) or from
