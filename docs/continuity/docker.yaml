open_cliffhanger:
  from: container-lifecycle
  to_position: 3
  pattern: E
  key_noun_for_K1_grep: whiteout
  gap: 'Runtime to build time is a genuine pivot, and the shared mechanism is deleting inside a stack
    of layers. Topic 2 closes on `docker rm` / `docker container prune` / `docker system prune` reclaiming
    the container''s writable layer and nothing under it, and its hook gives the arithmetic: a hundred
    containers on one 1.19 GB image return 41.6 MB, and a Dockerfile that deletes a 400 MB toolchain on
    the next line still ships a 1.19 GB image. Topic 3 owes why — the whiteout marker, the bytes that
    stay in the earlier layer, and the rule that no later instruction can shrink an earlier one. The hook
    says none of those three things, and does not mention multi-stage builds. K1 token caution: `whiteout`
    is the mechanically correct token (it is in the section at `payoff_anchor`), but topic 1 used the
    word three times and this hook names it once, so topic 3''s opener should pair it with the size figure
    — "the whiteout that still ships 400 MB" — or the grep cannot tell which loop is being named.'
  payoff_anchor: concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer
  verified_present: true
  payoff_evidence: 'Read at line 332 of the un-rewritten destination (8th of its 12 content H2s): layers
    are additive diffs stacked by a union filesystem (overlay2); a file deleted in a later layer is a
    whiteout marker, so it appears gone in the merged view while the original bytes still exist in the
    earlier layer and still ship in the image; "You cannot shrink an existing layer from a later one."
    Lines 351-354 then name `RUN rm -rf /some/big/thing` in a separate later `RUN`, and `RUN apt-get purge
    …` after an earlier install, as things that do not reduce final image size. Verified with read_headings,
    not by grep.'
  under_paid_on_purpose: 'Topic 1 taught the whiteout mechanism explicitly, so the reader''s transfer
    to image layers is RIGHT, not a wrong guess, and the hook now says so rather than pretending the mechanism
    is news. What is unpaid is permanence and its arithmetic: a container''s whiteout dies with the writable
    layer, an image''s whiteout ships forever, and the hidden bytes keep their size in the earlier layer.
    The plausible-but-wrong guess available to a careful reader is that the build reclaims them, or that
    the delete rewrites the earlier layer. Do not read the 41.6 MB / 1.19 GB figures as a leak — they
    are the question, not the answer.'
