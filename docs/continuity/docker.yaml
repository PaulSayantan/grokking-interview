domain: docker
schema: 1
pass: clarity-v1
reading_order_source: topics/docker/README.md
position: 14
plan:
- slug: images-vs-containers
  covers: Image vs container (class/instance); copy-on-write + thin writable layer; layer sharing across containers;
    image identity (repository/tag/digest, index digest); container vs VM; why containers are light; 'a container
    is just a process'; the union filesystem; docker run = create + start; ephemeral/disposable (12-factor).
  depends_on: none
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 1 closes on ephemeral/disposable — kill the container and recreate it, because the container IS
      its process and dies with it. Topic 2 exists because stopping is not a kill: docker stop sends SIGTERM, waits
      a 10s grace period, and only then SIGKILLs. Topic 1 already half-states the trap at its own line 489: shell
      form makes /bin/sh PID 1, so the signal reaches the shell and the app is killed with no graceful drain. The
      invariant ''disposable means free to throw away'' has a ten-second boundary.'
    payoff_anchor: concepts.md#stopping-sigterm-the-grace-period-then-sigkill
    key_noun: grace period
    verified_present: true
- slug: container-lifecycle
  covers: Container-as-a-process model; lifecycle state machine; run vs create vs start; -d/-it/TTY flags; stop
    = SIGTERM -> grace -> SIGKILL; exit codes; restart policies; pause/unpause; exec vs attach; ps/inspect/logs/stats;
    PID 1 signal handling and zombie reaping (tini/--init); runtime memory + CPU limits; rm and cleanup.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: E
    seam_strength: MODERATE
    seam: 'Runtime to build time is a genuine pivot, and the one mechanism that runs through both is layer deletion.
      Topic 2 ends on docker rm / docker system prune, which reclaims the container''s writable layer and nothing
      under it. Topic 3 answers why the reclaim is so small: a file deleted in a later image layer is only a whiteout
      marker, the bytes stay in the earlier layer, and no later instruction can shrink an earlier one. Pose the
      question on the shared mechanism (deleting inside a stack of layers), not on a manufactured dependency.'
    payoff_anchor: concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer
    key_noun: whiteout
    verified_present: true
- slug: dockerfile-layers-build-cache
  covers: Dockerfile -> image-layer model; which instructions make layers vs metadata; build context + .dockerignore;
    cache key and invalidation; least-to-most-changed ordering; COPY vs ADD; combining RUN; why a later delete does
    not shrink the image; BuildKit cache mounts for package managers; ARG vs ENV; FROM/scratch/tags/digests; docker
    history for size and cache diagnosis.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: Topic 3 hands over a correct, fast, small image and its last instruction is a CMD. Nothing in it says
      the FORM of that CMD decides who is PID 1. Write CMD npm start and /bin/sh is PID 1, sh does not forward SIGTERM
      to its child, and docker stop hangs the full 10 seconds before SIGKILL — with a correct image.
    payoff_anchor: concepts.md#the-pid-1--sigterm-problem-with-shell-form
    key_noun: PID 1
    verified_present: true
    note: The slug is `the-pid-1--sigterm-problem-with-shell-form` — DOUBLE hyphen, from `/` in the heading text.
      The single-hyphen spelling in SKILL.md's and docs/continuity/README.md's illustrative ledgers does not resolve.
- slug: entrypoint-vs-cmd
  covers: CMD as default command/args; ENTRYPOINT as the fixed executable; the two combined; exec form vs shell
    form; the PID 1 / SIGTERM failure of shell form; overriding both at run time; entrypoint scripts and exec "$@";
    shell-form variable expansion; docker stop + STOPSIGNAL + init/tini; the ENTRYPOINT x CMD table.
  depends_on: container-lifecycle
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 4''s whole repair kit assumes a shell exists: exec form vs shell form as a choice, an ENTRYPOINT
      script that ends in exec "$@", tini as PID 1. Topic 5 tells you to ship distroless or scratch, which has no
      /bin/sh at all — so shell form cannot work, RUN is impossible in the final stage, and docker exec -it sh fails.
      The rule ''pick the form that suits you'' has a base-image boundary.'
    payoff_anchor: concepts.md#distroless-images
    key_noun: no shell
    verified_present: true
- slug: multi-stage-builds-image-optimization
  covers: What image size costs (egress $/day, cold start s); the fat-image anti-pattern; multi-stage builds; named
    stages and --target; COPY --from (stages and external images); build-time vs runtime deps; base-image ladder
    full/slim/alpine/ distroless/scratch; static binaries; layer + cache cleanup; .dockerignore; layer reuse across
    images; auditing size with docker history.
  depends_on: dockerfile-layers-build-cache
  seam_to_next:
    pattern: B
    seam_strength: MODERATE
    seam: Topic 5 optimises bytes that ship. Every number in it is an IMAGE number — 580 MB down to 20 MB, 10 s
      of pull down to 0.2 s. Nothing in it prices the bytes a container writes after it starts, which land in the
      writable layer, cost a full-file copy_up on first write, and vanish on docker rm. The bill has units (disk,
      first-write latency, and the data itself) and topic 6 is where it arrives; do not reveal that the fix is a
      mount.
    payoff_anchor: concepts.md#the-ephemeral-writable-layer
    key_noun: writable layer
    verified_present: true
- slug: volumes-and-storage
  covers: The ephemeral writable layer; copy-on-write and why a DB must not use it; named volumes; bind mounts;
    tmpfs; choosing between them; volume lifecycle commands; -v vs --mount; anonymous vs named; first-mount copy
    from image content; read-only mounts; sharing volumes; UID/GID permissions; volume drivers (NFS/cloud); volumes
    in Compose; backup and restore.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: E
    seam_strength: WEAK
    seam: 'Storage to networking is the domain''s weakest join: neither topic needs the other. The one genuinely
      shared mechanism is that both are per-container kernel namespaces the host wires in from outside — a bind
      mount crosses the mount namespace, a published port crosses the network namespace. The usable question sits
      on topic 6''s ''Sharing volumes between containers'': a shared volume lets two containers exchange bytes at
      rest, and gives neither one any way to ADDRESS the other. Topic 7 answers what a container is called. Do not
      dress this as a dependency.'
    payoff_anchor: concepts.md#the-embedded-dns-resolver
    key_noun: embedded DNS
    verified_present: true
- slug: docker-networking
  covers: Network namespaces as the isolation mechanism; bridge driver; default vs user-defined bridge (automatic
    DNS by container name); the embedded DNS resolver at 127.0.0.11; host and none drivers; -p publishing vs EXPOSE;
    container-to-container traffic; localhost inside a container; iptables/NAT under the hood; overlay (multi-host);
    macvlan/ipvlan; network CRUD; Compose networks.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 7''s payoff rule is that on a user-defined bridge containers reach each other by name, no IPs —
      and it already notes Compose creates that bridge per project so service names ''just work''. The boundary:
      the name resolves the moment the container is created, long before the process inside is listening. Topic
      8 is where that becomes depends_on giving start ORDER and not readiness, which is why an API that starts first
      still dies on connection refused.'
    payoff_anchor: concepts.md#depends_on-ordering-not-readiness
    key_noun: readiness
    verified_present: true
- slug: docker-compose
  covers: 'What Compose is; Compose vs Dockerfile; compose.yaml structure; declaring a multi-container app; service
    discovery on the default project network; per-service networks; depends_on is ordering not readiness; healthchecks
    and condition: service_healthy; build vs image; ports vs expose; volumes; environment/env_file/.env substitution;
    scaling; profiles; override files and merging; dev vs prod; single-host limit.'
  depends_on: docker-networking
  seam_to_next:
    pattern: A
    seam_strength: MODERATE
    seam: 'Topic 8 sells one declarative file as the truth of the deployment. The boundary is inside that file:
      `image: myorg/api:1.4` is not an identity. Topic 9 shows the same tag resolving to different bytes on two
      machines because a push MOVES the pointer, which makes the checked-in Compose file reproducible in shape and
      not in content.'
    payoff_anchor: concepts.md#tags-are-mutable-pointers
    key_noun: pointer
    verified_present: true
- slug: registries-and-distribution
  covers: What a registry is; image-reference anatomy; tags as mutable pointers; the immutable digest; the latest
    foot-gun; auth (login, tokens, credential helpers); what travels (manifests, blobs, dedup); manifest + config;
    multi-arch image index; the OCI distribution spec; pull rate limits; promotion across registries; garbage collection.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: B
    seam_strength: WEAK
    seam: 'Distribution to production operations is a curricular join. The shared object is the deploy: topic 9
      ends able to put exactly the right bytes on every host, pinned by digest, promoted between registries. Nothing
      in it touches what happens while the swap runs. Topic 10 opens on the 502s users see during a deploy that
      pulled a perfectly correct image. State the bill''s existence (a deploy replaces RUNNING containers) without
      naming health checks, SIGTERM or draining.'
    payoff_anchor: concepts.md#putting-it-together-anatomy-of-a-deploy-the-502-timeline
    key_noun: '502'
    verified_present: true
- slug: production-healthchecks-logging
  covers: Why orchestrators need health signals; HEALTHCHECK and its options/defaults; health states and transitions;
    healthcheck gotchas; vs k8s liveness/readiness/startup probes; stdout/stderr logging model; json-file driver
    + rotation (disk-fill); other log drivers and the docker logs / blocking-mode traps; graceful shutdown and the
    grace period; PID 1 signal forwarding; draining in-flight requests; the 502 deploy timeline.
  depends_on: entrypoint-vs-cmd
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 10 teaches the whole shutdown negotiation — trap SIGTERM, stop accepting, drain, exit inside the
      grace period — and never once says how you find out whether the app actually caught the signal (137 and 143
      appear nowhere in the file, verified). Its rule ''handle SIGTERM and you shut down cleanly'' has no observable
      attached. Topic 11 supplies it: the exit code separates a clean SIGTERM death from a container that ignored
      it and was killed, or was never a shutdown problem at all.'
    payoff_anchor: concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends
    key_noun: '137'
    verified_present: true
- slug: debugging-troubleshooting
  covers: A container debugging methodology; docker logs; docker exec shells; docker inspect (config/state/mounts/networks/exit
    code); docker stats; why a container will not start or exits at once; exit codes 137/143/127/126 and exec format
    error; debugging distroless and shell-less images (docker debug, namespace-sharing sidecar, /proc/1/root); docker
    events; docker diff; common errors.
  depends_on: container-lifecycle
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Every escalation in topic 11 opens the isolation boundary on purpose: a fat toolbox image joined to the
      target''s PID and network namespaces, its filesystem read through /proc/1/root, and in CI a runner that reaches
      the daemon through a mounted socket. Topic 12''s escape table lists those same primitives as attack vectors
      — mounted docker.sock, --privileged, CAP_SYS_ADMIN. The rule ''to debug it, join it'' is indistinguishable
      from the attack, and topic 12 is where that is priced.'
    payoff_anchor: concepts.md#container-escape-threat-model
    key_noun: escape
    verified_present: true
- slug: docker-security
  covers: Container security threat model (shared kernel); non-root; rootless Docker; userns-remap; dropping capabilities;
    why --privileged is dangerous; read-only rootfs; seccomp; AppArmor/SELinux; no-new-privileges; keeping secrets
    out of layers; the Docker socket = root; the escape threat model; scanning (Docker angle); CIS benchmark.
  depends_on: runtimes-oci-standards
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Every control in topic 12 constrains what a container may DO once it is running, and all of them assume
      the image contains what you think it contains. A hijacked base image, or a transitive dependency published
      yesterday, is already inside the boundary before seccomp, capabilities or a read-only rootfs get a say. Topic
      12 even defers this itself in its own ''Image scanning & supply chain (Docker angle)'' section. Topic 13 opens
      on exactly that: the image is a supply chain, not a file.'
    payoff_anchor: concepts.md#the-image-supply-chain-threat-model
    key_noun: base image
    verified_present: true
- slug: image-scanning-supply-chain
  covers: The image supply-chain threat model; what scanning finds (and its layers/ package sources); Trivy/Grype/Scout/Clair;
    base-image CVEs and minimal bases; rebuild cadence; SBOM; Docker Content Trust / Notary; cosign + Sigstore keyless;
    pinning bases by digest; CI/registry gating by severity; admission control; scanner accuracy and false positives.
  depends_on: registries-and-distribution
  seam_to_next:
    pattern: B
    seam_strength: STRONG
    seam: 'Topic 13 makes two demands and funds neither: attach an SBOM and provenance to every image, and never
      let a credential reach a layer. Both are build-time capabilities and the legacy builder has neither — it cannot
      emit an in-toto attestation and it has nowhere to put a secret except a layer. Topic 14 is the engine that
      pays. Give the bill''s existence, not its structure.'
    payoff_anchor: concepts.md#provenance--sbom-attestations
    key_noun: attestation
    verified_present: true
- slug: buildkit-advanced-builds
  covers: BuildKit vs the legacy builder; LLB as a build graph; enabling buildkit/buildx; RUN --mount=type=cache
    / bind / secret / ssh; heredocs; the syntax directive and frontends; multi-platform builds with buildx (QEMU
    vs native); registry cache --cache-to/--cache-from; provenance + SBOM attestations; buildx bake.
  depends_on: dockerfile-layers-build-cache
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 14 states three times that a multi-platform manifest must be pushed to a registry, because the
      classic image store cannot hold one locally, and that the way round it is to enable the containerd image store.
      It never says why a local store would care about a list of manifests. Topic 15 answers it: the classic store
      keys layers to a graph driver''s own chain IDs, while a containerd snapshotter keys them by content, and only
      the second can hold an index whose members it may never unpack.'
    payoff_anchor: concepts.md#graph-drivers-vs-containerd-snapshotters-the-modern-shift
    key_noun: containerd image store
    verified_present: true
- slug: image-internals-storage-drivers
  covers: Image = ordered layers + config + manifest; the manifest; the config and rootfs.diff_ids; content-addressable
    storage; diff_id vs digest (uncompressed vs stored blob); layers as changesets not snapshots; the union filesystem;
    copy-on-write and copy_up; whiteouts and opaque dirs; overlay2 and its /var/lib/docker layout; storage drivers
    compared; graph drivers vs snapshotters; dedup and layer order; the image index; the inspection toolbox.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 15 ends with the layers fully assembled: overlay2 has mounted lowerdirs and an upperdir into one
      merged directory under /var/lib/docker, and every byte the process will read is in place. Nothing is running.
      A root filesystem is not a container, and topic 15 never names what turns one into the other. Topic 16 does:
      an OCI bundle is that rootfs plus a config.json, and runc reads the config to make the kernel calls.'
    payoff_anchor: concepts.md#runc-and-the-oci-runtime-flow
    key_noun: OCI bundle
    verified_present: true
- slug: runtimes-oci-standards
  covers: The runtime stack CLI -> dockerd -> containerd -> shim -> runc; containerd as the high-level runtime;
    runc and the OCI runtime flow (bundle, config.json, create/start split); the three OCI specs; interoperability;
    CRI and dockershim removal; the Linux namespaces; cgroups (v1 vs v2); capabilities; gVisor and Kata; rootless
    containers.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: F
    seam_strength: STRONG
    seam: 'The finale closes the arc the domain opened: topic 1 said a container is just a process, and topic 16
      has now shown the exact syscalls that make it one, which is where APPROX-1 is paid off. Hand off to real targets
      that consume these primitives rather than teach them: kubernetes/architecture-control-plane (CRI, containerd),
      kubernetes/pods-workload-controllers (the pod''s shared namespaces), kubernetes/probes-resources (HEALTHCHECK
      becomes three separate probes) and devops-cicd for the build side. Leave one genuinely unsolved question:
      the kernel is still shared, so gVisor and Kata buy isolation with a syscall-cost nobody has published a general
      answer for. No congratulation.'
    payoff_anchor: none
    key_noun: none
    verified_present: null
canonical_terms:
  layer:
    canonical: layer
    defined_in: images-vs-containers
    gloss: a read-only set of filesystem changes — files added, changed or deleted — stored as one tar blob and
      named by the digest of its bytes
    banned_variants:
    - filesystem layer
    - diff layer
    note: '''image layer(s)'' is NOT banned: 28 prose lines across 12 of 16 files, and it does real work distinguishing
      the read-only layers from the writable one. ''filesystem layer(s)'' is the real inconsistency — 4 lines in
      2 files: images-vs-containers''s one-line answer (line 5) and dockerfile-layers-build-cache lines 24, 79 and
      105, the last of which uses both spellings in one sentence. ''slice'' — which the standard''s own illustrative
      ledger bans for `layer` — was TRIED and REMOVED: on this corpus it matches only ordinary English (multi-stage-builds
      line 534 ''the prod-only slice'', docker-security line 191 ''that slice of root power''), i.e. it is the over-enforcement
      K2 warns about.'
  writable layer:
    canonical: writable layer
    defined_in: images-vs-containers
    gloss: the single thin read-write layer the runtime stacks on top of a container's image layers; created with
      the container and deleted with it
    banned_variants:
    - container layer
    - read-write layer
    - scratch layer
    note: '''writable layer'' 61 prose lines / 8 files vs ''container layer'' 9 lines / 4 files, and volumes-and-storage
      line 25 declares all three spellings as synonyms in one sentence — exactly the line K2 exists to remove. See
      known_defects: one frozen H2 carries the banned variant and cannot be renamed.'
  copy-on-write:
    canonical: copy-on-write
    defined_in: images-vs-containers
    gloss: reads come straight from the shared lower layer; the first write to a file copies the whole file up into
      the writable layer and writes there
    banned_variants: []
    note: '''CoW'' is legal AFTER this teaching site coins it (14 uses across 5 files); it is an abbreviation, not
      a variant. Not banned.'
  copy_up:
    canonical: copy_up
    defined_in: images-vs-containers
    gloss: the overlayfs operation that copies an entire file from a lower layer into the writable layer on its
      first modification, however small the change
    banned_variants:
    - copy-up
    - copied up
    note: Used at topic 1 (line 155, 'entire file copied up') and topic 6 (line 72, 'a full copy-up') but only NAMED
      at topic 15. Canonicalised here at first use; the debt that creates for topic 15's frozen H2 is in owed[].
  digest:
    canonical: digest
    defined_in: images-vs-containers
    gloss: the SHA-256 hash of a blob's or manifest's exact bytes, which therefore names that content uniquely and
      cannot be moved
    banned_variants:
    - content hash
    - image hash
    - layer hash
    note: '''checksum'' is deliberately NOT banned: in dockerfile-layers-build-cache and buildkit-advanced-builds
      it means a cache key computed over context files, which is a different object from an image digest. Erasing
      that is the over-enforcement K2 warns about.'
  image index:
    canonical: image index
    defined_in: images-vs-containers
    gloss: one manifest that lists per-platform manifests, so a single tag resolves to the right architecture; the
      OCI name for what Docker calls a manifest list
    banned_variants: []
    note: 'K2''s declare-once-then-commit case. Both spellings are frozen into H2s in OPPOSITE directions — registries-and-distribution
      has ''Multi-arch images and manifest lists'' and image-internals-storage-drivers has ''Multi-arch images:
      the image index (manifest list)'' — so banning either produces a permanent unsilenceable warning. The declaration
      is made once, at images-vs-containers line 245, and prose commits to ''image index'' after it.'
  PID 1:
    canonical: PID 1
    defined_in: images-vs-containers
    gloss: the process the runtime starts as process 1 inside the container's PID namespace; the container lives
      exactly as long as it runs and exits with its code
    banned_variants:
    - main process
    note: '''main process'' on 12 prose lines across 5 files. Banned because in this domain the two are NOT synonyms
      exactly where it matters: under shell form /bin/sh is PID 1 and the app is its child. Where they genuinely
      differ, name both (''PID 1, the shell, and its child, your app'') rather than reaching for the vague one.'
  health check:
    canonical: health check
    defined_in: production-healthchecks-logging
    gloss: a command the engine runs inside the container on a schedule, whose exit status moves the container between
      starting, healthy and unhealthy
    banned_variants:
    - healthcheck
    - health probe
    note: Two words for the concept. `HEALTHCHECK` (Dockerfile instruction) and `healthcheck:` (Compose key) are
      identifiers and stay in backticks, where prose_lines strips them. docker-compose currently uses bare 'healthcheck'
      for the concept 6 times in prose. See known_defects for the case-insensitivity collision.
  exec form:
    canonical: exec form
    defined_in: entrypoint-vs-cmd
    gloss: the JSON-array spelling of CMD or ENTRYPOINT, which execs your binary directly as PID 1 with no shell
      in between
    banned_variants:
    - array form
    - vector form
    note: production-healthchecks-logging says 'JSON array form' and 'array form'; multi-stage-builds says 'exec
      (vector) form'. One name.
  shell form:
    canonical: shell form
    defined_in: entrypoint-vs-cmd
    gloss: the bare-string spelling of CMD or ENTRYPOINT, which the builder wraps in /bin/sh -c, making the shell
      PID 1
    banned_variants:
    - string form
  grace period:
    canonical: grace period
    defined_in: container-lifecycle
    gloss: the interval `docker stop` gives PID 1 after SIGTERM before it resorts to SIGKILL; 10 seconds by default
      on Linux, 30 on Windows
    banned_variants: []
    note: '`stop grace period` and `stop timeout` stay legal as spelled-out identifiers (`stop_grace_period`, `--stop-timeout`,
      `docker stop -t`). Prose says grace period. The term is bolded once, in `#stopping-sigterm-the-grace-period-then-sigkill`;
      the file opener names it unbolded to pay K1.'
  build context:
    canonical: build context
    defined_in: dockerfile-layers-build-cache
    gloss: the directory tree the client sends to the builder before the first instruction runs; .dockerignore is
      what keeps it small
    banned_variants:
    - context directory
  container name:
    canonical: container name
    defined_in: docker-networking
    gloss: the name the engine's embedded DNS resolver at 127.0.0.11 answers for, on a user-defined network only
    banned_variants: []
    note: Teaching site is now live, in H2 'Default bridge vs user-defined bridge'. The line-270 'service/container
      name' collapse is FIXED — H2 'localhost inside a container is not the host' says 'container name' only, and
      'service name' appears in this file solely inside H2 'Compose networks', used and never defined, so docker-compose
      keeps the teaching site. The Pass 0 `note` about the collapse can be dropped when this merges.
  service name:
    canonical: service name
    defined_in: docker-compose
    gloss: 'the key under services: in compose.yaml, which Compose installs as a network alias so it resolves like
      a container name'
    banned_variants: []
  named volume:
    canonical: named volume
    defined_in: volumes-and-storage
    gloss: storage the engine creates and owns under /var/lib/docker/volumes, referenced by name and independent
      of any container's life
    banned_variants:
    - managed volume
  bind mount:
    canonical: bind mount
    defined_in: volumes-and-storage
    gloss: a host path mapped straight into the container, so the host's own directory contents and permissions
      are what the container sees
    banned_variants: []
    note: '''host mount'' was tried as a banned variant and removed: its only occurrence in the domain is volumes-and-storage
      line 517, inside a CIS Benchmark citation title (''storage & host mount hardening''). Banning a word that
      appears once, in a source''s own title, is over-enforcement.'
  storage driver:
    canonical: storage driver
    defined_in: image-internals-storage-drivers
    gloss: the component that stacks read-only layers plus one writable layer into the single root filesystem a
      container sees; overlay2 by default
    banned_variants: []
    note: '''graph driver'' is NOT banned — it is the legacy name and image-internals-storage-drivers contrasts
      the two under its own frozen H2 ''Graph drivers vs containerd snapshotters''. Declare the synonym once there.'
  cgroup:
    canonical: cgroup
    defined_in: images-vs-containers
    gloss: the kernel feature that caps and accounts what a group of processes may consume — memory, CPU, PIDs,
      IO
    banned_variants: []
    note: 'MEASURED, not assumed: ''control group(s)'' occurs exactly ONCE in the domain, at runtimes-oci-standards
      line 263 (''**control groups (cgroups)** control resource consumption''), which is a legitimate coining gloss.
      There is no inconsistency to ban. Recorded here only so K3 knows cgroup is established at topic 1 and later
      topics reference rather than re-expand it. (An earlier draft of this ledger claimed three independent expansions;
      that came from a scanning harness that joined lines and matched ''control'' + ''group'' across a newline.
      Corrected against a line-based count.)'
  namespace:
    canonical: namespace
    defined_in: images-vs-containers
    gloss: a per-container private view of one kind of kernel resource — its own PID numbers, mounts, network interfaces,
      hostname, users
    banned_variants: []
  restart policy:
    canonical: restart policy
    defined_in: container-lifecycle
    gloss: a standing instruction on the container that automates the `exited → running` edge, so a crash or a host
      reboot brings it back with no external supervisor
    banned_variants: []
    note: Compose's `restart:` key and Kubernetes' pod `restartPolicy` are named as spellings of the same idea at
      a different layer, not as variants to canonicalise.
  exit code:
    canonical: exit code
    defined_in: container-lifecycle
    gloss: PID 1's exit status, handed up unchanged as the container's, with signal deaths encoded as 128 + N
    banned_variants: []
    note: 'Bounded in its own file: 125, 126 and 127 are reported for a container in which no program of yours ever
      ran, so for those three the gloss''s "PID 1''s exit status" does not hold. Any later topic quoting the rule
      should quote the boundary with it.'
  zombie:
    canonical: zombie
    defined_in: container-lifecycle
    gloss: a process that has finished but whose exit status no parent has collected yet, so it occupies a process-table
      slot and nothing else
    banned_variants: []
    note: The verb is "reap". `<defunct>` is the `ps` rendering, not a second name.
  freezer cgroup:
    canonical: freezer cgroup
    defined_in: container-lifecycle
    gloss: the kernel control that suspends every task in a cgroup without terminating any of them, which is what
      `docker pause` uses
    banned_variants: []
    note: Under cgroup v2 the interface file is `cgroup.freeze`. The file does not name it, because the wording
      could not be verified this pass — see owed[] below.
  OOM killer:
    canonical: OOM killer
    defined_in: container-lifecycle
    gloss: the kernel routine that frees memory by terminating a process outright, choosing the highest `oom_score`
      in the cgroup rather than PID 1
    banned_variants: []
    note: 'Two spellings coexist in the corpus: prose says "OOM killer", and `OOMKilled` / `memory.oom.group` are
      identifiers. Not variants.'
  build_context:
    canonical: build context
    defined_in: dockerfile-layers-build-cache
    gloss: The directory tree the client sends to the builder before the first instruction runs, and the only files
      COPY and ADD may read; .dockerignore is what keeps it small.
    banned_variants:
    - context directory
  image_config:
    canonical: image config
    defined_in: dockerfile-layers-build-cache
    gloss: The JSON document shipped alongside an image's layers, holding the settings for starting a container
      (default command, env, working directory, exposed ports, user) plus the ordered layer list and a history array
      recording the build steps in order.
    banned_variants:
    - image manifest config
    - config blob
  cache_hit:
    canonical: cache hit
    defined_in: dockerfile-layers-build-cache
    gloss: The builder found a layer it built earlier from the same parent layer, the same instruction text and
      the same inputs, so it reuses that layer and executes nothing.
    banned_variants:
    - cache reuse
  cache_miss:
    canonical: cache miss
    defined_in: dockerfile-layers-build-cache
    gloss: Any one of parent layer, instruction text or inputs differs, so the instruction runs and produces a new
      layer — which makes every instruction below it a miss too.
    banned_variants:
    - cache invalidation event
  checksum:
    canonical: checksum
    defined_in: dockerfile-layers-build-cache
    gloss: 'The hash a COPY or ADD is keyed on, computed over the files it would copy — their contents and their
      file metadata, but not their modification time. A different object from an image layer''s digest: this one
      is over files in your working tree.'
    banned_variants:
    - content hash of the context
  cache_mount:
    canonical: cache mount
    defined_in: dockerfile-layers-build-cache
    gloss: A directory attached with RUN --mount=type=cache that persists between builds, is visible only to that
      one command, and never becomes part of the image.
    banned_variants:
    - build cache directory
    - persistent mount
  entrypoint script:
    canonical: entrypoint script
    defined_in: entrypoint-vs-cmd
    gloss: a script named by ENTRYPOINT that does the container's one-time setup and then runs whatever command
      it was handed, normally with `exec "$@"` as its last line
    banned_variants:
    - wrapper script
    note: The file it lives in is conventionally `docker-entrypoint.sh`; that is a filename, not a second name for
      the concept, and stays in backticks.
  init process:
    canonical: init process
    defined_in: entrypoint-vs-cmd
    gloss: the program a Unix system expects at PID 1, whose two jobs are forwarding signals to its children and
      reaping orphans so their process entries do not accumulate
    banned_variants:
    - pid 1 process
    note: '`--init`, `docker-init` and `tini` are identifiers for particular implementations and stay in backticks.
      Do NOT ban "init system" or "init container" — systemd and the Kubernetes object are different things and
      erasing the distinction is also a failure.'
  multi-stage build:
    canonical: multi-stage build
    defined_in: multi-stage-builds-image-optimization
    gloss: a Dockerfile with several `FROM` instructions, of which only the last becomes the published image
    banned_variants:
    - multistage build
    - multi-step build
    - two-stage build
  stage:
    canonical: stage
    defined_in: multi-stage-builds-image-optimization
    gloss: 'everything one `FROM` starts: a fresh filesystem seeded from that line''s base image, sharing nothing
      with the stage above it except what a `COPY --from` moves'
    banned_variants:
    - intermediate image
    - sub-build
    note: '`build step` was listed as a banned variant and is NOT one: a build step is one Dockerfile instruction
      (one `docker history` row), while a stage is everything one FROM starts, and a stage contains many steps.
      Enforcing it would have made dockerfile-layers-build-cache''s `history` explanation false at its line 145
      (''the rows are not layers; they are build steps''). Removed after continuity_check flagged two already-rewritten
      topics. K2''s own rule says not to over-enforce where there is a real distinction.'
  distroless:
    canonical: distroless
    defined_in: multi-stage-builds-image-optimization
    gloss: an image holding an application and its runtime libraries and nothing else — no shell, no package manager,
      none of the rest of a Linux userland
    banned_variants:
    - distro-less
    - shell-less image
  scratch:
    canonical: scratch
    defined_in: multi-stage-builds-image-optimization
    gloss: 'the empty base image: zero bytes and no files, so `FROM scratch` hands the next instruction an empty
      filesystem'
    banned_variants:
    - empty base
    - null image
    - blank image
  build-time dependency:
    canonical: build-time dependency
    defined_in: multi-stage-builds-image-optimization
    gloss: anything needed to produce the artifact but never called after the process starts, so it belongs in the
      builder stage only
    banned_variants:
    - build dep
    - compile-time package
  runtime dependency:
    canonical: runtime dependency
    defined_in: multi-stage-builds-image-optimization
    gloss: anything the running process calls or loads — the artifact, the interpreter or JRE, the shared libraries
      it links, config, CA certificates — so it must be in the final stage
    banned_variants:
    - prod dep
    - run dep
  network namespace:
    canonical: network namespace
    defined_in: docker-networking
    gloss: an independent instance of everything the kernel knows about networking — interfaces, addresses, routing
      and ARP tables, /proc/net, the port space, iptables rules — attached to a set of processes rather than to
      the machine
    banned_variants:
    - netns
    note: 'Specialises `namespace`, which images-vs-containers owns and which this file does not re-derive. The
      seam ''### What the namespace leaves alone: the other seven kinds'' is the K3 back-reference: it names all
      eight kinds and states that --network host moves only this one. TWO EXCEPTIONS, both deliberate. (1) `netns`
      appears twice inside the byte-identical mermaid diagram carried from the base ("Container A netns", "Container
      B netns"); it is grandfathered because the diagram is reproduced unchanged, and the label is glossed by the
      prose beside it. (2) `sandbox` is NOT a banned variant of this term. It is the engine''s own name for a container''s
      whole networking setup (namespace plus the interfaces, addresses and rules inside it), which is why Docker''s
      source calls 127.0.0.11 `resolverIPSandbox`. The file glosses it at first use under ''### How 127.0.0.11 can
      be a loopback address and a server at once'' and keeps it distinct from the namespace itself; do not collapse
      the two.'
  source NAT:
    canonical: source NAT
    defined_in: docker-networking
    gloss: the host substituting its own address for the container's on the way out, and undoing the substitution
      on the replies; also called masquerading
    banned_variants:
    - IP masquerade
    - NAT-ing
  network alias:
    canonical: network alias
    defined_in: docker-networking
    gloss: an extra name for the same container on one network, set with --network-alias at run time or --alias
      when attaching; several containers may share one, so a lookup returns several addresses
    banned_variants:
    - DNS alias
    - service alias
  veth pair:
    canonical: veth pair
    defined_in: docker-networking
    gloss: two virtual network cards created together and permanently connected, so a frame pushed into one comes
      out of the other; one end moves into the container's namespace as eth0
    banned_variants:
    - virtual ethernet cable
    - veth link
  virtual IP:
    canonical: virtual IP
    defined_in: docker-networking
    gloss: an address a swarm owns that belongs to no container; a service name resolves to it and the swarm forwards
      each connection to one of the service's tasks
    banned_variants:
    - VIP address
    - service IP
assumed_prior_knowledge:
- 'a Unix process: a PID, a parent, fork+exec, its own environment and working directory'
- a signal is a number delivered to a process, and a process may install a handler for it
- a process ends with a small integer exit status, and 0 conventionally means success
- a filesystem is a tree of paths with owners and permission bits, and a directory can have another filesystem mounted
  onto it
- file descriptors, and that stdin/stdout/stderr are fds 0/1/2
- 'shell usage: running a command with arguments, quoting, pipes, redirection, `$VAR`'
- 'TCP: a server binds a port and a client connects to host:port; localhost is the loopback'
- an HTTP request gets a response with a status code and headers
- a Linux distribution has a package manager, at usage level only (`apt`, `apk`, `yum`)
- 'a cryptographic hash is a fixed-length digest over bytes: different bytes, different digest'
- a signature is made with a private key and checked with the matching public key
- git at the level of a repository with commits and branches
- YAML and JSON syntax, including YAML block scalars
- CPU is measured in cores and memory in bytes, and there is a kernel/user-space split
- a build turns source into an artifact, and CI runs that build on a fresh machine when code lands
- DNS resolves a name to an IP address
running_example:
  name: the 1.2 GB Node API
  established_in: dockerfile-layers-build-cache
  state: 'An Express-style API on `node:20-alpine`. Wrong ordering — COPY . . above RUN npm ci — re-runs the install
    on every code change: 8 minutes instead of 2 seconds (dockerfile-layers-build-cache lines 11, 220-239). An unignored
    context transfers 1.83 GB (line 128). Built fat it is 1.2 GB against 80 MB done right (line 12). multi-stage-builds-image-optimization
    itemises the fat build as 580 MB — 75 MB node:20 base + 120 MB apt build-essential + 45 MB COPY . . + 300 MB
    npm install with devDeps + 40 MB npm run build (lines 519-545) — and targets 20 MB, with the pull dropping from
    ~10 s to 0.2 s and egress from $180/day to $3.60/day at 200 nodes x 10 deploys x $0.09/GB (lines 41-51). Every
    one of those figures is load-bearing arithmetic: re-derive, never restate from memory. Topic 3 is the establishing
    site and confirms every figure against its own prose: 8 min vs 2 s for the wrong COPY order, 1.83 GB unignored
    context, 1.2 GB fat vs 80 MB done right, and a 500 MB file deleted two lines later still shipping. Topic 4 reuses
    it and adds no figures. Its startup line is the spine of the PID 1 material. `CMD ["node", "server.js"]` puts
    node at PID 1, `CMD npm start` puts npm there with `server.js` below it, and `CMD node server.js | tee -a /var/log/app.log`
    is the case where `/bin/sh` provably stays. No size arithmetic is restated. Topic 5 re-derived the whole breakdown
    by hand: 75 + 120 + 45 + 300 + 40 = 580 MB. It now says out loud that the trace is a teaching simplification
    — the 75 MB bottom row is one rounded line standing in for `node:20`''s own layer stack, which is nearer a gigabyte
    unpacked — so what the Dockerfile itself added is 120 + 45 + 300 + 40 = 505 MB and the published image is the
    base plus that, which is how a single-stage build of a small service lands over a gigabyte. It also prices the
    fat image at 200 nodes × 10 deploys/day: 2,000 GB/day and about $5,400/month at $0.09/GB, against 40 GB/day
    and about $108/month for a 20 MB image, with pulls of 10 s and 0.2 s at an assumed 100 MB/s — and it says those
    are unpacked-byte ceilings, because a pull transfers the compressed form. The layer-reuse illustration deliberately
    uses a fresh 700 MB / 8 MB pair so it cannot be confused with the 900 MB → 12 MB multi-stage figures. Topic
    6 adds the API''s runtime storage without touching any image arithmetic: its uploads directory is named as a
    volume candidate, and its `./src` tree is the bind-mount example (`--mount type=bind,src="$(pwd)"/src,dst=/app/src`,
    `node:20 npm run dev`). Its `node_modules` tree is the named instance of the Docker Desktop file-sharing cost,
    as a directory of tens of thousands of small files. No number from topic 5''s itemisation was changed or extended.
    docker-networking reuses it with no new arithmetic: the API runs as the container `api` from image `node-api`
    beside `db` on `postgres:16`, reached as `db:5432` over a user-defined bridge named `appnet`, and as `http://api:3000`
    from a browser-facing peer. The frontend/backend example adds `proxy` on `nginx` with the only published port.
    No image-size figure is touched and `node:20` is not retagged. docker-compose reuses api + db (image postgres:16,
    reached as db:5432) and adds proxy/frontend/backend network segmentation, myorg/api tags and a redis:7 cache;
    no image-size arithmetic introduced. Topic 10 reused the Node API for the HEALTHCHECK Dockerfile (node:20-alpine,
    port 3000, /healthz, CMD ["node","server.js"]) and the SIGTERM drain snippet; no image sizes or exit codes were
    introduced, per the seam constraint. image-scanning-supply-chain reused it with no new arithmetic and did not
    retag node:20: `FROM node:20` / `node:20-slim` is the CVE-laden base being scanned and pinned, and `myorg/api:1.4.2`
    is the artifact scanned, signed and pinned by digest. The Debian 12.5 scan table (CVE-2024-6119 libssl3 etc.)
    and the distroless Go multi-stage Dockerfile are labelled illustrative and introduce no size figures; no number
    from topic 5''s itemisation was touched.'
claims_established:
- 'IMAGE AND LAYER MODEL (topics 1, 3, 5). An image is read-only layers plus an image config; a container is that
  stack plus one thin writable layer plus a host process with runtime state. Layers are immutable content-addressed
  blobs, so identical layers are stored, transferred and read once across containers, images and pulls. Reads from
  a lower layer are free; the first write to such a file copies the whole file up, metadata-only changes included;
  deletes become whiteouts. Therefore no later instruction can shrink an earlier one: a delete during a build writes
  a whiteout that ships forever while the hidden bytes keep full size in the layer below, and multi-stage is the
  reliable fix. A tag is a movable label and a digest is not; the image ID is the config''s digest while `@sha256:`
  addresses the manifest, and a tag usually names an image index. A pull fetches that small JSON document, compares
  each layer digest against blobs the node already holds and downloads only the misses - it never reads names or
  tags - so deploy speed tracks the delta a node lacks, a shared base dedupes fleet-wide, a one-byte layer change
  re-downloads all of it, and `--squash` yields one unmatchable blob while its base layers still share.'
- 'CONTAINER LIFECYCLE (topics 1, 2). A container is a host process in namespaces under cgroups over a union rootfs,
  with no kernel container object, and it lives exactly as long as PID 1. It is in exactly one state at a time and
  there is no `stopped` status - a container you stopped and one that exited on its own both report `exited`. `docker
  run` is `create` plus `start`: `create` builds the writable layer and freezes ports, env and command, so only
  `rm` plus a fresh `run` changes those, while resource limits and the restart policy change live via `docker update`.
  Stopping waits for one event rather than running a timer - SIGTERM to PID 1, then SIGKILL if and only if PID 1
  is still alive when the grace period expires - so an idle container that ignores SIGTERM costs the full 10 seconds
  exactly as a busy one does.'
- 'PID 1 AND SIGNALS (topics 2, 4). Two rules combine to discard a signal at PID 1: `sh -c` installs no SIGTERM
  handler, and Linux exempts PID 1 from the default action of any signal it has not handled. That exemption does
  NOT cover SIGKILL or SIGSTOP from an ancestor PID namespace, which is where the runtime sits - hence `docker stop`''s
  second stage always works while `kill -9 1` from inside does nothing. PID 1 also inherits re-parented orphans,
  so a forking app accumulates zombies; `--init` fixes delivery and reaping, never a missing handler. Shell form
  does not decide who is PID 1 - the shell does: a shell invoked with `-c` execs the LAST command of its string
  in place (dash and busybox `ash` even for `&&` and `;`, bash from version 5), so your app can end up at PID 1
  after all. Nothing hands over for a pipeline, a string installing a trap, or a command written after your app;
  a trailing `&` is worse because PID 1 exits at once and the container stops. No shell documents any of it, so
  it is never a design basis.'
- ARGUMENT PASSING (topic 4). `docker run` arguments replace CMD outright and are appended to ENTRYPOINT; the final
  command line is ENTRYPOINT elements plus either the run arguments or CMD, never both. Exec form (JSON array) executes
  your list directly; shell form (bare string) is recorded as `/bin/sh -c "<string>"`, and the wrapping happens
  per instruction before the two are combined - which is why an exec ENTRYPOINT with a shell CMD puts a literal
  `/bin/sh -c` into the argument vector. A shell-form ENTRYPOINT discards CMD and every run argument, because the
  recorded entrypoint is the three-element list `/bin/sh`, `-c`, `<whole string>` and words appended after a `sh
  -c` string are positional parameters for the shell, not arguments to the command inside it. `--entrypoint` takes
  one binary, never a command line and never `sh -c`, and clears the image's CMD unconditionally; `--entrypoint=""`
  removes the entrypoint entirely. Compose keeps the Dockerfile names while Kubernetes inverts them, so `command:`
  is ENTRYPOINT and `args:` is CMD.
- 'BUILD, CACHE AND MINIMAL BASES (topics 3, 5). Only RUN, COPY and ADD add layers; FROM contributes the base image''s
  layers; every other instruction writes a config field and adds no bytes. A cache key is parent layer + instruction
  text + inputs - RUN on its command string alone (a bind-mounting RUN excepted), COPY/ADD on a checksum over the
  copied files with mtime excluded - and a miss re-runs every instruction below it. The build context transfers
  before the first instruction runs, so a cold build ships the whole tree while a warm builder loads files on demand;
  `.dockerignore` is the lever on both. A cache mount survives across builds and never enters the image: the layer
  cache decides whether an instruction runs, a cache mount how much work it does when it does. ARG is build-time
  only and visible in `docker history` (predefined proxy args excepted); ENV persists into the config and overrides
  a same-named ARG; neither holds secrets. A moved tag silently changes base layers and busts the cache below FROM;
  a digest pin fixes bytes and never receives patches. Only the last stage is published and nothing crosses a FROM
  except what a `COPY --from` names - not WORKDIR, ENV, packages or user - while the cache is tracked per stage,
  so an untouched builder stage is still a hit; `--from` also accepts an image reference. BuildKit SKIPS a stage
  nothing copies from or builds FROM, so a `test` stage gates nothing unless CI runs `--target test` or a `COPY
  --from=test` makes the dependency real (the legacy builder ran it by accident). Distroless has no `/bin/sh`, which
  removes four things at once: shell form, an entrypoint script (its shebang names a missing interpreter and `exec
  "$@"` is a shell builtin), `docker exec -it <c> sh`, and RUN in that stage - so every install, compile and permission
  fix happens earlier and arrives as a `COPY --from`. `:nonroot` runs as uid 65532 and resolves the name; `scratch`
  has no `/etc/passwd`, so only a numeric `--chown` works there, and on either base ownership cannot be corrected
  afterwards because `RUN chown` needs a shell. `scratch` is zero bytes, so each missing provision is one error:
  x509 unknown-authority means no CA bundle, `USER <name>` failing means no `/etc/passwd`, and "no such file or
  directory" on a binary plainly present means its ELF interpreter (`/lib64/ld-linux-x86-64.so.2` on x86-64 glibc)
  is absent - another way of saying the binary is not static.'
- 'RESOURCE LIMITS (topic 2). Limits are cgroup enforcement with two different teeth. `--memory` is a kill: the
  OOM killer takes the highest `oom_score` in the cgroup, so a multi-process container can lose a child and stay
  `up` while `OOMKilled` is already true, because the flag records a kill of any process in the cgroup. `--cpus`
  throttles, and `--cpu-shares` only breaks ties under contention.'
- VOLUMES AND STORAGE (topic 6). The writable layer is a per-container host directory, created at create and deleted
  at rm; a mount takes its paths OUT of the layer stack (resolution leaves the union fs at the mount point). A `copy_up`
  costs O(file size) regardless of bytes written, once per file per container, and cannot be undone — but the database
  hazard is conditioned on PRE-EXISTING data in a read-only layer, which is why the official postgres/mysql images
  with an empty data dir are fine. A named volume's lifecycle is independent of any container (only `docker volume
  rm`/`prune`/`prune -a` frees it — and prune's anonymous-only default arrived in Engine 23.0). An empty volume
  mounted over a populated image dir is seeded from it on FIRST mount only; a bind mount never seeds. Mounts carry
  numeric UID/GID, not names, so userns-remap or rootless shifts ownership. A read-only mount that a write hits
  fails `EROFS` (not `EACCES`).
- NETWORKING (topic 7). A container's network namespace is one of eight kinds (the time namespace is newest, since
  Linux 5.6). On one bridge, container traffic is forwarded by MAC (a bridge floods a broadcast unconditionally).
  The engine's DNS resolver listens on 127.0.0.11 on sockets opened inside the container's own netns; EXPOSE only
  writes the config's ExposedPorts (a default), while `-p` publishes. DNAT runs in nat/PREROUTING so the routing
  decision sees the container IP; a DOCKER-USER published-port match must use conntrack `--ctorigdstport` because
  packets there are already DNAT-ed; Engine 28 blocks packets aimed directly at a container IP on unpublished ports
  via a raw-table PREROUTING rule a DOCKER-USER rule cannot re-permit. docker-proxy exists for loopback (RFC 1122).
  Overlay wraps frames in UDP:4789, costing 50 bytes over IPv4 (20 IP + 8 UDP + 8 VXLAN + 14 inner Ethernet → 1464-byte
  inner frame on a 1500 path); swarm managers hold addressing under Raft with a quorum of (N/2)+1. No packet-filter
  rules are written for macvlan/ipvlan/host.
- 'COMPOSE (topic 8). Compose runs a multi-container app declaratively on ONE host as a single project, reconciling
  only the containers that changed. Services resolve each other by service name over a shared network via the embedded
  DNS (127.0.0.11); localhost inside a container is the container itself. `depends_on` gives start ORDER, not readiness
  — `condition: service_healthy` needs a health check, and app-level connection retries are the real fix. It stops
  at one host (no scheduler, self-healing or autoscaling); env-var precedence is CLI `--env` > interpolated `environment:`
  > `env_file` > image ENV, and a static `environment:` value beats the host shell.'
- 'REGISTRIES AND DISTRIBUTION (topic 9). A tag is a mutable pointer to a manifest digest; re-pushing moves it,
  so two hosts can pull different bytes — pinning `repo@sha256` (or immutable tags) fixes the bytes. Distribution
  moves content-addressed blobs: push HEAD-checks and skips blobs the registry holds, pull fetches only missing
  layers, and cross-repo blob mount (`?mount=&from=`) copies without re-upload. An image index maps platform → per-arch
  manifest; `docker pull` selects the host arch and legacy `docker build` is single-arch (wrong-arch → `exec format
  error`). Image ID = config-blob hash (local); RepoDigest = manifest hash, or the INDEX digest for a multi-arch
  tag. Post-download SHA-256 verification is a spec SHOULD that the Docker/containerd clients enforce. Untagging
  frees nothing; the registry''s mark-and-sweep GC reclaims unreferenced blobs, and deleting a shared blob corrupts
  the images that still reference it.'
- 'HEALTH CHECKS, LOGGING AND SHUTDOWN (topic 10). A health check is an engine-run command inside the container:
  exit 0 = healthy, any non-zero = a failed check (exit 2 reserved); Docker only REPORTS health — it never restarts
  on it (a restart policy reacts to the process exiting, not to health flipping). Detection latency ≈ interval ×
  retries, and the probe runs in the container netns so it targets localhost. `--start-interval` was added in Engine
  25.0. Containers log to stdout/stderr; `json-file` (default) never rotates → disk-fill, `local` rotates by default
  (20 MB × 5) in a compact daemon-only format; `docker logs` reads back only `json-file`/`local`/`journald`, and
  for a remote driver relies on the default dual-logging cache (auto-enabled since Engine 20.10) unless disabled.
  Blocking delivery back-pressures the app; `mode=non-blocking` drops instead. `docker stop` = SIGTERM → 10s grace
  → SIGKILL; exec form puts the app at PID 1 so SIGTERM lands, shell form swallows it; a deregistration-vs-SIGTERM
  race is what produces 502s during a deploy.'
- A container's exit code is PID 1's exit code, with signal deaths encoded as 128+N; but 125/126/127 are Docker
  daemon / OCI-runtime errors where no program of yours ever ran, so the "PID 1 exit status" framing does not hold
  for those three.
- 'Exit 137 (SIGKILL) splits by .State.OOMKilled: true = memory-limit kill by the kernel OOM-killer; false = SIGKILL
  after docker stop''s grace period (10s default on Linux) elapsed. 143 (SIGTERM) = the app caught the signal and
  exited cleanly — the observable topic 10 lacked.'
- docker logs reads only stdout/stderr captured by a local driver (json-file default, or local); remote drivers
  (syslog/gelf/awslogs/fluentd) return "does not support reading" and the logs live in the destination system.
- Debugging a shell-less/distroless container means joining its namespaces (--pid/--network container:<name>) and
  reading its filesystem via /proc/1/root — the same isolation-opening primitives docker-security prices as container-escape
  vectors.
- A container shares the host kernel with no hypervisor boundary, so its security equals shrinking what a compromised
  process may do; a kernel bug reachable inside is reachable on the host.
- Container UID 0 is host root unless user namespaces remap it; non-root USER (advisory), userns-remap, and rootless
  Docker each reduce that identity, and only run-time/orchestrator enforcement makes non-root binding.
- Hardening composes independent controls (cap-drop ALL, seccomp, LSM, read-only, no-new-privileges, resource limits)
  because each ends at the shared kernel; --privileged and a mounted docker.sock each defeat all of them and are
  equivalent to host root.
- A secret written into an image layer is permanent and ships on every pull (rm only adds a whiteout); BuildKit
  secret mounts and runtime secret stores keep secrets out of layers and ENV.
- gVisor (userspace second kernel) and Kata (per-container VM) are the only controls here that add a boundary surviving
  a host-kernel bug; everything else shares one kernel.
- 'A container image is a supply chain (base image + OS packages + language dependencies, all pulled remotely);
  scanning+SBOM answer "what known-vulnerable things are inside" and signing+digest-pinning answer "is this the
  exact image my pipeline built", and the two guarantees are orthogonal — neither implies the other.

  '
- 'Scanning is a static read of the image''s package DB and language manifests, matched against advisory feeds (NVD,
  plus distro feeds Red Hat OVAL / Alpine secdb / Amazon ALAS and the GitHub Advisory Database); it sees no zero-day,
  no logic bug, and no component that left no record — a statically linked C binary on scratch is invisible, though
  a Go binary''s embedded module info is still inventoried. Distro OVAL feeds also defeat the backported-fix false
  positive.

  '
- 'cosign signs the digest, never a mutable tag, storing the signature as a separate OCI image at a tag derived
  from the digest (sha256:<hex> -> sha256-<hex>.sig); keyless signing uses Fulcio (a 10-minute cert bound to an
  OIDC identity) + Rekor (append-only transparency log). A signature is worthless without deploy-time verification,
  which an admission controller enforces.

  '
- 'Digest pinning makes a base content-addressed and defeats tag hijack but never auto-updates, so it must be paired
  with an automated bump+rescan loop (Renovate/Dependabot); CI gates on CVSS severity (Critical/High = score >=
  7.0) with --ignore-unfixed and VEX as documented trade-offs, and continuous registry scanning re-checks already-published
  images against a fresh database.

  '
