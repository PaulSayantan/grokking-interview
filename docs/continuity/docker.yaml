domain: docker
schema: 1
pass: clarity-v1
reading_order_source: topics/docker/README.md
position: 3
plan:
- slug: images-vs-containers
  covers: Image vs container (class/instance); copy-on-write + thin writable layer; layer sharing across
    containers; image identity (repository/tag/digest, index digest); container vs VM; why containers
    are light; 'a container is just a process'; the union filesystem; docker run = create + start; ephemeral/disposable
    (12-factor).
  depends_on: none
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 1 closes on ephemeral/disposable — kill the container and recreate it, because the container
      IS its process and dies with it. Topic 2 exists because stopping is not a kill: docker stop sends
      SIGTERM, waits a 10s grace period, and only then SIGKILLs. Topic 1 already half-states the trap
      at its own line 489: shell form makes /bin/sh PID 1, so the signal reaches the shell and the app
      is killed with no graceful drain. The invariant ''disposable means free to throw away'' has a ten-second
      boundary.'
    payoff_anchor: concepts.md#stopping-sigterm-the-grace-period-then-sigkill
    key_noun: grace period
    verified_present: true
- slug: container-lifecycle
  covers: Container-as-a-process model; lifecycle state machine; run vs create vs start; -d/-it/TTY flags;
    stop = SIGTERM -> grace -> SIGKILL; exit codes; restart policies; pause/unpause; exec vs attach; ps/inspect/logs/stats;
    PID 1 signal handling and zombie reaping (tini/--init); runtime memory + CPU limits; rm and cleanup.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: E
    seam_strength: MODERATE
    seam: 'Runtime to build time is a genuine pivot, and the one mechanism that runs through both is layer
      deletion. Topic 2 ends on docker rm / docker system prune, which reclaims the container''s writable
      layer and nothing under it. Topic 3 answers why the reclaim is so small: a file deleted in a later
      image layer is only a whiteout marker, the bytes stay in the earlier layer, and no later instruction
      can shrink an earlier one. Pose the question on the shared mechanism (deleting inside a stack of
      layers), not on a manufactured dependency.'
    payoff_anchor: concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer
    key_noun: whiteout
    verified_present: true
- slug: dockerfile-layers-build-cache
  covers: Dockerfile -> image-layer model; which instructions make layers vs metadata; build context +
    .dockerignore; cache key and invalidation; least-to-most-changed ordering; COPY vs ADD; combining
    RUN; why a later delete does not shrink the image; BuildKit cache mounts for package managers; ARG
    vs ENV; FROM/scratch/tags/digests; docker history for size and cache diagnosis.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: Topic 3 hands over a correct, fast, small image and its last instruction is a CMD. Nothing in
      it says the FORM of that CMD decides who is PID 1. Write CMD npm start and /bin/sh is PID 1, sh
      does not forward SIGTERM to its child, and docker stop hangs the full 10 seconds before SIGKILL
      — with a correct image.
    payoff_anchor: concepts.md#the-pid-1--sigterm-problem-with-shell-form
    key_noun: PID 1
    verified_present: true
    note: The slug is `the-pid-1--sigterm-problem-with-shell-form` — DOUBLE hyphen, from `/` in the heading
      text. The single-hyphen spelling in SKILL.md's and docs/continuity/README.md's illustrative ledgers
      does not resolve.
- slug: entrypoint-vs-cmd
  covers: CMD as default command/args; ENTRYPOINT as the fixed executable; the two combined; exec form
    vs shell form; the PID 1 / SIGTERM failure of shell form; overriding both at run time; entrypoint
    scripts and exec "$@"; shell-form variable expansion; docker stop + STOPSIGNAL + init/tini; the ENTRYPOINT
    x CMD table.
  depends_on: container-lifecycle
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 4''s whole repair kit assumes a shell exists: exec form vs shell form as a choice, an
      ENTRYPOINT script that ends in exec "$@", tini as PID 1. Topic 5 tells you to ship distroless or
      scratch, which has no /bin/sh at all — so shell form cannot work, RUN is impossible in the final
      stage, and docker exec -it sh fails. The rule ''pick the form that suits you'' has a base-image
      boundary.'
    payoff_anchor: concepts.md#distroless-images
    key_noun: no shell
    verified_present: true
- slug: multi-stage-builds-image-optimization
  covers: What image size costs (egress $/day, cold start s); the fat-image anti-pattern; multi-stage
    builds; named stages and --target; COPY --from (stages and external images); build-time vs runtime
    deps; base-image ladder full/slim/alpine/ distroless/scratch; static binaries; layer + cache cleanup;
    .dockerignore; layer reuse across images; auditing size with docker history.
  depends_on: dockerfile-layers-build-cache
  seam_to_next:
    pattern: B
    seam_strength: MODERATE
    seam: Topic 5 optimises bytes that ship. Every number in it is an IMAGE number — 580 MB down to 20
      MB, 10 s of pull down to 0.2 s. Nothing in it prices the bytes a container writes after it starts,
      which land in the writable layer, cost a full-file copy_up on first write, and vanish on docker
      rm. The bill has units (disk, first-write latency, and the data itself) and topic 6 is where it
      arrives; do not reveal that the fix is a mount.
    payoff_anchor: concepts.md#the-ephemeral-writable-layer
    key_noun: writable layer
    verified_present: true
- slug: volumes-and-storage
  covers: The ephemeral writable layer; copy-on-write and why a DB must not use it; named volumes; bind
    mounts; tmpfs; choosing between them; volume lifecycle commands; -v vs --mount; anonymous vs named;
    first-mount copy from image content; read-only mounts; sharing volumes; UID/GID permissions; volume
    drivers (NFS/cloud); volumes in Compose; backup and restore.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: E
    seam_strength: WEAK
    seam: 'Storage to networking is the domain''s weakest join: neither topic needs the other. The one
      genuinely shared mechanism is that both are per-container kernel namespaces the host wires in from
      outside — a bind mount crosses the mount namespace, a published port crosses the network namespace.
      The usable question sits on topic 6''s ''Sharing volumes between containers'': a shared volume lets
      two containers exchange bytes at rest, and gives neither one any way to ADDRESS the other. Topic
      7 answers what a container is called. Do not dress this as a dependency.'
    payoff_anchor: concepts.md#the-embedded-dns-resolver
    key_noun: embedded DNS
    verified_present: true
- slug: docker-networking
  covers: Network namespaces as the isolation mechanism; bridge driver; default vs user-defined bridge
    (automatic DNS by container name); the embedded DNS resolver at 127.0.0.11; host and none drivers;
    -p publishing vs EXPOSE; container-to-container traffic; localhost inside a container; iptables/NAT
    under the hood; overlay (multi-host); macvlan/ipvlan; network CRUD; Compose networks.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 7''s payoff rule is that on a user-defined bridge containers reach each other by name,
      no IPs — and it already notes Compose creates that bridge per project so service names ''just work''.
      The boundary: the name resolves the moment the container is created, long before the process inside
      is listening. Topic 8 is where that becomes depends_on giving start ORDER and not readiness, which
      is why an API that starts first still dies on connection refused.'
    payoff_anchor: concepts.md#depends_on-ordering-not-readiness
    key_noun: readiness
    verified_present: true
- slug: docker-compose
  covers: 'What Compose is; Compose vs Dockerfile; compose.yaml structure; declaring a multi-container
    app; service discovery on the default project network; per-service networks; depends_on is ordering
    not readiness; healthchecks and condition: service_healthy; build vs image; ports vs expose; volumes;
    environment/env_file/.env substitution; scaling; profiles; override files and merging; dev vs prod;
    single-host limit.'
  depends_on: docker-networking
  seam_to_next:
    pattern: A
    seam_strength: MODERATE
    seam: 'Topic 8 sells one declarative file as the truth of the deployment. The boundary is inside that
      file: `image: myorg/api:1.4` is not an identity. Topic 9 shows the same tag resolving to different
      bytes on two machines because a push MOVES the pointer, which makes the checked-in Compose file
      reproducible in shape and not in content.'
    payoff_anchor: concepts.md#tags-are-mutable-pointers
    key_noun: pointer
    verified_present: true
- slug: registries-and-distribution
  covers: What a registry is; image-reference anatomy; tags as mutable pointers; the immutable digest;
    the latest foot-gun; auth (login, tokens, credential helpers); what travels (manifests, blobs, dedup);
    manifest + config; multi-arch image index; the OCI distribution spec; pull rate limits; promotion
    across registries; garbage collection.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: B
    seam_strength: WEAK
    seam: 'Distribution to production operations is a curricular join. The shared object is the deploy:
      topic 9 ends able to put exactly the right bytes on every host, pinned by digest, promoted between
      registries. Nothing in it touches what happens while the swap runs. Topic 10 opens on the 502s users
      see during a deploy that pulled a perfectly correct image. State the bill''s existence (a deploy
      replaces RUNNING containers) without naming health checks, SIGTERM or draining.'
    payoff_anchor: concepts.md#putting-it-together-anatomy-of-a-deploy-the-502-timeline
    key_noun: '502'
    verified_present: true
- slug: production-healthchecks-logging
  covers: Why orchestrators need health signals; HEALTHCHECK and its options/defaults; health states and
    transitions; healthcheck gotchas; vs k8s liveness/readiness/startup probes; stdout/stderr logging
    model; json-file driver + rotation (disk-fill); other log drivers and the docker logs / blocking-mode
    traps; graceful shutdown and the grace period; PID 1 signal forwarding; draining in-flight requests;
    the 502 deploy timeline.
  depends_on: entrypoint-vs-cmd
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 10 teaches the whole shutdown negotiation — trap SIGTERM, stop accepting, drain, exit
      inside the grace period — and never once says how you find out whether the app actually caught the
      signal (137 and 143 appear nowhere in the file, verified). Its rule ''handle SIGTERM and you shut
      down cleanly'' has no observable attached. Topic 11 supplies it: the exit code separates a clean
      SIGTERM death from a container that ignored it and was killed, or was never a shutdown problem at
      all.'
    payoff_anchor: concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends
    key_noun: '137'
    verified_present: true
- slug: debugging-troubleshooting
  covers: A container debugging methodology; docker logs; docker exec shells; docker inspect (config/state/mounts/networks/exit
    code); docker stats; why a container will not start or exits at once; exit codes 137/143/127/126 and
    exec format error; debugging distroless and shell-less images (docker debug, namespace-sharing sidecar,
    /proc/1/root); docker events; docker diff; common errors.
  depends_on: container-lifecycle
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Every escalation in topic 11 opens the isolation boundary on purpose: a fat toolbox image joined
      to the target''s PID and network namespaces, its filesystem read through /proc/1/root, and in CI
      a runner that reaches the daemon through a mounted socket. Topic 12''s escape table lists those
      same primitives as attack vectors — mounted docker.sock, --privileged, CAP_SYS_ADMIN. The rule ''to
      debug it, join it'' is indistinguishable from the attack, and topic 12 is where that is priced.'
    payoff_anchor: concepts.md#container-escape-threat-model
    key_noun: escape
    verified_present: true
- slug: docker-security
  covers: Container security threat model (shared kernel); non-root; rootless Docker; userns-remap; dropping
    capabilities; why --privileged is dangerous; read-only rootfs; seccomp; AppArmor/SELinux; no-new-privileges;
    keeping secrets out of layers; the Docker socket = root; the escape threat model; scanning (Docker
    angle); CIS benchmark.
  depends_on: runtimes-oci-standards
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Every control in topic 12 constrains what a container may DO once it is running, and all of
      them assume the image contains what you think it contains. A hijacked base image, or a transitive
      dependency published yesterday, is already inside the boundary before seccomp, capabilities or a
      read-only rootfs get a say. Topic 12 even defers this itself in its own ''Image scanning & supply
      chain (Docker angle)'' section. Topic 13 opens on exactly that: the image is a supply chain, not
      a file.'
    payoff_anchor: concepts.md#the-image-supply-chain-threat-model
    key_noun: base image
    verified_present: true
- slug: image-scanning-supply-chain
  covers: The image supply-chain threat model; what scanning finds (and its layers/ package sources);
    Trivy/Grype/Scout/Clair; base-image CVEs and minimal bases; rebuild cadence; SBOM; Docker Content
    Trust / Notary; cosign + Sigstore keyless; pinning bases by digest; CI/registry gating by severity;
    admission control; scanner accuracy and false positives.
  depends_on: registries-and-distribution
  seam_to_next:
    pattern: B
    seam_strength: STRONG
    seam: 'Topic 13 makes two demands and funds neither: attach an SBOM and provenance to every image,
      and never let a credential reach a layer. Both are build-time capabilities and the legacy builder
      has neither — it cannot emit an in-toto attestation and it has nowhere to put a secret except a
      layer. Topic 14 is the engine that pays. Give the bill''s existence, not its structure.'
    payoff_anchor: concepts.md#provenance--sbom-attestations
    key_noun: attestation
    verified_present: true
- slug: buildkit-advanced-builds
  covers: BuildKit vs the legacy builder; LLB as a build graph; enabling buildkit/buildx; RUN --mount=type=cache
    / bind / secret / ssh; heredocs; the syntax directive and frontends; multi-platform builds with buildx
    (QEMU vs native); registry cache --cache-to/--cache-from; provenance + SBOM attestations; buildx bake.
  depends_on: dockerfile-layers-build-cache
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 14 states three times that a multi-platform manifest must be pushed to a registry, because
      the classic image store cannot hold one locally, and that the way round it is to enable the containerd
      image store. It never says why a local store would care about a list of manifests. Topic 15 answers
      it: the classic store keys layers to a graph driver''s own chain IDs, while a containerd snapshotter
      keys them by content, and only the second can hold an index whose members it may never unpack.'
    payoff_anchor: concepts.md#graph-drivers-vs-containerd-snapshotters-the-modern-shift
    key_noun: containerd image store
    verified_present: true
- slug: image-internals-storage-drivers
  covers: Image = ordered layers + config + manifest; the manifest; the config and rootfs.diff_ids; content-addressable
    storage; diff_id vs digest (uncompressed vs stored blob); layers as changesets not snapshots; the
    union filesystem; copy-on-write and copy_up; whiteouts and opaque dirs; overlay2 and its /var/lib/docker
    layout; storage drivers compared; graph drivers vs snapshotters; dedup and layer order; the image
    index; the inspection toolbox.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: A
    seam_strength: STRONG
    seam: 'Topic 15 ends with the layers fully assembled: overlay2 has mounted lowerdirs and an upperdir
      into one merged directory under /var/lib/docker, and every byte the process will read is in place.
      Nothing is running. A root filesystem is not a container, and topic 15 never names what turns one
      into the other. Topic 16 does: an OCI bundle is that rootfs plus a config.json, and runc reads the
      config to make the kernel calls.'
    payoff_anchor: concepts.md#runc-and-the-oci-runtime-flow
    key_noun: OCI bundle
    verified_present: true
- slug: runtimes-oci-standards
  covers: The runtime stack CLI -> dockerd -> containerd -> shim -> runc; containerd as the high-level
    runtime; runc and the OCI runtime flow (bundle, config.json, create/start split); the three OCI specs;
    interoperability; CRI and dockershim removal; the Linux namespaces; cgroups (v1 vs v2); capabilities;
    gVisor and Kata; rootless containers.
  depends_on: images-vs-containers
  seam_to_next:
    pattern: F
    seam_strength: STRONG
    seam: 'The finale closes the arc the domain opened: topic 1 said a container is just a process, and
      topic 16 has now shown the exact syscalls that make it one, which is where APPROX-1 is paid off.
      Hand off to real targets that consume these primitives rather than teach them: kubernetes/architecture-control-plane
      (CRI, containerd), kubernetes/pods-workload-controllers (the pod''s shared namespaces), kubernetes/probes-resources
      (HEALTHCHECK becomes three separate probes) and devops-cicd for the build side. Leave one genuinely
      unsolved question: the kernel is still shared, so gVisor and Kata buy isolation with a syscall-cost
      nobody has published a general answer for. No congratulation.'
    payoff_anchor: none
    key_noun: none
    verified_present: null
canonical_terms:
  layer:
    canonical: layer
    defined_in: images-vs-containers
    gloss: a read-only set of filesystem changes — files added, changed or deleted — stored as one tar
      blob and named by the digest of its bytes
    banned_variants:
    - filesystem layer
    - diff layer
    note: '''image layer(s)'' is NOT banned: 28 prose lines across 12 of 16 files, and it does real work
      distinguishing the read-only layers from the writable one. ''filesystem layer(s)'' is the real inconsistency
      — 4 lines in 2 files: images-vs-containers''s one-line answer (line 5) and dockerfile-layers-build-cache
      lines 24, 79 and 105, the last of which uses both spellings in one sentence. ''slice'' — which the
      standard''s own illustrative ledger bans for `layer` — was TRIED and REMOVED: on this corpus it
      matches only ordinary English (multi-stage-builds line 534 ''the prod-only slice'', docker-security
      line 191 ''that slice of root power''), i.e. it is the over-enforcement K2 warns about.'
  writable layer:
    canonical: writable layer
    defined_in: images-vs-containers
    gloss: the single thin read-write layer the runtime stacks on top of a container's image layers; created
      with the container and deleted with it
    banned_variants:
    - container layer
    - read-write layer
    - scratch layer
    note: '''writable layer'' 61 prose lines / 8 files vs ''container layer'' 9 lines / 4 files, and volumes-and-storage
      line 25 declares all three spellings as synonyms in one sentence — exactly the line K2 exists to
      remove. See known_defects: one frozen H2 carries the banned variant and cannot be renamed.'
  copy-on-write:
    canonical: copy-on-write
    defined_in: images-vs-containers
    gloss: reads come straight from the shared lower layer; the first write to a file copies the whole
      file up into the writable layer and writes there
    banned_variants: []
    note: '''CoW'' is legal AFTER this teaching site coins it (14 uses across 5 files); it is an abbreviation,
      not a variant. Not banned.'
  copy_up:
    canonical: copy_up
    defined_in: images-vs-containers
    gloss: the overlayfs operation that copies an entire file from a lower layer into the writable layer
      on its first modification, however small the change
    banned_variants:
    - copy-up
    - copied up
    note: Used at topic 1 (line 155, 'entire file copied up') and topic 6 (line 72, 'a full copy-up')
      but only NAMED at topic 15. Canonicalised here at first use; the debt that creates for topic 15's
      frozen H2 is in owed[].
  digest:
    canonical: digest
    defined_in: images-vs-containers
    gloss: the SHA-256 hash of a blob's or manifest's exact bytes, which therefore names that content
      uniquely and cannot be moved
    banned_variants:
    - content hash
    - image hash
    - layer hash
    note: '''checksum'' is deliberately NOT banned: in dockerfile-layers-build-cache and buildkit-advanced-builds
      it means a cache key computed over context files, which is a different object from an image digest.
      Erasing that is the over-enforcement K2 warns about.'
  image index:
    canonical: image index
    defined_in: images-vs-containers
    gloss: one manifest that lists per-platform manifests, so a single tag resolves to the right architecture;
      the OCI name for what Docker calls a manifest list
    banned_variants: []
    note: 'K2''s declare-once-then-commit case. Both spellings are frozen into H2s in OPPOSITE directions
      — registries-and-distribution has ''Multi-arch images and manifest lists'' and image-internals-storage-drivers
      has ''Multi-arch images: the image index (manifest list)'' — so banning either produces a permanent
      unsilenceable warning. The declaration is made once, at images-vs-containers line 245, and prose
      commits to ''image index'' after it.'
  PID 1:
    canonical: PID 1
    defined_in: images-vs-containers
    gloss: the process the runtime starts as process 1 inside the container's PID namespace; the container
      lives exactly as long as it runs and exits with its code
    banned_variants:
    - main process
    note: '''main process'' on 12 prose lines across 5 files. Banned because in this domain the two are
      NOT synonyms exactly where it matters: under shell form /bin/sh is PID 1 and the app is its child.
      Where they genuinely differ, name both (''PID 1, the shell, and its child, your app'') rather than
      reaching for the vague one.'
  health check:
    canonical: health check
    defined_in: production-healthchecks-logging
    gloss: a command the engine runs inside the container on a schedule, whose exit status moves the container
      between starting, healthy and unhealthy
    banned_variants:
    - healthcheck
    - health probe
    note: Two words for the concept. `HEALTHCHECK` (Dockerfile instruction) and `healthcheck:` (Compose
      key) are identifiers and stay in backticks, where prose_lines strips them. docker-compose currently
      uses bare 'healthcheck' for the concept 6 times in prose. See known_defects for the case-insensitivity
      collision.
  exec form:
    canonical: exec form
    defined_in: entrypoint-vs-cmd
    gloss: the JSON-array spelling of CMD or ENTRYPOINT, which execs your binary directly as PID 1 with
      no shell in between
    banned_variants:
    - array form
    - vector form
    note: production-healthchecks-logging says 'JSON array form' and 'array form'; multi-stage-builds
      says 'exec (vector) form'. One name.
  shell form:
    canonical: shell form
    defined_in: entrypoint-vs-cmd
    gloss: the bare-string spelling of CMD or ENTRYPOINT, which the builder wraps in /bin/sh -c, making
      the shell PID 1
    banned_variants:
    - string form
  grace period:
    canonical: grace period
    defined_in: container-lifecycle
    gloss: the interval `docker stop` gives PID 1 after SIGTERM before it resorts to SIGKILL; 10 seconds
      by default on Linux, 30 on Windows
    banned_variants: []
    note: '`stop grace period` and `stop timeout` stay legal as spelled-out identifiers (`stop_grace_period`,
      `--stop-timeout`, `docker stop -t`). Prose says grace period. The term is bolded once, in `#stopping-sigterm-the-grace-period-then-sigkill`;
      the file opener names it unbolded to pay K1.'
  build context:
    canonical: build context
    defined_in: dockerfile-layers-build-cache
    gloss: the directory tree the client sends to the builder before the first instruction runs; .dockerignore
      is what keeps it small
    banned_variants:
    - context directory
  container name:
    canonical: container name
    defined_in: docker-networking
    gloss: the name the engine's embedded DNS resolver at 127.0.0.11 answers for, on a user-defined network
      only
    banned_variants: []
    note: Paired with 'service name' below. docker-networking currently mixes them and once writes 'service/container
      name' (line 270). They are different objects and must stay different; see owed[].
  service name:
    canonical: service name
    defined_in: docker-compose
    gloss: the key under `services:` in compose.yaml, which Compose installs as a network alias so it
      resolves like a container name
    banned_variants: []
  named volume:
    canonical: named volume
    defined_in: volumes-and-storage
    gloss: storage the engine creates and owns under /var/lib/docker/volumes, referenced by name and independent
      of any container's life
    banned_variants:
    - managed volume
  bind mount:
    canonical: bind mount
    defined_in: volumes-and-storage
    gloss: a host path mapped straight into the container, so the host's own directory contents and permissions
      are what the container sees
    banned_variants: []
    note: '''host mount'' was tried as a banned variant and removed: its only occurrence in the domain
      is volumes-and-storage line 517, inside a CIS Benchmark citation title (''storage & host mount hardening'').
      Banning a word that appears once, in a source''s own title, is over-enforcement.'
  storage driver:
    canonical: storage driver
    defined_in: image-internals-storage-drivers
    gloss: the component that stacks read-only layers plus one writable layer into the single root filesystem
      a container sees; overlay2 by default
    banned_variants: []
    note: '''graph driver'' is NOT banned — it is the legacy name and image-internals-storage-drivers
      contrasts the two under its own frozen H2 ''Graph drivers vs containerd snapshotters''. Declare
      the synonym once there.'
  cgroup:
    canonical: cgroup
    defined_in: images-vs-containers
    gloss: the kernel feature that caps and accounts what a group of processes may consume — memory, CPU,
      PIDs, IO
    banned_variants: []
    note: 'MEASURED, not assumed: ''control group(s)'' occurs exactly ONCE in the domain, at runtimes-oci-standards
      line 263 (''**control groups (cgroups)** control resource consumption''), which is a legitimate
      coining gloss. There is no inconsistency to ban. Recorded here only so K3 knows cgroup is established
      at topic 1 and later topics reference rather than re-expand it. (An earlier draft of this ledger
      claimed three independent expansions; that came from a scanning harness that joined lines and matched
      ''control'' + ''group'' across a newline. Corrected against a line-based count.)'
  namespace:
    canonical: namespace
    defined_in: images-vs-containers
    gloss: a per-container private view of one kind of kernel resource — its own PID numbers, mounts,
      network interfaces, hostname, users
    banned_variants: []
  restart policy:
    canonical: restart policy
    defined_in: container-lifecycle
    gloss: a standing instruction on the container that automates the `exited → running` edge, so a crash
      or a host reboot brings it back with no external supervisor
    banned_variants: []
    note: Compose's `restart:` key and Kubernetes' pod `restartPolicy` are named as spellings of the same
      idea at a different layer, not as variants to canonicalise.
  exit code:
    canonical: exit code
    defined_in: container-lifecycle
    gloss: PID 1's exit status, handed up unchanged as the container's, with signal deaths encoded as
      128 + N
    banned_variants: []
    note: 'Bounded in its own file: 125, 126 and 127 are reported for a container in which no program
      of yours ever ran, so for those three the gloss''s "PID 1''s exit status" does not hold. Any later
      topic quoting the rule should quote the boundary with it.'
  zombie:
    canonical: zombie
    defined_in: container-lifecycle
    gloss: a process that has finished but whose exit status no parent has collected yet, so it occupies
      a process-table slot and nothing else
    banned_variants: []
    note: The verb is "reap". `<defunct>` is the `ps` rendering, not a second name.
  freezer cgroup:
    canonical: freezer cgroup
    defined_in: container-lifecycle
    gloss: the kernel control that suspends every task in a cgroup without terminating any of them, which
      is what `docker pause` uses
    banned_variants: []
    note: Under cgroup v2 the interface file is `cgroup.freeze`. The file does not name it, because the
      wording could not be verified this pass — see owed[] below.
  OOM killer:
    canonical: OOM killer
    defined_in: container-lifecycle
    gloss: the kernel routine that frees memory by terminating a process outright, choosing the highest
      `oom_score` in the cgroup rather than PID 1
    banned_variants: []
    note: 'Two spellings coexist in the corpus: prose says "OOM killer", and `OOMKilled` / `memory.oom.group`
      are identifiers. Not variants.'
running_example:
  name: the 1.2 GB Node API
  established_in: dockerfile-layers-build-cache
  state: 'An Express-style API on `node:20-alpine`. Wrong ordering — COPY . . above RUN npm ci — re-runs
    the install on every code change: 8 minutes instead of 2 seconds (dockerfile-layers-build-cache lines
    11, 220-239). An unignored context transfers 1.83 GB (line 128). Built fat it is 1.2 GB against 80
    MB done right (line 12). multi-stage-builds-image-optimization itemises the fat build as 580 MB —
    75 MB node:20 base + 120 MB apt build-essential + 45 MB COPY . . + 300 MB npm install with devDeps
    + 40 MB npm run build (lines 519-545) — and targets 20 MB, with the pull dropping from ~10 s to 0.2
    s and egress from $180/day to $3.60/day at 200 nodes x 10 deploys x $0.09/GB (lines 41-51). Every
    one of those figures is load-bearing arithmetic: re-derive, never restate from memory.'
claims_established:
- An image is read-only layers plus an image config; a container is that stack plus one thin writable
  layer plus a host process with runtime state.
- Layers are content-addressed, so identical layers are stored, transferred and read once — across containers,
  across images, and across a pull.
- Reads from a lower layer are free; the first write to such a file copies the whole file up, metadata-only
  changes included; deletes become whiteouts.
- A tag is a movable label, a digest is not; the image ID is the config's digest while `@sha256:` addresses
  the manifest, and a tag usually names an image index.
- A container is a host process in namespaces under cgroups over a union rootfs, with no kernel container
  object; it lives exactly as long as PID 1.
- A container is in exactly one state at a time, and there is no `stopped` string — a container you stopped
  and one that finished on its own both report `exited`. The daemon's status vocabulary is `created`,
  `running`, `paused`, `restarting`, `removing`, `exited`, `dead` (Engine API `ContainerState.Status`,
  seven values).
- '`docker run` is `create` plus `start`: `create` builds the writable layer and freezes ports, env and
  the command; `start` re-runs the same container with that layer intact, so only `rm` plus a fresh `run`
  can change those, while resource limits and the restart policy can be changed live with `docker update`.'
- Stopping is a wait for one event, not a timer — SIGTERM to PID 1, then SIGKILL if and only if PID 1
  is still alive when the grace period expires, so an idle container that ignores SIGTERM costs the full
  10 seconds exactly as a busy one does.
- A process running as PID 1 gets no default signal action from the kernel and inherits re-parented orphans,
  so an app with no SIGTERM handler ignores the signal and an app that forks accumulates zombies; `--init`
  fixes delivery and reaping, never the missing handler.
- Limits are cgroup enforcement with two different teeth — `--memory` is a kill (the OOM killer takes
  the highest `oom_score` in the cgroup, so a multi-process container can lose a child and stay `up` while
  `OOMKilled` is already true, since the flag records a kill of any process in the cgroup), while `--cpus`
  throttles and `--cpu-shares` only breaks ties under contention.
