    DOCKER-FORWARD, DOCKER-BRIDGE, DOCKER-INTERNAL, DOCKER-CT, DOCKER-INGRESS) is sourced from the Docker-and-iptables
    page, but that page gives no per-chain semantics for inter-network isolation, so the seam under H2 'The bridge
