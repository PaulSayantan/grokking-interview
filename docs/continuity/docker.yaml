- file: topics/docker/production-healthchecks-logging/concepts.md
  rule: C9
  text: 'docker logs and remote drivers. This clarity pass hedged the carried claim to reflect default dual logging
    (auto-enabled since Docker Engine 20.10): for a remote driver Docker keeps a bounded local cache so `docker
    logs` can replay recent lines unless the cache is disabled. The fully de-hedged fact would contradict MCQ-018
