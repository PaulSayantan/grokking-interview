running_example:
  name: the eight-thread hit counter
  established_in: synchronized-volatile-jmm
  state: 'One shared `Metrics` object: a `volatile boolean stop` a ninth thread sets at shutdown, a counter eight request-handling
    threads increment on eight cores, and a neighbouring counter beside it. Fixed numbers, extend but never change: 8 threads,
    8 cores, 8,000,000 increments, the t1-t6 lost-update trace starting from `v == 5` and ending at 6 instead of 7, a 64-byte
    cache line, an 8-byte `long`, 7 pad longs (7 x 8 = 56 bytes) placing the second counter at offset 64. Used in Visibility
    (the hang), volatile (the lost update), synchronized (the fix), Atomic classes (the CAS retry and the LongAdder cells)
    and False sharing (the layout).'
