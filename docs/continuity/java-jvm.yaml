exemptions:
- file: synchronized-volatile-jmm
  rule: C9
  terms:
  - model
  reason: The topic's subject is the Java Memory Model, and it also has to name hardware memory models (x86 TSO, ARM/POWER).
    "Model" here is the technical noun, not a Pinker container word, and it cannot be find-and-replaced without renaming
    the specification.
- file: synchronized-volatile-jmm
  rule: K2
  terms:
  - cache flush
  reason: Not a synonym here. L57 lists 'a cache flush, a fence, or nothing' as three ALTERNATIVE implementations a JVM
    may choose for one happens-before edge — 'fence' appears in the same list, so replacing 'cache flush' with the canonical
    'memory barrier' would collapse two distinct items and destroy the sentence. The passage's whole point is that the JMM
    defines nothing in terms of caches, so naming the cache-flush implementation is required to say what the model does
    NOT commit to.
- file: synchronized-volatile-jmm
  rule: K2
  terms:
  - word
  reason: Different concept, not a variant of 'cache line'. Every hit is either the HotSpot object header's *mark word*
    (L25, L446-465 — a 64-bit field holding lock state) or JLS 17.7 *word tearing* (L135, L174). Neither denotes a unit
    of cache coherence; the file uses 'cache line' correctly and separately for that, with 'commonly 64 bytes'.
