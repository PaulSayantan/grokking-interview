canonical_terms:
  happens-before:
    canonical: happens-before
    defined_in: synchronized-volatile-jmm
    gloss: A partial order over memory actions. An edge X -> Y guarantees Y sees every write X made and may not observe
      a state older than X's. It says nothing about wall-clock order.
    banned_variants:
    - happens before in time
    - executes before
    - runs earlier
    - happens-before in wall-clock time
  data race:
    canonical: data race
    defined_in: synchronized-volatile-jmm
    gloss: Two actions on the same non-final, non-volatile location with no happens-before edge between them, at least one
      of which is a write.
    banned_variants:
    - race condition
  monitor:
    canonical: monitor
    defined_in: synchronized-volatile-jmm
    gloss: 'An object''s intrinsic lock together with the two queues the JVM keeps for it once inflated: the entry list
      of threads blocked trying to enter, and the wait set of threads that called wait().'
    banned_variants:
    - mutex
    - semaphore
    - object lock
  memory barrier:
    canonical: memory barrier
    defined_in: synchronized-volatile-jmm
    gloss: An instruction that forbids the compiler and the CPU from moving certain memory operations across it. It computes
      nothing. StoreLoad additionally drains the core's store buffer. "Fence" is an accepted synonym and is used interchangeably
      in the prose.
    banned_variants:
    - cache flush
  CAS:
    canonical: CAS
    defined_in: synchronized-volatile-jmm
    gloss: 'Compare-and-swap: write a new value to a location only if it still holds the value you expected, and report
      which happened. Compares a value, never a history, which is the ABA gap.'
    banned_variants:
    - atomic swap
    - compare-and-set used as a different operation
  cache line:
    canonical: cache line
    defined_in: synchronized-volatile-jmm
    gloss: The fixed-size block, commonly 64 bytes, that the coherence hardware moves between memory and core caches and
      tracks ownership of. It is the granularity at which invalidation happens.
    banned_variants:
    - cache block
    - word
assumed_prior_knowledge:
- a Java thread is an OS-scheduled unit of execution; multiple threads run concurrently in one JVM process
- the JVM heap is shared across threads and each thread has its own stack
- objects have fields; a reference variable points at an object on the heap
- a CPU has per-core caches and registers, and memory is not read/written by the CPU one variable at a time
- a compiler/JIT may optimize and reorder code as long as single-threaded results are preserved
- 'basic bytecode intuition: a line like `x++` is several operations, not one'
- constructors run once when an object is created; `final`, `static`, and instance fields
- generics and the standard library at usage level (Map, List, AtomicInteger exist)
- exceptions propagate up the stack; try/catch/finally
- the multithreading-concurrency topic (the prior README row) covers thread lifecycle, race/deadlock/livelock/starvation,
  wait/notify, ThreadLocal, and the atomicity/visibility/ordering framing this topic deepens — but it is NOT yet
  a clarity-rewritten topic, so nothing is 'ledger-established' and this topic teaches its own terms fresh
claims_established:
- Every visibility and ordering guarantee in Java reduces to buying a happens-before edge. The eight rules this domain uses
  are split across JLS 17.4.4 (the synchronizes-with cases) and 17.4.5 (the happens-before clauses built on them), and of
  those eight only the monitor lock rule and the volatile rule give an edge between two threads that neither started, joined
  nor interrupted each other — the ordinary case of two workers in a pool. DRF-SC is what a race-free program buys.
- volatile buys visibility, ordering and single-access atomicity (including 64-bit) and never compound atomicity. A volatile
  write costs a StoreLoad fence and a store-buffer drain; a volatile read on x86 costs no barrier instruction, which is
  why the two are not symmetric.
- A monitor gives mutual exclusion plus an unlock -> lock edge covering every plain field written inside. It has exactly
  one acquisition mode, block until owned, so lock-order deadlock can be prevented by a global lock order but never recovered
  from with synchronized alone.
- Atomics are a volatile field plus an indivisible read-modify-write, built on CAS. They give lock-freedom, not wait-freedom.
  Striping (LongAdder) trades an exact snapshot for write scalability, and needs per-cell cache-line padding as well as
  striping to actually scale.
- An object whose fields are all final and whose `this` never escapes its constructor is safe to publish through a data
  race (JLS 17.5 freeze, implemented as a StoreStore before publication). False sharing is a layout problem, not a synchronization
  problem, and adding a lock worsens it.
