assumed_prior_knowledge:
- a Java thread is an OS-scheduled unit of execution; multiple threads run concurrently in one JVM process
- the JVM heap is shared across threads and each thread has its own stack
- objects have fields; a reference variable points at an object on the heap
- a CPU has per-core caches and registers, and memory is not read/written by the CPU one variable at a time
- a compiler/JIT may optimize and reorder code as long as single-threaded results are preserved
- 'basic bytecode intuition: a line like `x++` is several operations, not one'
- constructors run once when an object is created; `final`, `static`, and instance fields
- generics and the standard library at usage level (Map, List, AtomicInteger exist)
- exceptions propagate up the stack; try/catch/finally
- the multithreading-concurrency topic (the prior README row) covers thread lifecycle, race/deadlock/livelock/starvation,
  wait/notify, ThreadLocal, and the atomicity/visibility/ordering framing this topic deepens — but it is NOT yet
  a clarity-rewritten topic, so nothing is 'ledger-established' and this topic teaches its own terms fresh
