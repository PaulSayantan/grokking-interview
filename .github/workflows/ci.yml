name: CI

# Gate every push and PR: content must validate, the web app must type-check
# and build. This is the project's first automated guardrail — the content
# validator previously only ran when someone remembered to.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (save CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate content (MCQ schema + anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate all questions.yaml
        run: python scripts/validate_content.py
      # 28k MCQ `ref:` fields deep-link `## H2` headings. The step above catches a ref
      # that stops resolving; it cannot catch a heading renamed in lockstep with its refs
      # (nothing looks broken) or a heading dropped from a topic nothing referenced. The
      # lock does: additions pass, edits and removals fail. Re-baseline deliberately with
      # `python scripts/validate_content.py --write-lock` and commit topics/.anchors.lock.
      - name: Check the anchors lock (headings MCQ refs depend on)
        run: python scripts/validate_content.py --check-lock
      # The verified-facts ledger makes a known fact regression structurally
      # impossible rather than merely findable. Commit 268a063 silently rewrote a
      # correct "10,000 SCPs per org" to "order of ~1,000" and every gate stayed
      # green; cd08d66 had to repair it. This step fails if a ledgered value
      # disappears from its file, or a known-wrong form comes back.
      - name: Verified-facts ledger
        run: python scripts/rewrite_audit.py --audit-ledger
      # Continuity of the clarity waves: ledger shape, README reading order, and
      # cliffhanger payoff targets. No-ops until a domain has a ledger.
      - name: Continuity check (clarity waves)
        run: python scripts/continuity_check.py

  clarity-report:
    name: Clarity report (non-blocking)
    runs-on: ubuntu-latest
    # Report-only by design. The stylistic metrics are gameable and a
    # false-positive-heavy prose gate gets disabled within a week, so this
    # publishes numbers to the run summary and never fails the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Self-test the detectors against known-good prose
        run: python scripts/clarity_report.py --self-test
      - name: Clarity metrics -> run summary
        run: python scripts/clarity_report.py >> "$GITHUB_STEP_SUMMARY"

  build-web:
    name: Type-check + build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      # The marketing-page denylist. The landing/catalog refresh deleted a broken
      # hero parallax, a sticky card deck, 10 ambient chip animations and an
      # 87-line pointer-tilt script; this greps index.astro/catalog.astro for the
      # constructs that came with them (rotate, perspective(, translateZ,
      # matrix3d, preserve-3d, tilt-pointer, depth-layer, deck-card, scene-3d,
      # fq-chip, stat-card, btn-large, terminal-card) so none creeps back.
      #
      # NOTE: `check:marketing` also runs `git diff --quiet HEAD -- global.css`,
      # which compares the WORKING TREE to HEAD. That is a useful local guard but
      # VACUOUS here — a fresh checkout is always clean — so the byte-freeze is
      # enforced against the base ref in the next step, not by this one.
      - name: Marketing-page guards (denylisted constructs)
        run: npm run check:marketing
      - name: Build (sync content -> astro build -> pagefind -> CSP)
        run: npm run build

  # global.css is shared by the marketing pages, the three learning surfaces and
  # the practice pages, and it holds the design tokens plus the `.prose` reading
  # rules that `study-css.test.ts` and `theme-css.test.ts` freeze by exact string.
  # The redesigns were built to leave it byte-identical for exactly that reason.
  # Changing it is allowed — it just must be a DELIBERATE, reviewed act rather
  # than a side effect, so this job fails the PR and makes you say so out loud.
  global-css-freeze:
    name: global.css byte-freeze (advisory on PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone cannot see the base ref, so the diff below
          # would compare against nothing and pass vacuously.
          fetch-depth: 0
      - name: Diff web/src/styles/global.css against the base ref
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --quiet "$base"...HEAD -- web/src/styles/global.css; then
            echo "global.css is unchanged against $base."
          else
            echo "::warning::global.css changed against $base. That file is shared"
            echo "::warning::by every route and its .prose rules are asserted by exact"
            echo "::warning::string in study-css.test.ts / theme-css.test.ts. Confirm the"
            echo "::warning::change is intended and that both frozen suites still pass."
            git diff --stat "$base"...HEAD -- web/src/styles/global.css
          fi
