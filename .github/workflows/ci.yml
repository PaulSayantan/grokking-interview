name: CI

# Gate every push and PR: content must validate, the web app must type-check
# and build. This is the project's first automated guardrail — the content
# validator previously only ran when someone remembered to.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (save CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate content (MCQ schema + anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate all questions.yaml
        run: python scripts/validate_content.py

  build-web:
    name: Type-check + build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Build (sync content -> astro build -> pagefind -> CSP)
        run: npm run build
