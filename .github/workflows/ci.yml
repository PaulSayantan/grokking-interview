name: CI

# Gate every push and PR: content must validate, the web app must type-check
# and build. This is the project's first automated guardrail — the content
# validator previously only ran when someone remembered to.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (save CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-content:
    name: Validate content (MCQ schema + anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate all questions.yaml
        run: python scripts/validate_content.py
      # 28k MCQ `ref:` fields deep-link `## H2` headings. The step above catches a ref
      # that stops resolving; it cannot catch a heading renamed in lockstep with its refs
      # (nothing looks broken) or a heading dropped from a topic nothing referenced. The
      # lock does: additions pass, edits and removals fail. Re-baseline deliberately with
      # `python scripts/validate_content.py --write-lock` and commit topics/.anchors.lock.
      - name: Check the anchors lock (headings MCQ refs depend on)
        run: python scripts/validate_content.py --check-lock

  build-web:
    name: Type-check + build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (sync content -> astro build -> pagefind -> CSP)
        run: npm run build
