# Netlify build config. The repo root is the interview-prep monorepo; the web app
# lives in web/, so `base = "web"` scopes the build there. `npm run build` runs the
# content sync then `astro build`, emitting a static site to web/dist.
[build]
  base = "web"
  command = "npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# --- Security headers --------------------------------------------------------

# Transport/host-level headers CSP-in-<meta> can't set. The Content-Security-Policy
# itself is emitted per-page as a <meta http-equiv> by Astro's hash-based CSP (see
# astro.config.mjs) so it stays in sync with the inline scripts automatically.
# NOTE: keep these in sync with public/vercel.json.
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years incl. subdomains; eligible for the preload list.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Belt-and-braces with the CSP frame-ancestors 'none' — block framing/clickjacking.
    X-Frame-Options = "DENY"
    # Stop MIME-sniffing (e.g. a .json being reinterpreted as HTML/JS).
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs/paths to third parties on outbound navigation.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny access to powerful browser features the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()"
    # Isolate the browsing context (defense-in-depth against cross-origin leaks).
    Cross-Origin-Opener-Policy = "same-origin"
    # This site serves no cross-origin embeds; keep resources same-origin by default.
    Cross-Origin-Resource-Policy = "same-origin"

# --- Cache headers -----------------------------------------------------------

# Hashed assets (/_astro/*) are content-addressed and never change — cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Question pool JSON is regenerated on each build; serve fresh but allow CDN caching.
[[headers]]
  for = "/questions/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800"

# Vercel note: static output in dist/ is served as-is by any static host. For Vercel,
# set Root Directory = "web", Build Command = "npm run build", Output Directory = "dist".
