# Netlify build config. MUST live at the REPOSITORY ROOT — Netlify only looks for
# netlify.toml there. (It previously sat in web/, where it was silently ignored,
# taking every header block below with it.)
#
# The web app lives in web/, so `base = "web"` scopes the build there. Note that
# `publish` is resolved RELATIVE TO `base`, so it is "dist" and not "web/dist" —
# the latter would resolve to web/web/dist.
#
# The CI workflow (.github/workflows/deploy.yml) builds and deploys the directory
# itself after the gates pass, so `command`/`publish` matter only if someone also
# connects Netlify's native Git integration. The [[headers]] blocks below apply
# either way.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- Security headers --------------------------------------------------------

# Transport/host-level security headers. The Content-Security-Policy itself is NOT
# set here: the post-build step scripts/gen-csp-headers.mjs computes SHA-256 hashes
# of the built inline scripts and writes the CSP as a real response header into
# dist/_headers (Netlify merges it with the headers below). See that script.
# NOTE: keep these in sync with public/vercel.json.
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years incl. subdomains; eligible for the preload list.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Belt-and-braces with the CSP frame-ancestors 'none' — block framing/clickjacking.
    X-Frame-Options = "DENY"
    # Stop MIME-sniffing (e.g. a .json being reinterpreted as HTML/JS).
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs/paths to third parties on outbound navigation.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Deny access to powerful browser features the site never uses.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()"
    # Isolate the browsing context (defense-in-depth against cross-origin leaks).
    Cross-Origin-Opener-Policy = "same-origin"
    # This site serves no cross-origin embeds; keep resources same-origin by default.
    Cross-Origin-Resource-Policy = "same-origin"

# --- Cache headers -----------------------------------------------------------

# Hashed assets (/_astro/*) are content-addressed and never change — cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Question pool JSON is regenerated on each build; serve fresh but allow CDN caching.
[[headers]]
  for = "/questions/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800"

# Vercel note: static output in dist/ is served as-is by any static host. For Vercel,
# set Root Directory = "web", Build Command = "npm run build", Output Directory = "dist".
